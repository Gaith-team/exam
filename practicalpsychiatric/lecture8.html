<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:       #7c3aed;
  --accent-light: #8b5cf6;
  --accent-dark:  #6d28d9;
  --accent-glow:  rgba(124,58,237,0.2);
  --bg:      #f8fafc;
  --bg2:     #eef2f7;
  --card:    #ffffff;
  --text:    #1a2332;
  --text2:   #4a5568;
  --text3:   #718096;
  --bc:      rgba(0,0,0,0.07);
  --success: #16a34a;
  --danger:  #dc2626;
  --warn:    #6d28d9;
  --r:       16px;
  --tr:      all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:   #0d1117; --bg2: #161b22; --card: #1c2333;
  --text: #e6edf3; --text2: #b1bac4; --text3: #7d8590;
  --bc:   rgba(255,255,255,0.08);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

/* PROGRESS TOP */
#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width .2s;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(248,250,252,.93); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bc); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(13,17,23,.95); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent-glow); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 900;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.shuffle-btn {
  border: 1px solid var(--bc);
  background: var(--bg2);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s ease;
  font-family: inherit;
}
.shuffle-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.theme-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

/* HERO BAND */
.hero-band {
  margin-top: 64px;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-light));
  padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden;
}
.hero-band::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band-icon {
  width: 68px; height: 68px; border-radius: 20px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px; border: 1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size: clamp(20px,4vw,30px); font-weight: 900; color: #fff; margin-bottom: 6px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.8); }
.hero-band-meta {
  display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  flex-wrap: wrap;
}
.meta-pill {
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 50px;
  padding: 6px 16px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}

/* EXAM SHELL */
.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center;
}
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--accent); }

/* PROGRESS STRIP */
.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 8px; transition: width .4s;
}
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text);
  gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(217,119,6,.3); background: rgba(217,119,6,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* QUESTION CARD */
.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  transition: box-shadow .3s;
}
.q-header {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  padding: 4px 18px 4px;
  display: flex; align-items: center; gap: 8px;
}
.q-num {
  background: rgba(255,255,255,.2); border-radius: 8px;
  padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff;
}
.q-text {
  padding: 22px 18px 14px; font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.65; border-bottom: 1px solid var(--bc);
  text-align: left; direction: ltr;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

/* OPTION */
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--bc); background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none;
  direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); background: var(--accent-glow);
  transform: translateX(3px);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3);
  transition: var(--tr);
}
.opt.correct {
  border-color: var(--success); background: rgba(22,163,74,.08);
}
.opt.correct .opt-letter {
  background: var(--success); color: #fff; border-color: var(--success);
}
.opt.wrong {
  border-color: var(--danger); background: rgba(220,38,38,.07);
}
.opt.wrong .opt-letter {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
.opt.disabled { pointer-events: none; }

/* FEEDBACK */
.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(22,163,74,.1); color: var(--success); border: 1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background: rgba(220,38,38,.08); color: var(--danger); border: 1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size: 20px; }

/* EXPLANATION */
.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06);
  border-radius: 10px; border-right: 3px solid var(--accent);
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none;
}

/* NAV BTNS */
.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-skip {
  background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px;
}
.btn-skip:hover { border-color: var(--warn); color: var(--warn); }

/* ===== RESULTS ===== */
.result-hero {
  text-align: center; padding: 36px 20px 28px;
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; border: 5px solid var(--bg2);
  position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
}
.rs { background: var(--bg2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

/* REPORT ITEMS */
.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 14px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.report-item .ri-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; margin-top: 5px; color: var(--text2);
}
.ri-badge {
  padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; flex-shrink: 0;
}
.ri-yours { background: rgba(220,38,38,.1); color: var(--danger); }
.ri-right { background: rgba(22,163,74,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

/* FOOTER */
footer {
  background: var(--bg2); border-top: 1px solid var(--bc);
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>

<nav>

</div>

<footer>

<script>
const QUESTIONS = [
 {t:"Psychiatric excitement is best defined as:",o:["A state of excessive psychomotor activity, impulsive or aggressive behaviors often accompanied by autonomic hyperactivity","A state of complete withdrawal and mutism","A chronic degenerative brain condition","A sleep-related parasomnia"],a:0},
  {t:"Psychiatric excitement is considered:",o:["A rare psychiatric condition","A minor behavioral issue","The most common psychiatric emergency","A self-limiting condition requiring no intervention"],a:2},
  {t:"Which of the following is NOT a medical cause of excitement?",o:["Liver dysfunction","Electrolyte imbalance","Borderline personality disorder","Hypoglycemia"],a:2},
  {t:"All of the following are CNS causes of excitement EXCEPT:",o:["Frontal lobe dysfunction","Pulmonary failure","Epilepsy","Head injuries"],a:1},
  {t:"Which metabolic disorder is listed as a cause of excitement?",o:["Hyperthyroidism","Diabetes insipidus","Porphyria","Cushing syndrome"],a:2},
  {t:"A patient with acute severe mania presenting with extreme disruption is categorized under which psychiatric cause of excitement?",o:["Psychotic disorders","Personality disorders","Mood disorders","Dissociative disorders"],a:2},
  {t:"Intermittent explosive disorder is classified under:",o:["Psychotic disorders","Disorders of impulse control","Dissociative disorders","Mood disorders"],a:1},
  {t:"Which of the following is a CNS stimulant that can cause excitement through intoxication?",o:["Amphetamines","Benzodiazepines","Barbiturates","Alcohol"],a:0},
  {t:"Malingering is best described as:",o:["An unconscious production of physical symptoms","A genuine reaction to frustration","The intentional production of false or exaggerated symptoms motivated by external incentives","A dissociative response to trauma"],a:2},
  {t:"Which of the following is a VERBAL clue of excitement?",o:["Pacing","Jaw tightening","Loud voice with pressure of speech","Increased respiration"],a:2},
  {t:"Which of the following is a NONVERBAL motor clue of excitement?",o:["Verbal threats","Colorful language","Evidence of bizarre delusions","Inability to sit still (restlessness)"],a:3},
  {t:"Affect liability in an excited patient refers to:",o:["Complete absence of emotional expression","Rapid changes in emotional feeling","Persistent euphoria only","Stable and predictable mood"],a:1},
  {t:"Which of the following is a clue related to the level of consciousness in an excited patient?",o:["Loud voice","Pacing","Disorientation","Jaw tightening"],a:2},
  {t:"Flight of ideas is a characteristic seen specifically in:",o:["All excited patients","Manic patients only","Patients with dementia","Patients with personality disorders"],a:1},
  {t:"How many team members are required at minimum for physical restraint?",o:["2","3","4","6"],a:2},
  {t:"Mechanical restraint should be used as:",o:["The first-line intervention","A form of punishment","A routine nursing procedure","A last step and never as a punishment"],a:3},
  {t:"During physical restraint, the leader should:",o:["Shout commands loudly","Talk in a calm manner and give direction","Show anger to assert authority","Avoid all verbal communication entirely"],a:1},
  {t:"Chemical restraint for excitement involves the use of:",o:["Major tranquilizers IM such as chlorpromazine or haloperidol","Oral antidepressants only","IV antibiotics","Topical sedatives"],a:0},
  {t:"When dealing with an excited patient, the nurse should ask:",o:["Only yes-or-no questions","Open-ended philosophical questions","Direct and concise questions","No questions at all"],a:2},
  {t:"Environmental stimuli for an excited patient should be:",o:["Maximized to keep the patient engaged","Kept to the minimum","Alternated rapidly","Increased with music and bright lights"],a:1},
  {t:"If an excited patient has severe dehydration, the appropriate intervention is:",o:["Oral rehydration only","Restricting all fluids","IV fluids","Waiting for spontaneous recovery"],a:2},
  {t:"Violent behavior in an excited patient should be redirected with:",o:["Immediate sedation only","Isolation in a dark room","Physical outlets such as exercise and outdoor activity","Verbal confrontation"],a:2},
  {t:"Nurses should approach an excited patient with:",o:["An unfolded blanket held in their arms","A syringe visibly in hand","Multiple staff shouting instructions","A restraining device already applied"],a:0},
  {t:"In dissociative disorders, the excitement usually:",o:["Has no purpose whatsoever","Has an unconscious goal","Is always violent","Is caused by drug intoxication"],a:1},
  {t:"Which personality disorder is associated with excitement?",o:["Obsessive-compulsive personality disorder","Schizoid personality disorder","Dependent personality disorder","Antisocial personality disorder"],a:3},
  {t:"Benzodiazepines, barbiturates, and alcohol are classified as:",o:["CNS stimulants","Hallucinogens","Opiates and CNS depressants","Antidepressants"],a:2},
  {t:"A characteristic of the excited patient is that he/she:",o:["Sleeps excessively and refuses to move","Has no time to sleep, listen, eat, or drink","Speaks very slowly and quietly","Prefers to wear heavy, restrictive clothing"],a:1},
  {t:"Which of the following is NOT a behavior of an excited patient?",o:["Excessive movement with impulsive actions","Limited attention span","Prolonged periods of calm and silence","Hyperactivity and irritability"],a:2},
  {t:"The first general guideline when dealing with an excited patient is to:",o:["Administer IM haloperidol immediately","Apply mechanical restraints","Call security","Untie the patient if tied up"],a:3},
  {t:"During the restraint procedure, nurses should:",o:["Remind the patient of past violent episodes","Avoid verbal comments except to explain the procedure in a matter-of-fact way","Argue with the patient about the need for restraint","Leave the patient alone until calm"],a:1},
  {t:"In the therapeutic environment for a secluded excited patient, the room should have:",o:["Maximum furniture for comfort","Minimum furniture","Bright colorful decorations","Multiple patients for socialization"],a:1},
  {t:"Protection of the excited patient includes all EXCEPT:",o:["Protecting from self-injury","Protecting from comments of other patients","Allowing the patient to keep glasses and sharp objects","Maintaining a safe environment"],a:2},
  {t:"Regarding group relations for an excited patient, the nurse should:",o:["Immediately include the patient in group therapy","Encourage large group activities","Force the patient to socialize","Avoid group relations if the patient is currently excited"],a:3},
  {t:"Which of the following is an example of a non-medical, non-psychiatric cause of excitement?",o:["Hypoglycemia","Schizophrenia","Reaction to frustration","Cocaine intoxication"],a:2},
  {t:"ECT is listed as a treatment option for excitement. It is typically considered when:",o:["The patient is mildly anxious","The patient responds well to oral medication","The patient is in the early stages of mania","Other treatments have failed or the situation is life-threatening"],a:3},
  {t:"Psychiatric excitement is the most common psychiatric emergency.",o:["True","False"],a:0},
  {t:"Mechanical restraint should be used as a form of punishment for violent behavior.",o:["True","False"],a:1},
  {t:"Physical restraint requires at least 4 team members and a leader who gives direction.",o:["True","False"],a:0},
  {t:"A manic episode is not considered a psychiatric cause of excitement.",o:["True","False"],a:1},
  {t:"Hypoglycemia is a metabolic disorder that can cause excitement.",o:["True","False"],a:0},
  {t:"Group therapy is strongly recommended during the acute phase of excitement.",o:["True","False"],a:1},
  {t:"Verbal threats toward real or imagined objectives are considered nonverbal clues of excitement.",o:["True","False"],a:1},
  {t:"Malingering is motivated by external incentives such as avoiding military duty or obtaining financial compensation.",o:["True","False"],a:0},
  {t:"Flight of ideas is a characteristic seen in all excited patients regardless of diagnosis.",o:["True","False"],a:1},
  {t:"IV fluids should be administered if an excited patient has severe dehydration.",o:["True","False"],a:0},
  {t:"The room for a secluded excited patient should contain maximum furniture for the patient's comfort.",o:["True","False"],a:1},
  {t:"Mechanical restraint is the first step in the management of an excited patient.",o:["True","False"],a:1},
  {t:"Cocaine is classified as a CNS stimulant that can cause excitement through intoxication.",o:["True","False"],a:0},
  {t:"During the restraint procedure, nurses should show anger and annoyance to establish authority.",o:["True","False"],a:1},
  {t:"Psychiatric excitement poses significant risks only to the patient and not to others.",o:["True","False"],a:1},
  {t:"A 28-year-old male is brought to the emergency department by police. He is pacing rapidly, speaking loudly with pressure of speech, claims he is the president of the world, and has not slept for 4 days. He is wearing colorful, mismatched clothing and refuses to sit down. What is the MOST likely diagnosis?",o:["Major depressive episode","Manic episode","Dissociative fugue","Intermittent explosive disorder"],a:1},
  {t:"A 22-year-old female is brought to the psychiatric unit after being found agitated and aggressive at a party. She has dilated pupils, tachycardia, and is extremely hyperactive. Her friends report she took 'some pills' earlier. Urine toxicology is positive for amphetamines. The cause of her excitement is best classified as:",o:["Psychiatric – psychotic disorder","Medical – CNS infection","Drug intoxication – CNS stimulant","Non-medical – reaction to frustration"],a:2},
  {t:"A 65-year-old male with a history of diabetes is found confused, agitated, and aggressive in the nursing home. His blood glucose level is 35 mg/dL. After IV dextrose administration, his agitation resolves completely. The cause of his excitement was:",o:["Schizophrenia","Hypoglycemia (metabolic disorder)","Alcohol withdrawal","Borderline personality disorder"],a:1},
  {t:"An excited patient on the psychiatric ward is becoming increasingly violent despite verbal de-escalation attempts. The team decides to apply physical restraints. Which of the following actions is CORRECT during this procedure?",o:["The nurse reminds the patient of his previous violent outbursts","Only 2 staff members are needed to hold the patient","The leader talks in a calm manner and gives clear directions","The nurse shows visible anger to intimidate the patient"],a:2},
  {t:"A 35-year-old male with schizophrenia is admitted in a state of acute excitement. He is hallucinating, pacing, and threatening other patients. The nurse is planning the therapeutic environment. Which intervention is MOST appropriate?",o:["Place the patient in a large ward with many patients for socialization","Provide a single, calm, safe room with minimum furniture","Keep bright lights on and play loud music to distract the patient","Allow the patient to keep personal sharp objects for comfort"],a:1},

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 40*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuestions() {
  if (!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟')) return;
  init(QUESTIONS);
}

function init(pool) {
  questions = shuffle([...pool]);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

/* TIMER */
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

/* TOP UI */
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

/* RENDER QUESTION */
function render() {
  updateTop();
  const q = questions[i];
  // Randomize answer choices while keeping the original correct-answer index
  const order = shuffle(q.o.map((_, idx) => idx));
  q._displayOrder = order;
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${order.map((originalIdx, displayIdx) => `
          <div class="opt" id="opt${originalIdx}" onclick="choose(${originalIdx})">
            <div class="opt-letter">${LETTERS[displayIdx] || displayIdx + 1}</div>
            <div class="opt-text">${q.o[originalIdx]}</div>
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

/* CHOOSE */
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🥳</span> <span>ما شاء الله عليك 🎉</span>`
    : `<span class="feedback-icon">😢</span> <span>ركز ونحاول فيها تاني</span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

/* SKIP */
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

/* NEXT */
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

/* FINISH */
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--accent)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})

</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button>
      <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> 

رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* RETRY WRONG */
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* THEME */
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

/* START */
init(QUESTIONS);
</script>
