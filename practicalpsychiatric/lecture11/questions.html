<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c3aed;--accent-light:#8b5cf6;--accent-dark:#6d28d9;--accent-glow:rgba(124,58,237,.2);--bg:#f8fafc;--bg2:#eef2f7;--card:#fff;--text:#1a2332;--text2:#4a5568;--text3:#718096;--bc:rgba(0,0,0,.07);--success:#16a34a;--danger:#dc2626;--warn:#6d28d9;--r:16px;--tr:all .3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.08)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#prog-bar{position:fixed;top:0;left:0;height:3px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--accent-light));transition:width .2s}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(248,250,252,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(13,17,23,.95)}
.nav-back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.nav-back:hover{color:var(--accent);transform:translateX(3px)}
.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.nav-logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.nav-right{display:flex;align-items:center;gap:8px}
.shuffle-btn{border:1px solid var(--bc);background:var(--bg2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.shuffle-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero-band{margin-top:64px;background:linear-gradient(135deg,var(--accent-dark),var(--accent),var(--accent-light));padding:40px 24px 36px;text-align:center}
.hero-band-icon{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.35)}
.hero-band h1{font-size:clamp(20px,4vw,30px);font-weight:900;color:#fff;margin-bottom:6px}
.hero-band p{font-size:13px;color:rgba(255,255,255,.8)}
.hero-band-meta{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.meta-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 16px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.shell{max-width:560px;margin:0 auto;padding:24px 20px 80px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat-box .val{font-size:20px;font-weight:900}.stat-box .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat-correct{color:var(--success)}.stat-wrong{color:var(--danger)}.stat-remain{color:var(--accent)}
.prog-strip{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.prog-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.prog-track{flex:1;height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}
.prog-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:8px;transition:width .4s}
.timer-badge{min-width:64px;height:36px;border-radius:18px;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;gap:5px;padding:0 12px;flex-shrink:0}
.timer-badge.warn{color:var(--warn)}.timer-badge.danger{color:var(--danger);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.q-card{background:var(--card);border:1px solid var(--bc);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.q-header{background:linear-gradient(135deg,var(--accent-dark),var(--accent));padding:4px 18px;display:flex;align-items:center;gap:8px}
.q-num{background:rgba(255,255,255,.2);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff}
.q-text{padding:22px 18px 14px;font-size:15px;font-weight:700;line-height:1.65;border-bottom:1px solid var(--bc);text-align:left;direction:ltr}
.options{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;transition:var(--tr);user-select:none;direction:ltr;text-align:left}
.opt:hover:not(.disabled){border-color:var(--accent);background:var(--accent-glow);transform:translateX(3px)}
.opt-letter{width:28px;height:28px;border-radius:8px;flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--text3)}
.opt.correct{border-color:var(--success);background:rgba(22,163,74,.08)}.opt.correct .opt-letter{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:rgba(220,38,38,.07)}.opt.wrong .opt-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.disabled{pointer-events:none}
.feedback-bar{margin:14px 18px;padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.feedback-bar.ok{background:rgba(22,163,74,.1);color:var(--success);border:1px solid rgba(22,163,74,.25)}
.feedback-bar.no{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2)}
.explanation{margin:0 18px 14px;padding:12px 14px;background:var(--bg2);border-radius:10px;border-right:3px solid var(--accent);font-size:13px;color:var(--text2);line-height:1.6}
.nav-btns{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Outfit',sans-serif;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:7px}
.btn-next{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff}
.btn-skip{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:20px;border:1px solid var(--bc);margin-bottom:20px}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:5px solid var(--bg2);position:relative}
.score-ring svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:5;stroke-linecap:round}.ring-bg{stroke:var(--bg2)}.ring-fill{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:900}.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:900;margin-bottom:6px}.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:10px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:16px;margin-bottom:10px;border-left:4px solid var(--bc);direction:ltr}
.report-item.ok{border-left-color:var(--success)}.report-item.no{border-left-color:var(--danger)}
.ri-q{font-size:13px;font-weight:700;margin-bottom:8px}.ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:6px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.1);color:var(--danger)}.ri-right{background:rgba(22,163,74,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}
.footer-tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}}
</style></head><body>

<nav>

<div class="hero-band"><div class="hero-band-icon">🧠</div><h1>Anti-psychotic Drugs</h1><p>Psychiatric Nursing</p>
<div class="hero-band-meta"><div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div><div class="meta-pill"><i class="fa-solid fa-clock"></i> 60 Min</div><div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div></div></div>
<div class="shell">
<div class="stats-row"><div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div><div class="stat-box"><div class="val stat-wrong" id="sWrong">0</div><div class="lbl">✖ خطأ</div></div><div class="stat-box"><div class="val stat-remain" id="sRemain">--%</div><div class="lbl">⏳ متبقي</div></div></div>
<div class="prog-strip"><div class="prog-label" id="progLabel">سؤال ١</div><div class="prog-track"><div class="prog-fill" id="progFill"></div></div><div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">60:00</span></div></div>
<div id="app"></div></div>
<footer><div class="footer-brand">GHAITH <span>TEAM</span></div><a href="https://t.me/nursing2bu" target="_blank" class="footer-tg"><i class="fa-brands fa-telegram"></i> @nursing2bu</a></footer>
<script>
const QUESTIONS = [
{t:"Which drug was the first antipsychotic, introduced in 1951?",o:["Haloperidol", "Chlorpromazine", "Clozapine", "Risperidone"],a:1},
{t:"Antipsychotics were originally known as:",o:["Minor tranquilizers", "Mood stabilizers", "Antidepressants", "Major tranquilizers"],a:3},
{t:"The basic unit of the nervous system is the:",o:["Neuron", "Synapse", "Axon", "Dendrite"],a:0},
{t:"Which part of the neuron receives information and transmits it to the cell body?",o:["Axon", "Myelin sheath", "Dendrites", "Synaptic gap"],a:2},
{t:"The space where the electrical signal becomes a chemical signal is the:",o:["Dendrite", "Node of Ranvier", "Synaptic gap", "Cell body"],a:2},
{t:"Which neurotransmitter is correlated with pleasure, movement, attention and learning?",o:["Dopamine", "Serotonin", "Epinephrine", "Histamine"],a:0},
{t:"Increased dopamine activity is associated with:",o:["Depression", "Obsessive-compulsive disorder", "Dementia", "Schizophrenia"],a:3},
{t:"Decreased serotonin is associated with:",o:["Schizophrenia", "Depression and some anxiety disorders", "Mania", "Psychosis"],a:1},
{t:"Antipsychotic drugs reduce psychosis mainly by blocking dopamine receptors in the:",o:["Post-synaptic membrane", "Pre-synaptic vesicles", "Dendrites", "Myelin sheath"],a:0},
{t:"Atypical (second-generation) antipsychotics work by:",o:["Only blocking dopamine receptors", "Strongly blocking dopamine and mildly blocking serotonin", "Strongly blocking serotonin and mildly blocking dopamine receptors", "Blocking acetylcholine receptors"],a:2},
{t:"Which of the following is an atypical antipsychotic?",o:["Haloperidol", "Quetiapine", "Chlorpromazine", "Fluphenazine"],a:1},
{t:"The trade name of Chlorpromazine is:",o:["Mellaril", "Stelazine", "Navane", "Thorazine"],a:3},
{t:"Antipsychotics are more effective in treating:",o:["Negative symptoms than positive symptoms", "Both equally", "Neither positive nor negative symptoms", "Positive symptoms than negative symptoms"],a:3},
{t:"Which is an advantage of atypical over typical antipsychotics?",o:["Higher risk of EPSEs", "Increased effectiveness in treating negative symptoms", "Elevation of prolactin", "Not effective in resistant patients"],a:1},
{t:"Which antipsychotic reduces overall mortality in schizophrenia by reducing suicide?",o:["Clozapine", "Olanzapine", "Aripiprazole", "Ziprasidone"],a:0},
{t:"Clozapine is prescribed only:",o:["As first-line therapy", "For mild anxiety", "After two different antipsychotics have failed to control symptoms", "During pregnancy"],a:2},
{t:"Full blood count for patients on clozapine is done weekly for:",o:["4 weeks", "18 weeks", "12 weeks", "1 year"],a:1},
{t:"Depot antipsychotic injections release the drug slowly over:",o:["1-4 weeks", "1 day", "3 months", "6 months"],a:0},
{t:"Haldol depot injection is given every:",o:["Week", "2 weeks", "6 months", "4 weeks"],a:3},
{t:"Risperidone (Risperdal Consta) depot injection is given every:",o:["4 weeks", "Day", "2 weeks", "6 months"],a:2},
{t:"Taking antacids with antipsychotics leads to:",o:["Decreased absorption of the antipsychotic", "Increased CNS depression", "Increased absorption", "Profound hypotension"],a:0},
{t:"Acute dystonia usually occurs within:",o:["5-30 days", "6 months", "1 year", "48 hours after beginning treatment"],a:3},
{t:"Drug-induced parkinsonism usually begins:",o:["Within 48 hours", "After 6 months or more", "5-30 days after treatment", "After 1 year"],a:2},
{t:"Which EPSE is characterized by shuffling gait, mask-like face and tremors?",o:["Dystonia", "Pseudoparkinsonism", "Akathisia", "Tardive dyskinesia"],a:1},
{t:"Subjective motor restlessness with inner tension describes:",o:["Dystonia", "Pisa syndrome", "Akathisia", "Tardive dyskinesia"],a:2},
{t:"Acute dystonia can be treated with:",o:["Diphenhydramine or Benztropine", "Vitamin E", "Antacids", "Clozapine"],a:0},
{t:"Nursing management of tardive dyskinesia includes:",o:["Amantadine and Artane", "Vitamin E and Inderal (beta blocker)", "Antacids", "Cooling the body"],a:1},
{t:"In NMS, the temperature may rise up to:",o:["100 F", "102 F", "98 F", "108 F (42 C)"],a:3},
{t:"A typical laboratory finding in NMS is creatine phosphokinase level:",o:["Below 500", "Above 3000", "Below 100", "Normal"],a:1},
{t:"After NMS resolves completely, antipsychotics should not be reinstituted for at least:",o:["24 hours", "1 week", "2 weeks", "6 months"],a:2},
{t:"Agranulocytosis is diagnosed when the absolute neutrophil count (ANC) is:",o:["Less than 1500/mm3", "More than 3000/mm3", "More than 5000/mm3", "Less than 500/mm3"],a:3},
{t:"Which of the following is an anticholinergic effect?",o:["Dry mouth", "Galactorrhoea", "Photosensitivity", "Hyperthermia"],a:0},
{t:"Which of the following is an endocrine side effect?",o:["Constipation", "Blurred vision", "Galactorrhoea", "Urinary hesitation"],a:2},
{t:"To prevent orthostatic hypotension, the client should sit on the side of the bed for:",o:["10 seconds", "30 seconds", "5 minutes", "1 full minute"],a:3},
{t:"Why should antipsychotics be tapered off gradually?",o:["To minimize withdrawal symptoms and rebound effects", "To increase prolactin", "To prevent photosensitivity", "To increase drug absorption"],a:0},
{t:"Chlorpromazine, the first antipsychotic, was introduced in 1951.",o:["True", "False"],a:1},
{t:"Typical antipsychotics are more effective on negative symptoms than on positive symptoms.",o:["True", "False"],a:0},
{t:"Atypical antipsychotics strongly block serotonin receptors.",o:["True", "False"],a:1},
{t:"Clozapine does not require regular hematological monitoring.",o:["True", "False"],a:0},
{t:"Antipsychotics are encouraged during the first trimester of pregnancy.",o:["True", "False"],a:0},
{t:"Tardive dyskinesia is often irreversible.",o:["True", "False"],a:1},
{t:"Acute dystonia can be life threatening if not treated immediately.",o:["True", "False"],a:1},
{t:"Antacids increase the absorption of antipsychotic drugs.",o:["True", "False"],a:0},
{t:"Early EPSEs are reversible.",o:["True", "False"],a:1},
{t:"Neuroleptic malignant syndrome is a common and mild side effect.",o:["True", "False"],a:0},
{t:"Antipsychotics should be stopped suddenly when side effects appear.",o:["True", "False"],a:0},
{t:"Alcohol is safe to drink while taking antipsychotics.",o:["True", "False"],a:0},
{t:"Clients should use sunscreen and wear protective clothes to prevent sunburn.",o:["True", "False"],a:1},
{t:"Atypical antipsychotics are associated with prolactin elevation.",o:["True", "False"],a:0},
{t:"Haldol depot injection is given every 4 weeks.",o:["True", "False"],a:1},
{t:"Case: A patient started haloperidol yesterday. He now has a twisted neck, eyes rolled upward and tongue protruding. What is the most likely diagnosis?",o:["Tardive dyskinesia", "Akathisia", "Acute dystonia", "Agranulocytosis"],a:2},
{t:"Case: A patient on clozapine develops sore throat, fever and mouth sores. ANC is 400/mm3. What is the nurse's main concern?",o:["Agranulocytosis", "Orthostatic hypotension", "Pisa syndrome", "Photosensitivity"],a:0},
{t:"Case: A patient on haloperidol for 3 weeks shows shuffling gait, mask-like face and hand tremors. Which medication is appropriate?",o:["Clozapine", "Antacids", "Vitamin E", "Benztropine (Cogentin)"],a:3},
{t:"Case: A patient on an antipsychotic cannot sit still, paces the floor and says he feels inner tension. Which intervention is appropriate?",o:["Give an antacid", "Inform the physician; the dose may be decreased or the drug changed", "Cool the body with fluids", "Advise sun protection"],a:1},
{t:"Case: After 8 months of fluphenazine, a patient shows lip smacking and tongue rolling. Which statement is correct?",o:["This is acute dystonia that appears in 48 hours", "This is NMS that needs a cooling bath", "This is tardive dyskinesia and is often irreversible", "This is an anticholinergic effect"],a:2},
{t:"Case: A patient on antipsychotics has temperature 41 C, muscle rigidity, tachycardia, diaphoresis and altered consciousness. What is the priority action?",o:["Increase the antipsychotic dose", "Give an antacid", "Encourage outdoor activity", "Transfer to a medical unit and cool the body"],a:3},
{t:"Case: A patient on an antipsychotic feels dizzy and his blood pressure drops when he stands quickly. What should the nurse teach?",o:["Rise slowly and sit on the bed edge for one minute first", "Stand quickly to adjust", "Take the drug with antacids", "Avoid fluids"],a:0},
{t:"Case: A female patient on an antipsychotic reports amenorrhoea and galactorrhoea and is worried. What is the best nursing response?",o:["Stop the drug yourself", "Reassure her and report so the dose or drug can be changed", "Tell her it is NMS", "Give vitamin E"],a:1},
{t:"Case: A patient on olanzapine gains weight and has high blood sugar. What should the nurse advise?",o:["Stop the drug suddenly", "Avoid all fluids", "Take extra doses", "A healthy lifestyle with a balanced diet and regular exercise"],a:3},
{t:"Case: A patient feels better and wants to stop the drug suddenly. He also takes antacids for heartburn. What is the best teaching?",o:["Stop suddenly and continue antacids", "Take antacids with each dose", "Do not stop suddenly because it must be tapered, and antacids decrease the drug absorption", "Double the dose instead of stopping"],a:2},
];
let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=60*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function randomizeQuestions(){if(!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟'))return;init(QUESTIONS)}
function init(pool){questions=shuffle([...pool]);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;document.getElementById('totalBadge').textContent=questions.length+' سؤال';startTimer();render()}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;const b=document.getElementById('timerBadge');if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';if(timeLeft<=0){clearInterval(timerInterval);finish()}},1000)}
function updateTop(){const t=questions.length;document.getElementById('sCorrect').textContent=correct;document.getElementById('sWrong').textContent=wrong;document.getElementById('sRemain').textContent=Math.round(((t-answered)/t)*100)+'%';document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+t;document.getElementById('progFill').style.width=((i+1)/t*100)+'%';document.getElementById('prog-bar').style.width=((i+1)/t*100)+'%'}
function render(){updateTop();const q=questions[i];const tf=q.o.length===2&&q.o[0]==='True';const order=tf?[0,1]:shuffle(q.o.map((_,x)=>x));
document.getElementById('app').innerHTML=`<div class="q-card"><div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div><div class="q-text">${q.t}</div><div class="options">${order.map((oi,d)=>`<div class="opt" id="opt${oi}" onclick="choose(${oi})"><div class="opt-letter">${LETTERS[d]}</div><div class="opt-text">${q.o[oi]}</div></div>`).join('')}</div><div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div></div>`}
function choose(v){if(answers[i]!==null)return;answers[i]=v;answered++;const q=questions[i];const ok=v===q.a;ok?correct++:wrong++;updateTop();
q.o.forEach((_,x)=>{const el=document.getElementById('opt'+x);el.classList.add('disabled');if(x===q.a)el.classList.add('correct');else if(x===v)el.classList.add('wrong')});
const fb=document.createElement('div');fb.className='feedback-bar '+(ok?'ok':'no');fb.innerHTML=ok?'<span>🥳</span> <span>ما شاء الله عليك 🎉</span>':'<span>😢</span> <span>ركز ونحاول فيها تاني</span>';
const card=document.querySelector('.q-card');card.querySelector('.options').after(fb);
if(q.exp){const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(e)}
card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'<i class="fa-solid fa-arrow-left"></i> السؤال التالي':'<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}</button>`}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrong++;updateTop()}next()}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){clearInterval(timerInterval);const total=questions.length;const score=Math.round((correct/total)*100);
wrongSet=questions.filter((q,x)=>answers[x]!==q.a);
let grade,gc;if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}else if(score>=75){grade='🥈 جيد جداً';gc='var(--accent)'}else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}else{grade='📚 راجع تاني';gc='var(--danger)'}
const circ=2*Math.PI*45,off=circ-(score/100)*circ;
const rep=questions.map((q,x)=>{const ok=answers[x]===q.a;return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`<div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[x]>=0?q.o[answers[x]]:'تم التخطي'}</div><div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`}).join('');
document.getElementById('prog-bar').style.width='100%';
document.getElementById('app').innerHTML=`<div class="result-hero"><div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg><div class="score-num">${score}</div><div class="score-pct">%</div></div><div class="result-grade" style="color:${gc}">${grade}</div><div class="result-sub">أجبت على ${answers.filter(a=>a!==null&&a!==-1).length} من ${total} سؤال</div><div class="result-stats"><div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div><div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div><div class="rs"><div class="n" style="color:var(--accent)">${answers.filter(a=>a===-1||a===null).length}</div><div class="l">تخطي</div></div></div></div>
<div class="result-actions">${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>`:''}<button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button><a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none"><i class="fa-solid fa-house"></i> رجوع للمادة</a></div>
<div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${rep}</div>`;
setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=off},100);window.scrollTo({top:0,behavior:'smooth'})}
function retryWrong(){const pool=[...wrongSet];questions=shuffle(pool);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;startTimer();render();window.scrollTo({top:0,behavior:'smooth'})}
const themeBtn=document.getElementById('themeBtn');let theme=localStorage.getItem('theme')||'light';
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');themeBtn.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('theme',t)}
applyTheme(theme);themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script></body></html>
