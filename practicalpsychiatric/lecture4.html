<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:       #7c3aed;
  --accent-light: #8b5cf6;
  --accent-dark:  #6d28d9;
  --accent-glow:  rgba(124,58,237,0.2);
  --bg:      #f8fafc;
  --bg2:     #eef2f7;
  --card:    #ffffff;
  --text:    #1a2332;
  --text2:   #4a5568;
  --text3:   #718096;
  --bc:      rgba(0,0,0,0.07);
  --success: #16a34a;
  --danger:  #dc2626;
  --warn:    #6d28d9;
  --r:       16px;
  --tr:      all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:   #0d1117; --bg2: #161b22; --card: #1c2333;
  --text: #e6edf3; --text2: #b1bac4; --text3: #7d8590;
  --bc:   rgba(255,255,255,0.08);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

/* PROGRESS TOP */
#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width .2s;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(248,250,252,.93); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bc); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(13,17,23,.95); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent-glow); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 900;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.shuffle-btn {
  border: 1px solid var(--bc);
  background: var(--bg2);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s ease;
  font-family: inherit;
}
.shuffle-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.theme-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

/* HERO BAND */
.hero-band {
  margin-top: 64px;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-light));
  padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden;
}
.hero-band::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band-icon {
  width: 68px; height: 68px; border-radius: 20px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px; border: 1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size: clamp(20px,4vw,30px); font-weight: 900; color: #fff; margin-bottom: 6px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.8); }
.hero-band-meta {
  display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  flex-wrap: wrap;
}
.meta-pill {
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 50px;
  padding: 6px 16px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}

/* EXAM SHELL */
.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center;
}
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--accent); }

/* PROGRESS STRIP */
.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 8px; transition: width .4s;
}
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text);
  gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(217,119,6,.3); background: rgba(217,119,6,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* QUESTION CARD */
.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  transition: box-shadow .3s;
}
.q-header {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  padding: 4px 18px 4px;
  display: flex; align-items: center; gap: 8px;
}
.q-num {
  background: rgba(255,255,255,.2); border-radius: 8px;
  padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff;
}
.q-text {
  padding: 22px 18px 14px; font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.65; border-bottom: 1px solid var(--bc);
  text-align: left; direction: ltr;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

/* OPTION */
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--bc); background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none;
  direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); background: var(--accent-glow);
  transform: translateX(3px);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3);
  transition: var(--tr);
}
.opt.correct {
  border-color: var(--success); background: rgba(22,163,74,.08);
}
.opt.correct .opt-letter {
  background: var(--success); color: #fff; border-color: var(--success);
}
.opt.wrong {
  border-color: var(--danger); background: rgba(220,38,38,.07);
}
.opt.wrong .opt-letter {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
.opt.disabled { pointer-events: none; }

/* FEEDBACK */
.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(22,163,74,.1); color: var(--success); border: 1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background: rgba(220,38,38,.08); color: var(--danger); border: 1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size: 20px; }

/* EXPLANATION */
.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06);
  border-radius: 10px; border-right: 3px solid var(--accent);
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none;
}

/* NAV BTNS */
.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-skip {
  background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px;
}
.btn-skip:hover { border-color: var(--warn); color: var(--warn); }

/* ===== RESULTS ===== */
.result-hero {
  text-align: center; padding: 36px 20px 28px;
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; border: 5px solid var(--bg2);
  position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
}
.rs { background: var(--bg2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

/* REPORT ITEMS */
.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 14px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.report-item .ri-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; margin-top: 5px; color: var(--text2);
}
.ri-badge {
  padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; flex-shrink: 0;
}
.ri-yours { background: rgba(220,38,38,.1); color: var(--danger); }
.ri-right { background: rgba(22,163,74,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

/* FOOTER */
footer {
  background: var(--bg2); border-top: 1px solid var(--bc);
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>
<body>

<div id="prog-bar" style="width:0%"></div>

<nav>
  <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>

<div class="hero-band">
  <div class="hero-band-icon">🧠</div>
  <h1> Neuroleptic Malignant Syndrome (NMS)</h1>
  <p>Psychiatric Nursing </p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 40 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>

<div class="shell">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="val stat-correct" id="sCorrect">0</div>
      <div class="lbl">✔ صحيح</div>
    </div>
    <div class="stat-box">
      <div class="val stat-wrong" id="sWrong">0</div>
      <div class="lbl">✖ خطأ</div>
    </div>
    <div class="stat-box">
      <div class="val stat-remain" id="sRemain">--%</div>
      <div class="lbl">⏳ متبقي</div>

  </div>

  <!-- APP -->
  <div id="app"></div>
</div>

<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>

<script>
const QUESTIONS = [
  {t:"What is Neuroleptic Malignant Syndrome (NMS)?", o:["A chronic neurodegenerative disorder caused by dopamine excess","An allergic reaction to antidepressant medications","A rare but potentially life-threatening neurologic emergency caused by dopamine antagonist medications","A benign side effect of benzodiazepine therapy"], a:2},

  {t:"What is the estimated prevalence of NMS among patients treated with antipsychotic medications?", o:["0.02% to 3%","5% to 10%","10% to 15%","20% to 25%"], a:0},

  {t:"NMS is primarily triggered by which mechanism in the central nervous system?", o:["Serotonin receptor activation","Dopamine receptor antagonism","GABA receptor inhibition","Acetylcholine receptor blockade"], a:1},

  {t:"Which of the following represents the classic tetrad of NMS symptoms?", o:["Headache, nausea, vomiting, diarrhea","Tremor, insomnia, weight gain, dry mouth","Seizures, hallucinations, hypotension, bradycardia","Fever, generalized rigidity, altered consciousness, autonomic instability"], a:3},

  {t:"NMS typically develops within what time frame after starting or increasing antipsychotic medication?", o:["Hours to days","Weeks to months","3 to 6 months","6 to 12 months"], a:0},

  {t:"Which of the following is a typical (first-generation) antipsychotic most commonly associated with NMS?", o:["Clozapine","Olanzapine","Haloperidol","Quetiapine"], a:2},

  {t:"Regarding gender distribution, NMS is:", o:["Equally common in men and women","Slightly more common in men","Exclusively seen in women","Slightly more common in women"], a:1},

  {t:"Which neurotransmitter system is centrally involved in the pathophysiology of NMS?", o:["Serotonin","Norepinephrine","Acetylcholine","Dopamine"], a:3},

  {t:"What is the strongest risk factor for developing NMS upon re-exposure to antipsychotics?", o:["Prior history of NMS","Older age","Female gender","Hyperthyroidism"], a:0},

  {t:"With early recognition and treatment, NMS recovery typically occurs within:", o:["24 to 48 hours","1 to 2 weeks","2 to 3 months","6 to 12 months"], a:1},

  {t:"What is the approximate recurrence risk of NMS if a patient is re-exposed to neuroleptics?", o:["5%","10%","30%","75%"], a:2},

  {t:"What is the first and most critical immediate step in the management of NMS?", o:["Stop the neuroleptic medication immediately","Administer dantrolene sodium","Begin electroconvulsive therapy","Increase the antipsychotic dose gradually"], a:0},

 
  {t:"In NMS, Creatine Kinase (CK) levels are often elevated above which threshold due to rhabdomyolysis?", o:"> 200 IU/L","> 500 IU/L","> 750 IU/L","> 1000 IU/L"], a:3},

  {t:"Which of the following is NOT part of the DSM-5 diagnostic criteria for NMS?", o:["Severe muscular rigidity","Hypothermia","Fever","Exposure to a dopamine-blocking drug"], a:1},

  {t:"Dantrolene sodium is used in the management of NMS primarily as a:", o:["Dopamine agonist","Serotonin antagonist","Muscle relaxant","Beta-blocker"], a:2},

  {t:"Bromocriptine is classified as which type of agent used in NMS treatment?", o:["Dopamine agonist","Dopamine antagonist","Muscle relaxant","Anticholinergic"], a:0},

  {t:"Which of the following is considered a WEAK risk factor for NMS?", o:["High-potency first-generation antipsychotics","Intramuscular administration","Antipsychotic polypharmacy","Male gender"], a:3},

  {t:"Acute renal failure in NMS most commonly results from:", o:["Direct nephrotoxicity of antipsychotics","Rhabdomyolysis","Hypotension-induced ischemia","Urinary tract obstruction"], a:1},

  {t:"Which cooling measures are recommended for managing hyperthermia in NMS?", o:["Antipyretic medications only","Warm blankets and heated IV fluids","Ice packs, cooling systems, and cooled saline","Tepid sponge baths with alcohol"], a:2},

  {t:"After full recovery from NMS, antipsychotic reintroduction should be delayed for at least:", o:["2 weeks","48 hours","6 months","1 year"], a:0},

  {t:"Which laboratory finding is expected in a patient with NMS?", o:["Thrombocytopenia","Hypoglycemia","Decreased liver enzymes","Leukocytosis"], a:3},

  {t:"The priority nursing intervention for a patient suspected of having NMS is to:", o:["Administer a high dose of antipsychotics","Ensure airway, breathing, and circulation (ABCs)","Place the patient in restraints","Encourage oral fluid intake only"], a:1},

  {t:"NMS must be differentiated from which of the following conditions?", o:["Generalized anxiety disorder","Major depressive disorder","Serotonin syndrome","Obsessive-compulsive disorder"], a:2},

  {t:"Which atypical antipsychotics have been associated with NMS, albeit less commonly?", o:["Clozapine, risperidone, olanzapine","Lithium, valproate, carbamazepine","Fluoxetine, sertraline, paroxetine","Diazepam, lorazepam, clonazepam"], a:0},

  {t:"The recommended prevention strategy for antipsychotic dosing to minimize NMS risk is:", o:["Start with the maximum dose for rapid control","Use only intramuscular formulations","Combine multiple antipsychotics from day one","Start low and go slow with gradual titration"], a:3},

  {t:"Which of the following is classified as a STRONG risk factor for NMS?", o:["Older age","Antipsychotic polypharmacy","Alcoholism","Hyperthyroidism"], a:1},

  {t:"Which electrolyte disturbance is commonly associated with NMS?", o:["Hypokalemia","Hyponatremia","Hyperkalemia","Hypercalcemia"], a:2},

  {t:"Respiratory failure in NMS is most commonly secondary to:", o:["Pulmonary embolism","Aspiration of gastric contents","Chest muscle rigidity","Pneumothorax"], a:0},

  {t:"When restarting antipsychotics after NMS recovery, which formulation should be avoided initially?", o:["Oral immediate-release tablets","Oral liquid formulations","Sublingual tablets","Depot (long-acting injectable) forms"], a:3},

  {t:"Amantadine is used in NMS management as a:", o:["Dopamine antagonist","Dopaminergic agent","Serotonin reuptake inhibitor","GABA agonist"], a:1},

  {t:"Leukocytosis in NMS is significant because it:", o:["Indicates a primary bacterial infection requiring antibiotics","Suggests an autoimmune etiology","Is part of the DSM-5 diagnostic criteria for NMS","Rules out the diagnosis of NMS"], a:2},

  {t:"Metabolic acidosis in NMS is most likely related to:", o:["Excessive bicarbonate administration","Respiratory alkalosis from hyperventilation","Tissue hypoxia and rhabdomyolysis","Excessive antacid use"], a:2},

  {t:"Benzodiazepines are used in the pharmacological management of NMS primarily for:", o:["Reducing fever","Treating renal failure","Lowering blood pressure","Managing agitation and rigidity"], a:3},

  {t:"Intramuscular administration of antipsychotics increases NMS risk because it:", o:["Reduces drug bioavailability","Provides rapid and unpredictable peak drug levels","Enhances dopamine receptor sensitivity","Decreases muscle rigidity"], a:1},

  {t:"Which of the following conditions is listed as an 'Other' risk factor for NMS?", o:["High-potency FGAs","Recent dose increase","Catatonia","Intramuscular administration"], a:2},

  {t:"NMS occurs exclusively with typical (first-generation) antipsychotics and never with atypical antipsychotics.", o:["True","False"], a:1},

  {t:"NMS is more common in women than in men.", o:["True","False"], a:1},

  {t:"In NMS, Creatine Kinase (CK) levels are often greater than 1000 IU/L due to rhabdomyolysis.", o:["True","False"], a:0},

  {t:"If left untreated, NMS will resolve spontaneously within a few days without complications.", o:["True","False"], a:1},

  {t:"Dantrolene sodium is classified as a dopamine agonist.", o:["True","False"], a:1},

  {t:"NMS can occur following the abrupt withdrawal of dopaminergic drugs used in Parkinson's disease.", o:["True","False"], a:0},

  {t:"The estimated prevalence of NMS is approximately 5% to 10% among patients on antipsychotic medications.", o:["True","False"], a:1},

  {t:"Pre-existing dehydration is considered a weak risk factor for developing NMS.", o:["True","False"], a:0},

  {t:"After recovery from NMS, antipsychotics should be restarted immediately to prevent psychiatric relapse.", o:["True","False"], a:1},

  {t:"Bromocriptine is a dopamine agonist used in the pharmacological management of NMS.", o:["True","False"], a:0},

  {t:"NMS typically develops gradually over several weeks to months after initiating antipsychotic therapy.", o:["True","False"], a:1},

  {t:"Acute kidney injury is a recognized complication of NMS.", o:["True","False"], a:0},

  {t:"Hyperthyroidism is listed as a risk factor for developing NMS.", o:["True","False"], a:0},

  {t:"The recurrence risk of NMS upon re-exposure to neuroleptics is approximately 5%.", o:["True","False"], a:1},

  {t:"A 28-year-old male with schizophrenia was started on high-dose haloperidol three days ago. He now presents with a temperature of 40.2°C, severe lead-pipe muscle rigidity, confusion, tachycardia (130 bpm), and blood pressure fluctuations. His CK level is 8,500 IU/L. What is the most likely diagnosis?", o:["Serotonin syndrome","Malignant hyperthermia","Neuroleptic Malignant Syndrome","Heat stroke"], a:2},

  {t:"A 65-year-old patient with Parkinson's disease had his levodopa/carbidopa abruptly discontinued due to a medication error. Within 48 hours, he develops high fever, severe rigidity, altered consciousness, and autonomic instability. What is the most likely explanation?", o:["NMS triggered by dopamine withdrawal","Progression of Parkinson's disease","Acute stroke","Bacterial meningitis"], a:0},

  {t:"A patient in the ICU with confirmed NMS has a CK level of 12,000 IU/L and dark brown urine. Urinalysis reveals myoglobinuria. What complication is this patient at greatest risk for?", o:["Hepatic failure","Acute renal failure","Pulmonary embolism","Disseminated intravascular coagulation"], a:1},

  {t:"A 35-year-old female on risperidone presents with fever, rigidity, and confusion. The intern suspects serotonin syndrome because she is also taking fluoxetine. Which feature would most strongly favor NMS over serotonin syndrome?", o:["Hyperreflexia and clonus","Diarrhea and myoclonus","Shivering and dilated pupils","Severe lead-pipe rigidity and markedly elevated CK"], a:3},

  {t:"A patient fully recovered from NMS two weeks ago. The psychiatrist is considering restarting antipsychotic therapy. Which approach is most appropriate?", o:["Resume the same high-potency antipsychotic at the previous dose","Start a depot injection of haloperidol for compliance","Use a lower-potency or atypical antipsychotic at a low dose with slow titration","Avoid all psychotropic medications permanently"], a:2},

  {t:"A 42-year-old male with NMS is admitted to the ICU. His temperature is 41°C, BP is 180/110 mmHg, and HR is 140 bpm. He is unconscious. What is the priority nursing intervention?", o:["Ensure airway patency, breathing, and circulation while initiating cooling measures","Administer oral bromocriptine immediately","Perform a lumbar puncture to rule out meningitis","Apply warm blankets to prevent shivering"], a:0},

  {t:"A 50-year-old woman on olanzapine for bipolar disorder develops low-grade fever, mild rigidity, and confusion one week after a dose increase. Her CK is mildly elevated at 600 IU/L. Although atypical antipsychotics are less commonly associated with NMS, which atypical agents are most frequently implicated?", o:["Aripiprazole and ziprasidone","Clozapine, risperidone, and olanzapine","Lurasidone and cariprazine","Paliperidone and asenapine"], a:1},

  {t:"A 22-year-old agitated male arrives at the emergency department. He is severely dehydrated after days of not eating or drinking. The team considers rapid IM haloperidol for chemical restraint. Why should this approach raise concern for NMS?", o:["Haloperidol is ineffective in dehydrated patients","Dehydration is a weak risk factor and IM administration is a strong risk factor for NMS","IM haloperidol causes immediate serotonin syndrome","Dehydration protects against NMS development"], a:1},

  {t:"A patient recovering from NMS is being monitored on the psychiatric unit. The nurse is educating the patient and family about early warning signs of recurrence. Which symptoms should they be instructed to report immediately?", o:["Mild drowsiness and dry mouth","Weight gain and increased appetite","Unexplained fever, muscle rigidity, and confusion","Occasional headache and mild nausea"], a:2},

  {t:"A 30-year-old male with schizophrenia is on both haloperidol and fluphenazine (antipsychotic polypharmacy). He also receives PRN IM chlorpromazine for agitation. He develops NMS. Which combination of risk factors is present in this case?", o:["Older age and female gender","High-potency FGAs, polypharmacy, and IM administration","Atypical antipsychotic use and hyperthyroidism","Parkinson's disease and dopamine agonist use"], a:1}

];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 40*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuestions() {
  if (!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟')) return;
  init(QUESTIONS);
}

function init(pool) {
  questions = shuffle([...pool]);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

/* TIMER */
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

/* TOP UI */
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

/* RENDER QUESTION */
function render() {
  updateTop();
  const q = questions[i];
  // Randomize answer choices while keeping the original correct-answer index
  const order = shuffle(q.o.map((_, idx) => idx));
  q._displayOrder = order;
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${order.map((originalIdx, displayIdx) => `
          <div class="opt" id="opt${originalIdx}" onclick="choose(${originalIdx})">
            <div class="opt-letter">${LETTERS[displayIdx] || displayIdx + 1}</div>
            <div class="opt-text">${q.o[originalIdx]}</div>
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

/* CHOOSE */
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🥳</span> <span>ما شاء الله عليك 🎉</span>`
    : `<span class="feedback-icon">😢</span> <span>ركز ونحاول فيها تاني</span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

/* SKIP */
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

/* NEXT */
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

/* FINISH */
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--accent)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})

</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button>
      <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> 

رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* RETRY WRONG */
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* THEME */
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

/* START */
init(QUESTIONS);
</script>
