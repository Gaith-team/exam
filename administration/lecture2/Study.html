<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:#1e3a8a; --teal:#0e7490; --emerald:#10b981; --gold:#f59e0b;
  --accent:#0e7490; --accent-glow:rgba(14,116,144,0.18); --accent-rgb:14,116,144;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --grad-bar:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b);
  --bg:#f8fafc; --bg2:#eef2f7; --card:#ffffff;
  --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07);
  --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --card:#1c2333;
  --text:#e6edf3; --text2:#b1bac4; --text3:#7d8590;
  --bc:rgba(255,255,255,0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(248,250,252,.93); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(13,17,23,.95); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon {
  width:34px; height:34px; border-radius:8px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:900; box-shadow:0 0 0 2px rgba(245,158,11,.5);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:50px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Outfit',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; border-radius:50%; font-size:15px; }
.theme-btn:hover { border-color:var(--accent); transform:rotate(20deg); }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }
.tool-btn.off { opacity:.55; }

.hero-band {
  margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--gold);
}
.hero-band::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(245,158,11,.22) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(16,185,129,.28) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px;
}
.meta-pill i { color:var(--gold); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:50px; font-size:12px; font-weight:700;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--grad); color:#fff; border-color:transparent; }

.shell { max-width:860px; margin:0 auto; padding:24px 20px 80px; }

/* SECTION */
.sec { margin-bottom:34px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:16px 16px 0 0; border-bottom:3px solid var(--gold);
}
.sec-icon {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:17px; font-weight:900; line-height:1.3; }
.sec-count { margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:50px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.subhead {
  font-size:13px; font-weight:900; color:var(--navy); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--gold);
  border-radius:8px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#7dd3fc; }

/* FIGURE */
.fig {
  margin:4px 0; padding:14px; background:#fff; border:1px solid var(--bc);
  border-radius:14px; text-align:center;
}
.fig img { max-width:100%; height:auto; border-radius:8px; }
.fig figcaption { margin-top:8px; font-size:13px; font-weight:700; color:#1e3a8a; direction:ltr; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-radius:14px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.4); box-shadow:0 4px 14px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left:3px solid var(--teal); }
.pt.done { opacity:.55; }

.pt-en {
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px;
  font-size:15px; font-weight:700; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff;
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
}
.pt-ar {
  padding:12px 16px; font-size:14.5px; line-height:1.9; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:11px; font-weight:900; padding:2px 9px; border-radius:6px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(14,116,144,.12); color:var(--teal); }
[data-theme="dark"] .pt-ar .tag { color:#5eead4; }
.pt-ex {
  padding:12px 16px; font-size:14px; line-height:1.9; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(245,158,11,.07); border-right:4px solid var(--gold);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ex .tag { background:rgba(245,158,11,.2); color:#b45309; }
[data-theme="dark"] .pt-ex .tag { color:#fbbf24; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
</style>
</head>

const SECTIONS = [{"id": "head", "icon": "👩‍⚕️", "title": "Who is “The head nurse”", "items": [["The head nurse is a professional nurse who is responsible for the management of the nursing service activities in a single nursing unit.", "الهيد ناس (رئيسة التمريض في الوحدة) هي ممرضة محترفة، مسؤولة عن إدارة أنشطة خدمات التمريض في <b>وحدة تمريض واحدة بس</b>.", "زي مدير فرع في بنك، مسؤول عن الفرع بتاعه بس مش البنك كله. الهيد ناس كده مسؤولة عن وحدتها (مثلًا وحدة الصدر) بس، مش المستشفى كلها."], {"h": "The managerial position of the head nurse:"}, ["The head nurse fills \"first – line management\" in the hospital setting (Fig. 1), which is viewed as a vital position and an essential inter and intra – departmental link in the health care organization.", "الهيد ناس بتشغل مستوى <b>الإدارة الأولى (First-line management)</b> في المستشفى (شكل 1)، وده منصب حيوي ومهم، وبيعتبر حلقة وصل أساسية بين الأقسام وجوه القسم نفسه في المنظمة الصحية.", "تخيل إنها زي «الوصلة» اللي بتوصل الأوضة بالكهربا: من غيرها الأقسام مش هتتكلم مع بعض، ولا الإدارة هتوصل لتمريض الوحدة."], {"img": true, "cap": "Fig (1): Nursing Management Levels"}, ["Top management level (Director of nursing service department)", "المستوى الإداري الأعلى (Top) هو مديرة إدارة خدمات التمريض.", "زي مدير عام الشركة، هو أعلى واحد في الهرم."], ["Middle management level (Nursing supervisor)", "المستوى الإداري المتوسط (Middle) هو المشرفة التمريضية (Nursing supervisor).", "زي مدير الإدارة اللي قاعد بين المدير العام ومديري الأقسام."], ["First (lower) –management level (Head-nurse)", "المستوى الإداري الأول أو الأدنى (Lower) هو الهيد ناس.", "زي مشرف الوردية اللي واقف مع الموظفين مباشرة في الأرض."]]}, {"id": "top", "icon": "🏛️", "title": "Top level of management", "items": [["They are also called as the administrators and the brain of the organization; they require more conceptual skills and less technical skills.", "الإدارة العليا بتتسمى كمان «الإداريين» و«مخ المنظمة»، وبتحتاج مهارات <b>تصورية (Conceptual)</b> أكتر ومهارات <b>فنية (Technical)</b> أقل.", "زي المهندس الاستشاري اللي بيرسم الخطة العامة للمشروع بدماغه، مش هو اللي هيمسك الأدوات ويبني بإيده."], {"h": "Their main role summarized as follows:-"}, ["1- They are the top or final authority in the organization.", "هما أعلى سلطة أو السلطة الأخيرة في المنظمة.", "لو في قرار نهائي محتاج يتاخد، بيرجع لهم هما."], ["2- Determine the objectives, policies and plans of the organization.", "بيحددوا أهداف المنظمة وسياساتها وخططها.", "زي ما يقرروا إن المستشفى هدفها تقليل العدوى، وبعدين يحطوا السياسات والخطط لده."], ["3- They prepare long-term plans of the organization which are generally made for 5 to 20 years.", "بيعملوا خطط <b>طويلة المدى</b> للمنظمة، وغالبًا بتبقى من 5 لـ 20 سنة.", "زي خطة إنهم يبنوا مستشفى جديدة أو يطوروا المستشفى على 10 سنين."], ["4- They spend more time in planning and organizing", "بيقضوا أغلب وقتهم في التخطيط (Planning) والتنظيم (Organizing).", "وقتهم في الاجتماعات ورسم الخطط أكتر من متابعة شغل يومي."], ["5- They have maximum authority, responsibility, efficiency and decision making ability.", "عندهم أقصى سلطة ومسؤولية وكفاءة وقدرة على اتخاذ القرار.", "كل ما تطلع في الهرم بتلاقي سلطة ومسؤولية أكتر، وهما فوق خالص."], ["6- They are directly responsible to the shareholders, government and the general public.", "هما مسؤولين بشكل مباشر قدام المساهمين (Shareholders) والحكومة والجمهور.", "لو المستشفى فيها مشكلة كبيرة، الحكومة والناس بتسأل الإدارة العليا."]]}, {"id": "middle", "icon": "🧭", "title": "Middle Level of Management", "items": [["They are selected by the top level of management.", "الإدارة الوسطى بتتختار من الإدارة العليا.", "المدير العام هو اللي بيختار مديري الإدارات."], ["They are intermediary between top and lower management.", "هما وسيط بين الإدارة العليا والإدارة الدنيا.", "زي الراوي اللي بينقل الكلام من فوق لتحت ومن تحت لفوق."], ["They are directly responsible to the chief executive officer and board of directors.", "هما مسؤولين بشكل مباشر قدام الرئيس التنفيذي (CEO) ومجلس الإدارة.", "بيقدموا تقريرهم لرئيس المستشفى ومجلس الإدارة."], ["Require more managerial and technical skills and less conceptual skills.", "بيحتاجوا مهارات <b>إدارية وفنية</b> أكتر ومهارات <b>تصورية</b> أقل.", "محتاجين يعرفوا يديروا ويفهموا الشغل نفسه، مش بس يرسموا خطط عامة."], {"h": "Their main role summarized as follows:-"}, ["1- They spend more time in coordinating and communicating.", "بيقضوا أغلب وقتهم في التنسيق (Coordinating) والتواصل (Communicating).", "شغلهم الأساسي إنهم يكلموا الناس ويظبطوا الشغل بين الأقسام."], ["2- It implements the policies and plans which are made by the top level of management.", "بينفذوا السياسات والخطط اللي الإدارة العليا حطتها.", "الإدارة العليا قررت سياسة جديدة، والإدارة الوسطى هي اللي تطبقها فعليًا."], ["3- They prepare short-term plans of their departments which are generally made for 1 to 5 years.", "بيعملوا خطط <b>قصيرة المدى</b> لأقسامهم، وغالبًا من 1 لـ 5 سنين.", "زي خطة تدريب لتمريض قسم معين على سنتين."], ["4- Have limited authority and responsibility.", "عندهم سلطة ومسؤولية <b>محدودة</b> (أقل من الإدارة العليا).", "مش بياخدوا القرارات الكبيرة لوحدهم."], ["5- Co-ordinate the activities of all the departments.", "بينسقوا أنشطة كل الأقسام.", "يخلوا قسم المعمل وقسم الجراحة يشتغلوا مع بعض من غير تعارض."], ["6- They also have to communicate with top and lower levels management.", "لازم كمان يتواصلوا مع الإدارة العليا والدنيا.", "بيكلموا فوق وتحت في نفس الوقت."]]}, {"id": "lower", "icon": "🩺", "title": "Lower Level of Management", "items": [["It consists of head nurses.", "الإدارة الدنيا مكونة من الهيد ناسات.", "كل وحدة ليها هيد ناس."], ["They are selected by the middle level management.", "بيتختاروا من الإدارة الوسطى.", "المشرفة التمريضية هي اللي بتختار الهيد ناس."], ["It is also called First Line of Management and may be assigned titles such as Nurse administrators, Unit Coordinator, and front-line Head Nurse, Nurse Leader, and Patient Care Manager, clinical coordinator.", "بتتسمى كمان <b>الخط الأول للإدارة</b> (First Line of Management)، ومن الممكن يتدي لها ألقاب زي: Nurse administrators، Unit Coordinator، front-line Head Nurse، Nurse Leader، Patient Care Manager، clinical coordinator.", "نفس الشخص ممكن يتنادى بأسامي مختلفة حسب المستشفى، لكن كلهم بيقصدوا الهيد ناس."], ["They have limited authority but important responsibility of getting the work done from the workers.", "عندهم سلطة <b>محدودة</b> لكن مسؤولية <b>مهمة</b> وهي إنهم يخلصوا الشغل من العاملين.", "مش بتاخد قرارات كبيرة، بس لو الشغل مخلصش في الوحدة، هي اللي تتسأل."], {"h": "Their main role summarized as follows:-"}, ["1- The lower level managers make daily, weekly and monthly plans.", "مديري المستوى الأدنى بيعملوا خطط يومية وأسبوعية وشهرية.", "زي جدول الشغل بتاع الأسبوع وتوزيع المرضى كل يوم."], ["2- Lower level management directs the workers / employees.", "الإدارة الدنيا بتوجه العاملين / الموظفين.", "بتقول للممرضة تعمل إيه وإزاي."], ["3- They develop morale in the workers.", "بينموا الروح المعنوية (Morale) عند العاملين.", "كلمة تشجيع أو شكر للممرضة بترفع نفسيتها وبتخليها تشتغل أحسن."], ["4- They maintain a link between workers and the middle level management.", "بيحافظوا على حلقة الوصل بين العاملين والإدارة الوسطى.", "هي الجسر بين الممرضات والمشرفة."], ["5- They inform the workers about the decisions which are taken by the management.", "بيعرّفوا العاملين بالقرارات اللي الإدارة أخدتها.", "لو نزل قرار جديد من الإدارة، الهيد ناس هي اللي تبلغه للتمريض."], ["6- They also inform the management about the performance, difficulties, and demands of the workers……etc.", "وكمان بيعرّفوا الإدارة بأداء العاملين وصعوباتهم وطلباتهم... إلخ.", "لو الممرضات محتاجين مستلزمات أو في نقص عدد، الهيد ناس تبلغ الإدارة."], ["7- They regularly report and are directly responsible to the middle level management.", "بيقدموا تقارير بانتظام، وهما مسؤولين بشكل مباشر قدام الإدارة الوسطى.", "بتقدم تقريرها بشكل دوري للمشرفة."], ["8- They spend more time in directing and controlling.", "بيقضوا أغلب وقتهم في التوجيه (Directing) والرقابة (Controlling).", "وقتها بيعدي في الدوران على الوحدة ومتابعة الشغل."], ["9- Along with the experience and basic management skills, they also require more technical and communication skills.", "مع الخبرة ومهارات الإدارة الأساسية، بيحتاجوا كمان مهارات <b>فنية</b> ومهارات <b>تواصل</b> أكتر.", "لازم تعرف الشغل التمريضي كويس وتعرف تتكلم مع الناس."]]}, {"id": "rel", "icon": "🔗", "title": "Organizational relationships", "items": [{"h": "III. Organizational relationships of the head nurse :"}, ["The head nurse is responsible for: all staff assigned to in patient care unit including practical nurses, work clerks, and nurses’ aides.", "الهيد ناس <b>مسؤولة عن</b> كل العاملين المتعينين في وحدة رعاية المرضى الداخليين، ومنهم الممرضين العمليين (practical nurses) والكتبة (work clerks) ومساعدي التمريض (nurses’ aides).", "كل اللي شغالين تحتها في الوحدة، من الممرضة لحد الكاتب."], ["The head nurse is responsible to: the nurse supervisor, and the nursing service director.", "الهيد ناس <b>مسؤولة قدام</b> المشرفة التمريضية ومديرة خدمات التمريض.", "هي المسؤولة عن اللي تحتها، وفي نفس الوقت بتتحاسب قدام اللي فوقها."]]}, {"id": "crit", "icon": "✅", "title": "Criteria for selection", "items": [{"h": "Criteria for the selection of the head nurse:"}, ["Selection of the head nurse affects both the effectiveness and the efficiency of the nursing services, and the health care organization.", "اختيار الهيد ناس بيأثر على <b>الفاعلية (effectiveness)</b> و<b>الكفاءة (efficiency)</b> بتاعة خدمات التمريض والمنظمة الصحية.", "لو اخترت هيد ناس مش مناسبة، الوحدة كلها هتتأثر."], ["The selection of the head nurse should be based on the following personal, educational and professional qualifications:-", "اختيار الهيد ناس لازم يتبني على المؤهلات دي: شخصية وتعليمية ومهنية.", "زي ما بتختار موظف على أساس شخصيته وشهادته وخبرته."], {"h": "A. Personal qualifications"}, ["Healthy (physically and emotionally).", "تكون سليمة صحيًا (جسديًا ونفسيًا).", "لازم تقدر تتحمل ضغط الشغل جسديًا ونفسيًا."], ["Accepts responsibility for continuous self – improvement and professional progress through maintaining up –to – date nursing knowledge and skills.", "تقبل مسؤولية تطوير نفسها باستمرار وتقدمها المهني من خلال إنها تحافظ على معرفتها ومهاراتها التمريضية حديثة.", "تحضر كورسات وتقرا الجديد في التمريض باستمرار."], ["Head Nurses should have attributes of patient caring behaviors, goal orientation, and drive for excellence, open mindedness, creativity, honesty, trustworthiness, sincerity, empathy, and respect.", "لازم الهيد ناس يبقى عندها صفات زي: سلوكيات رعاية المريض، التوجه نحو الهدف، السعي للتميز، الانفتاح الذهني، الإبداع، الأمانة، الجدارة بالثقة، الإخلاص، التعاطف، والاحترام.", "ممرضة بتحب مرضاها، عندها هدف واضح، وصادقة ومحترمة مع زمايلها."], {"h": "B. Educational Qualifications"}, ["Hold a bachelor of science in nursing (B. Sc. N.) degree with advanced preparation in nursing administration", "تكون حاصلة على بكالوريوس تمريض (B.Sc.N.) مع إعداد متقدم في إدارة التمريض.", "يعني بكالوريوس تمريض، وكمان دراسة أو دبلومة في إدارة التمريض."], {"h": "C. Professional Qualifications :"}, ["Currently licensed to practice as a professional nurse.", "تكون حاليًا مرخص لها بممارسة المهنة كممرضة محترفة.", "معاها رخصة مزاولة المهنة سارية."], ["Two to five years of experience in an area of clinical nursing with at least one year experience as a nurse in charge of a nursing unit.", "من سنتين لخمس سنين خبرة في مجال تمريض إكلينيكي، منهم سنة على الأقل كممرضة مسؤولة عن وحدة تمريض (nurse in charge).", "اشتغلت في الإكلينيكال كذا سنة، وسنة منهم كانت مسؤولة عن وحدة."], ["Professional qualifications include human, conceptual, technical, political, analytical and communication skills", "المؤهلات المهنية بتشمل مهارات: إنسانية، تصورية، فنية، سياسية، تحليلية، وتواصل.", "ست مهارات، وهنشرحهم واحدة واحدة."], {"h": "Human Skills (Interpersonal skills)"}, ["Means: Ability to work with and through people including an understanding of motivation and application of an effective leadership.", "معناها: القدرة على الشغل مع الناس ومن خلالهم، وتشمل فهم التحفيز (motivation) وتطبيق قيادة فعالة.", "تعرف تتعامل مع كل ممرضة بطريقة تحفزها وتخليها تشتغل بحماس."], {"h": "Conceptual skills:"}, ["Means: Ability to better understand complex scenarios and develop creative solutions. From a management perspective, these skills are valuable because those who have them can approach complicated workplace situations in a variety of different ways.", "معناها: القدرة على فهم المواقف المعقدة بشكل أفضل وإيجاد حلول مبتكرة. من ناحية الإدارة المهارات دي قيّمة، لأن اللي عنده المهارة دي يقدر يتعامل مع مواقف الشغل المعقدة بطرق مختلفة.", "لو حصلت مشكلة معقدة في الوحدة، تفكر في أكتر من طريقة للحل."], {"h": "Technical Skills"}, ["Means: the ability to use knowledge, techniques and requirements necessary for the performance of specific tasks acquired from experience, education, and training.", "معناها: القدرة على استخدام المعرفة والأساليب والمتطلبات اللازمة لأداء مهام معينة، واللي بتتكتسب من الخبرة والتعليم والتدريب.", "زي مهارتها في تركيب كانيولا أو تشغيل جهاز، ودي جت من التعلم والتدريب."], {"h": "Political skills"}, ["Means: the ability to effectively understand others at work and to use knowledge to influence others to act in ways that enhance one's personal and organizational objectives", "معناها: القدرة على فهم الناس في الشغل بفاعلية، واستخدام المعرفة دي للتأثير عليهم عشان يتصرفوا بطريقة تخدم أهداف الشخص وأهداف المنظمة.", "تفهم كل واحد في الفريق محتاج إيه، وتقنعه يتعاون بطريقة تفيد الوحدة والمستشفى."], {"h": "Analytical skills"}, ["Means: The ability to quickly understand a situation and analyze it. This skill is inherent in some people, it can be grown. A head nurse with strong analytical skills will know which nurse to place in care of which patient and how to handle patient’s families, doctors and their demands", "معناها: القدرة على فهم الموقف وتحليله بسرعة. المهارة دي بتبقى موجودة بالفطرة عند بعض الناس، وكمان ممكن تتنمّى. الهيد ناس اللي عندها مهارة تحليل قوية هتعرف أي ممرضة تحطها مع أي مريض، وإزاي تتعامل مع أهل المرضى والأطباء وطلباتهم.", "مريض حالته حرجة تديه الممرضة الأكثر خبرة، ومريض حالته بسيطة تديه ممرضة أحدث."], ["Effective communication skills are important for Head Nurses to articulate goals, set expectations, encourage participation in continuous quality improvement, build trusting relationship among team to resolve work related issues and conflicts and work together to deliver high quality patient care.", "مهارات التواصل الفعال مهمة للهيد ناس عشان توضح الأهداف، وتحدد التوقعات، وتشجع المشاركة في التحسين المستمر للجودة، وتبني علاقة ثقة بين الفريق عشان تحل مشاكل وخلافات الشغل، ويشتغلوا مع بعض لتقديم رعاية عالية الجودة للمريض.", "تقول للفريق الهدف بوضوح، وتسمع منهم، وتبني ثقة بينهم عشان يحلوا المشاكل سوا."], ["Ability to multitask: Medical facilities are often fast-paced work environments with many tasks in need of completion. As a manager, head nurses take responsibility for completing many of these tasks in addition to typical nursing duties.", "القدرة على عمل أكتر من مهمة في نفس الوقت (Multitask): المنشآت الطبية غالبًا بيئة شغل سريعة وفيها مهام كتير لازم تخلص. الهيد ناس كمديرة بتتحمل مسؤولية إنجاز مهام كتير منها، زيادة على واجباتها التمريضية المعتادة.", "في نفس الوقت بتراجع تقرير وبترد على تليفون وبتتابع مريض."], ["Conflict resolution: As the manager of the nursing staff, head nurses must often resolve any conflicts the staff may have with each other or with their patients to help facilitate a positive and productive environment for all.", "حل الخلافات (Conflict resolution): كمديرة لطاقم التمريض، لازم الهيد ناس كتير تحل أي خلافات بين الطاقم وبعضه أو بينهم وبين المرضى، عشان تساعد على خلق بيئة إيجابية ومنتجة للكل.", "ممرضتين اتخانقوا على الشيفت، هي اللي تتدخل وتصلح بينهم."]]}, {"id": "scope", "icon": "🎯", "title": "The scope of the head nurse's role", "items": [["The scope of the head nurse's role can be classified into four main areas:", "نطاق دور الهيد ناس ممكن يتقسم لأربع مجالات رئيسية:", "زي ما تقول: الهيد ناس شغلها أربع حتت كبار."], ["1. Patient – care management.", "1. إدارة رعاية المريض.", "الاهتمام بالمريض نفسه.", 1], ["2. Staff management.", "2. إدارة الطاقم.", "الاهتمام بالممرضين اللي معاها.", 1], ["3. Relations management", "3. إدارة العلاقات.", "الاهتمام بالعلاقات بين الفريق الصحي.", 1], ["4. Unit management.", "4. إدارة الوحدة.", "الاهتمام بتشغيل الوحدة نفسها.", 1]]}, {"id": "patient", "icon": "🛏️", "title": "Patient – Care Management", "items": [{"h": "I. Patient – Care Management :"}, ["The head nurse's main area of responsibility in the patient care unit is to make sure that the patient's total needs are met, and that all unit activities are directed toward this goal.", "المجال الرئيسي لمسؤولية الهيد ناس في وحدة رعاية المرضى هو التأكد إن <b>كل احتياجات المريض</b> متلبية، وإن كل أنشطة الوحدة موجهة نحو الهدف ده.", "المريض محتاج دوا وأكل ونضافة وراحة نفسية، والهيد ناس تتأكد إن كله حاصل."], ["The head nurse must possess a body of scientific knowledge and proper competencies to be able to monitor, direct and educate nursing team for high quality patient care.", "لازم الهيد ناس يبقى عندها مجموعة معارف علمية وكفاءات مناسبة عشان تقدر تراقب وتوجه وتعلّم فريق التمريض لرعاية مريض عالية الجودة.", "لازم تكون عارفة علميًا عشان تقدر تعلّم غيرها وتصحح لهم."], ["- Head nurses must have competency to design, communicate, and apply these patient safety goals to all nurses and other healthcare providers under their supervision", "لازم الهيد ناس عندها كفاءة إنها تصمم أهداف سلامة المريض دي، وتوصلها، وتطبقها على كل الممرضين ومقدمي الرعاية الصحية اللي تحت إشرافها.", "تحط هدف زي «تجنب وقوع المريض من السرير»، وتعلمه للكل وتتابع تطبيقه."], ["Their major roles include;", "أدوارهم الرئيسية بتشمل:", "دي أهم المهام اللي جاية."], ["-Dealing with issues related to the delivery of care, staffing shortages, and behaviors of workers in order to maintain and promote quality of care.", "التعامل مع القضايا المتعلقة بتقديم الرعاية، ونقص الطاقم، وسلوكيات العاملين، عشان تحافظ على جودة الرعاية وتحسنها.", "لو في نقص ممرضات في الشيفت أو ممرضة سلوكها غلط، تتصرف عشان جودة الرعاية متقعش.", 1], ["- They must have managing ability so that any innovative changes for the quality of care.", "لازم يبقى عندها قدرة إدارية عشان تدير أي تغييرات مبتكرة لتحسين جودة الرعاية.", "لو جه نظام جديد للتوثيق، تعرف تقدمه للفريق وتطبقه.", 1], ["- They should be a role model to ensure patient safety", "لازم تكون قدوة (Role model) لضمان سلامة المريض.", "لو هي بتغسل إيديها كل مرة، الفريق هيعمل زيها.", 1]]}, {"id": "staff", "icon": "👥", "title": "Staff Management", "items": [{"h": "II. Staff Management:"}, ["The second area of head nurse's role is to manage her staff through:-", "المجال التاني من دور الهيد ناس هو إدارة طاقمها من خلال:", "هي مسؤولة عن الممرضين اللي معاها."], ["a) Staff utilization", "أ) استخدام الطاقم (Staff utilization).", "توزيعهم صح على الشغل.", 1], ["b) Staff supervision", "ب) الإشراف على الطاقم (Staff supervision).", "متابعتهم وهما شغالين.", 1], ["c) Staff evaluation ( performance appraisal)", "ج) تقييم الطاقم (تقييم الأداء).", "تقييم مستوى الممرضة.", 1], ["d) Staff development", "د) تطوير الطاقم (Staff development).", "تنمية معارفهم ومهاراتهم.", 1], {"h": "A. Staff Utilization"}, ["The head nurse can utilize the nursing staff members as follows:-", "الهيد ناس تقدر تستفيد من أعضاء طاقم التمريض بالشكل ده:", "هتشوف إزاي توزعهم وتستغل قدراتهم صح."], ["1. Assigns the tasks to staff member with proper authority.", "بتوزع المهام على أعضاء الطاقم مع إعطائهم السلطة المناسبة.", "تقول للممرضة «انتي مسؤولة عن غرف 1 لـ 5» وتديها الصلاحية لعمل ده."], ["2. Ensures that every staff member knows :", "بتتأكد إن كل عضو في الطاقم عارف:", "كل ممرضة لازم تكون عارفة وضعها."], ["• To whom she is responsible?", "هي مسؤولة قدام مين؟", "مين رئيستها المباشرة.", 1], ["• For whom she is responsible?", "هي مسؤولة عن مين؟", "مين المرضى أو الأفراد اللي تحت مسؤوليتها.", 1], ["• To whom she may go for counseling?", "تروح لمين لو عاوزة استشارة أو نصيحة؟", "لو محتارة في موقف، تعرف تسأل مين.", 1], ["3. Plans time schedule for staff in advance taking into account personnel requests.", "بتخطط جدول مواعيد الطاقم مقدمًا مع مراعاة طلبات الأفراد.", "جدول الشهر الجاي يتعمل من دلوقتي، ولو ممرضة طلبت إجازة في يوم معين يتحط في الحسبان."], ["4. Maintains effective working conditions.", "بتحافظ على ظروف شغل فعالة.", "تتأكد إن الجو مناسب للشغل: مستلزمات موجودة، وإضاءة ونضافة."], ["5. Maintains effective means of communication.", "بتحافظ على وسائل اتصال فعالة.", "في تليفون وجروب ودفتر تسليم بيشتغلوا كويس."], ["6. Holds staff nurses accountable for implementing the nursing process.", "بتحاسب الممرضات على تطبيق عملية التمريض (Nursing process).", "لو ممرضة مكتبتش خطة التمريض للمريض، هتتسأل."], ["7. Develops routine for frequently performed activities.", "بتعمل روتين للأنشطة اللي بتتكرر كتير.", "زي ترتيب ثابت لمرور الصبح وإعطاء الأدوية، فكل الناس تمشي على نفس النظام."], {"h": "B. Staff supervision"}, ["o Supervises the quality of nursing activities, why to ensure they are on-course and on-schedule in meeting the objectives and performance targets.", "بتشرف على جودة الأنشطة التمريضية، <b>ليه؟</b> عشان تتأكد إنها ماشية في الطريق الصح وفي المواعيد بتاعتها لتحقيق الأهداف ومستهدفات الأداء.", "زي مدرب بيتابع اللاعيبة عشان يتأكد إنهم ماشيين على الخطة."], ["❖ When,during giving reports, making assignments and rounds, and conducting conferences, and demonstrations.", "<b>إمتى؟</b> أثناء إعطاء التقارير، وتوزيع المهام، والمرور على المرضى (Rounds)، وعقد المؤتمرات (Conferences)، والعروض العملية (Demonstrations).", "يعني وقت تسليم الشيفت، وهي بتوزع الشغل، وهي ماشية على العنابر، وفي اجتماع الفريق.", 1], ["❖ How,Establishing harmonious relationship with staff and encourage expression of opinions and ideas.", "<b>إزاي؟</b> بإنها تبني علاقة متناغمة مع الطاقم وتشجعهم يعبروا عن آرائهم وأفكارهم.", "تسمع من الممرضات وتخليهم يقولوا رأيهم من غير خوف.", 1], {"h": "C. Staff evaluation ( performance appraisal )"}, ["It is a periodic formal evaluation that attempts to evaluate the extent to which the staff nurse's performance meet pre-determined standards of performance.", "هو تقييم رسمي <b>دوري</b> بيحاول يقيس مدى تطابق أداء الممرضة مع معايير الأداء الموضوعة مسبقًا.", "زي امتحان دوري للممرضة بيقيس أداءها مقابل معايير معروفة من الأول."], {"h": "D. Staff development"}, ["The head nurse can develop the nursing staff knowledge and skills through:", "الهيد ناس تقدر تنمّي معرفة ومهارات طاقم التمريض من خلال:", "ازاي تخلي الفريق أحسن."], ["1. Setting and utilizing high standards for nursing staff performance which leads to their growth.", "وضع واستخدام معايير عالية لأداء طاقم التمريض، اللي بتؤدي لنموهم.", "لما تطلب مستوى عالي، الممرضة بتجتهد وتتطور."], ["2. Encouraging nursing staff personal improvement", "تشجيع تطور أفراد طاقم التمريض شخصيًا.", "تشجع الممرضة تكمل دراستها أو تتعلم مهارة جديدة."], ["3. Sharing in planning, conducting, and participating in training programs.", "المشاركة في تخطيط وتنفيذ برامج التدريب وفي الحضور فيها.", "تشارك في عمل كورس تدريبي عن مكافحة العدوى وتحضره."]]}, {"id": "rels", "icon": "🤝", "title": "Relations Management", "items": [{"h": "III. Relations Management:"}, ["The head nurse has the responsibility to manage relationships between health team members to maintain healthy working environment and facilitating providing of high quality patient care, this can be achieved through:-", "الهيد ناس عليها مسؤولية إدارة العلاقات بين أعضاء الفريق الصحي عشان تحافظ على بيئة شغل صحية وتسهل تقديم رعاية عالية الجودة للمريض، وده بيتحقق من خلال:", "لما العلاقات كويسة، الشغل بيمشي أحسن والمريض بيستفيد."], ["• Liaison/Networking", "التواصل وبناء شبكة علاقات (Liaison/Networking).", "تعرف ناس كتير في الأقسام التانية وتتواصل معاهم."], ["• Develop coordination and collaboration between nursing staff and other departments.", "تنمية التنسيق والتعاون بين طاقم التمريض والأقسام التانية.", "تنسق مع المعمل والصيدلية عشان الشغل يمشي بسلاسة."], ["• Supporting staff", "دعم الطاقم (Supporting staff).", "تقف جنب الممرضات وقت الضغط."], ["• Be flexible when employees need time off", "تكون مرنة لما العاملين يحتاجوا إجازة.", "ممرضة عندها ظرف طارئ، تديها وقت ترتاح."], ["• Provide information on additional sources of support", "توفر معلومات عن مصادر دعم إضافية.", "تقول للممرضة تروح فين لو محتاجة مساعدة."], ["• Having an open door policy", "تتبع سياسة الباب المفتوح (Open door policy).", "أي ممرضة تقدر تدخل عليها وتتكلم في أي وقت."], ["• Making time to talk to employees at their desks", "تخصص وقت للكلام مع العاملين عند مكاتبهم.", "تعدّي على الممرضات في أماكنهم وتسألهم عن حالهم."], ["• Trusting employees to do their work", "تثق في العاملين إنهم يعملوا شغلهم.", "متقفش على دماغهم في كل خطوة."], ["• Socializes with team and have informal chat with employees", "تختلط بالفريق وتتكلم مع العاملين كلام غير رسمي.", "شوية هزار وكلام ودي بيقرّب الناس من بعض."], ["• Managing Conflict", "إدارة الخلافات (Managing Conflict).", "تحل المشاكل اللي بتحصل بين الناس."], ["• Integrated-effective communication is a form of interdisciplinary conflict prevention:-", "التواصل الفعال المتكامل هو شكل من أشكال منع الخلافات بين التخصصات المختلفة:", "لما الكل بيتواصل صح، الخلافات مبتحصلش.", 1], ["(1) effective direct communication, (2) written communication media, and (3) online communication media.", "(1) تواصل مباشر فعال، (2) وسائل تواصل مكتوبة، (3) وسائل تواصل أونلاين.", "كلام وجهًا لوجه، ورسايل مكتوبة، ورسائل على الإنترنت.", 1], ["• A head nurse needs to have wide insights and a supple character to prevent conflicts with doctors", "الهيد ناس محتاجة بصيرة واسعة وشخصية مرنة عشان تمنع الخلافات مع الأطباء.", "تفهم الموقف بشكل أوسع وتكون مرنة في التعامل.", 1], ["- The theme of having wide insight and supple character to prevent conflicts with doctors is derived into five categories: (1) head nurses must have a thorough understanding of the patients’ need before a doctor's visit (2) head nurses must have clear reasoning in communicating with doctors; (3) head nurses should understand the personal characters of the doctors; (4) head nurses should have ambition for continuing education", "فكرة البصيرة الواسعة والشخصية المرنة لمنع الخلافات مع الأطباء مقسمة لخمس فئات حسب النص، واللي مذكور منهم في المحاضرة أربعة: (1) لازم الهيد ناس تفهم احتياجات المرضى كويس قبل زيارة الدكتور. (2) لازم يبقى عندها منطق واضح في التواصل مع الأطباء. (3) لازم تفهم الطباع الشخصية للأطباء. (4) لازم يبقى عندها طموح للتعليم المستمر.", "تجهز حالة المريض قبل مرور الدكتور، وتكلمه بمنطق، وتعرف طبعه، وتكمل تعليمها.", 2], ["• A head nurse creates conducive working environment to prevent interdisciplinary conflict", "الهيد ناس بتخلق بيئة شغل مناسبة لمنع الخلافات بين التخصصات.", "جو شغل مريح يقلل التوتر بين الأطباء والتمريض.", 1], ["- Creating conducive working environment means that in order to prevent interdisciplinary conflicts the head nurse is responsible to: (1) maintain attitude and harmony in collaboration; (2) think positively toward other professions; (3) be unresentful to any solved problems; and (4) keep multidisciplinary staff feel comfortable with the presence of the head nurse.", "خلق بيئة شغل مناسبة معناه إن الهيد ناس مسؤولة، عشان تمنع الخلافات بين التخصصات، عن: (1) الحفاظ على السلوك والتناغم في التعاون. (2) التفكير بإيجابية تجاه المهن التانية. (3) عدم الاحتفاظ بضغينة تجاه أي مشاكل اتحلت. (4) إن الفريق متعدد التخصصات يحس بالراحة مع وجود الهيد ناس.", "لو حصل خلاف وانحل، متفضلش شايلة منه، وتعامل الكل باحترام.", 2], ["• A head nurse is responsible for coordination and negotiation to prevent interdisciplinary conflicts", "الهيد ناس مسؤولة عن التنسيق والتفاوض لمنع الخلافات بين التخصصات.", "تتفاوض وتنسق بدل ما تسيب الخلاف يكبر.", 1], ["o Maintaining Team work", "الحفاظ على العمل الجماعي (Team work).", "الفريق يشتغل كأنه جسم واحد."], ["• Develop teams and promote teamwork as being positive.", "تكوين فرق وتعزيز العمل الجماعي كشيء إيجابي.", "تبين للناس إن الشغل الجماعي بيفيد الكل.", 1], ["• Maintain mutual respect and trust between all health members", "الحفاظ على الاحترام والثقة المتبادلة بين كل أعضاء الفريق الصحي.", "الكل يحترم الكل ويثق فيه.", 1], ["• Finding creative ways to build on each other's strengths", "إيجاد طرق مبتكرة للبناء على نقاط قوة بعضهم البعض.", "واحدة شاطرة في التعليم وواحدة في المهارات، يتعاونوا ويكملوا بعض.", 1], ["o Maintaining Effective Communication", "الحفاظ على التواصل الفعال.", "الكلام بين الناس يكون واضح ومفهوم."], ["• Provide clear, honest communication to the staff", "توفير تواصل واضح وصادق مع الطاقم.", "تقول الحقيقة بوضوح من غير لف ودوران.", 1], ["• Facilitates communication and negotiation among members of the organization", "تسهّل التواصل والتفاوض بين أعضاء المنظمة.", "تبقى هي اللي بتقرّب بين الناس وتساعدهم يتفاهموا.", 1], ["• Encourage feedback from the receiver to clarify any confusion.", "تشجع إن المستقبل يرجّع رد (Feedback) عشان توضح أي لبس.", "بعد ما تدي تعليمات، تسأل «فهمتي؟» وتخليها تعيد اللي فهمته.", 1]]}, {"id": "unit", "icon": "🏥", "title": "Unit Management", "items": [{"h": "IV. Unit Management :"}, ["There are two organizational patterns through which unit management activities can be achieved; traditional pattern and progressive pattern.", "في نمطين تنظيميين ممكن من خلالهم تتحقق أنشطة إدارة الوحدة: النمط التقليدي (Traditional) والنمط التقدمي (Progressive).", "طريقتين لإدارة الوحدة: القديمة والحديثة."], {"h": "1. The Traditional Pattern:"}, ["The head nurse is responsible for most of the unit activities:-", "الهيد ناس هي المسؤولة عن أغلب أنشطة الوحدة.", "هي اللي بتعمل كل حاجة بنفسها."], ["But there are two main problems aroused from the traditional organization patterns;", "لكن في مشكلتين رئيسيتين نتجوا عن النمط التنظيمي التقليدي:", "النظام ده ليه عيوب."], ["a. It increases the volume of management functions performed by the H.N in the unit.", "أ. بيزوّد حجم الوظائف الإدارية اللي الهيد ناس بتعملها في الوحدة.", "شغل الورق والإدارة بيكتر عليها.", 1], ["b. It decreases, the H.N time spent inpatient care management.", "ب. بيقلل الوقت اللي الهيد ناس بتقضيه في إدارة رعاية المرضى.", "بتفضل مشغولة بالإدارة وتبعد عن المريض.", 1], {"h": "2. The Progressive Organization Pattern:-"}, ["In this pattern, the hospital appoints a unit manager to relieve the head nurse from the management activities.", "في النمط ده، المستشفى بتعين <b>مدير وحدة (Unit manager)</b> عشان يريّح الهيد ناس من الأنشطة الإدارية.", "زي ما تجيب مساعد يشيل عنك الشغل الإداري."], ["The objective of utilizing the unit manager is to keep the activities of the unit functioning in a good way to facilitate medical and nursing care", "الهدف من استخدام مدير الوحدة هو إن أنشطة الوحدة تفضل شغالة بشكل كويس لتسهيل الرعاية الطبية والتمريضية.", "الوحدة تمشي بسلاسة والرعاية تبقى أسهل."], ["The unit manager may have one of three lines relationships to the head nurse depends on the organizational structure of the hospital. So her role is determined according to the relationship as follows:-", "مدير الوحدة ممكن يبقى ليه واحدة من ثلاث علاقات مع الهيد ناس حسب الهيكل التنظيمي للمستشفى. ودوره بيتحدد حسب العلاقة دي كالتالي:", "نفس الوظيفة بتختلف حسب موقعه مقابل الهيد ناس."], {"h": "A. Subordinate relationship of the head nurse :"}, ["The unit manager is responsible to the head nurse.", "مدير الوحدة مسؤول قدام الهيد ناس.", "هو تحتها، وهي رئيسته."], ["The head nurse may still carry some responsibilities for management activities and not completely free for nursing activities.", "الهيد ناس ممكن لسه تشيل بعض مسؤوليات الأنشطة الإدارية، وبالتالي مش متفرغة تمامًا للأنشطة التمريضية.", "لسه عليها شوية إدارة، فمش فاضية للتمريض بنسبة 100%."], {"h": "B. Peer relationship to the head nurse :"}, ["➢ The unit manager will have a staff that she supervises and directs.", "مدير الوحدة هيبقى عنده طاقم بيشرف عليه ويوجهه.", "ليه فريقه الخاص."], ["➢ she will be accountable for the activities assigned to the staff are accomplished correctly and in time.", "هتبقى مسؤولة عن إن الأنشطة المكلف بيها طاقمها تتنفذ بشكل صحيح وفي الوقت المحدد.", "لو شغل فريقها اتأخر أو اتعمل غلط، هي اللي تتحاسب."], ["➢ she will be responsible to the nursing supervisor of the hospital administrator.", "هتبقى مسؤولة قدام المشرفة التمريضية أو إداري المستشفى.", "بتقدم تقريرها للمشرفة أو لإداري المستشفى."], {"h": "C. Superior relation to the head nurse :"}, ["➢ In this relationship the unit manager is one of the hospital's assistant administrators and she is responsible for unit management.", "في العلاقة دي مدير الوحدة هو واحد من مساعدي إداريي المستشفى، وهو المسؤول عن إدارة الوحدة.", "هو أعلى من الهيد ناس في الوحدة."], ["➢ All heads of services on the unit such as nursing, medical, dietary and housekeeping are responsible to the unit manager.", "كل رؤساء الخدمات في الوحدة، زي التمريض والطب والتغذية والنظافة (housekeeping)، مسؤولين قدام مدير الوحدة.", "كل الأقسام اللي في الوحدة بتتبعه."], {"h": "Unit Management Activities"}, {"h": "1- Coordination of patient care services :"}, ["❖ Laboratory reports and operative permits are assured for patients going to surgery (consent is filled in the presence of the physician or the head nurse)", "التأكد من نتايج المعمل وتصاريح العمليات للمرضى اللي رايحين الجراحة (الموافقة (consent) بتتملى بحضور الدكتور أو الهيد ناس).", "قبل عملية، يتأكد إن التحاليل جاهزة والمريض وقّع على الموافقة قدام الدكتور أو الهيد ناس."], ["❖ Discharge orders are prepared", "تجهيز أوامر الخروج (Discharge orders).", "ورق خروج المريض يكون جاهز."], ["❖ Electricians are called when needed at a time decided by the unit manager that will not interfere with patient's rest or the work of staff.", "بيتم استدعاء الكهربائيين عند الحاجة في وقت يحدده مدير الوحدة بحيث ميعطلش راحة المريض أو شغل الطاقم.", "لو في عطل كهربا، ينادي الفني في وقت مناسب مش وقت نوم المرضى أو زحمة الشغل."], {"h": "2- Clerical responsibilities :"}, ["Clerical work varies in different health care organizations but in general it consists of:", "الشغل الكتابي بيختلف من منظمة صحية لأخرى، لكن بشكل عام بيتكون من:", "شغل الورق والمكاتبات."], ["a. Transcribing medical prescriptions.", "أ. نسخ الوصفات الطبية.", "نقل أوامر الدكتور في الملف أو الكاردكس.", 1], ["b. Assembling clinical records.", "ب. تجميع السجلات الإكلينيكية.", "ترتيب ملف المريض وتجميع ورقه.", 1], ["c. Preparing administrative reports.", "ج. تجهيز التقارير الإدارية.", "تقارير عن عدد المرضى وعدد الحالات.", 1], ["d. Handling telephone messages.", "د. التعامل مع الرسائل التليفونية.", "الرد على التليفونات وتسجيل الرسائل.", 1], ["e. Reception of visitors , messages and staff from other departments", "هـ. استقبال الزوار والرسائل والعاملين من الأقسام التانية.", "استقبال أهل المرضى وناس جاية من أقسام تانية.", 1], {"h": "3- Maintenance of supplies and equipment :"}, ["❖ These are non-nursing activities and recently the unit manager assumes this responsibility.", "دي أنشطة غير تمريضية، ومؤخرًا مدير الوحدة هو اللي بيتولى المسؤولية دي.", "شغل المخازن مش تمريض، فاتحط على مدير الوحدة."], ["❖ These activities involve ordering, handling, storage and maintenance of supplies and equipment.", "الأنشطة دي بتشمل طلب المستلزمات والمعدات، والتعامل معاها، وتخزينها، وصيانتها.", "يطلب الجوانتيات والسرنجات ويخزنها ويصلح الأجهزة."], ["❖ Equipment, drugs and all kinds of supplies must be in the right quantity and ready for use at all times in the unit.", "لازم المعدات والأدوية وكل أنواع المستلزمات تكون بالكمية الصحيحة وجاهزة للاستخدام في كل الأوقات في الوحدة.", "مفيش حد ييجي يطلب جهاز أو دوا في الطوارئ ويلاقيه ناقص."], ["❖ Various departments such as laundry, pharmacy and laboratory send representatives to the units to deliver orders according to followed standard the unit manager is responsible for making the requisitions.", "الأقسام المختلفة زي المغسلة والصيدلية والمعمل بتبعت مندوبين للوحدات لتسليم الطلبات، وحسب المعيار المتبع مدير الوحدة هو المسؤول عن عمل طلبات التوريد (requisitions).", "مندوب الصيدلية بيجي بالدوا، ومدير الوحدة هو اللي كان كتب الطلب."], {"h": "4- Dietary and housekeeping services :"}, ["When dietary and housekeeping services are decentralized.", "لما خدمات التغذية والنظافة بتكون لامركزية (decentralized).", "كل وحدة ليها خدماتها الخاصة."], ["Supervision at the unit level is the unit manager's responsibility. A unit dietitian is assigned to the unit and the unit manager supervises him. If a housekeeping supervisor is assigned to the unit, he / she also will be part of the unit manager's staff.", "الإشراف على مستوى الوحدة هو مسؤولية مدير الوحدة. بيتعين أخصائي تغذية للوحدة ومدير الوحدة بيشرف عليه. ولو اتعين مشرف نظافة للوحدة، هو كمان هيبقى جزء من طاقم مدير الوحدة.", "أخصائي التغذية ومشرف النظافة بيتبعوا مدير الوحدة."], ["➢ If dietary and housekeeping services are centralized services, the hospital usually employs trains and assigns the workers to the unit.", "ولو خدمات التغذية والنظافة مركزية (centralized)، المستشفى غالبًا بتوظف العاملين وتدربهم وتعينهم للوحدة.", "المستشفى هي اللي بتوفر العمال وتوزعهم على الوحدات."], {"h": "5- Plant maintenance:"}, ["There is a repair list which includes required repairs are prepared by the unit manager who is responsible for requesting any needed repairs. Then he makes rounds to make sure that the work is completed.", "في قائمة إصلاحات بتشمل الإصلاحات المطلوبة، ومدير الوحدة هو اللي بيجهزها، وهو المسؤول عن طلب أي إصلاحات لازمة. وبعدين بيلف ويمر عشان يتأكد إن الشغل خلص.", "يكتب إن الحنفية بتنقط والسرير محتاج صيانة، ويطلب الإصلاح، وبعدين يمر يتأكد إنه اتصلح."]]}];

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s, si) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    if (it.img) { body += `<figure class="fig"><img src="${FIG_SRC}" alt="${it.cap}"><figcaption>${it.cap}</figcaption></figure>`; return; }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      <div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
