<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:#1e3a8a; --teal:#0e7490; --emerald:#10b981; --gold:#f59e0b;
  --accent:#0e7490; --accent-glow:rgba(14,116,144,0.18); --accent-rgb:14,116,144;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --grad-bar:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b);
  --bg:#f8fafc; --bg2:#eef2f7; --card:#ffffff;
  --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07);
  --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --card:#1c2333;
  --text:#e6edf3; --text2:#b1bac4; --text3:#7d8590;
  --bc:rgba(255,255,255,0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(248,250,252,.93); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(13,17,23,.95); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon {
  width:34px; height:34px; border-radius:8px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:900; box-shadow:0 0 0 2px rgba(245,158,11,.5);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:50px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Outfit',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; border-radius:50%; font-size:15px; }
.theme-btn:hover { border-color:var(--accent); transform:rotate(20deg); }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }
.tool-btn.off { opacity:.55; }

.hero-band {
  margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--gold);
}
.hero-band::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(245,158,11,.22) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(16,185,129,.28) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px;
}
.meta-pill i { color:var(--gold); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:50px; font-size:12px; font-weight:700;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--grad); color:#fff; border-color:transparent; }

.shell { max-width:860px; margin:0 auto; padding:24px 20px 80px; }

/* SECTION */
.sec { margin-bottom:34px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:16px 16px 0 0; border-bottom:3px solid var(--gold);
}
.sec-icon {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:17px; font-weight:900; line-height:1.3; }
.sec-count { margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:50px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.subhead {
  font-size:13px; font-weight:900; color:var(--navy); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--gold);
  border-radius:8px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#7dd3fc; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-radius:14px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.4); box-shadow:0 4px 14px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left:3px solid var(--teal); }
.pt.done { opacity:.55; }

.pt-en {
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px;
  font-size:15px; font-weight:700; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff;
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
}
.pt-n.fig { background:linear-gradient(135deg,#f59e0b,#d97706); font-size:12px; }
.pt-ar {
  padding:12px 16px; font-size:14.5px; line-height:1.9; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:11px; font-weight:900; padding:2px 9px; border-radius:6px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(14,116,144,.12); color:var(--teal); }
[data-theme="dark"] .pt-ar .tag { color:#5eead4; }
.pt-ex {
  padding:12px 16px; font-size:14px; line-height:1.9; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(245,158,11,.07); border-right:4px solid var(--gold);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ex .tag { background:rgba(245,158,11,.2); color:#b45309; }
[data-theme="dark"] .pt-ex .tag { color:#fbbf24; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

/* FIGURES */
.pt-fig { padding:14px; background:#fff; text-align:center; border-top:1px dashed var(--bc); }
.pt-fig img { max-width:100%; height:auto; border-radius:10px; border:1px solid rgba(0,0,0,.1); cursor:zoom-in; }
.pt a { color:var(--accent); word-break:break-all; }
.zoom {
  position:fixed; inset:0; z-index:500; background:rgba(0,0,0,.85);
  display:none; align-items:center; justify-content:center; padding:16px; cursor:zoom-out;
}
.zoom.on { display:flex; }
.zoom img { max-width:100%; max-height:100%; border-radius:10px; background:#fff; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
</style>
</head>

<nav>

const SECTIONS = [

{ id:"def", icon:"📖", title:"Definition of Motivation", items:[
  [`<b>Motivation</b> is defined simply as: Inspire people to work and exert high level of effort toward organizational goal`,
   `الـ Motivation (الدافعية / التحفيز) ببساطة معناها إنك تشجّع الناس يشتغلوا ويبذلوا مجهود عالي عشان يحققوا هدف المنظمة (المستشفى مثلًا).`,
   `رئيسة التمريض بتشجّع الممرضين يشتغلوا بكل طاقتهم عشان المستشفى توصل لهدفها، وهو رعاية مرضى ممتازة.`],
  [`<b>Motivation:</b> The forces either internal or external to a person that arouse enthusiasm and persistence to pursue a certain course of action.`,
   `الدافعية هي القوى اللي جوّه الشخص أو من برّه، اللي بتولّع عنده الحماس وبتخليه مستمر ويكمل في طريق معين.`,
   `ممرضة جواها حب للمهنة (قوة داخلية)، وكمان بتتحفّز بالمكافأة أو الحافز (قوة خارجية)، فالاتنين بيخلّوها متحمسة وتكمّل شغل.`],
  [`<b>Motivation:</b> It is a process of arousing behavior, sustaining behavior &amp; changing behavior in specific course.`,
   `الدافعية عملية بتعمل 3 حاجات: بتثير السلوك (تبدّيه)، وبتحافظ عليه (تخليه مستمر)، وبتغيّره في اتجاه معين.`,
   `ممرض كان بيتأخر، المدير حفّزه فبدأ يحضر بدري (ده إثارة وتغيير للسلوك)، وفضل ملتزم كل يوم (ده الحفاظ على السلوك).`],

  {h:"Process of Motivation"},
  {img:"fig1", en:"The Motivation Process (Gholipour A. 2006. Organizational Behavior. University of Tehran.)",
   ar:`الرسمة دي بتوضح مراحل عملية التحفيز خطوة بخطوة، وبتمشي زي الدايرة:<br>
   <b>1)</b> <b>Unsatisfied Need</b> = في احتياج مش متلبّي.<br>
   <b>2)</b> الاحتياج ده <b>Creates</b> (بيعمل) <b>Tension</b> = توتر وضغط جواك.<br>
   <b>3)</b> التوتر <b>Stimulates</b> (بيحفّز) <b>Drives</b> = دوافع.<br>
   <b>4)</b> الدوافع <b>Generate</b> (بتولّد) <b>Search</b> = بحث وسلوك (Behavior / attitude) عشان تحقق الهدف.<br>
   <b>5)</b> السلوك ده <b>to</b> (بيوصّل) <b>Goal achievement</b> = تحقيق الهدف.<br>
   <b>6)</b> تحقيق الهدف <b>For</b> (عشان) ياخد <b>Rewards "Satisfied Need"</b> = مكافأة، والاحتياج يتشبع.<br>
   <b>7)</b> المكافأة <b>Leads to</b> (بتؤدي إلى) <b>Reduction of Tension</b> = التوتر يقل ويهدا.`,
   ex:`ممرضة محتاجة تثبت نفسها وتتقدّر (Unsatisfied Need) ← بتحس بتوتر (Tension) ← ده بيحرّكها (Drives) ← بتذاكر وتحضر كورسات (Search / Behavior) ← تتقدم للترقية (Goal achievement) ← تاخد الترقية والتقدير (Rewards) ← الاحتياج اتشبع والتوتر راح (Reduction of Tension).`},

  [`Each person has specific needs, drives, aspirations, and capabilities, at varying degrees of intensity, people's basic needs are the same, as illustrated by <b>Abraham Maslow</b> in the following model:`,
   `كل شخص عنده احتياجات ودوافع وطموحات وقدرات معينة وبدرجات شدة مختلفة، لكن الاحتياجات الأساسية عند كل الناس واحدة، زي ما أبراهام ماسلو وضّحها في النموذج اللي جاي.`,
   `كل ممرضين القسم محتاجين أكل وأمان وتقدير، بس واحدة احتياجها للتقدير أقوى من التانية، والاتنين أساس احتياجاتهم واحدة.`]
]},

{ id:"maslow", icon:"🔺", title:"Maslow's Hierarchy of Needs", items:[
  [`Human beings have wants and desires which influence their behavior; only <b>unsatisfied needs</b> can influence behavior, satisfied needs cannot.`,
   `الإنسان عنده رغبات واحتياجات بتأثر على سلوكه، بس الاحتياجات اللي لسه ما اتلبّتش هي اللي بتحرّك السلوك، أما الاحتياج اللي اتلبّى خلاص فمبقاش بيحرّك حاجة.`,
   `لو لسه ما أكلتش، هتفضل تدوّر على أكل (الاحتياج بيحرّكك)، لكن بعد ما تشبع الأكل مش هو اللي هيحرّكك.`],
  [`Since needs are many, they are arranged in order of importance, from the basic to the complex.`,
   `الاحتياجات كتيرة، فبتتـرتّب حسب الأهمية من الأساسي للأعقد.`,
   `الأكل والشرب (أساسي) الأول، وبعدين الأمان، وبعدين الحاجات الأعقد زي تحقيق الذات.`],
  [`The person advances to the next level of needs only after the lower level need is at least <b>minimally satisfied</b>.`,
   `الشخص مبيطلعش للمستوى اللي بعده غير لما المستوى اللي تحته يتشبع بالحد الأدنى على الأقل.`,
   `ممرض مرتبه مش مكفّيه (مستوى أساسي) صعب يفكّر إنه يبدع في شغله أو يطوّر نفسه.`],
  [`The further the progress up the hierarchy, the more <b>individuality, humanness and psychological health</b> a person will show.`,
   `كل ما الشخص يطلع لفوق في الهرم، كل ما بتظهر شخصيته المميزة وإنسانيته وصحته النفسية أكتر.`,
   `شخص وصل لمرحلة تحقيق الذات بيبقى مستقر نفسيًا، شخصيته واضحة ومتزن في تعامله مع الناس.`],

  {h:"Five needs:"},
  [`<b>Physiological:</b> Basic needs of hunger, thirst, shelter, sex and other body needs.`,
   `الاحتياجات الجسمانية: الاحتياجات الأساسية زي الجوع والعطش والمأوى والجنس وباقي احتياجات الجسم.`,
   `الأكل والشرب والنوم وإن يبقى عندك بيت تقعد فيه.`, 1],
  [`<b>Safety:</b> the security of a home and family and protection from physical and emotional harm`,
   `الأمان: إنك تحس بالأمان في بيتك وأسرتك، وتكون محمي من الأذى الجسدي والنفسي.`,
   `وظيفة ثابتة ومرتب مستقر، ومكان شغل مفيهوش خطر أو إهانة عليك.`, 1],
  [`<b>Social:</b> love, affection, belongingness, acceptance and friendship`,
   `الاحتياجات الاجتماعية: الحب والحنان والانتماء والقبول والصداقة.`,
   `إنك تحس إنك جزء من فريق التمريض وزمايلك بيحبوك ويقبلوك.`, 1],
  [`<b>Esteem:</b> Need for both self esteem (self respect, autonomy and achievement which result from competence or mastery of a task) and external esteem (status, recognition and attention)`,
   `التقدير نوعين: <b>تقدير الذات</b> (احترام النفس والاستقلالية والإنجاز اللي بييجي من إنك بتتقن شغلك)، و<b>تقدير خارجي</b> (المكانة والاعتراف بيك واهتمام الناس).`,
   `الأول: ممرضة بتحس بفخر لما تنجح في مهارة صعبة. التاني: رئيسة القسم تشكرها قدام الكل.`, 1],
  [`<b>Self-actualization</b> the drive to become what one is capable of becoming: includes growth, achieving one's potential, self fulfillment.`,
   `تحقيق الذات: الدافع إنك توصل لأقصى اللي تقدر تكونه، ويشمل النمو وتحقيق إمكانياتك والإحساس بالإشباع الذاتي.`,
   `ممرض بيكمّل دراسات عليا ويبقى قائد في مجاله، لأنه عايز يوصل لأقصى قدراته.`, 1],

  {img:"fig2", en:"Maslow's Hierarchy of Needs (original five-stage model)",
   ar:`ده هرم ماسلو، وبيلخّص الخمس احتياجات اللي فاتت. بيتقرأ من <b>تحت لفوق</b>:<br>
   <b>1) تحت خالص (القاعدة):</b> Biological and Physiological needs = الاحتياجات الجسمانية: basic life needs (الهوا، الأكل، الشرب، المأوى، الدفا، الجنس، النوم...).<br>
   <b>2)</b> Safety needs = الأمان: الحماية، الأمان، النظام، القانون، الحدود، الاستقرار...<br>
   <b>3)</b> Belongingness and Love needs = الانتماء والحب: الأسرة، الحنان، العلاقات، مجموعة الشغل...<br>
   <b>4)</b> Esteem needs = التقدير: الإنجاز، المكانة، المسؤولية، السمعة...<br>
   <b>5) فوق خالص (القمة):</b> Self-actualisation = تحقيق الذات: النمو الشخصي والإشباع.<br>
   يعني بتبدأ من الاحتياجات الأساسية اللي تحت وبتطلع لفوق واحدة واحدة.`,
   ex:`مثال على الطلوع في الهرم: ممرض اتعيّن (أكل وسكن) ← بقى عنده وظيفة ثابتة (أمان) ← اتقبّل وسط الفريق (انتماء) ← اتقدّر على شغله (تقدير) ← بدأ يطوّر نفسه ويوصل لأقصى قدراته (تحقيق الذات).`}
]},

{ id:"types", icon:"🧩", title:"Types of Motivation", items:[
  [`There are three main kinds of Motivation: <b>Intrinsic</b>, <b>Extrinsic</b> and <b>Reward</b> motivation.`,
   `في 3 أنواع رئيسية للدافعية: داخلي (Intrinsic)، وخارجي (Extrinsic)، ودافع المكافأة (Reward).`,
   `ممرضة بتشتغل عشان بتحب المهنة (داخلي)، وعشان المرتب (خارجي)، وعشان الحافز الشهري (مكافأة).`],
  [`<b>Intrinsic motivation</b> "power motivation, competence motivation, affiliation motivation"; is internal. It is under control of the person himself. It occurs when people are compelled to do something out of pleasure, importance, or desire. For e.g. responsibility, and job nature are internal motivators.`,
   `الدافع الداخلي (دافع القوة، دافع الكفاءة، دافع الانتماء): بيجي من جوّه الشخص نفسه وتحت سيطرته هو. بيحصل لما الشخص يعمل حاجة عشان بيستمتع بيها أو شايفها مهمة أو عايزها. زي الإحساس بالمسؤولية وطبيعة الشغل نفسه.`,
   `ممرضة بتشتغل في الـ ICU لأنها بتحب تنقذ حياة المرضى وحاسة إن شغلها مهم، ومفيش حد ضاغط عليها.`],
  [`<b>Extrinsic motivation</b> "fear motivation"; occurs when external factors compel the person to do something. It is under the control of others. For e.g. Salary, benefits, working conditions, and supervision are all externally motivated needs.`,
   `الدافع الخارجي (دافع الخوف): بيحصل لما عوامل من برّه تضغط على الشخص يعمل حاجة، وده تحت سيطرة الغير. زي المرتب والمزايا وظروف الشغل والإشراف.`,
   `ممرض بيلتزم بمواعيده عشان خايف من الخصم أو الإنذار، أو عشان المرتب والمزايا.`],
  [`<b>Reward motivation</b> "incentives motivation, achievement motivation"; occurs when the prospect or hope of getting a reward compels people to do something.`,
   `دافع المكافأة (دافع الحوافز، دافع الإنجاز): بيحصل لما توقّع أو أمل إنك تاخد مكافأة يخليك تعمل الحاجة.`,
   `ممرضة بتجتهد وتخلّص شغلها كويس عشان فيه حافز "الموظف المثالي" آخر الشهر.`],
  [`For example: "I will give you a candy bar if you clean your room." This is an example of reward motivation.`,
   `مثال: "هديك حلاوة (شوكولاتة) لو نضّفت أوضتك." ده مثال على دافع المكافأة.`,
   `زي الأم اللي تقول لابنها "لو ذاكرت هجيبلك لعبة"، فهو يذاكر عشان ياخد اللعبة.`, 1]
]},

{ id:"factors", icon:"⚖️", title:"Factors Affecting Motivation", items:[
  {img:"fig3", en:"Factors Affecting Motivation: A. Personal factors / B. Work factors",
   ar:`الرسمة بتقول إن العوامل اللي بتأثر على الدافعية بتنقسم لقسمين:<br>
   <b>A. Personal factors</b> = العوامل الشخصية (اللي تخص الشخص نفسه).<br>
   <b>B. Work factors</b> = عوامل الشغل (اللي تخص بيئة العمل).<br>
   والأسهم بتوضّح إن القسمين دول هما اللي بيشكّلوا العوامل المؤثرة على الدافعية، وهنشرحهم تحت.`,
   ex:null},

  {h:"A. Personal factors:"},
  [`<b>Health status:</b> motivation requires physical and psychomotor energy.`,
   `الحالة الصحية: الدافعية محتاجة طاقة جسدية وحركية (نفسحركية).`,
   `ممرض تعبان أو مرهق من شيفتات كتير حماسه هيبقى قليل.`],
  [`<b>Self – concepts:</b> A person's perception of his / her capabilities influences that person's motivational capacity.`,
   `مفهوم الذات: نظرة الشخص لقدراته بتأثر على قدرته إنه يتحفّز.`,
   `ممرضة واثقة إنها تقدر تتعامل مع الـ CCU هتتحمس تتعلم أكتر من واحدة شايفة نفسها ضعيفة.`],
  [`<b>Relationships:</b> The quality of meaningful relationships can influence an individual's motivation.`,
   `العلاقات: جودة العلاقات المهمة في حياة الشخص بتأثر على دافعيته.`,
   `ممرض أسرته داعماه وزمايله بيحبوه، نفسيته بتبقى أحسن وشغله أنشط.`],
  [`<b>Financial status:</b> Money is a powerful motivator. Sufficient income to meet what individuals perceive as their needs is necessary.`,
   `الحالة المادية: الفلوس دافع قوي، ولازم يبقى فيه دخل كافي يغطّي اللي الشخص شايفه احتياجاته.`,
   `ممرض مرتبه مش مكفّي مصاريفه هيدوّر على شغل تاني وده يقلل تركيزه وحماسه.`],
  [`<b>Opportunities available:</b> When the opportunity to learn and grow in the work situation is lacking motivation is stifled. When people are presents with achievable challenge in their work, they are motivated to raise to the occasion.`,
   `الفرص المتاحة: لو مفيش فرصة تتعلم وتتطور في الشغل، الدافعية بتتخنق. ولما الناس بتتعرض لتحدي ممكن يتحقق، بيتحمسوا ويرتفعوا لمستوى الموقف.`,
   `مستشفى بتدّي الممرضين كورسات وتدريب وفرص ترقّي فيتحمسوا؛ ولو مفيش أي فرصة هيحسّوا بالملل والإحباط.`],

  {h:"B. Work factors:"},
  [`<b>Leadership style:</b> Using leadership style appropriate to specific situations and staff members' experience levels is a positive motivator.`,
   `أسلوب القيادة: استخدام أسلوب قيادة مناسب للموقف ولمستوى خبرة الموظفين بيحفّزهم.`,
   `مع ممرض جديد المدير يوجّه ويشرح خطوة بخطوة، ومع ممرض خبير يدّيه حرية أكتر.`],
  [`<b>Peer relationships:</b> Dissatisfying peer relationship can result in job dissatisfaction and resignations.`,
   `علاقات الزمالة: العلاقة السيئة مع الزمايل ممكن توصل لعدم الرضا الوظيفي والاستقالة.`,
   `ممرضة بتتخانق مع زمايلها كل شيفت ممكن تسيب الشغل خالص.`],
  [`<b>Organization:</b> Adequate staff members, sufficient equipment and available supplies affect motivation.`,
   `التنظيم: وجود عدد كافي من الطاقم، وأجهزة كفاية، ومستلزمات متاحة بيأثر على الدافعية.`,
   `قسم فيه نقص تمريض وأجهزة ناقصة، فالممرضة تحس إنها مش قادرة تشتغل صح وتتحبط.`]
]},

{ id:"importance", icon:"⭐", title:"Importance of Motivation", items:[
  {h:"Motivation is important to an individual as:"},
  [`It keeps the employees cheerful and increase creativity of the employee.`,
   `بتخلّي الموظفين مبسوطين ومتفائلين وبتزوّد إبداعهم.`,
   `ممرضة متحفّزة بتقترح طرق جديدة تسهّل الشغل في القسم.`],
  [`It raises self-respect and raises collaboration, team work among employees.`,
   `بتزوّد احترام الذات، وبتزوّد التعاون والشغل الجماعي بين الموظفين.`,
   `فريق الـ ICU كله بيساعد بعض وقت الحالات الحرجة.`],
  [`Motivation help in self development.`,
   `الدافعية بتساعد في تطوير الذات.`,
   `ممرض متحفّز يسجّل في كورسات ودبلومات يطوّر بيها نفسه.`],
  [`Motivation gives job satisfaction.`,
   `الدافعية بتدّي رضا وظيفي.`,
   `ممرضة حاسة إن شغلها مقدّر، فبتفضل في المستشفى وبتحبها.`],
  [`Improved performance and challenge attitude of the employee.`,
   `بتحسّن الأداء وبتخلّي الموظف عنده روح التحدي.`,
   `ممرض يقبل مهمة صعبة زي مسؤولية قسم بدل ما يتهرب منها.`],

  {h:"In Nursing Management, staff need to be motivated to:"},
  [`have quality patient care,`,
   `عشان نوصل لرعاية مرضى بجودة عالية.`,
   `ممرضة متحفّزة بتراجع الدوا والجرعات بدقة وتهتم بالمريض.`],
  [`to develop staff efficiency`,
   `عشان نطوّر كفاءة الطاقم.`,
   `تدريب دوري وتقدير لللي بيتحسّن، فيزيد مستوى الكل.`],
  [`and to reduce absenteeism.`,
   `وعشان نقلّل الغياب.`,
   `ممرضة بتحب شغلها وبتتقدّر، غياباتها بتقل.`],

  {h:"Motivation is important to an organization as:"},
  [`Each member of organization feels for the company and tries to gives his sincere effort in achieving new goals.`,
   `كل فرد في المنظمة بيحس بيها وبيدّيها مجهود صادق عشان يحقق أهداف جديدة.`,
   `ممرضين يحسّوا إن المستشفى بتاعتهم فيجتهدوا عشان تاخد الاعتماد (Accreditation).`],
  [`Changes can be easily brought in a firm if employees have complete faith on its firm. This happens only when they are motivated regularly.`,
   `التغيير بيتعمل بسهولة لو الموظفين واثقين تمامًا في المنظمة، وده بيحصل بس لما يتحفّزوا بانتظام.`,
   `لو المستشفى عايزة تطبّق نظام تسجيل إلكتروني جديد، الممرضين المتحمسين هيتقبّلوه بسهولة.`],
  [`Productivity is the outcome of performance.`,
   `الإنتاجية هي نتيجة الأداء.`,
   `كل ما أداء الممرضين يتحسّن، عدد المرضى اللي بيتخدموا بجودة بيزيد.`],
  [`It helps to avoid strikes and other such activity that hampers company's production.`,
   `بتساعد نتجنّب الإضرابات وأي نشاط بيعطّل الإنتاج.`,
   `ممرضين راضيين عن حقوقهم مش هيعملوا إضراب يوقّف خدمة المرضى.`]
]},

{ id:"techniques", icon:"🛠️", title:"Motivational Techniques", items:[
  [`Nursing Manager can accomplish this by using &amp; motivational techniques:`,
   `مدير التمريض يقدر يحقق ده باستخدام أساليب التحفيز دي:`,
   `رئيسة القسم بتستخدم الأساليب الجاية مع فريقها عشان ترفع حماسهم.`],
  [`<b>Positive Reinforcement:</b> Annual reward for better performance in the form of money, recognition, praise, promotion …. etc.`,
   `التعزيز الإيجابي: مكافأة سنوية على الأداء الأحسن، في شكل فلوس أو تقدير أو مدح أو ترقية وغيره.`,
   `ممرضة ممتازة تاخد مكافأة مالية وشهادة تقدير وترقية آخر السنة.`, 1],
  [`<b>Avoidance Learning:</b> Some staff nurses improve their behavior in order to avoid criticism of Nursing.`,
   `التعلّم بالتجنّب: بعض الممرضين بيحسّنوا سلوكهم عشان يتجنّبوا انتقاد التمريض (الإدارة).`,
   `ممرض بيحضر بدري ويكمّل ملفاته عشان ميتنقدش من رئيسة القسم.`, 1],
  [`<b>Punishment:</b> Nursing Superintendent, for example, can withhold reward or promotion so as to change the behavior of staff.`,
   `العقاب: مشرف التمريض مثلًا ممكن يمنع المكافأة أو الترقية عشان يغيّر سلوك الموظفين.`,
   `ممرض غيابه متكرر ممكن تتأجّل ترقيته لحد ما يلتزم.`, 1],
  [`Making the staff participate in different activities which give them affiliation, acceptance and recognition, e.g. in conferences, Nurses'-Day, Hospital Annual Day….. etc.`,
   `إشراك الطاقم في أنشطة مختلفة بتدّيهم انتماء وقبول وتقدير، زي المؤتمرات ويوم التمريض واليوم السنوي للمستشفى وغيره.`,
   `ممرضة تشارك في احتفال يوم التمريض وتتكرّم، فتحس إنها جزء من الفريق.`, 1],
  [`Giving feeling of personal responsibility or keeping interactions. The newly appointed staff should be left independent but be observed closely.`,
   `إدّي الموظف إحساس بالمسؤولية الشخصية أو حافظ على التفاعل. والموظف الجديد يتساب يشتغل باستقلالية لكن تحت ملاحظة قريبة.`,
   `ممرضة جديدة تتولّى مريضين بنفسها، ورئيسة الشيفت تراقبها من قريب وتتدخل لو احتاجت.`, 1]
]},

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    if (it.img) {
      body += `<div class="pt">
        <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n fig"><i class="fa-solid fa-image"></i></div><div>${it.en}</div></div>
        <div class="pt-fig"><img src="${FIGS[it.img]}" alt="${it.en.replace(/"/g,'')}" onclick="openZoom(this.src)"></div>
        <div class="pt-ar"><span class="tag">شرح الصورة</span><br>${it.ar}</div>
        ${it.ex ? `<div class="pt-ex"><span class="tag">عشان تفهمها</span>${it.ex}</div>` : ''}
      </div>`;
      return;
    }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      ${it[2] ? `<div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>` : ''}
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* image zoom */
const zoom = document.getElementById('zoom');
function openZoom(src) { document.getElementById('zoomImg').src = src; zoom.classList.add('on'); }
zoom.addEventListener('click', () => zoom.classList.remove('on'));

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
