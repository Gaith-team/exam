<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1e3a8a;--teal:#0e7490;--emerald:#10b981;--gold:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --bg:#f8fafc;--bg2:#eef2f7;--card:#fff;--text:#1a2332;--text2:#4a5568;--text3:#718096;--bc:rgba(0,0,0,.09);
}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.1)}
html{scroll-behavior:smooth}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:var(--grad);color:#fff;border-bottom:3px solid var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px}
.logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.top-r{display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.tbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.15);color:#fff;font-size:15px}

.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 110px}

/* start */
.start{max-width:640px;margin:30px auto;background:var(--card);border:1px solid var(--bc);border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07)}
.start-h{background:var(--grad);color:#fff;text-align:center;padding:30px 20px;border-bottom:4px solid var(--gold)}
.start-h .ic{font-size:38px;margin-bottom:8px}
.start-h h1{font-size:24px;font-weight:900}
.start-h p{font-size:13px;opacity:.9;margin-top:4px}
.start-b{padding:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--bg2);border-radius:12px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--teal)}
.stat span{font-size:11px;color:var(--text3);font-weight:700}
.opt-row{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--bc);font-weight:700;font-size:14px}
.sw{position:relative;width:46px;height:26px}
.sw input{display:none}
.sw i{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;transition:.2s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:var(--teal)}
.sw input:checked+i::after{left:23px}
.big{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:var(--grad);color:#fff;font-size:16px;font-weight:900;box-shadow:0 6px 18px rgba(14,116,144,.3)}
.big:hover{filter:brightness(1.08)}

/* exam */
.exam{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
.qcard{background:var(--card);border:1px solid var(--bc);border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05)}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--bc);font-weight:800;font-size:14px}
.qtype{font-size:11px;font-weight:900;padding:3px 10px;border-radius:50px;background:rgba(14,116,144,.15);color:var(--teal)}
.qtype.case{background:rgba(245,158,11,.2);color:#b45309}
.qtype.tf{background:rgba(139,92,246,.18);color:var(--purple)}
.qbody{padding:22px 20px}
.qtext{font-size:17px;font-weight:700;line-height:1.7;margin-bottom:18px}
.opts{display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--bc);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;font-weight:600;line-height:1.5;transition:.2s}
.op:hover{border-color:var(--teal);transform:translateX(3px)}
.op .l{min-width:30px;height:30px;border-radius:8px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--text2);flex-shrink:0}
.op.sel{border-color:var(--teal);background:rgba(14,116,144,.1)}
.op.sel .l{background:var(--grad);color:#fff}

.side{background:var(--card);border:1px solid var(--bc);border-radius:18px;padding:16px;position:sticky;top:76px}
.side h3{font-size:14px;font-weight:900;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;max-height:300px;overflow:auto;padding:2px}
.nb{aspect-ratio:1;border-radius:8px;border:2px solid var(--bc);background:var(--bg2);color:var(--text2);font-weight:800;font-size:12px}
.nb.vis{background:rgba(239,68,68,.14);border-color:rgba(239,68,68,.5);color:var(--red)}
.nb.done{background:var(--emerald);border-color:var(--emerald);color:#fff}
.nb.mk{background:var(--purple);border-color:var(--purple);color:#fff}
.nb.cur{box-shadow:0 0 0 3px var(--gold)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px;font-size:11px;font-weight:700;color:var(--text2)}
.legend span::before{content:'';display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.endbtn{width:100%;margin-top:14px;padding:11px;border:none;border-radius:10px;background:var(--red);color:#fff;font-weight:900;font-size:14px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--bc);padding:10px 14px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.ab{padding:11px 20px;border-radius:10px;border:2px solid var(--bc);background:var(--bg);color:var(--text);font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px}
.ab:hover{border-color:var(--teal);color:var(--teal)}
.ab.pri{background:var(--grad);border-color:transparent;color:#fff}
.ab.pri:hover{color:#fff;filter:brightness(1.08)}
.ab.mk.on{background:var(--purple);border-color:var(--purple);color:#fff}

/* results */
.res{max-width:820px;margin:0 auto}
.rhero{background:var(--card);border:1px solid var(--bc);border-radius:20px;padding:26px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.ring{width:150px;height:150px;margin:0 auto 12px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900}
.rmsg{font-size:18px;font-weight:900;margin-bottom:12px}
.rst{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.rst div{background:var(--bg2);border-radius:12px;padding:10px 18px;font-size:12px;font-weight:700;color:var(--text3)}
.rst b{display:block;font-size:20px;color:var(--text)}
.ract{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sech{margin:26px 0 10px;font-size:16px;font-weight:900;display:flex;align-items:center;gap:8px}
.sech.ok{color:var(--emerald)}.sech.bad{color:var(--red)}
.ri{background:var(--card);border:1px solid var(--bc);border-left:5px solid var(--emerald);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.ri.w{border-left-color:var(--red)}
.ri .q{font-weight:700;line-height:1.6;margin-bottom:8px;font-size:14.5px}
.ri .n{font-size:11px;font-weight:900;color:var(--text3);margin-bottom:4px}
.ri .a{font-size:13.5px;line-height:1.7;color:var(--text2)}
.ri .a b.g{color:var(--emerald)}.ri .a b.r{color:var(--red)}

.toast{position:fixed;top:74px;left:50%;transform:translateX(-50%);background:#1a2332;color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1}

@media(max-width:820px){
  .exam{grid-template-columns:1fr}
  .side{position:static}
  .grid{grid-template-columns:repeat(8,1fr)}
  .ab{padding:10px 12px;font-size:13px}
  .brand span{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><div class="logo">GT</div><span>GHAITH TEAM</span></div>
  <div class="top-r">
    <div class="pill hide" id="timerPill"><i class="fa-regular fa-clock"></i><span id="timer">00:00</span></div>
    <button class="tbtn" id="themeBtn">🌙</button>
  </div>
</div>

<div class="wrap">

  <!-- START -->
  <div class="start" id="startScr">
    <div class="start-h">
      <div class="ic">🔄</div>
      <h1>Planning Continuity of Patient Care</h1>
      <p>Nursing Management — Exam Practice</p>
    </div>
    <div class="start-b">
      <div class="stats">
        <div class="stat"><b id="cAll">0</b><span>Total</span></div>
        <div class="stat"><b id="cMcq">0</b><span>MCQ</span></div>
        <div class="stat"><b id="cTf">0</b><span>True / False</span></div>
        <div class="stat"><b id="cCase">0</b><span>Case</span></div>
      </div>
      <div class="opt-row"><span>Shuffle questions</span><label class="sw"><input type="checkbox" id="shuf"><i></i></label></div>
      <div class="opt-row"><span>Show timer</span><label class="sw"><input type="checkbox" id="tmr" checked><i></i></label></div>
      <button class="big" id="startBtn"><i class="fa-solid fa-play"></i> Start Test</button>
    </div>
  </div>

  <!-- EXAM -->
  <div class="exam hide" id="examScr">
    <div class="qcard">
      <div class="qhead"><span id="qnum">Question 1 of 60</span><span class="qtype" id="qtype">MCQ</span></div>
      <div class="qbody">
        <div class="qtext" id="qtext"></div>
        <div class="opts" id="opts"></div>
      </div>
    </div>
    <aside class="side">
      <h3><i class="fa-solid fa-table-cells"></i> Question Navigator</h3>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span style="--c:var(--emerald)">Answered</span>
        <span style="--c:rgba(239,68,68,.5)">Not answered</span>
        <span style="--c:var(--purple)">Marked</span>
        <span style="--c:var(--bg2);">Not visited</span>
      </div>
      <button class="endbtn" id="endBtn"><i class="fa-solid fa-flag-checkered"></i> End Test</button>
    </aside>
  </div>

  <!-- RESULTS -->
  <div class="res hide" id="resScr"></div>
</div>

<div class="bar hide" id="bar">
  <button class="ab" id="prevBtn"><i class="fa-solid fa-arrow-left"></i> Previous</button>
  <button class="ab mk" id="markBtn"><i class="fa-regular fa-bookmark"></i> Mark for Review</button>
  <button class="ab" id="skipBtn">Skip <i class="fa-solid fa-forward"></i></button>
  <button class="ab pri" id="saveBtn">Save &amp; Next <i class="fa-solid fa-arrow-right"></i></button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===================== QUESTIONS ===================== */

/* ---- 35 Multiple Choice (easy → hard) ---- */
const MCQ = [
{t:"Continuity of care is primarily concerned with quality of care over:", o:["A single hospital visit","Time","Cost only","The size of the hospital"], a:1},
{t:"The process of managing patient care from the primary care contact through preadmission, admission, in-patient care, discharge and follow-up/maintenance is called:", o:["Care coordination","Nursing conference","Planning continuity of patient care","Progress record"], a:2},
{t:"A proactive approach to bringing together care professionals and providers to ensure integrated, person-focused care across various settings is:", o:["Care coordination","Nursing care plan","Kardex review","Nursing conference"], a:0},
{t:"How many domains of continuity are included in the new framework?", o:["2","3","4","5"], a:2},
{t:"Which domain of continuity describes the subjective experience of the caring relationship between a patient and a health care professional?", o:["Longitudinal continuity","Interpersonal continuity","Management continuity","Informational continuity"], a:1},
{t:"A history of interaction with the same health care professional in a series of discrete episodes is known as:", o:["Interpersonal continuity","Informational continuity","Management continuity","Longitudinal continuity"], a:3},
{t:"Availability of clinical and psychosocial information at all encounters with professionals is called:", o:["Informational continuity","Longitudinal continuity","Interpersonal continuity","Management continuity"], a:0},
{t:"Effective collaboration of teams across care boundaries to provide seamless care is:", o:["Interpersonal continuity","Longitudinal continuity","Management continuity","Informational continuity"], a:2},
{t:"When does planning for discharge start?", o:["24 hours before discharge","At first contact with the hospital, on or before admission","When the physician writes the discharge order","After the patient's condition becomes stable"], a:1},
{t:"Which of the following is an expected benefit of good continuity of care planning?", o:["Increased readmission rates","Longer length of stay","Greater duplication of effort","Reduced readmission rates"], a:3},
{t:"Continuity of care planning is for:", o:["Only chronic patients","Only elderly patients","All patients, with the extent of planning related to the complexity of need","Only surgical patients"], a:2},
{t:"Which patients require more comprehensive care planning and coordination?", o:["Patients with chronic/complex care needs","Healthy patients attending a routine check","Patients with minor injuries only","All patients equally"], a:0},
{t:"The two types of continuity of care are:", o:["Relationship continuity and management continuity","Informational continuity and longitudinal continuity","Direction continuity and content continuity","Planning continuity and evaluation continuity"], a:0},
{t:"Which of the following is an advantage of relationship continuity?", o:["Delayed diagnosis","Increased costs","Increased security and trust, improving adherence to long-term preventive regimens","Encouraging collusion"], a:2},
{t:"Which of the following is a risk of relationship continuity?", o:["Improved problem recognition","Delayed diagnosis because a fresh clinician may bring new diagnostic perspectives","Enhanced loyalty","Reduced conflicts of responsibility for clinicians"], a:1},
{t:"Which pair represents the methods of planning continuity of patient care?", o:["Nursing conference and nursing care plan","Nursing audit and triage","Kardex and rounds only","Assessment and evaluation only"], a:0},
{t:"A nursing conference is best defined as:", o:["A written record of goals and objectives of care","A meeting of nursing staff for planning nursing care, organizing the day's work and acquainting all members with new information","A record of the patient's day-to-day progress","A form for the patient's health history"], a:1},
{t:"How many types of nursing conference are described?", o:["3","4","6","5"], a:3},
{t:"The direction-giving conference (on duty) is held:", o:["At the end of the shift","During night shifts only","At the beginning of the work shift","Only when a problem arises"], a:2},
{t:"The conference in which problems of patient care are discussed and evaluated, with emphasis on patient needs and planning the needed nursing care, is the:", o:["Patient-centered conference","Content conference","General problem conference","Direction-giving conference"], a:0},
{t:"The conference that provides the input of knowledge needed to enable staff to perform their work effectively is the:", o:["Reporting conference","Content conference","General problem conference","Direction-giving conference"], a:1},
{t:"Which of the following is NOT a goal of the reporting conference (off duty)?", o:["To report accurately and objectively relevant information about the patient","To evaluate the care in the light of the objectives","To update the nursing care plan to ensure continuity of care","To communicate job assignments"], a:3},
{t:"Coordinating all the available services during a conference is the responsibility of the:", o:["Hospital director","Pharmacist","Patient's relatives","Team leader"], a:3},
{t:"A nursing care plan is:", o:["An oral report given at shift change","A written record of goals and objectives of care with a summary of definite nursing measures","The doctor's order sheet","The discharge summary"], a:1},
{t:"Which of the following is NOT a purpose of the nursing care plan?", o:["To indicate the objectives of nursing intervention","To provide a means of communication","To provide a basis for evaluating nursing care","To replace the doctors' orders"], a:3},
{t:"Which of the following should NOT be included in the nursing care plan?", o:["Suggestions for possible solutions to the problems","Problems concerning information to be given to the patient and relatives","Confidential information about the patient","Problems affecting nursing procedures for a particular patient"], a:2},
{t:"What is the correct sequence of the four steps of the care plan?", o:["Assessment, Planning, Implementation, Evaluation","Planning, Assessment, Evaluation, Implementation","Implementation, Assessment, Planning, Evaluation","Assessment, Implementation, Planning, Evaluation"], a:0},
{t:"The assessment step includes:", o:["Setting goals according to priority","Carrying out nursing instructions","Collection and interpretation of information","Measuring whether goals were met"], a:2},
{t:"According to the lecture, a problem arises when:", o:["A person responds to his environment","A conflict occurs between one or more needs as a result of the patient's disease","The nurse writes the care plan","The patient is admitted to the hospital"], a:1},
{t:"Maslow's hierarchy of needs groups needs into how many categories?", o:["3","4","5","7"], a:2},
{t:"In which planning technique does the nurse list the patient's strengths and weaknesses and use the strengths to overcome the weaknesses?", o:["Health strengths and limitations","Maslow's hierarchy of needs","Nursing problems","Kardex"], a:0},
{t:"Which statement about evaluation is correct?", o:["It is the first step of the care plan","It is the last step, determines whether care is effective, and is a continuing process","It is the same as implementation","It is done only at discharge"], a:1},
{t:"The nursing care plan is kept up to date at all of the following EXCEPT:", o:["During rounds","When reviewing the kardex","When shift report is given","During the annual hospital accreditation"], a:3},
{t:"Three patients: one is nauseated and refuses fluids, one cannot drink after oral surgery, and one is on limited fluids but drinks excessively. What do they share and how do they differ?", o:["Same need (nutrition) and same cause","Same problem (elimination) but different needs","Same need (rest) but different causes","Same need and problem (fluid intake), but the cause differs in each"], a:3},
{t:"All of the following are part of the planning step EXCEPT:", o:["Setting goals (expected outcome) considering priority","Deciding what nursing care will meet the goals and writing instructions","Deciding when to review or evaluate each problem","Carrying out the nursing instructions"], a:3}
];

/* ---- 15 True / False (0 = True, 1 = False) ---- */
const TF = [
{t:"Continuity of care is concerned with quality of care over time.", o:["True","False"], a:0},
{t:"Planning for discharge begins on the day of discharge.", o:["True","False"], a:1},
{t:"Longitudinal continuity refers to a history of interaction with the same health care professional in a series of discrete episodes.", o:["True","False"], a:0},
{t:"Continuity of care planning is only for patients with chronic illness.", o:["True","False"], a:1},
{t:"Informational continuity refers to the subjective experience of the caring relationship between a patient and a professional.", o:["True","False"], a:1},
{t:"Relationship continuity can increase the patient's willingness to accept medical advice and adhere to long-term preventive regimens.", o:["True","False"], a:0},
{t:"Delayed diagnosis is one of the possible risks of relationship continuity.", o:["True","False"], a:0},
{t:"The direction-giving conference is held off duty at the end of the shift.", o:["True","False"], a:1},
{t:"One goal of the reporting conference is to update the nursing care plan to ensure continuity of care.", o:["True","False"], a:0},
{t:"The nursing care plan should include confidential information about the patient.", o:["True","False"], a:1},
{t:"The plan should include suggestions that repeat hospital routine or doctors' orders.", o:["True","False"], a:1},
{t:"Needs and problems are identical, and one never grows out of the other.", o:["True","False"], a:1},
{t:"The nursing conference is the only practical means whereby everyone's ideas, observations and suggestions can be combined and the best ones selected.", o:["True","False"], a:0},
{t:"Evaluation is the last step in planning nursing care and is a continuing process.", o:["True","False"], a:0},
{t:"The progress record is the final part of the nursing care plan.", o:["True","False"], a:0}
];

/* ---- 10 Case Questions (easy → hard) ---- */
const CASE = [
{t:"Mrs. A, 68 years old with heart failure, is admitted through the emergency department. On the day of admission, the nurse asks who will help her at home and which community services she may need. Which principle is the nurse applying?", o:["Discharge planning starts at first contact with the hospital, on or before admission","Discharge planning starts only on the day of discharge","Discharge planning starts after the patient is stabilized","Discharge planning is the family's responsibility only"], a:0},
{t:"Mr. K, a diabetic patient, has been followed by the same doctor and nurse for several years. He trusts them, follows their advice and takes his long-term medication regularly. Which benefit of relationship continuity does this illustrate?", o:["Delayed diagnosis","Increased security and trust leading to better adherence","Reduced conformity to professional standards","Encouraging collusion"], a:1},
{t:"At the end of the shift, the nurses give a progressive report about the day's activities, evaluate the care against the objectives and update the nursing care plan. Which type of conference is this?", o:["Direction-giving conference","Reporting conference (off duty)","Content conference","General problem conference"], a:1},
{t:"At the beginning of the shift, the team leader gathers the nurses, hands out the assignment worksheet, explains each nurse's area of responsibility and warns them about a patient with a new allergy. Which type of conference is this?", o:["Direction-giving conference (on duty)","Reporting conference","Content conference","Patient-centered conference"], a:0},
{t:"A patient is transferred from the ICU to the ward. The receiving nurse cannot find the patient's allergies, diet or social background in the chart. Which domain of continuity has failed?", o:["Interpersonal continuity","Longitudinal continuity","Management continuity","Informational continuity"], a:3},
{t:"Nurses complain about shortage of supplies and heavy workload. The team meets so that every member can express ideas about the work situation and try to solve the problem. Which conference is this?", o:["Content conference","Patient-centered conference","Direction-giving conference","General problem conference"], a:3},
{t:"After giving the prescribed analgesic and repositioning the patient, the nurse reassesses the pain one hour later to see whether the goal \"pain relieved\" was achieved. Which step of the care plan is the nurse performing?", o:["Assessment","Evaluation","Implementation","Planning"], a:1},
{t:"Three patients all have a fluid-intake problem, but the first is nauseated, the second has had oral surgery, and the third insists on drinking too much. The nurse writes a different plan for each. Which principle supports this?", o:["Plans should be copied from hospital routine","Needs and problems are identical in every patient","The situation must be specific to the cause and individualized for the patient","The cause of the problem is irrelevant to the plan"], a:2},
{t:"A diabetic patient understands his diet and is eager to learn, but he is afraid of injections. The nurse plans to use his eagerness to learn in order to help him overcome his fear. Which planning technique is being used?", o:["Health strengths and limitations","Maslow's hierarchy of needs","Nursing problems","Kardex review"], a:0},
{t:"A nurse is writing a nursing care plan. Which of the following entries should NOT be included?", o:["Patient is anxious about procedures; reassure before each one","Relatives need information about home care","Patient has difficulty sleeping; plan measures to promote rest","\"Take the temperature every morning,\" which is already the hospital routine"], a:3}
];

/* ===================== ENGINE ===================== */
const ALL = [
  ...MCQ.map(q => ({...q, k:'MCQ'})),
  ...TF.map(q => ({...q, k:'T/F'})),
  ...CASE.map(q => ({...q, k:'Case'}))
];
const $ = id => document.getElementById(id);
let Q = [], cur = 0, ans = [], sel = [], marked = [], visited = [], secs = 0, tInt = null, showTimer = true;

$('cAll').textContent = ALL.length;
$('cMcq').textContent = MCQ.length;
$('cTf').textContent = TF.length;
$('cCase').textContent = CASE.length;

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function begin(list, doShuffle){
  Q = list.slice();
  if (doShuffle) shuffle(Q);
  cur = 0; secs = 0;
  ans = Q.map(()=>null); sel = Q.map(()=>null); marked = Q.map(()=>false); visited = Q.map(()=>false);
  $('startScr').classList.add('hide'); $('resScr').classList.add('hide');
  $('examScr').classList.remove('hide'); $('bar').classList.remove('hide');
  $('timerPill').classList.toggle('hide', !showTimer);
  clearInterval(tInt);
  $('timer').textContent = '00:00';
  tInt = setInterval(()=>{ secs++; $('timer').textContent = fmt(secs); }, 1000);
  window.scrollTo(0,0);
  show(0);
}

function show(i){
  cur = i; visited[i] = true;
  const q = Q[i];
  $('qnum').textContent = 'Question ' + (i+1) + ' of ' + Q.length;
  const ty = $('qtype');
  ty.textContent = q.k === 'MCQ' ? 'Multiple Choice' : q.k === 'T/F' ? 'True / False' : 'Case Study';
  ty.className = 'qtype' + (q.k === 'T/F' ? ' tf' : q.k === 'Case' ? ' case' : '');
  $('qtext').textContent = q.t;
  const box = $('opts'); box.innerHTML = '';
  q.o.forEach((txt, k) => {
    const b = document.createElement('button');
    b.className = 'op' + (sel[i] === k ? ' sel' : '');
    b.innerHTML = '<span class="l">' + 'ABCD'[k] + '</span><span></span>';
    b.lastChild.textContent = txt;
    b.onclick = () => { sel[i] = k; [...box.children].forEach((c,j)=>c.classList.toggle('sel', j===k)); drawGrid(); };
    box.appendChild(b);
  });
  const mb = $('markBtn');
  mb.classList.toggle('on', marked[i]);
  mb.innerHTML = marked[i] ? '<i class="fa-solid fa-bookmark"></i> Marked' : '<i class="fa-regular fa-bookmark"></i> Mark for Review';
  $('prevBtn').style.opacity = i === 0 ? .45 : 1;
  drawGrid();
}

function drawGrid(){
  const g = $('grid'); g.innerHTML = '';
  Q.forEach((_, i) => {
    const b = document.createElement('button');
    let c = 'nb';
    if (marked[i]) c += ' mk';
    else if (ans[i] !== null) c += ' done';
    else if (visited[i]) c += ' vis';
    if (i === cur) c += ' cur';
    b.className = c; b.textContent = i + 1;
    b.onclick = () => show(i);
    g.appendChild(b);
  });
}

function firstUnanswered(from){
  for (let i = from; i < Q.length; i++) if (ans[i] === null) return i;
  return -1;
}

function saveNext(){
  if (sel[cur] === null){ toast('Please select an answer first'); return; }
  ans[cur] = sel[cur];
  let n = firstUnanswered(cur + 1);
  if (n === -1) n = firstUnanswered(0);   // after the last question, jump back to the first unanswered
  if (n === -1){ drawGrid(); toast('All questions answered — press End Test'); return; }
  show(n);
}
function skip(){
  if (cur < Q.length - 1) show(cur + 1);
  else { const n = firstUnanswered(0); show(n === -1 ? 0 : n); }
}
function prev(){ if (cur > 0) show(cur - 1); }
function mark(){ marked[cur] = !marked[cur]; show(cur); }

function endTest(){
  const un = ans.filter((a,i)=>a===null && sel[i]===null).length;
  const msg = un ? 'You still have ' + un + ' unanswered question(s). End the test now?' : 'End the test and see your results?';
  if (!confirm(msg)) return;
  Q.forEach((_, i) => { if (ans[i] === null && sel[i] !== null) ans[i] = sel[i]; });
  clearInterval(tInt);
  results();
}

function results(){
  $('examScr').classList.add('hide'); $('bar').classList.add('hide'); $('timerPill').classList.add('hide');
  const R = $('resScr'); R.classList.remove('hide');
  const ok = [], bad = [];
  Q.forEach((q, i) => (ans[i] === q.a ? ok : bad).push(i));
  const pct = Math.round(ok.length / Q.length * 100);
  const C = 2 * Math.PI * 62;
  const col = pct >= 75 ? '#10b981' : pct >= 50 ? '#f59e0b' : '#ef4444';
  const msg = pct >= 90 ? 'Excellent work! 🏆' : pct >= 75 ? 'Very good! 👏' : pct >= 50 ? 'Good effort — keep reviewing 📚' : 'Needs more revision 💪';
  const item = (i, good) => {
    const q = Q[i];
    const mine = ans[i] === null ? '<b class="r">Not answered</b>' : '<b class="' + (good ? 'g' : 'r') + '">' + 'ABCD'[ans[i]] + '. ' + esc(q.o[ans[i]]) + '</b>';
    return '<div class="ri' + (good ? '' : ' w') + '"><div class="n">Q' + (i+1) + ' • ' + q.k + '</div><div class="q">' + esc(q.t) + '</div><div class="a">' +
      (good ? 'Your answer: ' + mine : 'Your answer: ' + mine + '<br>Correct answer: <b class="g">' + 'ABCD'[q.a] + '. ' + esc(q.o[q.a]) + '</b>') + '</div></div>';
  };
  R.innerHTML =
    '<div class="rhero"><div class="ring"><svg width="150" height="150"><circle cx="75" cy="75" r="62" fill="none" stroke="rgba(128,128,128,.2)" stroke-width="12"/>' +
    '<circle cx="75" cy="75" r="62" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + C + '" stroke-dashoffset="' + (C - C * pct / 100) + '"/></svg><b>' + pct + '%</b></div>' +
    '<div class="rmsg">' + msg + '</div>' +
    '<div class="rst"><div><b>' + ok.length + '</b>Correct</div><div><b>' + bad.length + '</b>Wrong</div><div><b>' + Q.length + '</b>Total</div><div><b>' + fmt(secs) + '</b>Time</div></div>' +
    '<div class="ract">' + (bad.length ? '<button class="ab pri" id="retryBtn"><i class="fa-solid fa-rotate-right"></i> Retry Wrong (' + bad.length + ')</button>' : '') +
    '<button class="ab" id="againBtn"><i class="fa-solid fa-house"></i> Back to Start</button></div></div>' +
    '<div class="sech ok"><i class="fa-solid fa-circle-check"></i> Correct Answers (' + ok.length + ')</div>' + ok.map(i => item(i, true)).join('') +
    '<div class="sech bad"><i class="fa-solid fa-circle-xmark"></i> Wrong Answers (' + bad.length + ')</div>' + bad.map(i => item(i, false)).join('');
  window.scrollTo(0, 0);
  if ($('retryBtn')) $('retryBtn').onclick = () => begin(bad.map(i => Q[i]), false);
  $('againBtn').onclick = () => { R.classList.add('hide'); $('startScr').classList.remove('hide'); };
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

$('startBtn').onclick = () => { showTimer = $('tmr').checked; begin(ALL, $('shuf').checked); };
$('saveBtn').onclick = saveNext;
$('skipBtn').onclick = skip;
$('prevBtn').onclick = prev;
$('markBtn').onclick = mark;
$('endBtn').onclick = endTest;

/* theme */
const themeBtn = $('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t){
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');
</script>
</body>
</html>
