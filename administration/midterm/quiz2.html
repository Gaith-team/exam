<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0e7490;--teal-d:#1e3a8a;--blue:#eef2f7;--bd:#d3dbe6;--ok:#16a34a;--no:#dc2626;--rev:#1e3a8a;--txt:#1a2332;--grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%)}
body{font-family:'Outfit',Arial,sans-serif;background:#f8fafc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative;border-bottom:4px solid #f59e0b}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#1e3a8a;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#1e3a8a;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#f59e0b;color:#3b2a00}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef2f7}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #f59e0b;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef2f7;border-top:3px solid transparent;border-image:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b) 1;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← رجوع</a>Nursing Management<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">30:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
  {t:"The educational qualification REQUIRED for a nursing director is:", o:["Master's degree", "Diploma in nursing", "Doctorate degree", "Bachelor of Science degree"], a:3},
  {t:"Global warming is generally due to:", o:["Variations in the solar cycle only", "The greenhouse effect caused by increased carbon dioxide and other pollutants", "A decrease in sea levels", "An increase in forest areas"], a:1},
  {t:"The head nurse is responsible TO:", o:["The nurse supervisor and the nursing service director", "Nurses' aides and work clerks", "Practical nurses only", "The shareholders and the public"], a:0},
  {t:"The two basic types of marketing are:", o:["Internal and external", "Public and private", "Direct and indirect", "Local and global"], a:0},
  {t:"A change agent is:", o:["A person or group who helps move from the current state to a desired future state", "A person who resists any new idea", "Only the hospital owner", "A staff member who avoids participation"], a:0},
  {t:"Authority is best defined as:", o:["The ability to charm followers", "A personal trait only", "The right to take final decisions and command the action of others", "Expertise in a field only"], a:2},
  {t:"Which is a professional qualification of the staff nurse?", o:["A master's degree in administration", "Ten years of supervisory experience", "Licensure and membership in the nursing syndicate", "Compulsory past experience in all units"], a:2},
  {t:"Which duty is part of the director's EVALUATION role?", o:["Conducting monthly management meetings", "Submitting a monthly report on nursing service progress to the administrator", "Developing job descriptions", "Making nursing rounds to assess care"], a:1},
  {t:"Accidental change is:", o:["Proactive and deliberate", "Based on long-term planning", "Led only by the change agent's vision", "Reactive, crisis driven and short lived"], a:3},
  {t:"Internal marketing means:", o:["Advertising to the community", "Attracting, developing, motivating and retaining qualified employees", "Promoting services to patients only", "Selling products to competitors"], a:1},
  {t:"Staff management by the head nurse includes:", o:["Liaison, networking, support and conflict", "Utilization, supervision, evaluation and development", "Assessment, diagnosis, planning and control", "Traditional and progressive patterns"], a:1},
  {t:"The educational qualification of the head nurse is:", o:["Diploma in nursing only", "Master's degree is mandatory", "Any health sciences degree", "BSc in nursing with advanced preparation in nursing administration"], a:3},
  {t:"Which of the following is a type of PERSONAL power?", o:["Reward power", "Referent power", "Legitimate power", "Coercive power"], a:1},
  {t:"Power based on the ability to deny rewards or administer punishments is:", o:["Coercive power", "Reward power", "Representative power", "Expert power"], a:0},
  {t:"Lippitt's theory of change consists of how many phases?", o:["Three", "Five", "Six", "Seven"], a:3},
  {t:"The logical persuasion strategy is used when:", o:["Great resistance is expected", "The change agent has total power", "Staff refuse to participate", "Little resistance is anticipated"], a:3},
  {t:"Which marketing-mix element informs consumers about services and persuades them of their benefits?", o:["Product", "Promotion", "Price", "Place"], a:1},
  {t:"COP27 was hosted by Egypt in:", o:["Sharm el-Sheikh, November 2022", "Cairo, November 2021", "Alexandria, May 2022", "Glasgow, November 2021"], a:0},
  {t:"Charge nurse / head nurse is a type of staff nurse classified according to:", o:["Workplace", "Role / seniority", "Specialty", "Educational level"], a:1},
  {t:"Making nursing rounds to assess the quality of patient care falls under which director function?", o:["Planning", "Implementation", "Assessment", "Evaluation"], a:2},
  {t:"Middle management short-term plans are generally made for:", o:["1 to 5 years", "5 to 20 years", "Daily only", "20 to 30 years"], a:0},
  {t:"When the unit manager has a SUPERIOR relation to the head nurse:", o:["She is responsible to the head nurse", "She supervises her own staff and reports to the supervisor", "She only handles clerical work", "She is an assistant administrator and the heads of nursing, medical, dietary and housekeeping services are responsible to her"], a:3},
  {t:"A hospital director delegating to the nursing director to act on behalf of the department is:", o:["Ultimate authority", "Legal authority", "Technical authority", "Operational authority"], a:1},
  {t:"The management principle that no person should report to more than one boss is:", o:["Chain of command", "Span of control", "Line authority", "Staff authority"], a:0},
  {t:"In which phase of successful change does the entire organization determine the true causes of problems?", o:["Pressure and Arousal", "Intervention and Reorientation", "Experimentation and Search", "Diagnosis and Recognition"], a:3},
  {t:"In the emotional responses to change, energy used in an attempt to eliminate the change is:", o:["Bargaining", "Denial", "Readiness", "Equilibrium"], a:0},
  {t:"Which of the following is part of marketing evaluation and control?", o:["Developing the marketing mix", "Choosing brochures for promotion", "Determining reasons for variance between planned and actual results", "Defining the mission and philosophy only"], a:2},
  {t:"Which health impact is linked to DROUGHT?", o:["Suffocation and burns", "Asthma and lung cancer", "Food insecurity, malnutrition and psychosocial stress", "Displacement and shortage of safe water"], a:2},
  {t:"'Identify early signs of deterioration and report immediately' belongs to which staff nurse responsibility?", o:["Discharge planning", "Resource and equipment management", "Direct patient care", "Professional development"], a:2},
  {t:"Which skill is the ability to understand others at work and influence them to enhance personal and organizational objectives?", o:["Conceptual skill", "Analytical skill", "Political skill", "Human skill"], a:2},
  {t:"A master's degree is mandatory for the nursing director.", o:["True", "False"], a:1},
  {t:"Burning coal, oil, or gas for electricity produces carbon dioxide and nitrous oxide.", o:["True", "False"], a:0},
  {t:"The head nurse belongs to the top level of management.", o:["True", "False"], a:1},
  {t:"In an exchange, each party is free to accept or reject the offer.", o:["True", "False"], a:0},
  {t:"Lewin's change theory consists of seven phases.", o:["True", "False"], a:1},
  {t:"Authority is a formal, down-flowing concept, while power can be both formal and informal.", o:["True", "False"], a:0},
  {t:"Past experience is always compulsory for every staff nurse.", o:["True", "False"], a:1},
  {t:"Middle-level management requires more managerial and technical skills and less conceptual skills.", o:["True", "False"], a:0},
  {t:"Referent power is based on possessing knowledge that others need.", o:["True", "False"], a:1},
  {t:"The power-coercion strategy uses official authority with rewards and punishments to create change.", o:["True", "False"], a:0}

];

const TOTAL_TIME = 30*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
