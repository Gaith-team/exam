<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nursing Management</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--grad:linear-gradient(135deg,#1e3a8a,#0e7490 50%,#10b981);--gold:#f59e0b;--bg:#f8fafc;--card:#fff;--text:#1a2332;--text2:#4a5568;--bc:rgba(0,0,0,.09);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--bc:rgba(255,255,255,.12)}}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.hero{background:var(--grad);color:#fff;text-align:center;padding:30px 16px;border-bottom:4px solid var(--gold)}
.hero h1{font-size:24px}.hero p{opacity:.9;font-size:14px;margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bc)}
.tabs button{margin:0;background:var(--card);color:var(--text);border:1.5px solid var(--bc)}
.tabs button.on{background:#0e7490;color:#fff;border-color:#0e7490}
.shell{max-width:860px;margin:0 auto;padding:20px 14px 60px}
.sit{background:var(--card);border:1px solid var(--bc);border-radius:16px;margin-bottom:26px;overflow:hidden}
.sh{background:var(--grad);color:#fff;padding:12px 16px;font-weight:800;border-bottom:3px solid var(--gold);display:flex;justify-content:space-between;gap:8px;align-items:center}
.badge{font-size:11px;background:var(--gold);color:#1a2332;border-radius:50px;padding:2px 10px;white-space:nowrap}
.story{padding:16px;font-size:15px;background:rgba(245,158,11,.08);border-bottom:1px dashed var(--bc)}
.q{padding:14px 16px;border-top:1px solid var(--bc)}
.q b{display:block;margin-bottom:8px;font-size:15px}
textarea{width:100%;min-height:80px;border:1.5px solid var(--bc);border-radius:10px;padding:10px;font:14px inherit;background:var(--bg);color:var(--text);resize:vertical}
textarea:focus{outline:none;border-color:#0e7490}
button{margin-top:8px;border:none;background:#0e7490;color:#fff;border-radius:50px;padding:7px 16px;font-weight:700;cursor:pointer;font-size:13px}
.ans{display:none;margin-top:10px;padding:10px 12px;border-left:4px solid #10b981;background:rgba(16,185,129,.1);border-radius:8px;font-size:14px;color:var(--text2);white-space:pre-line}
.ans.on{display:block}
.opt{display:block;width:100%;text-align:left;margin:6px 0 0;background:var(--bg);color:var(--text);border:1.5px solid var(--bc);border-radius:10px;padding:8px 12px;font-weight:500}
.opt.ok{background:rgba(16,185,129,.2);border-color:#10b981}
.opt.no{background:rgba(239,68,68,.15);border-color:#ef4444}
</style>
</head>
<body>
<div class="hero"><h1>📝 Situation </h1><p>Nursing Management</p></div>
<div class="tabs"><button data-f="all" class="on">All</button><button data-f="g">أسئلة غيث</button><button data-f="b">أسئلة الكتاب</button></div>
<div class="shell" id="app"></div>
<script>
const G=[
{t:"Situation 1: Director of Nursing Service",s:"Mrs. Salma was recently appointed as Director of Nursing at a 400-bed teaching hospital. During her first month, several patients’ families complained about delayed responses to call bells on the night shift. She started making nursing rounds in the wards, reviewed work schedules, assignments and the supervisors’ reports, and investigated the complaints. She then decided to set a new staffing plan, develop an in-service training program for the nurses, and establish a patient classification system. At the end of the month she submitted a report about the progress of nursing service to the hospital administrator and evaluated the head nurses according to their job descriptions.",
q:[["Define the nursing director (Matron) and mention the educational and professional qualifications required for her selection.","Definition: assumes responsibility in an administrative capacity combining years of clinical nursing experience, education, and managerial skills to develop organizational structure and standards of care.\nEducational: BSc required; Master’s preferred, with demonstrated ability in nursing practice and administration.\nProfessional: four years recent clinical experience including 1 year supervisory experience; member in a professional nursing organization (syndicate, association)."],
["Classify the actions Mrs. Salma performed into the phases of the director’s duties (Assessment, Planning, Implementation, Evaluation).","Assessment: nursing rounds, reviewing schedules/assignments/supervisors’ reports, investigating complaints.\nPlanning: staffing plan, in-service programs, patient classification system.\nEvaluation: monthly report to the administrator, evaluating head nurses according to job description."],
["Mention three other planning duties and three other evaluation duties of the director.","Planning: develops job/position descriptions; develops a system of evaluation of work performance; assists in establishing a safety and disaster program.\nEvaluation: evaluates incident reports; evaluates facilities and equipment; evaluates and revises policies and procedures."]]},
{t:"Situation 2: The Head Nurse",s:"Nurse Mona is a head nurse in a surgical unit with 30 beds. She is responsible for practical nurses, work clerks and nurses’ aides, and she reports to the nursing supervisor. Recently the unit suffered from staff shortage, two nurses were arguing about the distribution of tasks, and Mona was spending most of her day on clerical work, ordering supplies and arranging repairs, so she had little time for patient care. The hospital decided to appoint a unit manager to relieve her from these activities.",
q:[["At which level of management does the head nurse work, and to whom is she responsible? Mention the main roles of this level.","First (lower) level / first-line management. Responsible to the nurse supervisor and the nursing service director.\nRoles: make daily, weekly and monthly plans; direct workers; develop morale; link between workers and middle management; inform workers about management decisions and management about workers’ performance; spend more time in directing and controlling."],
["List the four main areas of the head nurse’s role and how Mona can manage the conflict between the two nurses.","Areas: patient-care management, staff management, relations management, unit management.\nConflict management: frequent meetings of the team, sharing objectives, clear job description, distributing tasks fairly, being a role model."],
["Name the organizational pattern Mona was working in, its two problems, and the three possible relationships of the unit manager to the head nurse.","Traditional pattern: increases the volume of management functions performed by the H.N and decreases the H.N time spent in patient care management.\nProgressive pattern relationships: subordinate, peer, and superior relationship to the head nurse."]]},
{t:"Situation 3: Marketing",s:"A private hospital opened a new dialysis unit but the number of patients is low. The administration discovered that it did not collect data about the needs of the community before opening the unit, the objectives were not clear, and the staff were dissatisfied. The nursing director decided to conduct a questionnaire and interviews to study the market, set a budget and a promotion plan using brochures and the web site, and to measure patients’ satisfaction after three months.",
q:[["Define marketing and mention the four elements of the marketing mix applied to the dialysis unit.","Marketing: a social and managerial process by which individuals and groups obtain what they want through exchanging products and services with others.\nMarketing mix: Product, Price, Place, Promotion."],
["Identify the steps of the marketing process and the step each action belongs to; mention tools of assessment.","Assessment (questionnaire, interviews), Planning (budget, promotion plan, marketing mix), Implementation (brochures, web site), Evaluation and control (satisfaction measurement).\nAssessment tools: questionnaire by mail/telephone, interview, observations, consumer panel, review records, scientific research."],
["Differentiate between internal and external marketing and mention the causes of marketing failure that appeared in this situation.","Internal: attracting, developing, motivating and retaining qualified employees (treating employees as internal customers).\nExternal: strategies to communicate and deliver value to audiences outside the organization (patients, community).\nFailures: failure to collect data prior to decisions; unclear objectives (data not carefully interpreted)."]]},
{t:"Situation 4: Change Management",s:"A hospital decided to replace paper records with an electronic health record (EHR) system. The decision came after a sharp decline in productivity and high absenteeism. Many nurses said: ‘We have always done it this way’, they feared they would not be able to use the system and that their workload would increase. The nurse manager explained the purpose of the change, trained the staff, involved them in planning, and rewarded those who adapted. After six months the new system became the routine way of work.",
q:[["Is this change accidental or planned? Define change agent and mention four qualities of a change agent.","Planned (proactive): results from deliberate effort / deliberate application of knowledge and skills by a leader.\nChange agent: a person or group who helps an organization, team or individual move from the current state to a desired future state.\nQualities: elicit trust and respect; good collaborator; flexibility; maintain change vision; communicate well; manage interpersonal relationships; involve and empower people."],
["Explain Lewin’s three stages of change using this situation, and mention reasons for resistance that appeared.","Unfreezing: recognition of need for change (decline in productivity, absenteeism). Moving: change in thoughts, feelings, behavior (training, using EHR). Refreezing: establishing the change as a new habit.\nResistance: fear of not being able to implement the change, increased workload, lack of understanding of the change."],
["Mention the strategies of overcoming resistance used by the nurse manager and the key roles of the nurse manager in change management.","Strategies: explain the process of change, staff participation, rewards, providing resources, building skills.\nRoles: planner, communicator, motivator, educator/trainer, supporter, problem-solver."]]},
{t:"Situation 5: Power and Authority",s:"Dr. Hany is the head of the surgery department and is trusted because of his wide experience. Nurse Heba, the head nurse, gives orders to her staff based on her position, praises nurses who perform well, and warns that repeated mistakes will lead to penalties. Another staff nurse, Rania, has no formal position but nurses follow her because she treats everybody fairly and defends their interests. The Ministry of Health issued new national standards which all hospitals must follow.",
q:[["Define power and mention its two main sources.","Power: the capacity of a person, team or organization to influence others (ability to get someone to do something you want done).\nSources: positional power and personal power."],
["Identify the type of power used by Heba (three types), Rania and Dr. Hany.","Heba: legitimate (based on position), reward (praise), coercive (penalties).\nRania: referent power (charisma, identification, trust).\nDr. Hany: expert power (knowledge, experience or judgment others need)."],
["Name the type of authority of the Ministry of Health, and mention three differences between power and authority.","Ultimate authority (original and final source of decision-making; sets national policies, laws, standards).\nDifferences: Power is the ability to influence / authority is the right to command; power is a personal quality / authority is positional; power is both formal and informal / authority is formal; power flows in all directions / authority is a down-flowing concept."]]},
{t:"Situation 6: The Staff Nurse",s:"Nurse Ahmed graduated from an accredited nursing school and was appointed as a staff nurse in the ICU. He is a member of the nursing syndicate and licensed. During his shift he gave oral and IV medications, documented them, observed early signs of deterioration and reported them to the physician, taught a patient’s family about home care before discharge, applied hand hygiene and PPE, and gave an accurate handover to the next shift. He reports to the head nurse.",
q:[["Define the staff nurse and mention her professional and personal qualifications.","Staff nurse: a qualified, registered nurse who provides direct patient care in hospitals, clinics or other healthcare settings under the supervision of senior nurses or physicians.\nProfessional: graduate of accredited school, syndicate membership, licensure is a must, experience preferred in special care units, advanced knowledge by specialization, continued professional development.\nPersonal: good physical and mental health, communication skills, cheerful and accepts criticism, loyalty, works in multicultural team, positive attitude."],
["Where is Ahmed placed in the nursing service organization chart? Classify him by specialty.","Almost at the bottom: Nursing director > Nursing supervisor > Head nurse > Staff nurse > Nursing aids/assistants. He reports to the team leader or head nurse.\nBy specialty: ICU / Critical Care nurse."],
["Match Ahmed’s actions with the responsibilities of the staff nurse.","Direct patient care (medications, observation, early signs of deterioration); Patient and family education; Infection control and safety; Communication and collaboration (handover); Discharge planning."]]},
{t:"Situation 7: Climate Change",s:"During a severe heat wave, the emergency department received many patients with heat cramps, heat exhaustion and heat stroke, in addition to patients with asthma due to air pollution. The nurse director noticed that the hospital’s air conditioners were running all day and many lights were on in empty rooms. She decided to educate the community and to apply energy-saving measures. She also reminded the staff that Egypt hosted the 27th Conference of Parties in Sharm el-Sheikh.",
q:[["Define climate change and global warming, and mention three causes of climate change.","Climate change: long-term shifts in temperatures and weather patterns (natural, but since the 1800s mainly human activities such as burning fossil fuels).\nGlobal warming: gradual increase in the earth’s temperature due to the greenhouse effect caused by increased carbon dioxide and other pollutants.\nCauses: generating power, manufacturing goods, deforestation, transportation, producing food, powering buildings, coal mining."],
["Mention the impacts of climate change on human health related to this situation.","Heat waves: cardiovascular diseases such as stroke; air pollution: stroke, heart disease, asthma, COPD, lung cancer; plus wildfires, drought, floods, injuries and mortality from extreme weather, infections spread, emergence of new diseases."],
["What are the three focus areas of COP27, and what is the role of the nurse at work and at home?","COP27: reducing emissions, climate adaptation, climate finance.\nNurse: increase awareness (educate patients and communities).\nAt work: use natural light, energy-saving thermostat, recycling, turn off equipment after hours.\nAt home: lights off, use alternative energy, limit heaters and air conditioners, recycle, washable dishes, avoid toxic chemicals, plant a tree."]]}
];
// Book items: text = [question, answer]; mcq = {m:1,q,o:[...],c:index,n:note}
const B=[
{t:"Leadership: Sarah’s Style",s:"Sarah is the manager of a marketing team working on a high-stakes product launch. The deadline is tight, and the team is under pressure. Sarah takes full control of the project, assigns specific tasks to each team member, sets strict deadlines, and closely monitors everyone’s progress. She doesn’t ask for input or feedback and expects her instructions to be followed exactly. While some team members appreciate the clear direction, others feel stifled and unmotivated due to the lack of autonomy.",
q:[{m:1,q:"What leadership style is Sarah demonstrating?",o:["Democratic","Transformational","Autocratic","Laissez-faire"],c:2},
{m:1,q:"What is a potential disadvantage of Sarah’s leadership style in the long term?",o:["Team members may become overly independent and ignore her instructions","Innovation and creativity may be limited due to lack of input from the team","The team may experience too much freedom and lose focus on goals","Team members may start to compete excessively for leadership roles"],c:1}]},
{t:"Head Nurse: Miss Noha",s:"Miss Noha is a head nurse of chest unit. Lately, she is so busy all the time due to work overload that she cannot plan for staff development.",
q:[["How can the hospital director help her?","The hospital appoints a unit manager to relieve the head nurse from the unit management activities. The objective of utilizing the unit manager is to keep the activities of the unit functioning in a good way to facilitate medical and nursing care.\n(Plant maintenance: the unit manager prepares the repair list, requests needed repairs, then makes rounds to make sure the work is completed.)"]]},
{t:"Staff Nurse: Qualifications, Skills & Complications",s:"During a busy shift in the surgical ward, a staff nurse notices that one of the patients has developed unexpected complications after surgery.",
q:[["List qualifications of the staff nurse.","Professional: graduate of an accredited school of nursing; membership in nursing syndicate; licensure is a must; past experience generally not required but preferred in special care units; advanced knowledge based on specialization (intensive care or dialysis); continue professional development.\nPersonal: good physical and mental health; excellent communication and interpersonal skills; cheerful and accepts criticism; loyalty and sense of belonging; able to work in a multicultural team; positive attitude in a fast-paced environment."],
["List staff nurse skills.","Active listening; reading comprehension; critical thinking; instructing; speaking; time management; service orientation; monitoring; writing; active learning; coordination; judgment and decision making; equipment selection."],
["How should the staff nurse respond to ensure patient safety and effective communication with the healthcare team?","- Stay calm and quickly assess the patient (vital signs, wound, drainage, level of consciousness)\n- Provide immediate nursing interventions (ensure airway, give oxygen, position safely)\n- Activate the emergency response or call the physician promptly\n- Use structured communication (SBAR: Situation, Background, Assessment, Recommendation)\n- Document the incident, interventions and communication accurately\n- Continue close monitoring and update the team about any changes"],
["Mention other responsibilities of the staff nurse (advocacy, resources, development, discharge).","Discharge: prepare patients and families for safe discharge; instructions for home care, medication and follow-up.\nAdvocacy: ensure patients’ rights and needs are respected; speak up when they cannot.\nResources: ensure availability and proper use of equipment; report malfunctioning or missing equipment.\nDevelopment: stay updated, attend workshops/seminars/CNE, adhere to ethics, legal responsibilities and standards."]]},
{t:"Marketing Process",s:"Marketing process is similar to the nursing process, designed to analyze and solve problems. It uses assessment, planning, implementation, and control of programs to create voluntary exchanges of value between an organization and target markets.",
q:[["List the marketing process steps and explain each.","Four steps: assessment, planning, implementation, evaluation/control.\n1) Assessment: environmental assessment to identify and research the target market; SWOT analysis; identify customer needs and meet them better than competitors; assess the organization (mission, philosophy, goals), the service, competitors, perceptions of the nursing market, pricing philosophy, location, and whether promotion is effective.\n2) Planning: marketing plan outlining the service/program, detailed budget/cost analysis, promotional activities, mission, goals and objectives; marketing mix (product, price, place, promotion).\n3) Implementation: establish the program and promotional activities (media releases, brochures, pamphlets, newsletters, word of mouth); obtain market feedback to measure success and identify gaps between planned and actual goals.\n4) Evaluation and control: done daily, weekly, monthly or yearly; satisfaction surveys, client interviews, research on why clients use or don’t use the service; measure success against objectives, determine reasons for variance, and take corrective action."],
["Mention the tools used in assessment.","Questionnaire (by mail, telephone); interview; observations; consumer panel; review of records; scientific research."]]},
{t:"Director of Nursing: Qualifications & Assessment",s:"Miss Mona Ali Ahmed is a nurse director working in Benha University Hospital.",
q:[["List the qualifications of the nursing director.","Educational: BSc required; Master’s preferred, with demonstrated ability in nursing practice and administration.\nProfessional: four years recent clinical experience including 1 year supervisory experience; member in a professional nursing organization (syndicate, association).\nPersonal: accepts responsibility for continuous self-improvement and professional progress by keeping nursing knowledge and skills up to date; knowledgeable of social, economic and legal issues affecting health care practice."],
["How can she apply the assessment principle and responsibility for the nursing units in the hospital?","- Collects and analyzes data to determine staffing pattern and staffing plans; projects staffing needs, hires personnel, ensures all units are staffed according to patient needs.\n- Reviews work schedules, assignments, patient classification and supervisors’ reports to assess daily the number and level of personnel needed for quality care.\n- Makes nursing rounds to assess quality of patient care and identify problems and needs.\n- Investigates complaints concerning nursing service and takes appropriate action.\n- With the infection control nurse, regularly assesses nursing care, environment and equipment for cleanliness, safety and infection control."]]},
{t:"Leadership: Qualities of a Leader",s:"Eleven practical points for developing leadership (from the book).",
q:[["List the steps/qualities for becoming an effective leader.","1) Have a clear vision. 2) Know and use your strengths and gifts (critical inward reflection). 3) Admit and learn from failures and weaknesses. 4) Set definitive goals and follow concrete action plans. 5) Live in accordance with your morals and values. 6) Serve as a role model. 7) Be passionate. 8) Maintain a positive attitude. 9) Improve communication skills. 10) Motivate others to greatness. 11) Continue to educate and improve yourself."]]},
{t:"Climate Change (Book Activities)",s:"Questions and situations on climate change, greenhouse gases and the nurse’s role.",
q:[{m:1,q:"Using transportation is a major contributor of greenhouse gases, especially ______ emissions.",o:["Carbon dioxide","Carbon oxide","Nitrous dioxide","Methane"],c:0},
{m:1,q:"Climate change is most likely to result in which of the following?",o:["More stable weather patterns","Increased drought","More food storage","Lower medical errors"],c:1},
["Situation 1: After a powerful storm destroyed crops and homes in a rural area, the community wants to know whether such extreme weather is becoming more common. Illustrate how scientific evidence can help, and mention everyone’s role in adapting to these changes.","Nurse: increase awareness; educate patients and communities about heat stroke, air pollution, and how to stay safe.\nAt work: use natural light, energy-saving thermostat, start a recycling program, print on both sides, turn off equipment after hours.\nAt home: support sustainable policies and green initiatives (green cleaning products, sustainable procurement); lights off; use solar/wind if available; limit heaters and air conditioners; recycle paper, plastic and organic materials; washable dishes; avoid toxic chemicals; plant a tree; reduce waste and emissions."],
["Situation 2: A factory emits large amounts of carbon dioxide and residents are worried. Illustrate the main human activities that release greenhouse gases.","Generating power (burning coal, oil, gas → CO2 and nitrous oxide); manufacturing goods (cement, iron, steel, electronics, plastics); deforestation (cut trees release stored carbon); transportation (fossil fuels, mainly CO2); producing food (land clearing, farm and fishing energy); powering buildings (heating, cooling, lighting); coal mining (releases methane)."],
["Explain the effect of greenhouse gases on the Earth’s climate.","Hotter temperatures: more heat-related illnesses (cramps, exhaustion, heat stroke).\nMore severe storms: more evaporation → extreme rainfall, flooding, destroyed homes, deaths and economic loss.\nIncreased drought: scarcer water, agricultural droughts, expanding deserts.\nNot enough food: hunger and poor nutrition; fisheries, crops, livestock harmed.\nPoverty and displacement: about 23.1 million people displaced each year by weather-related events."],
["Mention the impact of climate change on human health.","Heat waves: cardiovascular disease, stroke. Air pollution: stroke, heart disease, asthma, COPD, lung cancer. Wildfires: suffocation, burns, cardiovascular/respiratory and mental health problems. Drought: food insecurity, malnutrition, psychosocial stress. Floods: displacement, shortage of safe water, mental/physical health, food insecurity. Also injuries and mortality from extreme weather, spread of infections, more medical errors, emergence of new diseases, increased patient vulnerability, delayed cancer detection and worse prognosis."]]}
];
const app=document.getElementById('app');
function render(src,p,label){
 src.forEach((x,i)=>{
  let h=`<div class="sit" data-s="${p}"><div class="sh"><span>${x.t}</span><span class="badge">${label}</span></div><div class="story">${x.s}</div>`;
  x.q.forEach((q,j)=>{
   const id=`${p}${i}_${j}`;
   if(q.m){
    h+=`<div class="q" data-c="${q.c}"><b>Q${j+1}. ${q.q}</b>`+q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${o}</button>`).join('')+`</div>`;
   }else{
    h+=`<div class="q"><b>Q${j+1}. ${q[0]}</b><textarea id="${id}" placeholder="اكتب إجابتك هنا..."></textarea><button class="tg" data-t="m${id}">Model answer / الإجابة النموذجية</button><div class="ans" id="m${id}">${q[1]}</div></div>`;
   }
  });
  app.insertAdjacentHTML('beforeend',h+'</div>');
 });
}
render(G,'g','Ghaith Team');
render(B,'b','Book');
app.addEventListener('click',e=>{
 const t=e.target.closest('.tg');
 if(t){document.getElementById(t.dataset.t).classList.toggle('on');return}
 const o=e.target.closest('.opt');
 if(o){
  const q=o.parentElement,c=+q.dataset.c;
  q.querySelectorAll('.opt').forEach(b=>b.classList.remove('ok','no'));
  q.querySelector(`.opt[data-k="${c}"]`).classList.add('ok');
  if(+o.dataset.k!==c)o.classList.add('no');
 }
});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 document.querySelectorAll('.sit').forEach(s=>s.style.display=(b.dataset.f==='all'||s.dataset.s===b.dataset.f)?'':'none');
});
document.querySelectorAll('textarea').forEach(t=>{
 try{t.value=localStorage.getItem(t.id)||''}catch(e){}
 t.addEventListener('input',()=>{try{localStorage.setItem(t.id,t.value)}catch(e){}});
});
</script>
</body>
</html>
