<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM - Change Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:#1e3a8a; --teal:#0e7490; --emerald:#10b981; --gold:#f59e0b;
  --accent:#0e7490; --accent-glow:rgba(14,116,144,0.18); --accent-rgb:14,116,144;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --grad-bar:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b);
  --bg:#f8fafc; --bg2:#eef2f7; --card:#ffffff;
  --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07);
  --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --card:#1c2333;
  --text:#e6edf3; --text2:#b1bac4; --text3:#7d8590;
  --bc:rgba(255,255,255,0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(248,250,252,.93); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(13,17,23,.95); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon {
  width:34px; height:34px; border-radius:8px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:900; box-shadow:0 0 0 2px rgba(245,158,11,.5);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:50px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Outfit',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; border-radius:50%; font-size:15px; }
.theme-btn:hover { border-color:var(--accent); transform:rotate(20deg); }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }
.tool-btn.off { opacity:.55; }

.hero-band {
  margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--gold);
}
.hero-band::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(245,158,11,.22) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(16,185,129,.28) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px;
}
.meta-pill i { color:var(--gold); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:50px; font-size:12px; font-weight:700;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--grad); color:#fff; border-color:transparent; }

.shell { max-width:860px; margin:0 auto; padding:24px 20px 80px; }

/* SECTION */
.sec { margin-bottom:34px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:16px 16px 0 0; border-bottom:3px solid var(--gold);
}
.sec-icon {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:17px; font-weight:900; line-height:1.3; }
.sec-count { margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:50px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.subhead {
  font-size:13px; font-weight:900; color:var(--navy); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--gold);
  border-radius:8px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#7dd3fc; }

/* FIGURE */
.fig {
  background:#fff; border:1px solid var(--bc); border-radius:14px; padding:14px;
  display:flex; justify-content:center;
}
.fig img { max-width:100%; height:auto; display:block; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-radius:14px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.4); box-shadow:0 4px 14px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left:3px solid var(--teal); }
.pt.done { opacity:.55; }

.pt-en {
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px;
  font-size:15px; font-weight:700; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff;
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
}
.pt-ar {
  padding:12px 16px; font-size:14.5px; line-height:1.9; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:11px; font-weight:900; padding:2px 9px; border-radius:6px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(14,116,144,.12); color:var(--teal); }
[data-theme="dark"] .pt-ar .tag { color:#5eead4; }
.pt-ex {
  padding:12px 16px; font-size:14px; line-height:1.9; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(245,158,11,.07); border-right:4px solid var(--gold);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ex .tag { background:rgba(245,158,11,.2); color:#b45309; }
[data-theme="dark"] .pt-ex .tag { color:#fbbf24; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
</style>
</head>

<nav>

{ id:"intro", icon:"📖", title:"Introduction ", items:[
[`Life is full of constant movement and transformation.`,
 `الحياة عمرها ما بتقف، كل يوم فيها حركة وتحول.`,
 `زي ما انت من سنة أولى لحد دلوقتي في رابعة تمريض اتغيرت في معلوماتك وشغلك، الحياة كلها كده.`],
[`Nothing around us remains the same for long.`,
 `مفيش حاجة حوالينا بتفضل زي ما هي لفترة طويلة، لازم تتغير.`,
 `المستشفى اللي كانت بتكتب الملفات بالورق بقت دلوقتي بتستخدم الكمبيوتر، يعني الحاجة ماثبتتش على حالها.`],
[`Whether it is technology, organizations, or even our personal lives.`,
 `التغيير ده بيحصل في كل حاجة: التكنولوجيا، والمؤسسات، وحتى حياتنا الشخصية.`,
 `جهاز جديد بيدخل القسم (تكنولوجيا)، المستشفى بتغير نظام الشغل (مؤسسة)، وانت بتغير مواعيد مذاكرتك (حياتك الشخصية).`],
[`Change is the driving force that shapes progress and pushes us to grow, adapt, and discover new possibilities.`,
 `التغيير هو المحرك اللي بيبني التقدم، وبيخلينا نكبر ونتأقلم ونكتشف فرص جديدة.`,
 `لو الممرضة فضلت تشتغل بنفس طريقة 20 سنة فاتت من غير ما تتعلم حاجة جديدة، عمرها ما هتتقدم.`],
[`Throughout history, those who embraced change were able to innovate, succeed, and leave a lasting impact.`,
 `على مر التاريخ، الناس اللي قبلت التغيير هي اللي ابتكرت ونجحت وسابت أثر باقي.`,
 `فلورانس نايتنجيل غيّرت شكل التمريض كله لما قبلت تغير طريقة الرعاية، واسمها لسه موجود لحد النهارده.`],
[`Yet, change is not always easy; it often brings uncertainty and challenges that test our flexibility and resilience.`,
 `بس التغيير مش دايماً سهل، غالباً بيجيب معاه عدم يقين وتحديات بتختبر مرونتنا وقدرتنا على التحمل.`,
 `لما المستشفى تقولك من بكرة هنشتغل بنظام جديد، هتحس بقلق: هعرف أشتغل عليه؟ ولا هغلط؟ ده هو عدم اليقين.`],
{h:"Definition of change"},
[`Change is the process of making something different from its previous state.`,
 `التغيير هو عملية بنخلي فيها حاجة تبقى مختلفة عن حالتها اللي كانت عليها قبل كده.`,
 `قسم كان بيشتغل بنظام شيفتات معين، وبعدين اتعدل النظام. القسم بقى مختلف عن اللي كان عليه، ده تغيير.`],
[`It involves moving from the current situation to a new one, which may affect individuals, groups, or organizations.`,
 `يعني بننتقل من الوضع الحالي لوضع جديد، والانتقال ده ممكن يأثر على أفراد أو مجموعات أو مؤسسات.`,
 `تغيير نظام التسليم بين الشيفتات هيأثر على كل ممرضة لوحدها (فرد)، وعلى فريق القسم (مجموعة)، وعلى المستشفى كلها (مؤسسة).`],
[`Change can be intentional and planned, such as organizational improvements, or unplanned and sudden, such as unexpected events in life or work.`,
 `التغيير ممكن يبقى مقصود ومخطط له زي تحسينات المؤسسة، وممكن يبقى مش مخطط وفجأة زي الأحداث اللي ما كناش متوقعينها في الحياة أو الشغل.`,
 `المستشفى قررت تدرب كل الممرضات على برنامج جديد (مخطط)، لكن فجأة حصلت أزمة ونقص ممرضات في القسم واتغير الجدول (مش مخطط).`],
]},

{ id:"agent", icon:"🧭", title:"Change Agent", items:[
[`Change agent is a person or group who helps an organization, team, or individual move from the current state to a desired future state.`,
 `الـ Change agent هو شخص أو مجموعة بتساعد مؤسسة أو فريق أو فرد إنهم ينتقلوا من وضعهم الحالي للوضع المستقبلي اللي عاوزينه.`,
 `رئيسة التمريض اللي بتقود القسم من نظام الورق لنظام الملفات الإلكترونية هي اللي بتوصّلهم من النقطة (أ) للنقطة (ب).`],
[`They guide, support, and facilitate the change process by encouraging new ideas, overcoming resistance, and ensuring smooth implementation of change initiatives`,
 `هما بيوجهوا وبيدعموا وبيسهلوا عملية التغيير، عن طريق إنهم يشجعوا الأفكار الجديدة، ويتغلبوا على المقاومة، ويتأكدوا إن تنفيذ مبادرات التغيير ماشي بسلاسة.`,
 `الـ change agent بتقعد مع الممرضات وتسمع أفكارهم، وتقنع المترددة، وتتابع إن التطبيق ماشي من غير مشاكل.`],
[`In nursing a change agent is a person who brings about changes that impact nursing services.`,
 `في التمريض، الـ change agent هو الشخص اللي بيعمل تغييرات بتأثر على الخدمات التمريضية.`,
 `ممرضة اقترحت وطبقت نظام جديد لمتابعة الجروح، ومستوى الخدمة التمريضية في القسم اتحسن بسببه.`],
[`The change agent may be a nurse leader, staff nurse or someone who works with nurses.`,
 `الـ change agent ممكن يبقى قائد تمريضي، أو ممرضة staff، أو أي حد بيشتغل مع الممرضات.`,
 `مش لازم تكون المديرة، ممكن ممرضة عادية في القسم تقترح تغيير وتقود تطبيقه.`],
{h:"Qualities of change agents:"},
[`Ability to elicit trust and respect from executors and recipients of change`,
 `قدرته إنه يكسب ثقة واحترام اللي بينفذوا التغيير واللي بيستقبلوه.`,
 `الممرضات بيسمعوا كلام رئيستهم اللي عمرها ما كدبت عليهم وبتحترمهم، فبيقبلوا التغيير منها بسهولة.`],
[`Good collaborator`,
 `يبقى متعاون كويس، بيشتغل مع غيره.`,
 `بيشتغل مع الدكاترة والممرضات والإدارة كلهم كفريق واحد، مش لوحده.`],
[`Flexibility`,
 `المرونة، يعني ميبقاش متصلب في رأيه.`,
 `لو الخطة مش ماشية، بيعدل فيها بدل ما يصر عليها.`],
[`Ability to maintain change vision`,
 `قدرته إنه يحافظ على رؤية التغيير ويفضل شايف الهدف.`,
 `حتى لو حصلت مشاكل في أول أسبوع، بيفضل فاكر ليه بدأنا التغيير ويكمل.`],
[`Ability to communicate well`,
 `يعرف يتواصل كويس مع الناس.`,
 `بيشرح للممرضات إيه اللي هيتغير وليه بكلام واضح ومفهوم.`],
[`Good manager of interpersonal relationships`,
 `يبقى مدير كويس للعلاقات بين الناس.`,
 `لما اتنين ممرضات يتخانقوا بسبب التغيير، بيعرف يصلح بينهم ويحافظ على جو الشغل.`],
[`Ability to involve and empower people in change process`,
 `قدرته إنه يشرك الناس في عملية التغيير ويديهم القوة والصلاحية.`,
 `بيخلي الممرضات نفسهم يشاركوا في القرار ويديلهم مسؤولية في التنفيذ، مش مجرد بينفذوا أوامر.`],
]},

{ id:"types", icon:"🔀", title:"Types of Change", items:[
[`Accidental (reactive, unplanned change): It occurs as a reaction to some problems, or events as when it arises.`,
 `التغيير العرضي (رد فعلي، غير مخطط): بيحصل كرد فعل على مشاكل أو أحداث وقت ما بتظهر.`,
 `حصل انتشار عدوى فجأة في القسم، فاضطرينا نغير بروتوكول التعقيم في نفس اليوم.`],
[`So it is crisis driven, isolated and short lived.`,
 `يعني التغيير ده سببه أزمة، ومنعزل، وعمره قصير.`,
 `بعد ما الأزمة خلصت، رجعنا للنظام القديم ومفيش حاجة كملت.`,1],
[`It occurs when an organization is forced to change in response to an event in the external or organizational environment.`,
 `بيحصل لما المؤسسة تضطر تتغير استجابةً لحدث في البيئة الخارجية أو بيئة المؤسسة نفسها.`,
 `قانون جديد نزل من وزارة الصحة والمستشفى اضطرت تغير نظام الشغل بسرعة.`,1],
[`Planned change (proactive):`,
 `التغيير المخطط (استباقي): تغيير بنعمله بإرادتنا ومن غير ما نستنى مشكلة.`,
 `المستشفى قررت من الأول تدخل نظام الملف الإلكتروني وجهزت له خطة ووقت.`],
[`It results from deliberated effort to make something happen.`,
 `بينتج من مجهود مقصود عشان نخلي حاجة معينة تحصل.`,
 `قعدنا وخططنا وحددنا مين هيعمل إيه عشان نوصل للتحسين اللي عاوزينه.`,1],
[`It is the deliberate application of knowledge and skills by a leader to bring about a change.`,
 `هو إن القائد يستخدم علمه ومهاراته بشكل مقصود عشان يعمل التغيير.`,
 `مديرة التمريض استخدمت خبرتها ودراستها في إدارة التغيير عشان تقود تطبيق نظام جديد.`,1],
]},

{ id:"need", icon:"🎯", title:"Need / Reason of Change", items:[
[`To improve efficiency`,
 `عشان نزود الكفاءة.`,
 `نظام جديد بيخلي الممرضة تخلص شغلها في وقت أقل وبجودة أعلى.`],
[`To reduce unnecessary workload for some group.`,
 `عشان نقلل الحمل الزايد اللي مالوش لازمة على مجموعة معينة.`,
 `ممرضات بيكتبوا نفس البيانات في 3 ورقات، فنعمل ورقة واحدة وبكده نخفف عنهم.`],
[`To improve the means of satisfying economic wants.`,
 `عشان نحسن وسائل تلبية الاحتياجات الاقتصادية.`,
 `نظام حوافز جديد بيحسن دخل العاملين ويلبي احتياجاتهم المادية.`],
[`To contribute to individual satisfaction and social well-being.`,
 `عشان نساهم في رضا الأفراد ورفاهية المجتمع.`,
 `بيئة شغل أحسن بتخلي الممرضة راضية عن شغلها، وده بينعكس على المجتمع.`],
[`To solve problems.`,
 `عشان نحل المشاكل.`,
 `لو في أخطاء كتير في إعطاء الأدوية، بنغير نظام التحقق عشان نحل المشكلة.`],
[`To make work procedure more efficient.`,
 `عشان نخلي إجراءات الشغل أكفأ.`,
 `نعيد ترتيب خطوات التسليم بين الشيفتات عشان تبقى أسرع وأوضح.`],
]},

{ id:"areas", icon:"🏥", title:"Areas Need Change in Nursing Field", items:[
[`1. Patient Care Practices`,
 `المجال الأول: ممارسات رعاية المريض.`,
 `ده الأساس اللي بيمس المريض مباشرةً.`],
[`Updating care protocols, implementing evidence-based practices, and improving patient safety.`,
 `يعني نحدّث بروتوكولات الرعاية، ونطبق الممارسات المبنية على الدليل العلمي، ونحسن سلامة المريض.`,
 `بدل ما نقلب المريض بالطريقة القديمة، نستخدم أحدث إرشادات لمنع قرح الفراش.`,1],
[`2. Technology & Equipment`,
 `المجال التاني: التكنولوجيا والمعدات.`,
 `كل ما هو أجهزة وأنظمة بتتطور.`],
[`Adopting electronic health records (EHR), modern medical devices.`,
 `يعني نستخدم السجلات الصحية الإلكترونية (EHR) والأجهزة الطبية الحديثة.`,
 `بدل الورق، الممرضة بتسجل العلامات الحيوية على الكمبيوتر، وبتستخدم مضخات حقن حديثة.`,1],
[`3. Staffing & Human Resources`,
 `المجال التالت: التوظيف والموارد البشرية.`,
 `كل ما يخص عدد الممرضات وتطويرهم.`],
[`Adequate nurse-to-patient ratios, training programs, skill development, and career progression.`,
 `يعني نسبة مناسبة بين الممرضات والمرضى، وبرامج تدريب، وتنمية مهارات، وتقدم وظيفي.`,
 `ممرضة واحدة لكل 5 مرضى بدل 15، وكورسات تدريب بتساعدها تترقى.`,1],
[`4. Communication & Teamwork`,
 `المجال الرابع: التواصل والعمل الجماعي.`,
 `الفريق الصحي لازم يشتغل كوحدة واحدة.`],
[`Improving collaboration between nurses, doctors, and other healthcare staff.`,
 `يعني نحسن التعاون بين الممرضات والدكاترة وباقي الفريق الصحي.`,
 `عمل اجتماع صباحي قصير بين الدكتور والممرضة عشان يتفقوا على خطة اليوم لكل مريض.`,1],
[`5. Leadership & Management`,
 `المجال الخامس: القيادة والإدارة.`,
 `الجانب الإداري من التمريض.`],
[`Strengthening nurse leadership, supervision, and decision-making.`,
 `يعني نقوي القيادة التمريضية والإشراف واتخاذ القرار.`,
 `تدريب رئيسات الأقسام على إزاي يشرفوا وياخدوا قرارات سريعة وصح.`,1],
[`6. Patient Education & Engagement`,
 `المجال السادس: تثقيف المريض ومشاركته.`,
 `المريض شريك في الرعاية مش مجرد متلقي.`],
[`Enhancing communication with patients, health education, and patient-centered care.`,
 `يعني نحسن التواصل مع المرضى، والتثقيف الصحي، والرعاية اللي بتتمحور حوالين المريض.`,
 `الممرضة بتشرح لمريض السكر إزاي يعمل الحقنة لنفسه وبتسمع مخاوفه وبتراعي ظروفه.`,1],
]},

{ id:"phases", icon:"📶", title:"Phases of Successful Change", items:[
[`Phase 1: Pressure and Arousal:`,
 `المرحلة الأولى: الضغط والاستثارة (الإحساس بالحاجة للتغيير).`,
 `زي لما الإدارة تحس إن في مشكلة كبيرة لازم تتحل ومينفعش نسكت عليها.`],
[`The process begins when the administration feels a need or pressure for change,`,
 `العملية بتبدأ لما الإدارة تحس إن في حاجة أو ضغط عشان نغير.`,
 `مدير المستشفى لاحظ إن في مشكلة بتتكرر ومحتاجة حل.`,1],
[`this pressure can be exerted by external factors such as increased competition, economic changes, or it may be felt because of internal factors such as a sharp decline in productivity, high absenteeism and turnover.`,
 `الضغط ده ممكن يجي من عوامل خارجية زي زيادة المنافسة والتغيرات الاقتصادية، أو يتحس بسبب عوامل داخلية زي هبوط حاد في الإنتاجية وغياب كتير وكثرة ترك الشغل.`,
 `مستشفى تانية جنبنا بقت أحسن وبتسحب مرضانا (خارجي)، أو الممرضات بيغيبوا كتير وبيسيبوا الشغل (داخلي).`,1],
[`Phase 2: Intervention and Reorientation`,
 `المرحلة التانية: التدخل وإعادة التوجيه.`,
 `القائد بيتدخل ويوجه الانتباه للمشاكل الداخلية.`],
[`Although leaders may sense the need for change, they may not be able to analyze its problems accurately and make the correct changes.`,
 `رغم إن القادة ممكن يحسوا بالحاجة للتغيير، ممكن ميقدروش يحللوا مشاكله بدقة ويعملوا التغييرات الصح.`,
 `المدير حاسس إن في مشكلة، بس مش عارف سببها بالظبط فممكن يغير حاجة غلط.`,1],
[`Leaders may be capable of managing the change process if they are perceived as expert and are trusted.`,
 `القادة ممكن يقدروا يديروا عملية التغيير لو الناس شايفاهم خبراء وواثقين فيهم.`,
 `الممرضات بيسمعوا كلام رئيسة القسم لأنهم عارفين إنها خبيرة وبيثقوا فيها.`,1],
[`Phase 3: Diagnosis and Recognition`,
 `المرحلة التالتة: التشخيص والتعرف.`,
 `زي ما الدكتور بيشخّص المرض قبل ما يكتب العلاج، لازم نشخّص المشكلة الأول.`],
[`In the third phase of successful change, the entire organization becomes involved in determining the true causes of problems requiring change by gathering relevant information,`,
 `في المرحلة التالتة من التغيير الناجح، المؤسسة كلها بتشارك في تحديد الأسباب الحقيقية للمشاكل اللي محتاجة تغيير، عن طريق جمع المعلومات المناسبة.`,
 `بنعمل استبيان لكل الممرضات ونراجع سجلات الأخطاء عشان نعرف المشكلة جاية منين بالظبط.`,1],
[`a shared approach between the leader and staff is common in this stage,`,
 `في المرحلة دي بيبقى في أسلوب مشترك بين القائد والموظفين.`,
 `القائدة والممرضات بيقعدوا مع بعض ويفكروا في المشكلة سوا.`,1],
[`the decision-making process has been broadened as the leader shows her willingness to recognize tough problems and to change,`,
 `عملية اتخاذ القرار بتتوسع لأن القائد بيبين استعداده إنه يعترف بالمشاكل الصعبة وإنه يتغير.`,
 `المديرة بتقول قدام الكل: أيوه في مشكلة صعبة وأنا مستعدة نغير حتى لو الحل هيكلفنا مجهود.`,1],
[`diagnosis of the problem areas leads to recognition of specific problems.`,
 `تشخيص مناطق المشكلة بيوصلنا لإننا نتعرف على مشاكل محددة.`,
 `بدل ما نقول القسم فيه مشاكل، نكتشف إن المشكلة بالتحديد في التسليم بين الشيفتات.`,1],
[`This step tends to be avoided in efforts involving unsuccessful change .`,
 `الخطوة دي بيتم تجنبها غالباً في محاولات التغيير الفاشلة.`,
 `إدارات كتير بتقفز على الحل علطول من غير ما تشخّص المشكلة، فالتغيير بيفشل.`,1],
[`Phase 4: Invention and Commitment`,
 `المرحلة الرابعة: الابتكار والالتزام.`,
 `بنفكر في حلول جديدة ونلتزم بيها.`],
[`After the problem is recognized, the organization moves toward creative solutions to the problems that have been identified.`,
 `بعد ما المشكلة تتعرف، المؤسسة بتتجه ناحية حلول مبتكرة للمشاكل اللي اتحددت.`,
 `بعد ما عرفنا إن المشكلة في التسليم، بنفكر في نموذج تسليم جديد مبتكر.`,1],
[`If organization members are encouraged to participate in this process, they will probably be more committed to the solutions .`,
 `لو أعضاء المؤسسة اتشجعوا إنهم يشاركوا في العملية دي، غالباً هيبقوا أكتر التزاماً بالحلول.`,
 `الممرضة اللي شاركت في تصميم النموذج الجديد هتحرص تطبقه أكتر من اللي اتفرض عليها.`,1],
[`Phase 5: Experimentation and Search`,
 `المرحلة الخامسة: التجريب والبحث.`,
 `بنجرب الحل الأول وبنتابع نتيجته.`],
[`In a large organization, one department may try out an idea before it is attempted in the organization as a whole.`,
 `في المؤسسة الكبيرة، ممكن قسم واحد يجرب الفكرة قبل ما تتطبق في المؤسسة كلها.`,
 `نجرب النموذج الجديد في قسم الباطنة الأول قبل ما نعممه على المستشفى كلها.`,1],
[`In this way, the leader can work out before introducing the change on a large scale.`,
 `بالطريقة دي، القائد يقدر يظبط الأمور قبل ما يدخل التغيير على نطاق واسع.`,
 `لو طلعت مشاكل في قسم الباطنة نصلحها قبل التعميم.`,1],
[`Through control mechanisms, the leader determines to what degree the planned change is succeeding in remedying the problem, how well it is being received, and how implementation can be improved .`,
 `من خلال آليات الرقابة، القائد بيحدد لأي درجة التغيير المخطط ناجح في علاج المشكلة، ومدى تقبل الناس له، وإزاي نحسن التنفيذ.`,
 `بنقيس: هل الأخطاء قلت؟ الممرضات راضيين عن النموذج؟ وإيه اللي ممكن نطوره؟`,1],
[`Phase 6: Reinforcement and Acceptance`,
 `المرحلة السادسة: التعزيز والقبول.`,
 `آخر مرحلة: نثبّت التغيير ونكافئ اللي ساهم فيه.`],
[`Finally, if the course of action has been tested and found desirable, it should be accepted more willingly.`,
 `في الآخر، لو الحل اتجرب واتأكدنا إنه كويس، المفروض يتقبله الناس بحماس أكتر.`,
 `لما الناس تشوف إن الأخطاء قلت فعلاً، هتتقبل النموذج الجديد وهي مرتاحة.`,1],
[`Furthermore, individuals need to be reinforced for making the change successful.`,
 `وكمان الأفراد محتاجين تعزيز وتشجيع على إنهم نجحوا التغيير.`,
 `الممرضة اللي التزمت بالنظام الجديد تتشكر وتتقدر.`,1],
[`The positive feedback add reinforcement to the change process.`,
 `التغذية الراجعة الإيجابية بتضيف تعزيز لعملية التغيير.`,
 `كلمة شكر من المديرة قدام الفريق بتخلي الممرضات يكملوا.`,1],
[`Other techniques for reinforcing acceptance include praise, recognition, promotion, salary increases, and continued participation in the change process.`,
 `وفي تقنيات تانية لتعزيز القبول زي المدح والتقدير والترقية وزيادة المرتب واستمرار المشاركة في عملية التغيير.`,
 `شهادة تقدير، وترقية لأفضل ممرضة التزمت، وإنها تفضل عضو في لجنة التطوير.`,1],
]},

{ id:"theories", icon:"📚", title:"Theories of Change — Traditional", items:[
[`The classical change theories consist of; firstly, Lewin's force –field model (1951), secondly, Lippit's phases of change (1958), thirdly, Havelock's six step change model (1973), and finally, Roger's diffusion of innovation theory (1983).`,
 `النظريات الكلاسيكية للتغيير هي أربع نظريات بالترتيب: أولاً نموذج المجال القوي لـ Lewin (1951)، تانياً مراحل التغيير لـ Lippit (1958)، تالتاً نموذج Havelock ذو الست خطوات (1973)، وأخيراً نظرية انتشار الابتكار لـ Roger (1983).`,
 `خليها في بالك بالتواريخ: لوين 1951، ليبيت 1958، هافلوك 1973، روجر 1983. الترتيب بالسنين، من الأقدم للأحدث.`],
]},

{ id:"lewin", icon:"🧊", title:"1- Lewin's Change Theory", items:[
[`Kurt Lewin's change theory is widely used in nursing and involves three stages: the unfreezing, moving, and refreezing stage that recognized the role of habit in people's thoughts and actions.`,
 `نظرية كيرت لوين في التغيير بتتستخدم بشكل واسع في التمريض، وفيها ثلاث مراحل: الإذابة (unfreezing)، والتحرك (moving)، وإعادة التجميد (refreezing)، وهي اعترفت بدور العادة في أفكار الناس وتصرفاتهم.`,
 `تخيل مكعب تلج: بتدوّبه، وبتشكل الميه في شكل جديد، وبعدين بتجمدها تاني في الشكل الجديد.`],
{img:true},
[`1-First stage "Unfreezing" This stage involves the recognition of the need to change.`,
 `المرحلة الأولى "الإذابة": المرحلة دي فيها الاعتراف بالحاجة إلى التغيير.`,
 `الممرضات يدركوا إن نظام التسليم القديم فيه مشاكل وإن لازم يتغير.`],
[`Action is taken to unfreeze the existing attitudes and behavior, which is essential for supporting employees and minimizing change resistance.`,
 `بيتم اتخاذ إجراء لإذابة الاتجاهات والسلوكيات الحالية، وده ضروري لدعم الموظفين وتقليل مقاومة التغيير.`,
 `نعمل ورشة توعية توضح مشاكل النظام القديم، فالممرضات تبقى جاهزة تسيب عادتها القديمة.`],
[`2-Second stage "Moving to a new level" involves a process of change in thoughts, feelings, behavior, or all three, that is in some way more liberating or more productive.`,
 `المرحلة التانية "الانتقال لمستوى جديد": فيها عملية تغيير في الأفكار أو المشاعر أو السلوك أو الثلاثة مع بعض، بحيث تبقى بطريقة ما أكثر تحرراً أو إنتاجية.`,
 `الممرضات بدأوا يطبقوا نموذج التسليم الجديد وبقوا يفكروا ويتصرفوا بطريقة أحسن وأسرع.`],
[`3- Stage three "Refreezing" is establishing the change as a new habit." Without some process of refreezing, it is easy to backslide into the old ways.`,
 `المرحلة التالتة "إعادة التجميد": هي تثبيت التغيير كعادة جديدة. ومن غير عملية إعادة تجميد، سهل جداً الناس ترجع للطرق القديمة.`,
 `لو ما تابعناش وكافأنا التزام الممرضات بالنظام الجديد، بعد شهرين هيرجعوا للطريقة القديمة.`],
]},

{ id:"lippit", icon:"🧩", title:"2- Lippit's Theory of Change", items:[
[`Lippit's Theory of Change is an extension of Lewin's Change Theory.`,
 `نظرية Lippit في التغيير هي امتداد لنظرية Lewin.`,
 `Lippit خد فكرة لوين الأساسية وكبّرها وفصّلها أكتر.`],
[`While Lewin focused mainly on three stages (unfreezing, moving, refreezing), Lippitt expanded the model into seven phases, placing greater emphasis on the role of the change agent (the person guiding the change).`,
 `في الوقت اللي لوين ركز على ثلاث مراحل (إذابة، تحرك، إعادة تجميد)، ليبيت وسّع النموذج لسبع مراحل، وركز أكتر على دور الـ change agent (الشخص اللي بيقود التغيير).`,
 `لوين: 3 مراحل عامة. ليبيت: 7 مراحل وفيها دور واضح للشخص اللي بيقود التغيير.`],
[`There are 7 phases of Lippitt's Theory of Change:`,
 `في 7 مراحل لنظرية ليبيت في التغيير:`,
 `هنمشي معاهم واحدة واحدة بالترتيب.`],
[`1- Diagnose the problem`,
 `1- شخّص المشكلة.`,
 `نعرف المشكلة بالظبط: إيه سبب كثرة الأخطاء الدوائية؟`,1],
[`2. Assess the motivation and capacity for change`,
 `2. قيّم الدافع والقدرة على التغيير.`,
 `هل الممرضات عندهم رغبة يتغيروا؟ وهل عندهم الإمكانيات والوقت؟`,1],
[`3. Assess the change agent's motivation and resources`,
 `3. قيّم دافع الـ change agent ومواردها.`,
 `هل مديرة القسم متحمسة تقود التغيير؟ وهل معاها وقت وميزانية وناس؟`,1],
[`4. Select progressive change objectives`,
 `4. اختار أهداف تغيير تدريجية.`,
 `بدل ما نغير كل حاجة مرة واحدة، نبدأ بهدف صغير زي تحسين التسليم، وبعدين نكمل.`,1],
[`5. Choose an appropriate role for the change agent`,
 `5. اختار دور مناسب للـ change agent.`,
 `هل هتبقى قائدة بتوجه، ولا مستشارة بتدعم، ولا مدربة؟`,1],
[`6. Maintain the change`,
 `6. حافظ على التغيير.`,
 `نتابع ونتأكد إن الناس مكملة على الأسلوب الجديد.`,1],
[`7. Terminate the helping relationship`,
 `7. أنهي علاقة المساعدة.`,
 `لما التغيير يثبت، الـ change agent تنسحب والفريق يكمل بنفسه.`,1],
]},

{ id:"havelock", icon:"🪜", title:"3- Havelock's Six Step Change Model", items:[
[`Six-Step Change Model is another well-known theory of planned change, especially in education, healthcare, and nursing practice.`,
 `نموذج التغيير ذو الست خطوات هو نظرية تانية مشهورة للتغيير المخطط، خصوصاً في التعليم والرعاية الصحية وممارسة التمريض.`,
 `ده نموذج بتلاقيه كتير في المستشفيات والكليات.`],
[`It views change like a problem-solving process, with strong emphasis on the role of the change agent and systematic planning.`,
 `النموذج بيشوف التغيير كأنه عملية حل مشكلة، مع تركيز قوي على دور الـ change agent والتخطيط المنظم.`,
 `زي ما بتحل مسألة خطوة بخطوة، بتحل مشكلة العمل بخطوات منظمة.`],
[`there are 6 steps of Havelock's Model:`,
 `في 6 خطوات في نموذج Havelock:`,
 `هنمشي عليهم بالترتيب.`],
[`1. Building a Relationship`,
 `1. بناء علاقة.`,
 `الـ change agent تتعرف على الفريق وتكسب ثقتهم الأول.`,1],
[`2. Diagnosing the Problem`,
 `2. تشخيص المشكلة.`,
 `نحدد إيه المشكلة بالظبط.`,1],
[`3. Acquiring Resources (and Information)`,
 `3. الحصول على الموارد (والمعلومات).`,
 `نجمع المعلومات والأدوات والناس اللي هنحتاجهم.`,1],
[`4. Choosing the Solution`,
 `4. اختيار الحل.`,
 `من بين الحلول، نختار الأنسب.`,1],
[`5. Gaining Acceptance (and Implementing the Change)`,
 `5. كسب القبول (وتنفيذ التغيير).`,
 `نقنع الفريق بالحل ونبدأ نطبقه.`,1],
[`6. Stabilization and Self-Renewal`,
 `6. الاستقرار والتجديد الذاتي.`,
 `التغيير يثبت، والفريق يبقى قادر يجدد ويطور نفسه من غير مساعدة.`,1],
]},

{ id:"rogers", icon:"📡", title:"4- Roger's Diffusion of Innovation Theory", items:[
[`Roggers theory explains that when a new idea, practice, or technology is introduced, not everyone adopts it at the same time.`,
 `نظرية روجرز بتشرح إنه لما بتتقدم فكرة أو ممارسة أو تكنولوجيا جديدة، مش كل الناس بتتبناها في نفس الوقت.`,
 `لما المستشفى جابت جهاز جديد، في ممرضات اشتغلوا عليه من أول يوم وفي ممرضات استنوا شهور.`],
[`Some people accept it quickly, while others resist and adopt very late.`,
 `بعض الناس بتقبله بسرعة، وناس تانية بتقاوم وبتتبناه متأخر جداً.`,
 `ممرضة متحمسة بتجرب أول ما يتعرض، وممرضة تانية بتقاوم وفي الآخر بتستخدمه بعد سنة.`],
[`Stages of Roger's diffusion of innovation theory:`,
 `مراحل نظرية روجر لانتشار الابتكار:`,
 `خمس مراحل بالترتيب.`],
[`1. Knowledge:`,
 `1. المعرفة:`,
 `أول خطوة إنك تعرف إن الحاجة الجديدة موجودة.`,1],
[`People first become aware of the innovation (e.g., a new electronic health record system in a hospital).`,
 `الناس بتبقى واعية بالابتكار لأول مرة (مثلاً نظام سجلات صحية إلكترونية جديد في المستشفى).`,
 `سمعت إن المستشفى هتدخل نظام ملفات إلكتروني.`,1],
[`2. Persuasion:`,
 `2. الإقناع:`,
 `بتبدأ تكوّن رأي عنه.`,1],
[`They form an opinion about it – is it useful? worth adopting?`,
 `بيكونوا رأي عنه: هل مفيد؟ هل يستاهل نتبناه؟`,
 `بتسأل نفسك: هل النظام ده هيسهل شغلي ولا هيتعبني؟`,1],
[`3. Decision:`,
 `3. القرار:`,
 `بتاخد قرار.`,1],
[`They decide to adopt or reject the innovation.`,
 `بيقرروا يتبنوا الابتكار أو يرفضوه.`,
 `بتقرر إنك هتستخدم النظام الجديد، أو ترفضه وتفضل على القديم.`,1],
[`4. Implementation:`,
 `4. التنفيذ:`,
 `مرحلة التطبيق الفعلي.`,1],
[`Those who accepted begin to use it in practice.`,
 `اللي قبلوه بيبدأوا يستخدموه في الواقع.`,
 `الممرضات اللي وافقوا بدأوا يسجلوا فعلاً على النظام الإلكتروني.`,1],
[`5. Confirmation:`,
 `5. التأكيد:`,
 `المرحلة الأخيرة، بتتأكد من قرارك.`,1],
[`After using it, they look for feedback or evidence to confirm they made the right decision (sometimes they may even reject it later)`,
 `بعد ما يستخدموه، بيدوروا على تغذية راجعة أو دليل يأكد إنهم أخدوا القرار الصح (ساعات ممكن يرفضوه بعدين).`,
 `بعد شهر من الاستخدام، تشوف إن النظام وفر وقت فعلاً فتكمل عليه، أو تلاقيه صعب فترجع للقديم.`,1],
]},

{ id:"forces", icon:"⚖️", title:"Forces of Change", items:[
[`These forces can be positive, urging us toward a behavior, or negative, propelling us away from a behavior.`,
 `القوى دي ممكن تبقى إيجابية بتدفعنا ناحية سلوك معين، أو سلبية بتبعدنا عن سلوك معين.`,
 `قوة إيجابية: حافز مادي بيشجعك تلتزم. قوة سلبية: خوف من العقاب بيبعدك عن إهمال الشغل.`],
[`•Driving Forces: Driving forces are those forces which tend to initiate a change and keeps it going as; working through the group, pressure from a supervisor, incentive earnings, and competition`,
 `القوى الدافعة: هي القوى اللي بتبدأ التغيير وبتخليه مستمر، زي: العمل من خلال الجماعة، وضغط المشرف، والحوافز المادية، والمنافسة.`,
 `المديرة بتضغط على الفريق، والمكافآت بتشجعهم، والتنافس بين الأقسام بيخليهم يجتهدوا. دي كلها قوى بتدفع التغيير.`],
[`• Restraining Forces: Restraining forces are forces acting to restrain or decrease the driving forces as; apathy, hostility, and poor performance.`,
 `القوى المقيدة: هي القوى اللي بتقيد أو بتقلل القوى الدافعة، زي: اللامبالاة، والعداء، وضعف الأداء.`,
 `ممرضة مش مهتمة، وواحدة معادية للتغيير، وأداء ضعيف في القسم. دي بتكبح التغيير.`],
[`• Equilibrium: Is a wanted level of productivity, can be raised or lowered by changes in the relationship between the driving and the restraining forces.`,
 `الاتزان: هو مستوى مطلوب من الإنتاجية، ممكن يرتفع أو ينخفض بتغيير العلاقة بين القوى الدافعة والقوى المقيدة.`,
 `زي ميزان: لو القوى الدافعة زادت، الإنتاجية ترتفع. ولو القوى المقيدة زادت، الإنتاجية تنزل.`],
]},

{ id:"strategies", icon:"🛠️", title:"Change Strategies", items:[
[`Three commonly strategies are used for implementing change.`,
 `في ثلاث استراتيجيات شائعة بتتستخدم لتنفيذ التغيير.`,
 `زي ما في أكتر من طريق توصل بيه لنفس المكان، في أكتر من استراتيجية للتغيير.`],
[`The appropriate strategy for any situation depends on the power of change agent and the amount of resistance expected from subordinates.`,
 `الاستراتيجية المناسبة لأي موقف بتعتمد على قوة الـ change agent وحجم المقاومة المتوقعة من المرؤوسين.`,
 `لو المديرة معاها سلطة كبيرة والمقاومة متوقعة قوية، هتختار استراتيجية غير اللي تختارها لو المقاومة قليلة.`],
[`1- Power - coercion strategy:`,
 `1- استراتيجية القوة والإكراه:`,
 `أسلوب السلطة والأمر.`],
[`Use official authority and the rewards and punishments as incentives to create change.`,
 `بتستخدم السلطة الرسمية والمكافآت والعقوبات كحوافز لإحداث التغيير.`,
 `المديرة تقول: اللي هيطبق النظام الجديد هياخد مكافأة، واللي مش هيطبقه هيتحاسب.`,1],
[`Individuals respond for fear of sanctions or a desire to get the rewards`,
 `الأفراد بيستجيبوا خوفاً من العقوبات أو رغبةً في الحصول على المكافآت.`,
 `الممرضة بتطبق النظام لأنها خايفة من الخصم أو عاوزة المكافأة، مش لأنها مقتنعة.`,1],
[`2- Logical persuasion strategy :`,
 `2- استراتيجية الإقناع المنطقي:`,
 `أسلوب الحقائق والعلم.`],
[`Facts and knowledge is used for bringing about change to persuade others that the change will make them better than the previous.`,
 `بتستخدم الحقائق والمعرفة لإحداث التغيير، عشان نقنع الآخرين إن التغيير هيخليهم أحسن من الأول.`,
 `نعرض إحصائيات إن النظام الجديد قلل الأخطاء 40% في مستشفيات تانية.`,1],
[`This type of strategy used when there is little resistance anticipated`,
 `النوع ده من الاستراتيجيات بيتستخدم لما تكون المقاومة المتوقعة قليلة.`,
 `لو الفريق متقبل وبيحب التطوير، الإقناع بالأرقام كفاية.`,1],
[`3- Force participation strategy:`,
 `3- استراتيجية المشاركة:`,
 `أسلوب إشراك الناس.`],
[`Using the methods of participation in decision-making and the emphasis on shared values to create change.`,
 `بتستخدم طرق المشاركة في اتخاذ القرار والتركيز على القيم المشتركة لإحداث التغيير.`,
 `نعمل اجتماع مع كل الممرضات ونقرر سوا إزاي هنطبق النظام الجديد، ونفكرهم بقيمنا المشتركة: سلامة المريض.`,1],
[`It requires the involvement and empowerment of individuals who are affected by the change honestly and effectively in the planning and decision-making on the president to change.`,
 `بتتطلب إشراك وتمكين الأفراد اللي هيتأثروا بالتغيير بصدق وفعالية في التخطيط واتخاذ القرار الخاص بالتغيير.`,
 `الممرضات اللي هيتأثروا بالنظام الجديد بيشاركوا فعلاً في التخطيط، مش مجرد استشارة شكلية.`,1],
]},

{ id:"emotions", icon:"🎭", title:"Emotional Responses to Change", items:[
[`1. Equilibrium: There is a sense of balance and inner peace before change occurs.`,
 `1. الاتزان: في إحساس بالتوازن والسلام الداخلي قبل ما التغيير يحصل.`,
 `الممرضة مرتاحة في شغلها ومتعودة على نظامها قبل ما حد يقولها هيتغير.`],
[`2. Denial: Energy is drained by denial of the reality.`,
 `2. الإنكار: الطاقة بتتستنزف بسبب إنكار الواقع.`,
 `بتقول: مش معقول هيغيروا النظام، أكيد كلام وهيعدي.`],
[`3. Anger: Energy is used toward off the change.`,
 `3. الغضب: الطاقة بتتستخدم لدفع التغيير بعيد.`,
 `بتتعصب وتقول: ليه بيغيروا حاجة شغالة كويس؟!`],
[`4. Bargaining: Energy is used in an attempt to eliminate the change.`,
 `4. المساومة: الطاقة بتتستخدم في محاولة لإلغاء التغيير.`,
 `بتقول للمديرة: طيب نأجله شوية أو نطبقه على قسم تاني بس.`],
[`5. Depression: No energy is left to produce results.`,
 `5. الاكتئاب: مفيش طاقة باقية لإنتاج نتايج.`,
 `بتحس بإحباط وتفقد الحماس ومبتشتغلش كويس.`],
[`6. Openness: Renewed energy is available.`,
 `6. الانفتاح: بتتوفر طاقة متجددة.`,
 `بتبدأ تفتح عقلها وتقول: طب خليني أشوف النظام الجديد ده.`],
[`7. Readiness: There is willingness to use energy to explore new events.`,
 `7. الاستعداد: في رغبة إنها تستخدم الطاقة لاستكشاف الأحداث الجديدة.`,
 `بتتدرب على النظام الجديد وعاوزة تتعلمه.`],
[`8. Resistance: Resistance to change also is to be expected as integrate to the whole process of change. Resistance occurs because people are afraid of being disorganized or having their routines interrupted`,
 `8. المقاومة: المقاومة للتغيير متوقعة كجزء من عملية التغيير كلها. المقاومة بتحصل لأن الناس بتخاف إنها تتلخبط أو إن روتينها يتقطع.`,
 `الممرضة خايفة تلخبط الشغل أو تتعب عشان روتينها اتغير، فبتقاوم.`],
]},

{ id:"resisting", icon:"🛑", title:"Reasons for Resisting Change", items:[
[`There are several reasons for resistance to change among them, for example :`,
 `في أسباب كتير لمقاومة التغيير، منها على سبيل المثال:`,
 `هنشوف التسع أسباب واحد واحد.`],
[`Insecurity and a sense of danger and fear of change with the change of routine-based .`,
 `عدم الأمان والإحساس بالخطر والخوف من التغيير بسبب تغيير الروتين المعتاد.`,
 `الممرضة متعودة على روتينها، فأي تغيير بيحسسها بالخطر.`,1],
[`Fear of not being able to implement the change .`,
 `الخوف من إنهم مش هيقدروا ينفذوا التغيير.`,
 `خايفة النظام الجديد يبقى صعب عليها وماتعرفش تشتغل بيه.`,1],
[`Not feeling the benefits of the change and the increased workload as a result of the change .`,
 `عدم الإحساس بفوايد التغيير، وزيادة عبء العمل نتيجة التغيير.`,
 `بتقول: أنا مش شايفة فايدة، وبس شغلي زاد.`,1],
[`Fear of loss social relations .`,
 `الخوف من فقدان العلاقات الاجتماعية.`,
 `ممكن التغيير ينقلها لقسم تاني وتبعد عن زمايلها.`,1],
[`Fear of losing power .`,
 `الخوف من فقدان السلطة.`,
 `رئيسة قسم خايفة إن التغيير يقلل صلاحياتها.`,1],
[`Lack of understanding the change and the inability to implement it .`,
 `عدم فهم التغيير وعدم القدرة على تنفيذه.`,
 `الممرضات مش فاهمين النظام الجديد أصلاً فمش قادرين يطبقوه.`,1],
[`Not realistic change programs .`,
 `برامج تغيير غير واقعية.`,
 `نطلب من الممرضات يطبقوا 10 تغييرات في أسبوع، وده مش واقعي.`,1],
[`Fear of losing bonuses.`,

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s, si) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    if (it.img) { body += `<div class="fig"><img src="${LEWIN_IMG}" alt="Unfreeze - Change - Refreeze"></div>`; return; }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      <div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
