<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:#1e3a8a; --teal:#0e7490; --emerald:#10b981; --gold:#f59e0b;
  --accent:#0e7490; --accent-glow:rgba(14,116,144,0.18); --accent-rgb:14,116,144;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --grad-bar:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b);
  --bg:#f8fafc; --bg2:#eef2f7; --card:#ffffff;
  --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07);
  --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --card:#1c2333;
  --text:#e6edf3; --text2:#b1bac4; --text3:#7d8590;
  --bc:rgba(255,255,255,0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(248,250,252,.93); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(13,17,23,.95); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon {
  width:34px; height:34px; border-radius:8px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:900; box-shadow:0 0 0 2px rgba(245,158,11,.5);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:50px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Outfit',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; border-radius:50%; font-size:15px; }
.theme-btn:hover { border-color:var(--accent); transform:rotate(20deg); }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }
.tool-btn.off { opacity:.55; }

.hero-band {
  margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--gold);
}
.hero-band::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(245,158,11,.22) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(16,185,129,.28) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px;
}
.meta-pill i { color:var(--gold); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:50px; font-size:12px; font-weight:700;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--grad); color:#fff; border-color:transparent; }

.shell { max-width:860px; margin:0 auto; padding:24px 20px 80px; }

/* SECTION */
.sec { margin-bottom:34px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:16px 16px 0 0; border-bottom:3px solid var(--gold);
}
.sec-icon {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:17px; font-weight:900; line-height:1.3; }
.sec-count { margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:50px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.subhead {
  font-size:13px; font-weight:900; color:var(--navy); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--gold);
  border-radius:8px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#7dd3fc; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-radius:14px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.4); box-shadow:0 4px 14px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left:3px solid var(--teal); }
.pt.done { opacity:.55; }

.pt-en {
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px;
  font-size:15px; font-weight:700; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff;
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
}
.pt-ar {
  padding:12px 16px; font-size:14.5px; line-height:1.9; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:11px; font-weight:900; padding:2px 9px; border-radius:6px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(14,116,144,.12); color:var(--teal); }
[data-theme="dark"] .pt-ar .tag { color:#5eead4; }
.pt-ex {
  padding:12px 16px; font-size:14px; line-height:1.9; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(245,158,11,.07); border-right:4px solid var(--gold);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ex .tag { background:rgba(245,158,11,.2); color:#b45309; }
[data-theme="dark"] .pt-ex .tag { color:#fbbf24; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}

.fig { margin:4px 0; text-align:center; }
.fig img { max-width:100%; height:auto; border-radius:14px; border:1px solid var(--bc); box-shadow:0 4px 16px rgba(0,0,0,.08); }
.pt-en a { color:var(--teal); word-break:break-all; font-weight:600; }
[data-theme="dark"] .pt-en a { color:#5eead4; }

</style>
</head>

{ id:"intro", icon:"📖", title:"Introduction", items:[
["Marketing is essential for any business to thrive.",
 "التسويق ضروري لأي بيزنس عشان يكمّل وينجح.",
 "زي أي مشروع: لو محدش عارف إنه موجود، مش هيجيله عملاء وهيقفل."],
["Since healthcare systems are fundamentally businesses, they rely on promotion and advertising to attract patients.",
 "لأن أنظمة الرعاية الصحية في الأساس بيزنس، فهي بتعتمد على الترويج والإعلان عشان تجذب المرضى.",
 "المستشفى الخاصة بتعمل إعلانات وحملات توعية عشان الناس تيجي تتعالج عندها."],
["Because nurse administrators are involved in both patient care and the operation of their organization, they have a unique perspective on what their institution can provide.",
 "علشان الـ nurse administrators شغالين في رعاية المريض وفي إدارة المؤسسة في نفس الوقت، فعندهم نظرة مميزة لإيه اللي مؤسستهم تقدر تقدمه فعلاً.",
 "مديرة التمريض عارفة شغل الأقسام من جوه وعارفة الإمكانيات المتاحة، فهي أدرى حد بإيه اللي المستشفى تقدر تعد بيه الناس."]
]},

{ id:"definitions", icon:"📚", title:"Definitions — Market & Marketing", items:[
{h:"Definition of Market"},
["Market: A place where parties can gather to facilitate the exchange of goods and services.",
 "السوق هو مكان بيتجمع فيه الأطراف عشان يسهّلوا تبادل السلع والخدمات بينهم.",
 "سوق الخضار: البياع بيدي خضار والزبون بيدفع فلوس، يعني تبادل."],
{img:"IMG1"},
{h:"Definition of Marketing"},
["Marketing is a social and managerial process by which individuals and groups obtain what they want through exchanging products and services with others.",
 "التسويق عملية اجتماعية وإدارية بيحصل من خلالها الأفراد والجروبات على اللي هم عايزينه عن طريق تبادل المنتجات والخدمات مع الناس التانية.",
 "أنا محتاج خدمة علاج طبيعي، والمركز عنده الخدمة دي، فبنتبادل: أنا أدفع وهو يديني الخدمة."],
["Marketing is getting the right goods and services to the right people at the right places at the right time at the right price with the right communication and promotion.",
 "التسويق هو إنك توصّل السلعة أو الخدمة الصح، للناس الصح، في المكان الصح، في الوقت الصح، بالسعر الصح، مع التواصل والترويج الصح.",
 "عيادة سكر للمرضى (الخدمة الصح) جنب تجمع سكني فيه كبار سن (الناس والمكان الصح) بمواعيد مناسبة وسعر مناسب وإعلان واضح."],
["Marketing is the process of developing, promoting, and distributing products to satisfy customers’ needs and wants.",
 "التسويق هو عملية تطوير المنتجات والترويج ليها وتوزيعها عشان تلبّي احتياجات ورغبات العملاء.",
 "المستشفى تطلّع خدمة جديدة، تعلن عنها، وتوصلها للناس في فروعها، عشان تغطي احتياج الناس."],
["Exchange Is the defining concept that underlies marketing and involves three conditions:",
 "الـ Exchange (التبادل) هو الفكرة الأساسية اللي التسويق قايم عليها، وليه ٣ شروط:",
 "زي معادلة: من غير تبادل مفيش تسويق، والتبادل لازم تتحقق فيه الشروط التلاتة."],
["1. There are at least two parties",
 "فيه على الأقل طرفين.",
 "مريض ومستشفى، مينفعش واحد لوحده.", 1],
["2. Each party offers something that the other considers valuable",
 "كل طرف بيقدم حاجة الطرف التاني شايفها ليها قيمة.",
 "المريض بيقدم فلوس والمستشفى بتقدم علاج، وكل واحد شايف اللي عند التاني مهم.", 1],
["3. Each party is free to accept or reject the offer",
 "كل طرف حر إنه يقبل العرض أو يرفضه.",
 "المريض حر يختار المستشفى دي أو التانية، ومحدش بيجبره.", 1]
]},

{ id:"types", icon:"🔀", title:"Types of Marketing", items:[
["There are two Basic Types of Marketing",
 "فيه نوعين أساسيين للتسويق.",
 "تفتكرهم كده: 1- Internal (جوه المؤسسة) و 2- External (برّه المؤسسة)."],
["1- Internal",
 "النوع الأول: التسويق الداخلي.",
 "الموجّه للموظفين اللي جوه المستشفى.", 1],
["2- External",
 "النوع التاني: التسويق الخارجي.",
 "الموجّه للناس اللي برّه المستشفى.", 1],
{h:"Internal marketing"},
["Internal marketing defined as process of attracting, developing, motivating, and retaining qualified employee through job, products that satisfy their needs.",
 "التسويق الداخلي هو عملية جذب وتطوير وتحفيز والاحتفاظ بالموظفين المؤهلين من خلال وظيفة ومنتجات بتلبّي احتياجاتهم.",
 "المستشفى تعيّن ممرضة شاطرة، تدّيها كورسات وحوافز ومرتب كويس، عشان متسيبش الشغل."],
["It means engaging nurses and other healthcare staff, motivating them, and providing continuous development so they can deliver high-quality, patientcentered care.",
 "يعني إنك تشرك التمريض وباقي الفريق الطبي، وتحفزهم، وتوفرلهم تطوير مستمر عشان يقدموا رعاية عالية الجودة متمركزة حوالين المريض.",
 "ممرضة بتتدرب كل فترة على أحدث البروتوكولات ومتحفزة، فبتتعامل مع المريض أحسن."],
["Internal marketing is the practice of treating employees as internal customers by using marketing-like strategies such as communication, training, and motivation to enhance their satisfaction, commitment, and performance, which ultimately leads to better service quality for external customers.",
 "التسويق الداخلي هو إنك تعامل الموظفين كأنهم عملاء داخليين، وتستخدم معاهم استراتيجيات شبه التسويق زي التواصل والتدريب والتحفيز، عشان ترفع رضاهم والتزامهم وأداءهم، وده في الآخر بيحسّن جودة الخدمة للعملاء الخارجيين (المرضى).",
 "الموظف الراضي بيشتغل بحب وبيخلّي المريض راضي. يعني رضا الموظف بيوصل لرضا المريض."],
{h:"External marketing"},
["External marketing refers to all strategies and activities that organizations use to communicate and deliver value to audiences outside the organization, including customers, partners, and the public, in order to create awareness, satisfaction, and long-term loyalty.",
 "التسويق الخارجي هو كل الاستراتيجيات والأنشطة اللي المؤسسة بتستخدمها عشان توصّل القيمة للجمهور اللي برّه المؤسسة (عملاء وشركاء وعامة الناس)، عشان تخلق وعي ورضا وولاء طويل المدى.",
 "حملة إعلانية عن خدمات المستشفى للناس، فيعرفوها وتبقى هي اختيارهم الدايم."],
["It focuses on promoting healthcare services to patients and the community, highlighting quality of care, patient-centered approaches, and building the hospital’s credibility.",
 "بيركز على الترويج للخدمات الصحية للمرضى والمجتمع، وإبراز جودة الرعاية والاهتمام بالمريض، وبناء مصداقية المستشفى.",
 "المستشفى تنشر إنجازاتها ونسبة رضا المرضى، فالناس تثق فيها أكتر."],
{img:"IMG2"}
]},

{ id:"principles", icon:"🧭", title:"Principle of Marketing", items:[
["1. Market begins and ends with customer needs.",
 "السوق بيبدأ وبينتهي باحتياجات العميل.",
 "نبدأ بنسأل المريض محتاج إيه، وفي الآخر نقيس هل احتياجه اتلبّى ولا لأ."],
["2. Customer satisfaction is a major concept of business..",
 "رضا العميل هو مفهوم رئيسي في أي بيزنس.",
 "المريض الراضي بيرجع تاني وبينصح غيره ييجي."],
["3. Broadening the definition of the organization's mission is another principle important in marketing.",
 "توسيع تعريف رسالة المؤسسة هو مبدأ تاني مهم في التسويق.",
 "بدل ما نقول «إحنا بنعالج مرضى» بس، نقول «إحنا بنهتم بصحة المجتمع كله»، فنوسّع الخدمات (توعية، وقاية، متابعة)."],
["4. Researching the needs of the consumer is an important part of the marketing concept.",
 "عمل بحث عن احتياجات المستهلك جزء مهم من مفهوم التسويق.",
 "استبيان بنسأل فيه المرضى عايزين إيه من المستشفى قبل ما نضيف قسم جديد."],
["5. The acceptance by the top management official of the place of marketing within the organization",
 "إن الإدارة العليا تقبل وتعترف بمكانة التسويق جوه المؤسسة.",
 "لو مدير المستشفى مش مقتنع بأهمية التسويق، مش هيدّي له ميزانية ولا دعم."],
["6. A focus on profit versus sales is necessary to the marketing concept.",
 "التركيز على الربح مش على المبيعات بس ضروري لمفهوم التسويق.",
 "ممكن تزوّد عدد المرضى (مبيعات) بس تخسر لأن التكلفة عالية. المهم الربح الفعلي مش العدد بس."]
]},

{ id:"mix", icon:"🧩", title:"Marketing Mix", items:[
["Marketing mix: A common classification that began as the four Ps: product, price, placement, and promotion.",
 "الـ Marketing mix تصنيف شائع بدأ بأربع حروف P: المنتج، السعر، المكان، والترويج.",
 "٤ P: Product, Price, Place, Promotion."],
{img:"IMG3"},
["Product: Something provided for consumption to satisfy a need or want. The inventory of services, analysis of costs, benefits, and target markets indicate which products are overused, underused, and cost-effective and which are perceived as strong or weak.",
 "المنتج هو أي حاجة بتتقدم للاستهلاك عشان تلبّي احتياج أو رغبة. وحصر الخدمات وتحليل التكاليف والفوائد والأسواق المستهدفة بيوضح أنهي منتجات مستخدمة أكتر من اللازم، وأنهي أقل من اللازم، وأنهي مربحة، وأنهي شايفها الناس قوية أو ضعيفة.",
 "المستشفى تعمل حصر لخدماتها: قسم الأشعة عليه ضغط جامد، وقسم العلاج الطبيعي فاضي، فتعرف تعدّل خطتها."],
["Price: Cost of product tries to set the maximum price that the demand for the product or service will bear.",
 "السعر هو تكلفة المنتج، وبنحاول نحدد أعلى سعر ممكن الطلب على المنتج أو الخدمة يتحمله.",
 "نحط سعر للكشف أعلى حاجة الناس تقبلها ومتهربش منها."],
["Place: Involves the physical location, appearance of the location, its accessibility and availability, resource utilization, referral mechanisms, and distribution.",
 "المكان بيشمل الموقع الفعلي، ومنظر المكان، وسهولة الوصول ليه وإتاحته، واستغلال الموارد، وآليات التحويل (referral)، والتوزيع.",
 "مستشفى على طريق رئيسي، نضيفة ومنظمة، ومواصلاتها سهلة، وبتحوّل الحالات لمراكز أكبر عند الحاجة."],
["Promotion: Informs potential consumers of the existence and availability of products and services and persuades them of the benefits to them.",
 "الترويج بيعرّف المستهلكين المحتملين بوجود المنتجات والخدمات وإنها متاحة، وبيقنعهم بفايدتها ليهم.",
 "إعلان بيقول «عندنا وحدة قلب جديدة شغالة ٢٤ ساعة» ويشرح فايدتها للناس."]
]},

{ id:"process", icon:"🔄", title:"Marketing Process", items:[
["Marketing process similar to the nursing process, designed to analyze and solve problems.. It uses assessment, planning, implementation, and control of programs designing to create voluntary exchanges of values between an organization and target markets in order to achieve objectives.",
 "عملية التسويق شبه عملية التمريض (nursing process)، ومصممة لتحليل المشاكل وحلها. بتستخدم التقييم والتخطيط والتنفيذ والمراقبة لبرامج متصممة عشان تخلق تبادل قيم بإرادة الطرفين بين المؤسسة والأسواق المستهدفة لتحقيق الأهداف.",
 "زي ما التمريض بيقيّم المريض ويخطط وينفذ ويقيّم النتيجة، التسويق كمان بيمشي بنفس الخطوات."],
["Effective marketing is a process composed of (4) steps: assessment, planning, implementation and evaluation or control.",
 "التسويق الفعّال عملية مكوّنة من ٤ خطوات: التقييم، التخطيط، التنفيذ، والتقويم أو المراقبة.",
 "ترتيبهم: Assessment ← Planning ← Implementation ← Evaluation."],
{h:"1- Assessment"},
["In the marketing process, environmental assessment is conducted to identify and research the target market.",
 "في عملية التسويق بنعمل تقييم للبيئة عشان نحدد السوق المستهدف ونعمل عنه بحث.",
 "قبل ما نفتح قسم جديد نعرف مين الناس اللي هنخدمهم وإيه احتياجاتهم."],
["Analyzing market situation based on information and research including (swot) analysis (analysis of internal and external markets)",
 "تحليل وضع السوق بناءً على معلومات وبحث، ومنها تحليل SWOT (تحليل السوق الداخلي والخارجي).",
 "نشوف نقط قوتنا وضعفنا جوه المستشفى، والفرص والتهديدات اللي برّه."],
["Then identify customer needs and requirement and try to meet these needs in better ways than competitors",
 "بعد كده نحدد احتياجات ومتطلبات العملاء ونحاول نلبّيها بطريقة أحسن من المنافسين.",
 "لو المنافس مواعيده متأخرة، إحنا نخلّي عندنا حجز سريع."],
["1. The organization should be assessed (mission, philosophy, goals, and objectives)",
 "لازم نقيّم المؤسسة نفسها (الرسالة، الفلسفة، الأهداف).",
 "نراجع إحنا بنقدم إيه وعايزين نوصل لإيه.", 1],
["2. Analyze the service (how can needed material, supplies, and personnel be obtained)",
 "نحلل الخدمة (إزاي نوفر المواد والمستلزمات والعاملين المطلوبين).",
 "قبل ما نبدأ وحدة غسيل كلى نسأل: الأجهزة منين؟ والممرضين المدرّبين منين؟", 1],
["3. Who are the competitors",
 "مين المنافسين.",
 "المستشفيات التانية في نفس المنطقة.", 1],
["4. What are the perceptions of the nursing market",
 "إيه انطباعات سوق التمريض (الناس شايفة التمريض عندنا إزاي).",
 "الناس شايفة تمريضنا محترم ولا لأ.", 1],
["5. What is the organization's pricing philosophy",
 "إيه فلسفة التسعير في المؤسسة.",
 "هل إحنا اقتصاديين ولا بريميوم؟", 1],
["6. In what location is your service provided",
 "الخدمة بتتقدم في أنهي مكان.",
 "في المستشفى الرئيسي ولا في فرع تاني ولا زيارات منزلية.", 1],
["7. What is the purpose of promotion, is it effective",
 "إيه هدف الترويج، وهل هو فعّال.",
 "هل إعلاناتنا فعلاً جابت مرضى جداد؟", 1],
{h:"Tool used in Assessment"},
["Questionnaire administered by mail, telephone",
 "استبيان بيتوزّع بالبريد أو بالتليفون.",
 "نبعت استبيان رضا للمرضى بعد الخروج."],
["Interview",
 "مقابلة شخصية.",
 "نقعد مع مريض أو أهله ونسألهم عن تجربتهم."],
["Observations",
 "الملاحظة.",
 "نراقب زحمة الاستقبال وطريقة التعامل."],
["Consumer panel",
 "مجموعة ثابتة من المستهلكين بنرجعلهم كل فترة ناخد رأيهم.",
 "مجموعة مرضى بنسألهم كل ٣ شهور عن الخدمة."],
["Review records",
 "مراجعة السجلات.",
 "نبص في ملفات المرضى وإحصائيات الدخول."],
["Scientific research",
 "البحث العلمي.",
 "دراسة منشورة عن احتياجات مرضى القلب."],
{h:"2-Planning"},
["1. The environmental assessment is followed by the development of marketing plan, this plan outlines the service or program to be provided, detailed budget / cost analysis, and the promotional activities designed to promote the program. And developed mission , goal setting and objectives",
 "بعد التقييم بنعمل خطة التسويق، والخطة دي بتوضح الخدمة أو البرنامج اللي هيتقدم، وتحليل مفصّل للميزانية والتكلفة، وأنشطة الترويج للبرنامج، وكمان بنطوّر الرسالة ونحدد الأهداف.",
 "الخطة زي برنامج رعاية المريض، مكتوب فيها هنقدم إيه وبكام وإزاي هنعلن عنه.", 1],
["2. Marketing mix must be developed (product , price, place , promotion)",
 "لازم نطوّر الـ Marketing mix (المنتج، السعر، المكان، الترويج).",
 "نحدد الخدمة وسعرها ومكانها وطريقة الإعلان عنها.", 1],
{h:"3-Implementation"},
["The implementation phase includes establishing the program and promotional activities designed to communicate benefits of the service / program to clients.",
 "مرحلة التنفيذ بتشمل إطلاق البرنامج وأنشطة الترويج اللي بتوصّل فوايد الخدمة أو البرنامج للعملاء.",
 "نفتح العيادة الجديدة ونطلق حملة بتقول للناس ليه تروح لها."],
["Forms of promotion may include media release , brochures , pamphlets , newsletters and ward of mouth (advertising).",
 "أشكال الترويج ممكن تكون بيان إعلامي، بروشورات، كتيّبات، نشرات، وكلام الناس لبعض (إعلان).",
 "بروشور بيتوزع في الاستقبال، ومريض راضي بيحكي لجاره."],
["It includes obtaining market feedback which measure success against objectives and identify gabs between planned and actual goals.",
 "وبتشمل كمان الحصول على feedback من السوق بيقيس النجاح مقابل الأهداف، ويحدد الفجوات بين المخطط والفعلي.",
 "كنا مخططين ١٠٠ مريض في الشهر وجالنا ٦٠، يبقى فيه فجوة ٤٠."],
{h:"4-Evaluation and control"},
["Evaluation can be done more or less often—daily through weekly, monthly, yearly, or on a more extended basis to determine whether implementation is accomplishing desired results.",
 "التقييم ممكن يتعمل كتير أو قليل: يومي أو أسبوعي أو شهري أو سنوي أو على فترة أطول، عشان نعرف التنفيذ بيحقق النتايج المطلوبة ولا لأ.",
 "زي ما بنقيّم حالة المريض كل وردية، بنقيّم الحملة كل فترة."],
["The evaluation include satisfaction surveys, interviews , with clients and further research studies designed to assess reason why clients are using or not using the services or product , feedback is essential component of the marketing process.",
 "التقييم بيشمل استبيانات رضا ومقابلات مع العملاء ودراسات بحثية إضافية لمعرفة ليه العملاء بيستخدموا الخدمة أو مش بيستخدموها، والـ feedback جزء أساسي من عملية التسويق.",
 "نسأل: ليه ناس بتروح مستشفى تانية؟ والإجابة بتعدّل خطتنا."],
["It involves identifying the following:",
 "وبيشمل تحديد الآتي:",
 "التلات نقط دي هي ملخص الـ control."],
["1. It measure success against objectives and identify gab between planned and actual goals",
 "يقيس النجاح مقابل الأهداف ويحدد الفجوة بين الأهداف المخططة والفعلية.",
 "الهدف ١٠٠ والفعلي ٦٠.", 1],
["2. Determining reason for Variance between planned and actual results,",
 "تحديد سبب الاختلاف بين النتايج المخططة والفعلية.",
 "ليه ٦٠ مش ١٠٠؟ ممكن الإعلان ضعيف أو السعر عالي.", 1],
["3. Correcting action based on causal analysis, and revising goals.",
 "اتخاذ إجراء تصحيحي بناءً على تحليل الأسباب، ومراجعة الأهداف.",
 "نحسّن الإعلان ونخفض السعر ونعدّل الهدف لو كان مبالغ فيه.", 1]
]},

{ id:"tools", icon:"📣", title:"Marketing Tools", items:[
["1- Advertising :The most public face in marketing include ads in newspaper magazine , journals , telephone directories ,radio and TV",
 "الإعلان: هو أكتر وش عام للتسويق، وبيشمل إعلانات في الجرايد والمجلات والدوريات ودلائل التليفونات والراديو والتليفزيون.",
 "إعلان عن المستشفى في التليفزيون أو في جريدة."],
["2- Printed materials: as Agenda, , telephone , stickers , and news letter",
 "المواد المطبوعة: زي الأجندة والتليفون والستيكرز والنشرة الدورية.",
 "أجندة عليها اسم المستشفى ورقم التليفون، وستيكر على الشنطة."],
["3-Customers interview.",
 "مقابلات العملاء.",
 "نقعد مع المرضى ونسمع رأيهم."],
["4-Web site.",
 "الموقع الإلكتروني.",
 "موقع المستشفى فيه الأقسام والمواعيد وأرقام الحجز."],
["5-Internet marketing",
 "التسويق عبر الإنترنت.",
 "صفحة المستشفى على فيسبوك بتنشر نصايح صحية وخدماتها."]
]},

{ id:"failures", icon:"⚠️", title:"Marketing Failures", items:[
{img:"IMG4"},
["Marketing failures: Common failures are often due to several factors:",
 "فشل التسويق: الفشل الشائع غالباً بيحصل بسبب كذا عامل:",
 "العوامل دي ممكن تبوّظ أي حملة حتى لو الفكرة كويسة."],
["Failure to collect data prior to making decisions.",
 "إنك متجمعش بيانات قبل ما تاخد القرار.",
 "تفتح قسم جديد من غير ما تعرف الناس محتاجة إيه، وبعدين القسم يفضل فاضي.", 1],
["Data may be collected but not carefully interpreted; managers may not neutrally evaluate information.",
 "ممكن البيانات تتجمع بس متتفسرش بعناية، والمديرين ممكن ميقيّموش المعلومات بحياد.",
 "الاستبيان قال إن الناس مش راضية، والمدير فسّرها إنها حالات فردية وتجاهلها.", 1],
["Un clear objectives",
 "أهداف مش واضحة.",
 "نقول «عايزين نحسّن الخدمة» من غير رقم أو وقت، فمحدش يعرف نجحنا ولا لأ.", 1]
]},

{ id:"skills", icon:"🧠", title:"Nursing Skills Need for Marketing", items:[
["Leadership skill.", "مهارة القيادة.", "ممرضة بتقود فريقها لتحسين الخدمة."],
["Communication skill.", "مهارة التواصل.", "تشرح للمريض وأهله الخدمات المتاحة بأسلوب بسيط."],
["Critical thinking skill.", "مهارة التفكير الناقد.", "تحلل ليه المرضى بيشتكوا من الانتظار بدل ما تتجاهل."],
["Decision making skill", "مهارة اتخاذ القرار.", "تقرر تعدّل نظام الاستقبال بناءً على الشكاوى."],
["Open mind.", "عقل منفتح.", "تقبل فكرة جديدة من زميلة أصغر منها."],

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s, si) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    if (it.img) { body += `<div class="fig"><img src="${IMGS[it.img]}" alt=""></div>`; return; }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      ${it[2] ? `<div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>` : ''}
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
