const D=[
{t:"Definition",p:"66",items:[
["It is a periodic formal evaluation that attempts to evaluate the individual employee and the extent to which he / she succeeds in his / her present job and shows promise for the future.","تقييم رسمي بيتعمل كل فترة للموظف، عشان نشوف هو نجح قد إيه في شغله الحالي، وكمان شايفين فيه مستقبل ولا لأ.","الممرضة اتقيّمت رسمي آخر السنة: نجحت في شغل القسم دلوقتي وكمان باين إنها تنفع تبقى مسؤولة بكرة."],
["OR","",""],
["Performance appraisals is a control process in which employee's performances are evaluated against standards.","تقييم الأداء ده عملية رقابة، بنقارن فيها أداء الموظف بمعايير موضوعة من قبل.","المعيار إن الممرضة تدّي الدواء في معاده. بنشوف هي بتلتزم بالمعيار ده قد إيه."]]},
{t:"Purposes of performance appraisal",p:"66-67",items:[
["1. Judgment purposes ( Administrative decision ) : When performance appraisals are accomplished for the purpose of :","أول غرض هو الحُكم: التقييم هنا بيتعمل عشان تتاخد قرارات إدارية على الموظف، وبيتعمل في الحالات اللي جاية.","التقييم هنا زي نتيجة امتحان بتحدد مين ينجح ومين يترقى."],
["Determining salary standard and salary increases and / or awarding merit increases.","تحديد مستوى المرتب والزيادات، و/أو إدّي علاوة تميّز للشاطر.","الممرضة المتميزة تاخد علاوة أكتر من اللي أداؤها عادي."],
["Selecting qualified individuals for promotion and / or transfers.","اختيار الأشخاص المؤهلين للترقية و/أو النقل.","نختار الأكفأ تبقى Head Nurse، أو ننقل ممرضة لقسم يناسبها."],
["Demoting or terminating employment due to unsatisfactory performance","تنزيل الدرجة أو إنهاء الخدمة لو الأداء مش مرضي.","موظفة أداؤها وحش ومفيش تحسن بعد فرص كتير، ممكن تتنزل درجة أو تتفصل."],
["2. Developmental purposes : Are predominantly educative and involve","تاني غرض هو التطوير: غالبًا تعليمي، يعني الهدف إننا نبني الموظف مش نحاسبه، وبيشمل النقط الجاية.","زي مدرب كورة بيراجع اللعب مع اللاعب عشان يتحسن، مش عشان يطرده."],
["Providing career development by identifying career aspirations and setting realistic career objectives.","نساعد الموظف في مساره الوظيفي، نعرف طموحه ونحط أهداف واقعية يقدر يوصلها.","ممرضة عايزة تبقى متخصصة عناية مركزة؛ نحط لها خطة واقعية بكورسات وخبرة لحد ما توصل."],
["Motivating personnel toward higher achievement by providing feedback of job – related strengths and weaknesses and by encouraging the need to meet organizational standards.","نحفّز الموظفين يحققوا أكتر، بإننا نقولهم نقط القوة والضعف في شغلهم، ونشجعهم يوصلوا لمعايير المؤسسة.","نقول لها: إنتي ممتازة في التعامل مع المرضى، لكن محتاجة تسرّعي في التوثيق، فتتحمس تتحسن."],
["Improving performance by examining and encouraging better interpersonal relationships among group members ( communication).","نحسّن الأداء عن طريق فحص وتشجيع علاقات أحسن بين أعضاء الفريق (التواصل).","لو الممرضات مش بيتواصلوا كويس وقت تسليم الشيفت، التقييم يكشف المشكلة ونحسّن التواصل فيتحسن الشغل."],
["Aiding manager's coaching and counseling to help the employee overcome performance deficiencies.","نساعد المدير في التوجيه والإرشاد، عشان الموظف يتغلب على نقط الضعف في أدائه.","المديرة تقعد مع ممرضة بتغلط في حساب الجرعات وتوجهها وتدربها لحد ما تتحسن."],
["Determining training and development needs of nurses.","نحدد احتياجات التدريب والتطوير للممرضين.","لو كتير غلطوا في العناية بالجروح، يبقى محتاجين كورس تدريبي في العناية بالجروح."]]},
{t:"Performance Appraisal Process",p:"67",items:[
["performance appraisal process is an ongoing process.","عملية التقييم عملية مستمرة، مش بتحصل مرة وتخلص.","زي مذاكرتك على طول السنة، مش ليلة الامتحان بس."],
["performance appraisal process include.","عملية التقييم بتشمل الخطوات الآتية.","كأنها 4 مراحل ورا بعض."],
["Step 1. Job analysis.","الخطوة الأولى: تحليل الوظيفة.","نكتب بالظبط الممرضة في العناية المركزة مطلوب منها إيه."],
["This is logically our first step because if we don’t know what a job consists of, how can we possibly evaluate an employee’s performance?","دي أول خطوة منطقيًا، لأننا لو مش عارفين الوظيفة فيها إيه، نقيّم الموظف على أساس إيه؟","مش هتقدر تصحح امتحان من غير ما تعرف الإجابة النموذجية."],
["Step 2. Develop standards and measurement methods.","الخطوة التانية: نحط معايير وطرق قياس.","نحدد إن الممرضة تاخد العلامات الحيوية كل ساعتين، وتتقاس بنموذج المتابعة."],
["If we don’t have standards of acceptable behavior and methods to measure performance, how can we assess performance","لو معندناش معايير للسلوك المقبول وطرق نقيس بيها، هنقيّم الأداء إزاي؟","زي ما تحكم على سباق من غير خط نهاية ولا ساعة."],
["Step 3. Informal performance appraisal—coaching and disciplining.","الخطوة التالتة: تقييم غير رسمي، يعني توجيه وتأديب.","المديرة تلاحظ الممرضة وتقول لها: عملتي كويس، أو: ده غلط وتعمليه كده."],
["people need regular feedback on their performance to know how they are doing.","الناس محتاجة رأي منتظم في أدائها عشان تعرف ماشية إزاي.","زي ما بتعرف درجاتك أول بأول مش آخر السنة بس."],
["Step 4. Prepare for and conduct the formal performance appraisal.","الخطوة الرابعة: نجهّز للتقييم الرسمي وننفذه.","نجهز الاستمارة والملاحظات، وبعدين نقعد مع الموظفة جلسة التقييم."],
["The common practice is to have a formal performance review with the boss once or sometimes twice a year using one or more of the measurement forms.","المعتاد إن يبقى فيه مراجعة رسمية مع المدير مرة أو أحيانًا مرتين في السنة، باستخدام نموذج قياس أو أكتر.","زي امتحان ترم أول وترم تاني بالظبط."]]},
{t:"Characteristics of an evaluation tool",p:"67-68",items:[
["A good evaluation tool meets the following requirement :","أداة التقييم الكويسة لازم تحقق الشروط الآتية.","زي الميزان الكويس لازم يكون دقيق وسهل."],
["Based on the mission and objectives: we need to ensure that the performance management process guides our employees toward achievement of the company’s mission and objectives over time.","تبقى مبنية على رسالة المؤسسة وأهدافها: لازم نتأكد إن إدارة الأداء بتوجّه الموظفين لتحقيق رسالة وأهداف المؤسسة مع الوقت.","لو هدف المستشفى سلامة المريض، التقييم يشمل بنود سلامة المريض."],
["Acceptable and feasible: acceptability means that the use of the measure is satisfactory or appropriate to the people who must use it,","مقبولة وممكنة التنفيذ: المقبولية معناها إن استخدام المقياس مرضي ومناسب للناس اللي هتستخدمه،","لو الممرضات والمديرات مرتاحين للاستمارة يبقى مقبولة."],
["However, in performance appraisal, this isn’t enough. Acceptability must include whether or not the evaluation tool is feasible.","لكن في تقييم الأداء ده مش كفاية، لازم المقبولية تشمل كمان إن الأداة دي ممكن تتطبق عمليًا.","استمارة جميلة بس تاخد ساعتين لكل ممرضة، مقبولة بس مش عملية."],
["Utility : The tool is actually useful in promoting change in behavior .","الفائدة: الأداة بتفيد فعلًا في تغيير السلوك.","بعد التقييم الممرضة تغيّر عادة غلط عندها."],
["Simplicity : it is easy to use , not requiring complicated procedure .","البساطة: سهلة الاستخدام ومش محتاجة إجراءات معقدة.","استمارة صفحة واحدة وواضحة أحسن من 10 صفحات."],
["Validity : is the degree to which a tool measures what it intends to measure , i.e. it reflects the key job requirement ; so as to measure the performance of tasks included in employee job description .","الصدق: درجة إن الأداة بتقيس اللي المفروض تقيسه، يعني بتعكس متطلبات الوظيفة الأساسية، فتقيس مهام الوصف الوظيفي للموظف.","تقييم ممرضة العناية بأسئلة عن شغل الإدارة مش صادق، لأنه مش بيقيس شغلها."],
["Discrimination : the tool should be capable of discriminating among individuals according to their performance .","التمييز: الأداة لازم تفرّق بين الأفراد حسب أدائهم.","تبيّن مين ممتاز ومين متوسط ومين ضعيف."],
["Event – oriented : real behavior not employee traits","موجهة للأحداث: بتقيّم السلوك الحقيقي اللي حصل، مش صفات الموظف.","نقول: اتأخرت عن العلاج 3 مرات، مش: إنتي مهملة."],
["Appropriate weighting : the tool balances categories on the basis of their importance .","الوزن المناسب: الأداة بتوازن بين البنود حسب أهميتها.","بند سلامة المريض ياخد درجة أعلى من بند شكل الملفات."],
["Reliability : concerns stability and consistency of results when used for a series of measurements or used by different evaluators .","الثبات: يعني النتايج تبقى مستقرة ومتسقة لما الأداة تتكرر أو لما يستخدمها أكتر من مقيّم.","مديرتين قيّموا نفس الممرضة بنفس الأداة يطلعوا تقريبًا نفس النتيجة."],
["Objectivity : is the ability to remove emotionally from a situation so as to consider the facts without distortion by personal feelings .","الموضوعية: إنك تبعد عاطفيًا عن الموقف وتبص على الحقائق من غير ما مشاعرك الشخصية تشوّهها.","متظلمش ممرضة عشان مش بتحبها، قيّمها على شغلها بس."]]},
{t:"Evaluation principles",p:"68-69",items:[
["Certain principles must be followed to evaluate a subordinate's job performance accurately and fairly :","فيه مبادئ لازم تتّبع عشان نقيّم أداء المرؤوس بدقة وعدل.","زي قواعد التحكيم في ماتش عشان يبقى عادل."],
["1. The employee's evaluation should be based on behaviorally stated performance standard for the position occupied .","1. تقييم الموظف يتبني على معيار أداء متكتوب بصيغة سلوكية للوظيفة اللي بيشغلها.","المعيار: بتغسل إيديها قبل كل مريض. ده سلوك واضح يتقاس."],
["2. Site specific examples of satisfactory and unsatisfactory performance .","2. نذكر أمثلة محددة من موقع الشغل للأداء المرضي وغير المرضي.","نقول: يوم الأحد في الشيفت وثّقتي كل شيء كويس، بدل كلام عام."],
["3. Indicate which job areas ( s ) have highest priority for improvement","3. نوضح أي مجالات في الوظيفة ليها أولوية أعلى في التحسين.","نقول لها: ركزي الأول على حساب الجرعات وبعدها باقي النقط."],
["4. Purpose of evaluation is to improve work performance and job satisfaction , rather than to threaten or punish the employee for performance inadequacy .","4. هدف التقييم تحسين الأداء والرضا الوظيفي، مش تهديد الموظف أو عقابه على القصور.","التقييم علشان تساعدها تتحسن، مش علشان تخوّفها."],
["5. Compare supervisor's evaluation with employee's self-evaluation .","5. نقارن تقييم المشرف بتقييم الموظف لنفسه.","المديرة تدّي نقطة 3 والممرضة تدّي نفسها 5، ونتناقش في الفرق."],
["6. The evaluation conference should be scheduled at a time convenient for nurse and manager , held in pleasant surroundings . It should allow adequate time for discussion .","6. مؤتمر التقييم يتحدد في وقت مناسب للممرضة والمديرة، في مكان مريح، ويكون فيه وقت كافي للنقاش.","مش نقعد معاها وهي مشغولة في الطوارئ، نختار وقت هادي ومكتب مريح."]]},
{t:"Performance appraisal methods",p:"69",items:[
["A number of methods are commonly used in performance appraisal , the principal methods are divided into two general categories : comparative methods and absolute methods .","فيه طرق كتير بتستخدم في تقييم الأداء، وأساسها بينقسم لنوعين: الطرق المقارنة والطرق المطلقة.","المقارنة: بقارن الموظف بزمايله. المطلقة: بقارنه بمعيار ثابت."],
["A- COMPARATIVE METHODS :","أ- الطرق المقارنة:","زي ترتيب الطلبة على الدفعة."],
["1. Ranking .","1. الترتيب (Ranking).","نرتب الممرضات من الأحسن للأسوأ."],
["2. Paired comparison .","2. المقارنة الثنائية (Paired comparison).","كل ممرضة تتقارن بالباقي واحدة واحدة."],
["3. Forced distribution .","3. التوزيع الإجباري (Forced distribution).","نوزع الممرضات على فئات بنسب محددة."],
["B- ABSOLUTE METHODS :","ب- الطرق المطلقة:","زي درجة امتحان تتحسب من 100 بغض النظر عن زمايلك."],
["1. Graphic rating scale .","1. مقياس التقدير البياني.","خط عليه درجات من ضعيف لممتاز."],
["2. Numerical rating scale .","2. مقياس التقدير الرقمي.","كل بند ياخد رقم."],
["3. Checklist .","3. قائمة المراجعة (Checklist).","نعلّم صح أو غلط قدام كل سلوك."],
["4. Forced choice .","4. الاختيار الإجباري.","المقيّم يختار من مجموعات عبارات."],
["5. Critical incident diary .","5. مذكرة الحوادث الحرجة.","نسجل المواقف المهمة بتاعة الموظف في دفتر."],
["6. Behaviorally anchored rating scale .","6. مقياس التقدير المرتكز على السلوك.","كل درجة مربوطة بوصف سلوك حقيقي."],
["7. Management by objective approach .","7. الإدارة بالأهداف.","نتفق على أهداف ونشوف حققها ولا لأ."],
["c-Technology:","ج- التكنولوجيا:","استخدام الأجهزة في المتابعة."],
["1-Electronic Performance Monitoring","1- المراقبة الإلكترونية للأداء.","كمبيوتر بيسجل نشاط الموظف."]]},
{t:"A- Comparative methods: 1. Ranking",p:"70",items:[
["In this method , the appraiser evaluates employees by ranking them from best to worst on each performance dimension being considered .","في الطريقة دي المقيّم بيرتب الموظفين من الأحسن للأسوأ في كل بُعد أداء بيتقيّم.","نرتب الممرضات في الدقة، وبعدين نرتبهم في السرعة."],
["In its simple form , the supervisor makes a list with the best employee at the top and the worst at the bottom , then chooses the next highest and the next lowest , alternating between highest and lowest until all the employees to be rated are ranked","في أبسط صورها المشرف بيعمل قايمة: الأحسن فوق والأسوأ تحت، وبعدين يختار اللي بعده في الأعلى واللي بعده في الأسفل، ويفضل يتبادل بين الأعلى والأدنى لحد ما كل الموظفين يترتبوا.","خمس ممرضات: الأولى فوق، الأخيرة تحت، وبعدين التانية فوق، والرابعة تحت، والباقية في النص."],
["Advantages :","المميزات:","نقط القوة."],
["- It is a simple method .","- طريقة بسيطة.","سهلة التطبيق."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- Although it is simple , it is very subjective .","- مع إنها بسيطة، هي ذاتية جدًا.","الترتيب بيعتمد على رأي المقيّم الشخصي."],
["- It is difficult to define who is better than whom .","- صعب نحدد مين أحسن من مين.","اتنين قريبين من بعض يصعب نفرّق بينهم."],
["- It fails to indicate whether the person receiving the better rating is \" good enough \" in absolute sense .","- مبتوضحش لو الشخص اللي خد تقييم أعلى هو \"كويس كفاية\" بالمعنى المطلق.","ممكن الأول يكون أحسن واحد في فريق ضعيف."],
["- It has very limited application and could not be used for the majority of purposes .","- استخدامها محدود جدًا ومينفعش لمعظم الأغراض.","مش بتنفع تحدد احتياجات التدريب."]]},
{t:"2. Paired comparison",p:"70-71",items:[
["In this method , each person is directly compared with every other person being rated . The frequency of time an employee is rated high across all pairs determines one's final ranking.","في الطريقة دي كل شخص بيتقارن مباشرة بكل شخص تاني. وعدد المرات اللي الموظف بيطلع فيها الأعلى في كل الأزواج هو اللي بيحدد ترتيبه النهائي.","ممرضة 1 قصاد 2، وبعدها قصاد 3، وهكذا. اللي كسبت أكتر مرات تبقى الأولى."],
["Advantages :","المميزات:","نقط القوة."],
["- Used especially when limited wage increase to be given to a few staff","- بتتستخدم خصوصًا لما الزيادة في المرتب محدودة ومش هتتدي غير لعدد قليل من الموظفين.","عندنا علاوة لـ 2 ممرضات بس، فنعرف مين الأحق."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- The paired comparison method becomes tedious when there are lots of people to compare .","- الطريقة بتبقى مملة ومرهقة لما يبقى فيه ناس كتير للمقارنة.","لو 50 ممرضة، المقارنات هتبقى آلاف."],
["- Demands considerable time of the manager .","- بتاخد وقت كبير من المدير.","المديرة هتقعد أيام تقارن."]]},
{t:"3. Forced distribution Method",p:"71",items:[
["Predetermined percentages of rates are placed in small various number of performance categories – poor , fair , average , good and excellent .","نسب محددة مسبقًا بتتوزع على عدد صغير من فئات الأداء: ضعيف، مقبول، متوسط، جيد، ممتاز.","زي منحنى الدرجات: نسبة قليلة ممتاز ونسبة قليلة ضعيف والأغلب في النص."],
["Each rater is instructed to rate a specific proportion of employees in each of these categories ( e.g. 5 % must be rated poor , 20 % must be rated fair , 50 % must be rated average , 20 % must be rated good and 5 % must be rated excellent ) .","كل مقيّم بيتوجّه إنه يقيّم نسبة معينة من الموظفين في كل فئة (مثلًا: 5% لازم يتقيّموا ضعيف، 20% مقبول، 50% متوسط، 20% جيد، 5% ممتاز).","من 100 ممرضة، لازم 5 بس ياخدوا ممتاز مهما كان أداء الباقي."],
["Advantages :","المميزات:","نقط القوة."],
["- This method could be used for deciding who is to receive pay raises and promotion where few opportunities exist .","- الطريقة دي تنفع في تحديد مين ياخد زيادة أو ترقية لما الفرص قليلة.","ترقيتين بس لـ 100 ممرضة."],
["- A forced distribution technique may be used to overcome the leniency and central tendency errors .","- التوزيع الإجباري ممكن يتغلب على خطأ التساهل وخطأ الميل للمنتصف.","المدير اللي بيدّي الكل ممتاز ملوش اختيار؛ لازم يوزع."],
["- Inexpensive to design and implement in comparison to other appraisal methods .","- رخيصة في التصميم والتطبيق مقارنة بالطرق التانية.","مش محتاجة نماذج معقدة."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- Differences in employee performance are not specified .","- الفروق في أداء الموظفين مش بتتحدد.","منعرفش الفرق بين اللي في نفس الفئة."],
["- Do not provide feedback about employee strengths and weaknesses in performance .","- مبتدّيش رأي عن نقط قوة وضعف الموظف.","تعرف إنك \"متوسطة\" بس مش عارفة السبب."],
["- It cannot be undertaken with a small number of employees , probably at least fifty people .","- مينفعش تتطبق على عدد صغير من الموظفين، غالبًا لازم خمسين شخص على الأقل.","في قسم فيه 8 ممرضات، النسب مش هتنفع."]]},
{t:"B- Absolute methods: 2. Numerical rating scale",p:"71-72",items:[
["2. Numerical rating scale :","2. مقياس التقدير الرقمي:","بنقيّم بالأرقام."],
["It usually includes numbers against a list of behaviors or factors to be evaluated .","غالبًا بيشمل أرقام قدام قايمة سلوكيات أو عوامل المطلوب تقييمها.","التعاون: 4 من 5، الالتزام: 5 من 5."],
["Supervisors put a system of evaluation in the form of percentage then evaluate every member accordingly .","المشرفين بيحطوا نظام تقييم على شكل نسبة مئوية، وبعدين بيقيّموا كل عضو على أساسها.","كل بند من 100%، والممرضة تاخد 85%."],
["Advantages :","المميزات:","نقط القوة."],
["- Uncomplicated .","- مش معقدة.","سهلة."],
["- Specifies human qualities that are known to be important in getting results .","- بتحدد الصفات الإنسانية المعروفة إنها مهمة في تحقيق النتايج.","زي التعاون والمسؤولية."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- Unilateral , i.e. the employee is not involved .","- أحادية الجانب: الموظف مش مشارك.","المديرة تقيّم لوحدها."],
["- Supervisors tend to remember recent or negative incidents .","- المشرفين بيميلوا يفتكروا المواقف الأحدث أو السلبية.","يفتكر غلطة الأسبوع اللي فات وينسى شغل 11 شهر."],
["- Definition of traits are not always clears .","- تعريف الصفات مش دايمًا واضح.","يعني إيه \"مبادرة\"؟ كل واحد يفهمها بطريقته."],
["- Raters differ in their standards of judgment .","- المقيّمين بيختلفوا في معايير حكمهم.","مديرة مشددة وتانية متساهلة."]]},
{t:"3-Performance checklist",p:"72",items:[
["It consists of performance criteria for the most important tasks in the employee's job description . The manager or the rater assesses the presence or absence of desired characteristics or behavior .","بتتكون من معايير أداء لأهم المهام في الوصف الوظيفي للموظف. والمدير أو المقيّم بيقيّم وجود أو غياب الخصائص أو السلوك المطلوب.","نعلّم صح لو غسلت إيديها، وغلط لو معملتش."],
["The final evaluation then can be returned to the rating manager for discussion with the employee or someone from the personnel department to provide the feedback .","التقييم النهائي يمكن يرجع للمدير المقيّم عشان يناقشه مع الموظف، أو لحد من إدارة شؤون العاملين عشان يدّي الرأي والملاحظات.","نتيجة القايمة تروح للمديرة تناقشها مع الممرضة."],
["Advantages :","المميزات:","نقط القوة."],
["- Checklist reduce some bias since the rater and scorer are different .","- القايمة بتقلل بعض التحيز لأن اللي بيقيّم غير اللي بيحسب الدرجة.","واحد يلاحظ وواحد يحسب الدرجات."],
["- Useful in teaching nursing procedures .","- مفيدة في تعليم إجراءات التمريض.","نستخدمها في تعليم خطوات تركيب الكانيولا."],
["- Efficient in evaluating large number of the staff .","- كفؤة في تقييم عدد كبير من الموظفين.","نقيّم 100 ممرضة بسرعة."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- It does not indicate the frequency or the degree to which the behavior occurs","- مبتوضحش عدد مرات حدوث السلوك أو درجته.","غسلت إيديها، بس مرة ولا كل مرة؟ مش واضح."],
["- If needs time and effort to develop a valid checklist tool .","- تحتاج وقت ومجهود لتطوير قايمة صادقة.","تصميم قايمة صح بياخد شغل كتير."]]},
{t:"4. Forced choice method",p:"72-73",items:[
["This rater is asked to select from groups of statements in behavioral terms that best to most ( fits ) and least ( fits ) the individual being rated . The statements are then weighted and / or scored .","المقيّم بيتطلب منه يختار من مجموعات عبارات سلوكية، العبارة اللي تنطبق أكتر والعبارة اللي تنطبق أقل على الشخص المقيَّم. وبعدين العبارات بتتوزن و/أو بتتحسب لها درجات.","في كل مجموعة يختار عبارة \"بتوصف الممرضة أكتر\" وعبارة \"أقل\"، وتتحسب الدرجات بعدين."],
["Advantages :","المميزات:","نقط القوة."],
["- Reduces bias since the rater does not know scoring value for each statement","- بتقلل التحيز لأن المقيّم مش عارف قيمة الدرجة لكل عبارة.","مش هيعرف يدّي درجة عالية للي بيحبها."],
["Disadvantages :","العيوب:","نقط الضعف."],
["- It tends to irritate raters .","- بتميل تضايق المقيّمين.","يحسوا إنهم مش متحكمين."],
["- It is costly to develop .","- مكلفة في التطوير.","تصميمها بياخد فلوس ووقت."]]},
{t:"c-Technology: Electronic Performance Monitoring",p:"73",items:[
["It is the process of observing ongoing employee actions using computers or other non human methods. EPM apparently is an effective means of increasing productivity.","هي عملية ملاحظة تصرفات الموظف المستمرة باستخدام الكمبيوتر أو وسائل تانية غير بشرية. وواضح إن المراقبة الإلكترونية وسيلة فعالة لزيادة الإنتاجية.","السيستم بيسجل وقت دخول الممرضة وبيانات اللي بتسجلها على الكمبيوتر."]]},
