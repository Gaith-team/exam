<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:#1e3a8a; --teal:#0e7490; --emerald:#10b981; --gold:#f59e0b;
  --accent:#0e7490; --accent-glow:rgba(14,116,144,0.18); --accent-rgb:14,116,144;
  --grad:linear-gradient(135deg,#1e3a8a 0%,#0e7490 50%,#10b981 100%);
  --grad-bar:linear-gradient(90deg,#1e3a8a,#0e7490,#10b981,#f59e0b);
  --bg:#f8fafc; --bg2:#eef2f7; --card:#ffffff;
  --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07);
  --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0d1117; --bg2:#161b22; --card:#1c2333;
  --text:#e6edf3; --text2:#b1bac4; --text3:#7d8590;
  --bc:rgba(255,255,255,0.08);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(248,250,252,.93); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(13,17,23,.95); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon {
  width:34px; height:34px; border-radius:8px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:12px; font-weight:900; box-shadow:0 0 0 2px rgba(245,158,11,.5);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:50px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Outfit',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; border-radius:50%; font-size:15px; }
.theme-btn:hover { border-color:var(--accent); transform:rotate(20deg); }
.tool-btn:hover { border-color:var(--accent); color:var(--accent); }
.tool-btn.off { opacity:.55; }

.hero-band {
  margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--gold);
}
.hero-band::before {
  content:''; position:absolute; inset:0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(245,158,11,.22) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(16,185,129,.28) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2);
  backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center;
  font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.18); backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px;
  font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px;
}
.meta-pill i { color:var(--gold); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:50px; font-size:12px; font-weight:700;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--grad); color:#fff; border-color:transparent; }

.shell { max-width:860px; margin:0 auto; padding:24px 20px 80px; }

/* SECTION */
.sec { margin-bottom:34px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:16px 16px 0 0; border-bottom:3px solid var(--gold);
}
.sec-icon {
  width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.2);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:17px; font-weight:900; line-height:1.3; }
.sec-count { margin-left:auto; font-size:11px; font-weight:700; background:rgba(255,255,255,.2); padding:3px 10px; border-radius:50px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 16px 16px; padding:14px; display:flex; flex-direction:column; gap:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.05);
}

.subhead {
  font-size:13px; font-weight:900; color:var(--navy); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--gold);
  border-radius:8px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#7dd3fc; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-radius:14px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.4); box-shadow:0 4px 14px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left:3px solid var(--teal); }
.pt.done { opacity:.55; }

.pt-en {
  display:flex; gap:10px; align-items:flex-start; padding:13px 14px;
  font-size:15px; font-weight:700; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:26px; height:26px; border-radius:8px; background:var(--grad); color:#fff;
  font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
}
.pt-ar {
  padding:12px 16px; font-size:14.5px; line-height:1.9; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:11px; font-weight:900; padding:2px 9px; border-radius:6px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(14,116,144,.12); color:var(--teal); }
[data-theme="dark"] .pt-ar .tag { color:#5eead4; }
.pt-ex {
  padding:12px 16px; font-size:14px; line-height:1.9; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(245,158,11,.07); border-right:4px solid var(--gold);
  font-family:'Segoe UI',Tahoma,'Outfit',sans-serif;
}
.pt-ex .tag { background:rgba(245,158,11,.2); color:#b45309; }
[data-theme="dark"] .pt-ex .tag { color:#fbbf24; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

/* FIGURES */
.fig {
  background:#fff; border:1px solid var(--bc); border-radius:14px; padding:12px;
  overflow-x:auto; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.fig img { max-width:100%; height:auto; display:inline-block; }
.fig.small img { max-width:560px; width:100%; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
</style>
</head>

[`Scheduling is an important function in the human resource management, where by the workers are assigned specific days and specific hours of work.`,
 `الجدولة (Scheduling) دي وظيفة مهمة جدًا في إدارة الموارد البشرية، ومعناها إن كل عامل بيتحدد له أيام شغل معينة وساعات شغل معينة.`,
 `زي ما مديرة القسم تقول لكل ممرضة: إنتي هتشتغلي السبت والأحد والإتنين من 7 الصبح لـ 3 العصر، وباقي الأيام أجازة.`],
[`The schedule means the distribution of hours to be worked by each person during each 24 hours, seven days a week, i.e. assigning personnel specific days and specific hours of work.`,
 `الجدول معناه توزيع ساعات الشغل اللي كل واحد هيشتغلها في الـ 24 ساعة، على مدار السبع أيام في الأسبوع، يعني إنك بتدّي الموظفين أيام وساعات شغل محددة.`,
 `القسم شغال 24 ساعة طول الأسبوع، فالساعات دي لازم تتوزع على الممرضين: ناس صبح وناس عصر وناس سهر، وكل واحد عارف أيامه وساعاته.`]

{ id:"factors", icon:"✅", title:"Factors for Assessing a Schedule Quality", items:[
{h:"Factors for assessing a schedule quality:"},
[`These factors are given below.`,
 `دي العوامل اللي بنقيّم بيها جودة الجدول، وهتتشرح تحت.`,
 `زي ما بنقيّم أي شغل بمعايير، الجدول كمان له معايير نحكم بيها إنه كويس ولا لأ.`],
[`Optimality factor: represents the degree to which nursing expertise is distributed over the different shifts.`,
 `عامل الأمثلية (Optimality): بيوضح قد إيه خبرة التمريض متوزعة كويس على الشيفتات المختلفة.`,
 `مينفعش كل الخبراء في شيفت الصبح وشيفت السهر مفيهوش خبرة؛ لازم في كل شيفت ممرضة خبيرة.`],
[`Completeness factor: represents the degree to which quantitative demands for occupation per shift are met.`,
 `عامل الاكتمال (Completeness): بيوضح قد إيه الاحتياج العددي المطلوب لكل شيفت اتغطى.`,
 `لو الشيفت محتاج 6 ممرضات وإحنا فعلًا حاطين 6، يبقى الجدول مكتمل.`],
[`Proportionality factor: represents the degree to which each nurse has been given about the same amount of night shift, evening shifts and weekends off.`,
 `عامل التناسب (Proportionality): بيوضح قد إيه كل ممرضة خدت تقريبًا نفس الكمية من شيفتات السهر وشيفتات العصر وأجازات الويك إند.`,
 `مفيش واحدة تسهر كل أسبوع وزميلتها متسهرش خالص.`],
[`Healthiness factor: represents the degree to which it has been taken care of the welfare and health of the nursing staff.`,
 `عامل الصحة (Healthiness): بيوضح قد إيه اتراعت رفاهية وصحة الطاقم التمريضي.`,
 `مفيش شيفتات ورا بعض بتنهك الممرضة، وفيه راحة كافية بين الشيفتات.`],
[`Continuity factor: represents the degree to which there is some continuity in nursing crew during the different shifts`,
 `عامل الاستمرارية (Continuity): بيوضح قد إيه فيه استمرارية في طاقم التمريض خلال الشيفتات المختلفة.`,
 `نفس مجموعة الممرضات تقريبًا بتفضل شغالة مع بعض، فبيعرفوا حالة المرضى ومحدش بيبدأ من الصفر كل مرة.`]
]},

{ id:"types", icon:"🗂️", title:"Type of Scheduling Working Hours", items:[
{h:"Type of scheduling working hours:"},
{h:"1. Block scheduling :"},
[`Means that the work schedule for a unit is planned in a "block" of week, i.e. days to be worked by staff are blocked together .`,
 `معناه إن جدول شغل القسم بيتخطط في "بلوك" أسبوع، يعني الأيام اللي هيشتغلها الموظفين بتتجمع مع بعض في كتلة واحدة.`,
 `الممرضة تشتغل 5 أيام ورا بعض (ده بلوك واحد)، وبعدين تاخد يومين راحة ورا بعض.`],
[`Block scheduling is done for 4-8 weeks at a time .`,
 `الـ Block scheduling بيتعمل لفترة من 4 لـ 8 أسابيع مرة واحدة.`,
 `الهيد تعمل جدول واحد يغطي شهر لشهرين مرة واحدة.`],
[`It can be calculated easily and has flexibility in that the next block of time does not necessarily need to follow the pattern of the preceding block .`,
 `بيتحسب بسهولة، وفيه مرونة لأن البلوك اللي بعده مش لازم يمشي على نفس نمط البلوك اللي قبله.`,
 `البلوك الأول ممكن يكون شغل 5 أيام وراحة يومين، والبلوك اللي بعده نغيّر نظامه حسب الظروف.`],
[`This type of scheduling does not provide for maximum level of care seven days a week .`,
 `النوع ده مبيوفرش أعلى مستوى رعاية على مدار السبع أيام في الأسبوع.`,
 `ممكن في أيام معينة (زي الويك إند) العدد يقل والرعاية تبقى أضعف.`],
{h:"Example of block time scheduling :"},
[`x: days worked`,
 `علامة x معناها أيام الشغل.`,
 `لو قدام الممرضة A علامة x في يوم، يبقى هي شغالة في اليوم ده.`],
[`o: days off in the week .`,
 `علامة o معناها أيام الأجازة في الأسبوع.`,
 `لو قدام الممرضة B علامة o في يوم، يبقى اليوم ده أجازة بالنسبالها.`],

{h:"2. Cyclic time scheduling :"},
[`It is a technique for assigning days and time off in a pattern that repeats itself regularly while taking in consideration the need for the proper number and mixes of personnel , continuity of care .`,
 `دي طريقة بنحدد بيها أيام الشغل والأجازات في نمط بيتكرر نفسه بانتظام، مع مراعاة إن يبقى فيه العدد المناسب وتشكيلة مناسبة من الموظفين، وكمان استمرارية الرعاية.`,
 `الجدول بيتعمل لدورة واحدة (مثلًا 4 أسابيع)، وبعد ما تخلص نفس الدورة بترجع تتكرر زي ما هي.`],
[`Cyclic time scheduling is done for " four to eight weeks " .`,
 `الـ Cyclic scheduling بيتعمل لفترة "من 4 لـ 8 أسابيع".`,
 `الدورة بتاخد من شهر لشهرين، وبعدها نفس النمط يرجع تاني.`],
{h:"Example of cyclic schedule :"},
[`D : day shift`,
 `حرف D معناه شيفت الصبح (day shift).`,
 `لو قدام الممرضة حرف D يبقى هي شغالة صبح.`],
[`E : evening shift`,
 `حرف E معناه شيفت العصر (evening shift).`,
 `لو قدامها E يبقى هي شغالة شيفت العصر.`],
[`N : night shift`,
 `حرف N معناه شيفت السهر (night shift).`,
 `لو قدامها N يبقى هي شغالة بالليل.`],
[`- : off duty`,
 `علامة (-) معناها إنها أجازة (off duty).`,
 `لو قدامها شرطة (-) يبقى اليوم ده راحة ومفيش شغل.`],

{h:"3. Computerized scheduling :"},
[`This type enables the user to devise a plan , which considers than schedules done by individuals .`,
 `النوع ده بيخلّي المستخدم يعمل خطة (plan) تاخد في اعتبارها الجداول اللي بيعملها الأفراد.`,
 `بدل ما كل ممرضة تعمل جدولها لوحدها ويحصل لخبطة، البرنامج بيجمع الكل ويعمل خطة واحدة.`],
[`Computerized scheduling allows for maintaining the pattern to be used and the choice of employee and the planning of holiday , days off and vacation .`,
 `الجدولة بالكمبيوتر بتسمح بالحفاظ على النمط اللي هيتستخدم، واختيار الموظف، وتخطيط الأعياد والأجازات الأسبوعية والإجازات السنوية.`,
 `البرنامج يفتكر النظام اللي مشيين عليه، ويختار مين الممرضة المناسبة، ويوزع الأجازات والأعياد بنفسه.`],
[`All data necessary for time planning are fed to the computer and a program for scheduling is designed based on the fed data .`,
 `كل البيانات اللازمة لتخطيط الوقت بتتحط في الكمبيوتر، وبيتصمم برنامج للجدولة على أساس البيانات دي.`,
 `بنكتب في الكمبيوتر عدد الممرضات وشيفتاتهم وأجازاتهم، والبرنامج يطلع الجدول على أساسها.`],
[`The computerized scheduling is more effective than the other types .`,
 `الجدولة بالكمبيوتر أكفأ من باقي الأنواع.`,
 `أسرع وأدق من إن الهيد تقعد تكتب الجدول بإيديها.`],
{h:"Advantages of computerized scheduling :"},
[`It saves the nurse's time spent working out schedules .`,
 `بيوفّر وقت الممرضة اللي كانت بتضيّعه في عمل الجداول.`,
 `الهيد بدل ما تقعد ساعات ترتب الجدول، البرنامج بيعمله في دقايق.`],
[`It reduces interpersonal conflicts between staff and supervisor created by changes made in scheduling .`,
 `بيقلل الخلافات الشخصية بين الطاقم والمشرفة اللي بتحصل بسبب التغييرات في الجدول.`,
 `محدش هيزعل من الهيد ويقول "إنتي غيرتي جدولي"، لأن الجدول طالع من البرنامج.`],
[`Consistent scheduling and equitable application of agency policy .`,
 `جدولة ثابتة ومتسقة، وتطبيق عادل لسياسة المؤسسة.`,
 `نفس القواعد بتتطبق على كل الممرضات من غير استثناء.`],
[`Unbiased .`,
 `من غير تحيز.`,
 `البرنامج مبيحبش ممرضة ويكره التانية، فبيوزع بالعدل.`],
[`Cost effectiveness through reduction of clerical staff and better utilization of professional nurse by decreasing the time spent in non – patient care activities .`,
 `توفير في التكلفة، لأن عدد الموظفين الكتابيين (clerical staff) بيقل، واستغلال أحسن للممرضة المهنية بتقليل الوقت اللي بتضيّعه في أنشطة مش لرعاية المريض.`,
 `الممرضة بدل ما تقعد تكتب جداول، تقعد مع المرضى وتشتغل شغلها الأساسي.`]
]},

{h:"Working hours scheduling options :"},
{h:"1. Straight shift :"},
[`This is a traditional pattern that uses 8-hour shifts for time planning for the 24-hour period .`,
 `ده النمط التقليدي، بيستخدم شيفتات 8 ساعات لتخطيط الوقت على مدار الـ 24 ساعة.`,
 `اليوم كله 24 ساعة بيتقسم على 3 شيفتات، كل واحد 8 ساعات: صبح وعصر وسهر.`],
[`The pattern may be as such .`,
 `النمط ممكن يبقى بالشكل ده.`,
 `الأوقات اللي جاية تحت هي الشكل المعتاد للشيفتات.`],
[`7 a.m. to 3:30 p.m.`,
 `الشيفت الأول: من 7 الصبح لـ 3:30 العصر.`,
 `ده شيفت الصبح.`],
[`3 p.m. to 11:30 p.m.`,
 `الشيفت التاني: من 3 العصر لـ 11:30 بالليل.`,
 `ده شيفت العصر.`],
[`11 p.m. to 7:30 a.m.`,
 `الشيفت التالت: من 11 بالليل لـ 7:30 الصبح.`,
 `ده شيفت السهر.`],

[`This pattern allows each employee to work 8 hours a day , five days a week .`,
 `النمط ده بيخلّي كل موظف يشتغل 8 ساعات في اليوم، 5 أيام في الأسبوع.`,
 `الممرضة تشتغل من السبت للأربع مثلًا، ويبقى عندها يومين راحة.`],
[`This is mostly a block – hour system and this allows for under utilization( poor ) of staff on weekends .`,
 `ده في الغالب نظام ساعات على شكل بلوك، وده بيسبب إن الطاقم مش بيتستغل كويس (استغلال ضعيف) في الويك إند.`,
 `في الويك إند أغلب الناس في أجازة، فالقسم يبقى فيه عدد قليل.`],
[`It cannot meet patient care needs seven days a week .`,
 `النمط ده مينفعش يغطي احتياجات رعاية المريض على مدار السبع أيام في الأسبوع.`,
 `المريض محتاج رعاية كل يوم، لكن الجدول ده بيسيب الويك إند ضعيف.`],

{h:"2. The 10-hour shift :"},
[`This pattern allows staff to work 10 hours a day for 4 days a week and three days off .`,
 `النمط ده بيخلّي الطاقم يشتغل 10 ساعات في اليوم لمدة 4 أيام في الأسبوع، وبياخدوا 3 أيام أجازة.`,
 `الممرضة تشتغل 4 أيام بس، بس كل يوم 10 ساعات، وتاخد 3 أيام راحة.`],
[`This is a 6-week cyclical pattern that has advantages over the 8 hours / day .`,
 `ده نمط دوري (cyclical) مدته 6 أسابيع، وليه مميزات عن نظام الـ 8 ساعات في اليوم.`,
 `الدورة بتاخد 6 أسابيع وبعدها بتتكرر، وفيها فوايد أكتر من نظام الـ 8 ساعات.`],
[`Shift developed for the 10 hours per day are :`,
 `الشيفتات اللي اتعملت لنظام الـ 10 ساعات في اليوم هي:`,
 `الأوقات اللي تحت هي شيفتات الـ 10 ساعات.`],
[`7 a.m. to 5:30 p.m.`,
 `من 7 الصبح لـ 5:30 العصر.`,
 `ده الشيفت الأول (الصبح).`],
[`1 p.m. to 11:30 p.m.`,
 `من 1 الضهر لـ 11:30 بالليل.`,
 `ده الشيفت التاني.`],
[`9 p.m. to 7:30 a.m.`,

[`The 10-hour shift has the disadvantage of not falling evenly into a 24 hours day , but it can be planned so that the overlaps occur in peak ( heavy ) work hours .`,
 `عيب شيفت الـ 10 ساعات إنه مبيتقسمش بالتساوي على اليوم (24 ساعة)، بس ممكن نخطط بحيث التداخلات (overlaps) تحصل في ساعات الذروة (الشغل التقيل).`,
 `الشيفتات بتتداخل شوية، فنخلّي التداخل ده في الوقت اللي القسم بيبقى فيه زحمة شغل.`],
[`This pattern is very effective in staffing ICU .`,
 `النمط ده فعّال جدًا في تدبير الطاقم في العناية المركزة (ICU).`,
 `الـ ICU محتاج متابعة مستمرة، والشيفت الطويل بيناسبه.`],
[`Nursing are satisfied ; they can give comprehensive continuous care and can get a longer weekend and a extra day off .`,
 `التمريض بيبقوا راضيين، لأنهم يقدروا يقدموا رعاية شاملة ومستمرة، وكمان ياخدوا ويك إند أطول ويوم أجازة زيادة.`,
 `الممرضة تفضل مع المريض ساعات أطول، وفي الآخر ياخدوا 3 أيام راحة.`],

{h:"3. The 12-hour shift :"},
[`This pattern consists of working 12 hours a day with 2 days off prior to a change of shift .`,
 `النمط ده معناه الشغل 12 ساعة في اليوم، مع يومين أجازة قبل تغيير الشيفت.`,
 `الممرضة تشتغل شيفت 12 ساعة، وقبل ما تنتقل من صبح لسهر مثلًا تاخد يومين راحة.`],
[`The shift hours are usually 7 a.m. to 7:30 p.m. and 7 p.m. to 7:30 a.m. .`,
 `ساعات الشيفت في العادة بتبقى من 7 الصبح لـ 7:30 بالليل، ومن 7 بالليل لـ 7:30 الصبح.`,
 `يعني اليوم متقسم شيفتين بس: نهاري وليلي.`],
[`This pattern was introduced due to inadequate staffing , but it proved to be appropriate in ICU and modified ICU .`,
 `النمط ده اتعمل في الأول بسبب نقص التمريض (inadequate staffing)، لكن اتضح إنه مناسب في الـ ICU والـ modified ICU.`,
 `بدأ كحل لقلة العدد، وطلع مناسب جدًا لأقسام الرعاية الحرجة.`],
[`It strengthens the relationship between the nurses , the doctors and the patients and time is saved in personnel shift change over .`,
 `بيقوّي العلاقة بين الممرضين والدكاترة والمرضى، وكمان بيوفّر وقت في تسليم وتسلّم الشيفت بين الموظفين.`,
 `التسليم بيحصل مرتين في اليوم بدل 3، فبنوفّر وقت، والممرضة بتقعد مع الدكتور والمريض فترة أطول فالعلاقة بتتحسن.`],

{h:"4. Irregular hours scheduling pattern :"},
[`Nurses work a number of hours each week and the hours of work may vary depending on patient care requirements or service demands .`,
 `الممرضين بيشتغلوا عدد ساعات كل أسبوع، وساعات الشغل ممكن تختلف حسب متطلبات رعاية المرضى أو احتياجات الخدمة.`,
 `الأسبوع ده القسم زحمة فنشتغل ساعات أكتر، والأسبوع اللي بعده هادي فنشتغل أقل.`],
[`The nurse may work 10 hours , 12 hours or other irregular length shift .`,
 `الممرضة ممكن تشتغل 10 ساعات، أو 12 ساعة، أو شيفت بطول مش منتظم.`,
 `النهارده 10 ساعات، وبكرة 12، والتاني يوم شيفت بطول مختلف.`],
[`This system is implemented for the services of highly trained clinical nurse specialist or for nurse in in-service training or supervision programs .`,
 `النظام ده بيتطبق لخدمات أخصائي التمريض الإكلينيكي المدرّب تدريب عالي، أو للممرضة اللي في تدريب أثناء الخدمة أو برامج الإشراف.`,

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s, si) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    if (it.img) { body += `<div class="fig ${it.cls || ''}"><img src="${it.img}" alt="Lecture figure"></div>`; return; }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      <div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
