<script>
/* Each question: t = text, o = options, a = correct index, s = topic */
const QUESTIONS = [
  /* General Epidemiology */
  {t:"Sudden abnormal increase in number of cases in a closed community is defined as:",o:["Endemic.","Epidemic.","Pandemic.","Outbreak."],a:3,s:"General Epidemiology"},
  {t:"According to WHO, health is defined as:",o:["Absence of disease only","Mental and social well-being only","Physical fitness only","Complete physical, mental, and social well-being"],a:3,s:"General Epidemiology"},

  {t:"Diseases that are always present in a community, usually at a low, more or less constant, frequency are classified as having an ________ pattern.",o:["Epidemic","Endemic","Outbreak","Pandemic","Sporadic"],a:1,s:"General Epidemiology"},
  {t:"The main difference between epidemic and pandemic is:",o:["Number of cases","Type of organism","Geographic spread","Mode of transmission"],a:2,s:"General Epidemiology"},
  {t:"Endemicity of a disease is maintained mainly by:",o:["Herd immunity","International travel","Presence of all ecological factors","Vaccine failure"],a:2,s:"General Epidemiology"},
  {t:"The term \"epizootic\" refers to:",o:["Disease among humans","Animal disease outbreaks","Waterborne disease","Seasonal flu"],a:1,s:"General Epidemiology"},
  {t:"The first step to be done during an epidemic investigation is:",o:["Identify the cases.","Confirm the diagnosis.","Identify the prone people.","Identify the causative factors."],a:1,s:"General Epidemiology"},
  /* Communicable Diseases */
  {t:"Zoonotic diseases can be transmitted to humans through:",o:["Inhalation","Ingestion","Insect bites","All of the above"],a:3,s:"Communicable Diseases"},
  {t:"Which disease is commonly spread by food-borne infection?",o:["Malaria","Cholera","HIV","Influenza"],a:1,s:"Communicable Diseases"},
  {t:"The most dangerous non-living reservoir of infection is:",o:["Soil","Air","Water","Food"],a:2,s:"Communicable Diseases"},
  {t:"Vertical transmission can occur through:",o:["Mosquitoes.","Direct contact.","Placenta.","Arthropod"],a:2,s:"Communicable Diseases"},

  {t:"Which one of the following diseases spread by droplet and food:",o:["corona.","Measles.","Poliomyelitis.","typhoid"],a:2,s:"Communicable Diseases"},

  {t:"A child receives measles vaccine within 72 hours of exposure. This is an example of:",o:["Passive immunity","Tertiary prevention","Specific primary prevention","Post-exposure active immunization"],a:3,s:"Prevention and Control of Infectious Diseases"},
  {t:"For which viral disease is the vaccine protective if given within 72 hours of exposure?",o:["Rabies","Small pox","Measles","Tetanus"],a:2,s:"Prevention and Control of Infectious Diseases"},
  {t:"The incubation period for smallpox is 12 days. How long after primary vaccination is a person protected?",o:["4 days","8 days","12 days","16 days"],a:1,s:"Prevention and Control of Infectious Diseases"},
  {t:"Which vaccines are specifically required for travelers going to and coming from endemic and infected areas?",o:["Rabies and tetanus vaccines","Cholera and yellow fever vaccines","Measles and smallpox vaccines","Diphtheria and meningococcal vaccines"],a:1,s:"Prevention and Control of Infectious Diseases"},
  {t:"Which vaccine is specifically required for pilgrims before leaving?",o:["Yellow fever vaccine","Cholera vaccine","Meningococcal vaccine","Tetanus vaccine"],a:2,s:"Prevention and Control of Infectious Diseases"},
  {t:"Which statement about toxemic diseases is correct?",o:["They cannot be prevented through vaccination","They require annual booster shots","A booster dose gives rapid protection for diphtheria and tetanus","They are only transmitted through contaminated water"],a:2,s:"Prevention and Control of Infectious Diseases"},
  {t:"International measures are taken to prevent the transmission of:",o:["Tuberculosis","Cholera","Plague","cholera and plague"],a:3,s:"Prevention and Control of Infectious Diseases"},
  /* Typhoid Fever */
  {t:"Typhoid fever is caused by",o:["salmonella typhi","salmonella paratyphi","shigella","E Coli"],a:0,s:"Typhoid Fever"},
  {t:"Typhoid fever is commonly acquired by?",o:["consuming food or water contaminated by fecal material of infected person","eating salmonella cysts in the muscles of infected person","direct sexual contact","drinking unpasteurized milk"],a:0,s:"Typhoid Fever"},
  {t:"Carriers of typhoid fever are classified to",o:["Incubatory","Contact","Convalescent","All of the above"],a:3,s:"Typhoid Fever"},
  {t:"Patients of typhoid fever exit organism in",o:["Urinary","Stool","Saliva","A&amp;b"],a:3,s:"Typhoid Fever"},
  {t:"Clinical picture of typhoid include all of the following except",o:["Fever","Abdominal pain","Headache","Tachycardia"],a:3,s:"Typhoid Fever"},
  {t:"A blood test to diagnose typhoid is",o:["ELISA Test","Widal test","Torch test","Western blot test"],a:1,s:"Typhoid Fever"},
  {t:"The Widal test becomes positive during which week of typhoid fever?",o:["1st week","2nd week","3rd week","4th week"],a:1,s:"Typhoid Fever"},
  {t:"Which of the following is a hallmark clinical feature of typhoid fever?",o:["Bradycardia relative to fever","Tachycardia with high fever","Petechial rash","Jaundice"],a:0,s:"Typhoid Fever"},
  {t:"In typhoid fever, relapse typically occurs:",o:["During the 1st week of convalescence","1-2 weeks after convalescence","1 month after recovery","Only in untreated cases"],a:1,s:"Typhoid Fever"},
  {t:"Typhoid vaccines are indicated for:",o:["Infants in their first year of life.","Food handlers","Sewage workers","Both [b and c]"],a:3,s:"Typhoid Fever"},
  {t:"The TAB vaccine provides protection against:",o:["Only S. typhi","S. typhi and S. paratyphi A &amp; B","S. typhi and S. paratyphi C","All Salmonella species"],a:1,s:"Typhoid Fever"},
  {t:"A chronic carrier of typhoid is most likely to harbor the bacteria in which site?",o:["Liver","Gallbladder","Spleen","Lungs"],a:1,s:"Typhoid Fever"},
  {t:"For a chronic urinary carrier of typhoid, the recommended treatment is:",o:["Ampicillin for 1-3 months","Surgical removal of the pathological focus","Chloramphenicol for 4 weeks","Cholecystectomy"],a:1,s:"Typhoid Fever"},
  /* Poliomyelitis */
  {t:"The causative of the disease, Polio is",o:["Fungus","Virus","Bacteria","Toxin"],a:1,s:"Poliomyelitis"},
  {t:"The poliovirus infection is spread through",o:["breastfeeding","fecal-oral route","placental route","sexual route"],a:1,s:"Poliomyelitis"},
  {t:"The primary mode of poliovirus transmission in developing countries is:",o:["Droplet infection","Fecal-oral route","Vector-borne","Blood transfusion"],a:1,s:"Poliomyelitis"},
  {t:"Polio infections are characterized by:",o:["all types (incubatory, contact, convalescent &amp; healthy), carriers","all carriers are temporary (No chronic carriers)","man is the only reservoir","all of the above"],a:3,s:"Poliomyelitis"},
  {t:"The region where the polio virus multiplies in the body is",o:["intestinal cells","tongue cells","muscle cells","liver cells"],a:0,s:"Poliomyelitis"},
  {t:"How does the poliovirus cause paralysis?",o:["It causes the receptors to misinterpret the signals from the central nervous system.","It eats away at the muscles the provide mobility.","It destroys several key blood vessels in the spinal cord.","It destroys the motor neurons in the central nervous system."],a:3,s:"Poliomyelitis"},
  {t:"Which of the following is NOT a method for diagnosing polio?",o:["Examining secretions taken from the throat","Examining stool samples","Performing a spinal tap","Doing an echocardiogram of the heart"],a:3,s:"Poliomyelitis"},
  {t:"Which form of poliomyelitis is characterized by destruction of anterior horn cells?",o:["Bulbar","Spinal","Bulbospinal","Non-paralytic"],a:1,s:"Poliomyelitis"},
  {t:"The period of infectivity for poliovirus in intestinal foci lasts up to:",o:["1-2 weeks","3-4 weeks","6-8 weeks","12 weeks"],a:2,s:"Poliomyelitis"},
  {t:"Which polio vaccine provides intestinal immunity?",o:["Salk","Sabin","Both","Neither"],a:1,s:"Poliomyelitis"},
  {t:"The correct statement regarding vaccine of polio virus",o:["Sabin is given by intramuscular route","Sabin is killed vaccine","Salk is live attenuated vaccine","Sabin is given by oral route"],a:3,s:"Poliomyelitis"},
  {t:"All are true about Salk vaccine except:",o:["It is live vaccine.","Suitable for immune-compromised patient.","Easily transported.","indicated in pregnant females."],a:0,s:"Poliomyelitis"},
  {t:"The serious complication of polio virus all over the world",o:["Mental retardation","Brain hemorrhage","Pneumonia","Paralysis"],a:3,s:"Poliomyelitis"},
  {t:"Polio usually affects",o:["Children between 0 and 5 years old","Adolescents between 10 and 15 years old","Young adults","elderly"],a:0,s:"Poliomyelitis"},
  /* Viral Hepatitis (B and C) */
  {t:"What type of virus is Hepatitis B?",o:["RNA virus","DNA virus","Retrovirus","Prion"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"What is the typical incubation period for Hepatitis B?",o:["2-4 weeks","6 weeks to 6 months","1-2 days","1-2 years"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following is NOT a mode of transmission for Hepatitis B?",o:["Blood transfusion","Sexual contact","Mosquito bites","From mother to fetus"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Hepatitis B virus is:",o:["Less resistant to heat than Hepatitis A","More resistant to heat than Hepatitis A","Equally resistant to heat as Hepatitis A","Not affected by heat at all"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following is a potential complication of Hepatitis B infection?",o:["Kidney failure","Heart disease","Liver cirrhosis","Brain damage"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"The onset of Hepatitis B is typically described as:",o:["Sudden and severe","Insidious (gradual)","Accompanied by skin rash","Painless but with visible symptoms"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"What does HBsAg indicate?",o:["Complete recovery from Hepatitis B","Immunity to Hepatitis B","Active or past Hepatitis B infection","Vaccination status against Hepatitis B"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following hepatitis B markers indicates high infectivity?",o:["HBsAg","Anti-HBs","HBeAg","Anti-HBc IgM"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Which hepatitis B antibody is protective and indicates immunity?",o:["Anti-HBc","Anti-HBe","Anti-HBs","Anti-HDV"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Which hepatitis B antigen is NOT detectable in serum but can be identified in liver tissue?",o:["HBsAg","HBeAg","HBcAg","HBeAb"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"A patient with chronic HBV has detectable HBeAg. This suggests:",o:["Low infectivity and good prognosis","High viral replication and infectivity","Recovery from past infection","False-positive serology"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"Which hepatitis marker appears earliest in acute HBV infection?",o:["Anti-HBs","HBeAg","HBsAg","Anti-HBc IgG"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Which test is the most sensitive for detecting active HBV replication?",o:["HBsAg ELISA","Anti-HBc IgM","HBV DNA PCR","Liver biopsy for HBcAg"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"How many doses are recommended for the Hepatitis B vaccine?",o:["1 dose","2 doses","3 doses","4 doses"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"For how long is the Hepatitis B vaccine typically protective?",o:["1 year","3 years","5 years","7 years"],a:3,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following groups does NOT typically receive mandatory Hepatitis B vaccination?",o:["Medical students","Infants","Elderly people over 65","Paramedical personnel"],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Where should the Hepatitis B vaccine be administered?",o:["Subcutaneously in the thigh","Intramuscularly in the upper arm","Intramuscularly in the thigh","Intravenously"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"The Hepatitis B vaccine schedule for infants born to HBsAg-positive mothers includes:",o:["Single dose at birth","HBIg at birth + vaccine doses at 0, 1, and 6 months","Vaccine doses at 2, 4, and 6 months only","Oral vaccine at birth"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"When should Human Specific Hepatitis Immunoglobulin be given to newborns of HBsAg positive mothers?",o:["Within 12 hours of birth","Within 24 hours of birth","Within 3 days of birth","Within 1 week of birth"],a:0,s:"Viral Hepatitis (B and C)"},
  {t:"A healthcare worker sustains a needle-stick injury from an HBsAg-positive patient. If the worker was previously vaccinated but has an anti-HBs titer &lt;10 IU/mL, what is the next step?",o:["Administer hepatitis B immunoglobulin (HBIg) only","Administer HBIg + booster vaccine dose","No intervention needed","Test for HBV DNA"],a:1,s:"Viral Hepatitis (B and C)"},
  {t:"During which period is a person with Hepatitis B NOT infectious?",o:["First 1-2 weeks of incubation period","During the course of disease","During the convalescence period","None of the above - they are infectious during all these periods"],a:3,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following is TRUE regarding hepatitis C virus (HCV)?",o:["It is a DNA virus with a high rate of chronicity.","Perinatal transmission is more common than in HBV.","No vaccine is currently available.","Anti-HCV IgM is the gold standard for diagnosis."],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"Which of the following is a key difference between HBV and HCV?",o:["HBV is more likely to cause chronic infection than HCV.","HCV is transmitted primarily via fecal-oral route.","HBV is a DNA virus, while HCV is an RNA virus.","HCV has an effective vaccine."],a:2,s:"Viral Hepatitis (B and C)"},
  {t:"A patient with HCV develops cirrhosis. Which complication is most likely to arise?",o:["Hepatocellular carcinoma (HCC)","Acute pancreatitis","Splenic infarction","Autoimmune hemolysis"],a:0,s:"Viral Hepatitis (B and C)"},
  /* Measles */
  {t:"What is measles?",o:["A bacterial infection that affects the lungs","A viral infection that affects the respiratory system and skin","A fungal infection that affects the skin only","A parasitic infection that affects the digestive system"],a:1,s:"Measles"},
  {t:"What is the primary mode of transmission for measles?",o:["Contaminated food and water","Airborne respiratory droplets","Direct blood contact","Insect bites"],a:1,s:"Measles"},
  {t:"Which of the following is one of the first symptoms of measles?",o:["Skin rash","High fever","Seizures","Joint pain"],a:1,s:"Measles"},
  {t:"What is Koplik's spots, associated with measles?",o:["The rash that appears on the arms and legs","Small white spots that appear inside the mouth","Dark spots that appear under the fingernails","Blisters that form on the palms and soles"],a:1,s:"Measles"},
  {t:"Which of the following is NOT a common complication of measles?",o:["Pneumonia","Encephalitis (brain inflammation)","Diabetes","Ear infections"],a:2,s:"Measles"},
  {t:"What is the most effective way to prevent measles?",o:["Regular handwashing","Vaccination","Avoiding international travel","Taking antibiotics preventatively"],a:1,s:"Measles"},
  {t:"The MMR vaccine protects against which diseases?",o:["Measles, Mumps, and Rubella","Measles, Malaria, and Rabies","Mumps, Malaria, and Rotavirus","Meningitis, Mumps, and Rabies"],a:0,s:"Measles"},
  {t:"How long does a person with measles remain contagious?",o:["Only while they have a fever","From 4 days before to 4 days after the rash appears","Only after the rash appears","For up to 3 months after recovery"],a:1,s:"Measles"},
  {t:"Which of the following is NOT a \"3 Cs\" of measles symptoms?",o:["Cough","Coryza (runny nose)","Conjunctivitis","Convulsions"],a:3,s:"Measles"},
  /* Tuberculosis */
  {t:"Which of the following bacteria causes tuberculosis?",o:["Mycobacterium leprae","Mycobacterium tuberculosis","Streptococcus pneumoniae","Haemophilus influenzae"],a:1,s:"Tuberculosis"},
  {t:"What is the primary mode of transmission for tuberculosis?",o:["Fecal-oral route","Vector-borne transmission","Airborne droplet nuclei","Direct contact with bodily fluids"],a:2,s:"Tuberculosis"},
  {t:"Which of the following is the most common mode of transmission for pulmonary tuberculosis caused by the human-type Mycobacterium tuberculosis?",o:["Contaminated food and water","Direct droplet infection","Vector-borne transmission","Sexual contact"],a:1,s:"Tuberculosis"},
  {t:"The best vaccine in humans for TB is:",o:["BCG vaccine","MMR vaccine","Salk vaccine","OPV"],a:0,s:"Tuberculosis"},
  {t:"BCG vaccine is administered to children:",o:["Intra-dermal.","S.C","I.M.","Orally."],a:0,s:"Tuberculosis"},
  {t:"What are the symptoms of active TB?",o:["Weight loss","Night sweats","Loss of appetite","All of the above"],a:3,s:"Tuberculosis"},
  {t:"TB is a common finding with:",o:["Anthrax.","Plague.","Malaria.","AIDS."],a:3,s:"Tuberculosis"},
  {t:"Which population has the highest risk for progression from latent TB infection to active TB disease?",o:["Elderly individuals with no comorbidities","HIV-negative adolescents","HIV-positive individuals","Healthy adults with BCG vaccination"],a:2,s:"Tuberculosis"},
  {t:"What percentage of individuals with latent TB infection will develop active TB disease in their lifetime without preventive treatment?",o:["1-2%","5-10%","20-30%","50-60%"],a:1,s:"Tuberculosis"},
  {t:"Which of the following is NOT a common symptom of pulmonary tuberculosis?",o:["Persistent cough","Night sweats","Seizures","Weight loss"],a:2,s:"Tuberculosis"},
  {t:"Which diagnostic test detects TB infection by measuring the immune response to TB antigens?",o:["Acid-fast bacilli (AFB) smear","Interferon-Gamma Release Assay (IGRA)","Chest X-ray","Polymerase Chain Reaction (PCR)"],a:1,s:"Tuberculosis"},
  {t:"Which of the following is considered the gold standard for TB diagnosis?",o:["Tuberculin skin test","QuantiFERON-TB Gold test","Chest radiography","Mycobacterial culture"],a:3,s:"Tuberculosis"},
  {t:"A patient with pulmonary TB presents with night sweats, hemoptysis, and weight loss. Which diagnostic method is considered conclusive for confirming active TB infection?",o:["Tuberculin skin test","Chest X-ray","Sputum culture for TB bacilli","PCR for Mycobacterium DNA"],a:2,s:"Tuberculosis"},
  {t:"What is the recommended duration for standard first-line treatment of drug-susceptible TB?",o:["3 months","6 months","9 months","12 months"],a:1,s:"Tuberculosis"},
  {t:"Which of the following is a major risk factor for multidrug-resistant tuberculosis (MDR-TB)?",o:["Prior incomplete or inadequate TB treatment","Advanced age","Female gender","Rural residence"],a:0,s:"Tuberculosis"},
  {t:"Which of the following is NOT one of the first-line drugs for treating tuberculosis?",o:["Isoniazid","Rifampin","Ciprofloxacin","Ethambutol"],a:2,s:"Tuberculosis"},
  {t:"What is the term for TB infection without active disease?",o:["Primary tuberculosis","Latent tuberculosis infection","Miliary tuberculosis","Subclinical tuberculosis"],a:1,s:"Tuberculosis"},
  {t:"Which factor does NOT favor the transmission of human-type pulmonary TB?",o:["Good ventilation","Overcrowding","Close contact with open TB cases","Dark, dusty environments"],a:0,s:"Tuberculosis"},
  /* Rabies */
  {t:"What is rabies?",o:["A bacterial infection affecting the respiratory system","A viral zoonotic disease affecting the central nervous system","A parasitic infection transmitted by mosquitoes","A fungal disease affecting the skin"],a:1,s:"Rabies"},
  {t:"What is the primary reservoir for rabies transmission to humans?",o:["Rodents","Vampire bats","Dogs","Birds"],a:2,s:"Rabies"},
  {t:"How is rabies primarily transmitted to humans?",o:["Through contaminated food","Through airborne particles","Through the bite of a rabid animal","Through mosquito bites"],a:2,s:"Rabies"},
  {t:"What is hydrophobia?",o:["Fear of dogs","Fear of drinking due to painful spasm of pharyngeal muscles","Fear of going outside","Fear of being bitten"],a:1,s:"Rabies"},
  {t:"Which clinical feature is pathognomonic for rabies in humans?",o:["Fever and rash","Hydrophobia due to pharyngeal muscle spasms","Jaundice and hepatomegaly","Hemoptysis"],a:1,s:"Rabies"},
  {t:"What is the fatal outcome rate of clinical rabies in humans?",o:["50%","75%","90%","100%"],a:3,s:"Rabies"},
  {t:"The incubation period of rabies can vary depending on all EXCEPT:",o:["Severity of the bite","Site of the bite (e.g., head vs. limb)","Blood group of the victim","Dose of injected virus"],a:2,s:"Rabies"},
  {t:"Which of the following is NOT a clinical feature of rabies in humans?",o:["Headache","Mental depression","Hydrophobia","High fever with rash"],a:3,s:"Rabies"},
  {t:"What is \"furious rabies\" in dogs?",o:["A condition where the dog becomes extremely sleepy","A condition where the dog runs aimlessly, attacks without stimulus, and has excessive salivation","A condition where the dog becomes extremely hungry","A condition where the dog develops paralysis"],a:1,s:"Rabies"},
  {t:"What is \"dumb rabies\" in dogs?",o:["A condition where the dog becomes extremely aggressive","A condition where the dog isolates itself and dies in a sleepiness state","A condition where the dog loses its ability to bark","A condition where the dog develops paralysis of limbs only"],a:1,s:"Rabies"},
  {t:"What are Negri bodies?",o:["The rabies virus itself","Structures found in the brain during post-mortem examination","Antibodies produced against rabies","Wounds created by animal bites"],a:1,s:"Rabies"},
  {t:"Pre-exposure rabies vaccination is recommended for all of the following groups EXCEPT:",o:["Veterinarians","Night guards","Office workers","Laboratory workers handling the virus"],a:2,s:"Rabies"},
  {t:"Which of the following groups should receive pre-exposure prophylaxis for rabies?",o:["All children","People with frequent contact with animals, such as veterinarians","All healthcare workers","People living in urban areas"],a:1,s:"Rabies"},
  {t:"Which of the following is a preventive measure for stray animals in rabies control?",o:["Vaccination","Quarantine","Destruction","Treatment with antibiotics"],a:2,s:"Rabies"},
  {t:"Which of the following is a key step in post-exposure wound management for rabies?",o:["Immediate suturing of the wound","Free flushing with soap and water","Application of topical steroids","Packing the wound with gauze"],a:1,s:"Rabies"},
  {t:"Which of the following is NOT part of wound treatment after a bite from a suspected rabid animal?",o:["Washing with soap and water","Applying antimicrobials if necessary","Immediate suturing of the wound","Applying tetanus toxoid if necessary"],a:2,s:"Rabies"},
  {t:"In post-exposure prophylaxis for a non-immunized patient with severe bites, what is the recommended regimen for HDCV?",o:["3 doses over one week","5 doses over one month","14 doses over 21 days","5 doses over one week"],a:3,s:"Rabies"},
  {t:"Seroprophylaxis with human rabies immunoglobulin (HRIG) is indicated in which scenario?",o:["Mild exposure in a previously vaccinated patient","Severe exposure in a non-immunized patient receiving NTV","Re-exposure within 2 years in a vaccinated patient","Lick on intact skin"],a:1,s:"Rabies"},
  {t:"What is the purpose of seroprophylaxis in rabies management?",o:["To delay viral multiplication until immunity develops","To replace vaccination entirely","To cure established CNS infection","To prevent allergic reactions to the vaccine"],a:0,s:"Rabies"},
  {t:"For a patient previously vaccinated against rabies who is re-exposed after 1 year, what is the recommended HDCV regimen?",o:["5 doses over one week","No vaccination needed","14 doses over 21 days","2 doses separated by 2 days"],a:3,s:"Rabies"},
  /* Brucellosis */
  {t:"What is the causative agent of brucellosis?",o:["Brucella bacilli","Streptococcus bacteria","Escherichia coli","Salmonella bacteria"],a:0,s:"Brucellosis"},
  {t:"Which of the following is NOT a reservoir for brucellosis?",o:["Cattle","Humans","Sheep","Pigs"],a:1,s:"Brucellosis"},
  {t:"How is brucellosis transmitted through food?",o:["By eating properly cooked meat","By drinking pasteurized milk","By consuming raw or underheated milk products","By eating fully cooked vegetables"],a:2,s:"Brucellosis"},
  {t:"What is another name for brucellosis?",o:["Yellow fever","Rocky Mountain spotted fever","Malta fever","Typhoid fever"],a:2,s:"Brucellosis"},
  {t:"Which of the following is a characteristic of undulant fever in brucellosis?",o:["Continuous high fever without breaks","Mild fever only at night","Bouts of fever alternating with afebrile periods","Fever only when exposed to sunlight"],a:2,s:"Brucellosis"},
  {t:"How can contact infection of brucellosis occur?",o:["Through person-to-person transmission","Through contaminated water","Through abrasions in skin and mucous membranes","Through mosquito bites"],a:2,s:"Brucellosis"},
  {t:"Which diagnostic method is considered definitive for brucellosis?",o:["Urine analysis","X-ray examination","Blood culture","Stool examination"],a:2,s:"Brucellosis"},
  {t:"How can air-borne transmission of brucellosis occur?",o:["Through sneezing of infected humans","Through inhalation of dust from dried animal tissue and excreta","Through air conditioning systems","Through fog in coastal areas"],a:1,s:"Brucellosis"},
  {t:"Which of the following is NOT a method to prevent brucellosis in humans?",o:["Boiling milk before consumption","Wearing protective gloves when handling animals","Taking antibiotics preventively every month","Proper cooking of meat"],a:2,s:"Brucellosis"},
  {t:"What happens to Brucella bacilli when milk is pasteurized?",o:["They multiply rapidly","They become more virulent","They are killed","They become dormant"],a:2,s:"Brucellosis"},
  {t:"What type of disease is brucellosis?",o:["Viral disease","Fungal disease","Bacterial zoonotic disease","Parasitic disease"],a:2,s:"Brucellosis"},
  {t:"Which of the following is a preventive measure for brucellosis in animals?",o:["Administering human antibiotics to all farm animals","Active immunization of young calves in endemic areas","Keeping animals indoors at all times","Feeding animals only processed food"],a:1,s:"Brucellosis"},
  /* AIDS / HIV */
  {t:"What is the causative agent of AIDS?",o:["Bacteria","HIV type I &amp; II","Fungus","Parasite"],a:1,s:"AIDS / HIV"},
  {t:"What is the defining CD4 cell count threshold for an AIDS diagnosis?",o:["&lt; 500 cells/mm3","&lt; 350 cells/mm3","&lt; 200 cells/mm3","&lt; 100 cells/mm3"],a:2,s:"AIDS / HIV"},
  {t:"Which of the following is NOT a mode of HIV transmission?",o:["Sexual contact","Mosquito bites","Contact with infected blood","Perinatal infection"],a:1,s:"AIDS / HIV"},
  {t:"The incubation period for HIV can range from:",o:["1-3 weeks","1-3 months","6 months to 7 years","10-15 years"],a:2,s:"AIDS / HIV"},
  {t:"Which of the following is considered a high-risk group for HIV infection?",o:["Children in daycare","Office workers","IV drug users","Vegetarians"],a:2,s:"AIDS / HIV"},
  {t:"What is the primary target of HIV in the immune system?",o:["B-lymphocytes","Natural killer cells","Neutrophils","T-helper (CD4) cells"],a:3,s:"AIDS / HIV"},
  {t:"Which of the following is a symptom of AIDS-related complex (ARC)?",o:["High blood pressure","Increased appetite","Weight gain","Generalized lymphadenopathy"],a:3,s:"AIDS / HIV"},
  {t:"A person with HIV is infectious:",o:["Only when showing symptoms","From onset of infection throughout life","Only during the first year of infection","Only during the last stages of AIDS"],a:1,s:"AIDS / HIV"},
  {t:"Which opportunistic malignancy is most classically associated with AIDS?",o:["Hodgkin's lymphoma","Kaposi's sarcoma","Glioblastoma","Basal cell carcinoma"],a:1,s:"AIDS / HIV"},
  {t:"Which of these is TRUE regarding HIV transmission?",o:["It can be transmitted by sharing food","It can be transmitted by mosquitoes","It can be transmitted through kissing","It can be transmitted by sneezing"],a:2,s:"AIDS / HIV"},
  {t:"The \"window period\" in HIV infection refers to:",o:["The time between infection and seroconversion (antibody detection)","The chronic phase with no symptoms","The terminal stage of AIDS","The period of high viral load post-seroconversion"],a:0,s:"AIDS / HIV"},
  {t:"Which antigen is detected during the \"window period\" of HIV infection?",o:["gp120","p24","Reverse transcriptase","Integrase"],a:1,s:"AIDS / HIV"},
  {t:"Which test is used to confirm HIV infection after a positive ELISA screening?",o:["PCR","Western blot","Rapid antigen test","Viral culture"],a:1,s:"AIDS / HIV"},
  {t:"Which of the following is a MAJOR sign in the standard case definition of AIDS?",o:["Persistent cough &gt; 1 month","Weight loss ≥10% of body weight","Generalized pruritic dermatitis","Herpes zoster"],a:1,s:"AIDS / HIV"},
  {t:"Which is a MINOR sign in AIDS case definition?",o:["Chronic diarrhea &gt;1 month","Oropharyngeal candidiasis","Prolonged fever &gt;1 month","Kaposi's sarcoma"],a:1,s:"AIDS / HIV"},
  {t:"The \"honeymoon phase\" of HIV refers to:",o:["Asymptomatic chronic infection","Acute seroconversion illness","Terminal immunodeficiency","Latent TB reactivation"],a:0,s:"AIDS / HIV"},
  {t:"What is the prognosis of untreated AIDS?",o:["Reversible with antibiotics","Fatal within years due to opportunistic infections","Spontaneous remission in 50% of cases","Chronic but non-life-threatening"],a:1,s:"AIDS / HIV"},
  {t:"Which measure is ineffective for HIV prevention?",o:["Pre-marital serological testing","Avoiding breastfeeding","Antiretroviral therapy for pregnant women","Chemoprophylaxis with penicillin"],a:3,s:"AIDS / HIV"},
  {t:"AIDS is NOT transmitted by:",o:["Inhalation.","Kissing.","Sexual contact.","Perinatally."],a:0,s:"AIDS / HIV"},
  /* Nosocomial Infection */
  {t:"What is a hospital acquired infection (nosocomial infection)?",o:["An infection that patients have before entering the hospital","An infection that only affects hospital staff","An infection acquired by a patient while receiving care in a medical center","An infection that cannot be treated with antibiotics"],a:2,s:"Nosocomial Infection"},
];

const VERSES = [
  {ar:"﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾", ref:"سورة طه – آية ١١٤", tip:"اطلب العلم بنية صادقة، والله يفتح عليك 🤍"},
  {ar:"﴿ يَرْفَعِ اللَّهُ الَّذِينَ آمَنُوا مِنكُمْ وَالَّذِينَ أُوتُوا الْعِلْمَ دَرَجَاتٍ ﴾", ref:"سورة المجادلة – آية ١١", tip:"كل سؤال بتذاكره بيرفعك درجة، كمّل يا بطل 💪"},
  {ar:"﴿ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾", ref:"سورة الشرح – الآيتان ٥ و ٦", tip:"المذاكرة تعب شوية، بس بعده فرج وفرحة النجاح ✨"},
  {ar:"﴿ وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ ﴾", ref:"سورة النجم – آية ٣٩", tip:"سعيك النهارده هو نجاحك بكرة إن شاء الله 🌟"},
  {ar:"﴿ وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ﴾", ref:"سورة العنكبوت – آية ٦٩", tip:"جاهد واتوكل على الله، والتوفيق من عنده 🌿"},
  {ar:"﴿ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ ﴾", ref:"سورة الزمر – آية ٩", tip:"أنت بتبني علم هينفع ناس كتير، استمر 🩺"}
];
const OK_MSG = ["ممتاز، اللهم بارك 🎉","ما شاء الله عليك! 🌟","إجابة صح يا دكتور/ة، كمّل 💪","تبارك الله، ركزك عالي 👏"];
const NO_MSG = ["ركز يا سكر 😔","مفيش مشكلة، الغلطة بتعلّم 👌","راجعها وهتثبت معاك إن شاء الله 📖","متزعلش، كمّل وهتجيبها 🤍"];

let questions, i, correct, wrong, answers, wrongSet, answered, pool = QUESTIONS;
const LETTERS = ['A','B','C','D','E','F'];
const TOPIC_ICON = {"General Epidemiology":"🧬","Communicable Diseases":"🦠","Prevention and Control of Infectious Diseases":"🛡️","Typhoid Fever":"🌡️","Poliomyelitis":"🦽","Viral Hepatitis (B and C)":"🩸","Measles":"🔴","Tuberculosis":"🫁","Rabies":"🐕","Brucellosis":"🐄","AIDS / HIV":"🎗️","Nosocomial Infection":"🏥"};
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function showVerse() {
  const v = pick(VERSES);
  document.getElementById('verseAr').textContent = v.ar;
  document.getElementById('verseRef').textContent = v.ref;
  document.getElementById('verseTip').textContent = v.tip;
}
const topics = [...new Set(QUESTIONS.map(q => q.s))];
const sel = document.getElementById('topicSel');
sel.innerHTML = `<option value="-1">كل المواضيع (${QUESTIONS.length})</option>` +
  topics.map((t, k) => `<option value="${k}">${TOPIC_ICON[t] || '📌'} ${t} (${QUESTIONS.filter(q => q.s === t).length})</option>`).join('');
sel.addEventListener('change', () => {
  const v = +sel.value;
  pool = v < 0 ? QUESTIONS : QUESTIONS.filter(q => q.s === topics[v]);
  init(pool);
});
document.getElementById('topicsBadge').textContent = topics.length + ' موضوع';
function init(p) {
  pool = p || pool;
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  showVerse(); render();
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🦠', l:['#0f766e','15,118,110','#134e4a','#0f766e','#4338ca'], d:['#2dd4bf','45,212,191'] },
  { icon:'📊', l:['#4338ca','67,56,202','#312e81','#4338ca','#0f766e'], d:['#818cf8','129,140,248'] },
  { icon:'🗺️', l:['#d97706','217,119,6','#92400e','#d97706','#0f766e'], d:['#fbbf24','251,191,36'] },
  { icon:'💉', l:['#e11d48','225,29,72','#881337','#e11d48','#4338ca'], d:['#fb7185','251,113,133'] }
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette(); updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div><div class="q-topic">${TOPIC_ICON[q.s] || '📌'} ${q.s}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = `<span>${ok ? pick(OK_MSG) : pick(NO_MSG)}</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  card.querySelector('.nav-btns').innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  wrongSet = [];
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push(q); });
  let grade, gradeColor, moti, v;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; moti = 'ما شاء الله! مستواك عالي جدًا، حافظ عليه وراجع الغلطات القليلة وهتبقى جاهز بإذن الله.'; v = VERSES[1]; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; moti = 'شغل جامد! شوية مراجعة للأسئلة الغلط وهتوصل للامتياز إن شاء الله.'; v = VERSES[0]; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; moti = 'بداية حلوة! اضغط على "إعادة الخطأ" وكرّرها لحد ما تثبت، وانت قدها.'; v = VERSES[3]; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; moti = 'متيأسش! كل مذاكرة بتقربك للهدف. راجع الكتاب وجرّب تاني، والنتيجة هتتحسن بإذن الله.'; v = VERSES[2]; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${Math.max(0, total - answered)}</div><div class="l">تخطي</div></div>
      </div>
      <div class="result-moti">${moti}<div class="verse-ar" style="margin-top:8px">${v.ar}</div><div class="verse-ref">${v.ref}</div></div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init()"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { const r = document.getElementById('ringFill'); if (r) r.style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const p = wrongSet.map(q => ({t: q.t, o: q.o, a: q.a, s: q.s}));
  questions = shuffle(p).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  showVerse(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
</html>
