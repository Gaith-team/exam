<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0f766e;--c2:#4338ca;--c3:#d97706;--c4:#e11d48;--grad:linear-gradient(135deg,#134e4a 0%,#0f766e 35%,#4338ca 75%,#312e81 100%);--bg:#f4f9f8;--bg2:#e6f1ef;--card:#fff;--text:#10262a;--text2:#41585b;--text3:#738b8e;--bc:rgba(15,70,70,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08161a;--bg2:#0f2227;--card:#142a30;--text:#e8f5f3;--text2:#b5d0cd;--text3:#7f9c99;--bc:rgba(255,255,255,.09);--accent:#2dd4bf}}
:root[data-theme="dark"]{--bg:#08161a;--bg2:#0f2227;--card:#142a30;--text:#e8f5f3;--text2:#b5d0cd;--text3:#7f9c99;--bc:rgba(255,255,255,.09);--accent:#2dd4bf}
body{font-family:'Outfit','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
#pb{position:fixed;top:0;left:0;height:3px;z-index:999;width:0;background:linear-gradient(90deg,var(--accent),var(--c3),var(--c4),var(--c2))}
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:var(--card);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#0f766e,#4338ca);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--bg);cursor:pointer;font-size:15px}
.hero{background:var(--grad);padding:38px 20px 40px;text-align:center;color:#fff}
.hero .ic{width:66px;height:66px;border-radius:20px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 12px}
.hero h1{font-size:clamp(22px,5vw,32px);font-weight:900}.hero p{font-size:13px;opacity:.9;margin-top:4px}
.pills{display:flex;justify-content:center;gap:10px;margin-top:16px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 14px;font-size:12px;font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
.toc{background:var(--card);border:1px solid var(--bc);border-radius:16px;padding:14px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:12px;font-weight:700;color:var(--text2);text-decoration:none;padding:6px 12px;border-radius:50px;background:var(--bg2);border:1px solid var(--bc)}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.sec{margin-bottom:30px;scroll-margin-top:70px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sn{min-width:34px;height:34px;border-radius:10px;color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;background:var(--k)}
.sh h2{font-size:17px;font-weight:900;direction:ltr;text-align:left}
.card{background:var(--card);border:1px solid var(--bc);border-radius:16px;margin-bottom:12px;overflow:hidden;border-top:3px solid var(--k);box-shadow:0 2px 12px rgba(15,70,70,.06)}
.en{padding:14px 16px;font-size:15px;font-weight:700;line-height:1.65;direction:ltr;text-align:left}
.ar{padding:12px 16px;font-size:15px;line-height:1.9;direction:rtl;text-align:right;color:var(--text2);background:var(--bg2);border-top:1px solid var(--bc)}
.ar:before{content:"💬 الشرح: ";font-weight:900;color:var(--k)}
.why{padding:12px 16px;font-size:14px;line-height:1.9;direction:rtl;text-align:right;color:var(--text);border-top:1px dashed var(--bc);border-right:4px solid var(--c3)}
.why:before{content:"💡 عشان تفهمها: ";font-weight:900;color:var(--c3)}
.en ul,.ar ul,.why ul{margin:8px 0 0;padding-inline-start:22px}.en li,.ar li,.why li{margin:7px 0}.en li{font-weight:600}.fig{background:var(--card);border:1px solid var(--bc);border-radius:16px;padding:12px;margin-bottom:12px;text-align:center}
.fig img{max-width:100%;height:auto;border-radius:10px;background:#fff}
.sub{font-size:13px;font-weight:900;color:var(--k);margin:14px 4px 8px;direction:ltr;text-align:left}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;font-weight:700;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
footer a{color:#229ED9;text-decoration:none;font-size:12px}
</style></head><body>

{h:"Introduction",k:"#d97706",i:[
["Epidemiology is an important science in public health. It helps us understand how diseases occur, spread, and affect people in a community.","علم الوبائيات علم مهم في الصحة العامة، بيساعدنا نفهم الأمراض بتحصل إزاي وبتنتشر إزاي وبتأثر على الناس في المجتمع إزاي.","زي المحقق: لما يحصل تسمم في مدرسة، بيدوّر مين اتأثر وفين وإزاي ده حصل."],
["The World Health Organization (WHO) defines health as: \"a state of complete physical, mental, and social well-being and not merely the absence of disease or infirmity.\"","منظمة الصحة العالمية بتعرّف الصحة إنها حالة كاملة من العافية الجسدية والنفسية والاجتماعية، مش بس إنك مفيش عندك مرض أو عجز.","واحد مفيش عنده مرض بس مكتئب ومعزول عن الناس، مش معتبر صحته كاملة."],
[["Good health is a high level of wellbeing:","Physical wellbeing – good structure (anatomy) and function (physiology)","Mental wellbeing – psychological balance and good mood","Social wellbeing – well-adapted to the traditions of a community and able to interact well with other people within it"],
["الصحة الجيدة معناها مستوى عالي من العافية، وليها تلات أنواع:","العافية الجسدية: تركيب سليم (التشريح) ووظيفة سليمة (الفسيولوجي).","العافية النفسية: اتزان نفسي ومزاج كويس.","العافية الاجتماعية: متأقلم مع عادات وتقاليد المجتمع وقادر يتعامل كويس مع الناس اللي حواليه."],
["زي تلات أعمدة لو واحد وقع البيت كله يختل.","القلب شكله سليم (تشريح) وبينبض صح (وظيفة).","واحد بيتعامل مع ضغط الشغل من غير ما ينهار.","واحد بيتعامل كويس مع جيرانه وزمايله ومتأقلم مع عادات بلده."]],
["Disease: Is an abnormal condition that affects a person and causes a disorder of a structure or function.","المرض: حالة غير طبيعية بتأثر على الشخص وبتعمل خلل في تركيب أو وظيفة في جسمه.","كسر في العظم خلل في التركيب، والسكر خلل في الوظيفة."],
[["Definition of Epidemiology","It is the study of Distribution, Determinants (etiology or risk factors) and Dynamics of diseases or health conditions in a defined population.","It is concerned with communicable & non-communicable diseases."],
["تعريف علم الوبائيات:","هو دراسة التوزيع والمحددات (يعني الأسباب أو عوامل الخطورة) والديناميكية للأمراض أو الحالات الصحية في مجموعة سكانية محددة.","بيهتم بالأمراض المعدية والأمراض غير المعدية."],
["التعريف على نقطتين.","هتدرس السكر في قرية: مين بيتصاب وفين ووقتها (توزيع)، وليه (محددات)، وإزاي بينتقل أو بيتطور (ديناميكية).","بيدرس الكوليرا (معدي) وضغط الدم (غير معدي) مع بعض."]],
["Communicable diseases: Transmissible diseases caused by biological agents.","الأمراض المعدية: أمراض بتنتقل وسببها عوامل حيوية.","الإنفلونزا: سببها فيروس وبتنتقل من شخص لشخص."],
["Non–communicable diseases: non-transmissible diseases due to exposure to risk factors.","الأمراض غير المعدية: أمراض مبتنتقلش، وبتحصل بسبب التعرض لعوامل خطورة.","ضغط الدم العالي ممكن ييجي من الملح الزيادة والتوتر، ومستحيل تعدّي بيه حد."],
["The term epidemiology comes from the Greek words: Epi Means \"on or upon\" Demos means \"people\" Loges means \"the study of\"","كلمة epidemiology جاية من اليونانية: Epi يعني \"على\"، وDemos يعني \"الناس\"، وLoges يعني \"دراسة\".","يعني حرفياً: الدراسة اللي بتتعمل على الناس."]]},
{h:"Components of epidemiology",k:"#e11d48",i:[
[["Components of epidemiology:","1. Frequency of disease.","2. Distribution of disease according to time, person, place.","3. Determinants of disease or risk factors (Agent, host and environmental factors).","4. Dynamics of disease."],
["مكونات علم الوبائيات أربعة:","تكرار المرض (كام حالة).","توزيع المرض حسب الزمان والشخص والمكان.","محددات المرض أو عوامل الخطورة: العامل المسبب والعائل والبيئة.","ديناميكية المرض."],
["زي الأجزاء اللي بتركّب منها الحاجة.","كام واحد اتصاب بالحمى في الشهر ده.","الحمى بتزيد في الصيف، في الأطفال، في منطقة معينة.","مرض معدي سببه ميكروب (عامل)، في طفل مناعته ضعيفة (عائل)، في مكان زحمة (بيئة).","بيتحرك إزاي من واحد للتاني (هنشرحها بعدين)."]]]},
{h:"i-Distribution",k:"#0f766e",i:[
["i-Distribution: Distribution of health-related events in the population in relation to: - person, time, and place characteristics (Distribution Triad).","التوزيع: توزيع الأحداث المتعلقة بالصحة في المجتمع بالنسبة لخصائص الشخص والزمان والمكان، وده اسمه مثلث التوزيع (Distribution Triad).","نفس الحمى بنوصفها: مين اتصاب (شخص)، فين (مكان)، إمتى (زمن). ومثلث التوزيع غير المثلث الوبائي."],
[["Distribution in relation to: Person, place & time.","a-Person: Personal factors may be age, sex, marital status, race and ethnicity, religion, socioeconomic, nativity & migration.","b-Place (types of place comparison): The occurrence of disease differs according to the geographic areas : International comparison of disease frequency: may be attributed to climate, cultural factors & natural dietary habits","c. Time: Diseases usually occur in the following patterns:"],
["التوزيع بالنسبة لـ: الشخص والمكان والزمان.","الشخص: العوامل الشخصية ممكن تكون السن والنوع والحالة الاجتماعية والعرق والأصل والدين والمستوى الاقتصادي الاجتماعي والمولد (نيتيفيتي) والهجرة.","المكان (أنواع المقارنة بين الأماكن): حدوث المرض بيختلف حسب المناطق الجغرافية. ومقارنة تكرار المرض بين الدول ممكن ترجع للمناخ والعوامل الثقافية وعادات الأكل الطبيعية.","الزمن: الأمراض غالباً بتحصل بالأنماط الجاية."],
["التلات أسئلة: مين؟ فين؟ إمتى؟","مرض بيصيب كبار السن أكتر من الشباب، أو بيصيب عمال ناس أكتر من غيرهم.","مرض منتشر في منطقة وشبه معدوم في منطقة تانية، وشعوب أكلها غني بالدهون بتكثر عندها أمراض معينة.","بنسأل المرض بيزيد في أنهي وقت."]],
[["1-Cyclic (periodic) trend: the disease occur over a period of time which may be:","Days: Monday fever are linked to the day on which the person goes to work.","Seasonal: seasonal flu, summer diarrhea."],
["الاتجاه الدوري: المرض بيحصل على مدى فترة زمنية وممكن يكون:","الأيام: حمى الإثنين مرتبطة باليوم اللي الشخص بيروح فيه الشغل.","الموسمي: إنفلونزا موسمية وإسهال الصيف."],
["زي مواعيد متكررة بتيجي كل فترة.","واحد بيحس بتعب كل يوم إثنين لأنه راجع الشغل بعد الأجازة.","الإنفلونزا بتزيد في الشتا، والإسهال بيزيد في الصيف."]]]},
{h:"ii-Determinants",k:"#4338ca",i:[
[["ii-Determinants:","- Mean etiology & risk factors of the disease.","- It includes agent factors, host factors and environmental factors . (Epidemiological triad) = (ecological triad)"],
["المحددات: هي الأسباب اللي بتفسر ليه المرض حصل.","يعني سبب المرض وعوامل الخطورة بتاعته.","بتشمل عوامل المسبب وعوامل العائل وعوامل البيئة، وده المثلث الوبائي وهو نفسه المثلث البيئي."],
["زي ما تسأل: ليه المرض ده حصل؟","سبب السرطان وعوامل زي التدخين.","اسمين لنفس الحاجة: المثلث الوبائي = المثلث البيئي."]]]},
{h:"Epidemiological triad (triangle)",k:"#d97706",fig:[I1,"Epidemiological triad"],i:[
[["Epidemiological triad (triangle):","- It is triad of ecological factors that affect the occurrence of the disease","- It consists of (Agent, Host, Environment)"],
["المثلث الوبائي:","هو ثلاثة عوامل بيئية بتأثر على حدوث المرض.","بيتكوّن من: العامل المسبب (Agent) والعائل (Host) والبيئة (Environment)."],
["زي ثلاث دواير متشابكة، الدايرة الواحدة بتأثر في التانيتين.","لو عاوز تفهم ليه المرض حصل، بتبص على التلاتة مع بعض.","ميكروب + إنسان + مكان."]]]},
{h:"1) Agent factors",k:"#e11d48",i:[
[["1) Agent factors:","• Biological agents (micro-organisms): bacteria, virus, fungi, parasites, rickettsia.","• Physical agents: heat, cold, pressure, radiation, noise.","• Chemical agents: endogenous or exogenous as poisons, insecticides.","• Mechanical agents: injuries, accidents.","• Nutritional agents: deficiency of iron or excess fat & carbohydrates.","• Genetic agents: as in Down’s syndrome.","• Risk factors: no specific causative agents, a lot of factors may precipitate (associate with) the occurrence of diseases."],
["عوامل المسبب: هو الحاجة اللي بتعمل المرض.","العوامل الحيوية (الكائنات الدقيقة): بكتيريا وفيروسات وفطريات وطفيليات وريكتسيا.","العوامل الفيزيائية: حرارة وبرودة وضغط وإشعاع وضوضاء.","العوامل الكيميائية: داخلية المنشأ أو خارجية زي السموم والمبيدات الحشرية.","العوامل الميكانيكية: إصابات وحوادث.","العوامل الغذائية: نقص الحديد أو زيادة الدهون والكربوهيدرات.","العوامل الوراثية: زي متلازمة داون.","عوامل الخطورة: مفيش مسبب محدد، وفي عوامل كتير ممكن تعجّل (ترتبط) بحدوث المرض."],
["أنواع المسبب سبعة.","التيفود سببه بكتيريا، والإنفلونزا سببها فيروس.","ضربة الشمس من الحرارة، والصمم من الضوضاء العالية.","التسمم بالمبيد الحشري.","كسر بسبب حادث عربية.","نقص الحديد بيعمل أنيميا، وزيادة الدهون بتعمل سمنة.","طفل اتولد بكروموسوم زيادة.","أمراض القلب مفيهاش ميكروب واحد، لكن التدخين والسمنة والتوتر بيزودوا احتمالها."]]]},
{h:"2) Host factors (susceptibility)",k:"#0f766e",i:[
[["2) Host factors (susceptibility):","1. Heredity factors: chromosomal anomalies lead to mental retardation.","2. Age: - infectious diseases occur more in young age while chronic diseases occur more in old age.","3. Sex: Certain diseases occur more in males e.g., Ischemic Heart Disease (IHD). The differences may be due to anatomical, physiological or functional factors.","4. Occupation: Some occupations may lead to certain diseases e.g., exposure to silica dust leads to silicosis, sedentary life leads to I.H.D.","5. Socioeconomic conditions: income, occupation, residence, life style, education."],
["عوامل العائل (القابلية للإصابة): العائل هو الإنسان.","العوامل الوراثية: شذوذ الكروموسومات بيؤدي لتخلف عقلي.","السن: الأمراض المعدية بتحصل أكتر في السن الصغير، والأمراض المزمنة بتحصل أكتر في السن الكبير.","النوع: أمراض معينة بتحصل في الرجالة أكتر، زي مرض القلب الإقفاري (IHD). والفروق ممكن ترجع لعوامل تشريحية أو فسيولوجية أو وظيفية.","المهنة: مهن معينة ممكن تسبب أمراض معينة، زي التعرض لغبار السيليكا بيسبب السيليكوزس، والحياة الخاملة بتسبب مرض القلب الإقفاري.","الظروف الاجتماعية الاقتصادية: الدخل والمهنة والسكن ونمط الحياة والتعليم."],
["كل واحد قابليته للمرض مختلفة.","طفل عنده خلل في الكروموسومات.","الأطفال أكتر عرضة للنزلة المعوية، وكبار السن للضغط والسكر.","مرض القلب الإقفاري نسبته أعلى في الرجالة.","عامل محاجر بيستنشق غبار، وموظف قاعد طول اليوم.","السكن في مكان زحمة ومفيهوش تهوية بيزوّد فرصة المرض."]]]},
{h:"III. Environmental factors",k:"#4338ca",i:[
[["III. Environmental factors:","- Physical environment e.g., air, water,","- Chemical environment: dust. Metals, & gases.","- Biological environment e.g. animals, insects, microorganism.","- Social and cultural environment: cultures, habits, traditions."],
["العوامل البيئية: كل اللي حوالين الإنسان والميكروب.","البيئة الفيزيائية: زي الهوا والمية.","البيئة الكيميائية: الغبار والمعادن والغازات.","البيئة الحيوية: زي الحيوانات والحشرات والكائنات الدقيقة.","البيئة الاجتماعية والثقافية: الثقافات والعادات والتقاليد."],
["أربع أنواع للبيئة.","مية ملوثة تسبب مرض.","غازات المصانع.","الناموس بينقل الملاريا.","عادات الأكل في مجتمع معين."]]]},
{h:"IV. Dynamics",k:"#d97706",fig:[I2,"Chain of infection"],i:[
["IV.Dynamics: - Means chain of infection of the disease","الديناميكية: يعني سلسلة العدوى بتاعة المرض.","الصورة بتوضح السلسلة: Infectious Agent، Reservoir، Portal of Exit، Mode of Transmission، Portal of Entry، Susceptible Host؛ لو انقطعت حلقة العدوى بتتوقف."]]},
{h:"Types of diseases",k:"#e11d48",i:[
[["Types of diseases:","• Communicable diseases: caused by biological agents –Transmissible","• Non–communicable diseases: risk factors predispose to non-transmissible diseases."],
["أنواع الأمراض:","الأمراض المعدية: سببها عوامل حيوية وبتنتقل.","الأمراض غير المعدية: عوامل الخطورة بتهيّئ لأمراض مبتنتقلش."],
["زي تصنيف: معدي وغير معدي.","الكوليرا.","السكر وضغط الدم."]]]},
{h:"General Epidemiology of infectious diseases",k:"#0f766e",i:[
["Infection: invasion of the body by pathogenic microorganisms.","العدوى: غزو الجسم بميكروبات ممرضة.","ميكروب دخل جسمك."],
[["Sequalae of infection:","1. In-apparent","2. Sub-clinical infection.","3. Manifest (clinical) disease."],
["النتائج اللي بتحصل بعد العدوى:","عدوى غير ظاهرة (مفيش أي علامات).","عدوى تحت إكلينيكية (من غير أعراض واضحة).","مرض ظاهر (إكلينيكي) بأعراض واضحة."],
["دخول الميكروب مش دايماً معناه مرض ظاهر.","الميكروب دخل ومحدش عرف ولا ظهر عليك حاجة.","جسمك قاوم من غير أعراض واضحة.","واحد جاله حرارة وكحة وراح للدكتور."]]]},
{h:"Factors affecting squeal of infection",k:"#4338ca",i:[
[["Factors affecting squeal of infection:","1. Agent factors: number (dose) – virulence of organism.","2. Host factors: body resistance (immunity).","3. Environmental factors: affecting occurrence and pattern of spread"],
["العوامل اللي بتأثر على نتيجة العدوى:","عوامل المسبب: عدد الميكروبات (الجرعة) وشراسة الميكروب.","عوامل العائل: مقاومة الجسم (المناعة).","العوامل البيئية: بتأثر على حدوث المرض ونمط انتشاره."],
["هي اللي بتحدد هتبقى عدوى خفيفة ولا مرض ظاهر.","جرعة كبيرة من ميكروب شرس تعمل مرض أسهل.","واحد مناعته قوية ممكن مياخدش المرض.","الزحمة وقلة النظافة بتساعد الانتشار."]]]},
{h:"Pattern of spread of infectious diseases in the community",k:"#e11d48",i:[
[["Pattern of spread of infectious diseases in the community:","1. Sporadic: Infrequent scattered cases not related to each other.","2. Endemic: A disease constantly present in the community due to the presence of its ecological factors (agent, host, environment) that help the maintenance of the disease.","3. Epidemic: Sudden increase in the number of infectious disease in certain places and time than expected in that place and time","Pandemic: Epidemic of a particular infectious disease involving some countries of the world e.g., cholera, plague.","4. Outbreak: Epidemic occurs in a confined group or closed community e.g. school, camp, hospital."],
["أنماط انتشار الأمراض المعدية في المجتمع:","متقطع: حالات قليلة متفرقة مش مرتبطة ببعض.","متوطن: مرض موجود في المجتمع باستمرار بسبب وجود عوامله البيئية (المسبب والعائل والبيئة) اللي بتساعد على استمراره.","وبائي: زيادة مفاجئة في عدد حالات المرض المعدي في أماكن وزمن معينين أكتر من المتوقع.","جائحة: وباء لمرض معدي معين بيشمل دول كتير في العالم، زي الكوليرا والطاعون.","فاشية: وباء بيحصل في مجموعة محدودة أو مجتمع مغلق، زي مدرسة أو معسكر أو مستشفى."],
["زي درجات: من حالات متفرقة لحد انتشار عالمي.","حالة في قرية وحالة في مدينة بعيدة من غير صلة.","مرض بيفضل موجود في المنطقة طول السنة.","منطقة بتسجل 5 حالات في الشهر وفجأة تسجل 200.","وباء عدى حدود دول كتير.","مجموعة طلبة اتسمموا من أكل الكافتيريا."]]]},
{h:"Spread of infectious disease in animals",k:"#0f766e",i:[
[["Spread of infectious disease in animals:","1. Epizootic: Epidemic spread of infectious disease among animals.","2. Enzootic: endemic spread of infectious disease among animals."],
["انتشار الأمراض المعدية في الحيوانات:","Epizootic: انتشار وبائي لمرض معدي بين الحيوانات.","Enzootic: انتشار متوطن لمرض معدي بين الحيوانات."],
["نفس مصطلحات الناس بس للحيوانات.","وباء بيضرب مزرعة أبقار فجأة.","مرض موجود دايماً بين حيوانات منطقة."]]]}
];
const toc=document.getElementById('toc'),app=document.getElementById('app');
S.forEach((s,n)=>{
 toc.insertAdjacentHTML('beforeend',`<a href="#s${n}">${n+1}. ${s.h}</a>`);
 let h=`<div class="sec" id="s${n}" style="--k:${s.k}"><div class="sh"><div class="sn">${n+1}</div><h2>${s.h}</h2></div>`;
 if(s.fig)h+=`<div class="fig"><img src="${s.fig[0]}" alt="${s.fig[1]}"></div>`;
 const R=a=>Array.isArray(a)?`<div>${a[0]}</div><ul>${a.slice(1).map(t=>`<li>${t}</li>`).join('')}</ul>`:a;
 s.i.forEach(x=>{const m=Array.isArray(x[0]);const e=m?x[0]:x[0],r=m?x[1]:x[1],w=m?x[2]:x[2];h+=`<div class="card"><div class="en">${R(e)}</div><div class="ar">${R(r)}</div><div class="why">${R(w)}</div></div>`});
 app.insertAdjacentHTML('beforeend',h+'</div>');
});
