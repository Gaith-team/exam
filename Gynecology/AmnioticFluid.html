body{font-family:'Outfit','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:58px;background:var(--card);border-bottom:1px solid var(--bc)}

.exp{margin:0 18px 14px;padding:11px 14px;background:var(--hl);border-right:3px solid var(--hlb);border-radius:10px;font-size:13.5px;line-height:1.8}

.btn{flex:1;padding:13px;border:none;border-radius:12px;font:900 14px 'Outfit','Segoe UI',sans-serif;cursor:pointer;display:block;text-align:center;text-decoration:none}
.btn-p{background:linear-gradient(135deg,var(--dark),var(--accent));color:#fff}
.btn-s{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.res{text-align:center;padding:30px 18px;background:var(--card);border:1px solid var(--bc);border-radius:18px;margin-bottom:16px}
.res .big{font-size:44px;font-weight:900;color:var(--accent)}
.res .g{font-size:20px;font-weight:900;margin:6px 0}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.ri{background:var(--card);border:1px solid var(--bc);border-right:4px solid var(--bc);border-radius:12px;padding:14px;margin-bottom:9px;font-size:13px}
.ri.ok{border-right-color:var(--ok)}.ri.no{border-right-color:var(--no)}
.ri .q{font-weight:700;direction:ltr;text-align:left;margin-bottom:6px}
.ri .r{direction:ltr;text-align:left;margin-top:4px;color:var(--text2)}

<script>
/* ================= NOTES (ترتيب المحاضرة) ================= */
const NOTES = [
{h:"AMNIOTIC FLUID DISORDERS", s:"Premature Rupture of Membrane (PROM)", g:[
{t:"Definition: We have 2 items:", i:[
["PROM: Rupture of membrane before initiation of labour pains.","PROM يعني الغشاء (الكيس) اللي حوالين الجنين ينفجر قبل ما ألم الطلق يبدأ.","الست لسه ما حسّتش بأي طلق، وفجأة مية نزلت منها. يعني الغشاء اتفتح قبل الطلق."],
["PPROM: Rupture of membrane before 37 w of pregnancy.","PPROM يعني الغشاء ينفجر قبل الأسبوع 37 من الحمل.","نفس PROM بس الحمل لسه ما كملش، يعني الجنين لسه Preterm."]]},
{t:"Aetiology:", i:[
["The exact cause is unknown, but theoretically 2 mechanisms may occur:","السبب الأكيد مش معروف، بس نظرياً فيه ميكانيزمين ممكن يحصلوا.","مفيش سبب واحد متفق عليه، فبيتفسر بطريقتين."],
["1- Reduction of membrane tensile strength, e.g. with infection.","قوة شد الغشاء بتقل، زي مع العدوى.","زي كيس بلاستيك رقّ وضعف، أقل ضغط يخرقه."],
["2- ↑ of intrauterine pressure e.g. polyhydramnios.","الضغط جوه الرحم بيزيد، زي مع زيادة السائل الأمنيوسي (polyhydramnios).","زي بالونة اتنفخت زيادة عن اللزوم، بتفرقع بسهولة."],
["The main cause is reduction of membrane strength by infection (microorganisms):","السبب الرئيسي هو إن الميكروبات تضعّف قوة الغشاء.","الميكروب هو الأساس، والباقي نظريات. والميكروب بيعمل ده بـ 3 طرق في الشرح اللي تحت."],
["Mucinase & protease → Dissolve mucus plug","الميكروبات بتفرز إنزيمات (mucinase و protease) بتذوّب سدادة المخاط.","السدادة دي زي الفلينة اللي بتقفل عنق الرحم. لما تدوب، الباب يتفتح للميكروبات وتوصل للغشاء."],
["Collagenase & elastase → Membrane disruption ROM","إنزيمات collagenase و elastase بتهري الغشاء فيتقطع وينفجر (ROM).","الكولاجين والإيلاستين هما الخيوط اللي شادّة الغشاء، لما يتقطعوا القماشة تتفتق."],
["↑PG","العدوى بتزوّد البروستاجلاندين (PG).","الـ PG بيحرّك انقباضات الرحم، فبيساعد إن الغشاء ينفجر والطلق يتبدي بدري."]]},
{t:"Diagnosis of PROM:", i:[
["1- History of gush of fluid from vagina which is: a- Large amount. b- Suddenly occur.","الست بتحكي إن مية نزلت من المهبل مرة واحدة، وكمية كبيرة، وفجأة.","ده الفرق بينها وبين التسريب البسيط أو البول: هنا اندفاع كبير ومفاجئ."],
["2- Visualization of amniotic fluid (A.F.) inside vagina, by using cusco's speculum.","نشوف السائل الأمنيوسي بعينينا جوه المهبل باستخدام منظار cusco.","الدكتور يفتح المهبل بالمنظار ويلاقي المية متجمعة جوه، يبقى تشخيص مباشر."],
["3- Nitrazine test: by use of Nitrazine paper to estimate pH, vaginal pH normally = 5 (acidic). In case of PROM → pH is alkaline as pH of A.F. is alkaline 7.5.","اختبار النيترازين: بنستخدم ورقة نيترازين نقيس بيها الـ pH. المهبل طبيعي حمضي pH = 5، ولو PROM الـ pH يبقى قلوي (7.5) لأن السائل الأمنيوسي قلوي.","الورقة بتغيّر لونها لما تلمس سائل قلوي. المهبل حمضي، فلو الورقة اتقلّبت يبقى فيه سائل غريب قلوي نازل (هو السائل الأمنيوسي)."],
["4- Fern test: a drop of A.F. on glass slide under microscope → crystallization pattern of A.F. salts (fern appearance).","اختبار الـ Fern: نحط نقطة سائل على شريحة زجاج ونبصّ بالميكروسكوب، نشوف أملاح السائل متبلورة على شكل ورقة سرخس.","لما السائل ينشّف الأملاح بتترسم شكل ورق السرخس، يبقى ده سائل أمنيوسي."],
["5- Abdominal U/S to detect the amount of liquor around fetus, in case of PROM → ↓ amount of liquor.","السونار على البطن بيقيس كمية السائل حوالين الجنين، ولو PROM الكمية بتقل.","المية نزلت، فاللي حوالين الجنين بقى أقل."],
["6- Vaginal cytology: +ve of fetal cells in smear of vaginal cytology indicate PROM.","فحص الخلايا من المهبل: لو لقينا خلايا جنينية في المسحة يبقى PROM.","السائل الأمنيوسي فيه خلايا من الجنين، فلو ظهرت في المهبل يبقى السائل نزل."],
["7- Fetal fibronectin: +ve in endocx. & vagina → highly accurate diagnosis of PROM.","الـ Fetal fibronectin لو طلع إيجابي في عنق الرحم والمهبل يبقى تشخيص PROM دقيق جداً.","ده تحليل بيدوّر على بروتين جنيني، وظهوره في المكان ده دليل قوي."],
["8- Alfa-fetoprotein (α-FP): +ve in vagina → high accurate diagnosis.","الـ Alfa-fetoprotein لو إيجابي في المهبل يبقى تشخيص دقيق عالي.","بروتين موجود في السائل الأمنيوسي، لو لقيناه في المهبل يبقى السائل نزل."],
["9- Amnioscopy: for direct visualization of amniotic fluid & membranes.","الـ Amnioscopy بنشوف بيه السائل الأمنيوسي والأغشية مباشرة.","منظار بيدخل ويخلينا نبصّ على الغشاء بنفسنا."]]},
{t:"Complications of PROM:", i:[
["Maternal: 1- Chorio amnionitis. 2- Premature separation of placenta.","مضاعفات للأم: التهاب الأغشية والسائل (chorioamnionitis)، وانفصال المشيمة المبكر.","الأم بتتعرض للعدوى، والمشيمة ممكن تنفصل قبل وقتها."],
["Fetal: 1- Infection of fetus. 2- R.D.S. 3- Pulmonary hypoplasia. 4- Fetal distress. 5- ↑ perinatal morbidity & mortality.","مضاعفات للجنين: عدوى للجنين، RDS، نقص نمو الرئة، ضيق جنين (fetal distress)، وزيادة المرض والوفيات حول الولادة.","قلة السائل بتأثر على نمو الرئة، والعدوى بتوصله، ففرصة المضاعفات بتزيد."]]},
{t:"ttt. of PROM:", i:[
["1- Antibiotics is mandatory: penicillin or erythromycin.","المضاد الحيوي إجباري: بنسلين أو إريثروميسين.","السبب إن العدوى هي أخطر حاجة في PROM، فمفيش مجال نستغنى عن المضاد."],
["2- PROM with complication: infection → TOP, fetal distress → TOP.","لو PROM معاه مضاعفات: عدوى أو ضيق جنين، نعمل TOP (إنهاء الحمل).","TOP معناها Termination of pregnancy. المضاعفة معناها إن البقاء جوه الرحم بقى خطر، فنولّدها."],
["PROM without complication: < 28 w → TOP.","من غير مضاعفات، لو أقل من 28 أسبوع: TOP.","زي ما هو مكتوب في المحاضرة."],
["PROM without complication: 28-36 w → according to L/S ratio: < 2 → expectant ttt, > 2 → TOP.","من 28 لـ 36 أسبوع بنشوف الـ L/S ratio: لو أقل من 2 نستنى (expectant)، ولو أكبر من 2 نعمل TOP.","الـ L/S ratio بيقيس نضج رئة الجنين. أقل من 2 معناها الرئة لسه مش ناضجة فنستنى، وأكبر من 2 الرئة جاهزة فنولّد."],
["PROM without complication: > 36 W → TOP.","من غير مضاعفات، لو أكبر من 36 أسبوع: TOP.","الحمل شبه كامل، فمفيش داعي نستنى."]]},
{t:"Role of antibiotics in PROM:", i:[
["a. Can prevent PROM.","المضاد ممكن يمنع حدوث PROM.","علشان العدوى سبب رئيسي، فلو اتعالجت قبل كده ممكن الغشاء ما ينفجرش."],
["b. Prevent PTL associated with PROM.","يمنع الطلق المبكر (PTL) المصاحب لـ PROM.","PTL = preterm labour."],
["c. Prevent chorioamnionitis.","يمنع التهاب الأغشية والسائل (chorioamnionitis).","الغشاء المفتوح باب للميكروبات، والمضاد بيحمي."],
["d. Prophylaxis against fetal intra uterine infection.","وقاية من عدوى الجنين جوه الرحم.","يعني بنحمي الجنين نفسه قبل ما يتصاب."],
["e. Prevent neonate infection","يمنع عدوى المولود بعد الولادة.","الحماية بتمتد لحد ما الطفل يتولد."]]},
{t:"Role of corticosteroids:", i:[
["24mg dexamethazone for 24hr which begin to act after 24hr from last dose for 1 week.","24 ملجم ديكساميثازون على مدار 24 ساعة، وبيبدأ يشتغل بعد 24 ساعة من آخر جرعة وبيفضل شغال لمدة أسبوع.","الكورتيزون بينضّج رئة الجنين عشان لو اتولد بدري ما يعملش RDS. وعشان كده بنحتاج وقت قبل ما يبدأ مفعوله."]]},
{t:"Role of short term tocolysis in PROM:", i:[
["Long term tocolysis is contra indicated as some authors described that uterine irritability (which suppressed by tocolytics) may be the earliest sign of choriomnionitis.","الـ tocolysis (مثبطات الانقباض) لفترة طويلة ممنوعة، لأن بعض العلماء قالوا إن تهيّج الرحم ممكن يكون أول علامة على chorioamnionitis، والـ tocolytics بتخبّيه.","لو سكّتنا الانقباضات بقالنا فترة، ممكن نفوّت العلامة اللي تنبهنا إن فيه التهاب."],
["Short term tocolysis can be used for only 2 days till the cortisone dose is taken (24mg/24hr for 1day) and begin to act after 24 hr of the last dose.","الـ tocolysis قصير المدى ينفع بس لمدة يومين، لحد ما جرعة الكورتيزون تتاخد (24 ملجم/24 ساعة لمدة يوم) وتبدأ تشتغل بعد 24 ساعة من آخر جرعة.","الهدف إننا نكسب وقت بسيط بس عشان الكورتيزون ينضّج الرئة، مش نأجّل الولادة أكتر من كده."]]}
]},
{h:"Intrauterine Infection With Pregnancy", s:"(Chorioamnionitis)", g:[
{t:"Introduction:", i:[
["Usually choroamnionitis occurs after PROM but there is some organisms can cross intact membrane & cause chorioamnionitis e.g.","غالباً الالتهاب بيحصل بعد PROM، بس فيه ميكروبات تقدر تعدّي الغشاء السليم وتعمل chorioamnionitis، زي:","يعني مش شرط الغشاء ينفجر، فيه ميكروبات قوية تخترقه."],
["1- Listeria monocytogenous.","الليستريا مونوسيتوجينز.","ميكروب من اللي بيعدي الغشاء السليم."],
["2- Bacteroid fragilis.","الباكتيرويد فراجيليس.","ميكروب تاني من نفس المجموعة."],
["3- Group B-hemolytic strept.","استربتوكوكس المجموعة B المحللة للدم.","التالت في القايمة."],
["Amniotic fluid infection syndrome = congenital neonatal pneumonia + chorioamnionitis.","متلازمة عدوى السائل الأمنيوسي = التهاب رئوي خلقي للمولود + chorioamnionitis.","يعني الميكروب بيصيب الغشاء، والجنين بيبلع السائل الملوّث فيتصاب في رئته."]]},
{t:"Aetiology:", i:[
["(a) Organisms Type: 1- mycoplasma. 2- bacteroid fragilis. 3- gp B. strept. 4- strept. faecalis. 5- non-haemolytic strept 6- E. coli.","أنواع الميكروبات: ميكوبلازما، باكتيرويد فراجيليس، استربتوكوكس مجموعة B، استربتوكوكس فيكالس، استربتوكوكس غير محللة للدم، وإي كولاي.","6 أنواع لازم تحفظهم، ولاحظ إن اتنين منهم اتكرروا مع اللي فوق."],
["b) Route: Ascending route, descending route, transplacental.","طرق وصول العدوى: صاعدة (من المهبل)، نازلة، وعبر المشيمة.","ascending يعني من تحت لفوق من المهبل، descending يعني من فوق، transplacental يعني من دم الأم للجنين عن طريق المشيمة."],
["c) P.F. : (a) General as before","العوامل المهيّئة: عامة زي اللي قبل كده.","يعني نفس العوامل العامة اللي اتكلمنا عنها قبل كده."],

/* ================= ENGINE ================= */
let questions,i,correct,wrong,answers,answered,timeLeft,timerI,started=false;
const LET=["A","B","C","D"];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function init(pool,rand){questions=rand?shuffle([...pool]):[...pool];i=0;correct=0;wrong=0;answered=0;answers=new Array(questions.length).fill(null);timeLeft=20*60;startTimer();render()}
function startTimer(){clearInterval(timerI);const tm=document.getElementById("tm");tm.className="timer";tm.textContent="20:00";
 timerI=setInterval(()=>{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;tm.textContent=m+":"+(s<10?"0":"")+s;if(timeLeft<=120)tm.className="timer danger";if(timeLeft<=0){clearInterval(timerI);finish()}},1000)}
function top_(){const n=questions.length;sC.textContent=correct;sW.textContent=wrong;sR.textContent=Math.round((n-answered)/n*100)+"%";pl.textContent="سؤال "+(i+1)+" / "+n;pf.style.width=((i+1)/n*100)+"%"}
function render(){top_();const q=questions[i];
 const type=q.o===TF?"True / False":"Multiple Choice";
 app.innerHTML=`<div class="qc"><div class="qh"><span>سؤال ${i+1} / ${questions.length}</span><span>${type}</span></div><div class="qt">${q.t}</div><div class="opts">${q.o.map((o,k)=>`<div class="opt" id="o${k}" onclick="choose(${k})"><div class="let">${LET[k]}</div>${o}</div>`).join("")}</div><div class="nb"><button class="btn btn-s" onclick="skip()">تخطي</button></div></div>`}
function choose(v){if(answers[i]!==null)return;answers[i]=v;answered++;const q=questions[i],ok=v===q.a;ok?correct++:wrong++;top_();
 q.o.forEach((_,k)=>{const e=document.getElementById("o"+k);e.classList.add("dis");if(k===q.a)e.classList.add("correct");else if(k===v)e.classList.add("wrong")});
 const card=document.querySelector(".qc");const fb=document.createElement("div");fb.className="fb "+(ok?"ok":"no");fb.textContent=ok?"🎉 شطور جدا، اللهم بارك":"😔 ركز يا سكر";
 card.querySelector(".opts").after(fb);
 if(q.exp){const e=document.createElement("div");e.className="exp";e.innerHTML="<b>💬 شرح:</b> "+q.exp;fb.after(e)}
 card.querySelector(".nb").innerHTML=`<button class="btn btn-p" onclick="next()">${i<questions.length-1?"السؤال التالي":"إنهاء الامتحان"}</button>`}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrong++;top_()}next()}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()}
function finish(){clearInterval(timerI);const n=questions.length,sc=Math.round(correct/n*100);
 let g=sc>=90?"🥇 ممتاز":sc>=75?"🥈 جيد جداً":sc>=60?"🥉 جيد":"📚 راجع تاني";
 const wr=questions.filter((q,k)=>answers[k]!==q.a);
 const rep=questions.map((q,k)=>{const ok=answers[k]===q.a;return `<div class="ri ${ok?"ok":"no"}"><div class="q">${ok?"✅":"❌"} ${q.t}</div>${ok?"":`<div class="r">إجابتك: ${answers[k]>=0?q.o[answers[k]]:"تم التخطي"}</div><div class="r">الصحيح: ${q.o[q.a]}</div>`}</div>`}).join("");
 window._wr=wr;
 app.innerHTML=`<div class="res"><div class="big">${sc}%</div><div class="g">${g}</div><div>صحيح ${correct} • خطأ ${wrong} من ${n}</div><div class="acts">${wr.length?`<button class="btn btn-p" onclick="init(window._wr,true)">إعادة الأسئلة الخطأ (${wr.length})</button>`:""}<button class="btn btn-s" onclick="init(QUESTIONS,false)">امتحان جديد بالترتيب</button><button class="btn btn-s" onclick="init(QUESTIONS,true)">امتحان جديد عشوائي</button></div></div><div style="font-weight:700;margin:18px 4px 10px;color:var(--text2)">📋 تقرير مفصّل</div>${rep}`;
 window.scrollTo({top:0,behavior:"smooth"})}

function showTab(n){
 document.getElementById("notes").classList.toggle("hide",n!==1);
 document.getElementById("quiz").classList.toggle("hide",n!==2);
 t1.classList.toggle("on",n===1);t2.classList.toggle("on",n===2);
 if(n===2&&!started){started=true;init(QUESTIONS,false)}
 window.scrollTo({top:0})}
