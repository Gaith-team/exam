<header><h1>PRETERM LABOUR (P.T.L.)</h1><p>طب النساء والتوليد – GHAITH TEAM</p>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">📖 المحاضرة</button><button id="t2" onclick="tab(2)">📝 أسئلة عالمحاضرة</button></div></header>

<script>
const S=[
["PRETERM LABOUR (P.T.L.)",[
["Preterm labour is the major cause of perinatal morbidity and mortality.","الولادة المبكرة هي أكبر سبب لمرض وموت الأجنة والمواليد حوالين الولادة.","يعني أغلب مشاكل وموت الأطفال حوالين الولادة سببها إن الطفل اتولد بدري قبل ما يكمل."],
["Definition: Onset of labour after fetal viability and before 37 weeks.","التعريف: بداية الطلق بعد ما الجنين يبقى قادر يعيش برة الرحم وقبل أسبوع 37.","لازم الاتنين: الجنين قادر يعيش (يعني مش إجهاض) + لسه ماكملش 37 أسبوع. لو بعد 37 يبقى ولادة عادية."],
["Incidence: 5 – 10% of all pregnancy.","نسبة الحدوث: من 5 لـ 10% من كل الحمل.","يعني من كل 100 حامل، حوالي 5 لـ 10 منهم بيولدوا بدري."]]],
["Causes",[
["I- In about 50% of cases → no apparent cause.","أولاً: في حوالي 50% من الحالات مفيش سبب واضح.","يعني نص الحالات الدكتور مش لاقي سبب، فمنقدرش نمنعها."]]],
["II- Historical factors",[
["1- Previous 2 or more 1st trimester abortion or one mid trimester abortion.","إجهاض سابق مرتين أو أكتر في أول 3 شهور، أو إجهاض واحد في التلت الأوسط.","الرحم اللي اتعرض لإجهاضات قبل كده يبقى أضعف وأكتر عرضة للولادة بدري."],
["2- Previous P.T.L.","ولادة مبكرة سابقة.","اللي ولدت بدري قبل كده احتمال تكرر معاها تاني كبير."],
["3- Previous cervical surgery.","عملية سابقة في عنق الرحم.","العملية بتضعف عنق الرحم فمش بيقدر يمسك الجنين لحد آخر الحمل."]]],
["III- Social factors",[
["1- Low socioeconomic state.","مستوى اجتماعي واقتصادي منخفض.","تغذية وصحة أقل ورعاية أقل، فاحتمال الولادة المبكرة بيزيد."],
["2- Young (< 20 years old) or elderly (> 35 years) pregnant.","حامل صغيرة (أقل من 20 سنة) أو كبيرة (أكتر من 35 سنة).","السن الصغير والكبير الاتنين أبعد عن السن المثالي للحمل."],
["3- Smoking.","التدخين.","النيكوتين بيقلل الدم الواصل للجنين ويحفز الولادة بدري."],
["4- Lack of A.N.C.","عدم المتابعة أثناء الحمل.","من غير متابعة مفيش حد بيكتشف المشاكل بدري ويعالجها."]]],
["IV- Maternal factors",[
["1- Medical disorders with pregnancy: e.g. D.M., cardiac disease, renal disease, anemia.","أمراض عامة مع الحمل: السكر، القلب، الكلى، الأنيميا.","أي مرض عند الأم بيجهد الجسم ويأثر على الحمل فممكن يتولد بدري."],
["2- Local obstetric disorders with pregnancy: e.g. A.P.H., PIH, cervical incompetence, fibroid with pregnancy, congenital anomalies of uterus.","مشاكل توليد موضعية: نزيف قبل الولادة، ارتفاع ضغط الحمل، ضعف عنق الرحم، ورم ليفي، تشوهات خلقية في الرحم.","دي مشاكل في الرحم نفسه أو الحمل نفسه، زي رحم متشوه أو عنق مش ماسك أو ورم واخد مكان الجنين."]]],
["V- Fetal factors",[
["1- Congenital anomalies.","تشوهات خلقية في الجنين.","الجنين المتشوه ساعات بيتولد بدري."],
["2- Polyhydramnios.","زيادة السائل الأمنيوسي.","الرحم بيتمدد زيادة عن اللازم فبيبدأ ينقبض بدري."],
["3- Multiple pregnancy.","حمل متعدد (توأم).","الرحم بيتمدد أكتر من الطبيعي فبيتولدوا بدري."],
["4- IUFD.","موت الجنين داخل الرحم.","الجنين الميت بيحفز الرحم يطرده."],
["5- PROM.","انفجار المية قبل الطلق.","كيس المية بيتفتح فبيبدأ الطلق وتزيد العدوى."]]],
["VI- Iatrogenic",[
["1- Premature induction of labour e.g. in eclampsia.","تحفيز الولادة بدري، مثلاً في التسمم الحملي.","الدكتور بيولّد الأم بدري عشان ينقذها، فالطفل بيتولد مبكر."],
["2- External cephalic version.","قلب الجنين من برة (ECV).","الحركة دي ممكن تحفز الرحم وتبدأ الطلق."],
["3- Amniocentesis.","سحب عينة من السائل الأمنيوسي.","الإبرة ممكن تهيج الرحم أو تسبب تسريب المية."]]],
["Complications: Mostly fetal hazards",[
["Mostly fetal hazards:","المضاعفات أغلبها خطر على الجنين.","الأم غالباً بخير، المشكلة في الطفل الناقص النمو."],
["1- Intracranial hemorrhage (I.C.H.) due to: ↑ capillary fragility, weak skull bones, hypoprothrombinemia.","نزيف في المخ بسبب: هشاشة الشعيرات، عظام الجمجمة ضعيفة، نقص البروثرومبين.","الشعيرات رفيعة وبتتقطع بسهولة، والجمجمة ضعيفة، والدم مبيتجلطش كويس، فأي ضغط وقت الولادة يسبب نزيف."],
["2- Respiratory problems: Atelectasis, RDS.","مشاكل في التنفس: انخماص الرئة، وضيق التنفس (RDS).","الرئة لسه مكملتش ومفيهاش السيرفاكتانت اللي بيخلي الحويصلات مفتوحة."],
["3- Metabolic disorders: hypothermia, hypoglycemia, ↓ hepatic function → neonatal jaundice, ↓ haemopoiesis → neonatal anemia.","اضطرابات الأيض: برودة الجسم، نقص السكر، ضعف الكبد فيحصل صفرة، وضعف تكوين الدم فيحصل أنيميا.","الطفل مفيهوش دهون تدفيه ولا مخزون سكر، والكبد ونخاع العظم لسه ضعاف."],
["4- Infection: ↑ liability due to immature immune system.","العدوى: احتمالها أعلى لأن المناعة لسه مش مكتملة.","جهاز المناعة لسه بيتكون فمبيعرفش يحارب الميكروبات."],
["5- Long term effects. Impaired mental development.","تأثيرات على المدى البعيد: ضعف النمو العقلي.","ممكن النزيف ونقص الأكسجين يأثروا على المخ ويأخروا التطور."]]],
["Diagnosis",[
["[A] Pt. at risk and prediction of PTL: 1- Patient who has one or more P.F. (mention?). 2- Best predictor is bad obstetric history.","التنبؤ بالمعرضة للخطر: 1- أي حامل عندها عامل أو أكتر من العوامل المسببة (اذكرها). 2- أفضل مؤشر هو التاريخ التوليدي السيئ.","يعني اللي ولدت بدري أو أجهضت قبل كده هي أكتر واحدة محتمل تتكرر معاها."],
["[B] Detection of early signs of PTL (threatened PTL): 1- Regular contractions more frequent e.g. one contraction/15 min. for at least 1 hr.","اكتشاف العلامات المبكرة (تهديد بالولادة المبكرة): 1- انقباضات منتظمة وكتيرة، مثلاً انقباضة كل 15 دقيقة لمدة ساعة على الأقل.","لو الانقباضات منتظمة ومستمرة ساعة، مش مجرد انقباضات عادية."],
["2- Abdominal or menstrual like cramps.","مغص في البطن أو زي مغص الدورة.","إحساس زي ألم الدورة الشهرية."],
["3- Intermittent pelvic pressure.","إحساس بضغط في الحوض بيجي ويروح.","كأن الجنين بينزل ويضغط على الحوض."],
["4- Intermittent low backache.","وجع في أسفل الضهر بيجي ويروح.","الوجع مع الانقباضات بيحس بيه في الضهر."],
["5- Change of character of vaginal discharge → bloody.","تغير شكل الإفرازات المهبلية لدموية.","نزول مخاط فيه دم علامة إن العنق بدأ يتفتح."],
["6- The cx changes: soft, effaced, central, < 4 cm in dilatation.","تغيرات عنق الرحم: ناعم، ممحي، في النص، واتساع أقل من 4 سم.","العنق بدأ يلين ويقصر بس لسه متفتحش كتير، فلسه نقدر نوقف الولادة."],
["[C] Detection of established PTL: Enumerate criteria of true labour pain.","اكتشاف الولادة المبكرة المؤكدة: اذكر علامات الطلق الحقيقي.","هنا بنطبق نفس علامات الطلق الحقيقي بس قبل 37 أسبوع."],
["N.B. (uterine contraction are suggestive, but progressive cx. dilatation is diagnostic).","ملحوظة: الانقباضات بتوحي بس، لكن اتساع عنق الرحم المتدرج هو اللي بيأكد التشخيص.","الانقباضات ممكن تبقى كاذبة، لكن لو العنق بيتفتح أكتر مع الوقت يبقى طلق فعلاً."],
["[D] C/P of preterm baby: red skin, less than 2.5 Kg., no vernix, weak cry.","شكل الطفل المبتسر: جلد أحمر، وزنه أقل من 2.5 كجم، مفيش طبقة الفيرنكس، وصوت عياطه ضعيف.","الطفل بيبقى صغير وأحمر ومحدش عليه الطبقة البيضا، وصوته واطي لأن عضلاته ضعيفة."]]],
["ttt of PTL",[
["ttt of PTL has four parts: Detection and ttt of pt. at risk (prophylactic ttt) – ttt of threatened PTL – ttt of established PTL – Management of PT. baby.","علاج الولادة المبكرة 4 أجزاء: اكتشاف وعلاج المعرضة للخطر (وقائي) – علاج التهديد بالولادة المبكرة – علاج الولادة المبكرة المؤكدة – رعاية الطفل المبتسر.","الترتيب: قبل ما تحصل، لو بتهدد، لو حصلت فعلاً، وبعد ما الطفل ينزل."]]],
["[A] Detection & ttt of Pt. at risk (Prophylactic ttt)",[
["1- ttt of P.F. & cause of PTL.","علاج العوامل والأسباب المؤدية للولادة المبكرة.","زي ما تعالج السكر أو الأنيميا أو الالتهاب قبل ما يسببوا مشكلة."],
["2- Detection of pt. at risk.","اكتشاف الحالة المعرضة للخطر.","بنحدد مين اللي أكتر عرضة ونتابعها عن قرب."]]],
["[B] ttt of threatened PTL",[
["1- Bed rest.","راحة تامة في السرير.","بيقلل الضغط على عنق الرحم وبيهدي الانقباضات."],
["2- Tocolytic drugs.","أدوية وقف الانقباضات.","أدوية بتريّح عضلة الرحم عشان توقف الطلق."]]],
["[C] ttt of established PTL",[
["- Place: hospitalization.","المكان: تتحجز في المستشفى.","الولادة المبكرة محتاجة رعاية وحضانة جاهزة."],
["- Conduct of delivery, 1st stage: no heavy sedation, vit K.","إدارة الولادة، المرحلة الأولى: من غير مهدئات تقيلة، وإدي فيتامين K.","المهدئات بتضعف تنفس الطفل المبتسر، وفيتامين K بيمنع النزيف في المخ."],
["- 2nd stage: episiotomy is a must.","المرحلة التانية: لازم قطع الفرج (Episiotomy).","بنوسّع المخرج عشان رأس الطفل الهشة متتضغطش وتنزل بسهولة."]]],
["[D] ttt of preterm infant = Incubator",[
["a- (O2) not more than 30%.","الأكسجين مايزيدش عن 30%.","الأكسجين الزيادة ممكن يضر عين الطفل ورئته."],
["b- Keep warmth at 37°C.","حافظ على الدفا عند 37 درجة.","الطفل بيفقد حرارته بسرعة فبنمنع البرودة."],
["c- Humidity 70 % or less.","الرطوبة 70% أو أقل.","بنحافظ على رطوبة مناسبة جوه الحضانة."],
["d- Prophylactic antibiotics.","مضادات حيوية وقائية.","عشان المناعة ضعيفة فبنمنع العدوى."],
["e- Start feeding early to avoid hypoglycemia. Either by breast feeding, artificial feeding, gastric tube.","ابدأ التغذية بدري عشان تمنع نقص السكر، يا إما رضاعة طبيعية، أو صناعية، أو أنبوبة المعدة.","الطفل مفيش عنده مخزون سكر فلازم ياكل بسرعة، ولو مش بيعرف يمص بنغذيه بالأنبوبة."]]],
["Tocolytic Drugs & Tocolysis",[
["Definition: Drugs used to stop or delay uterine contraction (uterine muscle relaxants).","التعريف: أدوية بتوقف أو تأخر انقباضات الرحم (مرخيات عضلة الرحم).","بتكسب وقت عشان نديّ الطفل حقن نضج الرئة أو ننقل الأم لمستشفى فيها حضانة."],
["Pre requisite use of tocolysis: 1- Cx. Dilatation < 4 cm.","شروط استخدام الـ Tocolysis: 1- اتساع العنق أقل من 4 سم.","لو العنق اتفتح أكتر، الولادة مبقتش هتتوقف."],
["2- No vaginal bleeding.","2- مفيش نزيف مهبلي.","الأدوية بتوسع الأوعية فتزود النزيف."],
["3- No IUFD.","3- مفيش موت جنين.","مفيش فايدة نوقف ولادة جنين ميت."],
["4- No IUGR.","4- مفيش تأخر نمو جنين.","الجنين الضعيف الأحسن يتولد ويتعالج برة الرحم."],
["5- No congenital anomalies.","5- مفيش تشوهات خلقية.","مش هنأخر ولادة جنين تشوهه مش بيتعالج."],
["6- No contraindications to tocolytic drugs.","6- مفيش موانع لاستخدام الأدوية دي.","لازم نتأكد إن الأم تستحمل الدوا."],
["N.B.: Pt. with APH are contraindicated because tocolytics → V.D.","ملحوظة: حالات النزيف قبل الولادة ممنوع معاها لأن الـ tocolytics بتسبب توسع الأوعية (V.D).","الدوا بيوسع الأوعية فالنزيف يزيد."]]],
["Members of Tocolytic Drugs",[
["A) β-adrenergic agonists: Selective β2-agonist e.g. ritodrine (Youtopar) and salbutamol.","أ) منبهات بيتا الأدرينالية: منبهات بيتا 2 الانتقائية زي ريتودرين (يوتوبار) وسالبيوتامول.","بتريّح عضلة الرحم زي ما بتريّح الشعب الهوائية."],
["* Dose: These drugs used by I V. drip method.","الجرعة: بتتدّي بالتنقيط في الوريد.","محلول بيتدّي ببطء في الوريد."],
["* Side effects, (A) maternal: 1- C.V.S.: tachycardia, hypotension, arrhythmias.","الأعراض الجانبية للأم: 1- القلب: سرعة نبض، هبوط ضغط، اضطراب نبض.","الدوا بينبه القلب وبيوسع الأوعية."],
["2- Fluid overload and pulmonary oedema.","2- احتباس سوائل وتورم في الرئة.","السوائل بتزيد فتتجمع في الرئة."],
["3- Hyperglycemia and hypokalemia.","3- ارتفاع السكر ونقص البوتاسيوم.","الدوا بيطلع السكر ويدخل البوتاسيوم في الخلايا."],
["B) Fetal: 1- Hypotension and fetal death. 2- Fetal ileus. 3- Fetal hypoglycemia.","للجنين: 1- هبوط ضغط وممكن موت الجنين. 2- شلل أمعاء. 3- نقص سكر.","الدوا بيعدي للجنين وبيأثر عليه."],
["(B) PG. synthetase inhibitor: These drugs are considered as tocolytic drugs.","ب) مثبطات البروستاجلاندين: بتتحسب من أدوية الـ tocolytics.","البروستاجلاندين بيحفز الرحم، فلما نوقفه الانقباض بيقف."],
["* Side effects (A) Maternal: 1- Peptic ulcer and G.I.T. bleeding. 2- Thrombocytopenia. 3- Allergic reaction.","للأم: 1- قرحة ونزيف في الجهاز الهضمي. 2- نقص الصفائح. 3- حساسية.","نفس مشاكل المسكنات زي الأسبرين."],
["(B) Fetal: 1- Pulmonary hypertension secondary to premature closure of the ductus arteriosus with use of endomethacin. 2- Intraventricular hemorrhage. 3- Necrotizing enterocolitis.","للجنين: 1- ضغط عالي في الرئة بسبب قفل القناة الشريانية بدري مع الإندوميثاسين. 2- نزيف داخل بطينات المخ. 3- التهاب الأمعاء النخرّي.","القناة دي لازم تفضل مفتوحة قبل الولادة، فقفلها بدري بيضر الدورة الدموية."],
["(C) Calcium-channel blockers: (Nifidipine). These are effective drugs in ↓ uterine contraction and the obvious side effect is maternal hypotension.","ج) حاصرات قنوات الكالسيوم (نيفيديبين): فعالة في تقليل الانقباضات، وأوضح عرض جانبي هبوط ضغط الأم.","الكالسيوم بيخلي العضلة تنقبض، فلما نحصره الرحم يرتاح."],
["(D) Magnesium Sulphate.","د) كبريتات الماغنسيوم.","من الأدوية المستخدمة كمرخي للرحم."],
["(E) Progesterone.","هـ) البروجسترون.","هرمون الحمل اللي بيهدي الرحم."],
["(F) Aminophylline.","و) أمينوفيللين.","دوا بيرخي العضلات الملساء."],
["(G) Oxytocin antagonist: Atosiban.","ز) مضاد الأوكسيتوسين: أتوسيبان.","الأوكسيتوسين هو اللي بيقبّض الرحم، فلما نضاده الانقباض يقل."],

const TF=['True','False'];

const Q=[

M("Incidence of preterm labour is about:",["1–2%","5–10%","20–25%","40%"],1,"5–10% of all pregnancies."),
M("The best predictor of preterm labour is:",["Smoking","Bad obstetric history","Age","Anemia"],1,"Bad obstetric history is the best predictor."),

let qs,i,c,done;
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const qz=document.getElementById('quiz');
function start(){qs=sh([...Q.slice(0,10)]).concat(sh([...Q.slice(10)]));i=0;c=0;show()}
function show(){const q=qs[i];done=false;
qz.innerHTML=`<div class="meta"><span>Question ${i+1} / ${qs.length}</span><span>✔ ${c}</span></div><div class="bar"><i style="width:${i/qs.length*100}%"></i></div><div class="q"><div class="qt">${q.t}</div>${q.o.map((o,k)=>`<button class="o" onclick="pick(${k})">${o}</button>`).join('')}<div id="fb"></div></div>`}
function pick(k){if(done)return;done=true;const q=qs[i],b=qz.querySelectorAll('.o');
b.forEach((e,x)=>{if(x==q.a)e.classList.add('ok');else if(x==k)e.classList.add('no')});

function nx(){i++;i<qs.length?show():fin()}
