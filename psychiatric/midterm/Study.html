<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Psychiatric Nursing</title>
<style>
:root{--p:#7c3aed;--p2:#a78bfa;--bg:#f5f0ff;--card:#fff;--tx:#241b3a;--mu:#6b6285;--ln:#e7defa;--ok:#10b981;--no:#ef4444;--am:#f59e0b;--tl:#14b8a6;--pk:#ec4899}
@media(prefers-color-scheme:dark){:root{--bg:#150f26;--card:#201838;--tx:#f1ebff;--mu:#a99fc7;--ln:#3a2d63}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.28;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--p);top:-80px;right:-80px}.b2{width:300px;height:300px;background:var(--tl);bottom:-60px;left:-60px;animation-delay:-5s}.b3{width:220px;height:220px;background:var(--pk);top:45%;left:35%;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-30px) scale(1.15)}}
#bar{position:fixed;top:0;right:0;height:4px;width:0;background:linear-gradient(90deg,var(--p),var(--pk),var(--am));z-index:20;transition:width .4s}
header{text-align:center;padding:48px 16px 24px}
header h1{margin:0;font-size:clamp(1.7rem,5vw,2.8rem);background:linear-gradient(90deg,var(--p),var(--pk),var(--tl));-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:var(--mu);margin:8px 0}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--p);color:#fff;font-size:.85rem;animation:pu 2.5s infinite}

nav{position:sticky;top:4px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;margin:0 8px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-radius:16px;border:1px solid var(--ln);scrollbar-width:thin}
nav a{flex:none;text-decoration:none;color:var(--tx);font-size:.82rem;padding:5px 11px;border-radius:99px;border:1px solid var(--ln);transition:.25s}
nav a:hover,nav a.on{background:var(--p);color:#fff;transform:translateY(-2px)}
main{max-width:900px;margin:0 auto;padding:16px}
section{background:var(--card);border-radius:22px;padding:20px;margin:22px 0;border:1px solid var(--ln);border-top:6px solid var(--c);box-shadow:0 8px 28px #7c3aed14;opacity:0;transform:translateY(26px);transition:.7s}
section.in{opacity:1;transform:none}
section h2{margin:0 0 10px;display:flex;align-items:center;gap:10px;font-size:1.3rem}
.ic{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--c);font-size:1.4rem;animation:bo 3s ease-in-out infinite}
@keyframes bo{50%{transform:translateY(-4px) rotate(-6deg)}}
.pt{padding:8px 12px;margin:6px 0;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,transparent);border-right:4px solid var(--c);transition:.25s}
.pt:hover{transform:translateX(-5px)}
h3{margin:18px 0 6px;font-size:1rem}
.tr{padding:9px 12px;margin:6px 0;border-radius:12px;background:#f59e0b1c;border:1px dashed var(--am);transition:.25s}
.tr::before{content:"⚠️ بصمجة غيث: ";font-weight:700;color:var(--am)}
.tr:hover{background:#f59e0b33;transform:scale(1.01)}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--ln)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th{background:var(--c);color:#fff;padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--ln);text-align:center}
tr:hover td{background:color-mix(in srgb,var(--c) 9%,transparent)}
td:first-child{font-weight:700;color:var(--c)}
.fcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.fc{perspective:700px;height:140px;cursor:pointer}
.fi{position:relative;height:100%;transition:transform .6s;transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;text-align:center;padding:10px;font-size:.88rem}
.fa{background:var(--c);color:#fff;font-weight:700;font-size:1.05rem}
.fb{transform:rotateY(180deg);background:var(--card);border:2px solid var(--c)}
.dn{margin-top:14px;border:0;padding:8px 18px;border-radius:99px;background:var(--ln);color:var(--tx);cursor:pointer;font:inherit;transition:.3s}
.dn.ok{background:var(--ok);color:#fff}
.q{margin:16px 0;padding:14px;border-radius:16px;border:1px solid var(--ln)}
.o{display:block;width:100%;text-align:right;margin:6px 0;padding:9px 12px;border-radius:12px;border:2px solid var(--ln);background:transparent;color:var(--tx);font:inherit;cursor:pointer;transition:.2s}
.o:hover:not(:disabled){border-color:var(--p);transform:translateX(-4px)}
.o.r{background:#10b98126;border-color:var(--ok);animation:pu2 .5s}.o.w{background:#ef444422;border-color:var(--no);animation:sh .4s}
@keyframes sh{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}@keyframes pu2{50%{transform:scale(1.03)}}
.mq{margin-top:16px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--c) 8%,transparent)}.mq .q{direction:ltr;text-align:left;background:var(--card)}.mq .o{text-align:left}.mq h3{direction:rtl}.ex{display:none;margin-top:6px;color:var(--mu);font-size:.88rem}
#sc{position:sticky;bottom:10px;text-align:center;padding:10px;border-radius:99px;background:var(--p);color:#fff;font-weight:700;margin-top:14px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
