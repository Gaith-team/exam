<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#7c3aed;--teal-d:#6d28d9;--blue:#eef2f7;--bd:#d9e0ea;--ok:#16a34a;--no:#dc2626;--rev:#2563eb;--txt:#1a2332;--grad:linear-gradient(135deg,#6d28d9,#7c3aed 60%,#8b5cf6)}
body{font-family:'Outfit',Arial,sans-serif;background:#f8fafc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
.shf{position:absolute;left:90px;top:9px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#475569;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#1a2332;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#f97316}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef2f7}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #1a2332;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef2f7;border-top:1px solid #d9e0ea;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}.shf{left:12px}}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/psychiatric/index.html">← رجوع</a><button class="shf" onclick="randomizeQuestions()">🔀 عشوائي</button>Psychiatric Nursing<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="resetQ()">Reset</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Sadness that is directly attributable to a specific loss and disappears with time is called:",o:["Endogenous depression","Reactive (secondary) depression","Dysthymia","Seasonal depression"],a:1},
{t:"Bipolar disorder was previously known as:",o:["Dysthymia","Unipolar depression","Manic depression","Cyclothymia"],a:2},
{t:"Which of the following is a principle of psychiatric nursing?",o:["Accept the patient exactly as he is","Judge the patient's behavior as right or wrong","Punish undesirable behavior","Argue directly with psychotic ideas"],a:0},
{t:"A 6-year-old girl dresses up in her mother's dress and high-heeled shoes. This defense mechanism is:",o:["Displacement","Regression","Undoing","Identification"],a:3},
{t:"The four levels of anxiety are:",o:["Mild, moderate, severe, panic","Mild, moderate, severe, profound","Low, moderate, high, panic","Normal, mild, severe, panic"],a:0},
{t:"The most common sleep disorder is:",o:["Narcolepsy","Insomnia","Sleep paralysis","Restless legs syndrome"],a:1},
{t:"A community mental health center (CMHC) is characterized by:",o:["Long-term institutionalization","A single-discipline team","A multidisciplinary team and continuity of care","Avoiding prevention programs"],a:2},
{t:"Mental retardation requires an IQ of approximately:",o:["100 or below","90 or below","80 or below","70 or below"],a:3},
{t:"Seclusion and restraint are regarded as:",o:["First-line measures","A form of punishment","A convenience for staff","Last-resort measures"],a:3},
{t:"Benzodiazepines act by enhancing the action of:",o:["Serotonin","GABA","Dopamine","Norepinephrine"],a:1},
{t:"Which of the following is an SSRI?",o:["Imipramine","Phenelzine","Fluoxetine","Bupropion"],a:2},
{t:"The therapeutic serum lithium level is:",o:["0.6–1.2 mEq/L","1.5–2.5 mEq/L","2.5–3.5 mEq/L","Above 3.5 mEq/L"],a:0},
{t:"Electroconvulsive therapy (ECT) is given under:",o:["Local anesthesia only","No anesthesia","General anesthesia with a muscle relaxant","Oral sedation only"],a:2},
/* Medium */
{t:"Beck's cognitive triad consists of a negative view of:",o:["Self, family, and work","Past, present, and future","Mother, father, and self","Self, world, and future"],a:3},
{t:"A manic episode must last at least:",o:["4 days","1 week","2 weeks","1 month"],a:1},
{t:"Which of the following increases a psychiatric patient's anxiety?",o:["Placing demands on him that he cannot meet","Explaining routines at his level of understanding","Accepting his silence and presence","Keeping a consistent routine"],a:0},
{t:"Miss Layla unconsciously hates her mother but keeps telling the staff how wonderful her mother is. This is:",o:["Sublimation","Denial","Reaction formation","Projection"],a:2},
{t:"DSM-5 diagnosis of GAD requires excessive anxiety on more days than not for at least:",o:["1 month","2 weeks","3 months","6 months"],a:3},
{t:"A complete sleep cycle (NREM + REM) lasts about:",o:["30–45 minutes","60 minutes","3 hours","90–110 minutes"],a:3},
{t:"Patients who can keep emotional equilibrium in hospital but not at home are best placed in a:",o:["Night hospital","Halfway house","Foster home","Out-patient clinic"],a:1},
{t:"Moderate mental retardation corresponds to an IQ of:",o:["35–49","50–70","20–34","Below 20"],a:0},
{t:"When applying physical restraint, the patient should be positioned:",o:["Prone (face down)","Supine (on the back)","Sitting upright","Standing against the wall"],a:1},
{t:"Compared with benzodiazepines, buspirone:",o:["Is fast acting and sedative","Acts directly on GABA receptors","Has a very high dependence risk","Has no sedation and needs 4–6 weeks for maximum effect"],a:3},
{t:"A patient on an MAOI is at greatest risk of hypertensive crisis after eating:",o:["Aged cheese","Boiled rice","Fresh cucumber","A plain boiled egg"],a:0},
{t:"Lithium causes polyuria because it:",o:["Increases aldosterone secretion","Blocks the effect of ADH","Stimulates the thirst center","Irritates the bladder"],a:1},
{t:"Which drug is given before ECT to minimize secretions?",o:["Atropine","Haloperidol","Diazepam","Lithium"],a:0},
/* Hard */
{t:"A depressed patient is at greater risk of suicide when:",o:["He has just been admitted","Treatment progresses and his energy level increases","His appetite decreases","He is surrounded by staff"],a:1},
{t:"Which statement correctly differentiates hypomania from mania?",o:["Hypomania requires hospitalization","Delusions may be present in hypomania","Hypomania lasts at least 4 days, with no delusions and no marked impairment","Hypomania causes marked occupational impairment"],a:2},
{t:"A patient has abrupt episodes of intense fear peaking within minutes, with palpitations and fear of dying, followed by 1 month of worry about further attacks. The diagnosis is:",o:["Generalized anxiety disorder","Post-traumatic stress disorder","Social anxiety disorder","Panic disorder"],a:3},
{t:"Sudden loss of muscle tone triggered by strong emotion in narcolepsy is called:",o:["Sleep paralysis","Hypnopompic hallucination","Cataplexy","Night terror"],a:2},
{t:"The usual number of trained staff needed to apply physical restraint is:",o:["4–5","1–2","2–3","10"],a:0},
{t:"Which statement about beta blockers in anxiety is correct?",o:["They relieve worry and are ideal for GAD","They relieve physical symptoms, help in social phobia and are contraindicated in asthma","They are controlled substances","They act on GABA receptors"],a:1},
{t:"The minimum interval between stopping an SSRI and starting an MAOI is:",o:["24 hours","1 week","2 weeks","5 weeks"],a:3},
{t:"Hemodialysis is indicated in severe lithium toxicity when the level exceeds:",o:["3 mEq/L","1.5 mEq/L","1.2 mEq/L","0.6 mEq/L"],a:0},
{t:"Which of the following is a contraindication to ECT?",o:["Treatment-resistant depression","Catatonia","Brain tumor","Severe depression with suicidal ideation"],a:2},
{t:"Anhedonia means loss of the sense of pleasure from activities once enjoyed.",o:["True","False"],a:0},
{t:"Hypomania usually requires hospitalization.",o:["True","False"],a:1},
{t:"During REM sleep the brain is active and dreams occur.",o:["True","False"],a:0},
{t:"There is a cure for mental retardation once it has occurred.",o:["True","False"],a:1},
{t:"Seclusion and restraint may be used to compensate for a shortage of staff.",o:["True","False"],a:1},
{t:"Consistency in staff attitude and ward routine reduces the patient's anxiety.",o:["True","False"],a:0},
{t:"Psychiatric units in general hospitals increase the stigma of mental illness.",o:["True","False"],a:1},
{t:"Anxiety disorders are more common in women than in men.",o:["True","False"],a:0},
{t:"Benzodiazepines should be discontinued gradually.",o:["True","False"],a:0},
{t:"Nightmares generally occur in the first half of the major sleep episode.",o:["True","False"],a:1},
{t:"Suppression is a voluntary, conscious process, whereas repression is unconscious.",o:["True","False"],a:0},
{t:"TCAs are considered first-line therapy for depression because they are safer than SSRIs.",o:["True","False"],a:1},
{t:"A decrease in salt intake increases lithium levels in the blood.",o:["True","False"],a:0},
{t:"Diuretics decrease the lithium level in the blood.",o:["True","False"],a:1},
{t:"The patient should be NPO for 6–8 hours before ECT to prevent aspiration.",o:["True","False"],a:0}
];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
function randomizeQuestions(){if(confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟'))init(QUESTIONS)}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();} else refresh(); }
function saveNext(){ if(sel[cur]!==null) saved[cur]=true; else saved[cur]=false; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function resetQ(){ sel[cur]=null; saved[cur]=false; review[cur]=false; render(); }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
