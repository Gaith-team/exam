<script>
const FC=[
["Depression","Define mood disorders and classify them.","<ul><li>Mental condition primarily affecting emotional state: persistent, intense sadness or elation; impairs functioning.</li><li><b>Depressive:</b> Major depressive disorder, Dysthymia.</li><li><b>Bipolar:</b> Bipolar I, Bipolar II, Cyclothymic disorder.</li></ul>"],
["Depression","Explain the biological theories of depression.","<ul><li><b>Genetic:</b> up to 25% have a first-degree relative with mood disorder; identical twin risk about 50%.</li><li><b>Neurotransmitter:</b> deficiency or deregulation of norepinephrine, serotonin, dopamine.</li><li><b>Endocrine:</b> HPA axis hyperactivity, increased cortisol, decreased TSH, GH, melatonin.</li><li><b>Brain anatomy:</b> atrophy or neuron loss in frontal lobe, cerebellum, basal ganglia; low BDNF.</li></ul>"],
["Depression","Explain the psychological theories of depression.","<ul><li><b>Psychoanalytic:</b> loss, harsh punitive superego, aggression turned inward.</li><li><b>Cognitive (Beck):</b> negative view of self, world and future.</li><li><b>Learned helplessness:</b> believes responses cannot change negative outcomes.</li></ul>"],
["Depression","Mention the vegetative signs and mental status findings in depression.","<ul><li><b>Vegetative:</b> loss of libido, weight loss/anorexia or weight gain/hyperphagia, low energy, abnormal menses, early morning awakening (terminal insomnia).</li><li><b>Appearance:</b> looks older/ill, slouched, poor eye contact, tearful, neglected hygiene.</li><li><b>Mood/affect:</b> sad, anhedonia, apathy.</li><li><b>Speech:</b> slow, low, monotonous, monosyllabic, delayed responses.</li><li><b>Thought:</b> negative ruminations about loss, guilt, suicide, death; psychomotor retardation is most common.</li></ul>"],
["Depression","Compare dysthymia with major depression.","<ul><li>Dysthymia: milder, chronic, about 1.5% of population, onset before 21, more common in women.</li><li>Patients rarely recognize it as illness, keep working; hospitalization only if suicidal.</li><li>MDD: severe, average onset 32 years, may have psychotic features, more disabling.</li></ul>"],
["Depression","Write nursing interventions for a depressed, socially withdrawn client.","<ul><li>Safety first: assess suicide risk, remove hazards, close observation.</li><li>Establish trust, accept client as is, spend time even without talking.</li><li>Encourage expression of feelings, recognize anxiety and teach deep breathing/relaxation.</li><li>Encourage group activities gradually; explore alternative social interaction.</li><li>Teach new coping and problem-solving skills; improve self-esteem.</li></ul>"],
["Bipolar","Differentiate mania from hypomania.","<ul><li><b>Mania:</b> marked impairment; delusions may be present; hospitalization needed.</li><li><b>Hypomania:</b> less severe, no marked impairment; delusions never present; hospitalization not indicated.</li></ul>"],
["Bipolar","Describe types of bipolar disorder.","<ul><li><b>Bipolar I:</b> manic or mixed episodes (mixed = manic + major depressive criteria nearly every day for 1 week).</li><li><b>Bipolar II:</b> hypomanic episodes alternating with major depression.</li><li><b>Cyclothymic:</b> at least 2 years (1 year in children) of hypomanic and mild depressive periods, no full episodes.</li></ul>"],
["Bipolar","List clinical manifestations of mania.","<ul><li>Euphoric, expansive, irritable mood; labile affect.</li><li>Decreased need for sleep; pressure of speech; flight of ideas; distractibility.</li><li>Increased goal-directed activity/psychomotor agitation; grandiosity.</li><li>Neglect of eating, drinking, hygiene; colorful bizarre dress and makeup.</li><li>Excessive spending, gambling, hypersexuality, impulsive behavior.</li></ul>"],
["Bipolar","Write nursing interventions for a manic client.","<ul><li>Firm, calm, neutral approach; avoid power struggles; consistent limits.</li><li>Short, concise statements; focus on feeling, not delusion content.</li><li>Low-stimulation environment; promote rest and 6–8 hours sleep.</li><li>Provide finger foods/high-calorie fluids; ensure hydration and hygiene.</li><li>Channel energy into non-competitive physical activity; protect from harm to self/others.</li><li>Avoid unnecessary delay of needs; watch for escape attempts.</li></ul>"],
["Bipolar","Mention treatment modalities of bipolar disorder.","<ul><li><b>Lithium:</b> acute mania, reduces suicide.</li><li><b>Anticonvulsants:</b> Depakote (mixed mania), Tegretol, Lamictal (prevents depressive recurrence).</li><li>Benzodiazepines for anxiety/agitation; antipsychotics as adjunct.</li><li>Psychotherapy: CBT, interpersonal and social rhythm therapy, family-focused therapy; ECT if severe.</li></ul>"],
["Principles","State the principles of psychiatric nursing.","<ul><li><b>Accept patient exactly as he is:</b> non-judgmental, non-punitive; recognize and reflect feelings; talk with purpose; listen; allow expression of strong feelings.</li><li><b>Self-understanding</b> of the nurse as a therapeutic tool.</li><li><b>Consistency:</b> staff attitude, approach, limits.</li><li>Allow patient to be sick as needed; sit beside him when he does not want to talk.</li><li>Avoid demands he cannot meet and direct contradiction of psychotic ideas.</li></ul>"],
["Defense","What are defense mechanisms? Mention the three patterns.","<ul><li>Automatic, mostly unconscious processes that reduce anxiety, resolve conflict, protect self-esteem and security; pathologic when overused.</li><li><b>Moving against:</b> aggression, projection, reaction formation.</li><li><b>Moving away:</b> denial, repression, rationalization.</li><li><b>Moving forward:</b> acceptance, substitution, sublimation.</li></ul>"],
["Defense","Differentiate repression from suppression; define regression.","<ul><li><b>Repression:</b> unconscious forgetting of painful experience (cannot recall fear after car accident).</li><li><b>Suppression:</b> voluntary, conscious push of unpleasant material to preconscious (I would rather not talk about it now).</li><li><b>Regression:</b> return to an earlier, more comfortable developmental level.</li></ul>"],
["Anxiety","Describe the levels of anxiety and the GAD criteria.","<ul><li>Levels: mild, moderate, severe, panic.</li><li>GAD: excessive, hard-to-control worry most days for at least 6 months, with 3 or more of: autonomic hyperactivity, muscle tension, poor concentration, headache/hyperventilation, fatigue, restlessness, sleep disturbance; significant distress or impairment.</li></ul>"],
["Anxiety","Define panic attack, OCD and phobia.","<ul><li><b>Panic attack:</b> abrupt surge of intense fear peaking within minutes with 4 or more symptoms (palpitations, sweating, trembling, dyspnea, chest pain, fear of dying/losing control, derealization). Disorder = followed by 1 month or more of worry or avoidance.</li><li><b>OCD:</b> obsessions (recurrent unwanted thoughts) and compulsions (repetitive acts to reduce them).</li><li><b>Phobia:</b> intense irrational fear of a specific object/situation (specific, social, agoraphobia).</li></ul>"],
["Anxiety","Nursing interventions for a client in a panic attack.","<ul><li>Stay with client; calm, non-threatening manner; reassure of safety.</li><li>Simple words, brief messages; low-stimuli environment.</li><li>Give tranquilizer as ordered.</li><li>After anxiety falls: explore reasons, encourage talking about it.</li><li>Teach early signs and relaxation, deep breathing, exercise, meditation.</li></ul>"],
["Sleep","Describe sleep stages and normal sleep need.","<ul><li><b>Non-REM</b> (3 stages; stage 3 deep sleep: tissue repair, immunity) and <b>REM</b> (dreams, rapid irregular breathing, begins about 90 min after onset).</li><li>Cycle every 90–110 min, 5–6 times per night.</li><li>Adults need 7–9 h; older adults 7–8 h; teens 8–10 h.</li></ul>"],
["Sleep","Insomnia: criteria, treatment, and nursing interventions.","<ul><li>At least 3 nights/week for 3 months despite adequate opportunity; not due to substances or another disorder.</li><li>Treatment: sleep hygiene, sedative-hypnotics, antidepressants, antihistamines.</li><li>Nursing: assess sleep habits, caffeine, alcohol; quiet, dark, secure environment; regular schedule; relaxation; limit naps.</li></ul>"],
["Community","Characteristics of a community mental health center (CMHC).","<ul><li>Responsible for a specific population sector; care close to patient; comprehensive services.</li><li>Multidisciplinary team (psychiatrist, psychologist, social worker, nurse, counselor).</li><li>Continuity of care; consumer participation; primary/secondary/tertiary prevention; avoid unnecessary hospitalization.</li></ul>"],
["Community","List components of a comprehensive CMHC.","<ul><li>Emergency crisis intervention; day treatment; night hospital; outpatient; inpatient.</li><li>Halfway houses; foster home/homeless services; CMHC; rehabilitation centers.</li><li>Partial hospitalization keeps family and community contact and improves group functioning.</li></ul>"],
["Intellectual disability","Classify intellectual disability by IQ and mention causes.","<ul><li>Mild 50–70 (mental age 5–8); Moderate 35–49; Severe 20–34; Profound below 20.</li><li>Causes: genetic (Down, fragile X), pregnancy problems, birth complications, infections (meningitis), head injury, malnutrition, lead, neglect; two-thirds unknown.</li></ul>"],
["Intellectual disability","Levels of prevention of intellectual disability.","<ul><li><b>Primary:</b> public awareness, prenatal nutrition and immunization, fetal screening, avoid alcohol/drugs in pregnancy, lead hazards.</li><li><b>Secondary:</b> early detection and treatment.</li><li><b>Tertiary:</b> training, education, self-care skills, counseling to maximize function.</li></ul>"],
["Restraint","Seclusion and restraint: indications, contraindication, nursing care.","<ul><li><b>Indications:</b> imminent harm to self/others, severe agitation unresponsive to de-escalation, preventing serious disruption.</li><li><b>Contraindication:</b> children up to 12 years.</li><li><b>Care:</b> least restrictive, respect dignity, monitor vital signs/mental status every 15 min, meet needs, remove ASAP, document.</li><li><b>Complications:</b> psychological trauma, injury, death (prone restraint), legal issues.</li></ul>"],
["Restraint","Alternatives to seclusion and restraint; limit-setting types.","<ul><li>Verbal redirection, verbal de-escalation, distraction, increased observation, quiet room, PRN medication.</li><li>Limit-setting: verbal, nonverbal, time out; be clear, consistent, respectful.</li></ul>"],
["Drugs","Benzodiazepines: mechanism, examples, patient education.","<ul><li>Enhance GABA: sedative, hypnotic, anxiolytic, anticonvulsant, muscle relaxant.</li><li>Short-acting: alprazolam, lorazepam, oxazepam. Long-acting: diazepam, clonazepam.</li><li>Education: take as prescribed, never stop abruptly, no alcohol, no driving, rise slowly.</li></ul>"],
["Drugs","Buspirone: mechanism and key points.","<ul><li>Partial agonist at serotonin receptors; no GABA effect; not CNS depressant; no sedation.</li><li>For GAD; useful when benzodiazepines contraindicated.</li><li>Lag time: relief in 7–10 days.</li><li>Avoid with MAOIs (hypertension), pregnancy, liver/renal impairment.</li></ul>"],
["Drugs","MAOIs: hypertensive crisis and serotonin syndrome.","<ul><li><b>Hypertensive crisis</b> from tyramine-rich foods or drugs: severe headache, palpitations, neck stiffness, nausea, sweating; stop drug, treat urgently.</li><li><b>Serotonin syndrome management:</b> stop offending drug, maintain vital functions, notify physician, treat symptoms (resolve within 24 h).</li><li>Wait at least 5 weeks after SSRI before starting MAOI.</li></ul>"],
["Drugs","Lithium: toxicity, monitoring, and nursing education.","<ul><li>Narrow therapeutic index; level above 1.5 mEq/L is toxic.</li><li>Level weekly until therapeutic, monthly, then every 3 months; blood drawn 8–12 h after last dose.</li><li>Toxicity causes: renal impairment, low sodium, diuretics, fluid loss, overdose; NSAIDs, caffeine raise levels.</li><li>Side effects: polyuria, thirst, tremor, GI upset; chronic: kidney changes, hypothyroidism/goiter.</li><li>Education: consistent salt intake, fluids 2500–3000 mL/day, same time daily, do not stop abruptly.</li></ul>"],
["ECT","ECT: definition, indications, contraindications.","<ul><li>Controlled brief electrical current through brain under general anesthesia and muscle relaxant to induce a seizure.</li><li><b>Indications:</b> severe depression (suicidal, psychotic, catatonia, refusing food), treatment-resistant depression, severe mania, catatonic schizophrenia.</li><li><b>Contraindications:</b> brain tumor, MI/heart failure, hypertension, retinal detachment, osteoporosis/fractures, pregnancy (1st and 3rd trimester).</li></ul>"],
["ECT","Nursing care before, during and after ECT.","<ul><li><b>Before:</b> informed consent, NPO 6–8 h, clean dry hair, remove pins/jewelry, void, baseline vitals.</li><li><b>During:</b> monitor vitals, SpO2, ECG/EEG; anesthetic (methohexital), atropine, succinylcholine; protect from injury.</li><li><b>After:</b> left lateral position, vitals every 15 min, clear secretions, analgesia, let sleep 30–60 min, reorient, offer drink, document.</li><li>Side effects: retrograde/anterograde amnesia, confusion, headache, transient arrhythmias.</li></ul>"]
,
["Depression","Differentiate mood from affect, and define grief.","<ul><li><b>Mood:</b> internal, subjective, pervasive, sustained emotion colouring perception of self and world (client says: I feel sad).</li><li><b>Affect:</b> outward, observable expression of emotion (flat face, monotone voice, smile while telling a sad story).</li><li><b>Grief:</b> normal response to real or perceived loss (relationship, health, status, security, a dream).</li></ul>"],
["Depression","Reactive versus endogenous depression.","<ul><li><b>Reactive (secondary):</b> sadness due to a clear cause such as loss; self-limiting, disappears with time or support.</li><li><b>Endogenous:</b> no obvious cause or life event; mainly biological and genetic.</li></ul>"],
["Depression","Postpartum depression: definition and risk factors.","<ul><li>More serious and persistent than baby blues; lasts weeks or months, develops slowly, can appear any time in the first year after birth.</li><li>Affects about 10–15% of women worldwide.</li><li>Risk: history of psychiatric disorder, interpersonal difficulties, stressful life events, prenatal anxiety.</li></ul>"],
["Depression","Treatment and management of depression.","<ul><li><b>Psychotherapy:</b> CBT, behavioral activation, problem-solving therapy, mindfulness-based cognitive therapy.</li><li><b>Antidepressants:</b> SSRIs, SNRIs, TCAs; take weeks to work.</li><li><b>ECT</b> for severe or resistant depression.</li><li><b>Lifestyle:</b> exercise, stress reduction, avoid alcohol and drugs, social support.</li></ul>"],
["Depression","Write nursing diagnoses commonly used for a depressed client.","<ul><li>Risk for suicide / self-directed violence.</li><li>Impaired social interaction.</li><li>Low self-esteem; hopelessness; powerlessness.</li><li>Ineffective coping.</li><li>Imbalanced nutrition: less than body requirements.</li><li>Disturbed sleep pattern; self-care deficit.</li></ul>"],
["Bipolar","Nursing diagnoses for a manic client.","<ul><li>Risk for injury / violence toward others.</li><li>Disturbed thought process.</li><li>Impaired social interaction.</li><li>Imbalanced nutrition: less than body requirements.</li><li>Insomnia / disturbed sleep pattern.</li><li>Noncompliance with treatment.</li></ul>"],
["Bipolar","Etiology of bipolar disorder.","<ul><li>Cause unknown; multifactorial.</li><li><b>Genetic:</b> strong family history.</li><li><b>Neurochemical:</b> dopamine (dopaminergic drugs can trigger mania), norepinephrine, serotonin.</li><li><b>Psychoanalytic:</b> punitive superego (anger turned inward) or overactive id.</li></ul>"],
["Principles","Explain consistency in psychiatric nursing and where it must operate.","<ul><li>Patient needs predictable, safe, stable environment.</li><li>Must operate in: attitude of the staff, daily routine, limits and rules, plan of care, and the nurse approach.</li><li>Inconsistency increases anxiety and allows manipulation.</li></ul>"],
["Defense","Define projection, displacement, rationalization, denial, sublimation and reaction formation with examples.","<ul><li><b>Projection:</b> blaming others for own faults or feelings (scapegoat).</li><li><b>Displacement:</b> shifting feeling to a safer target (angry at boss, shouts at wife).</li><li><b>Rationalization:</b> logical excuses for unacceptable behavior (person with no children: it is a big responsibility).</li><li><b>Denial:</b> refusing to accept reality.</li><li><b>Sublimation:</b> channeling unacceptable impulses into acceptable activity.</li><li><b>Reaction formation:</b> behaving opposite to real feeling.</li></ul>"],
["Defense","Define identification, compensation and conscious/preconscious/unconscious.","<ul><li><b>Identification:</b> taking on qualities of a admired person.</li><li><b>Compensation:</b> making up for a real or imagined deficiency with specific behavior.</li><li><b>Conscious:</b> thoughts in immediate awareness. <b>Preconscious:</b> can be recalled when needed. <b>Unconscious:</b> memories and wishes not accessible to awareness.</li></ul>"],
["Anxiety","Risk factors and treatment of anxiety disorders.","<ul><li>Genetic and environmental mix; female sex; childhood trauma; stimulants (caffeine); medical illness.</li><li><b>Medication:</b> benzodiazepines, SSRIs/SNRIs, beta-blockers, low-dose antipsychotics.</li><li><b>Psychotherapy:</b> CBT, acceptance and commitment therapy.</li><li>Lifestyle: relaxation, exercise, limit caffeine, seek help after trauma.</li></ul>"],
["Anxiety","Nursing interventions for OCD and phobia.","<ul><li><b>OCD:</b> allow ritual initially, set limits gradually, provide time for rituals, encourage recognizing triggers, reward reduced ritual, teach thought stopping and relaxation.</li><li><b>Phobia:</b> accept fear, never force exposure, gradual desensitization, teach relaxation, encourage group participation.</li></ul>"],
["Sleep","Types of sleep disorders with key features.","<ul><li><b>Insomnia:</b> difficulty falling or staying asleep.</li><li><b>Hypersomnolence:</b> excessive sleepiness daily.</li><li><b>Narcolepsy:</b> sudden sleep attacks, cataplexy, ages 15–30; stimulants, antidepressants for cataplexy.</li><li><b>Obstructive sleep apnea:</b> loud snoring, obese; CPAP, weight loss.</li><li><b>Sleep terrors:</b> abrupt scream, intense fear, amnesia for the episode.</li><li><b>Sleepwalking:</b> first third of the night, children 6–12.</li><li><b>Nightmare disorder</b> in REM sleep; <b>REM behavior disorder</b>; <b>restless legs</b> relieved by movement.</li></ul>"],
["Sleep","Effects of insufficient sleep.","<ul><li>Fatigue, irritability, poor attention and accidents.</li><li>Mood and thinking impairment; depression and anxiety.</li><li>Hypertension, heart disease, obesity, type 2 diabetes, dementia.</li><li>Weakened immunity.</li></ul>"],
["Community","Day treatment, night hospital, halfway house, and foster home.","<ul><li><b>Day treatment:</b> patient attends program and lives at home.</li><li><b>Night hospital:</b> works in day, sleeps at hospital.</li><li><b>Halfway house:</b> patients stable in hospital but not yet at home; midway between sickness and health.</li><li><b>Foster home:</b> support after discharge and for elderly without family.</li><li>Advantages: continued family and community contact, better functioning.</li></ul>"],
["Intellectual disability","Characteristics of each level of intellectual disability.","<ul><li><b>Mild (50–70):</b> mental age 5–8; independent living with help in stress; academic skills possible.</li><li><b>Moderate (35–49):</b> partial self-help, simple speech, limited academics.</li><li><b>Severe (20–34):</b> slight speech, partial self-help with assistance, bonds with others.</li><li><b>Profound (below 20):</b> no independent functioning, cannot follow instructions.</li></ul>"],
["Intellectual disability","Early signs and nursing management of intellectual disability.","<ul><li><b>Early signs:</b> not responsive to contact, poor eye contact in feeding, low spontaneous activity, slow feeding, reduced response to sound.</li><li><b>Nursing:</b> teach self-care in small steps, repetition and rewards, safe environment, family education and counseling, treat associated ADHD or depression.</li></ul>"],
["Restraint","Characteristics of the seclusion room.","<ul><li>Communication possible when door locked; minimal furniture (bed, mattress, blanket).</li><li>No safety hazards or sharp objects; reinforced windows with natural light.</li><li>Externally controlled lighting and temperature; door opens outwards; visible clock.</li></ul>"],
["Restraint","Types of restraint and nurse role in seclusion.","<ul><li><b>Types:</b> physical, mechanical, chemical (e.g. haloperidol).</li><li>Explain reason, keep dignity, check vitals, mental status and comfort every 15 min; provide fluids, elimination and hygiene; remove at once when safe; document.</li></ul>"],
["Drugs","Compare benzodiazepines with antidepressants for anxiety.","<ul><li>Benzodiazepines: fast, short-term, tolerance and dependence risk.</li><li>Antidepressants (SSRIs/SNRIs): slower, long-term, no dependence; first-line for chronic anxiety and panic.</li><li>Beta-blockers: control physical symptoms (propranolol, atenolol).</li></ul>"],
["Drugs","SSRIs: examples, side effects, nursing points.","<ul><li>Examples: fluoxetine, sertraline, paroxetine, escitalopram, citalopram.</li><li>Side effects: sexual dysfunction (most common), nausea, headache, insomnia/sleepiness, weight gain.</li><li>Take at least 2 weeks to work, max effect 12 weeks or more; taper, never stop abruptly; monitor suicide risk early.</li><li>First-line due to safety.</li></ul>"],
["Drugs","TCAs and MAOIs: mechanism, side effects, contraindications.","<ul><li><b>TCAs:</b> block reuptake of norepinephrine and serotonin; side effects: anticholinergic (dry mouth, constipation), confusion especially elderly, dizziness, orthostatic hypotension.</li><li><b>MAOIs:</b> contraindicated with other antidepressants, pheochromocytoma, severe cardiovascular or cerebrovascular disease, liver/kidney failure, pregnancy.</li><li>Side effects: orthostatic hypotension, weight gain, insomnia, dry mouth, hypertensive crisis.</li></ul>"],
["Drugs","Role of the nurse in antidepressant therapy.","<ul><li>Assess history, mood, previous response; monitor suicidal ideation especially early in therapy.</li><li>Monitor therapeutic response and side effects; check vital signs.</li><li>Teach: delayed onset, take regularly, no abrupt stop, avoid alcohol, report side effects.</li></ul>"],
["Drugs","Uses and contraindications of lithium.","<ul><li><b>Uses:</b> acute mania, prevention of mood swings, bipolar depression, schizoaffective disorder, reduce impulsivity/aggression, reduces suicide risk, bulimia.</li><li><b>Contraindications:</b> allergy, pregnancy and lactation, dehydration or low sodium, severe heart disease, untreated hypothyroidism.</li></ul>"],
["ECT","Ethical considerations and side effects of ECT.","<ul><li><b>Ethics:</b> valid clinical reason, informed consent (purpose, risks, memory loss), autonomy (may refuse or withdraw), justice (equal access), never a punishment.</li><li><b>Side effects:</b> retrograde and anterograde amnesia, confusion (minutes to hours), headache, muscle pain, transient arrhythmias, hypertension, apnea.</li></ul>"],
["ECT","ECT procedure: dose, number of sessions, electrode placement.","<ul><li>Usual dose 70–150 volts for 30–60 seconds; 4–12 treatments.</li><li>Bilateral (bitemporal) or unilateral (vertex and non-dominant temporal).</li><li>Muscle relaxant, anesthetic, atropine, preoxygenation; EEG and movement monitor seizure.</li></ul>"
]
];
const SIT=[
["Depression","Mr. Ahmed, 45, was admitted after losing his job. He sits slouched, avoids eye contact, answers in single words after long pauses, wakes at 4 a.m., has lost 6 kg and says life has no meaning.","a) Identify his symptoms. b) What is the nursing priority? c) Write 3 nursing diagnoses with interventions.","<ul><li><b>Symptoms:</b> psychomotor retardation, poor eye contact, monosyllabic speech, early morning awakening, weight loss, hopelessness.</li><li><b>Priority:</b> safety, assess suicidal ideation and plan; close observation; remove hazards.</li><li><b>Dx 1 Risk for self-harm:</b> direct questioning, contract for safety, observation.</li><li><b>Dx 2 Impaired social interaction:</b> accompany to groups gradually, accept him, praise participation.</li><li><b>Dx 3 Imbalanced nutrition:</b> small frequent meals, weigh weekly, monitor intake.</li><li>Encourage expression of feelings and teach coping skills.</li></ul>"],
["Bipolar","Mona, 30, is brought in wearing bright bizarre clothes and heavy makeup. She talks nonstop, jumps between topics, has slept 2 hours in 3 days, refuses food and says she is a famous singer.","a) Diagnosis and supporting data. b) Nursing interventions. c) Drug of choice and its monitoring.","<ul><li><b>Manic episode:</b> pressure of speech, flight of ideas, decreased need for sleep, grandiosity, neglected eating.</li><li>Calm firm approach, short statements, no power struggle, do not argue delusion.</li><li>Quiet low-stimulation room; promote sleep; finger foods and fluids.</li><li>Channel energy into non-competitive activity; consistent limits.</li><li><b>Lithium:</b> level monitoring (toxic above 1.5 mEq/L), fluids and salt intake, watch toxicity signs.</li></ul>"],
["Drugs","A patient on lithium has vomiting, diarrhea, coarse tremor, confusion and unsteady gait. Lithium level is 1.8 mEq/L.","What is happening and what do you do?","<ul><li><b>Lithium toxicity</b> (level above 1.5).</li><li>Withhold the dose, notify physician immediately.</li><li>Maintain vital signs, airway, fluids and electrolytes; monitor level and renal function.</li><li>Ask about causes: dehydration, low sodium, diuretics, NSAIDs, overdose.</li><li>Teach: consistent salt and fluid intake, avoid dehydration, report early signs.</li></ul>"],
["Drugs","A client on an MAOI eats aged cheese and soon develops severe occipital headache, palpitations, neck stiffness, sweating and BP 220/120.","Name the complication, manage it, and plan teaching.","<ul><li><b>Hypertensive crisis</b> (MAOI + tyramine).</li><li>Stop the drug, call physician, monitor BP and vital signs, give antihypertensive as ordered.</li><li>Teach: avoid tyramine foods (aged cheese, cured meats, fermented products), avoid interacting drugs, use short-acting antihypertensive as prescribed.</li><li>Do not combine with SSRIs/TCAs; wait 5 weeks after SSRI.</li></ul>"],
["Drugs","A depressed patient recently had a second antidepressant added. He is now agitated, sweating, tremulous, febrile and tachycardic.","What is the likely diagnosis and your management?","<ul><li><b>Serotonin syndrome.</b></li><li>Discontinue the offending drug immediately.</li><li>Maintain vital functions, cool and monitor, notify physician at once.</li><li>Treat symptoms; usually resolves within 24 h; physician switches antidepressant.</li></ul>"],
["Anxiety","A patient suddenly says: I cannot breathe, my heart is pounding, I think I am dying. He is sweating and trembling; episode peaks within minutes.","Identify the problem and write your immediate nursing actions.","<ul><li><b>Panic attack</b> (panic level anxiety).</li><li>Stay with him, calm voice, reassure safety.</li><li>Simple brief words; reduce stimuli; move to quiet area.</li><li>Medication as ordered; guide deep breathing.</li><li>Later: explore triggers, teach relaxation and recognition of early signs.</li></ul>"],
["Restraint","A patient shouts threats, throws chairs and approaches another patient with a raised fist. Verbal attempts have failed.","How do you manage? Include alternatives, use of seclusion/restraint, and documentation.","<ul><li>Safety first: call team, protect others, calm non-threatening stance.</li><li>Try verbal de-escalation, redirection, distraction, quiet room, PRN medication.</li><li>If imminent harm persists: seclusion/restraint as last resort with order.</li><li>Least restrictive, dignity, monitor vitals and mental status every 15 min, meet needs, remove as soon as safe.</li><li>Document reason, method, duration, monitoring and response; debrief.</li></ul>"],
["ECT","Mrs. Salma, 52, severely depressed and suicidal, refuses food, and failed two antidepressants. ECT is planned for tomorrow. She fears memory loss and death.","Explain the nurse role before, during and after ECT.","<ul><li>Explain procedure, obtain informed consent, address fears (memory loss usually improves over weeks to months).</li><li><b>Before:</b> NPO 6–8 h, clean dry hair, remove jewelry/pins, void, baseline vitals.</li><li><b>During:</b> monitor ECG, BP, SpO2; anesthetic, atropine, succinylcholine; protect from injury.</li><li><b>After:</b> left lateral position, vitals every 15 min, suction, analgesia, sleep 30–60 min, reorient, offer tea, document.</li></ul>"],
["Sleep","A 40-year-old nurse takes 2 hours to fall asleep, wakes often, uses coffee all day and naps in the afternoon. This has lasted 4 months.","Assess and plan nursing care.","<ul><li><b>Insomnia</b> (at least 3 nights/week, 3 months).</li><li>Assess sleep latency, awakenings, naps, caffeine, alcohol, meds.</li><li>Teach sleep hygiene: fixed schedule, no caffeine late, limit naps, quiet dark room, relaxation.</li><li>Medication only if ordered.</li></ul>"],
["Intellectual disability","A mother brings her 6-year-old with IQ 40, who needs help with dressing and speaks in short phrases. She asks how to help him and prevent this in her next child.","Classify the level, then give teaching on skills and prevention.","<ul><li><b>Moderate</b> intellectual disability (IQ 35–49).</li><li>Teach self-help: zipping, buttoning, brushing teeth, please and thank you; step-by-step, repetition, reward.</li><li>Use counseling and education services; support the family.</li><li><b>Primary prevention:</b> prenatal nutrition and immunization, screening, avoid alcohol/drugs, lead and infection prevention.</li></ul>"],
["Principles","A patient repeatedly tells each nurse that the others are bad and only you understand him, asks for extra attention and constant calls.","How do you respond? Mention the principles.","<ul><li>Manipulation/splitting: team communicates, same rules for all (consistency).</li><li>Set clear limits: I will give you the same care as my colleagues; I will check on you every hour.</li><li>Non-judgmental, no punishment; meet genuine needs.</li><li>Use self-awareness to avoid taking sides.</li></ul>"],
["Defense","Identify the defense mechanism: (1) A man cannot recall a car accident he was in. (2) A student says I would rather not talk about the exam now. (3) A 6-year-old starts wetting the bed after a sibling is born. (4) A man angry at his boss shouts at his wife.","Name each and define it.","<ul><li>(1) <b>Repression:</b> unconscious forgetting.</li><li>(2) <b>Suppression:</b> conscious, voluntary pushing away.</li><li>(3) <b>Regression:</b> return to earlier developmental level.</li><li>(4) <b>Displacement:</b> shifting feelings to a safer target.</li></ul>"],
["Depression","Hanan, 28, delivered 3 months ago. She cries daily, feels unable to care for her baby, feels guilty, sleeps poorly and has little appetite. She says the baby would be better without her.","a) Diagnosis and risk factors. b) Priority. c) Nursing interventions and family teaching.","<ul><li><b>Postpartum depression</b> (more serious and persistent than baby blues).</li><li>Risk factors: psychiatric history, interpersonal difficulties, life stress, prenatal anxiety.</li><li><b>Priority:</b> safety of mother and infant; assess suicidal and infanticidal thoughts.</li><li>Support, encourage expression of guilt, assist with infant care, link to treatment (CBT, antidepressants).</li><li>Educate family about illness, involve them, ensure rest and nutrition.</li></ul>"],
["Depression","A depressed patient has hallucinations of voices saying he is worthless and believes his body is rotting. He refuses food and drink.","Identify the type and the most suitable treatment.","<ul><li><b>Major depression with psychotic features</b> (depression-induced delusions and hallucinations).</li><li>Refusal of food and drink and psychosis are indications for <b>ECT</b>.</li><li>Maintain nutrition and hydration, safety, observation, antidepressant plus antipsychotic as ordered.</li></ul>"],
["Bipolar","A manic patient is constantly interrupting group, flirting with others, giving away money, and gets angry when told no.","How will you apply limit setting?","<ul><li>State limits clearly, briefly and calmly; same for all staff.</li><li>Example: I cannot allow you to disturb the group; you may stay if you follow the rules; otherwise we will go to a quiet room.</li><li>Avoid arguing and power struggles; do not delay genuine needs; protect finances and others; reinforce acceptable behavior.</li></ul>"],
["Anxiety","A woman washes her hands 50 times a day, becomes very anxious if prevented, and spends 3 hours on rituals. She knows it is irrational.","Identify the disorder and write nursing care.","<ul><li><b>Obsessive-compulsive disorder.</b></li><li>Accept her; do not forbid ritual abruptly; give time for it initially, then reduce gradually.</li><li>Help identify situations that provoke obsessions; teach relaxation and thought stopping.</li><li>Reward progress; encourage activities; treat with SSRIs and CBT.</li></ul>"],
["Anxiety","A student refuses to leave home alone, avoids eating or speaking in public, and becomes tearful and sweaty when pushed.","Diagnosis and nursing plan.","<ul><li><b>Phobic disorder</b> (agoraphobia / social phobia).</li><li>Accept fear, do not force exposure; build trust.</li><li>Gradual desensitization with support; accompany to group activities.</li><li>Teach relaxation, breathing; encourage expressing feelings; medication as ordered.</li></ul>"],
["Sleep","A 25-year-old suddenly falls asleep in class and sometimes collapses when laughing.","Identify the disorder and treatment.","<ul><li><b>Narcolepsy</b> with cataplexy (onset ages 15–30).</li><li>CNS stimulants for sleepiness; antidepressants for cataplexy.</li><li>Scheduled short naps, safety (driving, machines), education.</li></ul>"],
["Sleep","An obese man snores loudly, stops breathing during sleep, and is exhausted in the morning with headaches.","What is the problem and management?","<ul><li><b>Obstructive sleep apnea.</b></li><li>CPAP, weight loss, lifestyle change; avoid alcohol and sedatives.</li><li>Teach him to sleep on side; refer for sleep study if needed.</li></ul>"],
["Drugs","A patient on diazepam for anxiety wants to stop suddenly because he feels better and takes a beer at night.","What teaching do you give?","<ul><li>Do not stop abruptly (withdrawal, rebound anxiety, seizures); taper under physician.</li><li>No alcohol (increased CNS depression).</li><li>No driving or hazardous work; rise slowly.</li><li>Drug relieves symptoms but does not treat cause; consider psychotherapy; avoid non-prescribed drugs.</li></ul>"],
["Community","A schizophrenic patient is ready for discharge but cannot manage well at home and has no family support.","Which community services can be used?","<ul><li><b>Halfway house</b> (stable in hospital but not at home), foster home, day treatment/partial hospitalization.</li><li>Rehabilitation and vocational training, outpatient follow-up, CMHC services.</li><li>Goals: continuity of care, prevent relapse and unnecessary hospitalization.</li></ul>"],
["Restraint","A 10-year-old with agitation and aggression is on the ward and staff want to place him in seclusion.","What is your response?","<ul><li>Seclusion and restraint are <b>contraindicated up to 12 years</b> (psychological trauma, development).</li><li>Use positive behavior management, de-escalation, distraction, calm environment, supportive staff presence.</li></ul>"]
];

let mode=1,topic="All",idx=0,deck=[],show=false,known={},store={},onlyRev=false;
const $=id=>document.getElementById(id);
try{store=JSON.parse(localStorage.getItem("sitAns")||"{}");known=JSON.parse(localStorage.getItem("known")||"{}")}catch(e){}
function save(){try{localStorage.setItem("sitAns",JSON.stringify(store));localStorage.setItem("known",JSON.stringify(known))}catch(e){}}
const pool=()=>mode==1?FC:SIT;
function build(){let p=pool().filter(x=>topic=="All"||x[0]==topic);if(mode==1&&onlyRev)p=p.filter(x=>known[x[1]]===false);deck=p;if(idx>=deck.length)idx=0;side();draw()}
function side(){
 const all=pool(),ts=["All",...new Set(all.map(x=>x[0]))];
 let h='<h3>Chapters</h3>'+ts.map(t=>`<button class="tp ${t==topic?"on":""}" data-t="${t}" onclick="setTopic(this.dataset.t)"><span>${t=="All"?"All topics":t}</span><em>${t=="All"?all.length:all.filter(x=>x[0]==t).length}</em></button>`).join("");
 if(mode==1){const k=FC.filter(x=>known[x[1]]===true).length,r=FC.filter(x=>known[x[1]]===false).length;
  h+=`<div class="stat"><b>${k}</b> of ${FC.length} known<br>${r} marked for review<br><label style="display:flex;gap:6px;margin-top:8px;cursor:pointer"><input type="checkbox" ${onlyRev?"checked":""} onchange="onlyRev=this.checked;idx=0;show=false;build()"> Review list only</label></div>`}
 $("side").innerHTML=h}
function setTopic(t){topic=t;idx=0;show=false;build()}
function tab(m){mode=m;topic="All";idx=0;show=false;onlyRev=false;$("t1").classList.toggle("on",m==1);$("t2").classList.toggle("on",m==2);build()}
function shuf(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}idx=0;show=false;draw()}
function go(d){if(!deck.length)return;idx=(idx+d+deck.length)%deck.length;show=false;draw();scrollTo({top:0})}
function flip(){show=!show;draw()}
function mark(v){known[deck[idx][1]]=v;save();const n=deck.length;side();if(onlyRev&&v){build();return}go(1)}
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function upd(){const b=document.querySelectorAll(".ans.chk input");$("sc2").textContent=`${[...b].filter(x=>x.checked).length} of ${b.length} points covered`}
function wc(t){const n=(t.value.trim().match(/\S+/g)||[]).length;$("wcn").textContent=n+" words"}
function draw(){
 const d=deck[idx];
 $("pb").style.width=deck.length?((idx+1)/deck.length*100)+"%":"0";
 if(!d){$("view").innerHTML='<div class="card"><div class="empty">Nothing here yet. Mark cards for review, or switch the chapter filter.</div></div>';return}
 const pos=`${idx+1} of ${deck.length}`;
 const nav=`<div class="foot"><button class="btn" onclick="go(-1)">Previous</button><span class="keys">Keys: Space reveal, arrows move${mode==1?", K known, R review":""}</span><button class="btn" onclick="go(1)">Next</button></div>`;
 if(mode==1){
  const k=known[d[1]],st=k===true?'<span class="pill k">Known</span>':k===false?'<span class="pill r">To review</span>':'';
  $("view").innerHTML=`<article class="card"><div class="meta"><span><span class="badge">${d[0]}</span> &nbsp;${pos}</span>${st}</div>
  <div class="body"><h2 class="q">${d[1]}</h2>
  ${show?`<div class="ans"><h4>Answer</h4>${d[2]}</div><div class="act"><button class="btn k" onclick="mark(true)">I knew this</button><button class="btn r" onclick="mark(false)">Review again</button><button class="btn" onclick="flip()">Hide answer</button></div>`:`<p class="hint">Take a breath. Try to recall the answer first, then check it. Every card you review counts.</p><div class="act"><button class="btn p" onclick="flip()">Show answer</button></div>`}
  </div>${nav}</article>`;
 }else{
  const key=d[1].slice(0,40),v=store[key]||"";
  const ans=d[3].replace(/<li>/g,'<li><label><input type="checkbox" onchange="upd()"><span>').replace(/<\/li>/g,'</span></label></li>');
  $("view").innerHTML=`<article class="card"><div class="meta"><span><span class="badge">Case: ${d[0]}</span> &nbsp;${pos}</span></div>
  <div class="body"><div class="case">${d[1]}</div><p class="task">${d[2]}</p>
  <textarea id="ta" placeholder="Write your answer here in full sentences or points..." oninput="store[this.dataset.k]=this.value;save();wc(this)" data-k="${esc(key)}">${esc(v)}</textarea>
  <div class="wc"><span id="wcn"></span><span>Saved in this browser</span></div>
  <div class="act"><button class="btn p" onclick="flip()">${show?"Hide model answer":"Show model answer"}</button></div>
  ${show?`<div class="ans chk"><h4>Model answer: tick the points you covered</h4>${ans}<div class="score" id="sc2">0 of 0 points covered</div></div>`:""}
  </div>${nav}</article>`;
  wc($("ta"));if(show)upd();
 }
}
function theme(){const r=document.documentElement,dark=r.getAttribute("data-theme")=="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme:dark)").matches);const n=dark?"light":"dark";r.setAttribute("data-theme",n);$("th").textContent=n=="dark"?"Light mode":"Dark mode";try{localStorage.setItem("theme",n)}catch(e){}}
try{const t=localStorage.getItem("theme");if(t){document.documentElement.setAttribute("data-theme",t);$("th").textContent=t=="dark"?"Light mode":"Dark mode"}}catch(e){}
document.addEventListener("keydown",e=>{if(/TEXTAREA|INPUT/.test(e.target.tagName)||e.ctrlKey||e.metaKey)return;
 if(e.key=="ArrowRight")go(1);else if(e.key=="ArrowLeft")go(-1);else if(e.key==" "){e.preventDefault();flip()}
 else if(mode==1&&show&&e.key.toLowerCase()=="k")mark(true);else if(mode==1&&show&&e.key.toLowerCase()=="r")mark(false)});
build();
</script></body></html>
