<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#7c3aed;--teal-d:#6d28d9;--blue:#eef2f7;--bd:#d9e0ea;--ok:#16a34a;--no:#dc2626;--rev:#2563eb;--txt:#1a2332;--grad:linear-gradient(135deg,#6d28d9,#7c3aed 60%,#8b5cf6)}
body{font-family:'Outfit',Arial,sans-serif;background:#f8fafc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
.shf{position:absolute;left:90px;top:9px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px;font-family:inherit}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#475569;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#1a2332;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#f97316}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef2f7}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #1a2332;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef2f7;border-top:1px solid #d9e0ea;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}.shf{left:12px}}
</style>

<script>
const QUESTIONS = [
// ===== Depression (7) =====
 {t:"The incidence of mood disorders is higher in dizygotic twins than in monozygotic twins.",o:["True","False"],a:1},
 {t:"Learned helplessness is typically seen in:",o:["Delirium","Dementia","Depression","Schizophrenia"],a:2},
 {t:"Prevalence of major depressive disorder affects approximately 14.8 million people worldwide.",o:["True","False"],a:0},
 {t:"Individuals with ______ disorder describe their mood as sad or down, with no evidence of psychotic symptoms or a major depressive episode.",o:["Dysthymic","Manic","Hypomanic","Major depressive"],a:0},
 {t:"Physiological symptoms of major depression include:",o:["Social withdrawal","Suicidal attempts","Delusion","Loss of libido"],a:3},
 {t:"An agitated depressed patient is not characterized by elevated mood.",o:["True","False"],a:0},
 {t:"Mood disorders are usually associated with poor memory, poor concentration, and loss of self-confidence.",o:["True","False"],a:0},

// ===== Bipolar Disorders (14) =====
 {t:"Assessment of a patient reveals severe pathologic mood swings, from hyperactivity and euphoria to depression. Which diagnosis should the nurse suspect?",o:["Dysthymic disorder","Bipolar disorder","Cyclothymic disorder","Depressive disorder"],a:1},
 {t:"The level of neurotransmitters (norepinephrine, dopamine, and serotonin) is increased among patients with mania than those with depression.",o:["True","False"],a:0},
 {t:"Genetics has no role to play in the development of bipolar disorder.",o:["True","False"],a:1},
 {t:"In Bipolar I disorder, major depressive episodes alternate with:",o:["Manic episode","Hypomania","Cyclothymia","Dysthymia"],a:0},
 {t:"Motor and cognitive symptoms of mania include:",o:["Social withdrawal","Weight loss","Psychomotor agitation","Loss of libido"],a:2},
 {t:"Psychological symptoms of a manic episode include:",o:["Sadness","Racing thoughts","Loss of interest","Sense of emptiness"],a:1},
 {t:"Which of the following is NOT a characteristic feature of a manic episode?",o:["Elevated, expansive, or irritable mood","Increased psychomotor activity","Flight of ideas","Thought echo, thought insertion, or thought withdrawal"],a:3},
 {t:"In Bipolar II disorder, major depressive episodes alternate with periods of:",o:["Cyclothymia","Major depression","Dysthymia","Hypomania"],a:3},
 {t:"Hypomania is severe enough to cause significant impairment in social and occupational functioning.",o:["True","False"],a:1},
 {t:"Cyclothymic disorder is characterized by:",o:["Manic episodes","Hypomania and mild depression","Major depressive episodes","Manic episodes and major depression"],a:1},
 {t:"Patients diagnosed with cyclothymia usually have manic, mixed, or major depressive episodes during the 2-year period.",o:["True","False"],a:1},
 {t:"Cyclothymia is distinguished from major affective disorder primarily by:",o:["Severity and duration of symptoms","Family history","Age of onset","An absence of chronicity"],a:0},
 {t:"One of the major drug therapies for bipolar disorder is:",o:["Benzodiazepines","Clozapine","Lithium carbonate","Chlorpromazine"],a:2},
 {t:"Physical activities can be provided to a manic patient so that the patient's energy can be ventilated.",o:["True","False"],a:0},

// ===== Principles of Psychiatric Nursing (11) =====
 {t:"Psychiatric nursing principles are not general in nature and do not form guidelines for the emotional care of each patient.",o:["True","False"],a:1},
 {t:"All direct and indirect methods of punishing the psychiatric patient must not be avoided.",o:["True","False"],a:1},
 {t:"Acceptance means complete permissiveness that conveys respect to the patient as an individual human being.",o:["True","False"],a:1},
 {t:"Respect for the patient can be conveyed by:",o:["Giving no time to listen to the patient","Giving the patient no opportunity to make choices and decisions","Being honest with the patient","Giving the patient no privacy when it is needed"],a:2},
 {t:"A patient feels anxiety, fear, hostility, or anger. Which of the following is the appropriate approach?",o:["The nurse encourages the patient to express these negative feelings in a verbal or symbolic manner","The nurse should not tolerate or allow expression of these feelings","The nurse uses punitive methods with the patient","The nurse makes the patient apologize and change his mind"],a:0},
 {t:"Consistency helps the patient to know what to expect and reduces his anxiety.",o:["True","False"],a:0},
 {t:"Which of the following should be excluded while operating consistency?",o:["Consistency to be maintained from nurse to nurse and shift to shift","Limits and their reinforcement require a great deal of tact and understanding","Patient is allowed to feel as he does","Permissiveness not to be limited in all situations"],a:3},
 {t:"The patient is allowed to feel as he does, but limitations are put on his:",o:["Thought","Behavior","Perception","Mood"],a:1},
 {t:"The attempt to win patients' liking is very important in maintaining consistency with the psychiatric patient.",o:["True","False"],a:1},
 {t:"The psychiatric nurse should focus on the patient's intellectual aspect to change his unacceptable behavior.",o:["True","False"],a:1},
 {t:"A psychiatric patient told a student nurse that he is the Prophet Mohammed. She told him that he is a liar and can never be the Prophet Mohammed. What do you think about the patient's reaction?",o:["The patient will be aggressive, defensive and anxious, as direct contradiction of psychotic ideas increases anxiety","The nurse is highly qualified and used empathy while dealing with the patient","The patient will trust the nurse more than before and will tell her about his problems and needs","The patient will apologize and change his mind about his psychotic idea"],a:0},

// ===== Defense Mechanisms (18) =====
 {t:"A defense mechanism is usually used unconsciously.",o:["True","False"],a:0},
 {t:"Ms. Fatima, 30 years old, had a dog bite at the age of 2 years. Even though she does not verbalize about the dog bite, she is still very afraid even when a dog barks. Which defense mechanism does she exhibit?",o:["Regression","Sublimation","Repression","Projection"],a:2},
 {t:"\"Bad things happened to me in my past, but I've unconsciously buried them deep in my mind.\" What defense mechanism is being demonstrated?",o:["Projection","Repression","Identification","Denial"],a:1},
 {t:"This is the voluntary, conscious forcing of unpleasant, anxiety-producing experiences into the preconscious mind:",o:["Projection","Repression","Regression","Suppression"],a:3},
 {t:"An examinee went directly to her room and slept in a fetal position and sucked her thumb after learning she failed the board exam. This is an example of:",o:["Projection","Suppression","Repression","Regression"],a:3},
 {t:"A person who does not have children says, \"I don't want them; it is a big responsibility.\" This is an example of:",o:["Projection","Rationalization","Suppression","Regression"],a:1},
 {t:"Shimaa complains about her job duties, rarely completes assigned tasks, and is regularly late. When she is fired, she claims it was because her co-worker badmouthed her instead of blaming her own poor performance. Which defense mechanism explains her reaction?",o:["Rationalization","Displacement","Denial","Sublimation"],a:0},
 {t:"An adolescent boy, after an argument with his father, goes to his room and kicks the door. This is an example of denial.",o:["True","False"],a:1},
 {t:"A mother who sent her son to his room because he broke a dish decides to let him stay up an hour later to watch television. This is an example of:",o:["Displacement","Compensation","Undoing","Denial"],a:2},
 {t:"Parents often transfer feelings of anger or frustration toward their children. Which defense mechanism is used?",o:["Repression","Rationalization","Displacement","Undoing"],a:2},
 {t:"Ahmed was neglected by his father but experiences resentful feelings toward his therapist later in life. This behavior might be associated with which defense mechanism?",o:["Displacement","Sublimation","Splitting","Conversion"],a:0},
 {t:"A blind woman who becomes proficient in playing the piano is an example of compensation.",o:["True","False"],a:0},
 {t:"Symbolization is \"making up\" for a real or imagined inability or deficiency with a specific behavior to maintain self-respect or self-esteem.",o:["True","False"],a:1},
 {t:"Projection means unconsciously incorporating wishes, values, and attitudes of others as if they were your own.",o:["True","False"],a:1},
 {t:"Miss Layla, who unconsciously hates her mother, continually tells the staff how wonderful her mother is. This is an example of:",o:["Projection","Introjection","Denial","Reaction formation"],a:3},
 {t:"A man who dislikes his mother-in-law acts very politely and courteously toward her. Which defense mechanism is being used?",o:["Compensation","Reaction formation","Regression","Identification"],a:1},
 {t:"______ means the transferring of mental conflict into physical symptoms to release tension or anxiety.",o:["Conversion","Displacement","Compensation","Undoing"],a:0},
 {t:"Mr. Ahmed hates Ms. Amani, but his superego tells him that such hatred is unacceptable. He \"solved\" the problem by believing that Ms. Amani hates him. Which defense mechanism did Mr. Ahmed show?",o:["Regression","Rationalization","Projection","Displacement"],a:2},

// ===== Anxiety Disorders (14) =====
 {t:"Increased stress is not associated with the development of anxiety disorders.",o:["True","False"],a:1},
 {t:"Yaser experiences restlessness, fatigue, feeling on edge, and is frightened very easily by everyday stressors in his life. This describes which anxiety disorder?",o:["Panic disorder","Generalized anxiety disorder","Phobia","Obsessive-compulsive disorder (OCD)"],a:1},
 {t:"Symptoms of generalized anxiety disorder can include:",o:["Feeling tired","Trouble sleeping","Restlessness","All of the above"],a:3},
 {t:"Which of the following is characterized by recurrent panic attacks (typically unexpected) and fear of having another one for at least 1 month?",o:["Depression","Generalized anxiety disorder","Obsessive-compulsive disorder","Panic disorder"],a:3},
 {t:"Panic attacks are repeated attacks of fear that can last for several minutes.",o:["True","False"],a:0},
 {t:"Which of the following is NOT a symptom of panic disorder?",o:["Accelerated heart rate","Trembling","Dizziness or lightheadedness","No smothering sensation"],a:3},
 {t:"Compulsions are recurrent, intrusive thoughts, impulses, or images.",o:["True","False"],a:1},
 {t:"Obsessive-compulsive disorder is characterized by continual feelings of worry, anxiety, physical tension, and irritability across many areas of life.",o:["True","False"],a:1},
 {t:"Marked fear or anxiety about one or more social situations in which the individual is exposed to possible scrutiny by others describes:",o:["Generalized anxiety disorder","Social anxiety disorder","Agoraphobia","Panic disorder"],a:1},
 {t:"Persistent fear of performance situations describes social phobia.",o:["True","False"],a:0},
 {t:"The term agoraphobia literally means fear of heights.",o:["True","False"],a:1},
 {t:"Which anxiety disorder develops in response to an unexpected emotional or physical trauma that could not be controlled?",o:["Post-traumatic stress disorder","Panic disorder","Phobia","Obsessive-compulsive disorder (OCD)"],a:0},
 {t:"A client is experiencing a severe panic attack. Which nursing intervention would meet this client's immediate need?",o:["Teach deep breathing relaxation exercises","Place the client in a Trendelenburg position","Stay with the client and offer reassurance of safety","Administer the ordered PRN buspirone (BuSpar)"],a:2},
 {t:"A patient diagnosed with obsessive-compulsive disorder continually carries a toothbrush and brushes and flosses up to fifty times each day. The nurse understands that this behavior is an attempt to accomplish which of the following?",o:["Promote oral health","Avoid interacting with others","Relieve anxiety","Experience pleasure"],a:2},

// ===== Community Mental Health (7) =====
 {t:"The community mental health center is based on the needs of a specific population, EXCEPT:",o:["Prevention of mental illness","Individual therapy","Group therapy","Financial assistance"],a:0},
 {t:"The emergency crisis intervention room is characterized by the following:",o:["It provides a comprehensive psychiatric treatment program for patients who are able to remain at home part of the time","The persons coming to the day care center are able to take some responsibility for management of their homes while they live with the family","Patients are usually screened by clinical staff as a preliminary step to determine the urgency for treatment","The staff working in this area should be knowledgeable and skillful in psychiatric assessment and application of crisis intervention"],a:3},
 {t:"From the advantages of the day and night hospital, the patient is able to continue his social contacts with the family and community.",o:["True","False"],a:0},
 {t:"Patients being discharged from in-patient psychiatric hospitals may be referred for follow-up. This occurs in:",o:["Halfway houses","Out-patient psychiatric clinics","Foster home services","Community mental health centers"],a:1},
 {t:"Foster homes have also been arranged for elderly patients who have no family.",o:["True","False"],a:0},
 {t:"Community mental health centers are one of the important community resources that provide comprehensive services for prevention, treatment, and rehabilitation of mental disorders.",o:["True","False"],a:0},
 {t:"______ is the most important community resource for prevention, treatment, and rehabilitation of mental disorders:",o:["Community mental health centers","Homeless services","Halfway houses","Out-patient clinics"],a:0},

// ===== Limit Setting, Seclusion & Restraint (8) =====
 {t:"Which types of behavior need limit setting?",o:["Manipulative behavior","Destructive behavior","Acting-out behavior","All of the above"],a:3},
 {t:"Seclusion means that it restricts the patient's movement either partially or totally.",o:["True","False"],a:1},
 {t:"Seclusion and restraint may be indicated in a patient with manipulative behavior.",o:["True","False"],a:1},
 {t:"Mittens are an example of chemical restraint.",o:["True","False"],a:1},
 {t:"Physical restraint is used as a first resort for management of excited patients.",o:["True","False"],a:1},
 {t:"A resident on restraint should be checked:",o:["Every 2 hours","Every hour","Every 15 minutes","Every 30 minutes"],a:2},
 {t:"One of the following is a complication of seclusion:",o:["Mania","Depression","Hypomania","Cyclothymia"],a:1},
 {t:"When restraints are necessary for a suicidal client, periodic checks (every 15 minutes) are made to assess and document the client's location and behavior.",o:["True","False"],a:0},

// ===== Anxiolytic Drugs (8) =====
 {t:"Antianxiety drugs are also prescribed as sleeping pills and muscle relaxants.",o:["True","False"],a:0},
 {t:"Which neurotransmitter's inhibitory effect do benzodiazepines enhance?",o:["Serotonin","Acetylcholine","Norepinephrine","Gamma-aminobutyric acid (GABA)"],a:3},
 {t:"Acute alcoholic intoxication is one of the indications of benzodiazepines.",o:["True","False"],a:1},
 {t:"Which patient has the greatest risk for overdose with a benzodiazepine? A patient who:",o:["Takes the drug with antacids","Takes the drug before meals","Experiences depression as well as anxiety","Combines the drug with alcohol"],a:3},
 {t:"Which of the following statements best describes buspirone?",o:["Has sedative properties and is used for generalized anxiety disorder","Causes high blood pressure when used with MAOIs","Its maximum effect can occur within 1–2 weeks","Decreases the action of serotonin in the brain"],a:1},
 {t:"A patient seeking treatment for anxiety says, \"I can't think. My job depends on my ability to think. I need medicine, but the drugs I took a few years ago made me too sleepy.\" What information is most important for the nurse to consider when formulating a response?",o:["Buspirone (BuSpar) alleviates anxiety without sedation or cognitive clouding","All antianxiety medication has sedating properties","The patient's description of anxiety does not warrant treatment with medication","The patient may be trying to manipulate the nurse to get the desired prescription"],a:0},
 {t:"Buspirone for adults usually begins with 15 mg daily in three divided doses. Increases of 5 mg/day are made every 2 to 3 days, with the maximum dose not exceeding 90 mg daily.",o:["True","False"],a:1},
 {t:"Buspirone has no anticonvulsant or sedative properties but has muscle relaxant properties.",o:["True","False"],a:1},

// ===== Antidepressant Drugs (6) =====
 {t:"Which of the following drugs shows the greatest efficacy in treating obsessive-compulsive disorder (OCD)?",o:["Xanax","Inderal","Clomipramine","Clozapine"],a:2},
 {t:"An 18-year-old woman presents with symptoms of bulimia nervosa. Which of the following drugs would be most helpful to this patient?",o:["Tofranil","Lexapro","Prozac","Celexa"],a:2},
 {t:"A 51-year-old woman with symptoms of major depression also has angle-closure glaucoma. Which of the following antidepressants is best for this patient?",o:["Effexor","Anafranil","Ludiomil","Tofranil"],a:0},
 {t:"Anafranil blocks presynaptic reuptake of serotonin only.",o:["True","False"],a:1},
 {t:"The most common side effect of selective serotonin reuptake inhibitors (SSRIs) is:",o:["Tremors","Anxiety and insomnia","Agitation","Sexual dysfunction"],a:3},
 {t:"The initial response to an adequate dosage of an SSRI typically occurs after the beginning of treatment by:",o:["4 weeks","2 weeks","1 week","1 month"],a:1},

// ===== Lithium (Mood Stabilizer) (12) =====
 {t:"Lithium carbonate is prescribed primarily to treat:",o:["Bipolar disorder","Depression","Anxiety disorder","Schizophrenia"],a:0},
 {t:"Lithium therapy is indicated in cases of neutropenia secondary to chemotherapy for cancer.",o:["True","False"],a:0},
 {t:"Contraindications for lithium include:",o:["Acute hypomania","Major depression","Thyroid disease","Schizoaffective disorder"],a:2},
 {t:"For long-term control, therapeutic lithium levels are:",o:["0.4 to 0.8 mg%","0.6 to 1.2 mEq/L","0.8 to 1.8 mg%","1 to 1.5 mEq/g"],a:1},
 {t:"The antimanic effect of lithium is usually observed within:",o:["Less than 24 hours","1 to 4 days","Within 30 days","7 to 14 days"],a:3},
 {t:"Haloperidol may be given in the early stages of a manic patient's treatment, as lithium starts its action within 7 to 14 weeks.",o:["True","False"],a:1},
 {t:"One of the causes of lithium toxicity is decreased sodium intake.",o:["True","False"],a:0},
 {t:"Which can occur when levels of lithium carbonate become too high in the blood?",o:["Lithium therapeutic dose","Lithium serum level","Lithium overload","Lithium toxicity"],a:3},
 {t:"A patient's lithium level of 1.8 mEq/L is considered a therapeutic dose.",o:["True","False"],a:1},
 {t:"Initially, the blood level should be monitored weekly until the therapeutic level of lithium is reached.",o:["True","False"],a:0},
 {t:"A client taking lithium has problems with coordination and an unstable gait. The patient's lithium level is 2.3 mEq/L. What should the nurse do?",o:["Administer an extra dose of lithium","Withhold the lithium and notify the physician with the lithium level","Continue to administer lithium three times per day","Skip a dose of lithium and then resume the regular medication schedule"],a:1},
 {t:"Hemodialysis is necessary for a patient with lithium toxicity if the serum lithium level becomes more than:",o:["3 mEq/L","1.8 mEq/L","2 mEq/L","2.5 mEq/L"],a:0},

// ===== Electroconvulsive Therapy (ECT) (4) =====
 {t:"The ECT course of treatment usually consists of 6–12 treatments administered 2 or 3 times daily.",o:["True","False"],a:1},
 {t:"The most common side effect of ECT is:",o:["Dehydration","Dementia","Amnesia","Fractures"],a:2},
 {t:"The nurse should allow the patient who will receive ECT to see or hear another patient who is being treated by ECT.",o:["True","False"],a:1},
 {t:"Nursing care during the ECT procedure includes:",o:["Minimize anxiety through anxiety management techniques","Informed consent is taken to overcome the fear, confusion and anxiety","Apply ECG electrodes, EEG electrodes, BP cuff, and pulse oximetry sensor","The patient's hair should be clean and dry to allow for electrode contact"],a:2}
];

const TOTAL_TIME = 90*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
function randomizeQuestions(){if(confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟'))init(QUESTIONS)}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();} else refresh(); }
function saveNext(){ if(sel[cur]!==null) saved[cur]=true; else saved[cur]=false; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function resetQ(){ sel[cur]=null; saved[cur]=false; review[cur]=false; render(); }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
