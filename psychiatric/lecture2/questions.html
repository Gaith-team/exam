<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:       #7c3aed;
  --accent-light: #8b5cf6;
  --accent-dark:  #6d28d9;
  --accent-glow:  rgba(124,58,237,0.2);
  --bg:      #f8fafc;
  --bg2:     #eef2f7;
  --card:    #ffffff;
  --text:    #1a2332;
  --text2:   #4a5568;
  --text3:   #718096;
  --bc:      rgba(0,0,0,0.07);
  --success: #16a34a;
  --danger:  #dc2626;
  --warn:    #6d28d9;
  --r:       16px;
  --tr:      all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:   #0d1117; --bg2: #161b22; --card: #1c2333;
  --text: #e6edf3; --text2: #b1bac4; --text3: #7d8590;
  --bc:   rgba(255,255,255,0.08);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

/* PROGRESS TOP */
#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width .2s;
}

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(248,250,252,.93); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bc); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(13,17,23,.95); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent-glow); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 900;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.shuffle-btn {
  border: 1px solid var(--bc);
  background: var(--bg2);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s ease;
  font-family: inherit;
}
.shuffle-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}

.theme-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

/* HERO BAND */
.hero-band {
  margin-top: 64px;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-light));
  padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden;
}
.hero-band::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band-icon {
  width: 68px; height: 68px; border-radius: 20px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px; border: 1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size: clamp(20px,4vw,30px); font-weight: 900; color: #fff; margin-bottom: 6px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.8); }
.hero-band-meta {
  display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  flex-wrap: wrap;
}
.meta-pill {
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 50px;
  padding: 6px 16px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}

/* EXAM SHELL */
.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

/* STATS ROW */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center;
}
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--accent); }

/* PROGRESS STRIP */
.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 8px; transition: width .4s;
}
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text);
  gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(217,119,6,.3); background: rgba(217,119,6,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

/* QUESTION CARD */
.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  transition: box-shadow .3s;
}
.q-header {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  padding: 4px 18px 4px;
  display: flex; align-items: center; gap: 8px;
}
.q-num {
  background: rgba(255,255,255,.2); border-radius: 8px;
  padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff;
}
.q-text {
  padding: 22px 18px 14px; font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.65; border-bottom: 1px solid var(--bc);
  text-align: left; direction: ltr;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

/* OPTION */
.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--bc); background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none;
  direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); background: var(--accent-glow);
  transform: translateX(3px);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3);
  transition: var(--tr);
}
.opt.correct {
  border-color: var(--success); background: rgba(22,163,74,.08);
}
.opt.correct .opt-letter {
  background: var(--success); color: #fff; border-color: var(--success);
}
.opt.wrong {
  border-color: var(--danger); background: rgba(220,38,38,.07);
}
.opt.wrong .opt-letter {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
.opt.disabled { pointer-events: none; }

/* FEEDBACK */
.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(22,163,74,.1); color: var(--success); border: 1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background: rgba(220,38,38,.08); color: var(--danger); border: 1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size: 20px; }

/* EXPLANATION */
.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06);
  border-radius: 10px; border-right: 3px solid var(--accent);
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none;
}

/* NAV BTNS */
.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-skip {
  background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px;
}
.btn-skip:hover { border-color: var(--warn); color: var(--warn); }

/* ===== RESULTS ===== */
.result-hero {
  text-align: center; padding: 36px 20px 28px;
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; border: 5px solid var(--bg2);
  position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
}
.rs { background: var(--bg2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

/* REPORT ITEMS */
.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 14px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.report-item .ri-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; margin-top: 5px; color: var(--text2);
}
.ri-badge {
  padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; flex-shrink: 0;
}
.ri-yours { background: rgba(220,38,38,.1); color: var(--danger); }
.ri-right { background: rgba(22,163,74,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

/* FOOTER */
footer {
  background: var(--bg2); border-top: 1px solid var(--bc);
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>
<body>

<div id="prog-bar" style="width:0%"></div>

<nav>
  <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand">
    <div class="nav-logo-icon">GT</div>
    <span>GHAITH TEAM</span>
  </div>
  <div class="nav-right">
    <button class="shuffle-btn" onclick="randomizeQuestions()" title="ترتيب الأسئلة عشوائياً">🔀 عشوائي</button>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="hero-band">
  <div class="hero-band-icon">🧠</div>
  <h1>Principles</h1>
  <p>Psychiatric Nursing </p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 80 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>

<div class="shell">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="val stat-correct" id="sCorrect">0</div>
      <div class="lbl">✔ صحيح</div>
    </div>
    <div class="stat-box">
      <div class="val stat-wrong" id="sWrong">0</div>
      <div class="lbl">✖ خطأ</div>
    </div>
    <div class="stat-box">
      <div class="val stat-remain" id="sRemain">--%</div>
      <div class="lbl">⏳ متبقي</div>
    </div>
  </div>

  <!-- PROGRESS STRIP -->
  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">80:00</span></div>
  </div>

  <!-- APP -->
  <div id="app"></div>
</div>

<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg">
    <i class="fa-brands fa-telegram"></i> @nursing2bu
  </a>
</footer>

<script>
const QUESTIONS = [
{t:"Principles of Mental Health Nursing are based on the concept that each individual has:",o:["A fixed personality that cannot change","Intrinsic worth, dignity, and potentialities to grow","Only physical needs that must be met","A limited capacity for emotional recovery"],a:1},
{t:"The principles of psychiatric nursing are applicable to:",o:["Only patients with severe schizophrenia","Only physically ill patients","Both mentally and physically ill patients","Only patients in acute crisis"],a:2},
{t:"Physical illness is usually associated with:",o:["No emotional disturbance whatsoever","Emotional disturbance to some degree","Only cognitive impairment","Permanent behavioral changes"],a:1},
{t:"Being non-judgmental in psychiatric nursing means:",o:["Ignoring the patient's behavior completely","Evaluating patient behavior as right or wrong","Not judging the patient's behavior as right, wrong, or bad","Punishing undesirable behavior immediately"],a:2},
{t:"Which of the following is an example of a non-punitive approach?",o:["Using seclusion as a first-line response","Applying indirect methods of punishment","Avoiding all direct and indirect methods of punishment","Restricting meals for aggressive behavior"],a:2},
{t:"A nurse who shows acceptance of a patient will:",o:["Reject the patient when behavior is contrary to expectations","Not reject the patient even when behavior is contrary to expectations","Ignore the patient's behavior entirely","Punish the patient for unexpected behavior"],a:1},
{t:"Demonstrating sincere interest in a patient can be done by all of the following EXCEPT:",o:["Studying the patient's behavior","Allowing the patient to make his own choices","Making all decisions for the patient","Being aware of the patient's likes and dislikes"],a:2},
{t:"When a psychiatric patient talks, the nurse should focus primarily on:",o:["The exact words and grammar used","The feeling behind the conversation","The length of the conversation","The time of day the conversation occurs"],a:1},
{t:"Talking with a purpose in psychiatric nursing means the conversation should revolve around:",o:["The nurse's personal experiences","Hospital policies and rules","The patient's needs, wants, and interests","Other patients on the ward"],a:2},
{t:"Strong emotions that are bottled up in psychiatric patients are described as:",o:["Harmless and self-resolving","Potentially explosive and dangerous","A sign of recovery","An indication of good coping"],a:1},
{t:"The nurse should permit the patient to express strong feelings:",o:["Only when the physician is present","With disapproval to correct behavior","Without disapproval or punishment","Only during scheduled therapy sessions"],a:2},
{t:"Self-understanding as a therapeutic tool requires the psychiatric nurse to have:",o:["A perfect personality with no flaws","A realistic self-concept and ability to recognize own feelings","No personal emotions whatsoever","Complete detachment from patients"],a:1},
{t:"A nurse's ability to accept her own strengths and limitations helps her to:",o:["Avoid all patient interactions","See the strengths and limitations in other people","Eliminate her own emotions entirely","Focus only on patient weaknesses"],a:1},
{t:"Which of the following helps a nurse understand herself better?",o:["Avoiding group conferences","Working in complete isolation","Participating in group conferences regarding patient care","Never discussing personal reactions with colleagues"],a:2},
{t:"Exchanging personal experiences freely and frankly with colleagues helps the nurse to:",o:["Gossip about patients","Understand herself better","Avoid professional responsibilities","Create competition among staff"],a:1},
{t:"Consistency in psychiatric nursing is defined as:",o:["Changing routines daily to keep patients alert","Having a routine pattern that doesn't change from one day to the other","Allowing each nurse to set different rules","Frequently modifying ward policies"],a:1},
{t:"Consistency in the psychiatric setting primarily helps the patient by:",o:["Increasing confusion","Reducing anxiety","Creating dependency","Promoting isolation"],a:1},
{t:"Areas where consistency must operate include all of the following EXCEPT:",o:["Attitude of the staff","Ward routine","Individual nurse's personal mood swings","Defining limitations placed on the patient"],a:2},
{t:"Permissiveness should be limited with patients who are:",o:["Calm and cooperative","Quiet and withdrawn","Homicidal, suicidal, hyperactive, and suspicious","Mildly anxious"],a:2},
{t:"The attempt to win a patient's liking (favoritism) is considered:",o:["An effective therapeutic strategy","A sign of good nursing care","Most dangerous for the patient","A recommended practice"],a:2},
{t:"Reassurance in psychiatric nursing is best defined as:",o:["Telling the patient everything will be fine","Building or restoring patient confidence through understanding the meaning of an experience","Ignoring the patient's fears","Giving medication to calm the patient"],a:1},
{t:"When giving reassurance, the nurse should:",o:["Show surprise at the patient's problems","Be truly interested in the patient's problems","Dismiss the patient's concerns as irrational","Tell the patient to stop worrying"],a:1},
{t:"When a psychiatric patient is silent and doesn't want to talk, the most reassuring action is to:",o:["Leave the patient alone immediately","Force the patient to speak","Sit beside the patient without demanding conversation","Call the physician immediately"],a:2},
{t:"Doing things for the patient without asking anything in return is a form of:",o:["Enabling behavior","Reassurance","Codependency","Manipulation"],a:1},
{t:"Patient behavior in psychiatric nursing is changed primarily through:",o:["Rational interpretation and logical arguments","Emotional experience, not rational interpretation","Repeated lectures and advice","Written instructions"],a:1},
{t:"Telling and advising psychiatric patients about their behavior is:",o:["Highly effective in changing behavior","The most recommended approach","Not effective in changing behavior","The primary therapeutic tool"],a:2},
{t:"When a patient's belief is challenged directly, the patient typically:",o:["Immediately changes the belief","Becomes more defensive","Shows no reaction","Becomes more cooperative"],a:1},
{t:"Corrective emotional experience can bring about:",o:["Increased anxiety only","Behavior change","Permanent confusion","Worsening of symptoms"],a:1},
{t:"Insight and understanding of one's own behavior is described as:",o:["Painless and easy","Painful","Unnecessary for recovery","Instantaneous"],a:1},
{t:"Interpretation of a patient's behavior should only be done when:",o:["The nurse feels it is convenient","The patient first arrives at the ward","The patient is ready and secure enough to tolerate it","The family requests it"],a:2},
{t:"Anxiety is defined as a feeling state in which the individual experiences:",o:["A sense of calm and peace","An intense sensation of apprehension","Extreme happiness","Complete indifference"],a:1},
{t:"When an individual experiences great anxiety, he or she:",o:["Functions at an optimal level","Loses the ability to function","Becomes more creative","Shows improved concentration"],a:1},
{t:"Which of the following can increase a patient's anxiety?",o:["Providing a calm environment","Showing the nurse's own anxiety","Speaking in a gentle tone","Maintaining consistency"],a:1},
{t:"Placing demands on a patient that he cannot meet will:",o:["Motivate the patient to improve","Increase the patient's anxiety","Have no effect on the patient","Decrease the patient's symptoms"],a:1},
{t:"Direct contradiction of psychotic ideas is likely to:",o:["Cure the patient's delusions","Help the patient gain insight","Increase the patient's anxiety","Be the most therapeutic approach"],a:2},
{t:"Objectivity in psychiatric nursing means:",o:["Being cold and indifferent","Evaluating patient behavior without mixing one's own feelings, opinions, or judgment","Having no emotions at all","Agreeing with everything the patient says"],a:1},
{t:"Objectivity is NOT the same as:",o:["Professional assessment","Coldness, indifference, and absence of feeling","Accurate observation","Fair evaluation"],a:1},
{t:"An example of lack of objectivity in nursing is:",o:["Observing behavior without judgment","Documenting facts accurately","Being critical of the patient","Maintaining professional boundaries"],a:2},
{t:"A realistic nurse-patient relationship focuses on:",o:["The nurse's personal and emotional needs","The personal and emotional needs of the patient","The hospital's financial needs","The family's social status"],a:1},
{t:"The nurse must differentiate between a patient's:",o:["Age and gender","Demands and actual needs","Height and weight","Medication and diet"],a:1},

{t:"A 28-year-old female patient with depression sits silently in the corner and refuses to speak. The nurse sits quietly beside her without demanding conversation. This action demonstrates which principle?",o:["Avoiding verbal and physical force","Reassurance given in an acceptable manner","Consistency","Objective observation"],a:1},

{t:"A 25-year-old patient with OCD repeatedly washes his hands until they bleed. The nurse focuses on stopping the hand-washing behavior rather than understanding the underlying anxiety. This violates which principle?",o:["Consistency","Nursing care centered on patient as a person, not on control of symptoms","Self-understanding","Reassurance"],a:1},
{t:"A 38-year-old patient with PTSD becomes extremely anxious when the nurse raises her voice during a conversation. The nurse should recognize that:",o:["The patient is overreacting","Showing the nurse's own anxiety can increase the patient's anxiety","The patient needs to be confronted","Loud voices are therapeutic"],a:1},

{t:"A 42-year-old patient with mania demands that the nurse bring him a car to drive. The nurse recognizes this as a demand rather than an actual need and sets appropriate limits. This demonstrates:",o:["Maintaining a realistic nurse-patient relationship","Lack of empathy","Inconsistency","Punitive behavior"],a:0},
{t:"A 31-year-old patient becomes verbally abusive toward the nurse. The nurse remains calm, does not take the behavior personally, and evaluates the behavior objectively. This demonstrates:",o:["Indifference","Objective observation of the patient's behavior","Lack of caring","Avoidance"],a:1},

{t:"Strong emotions that are bottled up are potentially ___ and dangerous.",o:["harmless","therapeutic","explosive","beneficial"],a:2},
{t:"Consistency means having a certain routine pattern that doesn't change from one day to the ___.",o:["week","month","other","year"],a:2},
{t:"Reassurance is building the patient's confidence or restoring his confidence through understanding the ___ of an experience to the patient.",o:["cost","meaning","duration","location"],a:1},
{t:"Patient behavior is changed through emotional experience, NOT by ___ interpretation.",o:["emotional","behavioral","rational","physical"],a:2},
{t:"Anxiety is a feeling state in which the individual experiences an intense sensation of ___.",o:["happiness","apprehension","relaxation","indifference"],a:1},

{t:"Any kind of force applied on a psychiatric patient results in psychological ___.",o:["growth","trauma","healing","relief"],a:1},
{t:"Nursing care should be centered on the patient as a person, not on control of ___.",o:["medications","schedules","symptoms","staff"],a:2}
];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 80*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuestions() {
  if (!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟')) return;
  init(QUESTIONS);
}

function init(pool) {
  questions = shuffle([...pool]);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

/* TIMER */
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

/* TOP UI */
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

/* RENDER QUESTION */
function render() {
  updateTop();
  const q = questions[i];
  // Randomize answer choices while keeping the original correct-answer index
  const order = shuffle(q.o.map((_, idx) => idx));
  q._displayOrder = order;
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${order.map((originalIdx, displayIdx) => `
          <div class="opt" id="opt${originalIdx}" onclick="choose(${originalIdx})">
            <div class="opt-letter">${LETTERS[displayIdx] || displayIdx + 1}</div>
            <div class="opt-text">${q.o[originalIdx]}</div>
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

/* CHOOSE */
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🥳</span> <span>ما شاء الله عليك 🎉</span>`
    : `<span class="feedback-icon">😢</span> <span>ركز ونحاول فيها تاني</span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

/* SKIP */
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

/* NEXT */
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

/* FINISH */
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--accent)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})

</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button>
      <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> 

رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* RETRY WRONG */
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* THEME */
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

/* START */
init(QUESTIONS);
</script>
