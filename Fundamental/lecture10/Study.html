<script>
const D=[
["Mobility · Introduction",[
["Motor function and the ability to move involve all parts of the motor nervous system.","الحركة بتعتمد على الجهاز العصبي الحركي كله، مش جزء واحد بس.","زي العربية: الموتور والبطارية والعجل كلهم لازم يشتغلوا عشان تمشي."],
["Injury, malformation or disease to any part of this system will therefore affect the individual’s ability to move.","لو أي جزء في الجهاز ده اتصاب أو فيه عيب خلقي أو مرض، قدرة الشخص على الحركة بتتأثر.","لو عجلة واحدة بنشر، العربية كلها مش هتمشي زي الأول."],
["The motor nervous system includes:","الجهاز الحركي بيتكون من الحاجات اللي جاية.","زي فريق كورة: كل لاعب ليه دور."],
["1- The central nervous system (CNS).","المخ والحبل الشوكي، هما اللي بيدّوا الأوامر.","زي غرفة التحكم اللي بتبعت الأوامر."],
["2- The peripheral nervous system.","الأعصاب اللي برّه المخ والحبل الشوكي، بتوصّل الأوامر للعضلات.","زي أسلاك الكهربا اللي بتوصّل الأمر من اللوحة للمروحة."],
["3- Muscles, ligaments and tendons.","العضلات هي اللي بتتحرك، والأربطة والأوتار بتثبّت وتوصّل العضلة بالعضمة.","العضلة زي الموتور، والوتر زي الحبل اللي بيشدّ."],
["4- The skeleton.","الهيكل العظمي، هو الإطار اللي الجسم متبني عليه.","زي هيكل العمارة الخرسانية."],
["5- The spine and discs.","العمود الفقري والغضاريف اللي بين الفقرات، بيدّوا ثبات ومرونة.","الغضاريف زي المساعدين في العربية، بيمتصّوا الصدمات."],
["Mobility: the ability of a person to move freely and independently from one position or place to another.","الـ Mobility يعني الشخص يتحرك بحرية ومن غير مساعدة، من وضع لوضع أو من مكان لمكان.","إنك تقوم من سريرك وتروح المطبخ لوحدك من غير ما حد يسندك."],
["Examples include: Turning in bed, Sitting at the bedside.","من أمثلتها: إنك تتقلب في السرير، وتقعد على طرف السرير.","المريض اللي يقلب على جنبه لوحده معاه mobility."],
["Functional musculoskeletal and nervous systems are essential for mobility, (A person's ability to move about freely).","لازم العضلات والعظام والأعصاب تكون شغالة كويس عشان الحركة الحرة تحصل.","لو العضلة سليمة والعصب مقطوع، العضلة مش هتتحرك."],
["Immobility: a reduction or complete loss of the ability to move independently.","الـ Immobility يعني قدرة الشخص على الحركة بتقل أو بتروح خالص.","واحد رجله في الجبس مش قادر يمشي لوحده."],
["It may be temporary or permanent.","ممكن تكون مؤقتة أو دايمة.","الكسر بيتلحم فالمشكلة بتروح (مؤقتة)، لكن إصابة النخاع ممكن تفضل (دايمة)."],
["For example, a patient with a fractured leg may have temporary immobility, while a patient with a severe neurological disorder may experience long-term limitations.","مريض رجله مكسورة عنده immobility مؤقتة لحد ما العضمة تلحم، ومريض عنده اضطراب عصبي شديد ممكن حركته تفضل محدودة فترة طويلة.","زي الفرق بين عطل بسيط في العربية بيتصلح، وعطل كبير في الموتور نفسه."],
["Bed rest: Is an intervention in which the client is restricted to bed for therapeutic reasons.","الراحة في السرير تدخّل علاجي، المريض بيتمنع يقوم من السرير لسبب علاجي.","دكتور القلب قال للمريض يلزم السرير كام يوم عشان قلبه يرتاح."],
["h","Importance of Mobility"],
["Mobility is essential for maintaining normal body function.","الحركة ضرورية عشان أجهزة الجسم تشتغل بشكل طبيعي.","زي الماكينة اللي لو وقفت فترة بتصدّي."],
["Regular movement helps maintain:","الحركة المنتظمة بتحافظ على الحاجات دي:","زي ما الجيم بيحافظ على لياقتك، الحركة بتحافظ على أجهزتك."],
["Muscle strength","قوة العضلات.","اللي بيمشي كل يوم رجليه بتفضل قوية."],
["Joint flexibility","مرونة المفاصل.","المفصل اللي بيتحرك زي الباب اللي بيتزيّت، مش بيهنّج."],
["Cardiovascular function","وظيفة القلب والأوعية الدموية.","الحركة بتخلي القلب يضخ الدم بكفاءة."],
["Respiratory function","وظيفة التنفس.","لما تتحرك بتتنفس أعمق فالرئة بتتهوّى كويس."],
["Bone health","صحة العظام.","العضمة اللي بتشيل وزن وبتتحرك بتفضل أقوى."],
["Gastrointestinal function","وظيفة الجهاز الهضمي.","الحركة بتحرّك الأمعاء فالهضم يمشي."],
["Urinary function","وظيفة الجهاز البولي.","الحركة بتساعد البول ينزل ويفضّي المثانة."],
["Psychological well-being","الراحة النفسية.","اللي بيتحرك ويخرج بيبقى مزاجه أحسن من اللي حابس نفسه."],
["Independence in activities of daily living","الاستقلالية في أنشطة الحياة اليومية.","يأكل ويلبس ويدخل الحمام لوحده من غير ما يطلب مساعدة."]
]],
["Degrees of mobility",[
["1. Complete immobility e.g. unconscious patient.","عدم حركة كامل، زي المريض فاقد الوعي.","مريض في غيبوبة مش بيحرّك أي حاجة."],
["2. Partial mobility e.g. patient with fracture.","حركة جزئية، زي مريض عنده كسر.","مريض كسر في رجله بيحرك إيديه وجسمه بس رجله لأ."],
["3. Disuse atrophy: Has been used to describe the pathological reduction in normal size of muscle fibers after prolonged inactivity from bed rest, trauma, casting, or local nerve damage.","ضمور عدم الاستخدام: يعني ألياف العضلة بتصغر عن حجمها الطبيعي بشكل مرضي بعد مدة طويلة من عدم الحركة بسبب الراحة في السرير أو إصابة أو جبس أو تلف عصب موضعي.","زي اللي شال الجبس بعد شهر ولقى رجله أنحف من التانية."]
]],
["Factors that may affect mobility",[
["The factors that may affect mobility may be:","العوامل اللي ممكن تأثر على الحركة هي:","زي أسباب كتير ممكن توقف عربية، مش سبب واحد."],
["1- Physical arising from altered structures, function or processes of movement, for instance weakness arising from conditions such as anemia, neurological or muscular impairment, or fractures.","عوامل جسدية: تغيّر في تركيب أو وظيفة أو عملية الحركة، زي الضعف بسبب أنيميا أو مشكلة عصبية أو عضلية أو كسور.","واحد عنده أنيميا تعبان وضعيف فمش قادر يقوم."],
["2- Psychological including depression, fear and anxiety (particularly in older people) and altered body image, for example stroke or amputation.","عوامل نفسية: زي الاكتئاب والخوف والقلق (خصوصاً عند كبار السن) وتغيّر صورة الجسم، زي بعد جلطة أو بتر.","راجل كبير خايف يقع فبيقعد ومبيتحركش."],
["3- Pain including that affecting general joint/muscle movement.","الألم، وخصوصاً اللي بيأثر على حركة المفاصل والعضلات عموماً.","اللي ركبته بتوجعه بيتجنب المشي."],
["4- Environmental/social : such as poor housing, wet floors, inappropriate footwear, bed height, lack of assistive devices","عوامل البيئة والمجتمع: زي سكن وحش، أرضية مبلولة، جزمة مش مناسبة، ارتفاع السرير، ومفيش أدوات مساعدة.","أرضية الحمام مبلولة فالمريض خايف يمشي عليها."],
["5-Treatment-related factors: as surgery, intravenous lines, urinary catheters, drains, casts, traction, sedative medications","عوامل مرتبطة بالعلاج: زي العمليات، الكانيولا الوريدية، القسطرة البولية، التصريف، الجبس، الشد، والأدوية المهدئة.","مريض متوصّل بكانيولا وقسطرة وdrain، حركته متقيدة بالأجهزة دي."]
]],
["Effect of immobility on physiological condition",[
["Effect of immobility on physiological condition of patients: Including changes in the following systems:","تأثير عدم الحركة على حالة المريض الفسيولوجية، وبيشمل تغيرات في الأجهزة دي:","زي ما عطل واحد في مصنع بيأثر على كل الخطوط."],
["1. Respiratory system","الجهاز التنفسي.","الرئة بتتأثر لو المريض نايم على ضهره طول الوقت."],
["2. Cardiovascular system.","الجهاز القلبي الوعائي.","الدم بيتجمع في الرجلين لو مفيش حركة."],
["3. Musculoskeletal system.","الجهاز العضلي الهيكلي.","العضلات بتضعف والمفاصل بتتيبّس."],
["4. Integumentary system.","الجلد.","الجلد اللي بيستحمل ضغط مستمر بيتقرّح."],
["5. Urinary system.","الجهاز البولي.","البول بيركد في المثانة."],
["6. Fecal elimination.","إخراج البراز.","الأمعاء بتكسل فيحصل إمساك."],
["7. Neurosensory system.","الجهاز العصبي الحسي.","المريض بيتأثر نفسياً وإدراكياً من الملل والعزلة."]
]],
["1. Respiratory changes",[
["Immobility can decrease effective lung expansion and may contribute to retained respiratory secretions.","عدم الحركة ممكن يقلل تمدد الرئة بشكل فعّال وممكن يخلي الإفرازات التنفسية تفضل محبوسة.","زي البالون اللي مش بتنفخه كويس، مش بيتمدد كله."],
["Potential complications include:","المضاعفات المحتملة:","دي المشاكل اللي ممكن تحصل في الآخر."],
["Reduced ventilation","قلة التهوية.","هوا أقل بيدخل الرئة."],
["Atelectatic changes","تغيّرات انخماص الرئة (atelectasis).","الحويصلات بتنكمش وتقفل زي بالونة اتفشّت."],
["Retained secretions","إفرازات محبوسة.","البلغم قاعد في الصدر مش عارف يطلع."],
["Increased risk of respiratory infection","زيادة خطر عدوى الجهاز التنفسي.","البلغم الراكد مكان كويس للميكروبات تتكاثر."],
["Nursing Interventions for respiratory changes:","التدخلات التمريضية للتغيرات التنفسية:","دي اللي الممرضة بتعمله عشان تمنع المشاكل اللي فاتت."],
["Aim: Maintain airway patency, achieve optimal lung expansion and gas exchange, and mobilize airway secretions.","الهدف: الحفاظ على المجرى الهوائي مفتوح، وتحقيق أفضل تمدد للرئة وتبادل غازات، وتحريك الإفرازات.","زي ما بتفتح الأنبوبة المسدودة عشان الميّه تجري."],
["Put patient in upright positioning","خلّي المريض في وضع قاعد/معتدل.","وهو قاعد الرئة بتتمدد أحسن من وهو نايم."],
["Teach patient deep breathing and coughing exercise","علّم المريض تمارين التنفس العميق والكحة.","شهيق عميق وكحة قوية بتطلّع البلغم."],
["Appropriate activity and mobilization","نشاط وتحريك مناسب للمريض.","مشي بسيط حسب حالته."],
["Incentive spirometry when prescribed or indicated","استخدام جهاز الـ incentive spirometer لما يكون مكتوب أو مطلوب.","جهاز بينفخ فيه المريض عشان يوسّع رئته."],
["Changing position and exercise every 1 to 2 hrs.","غيّر الوضع واعمل تمارين كل ساعة لساعتين.","زي المنبه: كل ساعتين اتحرك."]
]],
["2. Cardiovascular changes",[
["The three major changes are:","التغيرات الرئيسية التلاتة هي:","هنشرحهم واحد واحد."],
["Orthostatic hypotension","هبوط الضغط الانتصابي.","تقوم بسرعة فتحس بدوخة."],
["Venous stasis","ركود الدم في الأوردة.","الدم بيتجمع في الرجلين زي المياه الراكدة."],
["Peripheral edema","تورّم الأطراف.","الرجلين بتورم من السوايل المتجمعة."],
["Reduced cardiovascular tolerance","قلة تحمّل القلب والأوعية للمجهود.","واحد بقاله شهر في السرير، يمشي خطوتين يتهجّ."],
["Orthostatic hypotension: This occurs when blood pressure falls significantly after changing position, particularly when moving from lying to sitting or standing.","ده بيحصل لما الضغط ينزل كتير بعد تغيير الوضع، خصوصاً من نايم لقاعد أو واقف.","قمت من السرير فجأة، الدم نزل من راسك، الدنيا لفّت."],
["The patient may experience: Dizziness, Weakness, Fainting","المريض ممكن يحس بـ: دوخة، ضعف، إغماء.","الدماغ بتاخد دم أقل لحظة فبتتلخبط."],
["Therefore, when mobilizing a patient who has been on bed rest, do not move them rapidly from lying to standing.","عشان كده، لما تحرّك مريض كان على راحة سرير، متنقلوش بسرعة من نايم لواقف.","زي ما بتفتح الباب بالراحة عشان ميخبطش فيك."],
["Instead:","بدل كده:","اتبع الخطوات دي بالترتيب."],
["1. Raise the head of the bed.","ارفع راس السرير.","ابدأ بالتدريج، مش مرة واحدة."],
["2. Help the patient sit.","ساعد المريض يقعد.","مسنده من ضهره وكتفه."],
["3. Allow time for adjustment.","اديله وقت يتأقلم.","استنى دقيقة يتعوّد على الوضع."],
["4. Assess for dizziness.","اسأله وقيّم لو عنده دوخة.","اسأل: دايخ؟ شايف عادي؟"],
["5. Assist the patient to stand.","ساعده يقف.","وقّفه وانت ماسكه."],
["6. Continue monitoring.","كمّل مراقبة.","فضل متابعه وهو واقف ومشي."],
["Nursing Interventions for Cardiovascular changes:","التدخلات التمريضية للتغيرات القلبية الوعائية:","الخطوات اللي تمنع المشاكل القلبية."],
["Aim: Maintain cardiovascular function, increase activity tolerance, and prevent thrombus formation.","الهدف: الحفاظ على وظيفة القلب والأوعية، وزيادة تحمّل النشاط، ومنع تكوّن الجلطات.","الدم لازم يفضل جاري عشان ميتجلطش."],
["Movement and exercise.","حركة وتمارين.","تحريك الرجلين وهو في السرير بيحرّك الدم."],
["Use vertical positions.","استخدم الأوضاع الرأسية (قاعد/واقف).","الجاذبية بتساعد الدورة الدموية."],
["Encourage normal breathing pattern.","شجّع نمط تنفس طبيعي.","من غير حبس نفس أو شد."],
["Elastic stocking.","الشراب الضاغط (elastic stocking).","بيضغط على الرجلين فمبيسيبش الدم يركد."]
]],
["3. Musculoskeletal changes",[
["Immobility leads to permanent impairment of mobility which causing:","عدم الحركة بيؤدي لضعف دايم في الحركة، وده بيسبب:","لو سبت الحاجة من غير استخدام بتتلف."],
["Muscle weakness","ضعف العضلات.","العضلة اللي مش بتتستخدم بتفقد قوتها."],
["Muscle atrophy","ضمور العضلات.","العضلة بتصغر وتنحف."],
["Decreased muscle tone","قلة شدّ العضلات.","العضلة بتبقى رخوة."],
["Joint stiffness","تيبّس المفاصل.","المفصل مش بيتني بسهولة."],
["Contractures","تقلّصات دايمة.","العضلة بتتقصر وتشدّ المفصل."],
["Loss of bone density","فقدان كثافة العظام.","العضمة بتبقى هشّة."],
["Increased risk of osteoporosis","زيادة خطر هشاشة العظام.","العضمة بتتكسر بسهولة."],

["A pressure ulcer, or decubitus ulcer, Is the consequence of ischemia and anoxia to tissue.","قرحة الضغط أو decubitus ulcer هي نتيجة نقص تروية ونقص أكسجين للنسيج.","زي لما تفضل قاعد على رجلك فتنمّل، بس لو استمر الجلد بيموت."],
["Tissues are compressed, blood diverted, and blood vessels powerfully constricted by continual pressure on the skin and underlying structures; thus cellular respiration is impaired, and cells die.","الأنسجة بتتضغط، والدم بيتحوّل بعيد، والأوعية بتضيق جامد بسبب الضغط المستمر على الجلد والأنسجة اللي تحته، فتنفس الخلايا بيتأثر والخلايا بتموت.","لو ضغطت على خرطوم الميّه مدة طويلة، الميّه متوصلش للآخر."],

["Pressure Areas","مناطق الضغط (مكتوبة تحت صورة في المحاضرة).","العضم البارز زي الكعب والعصعص هي أكتر مناطق بتتعرض للضغط."],
["Nursing Interventions for integumentary changes","التدخلات التمريضية لتغيرات الجلد.","الخطوات اللي تحمي الجلد."],
["Assess pressure-injury risk.","قيّم خطر إصابات الضغط.","اعرف مين أكتر عرضة قبل ما تحصل مشكلة."],
["Reposition according to the individualized care plan.","غيّر الوضع حسب خطة الرعاية الخاصة بالمريض.","كل مريض ليه جدول قلب مناسب له."],
["Inspect the skin regularly.","افحص الجلد بانتظام.","بص على مناطق الضغط كل يوم."],
["Keep the skin clean and dry.","خلي الجلد نضيف وناشف.","الرطوبة بتسهّل التقرّح."],
["Reduce pressure and shear.","قلل الضغط والاحتكاك/الشدّ (shear).","متسحبوش المريض على السرير، ارفعه."],
["Encourage mobility whenever safe.","شجّع الحركة طالما آمنة.","أي حركة بتخفف الضغط."],

["Activity and Exercise",[
["Muscles that are not used become weak and shortened during prolonged bed rest, strength and endurance decrease rapidly.","العضلات اللي مش بتتستخدم بتضعف وتقصر في الراحة الطويلة، والقوة والتحمل بيقلوا بسرعة.","الإسبوع في السرير ممكن يعمل فرق كبير."],
["Patient can regain muscle strength and mobility by practicing specific groups of exercises daily.","المريض يقدر يرجّع قوة العضلات والحركة بممارسة مجموعات تمارين معينة كل يوم.","زي اللي بيرجّع لياقته بالجيم بالتدريج."],
["Regular exercise contributes to a healthy body; therefore, immobility has a negative effect.","التمارين المنتظمة بتساهم في جسم صحي، عشان كده عدم الحركة ليه تأثير سلبي.","اللي بيتمرن بيبقى أصحّ."],
["The purpose of exercises","هدف التمارين.","ليه بنعملها؟"],
["1- To promote proper alignment,","تعزيز استقامة الجسم الصحيحة.","جسم معدول."],
["2- To prevent contractures and atrophy of muscles,","منع التقلصات وضمور العضلات.","العضلة متتشدّش وتضمر."],
["3- To stimulate circulation,","تنشيط الدورة الدموية.","الدم يجري."],
["4- To prevent thrombophlebitis and pressure ulcer,","منع التهاب الوريد الخثاري وقرحة الضغط.","الدم ميتجلطش والجلد ميتقرّحش."],
["5- To reduces joint pain and stiffness,","تقليل ألم وتيبّس المفاصل.","المفصل يفضل مرن."],
["6- To increases flexibility and endurance,","زيادة المرونة والتحمل.","يتعب أقل."],
["7- To prevents edema of the extremities, and","منع تورم الأطراف.","السوايل متتجمعش في الرجلين."],
["8- To promotes lung expansion.","تعزيز تمدد الرئة.","رئة أحسن تهوية."]
]],
["Types of exercises",[
["1-Passive exercises: are carried out by the therapist or nurse without assistance from the patient. These exercises enable the patient to retain as much joint range of motion as possible, as well as stimulating circulation.","التمارين السلبية: بيعملها المعالج أو الممرضة من غير مشاركة المريض، وبتخلي المريض يحتفظ بأكبر مدى حركي للمفصل وبتنشّط الدورة الدموية.","مريض في غيبوبة، الممرضة بتحرّك إيده ورجله."],
["2- Active assistive exercises: these exercises are performed by the patient with assistance from the nurse. Active assistive exercises encourage normal muscle function.","التمارين الفعالة المساعَدة: المريض بيعملها وهو واخد مساعدة من الممرضة، وبتشجّع وظيفة العضلة الطبيعية.","المريض بيرفع إيده والممرضة بتسنده."],
["3- Active exercises: although supervised by the nurse, are performed by the patient. These exercises increase muscle strength when the patient is partially immobile.","التمارين الفعالة: المريض هو اللي بيعملها بإشراف الممرضة، وبتزوّد قوة العضلة لما المريض يكون حركته جزئية.","المريض بيرفع رجله لوحده والممرضة واقفة تتابع."],
["4-Resistive exercises: these are active exercises performed by the patient by pulling or pushing an opposing force in order to increase muscle power.","التمارين المقاومة: تمارين فعالة بيعملها المريض بالشد أو الدفع ضد قوة مقاومة عشان يزوّد قوة العضلة.","زي رفع الأثقال أو الضغط على كورة مطاط."],
["5-Range of motion (ROM) exercises are the most common form of exercises for maintaining joint mobility and increasing maximal motion of a joint when the client is totally or partially immobilized. These exercises are completed by the nurse or physical therapist.","تمارين المدى الحركي (ROM) هي أشهر نوع تمارين للحفاظ على حركة المفصل وزيادة أقصى حركة له لما المريض يكون مش بيتحرك كلياً أو جزئياً. وبتتعمل بواسطة الممرضة أو أخصائي العلاج الطبيعي.","تحرّك مفصل الكوع من فرد لثني لآخره."]
]],
["Common terminology related to exercise",[
["Abduction: Moving away from the median line","الإبعاد: الحركة بعيد عن الخط الأوسط للجسم.","ترفع دراعك جنب بعيد عن جسمك."],
["Adduction: Moving towards the median line","التقريب: الحركة ناحية الخط الأوسط.","تنزّل دراعك لجنبك."],
["Circumduction: Moving through a circle, in combination","الحركة الدائرية: حركة في دايرة بتجمع أكتر من حركة.","تلف دراعك في دايرة زي الطاحونة."],
["Contraction: Shortening or drawing together","الانقباض: التقصير أو الشدّ لبعض.","تعمل بايسبس بتشد العضلة."],
["Dependent: Unable to help, needs full assistance to achieve task","اعتمادي: مش قادر يساعد ومحتاج مساعدة كاملة لإنجاز المهمة.","مريض مش قادر ياكل ولا يلبس من غير مساعدة."],
["Independent: Needs no assistance with task","مستقل: مش محتاج مساعدة في المهمة.","يقدر يعمل كل حاجة لوحده."],
["Dorsal: Relating to the back","ظهري: يخص الضهر.","الجهة الخلفية."],
["Dorsiflexion: Bending of the foot and toes upwards","ثني ظهري: ثني القدم والأصابع لفوق.","ترفع مقدمة رجلك لفوق ناحية السما."],
["Extension: Straightening","البسط: فرد المفصل.","تفرد كوعك."],
["External rotation: Rolling outwards","دوران خارجي: اللفّ لبرّه.","تلف رجلك لبرّه."],
["Internal rotation: Rolling inwards","دوران داخلي: اللفّ لجوّه.","تلف رجلك لجوّه."],
["Hemiparesis: Weakness /paralysis on one side of the body","ضعف نصفي: ضعف أو شلل جزئي في جانب واحد من الجسم.","بعد جلطة، الإيد والرجل اليمين ضعفانين."],
["Hemiplegia: Paralysis on one side of the body","شلل نصفي: شلل كامل في جانب واحد من الجسم.","الجانب الشمال مش بيتحرك خالص."],
["Contractures: Deformity caused by shortening of muscles, tendons and ligaments","التقلصات: تشوه ناتج عن تقصير العضلات والأوتار والأربطة.","الإيد متثنية ومتفردش."]
]],
["Nursing care for immobilized patient",[
["h","1- Nursing assessment"],
["Before mobilizing a patient, the nurse should perform an appropriate assessment.","قبل ما تحرّك المريض، الممرضة لازم تعمل تقييم مناسب.","زي ما بتكشف على الطريق قبل ما تسوق."],
["Assess:","قيّم:","ده اللي هتقيّمه."],
["Muscle strength","قوة العضلات.","هل يقدر يرفع إيده؟"],
["Balance","التوازن.","هل يقف من غير ما يتمايل؟"],
["Coordination","التناسق الحركي.","هل حركاته منتظمة؟"],
["Range of motion","المدى الحركي.","كام درجة يقدر يحرّك المفصل؟"],

["Cardiovascular status","الحالة القلبية الوعائية.","النبض والضغط."],
["Respiratory status","الحالة التنفسية.","معدل التنفس وهل في ضيق نفس."],
["Activity tolerance","تحمّل النشاط.","يقدر يتحرك قد إيه من غير ما يتعب؟"],
["Assessing Activity Tolerance: Activity tolerance is the ability to perform activity without experiencing excessive physiological stress.","تقييم تحمّل النشاط: هو القدرة على أداء النشاط من غير ضغط فسيولوجي زايد.","تقدر تطلع سلالم من غير ما تلهث بزيادة."],
["Observe for:","لاحظ:","علامات إنه مش متحمل."],
["Shortness of breath","ضيق نفس.","يتنفس بصعوبة."],
["Chest discomfort","انزعاج في الصدر.","وجع أو ضغط في الصدر."],
["Dizziness","دوخة.","الدنيا بتلف."],
["Excessive fatigue","تعب زايد.","مرهق جداً بعد حركة بسيطة."],

["Pallor","شحوب.","وشه بقى أصفر."],
["Cyanosis","زرقة.","شفايفه أو أطرافه زرقا."],

["Significant blood-pressure changes","تغيّرات كبيرة في الضغط.","ضغطه ينزل أو يطلع فجأة."],
["h","2- Examples of NANDA nursing diagnosis related to impaired mobility"],
["1- Impaired physical mobility R/T reduced range of motion, bed rest, decreased strength.","اضطراب الحركة الجسدية مرتبط بقلة المدى الحركي، الراحة في السرير، وقلة القوة.","المريض مش قادر يتحرك بسبب الجبس والضعف."],
["2- Ineffective breathing pattern r/t decreased lung expansion, accumulation of pulmonary secretions, improper body positioning.","نمط تنفس غير فعال مرتبط بقلة تمدد الرئة، تراكم الإفرازات الرئوية، ووضع جسم غير مناسب.","المريض نايم مسطح والبلغم متراكم فنفسه تقيل."],
["3- Impaired skin integrity r/t restricted mobility, pressure on skin’s surface, shearing force.","اضطراب سلامة الجلد مرتبط بتقييد الحركة، الضغط على سطح الجلد، وقوة الشدّ (shear).","الجلد بيتجرح من الضغط والاحتكاك."],
["4- Risk for fluid volume deficit r/t decreased fluid intake.","خطر نقص حجم السوايل مرتبط بقلة شرب السوايل.","المريض مش بيشرب كفاية فممكن يجفّ."],
["5- Ineffective individual coping r/t reduced activity level, social isolation.","تكيّف فردي غير فعال مرتبط بقلة النشاط والعزلة الاجتماعية.","مريض لوحده في أوضة مبيتحركش فبيتعب نفسياً."],
["h","3- Nursing planning to Promote Mobility"],
["The patient will demonstrate improved mobility and perform movement safely with the appropriate level of assistance.","المريض هيظهر تحسن في الحركة وهيتحرك بأمان بمستوى المساعدة المناسب.","يقوم من السرير بمساعدة بسيطة من غير ما يقع."],
["The patient will gradually increase activity without excessive fatigue, dyspnea, dizziness, or other adverse symptoms.","المريض هيزوّد نشاطه تدريجياً من غير تعب زايد أو ضيق نفس أو دوخة أو أعراض سلبية.","النهاردة خطوتين، بكرة خمسة، من غير ما يتعب."],
["h","4- Nursing implementation to Promote Mobility"],
["Our goal is to promote the highest safe level of independence.","هدفنا نعزّز أعلى مستوى آمن من الاستقلالية.","نخليه يعتمد على نفسه قد ما يقدر بأمان."],
["Important interventions include:","التدخلات المهمة بتشمل:","دي أهم الخطوات."],
["1. Encourage independence","شجّع الاستقلالية.","سيبه يعمل اللي يقدر عليه."],
["Allow patients to perform activities they can safely perform themselves.","اسمح للمرضى يعملوا الأنشطة اللي يقدروا يعملوها بأمان لوحدهم.","لو يقدر يمسك الكوباية، سيبه يمسكها."],
["Do not do everything for the patient unnecessarily.","متعملش كل حاجة للمريض من غير لزوم.","لو عملت كل حاجة هو هيتعوّد على الاعتماد."],
["2. Increase activity gradually","زوّد النشاط بالتدريج.","زي ما الطفل بيتعلم يمشي خطوة خطوة."],
