<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--a:#be123c;--c2:#1d4ed8;--c3:#d97706;--c4:#0d9488;--grad:linear-gradient(135deg,#9f1239 0%,#be123c 30%,#5b21b6 70%,#1e3a8a 100%);--bg:#faf6f6;--bg2:#f3eaec;--card:#fff;--t:#2a1519;--t2:#5b4348;--bc:rgba(80,20,35,.09)}
[data-theme=dark]{--a:#fb7185;--c2:#60a5fa;--c3:#fbbf24;--c4:#2dd4bf;--bg:#130a0d;--bg2:#1c1015;--card:#25161c;--t:#f5e9ec;--t2:#d4bcc2;--bc:rgba(255,255,255,.09)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--t);line-height:1.7}
#pb{position:fixed;top:0;left:0;height:3px;z-index:9;background:linear-gradient(90deg,var(--a),var(--c3),var(--c4),var(--c2));width:0}
nav{position:fixed;top:0;left:0;right:0;z-index:5;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--card);border-bottom:1px solid var(--bc)}
.br{font-weight:900;display:flex;gap:9px;align-items:center}.lg{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#be123c,#1d4ed8);color:#fff;display:grid;place-items:center;font-size:12px}
button{font:inherit;cursor:pointer}.th{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card)}
.hero{margin-top:60px;background:var(--grad);color:#fff;text-align:center;padding:36px 20px}.hero h1{font-size:clamp(22px,4vw,32px);font-weight:900}.hero p{opacity:.9;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 70px}
h2{font-size:18px;font-weight:900;margin:30px 0 12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bc);border-left:5px solid var(--a);direction:ltr}
.it{background:var(--card);border:1px solid var(--bc);border-radius:16px;margin-bottom:12px;overflow:hidden}
.en{padding:14px 16px;font-weight:700;direction:ltr;text-align:left;font-size:15px}
.ar{padding:12px 16px;direction:rtl;text-align:right;background:rgba(29,78,216,.06);border-top:1px solid var(--bc);font-size:15px}
.ex{padding:12px 16px;direction:rtl;text-align:right;background:rgba(217,119,6,.08);border-top:1px solid var(--bc);font-size:14px;color:var(--t2)}.ex b{color:var(--c3)}
.im{text-align:center;margin-bottom:12px}.im img{max-width:100%;border-radius:12px;border:1px solid var(--bc);background:#fff}
.im.g{display:flex;gap:8px;justify-content:center}.im.g img{width:32%;object-fit:cover}
</style></head><body>

const S=[
{h:'Health assessment',i:[
{img:'tools'},
['Health Assessment Physical assessment is an organized systemic process of collecting objective data based on head-to-toe examination','التقييم الصحي هو عملية منظمة بتجمع بيانات موضوعية (حاجات تتشاف وتتقاس) بفحص المريض من الراس للرجلين.','زي ما تفتش البيت أوضة أوضة بترتيب عشان متنساش حاجة، الممرض بيفحص الجسم بترتيب من فوق لتحت.'],
['Includes knowledge of developmental stages throughout the life cycle, Includes physical, mental and psychosocial assessment.','التقييم لازم تعرف فيه مراحل النمو في كل عمر، وبيشمل الجسم والعقل والنفسية والاجتماع.','تقييم طفل مش زي تقييم راجل كبير، وكمان مش بتبص على الجسم بس، بتبص على حالته النفسية والاجتماعية.'],
['Physical Health Assessment: Is an evaluation of the body and its functions using inspection, palpation (feeling with the hands), percussion (tapping with the fingers), and auscultation (listening).','التقييم الجسدي هو تقييم الجسم ووظايفه بأربع طرق: بالعين (inspection)، باللمس باليد (palpation)، بالطرق بالصوابع (percussion)، وبالسمع (auscultation).','بص، المس، اطرق، اسمع: دي الأربع حركات اللي بتعملهم على الجسم.'],
['Complete physical assessment is conducted from head to toe.','الفحص الكامل بيتعمل من الراس للرجلين.','تبدأ بالراس وتنزل لحد الصوابع في الرجل.']]},
{h:'The procedure may vary according to',i:[
['The age<br>The severity of the illness<br>The preference of the nurse<br>The location of the problem','طريقة الفحص بتتغير حسب: سن المريض، وشدة المرض، وتفضيل الممرض، ومكان المشكلة.','لو المريض تعبان قوي أو الوجع في بطنه، مش هتفحصه بنفس طريقة واحد سليم جاي يعمل كشف عادي.']]},
{h:'Purpose of Physical Assessment:',i:[
['To obtain baseline data about the client\'s functional abilities.<br>To confirm data obtained in nursing history.<br>To obtain data that help establish nursing diagnosis and plan of care.<br>To make clinical judgment about the patient\'s health status.<br>To evaluate the outcome of health care.','الغرض من الفحص: تاخد بيانات أساسية عن قدرات المريض، وتأكد المعلومات اللي في التاريخ التمريضي، وتجمع بيانات تساعدك في التشخيص التمريضي وخطة الرعاية، وتحكم على حالة المريض، وتقيّم نتيجة الرعاية.','الفحص زي الصورة الأولى للمريض: تقارن بيها بعدين وتشوف الرعاية نفعت ولا لأ.']]},
{h:'Preparation of the patient',i:[
['Explain the procedure to the client.<br>Explain why it is important.<br>Explain what will happen during physical assessment.<br>Assist the patient to undress and put on a gown.<br>Instruct the patient to empty the bladder before the assessment.<br>Assuring the patient by providing an explanation at each stage of physical examination.','تجهيز المريض: اشرحله الإجراء وليه مهم وإيه اللي هيحصل، ساعده يقلع ويلبس الجاون، قوله يفضي المثانة قبل الفحص، وطمّنه بشرح كل مرحلة.','زي ما الدكتور يقولك "هسمع صدرك دلوقتي" قبل ما يحط السماعة، فمتتخضش.']]},
{h:'Preparation of the Environment',i:[
['The environment should be well lighted.<br>The room should be warm enough to be comfortable to the patient.<br>The equipment should be prepared before the assessment.<br>Providing privacy.','تجهيز المكان: إضاءة كويسة، الأوضة دافية ومريحة، الأدوات جاهزة قبل الفحص، وتوفر خصوصية.','إضاءة وحرارة وأدوات وستارة: قبل ما تبدأ اتأكد من الأربعة.']]},
{h:'Positioning',i:[['Assisting the patient in the most suitable position for the physical examination.','ساعد المريض يتخذ أنسب وضع للفحص.','لو بتفحص البطن مثلاً، المريض بيكون في وضع يسهّل عليك الفحص ويريّحه.']]},
{h:'Draping',i:[['Drapes should be arranged so the area to be assessed is exposed and other body areas are covered.<br>Drapes provide privacy and warmth.<br>Drapes are made of cloth or bed linen.','الغطا بيتظبط بحيث المنطقة اللي بتفحصها تبان وباقي الجسم يتغطى، وبيوفر خصوصية ودفا، وبيتعمل من قماش أو ملايات السرير.','بتكشف المنطقة اللي بتفحصها بس، وباقي المريض متغطي بملاية.']]},
{h:'Preparing Instrument',i:[['All equipment required for physical assessment should be<br>Clean<br>In a good working order<br>Accessible','كل الأدوات المطلوبة للفحص لازم تكون نضيفة، شغالة كويس، وفي المتناول.','متدورش على السماعة وإنت واقف قدام المريض: جهزها نضيفة وتشتغل وحطها جنبك.']]},
{h:'Methods of Physical Examination:4 techniques are used in the physical examination:',i:[
['Inspection<br>Palpation<br>Percussion<br>Auscultation','فيه 4 طرق للفحص الجسدي: الفحص بالنظر، باللمس، بالطرق، وبالسمع.','عين، إيد، طرق، ودن.'],
{img:'tech'},
['1-Inspection: is the visual examination (examination of the body using the sense of sight -assessing by eye).','الـ inspection هو الفحص بالنظر، يعني بتفحص الجسم بحاسة النظر بعينك.','تبص على المريض وتلاحظ شكله ولونه من غير ما تلمسه.'],
['Nurses use visual assessment to assess:<br>Moisture<br>Color<br>Shape<br>Position<br>Size<br>Symmetry of the body','الممرض بيستخدم النظر عشان يقيّم: الرطوبة، اللون، الشكل، الوضع، الحجم، وتماثل الجسم.','تبص: الجلد مبلول ولا ناشف؟ لونه عادي؟ الجنبين متساويين؟'],
['2- Palpation<br>Is the examination of the body using the sense of touch.','الـ palpation هو فحص الجسم باللمس.','إنت بتحس بإيدك بدل ما تبص بعينك.'],
['The pads of the fingers are used because their concentration of nerve ending.','بنستخدم رمم الصوابع لأن فيها تجمع كبير من النهايات العصبية.','طرف صباعك أحس من ضهر إيدك، زي ما بتحس بنعومة حاجة بطرف صباعك.']]},
{h:'Several types of palpation can be used to perform an assessment:',i:[
['1. Light palpation: press down into the area of the body about (usually pressing down 1-2) centimeters. Feel the surface structure using a circular motion. Use this technique to feel for pulses, tenderness, surface skin texture, temperature, and moisture.','اللمس الخفيف: بتضغط على المنطقة حوالي 1-2 سم وتحس بالسطح بحركة دايرية، وبتستخدمه عشان تحس بالنبض والوجع وملمس الجلد والحرارة والرطوبة.','زي ما بتمسح سطح الطاولة بخفة وتشوف ناعم ولا خشن.'],
['2.Deep palpation: Place your dominant hand on the skin surface and your non- dominant hand on top of your dominant hand to apply pressure. This should result in a surface depression between4-5 cm. This allows you to feel very deep organs or structures that are covered by thick muscle.','اللمس العميق: حط إيدك الأساسية على الجلد والإيد التانية فوقها وإضغط، بحيث الجلد يتنزل 4-5 سم، وده بيخليك تحس بالأعضاء العميقة اللي عليها عضل تخين.','بتضغط بالإيدين فوق بعض عشان توصل لعضو تحت عضلة تخينة.'],
['3.Bimanual palpation: Use two hands, placing one on each side of the body part (e.g., uterus, breasts, spleen) being palpated. Use one hand to apply pressure and the other hand to feel the structure. Note the size, shape, consistency, and mobility of the structures you palpate.','اللمس بالإيدين: بتحط إيد على كل جنب من العضو (زي الرحم والثدي والطحال)، واحدة بتضغط والتانية بتحس بالعضو، وتلاحظ الحجم والشكل والقوام والحركة.','زي ما تمسك كرة بين إيديك: واحدة تضغط والتانية تحس بيها.'],
['Bimanual palpation   Deep palpation   Light palpation','الصور دي بتوضح الأنواع التلاتة: بالإيدين، العميق، والخفيف.','قارن وضع الإيدين في كل صورة بالوصف اللي فوق.'],
{imgs:['bi','deep','light']}]},
{h:'Principles for Accurate Palpation',i:[
['1.Examiner finger nails should be short.<br>2.Use sensitive part of the hand.<br>3.Start with light then deep palpation<br>4.Tender area are palpated last','مبادئ اللمس الدقيق: ضوافر الفاحص تكون قصيرة، استخدم الجزء الحساس من الإيد، ابدأ بخفيف وبعدين عميق، والمنطقة اللي بتوجع تتلمس في الآخر.','الضوافر الطويلة بتوجع المريض، ولو لمست مكان الوجع الأول هيتوتر ويقفل عليك.']]},

{h:'',i:[
['5.Tell client to take slow deep breath to enhance muscle relaxation.<br>6.Examine condition of the abdominal organs<br>7.Depressed areas must be approximately “2cm”<br>8.Assess turgor of skin measured by lightly grasping the body part with finger tips.','قوله ياخد نفس عميق وبطيء عشان العضلات ترتخي، افحص حالة أعضاء البطن، المناطق اللي بتتضغط تتنزل حوالي 2 سم، وقيّم مرونة الجلد (turgor) بإنك تمسك الجزء بين طرف صوابعك بخفة.','المريض لو متشنج هتحس بعضلاته قفلت، فالنفس العميق بيريّحه ويسهّل عليك الفحص.']]},
{h:'Principles for Accurate Palpation',i:[
['1.Use sensitive part of the hand.<br>2.Start with light then deep palpation<br>3.Tender areas are palpated last<br>4.Tell client to take slow deep breath to enhance muscle relaxation.<br>5.Examine condition of the abdominal organs<br>6.Depressed areas must be approximately “2cm”<br>7. Assess turgor of skin measured by lightly grasping the body part with finger tips.','نفس المبادئ: استخدم الجزء الحساس من الإيد، ابدأ خفيف وبعدين عميق، المنطقة الموجعة في الآخر، النفس العميق البطيء، افحص أعضاء البطن، الضغط حوالي 2 سم، وقيّم الـ turgor بطرف الصوابع.','القائمة دي متكررة في المحاضرة، فحفظها مرة واحدة يكفي.']]},
{h:'3-Percussion',i:[
['Percussion is a method of tapping body parts with fingers, hands, or small instruments as part of a physical examination. It is done to determine:','الـ percussion هي طريقة الطرق على أجزاء الجسم بالصوابع أو الإيد أو أدوات صغيرة كجزء من الفحص، وبتتعمل عشان نحدد اللي جاي.','زي ما بتخبط على حيطة عشان تعرف هي مصمتة ولا فاضية من جوه.'],
['-The size, consistency, and borders of body organs<br>-The presence or absence of fluid in body areas','حجم الأعضاء وقوامها وحدودها، ووجود سوائل في مناطق الجسم أو عدم وجودها.','الطرق بيقولك العضو كبير ولا صغير، وفيه مية في المنطقة دي ولا لأ.'],
['- Percussion of a body part produces a sound, like playing a drum. --The sound is a sign of the type of tissue within the body part or organ.','الطرق على جزء من الجسم بيطلّع صوت زي الطبلة، والصوت ده دليل على نوع النسيج اللي جوه الجزء أو العضو.','كل نوع نسيج ليه صوت، زي ما الطبلة الفاضية صوتها غير المليانة.'],
['Lungs sound hollow on percussion because they are filled with air.<br>Bones, joints, and solid organs such as the liver sound solid.<br>The abdomen sounds like a hollow organ filled with air, fluid, or solids.','الرئتين صوتهم أجوف لأنهم مليانين هوا، والعظام والمفاصل والأعضاء الصلبة زي الكبد صوتها صلب، والبطن صوتها زي عضو أجوف مليان هوا أو سوائل أو مواد صلبة.','الرئة زي البالونة (أجوف)، والكبد زي حتة لحمة (صلب).']]},
{h:'Methods of percussion:',i:[
['1.Direct method or immediate percussion: Percussion performed directly with the finger or a plexor, without the intervention of another finger or pleximeter. Also called direct percussion.','الطريقة المباشرة: الطرق بالصباع أو الـ plexor على الجسم مباشرة من غير صباع تاني أو pleximeter بينهم، وبتتسمى direct percussion.','بتخبط على الجلد بصباعك على طول.'],
['2.Indirect method or mediate percussion: Percussion effected by the intervention of a finger or a pleximeter between the striking finger or plexor and the part percussed','الطريقة غير المباشرة: الطرق بيتم بوجود صباع أو pleximeter بين الصباع الضارب (plexor) والجزء المطروق.','بتخبط على صباعك هو، وصباعك على الجسم.'],
['Performed by placing the middle finger of the examiner’s non dominant hand “pleximeter hand” firmly against the body surface with palm and fingers remaining off the skin, and the tip of the middle finger of the dominant hand “plexor” strikes the base of the distal joint of the pleximeter. Use a quick & sharp stroke','بتحط الصباع الوسطاني لإيدك غير الأساسية (pleximeter) بثبات على الجسم وباقي الكف والصوابع مرفوعة عن الجلد، وبطرف الوسطاني من إيدك الأساسية (plexor) تضرب قاعدة المفصل الأخير للـ pleximeter بضربة سريعة وحادة.','الإيد اللي على الجسم تلزق بصباع واحد بس، والإيد التانية تنقر عليه نقرة سريعة.'],
['Fist percussion:<br>1) Place one hand flat against body surface.<br>2) Strike the back of hand with the other hand in a fist.','الـ fist percussion: حط إيد مفرودة على الجسم، واضرب ضهرها بالإيد التانية وهي قبضة.','الإيد المفرودة هي الوسيط، والقبضة هي الشاكوش.'],
{imgs:['ptx','fist']}]},

{h:'3-Auscultation “To listen for various breath, heart, and bowel sounds”',i:[
['Listening to body sounds Movement of air (lungs) Blood flow (heart)<br>Fluid & gas movement (bowels)','بتسمع أصوات الجسم: حركة الهوا (الرئتين)، وجريان الدم (القلب)، وحركة السوائل والغازات (الأمعاء).','كل عضو ليه صوته، وإنت بتسمعه بالسماعة.'],
['HOW TO BEGIN…<br>1.Positions for physical exam<br>2.Using a stethoscope<br>3.Hold diaphragm firmly against client’s skin (NOT THROUGH CLOTHING)<br>4.If using bell – less pressure<br>5.Warm in your hands first!<br>6.Listen / Concentrate on the sounds','تبدأ إزاي: ظبط وضع المريض للفحص، استخدم السماعة، امسك الـ diaphragm بثبات على جلد المريض (مش فوق الهدوم)، لو هتستخدم الـ bell اضغط أقل، سخّن السماعة في إيدك الأول، وركز في الأصوات.','السماعة الساقعة بتخض المريض، والهدوم بتعمل صوت يغطي على اللي بتسمعه.']]},
{h:'4-Olfaction',i:[['Another skill that used during assessment, certain alteration is body function create characteristic body odors, smelling can detect abnormalities that unrecognized by other means.','مهارة تانية بتتستخدم في التقييم: التغيرات في وظائف الجسم بتعمل ريحة مميزة، والشم ممكن يكشف مشاكل مش بتتلاحظ بطرق تانية.','ريحة معينة ممكن تقولك فيه مشكلة قبل ما تظهر في أي فحص تاني.']]},

{h:'Assessment of characteristic odors:',i:[
['1.Alcohol odor from oral cavity means ingestion of alcohol.<br>2.Ammonia from urine means urinary tract infection.<br>3. Body odor from skin, particularly in areas where body parts rub together means poor hygiene.<br>4.Bad odor from wound site means wound abscess or infection<br>5.Foul–smelling stools in infant means mal absorption syndrome.','ريحة كحول من الفم يعني شرب كحول، ريحة أمونيا من البول يعني عدوى في المسالك البولية، ريحة عرق من الجلد خصوصاً في الأماكن اللي بتحتك ببعض يعني نظافة شخصية ضعيفة، ريحة وحشة من الجرح يعني خراج أو عدوى، وبراز ريحته وحشة عند الرضيع يعني متلازمة سوء الامتصاص.','كل ريحة ليها معنى: الأمونيا مع البول تفتكر عدوى مسالك، والريحة الوحشة من الجرح تفتكر عدوى.']]},
{h:'Head-to-Toe Assessment: Nursing Guide',i:[
['standard head-to-toe assessment nursing process is organized in a logical sequence that ensures no system is overlooked. Here’s how to perform it, step by step:','الـ head-to-toe assessment بيتعمل بترتيب منطقي يضمن إنك متنساش أي جهاز في الجسم، وده الأسلوب خطوة بخطوة.','زي قايمة تشيك ليست بتمشي عليها بالترتيب.']]},
{h:'1. Identify Your Patient',i:[
['Start by knocking on the patient’s door, introducing yourself, and explaining the purpose of your visit — a nursing head-to-toe assessment.','ابدأ بإنك تخبط على باب المريض، وتعرّفه بنفسك، وتشرحله إنك جاي تعمل head-to-toe assessment.','زي ما تدخل أوضة حد وتستأذن وتقوله إنت مين وجاي ليه.'],
['Ask your patient: “Is it alright if I do this procedure?” Obtaining patient consent is important. You cannot perform the assessment without the patient’s verbal agreement.','اسأل المريض: "ينفع أعمل الإجراء ده؟". موافقة المريض مهمة، ومينفعش تعمل الفحص من غير موافقته الشفهية.','لو قال لأ، مفيش فحص.']]},
{h:'2. Mental Status',i:[
['As you step into the patient’s room, your mental status assessment begins. You can ask your patient the following questions:<br>Can you please tell me where you are?<br>What date is it today?<br>When did you arrive here?<br>What brought you here?','أول ما تدخل أوضة المريض بيبدأ تقييم الحالة العقلية، وتقدر تسأله: إنت فين؟ النهارده كام؟ وصلت هنا إمتى؟ إيه اللي جابك هنا؟','الأسئلة دي بتشوف المريض فاهم المكان والزمان وسبب وجوده ولا لأ.'],
['should match the conversation. How does their speech sound? Is it clear and understandable or is it slurred? Check their mood and behavior — it should usually be appropriate, with the patient being cooperative.','الإجابات لازم تتماشى مع الكلام. شوف كلامه واضح ومفهوم ولا متلخبط؟ وافحص مزاجه وسلوكه، المفروض يكون مناسب والمريض متعاون.','لو كلامه مش واضح أو غير مناسب للموقف، ده بيلفت نظرك.'],
['Next, check their memory — recent and remote. To see how well they remember the past, ask things like when they moved to this city or which school they attended. For recent memory, ask them about today’s lunch. While they answer, you can quickly do the Glasgow Coma Scale, a brief neurological check.','بعد كده افحص الذاكرة القريبة والبعيدة. للبعيدة اسأله مثلاً انتقل المدينة دي إمتى أو راح أنهي مدرسة، وللقريبة اسأله عن غدا النهارده. وأثناء إجابته تقدر تعمل Glasgow Coma Scale، وهو فحص عصبي سريع.','البعيدة: "اتخرجت من أنهي مدرسة؟" والقريبة: "أكلت إيه النهارده؟".'],
['Lastly, assess their thinking and judgment by asking how they feel about their treatment, their general mood today.','أخيراً قيّم تفكيره وحكمه بإنك تسأله حاسس بإيه تجاه علاجه وحالته المزاجية النهارده.','بتشوف بيفكر في علاجه إزاي.']]},
{h:'3. Head',i:[
['The next step in your head-to-toe assessment nursing routine is evaluation of the head, addressing neurological status and cranial nerve function. Start by wearing your gloves because in this step, you’ll do more than just observe — you’ll also palpate.','الخطوة اللي بعدها تقييم الراس، وبيشمل الحالة العصبية ووظيفة الأعصاب القحفية. ابدأ بلبس الجوانتي لأنك مش هتبص بس، هتلمس كمان.','هتلمس فروة الراس، فالجوانتي ضروري.'],
['Head shape: Check the patient’s head and face. Is their head shape in proportion to their body?<br>Hair: Is their hair evenly distributed, clean, and well-groomed?<br>Skin: Examine their skin, which should be intact, and show no unusual colors, marks, or bumps.<br>Symmetry: Look for symmetry in the eyebrows, eyes, nose, mouth corners, and jaw angle. There shouldn’t be any involuntary movements like twitching.','شكل الراس: افحص الراس والوش، شكل الراس متناسب مع الجسم؟ الشعر: موزع بالتساوي ونضيف ومترتب؟ الجلد: سليم ومفيهوش ألوان أو علامات أو نتوءات غريبة؟ التماثل: الحواجب والعيون والأنف وأركان الفم وزاوية الفك، ومفيش حركات لا إرادية زي الرعشة.','قارن الجنب اليمين بالشمال، المفروض زي بعض.'],
['Scalp: Gently feel the scalp and ask if there’s any pain. The scalp should be clean, without lumps, tenderness, or odd indentations.','فروة الراس: المس بلطف واسأل لو فيه وجع. المفروض تكون نضيفة من غير كتل أو ألم أو انبعاجات غريبة.','تحسس بإيدك وإنت بتسأل: بيوجع هنا؟'],
['Then, carefully assess the patient’s eyes, ears, nose, and mouth.','بعد كده قيّم العيون والودان والأنف والفم بعناية.','أربع أعضاء حواس في الراس، واحد واحد.'],
['Eyes: For the eyes, ask if they wear glasses and examine pupil shape and gaze movements. You might use a penlight or ophthalmoscope.','العيون: اسأل لو بيلبس نضارة، وافحص شكل الحدقة وحركات النظر، وممكن تستخدم penlight أو ophthalmoscope.','ركز الضوء الصغير واتابع حركة عينه.'],
['Ears: When looking at the ears, ask about hearing aids and use a penlight. You could do a tuning fork test or whispering test based on your practice. Check for ear pain at the pinna, tragus, and mastoid process.','الودان: اسأل عن سماعة الودن واستخدم penlight، وممكن تعمل tuning fork test أو whispering test حسب شغلك، وافحص الوجع عند الـ pinna والـ tragus والـ mastoid process.','whispering test: تهمس وتشوف بيسمع ولا لأ.'],
['Nose: For the nose, ensure the septum is midline, with no drainage, polyps, or foreign bodies, and that the mucous membranes are pink and moist. Check for nostril patency. Here you can also use your coffee beans to check the patient’s sense of smell.','الأنف: اتأكد إن الحاجز في النص ومفيش إفرازات أو سلائل أو أجسام غريبة، والأغشية المخاطية وردي ورطبة، وافحص إن فتحتي الأنف سالكة، وممكن تستخدم حبوب القهوة لفحص حاسة الشم.','قرّب حبوب القهوة من مناخيره وشوف بيشم ولا لأ.'],
['Mouth: Ask the patient about swallowing issues. Are they wearing dentures? Examine lips, gums, teeth, and use a tongue depressor to view the uvula. Have them stick their tongue out and move it around. Ask them to say ‘light, tight, dynamite’ to check cranial nerves.','الفم: اسأل عن مشاكل البلع وهل بيلبس طقم أسنان، وافحص الشفايف واللثة والأسنان، واستخدم الـ tongue depressor عشان تشوف اللهاة، وخليه يطلّع لسانه ويحركه، وقوله يقول ‘light, tight, dynamite’ لفحص الأعصاب القحفية.','نطق الجملة دي بيكشف لو فيه مشكلة في الأعصاب.']]},
{h:'4. Neck',i:[
['The next step in your head-to-toe assessment nursing process is examination of the neck. Inspect for consistent color and ensure there’s no pallor, cyanosis, lesions, bruising, or masses. Check for jugular venous distention. Is the patient’s trachea in midline position? Is their thyroid gland visible? If visible, it’s not a good sign.','الخطوة اللي بعدها فحص الرقبة: افحص اللون الموحد ومفيش شحوب أو زرقة أو آفات أو كدمات أو كتل، وافحص انتفاخ الوريد الوداجي، والقصبة الهوائية في النص ولا لأ، والغدة الدرقية باينة؟ لو باينة فده مش علامة كويسة.','الرقبة المفروض تكون ملساء ونضيفة ومفيهاش حاجة بارزة.'],
['Then, palpate the carotid artery, one side at a time, ensuring a pulse rate between 60–100 bpm, with regular rhythm and normal intensity. It’s important to assess each side individually because pressing on both carotid arteries at once could cause your patient to faint.','بعد كده المس الشريان السباتي جنب واحد في المرة، وتأكد إن النبض بين 60 و100 في الدقيقة بإيقاع منتظم وقوة عادية. لازم تقيّم كل جنب لوحده لأن الضغط على الاتنين مع بعض ممكن يغمي على المريض.','جنب واحد بس، عشان متقطعش الدم عن الراس.']]},
{h:'5. Anterior Thorax',i:[
['In this part of head-to-toe nursing assessment, begin by inspecting the chest and ensuring the patient’s breathing comfortably. Check for skin color and signs of distress, making sure there are no unusual colorations, moisture, or lesions. Also, assess the chest’s symmetry and look for a barrel chest.','في الجزء ده ابدأ بفحص الصدر بالنظر وتأكد إن المريض بيتنفس براحة، وافحص لون الجلد وعلامات الضيق ومفيش ألوان غريبة أو رطوبة أو آفات، وقيّم تماثل الصدر وشوف لو فيه صدر برميلي.','الصدر البرميلي شكله منتفخ زي البرميل.'],
['Next, palpate five precordial points for tenderness and move on to auscultation for breath and heart sounds, using the diaphragm of the stethoscope. Examine various points, including aortic, pulmonic, Erb’s point, tricuspid, and mitral areas, listening for any irregularities.','بعد كده المس خمس نقاط قدام القلب لو فيها ألم، وانتقل لسماع أصوات التنفس والقلب بالـ diaphragm. افحص النقط: aortic وpulmonic وErb’s point وtricuspid وmitral، واسمع لأي عدم انتظام.','خمس نقاط، وتسمع في كل واحدة.'],
['Use your stethoscope to auscultate breath sounds and the bell to check for extra heart sounds in a z pattern. Normally, there should be no adventitious breath sounds, but normal heart sounds with no murmurs.','استخدم السماعة لسماع أصوات التنفس والـ bell لفحص أصوات القلب الإضافية بنمط حرف z. الطبيعي مفيش أصوات تنفس إضافية، وأصوات القلب عادية من غير murmurs.','ارسم حرف z على الصدر بالسماعة.']]},
{h:'6. Breast',i:[
['As part of the head-to-toe assessment nursing process, you must conduct a thorough breast examination. Start with inspecting the patient’s breasts for symmetry and skin health, and gently palpate the upper chest areas for tenderness, lumps, and masses.','لازم تعمل فحص دقيق للثدي: ابدأ بالنظر للتماثل وصحة الجلد، وبعدين المس بلطف منطقة أعلى الصدر لو فيه ألم أو كتل أو أورام.','نظر الأول وبعدين لمس.'],
['This is also a great opportunity to educate your patients about the importance of monthly breast self-examinations. Remind your male patients that monthly breast checks are important for them, too.','دي فرصة كويسة تثقف المريض بأهمية الفحص الذاتي الشهري للثدي، وفكّر المرضى الرجال إن الفحص الشهري مهم ليهم كمان.','الفحص الذاتي مش للستات بس.']]},
{h:'7. Upper Extremities',i:[
['In the upper extremities assessment, inspect the nails, checking their profile and nail bed color, and ensure good capillary refill. Then, examine the arms, looking for intact skin, even hair distribution, and normal skin color. Assess temperature, mobility, turgor, pain, tenderness, and skin texture. Check your patient’s sense of touch and pain with cotton balls and toothpicks.','في الأطراف العلوية افحص الضوافر: شكلها ولون قاعدة الضفر وتأكد إن الـ capillary refill كويس، وبعدين الدراعات: الجلد سليم وتوزيع الشعر متساوي ولون الجلد عادي. قيّم الحرارة والحركة والـ turgor والألم والحساسية وملمس الجلد، وافحص اللمس والألم بالقطن والخلة.','القطنة للمس الخفيف والخلة للألم.'],
['Additionally, check for edema around the wrists and confirm a good radial pulse with the arms relaxed. Normally, no abnormalities should be noted on assessment.','وكمان افحص وجود ورم (edema) حوالين الرسغ وتأكد من نبض radial كويس والدراعين مرتخيين. الطبيعي إنك مش بتلاحظ أي حاجة غير طبيعية.','النبض بتحسه عند الرسغ من ناحية الإبهام.']]},
{h:'8. Abdomen',i:[
['For the abdominal assessment, begin by asking about the patient’s recent bowel movements and any related issues. Then, inspect the abdomen, checking for appropriate skin color, midline umbilicus, and a flat contour.','في تقييم البطن ابدأ بسؤال المريض عن حركة الأمعاء الأخيرة وأي مشاكل مرتبطة، وبعدين افحص البطن بالنظر: لون الجلد مناسب والسرة في النص والشكل مسطح.','اسأله الأول عن الإخراج وبعدين بص.'],
['Moving on, auscultate the abdomen for bowel and vascular sounds, ensuring they are normal. Then, proceed to palpate for pain, tenderness, and masses in all quadrants. Finally, percuss the abdomen, confirming the presence of tympany throughout, which is a positive sign of good abdominal health.','بعد كده اسمع البطن لأصوات الأمعاء والأوعية وتأكد إنها طبيعية، وبعدين المس لو فيه ألم أو كتل في كل الأرباع، وأخيراً اطرق على البطن وتأكد من وجود tympany في كل مكان، وده علامة إيجابية على صحة البطن.','الترتيب هنا: نظر، سمع، لمس، طرق.']]},
{h:'9. Lower Extremities',i:[
['When performing a nursing head-to-toe assessment, inspect the patient’s thighs, calves, and toes for intact skin, even color, and the absence of lesions, moisture, or edema. Hair should be evenly distributed, and skin should be well-groomed.','افحص الفخاد والسمانة وصوابع الرجل: الجلد سليم واللون متساوي ومفيش آفات أو رطوبة أو ورم، والشعر موزع بالتساوي والجلد نضيف.','من فوق لتحت: الفخذ ثم السمانة ثم الصوابع.'],
['Check for temperature, moving from proximal to distal. Skin should feel warm to touch. Also, palpate for edema, and skin texture, ensuring they are normal.','افحص الحرارة بتتحرك من الأقرب للجسم للأبعد، والجلد المفروض يكون دافي، والمس لو فيه ورم وافحص ملمس الجلد وتأكد إنهم طبيعيين.','proximal يعني قريب من الجسم، distal يعني بعيد عنه.'],
['Finally, check the dorsalis pedis pulse between the big toe and the middle toe, confirming regular rhythm, normal intensity, and symmetry.','أخيراً افحص نبض dorsalis pedis بين الإبهام والصباع الوسطاني، وتأكد من الإيقاع المنتظم والقوة العادية والتماثل بين الرجلين.','قارن نبض الرجل اليمين بالشمال.']]},
{h:'Head-to-Toe Assessment: Nursing Documentation',i:[
