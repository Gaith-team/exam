<style>

:root {

.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }

.opt.correct { border-color:var(--success); background:rgba(21,128,61,.09); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(220,38,38,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }

.feedback-bar.no { background:rgba(220,38,38,.08); color:var(--danger); border:1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:10px; border-right:3px solid var(--c3); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }

.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:20px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(120,20,45,.08); }

.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }

.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:10px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(220,38,38,.1); color:var(--danger); } .ri-right { background:rgba(21,128,61,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#d97706,#be123c); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(190,18,60,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 38px;} }
</style>

<script>
const QUESTIONS = [
{t:"How does the World Health Organization (WHO) define health?",o:["The complete absence of physical disease or infirmity","A state of complete physical, mental, and social well-being, not merely the absence of disease or infirmity","A static biological equilibrium maintained by medical care","High metabolic functioning and adequate physical fitness"],a:1},
{t:"Which of the following is NOT one of the four dimensions that emerge from the WHO definition of health?",o:["Spiritual","Economic","Social","Mental"],a:1},
{t:"A pathological change in the structure or function of the mind or body is called:",o:["Disease","Illness","Wellness","Rehabilitation"],a:0},
{t:"The human response to a disease, heavily shaped by personal perception, symptoms, and coping mechanisms, is called:",o:["Disease","Morbidity","Wellness","Illness"],a:3},
{t:"How many core human dimensions influence an individual's health status, health beliefs, and healthcare behaviors?",o:["Three","Four","Five","Six"],a:2},
{t:"Genetic inheritance, age, and gender belong to which human dimension?",o:["Physical dimension","Emotional dimension","Intellectual dimension","Sociocultural dimension"],a:0},
{t:"Acute illness is characterized by:",o:["Slow, insidious onset and permanent change","Irreversible anatomic alterations requiring long-term care","Rapid onset of severe symptoms and short-term duration (<= 3 months)","Duration of more than 3 months"],a:2},
{t:"Which of the following is a clinical example of chronic illness?",o:["Acute appendicitis","Simple diarrhea","Diabetes mellitus","Acute viral infection"],a:2},
{t:"Morbidity refers to:",o:["The numbers of people who died from a particular disease","The rate or numbers of people affected by a specific disease, disorder, or injury","The cause of an illness that is unexplained","The stage in which a person approaches death"],a:1},
{t:"Mortality denotes:",o:["The incidence of a specific disease or injury","The rate of recovery from illness","The number of people who died from a particular disease or condition","The number of people receiving rehabilitation"],a:2},
{t:"Wellness is best defined as:",o:["The absence of any pathological change in the body","An active state of meeting physical, psychological, and social requirements for appropriate functioning and living a lifestyle that promotes overall health","A passive state in which no symptoms are present","The human response to disease"],a:1},
{t:"According to Potter & Perry, health is:",o:["A fixed state free from symptoms","The absence of pathological change","A dynamic state in which the individual adapts to changes in the internal and external environment to maintain a continuous state of well-being","The ability to perform activities of daily living only"],a:2},
{t:"Which characteristic of health refers to a holistic concern for the individual as a total system?",o:["Environmental adaptation","Role fulfillment","Dynamic process","Total system view"],a:3},
{t:"Continuous interaction and equilibrium between internal biological functions and external living environments describes which characteristic of health?",o:["Environmental adaptation","Total system view","Role fulfillment","Dynamic process"],a:0},
{t:"Acknowledging the individual's active role and responsibility in achieving personal health potential is called:",o:["Total system view","Environmental adaptation","Dynamic process","Role fulfillment"],a:3},
{t:"Long-term stress that alters the endocrine/immune response and anxiety that alters health habits are examples of which dimension?",o:["Physical","Emotional","Intellectual","Environmental"],a:1},
{t:"Cognitive abilities, educational attainment, and health literacy belong to which dimension?",o:["Sociocultural","Physical","Environmental","Intellectual"],a:3},
{t:"Housing quality, sanitation, climate, and air/water pollution belong to which dimension?",o:["Emotional","Sociocultural","Environmental","Physical"],a:2},
{t:"Socioeconomic status, family structure, and cultural beliefs belong to which dimension?",o:["Sociocultural","Intellectual","Emotional","Environmental"],a:0},
{t:"The Agent-Host-Environment model was developed primarily to:",o:["Promote general wellness","Predict disease onset and analyze etiology","Measure health on a sliding scale","Explain compliance with health behaviors"],a:1},
{t:"In the epidemiological triad, the 'agent' is:",o:["The living organism susceptible to disease","All external factors surrounding the host","The nurse who delivers care","An environmental factor, biological pathogen, chemical substance, or physical force whose presence or absence causes disease"],a:3},
{t:"In the epidemiological triad, the 'host' is governed by:",o:["Genetic predisposition, immune status, age, and lifestyle","Physical, social, biological, and economic factors","Radiation and toxic chemicals","Hypersecretion of hormones"],a:0},
{t:"On the Health-Illness Continuum, the central equilibrium point where health is neither acutely impaired nor exceptionally vibrant is the:",o:["Optimal wellness state","Neutral health state","Severe illness state","Terminal stage"],a:1},
{t:"Which model explains and predicts health compliance based on perceptions of susceptibility, severity, benefits, and barriers?",o:["Epidemiological Triad Model","High-Level Wellness Model","Health Promotion Model","Health Belief Model"],a:3},
{t:"The High-Level Wellness Model focuses on:",o:["Predicting disease etiology","Maximizing health potential through continuous balance and purposeful direction within the environment","Illness serving evolutionary viability","Perceived barriers to care"],a:1},
{t:"A nurse administering influenza immunizations at a community clinic is engaged in which level of care?",o:["Secondary prevention","Tertiary prevention","Primary prevention","Palliative care"],a:2},
{t:"Which model is described as a complementary counterpart to health protection, focusing on demographic factors, interpersonal cues, and behavioral motivators?",o:["Health Belief Model","Evolutionary-Based Model","Health Promotion Model","Epidemiological Triad Model"],a:2},
{t:"Which model posits that illness and mortality serve evolutionary viability within social contexts?",o:["Evolutionary-Based Model","Health Belief Model","High-Level Wellness Model","Agent-Host-Environment Model"],a:0},
{t:"Congenital anomalies resulting from intrauterine exposure to viruses, toxins, or teratogenic chemicals are classified under which cause of disease?",o:["Inherited genetic defects","Developmental defects","Physical agents","Biochemical imbalances"],a:1},
{t:"Which pairing of illness type and primary goal of care is CORRECT?",o:["Chronic illness: urgent intervention and rapid cure","Acute illness: rehabilitation and self-management","Chronic illness: sepsis prevention","Acute illness: urgent intervention, symptom relief, and sepsis prevention"],a:3},
{t:"The stage of illness in which the person accepts the sickness, behaves as a sick person, and may use over-the-counter medication or seek medical care is:",o:["Experiencing symptoms","Assuming dependent role","Achieving recovery and rehabilitation","Assuming sick role"],a:3},
{t:"Which stage of illness typically involves a life-threatening attack requiring special medical care that cannot be provided at home, along with self and family education?",o:["Assuming dependent role","Assuming sick role","Experiencing symptoms","Achieving recovery and rehabilitation"],a:0},
{t:"The stage of illness that usually starts at the hospital and concludes at home, with gradual resumption of normal role and function, is:",o:["Assuming sick role","Experiencing symptoms","Achieving recovery and rehabilitation","Assuming dependent role"],a:2},
{t:"An illness whose cause is unexplained, so that treatment focuses on relieving signs and symptoms, is called:",o:["Hereditary illness","Secondary illness","Terminal illness","Idiopathic illness"],a:3},
{t:"Which disorder is present at birth as a result of faulty embryonic development and cannot be genetically predicted?",o:["Hereditary illness","Congenital disorder","Idiopathic illness","Primary illness"],a:1},

{t:"WHO defines health as merely the absence of disease or infirmity.",o:["True","False"],a:1},

{t:"Acute illness lasts 3 months or less, while chronic illness lasts more than 3 months.",o:["True","False"],a:0},
{t:"In chronic illness, pathological changes are usually reversible and the body returns to its baseline state.",o:["True","False"],a:1},
{t:"In the first stage of illness (experiencing symptoms), people usually wait for self-recovery without medical intervention unless things get worse.",o:["True","False"],a:0},
{t:"In the third stage of illness, the patient may need special medical care that cannot be provided at home.",o:["True","False"],a:0},
{t:"Rehabilitation begins only after the patient is discharged from the hospital.",o:["True","False"],a:1},
{t:"The patient must be an active participant in rehabilitation goal setting and in the rehabilitation process.",o:["True","False"],a:0},
{t:"Treatment of idiopathic illness focuses on eliminating the known cause.",o:["True","False"],a:1},
{t:"Morbidity refers to the number of people who died from a particular disease.",o:["True","False"],a:1},
{t:"The Health Belief Model is based on perceptions of susceptibility, severity, benefits, and barriers to care.",o:["True","False"],a:0},
{t:"Housing, sanitation, and air/water pollution belong to the sociocultural dimension.",o:["True","False"],a:1},

{t:"A man develops a cough and fever he did not have before. He believes it will pass and waits a few days without seeking medical care. Which stage of illness is he in?",o:["Experiencing symptoms","Assuming sick role","Assuming dependent role","Achieving recovery and rehabilitation"],a:0},
{t:"A woman's fever persists, so she accepts that she is sick, takes over-the-counter medication, and then visits a clinic. Which stage of illness is she in?",o:["Experiencing symptoms","Assuming dependent role","Assuming sick role","Achieving recovery and rehabilitation"],a:2},
{t:"A patient with myocardial infarction is admitted to the hospital, needs help from health care providers, and his family receives education about the disease process. Which stage of illness is this?",o:["Assuming sick role","Experiencing symptoms","Achieving recovery and rehabilitation","Assuming dependent role"],a:3},
{t:"A patient discharged home after hospitalization gradually restarts his normal role and tries to overcome the dependent patient role. Which stage of illness is this?",o:["Assuming dependent role","Achieving recovery and rehabilitation","Assuming sick role","Experiencing symptoms"],a:1},

];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 30*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerBadge').className = 'timer-badge';
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { l:['#be123c','190,18,60','#9f1239','#be123c','#1e3a8a'], d:['#fb7185','251,113,133'] },
  { l:['#0d9488','13,148,136','#115e59','#0d9488','#0369a1'], d:['#2dd4bf','45,212,191'] },
  { l:['#d97706','217,119,6','#92400e','#d97706','#be123c'], d:['#fbbf24','251,191,36'] },
  { l:['#1d4ed8','29,78,216','#1e3a8a','#1d4ed8','#7c3aed'], d:['#60a5fa','96,165,250'] }
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
