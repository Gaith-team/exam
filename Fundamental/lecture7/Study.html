<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent:#1d4ed8; --accent-rgb:29,78,216; --c2:#5b21b6; --c3:#d97706; --c4:#0d9488;
  --grad:linear-gradient(135deg,#1e1b4b 0%,#1d4ed8 45%,#5b21b6 100%);
  --grad-soft:linear-gradient(135deg,#1d4ed8,#5b21b6);
  --bg:#f6f7fc; --bg2:#eceefa; --card:#ffffff; --text:#171a33; --text2:#474c70; --text3:#7b80a3;
  --bc:rgba(30,40,100,0.1); --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#0c0e1d; --bg2:#141730; --card:#1a1e3a; --text:#eceefb; --text2:#c2c6e6; --text3:#8e93bb;
  --bc:rgba(255,255,255,0.09); --accent:#60a5fa; --accent-rgb:96,165,250; --c2:#a78bfa; --c3:#fbbf24; --c4:#2dd4bf;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,#1d4ed8,#7c3aed,#0d9488,#d97706); width:0; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(246,247,252,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); }
[data-theme="dark"] nav { background:rgba(12,14,29,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--accent); border-color:var(--accent); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; transition:var(--tr); }
.theme-btn:hover { transform:rotate(20deg); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 44px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.25) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(13,148,136,.25) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.hero-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(22px,4vw,32px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.88); }
.meta-row { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:760px; margin:0 auto; padding:24px 18px 80px; }
.toc { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:22px; display:flex; flex-wrap:wrap; gap:8px; }
.toc a { font-size:12px; font-weight:700; text-decoration:none; color:var(--text2); background:var(--bg2); border:1px solid var(--bc); padding:6px 12px; border-radius:20px; transition:var(--tr); }
.toc a:hover { color:var(--accent); border-color:var(--accent); }
.sec { background:var(--card); border:1px solid var(--bc); border-radius:20px; overflow:hidden; margin-bottom:22px; box-shadow:0 4px 20px rgba(30,40,100,.07); }
.sec-head { background:var(--grad); padding:14px 20px; display:flex; align-items:center; gap:10px; color:#fff; }
.sec-num { background:rgba(255,255,255,.2); border-radius:8px; padding:3px 10px; font-size:12px; font-weight:900; }
.sec-head h2 { font-size:17px; font-weight:900; }
.sec-body { padding:8px 18px 18px; }
.sub { margin:20px 0 4px; font-size:14px; font-weight:900; color:var(--accent); display:flex; align-items:center; gap:8px; }
.sub::before { content:''; width:5px; height:18px; border-radius:3px; background:var(--grad-soft); }
.item { margin-top:14px; padding:14px 16px; border:1px solid var(--bc); border-radius:14px; background:var(--bg); }
.en { direction:ltr; text-align:left; font-size:15px; font-weight:700; line-height:1.65; color:var(--text); }
.ar { direction:rtl; text-align:right; margin-top:10px; padding:10px 12px; font-size:14px; line-height:1.9; color:var(--text2); background:rgba(var(--accent-rgb),.07); border-radius:10px; border-right:3px solid var(--accent); }
.ex { direction:rtl; text-align:right; margin-top:8px; padding:10px 12px; font-size:13.5px; line-height:1.9; color:var(--text2); background:rgba(217,119,6,.09); border-radius:10px; border-right:3px solid var(--c3); }
.ex b { color:var(--c3); }
.fig { margin-top:16px; text-align:center; }
.fig img { max-width:100%; border-radius:12px; background:#fff; border:1px solid var(--bc); }
.fig small { display:block; margin-top:6px; font-size:12px; color:var(--text3); direction:ltr; }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .nav-brand span{display:none;} .shell{padding:16px 12px 60px;} .sec-body{padding:6px 12px 14px;} }
</style>

['h','2-Anxiety'],
['i','A restless body and mind interfere with the ability to sleep.','الجسم والعقل المش مرتاحين بيعطّلوا القدرة على النوم.','لما تفضل تفكّر في حاجة وجسمك متوتر، النوم بيطير.'],
['i','Anxiety related to work pressures, family demands, and other stressors','القلق المرتبط بضغوط الشغل ومتطلبات الأسرة ومصادر التوتر التانية.','واحد قلقان على شغله أو مصاريف بيته فبيفضل صاحي.'],
['h','3- Environment'],
['i','Environmental factors can either enhance or impair sleep.','عوامل البيئة ممكن تحسّن النوم أو تبوّظه.','أوضة هادية ومظلمة بتساعد على النوم، وأوضة مدوّشة بتبوّظه.'],
['i','Lighting, temperature, odors, ventilation, and noise level can all interrupt the sleep process when they differ from the norms of the client’s usual sleep environment.','الإضاءة، ودرجة الحرارة، والروائح، والتهوية، ومستوى الضوضاء كلها ممكن تقطع النوم لو اختلفت عن بيئة النوم المعتادة للمريض.','مريض متعوّد ينام في أوضة مضلّمة وبارده، ولما اتنقل المستشفى والنور مفتوح والتكييف حر، منامش.'],
['h','4- Life style'],
['i','A fast-paced life filled with multiple stressors can result in the person’s inability to relax easily or to fall asleep quickly.','الحياة السريعة المليانة ضغوط كتير ممكن تخلّي الشخص مش قادر يسترخي بسهولة أو ينام بسرعة.','واحد يومه كله جري وشغل وزحمة، بيروح ينام وعقله لسه شغال.'],
['h','5-Diet'],
['i','The type of food consumed has an impact on the quality and quantity of sleep.','نوع الأكل اللي بنكله بيأثّر على جودة وكمية النوم.','وجبة تقيلة قبل النوم بتخلّيك مش مرتاح.'],
['i','Foods high in caffeine, such as coffee, colas, and chocolate, serve as stimulants and often disrupt the normal sleep cycle.','الأكل والمشروبات العالية في الكافيين زي القهوة والكولا والشوكولاتة بتشتغل كمنبّهات وغالبًا بتبوّظ دورة النوم الطبيعية.','فنجان قهوة أو كوباية كولا بالليل ممكن يسهّرك لحد الفجر.'],
['h','6- Drugs and Other Substances'],
['i','Alcohol and nicotine use can impair sleep.','استخدام الكحول والنيكوتين ممكن يضر بالنوم.','التدخين قبل النوم بيخلّي النوم مش مريح.'],
['i','Small amounts of alcohol may help some people fall asleep; however, in others alcohol may interfere sleep, causing very restless and nonrefreshing sleep.','كميات صغيرة من الكحول ممكن تساعد بعض الناس ينامو، لكن عند ناس تانية بتعطّل النوم وتخلّيه قلق جدًا ومش مريح.','ناس ممكن تنام بسرعة بعد الكحول، بس تصحى تعبانة ومش مرتاحة.'],
['h','7- Cultural Norms'],
['i','Cultural and societal expectations also affect sleep.','توقعات الثقافة والمجتمع كمان بتأثّر على النوم.','المجتمع اللي بيقدّر الشغل جدًا ممكن الناس فيه تنام أقل.'],
['i','Some people perceive sleep as a luxury to be indulged in when they are not too busy with “important” activities.','بعض الناس بيشوفوا النوم رفاهية بيستمتعوا بيها بس لما يبقوا مش مشغولين بحاجات “مهمة”.','واحد بيقول “أنا مش فاضي أنام، عندي شغل”.'],
['i','Others view sleep as an absolute necessity.','وناس تانية بتشوف النوم ضرورة مطلقة.','واحد بيقول “لازم أنام 8 ساعات مهما حصل”.'],
['img','fig1','Figure 1 Effects of inadequate sleep'],
['i','Figure 1 Effects of inadequate sleep','الصورة دي بتوضّح تأثيرات قلة النوم (النوم غير الكافي) على الجسم.','زي ما الصورة بتوضّح، قلة النوم بتأثّر على المخ والقلب والمناعة والعضلات وأعضاء تانية.'],
['s','Alteration in Sleep Patterns'],
['i','Sleep disturbances can take many forms and are quite common.','اضطرابات النوم ليها أشكال كتير وشائعة جدًا.','ناس بتصحى كتير بالليل، وناس بتنام بالنهار كتير، وناس بتتكلم وهي نايمة.'],
['i','That include:','ومنها:','هنعدّد دلوقتي أنواع الاضطرابات.'],
['h','1-Insomnia'],
['i','Insomnia refers to the chronic inability to sleep or inadequate quality of sleep','الأرق معناه عدم القدرة المزمنة على النوم أو جودة النوم الغير كافية.','واحد بيفضل يتقلّب في سريره بالساعات كل ليلة من غير ما ينام.'],
['h','2- Hypersomnia or Narcolepsy'],
['i','Hypersomnia is an alteration in sleep pattern characterized by excessive sleep, especially in the daytime.','فرط النوم هو تغيّر في نمط النوم بيتميّز بنوم زيادة، خصوصًا في النهار.','واحد بينام كتير في النهار وبيغلبه النوم وهو قاعد في شغله.'],
['h','3-Sleep Apnea'],
['i','Sleep apnea refers to periods of sleep during which airflow stops for 10 seconds or more.','انقطاع النفس أثناء النوم هو فترات خلال النوم بيقف فيها تدفّق الهوا لمدة 10 ثواني أو أكتر.','واحد بيشخّر جامد وفجأة نَفَسه يقف وهو نايم.'],
['i','Sleep apnea gives rise to complications as a result of oxygen desaturation','انقطاع النفس أثناء النوم بيسبّب مضاعفات نتيجة نقص تشبّع الدم بالأكسجين.','لما نَفَسك يقف الأكسجين في الدم بينزل، وده بيضر بالجسم.'],
['h','4- Sleep Deprivation'],
['i','Sleep deprivation is a term used to describe prolonged inadequate quality and quantity of sleep, Sleep deprivation can result from age, prolonged hospitalization.','الحرمان من النوم مصطلح بيوصف جودة وكمية نوم غير كافية لفترة طويلة، وممكن يحصل بسبب السن أو الإقامة الطويلة في المستشفى.','مريض فضل في المستشفى أسابيع وكل ليلة بيتقطع نومه بسبب الأجهزة والتمريض والدوشة.'],
['h','5- Parasomnia'],
['i','Parasomnia refers to sleep alterations resulting from “an activation of physiological systems at inappropriate times during the sleep.','الباراسومنيا هي تغيّرات في النوم بتحصل نتيجة تنشيط لأجهزة الجسم في وقت غير مناسب أثناء النوم.','أجهزة الجسم الحركية بتشتغل وإنت لسه نايم.'],
['i','Such as (sleepwalking), sleep talking, bed wetting.','زي المشي أثناء النوم، والكلام أثناء النوم، والتبوّل اللاإرادي.','طفل بيقوم يمشي وهو نايم، أو بيتكلم وهو نايم، أو بيبلّل السرير.'],
['s','Relation between the sleep and illness or Hospitalization'],
['i','The stress imposed by illness usually disrupts sleep.','الضغط اللي بيفرضه المرض غالبًا بيقطع النوم.','واحد تعبان وقلقان من مرضه فمش بيعرف ينام.'],
['i','Sleep is especially disrupted when a person is hospitalized.','النوم بيتعطّل بشكل خاص لما الشخص بيدخل المستشفى.','أول ليلة في المستشفى غالبًا بتبقى أصعب ليلة في النوم.'],
['i','Some factors associated with hospitalization that lead to sleep impairment include:','في عوامل مرتبطة بدخول المستشفى بتسبّب اضطراب النوم، منها:','هنعدّد العوامل دي دلوقتي.'],
['i','- Physical or emotional pain','ألم جسدي أو نفسي.','وجع في العملية أو حزن وخوف من التشخيص.'],
['i','- Loss of familiar surroundings','فقدان المكان المألوف.','بعدك عن أوضتك وسريرك اللي متعوّد عليه.'],
['i','- Loss of routine','فقدان الروتين.','في البيت بتنام الساعة 11، وفي المستشفى بتتصحّى الساعة 5 للتحاليل.'],
['i','- Fear of the unknown','الخوف من المجهول.','خايف من نتيجة التحاليل أو العملية.'],
['i','- Timing of procedures and treatments','مواعيد الإجراءات والعلاجات.','مريض بيتصحّى بالليل علشان ياخد دوا أو يتقاس ضغطه.'],
['i','- Noise level (especially unfamiliar noises)','مستوى الضوضاء (خصوصًا الأصوات الغريبة).','صوت أجهزة المستشفى وإنذاراتها اللي أول مرة تسمعها.'],
['i','- Loss of privacy','فقدان الخصوصية.','مريض مش مرتاح ينام وفي ناس داخلة خارجة وفي مريض جنبه.'],
['s','Nursing care to promote rest and sleep:'],
['i','Nurses play an important role in caring for patients with sleep disturbances.','الممرضين ليهم دور مهم في رعاية المرضى اللي عندهم اضطرابات نوم.','الممرضة هي اللي بتلاحظ إن المريض مش بينام وتتصرّف.'],
['h','1-Assessment for Sleep Disturbances'],
['i','*Gathering necessary and helpful information upon which to build care planning','تجميع المعلومات الضرورية والمفيدة اللي هتبني عليها خطة الرعاية.','زي الدكتور: لازم يسأل ويفحص الأول قبل ما يكتب العلاج.'],
['i','In the case of sleep disturbances, data collection begins with a detailed family and personal history focused on particular factors that may influence rest and sleep.','في حالة اضطرابات النوم، جمع البيانات بيبدأ بتاريخ تفصيلي للأسرة والمريض، بيركّز على عوامل معيّنة ممكن تأثّر على الراحة والنوم.','تسأل: في حد في العيلة عنده مشاكل نوم؟ والمريض بيشرب قهوة ولا بيشتغل ورديات؟'],
['i','*Ask about any changes the patient has noticed— psychologically or physiologically—that could be a result of the lack of sleep.','اسأل عن أي تغييرات لاحظها المريض، نفسية أو جسدية، ممكن تكون ناتجة عن قلة النوم.','زي: بقيت عصبي؟ مركّزك قل؟ بتحس بصداع أو إرهاق؟'],
['i','*Collect a Detailed History: Family and patient history, including diagnoses, surgeries, and medications The nurse should perform a focused assessment, exploring sleep patterns, hours of sleep, and whether the patient or significant other reports loud snoring.','اجمع تاريخ تفصيلي: تاريخ الأسرة والمريض، شامل التشخيصات والعمليات والأدوية. وكمان الممرضة تعمل تقييم مركّز، تستكشف فيه أنماط النوم وعدد ساعاته، وهل المريض أو شريكه بيقول إن في شخير عالي.','تسأل: بتنام كام ساعة؟ مراتك بتقول إنك بتشخّر جامد؟ ده ممكن يدل على انقطاع النفس.'],
['h','* Analyze the Patient’s Sleep Log'],
['i','It is helpful to have patients keep track of their sleep by using a sleep log . This may also be referred to as a sleep diary or journal.','من المفيد إن المريض يتابع نومه بسجل نوم (Sleep log)، وممكن يتقال عليه كمان مفكرة أو يوميات النوم.','المريض بيكتب كل يوم نام إمتى وصحي إمتى في كشكول صغير.'],
['i','There is often more information desired by the healthcare team than just hours slept.','الفريق الصحي غالبًا عايز معلومات أكتر من مجرد عدد ساعات النوم.','مش بس نمت 6 ساعات، لكن كمان إيه اللي حصل قبل النوم وفي النوم.'],
['i','Examples of questions to consider including in a sleep diary:','أمثلة على أسئلة ممكن تتحط في مفكرة النوم:','دي الأسئلة اللي هتتكتب في الكشكول.'],
['i','What medication(s) do you take? What time do you take it/each?','بتاخد أدوية إيه؟ وبتاخدها الساعة كام (كل دوا)؟','بتاخد دوا للضغط الساعة 9 بالليل.'],
['i','Do you exercise? How often? What time?','بتتمرّن؟ كام مرة؟ وفي أنهي وقت؟','بتتمرّن 3 مرات في الأسبوع الساعة 8 بالليل.'],
['i','How long did it take to fall asleep?','أخدت وقت قد إيه علشان تنام؟','نمت بعد ساعة من ما نزلت السرير.'],
['i','How well did you sleep?','نمت كويس قد إيه؟','نومي كان متقطّع ومش مريح.'],
['i','How many disruptions during sleep time? How long did the disruptions last?','كام مرة النوم اتقطع؟ وكل مرة استمرّت قد إيه؟','صحيت 3 مرات، وكل مرة قعدت صاحي نص ساعة.'],
['i','How many daytime naps? How long were the naps?','كام قيلولة نمت في النهار؟ وكانت مدة كل قيلولة قد إيه؟','نمت قيلولتين، كل واحدة ساعتين.'],
['i','Did you drink caffeine or alcohol? How much? What time?','شربت كافيين أو كحول؟ كمية قد إيه؟ وفي أنهي وقت؟','شربت 3 فناجين قهوة، آخر فنجان الساعة 9 بالليل.'],
['i','Did you use tobacco or other drug substances? At what time?','استخدمت تبغ أو مواد تانية؟ في أنهي وقت؟','دخّنت سيجارة قبل النوم بنص ساعة.'],
['i','It can also help patients to consider their sleep patterns and learn more about their sleep hygiene practices, distractions, and interruptions.','كمان بيساعد المرضى يفكّروا في أنماط نومهم ويعرفوا أكتر عن ممارسات نظافة النوم عندهم، والمشتّتات والمقاطعات.','المريض لما يكتب يوميًا يلاحظ إن الموبايل هو اللي بيشتّته.'],
['i','Upon completion of a sleep log for the requested period of time, the nurse can analyze the data for specific details and trends.','بعد ما المريض يخلّص سجل النوم للفترة المطلوبة، الممرضة تقدر تحلّل البيانات وتطلع بتفاصيل محددة واتجاهات.','تلاقي إن كل ليلة بيشرب قهوة بعد العشا ومبيناش.'],
['h','Diagnostic studies;'],
['i','A polysomnography; which is done in a sleep center by a respiratory therapist, is used to diagnose sleep disturbances.','دراسة النوم (Polysomnography) بتتعمل في مركز نوم على إيد أخصائي علاج تنفسي، وبتُستخدم لتشخيص اضطرابات النوم.','المريض بينام في مركز النوم وبيتراقب طول الليل.'],
['i','- Placing electrodes on the client\'s head is a combination of three diagnostic studies which are an electro cephalogram, an electro-oculogram and an electromyogram.','وضع أقطاب كهربية على راس المريض هو مجموعة من 3 دراسات تشخيصية: رسم المخ، رسم العين، ورسم العضلات.','بيلزقوا أسلاك صغيرة على راس المريض علشان تسجّل.'],
['i','An electro cephalogram; measures and displays the brain waves while the client is sleeping;','رسم المخ (EEG) بيقيس ويعرض موجات المخ وقت ما المريض نايم.','بيوضّح المخ نايم عميق ولا خفيف.'],
['i','An electreggo-oculogram measures and displays eye movements during sleep; and an electromyogram to measure muscular movements during sleep.','رسم العين (EOG) بيقيس ويعرض حركات العين وقت النوم، ورسم العضلات (EMG) بيقيس حركات العضلات وقت النوم.','بيسجّل إن عينك بتتحرك وإن رجلك بتتشنّج وإنت نايم.'],
['i','These diagnostic tests, in combination with pulse oximetry and an electrocardiogram, are used to assess clients for sleep disorders such as sleep apnea, restless leg syndrome and bruxism.','الفحوصات دي، مع قياس تشبّع الأكسجين (pulse oximetry) ورسم القلب (ECG)، بتُستخدم لتقييم المرضى لاضطرابات النوم زي انقطاع النفس، ومتلازمة تململ الساقين، وصرير الأسنان.','واحد بيحرّك رجله كتير وهو نايم، أو بيصرّ على سنانه.'],
['h','Nursing diagnosis;'],
['i','Some of the nursing diagnoses that the nurse can arrive at after a complete and thorough assessment of the client are:','من التشخيصات التمريضية اللي الممرضة ممكن توصللها بعد تقييم كامل ودقيق للمريض:','التشخيص التمريضي بيتكتب بعد ما تجمع البيانات.'],
['i','• Insomnia related to anxiety','أرق مرتبط بالقلق.','مريض قلقان على نتيجة العملية فمش بيعرف ينام.'],
['i','• Insomnia related to the disruption in the amount and quality of sleep','أرق مرتبط باضطراب كمية وجودة النوم.','نوم المريض قليل ومتقطع.'],
['i','• Sleep deprivation related to nocturnal work hours','حرمان من النوم مرتبط بساعات الشغل بالليل.','ممرضة شغّالة ورديات ليل ومش بتنام كفاية.'],
['i','• Sleep deprivation related to prolonged periods of time without sleep','حرمان من النوم مرتبط بفترات طويلة من غير نوم.','واحد فضل صاحي 3 أيام.'],
['i','• Impaired sleep related to sleep apnea','اضطراب في النوم مرتبط بانقطاع النفس أثناء النوم.','واحد بيصحى كتير بسبب توقف نَفَسه.'],
['i','• Impaired gas exchange related to central or obstructive sleep apnea','اختلال تبادل الغازات مرتبط بانقطاع النفس المركزي أو الانسدادي أثناء النوم.','لما النفس بيقف الأكسجين بينقص في الدم.'],
['i','• At risk for disturbed sleep secondary to alcohol use','معرّض لخطر اضطراب النوم بسبب استخدام الكحول.','واحد بيشرب كحول قبل النوم ممكن نومه يتبوّظ.'],
['i','• Insomnia related to pain and the lack of comfort','أرق مرتبط بالألم وعدم الراحة.','مريض بعد عملية جراحية بيوجعه جرحه فمش بيعرف ينام.'],
['h','Interventions;'],
['h','1- Education to Encourage Good Sleep Hygiene Practices'],
['i','Several practices contribute to good sleep hygiene, often relieving insomnia and other sleep-related issues.','في ممارسات كتير بتساهم في نظافة نوم كويسة، وغالبًا بتخفّف الأرق ومشاكل النوم التانية.','زي ما بتنضّف سنانك كل يوم، فيه عادات بتنضّف نومك.'],
['i','Certain beverages, such as herbal teas or warm milk, may foster sleep, with the caveat that drinking near bedtime may cause early arousals in order to void .','بعض المشروبات زي الأعشاب أو اللبن الدافي ممكن تساعد على النوم، لكن لو اتشربت قرب وقت النوم ممكن تصحّيك بدري عشان تدخل الحمام.','تشرب لبن دافي قبل النوم بساعة، مش على السرير علطول.'],
['i','Routines, such as a warm bath, tooth brushing, and selection of sleep clothing, often support the sleep schedule, as the mind and body associate the habits and feelings with bedtime, rest, and sleep.','الروتينات زي الاستحمام بمياه دافية، وتنضيف الأسنان، واختيار هدوم النوم، غالبًا بتدعم جدول النوم، لأن العقل والجسم بيربطوا العادات والإحساس ده بوقت النوم والراحة.','لما تعمل نفس الخطوات كل ليلة، جسمك يفهم إن ده وقت النوم.'],
['h','2-Scheduling Client Care Activities to Promote Adequate Rest'],
['i','The promotion of sleep and adequate rest depends on correcting any underlying problems, including pain and alcohol use, and then planning activities and routines that will enhance the duration and the quality of sleep.','تعزيز النوم والراحة الكافية بيعتمد على تصحيح أي مشاكل أساسية، زي الألم وتعاطي الكحول، وبعدها تخطيط أنشطة وروتينات بتحسّن مدة وجودة النوم.','لازم تعالج الألم الأول، وبعد كده تظبّط مواعيد النوم.'],
['i','Some of these sleep promotion interventions and schedules include:','من التدخلات والجداول دي:','هنعدّدها دلوقتي.'],
['i','• Establishing and adhering to a regular sleep time and wake time for the client based on their patterns and needs','تحديد ميعاد ثابت للنوم والصحيان للمريض والالتزام بيه، حسب أنماطه واحتياجاته.','ينام الساعة 11 ويصحى الساعة 6 كل يوم.'],
['i','• Limiting the duration and frequency of day time naps','تقليل مدة وعدد مرات القيلولة في النهار.','قيلولة 20 دقيقة بس مش 3 ساعات.'],
['i','• The promotion of daily exercise','تشجيع التمارين اليومية.','المشي الخفيف كل يوم.'],
['i','• The avoidance of alcohol, caffeine, heavy meals and exercise at least a couple of hours before bedtime','تجنّب الكحول والكافيين والوجبات التقيلة والتمارين قبل النوم بساعتين على الأقل.','متشربش قهوة ولا تاكل عشا تقيل ولا تتمرن قبل ما تنام على طول.'],
