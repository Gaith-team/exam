const D=[
["Anatomy and physiology of the urinary system",[
["FIG"],
["Urinary system is composed of two kidneys, two ureters, the bladder and urethra","الجهاز البولي مكوّن من كليتين، وحالبين، والمثانة، والإحليل (مجرى البول).","تخيّل شبكة مواسير: مصنع (الكليتين) بيطلع ميّه، ومواسير (الحالبين) توصّلها لخزان (المثانة)، وبعدين فتحة الخروج (الإحليل)."],
["1-The Kidneys: The right and left kidneys, they are complex organ whose chief function is the elimination of waste products of body metabolism and the control of concentration of the various constituents of the body fluid, including the blood.","الكلى هما كليتين يمين وشمال، عضو معقّد وظيفته الأساسية يطلّع الفضلات الناتجة من التمثيل الغذائي، وكمان يضبط تركيز المكونات المختلفة في سوائل الجسم ومنها الدم.","الكلى زي فلتر المياه في البيت: بتشيل الشوائب وتخلّي المياه متوازنة."],
["Blood reaches the kidneys through the renal arteries and is filtered in the glomeration of the nephrons.","الدم بيوصل للكلى عن طريق الشرايين الكلوية، وبيتفلتر في كُبيبات النيفرون (glomeruli).","زي القهوة لما تتصفّى في الفلتر: الدم هو القهوة والكُبيبة هي الفلتر."],
["The nephrons are the functioning unit of the kidney. It is estimated that each kidney has about one and half million nephrons.","النيفرون هو الوحدة الشغّالة في الكلية، وبيتقدّر إن كل كلية فيها حوالي مليون ونص نيفرون.","زي مصنع كبير فيه مليون ونص ماكينة صغيرة، كل ماكينة بتشتغل لوحدها."],
["The filtrate contains water, the waste products of metabolism, electrolytes and glucose. This filtrate is known as urine.","الراشح (اللي بيتفلتر) فيه مية، وفضلات التمثيل الغذائي، وأملاح (إلكتروليتات)، وجلوكوز. والراشح ده هو اللي بنسمّيه البول.","اللي نزل من الفلتر في كوباية القهوة هو الراشح، وده في جسمك اسمه بول."]]],
["Functions of the kidneys",[
["1- Execrations of metabolic wastes (urea, uric acid, creatinine and ammonia).","إخراج الفضلات الأيضية (اليوريا، حمض اليوريك، الكرياتينين، الأمونيا).","زي زبّال بيشيل الزبالة من البيت كل يوم عشان متتراكمش."],
["2- Regulation of acid base balance of the blood.","تنظيم توازن الحموضة والقلوية في الدم.","زي حمّام السباحة اللي لازم الكلور فيه متوازن، مش زيادة ولا ناقص."],
["3- Regulation of the amount of extra fluid through elimination of excess fluid.","تنظيم كمية السوائل الزايدة عن طريق التخلص من الزيادة.","لو شربت ماية كتير، الكلى تطلّع الزيادة في صورة بول كتير."],
["4- Regulation of osmotic pressure of extra fluid by regulating the amount of sodium chloride and water.","تنظيم الضغط الأسموزي للسوائل الزايدة عن طريق ضبط كمية ملح الصوديوم والمية.","زي ما تضبط ملح الشوربة: ضيف ماية لو مالحة، وملح لو حلوة."],
["5- Regulation of extra cellular electrolytes by selective reabsorption of important electrolytes or excretion of excess such as glucose.","تنظيم الأملاح خارج الخلايا، بإنها ترجّع الأملاح المهمة تاني للدم (إعادة امتصاص انتقائية)، أو تطلّع الزيادة زي الجلوكوز.","زي موظف الأمن: يسيب الداخل المهم يعدّي ويمنع أو يطلّع اللي زيادة."],
["N.B Osmotic Pressure: The pressure that would have to be applied to a pure solvent to prevent it from passing into a given solution by osmosis, often used to express the concentration of the solution.","ملحوظة – الضغط الأسموزي: هو الضغط اللازم على مذيب نقي عشان نمنعه إنه يعدّي جوه محلول بالخاصية الأسموزية، وبنستخدمه عادةً للتعبير عن تركيز المحلول.","لو حطيت مية نقية جنب مية مالحة بينهم غشاء، المية النقية بتسحب ناحية المالحة. الضغط اللي يوقف السحب ده هو الضغط الأسموزي."],
["6- Regulation of blood pressure: the kidney produces an enzyme like substance called rennin that can raise blood pressure.","تنظيم ضغط الدم: الكلية بتفرز مادة شبه الإنزيم اسمها رينين (renin) تقدر ترفع ضغط الدم.","لو الضغط وطي، الكلية تبعت الرينين زي ما تدوس بنزين ونرفع السرعة."],
["7- Regulation of red blood cells production: under stress, the kidney produces erythropoietin, which stimulate the production of red blood cells in bone marrow. in response to falling levels of oxygen in the tissues.","تنظيم إنتاج كرات الدم الحمراء: وقت الضغط والإجهاد، الكلية بتفرز الإريثروبويتين اللي بيحفّز نخاع العظم يعمل كرات دم حمراء، ده ردّ فعل لما الأكسجين في الأنسجة يقل.","زي ما تطلب دليفري زيادة لما الطلبات تكتر: الأكسجين قل فالكلية تطلب كرات حمراء أكتر."],
["8- Control of water excretion: the reabsorption of water in the tubules is controlled by pituitary and hypothalamic action.","التحكم في إخراج المية: إعادة امتصاص المية في الأنابيب الكلوية بتتحكم فيها الغدة النخامية والهيبوثالاموس.","زي حنفية الماسورة: المخ (النخامية والهيبوثالاموس) هو اللي بيفتحها ويقفلها."]]],
["Ureters, Bladder, Urethra and Micturition",[
["2-The Ureters: Are 2 tubes, each one is connected to the pelvis of the kidney.","الحالبين: هما أنبوبتين، كل واحدة متوصّلة بحويضة الكلية.","واحدة لكل كلية، زي خرطومين طالعين من كل كلية."],
["Its chief function is to convey the urine formed in the kidney pelvis to the bladder. It is about 25-30 cm long and it has a narrow diameter.","وظيفته الأساسية ينقل البول اللي اتكوّن في حويضة الكلية للمثانة. طوله حوالي 25-30 سم وقطره ضيق.","زي أنبوبة رفيعة طويلة بتنقل البول من فوق لتحت للمثانة."],
["3-The Bladder: Is a hollow, muscular organ that serves as a reservoir for urine. The bladder can retain urine until it can be excreted.","المثانة: عضو مجوّف عضلي شغلته خزان للبول، وتقدر تحتفظ بالبول لحد ما يتخلص منه.","زي جركن ميّه بتملّيه وتفضّيه لما تحب."],
["The average adult bladder holds from 300-500 cc of urine.","مثانة الشخص البالغ بتشيل في المتوسط من 300 لـ 500 سم³ بول.","يعني تقريباً قد كوباية كبيرة لحد زجاجة مية صغيرة."],
["This depends upon the efficient muscle tone of the bladder wall and upon the integrity of the nervous system enervating the bladder and the condition of the internal sphincter which controls the passage of urine from the bladder to the urethra.","ده بيعتمد على قوة شدّ عضلات جدار المثانة، وسلامة الجهاز العصبي اللي بيغذّيها، وحالة العضلة العاصرة الداخلية اللي بتتحكم في عبور البول من المثانة للإحليل.","لازم 3 حاجات تشتغل مع بعض: العضلة قوية + الأعصاب سليمة + العاصرة تقفل وتفتح صح، لو واحدة باظت المثانة تتلخبط."],
["4-The Urethra: Is a short, hollow muscular tube approximately 3.7 cm. long in the female and 20 cm. in the male; the chief function of the urethra is to provide a passage-way through which urine can be voided from the bladder.","الإحليل: أنبوبة عضلية مجوّفة قصيرة، طولها حوالي 3.7 سم عند الست و20 سم عند الراجل، ووظيفته إنه يكون الممر اللي البول بيخرج منه من المثانة.","إحليل الراجل أطول بخمس أضعاف تقريباً، فالست عندها فرصة التهاب أكتر لأن الطريق قصير."],
["Micturition or Voiding: It is the act by which urine is expelled from the bladder. The acts of initiating and stopping micturition are normally under voluntary control via external sphincter muscle.","التبوّل (Micturition أو Voiding): هو عملية طرد البول من المثانة. وبدء التبوّل أو إيقافه بيكون عادةً بإرادتك عن طريق العضلة العاصرة الخارجية.","زي ما تقدر تقول «استنى لما أوصل الحمّام» وتمسك نفسك."],
["Act of Urination — Brain structures influence bladder function","فعل التبوّل: تراكيب المخ بتأثّر على شغل المثانة.","المخ هو المدير اللي بيدّي الإذن للمثانة."],
["Voiding: Bladder contraction + Urethral sphincter and pelvic floor muscle relaxation, stretching of bladder wall signals the micturition center in the sacral spinal cord.","التبوّل = انقباض المثانة + ارتخاء العاصرة وعضلات قاع الحوض، وتمدّد جدار المثانة بيبعت إشارة لمركز التبوّل في الحبل الشوكي العجزي.","لما المثانة تتملي وتتمدد، تبعت رسالة تقول «أنا مليانة!»."],
["Impulses from the micturition center in the brain respond to or ignore this urge, thus making urination under voluntary control.","النبضات من مركز التبوّل في المخ بتستجيب للرغبة دي أو تتجاهلها، وكده التبوّل يبقى تحت التحكم الإرادي.","وإنت في اجتماع، المخ يتجاهل الإشارة لحد ما تخلص."],
["When a person is ready to void, the external sphincter relaxes, the micturition reflex stimulates the detrusor muscle to contract, and the bladder empties.","لما الشخص يبقى جاهز يتبوّل، العاصرة الخارجية بترتخي، وانعكاس التبوّل بيحفّز العضلة الدافعة (detrusor) تنقبض، فالمثانة تتفرّغ.","زي ما تفتح الحنفية (العاصرة) وتعصر الزجاجة (المثانة) فالميّه تخرج."]]],
["Urine and Characteristics of Normal Urine",[
["Urine: is the waste products of metabolism or it is a complex aqueous solution of organic and inorganic substances.","البول: هو فضلات التمثيل الغذائي، أو محلول مائي معقّد فيه مواد عضوية وغير عضوية.","زي شوربة فيها مية كتير ومواد مدوّبة جواها."],
["Amount: 1200-1800 cc/24 h.","الكمية: من 1200 لـ 1800 سم³ في اليوم (24 ساعة).","الشخص السليم بيطلّع حوالي لتر ونص إلى 2 لتر تقريباً في اليوم."],
["Color: Clear, straw, amber yellow.","اللون: رايق، لون القش، أصفر كهرماني.","زي لون الشاي الخفيف."],
["Transparency: Transparent.","الشفافية: شفاف.","تقدر تشوف من خلاله زي كوباية المية."],
["Odor: Normal odor of urine is aromatic in nature.","الرائحة: رائحة البول الطبيعية عطرية بطبيعتها.","ريحة خفيفة مش منفّرة."],
["Long standing urine may have an ammoniacal odor (due to decomposition of urea to ammonia).","البول اللي يقعد فترة طويلة ممكن يبقى ريحته نشادر (أمونيا) بسبب تحلّل اليوريا لأمونيا.","زي عينة بول فضلت من الصبح لبكرة، ريحتها تبقى حادة."],
["PH: Normal PH of urine ranges from 5.5-6.5: Slightly Acidic.","الأس الهيدروجيني: الطبيعي من 5.5 لـ 6.5، يعني حمضي بسيط.","أقل شوية من 7 (المحايد)، يعني حمضي خفيف."],
["Specific gravity: 1.005-1.030.","الكثافة النوعية: من 1.005 لـ 1.030.","رقم بيقول البول تقيل ولا خفيف مقارنة بالمية."],
["Constituents: Urine contains creatinine, uric acid, urea and a few white blood cells.","المكونات: البول فيه كرياتينين، وحمض يوريك، ويوريا، وشوية كرات دم بيضا قليلة.","وجود كام كرية بيضا قليلة طبيعي، لكن لو كتير يبقى مشكلة."]]],
["Altered urinary production and Elimination Patterns – Signs and symptoms of urinary problems",[
["1- Polyuria: Voiding of abnormally large volumes of dilute urine.","كثرة البول: خروج كميات كبيرة جداً من البول المخفّف.","شخص بيدخل الحمّام كل شوية وبيطلع كمية كبيرة ولونها فاتح جداً."],
["2- Oliguria: Voiding a scanty amount of urine (less than 600cc/day).","قلة البول: خروج كمية قليلة من البول (أقل من 600 سم³ في اليوم).","مريض فضل طول اليوم مش بيطلّع غير كمية صغيرة."],
["3- Anurea: Total absence of marked deficiency (failure of the kidneys to produce urine).","انعدام البول: غياب كامل أو نقص شديد في البول (الكلى مبتعملش بول).","الكلى وقفت شغل، فالمثانة فاضية على طول."],
["4- Urinary incontinence: Involuntary voiding or dribbling of urine.","سلس البول: نزول البول بدون إرادة أو تنقيط.","كحّ أو عطس والبول نزل من غير ما يقدر يمسكه."],
["5- Retention: The urine is formed in the kidneys, but the patient unable to excrete it from his bladder or inability to void although urine is produced by the kidneys and enters the bladder, excessive storage of urine in the bladder.","احتباس البول: البول بيتكوّن في الكلى، لكن المريض مش قادر يطلّعه من المثانة، رغم إنه نازل فيها، فبيتخزن في المثانة بكمية زايدة.","الكلى شغالة والمثانة مليانة بس البول مش راضي يخرج."],
["6- Dysuria: Difficulty in voiding or pain in voiding. (Painful or difficult urination.)","عُسر التبوّل: صعوبة أو ألم وقت التبوّل.","حرقان وألم وقت ما تدخل الحمّام."],
["7- Nocturia: It the need to get up from sleep in order to void.","التبوّل الليلي: إنك تصحى من النوم عشان تروح الحمّام.","تصحى 3 مرات بالليل عشان تتبوّل."],
["8- Enuresis: It is involuntary loss of urine at night (bed wetting) especially by children at night.","التبوّل اللاإرادي الليلي: نزول البول بدون إرادة بالليل (بلل السرير) وخاصة عند الأطفال.","طفل صحي الصبح لقى السرير مبلول."],
["9- Urgency: Is the sensation that one must void.","الإلحاح: إحساس إنك لازم تتبوّل حالاً.","تحس فجأة إنك لازم تجري على الحمّام."],
["10- Residual urine: When the bladder empties normally, it retain little amount of urine.","البول المتبقي: لما المثانة بتفرّغ بشكل طبيعي بيفضل فيها كمية صغيرة جداً من البول.","بعد ما تخلّص، يفضل تقطير بسيط جوه المثانة."],
["11-Abnormal finding of urine:","النتائج الغير طبيعية في البول:","أي حاجة من الجاية دي معناها نبّه الدكتور."],
["a) Hematuria: Presence of blood in the urine.","بول دموي: وجود دم في البول.","البول لونه أحمر أو وردي."],
["b) Pyuria: Presence of pus in the urine, typically (usually) from bacterial infection.","بول صديدي: وجود صديد في البول، وده غالباً من عدوى بكتيرية.","بول عكر فيه صديد مع التهاب."],
["c) Albuminuria: Presence of albumin in the urine, typically as a symptom of kidney disease.","زلال في البول: وجود الألبومين في البول، وغالباً بيبقى عَرَض لمرض الكلى.","الكلية المفروض تحتفظ بالألبومين، فلو ظهر في البول يبقى الفلتر بايظ."],
["d) Glycosuria: Presence of sugar in the urine (a condition characterized by an excess of sugar in the urine, typically associated with diabetes or kidney disease).","سكر في البول: وجود سكر في البول، وغالباً مرتبط بالسكر أو أمراض الكلى.","مريض سكر السكر عنده عالي لدرجة طلع في البول."],
["e) Casts: Presence of coagulated protein from the kidney.","الأسطوانات (Casts): وجود بروتين متجلّط جاي من الكلى.","زي قالب صغير من بروتين اتشكّل جوه الأنابيب وخرج في البول."],
["f) Pale urine: Means diluted urine may be due to excessive fluid intake.","البول الباهت: معناه بول مخفّف، وممكن بسبب شرب سوائل كتير.","بتشرب ماية كتير فالبول يبقى فاتح تقريباً زي المية."],
["g) Dark urine: Means the urine is concentrated may be due to low fluid intake, dehydration.","البول الغامق: معناه بول مركّز، وممكن بسبب قلة السوائل أو الجفاف.","مشربتش ماية طول اليوم فاللون يبقى غامق."],
["h) Ketonuria: Urine containing ketones. (The excretion of abnormally large amounts of ketone bodies in the urine, characteristic of diabetes mellitus, starvation, or other medical conditions).","كيتونات في البول: البول فيه أجسام كيتونية. (إخراج كميات كبيرة غير طبيعية منها في البول، وده بيحصل في السكر، والتجويع، أو حالات مرضية تانية).","جسمك بيحرق دهون بدل السكر لأن مفيش أكل أو السكر مش شغال، فتطلع نواتج في البول."]]],
["Urinary frequency, Urgency, Incontinence and Retention",[
["Urinary frequency: Is voiding at frequent intervals and greater than normal urinary volume, that is, more often than 4 to 6 times per day.","تكرار التبوّل: التبوّل على فترات متقاربة وبحجم أكبر من الطبيعي، يعني أكتر من 4 لـ 6 مرات في اليوم.","تدخل الحمّام 10 مرات في اليوم."],
["Causes: Urinary Tract Infection (UTI). Stress. Pregnancy can cause frequent voiding of small quantities (50 to 100 ml) of urine.","الأسباب: التهاب المسالك البولية (UTI)، التوتر، والحمل ممكن يسبب تبوّل متكرر بكميات صغيرة (50 لـ 100 مل).","الحامل بتروح الحمّام كتير بس كل مرة شوية بس."],
["Urgency: Is the sudden strong desire to void.","الإلحاح: رغبة قوية ومفاجئة في التبوّل.","من غير مقدمات تحس إنك مش قادر تستنى."],
["Causes: Psychological stress and irritation of the trigone and urethra. Poor external sphincter control and unstable bladder contractions.","الأسباب: التوتر النفسي وتهيّج المثلث المثاني (trigone) والإحليل، وضعف التحكم في العاصرة الخارجية، وانقباضات المثانة الغير مستقرة.","العاصرة ضعيفة فمش بتقدر تمسك البول."],
["N.B Trigone: A triangular region or tissue, particularly the area at the base of the urinary bladder, between the openings of the ureters and urethra.","ملحوظة – المثلث المثاني: منطقة أو نسيج مثلث الشكل، خصوصاً الجزء اللي في قاعدة المثانة بين فتحتين الحالبين وفتحة الإحليل.","تخيّل 3 نقط: فتحة حالب يمين وحالب شمال وفتحة الإحليل تحت، والمساحة بينهم مثلث."],
["Urinary incontinence (involuntary urination, bedwetting): Incontinence means the inability to control either urinary or bowel elimination and is abnormal after a person is toilet-trained.","سلس البول (تبوّل لاإرادي، بلل السرير): السلس معناه عدم القدرة على التحكم في إخراج البول أو البراز، وبيبقى غير طبيعي بعد ما الشخص يتعلّم الحمّام.","طفل عنده سنتين وبيتبول على نفسه طبيعي، لكن عنده 10 سنين يبقى مش طبيعي."],
["Clients at highest risk for developing incontinence include those who with: -A history of UTI. -Surgery. -Trauma. -Multiple vaginal births. -Musculoskeletal disorders. -Endocrine disorders.","أكتر الناس عرضة للسلس: اللي عندهم تاريخ التهاب مسالك بولية، عمليات جراحية، إصابات، ولادات طبيعية متعددة، اضطرابات في العضلات والعظام، أو اضطرابات الغدد الصماء.","ست ولدت طبيعي أكتر من مرة، عضلات الحوض بتضعف."],
["Urinary retention: Is impaired in the emptying of the bladder, urine accumulates and the bladder becomes over distended.","احتباس البول: خلل في تفريغ المثانة، فالبول بيتجمّع والمثانة تتمدّد زيادة.","زي بالون بتنفخ فيه ومش بتطلّع الهوا."],
["Causes: -Prostatic hypertrophy. -Surgery. -Some medication. -The client may experience over flow voiding or incontinence eliminating 25 to 50 ml of urine at frequent intervals.","الأسباب: تضخّم البروستاتا، العمليات، بعض الأدوية. والمريض ممكن يحصله نزول بول فائض (overflow) أو سلس بخروج 25 لـ 50 مل على فترات متقاربة.","كوباية مليانة لحد الحافة، أي نقطة زيادة تفيض."],
["N.B Hypertrophy: The enlargement of an organ or tissue from the increase in size of its cells.","ملحوظة – التضخّم (Hypertrophy): كبر حجم العضو أو النسيج بسبب زيادة حجم خلاياه.","زي العضلة اللي بتكبر لما تتمرن بالأتقال لأن حجم الخلايا زاد."]]],
["Polyuria, Anuria, Oliguria, Residual urine, Dysuria",[
["Polyuria (diuresis): Production of abnormally large amounts of urine by the kidneys.","كثرة البول (إدرار): الكلى بتنتج كميات كبيرة جداً من البول.","الكلى بتشتغل زيادة وبتطلع بول كتير."],
["Causes: Excessive fluid intake (polydipsia). Associated with diabetes mellitus. Chronic nephritis. Taking certain medications actually can increase urination.","الأسباب: شرب سوائل كتير (polydipsia)، مرتبط بالسكر، التهاب الكلى المزمن، وبعض الأدوية بتزوّد التبوّل.","مريض السكر بيشرب كتير وبيتبول كتير."],
["* Polyuria can cause excessive fluid loss, leading to intense (severe) thirst, dehydration, Weight loss.","كثرة البول ممكن تسبب فقدان سوائل زيادة وده يؤدي لعطش شديد وجفاف ونقص في الوزن.","بتخسر ماية كتير فبتعطش ووزنك ينزل."],
["Anuria (failure of the kidneys to produce urine): Anuria means absence of urine or a volume of 100 mL or less in 24 hours. It indicates that the kidneys are not forming sufficient urine.","انعدام البول (فشل الكلى في إنتاج البول): معناه مفيش بول أو أقل من أو يساوي 100 مل في 24 ساعة، وده بيدل إن الكلى مش بتكوّن بول كفاية.","المريض كيس البول عنده فاضي من يوم كامل تقريباً."],
["Oliguria: (the production of abnormally small amounts of urine). Urine output less than 400 mL per 24 hours, indicates inadequate elimination (removed, disposal) of urine.","قلة البول: إنتاج كميات قليلة جداً من البول. لو أقل من 400 مل في 24 ساعة يبقى فيه تخلّص غير كافي من البول.","أقل من نص لتر في اليوم كله."],
["Residual urine, or more than 50 mL of urine that remains in the bladder after voiding.","البول المتبقي: أكتر من 50 مل بول بتفضل في المثانة بعد التبوّل.","خلّصت تبوّل ولسه في المثانة قد نص كوباية صغيرة."],
["Causes: - Lack of fluid intake. - Renal failure. -Impaired blood flow to the kidneys.","الأسباب: قلة شرب السوائل، فشل كلوي، وضعف تدفّق الدم للكلى.","الكلى مبتاخدش دم كفاية فمش بتقدر تعمل بول."],
["Dysuria (Painful or Difficult urination). Is difficult or uncomfortable voiding and a common symptom of trauma to the urethra or a bladder infection. Frequency and urgency (strong feeling that urine must be eliminated quickly) often accompany dysuria.","عُسر التبوّل (تبوّل مؤلم أو صعب): تبوّل صعب أو مش مريح، وعرض شائع مع إصابة الإحليل أو التهاب المثانة. وغالباً بيجي معاه تكرار وإلحاح (إحساس قوي إن البول لازم يخرج بسرعة).","حرقان في الحمّام + كل شوية تدخل + مش قادر تستنى."],
["Causes: UTI. Injury to the bladder and urethra.","الأسباب: التهاب المسالك البولية، وإصابة المثانة والإحليل.","التهاب أو ضربة في المنطقة."]]],
["Factors which affect the individual's urinary elimination",[
["1- Change in the patient's environment: Such as improper toilet facilities, unclean toilets or lack of privacy. The hospital routine might affect patient's habits.","تغيّر بيئة المريض: زي حمّام مش مناسب أو مش نضيف أو مفيش خصوصية، وروتين المستشفى ممكن يأثر على عاداته.","مريض مكسوف يتبوّل والستارة مفتوحة فبيستنّى."],
["2- Amount of fluid intake: It can either increase or decrease amount of urine.","كمية السوائل المشروبة: ممكن تزوّد كمية البول أو تقلّلها.","شرب كتير = بول كتير، شرب قليل = بول قليل."],
["3- Types of food: Can lead to changes in the color of the urine.","أنواع الأكل: ممكن تغيّر لون البول.","أكل الشمندر ممكن يلوّن البول بالأحمر."],
["4- Intake of drugs: Might lead to change color of urine, or can increase urinary output (diuretics).","تناول الأدوية: ممكن تغيّر لون البول أو تزوّد كمية البول (المدرّات).","حبايا الضغط المدرّة بتخلّي المريض يتبوّل أكتر."],
["5- Psychological factors: Such as stress, fear, anxiety and emotional factors.","العوامل النفسية: زي التوتر والخوف والقلق والمشاعر.","قبل الامتحان تروح الحمّام كتير من التوتر."],
["6- Pathologic condition: Such as fever, diabetes, infection of the urinary tract.","الحالات المرضية: زي الحمّى والسكر والتهاب المسالك البولية.","سكر عالي يغيّر كمية البول."],
["7- Disease of the nervous system or injuries which might lead to urinary incontinence.","أمراض الجهاز العصبي أو الإصابات ممكن تؤدي لسلس البول.","إصابة الأعصاب فالمخ مش بيتحكم في المثانة."],
["8- Physical activities: Such as immobility.","النشاط البدني: زي عدم الحركة.","مريض ملازم السرير بيتأثر تفريغ المثانة عنده."],
["9- Blood pressure: Low blood pressure, (hemorrhage) lead to low production of urine.","ضغط الدم: انخفاض الضغط (نزيف) بيقلل إنتاج البول.","نزيف فالضغط ينزل والكلى متاخدش دم كفاية فتقل البول."],
["10- Obstruction: Will cause stasis of urine (obstructed urethra, prostatic enlargement).","الانسداد: بيسبب ركود البول (انسداد الإحليل، تضخّم البروستاتا).","زي ما تسد مواسير الحمّام فالمية تقف."],
["11-Hormonal influences: Antidiuretic hormone influence the amount of urine produced.","التأثيرات الهرمونية: الهرمون المضاد لإدرار البول (ADH) بيأثّر على كمية البول.","ADH زي ما يقول للكلى «احتفظي بالمية»، فالبول يقل."]]],
["Assessing Urinary Elimination",[
["Assessment of urinary system: Collection of data. Physical examination. Correlation of these findings with the result of diagnostic tests.","تقييم الجهاز البولي: جمع البيانات، الفحص البدني، وربط النتائج دي بنتائج الفحوصات التشخيصية.","زي المحقق: يجمع معلومات وبعدين يعاين وبعدين يطابق مع التحاليل."],
["Nursing history: Feeling of fullness. Voiding small or large amounts of urine. Normal intake / output. Distended bladder. Discomfort.","التاريخ التمريضي: الإحساس بالامتلاء، تبوّل كميات صغيرة أو كبيرة، المدخل والمخرج الطبيعي، تمدّد المثانة، والانزعاج.","اسأل المريض: «حاسس إن المثانة مليانة؟ بتتبول كام؟»"],
["Physical assessment: * Percussion: of the kidneys to detect areas of tenderness","التقييم البدني: القرع على الكلى عشان نكتشف أماكن الألم.","تدق بخفة على منطقة الظهر ولو المريض اتألم يبقى فيه مشكلة."],
["* Palpation and percussion: of the bladder.","الجس والقرع على المثانة.","تحسس البطن من تحت ودق خفيف على المثانة."],
["* Inspection: of the urethral meatus of both male and female for swelling, discharge, and inflammation.","الفحص بالنظر لفتحة الإحليل عند الراجل والست للبحث عن ورم أو إفرازات أو التهاب.","تبص على فتحة الإحليل لو فيها احمرار أو إفراز."],
["Common renal examination: Visualization procedures:","الفحوصات الكلوية الشائعة: إجراءات التصوير.","صور تشوف بيها الكلى من جوه."],
["• KUB (Kidney, Ureter, and Bladder X-Ray Study): An X-ray showing the kidney, ureter, and bladder.","KUB: أشعة سينية بتظهر الكلية والحالب والمثانة.","أشعة عادية على البطن."],
["• Pyelography: Imaging of the renal pelvis and ureter. (An X-ray technique for producing an image of the renal pelvis and urinary tract by the introduction of a radiopaque fluid).","تصوير الحويضة (Pyelography): تصوير حويضة الكلية والحالب. (أشعة بتنتج صورة للحويضة والمسالك البولية عن طريق حقن سائل بيظهر في الأشعة).","بتحقن صبغة فتظهر الطريق بوضوح."],
["• CT scan: For this study an industrial CT scanner was used allowing for much higher resolution than conventional medical CT devices.","الأشعة المقطعية: في الدراسة دي استُخدم جهاز مقطعي صناعي بيدّي وضوح أعلى بكتير من أجهزة الأشعة المقطعية الطبية العادية.","صورة بتفاصيل أدق من الأجهزة العادية."]]],
["Common Renal Tests",[
["Urinalysis: WBC, RBC, protein, glucose, bacteria = abnormal constituents","تحليل البول: وجود كرات دم بيضا أو حمرا، بروتين، جلوكوز، بكتيريا = مكونات غير طبيعية.","وجود أي منهم في العينة يعني نشوف السبب."],
["BUN: (blood urea nitrogen) The end product of protein metabolism.","BUN (نيتروجين اليوريا في الدم): الناتج النهائي لتمثيل البروتين.","اللي بيتبقى بعد ما جسمك يهضم البروتين."],
["Increased BUN (azotemia) signifies impaired kidney function. Affected by diet (hi protein intake) and fluids (dehydration).","ارتفاع BUN (azotemia) يدل على ضعف وظائف الكلى، وبيتأثر بالأكل (بروتين عالي) والسوائل (الجفاف).","تحليل عالي عند واحد بياكل بروتين كتير أو جافّ."],
["Decreased BUN signifies impaired liver function.","انخفاض BUN يدل على ضعف وظائف الكبد.","الكبد مش بيعمل يوريا كفاية."],
["Serum Creatinine: The product of muscle metabolism excreted entirely by kidneys. (Normal = 0.5-1.2 mg/dL) Increased levels signify renal impairment","كرياتينين الدم: ناتج تمثيل العضلات وبتخرجه الكلى بالكامل. الطبيعي 0.5 لـ 1.2 ملجم/ديسيلتر، وارتفاعه يدل على ضعف الكلى.","لو الكلى ضعيفة هيتراكم في الدم فيرتفع."],
["BUN: Creatinine ratio: 20:1 When both rise together indicates kidney failure or disease.","نسبة BUN للكرياتينين 20 لـ 1. لو الاتنين ارتفعوا مع بعض يدل على فشل كلوي أو مرض بالكلى.","الاتنين مع بعض عالين أقوى دليل على مشكلة كلى."]]],
["Nursing Dx R/T Urinary Elimination",[

["Self-Care Deficit: Toileting…..","قصور في الرعاية الذاتية: استخدام الحمّام…..","مريض مش قادر يروح الحمّام لوحده."],

["Risk for infection R/T urinary retention and/or urinary catheterization","خطر العدوى بسبب (R/T) احتباس البول أو تركيب القسطرة البولية.","البول المحتبس والقسطرة بيزودوا فرصة دخول الميكروبات."],

["Nursing interventions for patient with urinary incontinence",[
["Maintain a fluid intake of 1500 to 2000 ml/ day","حافظ على شرب سوائل من 1500 لـ 2000 مل يومياً.","حوالي 6-8 كوبايات."],
["Provide easy access to bathroom.","وفّر وصول سهل للحمّام.","السرير قريب من الحمّام."],
["Use collection devices when necessary (bed pan, urinal)","استخدم أدوات تجميع عند الحاجة (بدلة، قارورة البول).","مريض مش قادر يقوم يستخدم القارورة."],
["Assess factors that influence voiding.","قيّم العوامل اللي بتأثر على التبوّل.","شوف الأدوية والسوائل والتوتر."],
["Skin care to prevent irritation and breakdown: Cleanliness of linen and clothes.","العناية بالجلد لمنع التهيّج والتقرّح: نضافة الملايات والهدوم.","غيّر الملاية فوراً لو اتبلّت."],
["Frequent turning patient to prevent decubitus ulcer.","تقليب المريض كتير لمنع قرح الفراش.","غيّر وضعيته كل ساعتين."],
["Encourage participation in a bladder training program as (Perineal and abdominal exercises).","شجّع المريض يشارك في برنامج تدريب المثانة، زي تمارين عضلات العجان والبطن.","تمارين تقوّي العضلات المسؤولة عن الإمساك."],
["Strengthening the abdominal muscles by using it to aid air inhalation, tightening and relaxing the perineal muscles 10 times (3 times daily)","تقوية عضلات البطن باستخدامها مع الشهيق، وشدّ وارتخاء عضلات العجان 10 مرات (3 مرات يومياً).","شد وارتخاء 10 مرات ثلاث مرات في اليوم."],
["Bladder retraining programs: Adjusting the fluid intake schedule.","برامج إعادة تدريب المثانة: تظبيط جدول شرب السوائل.","تنظيم مواعيد الشرب."],
["Emotional support.","الدعم النفسي.","طمّن المريض وبلاش تحرجه."],
["Insertion of indwelling catheter as doctor prescribes.","تركيب قسطرة بولية دائمة حسب ما الدكتور يكتب.","القسطرة بأمر الدكتور بس."]]],
["Measures to promote proper urinary elimination for patients suffering from urinary retention",[
["1- Provide privacy to the patient by using curtains or closed doors.","وفّر خصوصية للمريض بالستاير أو قفل الباب.","اقفل الستارة حوالين السرير."],
["2- Restrict fluid intake because urine is accumulated in the urinary bladder. Be aware of fluid intake of patient during the 24 hours.","قلّل السوائل لأن البول متجمّع في المثانة، وخلّي بالك من كمية سوائل المريض خلال الـ 24 ساعة.","سجّل كل اللي شربه."],
["3- Help the patient to assume a sitting position to help him void.","ساعد المريض يقعد عشان يعرف يتبوّل.","القعدة بتساعد."],
["4- Provide a bedside commode if the patient cannot use the bedpan or urinal.","وفّر كرسي حمّام جنب السرير لو مش قادر يستخدم البدلة أو القارورة.","كرسي متنقّل جنب السرير."],
["5- Listening to the sound of running water, help the patient to void.","سماع صوت المية الجارية بيساعد المريض يتبوّل.","افتح الحنفية بجنبه."],
["6- Pour warm over the perineum of the female patient, or help the patient to sit in a warm bath tub.","صبّ ماية دافية على العجان عند الست، أو خلّي المريض يقعد في بانيو دافي.","الدفا بيرخّي العضلات."],
["7- Provide a warm bedpan or urinal.","وفّر بدلة أو قارورة دافية.","متحطش المعدن البارد."],
["8- Apply a warm hot water bottle to the patient lower abdomen.","حط زجاجة مياه ساخنة دافية على أسفل بطن المريض.","كمادة دافية على البطن."],
["9- Put the patient hands in warm water.","حط إيد المريض في ماية دافية.","الدفا يحفّز التبوّل."],
["10-Catheterization: Should be ordered by the physician if the previous measures are not successful.","القسطرة: لازم الدكتور يكتبها لو الإجراءات اللي فاتت منفعتش.","آخر حل بعد ما كل المحاولات تفشل."],
["11- Stimulate the reflex of bladder by applying cold to abdomen.","حفّز انعكاس المثانة بوضع كمادات باردة على البطن.","البرد على البطن يفعّل الانعكاس."],
["12- Assess the bladder distention by palpation and percussion.","قيّم تمدّد المثانة بالجس والقرع.","تتأكد إن المثانة لسه مليانة."],
["13- Assist with toilet at regular intervals.","ساعد المريض يروح الحمّام على فترات منتظمة.","كل كام ساعة خدّه للحمّام."],
["14- Insert folly's catheter as prescribed.","ركّب قسطرة فولي حسب الوصفة.","بأمر الدكتور."]]],
["Urinary catheterization",[
["Urinary catheterization: Consists of inserting a thin hollow tube through the urethra into the bladder to remove urine from the bladder or to establish a patient urine drainage method.","القسطرة البولية: هي إدخال أنبوبة رفيعة مجوّفة من خلال الإحليل لحد المثانة، عشان نسحب البول منها أو نعمل طريقة تصريف مستمرة للبول.","زي ما تدخل شفاط خرطوم رفيع جوه الإحليل يوصل المثانة فالبول يخرج."]]]
