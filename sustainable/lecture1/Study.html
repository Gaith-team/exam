<script>
const D=[
["Introduction",[
["Sustainable development initiatives are becoming increasingly crucial in our quest to address the pressing challenges of poverty, environmental degradation, and social inequality.","مبادرات التنمية المستدامة بقت مهمة أكتر وأكتر عشان نواجه المشاكل الضاغطة: الفقر، وتدهور البيئة، وعدم المساواة بين الناس.","مشروع بيدّي ناس فقيرة شغل، وفي نفس الوقت بيحافظ على نضافة النيل."],
["These initiatives aim to meet the needs of the present without compromising the ability of future generations to meet their own needs.","الهدف إننا نلبّي احتياجات النهارده من غير ما نضيّع حق الأجيال الجاية في إنها تلبّي احتياجاتها.","لو بذّرنا في مية النيل النهارده، ولادنا مش هيلاقوا كفاية؛ فبنرشّد عشان يفضل لهم.","" ],
["At the Foundation for Development Initiatives (FDI), we have dedicated over two decades to implementing sustainable development initiatives that foster community growth and resilience.","في مؤسسة FDI بقالنا أكتر من عشرين سنة بننفّذ مبادرات تنمية مستدامة بتخلّي المجتمع يكبر ويقدر يتحمّل الأزمات.","جمعية أهلية بقالها 20 سنة بتشتغل في القرى، وكل سنة القرية بتبقى أقوى من اللي قبلها."],
["Explore what sustainable development initiatives are, their importance, and how they contribute to the growth and well-being of communities.","هنتعرف يعني إيه مبادرات التنمية المستدامة، وليه مهمة، وإزاي بتساعد المجتمعات تنمو وتعيش في صحة ورفاهية.","زي أي درس: يعني إيه؟ وليه مهم؟ وبيفيد في إيه؟"]
]],
["Definition of Sustainability",[
["It is a dynamic state that necessitates the interconnection of environmental, economic, and social systems to prevent natural resource depletion and maintain environmental balance.","الاستدامة حالة متغيّرة مع الوقت، ومحتاجة النظام البيئي والاقتصادي والاجتماعي يشتغلوا مع بعض عشان الموارد الطبيعية ما تخلصش والتوازن البيئي يفضل موجود.","عجلة فيها تلات تروس: لو ترس واحد وقف، العجلة كلها تقف."],
["Sustainability is fundamental to nursing practice, encompassing ecological, global, and holistic perspectives.","الاستدامة أساسية في ممارسة التمريض، وبتبص للموضوع من زاوية بيئية وعالمية وشاملة.","الممرضة مش بس بتعالج المريض، لكن بتفكّر كمان في المخلفات الطبية وتأثيرها على البيئة."],
["Implementing sustainability can lead to innovations that protect the environment for present and future generations, as it considers environmental impacts at all levels.","تطبيق الاستدامة بيطلّع ابتكارات بتحمي البيئة لينا وللأجيال الجاية، لأنها بتحسب تأثير أي حاجة على البيئة في كل المستويات.","ابتكار أدوات طبية تتعاد تدويرها بدل ما نرميها بلاستيك."],
["Addressing these implications requires significant societal changes, particularly in nursing education, to prepare new nurses for resolving complex issues.","علاج الآثار دي محتاج تغييرات كبيرة في المجتمع، خصوصًا في تعليم التمريض، عشان نجهّز الممرضين الجداد يحلّوا المشاكل المعقّدة.","كلية التمريض تدخّل الاستدامة في المنهج زي أي مادة أساسية."],
["Sustainable development encompasses three dimensions: economy, environment, and society.","التنمية المستدامة بتشمل تلات أبعاد: الاقتصاد، والبيئة، والمجتمع.","كرسي بتلات رجلين: لو رجل ناقصة يقع."]
]],
["Key Components of Sustainable Development Initiatives",[
["1. Environmental Sustainability: Initiatives that focus on environmental sustainability aim to protect and restore ecosystems, reduce pollution, and promote the sustainable use of natural resources.","الاستدامة البيئية: المبادرات دي هدفها تحمي النظم البيئية وترجّعها لحالتها، وتقلّل التلوث، وتشجّع على استخدام الموارد الطبيعية بشكل مستدام.","حملة لتنضيف شاطئ ملوّث وترجيعه نضيف وفيه حياة بحرية."],
["This includes projects like reforestation, renewable energy development, and water conservation.","وده بيشمل مشاريع زي إعادة التشجير، وتطوير الطاقة المتجددة، والحفاظ على المية.","زرع شجر مكان شجر اتقطع، وتركيب ألواح شمسية، وترشيد استهلاك المية."],
["2. Social Sustainability: Social sustainability initiatives work towards improving the quality of life for all community members, with a particular focus on marginalized and vulnerable populations.","الاستدامة الاجتماعية: المبادرات دي بتشتغل على تحسين جودة حياة كل أفراد المجتمع، مع تركيز خاص على الفئات المهمّشة والضعيفة.","مشروع بيوفّر علاج ومساعدة لكبار السن والفقراء في منطقة."],
["These initiatives might include access to education, healthcare, and social services, as well as efforts to promote gender equality and social inclusion.","المبادرات دي ممكن تشمل إتاحة التعليم والرعاية الصحية والخدمات الاجتماعية، وكمان جهود تحقيق المساواة بين الجنسين ودمج الكل في المجتمع.","مدرسة للبنات والولاد بنفس الفرصة، ووحدة صحية قريبة من القرية."],
["3. Economic Sustainability: Economic sustainability involves creating stable and long-term economic opportunities that provide livelihoods without depleting resources.","الاستدامة الاقتصادية: يعني نعمل فرص اقتصادية ثابتة وطويلة المدى بتوفّر مصدر رزق من غير ما نستنزف الموارد.","شغل بيكسّب الناس سنين طويلة من غير ما يخلّص الأرض أو المية."],
["This can include initiatives such as supporting small businesses, promoting sustainable agriculture, and developing skills training programs.","وده ممكن يشمل دعم المشاريع الصغيرة، وتشجيع الزراعة المستدامة، وعمل برامج تدريب على المهارات.","قرض لمشروع صغير، وكورس تدريب على حرفة بتفتح باب رزق."],
["Additionally, the three dimensions on which education for sustainability development tools is centered are knowledge, behavior, and attitude.","كمان، الأبعاد التلاتة اللي بتقوم عليها أدوات التعليم من أجل التنمية المستدامة هي: المعرفة، والسلوك، والاتجاه.","زي ما تتعلّم (معرفة)، وتطبّق (سلوك)، وتقتنع بالفكرة (اتجاه)."],
["Knowledge is the comprehension or awareness of a subject, encompassing one’s information or understanding range.","المعرفة هي فهم الموضوع أو الوعي بيه، وتشمل المعلومات اللي عند الشخص ومدى فهمه.","تعرف إن تقليل البلاستيك مهم وإزاي بيأثر على البيئة."],
["Behavior refers to how an individual conducts themselves, including responses to stimuli and interactions with surroundings.","السلوك هو تصرّف الشخص، وبيشمل ردود أفعاله على المؤثرات وتعامله مع اللي حواليه.","تشيل شنطة قماش معاك بدل ما تاخد كيس بلاستيك كل مرة."],
["Attitudes represent cognitive positions, feelings, or emotions towards facts or states.","الاتجاهات هي المواقف الفكرية أو المشاعر تجاه الحقائق أو الأوضاع.","تحس إن حماية البيئة مسؤوليتك فعلًا ومش مجرد كلام."]
]],
["The Importance of Sustainable Development Initiatives",[
["Sustainable development initiatives are essential for several reasons:","مبادرات التنمية المستدامة ضرورية لعدة أسباب:","زي ما الدوا ليه أكتر من فايدة؛ المبادرات دي ليها أكتر من سبب، وهنشوفهم تحت."],
["1. Long-Term Benefits: Unlike short-term projects that provide immediate but temporary relief, sustainable development initiatives aim for long-term benefits. They create enduring solutions that continue to provide benefits well into the future.","فوايد طويلة المدى: عكس المشاريع القصيرة اللي بتدّي راحة سريعة ومؤقتة، المبادرات دي هدفها فوايد تفضل لسنين، وبتعمل حلول دايمة بتفيد لحد المستقبل.","مسكّن بيوقّف الوجع ساعة (مؤقت)، لكن علاج السبب بيريّحك للأبد (مستدام)."],
["2. Resource Conservation: By focusing on the sustainable use of resources, these initiatives help conserve vital natural resources for future generations. This is crucial in a world facing climate change, deforestation, and other environmental challenges.","الحفاظ على الموارد: بالتركيز على الاستخدام المستدام للموارد، المبادرات دي بتحافظ على الموارد الطبيعية الحيوية للأجيال الجاية. وده مهم جدًا في عالم بيواجه تغيّر المناخ وإزالة الغابات ومشاكل بيئية تانية.","ترشيد استهلاك الكهربا والمية عشان ما تخلصش."],
["3. Community Resilience: Sustainable development initiatives strengthen community resilience by addressing the root causes of poverty and inequality. This helps communities withstand economic, social, and environmental shocks.","صمود المجتمع: المبادرات دي بتقوّي قدرة المجتمع على الصمود لأنها بتعالج الأسباب الجذرية للفقر وعدم المساواة، وده بيساعد المجتمعات تتحمّل الصدمات الاقتصادية والاجتماعية والبيئية.","قرية عندها مصادر رزق متنوعة؛ لو محصول باظ، مش هتجوع."],
["4. Empowerment and Ownership: These initiatives often involve the active participation of community members, fostering a sense of ownership and empowerment. When communities are involved in the planning and implementation of projects, they are more likely to be committed to their success and sustainability.","التمكين والشعور بالملكية: المبادرات دي غالبًا بتشرّك أهل المجتمع بشكل فعّال، وده بيخلّيهم يحسّوا إن المشروع بتاعهم وإنهم أقوياء. ولما يشاركوا في التخطيط والتنفيذ بيبقوا أكتر التزامًا بنجاحه واستمراره.","لما أهل الحي هم اللي يخططوا لحديقة الحي، هيحافظوا عليها أكتر."],
["5. Holistic Approach: Sustainable development initiatives take a holistic approach, addressing multiple interrelated issues simultaneously. This leads to more comprehensive and effective solutions that benefit the community as a whole.","النهج الشامل: المبادرات دي بتتعامل مع أكتر من مشكلة مترابطة في نفس الوقت، وده بيطلّع حلول أشمل وأفعل بتفيد المجتمع كله.","مشروع بيحل الفقر والتعليم والصحة مع بعض مش واحدة واحدة."]
]],
["National Sustainable Development Strategy",[
["The concept of National Sustainable Development Strategy (NSDS) was proposed in 1992 in Agenda 21 (§ 8.7) where countries were called upon to integrate economic, social and environmental objectives into one strategically focused blueprint for action at the national level.","فكرة الاستراتيجية الوطنية للتنمية المستدامة (NSDS) اتطرحت سنة 1992 في أجندة 21 (§ 8.7)، وكانت الدول مطلوب منها تدمج الأهداف الاقتصادية والاجتماعية والبيئية في خطة واحدة مركّزة للتنفيذ على مستوى الدولة.","بدل ما كل وزارة تشتغل لوحدها، الدولة تعمل خطة واحدة تجمع كل الأهداف."],
["However, by 2002, based on national reports received from governments, only about 85 countries had developed some form of national strategies and the nature and effectiveness of these strategies varied considerably from country to country.","لكن لحد سنة 2002، ومن التقارير اللي وصلت من الحكومات، حوالي 85 دولة بس هي اللي عملت شكل من أشكال الاستراتيجيات الوطنية، وطبيعة الاستراتيجيات دي ومدى فعاليتها اختلفت كتير من دولة للتانية.","نفس الامتحان، بس كل طالب ذاكر بطريقة وحصل على نتيجة مختلفة."]
]],
["Core Strategies for Sustainable Development",[
["1. Switching to Renewable Energy: Enough of milking fossil fuels dry, right? Solar, wind, hydro—they’re clean, abundant, and not going anywhere anytime soon. Installing solar panels might seem pricey at first, but in the long run? Light on the pocket and on the planet.","التحوّل للطاقة المتجددة: كفاية استنزاف للوقود الأحفوري. الشمس والرياح والمية نضيفة ومتوفرة ومش هتخلص قريب. تركيب الألواح الشمسية غالي في الأول، بس على المدى الطويل خفيف على جيبك وعلى الكوكب.","تركّب لوح شمسي في البيت، تدفع مرة وتوفّر في فاتورة الكهربا سنين."],
["2. Circular Economy: This one’s a game-changer. Instead of the old-school take-make-throw, we reuse, recycle, and repurpose. Think of it as giving your waste a second life—like turning coconut shells into candles. Cute and conscious.","الاقتصاد الدائري: ده بيغيّر اللعبة. بدل الأسلوب القديم (خُد، اصنع، ارمي) إحنا بنعيد الاستخدام والتدوير وإعادة التوظيف. يعني بنادّي المخلفات حياة تانية، زي تحويل قشر جوز الهند لشمع. فكرة لطيفة وواعية.","تعمل من زجاجة بلاستيك فاضية أصيص زرع بدل ما ترميها."],
["3. Smart Infrastructure: Not all buildings need to guzzle electricity like a thirsty elephant. Green buildings use natural light, proper insulation, and eco-friendly materials. It’s like building homes that breathe with nature.","البنية التحتية الذكية: مش كل المباني لازم تبلع كهربا زي فيل عطشان. المباني الخضراء بتستخدم الضوء الطبيعي والعزل الصح ومواد صديقة للبيئة. كأنك بتبني بيوت بتتنفس مع الطبيعة.","شبابيك كبيرة تدخّل نور الشمس بالنهار فمش محتاج تولّع لمبة."],
["4. Waste Management That Works: Let’s be real, dumping garbage in landfills is so 90s. Composting, waste segregation, and zero-waste kitchens are the new cool. Swasya Living, by the way, walks the talk with its commitment to zero-waste living through eco-conscious living.","إدارة مخلفات بتنفع: خلّينا واقعيين، رمي الزبالة في المدافن موضة التسعينات. التسميد وفصل المخلفات والمطابخ اللي من غير مخلفات هي الموضة الجديدة. وبالمناسبة، Swasya Living بتطبّق الكلام ده بالفعل بالتزامها بالعيش من غير مخلفات من خلال نمط حياة واعي بيئيًا.","تفصل بواقي الأكل في كيس (للتسميد) وعلب البلاستيك في كيس تاني."],
["5. Empowering Local Communities: What’s development if it leaves people behind? Sustainable strategies work best when they include education, local job creation, and gender equity. Let everyone grow—together.","تمكين المجتمعات المحلية: إيه فايدة التنمية لو سابت ناس ورا؟ الاستراتيجيات المستدامة بتنجح أكتر لما تشمل التعليم وتوفير وظايف محلية وعدالة بين الجنسين. خلّي الكل يكبر مع بعض.","مصنع صغير في القرية بيشغّل أهلها رجالة وستات بدل ما يروحوا يدوّروا على شغل بعيد."],
["6. Eco-Friendly Real Estate Development: Promote green building practices on managed farmland. Think rainwater harvesting, solar energy, composting toilets, and using local, sustainable materials for construction.","التطوير العقاري الصديق للبيئة: شجّع ممارسات البناء الأخضر على الأراضي الزراعية المُدارة. فكّر في تجميع مية المطر، والطاقة الشمسية، والحمامات السمادية، واستخدام مواد بناء محلية ومستدامة.","بيت بيجمّع مية المطر في خزان ويستخدمها في ري الزرع."],
["7. Regenerative Agriculture on Farmlands: Encourage regenerative farming techniques like crop rotation, permaculture design, and no-till farming. This boosts soil health, promotes biodiversity, and aligns beautifully with the ethos of sustainable living.","الزراعة التجديدية على الأراضي الزراعية: شجّع أساليب زراعة بترجّع للأرض حيويتها زي الدورة الزراعية، وتصميم الزراعة الدائمة (البيرماكلتشر)، والزراعة من غير حرث. وده بيحسّن صحة التربة ويزوّد التنوع الحيوي وبيتماشى جدًا مع فلسفة العيش المستدام.","تزرع قمح السنة دي وبرسيم السنة اللي بعدها في نفس الأرض، فالتربة ترتاح وتتغذّى."],
["8. Community-Based Sustainability: Host community events—like organic farming workshops, seed exchanges, and clean-up drives. When people feel involved, sustainability becomes a shared responsibility rather than a checklist.","الاستدامة المبنية على المجتمع: نظّم فعاليات مجتمعية زي ورش الزراعة العضوية، وتبادل البذور، وحملات التنضيف. لما الناس تحس إنها مشاركة، الاستدامة بتبقى مسؤولية مشتركة مش مجرد قايمة مهام.","حملة تنضيف في الشارع بيشارك فيها كل أهل الحي."],
["9. Walkable, Minimal Footprint Layouts: Plan communities that reduce the need for daily vehicular use—think walking trails, bike paths, and smart zoning. Let people live in it, not just around it.","تخطيط يمكن المشي فيه وبأقل أثر بيئي: خطّط مجتمعات تقلّل الحاجة لاستخدام العربيات يوميًا، زي ممرات المشي ومسارات العجل والتقسيم الذكي للمناطق. خلّي الناس تعيش جواه مش بس حواليه.","مدرسة وسوق وصيدلية على بُعد خمس دقايق مشي من بيتك، فمش محتاج عربية."]
]],
["Definition of Sustainable Healthcare",[
["The World Health Organization (WHO) defines a Sustainable Healthcare System as ‘a system that improves, maintains or restores health, while minimizing negative impacts on the environment and leveraging opportunities to restore and improve it, to the benefit of the health and well-being of current and future generations.","منظمة الصحة العالمية (WHO) بتعرّف النظام الصحي المستدام إنه نظام بيحسّن الصحة أو يحافظ عليها أو يرجّعها، وفي نفس الوقت بيقلّل الأثر السلبي على البيئة وبيستغل الفرص عشان يرجّعها ويحسّنها، لصالح صحة ورفاهية الأجيال الحالية والجاية.","مستشفى بتعالج المرضى وفي نفس الوقت بتقلّل مخلفاتها وبتوفّر طاقتها."],
["The pharmaceutical industry can play an important role in achieving sustainability by finding ways to improve access to medicines, particularly in developing countries and working to mitigate any environmental impacts from their operations, as well as the products they develop, make, and commercialize.","صناعة الدوا ممكن يكون ليها دور مهم في تحقيق الاستدامة، بإنها تلاقي طرق تسهّل وصول الأدوية للناس خصوصًا في الدول النامية، وتشتغل على تقليل الآثار البيئية لعملياتها وللمنتجات اللي بتطوّرها وتصنّعها وتسوّقها.","شركة أدوية بتوصّل دوا بسعر مناسب للقرى، ومصنعها بيعالج مخلفاته قبل ما يصرفها."]
]],
["Key Principles",[
["Social Progress: Ensuring fair access to education, food, medicine, safety, and other basic needs to foster human potential.","التقدّم الاجتماعي: ضمان وصول عادل للتعليم والأكل والدوا والأمان وباقي الاحتياجات الأساسية عشان نُنمّي قدرات الإنسان.","كل طفل ياخد فرصة تعليم وأكل وعلاج بنفس العدل."],
["Economic Development: Creating inclusive economic growth, decent work, and sustainable industrialization that benefits everyone.","التنمية الاقتصادية: تحقيق نمو اقتصادي شامل، وشغل كريم، وتصنيع مستدام بيفيد الكل.","مصنع بيوفّر وظايف بأجر محترم وبيشتغل بطريقة مش بتلوّث."],
["Environmental Protection: Conserving and using resources like water, forests, and oceans sustainably, and combating climate change by reducing harmful greenhouse gas emissions","حماية البيئة: الحفاظ على الموارد زي المية والغابات والمحيطات واستخدامها بشكل مستدام، ومحاربة تغيّر المناخ بتقليل انبعاثات غازات الاحتباس الحراري الضارة.","تقليل حرق الوقود وحماية البحر من الصيد الجائر."]
]],
["How to Support Sustainable Development",[
["Achieving these goals requires collective action from governments, businesses, and individuals. You can contribute by:","تحقيق الأهداف دي محتاج تعاون من الحكومات والشركات والأفراد. وانت تقدر تساهم عن طريق:","زي فريق كورة: كل واحد له دور والكل لازم يلعب."],
["Conserving resources: by saving energy and water.","الحفاظ على الموارد: بتوفير الطاقة والمية.","تطفّي النور والمروحة لما تخرج من الأوضة، وتقفل الحنفية وانت بتغسل سنانك."],
["Adopting sustainable consumption habits.","اتباع عادات استهلاك مستدامة.","تشتري اللي محتاجه فعلًا وتفضّل المنتجات اللي بتعيش أطول."],
["Reducing waste: through recycling and reusing items.","تقليل المخلفات: بإعادة التدوير وإعادة استخدام الحاجات.","تستخدم الكراسة من الوشّين، وتبيع الجرايد والعلب للتدوير."],
["Using public transportation: or cycling instead of driving.","استخدام المواصلات العامة: أو العجلة بدل سواقة العربية.","تركب المترو أو الأتوبيس للكلية بدل عربية لوحدك."],
["Educating yourself and others: about the SDGs and discussing them with family and friends.","تثقيف نفسك والناس: عن أهداف التنمية المستدامة (SDGs) ومناقشتها مع أهلك وصحابك.","تشرح لصحابك أهداف التنمية المستدامة في قعدة."]
]]
];
