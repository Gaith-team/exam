<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--forest:#0f3d2e;--leaf:#2f9e5b;--ocean:#0b7a9e;--sun:#f2b134;--accent:#2f9e5b;--grad:linear-gradient(135deg,#0f3d2e,#1f7a4d 55%,#2f9e5b);
--bar:linear-gradient(90deg,#e5243b 0 5.88%,#dda63a 0 11.76%,#4c9f38 0 17.64%,#c5192d 0 23.52%,#ff3a21 0 29.4%,#26bde2 0 35.28%,#fcc30b 0 41.16%,#a21942 0 47.04%,#fd6925 0 52.92%,#dd1367 0 58.8%,#fd9d24 0 64.68%,#bf8b2e 0 70.56%,#3f7e44 0 76.44%,#0a97d9 0 82.32%,#56c02b 0 88.2%,#00689d 0 94.08%,#19486a 0 100%);
--bg:#f5f8f1;--bg2:#e8efe3;--card:#fff;--text:#14231b;--text2:#46574d;--bc:rgba(15,61,46,.12)}
[data-theme=dark]{--bg:#0b1510;--bg2:#121f18;--card:#17271f;--text:#e4efe8;--text2:#b3c4b9;--bc:rgba(255,255,255,.1);--accent:#4cc27f}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);line-height:1.8}
#pb{position:fixed;top:0;left:0;height:4px;z-index:99;background:var(--bar);width:0}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bc)}
nav a{color:var(--text2);text-decoration:none;font-weight:700;font-size:13px}
.brand{font-weight:900;display:flex;gap:8px;align-items:center}.logo{background:var(--grad);color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;box-shadow:0 0 0 2px rgba(242,177,52,.6)}
button.th{border:1px solid var(--bc);background:var(--bg2);border-radius:50%;width:36px;height:36px;cursor:pointer}
.hero{background:var(--grad);color:#fff;text-align:center;padding:36px 20px;border-bottom:4px solid var(--sun)}
.hero h1{font-size:clamp(20px,4vw,30px);font-weight:900}.hero p{opacity:.9}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
.toc a{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;border:1px solid var(--bc);background:var(--card);color:var(--text);text-decoration:none}
.toc a:hover{background:var(--accent);color:#fff}
h2{background:var(--grad);color:#fff;border-radius:14px;padding:12px 18px;margin:34px 0 4px;font-size:18px;border-bottom:3px solid var(--sun);direction:ltr;text-align:left;scroll-margin-top:70px}
h3{margin:22px 0 8px;font-size:15px;color:var(--accent);direction:ltr;text-align:left}
.aim{font-size:13px;color:var(--text2);margin:6px 0 4px;direction:ltr}
.card{background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:14px 16px;margin:10px 0;border-left:4px solid var(--accent)}
.en{font-weight:700;direction:ltr;text-align:left;font-size:15px}
.ar{direction:rtl;text-align:right;margin-top:6px;color:var(--text2);font-size:14.5px}
.ex{margin-top:10px;background:rgba(242,177,52,.12);border-right:4px solid var(--sun);border-radius:10px;padding:10px 12px}
.ex b{color:#a8730a;font-size:13px}[data-theme=dark] .ex b{color:var(--sun)}
.ex .en{font-weight:600;font-size:13px;color:var(--text2);margin-top:4px}
figure{margin:14px 0;background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:12px;text-align:center}
figure img{max-width:100%;border-radius:8px}figcaption{font-weight:700;direction:ltr;margin-bottom:8px}
footer{text-align:center;padding:20px;background:var(--bg2);border-top:4px solid var(--leaf);font-weight:700}
footer a{color:#229ED9;text-decoration:none;margin-right:8px}
</style></head><body>

{t:"Sustainable Development Goals",items:[
["h","Introduction:"],
["The Sustainable Development Goals (SDGs) or Global Goals are a collection of 17 interlinked global goals designed to be a \"blueprint to achieve a better and more sustainable future for all\".","الـ SDGs أو الأهداف العالمية دي عبارة عن 17 هدف عالمي مترابطين ببعض، متصممين يكونوا \"خريطة طريق\" نوصل بيها لمستقبل أحسن وأكتر استدامة للكل."],
["The SDGs were set up in 2015 by the United Nations General Assembly (UN-GA) and are intended to be achieved by the year 2030.","الجمعية العامة للأمم المتحدة هي اللي حطت الأهداف دي سنة 2015، والمفروض نحققها لحد سنة 2030."],
["They are included in a UN-GA Resolution called the 2030 Agenda or what is colloquially known as Agenda 2030.","الأهداف دي موجودة جوه قرار صادر من الجمعية العامة اسمه أجندة 2030، أو زي ما الناس بتقول عليه في الكلام العادي \"Agenda 2030\"."],
["The SDGs were developed in the Post-2015 Development Agenda as the future global development framework to succeed the Millennium Development Goals which ended in 2015.","الأهداف اتطورت في أجندة ما بعد 2015 كإطار التنمية العالمي الجاي، وبتيجي بعد الأهداف الإنمائية للألفية اللي خلصت سنة 2015."],
["h","Definition of sustainable Development Goals:"],
["Sustainable Development Goals are a set of global goals designed to create a better and more sustainable future for all, balancing economic growth, social inclusion, and environmental protection.","الأهداف دي مجموعة أهداف عالمية الغرض منها نعمل مستقبل أحسن وأكتر استدامة للكل، وإحنا بنوازن فيه بين النمو الاقتصادي والاندماج الاجتماعي وحماية البيئة."],
["img",IMG2,"Three pillars of sustainable development","الصورة بتوضح إن التنمية المستدامة قايمة على 3 أعمدة بتتقاطع مع بعض: حماية وتحسين البيئة (Environmental Protection and Enhancement)، والتقدم الاجتماعي (Social Progress)، والتنمية الاقتصادية (Economic Development)، ومكان التقاطع في النص هو التنمية المستدامة."],
["img",IMG1,"The Sustainable Development Goals (SDG)","الصورة فيها الـ 17 هدف، كل هدف ليه رقم ولون وأيقونة بتعبر عنه، ومكتوب تحتها الأهداف بالترتيب في القايمة اللي جاية."],
["l","1. No Poverty|2. Zero Hunger|3. Good Health and Well-being|4. Quality Education|5. Gender Equality|6. Clean Water and Sanitation|7. Affordable and Clean Energy|8. Decent Work and Economic Growth|9. Industry, Innovation and Infrastructure|10. Reduced Inequality|11. Sustainable Cities and Communities|12. Responsible Consumption and Production|13. Climate Action|14. Life Below Water|15. Life on Land|16. Peace, Justice and Strong Institutions|17. Partnerships for the Goals","1. القضاء على الفقر|2. القضاء التام على الجوع|3. الصحة الجيدة والرفاهية|4. التعليم الجيد|5. المساواة بين الجنسين|6. المياه النظيفة والصرف الصحي|7. طاقة نظيفة وبأسعار معقولة|8. العمل اللائق والنمو الاقتصادي|9. الصناعة والابتكار والبنية التحتية|10. الحد من عدم المساواة|11. مدن ومجتمعات مستدامة|12. الاستهلاك والإنتاج المسؤولين|13. العمل المناخي|14. الحياة تحت الماء|15. الحياة على الأرض|16. السلام والعدل والمؤسسات القوية|17. الشراكات لتحقيق الأهداف"],
["These goals serve as a global blueprint for achieving a better and more sustainable future for all by 2030","الأهداف دي هي الخريطة العالمية اللي بنمشي عليها عشان نحقق مستقبل أحسن وأكتر استدامة للكل بحلول 2030."]]},
{t:"Goal 1 — No Poverty",aim:"Aims to: End Poverty in All its Forms Everywhere",aar:"الهدف: القضاء على الفقر بكل أشكاله في كل مكان",items:[
["h","Sub-targets"],
["1.1 Eradicate extreme poverty globally by 2030.","1.1 نقضي على الفقر المدقع في العالم كله بحلول 2030."],
["E.g.: 1.1 Adopt clear poverty thresholds and collect detailed data → implement targeted cash transfer programs; monitor by age and region.","نحدد خطوط فقر واضحة ونجمع بيانات تفصيلية، وبعدها ننفذ برامج تحويلات نقدية موجهة للناس المحتاجة، ونتابع الوضع حسب السن والمنطقة.",1],
["1.2 Reduce the proportion of people living below national poverty lines.","1.2 نقلل نسبة الناس اللي عايشة تحت خط الفقر الوطني."],
["E.g.: 1.2 Expand and modernize social safety nets to cover vulnerable populations → direct support to the most at-risk households.","نوسع شبكات الأمان الاجتماعي ونحدثها عشان تغطي الفئات الضعيفة، وبعدها ندي الدعم المباشر للأسر الأكتر عرضة للخطر.",1],
["1.3 Implement comprehensive social protection systems.","1.3 ننفذ أنظمة حماية اجتماعية شاملة."],
["E.g.: 1.3 Establish or expand health insurance and pension systems → register and include marginalized groups.","ننشئ أو نوسع التأمين الصحي وأنظمة المعاشات، وبعدها نسجل الفئات المهمشة وندخلها في المنظومة.",1],
["1.4 Ensure equal rights to economic resources and access to basic services.","1.4 نضمن حقوق متساوية في الموارد الاقتصادية والوصول للخدمات الأساسية."],
["E.g.: 1.4 Introduce policies for land grants, microloans, and vocational training → support small-scale entrepreneurs.","نطبق سياسات زي منح الأراضي والقروض الصغيرة والتدريب المهني، وده بيدعم أصحاب المشروعات الصغيرة.",1],
["1.5 Build resilience of vulnerable groups to economic, social, and environmental shocks.","1.5 نقوي قدرة الفئات الضعيفة على تحمل الصدمات الاقتصادية والاجتماعية والبيئية."],
["E.g.: 1.5 Create national and community emergency funds + disaster risk reduction plans.","ننشئ صناديق طوارئ على مستوى الدولة والمجتمع، ومعاها خطط لتقليل مخاطر الكوارث.",1],
["1.a Establish development support mechanisms in developing countries.","1.a ننشئ آليات لدعم التنمية في الدول النامية."],
["1.b Strengthen financial resources for the poorest countries.","1.b نقوي الموارد المالية للدول الأفقر."],
["E.g.: 1.a / 1.b Build international partnerships and engage the private sector to fund income-generating and infrastructure projects.","نبني شراكات دولية ونشرك القطاع الخاص عشان يمول المشروعات اللي بتجيب دخل ومشروعات البنية التحتية.",1]]},
{t:"Goal 2 — Zero Hunger",aim:"Aims to: End Hunger, Achieve Food Security and Improved Nutrition",aar:"الهدف: القضاء على الجوع وتحقيق الأمن الغذائي وتحسين التغذية",items:[
["h","Sub-targets"],
["2.1 End all forms of malnutrition.","2.1 نقضي على كل أشكال سوء التغذية."],
["E.g.: 2.1 Implement nutrition programs for children and pregnant women + early health screening at primary care level.","ننفذ برامج تغذية للأطفال والحوامل، ومعاها فحص صحي مبكر على مستوى الرعاية الأولية.",1],
["2.2 End hunger and ensure sustainable access to sufficient, safe, and nutritious food for all.","2.2 نقضي على الجوع ونضمن إن الكل يقدر يوصل دايمًا لأكل كفاية وآمن ومغذي."],
["E.g.: 2.2 Establish targeted food distribution networks + school meal programs to guarantee daily nutrition.","ننشئ شبكات توزيع أكل موجهة للمحتاجين، ومعاها برامج وجبات مدرسية تضمن تغذية يومية.",1],
["2.3 Increase sustainable agricultural productivity and support small-scale farmers.","2.3 نزود إنتاجية الزراعة المستدامة وندعم صغار المزارعين."],
["E.g.: 2.3 Provide training for farmers on climate-resilient agriculture and access to quality seeds and fertilizers","ندرب المزارعين على الزراعة اللي بتتحمل التغيرات المناخية، ونوفرلهم بذور وأسمدة كويسة.",1],
["2.4 Increase investment in agricultural research, infrastructure, storage, and cooling systems.","2.4 نزود الاستثمار في الأبحاث الزراعية والبنية التحتية والتخزين وأنظمة التبريد."],
["E.g.: 2.4 Develop local research partnerships and invest in cold chains and storage infrastructure.","نطور شراكات بحثية محلية ونستثمر في سلاسل التبريد وبنية التخزين.",1],
["2.a Ensure fair agricultural markets and access to small-scale financing.","2.a نضمن أسواق زراعية عادلة وإمكانية الحصول على تمويل صغير."],
["2.b Address soil and water problems, reduce food loss and waste.","2.b نحل مشاكل التربة والمياه ونقلل فقد الأكل وهدره."],
["E.g.:2.a / 2.b Offer microloans to farmers, run campaigns to reduce food waste, and adopt policies for soil and water conservation.","نقدم قروض صغيرة للمزارعين، وننظم حملات لتقليل هدر الأكل، ونطبق سياسات للحفاظ على التربة والمياه.",1]]},
{t:"Goal 3 — Good Health and Well-being",aim:"Aims to: Ensure Healthy Lives and Promote Well-being for All at All Ages",aar:"الهدف: نضمن حياة صحية ونعزز الرفاهية للجميع في كل الأعمار",items:[
["h","Sub-targets:"],
["3.1 Reduce maternal mortality.","3.1 نقلل وفيات الأمهات."],
["3.2 End preventable deaths of newborns and children under 5 years old.","3.2 نوقف الوفيات اللي ممكن نتجنبها للمواليد والأطفال تحت 5 سنين."],
["E.g.: 3.1–3.2 Expand antenatal and postnatal care, ensure safe childbirth, promote infant nutrition, and complete vaccination schedules.","نوسع الرعاية قبل الولادة وبعدها، ونضمن ولادة آمنة، ونشجع تغذية الرضع، ونكمل جداول التطعيمات.",1],
["3.3 Combat epidemics (HIV, TB, malaria, neglected tropical diseases).","3.3 نكافح الأوبئة (الإيدز، السل، الملاريا، الأمراض الاستوائية المهملة)."],
["E.g.: 3.3 Strengthen early detection, provide subsidized treatment, and enhance disease surveillance systems.","نقوي الاكتشاف المبكر، ونوفر علاج مدعوم، ونحسن أنظمة مراقبة الأمراض.",1],
["3.4 Reduce premature mortality from non-communicable diseases.","3.4 نقلل الوفيات المبكرة بسبب الأمراض غير المعدية."],
["E.g.: 3.4 Implement prevention programs (healthy diets, physical activity, anti-smoking campaigns).","ننفذ برامج وقاية (أكل صحي، نشاط بدني، حملات مكافحة التدخين).",1],
["3.5 Improve sexual and reproductive health services.","3.5 نحسن خدمات الصحة الجنسية والإنجابية."],
["E.g.: 3.5 Provide accessible family planning services and comprehensive reproductive health education.","نوفر خدمات تنظيم أسرة سهلة الوصول وتثقيف شامل عن الصحة الإنجابية.",1],
["3.6 Reduce road traffic injuries and health emergencies.","3.6 نقلل إصابات حوادث الطرق وحالات الطوارئ الصحية."],
["E.g.: 3.6 Enforce road safety laws and strengthen emergency health response systems.","نطبق قوانين سلامة الطرق ونقوي أنظمة الاستجابة للطوارئ الصحية.",1],
["3.a / 3.b / 3.c Support medical research, achieve universal health coverage, and strengthen the health workforce.","3.a / 3.b / 3.c ندعم الأبحاث الطبية، ونحقق التغطية الصحية الشاملة، ونقوي القوى العاملة الصحية."],
["E.g.: 3.a–3.c Increase funding for public health, train and distribute healthcare workers, and expand access to essential services (UHC).","نزود تمويل الصحة العامة، وندرب العاملين في الرعاية الصحية ونوزعهم، ونوسع الوصول للخدمات الأساسية (التغطية الصحية الشاملة UHC).",1]]},
{t:"Goal 4 — Quality Education",aim:"Aims to: Ensure Inclusive and Equitable Quality Education for All",aar:"الهدف: نضمن تعليم جيد وشامل ومنصف للجميع",items:[
["h","Sub-targets:"],
["4.1 Ensure free, equitable, and quality primary to secondary education.","4.1 نضمن تعليم ابتدائي وثانوي مجاني ومنصف وبجودة كويسة."],
["E.g.: 4.1 Implement free and compulsory education policies, abolish school fees, and support schools in disadvantaged areas.","نطبق سياسات التعليم المجاني الإلزامي، ونلغي المصاريف المدرسية، وندعم المدارس في المناطق المحرومة.",1],
["4.2 Guarantee access to early childhood development and pre-primary education.","4.2 نضمن الوصول لتنمية الطفولة المبكرة والتعليم قبل الابتدائي."],
["E.g.: 4.2 Expand early childhood development programs and train caregivers and teachers.","نوسع برامج تنمية الطفولة المبكرة وندرب مقدمي الرعاية والمعلمين.",1],
["4.3 Ensure equal access to technical, vocational, and higher education.","4.3 نضمن فرص متساوية للتعليم الفني والمهني والعالي."],
["E.g.: 4.3 Promote vocational and technical education through partnerships with industries.","نشجع التعليم المهني والفني عن طريق شراكات مع المصانع والصناعات.",1],
["4.4 Increase technical and vocational skills for youth and adults.","4.4 نزود المهارات الفنية والمهنية للشباب والكبار."],
["E.g.: 4.4 Offer lifelong learning and scholarship opportunities for youth and adults.","نوفر فرص تعلم مدى الحياة ومنح دراسية للشباب والكبار.",1],
["4.5 Eliminate gender disparities in education.","4.5 نلغي الفوارق بين الجنسين في التعليم."],
["E.g.: 4.5 Provide incentives for girls, ensure safe school environments, and adopt gender-sensitive curricula.","نقدم حوافز للبنات، ونضمن بيئة مدرسية آمنة، ونعتمد مناهج بتراعي النوع الاجتماعي.",1],
["4.a Build safe and effective learning environments.","4.a نبني بيئات تعلم آمنة وفعالة."],
["4.b Strengthen curriculum, international assessments, and educational research.","4.b نقوي المناهج والتقييمات الدولية والأبحاث التعليمية."],
["E.g.: 4.a–4.b Invest in schools, labs, teaching resources, and continuous evaluation.","نستثمر في المدارس والمعامل ومصادر التدريس والتقييم المستمر.",1]]},
{t:"Goal 5 — Gender Equality",aim:"Aims to: Achieve Gender Equality and Empower All Women and Girls",aar:"الهدف: نحقق المساواة بين الجنسين ونمكّن كل النساء والفتيات",items:[
["h","Sub-targets:"],
["5.1 End all forms of discrimination against women and girls.","5.1 ننهي كل أشكال التمييز ضد النساء والفتيات."],
["E.g.: 5.1 Enact and enforce anti-discrimination laws; implement community awareness campaigns.","نسن قوانين ضد التمييز ونطبقها، وننفذ حملات توعية في المجتمع.",1],
["5.2 Eliminate gender-based violence, including domestic violence and sexual exploitation.","5.2 نقضي على العنف القايم على النوع، ومنه العنف الأسري والاستغلال الجنسي."],
["E.g.: 5.2 Provide hotlines, shelters, law enforcement support, and legal awareness for victims.","نوفر خطوط ساخنة وأماكن إيواء ودعم من جهات إنفاذ القانون وتوعية قانونية للضحايا.",1],
["5.3 Eliminate harmful practices (female genital mutilation, child marriage).","5.3 نقضي على الممارسات الضارة (ختان الإناث، زواج الأطفال)."],
["E.g.: 5.3 Launch social campaigns and legal reforms to end harmful practices; support families and education for girls.","نطلق حملات مجتمعية وإصلاحات قانونية عشان ننهي الممارسات الضارة، وندعم الأسر وتعليم البنات.",1],
["5.4 Recognize and redistribute unpaid care and domestic work.","5.4 نعترف بشغل الرعاية والبيت اللي من غير أجر ونعيد توزيعه."],
["E.g.: 5.4 Introduce flexible parental leave policies and promote men’s involvement in care work.","نطبق سياسات إجازة والدية مرنة، ونشجع مشاركة الرجالة في شغل الرعاية.",1],
["5.5 Ensure women’s full participation and equal opportunities for leadership.","5.5 نضمن مشاركة المرأة الكاملة وفرص متساوية ليها في القيادة."],
["E.g.: 5.5 Implement women’s economic and political empowerment programs and leadership training.","ننفذ برامج تمكين المرأة اقتصاديًا وسياسيًا وتدريب على القيادة.",1],
["5.a / 5.b Strengthen women’s ownership rights and access to financial resources.","5.a / 5.b نقوي حقوق المرأة في التملك ووصولها للموارد المالية."],
["E.g.: 5.a / 5.b Offer credit facilities to women, ensure equal property rights, and simplify registration procedures.","نقدم تسهيلات ائتمانية للستات، ونضمن حقوق ملكية متساوية، ونبسط إجراءات التسجيل.",1]]},
{t:"Goal 6 — Clean Water and Sanitation",aim:"Aims to: Ensure Availability and Sustainable Management of Water and Sanitation for All",aar:"الهدف: نضمن توافر المياه والصرف الصحي وإدارتهم بشكل مستدام للجميع",items:[
["h","Sub-targets:"],
["6.1 Achieve universal and equitable access to safe and affordable drinking water.","6.1 نحقق وصول الكل بعدالة لمياه شرب آمنة وبسعر مناسب."],
["6.2 Ensure access to adequate sanitation and hygiene for all.","6.2 نضمن للكل صرف صحي ونظافة شخصية كافية."],
["E.g. 6.1–6.2 Invest in water supply networks and sanitation infrastructure, using affordable solutions for remote communities.","نستثمر في شبكات المياه والبنية التحتية للصرف الصحي، ونستخدم حلول رخيصة للمجتمعات البعيدة.",1],
["6.3 Improve water quality and reduce pollution.","6.3 نحسن جودة المياه ونقلل التلوث."],
["E.g. 6.3 Enforce regulations against industrial waste discharge and improve wastewater treatment facilities.","نطبق لوايح بتمنع تصريف المخلفات الصناعية، ونحسن محطات معالجة مياه الصرف.",1],
["6.4 Increase water-use efficiency and ensure sustainable withdrawals.","6.4 نزود كفاءة استخدام المياه ونضمن السحب المستدام منها."],
["E.g. 6.4 Promote efficient irrigation practices and reuse treated water where feasible.","نشجع طرق ري موفرة، ونعيد استخدام المياه المعالجة لو ده ممكن.",1],
["6.5 Implement integrated water resources management, including transboundary cooperation.","6.5 ننفذ إدارة متكاملة للموارد المائية، بما فيها التعاون عبر الحدود."],
["E.g. 6.5 Establish regional cooperation mechanisms for shared water resources.","ننشئ آليات تعاون إقليمي للموارد المائية المشتركة.",1],
["6.a / 6.b Support water and sanitation infrastructure in developing countries and promote community participation.","6.a / 6.b ندعم بنية المياه والصرف الصحي في الدول النامية ونشجع مشاركة المجتمع."],
["E.g. 6.a–6.b Provide funding and technical support for local water projects and build capacity of water management staff.","نوفر تمويل ودعم فني لمشروعات المياه المحلية، وننمي قدرات العاملين في إدارة المياه.",1]]},
{t:"Goal 7 — Affordable and Clean Energy",aim:"Aims to: Ensure Access to Affordable, Reliable, Sustainable and Modern Energy for All",aar:"الهدف: نضمن وصول الكل لطاقة بسعر مناسب، موثوقة، مستدامة وحديثة",items:[
["h","Sub-targets:"],
["7.1 Ensure universal access to modern energy services.","7.1 نضمن وصول الكل لخدمات الطاقة الحديثة."],
["E.g. 7.1 Expand electricity grids to rural areas and promote distributed energy solutions (e.g., solar home systems).","نوسع شبكات الكهرباء للمناطق الريفية، ونشجع حلول الطاقة الموزعة (زي أنظمة الطاقة الشمسية للبيوت).",1],
["7.2 Increase the share of renewable energy in the global energy mix.","7.2 نزود نسبة الطاقة المتجددة في مزيج الطاقة العالمي."],
["E.g. 7.2 Introduce incentives and policies to scale up renewable energy production.","نحط حوافز وسياسات توسّع إنتاج الطاقة المتجددة.",1],
["7.3 Improve energy efficiency globally.","7.3 نحسن كفاءة استخدام الطاقة عالميًا."],
["E.g. 7.3 Encourage energy-efficient appliances, and retrofit buildings and industries.","نشجع الأجهزة الموفرة للطاقة، ونطور المباني والمصانع القديمة عشان تستهلك أقل.",1],
["7.a / 7.b Support clean energy in developing countries and enhance international cooperation.","7.a / 7.b ندعم الطاقة النظيفة في الدول النامية ونعزز التعاون الدولي."],
["E.g. 7.a–7.b Facilitate technology transfer, technical training, and financial support for clean energy in developing countries.","نسهل نقل التكنولوجيا والتدريب الفني والدعم المالي للطاقة النظيفة في الدول النامية.",1]]},
{t:"Goal 8 — Decent Work and Economic Growth",aim:"Aims to: Promote Sustained, Inclusive and Sustainable Economic Growth, Full and Productive Employment and Decent Work for All",aar:"الهدف: نشجع نمو اقتصادي مستمر وشامل ومستدام، وتوظيف كامل ومنتج، وعمل لائق للجميع",items:[
["h","Sub-targets:"],
["8.1 Sustain per capita economic growth, especially in least developed countries.","8.1 نحافظ على نمو نصيب الفرد اقتصاديًا، خصوصًا في أقل الدول نموًا."],
["8.2 Increase economic productivity and innovation.","8.2 نزود الإنتاجية الاقتصادية والابتكار."],
["E.g. 8.1–8.2 Implement growth-friendly policies encouraging investment, innovation, and infrastructure development.","ننفذ سياسات صديقة للنمو بتشجع الاستثمار والابتكار وتطوير البنية التحتية.",1],
["8.3 Promote policies that support decent work and entrepreneurship.","8.3 نشجع سياسات بتدعم العمل اللائق وريادة الأعمال."],
["E.g. 8.3 Support SMEs, create a fair labour market, and encourage entrepreneurship.","ندعم المشروعات الصغيرة والمتوسطة، ونعمل سوق عمل عادل، ونشجع ريادة الأعمال.",1],
["8.4 Improve resource efficiency in consumption and production.","8.4 نحسن كفاءة استخدام الموارد في الاستهلاك والإنتاج."],
["E.g. 8.4 Promote circular economy and resource efficiency.","نشجع الاقتصاد الدائري وكفاءة استخدام الموارد.",1],
["8.5 Eradicate forced labour, end child labour.","8.5 نقضي على العمل القسري وننهي عمالة الأطفال."],
["8.6 Promote youth employment.","8.6 نشجع تشغيل الشباب."],
["E.g. 8.5–8.6 Enforce child labour laws and provide youth training and employment programs.","نطبق قوانين عمالة الأطفال، ونوفر تدريب وبرامج تشغيل للشباب.",1],
["8.7 Develop sustainable tourism that creates jobs.","8.7 نطور سياحة مستدامة بتخلق فرص شغل."],
["E.g. 8.7 Support sustainable tourism through community training and market organization.","ندعم السياحة المستدامة عن طريق تدريب المجتمع وتنظيم السوق.",1]]},
{t:"Goal 9 — Industry, Innovation and Infrastructure",aim:"Aims to: Build Resilient Infrastructure, Promote Inclusive and Sustainable Industrialization and Foster Innovation",aar:"الهدف: نبني بنية تحتية قوية، ونشجع تصنيع شامل ومستدام، ونحفز الابتكار",items:[
["h","Sub-targets:"],
["9.1 Develop quality, reliable, sustainable, and resilient infrastructure.","9.1 نطور بنية تحتية جيدة وموثوقة ومستدامة وقادرة على الصمود."],
["E.g. 9.1 Invest in transport, energy, and communication infrastructure with sustainability plans.","نستثمر في بنية النقل والطاقة والاتصالات ومعاها خطط استدامة.",1],
["9.2 Promote inclusive and sustainable industrialization.","9.2 نشجع تصنيع شامل ومستدام."],
["E.g. 9.2 Encourage local manufacturing while maintaining environmental standards.","نشجع التصنيع المحلي مع الحفاظ على المعايير البيئية.",1],
["9.3 Increase research, development, and innovation.","9.3 نزود البحث والتطوير والابتكار."],
["E.g. 9.3 Provide incentives for R&D and university–industry partnerships.","نقدم حوافز للبحث والتطوير وللشراكات بين الجامعات والصناعة.",1],
["9.4 Upgrade and retrofit infrastructure.","9.4 نحدّث البنية التحتية ونطورها."],
["E.g. 9.4 Establish institutional maintenance plans and clear budgets for periodic upgrades.","نعمل خطط صيانة مؤسسية وميزانيات واضحة للتحديث الدوري.",1],
["9.5 Support ICT and expand internet access.","9.5 ندعم تكنولوجيا المعلومات والاتصالات ونوسع الوصول للإنترنت."],
["E.g. 9.5 Expand rural internet access and digital skills training.","نوسع الإنترنت في الريف وندرب الناس على المهارات الرقمية.",1],
["9.a / 9.b / 9.c Support industrial infrastructure in developing countries with financial and technical assistance.","9.a / 9.b / 9.c ندعم البنية الصناعية في الدول النامية بمساعدة مالية وفنية."]]},
{t:"Goal 10 — Reduced Inequality",aim:"Aims to: Reduce Inequality Within and Among Countries",aar:"الهدف: نقلل عدم المساواة داخل الدول وبينها",items:[
["h","Sub-targets :"],
["10.1 Reduce income inequality.","10.1 نقلل عدم المساواة في الدخل."],
["E.g. 10.1 Implement progressive tax systems and targeted social transfers.","ننفذ نظام ضرائب تصاعدي وتحويلات اجتماعية موجهة.",1],
["10.2 Empower and promote the inclusion of all.","10.2 نمكّن الكل ونشجع إدماجهم."],
["10.3 Ensure representation of marginalized groups.","10.3 نضمن تمثيل الفئات المهمشة."],
["E.g. 10.2–10.3 Introduce inclusive laws and empowerment programs for marginalized groups (e.g., people with disabilities, minorities).","نطبق قوانين شاملة وبرامج تمكين للفئات المهمشة (زي ذوي الإعاقة والأقليات).",1],
["10.4 Adopt policies that facilitate economic mobility.","10.4 نعتمد سياسات بتسهل الحراك الاقتصادي."],

const $=s=>document.getElementById(s);let h="",toc="";
S.forEach((g,i)=>{
 toc+=`<a href="#s${i}">${i?"G"+i:"Intro"}</a>`;
 h+=`<h2 id="s${i}">${g.t}</h2>`;
 if(g.aim)h+=`<div class="card"><div class="en">${g.aim}</div><div class="ar">${g.aar}</div></div>`;
 g.items.forEach(x=>{
  if(x[0]=="h")h+=`<h3>${x[1]}</h3>`;
  else if(x[0]=="img")h+=`<figure><figcaption>${x[2]}</figcaption><img src="${x[1]}" alt="${x[2]}"><div class="ar">${x[3]}</div></figure>`;
  else if(x[0]=="l"){const a=x[1].split("|"),b=x[2].split("|");h+=`<div class="card">`+a.map((e,k)=>`<div class="en" style="margin-top:8px">${e}</div><div class="ar">${b[k]}</div>`).join("")+`</div>`}
  else if(x[2])h+=`<div class="ex" style="margin:-4px 0 12px"><b>عشان تفهمها :</b><div class="en">${x[0]}</div><div class="ar">${x[1]}</div></div>`;
  else h+=`<div class="card"><div class="en">${x[0]}</div><div class="ar">${x[1]}</div></div>`;
 });
});
$("app").innerHTML=h;$("toc").innerHTML=toc;
