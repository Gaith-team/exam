<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2b1646;--enzyme:#c2255c;--substrate:#0fa3a3;--amber:#f5a524;--helix:#5c7cfa;--accent:#c2255c;
--grad:linear-gradient(135deg,#2b1646 0%,#4a1d6b 58%,#7a1f5c 100%);
--bar:linear-gradient(90deg,#0fa3a3 0 25%,#c2255c 25% 50%,#f5a524 50% 75%,#5c7cfa 75% 100%);
--bg:#f7f3f8;--bg2:#ece5ef;--card:#fff;--text:#1f1429;--text2:#55465f;--text3:#85768f;--bc:rgba(43,22,70,.11);--exbg:#fff7e6;--exbd:#f5a524}
[data-theme=dark]{--bg:#140c1d;--bg2:#1e1229;--card:#251735;--text:#efe8f5;--text2:#c3b5cf;--text3:#8d7e99;--bc:rgba(255,255,255,.1);--accent:#ee5c93;--exbg:#2e2112;}
body{font-family:'Readex Pro',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;transition:background .3s}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:var(--bar)}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(247,243,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--bc)}
[data-theme=dark] nav{background:rgba(20,12,29,.95)}
.brand{font-weight:700;font-size:15px;display:flex;align-items:center;gap:9px}
.logo{width:32px;height:32px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:var(--grad);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
#tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{background:var(--grad);padding:40px 20px 34px;border-bottom:5px solid;border-image:var(--bar) 1;color:#fff}
.hero-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:16px}
.hero .ic{font-size:44px}
.hero h1{font-size:clamp(24px,5vw,34px);line-height:1.2}
.hero p{opacity:.85;font-size:14px;margin-top:4px}
.toc{max-width:820px;margin:18px auto 0;display:flex;flex-wrap:wrap;gap:8px;padding:0 20px}
.toc a{font-size:12px;font-weight:500;text-decoration:none;color:var(--text2);background:var(--card);border:1px solid var(--bc);padding:5px 12px;border-radius:8px}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:820px;margin:0 auto;padding:10px 20px 70px}
h2{margin:36px 0 14px;padding:12px 16px;background:var(--ink);color:#fff;border-radius:12px;font-size:18px;border-bottom:3px solid var(--amber);scroll-margin-top:70px}
h3{margin:22px 0 10px;font-size:15px;color:var(--accent);padding-left:10px;border-left:4px solid var(--amber)}
.it{background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 12px rgba(43,22,70,.05)}
.en{direction:ltr;text-align:left;font-weight:600;font-size:15px}
.ar{direction:rtl;text-align:right;color:var(--text2);font-size:14.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bc)}
.ex{direction:rtl;text-align:right;margin-top:9px;background:var(--exbg);border-right:4px solid var(--exbd);border-radius:8px;padding:9px 12px;font-size:14px}
.ex b{color:var(--warn,#b86e00);margin-left:4px}
[data-theme=dark] .ex b{color:var(--amber)}
.im{background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:12px;margin-bottom:12px}
.im img{width:100%;height:auto;display:block;border-radius:8px;background:#fff}
.im .ar{margin-top:10px}
.imt{direction:rtl;font-size:12px;font-weight:700;color:var(--substrate);margin-bottom:8px}
footer{text-align:center;padding:20px;border-top:4px solid;border-image:var(--bar) 1;background:var(--bg2);font-size:13px;color:var(--text2)}
footer span{color:var(--accent);font-weight:700}
</style>
</head>

const D=[
['h','Lipid — Chemistry'],
['s','Definition and characters'],
['i','Organic substances','يعني مواد عضوية أساسها الكربون والهيدروجين، زيها زي السكريات والبروتينات.','الزيت اللي في المطبخ والسمنة، الاتنين مركبات أساسها كربون وهيدروجين.'],
['i','Water insoluble','مبتدوبش في الماية.','حط زيت في كوباية ماية هتلاقيه طافي فوق ومش بيتخلط.'],
['i','Soluble in fat solvents (polar solvents) as alcohols, acetone','بتدوب في المذيبات الدهنية زي الكحول والأسيتون.','بقعة زيت على الهدوم الماية لوحدها مش بتشيلها، لكن الأسيتون بيدوّبها.'],
['i','Formed mainly of alcohol and fatty acids (FA) combined together by ester linkage.','الدهن بيتكوّن غالبًا من كحول + أحماض دهنية (FA)، وبيتربطوا ببعض برابطة اسمها ester linkage (رابطة إستر).','تخيل حبلين (الكحول والحمض الدهني) مربوطين بعقدة، العقدة دي هي رابطة الإستر.'],
['m','eq','المعادلة بتوضح تكوين الإستر: حمض كربوكسيلي (R-COOH) + كحول (R\'-OH) في وجود H⁺ بيدّوا إستر (R-COO-R\') + ماية (H₂O). يعني الإستر بيتكوّن لما بنشيل ماية من الحمض والكحول، والسهم اللي في الاتجاهين معناه إن التفاعل ممكن يترجع. R و R\' هما أي سلاسل هيدروكربونية.'],
['s','Function'],
['i','1- Energy Storage and production','الوظيفة الأولى: تخزين الطاقة وإنتاجها.','زي الحصّالة، بتحوّش فيها وقت الرخا وتصرف منها وقت الحاجة.'],
['i','Fat stores energy as triglycerides in adipose tissue, mobilizing it during fasting or increased energy demand where one gram of fat produce 9.3 kcal.','الجسم بيخزن الطاقة في النسيج الدهني (adipose tissue) على شكل triglycerides، ويطلعها وقت الصيام أو لما الطاقة المطلوبة تزيد. وكل 1 جرام دهن بيدّي 9.3 كيلو كالوري.','لو صايم ولا بتجري كتير، جسمك بيفتح الحصّالة دي ويسحب منها طاقة.'],
['i','2- Insulation and Protection','الوظيفة التانية: العزل والحماية.','زي الجاكت اللي بيدفّيك ويحميك.'],
['i','Fat insulates the body, maintaining temperature and protecting organs from physical shocks and injuries.','الدهن بيعزل الجسم وبيحافظ على درجة حرارته، وبيحمي الأعضاء من الخبطات والإصابات.','زي الفوم اللي بيتحط حوالين الحاجة الزجاج في الكرتونة عشان متتكسرش.'],
['i','3- Cell Membrane Structure','الوظيفة التالتة: بناء غشاء الخلية.','الدهون هي طوب سور الخلية.'],
['i','Fatty acids in cell membranes maintain structural integrity, fluidity, and regulate substance movement.','الأحماض الدهنية في غشاء الخلية بتحافظ على تماسكه ومرونته (fluidity) وبتنظم دخول وخروج المواد.','الغشاء زي بوابة الكومباوند: ثابتة وقوية وبتتحكم مين يدخل ومين يخرج.'],
['i','4- Hormone Production and Regulation','الوظيفة الرابعة: إنتاج الهرمونات وتنظيمها.','النسيج الدهني مش مجرد مخزن، ده كمان بيبعت رسايل (هرمونات).'],
['i','Adipose tissue secretes hormones and adipokines, regulating energy metabolism, appetite, and insulin sensitivity.','النسيج الدهني بيفرز هرمونات و adipokines بتنظم أيض الطاقة والشهية وحساسية الجسم للأنسولين.','زي مدير مخزن بيبلّغ المخ: "المخزون كفاية" فالشهية تقل، أو "المخزون ناقص" فتجوع.'],
['i','5- Fat soluble vitamin absorption and Storage','الوظيفة الخامسة: امتصاص وتخزين الفيتامينات الذائبة في الدهون.','الفيتامينات دي محتاجة دهن عشان تتشال بيه.'],
['i','Fat aids in absorbing and storing fat-soluble vitamins A, D, E, and K, crucial for various physiological functions.','الدهن بيساعد في امتصاص وتخزين الفيتامينات A, D, E, K وهي مهمة لوظائف كتير في الجسم.','زي الصبغة اللي بتدوب في الزيت مش في الماية، الفيتامينات دي كده محتاجة الدهن عشان تدوب وتتمتص.'],
['i','6- Brain Function and Development','الوظيفة السادسة: وظيفة المخ ونموه.','المخ نفسه فيه دهون كتير.'],
['i','Essential fatty acids, especially omega-3s, support brain development, cognitive function, and mental health.','الأحماض الدهنية الأساسية وخصوصًا omega-3 بتدعم نمو المخ والتفكير والصحة النفسية.','زي البنزين الكويس للعربية: المخ بيشتغل أحسن لما ياخد الدهن المناسب.'],
['i','7- Immune System Support','الوظيفة السابعة: دعم جهاز المناعة.','الدهون بتساعد الجسم في الدفاع عن نفسه ضد الميكروبات.'],
['i','8- Skin Health','الوظيفة الثامنة: صحة الجلد.','جلد جاف ومتشقق ممكن يكون ناقص دهون.'],
['i','Fat contributes to the skin’s water barrier, insulation, hair follicle cycling, wound healing, and immune defense.','الدهن بيكوّن حاجز مائي للجلد (water barrier)، وبيعزل، وبينظم دورة بصيلات الشعر، وبيساعد في التئام الجروح والدفاع المناعي.','زي طبقة الورنيش على الخشب: بتحميه وبتمنع ماية الجلد تتبخر.'],
['i','9- Organ Protection','الوظيفة التاسعة: حماية الأعضاء.','الدهن حوالين الأعضاء زي الوسادة.'],
['i','Fat cushions vital organs like the kidneys and heart, absorbing impact and providing mechanical support.','الدهن بيعمل وسادة للأعضاء الحيوية زي الكلى والقلب، وبيمتص الصدمات وبيسندها ميكانيكيًا.','الكلية مرمية جوه جسمك، فلو وقعت أو اتخبطت الدهن اللي حواليها بيخفف الخبطة.'],
['i','10- Act as surfactants, detergents and emulsifying agents (amphipathic lipids)','الوظيفة العاشرة: بتشتغل كـ surfactants و detergents و emulsifying agents (مستحلبات)، وده بيحصل في الدهون الـ amphipathic، يعني اللي ليها طرف بيحب الماية وطرف بيحب الدهن.','زي سائل غسيل المواعين: طرف بيمسك الدهن وطرف بيمسك الماية فيفصّل الدهن ويغسله.'],
['i','11- Metabolic regulators (steroid hormones and prostaglandins)','الوظيفة الحداشر: منظمات أيضية، زي الهرمونات الستيرويدية والـ prostaglandins.','زي مفاتيح تحكم بتظبط شغل الجسم.'],

['h','Classification'],
['m','class','الشارت بيقسم الـ Lipid لـ 4 أنواع: (1) Simple lipid وفيه Neutral fat (الكحول فيه جليسرول) و Wax (الكحول فيه أعلى من الجليسرول). (2) Compound lipid وهو دهون بسيطة + مواد تانية زي حمض الفوسفوريك أو كربوهيدرات أو بروتين. (3) Derived lipid وهو ناتج تكسير الاتنين اللي فوق: الكحولات (glycerol, higher alcohol, sphingosine) والأحماض الدهنية ومواد تانية (فوسفوريك أسيد، نيتروجينيوس بيز، إينوزيتول، سكر، سلفات). (4) Substances associated with lipid: مواد مصاحبة للدهون زي الفيتامينات الذائبة في الدهن (A, D, E, K) و steroid و carotenoid.'],
['s','1- Simple lipids include'],
['i','Neutral fats: Formed of Glycerol and 3 fatty acids (FA) = triacylglycerol(TAG)','الـ Neutral fats بتتكوّن من جليسرول + 3 أحماض دهنية، واسمها triacylglycerol واختصارها TAG.','جليسرول = شماعة بتلات حلقات، وكل حلقة بتعلّق عليها حمض دهني.'],
['i','Waxes: formed of alcohol higher than glycerol and FA as ear wax (Cerumen)','الـ Waxes (الشموع) بتتكوّن من كحول أعلى من الجليسرول + حمض دهني، زي شمع الودن (Cerumen).','الشمع اللي بيطلع في ودنك هو أقرب مثال.'],
['i','Neutral fats (Triacylglycerols (TAG)= Triglycerides)','الـ Neutral fats هي نفسها TAG وهي نفسها Triglycerides، تلات أسماء لنفس الحاجة.','زي واحد اسمه محمد وبيتنادى مو ومحمدو، هو هو.'],
['i','Are triesters of FAs with the trihydric alcohol glycerol.','يعني ثلاث روابط إستر بين الأحماض الدهنية والجليسرول، والجليسرول كحول فيه 3 مجموعات OH (trihydric).','الجليسرول ليه 3 أماكن للربط، وكل مكان فيه حمض دهني.'],
['i','Glycerol units with 3 FAs','وحدة جليسرول مرتبطة بـ 3 أحماض دهنية.','واحد جليسرول + تلاتة FA = TAG واحد.'],
['m','tag','الصورة بتوضح تركيب الـ TAG: عمود الجليسرول (CH₂ – CH – CH₂) وكل ذرة كربون متعلق بيها حمض دهني (R₁ و R₂ و R₃) عن طريق رابطة الإستر (Ester bond) اللي هي O=C–O. والرسمة اللي على اليمين بتبسطها: جليسرول و f.a. 1 و f.a. 2 و f.a. 3.'],
['s','2- Compound or complex lipid'],
['i','Formed of simple lipids + other substances or groups, examples e.g.,','بتتكوّن من دهون بسيطة + مواد أو مجموعات تانية.','زي ساندوتش: الدهن هو العيش، والمادة التانية هي الحشو.'],
['i','Carbohydrate and lipids = glycolipids,','كربوهيدرات + دهون = glycolipids.','Glyco تعني سكر.'],
['i','Protein and lipids = lipoproteins &','بروتين + دهون = lipoproteins.','Lipo = دهن، protein = بروتين، فالاسم بيقولك هي إيه.'],
['i','Phosphoric acids +lipids→ phospholipids','حمض الفوسفوريك + دهون = phospholipids.','Phospho = فوسفات.'],
['s','3- Derived Lipids'],
['i','They are breakdown products of simple and complex lipid (fatty acids)','دي نواتج تكسير الدهون البسيطة والمركبة، زي الأحماض الدهنية.','زي ما تفك مكعب ليجو لقطع، القطع دي هي الـ derived.'],
['s','4- Substances associated with lipids, e.g.,'],
['i','Fat soluble vitamins (A, D, E & K)','الفيتامينات الذائبة في الدهن (A, D, E, K).','حرف ADEK، احفظهم كده.'],
['i','Sterols as cholesterol.','الـ Sterols زي الكوليسترول.','الكوليسترول أشهر واحد فيهم.'],
['m','family','الصورة بتوضح عيلة الدهون: Wax = حمض دهني + كحول طويل السلسلة. Triglyceride = جليسرول + 3 أحماض دهنية. Phospholipid = جليسرول + حمضين دهنيين + فوسفات + amino alcohol. Glycolipid = sphingosine + حمض دهني + سكر. Steroid = حلقات كربونية متلزقة (مش فيها أحماض دهنية).'],

['h','Fatty acid'],
['i','They are organic compounds containing hydrocarbon chain with a terminal carboxyl group.','الحمض الدهني مركب عضوي فيه سلسلة هيدروكربونية وفي آخرها مجموعة كربوكسيل (COOH).','تخيله ديل طويل (السلسلة) وراسه هي الـ COOH.'],
['m','fa','الصورة بتقول: الأحماض الدهنية هي أحماض كربوكسيلية ليها سلسلة هيدروكربونية جانبية. الصيغة العامة R–COOH، الـ R هي السلسلة الهيدروكربونية (Hydrocarbon chain) والـ COOH هي المجموعة الكربوكسيلية (Carboxylic group).'],
['m','chain','المعادلة بتوضح الشكل: CH₂–CH₂–CH₂... هي السلسلة الهيدروكربونية (باللون الأزرق)، وفي آخرها COOH (باللون الأحمر) وهي مجموعة الكربوكسيل.'],
['s','How to number carbon atoms of a fatty acid?'],
['m','num','الصورة بتشرح الترقيم على مثال حمض البالمتيك (Palmitic acid) وهو 16 كربون: بنبدأ العدّ من ناحية الكربوكسيل (COOH) وده رقم 1، وبعده 2 وهكذا لحد رقم 16 عند الميثيل. الكربون رقم 2 اسمه α (ألفا)، ورقم 3 اسمه β (بيتا)، وآخر كربون ناحية الميثيل (CH₃) اسمه ω (أوميجا). يعني: Carboxyl end = أول السلسلة، Methyl end = آخرها.'],
['s','Classification of FA'],
['s','According to total number of carbon atoms'],
['i','Even chain: more common in nature','عدد الكربونات زوجي، وده الأكتر انتشارًا في الطبيعة.','زي 16 كربون (البالمتيك) رقم زوجي.'],
['i','Odd chain.','عدد الكربونات فردي.','أقل شيوعًا.'],
['s','According to length of hydrocarbon chain'],
['i','Short: between 1-6 carbon atoms','قصيرة: من 1 لـ 6 كربونات.','أقصر سلسلة.'],
['i','Medium: 6-12 carbon atoms.','متوسطة: من 6 لـ 12 كربون.','في النص.'],
['i','Long: 12-20 carbon atoms.','طويلة: من 12 لـ 20 كربون.','زي البالمتيك (16) داخل هنا.'],
['i','Very long: >20 carbon atoms.','طويلة جدًا: أكتر من 20 كربون.','الأطول.'],
['s','Nature of hydrocarbon chain'],
['i','Saturated: FAs that does not contain any unsaturated= double bonds in its hydrocarbon chain','Saturated (مشبع): حمض دهني مفيهوش أي روابط مزدوجة (double bonds) في السلسلة.','كل ذرة كربون ماسكة أقصى عدد هيدروجين ممكن، فمفيش مكان فاضي.'],
['i','Unsaturated:','Unsaturated (غير مشبع): فيه رابطة مزدوجة أو أكتر.','فيه "فجوة" في الهيدروجين عند الرابطة المزدوجة.'],
['i','Mono-unsaturated: 1 double bond','Mono-unsaturated: رابطة مزدوجة واحدة.','Mono = واحد.'],
['i','Poly-unsaturated fatty acid (PUFA): 2 or more double bonds','Poly-unsaturated (PUFA): رابطتين مزدوجتين أو أكتر.','Poly = كتير.'],
['m','satur','الصورة بتقارن: على الشمال Saturated كل الكربونات بروابط مفردة (—) وكل كربون ماسك هيدروجينات. على اليمين Unsaturated فيه رابطة مزدوجة (C=C) متعلّم عليها (Double bound) والكربونين اللي عليها ماسكين هيدروجين أقل.'],
['i','Branched: e.g. iso-valeric acid','Branched (متفرع): السلسلة فيها تفريعة، زي iso-valeric acid.','زي فرع شجرة طالع من الجذع.'],
['i','Hydroxy: e.g. cerebronic acid','Hydroxy: فيه مجموعة OH على السلسلة، زي cerebronic acid.','زي ما تحط ملصق OH على السلسلة.'],
['i','Cis and trans fatty acids','فيه كمان تقسيم لـ Cis و Trans.','التفاصيل تحت.'],
['s','cis- and trans-fatty acids'],
['i','Unsaturated FA exhibit geometrical isomerism at the double bonds.','الأحماض غير المشبعة ليها شكلين هندسيين (geometrical isomerism) عند الرابطة المزدوجة.','نفس الحروف بس ترتيبها في الفراغ مختلف، زي إيدين لابس الساعة في اليمين ولا الشمال.'],
['i','All the naturally occurring FAs have the cis configuration. However, trans fatty acids are formed during metabolism.','كل الأحماض الدهنية الطبيعية شكلها cis، لكن الـ trans بتتكوّن أثناء الأيض (metabolism).','الطبيعة بتعمل cis، والـ trans غالبًا ناتج تغيير.'],
['m','cis','الصورة بتوضح: في الـ Cis الهيدروجينين على نفس الجهة من الرابطة المزدوجة. وفي الـ Trans الهيدروجينين في جهتين متقابلتين.'],
['i','Artificial trans fats: Created industrially by adding hydrogen to liquid vegetable oils (hydrogenation) to make them solid at room temperature and extend shelf life.','الـ trans fats الصناعية بتتعمل في المصانع بإضافة هيدروجين لزيوت نباتية سايلة (hydrogenation) عشان تبقى صلبة في حرارة الغرفة وتعيش أطول على الرف.','زي الزبدة النباتية أو السمن الصناعي: كان زيت سايل واتحوّل لحاجة صلبة.'],
['i','Worsens cholesterol: It raises low-density lipoprotein (LDL or "bad" cholesterol) and lowers high-density lipoprotein (HDL or "good" cholesterol).','بتضر الكوليسترول: بترفع LDL (الكوليسترول الوحش) وبتقلل HDL (الكوليسترول الكويس).','يعني بتزوّد الوحش وتشيل الكويس، يعني ضرر مضاعف.'],
['m','facls','الشارت بيلخص تقسيم الأحماض الدهنية على 3 أسس: حسب إجمالي عدد الكربونات (Even / Odd)، وحسب طول السلسلة (Short / Medium / Long / Very long)، وحسب طبيعة السلسلة (Saturated / Unsaturated / Branched chain / Hydroxy).'],
['s','According to nutritional value: Essential and non essential'],
['i','Essential fatty acids cannot be made by the human body and must come from food (poyunsaturated fatty acid=PUFA)','الأحماض الدهنية الأساسية (Essential) الجسم مش بيعرف يصنعها، لازم تيجي من الأكل، وهي الـ PUFA.','زي الفيتامين اللي لازم تاخده من برا لأن جسمك مش مصنع ليه.'],
['i','while non-essential fatty acids are produced naturally by the body.','أما غير الأساسية فالجسم بيصنعها لوحده.','الجسم مكفي نفسه فيها.'],
['s','Clinically significant PUFA Include'],
['i','Linoleic (ω6): (double bond lies between 6 and 7 carbon starting numbring from methyle group','Linoleic (ω6): الرابطة المزدوجة بين الكربون 6 و 7 وإحنا بنعدّ من ناحية الميثيل.','ω6 يعني أول رابطة مزدوجة عند الكربون رقم 6 من الميثيل.'],
['i','Linolenic (ω3): the best','Linolenic (ω3): هو الأحسن.','ω3 أول رابطة عند الكربون رقم 3 من الميثيل.'],
['i','Arachidonic acids (ω6)','Arachidonic acid (ω6).','تاني ω6 غير اللينوليك.'],
['i','PUFA (ω3, present in fish oil, of great nutritional importance in lowering of serum cholesterol level in patient with coronary heart disease).','الـ PUFA من نوع ω3 موجود في زيت السمك، وأهميته الغذائية كبيرة لأنه بيقلل كوليسترول الدم عند مرضى القلب التاجي (coronary heart disease).','ده السبب إن الدكاترة بتنصح بالسمك لمريض القلب.'],
['s','Arachidonic acid'],
['i','Is the precursor of prostaglandins (mediate inflammation)','Arachidonic acid هو المادة الأولية (precursor) اللي بتتصنع منها prostaglandins، وهي بتتوسط الالتهاب.','زي الخامة اللي بتتصنع منها مادة بتسبب الالتهاب.'],

['h','Metabolism of lipids'],
['s','1- Absorption and digestion'],
['i','Triglycerides: Make up over 95% of the lipids in our food and body, consisting of three fatty acids attached to a glycerol backbone.','Triglycerides بتمثل أكتر من 95% من الدهون في أكلنا وجسمنا، وبتتكوّن من 3 أحماض دهنية متعلقين على عمود جليسرول.','يعني لو بتاكل دهون، تقريبًا كلها TAG.'],
['i','Phospholipids: Found in foods like egg yolks and soybeans;','Phospholipids موجودة في أكلات زي صفار البيض وفول الصويا.','صفار البيض أشهر مصدر.'],
['i','Sterols: Such as cholesterol, which is found exclusively in animal products.','الـ Sterols زي الكوليسترول، وده موجود في المنتجات الحيوانية بس.','لحمة وبيض ولبن فيها كوليسترول، الخضار لأ.'],
['m','digest','الصورة بتوضح خطوات هضم الدهون: الدهون الغذائية (أغلبها triglycerides) تتكسر ميكانيكيًا في الفم والمعدة (Physical break-up) فتبقى قطرات دهن في الـ chyme. في الأمعاء الدقيقة بيحصل Emulsification بواسطة bile salts وتحلل جزئي (Partial hydrolysis) بواسطة pancreatic lipase فتتكوّن Mono- و Diglycerides في micelles. بعدين Absorption في جدار الأمعاء، وهناك بيتم تصنيع triglycerides وتتغلف جوه chylomicrons لتنتقل في الدم.'],
['s','2- Lipogenesis'],
['i','Definition: it is the synthesis of TAG','Lipogenesis هي تصنيع الـ TAG.','Genesis = تكوين، فهي تكوين الدهن.'],
['i','This process includes three steps:','العملية دي فيها 3 خطوات.','التلاتة تحت.'],
['i','Biosynthesis of glycerol','تصنيع الجليسرول.','العمود الفقري.'],
['i','Biosynthesis of FA.','تصنيع الأحماض الدهنية.','الحلقات اللي هتتعلق.'],
['i','Biosynthesis of triacylglycerols.','تصنيع الـ triacylglycerols نفسها.','تجميع الشماعة مع الحلقات.'],
['s','Biosynthesis of glycerol'],
['i','Glycerol is an alcohol containing three hydroxyl groups. It can be synthesized from products of glucose oxidation.','الجليسرول كحول فيه 3 مجموعات هيدروكسيل (OH)، وبيتصنع من نواتج أكسدة الجلوكوز.','يعني من السكر ممكن الجسم يعمل جليسرول.'],
['s','Biosynthesis of FA'],
['i','According to the site of synthesis, FA. can be synthesized in cytoplasm or Mitochondria.','حسب مكان التصنيع، الأحماض الدهنية ممكن تتصنع في السيتوبلازم أو الميتوكوندريا.','فيه مكانين للتصنيع.'],
['i','The cytoplasm of many organs including liver, kidney, brain, lung, mammary gland, and adipose tissue.','السيتوبلازم في أعضاء كتير زي الكبد والكلى والمخ والرئة والغدة اللبنية والنسيج الدهني.','أعضاء كتير بتصنّع دهن مش الكبد بس.'],
['i','Building unit is acetyl CoA from excess glucose','وحدة البناء هي acetyl CoA الجاية من الجلوكوز الزيادة.','زي طوبة الدهن: لو أكلت سكر زيادة عن حاجتك، يتحول لـ acetyl CoA ويتبني منه دهن.'],
['s','Regulation of lipogenesis'],
['s','a. Nutritional regulation'],
['i','The rate of lipogenesis is high during well fed stated especially carbohydrate.','معدل lipogenesis بيبقى عالي وإنت شبعان (well fed)، خصوصًا لو أكلت كربوهيدرات.','أكلت كتير نشويات، الجسم بيخزن الزيادة دهون.'],
['i','Sucrose increases lipogenesis when fed instead of glucose.','السكروز بيزوّد lipogenesis لما يتاكل بدل الجلوكوز.','السكر العادي بيزوّد تصنيع الدهن أكتر من الجلوكوز.'],
['i','lipogenesis is depressed in fasting and carbohydrate deprivation.','الـ lipogenesis بتقل في الصيام ونقص الكربوهيدرات.','مفيش أكل، مفيش تخزين.'],
['s','b. Hormonal regulation'],
['i','Glucagon inhibits gene expression & induction of enzyme necessary for FA biosynthesis.','الجلوكاجون بيثبّط التعبير الجيني وتحفيز الإنزيمات اللازمة لتصنيع الأحماض الدهنية.','الجلوكاجون هرمون الجوع، فبيوقف التصنيع.'],
['i','Insulin: activates gene expression & hence the enzymes responsible for FA biosynthesis.','الأنسولين بينشّط التعبير الجيني وبالتالي الإنزيمات المسؤولة عن تصنيع الأحماض الدهنية.','الأنسولين هرمون الشبع، فبيشغّل التصنيع.'],
['s','3- Lipolysis'],
['i','Definition: Lipolysis is the breakdown of neutral fats into glycerol and fatty acids.','Lipolysis هو تكسير الدهون المتعادلة (neutral fats) لجليسرول وأحماض دهنية.','Lysis = تكسير، عكس lipogenesis.'],
['i','Site: Lipolysis occurs in adipose tissues.','المكان: النسيج الدهني.','المخزن نفسه.'],
['i','Steps: - Triacylglycerols is hydrolyzed by hormone sensitive triglyceride lipase','الخطوات: الـ triacylglycerols بتتحلل بالماية (hydrolysis) بواسطة إنزيم hormone sensitive triglyceride lipase.','الإنزيم ده زي مقص بيقص الأحماض الدهنية من الجليسرول، وبيتحكم فيه الهرمونات.'],
['s','Regulation'],
['s','a. Nutritional regulation'],
['i','Over feeding of carbohydrates: Lipogenesis increased & lipolysis is inhibited','الإفراط في أكل الكربوهيدرات: lipogenesis بتزيد و lipolysis بتتثبط.','بتخزن ومبتصرفش.'],
['i','Starvation: Low carbohydrates leading to decrease glucose which is the major source for energy. So, Lipolysis increases to give FA ready for oxidation to provide energy for the body.','في الجوع: الكربوهيدرات تقل فالجلوكوز (المصدر الرئيسي للطاقة) يقل، فالـ lipolysis بتزيد عشان تطلّع أحماض دهنية جاهزة تتأكسد وتدّي طاقة.','الجسم خلّص الكاش (جلوكوز) فبيبيع من المخزون (دهن).'],
['s','b. Hormonal regulation'],
['i','Insulin Hormone inactivate the hormone-sensitive triglyceride lipase so decrease lipolysis','الأنسولين بيعطّل الإنزيم hormone-sensitive triglyceride lipase فالـ lipolysis تقل.','الأنسولين بيقفل المخزن.'],
['s','c. Anti insulin hormones'],
['i','Anti insulin hormones: activate the hormone-sensitive triglyceride lipase so increase lipolysis','الهرمونات المضادة للأنسولين بتنشّط الإنزيم فالـ lipolysis تزيد.','الهرمونات دي بتفتح المخزن.'],
['s','d. Diabetes mellitus, infection, thyrotoxicosis, Cushing\'s syndrome'],
['i','Diabetes mellitus, infection, thyrotoxicosis, Cushing\'s syndrome are associated with increase lipolysis.','السكر والعدوى والتسمم الدرقي ومتلازمة كوشينج مرتبطين بزيادة lipolysis.','الحالات دي كلها فيها هرمونات مضادة للأنسولين أو نقص تأثيره، فالمخزن بيتفتح.'],
['m','lipoly','الصورة بتوضح تنظيم lipolysis في الخلية الدهنية (Adipocyte): على الشمال، الجوع (Starvation) والرياضة (Exercise) والكاتيكولامينات (Catecholamines) بترفع cAMP فتزيد Lipolysis (السهم الأحمر لفوق). على اليمين، الأنسولين (Insulin) والتغذية (Feeding) بيخفّضوا cAMP فتقل Lipolysis (السهم الأزرق لتحت).'],
['s','4- Fatty acids oxidation'],
['i','Oxidation of FA may occur at the β-carbon & α-carbon or ω-carbon in different process, named β-oxidation, α-oxidation or ω-oxidation, respectively.','أكسدة الأحماض الدهنية ممكن تحصل عند الكربون بيتا أو ألفا أو أوميجا، وبتتسمى على الترتيب β-oxidation و α-oxidation و ω-oxidation.','اسم العملية على اسم الكربون اللي بتحصل عنده.'],
['i','Before fatty acid oxidation, FA be activated to acyl-CoA','قبل الأكسدة لازم الحمض الدهني يتنشّط ويتحول لـ acyl-CoA.','زي ما تشغل العربية قبل ما تمشي بيها.'],
['s','1. Activation of FA'],
['i','Site: cytoplasm','مكان التنشيط: السيتوبلازم.','قبل ما يدخل الميتوكوندريا.'],
['i','After activation of FA to fatty acyl-CoA, short & medium chain FA diffuse through the mitochondria but long chain fatty acid need carnitine shuttle.','بعد التنشيط لـ fatty acyl-CoA، الأحماض القصيرة والمتوسطة بتعدّي للميتوكوندريا بالانتشار، لكن الطويلة محتاجة carnitine shuttle.','الصغيرين يعدّوا من الباب، الكبير محتاج عربية نقل (carnitine).'],
['s','Carnitine shuttle'],
['i','Carnitine is present in all tissues & in excess in muscle.','الكارنيتين موجود في كل الأنسجة وبكميات زيادة في العضلات.','العضلات بتحرق دهون كتير فبتحتاجه أكتر.'],
['i','Long chain acyl CoA will not penetrate the inner membrane of mitochondria','الـ long chain acyl CoA مش بيخترق الغشاء الداخلي للميتوكوندريا لوحده.','محتاج وسيلة نقل.'],
['i','Carnitine myopathy is a rare metabolic muscle disease caused by a shortage of carnitine, (body needs to turn fats into energy).','Carnitine myopathy مرض أيضي نادر في العضلات سببه نقص الكارنيتين، (الجسم محتاجه عشان يحوّل الدهون لطاقة).','من غير كارنيتين الدهون متدخلش الميتوكوندريا فالعضلة متلاقيش طاقة.'],
['i','Some Athletes take L– carnitine as a supplement for muscle function improvement','بعض الرياضيين بيستخدموا L-carnitine كمكمل لتحسين وظيفة العضلات.','زي اللي بياخد مكمل في الجيم.'],
['m','carn','الصورة بتوضح β-oxidation: الدهون (TAG) بتتحلل لجليسرول وأحماض دهنية. الحمض الدهني بيتنشّط لـ Fatty acyl CoA في السيتوبلازم، وبعدين يعدّي الغشاء عن طريق Carnitine Shuttle لجوه الميتوكوندريا. جوه، الـ Fatty acyl CoA بيتأكسد وبيطلع Acetyl CoA اللي بيدخل دورة كريبس (Oxaloacetate و Citrate) وبيطلع ATP.'],
['s','I. β-oxidation'],
['i','Site: All cells, inside mitochondria.','المكان: كل الخلايا، جوه الميتوكوندريا.','كل خلية ليها ميتوكوندريا فبتقدر تحرق دهن.'],
['i','Steps: Several enzymes, known collectively as «FA oxidase» are found in the mitochondrial matrix or inner membrane adjacent to the respiratory chain.','الخطوات: إنزيمات كتير اسمها «FA oxidase» موجودة في matrix الميتوكوندريا أو الغشاء الداخلي جنب السلسلة التنفسية (respiratory chain).','مجموعة عمال في المصنع جنب خط الإنتاج.'],
['i','Beta oxidation end by production of energy+ acetyl CoA which mostly enters Krebs for complete oxidation','β-oxidation بتنتهي بإنتاج طاقة + acetyl CoA اللي غالبًا بيدخل دورة كريبس للأكسدة الكاملة.','الناتج بيكمل رحلته في كريبس.'],
['i','The total ATP gained from complete oxidation of palmitate via β-oxidation followed by Krebs cycle equals to: 28 ATP + 80 ATP = 108 ATP.','إجمالي الـ ATP من الأكسدة الكاملة للبالمتيت (palmitate) بـ β-oxidation ثم كريبس = 28 + 80 = 108 ATP.','28 من β-oxidation نفسها، و 80 من كريبس، المجموع 108.'],
['s','II- α-oxidation of FA'],
['i','a type of oxidation occurs at α-carbon because the β-carbon is connected to methyl group as in oxidation of branched chain (phytanic acid)','أكسدة بتحصل عند كربون ألفا لأن كربون بيتا متعلق بيه مجموعة ميثيل، زي أكسدة الحمض المتفرع (phytanic acid).','β-oxidation مش قادرة تشتغل لأن التفريعة واقفة في الطريق، فالجسم بيستخدم α.'],
['s','Lipoproteins metabolism'],
['i','Lipoproteins are lipid transport molecules that transport plasma lipids across different tissues.','الـ Lipoproteins جزيئات نقل للدهون بتنقل دهون البلازما بين الأنسجة.','زي عربيات توصيل الدهون في الدم.'],
['i','Lipoproteins are complex molecules that involve several different components.','هي جزيئات معقدة فيها مكونات مختلفة.','مش حاجة واحدة.'],
['i','They contain a central core made of triglycerides and cholesterol esters','جواها قلب (core) مكوّن من triglycerides و cholesterol esters.','الحمولة جوه العربية.'],
['i','Surrounding this core is a layer of amphipathic lipid phospholipids, free cholesterol, These are oriented so that the polar groups face outward to the aqueous medium.','حوالين القلب طبقة من دهون amphipathic (phospholipids وكوليسترول حر) متوجهة بحيث الأجزاء القطبية (polar) ناحية الوسط المائي.','الأطراف اللي بتحب الماية ناحية الدم، والدهون مستخبية جوه.'],
['i','The protein part of lipoprotein is called apolipoproteins or apoprotein (apo).','الجزء البروتيني في الـ lipoprotein اسمه apolipoproteins أو apoprotein (apo).','البروتين هو "البطاقة" اللي بتعرّف الجزيء.'],
['i','The apolipoproteins provide structure and function in lipid metabolism. They are particularly important, as they play a role in classifying lipoproteins into 6 main classes','الـ apolipoproteins بتدّي الشكل والوظيفة في أيض الدهون، ومهمة جدًا لأنها بتساهم في تصنيف الـ lipoproteins لـ 6 أنواع رئيسية.','نوع الـ apo هو اللي بيحدد نوع الـ lipoprotein.'],
['m','lpstruct','الصورة بتوضح تركيب الـ lipoprotein: في النص core من دهون غير قطبية في الأساس (triacylglycerol و cholesteryl ester). حواليه monolayer من دهون amphipathic (phospholipid و free cholesterol)، وعليه بروتينات: Peripheral apoprotein (زي apo-C) على السطح، و Integral apoprotein (زي apo-B) مغروس في الطبقة. والشبه كبير بتركيب غشاء الخلية.'],
['s','Types of lipoproteins'],
['m','lplist','الأنواع: Chylomicron و VLDL و IDL و LDL و HDL، وكمان Free fatty acids.'],
['m','sep','الصورة بتوضح طريقتين لفصل الـ lipoproteins. الـ Ultracentrifugation: بتتفصل على حسب الكثافة، الدهن أخف من الماية فالجزيئات الغنية بالدهن كثافتها قليلة وتطفو، والترتيب من فوق: Chylomicron ثم VLDL ثم IDL ثم LDL ثم HDL ثم FFA. الـ Electrophoresis: الجزيئات اللي بروتينها أكتر بتتحرك أسرع ناحية القطب الموجب (anode)، والأقل بروتين حركتها قليلة. الترتيب: Chylomicron عند الأصل (origin) وبعده LDL (beta) ثم IDL (broad β) ثم VLDL (pre-β) ثم HDL (alpha) وأسرعهم FFA مع الألبومين.'],
['s','Lipid profile'],
['i','A lipid profile is a blood test that measures specific fats and cholesterol in your blood to evaluate your risk of heart disease and stroke.','الـ Lipid profile تحليل دم بيقيس دهون وكوليسترول معينة عشان يقيّم خطر أمراض القلب والسكتة الدماغية (stroke).','التحليل ده زي كشف دوري على صحة القلب.'],
['i','LDL (Low-Density Lipoprotein) Cholesterol: Known as "bad cholesterol," which can build up and block arteries.','LDL هو الكوليسترول الوحش، ممكن يتراكم ويسد الشرايين.','زي الرواسب اللي بتسد مواسير الميه.'],
['i','HDL (High-Density Lipoprotein) Cholesterol: Known as "good cholesterol," which helps remove bad cholesterol from your arteries.','HDL هو الكوليسترول الكويس، بيساعد في شيل الكوليسترول الوحش من الشرايين.','زي عربية الزبالة اللي بتنضف الشرايين.'],
['i','Triglycerides: A type of fat stored for energy from excess calories.','Triglycerides نوع دهن بيتخزن كطاقة من السعرات الزيادة.','أي أكل زيادة عن احتياجك بيتخزن كده.'],
['i','VLDL (Very Low-Density Lipoprotein): Carries triglycerides through the bloodstream','VLDL بينقل الـ triglycerides في مجرى الدم.','عربية نقل الـ TAG.'],
['s','Ketone bodies (ketogenesis= synthesis and ketolysis=breakdown)'],
['i','1- Ketone bodies are water-soluble molecules or compounds that contain the ketone groups, produced from fatty acids by the liver (ketogenesis).','الأجسام الكيتونية جزيئات بتدوب في الماية فيها مجموعات كيتون، والكبد بيصنعها من الأحماض الدهنية (ketogenesis).','Ketogenesis تصنيع الكيتون، و ketolysis تكسيره.'],
['i','2- Three substances are collectively known as “ketone bodies” (or “acetone bodies”). Acetoacetate, acetone and β-OH butyric acid They are metabolic products that are produced in excess during excessive breakdown of fatty acid.','التلات مواد دي اسمها الأجسام الكيتونية (أو الأسيتونية): Acetoacetate و acetone و β-OH butyric acid. وبتتنتج بكتر لما تكسير الأحماض الدهنية يزيد قوي.','فكّر فيها كـ "عادم" لما الجسم يحرق دهون كتير.'],
['i','3- Ketonaemia: Rise of ketone bodies in blood above normal level is known as ketonaemia.','Ketonaemia: ارتفاع الأجسام الكيتونية في الدم فوق المعدل الطبيعي.','Aemia = في الدم.'],
['i','4- Ketonuria: When the blood level of ketone bodies rises above the renal threshold, they are excreted in urine and are called as ketonuria.','Ketonuria: لما مستوى الكيتونات في الدم يعدّي حد الكلى (renal threshold) بتطلع في البول.','Uria = في البول.'],
['i','5- Ketosis: Accumulation of abnormal amount of ketone bodies in tissues and body fluids is termed as ketosis','Ketosis: تراكم كمية غير طبيعية من الكيتونات في الأنسجة وسوائل الجسم.','تراكمها في الجسم كله.'],
['i','6- Ketoacidosis: Acetoacetic acid and β-OH-butyric acid are moderately strong acids. They are buffered when present in blood and tissues by sodium bicarbonate, loss of this buffer cations, progressively depletes the alkali reserve causing ketoacidosis. This may be fatal in uncontrolled diabetes mellitus.','Ketoacidosis: حمض acetoacetic و β-OH-butyric أحماض قوية نسبيًا، والدم بيتعادلها (buffer) بالصوديوم بيكربونات. ولما الـ buffer ده يخلص تدريجيًا، الاحتياطي القلوي (alkali reserve) بيقل وتحصل حموضة كيتونية (ketoacidosis). وممكن تبقى مميتة في السكر غير المنضبط.','زي الإسفنجة اللي بتمتص الحمض، لما تتشبع الحمض يفضل في الدم ويبوّظ توازنه.'],
['s','Causes of ketoacidosis'],
['i','a. hyperemesis gravidarum','القيء الشديد أثناء الحمل.','القيء المستمر بيقلل الأكل فالجسم يحرق دهن.'],
['i','b. Prolonged Starvation','الجوع الطويل.','مفيش جلوكوز فالجسم يحرق دهون.'],
['i','c. Carbohydrate poor diet, High fat diet (ketodiet)','نظام غذائي فقير في الكربوهيدرات وعالي الدهون (الكيتو دايت).','النظام اللي بيمنع النشويات.'],
['i','d. In Diabetes mellitus: In uncontrolled diabetes mellitus, there could be a pathological state of ketosis (or ketoacidosis or even ketoacidotic coma) that may be fatal. In diabetic ketosis, the ketonuria causes loss of sodium and potassium salts of the keto acids leading to severe dehydration.','في السكر: لو السكر غير منضبط ممكن تحصل حالة مرضية من الكيتوزيس (أو الكيتوأسيدوزيس أو غيبوبة كيتونية) وقد تكون مميتة. وفي الكيتوزيس السكري، الكيتونوريا بتسبب فقد أملاح الصوديوم والبوتاسيوم الخاصة بالأحماض الكيتونية فيحصل جفاف شديد.','الكيتونات وهي طالعة في البول بتشد معاها أملاح وماية، فالمريض يتجفف.'],
['s','Cholesterol metabolism'],
['i','It is the animal sterols.','الكوليسترول هو الـ sterol الحيواني.','موجود في الحيوان مش النبات.'],
['i','Cholesterol can both be synthesized endogenously about 0.7g\\day from (Acetyl CoA) and exogenously about 0.3g\\day from (obtained from the diet, meat, eggs, and milk).','الكوليسترول بيتصنع داخليًا (endogenous) حوالي 0.7 جم/يوم من Acetyl CoA، وخارجيًا (exogenous) حوالي 0.3 جم/يوم من الأكل (لحمة وبيض ولبن).','الجسم بيعمل أغلبه بنفسه (0.7) والأكل بيدّي الباقي (0.3).'],
['i','It is present in tissues and in plasma either as free cholesterol or combined with a long-chain fatty acid as cholesteryl ester, the storage form.','موجود في الأنسجة والبلازما إما كوليسترول حر أو متحد مع حمض دهني طويل السلسلة على شكل cholesteryl ester وده شكل التخزين.','حر = شغال، إستر = متخزن.'],
['i','In plasma, both forms are transported in lipoproteins.','في البلازما الشكلين بيتنقلوا جوه الـ lipoproteins.','محتاجين عربيات نقل.'],
['i','Plasma low-density lipoprotein (LDL) is the vehicle of uptake of cholesterol and cholesteryl ester into many tissues. cholesterol is removed from tissues by plasma high-density lipoprotein (HDL) and transported to the liver, where it is eliminated from the body either unchanged or after conversion to bile acids in the process known as reverse cholesterol transport.','الـ LDL هو وسيلة توصيل الكوليسترول لأنسجة كتير. والـ HDL بيشيل الكوليسترول من الأنسجة وينقله للكبد، وهناك بيتخلص منه الجسم إما كما هو أو بعد تحويله لأحماض صفراوية (bile acids)، والعملية دي اسمها reverse cholesterol transport (النقل العكسي للكوليسترول).','LDL بيوصّل، HDL بيرجّع للكبد، زي ذهاب وعودة.'],
['i','It is synthesized in many tissues from acetyl-CoA by HMGCoA reductase enzyme','بيتصنع في أنسجة كتير من acetyl-CoA بواسطة إنزيم HMG-CoA reductase.','الإنزيم ده هو المفتاح في تصنيع الكوليسترول.'],
['s','Function of cholesterol'],
['i','1- Cholesterol is the precursor of all other steroids in the body, for example, corticosteroids, sex hormones,','الكوليسترول مادة أولية لكل الستيرويدات التانية زي الكورتيكوستيرويدات والهرمونات الجنسية.','زي الخامة الأم.'],
['i','2- Cholesterol is the precursor bile acids, and','هو مادة أولية للأحماض الصفراوية.','الصفرا بتتصنع منه.'],
['i','3- Cholesterol is the precursor vitamin D','هو مادة أولية لفيتامين D.','وده مهم لو الدنيا شمس.'],
['i','4- It also plays an important structural role in membranes and in the outer layer of lipoproteins.','وله دور تركيبي مهم في الأغشية وفي الطبقة الخارجية للـ lipoproteins.','جزء من تركيب الغشاء.'],
['s','Fatty liver (Steatosis)'],
['i','Definition: It is the accumulation of excessive amount of lipids more than 4% of the weight of the liver leading to liver cells replacement by fibrous tissues with subsequent liver cirrhosis.','التعريف: تراكم كمية زيادة من الدهون أكتر من 4% من وزن الكبد، فتتحل الخلايا بنسيج ليفي (fibrous) وبعدها تيجي تليف الكبد (cirrhosis).','لما الكبد يتحول لمخزن دهون ويتلف.'],
['s','Causes of Fatty liver'],
['i','1. Over feeding of fats.','الإفراط في أكل الدهون.','دهون زيادة داخلة الكبد.'],
['i','2. Over feeding of carbohydrates.','الإفراط في أكل الكربوهيدرات.','الزيادة بتتحول لدهن.'],
['i','3. Over mobilization of F.A from depot fat to liver (diabetes).','زيادة سحب الأحماض الدهنية من مخازن الدهن للكبد (زي السكر).','المخزن بيفتح كتير والكبد يستقبل كتير.'],
['i','4. Decreased oxidation of F.A. (Deficiency of carnitine).','نقص أكسدة الأحماض الدهنية (نقص الكارنيتين).','مفيش حرق فالدهن يتراكم.'],
['i','5. Increased NADH/NAD ratio as in alcoholism.','زيادة نسبة NADH/NAD زي الكحوليات.','بتعطل الحرق.'],
['i','6. Decreased mobilization of fats from liver to blood (defect in lipoprotein synthesis, decrease Lipotropic Factors).','نقص خروج الدهون من الكبد للدم (خلل في تصنيع الـ lipoprotein أو نقص الـ Lipotropic Factors).','الدهن داخل بس مش لاقي عربية تطلعه.'],
['s','Lipotropic Factors'],
['i','Definition: These are factors which facilitate transport of TAG from liver to be utilized by the tissues.','التعريف: عوامل بتسهّل نقل الـ TAG من الكبد عشان الأنسجة تستخدمه.','Lipo = دهن، tropic = تحرّك.'],
['i','These factors may be either: 1. Substances needed for phospholipid biosynthesis. 2. Substances needed for protein biosynthesis.','العوامل دي إما مواد لازمة لتصنيع الـ phospholipids أو مواد لازمة لتصنيع البروتين.','لأن الـ lipoprotein ده دهن فوسفوليبيد + بروتين.'],
['s','Substances needed for phospholipid biosynthesis'],
['i','A. Essential F.A.','الأحماض الدهنية الأساسية.','الأولى.'],
['i','B. Inositol.','Inositol.','التانية.'],
['i','C. Choline','Choline.','التالتة.'],
['i','D. Substances needed for choline biosynthesis as Methionine, Folic acid and Vit.B12','مواد لازمة لتصنيع الـ choline زي Methionine و Folic acid و Vit.B12.','لو الـ choline ناقص يبقى دول ناقصين.'],
['s','2. Substances needed for protein biosynthesis'],
['i','A. Protein of high biological value.','بروتين عالي القيمة البيولوجية.','زي البيض واللحمة.'],
['i','B. Essential amino acid (e.g Methionine).','حمض أميني أساسي (زي Methionine).','الميثيونين ظهر هنا وهناك.'],
['s','Antilipotropic Factors'],
['i','Definition: These are substances which inhibit mobilization of fats from the liver.','التعريف: مواد بتمنع خروج الدهون من الكبد.','عكس الـ lipotropic.'],
['i','Causes: 1. Substances Which inhibit phospholipid biosynthesis.','الأسباب: مواد بتثبط تصنيع الـ phospholipids.','تقفل العربية.'],
['i','2. Substances Which inhibit protein biosynthesis.','ومواد بتثبط تصنيع البروتين.','برضه تقفل العربية.']
];
