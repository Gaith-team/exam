*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#2b1646;--enzyme:#c2255c;--substrate:#0fa3a3;--amber:#f5a524;--helix:#5c7cfa;

--bg:#f7f3f8;--bg2:#ece5ef;--card:#fff;--text:#1f1429;--text2:#55465f;--text3:#85768f;--bc:rgba(43,22,70,.11);

.hero-band-icon{width:76px;height:76px;flex-shrink:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:34px}

.score-ring svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}

.ring-bg{stroke:var(--bg2)}.ring-fill{stroke:var(--accent);transition:stroke-dashoffset 1s ease}

.rs{background:var(--bg2);border-radius:10px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:700}.rs .l{font-size:11px;color:var(--text3)}

.report-item .ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:6px;font-weight:600;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(214,51,74,.1);color:var(--danger)}.ri-right{background:rgba(19,138,91,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:var(--grad);color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
.btn-home:hover{border-color:var(--accent);color:var(--accent)}
footer{background:var(--bg2);border-top:4px solid;border-image:var(--grad-bar) 1;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:600}.footer-brand span{color:var(--accent)}
.footer-tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:500}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 28px}.hero-band-icon{width:60px;height:60px;font-size:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const QUESTIONS = [

  questions=shuffle([...pool]);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' سؤال';
  startTimer();render();
}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const badge=document.getElementById('timerBadge');
    if(timeLeft<=120)badge.className='timer-badge danger';else if(timeLeft<=300)badge.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish();}
  },1000);
}
function updateTop(){
  const total=questions.length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
function render(){
  updateTop();
  const q=questions[i];
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i];const ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{const el=document.getElementById('opt'+idx);el.classList.add('disabled');if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');});
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🧪</span> <span> 🎉 ما شاء الله عليك</span>`:`<span class="feedback-icon">😔</span> <span>ركز ، نحاول فيها تاني باذن الله</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){const exp=document.createElement('div');exp.className='explanation';exp.style.display='block';exp.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(exp);}
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'<i class="fa-solid fa-arrow-left"></i> السؤال التالي':'<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}</button>`;
}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop();}next();}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'});}else finish();}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length;const score=Math.round((correct/total)*100);
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]});});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gradeColor;
  if(score>=90){grade='🥇 ممتاز';gradeColor='var(--success)';}
  else if(score>=75){grade='🥈 جيد جداً';gradeColor='var(--substrate)';}
  else if(score>=60){grade='🥉 جيد';gradeColor='var(--warn)';}
  else{grade='📚 راجع تاني';gradeColor='var(--danger)';}
  const circ=2*Math.PI*45;const offset=circ-(score/100)*circ;
  const reportHTML=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`
      <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0?q.o[answers[idx]]:'تم التخطي'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`;
  }).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring"><svg viewBox="0 0 110 110">
        <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
        <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
      </svg><div class="score-num">${score}</div><div class="score-pct">%</div></div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--substrate)">${total-answered<0?0:total-answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px"><div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${reportHTML}</div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset;},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  const pool=[...wrongSet];
  questions=shuffle(pool);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme=localStorage.getItem('theme')||'light';
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');themeBtn.textContent=t==='dark'?'☀️':'🌙';localStorage.setItem('theme',t);}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
