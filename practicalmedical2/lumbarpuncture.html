<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent:#0f9d8f; --accent-light:#2dd4bf; --accent-dark:#0b6e79; --accent-glow:rgba(15,157,143,0.2); --accent-rgb:15,157,143;
  --c2:#7c3aed; --c3:#f59e0b; --c4:#ec4899;
  --grad:linear-gradient(135deg,#0b6e79 0%,#7c3aed 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,#0f9d8f,#7c3aed);
  --bg:#f7f9fc; --bg2:#eef1f8; --card:#ffffff; --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07); --success:#16a34a; --danger:#e11d48; --warn:#d97706; --r:16px;
  --tr:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:#0f0d1a; --bg2:#181528; --card:#211d36; --text:#ece9f7; --text2:#bdb8d6; --text3:#8a84a8;
  --bc:rgba(255,255,255,0.09); --accent:#2dd4bf; --accent-light:#5eead4; --accent-dark:#14b8a6;
  --accent-glow:rgba(45,212,191,0.2); --accent-rgb:45,212,191; --c2:#a78bfa; --c3:#fbbf24; --c4:#f472b6;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4),var(--c3)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(247,249,252,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(15,13,26,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); transform:rotate(20deg); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.35) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(255,255,255,.14) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.hero-band-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.18); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:560px; margin:0 auto; padding:24px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; }
.stat-box:nth-child(1) { border-top:3px solid var(--success); }
.stat-box:nth-child(2) { border-top:3px solid var(--danger); }
.stat-box:nth-child(3) { border-top:3px solid var(--c2); }
.stat-box .val { font-size:20px; font-weight:900; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c2); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:8px; background:var(--bg2); border-radius:8px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4)); border-radius:8px; transition:width .4s; }
.timer-badge { min-width:64px; height:36px; border-radius:18px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; }
.timer-badge.warn { color:var(--warn); border-color:rgba(217,119,6,.3); background:rgba(217,119,6,.08); }
.timer-badge.danger { color:var(--danger); border-color:rgba(225,29,72,.3); background:rgba(225,29,72,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(80,60,140,.08); transition:box-shadow .3s; }
.q-header { background:var(--grad); padding:4px 18px; display:flex; align-items:center; gap:8px; }
.q-num { background:rgba(255,255,255,.2); border-radius:8px; padding:3px 10px; font-size:11px; font-weight:700; color:#fff; }
.q-text { padding:22px 18px 14px; font-size:15px; font-weight:700; color:var(--text); line-height:1.65; border-bottom:1px solid var(--bc); text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:10px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:hover:not(.disabled) { border-color:var(--c2); background:rgba(124,58,237,.07); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:8px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { background:rgba(15,157,143,.14); color:var(--accent); border-color:rgba(15,157,143,.35); }
.opt:nth-child(2) .opt-letter { background:rgba(124,58,237,.14); color:var(--c2); border-color:rgba(124,58,237,.35); }
.opt:nth-child(3) .opt-letter { background:rgba(245,158,11,.16); color:var(--warn); border-color:rgba(245,158,11,.4); }
.opt:nth-child(4) .opt-letter { background:rgba(236,72,153,.14); color:var(--c4); border-color:rgba(236,72,153,.35); }
.opt.correct { border-color:var(--success); background:rgba(22,163,74,.08); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(225,29,72,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(22,163,74,.1); color:var(--success); border:1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background:rgba(225,29,72,.08); color:var(--danger); border:1px solid rgba(225,29,72,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:10px; border-right:3px solid var(--c3); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:12px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,.25); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(124,58,237,.35); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:20px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(80,60,140,.08); border-top:5px solid transparent; background-image:linear-gradient(var(--card),var(--card)),var(--grad); background-origin:border-box; background-clip:padding-box,border-box; }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:10px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(225,29,72,.1); color:var(--danger); } .ri-right { background:rgba(22,163,74,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#f59e0b,#ec4899); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(236,72,153,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--c2); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 28px;} }
</style>
</head>

const QUESTIONS = [
{t:"Lumbar puncture is also known as:", o:["Myelogram", "Epidural block", "Craniotomy", "Spinal tap"], a:3, exp:"الـ Lumbar puncture اسمه التاني Spinal tap."},
{t:"In lumbar puncture, the spinal needle is inserted into the:", o:["Lumbar subarachnoid space", "Epidural space of the skull", "Lateral ventricle of the brain", "Subdural space of the thorax"], a:0, exp:"الإبرة بتدخل الـ lumbar subarachnoid space عشان نجيب الـ CSF."},
{t:"Lumbar puncture is performed to obtain information about the:", o:["Cerebrospinal fluid (CSF)", "Synovial fluid", "Pleural fluid", "Peritoneal fluid"], a:0, exp:"الهدف الأساسي هو سحب أو فحص الـ CSF."},
{t:"According to the book, the normal intracranial pressure (ICP) ranges from:", o:["20 to 30 mm Hg", "7 to 15 mm Hg", "0 to 5 mm Hg", "25 to 40 mm Hg"], a:1, exp:"الـ ICP الطبيعي من 7 لـ 15 mm Hg."},
{t:"A pressure above ______ represents intracranial hypertension.", o:["10 mm Hg", "15 mm Hg", "20 mm Hg", "5 mm Hg"], a:2, exp:"أي قراءة فوق 20 mm Hg معناها intracranial hypertension."},
{t:"The spinal cord ends as a solid structure around the level of:", o:["The fifth lumbar vertebra (L5)", "The first sacral vertebra (S1)", "The second lumbar vertebra (L2)", "The fourth lumbar vertebra (L4)"], a:2, exp:"الحبل الشوكي بيخلص عند L2، عشان كده الإبرة لازم تدخل تحته."},
{t:"The needle is usually inserted into the subarachnoid space between:", o:["T10 & T11", "L3 & L4 or L4 & L5", "L1 & L2", "S1 & S2"], a:1, exp:"مكان الدخول المعتاد بين L3-L4 أو L4-L5 عشان نتجنب إصابة الـ spinal cord."},
{t:"The preferred position for lumbar puncture is:", o:["Lateral recumbent at the edge of the bed with chin tucked to chest and knees drawn up to abdomen", "Prone with the head down", "Supine with legs extended flat", "Trendelenburg position"], a:0, exp:"الوضع المفضل side-lying على حافة السرير والدقن على الصدر والركب على البطن."},
{t:"How many plastic test tubes with cap are prepared for CSF collection?", o:["Three", "One", "Two", "Five"], a:0, exp:"الـ equipment فيها three plastic test tubes."},
{t:"Which local anesthetic is listed in the lumbar puncture equipment?", o:["Morphine 10%", "Heparin 5000 units", "Normal saline 0.9%", "Lidocaine 1%"], a:3, exp:"الـ equipment فيها Lidocaine 1%."},
{t:"Before lumbar puncture, the patient is instructed to:", o:["Eat a heavy meal", "Lie flat for 8 hours", "Take warfarin", "Empty the bladder"], a:3, exp:"التبول قبل الإجراء بيقلل خطر إصابة المثانة ويريح المريض."},
{t:"When a sedative or anesthesia is prescribed, fasting before the procedure may be necessary for:", o:["1 hour", "4 hours", "12 hours", "24 hours"], a:1, exp:"في بعض الحالات الصيام 4 ساعات خصوصا لو فيه sedative أو anesthesia."},
{t:"Which of the following is a THERAPEUTIC indication of lumbar puncture?", o:["Intrathecal chemotherapy for leukemia or lymphoma", "Diagnosing meningitis", "Measuring intracranial pressure", "Detecting cerebral hemorrhage"], a:0, exp:"الباقي كله diagnostic. الـ Intrathecal chemotherapy علاجي."},
{t:"A myelogram (contrast dye injected into the CSF) can help diagnose:", o:["Hepatitis", "Herniated disks and spinal stenosis", "Peptic ulcer", "Iron deficiency anemia"], a:1, exp:"الـ myelogram بيوضح الـ spinal cord والـ fluid على الأشعة."},
{t:"Which of the following is a contraindication to lumbar puncture?", o:["Anxiety about the procedure", "Obesity", "Increased intracranial pressure", "Taking paracetamol"], a:2, exp:"الـ IICP من أهم موانع الـ LP."},
{t:"Why is increased ICP a contraindication to lumbar puncture?", o:["It always causes skin infection", "LP can cause a sudden rapid decrease in ICP and the change in volume can lead to herniation", "It makes the needle too short", "It increases CSF glucose"], a:1, exp:"نزول الضغط فجأة ممكن يسبب herniation."},
{t:"Why should a noncontrast head CT be done before LP when a spinal abscess or tumor is suspected?", o:["To measure CSF glucose", "To determine patient position", "To check the gauge of the needle", "To rule out an intracranial mass"], a:3, exp:"الـ CT بيستبعد وجود intracranial mass قبل الـ LP."},
{t:"Which of the following is a sign of increased ICP listed in the book?", o:["Tachycardia with low blood pressure", "Regular deep respirations", "Papilledema", "Increased urine output"], a:2, exp:"من علامات الـ ICP: diplopia, abnormal pupils, posture, papilledema, وبطء القلب مع ضغط عالي وتنفس غير منتظم."},
{t:"Why is the lateral recumbent position preferred for lumbar puncture?", o:["It is used only when the sitting position has failed", "It prevents CSF from flowing", "It allows accurate measurement of ICP and reduces the risk of post-LP headache", "It lowers the patient's blood pressure"], a:2, exp:"الوضع الجانبي بيدي قياس دقيق للـ ICP وبيقلل الصداع بعد الـ LP."},
{t:"The sitting (upright) position is most commonly used in:", o:["Obese patients and patients with pulmonary disorders or potential airway compromise", "Patients with raised ICP", "Patients with skin infection at the site", "Patients receiving anticoagulants"], a:0, exp:"الجلوس بيستخدم لو المريض سمين أو عنده مشاكل تنفس، وكمان لو الوضع الجانبي فشل."},
{t:"Post-lumbar puncture headache is caused by:", o:["Excess production of CSF", "High blood glucose", "Leakage of CSF from the dura and traction on pain-sensitive structures", "Skin infection only"], a:2, exp:"تسريب الـ CSF من الـ dura بيسبب شد على تراكيب حساسة للألم."},
{t:"The headache of CSF leak is typically:", o:["Worse when lying down and better when sitting", "Not affected by position", "Present only during sleep", "Worse when sitting upright and better when lying down"], a:3, exp:"ده الـ positional headache."},
{t:"The nurse should ask the patient to notify the doctor about blood-thinning medications such as warfarin at least:", o:["5 days before the procedure", "1 hour before the procedure", "24 hours before the procedure", "2 days after the procedure"], a:0, exp:"الـ anticoagulants بتزود خطر النزيف."},
{t:"According to the procedure table (step 23), after the procedure the patient is instructed to lie flat for:", o:["30 minutes", "1-2 hours", "8-12 hours", "24-48 hours"], a:2, exp:"الرقود المسطح بيسمح باسترجاع السائل الشوكي ويمنع الصداع."},
{t:"How should the antiseptic skin preparation be done?", o:["In a circular motion away from the puncture site using three different pads, then dry", "Back and forth over the site with a single pad", "From the outside toward the puncture site", "Without drying the skin"], a:0, exp:"بنمسح بحركة دائرية بعيد عن مكان الوخز وبـ 3 pads مختلفة عشان نمنع تلوث الـ spinal tissue بالـ skin flora."},
{t:"The sterile spinal needle is inserted into the subarachnoid space:", o:["Pointing toward the shoulder at 90 degrees", "Pointing toward the feet at 45 degrees", "Pointing toward the umbilicus at an angle of approximately 15 degrees", "Perpendicular to the head at 90 degrees"], a:2, exp:"تخيل إنك بتوجه الإبرة ناحية السرة (umbilicus)."},
{t:"At what angle does the doctor inject the local anesthetic around the insertion site?", o:["15 degrees", "90 degrees", "45 degrees", "5 degrees"], a:2, exp:"الـ local anesthetic بيتحقن بزاوية 45 درجة."},
{t:"Why is the patient instructed not to talk, to relax and to breathe normally during insertion?", o:["To keep the room silent only", "To increase the ICP", "Movement during the procedure may injure the spinal cord and its nerves", "To make CSF flow faster"], a:2, exp:"الحركة ممكن تسبب إصابة للـ spinal cord وأعصابه."},
{t:"Why is the stylet reinserted before the spinal needle is removed?", o:["It decreases the risk of leakage of CSF", "It increases CSF pressure", "It prevents skin infection", "It collects extra CSF"], a:0, exp:"إعادة الـ stylet بتقلل تسريب الـ CSF."},
{t:"Which of the following is documented after lumbar puncture?", o:["Colour and consistency of the collected specimens", "The patient's dietary preferences", "The hospital visiting hours", "The anesthetist's schedule"], a:0, exp:"بنسجل أوقات البداية والنهاية، رد فعل المريض، الأدوية، عدد الـ tubes، وقت النقل للمعمل، ولون وقوام العينات."},
{t:"The expected outcome for the patient's level of comfort after the procedure is a score of:", o:["7 or more on the pain scale", "4 or less on the pain scale", "10 on the pain scale", "No scale is used"], a:1, exp:"من الـ expected outcomes: comfort level 4 أو أقل."},
{t:"If ordered, the patient is premedicated for pain:", o:["5 minutes after the procedure", "30 minutes before the procedure", "2 hours before the procedure", "24 hours before the procedure"], a:1, exp:"الـ premedication قبل الإجراء بـ 30 دقيقة."},
{t:"After lumbar puncture, the puncture site is checked for redness, swelling and drainage:", o:["Once daily for one week", "Every 15 minutes for 24 hours", "Only when the patient complains", "Every hour for the first 4 hours, then every 4 hours for the next 24 hours"], a:3, exp:"ده من الـ post procedure care في الجدول."},
{t:"After lumbar puncture, vital signs, intake and output and neurologic status should be assessed at least:", o:["Once after 48 hours", "Every 4 hours for 24 hours", "Every 8 hours for one week", "Only once at discharge"], a:1, exp:"عشان نتابع حالة المريض ونكشف أي مضاعفات."},
{t:"Which of the following should the patient be told to AVOID after lumbar puncture?", o:["Drinking plenty of fluids", "Taking paracetamol", "Playing sport or strenuous activity for at least a week", "Removing the dressing the next day"], a:2, exp:"ممنوع سواقة أو تشغيل ماكينات 24 ساعة على الأقل، وممنوع الرياضة أسبوع."},
{t:"Lumbar puncture is performed only for diagnostic reasons.", o:["True", "False"], a:1, exp:"بتتعمل للتشخيص وللعلاج كمان (زي intrathecal chemotherapy و spinal anesthesia)."},
{t:"The CSF contains glucose, proteins and other substances found in the blood.", o:["True", "False"], a:0, exp:"فحص الـ CSF بيوضح عدد وأنواع الـ WBCs والجلوكوز والبروتين والبكتيريا والفطريات والخلايا الغير طبيعية."},
{t:"An ICP above 20 mm Hg represents intracranial hypertension.", o:["True", "False"], a:0},
{t:"Because the spinal cord ends around L2, the needle is inserted above this level.", o:["True", "False"], a:1, exp:"الإبرة بتدخل تحت L2 عشان نمنع إصابة الحبل الشوكي."},
{t:"Lumbar puncture is safe to perform in patients with increased intracranial pressure.", o:["True", "False"], a:1, exp:"الـ IICP من موانع الـ LP بسبب خطر الـ herniation."},
{t:"Thrombocytopenia, coagulopathy and anticoagulant therapy increase the risk of bleeding after lumbar puncture.", o:["True", "False"], a:0},
{t:"The lateral recumbent position is the preferred position for lumbar puncture.", o:["True", "False"], a:0},
{t:"The sitting position is the first-choice position for all patients undergoing lumbar puncture.", o:["True", "False"], a:1, exp:"الجلوس بيستخدم لما الوضع الجانبي يفشل أو للمريض السمين أو اللي عنده مشاكل تنفس."},
{t:"The skin is cleaned with antiseptic in a circular motion starting away from the puncture site and moving toward it.", o:["True", "False"], a:1, exp:"المسح بيبدأ من مكان الوخز وبحركة دائرية لبرة."},
{t:"After lumbar puncture, the patient should sit upright immediately to prevent headache.", o:["True", "False"], a:1, exp:"المريض بيرقد على ضهره عشان يمنع تسريب الـ CSF والصداع."},
{t:"Drinks containing caffeine such as coffee, tea or cola may help relieve post-LP headache.", o:["True", "False"], a:0},
{t:"The patient may drive or operate machinery immediately after lumbar puncture.", o:["True", "False"], a:1, exp:"ممنوع السواقة أو تشغيل الماكينات 24 ساعة على الأقل."},
{t:"Specimen tubes are labelled in order of collection in the presence of the patient.", o:["True", "False"], a:0, exp:"ده بيضمن إن النتايج تتنسب للمريض الصح."},
{t:"Informed consent should be verified before administering any analgesia or antianxiety agents.", o:["True", "False"], a:0},
{t:"Intrathecal chemotherapy is used to treat cancers that have entered the CSF.", o:["True", "False"], a:0},
{t:"A patient scheduled for lumbar puncture has severe headache, papilledema, abnormal pupillary responses, a low heart rate with elevated blood pressure and irregular respirations. What should the nurse do?", o:["Proceed with the lumbar puncture in the lateral position", "Give the patient plenty of fluids and proceed", "Notify the doctor because these signs suggest increased ICP, which is a contraindication", "Place the patient in the sitting position and proceed"], a:2, exp:"العلامات دي بتدل على IICP، والـ LP ممكن يسبب herniation."},
{t:"A 20-year-old man had a lumbar puncture. After discharge he complains of headache, nausea, vomiting, neck stiffness and numbness of the extremities. Symptoms occur when he gets up and disappear after lying supine for several minutes. The most likely cause is:", o:["Increased intracranial pressure", "Skin infection at the puncture site", "Post-lumbar puncture headache due to CSF leakage", "Normal anesthetic effect"], a:2, exp:"الصداع بيزيد في الوضع القائم ويروح في الرقود، وده تسريب CSF."},
{t:"For the same patient, which nursing intervention is the most appropriate?", o:["Keep the patient lying flat, encourage fluid intake and give analgesics such as paracetamol as ordered", "Make the patient sit upright and walk", "Restrict all fluids", "Give anticoagulants"], a:0, exp:"الرقود المسطح والسوائل والمسكن زي paracetamol، وممكن مشروبات الكافيين."},
{t:"For the same patient (headache, dizziness and numbness of the extremities that occur on sitting up), which pair of nursing diagnoses is the best fit?", o:["Acute pain and Risk for injury", "Impaired gas exchange and Ineffective breathing pattern", "Anxiety and Fear", "Deficient knowledge and Impaired mobility"], a:0, exp:"الصداع = Acute pain، والدوخة والتنميل = Risk for injury."},
{t:"A patient taking warfarin is scheduled for a lumbar puncture. What is the nurse's best action?", o:["Give an extra dose of warfarin", "Notify the doctor because anticoagulant therapy increases the risk of bleeding", "Proceed without informing anyone", "Ask the patient to stop drinking fluids"], a:1, exp:"الـ anticoagulants بتزود خطر النزيف."},
{t:"An obese patient with a pulmonary disorder cannot tolerate the lateral position. Which position can be used?", o:["The upright or sitting position at the edge of the bed with the thighs brought toward the abdomen", "Prone position", "Supine with legs flat", "Trendelenburg position"], a:0, exp:"الجلوس بيستخدم للمريض السمين أو اللي عنده مشاكل تنفس."},
{t:"Twenty-four hours after lumbar puncture the patient has a very high temperature and redness, swelling and drainage at the puncture site. The nurse should suspect:", o:["Infection and contact the doctor", "A normal healing response", "Spinal anesthesia effect", "Dehydration only"], a:0, exp:"من علامات الـ infection: حرارة عالية واحمرار وتورم وإفرازات."},
{t:"A patient is anxious and afraid before lumbar puncture. What is the nurse's best action?", o:["Tell the patient not to ask questions", "Explain what will happen and why it is needed, including that it takes 20-30 minutes", "Cancel the procedure", "Give the patient a heavy meal"], a:1, exp:"الشرح بيقلل الخوف والقلق ويقلل المضاعفات."},
{t:"During needle insertion the patient reports sharp pain. What does this may indicate?", o:["Successful entry into the epidural space only", "Normal reaction that requires no action", "Skin infection", "Irritation or puncture of a nerve root, which may require repositioning of the needle"], a:3, exp:"الألم ممكن يدل على nerve root irritation."},
{t:"A patient with a suspected spinal abscess or tumor is scheduled for lumbar puncture. What should be done before the procedure?", o:["Give intrathecal chemotherapy", "Remove the dressing", "Ask the patient to drink coffee", "A noncontrast head CT scan to rule out an intracranial mass"], a:3, exp:"الـ CT بيستبعد وجود intracranial mass قبل الـ LP."},
{t:"<img src=\"" + IMG.lat + "\" alt=\"\">Which position is shown in the picture?", o:["Prone position", "Lateral recumbent position", "Sitting position", "Supine position"], a:1, exp:"ده الوضع الجانبي المفضل في الـ LP."},
{t:"<img src=\"" + IMG.spine + "\" alt=\"\">This illustration of a needle inserted into the lumbar spine shows which procedure?", o:["Lumbar puncture (spinal tap)", "Chest tube insertion", "Urinary catheterization", "Intramuscular injection"], a:0, exp:"الصورة بتوضح إدخال spinal needle في المنطقة القطنية."},
{t:"<img src=\"" + IMG.loc + "\" alt=\"\">The picture shows the usual site of needle insertion. Between which vertebrae is the needle usually inserted?", o:["T12 & L1", "L3 & L4 or L4 & L5", "L1 & L2", "S2 & S3"], a:1, exp:"الإدخال تحت مستوى L2 عشان نحمي الـ spinal cord."},
{t:"<img src=\"" + IMG.sit + "\" alt=\"\">Which position is shown in the picture, and when is it used?", o:["Lateral recumbent position, used to measure ICP accurately", "Prone position, used in raised ICP", "Supine position, used after the procedure", "Upright/sitting position, used when the lateral position has failed or in obese patients"], a:3, exp:"الصورة بتوضح الجلوس مع الانحناء للأمام."},
{t:"<img src=\"" + IMG.pos + "\" alt=\"\">The picture titled 'Patient positioning' shows the nurse assisting the patient to maintain which position?", o:["Prone position", "Trendelenburg position", "Lateral recumbent position at the edge of the bed", "Semi-Fowler's position"], a:2, exp:"الممرضة بتساعد المريض يفضل في الوضع الجانبي وضهره على حافة السرير."},
{t:"<img src=\"" + IMG.needle + "\" alt=\"\">What is the equipment shown in the picture?", o:["Intravenous cannula", "Foley catheter", "Spinal needle", "Chest drain"], a:2, exp:"الـ spinal needle بتتكون من إبرة و stylet."},
{t:"<img src=\"" + IMG.mano + "\" alt=\"\">What are the items shown in the picture, and what are they used for?", o:["Test tubes, used to measure blood glucose", "Suction catheters, used to drain urine", "Syringes, used to give chemotherapy", "Manometer with three-way stopcock, used to measure CSF pressure"], a:3, exp:"الـ manometer مع الـ three-way stopcock لقياس ضغط الـ CSF."},
{t:"<img src=\"" + IMG.clean + "\" alt=\"\">Which step is shown in the picture?", o:["Inserting the spinal needle", "Applying the final dressing", "Labeling the specimens", "Cleaning the puncture site with antiseptic in a circular motion"], a:3, exp:"بيتم تنضيف مكان الوخز بحركة دائرية بعيد عن الموقع."},
{t:"<img src=\"" + IMG.drape + "\" alt=\"\">Which step is shown in the picture?", o:["Injecting contrast media", "Removing the stylet", "Measuring blood pressure", "Draping the area with the fenestrated drape"], a:3, exp:"الدكتور بيغطي المنطقة بالـ fenestrated drape بعد التنضيف."},
{t:"<img src=\"" + IMG.tube + "\" alt=\"\">Which step is shown in the picture, and how should the tubes be labeled?", o:["Skin preparation, labeled by the doctor's name", "Injection of local anesthetic, labeled by time", "CSF collection into test tubes, labeled in order of collection", "Dressing application, labeled by size"], a:2, exp:"العينات بتتسمى بالترتيب وقدام المريض."},
{t:"You are preparing the equipment for a lumbar puncture. Which item is NOT part of the equipment list?", o:["Sterile drapes", "Lidocaine 1%", "Three-way stopcock and manometer", "Foley catheter"], a:3, exp:"الـ equipment: sterile dressing, gloves, drapes, antiseptic, Lidocaine 1%, syringe 3 mL, spinal needles 20 and 25 gauge, three tubes, alcohol swab, stopcock, manometer."},
{t:"<img src=\"" + IMG.tray + "\" alt=\"\">The sterile tray in the picture is being prepared for the procedure. What must you be careful about when you open the package?", o:["To open it only after the procedure ends", "To touch the drapes with bare hands", "Not to contaminate the sterile field when you open the wrapper", "To pour the antiseptic on the drapes"], a:2, exp:"ده عشان نحافظ على التعقيم."},
{t:"What is the first item in the pre-procedure nursing assessment?", o:["Remove the dressing", "Verify the type of procedure scheduled, its purpose and the site with the patient and medical record", "Document the CSF colour", "Give the patient coffee"], a:1, exp:"أول خطوة نتأكد من نوع الإجراء والغرض والمكان مع المريض والـ medical record."},
{t:"If no ampule of anaesthetic is included on the tray, how does the nurse help the doctor with a multidose vial?", o:["Pour the anaesthetic on the skin directly", "Clean the injection port with an alcohol pad, then invert the vial 45 degrees so the physician can insert the needle and withdraw the anaesthetic", "Inject the anaesthetic into the three-way stopcock", "Shake the vial and leave it on the bed"], a:1, exp:"بنضف الـ port بالكحول وبنقلب الـ vial بزاوية 45 درجة."},
{t:"<img src=\"" + IMG.insert + "\" alt=\"\">The doctor is inserting the needle as shown. What should the nurse instruct the patient?", o:["To stand up and walk", "Not to talk, to relax and to breathe normally", "To turn over onto the abdomen", "To cough forcefully"], a:1, exp:"الحركة ممكن تسبب إصابة للـ spinal cord وأعصابه."},
{t:"How does the CSF flow once the subarachnoid space has been reached?", o:["By removing the needle stylet or introducer", "By injecting air", "By pulling the patient's legs", "By applying pressure on the abdomen"], a:0, exp:"السائل بيسيل لما نشيل الـ stylet."},
{t:"Why are specimens labelled properly in the presence of the patient and in order of collection?", o:["To relieve the patient's anxiety", "To widen the spaces between the vertebrae", "To decrease CSF leakage", "To ensure that correct laboratory results are assigned to the right patient"], a:3, exp:"الـ tubes بتتسمى بالترتيب وقدام المريض."},
{t:"<img src=\"" + IMG.manoIn + "\" alt=\"\">The doctor attaches a manometer with a three-way stopcock to the needle hub. What is the rationale?", o:["To collect culture specimens", "To inject contrast media", "To remove the stylet", "To provide a more accurate pressure reading"], a:3, exp:"ده لقياس ضغط الـ CSF."},
{t:"The doctor finishes collecting CSF. Which is the correct action to end the procedure?", o:["Remove the needle only and leave the site uncovered", "Remove the stylet and apply heat", "Keep the needle in place for several hours", "Reinsert the stylet, remove the spinal needle, apply pressure over the site until drainage ceases, then apply a gauze dressing"], a:3, exp:"ده بيقلل خطر تسريب الـ CSF."},
{t:"Which sequence of steps is correct?", o:["Spinal needle insertion, then antiseptic cleaning, then local anesthetic, then drape", "Local anesthetic, then spinal needle insertion, then antiseptic cleaning, then drape", "Fenestrated drape, then needle insertion, then local anesthetic, then cleaning", "Antiseptic cleaning, then fenestrated drape, then local anesthetic, then spinal needle insertion"], a:3, exp:"الترتيب: تنضيف، drape، تخدير موضعي، إدخال الإبرة."},
];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 90*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
function render() {
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
