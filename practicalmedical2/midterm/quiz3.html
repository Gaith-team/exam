<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0f9d8f;--teal-d:#0b6e79;--blue:#eef1f8;--bd:#d9def0;--ok:#16a34a;--no:#e11d48;--rev:#7c3aed;--txt:#1a2332;--grad:linear-gradient(135deg,#0b6e79 0%,#7c3aed 55%,#ec4899 100%)}
body{font-family:'Outfit',Arial,sans-serif;background:#f7f9fc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#7c3aed;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#7c3aed;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#d97706}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef1f8}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #1a2332;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef1f8;border-top:1px solid #d9def0;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← رجوع</a>Medical-Surgical Nursing 2<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">50:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Which assessment is NOT part of checking circulation below a bandage?",o:["Capillary refill time", "Color and temperature of the skin", "Motion and sensation", "Blood glucose level"],a:3},
{t:"A patient has blue, cold toes with tingling after bandaging. First action:",o:["Loosen the bandage immediately", "Add another layer", "Apply heat", "Document only"],a:0},
{t:"The figure-of-eight bandage is preferred for joints because it:",o:["Covers only the end of a limb", "Needs no overlap", "Supports the joint and limits movement, reducing pain and swelling", "Uses tails"],a:2},
{t:"The figure-of-eight bandage terminates with:",o:["Two circular turns above the joint", "A spiral reverse turn", "Recurrent turns", "A spica turn"],a:0},
{t:"Which pair is correctly matched?",o:["Spiral turn - elbow joint", "Recurrent turn - amputation stump", "Spica - finger tip", "Circular turn - hip"],a:1},
{t:"Strong pressure with limited stretch describes the:",o:["Long stretch compression bandage", "Cohesive bandage", "Tubular bandage", "Short stretch compression bandage"],a:3},
{t:"Which is a use of the snake bite bandage?",o:["Lymphedema", "Venous leg ulcers", "Blue-ringed octopus bites", "Strains and sprains"],a:2},
{t:"A tubular bandage is suitable for:",o:["Covering the chin", "Moderate compression of arms, legs, ankles and wrists", "Pressure immobilization only", "Covering a stump"],a:1},
{t:"The rationale for keeping privacy during bandage application is:",o:["To support the patient's psychological condition", "To prevent cross infection", "To confirm the order", "To save time"],a:0},
{t:"The rationale for hand washing before applying an elastic bandage is:",o:["To confirm the order", "To save time and effort", "To support psychology", "To prevent cross infection"],a:3},
{t:"A breast binder after breast surgery is used to:",o:["Dry milk flow", "Secure perineal dressing", "Offer support", "Cover the chin"],a:2},
{t:"Which statement about cast materials is correct?",o:["Plaster is synthetic acrylic", "Plaster of Paris is natural; synthetic casts include fiberglass or polymer", "Fiberglass is natural", "Both are made of latex"],a:1},
{t:"Severe pain, swelling, paresthesia and pallor under a cast suggest:",o:["Pressure sore", "Cast syndrome", "Muscle atrophy", "Compartment syndrome"],a:3},
{t:"Burning, foul odor and drainage under a cast suggest:",o:["Pressure sore/skin breakdown with possible infection", "Muscle atrophy", "Joint stiffness", "Normal drying"],a:0},
{t:"Nausea, vomiting and abdominal distension after a body cast indicate:",o:["Compartment syndrome", "Neurovascular impairment", "Cast syndrome", "Infection"],a:2},
{t:"Muscle atrophy and joint stiffness in casts are caused by:",o:["Prolonged immobilization", "A tight cast only", "A wet cast", "Allergy"],a:0},
{t:"Which equipment is used to cut the cast?",o:["Stockinet", "Cast saw", "Mackintosh", "Sheet wadding"],a:1},
{t:"The mackintosh in cast application is used to:",o:["Cut the cast", "Provide padding", "Soften plaster", "Protect the bed from wetting"],a:3},
{t:"Which is NOT a listed complication of traction?",o:["Foot drop", "Hypertension", "Venous stasis with DVT", "Pressure ulcers"],a:1},
{t:"Skeletal traction is indicated for:",o:["Children needing less than 5 kg", "Temporary pre-operative traction", "Adults needing more than 5 kg or long-term traction", "Traction for a few days"],a:2},
{t:"Temporary pre-operative traction for a few days is usually:",o:["Skin traction", "Skeletal traction", "Pin traction", "Tong traction"],a:0},
{t:"Buck's traction is applied:",o:["With both legs elevated", "With a sling under the knee", "Through a pin in the tibia", "In a straight line to the leg"],a:3},
{t:"During ear irrigation the syringe tip should not pass beyond:",o:["Half of the canal", "The tympanic membrane", "The outer one-third of the ear canal (about 8 mm)", "Two-thirds of the canal"],a:2},
{t:"The recommended syringe for gentle ear irrigation is:",o:["50 ml with a sharp tip and cold water", "20 ml with a rounded nozzle and warm water", "5 ml insulin syringe", "Needle syringe"],a:1},
{t:"Ear irrigation must be stopped immediately if:",o:["The water is warm", "The wax softens", "The patient is calm", "The patient has pain or bleeding occurs"],a:3},
{t:"Irrigation may perforate the eardrum because it can:",o:["Compact the wax and raise pressure on the eardrum", "Dissolve the eardrum", "Cool the canal", "Remove wax too quickly"],a:0},
{t:"The most common complication of ear irrigation is:",o:["Permanent deafness", "Ear infection", "Vertigo", "Tinnitus"],a:1},
{t:"Which is a rare complication of ear irrigation?",o:["Mild discomfort", "Temporary dizziness", "Temporary or permanent deafness", "Itching"],a:2},
{t:"After syringing the ear, the nurse should:",o:["Insert cotton only", "Repeat irrigation", "Apply a bandage", "Examine the canal and tympanic membrane and document"],a:3},
{t:"Which can soften earwax if the eardrum is fully intact?",o:["Hydrogen peroxide or vinegar-alcohol mixture", "Concentrated bleach", "Hot oil", "Plain alcohol only"],a:0},
{t:"Medium-term indwelling latex catheters can be used for:",o:["Less than one week", "Less than three weeks", "Three months", "Permanently"],a:1},
{t:"Replacement of long-term pure silicone catheters is recommended in some guidelines every:",o:["1 week", "3 weeks", "3 months", "3 years"],a:2},
{t:"Which is a contraindication to urethral catheterization?",o:["Blood at the urethral meatus", "Urinary retention", "Measuring output in acutely ill patients", "Emptying the bladder before pelvic surgery"],a:0},
{t:"Which is a complication of long-term urethral catheterization?",o:["Scrotal hematoma only", "Hearing loss", "Foot drop", "Bladder cancer and kidney damage"],a:3},
{t:"A double-lumen catheter has:",o:["One lumen only", "Three lumens and no balloon", "Two lumens and a balloon for internal fixation", "Two lumens and no balloon"],a:2},
{t:"Continuous bladder irrigation uses a catheter with:",o:["One lumen", "Three lumens (three-way)", "Two lumens without balloon", "No balloon and one lumen"],a:1},
{t:"An indication of bladder irrigation is to:",o:["Clear blood clots, mucus or debris from the bladder", "Treat hypertension", "Remove ear wax", "Immobilize a fracture"],a:0},
{t:"Intermittent bladder irrigation can be performed using:",o:["A closed system only", "An open system only", "A three-way system only", "A closed or open system"],a:3},
{t:"Checking the patient's file before catheter insertion is done to:",o:["Prevent leaks", "Save time", "Detect conditions that may contraindicate insertion", "Measure output"],a:2},
{t:"Documentation after catheter care should include urine:",o:["Amount only", "Amount, color, odor, clarity, mucus, clots or sediment", "Color only", "Specific gravity only"],a:1},
{t:"The figure-of-eight bandage terminates with two circular turns above the joint.",o:["True","False"],a:0},
{t:"Cast syndrome is compression of the duodenum associated with body casts.",o:["True","False"],a:0},
{t:"The ear syringe tip should be passed to the tympanic membrane for effective irrigation.",o:["True","False"],a:1},
{t:"Blood at the urethral meatus is a contraindication to urethral catheterization.",o:["True","False"],a:0},
{t:"Pure silicone catheters are used only for less than one week.",o:["True","False"],a:1},
{t:"Triple-lumen catheters have no balloon.",o:["True","False"],a:1},
{t:"Ear infection is one of the most common complications of ear irrigation.",o:["True","False"],a:0},
{t:"Skin traction is preferred in adults requiring more than 5 kg traction.",o:["True","False"],a:1},
{t:"Latex catheters are used for short-term use of less than a week only.",o:["True","False"],a:1},
{t:"Documentation after catheterization should include urine amount, color and clarity.",o:["True","False"],a:0},
{t:"After a pelvic fracture a man has blood at the urethral meatus and a perineal hematoma. A urinary catheter is ordered for retention. Best nurse action?",o:["Insert the catheter with extra lubricant", "Insert a smaller catheter", "Withhold urethral catheterization and inform the physician (contraindicated)", "Perform bladder irrigation"],a:2}
];

const TOTAL_TIME = 50*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return {...q};const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
