<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent:#0f9d8f; --accent-light:#2dd4bf; --accent-dark:#0b6e79; --accent-glow:rgba(15,157,143,0.2); --accent-rgb:15,157,143;
  --c2:#7c3aed; --c3:#f59e0b; --c4:#ec4899;
  --grad:linear-gradient(135deg,#0b6e79 0%,#7c3aed 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,#0f9d8f,#7c3aed);
  --bg:#f7f9fc; --bg2:#eef1f8; --card:#ffffff; --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07); --success:#16a34a; --danger:#e11d48; --warn:#d97706; --r:16px;
  --tr:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:#0f0d1a; --bg2:#181528; --card:#211d36; --text:#ece9f7; --text2:#bdb8d6; --text3:#8a84a8;
  --bc:rgba(255,255,255,0.09); --accent:#2dd4bf; --accent-light:#5eead4; --accent-dark:#14b8a6;
  --accent-glow:rgba(45,212,191,0.2); --accent-rgb:45,212,191; --c2:#a78bfa; --c3:#fbbf24; --c4:#f472b6;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4),var(--c3)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(247,249,252,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(15,13,26,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); transform:rotate(20deg); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.35) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(255,255,255,.14) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.hero-band-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.18); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:560px; margin:0 auto; padding:24px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; }
.stat-box:nth-child(1) { border-top:3px solid var(--success); }
.stat-box:nth-child(2) { border-top:3px solid var(--danger); }
.stat-box:nth-child(3) { border-top:3px solid var(--c2); }
.stat-box .val { font-size:20px; font-weight:900; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c2); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:8px; background:var(--bg2); border-radius:8px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4)); border-radius:8px; transition:width .4s; }
.timer-badge { min-width:64px; height:36px; border-radius:18px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; }
.timer-badge.warn { color:var(--warn); border-color:rgba(217,119,6,.3); background:rgba(217,119,6,.08); }
.timer-badge.danger { color:var(--danger); border-color:rgba(225,29,72,.3); background:rgba(225,29,72,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(80,60,140,.08); transition:box-shadow .3s; }
.q-header { background:var(--grad); padding:4px 18px; display:flex; align-items:center; gap:8px; }
.q-num { background:rgba(255,255,255,.2); border-radius:8px; padding:3px 10px; font-size:11px; font-weight:700; color:#fff; }
.q-text { padding:22px 18px 14px; font-size:15px; font-weight:700; color:var(--text); line-height:1.65; border-bottom:1px solid var(--bc); text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:10px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:hover:not(.disabled) { border-color:var(--c2); background:rgba(124,58,237,.07); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:8px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { background:rgba(15,157,143,.14); color:var(--accent); border-color:rgba(15,157,143,.35); }
.opt:nth-child(2) .opt-letter { background:rgba(124,58,237,.14); color:var(--c2); border-color:rgba(124,58,237,.35); }
.opt:nth-child(3) .opt-letter { background:rgba(245,158,11,.16); color:var(--warn); border-color:rgba(245,158,11,.4); }
.opt:nth-child(4) .opt-letter { background:rgba(236,72,153,.14); color:var(--c4); border-color:rgba(236,72,153,.35); }
.opt.correct { border-color:var(--success); background:rgba(22,163,74,.08); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(225,29,72,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(22,163,74,.1); color:var(--success); border:1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background:rgba(225,29,72,.08); color:var(--danger); border:1px solid rgba(225,29,72,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:10px; border-right:3px solid var(--c3); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:12px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,.25); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(124,58,237,.35); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:20px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(80,60,140,.08); border-top:5px solid transparent; background-image:linear-gradient(var(--card),var(--card)),var(--grad); background-origin:border-box; background-clip:padding-box,border-box; }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:10px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(225,29,72,.1); color:var(--danger); } .ri-right { background:rgba(22,163,74,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#f59e0b,#ec4899); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(236,72,153,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--c2); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 28px;} }
</style>
</head>
<body>
<div id="prog-bar" style="width:0%"></div>
<nav>
  <a href="https://gaith-team.github.io/exam/" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand"><div class="nav-logo-icon">GT</div><span>GHAITH TEAM</span></div>
  <div class="nav-right"><button class="theme-btn" id="themeBtn">🌙</button></div>
</nav>
<div class="hero-band">
  <div class="hero-band-icon">👁️</div>
  <h1>Distance Visual Acuity Test</h1>
  <p> Medical-Surgical Nursing 2 (Practical) – CLN211 </p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 60 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>
<div class="shell">
  <div class="stats-row">
    <div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div>
    <div class="stat-box"><div class="val stat-wrong" id="sWrong">0</div><div class="lbl">✖ خطأ</div></div>
    <div class="stat-box"><div class="val stat-remain" id="sRemain">--%</div><div class="lbl">⏳ متبقي</div></div>
  </div>
  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">60:00</span></div>
  </div>
  <div id="app"></div>
</div>
<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg"><i class="fa-brands fa-telegram"></i> @nursing2bu</a>
</footer>
<script>
const QUESTIONS = [
{t:"Visual acuity (VA) is defined as:", o:["The ability to see different colors","The ability of the eye muscles to move the eyeball","The ability of the visual system to distinguish fine details or discriminate between two high-contrast points in space","The ability to see in dim light"], a:2, exp:"الـ Visual acuity هي قدرة الجهاز البصري إنه يفرّق التفاصيل الدقيقة أو يميّز بين نقطتين high-contrast في الفراغ."},
{t:"Measuring distance visual acuity is described as an assessment that is:", o:["Simple, quick, and non-invasive","Complex, slow, and invasive","Painful but very accurate","Expensive and invasive"], a:0, exp:"قياس الـ VA بسيط وسريع و non-invasive ورخيص."},
{t:"Light first passes through which structure of the eye?", o:["Lens","Cornea","Retina","Optic nerve"], a:1, exp:"الضوء بيعدّي على الـ cornea الأول وبعدين بيدخل من الـ pupil."},
{t:"The opening through which light enters the eye is called the:", o:["Iris","Cornea","Lens","Pupil"], a:3, exp:"الـ Pupil هي الفتحة اللي الضوء بيدخل منها."},
{t:"Which part of the eye controls how much light the pupil lets in?", o:["Iris","Lens","Retina","Optic nerve"], a:0, exp:"الـ Iris (الجزء الملوّن) هي اللي بتتحكم في كمية الضوء الداخلة من الـ pupil."},
{t:"The lens works together with the cornea to focus light correctly on the:", o:["Optic nerve","Iris","Retina","Pupil"], a:2, exp:"الـ lens + الـ cornea بيركّزوا الضوء على الـ retina."},
{t:"Photoreceptors in the retina function to:", o:["Control the size of the pupil","Turn light into electrical signals","Focus light on the cornea","Protect the eye from infection"], a:1, exp:"الـ Photoreceptors بتحوّل الضوء لإشارات كهربية."},
{t:"Electrical signals travel from the retina to the brain through the:", o:["Cornea","Pupil","Iris","Optic nerve"], a:3, exp:"الإشارات بتروح من الـ retina للمخ عن طريق الـ optic nerve."},
{t:"All of the following are indications for measuring visual acuity EXCEPT:", o:["Establishing a baseline recording of visual status","Monitoring visual changes and disease progression","Administering eye medication","Evaluating pre- and post-operative outcomes such as cataract surgery"], a:2, exp:"إعطاء دوا العين مش من دواعي قياس الـ VA."},
{t:"Evaluating pre- and post-operative surgical outcomes using VA is commonly done in:", o:["Cataract surgery","Appendectomy","Hernia repair","Thyroidectomy"], a:0, exp:"الكتاب ذكر مثال: cataract surgery."},
{t:"Myopia (nearsightedness) makes:", o:["Nearby objects look blurry","Far-away objects look blurry","Both near and far objects look distorted","Only close objects look blurry in older adults"], a:1, exp:"Myopia = الأشياء البعيدة تبقى blurry."},
{t:"Hyperopia (farsightedness) makes:", o:["Far-away objects look blurry","Objects look distorted at all distances","It is hard for older adults to see things up close","Nearby objects look blurry"], a:3, exp:"Hyperopia = الأشياء القريبة تبقى blurry."},
{t:"Which refractive error can make far-away AND nearby objects look blurry or distorted?", o:["Myopia","Hyperopia","Astigmatism","Presbyopia"], a:2, exp:"Astigmatism بتخلّي القريب والبعيد blurry أو distorted."},
{t:"Presbyopia makes it hard for which group to see things up close?", o:["Middle-aged and older adults","Newborns","School-age children","Adolescents only"], a:0, exp:"Presbyopia بتصيب الناس middle-aged وكبار السن في الرؤية القريبة."},
{t:"How many common types of refractive errors are listed in the book?", o:["3","4","5","6"], a:1, exp:"٤ أنواع: Myopia, Hyperopia, Astigmatism, Presbyopia."},
{t:"LogMAR stands for:", o:["Longitudinal Measure of Acuity Range","Logical Method of Acuity Recording","Light Measurement of Angle Resolution","Logarithm of the Minimum Angle of Resolution"], a:3, exp:"LogMAR = Logarithm of the Minimum Angle of Resolution."},
{t:"Compared with the traditional Snellen chart, the LogMAR chart provides:", o:["Less precise but faster results","More precise and reproducible results","Results only for children","Results only for one eye"], a:1, exp:"الـ LogMAR أدق وقابل للتكرار أكتر من الـ Snellen."},
{t:"How many optotypes (letters) are on each line of the LogMAR chart?", o:["Three","Four","Five","Six"], a:2, exp:"كل سطر في الـ LogMAR فيه ٥ حروف."},
{t:"In the LogMAR chart, the change in letter size and spacing between lines is:", o:["A consistent logarithmic change","Random","Arithmetic only","Absent"], a:0, exp:"في تغيّر logarithmic ثابت في حجم الحروف والمسافات بين السطور."},
{t:"In the LogMAR chart, each correctly identified letter can be used to:", o:["Decide the patient's diagnosis","Select the type of glasses","Measure the eye pressure","Calculate the final visual-acuity score"], a:3, exp:"كل حرف صح بيدخل في حساب الـ final VA score."},
{t:"The Snellen chart is viewed from a distance of about:", o:["5 to 10 feet","14 to 20 feet","30 to 40 feet","50 to 60 feet"], a:1, exp:"الكتاب قال الـ Snellen بيتشاف من ١٤ لـ ٢٠ feet."},
{t:"The Tumbling E chart is mainly designed for:", o:["Adults who wear glasses","Patients after cataract surgery","Children or people who cannot read the alphabet","Patients with eye pain"], a:2, exp:"الـ Tumbling E للأطفال أو اللي مش بيعرفوا يقروا الحروف."},
{t:"In the Tumbling E test, the patient is asked to:", o:["Identify the direction the letter E is facing","Read the letters aloud from left to right","Count the number of letters","Name the colors of the letters"], a:0, exp:"المريض بيحدد اتجاه الـ E."},
{t:"In the Tumbling E test, the patient points in which direction(s)?", o:["Up and down only","Left and right only","Clockwise or counterclockwise","Up, down, left, or right"], a:3, exp:"الاتجاهات: up, down, left, right."},
{t:"The Landolt C chart consists of different sizes of the letter:", o:["E","C","T","O"], a:1, exp:"الـ Landolt C فيه حرف C بأحجام مختلفة."},
{t:"Which of the following is NOT listed as equipment for the visual acuity test?", o:["Pinhole occluder","Torch or flashlight","Stethoscope","Multi-letter Snellen or E chart"], a:2, exp:"الـ Stethoscope مش من الأدوات المذكورة."},
{t:"The patient is positioned at what distance from the chart?", o:["3 meters","6 meters","10 meters","20 meters"], a:1, exp:"المريض بيتحط على مسافة ٦ متر من الـ chart."},
{t:"What is the rationale for positioning the patient at 6 meters from the chart?", o:["To ensure that the distance is maintained","To prevent infection transmission","To obtain patient cooperation","To avoid pressure on the eye"], a:0, exp:"عشان المسافة تتثبّت."},
{t:"The rationale for washing hands and cleaning equipment between patients is:", o:["To obtain patient cooperation","To make the chart clearer","To save time during the test","To prevent infection transmission"], a:3, exp:"العدوى ممكن تنتقل بين المرضى لو الأدوات أو إيد الفاحص مش نضيفة."},
{t:"The nurse explains to the patient that it is not a test they have to pass. The rationale is:", o:["To ensure the distance is maintained","To prevent infection","To obtain the patient's cooperation","To record the result accurately"], a:2, exp:"الشرح للمريض بيجيب تعاونه."},
{t:"Why should the patient NOT press on the eye while covering it?", o:["It is not good for an eye that has undergone surgery","It makes the chart look blurry","It tires the examiner","It changes the distance of the chart"], a:0, exp:"الضغط وحش للعين اللي اتعمل لها جراحة، وكمان بيوحّش قراءة الـ IOP وبيشوّش الرؤية."},
{t:"Pressing on the eye can make any subsequent ______ reading inaccurate.", o:["Blood pressure","Intraocular pressure","Pulse","Temperature"], a:1, exp:"الضغط على العين بيخلّي قراءة الـ intraocular pressure غلط."},
{t:"The patient is asked to read the chart:", o:["From the bottom to the top","From right to left","Randomly","From the top of the chart and from left to right"], a:3, exp:"القراءة من فوق ومن الشمال لليمين."},
{t:"If the patient cannot read the letters due to language difficulties, the nurse should use:", o:["An E chart","A flashlight only","A pinhole occluder only","No chart; skip the test"], a:0, exp:"لو مش بيعرف يقرا الحروف بسبب اللغة نستخدم E chart."},
{t:"The smallest line read is expressed as a fraction, for example:", o:["18/6 only","6 meters only","6/18","3/6/9"], a:2, exp:"أصغر سطر اتقرا بيتكتب كـ fraction زي 6/18."},

{t:"Visual acuity assessment is simple, non-invasive, and inexpensive.", o:["True","False"], a:0, exp:"صح، دي من مميزات الـ VA test."},
{t:"The iris is the part that focuses light on the retina.", o:["True","False"], a:1, exp:"غلط، اللي بيركّز الضوء على الـ retina هو الـ lens مع الـ cornea. الـ iris بتتحكم في كمية الضوء."},
{t:"Myopia makes nearby objects look blurry.", o:["True","False"], a:1, exp:"غلط، الـ Myopia بتخلّي البعيد blurry."},
{t:"Presbyopia mainly affects middle-aged and older adults.", o:["True","False"], a:0, exp:"صح."},
{t:"The LogMAR chart provides more precise and reproducible results than the traditional Snellen chart.", o:["True","False"], a:0, exp:"صح."},
{t:"Each line of the LogMAR chart contains three optotypes.", o:["True","False"], a:1, exp:"غلط، كل سطر فيه ٥ optotypes."},
{t:"The Tumbling E chart is designed for children or people who cannot read the alphabet.", o:["True","False"], a:0, exp:"صح."},
{t:"The Landolt C chart is the one in which the patient identifies the direction the letter E is facing.", o:["True","False"], a:1, exp:"غلط، ده الـ Tumbling E. الـ Landolt C فيه حرف C."},
{t:"Sudden loss of vision is a situation where referral or further assessment may be appropriate.", o:["True","False"], a:0, exp:"صح."},
{t:"The patient should press firmly on the covered eye to make sure it is fully closed.", o:["True","False"], a:1, exp:"غلط، ممنوع الضغط على العين."},
{t:"Infections can be passed between patients if the equipment or the tester's hands are not clean.", o:["True","False"], a:0, exp:"صح."},
{t:"In the visual acuity test, only one eye is tested and testing both eyes together is not needed.", o:["True","False"], a:1, exp:"غلط، بنختبر العينين مع بعض وكل عين لوحدها."},
{t:"In the fraction 6/18, the lower number is the distance in metres at which a 'normal' eye is able to read that line.", o:["True","False"], a:0, exp:"صح."},
{t:"Having 20/40 vision means the patient must be 20 feet away to see what people with normal vision can see from 40 feet.", o:["True","False"], a:0, exp:"صح."},
{t:"The visual acuity of each eye is recorded in the patient's notes only when it is abnormal.", o:["True","False"], a:1, exp:"غلط، بنسجّل الـ VA لكل عين في الـ notes."},
{t:"A nurse is screening a 5-year-old child who cannot read the alphabet. Which chart is the most appropriate?", o:["LogMAR chart","A standard letter chart","Tumbling E chart","Pinhole occluder"], a:2, exp:"الطفل اللي مش بيقرا الحروف نستخدم له Tumbling E."},
{t:"A mute adult must have his visual acuity tested by looking at rings and indicating what he sees. Which chart is used?", o:["Tumbling E chart","Landolt C chart","LogMAR chart","Snellen chart only"], a:1, exp:"الكتاب ذكر الـ Landolt C للـ muted children or adults."},
{t:"A patient who recently had eye surgery is pressing the occluder hard against his eye during the test. What should the nurse do?", o:["Allow it for better covering","Ask him to press harder","Skip the test completely","Remind him not to press on the eye"], a:3, exp:"الضغط مش كويس للعين اللي اتعمل لها جراحة."},
{t:"During the test, a patient tells the nurse that he has sudden loss of vision. What is the most appropriate action?", o:["Report it for referral or further assessment","Document it as normal and continue","Repeat the test after one week","Only reassure the patient"], a:0, exp:"Sudden loss of vision من علامات الخطر ومحتاج referral أو further assessment."},
{t:"A patient using the E chart correctly indicates the orientation of four out of five letters of the same size. How is this interpreted?", o:["The line is failed because of one error","The chart is invalid","Correct orientation of most letters of the same size is what is recommended (e.g., four out of five)","The test must restart from the bottom line"], a:2, exp:"المطلوب إن المريض يحدد اتجاه معظم الحروف في نفس الحجم زي ٤ من ٥ أو ٥ من ٦، عشان فرصة التخمين ١ من ٤."},
{t:"A patient seated 6 meters from the chart reads the line recorded as 6/18. What does the number 18 represent?", o:["The distance in metres from the patient to the chart","The distance in metres at which a 'normal' eye can read that line","The patient's age","The number of letters in the line"], a:1, exp:"الرقم اللي فوق (٦) = مسافة المريض من الـ chart، والرقم اللي تحت (١٨) = المسافة اللي العين الطبيعية بتقرا عندها السطر ده."},
{t:"Before starting the visual acuity test, what is the FIRST step the nurse performs?", o:["Review the doctor's order from the patient's chart","Position the patient 6 meters from the chart","Ask the patient to cover one eye","Record the VA in the notes"], a:0, exp:"أول خطوة: مراجعة أمر الدكتور (مكتوب وموقّع) من الـ chart."},
{t:"Which action should the nurse perform for equipment and self preparation?", o:["Skip cleaning if the equipment looks clean","Wash hands and ensure any equipment the patient touches is clean, and cleaned between patients","Use the same occluder for all patients without cleaning","Clean the equipment only at the end of the day"], a:1, exp:"غسل الإيدين وتنضيف الأدوات اللي المريض بيلمسها بين كل مريض والتاني."},
{t:"An anxious patient believes that he must pass the test. What should the nurse say?", o:["Try hard because failing will have consequences","It is a quick test, so do not worry about the results","It is not a test that you have to pass, but a test to help us know how your eyes are working","You must not ask any questions"], a:2, exp:"نطمّن المريض إنه مش امتحان ينجح فيه، ده عشان نعرف عينه شغالة إزاي. وده بيجيب تعاونه."},
{t:"After testing each eye, what should the nurse do?", o:["Discard the results","Test the same eye again indefinitely","Record the VA for each eye in the patient's notes, then evaluate the need for eyeglasses or lenses","Tell the patient the result is normal without recording it"], a:2, exp:"نسجّل الـ VA لكل عين في الـ notes وبعدين نقيّم الحاجة لنضارة أو عدسات."},

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 60*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
function render() {
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
