<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --accent:#0f9d8f; --accent-light:#2dd4bf; --accent-dark:#0b6e79; --accent-glow:rgba(15,157,143,0.2); --accent-rgb:15,157,143;
  --c2:#7c3aed; --c3:#f59e0b; --c4:#ec4899;
  --grad:linear-gradient(135deg,#0b6e79 0%,#7c3aed 55%,#ec4899 100%);
  --grad-soft:linear-gradient(135deg,#0f9d8f,#7c3aed);
  --bg:#f7f9fc; --bg2:#eef1f8; --card:#ffffff; --text:#1a2332; --text2:#4a5568; --text3:#718096;
  --bc:rgba(0,0,0,0.07); --success:#16a34a; --danger:#e11d48; --warn:#d97706; --r:16px;
  --tr:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:#0f0d1a; --bg2:#181528; --card:#211d36; --text:#ece9f7; --text2:#bdb8d6; --text3:#8a84a8;
  --bc:rgba(255,255,255,0.09); --accent:#2dd4bf; --accent-light:#5eead4; --accent-dark:#14b8a6;
  --accent-glow:rgba(45,212,191,0.2); --accent-rgb:45,212,191; --c2:#a78bfa; --c3:#fbbf24; --c4:#f472b6;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4),var(--c3)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(247,249,252,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(15,13,26,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); transform:rotate(20deg); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 36px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.35) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(255,255,255,.14) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.hero-band-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.2); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; font-size:30px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.85); }
.hero-band-meta { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.18); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:560px; margin:0 auto; padding:24px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; }
.stat-box:nth-child(1) { border-top:3px solid var(--success); }
.stat-box:nth-child(2) { border-top:3px solid var(--danger); }
.stat-box:nth-child(3) { border-top:3px solid var(--c2); }
.stat-box .val { font-size:20px; font-weight:900; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c2); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:8px; background:var(--bg2); border-radius:8px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c4)); border-radius:8px; transition:width .4s; }
.timer-badge { min-width:64px; height:36px; border-radius:18px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; }
.timer-badge.warn { color:var(--warn); border-color:rgba(217,119,6,.3); background:rgba(217,119,6,.08); }
.timer-badge.danger { color:var(--danger); border-color:rgba(225,29,72,.3); background:rgba(225,29,72,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(80,60,140,.08); transition:box-shadow .3s; }
.q-header { background:var(--grad); padding:4px 18px; display:flex; align-items:center; gap:8px; }
.q-num { background:rgba(255,255,255,.2); border-radius:8px; padding:3px 10px; font-size:11px; font-weight:700; color:#fff; }
.q-text { padding:22px 18px 14px; font-size:15px; font-weight:700; color:var(--text); line-height:1.65; border-bottom:1px solid var(--bc); text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:10px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:hover:not(.disabled) { border-color:var(--c2); background:rgba(124,58,237,.07); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:8px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { background:rgba(15,157,143,.14); color:var(--accent); border-color:rgba(15,157,143,.35); }
.opt:nth-child(2) .opt-letter { background:rgba(124,58,237,.14); color:var(--c2); border-color:rgba(124,58,237,.35); }
.opt:nth-child(3) .opt-letter { background:rgba(245,158,11,.16); color:var(--warn); border-color:rgba(245,158,11,.4); }
.opt:nth-child(4) .opt-letter { background:rgba(236,72,153,.14); color:var(--c4); border-color:rgba(236,72,153,.35); }
.opt.correct { border-color:var(--success); background:rgba(22,163,74,.08); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(225,29,72,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(22,163,74,.1); color:var(--success); border:1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background:rgba(225,29,72,.08); color:var(--danger); border:1px solid rgba(225,29,72,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:10px; border-right:3px solid var(--c3); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:12px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(124,58,237,.25); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(124,58,237,.35); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:20px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(80,60,140,.08); border-top:5px solid transparent; background-image:linear-gradient(var(--card),var(--card)),var(--grad); background-origin:border-box; background-clip:padding-box,border-box; }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:10px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(225,29,72,.1); color:var(--danger); } .ri-right { background:rgba(22,163,74,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#f59e0b,#ec4899); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(236,72,153,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--c2); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 28px;} }
</style>
</head>

const QUESTIONS = [
{t:"Bandage is best defined as:",o:["A rigid device used only to immobilize fractured bones","A sterile fluid used to irrigate wounds","A plastic tube used to drain wound secretions","A strip or piece of soft material used to secure a dressing or other medical device, provide support or compression, or protect an injured body part"],a:3,exp:"الـ bandage هو شريط أو قطعة material ناعمة بتثبّت الـ dressing أو بتدّي support أو compression."},
{t:"Which of the following is a purpose of bandaging?",o:["Secure traction equipment","Increase swelling to promote healing","Replace the need for a wound dressing","Increase venous pooling in the leg"],a:0,exp:"من أهداف الـ bandage: تثبيت الـ dressing، دعم الـ splint، تقييد حركة المفصل، وتثبيت الـ traction."},
{t:"Bandaging the leg of a patient suffering from varicose veins aims to:",o:["Correct arterial insufficiency","Aid in improving venous circulation","Increase the temperature of the limb","Prevent only skin infection"],a:1,exp:"في الـ varicose vein الـ bandage بيساعد على تحسين الـ venous circulation."},
{t:"The most common type of medical bandage, also known as crepe or gauze bandage, is the:",o:["Triangular bandage","Tubular bandage","Roller bandage","Cohesive bandage"],a:2,exp:"الـ Roller bandage هو أشهر نوع وبيتسمى كمان Crepe أو Gauze."},
{t:"Roller bandages are made of:",o:["Self-adhesive material","A continuous elasticated circle","A right-angled triangular cloth","Woven absorbent material"],a:3,exp:"الـ Roller bandages مصنوعة من woven absorbent material."},
{t:"Compression bandages are:",o:["Cloth strips split into two tails at each end","Broad supports used only for the abdomen","Elastic bandages used to apply pressure and support soft tissue injuries","Right-angled cloth used only as a sling"],a:2,exp:"الـ Compression bandages هي elastic bandages بتدّي pressure وsupport للـ soft tissue injuries."},
{t:"Short stretch compression bandages are characterized by:",o:["Limited stretch and strong pressure","Far more extensibility and mild compression","Sticking to itself but not to the skin","Woven in a continuous circle"],a:0,exp:"الـ Short stretch بتتمطّ قليل وبتدّي pressure قوي، وبتستخدم أساساً للتحكم في الـ swelling."},
{t:"Which condition is a use of short stretch compression bandages?",o:["Strains and sprains","Securing a chin dressing","Lymphedema","Covering an amputation stump"],a:2,exp:"استخدامات الـ Short stretch: Lymphedema، Edema، Venous leg ulcers."},
{t:"Which is a use of long stretch compression bandages?",o:["Supporting strains and sprains","Venous leg ulcers","Lymphedema","Edema from a poisonous bite"],a:0,exp:"الـ Long stretch بتدّي support وmild compression: تثبيت dressings وsplints ودعم strains وsprains."},
{t:"Snake bite bandages are intended for use with the:",o:["Figure of eight technique","Pressure Immobilization Technique","Spiral reverse technique","Recurrent technique"],a:1,exp:"الـ Snake bite bandage بتتستخدم مع Pressure Immobilization Technique عشان تقلل انتشار السم في الـ lymphatic system."},
{t:"Which cohesive bandage property is unique?",o:["It sticks firmly to hair and skin","It needs bandage clips to stay in place","It sticks to itself but not to the skin","It stretches only a little"],a:2,exp:"الـ Cohesive بتلزق في نفسها بس مش في الجلد أو الشعر."},
{t:"A triangular bandage is also known as a:",o:["Crepe bandage","Tube bandage","Spica bandage","Cravat bandage"],a:3,exp:"الـ Triangular bandage اسمه التاني cravat bandage."},
{t:"A tubular bandage is best described as:",o:["A strip of cloth with each end split into two","An elasticated bandage woven in a continuous circle to provide uniform compression","A right-angled multi-purpose cloth","A broad support for the pelvis"],a:1,exp:"الـ Tubular بيتعمل woven في دايرة مكملة عشان يدّي uniform compression."},
{t:"Which statement about applying a bandage is correct?",o:["It should be applied with maximum tension so it never slips","It should cover the toes and fingers completely","It should never be secured with clips or pins","It should be applied with equal pressure to keep proper circulation"],a:3,exp:"لازم الـ bandage يتحط بضغط متساوي عشان الـ circulation تفضل سليمة."},
{t:"When bandaging a hand or foot, toes and fingers should be:",o:["Bandaged together tightly","Covered with adhesive tape directly","Separated by cotton to prevent rubbing","Left without any protection after bandaging"],a:2,exp:"الصوابع ماتتربطش مع بعض، بنحط cotton بينهم عشان ماتحتكش."},
{t:"The bandage should extend beyond both sides of the dressing by at least:",o:["Half an inch","Three inches","One inch","Five inches"],a:2,exp:"الـ bandage لازم يعدّي الـ dressing بـ one inch على الأقل من الناحيتين."},
{t:"Which signs indicate poor circulation below a bandage?",o:["Warm pink skin with normal sensation","Mild itching only","Dry skin with normal capillary refill","Pale or blue skin, coldness, numbness and tingling"],a:3,exp:"علامات الـ poor circulation: جلد pale أو blue، برودة، numbness وtingling."},
{t:"If circulation below the bandage is reduced, the nurse should first:",o:["Apply an extra layer of bandage","Loosen the bandage right away","Tighten the bandage and reassess later","Leave it unchanged for 24 hours"],a:1,exp:"لو الـ circulation قلّت: فكّ/وسّع الـ bandage فوراً، ولو الأعراض استمرت اطلب medical care."},
{t:"The circular turn is mainly used to:",o:["Bandage a joint","Anchor the beginning of a bandage","Cover the end of a body part","Bandage a limb that is not uniform in circumference"],a:1,exp:"الـ Circular turn بتستخدم لتثبيت بداية ونهاية الـ bandage وتغطية area صغيرة."},
{t:"The spiral turn is used for cylindrical parts that are:",o:["Not uniform, such as the lower leg","Joints such as the knee and elbow","Fairly uniform in circumference, such as the upper arm and upper leg","The ends of limbs such as the toes"],a:2,exp:"الـ Spiral turn للأجزاء الأسطوانية المتساوية تقريباً زي upper arm وupper leg."},
{t:"In the spiral turn, each turn overlaps the preceding one by:",o:["Two-thirds the width of the bandage","One-third the width of the bandage","Half the width of the bandage","The full width of the bandage"],a:0,exp:"في الـ spiral كل لفة بتغطي اللي قبلها بـ two-thirds من عرض الـ bandage وبزاوية حوالي 30 درجة."},
{t:"The spiral reverse turn is used for cylindrical parts that:",o:["Are uniform, such as the upper arm","Are not uniform in circumference, such as the lower leg or lower forearm","Are joints such as the wrist","Are the end of a body part"],a:1,exp:"الـ Spiral reverse للأجزاء غير المتساوية في المحيط زي lower leg وlower forearm."},
{t:"In the spiral reverse turn, the thumb of the free hand is placed:",o:["On the lower edge of the bandage to pull it tight","Under the limb to lift it","On the upper edge of the bandage to hold it while it is folded on itself","On the end of the bandage to secure it with tape"],a:2,exp:"الإبهام بيمسك الـ bandage من الحافة العليا وهو بيتطبّق على نفسه."},
{t:"The figure of eight turn is commonly used around:",o:["The end of a finger","The chin","The abdomen only","Joints such as the knee, ankle, wrist, elbow or shoulder"],a:3,exp:"الـ Figure of eight بتستخدم حوالين المفاصل."},
{t:"Spica is a form of figure of eight in which:",o:["All turns are of equal size","Turns are made only in one direction","One turn is very much larger than the other","The bandage is folded at every turn"],a:2,exp:"الـ Spica هي figure of eight واحدة من لفاتها أكبر بكتير من التانية."},
{t:"Spica bandage is useful for bandaging the:",o:["Finger tips and toes","Chin and nose","Upper arm only","Thumb, breast, shoulder, groin and hip"],a:3,exp:"الـ Spica مفيدة للـ thumb وbreast وshoulder وgroin وhip."},
{t:"The recurrent bandage is used to cover:",o:["The end of a body part such as a finger, toes or amputation stump","The lower leg","The knee joint","The abdomen"],a:0,exp:"الـ Recurrent بتغطي نهاية العضو: finger، toes، amputation stump."},
{t:"The four tailed bandage is used to cover prominences such as the:",o:["Thumb and hip","Upper arm","Abdomen and chest","Elbow, chin, nose or knee"],a:3,exp:"الـ Four tailed bandage: شريط كل طرف فيه منقسم لاتنين، بيغطي الـ prominences."},
{t:"Which is a complication of a tightly applied bandage?",o:["Impaired circulation","Increased venous return only","Warmth of the toes","Improved sensation"],a:0,exp:"الـ bandage الضيق بيعمل impaired circulation: لون أزرق/أسود/أبيض في الصوابع، برودة، cyanosis، ألم وtingling."},
{t:"Pressure sores may develop under a bandage when:",o:["The bandage is changed too often","Insufficient padding is applied to bony prominences or between surfaces","The limb is elevated","Cotton is placed between the toes"],a:1,exp:"الـ pressure sores بتحصل لو الـ padding مش كفاية على الـ bony prominences."},
{t:"Infection is a complication of bandaging when:",o:["The bandage is secured with a clip","The bandage becomes wet and is not changed","The bandage is applied with equal pressure","The end of the limb is left exposed"],a:1,exp:"لو الـ bandage اتبلّ وماتغيّرش بيحصل infection."},
{t:"A binder is best defined as:",o:["A broad flexible supportive material used to support and compress specific body parts such as the abdomen, chest, back or pelvis","A strip of cloth used only to secure a dressing","A right-angled triangle of cloth","A rigid splint"],a:0,exp:"الـ Binder مادة عريضة flexible وadjustable بتدعم وتضغط أجزاء زي abdomen وchest وback وpelvis."},
{t:"For patients recovering from abdominal surgery, an abdominal binder helps by:",o:["Supporting the abdomen and reducing the risk of wound dehiscence","Drying up milk flow","Securing a chin dressing","Securing a perineal dressing"],a:0,exp:"الـ abdominal binder بيدعم البطن ويقلل خطر wound dehiscence."},
{t:"The T bandage is used to:",o:["Secure a chin dressing","Support the breasts after surgery","Support a fractured arm","Secure a rectal or perineal dressing in females"],a:3,exp:"الـ T bandage بيثبّت dressing الـ rectal أو الـ perineal عند الإناث."},
{t:"The double T bandage is used for:",o:["Securing a dressing on the chin","The same purpose as the T bandage but in males","Supporting the arm","Applying pressure to the breasts"],a:1,exp:"الـ Double T نفس غرض الـ T bandage بس للرجالة."},
{t:"The breast binder is useful for:",o:["Drying up milk flow after childbirth or supporting the breast after surgery","Securing a dressing on the chin","Maintaining a sling position","Securing rectal dressings"],a:0,exp:"الـ Breast binder بيضغط على الـ breasts (لتجفيف اللبن بعد الولادة) أو بيدعمهم بعد جراحة الثدي."},
// ===== TRUE / FALSE =====

{t:"Roller bandages are also known as crepe or gauze bandages.",o:["True","False"],a:0,exp:"صح، الـ Roller = Crepe أو Gauze."},
{t:"The T bandage is used to secure rectal or perineal dressings in males.",o:["True","False"],a:1,exp:"الـ T bandage للإناث، والـ Double T للرجالة."},
{t:"Short stretch compression bandages are mainly used to control swelling.",o:["True","False"],a:0,exp:"صح، بتدّي strong pressure."},
{t:"Long stretch compression bandages offer less extensibility than short stretch bandages.",o:["True","False"],a:1,exp:"الـ Long stretch ليها extensibility أكبر بكتير."},
{t:"Snake bite bandages have special indicator markings to ensure correct tension.",o:["True","False"],a:0,exp:"صح، المؤشرات بتتأكد إن الـ tension مظبوط."},
{t:"Cohesive bandages stick to the patient's skin and hair.",o:["True","False"],a:1,exp:"بتلزق في نفسها بس مش في الجلد أو الشعر."},
{t:"A tubular bandage is woven in a continuous circle to provide uniform compression.",o:["True","False"],a:0,exp:"صح."},

{t:"Bony prominences over which the bandage is placed should be padded.",o:["True","False"],a:0,exp:"صح، عشان نمنع الـ pressure sores."},
{t:"The spiral turn is used for parts of the body that are not uniform in circumference.",o:["True","False"],a:1,exp:"ده الـ spiral reverse. الـ spiral للأجزاء المتساوية."},

{t:"Elevating the extremity before bandaging encourages venous return and helps prevent swelling.",o:["True","False"],a:0,exp:"صح."},

{t:"A patient with lymphedema in the leg needs a bandage that provides strong pressure with limited stretch. The most suitable choice is:",o:["Short stretch compression bandage","Long stretch compression bandage","Cohesive bandage","Triangular bandage"],a:0,exp:"الـ Lymphedema من استخدامات الـ Short stretch compression bandage."},
{t:"A hiker is bitten by a snake and the nurse wants to reduce the spread of venom through the lymphatic system. The nurse should use:",o:["A triangular bandage as a sling only","A tubular bandage on the head","An abdominal binder","A snake bite bandage with the Pressure Immobilization Technique"],a:3,exp:"Snake bite bandage + Pressure Immobilization Technique."},
{t:"A patient has an ankle sprain and the nurse needs to support the joint and limit movement to reduce pain and swelling. Which turn is most suitable?",o:["Circular turn only","Spiral turn","Figure of eight turn","Recurrent turn"],a:2,exp:"الـ Figure of eight بتتستخدم حوالين المفاصل زي الـ ankle."},
{t:"A patient had a below-knee amputation and the nurse needs to cover the end of the stump. Which bandage technique is used?",o:["Recurrent bandage","Spiral reverse turn","Spica","Four tailed bandage"],a:0,exp:"الـ Recurrent بتغطي نهاية العضو زي الـ amputation stump."},
{t:"Thirty minutes after bandaging a patient's forearm, the fingers appear blue, cold and tingling. What is the nurse's priority action?",o:["Apply another layer for support","Elevate and leave it as is for 24 hours","Loosen the bandage right away","Remove the dressing under the bandage"],a:2,exp:"الـ blue وcold وtingling يعني poor circulation: فك الـ bandage فوراً، ولو الأعراض استمرت اطلب medical care."},
{t:"A post-operative patient after abdominal surgery is at risk of wound dehiscence. Which binder is appropriate?",o:["Tailed binder","Abdominal (straight) binder","Breast binder","T bandage"],a:1,exp:"الـ Abdominal binder بيدعم البطن ويقلل خطر الـ dehiscence."},
{t:"Before applying an elastic bandage, the nurse elevates the extremity. What is the rationale?",o:["To encourage venous return, prevent swelling and make it easier to wrap the bandage properly","To check the doctor's order","To prevent cross infection","To support the patient's psychological condition"],a:0,exp:"الـ elevation بيشجع الـ venous return ويمنع الـ swelling ويسهّل اللف."},

{t:"The nurse keeps the patient's privacy before bandaging. The rationale is:",o:["To confirm the order","To support the patient's psychological condition","To save time and effort","To prevent pressure areas"],a:1,exp:"الـ privacy بتدعم الحالة النفسية للمريض."},
{t:"After bandaging, the nurse compares colour, temperature, sensation and capillary refill of the affected extremity with the unaffected side. The rationale is:",o:["To secure the bandage with tape","To prevent cross infection","To confirm the patient identification","To ensure the health of the injured part and discover early any deterioration in circulation"],a:3,exp:"المقارنة بالطرف السليم بتكشف أي deterioration في الـ circulation بدري."},

{t:'<img src="'+IMG.fourtail+'"><br>'+"The bandage shown covering the chin is a:",o:["Triangular bandage sling","Double T bandage","Abdominal binder","Four tailed bandage"],a:3,exp:"الـ Four tailed بتغطي الـ prominences زي chin وnose وelbow وknee."},

{t:'<img src="'+IMG.dbl+'"><br>'+"The binder shown, with two vertical tails, serves the same purpose as the T bandage but in:",o:["Males (Double T bandage)","Females (Double T bandage)","Males (Breast binder)","Females (Tailed binder)"],a:0,exp:"الـ Double T للرجالة."},
{t:'<img src="'+IMG.tailed+'"><br>'+"The binder shown is used to:",o:["Dry up milk flow after childbirth","Support the abdomen after surgery","Secure a rectal dressing","Secure a dressing on the chin"],a:3,exp:"الـ Tailed binder لتثبيت dressing الـ chin."},

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 60*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
function render() {
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
