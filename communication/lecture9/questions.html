<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0891b2;--accent-rgb:8,145,178;--c2:#7c3aed;--c3:#ea580c;--c4:#059669;--grad:linear-gradient(135deg,#155e75 0%,#0891b2 40%,#6d28d9 100%);--grad-soft:linear-gradient(135deg,#0891b2,#6d28d9);--bg:#f4fafb;--bg2:#e6f2f5;--card:#fff;--text:#0f2a30;--text2:#3f5d65;--text3:#6f8b93;--bc:rgba(15,60,75,.10);--success:#15803d;--danger:#dc2626;--warn:#ea580c;--r:20px;--tr:all .3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#071418;--bg2:#0d1f25;--card:#112a31;--text:#e6f6f9;--text2:#b5d3da;--text3:#7fa0a8;--bc:rgba(255,255,255,.09);--success:#4ade80;--danger:#f87171}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#prog-bar{position:fixed;top:0;left:0;height:3px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--c2),var(--c3),var(--c4));transition:width .2s}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(244,250,251,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(7,20,24,.95)}
.nav-back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:50px;border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.nav-back:hover{color:var(--c2);border-color:var(--c2)}
.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.nav-logo-icon{width:34px;height:34px;border-radius:50% 50% 50% 8px;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero-band{margin-top:64px;background:var(--grad);padding:40px 24px 56px;text-align:center;position:relative;overflow:hidden;border-radius:0 0 50% 50%/0 0 28px 28px}
.hero-band::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 380px 180px at 12% 0,rgba(234,88,12,.28),transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(5,150,105,.25),transparent 70%)}
.hero-band>*{position:relative}
.bubble{position:absolute!important;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.22)}
.b1{width:70px;height:50px;left:6%;top:26px;border-radius:22px 22px 22px 6px}.b2{width:54px;height:40px;right:7%;top:44px;border-radius:20px 20px 6px 20px}
.hero-band-icon{width:68px;height:68px;border-radius:50% 50% 50% 14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.35)}
.hero-band h1{font-size:clamp(20px,4vw,30px);font-weight:900;color:#fff;margin-bottom:6px}
.hero-band p{font-size:13px;color:rgba(255,255,255,.88)}
.hero-band-meta{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.meta-pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 16px;font-size:12px;font-weight:700;color:#fff}
.shell{max-width:560px;margin:0 auto;padding:24px 20px 80px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat-box:nth-child(1){border-top:3px solid var(--success)}.stat-box:nth-child(2){border-top:3px solid var(--danger)}.stat-box:nth-child(3){border-top:3px solid var(--c2)}
.stat-box .val{font-size:20px;font-weight:900}.stat-box .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat-correct{color:var(--success)}.stat-wrong{color:var(--danger)}.stat-remain{color:var(--c2)}
.prog-strip{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.prog-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.prog-track{flex:1;height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--c2),var(--c3),var(--c4));border-radius:8px;transition:width .4s}
.timer-badge{min-width:64px;height:36px;border-radius:18px;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;padding:0 12px;flex-shrink:0}
.timer-badge.warn{color:var(--warn);background:rgba(234,88,12,.08)}.timer-badge.danger{color:var(--danger);background:rgba(220,38,38,.08);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.q-card{background:var(--card);border:1px solid var(--bc);border-radius:28px;overflow:hidden;box-shadow:0 4px 20px rgba(var(--accent-rgb),.12)}
.q-header{background:var(--grad);padding:6px 18px}
.q-num{display:inline-block;background:rgba(255,255,255,.2);border-radius:50px;padding:3px 12px;font-size:11px;font-weight:700;color:#fff}
.q-text{margin:16px 18px 6px;padding:16px 18px;font-size:15px;font-weight:700;line-height:1.65;background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accent-rgb),.18);border-radius:22px 22px 22px 6px;text-align:left;direction:ltr}
.options{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px 20px 20px 6px;border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;transition:var(--tr);user-select:none;direction:ltr;text-align:left}
.opt:nth-child(even){border-radius:20px 20px 6px 20px}
.opt:hover:not(.disabled){border-color:var(--c2);background:rgba(124,58,237,.07);transform:translateX(3px)}
.opt-letter{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--text3)}
.opt:nth-child(1) .opt-letter{background:rgba(8,145,178,.12);color:var(--accent)}.opt:nth-child(2) .opt-letter{background:rgba(124,58,237,.12);color:var(--c2)}.opt:nth-child(3) .opt-letter{background:rgba(234,88,12,.14);color:var(--warn)}.opt:nth-child(4) .opt-letter{background:rgba(5,150,105,.14);color:var(--c4)}
.opt.correct{border-color:var(--success);background:rgba(21,128,61,.09)}.opt.correct .opt-letter{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:rgba(220,38,38,.07)}.opt.wrong .opt-letter{background:var(--danger);color:#fff}
.opt.disabled{pointer-events:none}
.feedback-bar{margin:14px 18px;padding:12px 16px;border-radius:50px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.feedback-bar.ok{background:rgba(21,128,61,.1);color:var(--success);border:1px solid rgba(21,128,61,.25)}.feedback-bar.no{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2)}
.feedback-icon{font-size:20px}
.explanation{margin:0 18px 14px;padding:12px 14px;background:rgba(var(--accent-rgb),.06);border-radius:16px;border-right:3px solid var(--c3);font-size:13px;color:var(--text2);line-height:1.6}
.nav-btns{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:50px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Outfit',sans-serif;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
.btn:focus-visible,.opt:focus-visible,.theme-btn:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.btn-next{background:var(--grad-soft);color:#fff;box-shadow:0 4px 14px rgba(var(--accent-rgb),.3)}
.btn-skip{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:28px;border:1px solid var(--bc);margin-bottom:20px;box-shadow:0 4px 20px rgba(var(--accent-rgb),.12)}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:5px solid var(--bg2);position:relative}
.score-ring svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:5;stroke-linecap:round}.ring-bg{stroke:var(--bg2)}.ring-fill{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:900}.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:900;margin-bottom:6px}.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:16px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-radius:20px;padding:16px;margin-bottom:10px;border-right:4px solid var(--bc)}
.report-item.ok{border-right-color:var(--success)}.report-item.no{border-right-color:var(--danger)}
.report-item .ri-q{font-size:13px;font-weight:700;margin-bottom:8px}
.report-item .ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 10px;border-radius:50px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.1);color:var(--danger)}.ri-right{background:rgba(21,128,61,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,#ea580c,#7c3aed);color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}
.footer-tg{color:#229ED9;font-size:12px;font-weight:600;text-decoration:none}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 48px}}
</style>
</head>
<body>
<div id="prog-bar" style="width:0%"></div>
<nav>
  <a href="https://gaith-team.github.io/exam/" class="nav-back">← رجوع</a>
  <div class="nav-brand"><div class="nav-logo-icon">GT</div><span>GHAITH TEAM</span></div>
  <button class="theme-btn" id="themeBtn">🌙</button>
</nav>
<div class="hero-band">
  <span class="bubble b1"></span><span class="bubble b2"></span>
  <div class="hero-band-icon">💬</div>
  <h1>Telehealth &amp; Tele Nursing</h1>
  <p>Communication Skills</p>
  <div class="hero-band-meta">
    <div class="meta-pill"><span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill">35 Min</div>
    <div class="meta-pill">Shuffled</div>
  </div>
</div>
<div class="shell">
  <div class="stats-row">
    <div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div>
    <div class="stat-box"><div class="val stat-wrong" id="sWrong">0</div><div class="lbl">✖ خطأ</div></div>
    <div class="stat-box"><div class="val stat-remain" id="sRemain">--%</div><div class="lbl">⏳ متبقي</div></div>
  </div>
  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><span id="timerTxt">35:00</span></div>
  </div>
  <div id="app"></div>
</div>
<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg">@nursing2bu</a>
</footer>
<script>
const QUESTIONS = [
/* ===== Multiple Choice (easy → hard) ===== */
{t:"Telehealth refers to:",o:["Face-to-face care inside hospitals only","Paper-based record keeping","The use of digital information and communication technologies to access health care remotely","Surgery performed by robots only"],a:2},
{t:"Telehealth is attracting growing interest mainly because of:",o:["Decreasing demand for care","Increasingly available communication technology","Fewer rural patients","A ban on home visits"],a:1},
{t:"Which of the following is an ADVANTAGE of telehealth?",o:["Decreased face-to-face interaction","May increase liability","Concerns with security","Decrease wait-times"],a:3},
{t:"Tele nursing is the use of ______ technology in nursing to enhance patient care.",o:["Telecommunication","Surgical","Laboratory","Pharmaceutical"],a:0},
{t:"Which of the following is a DISADVANTAGE of telehealth?",o:["Decrease healthcare costs","Provide access in rural areas","Concerns with maintaining confidentiality","Increase continuity of care"],a:2},
{t:"Telehealth connects ______ to services at a distant site.",o:["Urban hospitals with each other only","Rural providers and their patients","Pharmacists and suppliers","Students and teachers"],a:1},
{t:"Which is an example of tele-monitoring of vital signs?",o:["Measuring blood pressure, blood glucose or heart rate with self-measurement devices","Replacing nurses with robots","Printing patient charts","Visiting the patient at home"],a:0},
{t:"The aim of tele-care is to:",o:["Replace all hospitals","Reduce the number of nurses","Limit care to institutions only","Provide multidisciplinary continuing comprehensive care to support aging in place"],a:3},
{t:"Which of the following is NOT one of the core tele-care home services?",o:["Tele-consultation","Emergency management","Tele-surgery","Tele-health education"],a:2},
{t:"Compared with telemedicine, telehealth is:",o:["Narrower in scope","Broader in scope","Identical in scope","Limited to clinical services only"],a:1},
{t:"Which electromagnetic channels are used in tele nursing to transmit voice, data and video signals?",o:["Wire, radio and optical","Paper, ink and film","Sound and heat only","Mail and courier"],a:0},
{t:"Activity monitors are used by nurses to:",o:["Measure blood glucose","Replace videoconferencing","Remind patients about drug doses","Monitor movements in and around the home"],a:3},
{t:"Which of the following is one of the core tele-care home services?",o:["Surgical consultation","Tele-physiological monitoring","Hospital billing","Staff recruitment"],a:1},
{t:"Providing wound assessment at a distance is an example of:",o:["E-visit","Personal alarm","Teleconsultation","Activity monitoring"],a:2},
{t:"When a patient uses a personal alarm, its purpose is to:",o:["Let nurses or family members know when something goes wrong","Schedule the next appointment","Measure vital signs","Send the hospital bill"],a:0},
{t:"Telehealth solutions are effective only if:",o:["Patients live in rural areas","Nurses work night shifts","Devices are expensive","Users (patients and nurses) know how to use technology adequately"],a:3},
{t:"In the telemonitoring device system, the patient at home sends data to diabetologists, dieticians, nurses and technical support through:",o:["Postal mail","An e-mail system","Fax only","Radio only"],a:1},
{t:"Which of the following is NOT a key skill for nurses who provide telehealth?",o:["Coaching skills","Ethical awareness","Surgical dexterity","A supportive attitude"],a:2},
{t:"The ability to combine clinical experience with telehealth is considered:",o:["A key emerging competency for telehealth nurses","A disadvantage of telehealth","An aim of tele-care","A telemonitoring device"],a:0},
{t:"Which advantage of telehealth is directly related to care after discharge?",o:["Decrease wait-times","Increase patient compliance with aftercare","Decrease liability","Increase face-to-face interaction"],a:1},
{t:"Telemedicine refers specifically to:",o:["Remote non-clinical services","Home care services only","Education of nurses","Remote clinical services"],a:3},
{t:"E-visits via videoconferencing are used to:",o:["Add more hospital visits","Increase wait times","Replace face-to-face visits","Monitor movements at home"],a:2},
{t:"Which option lists TWO disadvantages of telehealth?",o:["Decrease costs and increase access","May increase liability and risk of decreasing quality of care","Decrease wait-times and provide rural access","Increase continuity and compliance"],a:1},
{t:"Aging in place is supported through which care services?",o:["Community, home and institution care services","Emergency services only","Hospital services only","Pharmacy and laboratory services"],a:0},
{t:"The summary of data collected in the telemonitoring device includes charts highlighting:",o:["Staff salaries and weight","Hospital beds and diet","Blood pressure and sleep only","Weight, blood glucose, physical activity and diet"],a:3},
/* ===== True / False ===== */
{t:"Telehealth can refer to remote non-clinical services, while telemedicine refers specifically to remote clinical services.",o:["True","False"],a:0},
{t:"Telemedicine has a broader scope than telehealth.",o:["True","False"],a:1},
{t:"Decrease in healthcare costs is a disadvantage of telehealth.",o:["True","False"],a:1},
{t:"Living resources referral is one of the core tele-care home services.",o:["True","False"],a:0},
{t:"Telehealth solutions are effective regardless of whether users know how to use the technology.",o:["True","False"],a:1},
{t:"Activity monitors can be used to monitor movements in and around the home.",o:["True","False"],a:0},
{t:"The aim of tele-care is to provide care only inside institutions.",o:["True","False"],a:1},
{t:"Concerns with maintaining confidentiality is a disadvantage of telehealth.",o:["True","False"],a:0},
{t:"Ethical awareness is not a key skill for nurses who provide telehealth.",o:["True","False"],a:1},
{t:"Tele nursing involves electromagnetic channels such as wire, radio and optical to transmit voice, data and video signals.",o:["True","False"],a:0}
];


/* ============ ENGINE ============ */
let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=35*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shuffleOptions(q){
  if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return{...q};
  const idx=shuffle(q.o.map((_,k)=>k));
  return{...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};
}
function init(pool){
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' سؤال';
  startTimer();render();
}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const b=document.getElementById('timerBadge');
    if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish()}
  },1000);
}
function updateTop(){
  const total=questions.length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[
 {icon:'💬',l:['#0891b2','8,145,178','#155e75','#0891b2','#6d28d9'],d:['#22d3ee','34,211,238']},
 {icon:'👂',l:['#7c3aed','124,58,237','#5b21b6','#7c3aed','#db2777'],d:['#a78bfa','167,139,250']},
 {icon:'🤝',l:['#ea580c','234,88,12','#9a3412','#ea580c','#db2777'],d:['#fb923c','251,146,60']},
 {icon:'🗣️',l:['#059669','5,150,105','#065f46','#059669','#0e7490'],d:['#34d399','52,211,153']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style;
  const main=dark?s.d[0]:s.l[0],rgb=dark?s.d[1]:s.l[1];
  r.setProperty('--accent',main);r.setProperty('--accent-rgb',rgb);
  r.setProperty('--grad',`linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()">⏭ تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=document.getElementById('opt'+idx);
    el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`:`<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){const exp=document.createElement('div');exp.className='explanation';exp.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(exp)}
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'← السؤال التالي':'🏁 إنهاء الامتحان'}</button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop()}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length,score=Math.round((correct/total)*100);
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]})});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gc;
  if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}
  else if(score>=75){grade='🥈 جيد جداً';gc='var(--c2)'}
  else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}
  else{grade='📚 راجع تاني';gc='var(--danger)'}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const reportHTML=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`
      <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0?q.o[answers[idx]]:'تم التخطي'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`;
  }).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div></div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${Math.max(0,total-answered)}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()">↻ إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)">🔀 امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home">🏠 رجوع للمادة</a>
    </div>
    <div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${reportHTML}</div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme='light';try{theme=localStorage.getItem('theme')||'light'}catch(e){}
function applyTheme(t){
  theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t)}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
