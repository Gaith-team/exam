*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0891b2;--accent-rgb:8,145,178;--c2:#7c3aed;--c3:#ea580c;--c4:#059669;--grad:linear-gradient(135deg,#155e75 0%,#0891b2 40%,#6d28d9 100%);--grad-soft:linear-gradient(135deg,#0891b2,#6d28d9);--bg:#f4fafb;--bg2:#e6f2f5;--card:#fff;--text:#0f2a30;--text2:#3f5d65;--text3:#6f8b93;--bc:rgba(15,60,75,.10);--success:#15803d;--danger:#dc2626;--warn:#ea580c;--r:20px;--tr:all .3s cubic-bezier(.4,0,.2,1)}

.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:28px;border:1px solid var(--bc);margin-bottom:20px;box-shadow:0 4px 20px rgba(var(--accent-rgb),.12)}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:5px solid var(--bg2);position:relative}

.score-num{font-size:28px;font-weight:900}.score-pct{font-size:12px;color:var(--text3)}

.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:16px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-radius:20px;padding:16px;margin-bottom:10px;border-right:4px solid var(--bc)}

.report-item .ri-q{font-size:13px;font-weight:700;margin-bottom:8px}
.report-item .ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 10px;border-radius:50px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.1);color:var(--danger)}.ri-right{background:rgba(21,128,61,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,#ea580c,#7c3aed);color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}

@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 48px}}
</style>

<script>
const QUESTIONS = [
 {t:"A presentation is best defined as:", o:["An informal chat between friends","A formal way of communicating thoughts, information and ideas to an audience","A written report sent to superiors","A private discussion between two colleagues"], a:1},
  {t:"A presentation is described as a ______ and speech-based means of communicating information or ideas.", o:["spontaneous","unplanned","structured-prepared","casual"], a:2},
  {t:"Which of the following is NOT a purpose of a presentation?", o:["To report activities, findings or suggestions to superiors","To educate, train or teach people","To ask for opinions, support or contributions","To avoid explaining your ideas, work and projects"], a:3},
  {t:"Which type of presentation focuses on educating the audience with facts, data and clear, structured information, such as project updates or educational reports?", o:["Persuasive","Demonstrative","Pitch/Sales","Formative"], a:3},
  {t:"Which type of presentation aims to convince the audience to adopt a new idea, take action or buy a product?", o:["Persuasive","Instructional/Training","Progress/Status Report","Inspirational/Motivational"], a:0},
  {t:"Which type of presentation involves showing \"how-to\" do something, often using live demonstrations or visual aids?", o:["Pitch/Sales","Progress/Status Report","Demonstrative","Persuasive"], a:2},
  {t:"A specialized, concise presentation designed to sell a product, service or business idea to potential investors or clients is a:", o:["Progress/Status Report","Pitch/Sales presentation","Keynote","Instructional/Training presentation"], a:1},
  {t:"Which common format is conducted via tools like Zoom or Teams?", o:["Virtual/Online","Keynote","Team/Collaborative","Panel Discussion/Fishbowl"], a:0},
  {t:"A featured speech at a conference or event is called a:", o:["Team/Collaborative presentation","Virtual/Online presentation","Panel discussion","Keynote"], a:3},
  {t:"Which type of presentation provides detailed, step-by-step knowledge on how to perform a specific task, function or process?", o:["Persuasive","Instructional/Training","Pitch/Sales","Inspirational/Motivational"], a:1},
  {t:"How many steps are listed for preparing a presentation?", o:["Four","Five","Six","Seven"], a:2},
  {t:"What is Step 1 in preparing a presentation?", o:["Analyze your audience","Select a topic","Define the objective of the presentation","Prepare the body of the presentation"], a:0},
 
  // ===== Medium =====
  {t:"What is Step 3 in preparing a presentation?", o:["Prepare the body of the presentation","Select a topic","Analyze your audience","Define the objective of the presentation"], a:3},
  {t:"Which steps fall under \"Planning your presentation\"?", o:["Analyze your audience, select a topic, define the objective","Prepare the body, prepare the introduction and conclusion","Practice and deliver the presentation","Prepare the introduction, practice and deliver"], a:0},
  {t:"Steps 4 and 5 (preparing the body, introduction and conclusion) fall under:", o:["Planning your presentation","Preparing the content of your presentation","Practicing and presenting","Handling questions and answers"], a:1},
  {t:"Step 6 of preparing a presentation is:", o:["Select a topic","Prepare the introduction and conclusion","Practice & delivering the presentation","Analyze your audience"], a:2},
  {t:"Which of the following is NOT a listed method of delivering a presentation?", o:["Speaking from memory","Speaking from notes","Speaking from text","Speaking without any preparation"], a:3},
  {t:"Which of the following should a presenter avoid, according to the techniques for effective presentation?", o:["Using pauses","Standing between the audience and the slides","Varying speaking volume","Maintaining good eye contact"], a:1},
  {t:"Which of the following is a recommended technique for effective presentation?", o:["Reading your presentation word for word","Keeping the same volume throughout","Using stories, questions or examples","Standing in front of the slides"], a:2},
  {t:"Under \"Formulating strategy\", the presenter should tailor the presentation according to the:", o:["Presenter's preference","Length of the slides","Time of day","Audience"], a:3},
  {t:"Under \"Formulating strategy\", the presentation should be:", o:["General and theoretical","Long and highly detailed","Concrete, specific, practical and relevant","Entertaining above all"], a:2},
  {t:"Which list shows the objectives given under \"Formulating strategy\" (be clear about your objective)?", o:["To inform, motivate, persuade, teach","To sell, hide, delay, avoid","To criticize, compare, reject, ignore","To report, argue, blame, test"], a:0},
  {t:"Under \"Developing a flexible and flowing structure\", which statement is correct?", o:["Information will speak by itself","Don't assume that information will speak by itself","The audience always interprets information in the same way","Think only from the presenter's point of view"], a:1},
  {t:"Which item belongs under \"Developing a flexible and flowing structure\"?", o:["Make a strong start","Control hijackers","Provide an outline, or road map","Think from audience point of view"], a:3},
 
  {t:"Which of the following is one of the pointers to organize your ideas?", o:["Provide an outline, or road map","Rehearse answers to difficult questions","Make eye contact","Use humor appropriately"], a:0},
  {t:"According to the pointers to organize your ideas, a presentation should conclude on:", o:["A question","An apology","A \"high note\"","A long list of details"], a:2},
  {t:"The conclusion of a presentation should include:", o:["An overall summary and proposed action","A completely new topic","Only a thank-you","Additional excessive details"], a:0},
  {t:"Which of the following is NOT among the pointers to organize your ideas?", o:["Maintain credibility","Incorporate visual aids, graphs or charts","Plan ways to encourage audience participation","Include excessive details"], a:3},
  {t:"Regarding presentation style, how you present and your confidence are:", o:["Less important than the content","As important as the actual content of the presentation","Unrelated to the content","Important only for pitch presentations"], a:1},
  {t:"According to presentation style, the presenter should engage the audience:", o:["In the first 2-3 minutes","Only at the end","After the first 10 minutes","Only during the questions"], a:0},
  {t:"Which item is listed under \"Handling questions and answers\"?", o:["Make a strong start","Rehearse answers to difficult questions","Use humor appropriately","Attention to body language"], a:1},
  {t:"If you don't know the answer to a question from the audience, you should:", o:["Invent an answer","Ignore the question","Be honest","Change the topic"], a:2},
  {t:"Which of the following is NOT a common cause of ineffective presentation?", o:["Energy and enthusiasm","Failure to motivate audience","Confusing structure","Poorly designed slides"], a:0},
  {t:"A nurse manager updates hospital administration on project milestones, KPIs and next steps. Which type of presentation is this?", o:["Pitch/Sales","Persuasive","Progress/Status Report","Demonstrative"], a:2},
  {t:"A nurse educator shows students how to perform a procedure using a live demonstration. Which type of presentation is this?", o:["Persuasive","Progress/Status Report","Pitch/Sales","Demonstrative"], a:3},
  {t:"A presentation is a structured-prepared and speech-based means of communicating information or ideas to a group of interested people.", o:["True","False"], a:0},
  {t:"The only purpose of a presentation is to inform; it is never used to persuade.", o:["True","False"], a:1},
  {t:"Presentations are more likely to intimidate workers than other forms of communication.", o:["True","False"], a:0},
  {t:"A persuasive presentation often uses logical arguments and emotional appeals.", o:["True","False"], a:0},
  {t:"A Pitch/Sales presentation is designed to be long and highly detailed.", o:["True","False"], a:1},
  {t:"A keynote is a featured speech at a conference or event.", o:["True","False"], a:0},
  {t:"A Team/Collaborative presentation is delivered by one person only.", o:["True","False"], a:1},
  {t:"Step 6 (practice and delivering the presentation) is part of \"Planning your presentation\".", o:["True","False"], a:1},
  {t:"\"Don't read your presentation\" is one of the techniques for effective presentation.", o:["True","False"], a:0},

  {t:"A presenter should not assume that information will speak by itself.", o:["True","False"], a:0},
  {t:"A presentation should end without an overall summary or a proposed action.", o:["True","False"], a:1},
  {t:"Presentation style and confidence are less important than the content of the presentation.", o:["True","False"], a:1},
  {t:"The presenter should try to engage the audience in the first 2-3 minutes.", o:["True","False"], a:0},
  {t:"Excessive details and poorly designed slides are common causes of ineffective presentation.", o:["True","False"], a:0}
];


/* ============ ENGINE ============ */
let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=35*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shuffleOptions(q){
  if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return{...q};
  const idx=shuffle(q.o.map((_,k)=>k));
  return{...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};
}
function init(pool){
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' سؤال';
  startTimer();render();
}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const b=document.getElementById('timerBadge');
    if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish()}
  },1000);
}
function updateTop(){
  const total=questions.length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[
 {icon:'💬',l:['#0891b2','8,145,178','#155e75','#0891b2','#6d28d9'],d:['#22d3ee','34,211,238']},
 {icon:'👂',l:['#7c3aed','124,58,237','#5b21b6','#7c3aed','#db2777'],d:['#a78bfa','167,139,250']},
 {icon:'🤝',l:['#ea580c','234,88,12','#9a3412','#ea580c','#db2777'],d:['#fb923c','251,146,60']},
 {icon:'🗣️',l:['#059669','5,150,105','#065f46','#059669','#0e7490'],d:['#34d399','52,211,153']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style;
  const main=dark?s.d[0]:s.l[0],rgb=dark?s.d[1]:s.l[1];
  r.setProperty('--accent',main);r.setProperty('--accent-rgb',rgb);
  r.setProperty('--grad',`linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()">⏭ تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=document.getElementById('opt'+idx);
    el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`:`<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){const exp=document.createElement('div');exp.className='explanation';exp.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(exp)}
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'← السؤال التالي':'🏁 إنهاء الامتحان'}</button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop()}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length,score=Math.round((correct/total)*100);
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]})});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gc;
  if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}
  else if(score>=75){grade='🥈 جيد جداً';gc='var(--c2)'}
  else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}
  else{grade='📚 راجع تاني';gc='var(--danger)'}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const reportHTML=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`
      <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0?q.o[answers[idx]]:'تم التخطي'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`;
  }).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div></div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${Math.max(0,total-answered)}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()">↻ إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)">🔀 امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home">🏠 رجوع للمادة</a>
    </div>
    <div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${reportHTML}</div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme='light';try{theme=localStorage.getItem('theme')||'light'}catch(e){}
function applyTheme(t){
  theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t)}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
