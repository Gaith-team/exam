<nav><a class="nav-back" href="https://gaith-team.github.io/exam/">رجوع</a><div class="brand"><div class="logo">GT</div><span>GHAITH TEAM</span></div><span></span></nav>
<div class="hero"><h1>Self-Concept</h1><p>Communication Skills – Pages 43 to 47</p></div>
<main id="m"></main>
<footer>GHAITH <b>TEAM</b> – <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>
<script>
const D=[
['h','Definition of self-concept','p.43'],
['Self-concept is a collection of beliefs about oneself.','مفهوم الذات هو مجموعة الأفكار والمعتقدات اللي الواحد بيآمن بيها عن نفسه.','لو سألت نفسك أنا شاطر ولا ضعيف؟ وأنا إنسان صبور ولا عصبي؟ الإجابات اللي في دماغك دي هي معتقداتك عن نفسك.'],
['Generally, self-concept embodies the answer to the question "Who am I?".','بشكل عام، مفهوم الذات هو إجابة السؤال "أنا مين؟".','لما حد يقولك عرّف نفسك وتقول أنا طالب تمريض، بحب أساعد الناس، وهادي، فده مفهوم الذات بتاعك.'],
['It is the image or the idea we have about ourselves.','هو الصورة أو الفكرة اللي عندنا في دماغنا عن نفسنا.','زي ما تبص في المراية وتكوّن صورة عن نفسك، كده كمان بتكوّن صورة جواك عن شخصيتك.'],
['It can be thought of as our perception of our abilities, behaviors and characteristics','ممكن نعتبره نظرتنا لقدراتنا وتصرفاتنا وصفاتنا.','يعني نظرتك لنفسك: أنا قدراتي كويسة في المذاكرة، وتصرفاتي مع الناس محترمة، وصفاتي إني منظم.'],
['Self-concept is our personal knowledge of who we are, encompassing all of our thoughts and feelings about ourselves physically, personally, emotionally and socially.','مفهوم الذات هو معرفتنا الشخصية بإحنا مين، وبيشمل كل أفكارنا ومشاعرنا عن نفسنا من ناحية الجسم والشخصية والعاطفة والاجتماع.','يعني أفكارك ومشاعرك عن شكلك (جسمك)، وطباعك (شخصيتك)، وإحساسك (عاطفتك)، وعلاقاتك بالناس (اجتماعيًا) كلها جزء من مفهوم الذات.'],
['Self-concept also includes our knowledge of how we behave, our capabilities, and our individual characteristics.','مفهوم الذات كمان بيشمل معرفتنا بإحنا بنتصرف إزاي، وإيه قدراتنا، وإيه الصفات المميزة لكل واحد فينا.','يعني تعرف إنك لما تتضايق بتسكت، وإنك قادر تذاكر 5 ساعات، وإن صفتك المميزة الصبر.'],
['It’s shaped and influenced by our knowledge and interactions with our immediate environment','مفهوم الذات بيتكوّن ويتأثر بمعرفتنا واحتكاكنا بالبيئة القريبة مننا.','يعني البيت والأصحاب والكلية هما اللي بيشكّلوا نظرتك لنفسك، زي ما تسمع كل يوم إنك شاطر فتصدّق ده عن نفسك.'],
['h','Key Components of Self-Concept','p.44'],
['Self-concept is made up of several interconnected aspects:','مفهوم الذات متكوّن من أكتر من جانب مترابطين ببعض.','زي الجسم، كل أجزاءه بتشتغل مع بعض، كده كمان جوانب مفهوم الذات بتأثر في بعضها.'],
['Personal Characteristics: Beliefs about your personality traits, values, references, and how you interact with the world.','الصفات الشخصية: اعتقاداتك عن صفات شخصيتك وقيمك وتفضيلاتك وطريقة تعاملك مع العالم.','يعني تعتقد إنك اجتماعي، وقيمتك الأمانة، وبتتعامل مع الناس بهدوء.'],
['Social Roles: Your understanding of your identity in various relationships and social groups, such as being a parent, friend, or member of a specific community.','الأدوار الاجتماعية: فهمك لهويتك جوه العلاقات والجماعات المختلفة، زي إنك أب أو صديق أو عضو في مجتمع معين.','يعني إنت في البيت ابن، وفي الكلية طالب تمريض، ومع صحابك صديق، وكل دور له صورة عندك عن نفسك.'],
['Skills and Abilities: Your perceived capabilities, including physical and mental talents, and your self-assessment of competence.','المهارات والقدرات: قدراتك اللي إنت شايفها في نفسك، سواء جسمانية أو عقلية، وتقييمك لنفسك إنك كفء.','يعني تشوف نفسك شاطر في أخذ العينات (مهارة عملية) وبتفهم بسرعة (قدرة عقلية)، وتقيّم نفسك إنك كويس في الشغل ده.'],
['Physical Appearance: How you see your body and physical self.','المظهر الجسمي: إزاي بتشوف جسمك وشكلك.','يعني تشوف نفسك طويل أو قصير، وشكلك مناسب أو لأ.'],
['Self Concept diagram (Social, Values, Beliefs, Abilities, Goals)','رسمة مفهوم الذات حوالين المركز فيها خمس حاجات: الاجتماعي (Social)، القيم (Values)، المعتقدات (Beliefs)، القدرات (Abilities)، الأهداف (Goals).','يعني نظرتك لنفسك متبنية على علاقاتك وقيمك واعتقاداتك وقدراتك وأهدافك مع بعض.'],
['h','Importance of self-concept','p.44'],
['A person\'s self-concept affects his way of relating with others.','مفهوم الذات بيأثر على طريقة تعامل الشخص مع الناس.','اللي شايف نفسه محترم بيتعامل مع الناس بثقة، واللي شايف نفسه قليل بيتحرج منهم.'],
['A strong self-concept is necessary for healthy and satisfying interactions.','مفهوم الذات القوي ضروري عشان العلاقات تبقى سليمة ومريحة.','الممرض اللي واثق في نفسه بيتكلم مع المريض ومع الدكتور براحة وعلاقته بيهم كويسة.'],
['A weak self-concept, often distorts the individual\'s perceptions of how others see him, generating feeling of insecurity in relating to other people.','مفهوم الذات الضعيف غالبًا بيشوّه نظرة الشخص لإزاي الناس شايفينه، وده بيجيب إحساس بعدم الأمان وهو بيتعامل مع الناس.','يعني واحد شايف نفسه فاشل، لو زميله بص له مرة يقول أكيد بيستهزأ بيا، مع إن الزميل ماقصدش حاجة، فيحس بالخوف من الناس.'],
['h','Factors the affects the self-concept','p.45'],
['Relations in the family','العلاقات جوه الأسرة.','الطفل اللي أهله دايمًا بيشجعوه بيكوّن صورة كويسة عن نفسه.'],
['Peers','الأقران (الأصحاب في نفس السن).','لو أصحابك بيحترموك وبيقدروك، بتحس إنك قيمة.'],
['Intelligence and abilities','الذكاء والقدرات.','اللي بينجح ويتفوق في المذاكرة بيشوف نفسه ذكي وقدير.'],
['Socio-economic status','المستوى الاجتماعي والاقتصادي.','الوضع المادي والاجتماعي للأسرة ممكن يأثر على نظرة الشخص لنفسه.'],
['Names and nick-names','الأسامي وأسامي الدلع أو التنمّر.','لو اتنادى عليك بلقب بيضايقك طول الوقت، ممكن ده يأثر على صورتك عن نفسك.'],
['Appearance','المظهر والشكل.','نظرة الناس لشكلك ونظرتك إنت له بتأثر في ثقتك بنفسك.'],
['h','Carl Rogers’ components of self-concept','p.45'],
['Carl Rogers, one of the founders of humanistic psychology, suggested that self-concept includes three components:','كارل روجرز، واحد من مؤسسي علم النفس الإنساني، قال إن مفهوم الذات فيه تلات مكونات.','افتكرهم كده: صورتك عن نفسك، وقيمتك عند نفسك، والنسخة اللي نفسك تبقاها.'],
['The Three Components of "Self-Concept" (Self-image, Ideal self, Self-esteem) – Embodies the answer to the question "Who am I?"','الرسمة بتوضح المكونات التلاتة: Self-image وIdeal self وSelf-esteem، وكلهم بيجاوبوا على سؤال "أنا مين؟".','يعني مفهوم الذات مش حاجة واحدة، هو مجموع التلاتة دول.'],
['Self-Image: Your mental picture of yourself, including your physical appearance, traits, and abilities.','صورة الذات: الصورة اللي في دماغك عن نفسك، وفيها شكلك وصفاتك وقدراتك.','زي ما تقول أنا طويل، وهادي، وشاطر في الإنجليزي.'],
['Self-worth (Self-Esteem): It is the value we place upon ourselves. Individual levels of self-esteem are dependent on the way we evaluate ourselves.','قيمة الذات (تقدير الذات): هي القيمة اللي إحنا بنحطها لنفسنا. ومستوى تقدير الذات عند كل واحد بيعتمد على طريقة تقييمه لنفسه.','اللي بيقيّم نفسه كويس (أنا محترم ومفيد) تقديره لنفسه بيبقى عالي، واللي بيقيم نفسه وحش بيبقى تقديره واطي.'],
['h','Ideal Self','p.46'],
['Ideal Self: It is the self we would like to be.','الذات المثالية: هي الشخص اللي نفسنا نبقى زيه.','زي ما تحلم تبقى ممرض ماهر وهادي ومحبوب من الكل.'],
['There’s often a difference between one’s self-image and one\'s ideal self.','غالبًا بيبقى فيه فرق بين صورتك الحالية عن نفسك والشخص المثالي اللي نفسك تبقاه.','تشوف نفسك دلوقتي متوتر، ونفسك تبقى هادي وواثق، فالفرق بين الاتنين هو ده.'],
['This incongruity can negatively impact one’s self-esteem.','الفرق ده (عدم التطابق) ممكن يأثر بالسلب على تقدير الذات.','لو الفرق كبير، تحس إنك أقل من اللي المفروض تبقاه فتقل قيمتك عند نفسك.'],
['According to Carl Rogers, self-image and ideal self can be congruent or incongruent.','حسب كارل روجرز، صورة الذات والذات المثالية ممكن يبقوا متطابقين (Congruent) أو غير متطابقين (Incongruent).','يعني إما الصورتين قريبين من بعض، أو بعيدين عن بعض.'],
['Carl Roger\'s Self Concept diagram (Self Image, Self Esteem, Ideal Self)','رسمة مفهوم الذات عند كارل روجرز: Self Image وSelf Esteem وIdeal Self في دايرة مترابطة.','يعني التلاتة بيأثروا في بعض، وبيتحركوا في دايرة مش منفصلين.'],
['Congruence between the self-image and ideal self means that there is a fair amount of overlap between the two. Greater congruence will enable self-actualization.','التطابق بين صورة الذات والذات المثالية معناه إن فيه تداخل كبير بينهم. وكل ما التطابق زاد، ده بيساعد على تحقيق الذات.','يعني اللي شايف نفسه مجتهد ونفسه يبقى مجتهد، فهو قريب من اللي عايزه، فبيوصل لأحسن نسخة منه (تحقيق الذات).'],
['Incongruence between the self-image and ideal self means there’s a discrepancy between one’s self and one’s experiences, leading to internal confusion (or cognitive dissonance) that prevents self-actualization.','عدم التطابق معناه إن فيه فرق بين ذات الشخص وخبراته، وده بيسبب ارتباك جواه (أو تنافر معرفي) بيمنع تحقيق الذات.','زي واحد شايف نفسه ماهر، وتجاربه الفعلية بتقول إنه بيغلط، فيحس بتشتت وحيرة وبيتعطل عن التقدم.'],
['h','Development of self-concept','p.46'],
['Infancy: You begin to differentiate yourself from others and develop a basic sense of self.','الرضاعة (الطفولة المبكرة): بتبدأ تفرّق بين نفسك وبين غيرك، وبيتكوّن عندك إحساس بسيط بالذات.','الرضيع بيعرف إن إيده دي بتاعته، وإن ماما شخص تاني غيره.'],
['Childhood: Your self-concept becomes more descriptive, focusing on physical traits and capabilities. You also start to understand your role in social groups and make social comparisons.','الطفولة: مفهوم الذات بيبقى أكتر وصفًا، وبيركّز على الصفات الجسمية والقدرات. وكمان بتبدأ تفهم دورك في الجماعات وتقارن نفسك بغيرك.','الطفل يقول أنا بجري سريع وأطول من صاحبي، وبيعرف إنه تلميذ في الفصل.'],
['Adulthood: As you age, your self-concept becomes more detailed, organized, and stable, though it can still be adjusted and refined over time.','سن البلوغ (الكبار): كل ما تكبر، مفهوم الذات بيبقى أكتر تفصيل وتنظيم وثبات، لكن لسه ممكن يتعدل ويتحسن مع الوقت.','الشخص الكبير بيبقى عارف نفسه كويس، لكن ممكن يغير جزء من صورته عن نفسه لو اتعلم أو مر بخبرة جديدة.'],
['h','Ways to develop a healthy self-concept','p.47'],
['Practice Self-Awareness: Understand your thoughts, emotions, strengths, and weaknesses without judgment.','مارس الوعي بالذات: افهم أفكارك ومشاعرك ونقاط قوتك وضعفك من غير ما تحكم على نفسك.','تلاحظ إنك بتتوتر في الامتحان وتقول ده شعور طبيعي، من غير ما تقول أنا فاشل.'],
['Cultivate a Growth Mindset: Embrace challenges as opportunities for growth, fostering resilience and self-confidence.','نمّي عقلية النمو: اعتبر التحديات فرص للتطور، وده بيقوّي المرونة والثقة بالنفس.','لو فشلت في اختبار عملي، قول هتعلم من غلطي وأحسّن مش أنا مبعرفش.'],
['Challenge Negative Thoughts: Identify and reframe negative beliefs about yourself into more positive and helpful perspectives.','اتحدى الأفكار السلبية: حدد المعتقدات السلبية عن نفسك وحوّلها لنظرة أكتر إيجابية وفايدة.','بدل ما تقول أنا مش هعرف أفهم المادة دي، قول أنا محتاج وقت أكتر وهفهمها.'],
['Set Realistic Goals: Align your goals with your perceived desires and strengths to build a stronger sense of self-worth.','حط أهداف واقعية: خلي أهدافك متوافقة مع رغباتك ونقاط قوتك عشان تبني إحساس أقوى بقيمتك.','بدل ما تقول هذاكر الكتاب كله في يوم، قول هذاكر محاضرة كل يوم، وتنجز، فتحس بقيمتك.'],
['Engage in New Experiences: Seek out novel experiences and interactions to broaden your understanding of yourself and the world.','جرّب تجارب جديدة: دوّر على خبرات وتعاملات جديدة عشان تفهم نفسك والعالم أكتر.','تشارك في نشاط طلابي أو تتطوع، فتكتشف قدرات جديدة في نفسك.'],
['Build Supportive Relationships: Seek relationships with people who offer unconditional positive regard and acceptance, helping to foster a positive self-concept.','كوّن علاقات داعمة: دوّر على ناس بيقدموا لك احترام وقبول من غير شروط، وده بيساعد على بناء مفهوم ذات إيجابي.','صاحب بيقبلك زي ما إنت ويشجعك حتى لو غلطت، بيخليك تحس إنك كويس.'],
['Embrace Your Uniqueness: Acknowledge and embrace both your strengths and weaknesses, rather than striving for an unrealistic ideal.','تقبّل تفرّدك: اعترف بنقاط قوتك وضعفك وتقبلهم، بدل ما تجري ورا مثال مستحيل.','تقول أنا قوي في العملي وضعيف شوية في الحفظ، وده عادي، بدل ما تقارن نفسك بشخص مثالي.'],
['Practice Self-Compassion: Be kind and understanding toward yourself, just as you would be to a good friend.','مارس الرحمة بالنفس: كون لطيف ومتفهم مع نفسك زي ما بتعمل مع صاحبك المقرب.','لو صاحبك غلط هتقوله ولا يهمك، فقول لنفسك نفس الكلام لما إنت تغلط.'],
['Seek Professional Help: Psychotherapy can provide a safe environment to explore your self-perception, understand how your thoughts influence your behavior, and develop new skills to improve your self-concept','اطلب مساعدة متخصص: العلاج النفسي بيوفر مكان آمن تستكشف فيه نظرتك لنفسك، وتفهم أفكارك بتأثر في تصرفاتك إزاي، وتتعلم مهارات جديدة تحسّن مفهوم الذات.','لو نظرتك السلبية لنفسك مستمرة ومأثرة في حياتك، تروح لأخصائي نفسي يساعدك خطوة بخطوة.']
];
const m=document.getElementById('m');
D.forEach(r=>{
 if(r[0]==='h'){const h=document.createElement('h2');h.innerHTML='<span></span><small></small>';h.firstChild.textContent=r[1];h.lastChild.textContent=r[2];m.appendChild(h);return;}
 const d=document.createElement('div');d.className='item';
 d.innerHTML='<div class="en"></div><div class="ar"><b>الشرح :</b> <span></span></div><div class="ex"><b>عشان تفهمها :</b> <span></span></div>';
 d.children[0].textContent=r[0];d.children[1].lastChild.textContent=r[1];d.children[2].lastChild.textContent=r[2];
 m.appendChild(d);
});
</script>
