.rs{background:var(--bg2);border-radius:16px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}

footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

<script>
const QUESTIONS = [

{t:"Active listening skills are especially critical for:",o:["Reducing patient visits","Ending the relationship early","Obtaining important medical information","Avoiding documentation"],a:2},
{t:"When patients receive care, they look for more than treatment of their disease; they also want:",o:["Psychological consideration","Shorter visits","Free medication","Frequent discharge"],a:0},
{t:"Self-awareness allows the nurse to:",o:["Avoid the patient's emotions","Know when to provide help and when to stand back","Make decisions without the patient","Reduce communication"],a:1},
{t:"Maintaining patient privacy is essential to develop:",o:["Hospital income","Nurse's authority","Documentation skills","Trust and open lines of communication"],a:3},
{t:"Involving the patient's family is highly beneficial because the family may be:",o:["A source of conflict","A barrier to care","The most effective support system","Responsible for the care plan"],a:2},
{t:"When building a strong relationship, the nurse should greet the patient by name, make eye contact, and:",o:["Explain what she will be doing and review the care plan, involving the patient in decision making","Make decisions for the patient without discussion","Avoid explaining procedures to save time","Keep conversations as short as possible"],a:0},

/* ============ ENGINE ============ */
let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=35*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function shuffleOptions(q){
  if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return{...q};
  const idx=shuffle(q.o.map((_,k)=>k));
  return{...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};
}
function init(pool){
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' سؤال';
  startTimer();render();
}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const b=document.getElementById('timerBadge');
    if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish()}
  },1000);
}
function updateTop(){
  const total=questions.length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[

 {icon:'👂',l:['#7c3aed','124,58,237','#5b21b6','#7c3aed','#db2777'],d:['#a78bfa','167,139,250']},
 {icon:'🤝',l:['#ea580c','234,88,12','#9a3412','#ea580c','#db2777'],d:['#fb923c','251,146,60']},
 {icon:'🗣️',l:['#059669','5,150,105','#065f46','#059669','#0e7490'],d:['#34d399','52,211,153']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style;
  const main=dark?s.d[0]:s.l[0],rgb=dark?s.d[1]:s.l[1];
  r.setProperty('--accent',main);r.setProperty('--accent-rgb',rgb);
  r.setProperty('--grad',`linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()">⏭ تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=document.getElementById('opt'+idx);
    el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`:`<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){const exp=document.createElement('div');exp.className='explanation';exp.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(exp)}
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'← السؤال التالي':'🏁 إنهاء الامتحان'}</button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop()}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length,score=Math.round((correct/total)*100);
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]})});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gc;
  if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}
  else if(score>=75){grade='🥈 جيد جداً';gc='var(--c2)'}
  else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}
  else{grade='📚 راجع تاني';gc='var(--danger)'}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const reportHTML=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`
      <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0?q.o[answers[idx]]:'تم التخطي'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`;
  }).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div></div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${Math.max(0,total-answered)}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()">↻ إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)">🔀 امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home">🏠 رجوع للمادة</a>
    </div>
    <div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${reportHTML}</div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme='light';try{theme=localStorage.getItem('theme')||'light'}catch(e){}
function applyTheme(t){
  theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t)}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
