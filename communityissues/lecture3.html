<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Palette: deep harbor teal (people/society) · saffron (awareness) · rose (alert) · sea blue (education) */
:root {
  --accent:#0f6b73; --accent-light:#4fb3bb; --accent-dark:#083a40; --accent-glow:rgba(15,107,115,0.2); --accent-rgb:15,107,115;
  --c2:#0f9d7a; --c3:#e0a100; --c4:#2a74c9;
  --grad:linear-gradient(160deg,#083a40 0%,#0f6b73 55%,#1b8f8a 100%);
  --grad-soft:linear-gradient(135deg,#0f6b73,#1b8f8a);
  --bg:#f1f6f6; --bg2:#e1ecec; --card:#ffffff; --text:#10282b; --text2:#3f5c60; --text3:#789094;
  --bc:rgba(15,70,75,0.12); --success:#0f9d7a; --danger:#d6336c; --warn:#e0a100; --r:14px;
  --tr:all 0.25s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:#071a1d; --bg2:#0d2a2e; --card:#10353a; --text:#e8f4f4; --text2:#b2cfd1; --text3:#7ba1a4;
  --bc:rgba(255,255,255,0.10); --accent:#4fb3bb; --accent-light:#8fd3d8; --accent-dark:#2a8a93;
  --accent-glow:rgba(79,179,187,0.2); --accent-rgb:79,179,187; --c2:#3fd1a8; --c3:#ffc933; --c4:#6aa8f0;
  --success:#3fd1a8; --danger:#ff6b9a;
}
body { font-family:'Tajawal',sans-serif; background:var(--bg); background-image:radial-gradient(var(--bc) 1.2px,transparent 1.2px); background-size:22px 22px; background-attachment:fixed; color:var(--text); min-height:100vh; overflow-x:hidden; transition:background-color .4s,color .4s; }
#prog-bar { position:fixed; top:0; right:0; height:4px; z-index:999; background:linear-gradient(270deg,var(--accent),var(--c3)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:62px; background:rgba(241,246,246,.94); backdrop-filter:blur(14px); border-bottom:1px solid var(--bc); }
[data-theme="dark"] nav { background:rgba(7,26,29,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:14px; font-weight:700; padding:7px 14px; border-radius:999px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--accent); border-color:var(--accent); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; color:var(--text); letter-spacing:.3px; direction:ltr; }
.nav-logo-icon { width:34px; height:34px; border-radius:50%; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:800; box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--c3); }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); }
.hero-band { margin-top:62px; background:var(--grad); padding:40px 24px 64px; text-align:center; position:relative; overflow:hidden; transition:background .5s; }
.hero-band > * { position:relative; }
.rings { position:absolute !important; inset:0; width:100%; height:100%; opacity:.35; pointer-events:none; }
.rings circle { fill:none; stroke:#fff; stroke-width:1.5; }
.rings .gold { stroke:#ffc933; stroke-width:2; }
.hero-band::after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:26px; background:var(--bg); border-radius:26px 26px 0 0; }
.hero-band-icon { width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:2px solid #ffc933; }
.hero-band h1 { font-size:clamp(24px,5vw,34px); font-weight:800; color:#fff; margin-bottom:4px; }
.hero-band p { font-size:14px; color:rgba(255,255,255,.88); font-weight:500; }
.hero-band-meta { display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:6px 15px; font-size:13px; font-weight:700; color:#fff; display:flex; align-items:center; gap:7px; }
.shell { max-width:560px; margin:0 auto; padding:14px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; border-top:4px solid var(--bc); }
.stat-box:nth-child(1) { border-top-color:var(--success); }
.stat-box:nth-child(2) { border-top-color:var(--danger); }
.stat-box:nth-child(3) { border-top-color:var(--c3); }
.stat-box .val { font-size:22px; font-weight:800; }
.stat-box .lbl { font-size:12px; color:var(--text3); margin-top:2px; font-weight:500; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c3); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:14px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:10px; background:var(--bg2); border-radius:10px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(270deg,var(--accent),var(--c3)); border-radius:10px; transition:width .4s; }
.timer-badge { min-width:68px; height:36px; border-radius:999px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; font-variant-numeric:tabular-nums; direction:ltr; }
.timer-badge.warn { color:var(--warn); border-color:rgba(224,161,0,.4); background:rgba(224,161,0,.1); }
.timer-badge.danger { color:var(--danger); border-color:rgba(214,51,108,.35); background:rgba(214,51,108,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:22px; overflow:hidden; box-shadow:0 10px 30px rgba(8,58,64,.10); }
.q-header { background:var(--grad); padding:8px 20px; display:flex; align-items:center; gap:8px; transition:background .5s; }
.q-num { background:rgba(255,255,255,.2); border-radius:999px; padding:3px 12px; font-size:12px; font-weight:700; color:#fff; }
.q-text { padding:24px 20px 16px; font-size:17px; font-weight:700; color:var(--text); line-height:1.8; border-bottom:1px dashed var(--bc); text-align:right; direction:rtl; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:12px; background:#fff; }
.options { padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:16px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:15px; font-weight:500; line-height:1.7; color:var(--text); transition:var(--tr); user-select:none; direction:rtl; text-align:right; }
.opt:hover:not(.disabled) { border-color:var(--accent); background:rgba(var(--accent-rgb),.08); transform:translateX(-3px); }
.opt-letter { width:30px; height:30px; border-radius:50%; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:800; color:var(--text3); transition:var(--tr); direction:ltr; }
.opt:nth-child(1) .opt-letter { background:rgba(15,107,115,.12); color:#0f6b73; border-color:rgba(15,107,115,.35); }
.opt:nth-child(2) .opt-letter { background:rgba(224,161,0,.15); color:#a87800; border-color:rgba(224,161,0,.45); }
.opt:nth-child(3) .opt-letter { background:rgba(214,51,108,.11); color:#d6336c; border-color:rgba(214,51,108,.35); }
.opt:nth-child(4) .opt-letter { background:rgba(42,116,201,.12); color:#2a74c9; border-color:rgba(42,116,201,.35); }
[data-theme="dark"] .opt:nth-child(1) .opt-letter { color:#8fd3d8; } [data-theme="dark"] .opt:nth-child(2) .opt-letter { color:#ffc933; }
[data-theme="dark"] .opt:nth-child(3) .opt-letter { color:#ff8fb3; } [data-theme="dark"] .opt:nth-child(4) .opt-letter { color:#8fbdf5; }
.opt.correct { border-color:var(--success); background:rgba(15,157,122,.12); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(214,51,108,.08); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:14px; display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(15,157,122,.12); color:var(--success); border:1px solid rgba(15,157,122,.3); }
.feedback-bar.no { background:rgba(214,51,108,.09); color:var(--danger); border:1px solid rgba(214,51,108,.25); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(224,161,0,.10); border-radius:12px; border-right:4px solid var(--c3); font-size:14px; color:var(--text2); line-height:1.8; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:999px; font-size:15px; font-weight:800; cursor:pointer; font-family:'Tajawal',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:8px; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline:3px solid var(--c3); outline-offset:2px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(15,107,115,.3); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(15,107,115,.4); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 20px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:22px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 10px 30px rgba(8,58,64,.10); border-top:6px solid var(--c3); }
.score-ring { width:112px; height:112px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:800; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:24px; font-weight:800; margin-bottom:6px; }
.result-sub { font-size:15px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:14px; padding:12px 8px; text-align:center; }
.rs .n { font-size:22px; font-weight:800; } .rs .l { font-size:12px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:5px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:14px; font-weight:700; margin-bottom:8px; direction:rtl; text-align:right; line-height:1.7; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:13px; margin-top:6px; color:var(--text2); direction:rtl; text-align:right; line-height:1.7; }
.ri-badge { padding:2px 10px; border-radius:999px; font-weight:700; font-size:12px; flex-shrink:0; }
.ri-yours { background:rgba(214,51,108,.12); color:var(--danger); } .ri-right { background:rgba(15,157,122,.12); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#e0a100,#0f6b73); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(15,107,115,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--accent); color:var(--accent); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; direction:ltr; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:13px; font-weight:600; direction:ltr; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:10px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 56px;} .q-text{font-size:16px;} }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>

<script>
const QUESTIONS = [
{t:"يعد العنف الأسري مشكلة:",o:["محلية تخص دولة واحدة","عالمية تحدث في جميع المجتمعات","خاصة بالدول الفقيرة","خاصة بالنساء فقط"],a:1},
{t:"أكثر أفراد الأسرة تعرضًا للعنف غالبًا هي:",o:["الرجل","كبار السن","المرأة","الأطفال"],a:2},
{t:"تتعرض المرأة غالبًا للعنف بسبب:",o:["عادات اجتماعية تعطي الرجل سلطة أكبر داخل الأسرة","ضعف بنيتها الجسدية","عملها خارج المنزل","قلة عدد النساء"],a:0},
{t:"من أسباب زيادة العنف الأسري خلال جائحة كورونا:",o:["زيادة الدخل الأسري","انخفاض معدلات الزواج","قلة التواصل مع الأقارب","الضغوط الاقتصادية والبقاء لفترات طويلة داخل المنزل والتوتر والقلق"],a:3},
{t:"يشمل العنف الأسري:",o:["الإساءة النفسية والانتهاك المالي أو الاقتصادي والإساءة الجسدية","الإساءة الجسدية فقط","الإساءة اللفظية والجنسية فقط","الانتهاك السياسي فقط"],a:0},
{t:"التهديد بإيذاء جسدي للذات أو الشريك أو الأطفال، وتدمير الممتلكات، والإجبار على الانعزال عن الأصدقاء والعائلة يُعد:",o:["إساءة جسدية","إساءة نفسية","انتهاكًا ماليًا","حرمانًا صحيًا"],a:1},
{t:"محاولة جعل شخص معتمدًا ماليًا عليك بالسيطرة الكاملة على الموارد المالية ومنع العمل تُعد:",o:["الانتهاك المالي أو الاقتصادي","الإساءة النفسية","الإساءة الجسدية","العنف اللفظي"],a:0},
{t:"الضرب أو الركل أو الحرق أو الدفع أو الصفع أو الحرمان من الرعاية الطبية تُعد:",o:["إساءة نفسية","انتهاكًا ماليًا","إساءة جسدية","إهمالًا اجتماعيًا"],a:2},
{t:"يقصد بالعنف ضد المرأة كل سلوك موجه إليها يقوم على:",o:["الحوار والإقناع","الشدة والقوة والإكراه","التسامح والمساواة","الاحترام والتقدير"],a:1},
{t:"ينتج العنف ضد المرأة عن:",o:["علاقات القوة غير المتكافئة بين الرجل والمرأة في المجتمع والأسرة","تساوي الحقوق بين الجنسين","ارتفاع مستوى التعليم","الاستقرار الاقتصادي"],a:0},
{t:"المعوقات التي تتمثل في انحياز بعض المؤسسات وتفضيل توظيف الرجال على النساء في مهام معينة هي معوقات:",o:["سياسية","اقتصادية","وظيفية","شخصية"],a:2},
{t:"القهر هو:",o:["حرية الاختيار","المشاركة في القرار","التمكين الاقتصادي","نوع من السيطرة أو الضغط لإجبار الأفراد على سلوك معين أو الخضوع لسلطة ما"],a:3},
{t:"العلاقة بين العنف والقهر أنهما:",o:["متناقضان تمامًا","وجهان لعملة واحدة","لا علاقة بينهما","القهر أخف دائمًا من العنف"],a:1},
{t:"في الحضارات اليونانية والصينية والهندية القديمة كانت المرأة:",o:["مشاركة في الحكم","تدير الممتلكات","محرومة من التعليم ولا يحق لها الميراث ولا تستطيع طلب الطلاق","تتمتع بحق الطلاق"],a:2},

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 40*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerBadge').className = 'timer-badge';
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🤝', l:['#0f6b73','15,107,115','#083a40','#0f6b73','#1b8f8a'], d:['#4fb3bb','79,179,187'] }, /* society / values */
  { icon:'📣', l:['#b57f00','181,127,0','#6b4a00','#b57f00','#0f6b73'], d:['#ffc933','255,201,51'] }, /* awareness / media */
  { icon:'🏘️', l:['#c2255c','194,37,92','#7a1237','#c2255c','#7b3fa0'], d:['#ff8fb3','255,143,179'] }, /* family / community */
  { icon:'🎓', l:['#2a74c9','42,116,201','#12427a','#2a74c9','#0f6b73'], d:['#8fbdf5','143,189,245'] }  /* education / citizenship */
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(160deg,${s.l[2]} 0%,${s.l[3]} 55%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c4)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c3)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
