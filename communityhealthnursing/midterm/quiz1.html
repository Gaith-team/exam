<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0f766e;--teal-d:#134e4a;--blue:#ccfbf1;--bd:#b7ebe2;--ok:#15803d;--no:#b91c1c;--rev:#4f46e5;--txt:#134e4a;--grad:linear-gradient(135deg,#0f766e 0%,#14b8a6 60%,#2dd4bf 100%)}
body{font-family:'Outfit',Arial,sans-serif;background:#f0fdfa;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#0f766e;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#134e4a}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#0f766e;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#b45309}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#ccfbf1}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #134e4a;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#0f766e;background:#ccfbf1;border-top:1px solid #b7ebe2;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.fbtn{padding:5px 13px;border-radius:50px;border:1.5px solid #b7ebe2;background:#fff;font:700 12px 'Outfit',sans-serif;color:#0f766e;cursor:pointer}
.fbtn.on,.fbtn:hover{background:#14b8a6;color:#fff;border-color:#14b8a6}
.tp{margin-left:8px;background:#ccfbf1;color:#0f766e;border-radius:50px;padding:2px 10px;font-size:11px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← Back</a>Community Health Nursing<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div id="filterWrap" class="filters" style="display:none"></div>
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [

  {t:"Which stage of community health nursing development came FIRST?", o:["District nursing", "Public health nursing", "Community health nursing (1970 to present)", "Early home care nursing (before the mid-1800s)"], a:3, d:1},
  {t:"Who laid much of the foundation for modern community health nursing practice?", o:["Louis Pasteur", "Edward Jenner", "Hippocrates", "Florence Nightingale"], a:3, d:1},
  {t:"During the public health nursing stage (1900-1970), the primary unit of care was the:", o:["Individual hospital patient", "School class", "Family", "Industrial worker"], a:2, d:1},
  {t:"Which of the following is an AIM of community health nursing?", o:["Providing curative surgical services only", "Focusing solely on individual acute illness", "Prevention and control of diseases and disabilities", "Replacing the need for health education"], a:2, d:1},
  {t:"Providing regular immunization programs through local health departments is an example of:", o:["Secondary prevention", "Tertiary prevention", "Primary prevention", "Rehabilitation"], a:2, d:1},
  {t:"An epidemic that spreads throughout the world (e.g., H1N1 in 2009) is called a:", o:["Endemic", "Outbreak", "Pandemic", "Zoonosis"], a:2, d:1},
  {t:"Which of the following is a common foodborne disease?", o:["Mumps", "Measles", "Rabies", "Typhoid fever"], a:3, d:1},
  {t:"The incubation period of typhoid fever is:", o:["1-3 days", "1-3 weeks", "3-6 months", "6-12 months"], a:1, d:1},
  {t:"Health education is the science of teaching people the essentials of healthy living so that:", o:["Only medical staff can treat diseases", "Hospital admission rates increase", "Diseases are treated without prevention", "Attitudes and practices become part of their personality and habits"], a:3, d:1},
  {t:"Which of the following is NOT one of the six basic elements of community health practice?", o:["Evaluation", "Research", "Rehabilitation", "Marketing"], a:3, d:2},
  {t:"The 'assurance' function of public health means:", o:["Measuring and monitoring the health status of the community", "Forming a guide for action that determines future decisions", "Translating established policies into services and monitoring their quality and access", "Conducting research on community problems"], a:2, d:2},
  {t:"Which of the following is an example of an AMBULATORY service setting of community health nursing?", o:["Maternal and child health (MCH) centers and family planning centers", "Factory clinics", "Hospice care", "Classrooms"], a:0, d:2},
  {t:"Zoonoses are infectious diseases that:", o:["Spread only from person to person", "Are transmissible under normal conditions from animals to humans", "Are caused only by fungi", "Occur only in hospitals"], a:1, d:2},
  {t:"Which host factors are non-modifiable 'risk attributes'?", o:["Occupation and education", "Diet and smoking", "Exercise and drug abuse", "Age, sex, race and blood group"], a:3, d:2},
  {t:"In the chain of infection, which link directly follows the 'portal of exit'?", o:["Transmission", "Portal of entry", "Reservoir", "Susceptible host"], a:0, d:2},
  {t:"Spread of an infectious agent on toys, school supplies, bedding, or in contaminated food, water or milk is classified as:", o:["Vector spread", "Airborne spread", "Vehicle spread", "Droplet spread"], a:2, d:2},
  {t:"Blood culture is the diagnostic test of choice for typhoid in the ______, while Widal antibodies begin to rise in the ______.", o:["First week; second week", "Second week; first week", "Third week; fourth week", "Fourth week; first week"], a:0, d:2},
  {t:"The three phases of the school health program are:", o:["School curriculum, school sports and school feeding", "School living environment, school health services and health education", "Appraisal, treatment and referral", "Planning, implementation and evaluation"], a:1, d:2},
  {t:"The recommended maximum number of students per classroom is:", o:["10 to 15 students", "50 to 60 students", "30 to 40 students", "70 to 80 students"], a:2, d:2},
  {t:"A student with chickenpox or mumps should be excluded from school for:", o:["7 days", "14 days", "18 days", "21 days"], a:1, d:2},
  {t:"Which of the following are screened yearly by health visitors and teachers in school appraisal?", o:["Height, weight, visual acuity, hearing and speech defects", "Blood pressure and ECG", "Bone density and X-ray of the spine", "Cholesterol and liver function"], a:0, d:2},
  {t:"According to the lecture, the first of the nine events of instruction is to:", o:["Present the material", "Provide feedback", "Assess performance", "Gain the learner's attention"], a:3, d:2},
  {t:"Which of the following is a disadvantage of DIRECT health education?", o:["There is no feedback from the receiver", "The learner cannot participate", "It is expensive and time consuming", "Repetition is not possible"], a:2, d:2},
  {t:"Which of the following is a counseling characteristic that distinguishes it from health education?", o:["It is delivered mainly to large groups", "It is emotionally neutral", "It is content-oriented", "It is usually confidential and individually targeted"], a:3, d:2},
  {t:"Which of the following correctly describes the typhoid MAJOR criteria for a suspected case?", o:["Nonproductive cough, relative bradycardia and rosy spots", "Diarrhea, vomiting and dehydration", "Jaundice, dark urine and hepatomegaly", "Sustained step-ladder fever for more than 2 days, abdominal discomfort and headache"], a:3, d:3},
  {t:"A recovered typhoid patient may be released only after:", o:["One negative stool culture", "Three successive negative stool and urine cultures taken 24 hours apart, the first not earlier than four weeks from onset", "Seven days without fever", "Completing the antibiotic course"], a:1, d:3},
  {t:"Which measure is a SECONDARY prevention measure for communicable diseases?", o:["Provision of safe water supply", "Early case finding by screening, notification and isolation of cases", "Immunization against infectious diseases", "Rehabilitation planning for disabled persons"], a:1, d:3},
  {t:"Which statement about the Egyptian school health examination is correct?", o:["A comprehensive medical examination is done on entry to each new grade of each education stage", "It is done only once at birth", "It is done only for students who are sick", "It is done only at university entry"], a:0, d:3},
  {t:"Motivation in health education is influenced by which three components?", o:["Message, format and environment", "Value, expectancy and affective components", "Cognitive, affective and psychomotor", "Sending, receiving and interpersonal"], a:1, d:3},
  {t:"Globally, violence takes more than 1.5 million lives annually. Which cause accounts for just over 50% of these deaths?", o:["Homicide", "War or conflict", "Suicide", "Child abuse"], a:2, d:3},
  {t:"The goal of PRIMARY prevention of violence is to:", o:["Assess and treat victims and perpetrators", "Rehabilitate victims and perpetrators", "Provide shelter for battered women only", "Stop violence, abuse or neglect before it occurs"], a:3, d:3},
  {t:"In the GATHER framework, the letter 'E' stands for:", o:["Evaluate the outcome", "Encourage the client", "Explain misunderstandings", "Examine the client"], a:2, d:3},
  {t:"In the 6E's counseling model, the stage in which the client chooses one solution from the range of possibilities is:", o:["Election", "Exploration", "Execution", "Engagement"], a:0, d:3},
  {t:"PHC strategy 1 states that services should be accessible within easy reach of:", o:["Ten minutes of walking", "One hour of travel", "One day of travel", "Fifty kilometres"], a:1, d:3},
  {t:"The recommended schedule of antenatal visits is:", o:["Every 4 weeks until 6 months, every 2 weeks through 7-8 months, then every week until birth", "Every week from the first month", "Once every trimester", "Every 2 weeks from the first month until birth"], a:0, d:3},
  {t:"Community health nursing is a synthesis of nursing practice and public health.", o:["True", "False"], a:0, d:1},
  {t:"An infection does not always cause illness.", o:["True", "False"], a:0, d:1},
  {t:"The Widal test is an agglutination test, and a rising titre is diagnostic of typhoid fever.", o:["True", "False"], a:0, d:2},
  {t:"Booster doses of DT are given in the 1st and 4th year of primary school.", o:["True", "False"], a:0, d:2},
  {t:"Counseling is usually confidential, whereas health education is not usually confidential.", o:["True", "False"], a:0, d:2},
  {t:"A typhoid patient can be released after three negative successive stool and urine cultures taken 24 hours apart.", o:["True", "False"], a:0, d:3},
  {t:"Primary health care emphasizes promotive and preventive services more than curative ones.", o:["True", "False"], a:0, d:3},
  {t:"Counter-transference occurs when the counselor transfers his or her own feelings onto the client.", o:["True", "False"], a:0, d:3},
  {t:"A community nurse administers routine childhood vaccines at the local health unit to prevent disease before it occurs. Which level of prevention is this?", o:["Primary prevention", "Secondary prevention", "Tertiary prevention", "Rehabilitation"], a:0, d:1},
  {t:"A mother carefully watches the nurse bathe her newborn, and then bathes the baby herself while the nurse observes. The mother's action is called:", o:["Lecture", "Return demonstration", "Role playing", "Case study"], a:1, d:1},
  {t:"A nurse begins a health education session by showing a short, eye-catching poster to the audience before explaining the objectives. Which event of instruction is she applying?", o:["Gain attention", "Elicit performance", "Assess performance", "Enhance retention"], a:0, d:2},
  {t:"A school canteen worker is being examined before being allowed to handle food. Which test is performed to screen for tuberculosis?", o:["Throat swab", "Skin examination", "Hemoglobin test", "Chest X-ray"], a:3, d:2},
  {t:"During a session, a client who was abused by his father says to the counselor, 'You are just like him; I cannot trust you.' This barrier to counseling is:", o:["Counter-transference", "Prejudice", "Transference", "Language barrier"], a:2, d:3},
  {t:"A counselor asks the client, 'Did you take your medication and why did you stop attending the clinic?' Which questioning error has been made?", o:["Leading question", "Double question", "Rhetorical question", "Open-ended question"], a:1, d:3},
  {t:"A woman with a history of pelvic inflammatory disease asks for contraception. Which method is contraindicated?", o:["Intrauterine device (IUD)", "Condoms", "Progestin-only pill", "Spermicides"], a:0, d:3}

];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').innerHTML = 'Question No. ' + (cur+1) + (q.topic ? ' <span class="tp">'+q.topic+'</span>' : '');
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('All questions answered. Press End Test to finish.')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `You have ${un} unanswered question(s). End the test?` : 'End the test?';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— Not answered —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>Correct</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>Wrong</div>
    <div><b style="color:#777">${unans}</b>Unanswered</div>
    <div><b>${n}</b>Total</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">Retry wrong questions ('+bad.length+')</button>':''}
    <button class="b" onclick="init(getPool())">New random exam</button>
   </div>
   <div class="sec">✔ Correct questions (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">None</div>'}
   <div class="sec bad">✖ Wrong questions (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">Excellent, no mistakes 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

var activeTopic='All';
function getPool(){return activeTopic==='All'?QUESTIONS:QUESTIONS.filter(function(q){return q.topic===activeTopic})}
function buildFilters(){var t=[...new Set(QUESTIONS.map(function(q){return q.topic}).filter(Boolean))],w=$('filterWrap');if(!t.length){w.style.display='none';return}w.style.display='flex';w.innerHTML=['All'].concat(t).map(function(x){return '<button class="fbtn'+(x===activeTopic?' on':'')+'" data-t="'+x.replace(/"/g,'&quot;')+'">'+x+'</button>'}).join('')}
$('filterWrap').onclick=function(e){var b=e.target.closest('.fbtn');if(!b)return;activeTopic=b.dataset.t;buildFilters();init(getPool())};
buildFilters();init(getPool());
</script>
</body>
</html>
