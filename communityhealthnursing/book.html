<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0f766e;--teal-d:#134e4a;--blue:#ccfbf1;--bd:#b7ebe2;--ok:#15803d;--no:#b91c1c;--rev:#4f46e5;--txt:#134e4a;--grad:linear-gradient(135deg,#0f766e 0%,#14b8a6 60%,#2dd4bf 100%)}
body{font-family:'Outfit',Arial,sans-serif;background:#f0fdfa;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#0f766e;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#134e4a}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#0f766e;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#b45309}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#ccfbf1}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #134e4a;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#0f766e;background:#ccfbf1;border-top:1px solid #b7ebe2;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.fbtn{padding:5px 13px;border-radius:50px;border:1.5px solid #b7ebe2;background:#fff;font:700 12px 'Outfit',sans-serif;color:#0f766e;cursor:pointer}
.fbtn.on,.fbtn:hover{background:#14b8a6;color:#fff;border-color:#14b8a6}
.tp{margin-left:8px;background:#ccfbf1;color:#0f766e;border-radius:50px;padding:2px 10px;font-size:11px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← Back</a>Community Health Nursing<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div id="filterWrap" class="filters" style="display:none"></div>
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
/* ===== Page 38 ===== */
{t:"Contagious diseases spread from one person to another or from person to an animal.",o:["True","False"],a:1},
{t:"Zoonosis is an infectious disease that is transmissible under normal conditions from animals to humans.",o:["True","False"],a:1},
{t:"Outbreak: this word used when the epidemic occurs in small, confined area.",o:["True","False"],a:0},
{t:"General factors of body resistance to infection include:",o:["Cough reflex","Leukocytes","Serum factors"],a:0},
{t:"Enterica can be transmitted through infected",o:["Saliva","Skin","Droplet","Utero"],a:0},
{t:"Varicella can be transmitted through infected….",o:["Saliva","Skin","Droplet"],a:2},
{t:"Primary prevention of violence includes:",o:["Reduction of media violence","Parenting reeducation as formal training in child rearing","A safety plan for victims","Social services for individuals or families"],a:0},
{t:"………………………is one of child emotional abuse:",o:["Failure to give positive feedback","Failure to provide shelter","Failure to provide education","Name calling as you're bad"],a:3},
{t:"is a pattern of coercive behaviors perpetrated by a spouse or exspouse:",o:["Intimate partner violence","Workplace violence","Elder abuse","Youth-related violence"],a:0},
{t:"Bullying and physical fighting is a most common form of:",o:["Domestic abuse","Emotional neglect","Youth-related violence","gangs"],a:2},
{t:"Domestic abuse only affects women",o:["True","False"],a:1},
{t:"…………….is an intentional injury inflicted on child",o:["Physical neglect","Emotional neglect","Physical abuse","Emotional abuse"],a:2},
{t:"Early detection and treatment of hepatitis c virus is considered:",o:["Tertiary prevention","Primary prevention","Treatment of disorder","Secondary prevention"],a:3},
{t:"………………..provide services to the public with the family targeted as a primary unite of care.",o:["Community health nursing","District nursing","Public health nursing","Early home care nursing"],a:2},
{t:"…………..has contributed in many ways to shape the practices of community health nursing.",o:["Causal thinking","Economic forces","Changes in education","Advanced technology"],a:3},
{t:"Immunization to prevent the occurrence of the communicable disease is considered:",o:["Tertiary prevention","Primary prevention","Treatment of disorder","Secondary prevention"],a:1},
{t:"It also monitors the quality of and access to services",o:["Holistic practice","Policy development","Assurance","Assessment"],a:2},
{t:"Components of school health program are separate and each effect on the others.",o:["True","False"],a:1},
{t:"School health program provides only curative services to school students.",o:["True","False"],a:1},
{t:"Health status of students is a strong determinant of their school environment.",o:["True","False"],a:0},
{t:"School nurses identify children with German measles and excluding them for:",o:["21 days","18 days","14 days","7 days"],a:3},
{t:"Health appraisal services include",o:["First aid","Referral","Screening and laboratory test","Comprehensive medical treatment"],a:2},
{t:"Preventive services of school health services include",o:["Taking history","Screening tests","Early identification and education of children with special disabilities.","Medication administration and monitoring"],a:2},
{t:"What communication strategy is most effective in multicultural health education?",o:["Ignoring cultural norms to keep messages simple","Using culturally adapted and context-sensitive messages","Translating materials word-for-word only","Focusing solely on written communication"],a:1},
{t:"Health education aims to:",o:["Increase people’s medical costs","Promote healthy behaviors and lifestyles","Replace healthcare professionals","Focus only on disease treatment"],a:1},
{t:"Which of the following is a key element of effective communication?",o:["Noise","Feedback","Misunderstanding","Distraction"],a:1},
{t:"The main goal of communication in health education is to:",o:["Entertain the audience","Persuade individuals to adopt healthy behaviors","Collect health statistics","Replace doctors"],a:1},
{t:"The content is learned best when…………",o:["Presented first","Presented at the end","Presented at middle","None of the above"],a:0},
{t:"Which of the following best defines counseling?",o:["A large-group session used to increase public health knowledge","A face-to-face helping relationship that enables a person to understand himself/herself and solve personal problems","A one-time lecture given to educate the community","A formal written report on a patient's medical history"],a:1},
{t:"Which characteristic distinguishes counseling from health education?",o:["Counseling is emotionally neutral and generalized","Counseling is confidential and focused on the individual client's needs","Counseling is content-oriented and based on public health needs","Counseling is always delivered to large groups"],a:1},
{t:"According to William Cottle, which of the following is NOT one of the five elements of the counseling process?",o:["Rapport","Communication","Confidence","Diagnosis"],a:3},
{t:"In the GATHER counseling framework, what does the letter \"H\" stand for?",o:["Honesty","Help the client make a decision","History taking","Handling objections"],a:1},
{t:"Which of the following is an example of a barrier to effective counseling?",o:["Active listening","Unconditional positive regard","Transference and counter-transference","Confidentiality"],a:3},
/* ===== Page 86 ===== */
{t:"Primary health care is complementary nursing care",o:["True","False"],a:1},
{t:"Primary health care require full participation from individual and families",o:["True","False"],a:0},
{t:"Developing rapport with the community is a strategy of primary health care",o:["True","False"],a:0},
{t:"Service approach consider educating the people regarding the necessity of opting for comprehensive health care",o:["True","False"],a:1},
{t:"PHC Elements include:",o:["Basic lab work","First aid services","Multi sectorial approach","Provision of essential basic household drugs"],a:3},
{t:"The data in the family record include:",o:["Family travels","Family feeding practice.","Referral services","Immunization against major infectious disease"],a:2},
{t:"Principles of PHC delivery include:",o:["Appropriate technology","promotion of food supply","Conduction of minor surgery","provision of essential drug"],a:0}
];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').innerHTML = 'Question No. ' + (cur+1) + (q.topic ? ' <span class="tp">'+q.topic+'</span>' : '');
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('All questions answered. Press End Test to finish.')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `You have ${un} unanswered question(s). End the test?` : 'End the test?';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— Not answered —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>Correct</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>Wrong</div>
    <div><b style="color:#777">${unans}</b>Unanswered</div>
    <div><b>${n}</b>Total</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">Retry wrong questions ('+bad.length+')</button>':''}
    <button class="b" onclick="init(getPool())">New random exam</button>
   </div>
   <div class="sec">✔ Correct questions (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">None</div>'}
   <div class="sec bad">✖ Wrong questions (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">Excellent, no mistakes 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

var activeTopic='All';
function getPool(){return activeTopic==='All'?QUESTIONS:QUESTIONS.filter(function(q){return q.topic===activeTopic})}
function buildFilters(){var t=[...new Set(QUESTIONS.map(function(q){return q.topic}).filter(Boolean))],w=$('filterWrap');if(!t.length){w.style.display='none';return}w.style.display='flex';w.innerHTML=['All'].concat(t).map(function(x){return '<button class="fbtn'+(x===activeTopic?' on':'')+'" data-t="'+x.replace(/"/g,'&quot;')+'">'+x+'</button>'}).join('')}
$('filterWrap').onclick=function(e){var b=e.target.closest('.fbtn');if(!b)return;activeTopic=b.dataset.t;buildFilters();init(getPool())};
buildFilters();init(getPool());
</script>
</body>
</html>
