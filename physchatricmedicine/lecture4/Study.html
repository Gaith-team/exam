<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c3aed;--accent-light:#8b5cf6;--accent-dark:#6d28d9;--glow:rgba(124,58,237,.12);--bg:#f8fafc;--bg2:#eef2f7;--card:#fff;--text:#1a2332;--text2:#4a5568;--text3:#718096;--bc:rgba(0,0,0,.08);--ex:#fff7e6;--exb:#f59e0b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.1);--ex:#2a2314;--exb:#d49b1f}}
:root[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.1);--ex:#2a2314;--exb:#d49b1f}
html{scroll-behavior:smooth}
body{font-family:'Cairo','Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.8}
#bar{position:fixed;top:0;right:0;height:3px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--accent-light));width:0}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:9px;font:900 15px 'Outfit',sans-serif}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin-top:60px;background:linear-gradient(135deg,var(--accent-dark),var(--accent),var(--accent-light));padding:36px 20px 30px;text-align:center;color:#fff}
.hero img{width:200px;max-width:60%;border-radius:16px;border:2px solid rgba(255,255,255,.4);margin-bottom:14px}
.hero h1{font:900 clamp(22px,5vw,32px) 'Outfit',sans-serif}
.hero p{font-size:13px;opacity:.9;direction:ltr;font-family:'Outfit',sans-serif}
.shell{max-width:720px;margin:0 auto;padding:22px 16px 70px}
.toc{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-bottom:22px}
.toc a{font:700 12px 'Outfit',sans-serif;text-decoration:none;color:var(--text2);background:var(--card);border:1px solid var(--bc);border-radius:20px;padding:4px 11px}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
.slide{background:var(--card);border:1px solid var(--bc);border-radius:20px;overflow:hidden;margin-bottom:22px;box-shadow:0 4px 18px rgba(0,0,0,.05);scroll-margin-top:72px}
.sh{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px}
.sn{background:rgba(255,255,255,.22);border-radius:8px;padding:2px 10px;font:700 12px 'Outfit',sans-serif;direction:ltr}
.st{font:700 15px 'Outfit',sans-serif;direction:ltr}
.simg{text-align:center;padding:14px 14px 0}
.simg img{max-width:100%;border-radius:12px;border:1px solid var(--bc)}
.item{padding:16px 18px;border-bottom:1px solid var(--bc)}
.item:last-child{border-bottom:0}
.en{direction:ltr;text-align:left;font:700 15px/1.65 'Outfit',sans-serif;color:var(--text);border-left:4px solid var(--accent);padding-left:12px}
.ar{margin-top:10px;font-size:15px;color:var(--text2)}
.ex{margin-top:10px;background:var(--ex);border-right:4px solid var(--exb);border-radius:10px;padding:9px 13px;font-size:14px;color:var(--text2)}
.ex b{color:var(--exb)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:20px;text-align:center;font:700 14px 'Outfit',sans-serif}
footer span{color:var(--accent)}
</style>
</head>

{t:'Neurosis vs Psychosis',items:[
["Severity — Neurosis: usually mild psychiatric disorder with mild impairment (except in severe cases); patients come by themselves seeking psychiatric advice.",
"العُصاب غالباً اضطراب نفسي خفيف وتأثيره على حياة المريض بسيط (إلا في الحالات الشديدة)، والمريض هو اللي بيروح للدكتور بنفسه عشان عايز يتعالج.",
"واحدة متوترة قبل الامتحانات ومش قادرة تركز، بس لسه بتذاكر وبتروح كليتها، وهي اللي حجزت عند الدكتور."],
["Severity — Psychosis: severe mental illness usually affects thinking, behavior, speech, judgment; the patients come by their family seeking treatment; social and functional impairment.",
"الذهان مرض عقلي شديد بيأثر على التفكير والسلوك والكلام والحكم على الأمور، والمريض عادةً أهله هما اللي بيجيبوه للعلاج، وحياته الاجتماعية والشغلية بتبوظ.",
"شاب بيتكلم كلام مش مترابط وبيتصرف بغرابة وساب شغله، وأهله جابوه للمستشفى وهو شايف إنه سليم."],
["Reality — Neurosis: contact with reality preserved except in severe cases.",
"في العُصاب المريض لسه فاهم الواقع وعارف إيه اللي بيحصل حواليه (إلا في الحالات الشديدة).",
"اللي عنده وسواس نظافة عارف إن الدنيا حقيقية وإن إيده نضيفة، بس مش قادر يبطل يغسلها."],
["Reality — Psychosis: loss of contact with reality.",
"في الذهان المريض بيفقد الاتصال بالواقع، يعني مش بيفرق بين الحقيقي واللي في دماغه.",
"واحد فاكر إنه نبي أو إن حد بيراقبه من التلفزيون، وده مش موجود في الحقيقة."],
["Insight — Neurosis: usually insightful.",
"المريض عنده بصيرة، يعني عارف إنه تعبان ومحتاج علاج.",
"بيقول: \"أنا قلقان زيادة عن اللزوم ومحتاج أتعالج\"."],
["Insight — Psychosis: loss of insight.",
"المريض معندوش بصيرة، مش شايف إنه مريض.",
"بيقول: \"أنا كويس، أنتو اللي مش فاهمين، مش عايز دوا\"."],
["Personality — Neurosis: not affected.",
"شخصية مريض العُصاب بتفضل زي ما هي.",
"هو نفس الشخص اللي كان قبل التعب، بس قلقان."],
["Personality — Psychosis: affected.",
"شخصية مريض الذهان بتتغير وبتتأثر.",
"كان هادي ومنظم وبقى منعزل ومهمل في نفسه وغريب الطباع."],
["Perception — Neurosis: no hallucination except in severe cases.",
"مفيش هلاوس في العُصاب (إلا في الحالات الشديدة).",
"مريض القلق بيسمع الأصوات الحقيقية اللي حواليه بس."],
["Perception — Psychosis: hallucination.",
"في الذهان بيحصل هلاوس.",
"بيسمع صوت بيكلمه والأوضة فاضية."],
["Content of thinking — Neurosis: no delusion except in severe cases.",
"مفيش ضلالات في العُصاب (إلا في الحالات الشديدة).",
"أفكاره منطقية حتى لو مبالغ فيها."],
["Content of thinking — Psychosis: delusion.",
"في الذهان بيبقى فيه ضلالات.",
"مقتنع تماماً إن الجيران بيحاولوا يسمّوه من غير أي دليل."],
["Harm — Neurosis: harm to self or others: low.",
"خطورة المريض على نفسه أو على غيره قليلة.",
"مريض الرهاب بيتجنب الأماكن المزدحمة وخلاص، مش بيأذي حد."],
["Harm — Psychosis: harm to self and others: high.",
"خطورة المريض على نفسه وعلى غيره عالية.",
"واحد فاكر إن حد عايز يقتله، فممكن يهاجم أي حد يقرب منه."],
["Compliance — Neurosis: compliant to treatment.",
"مريض العُصاب بيلتزم بالعلاج.",
"بياخد الدوا في مواعيده ويروح الجلسات."],
["Compliance — Psychosis: not compliant to treatment.",
"مريض الذهان مبيلتزمش بالعلاج.",
"بيرمي الدوا لأنه شايف إنه مش عيان."],
["Examples — Neurosis: anxiety disorders, depressive, obsessive compulsive, somatoform, post traumatic stress disorder.",
"أمثلة العُصاب: اضطرابات القلق، الاكتئاب، الوسواس القهري، الاضطرابات الجسدية الشكل، واضطراب ما بعد الصدمة.",
"واحد بعد حادثة عربية بقى يتفزع من صوت الفرامل = اضطراب ما بعد الصدمة."],
["Examples — Psychosis: schizophrenia, delusional disorder, bipolar disorder (mania).",
"أمثلة الذهان: الفصام، اضطراب الضلالات، والاضطراب ثنائي القطب (نوبة الهوس).",

["Treatment — Neurosis: psychotherapy, anxiolytics, antidepressant.",
"علاج العُصاب: علاج نفسي (جلسات)، ومهدئات للقلق، ومضادات اكتئاب.",

"الهلوسة إنك تحس بحاجة (تسمعها أو تشوفها) من غير ما يكون فيه أي مثير حقيقي برا.",
"تسمع حد بينادي اسمك والأوضة فاضية."],
["Hallucinations can occur in any sensory modality: visual, auditory, olfactory, gustatory, tactile.",
"الهلوسة ممكن تحصل في أي حاسة: بصرية (شوف)، سمعية (سمع)، شمية (ريحة)، تذوقية (طعم)، لمسية (لمس).",
"تشوف شخص مش موجود، أو تشم ريحة حريق مفيش، أو تحس إن حشرات ماشية على جلدك."],
["Hypnagogic and hypnopompic hallucinations are considered normal phenomena.",
"الهلوسة اللي بتحصل قبل النوم وعند الصحيان بتعتبر ظاهرة طبيعية مش مرض.",
"تسمع حد بيناديك وأنت لسه بتنام وبعدين تفوق وتلاقي مفيش حد، وده طبيعي."],
["Hypnagogic hallucinations can occur as one is falling asleep and hypnopompic hallucinations occur when one is waking up.",
"Hypnagogic بتحصل وأنت داخل في النوم، وHypnopompic بتحصل وأنت بتصحى.",
"تفتكر: Hypnagogic = Going to sleep، Hypnopompic = Pop up from sleep (صحيان)."],
["An illusion is a distortion of perception i.e. misinterpretation of a stimuli.",
"الوهم (Illusion) إنك تفهم مثير حقيقي موجود غلط، يعني فيه حاجة فعلاً بس بتفسرها غلط.",
"بالليل تشوف الهدوم متعلقة على الباب وتفتكرها شخص واقف."],
["Illusions in themselves are not indicative of psychopathology since they can occur in the absence of psychiatric disorder.",
"الوهم لوحده مش دليل على مرض نفسي، لأنه ممكن يحصل لأي واحد سليم.",
"واحد خايف في الضلمة يفتكر الحبل تعبان، وهو سليم نفسياً."],
["Illusions can be auditory or visual.",
"الوهم ممكن يكون سمعي أو بصري.",
"سمعي: تفتكر صوت الهوا حد بيكلمك. بصري: تفتكر الشجرة شخص."]]},

{t:'Assessing Thinking',img:'train',items:[
["Content",
"محتوى التفكير: الأفكار نفسها اللي في دماغ المريض بتقول إيه.",
"واحد كل تفكيره إن الناس عايزة تأذيه، ده اضطراب في المحتوى."],
["Control",
"التحكم في التفكير: هل المريض حاسس إن أفكاره بتاعته ولسه ماسك فيها ولا حد بيتحكم فيها.",
"واحد حاسس إن أفكاره بتتحط في دماغه من برا."],
["Stream",
"مجرى (سرعة وتتابع) التفكير: الأفكار ماشية بسرعة قد إيه وبتكمل ولا بتقف.",
"واحد أفكاره بتجري بسرعة جداً، أو أفكاره بتقف فجأة."],
["Form: disruptions in the organization and structure of thought.",
"الشكل: اضطراب في تنظيم وبناء التفكير، يعني الأفكار نفسها موجودة بس مش مترتبة صح.",
"الصورة بتاعة القطر: القطر لازم يمشي على القضبان بترتيب، لو خرج عن الخط الكلام بيتلخبط."]]},

{t:'Disorders of Content of Thinking',items:[
["Delusions",
"الضلالات: معتقدات غلط ثابتة.",
"اللي مقتنع إن المخابرات بتراقبه."],
["Obsessions",
"الوساوس: فكرة بتفرض نفسها غصب عنك.",
"فكرة إن إيدك متسخة مش بتروح من دماغك."],
["Preoccupation",
"الانشغال: فكرة شاغلة بال المريض طول الوقت.",
"واحد كل تفكيره في تجارة جديدة ماشي يخطط ليها."]]},

{t:'What Is a Delusion?',items:[
["Delusions are defined as fixed, false beliefs that conflict with reality.",
"الضلالة هي اعتقاد غلط وثابت ومتعارض مع الواقع.",
"واحد مقتنع إنه ملك رغم إنه موظف عادي، ومحدش يقدر يقنعه."],
["Delusions are characterized by an unshakable belief in things that are not true, and often, there is a continued belief in the delusion despite contrary evidence.",
"الضلالة بتتميز بإيمان مش بيتهز بحاجة مش حقيقية، وغالباً المريض بيفضل متمسك بيها حتى لو ورّيته دليل عكسها.",
"تورّيه تحليل وتصوير وإثبات إنه مش مراقب، ويفضل يقول: \"أنتو بتخبوا الحقيقة\"."],
["Not all delusions are the same. Some might involve non-bizarre beliefs that could theoretically occur in real life. Others may be bizarre, fantastical, or impossible.",
"مش كل الضلالات زي بعض. بعضها ممكن يحصل في الحقيقة (غير غريبة)، وبعضها غريب أو خيالي أو مستحيل.",
"غير غريبة: مقتنع إن مراته بتخونه. غريبة: مقتنع إن حد زرع شريحة في دماغه من الفضاء."],
["Types: grandiosity, erotomanic (delusion of love) → mania.",
"من أنواع الضلالات: العظمة (فاكر نفسه شخص مهم جداً)، والضلالة العشقية (فاكر إن حد بيحبه) وبتبقى مع الهوس.",
"واحد في نوبة هوس فاكر نفسه أقوى راجل في البلد، أو مقتنع إن مشهورة بتحبه."],
["Types: hypochondriacal delusions, persecutory, reference, nihilism, delusions of guilt, infidelity → depression or schizophrenia.",
"باقي الأنواع: ضلالة المرض (فاكر إنه عنده مرض خطير)، الاضطهاد (حد بيأذيه)، الإشارة (الناس بتقصده)، العدمية (فاكر إنه ميت أو إن العالم انتهى)، الذنب، والخيانة، وبتبقى مع الاكتئاب أو الفصام.",
"مكتئب مقتنع إنه عمل ذنب كبير ومش هيتسامح، أو مريض فصام فاكر إن التلفزيون بيتكلم عنه."]]},

{t:'Obsessions',items:[
["Pathological persistence of an irresistible thought, feeling, idea, image or impulse that can not be eliminated from consciousness by logical effort; associated with anxiety and against one's will.",
"الوسواس إن فكرة أو إحساس أو صورة أو دافع يفضل ملازمك بشكل مرضي ومش بتعرف تتخلص منه بالمنطق، وبيجيبلك قلق وغصب عنك.",
"فكرة \"هل قفلت الغاز؟\" فاضلة تلاحقك رغم إنك اتأكدت 5 مرات."],
["Obsession is characterized by all of the following: Recurrent idea.",
"الوسواس لازم تتجمع فيه كل الصفات دي. أولاً: فكرة متكررة.",
"نفس الفكرة بتيجي تاني وتالت طول اليوم."],
["Ego dystonic (distressing).",
"ثانياً: ego dystonic يعني مزعجة ومش مقبولة عند صاحبها وبتضايقه.",
"الفكرة بتتعبه نفسياً ومش مستريح ليها."],
["Explained by the patient as wrong and senseless.",
"ثالثاً: المريض نفسه بيقول إنها غلط ومالهاش لازمة.",
"بيقول: \"أنا عارف إن إيدي نضيفة، بس مش قادر\"."],
["Resistance (patient is trying to resist even if he failed).",
"رابعاً: مقاومة، المريض بيحاول يقاومها حتى لو فشل.",
"بيحاول ميغسلش إيده تاني، يمسك نفسه شوية وبعدين يفشل ويغسلها."]]},

{t:'Preoccupation',items:[
["It is an idea that is characterized by: it is considered quantitative difference from normal idea.",
"الانشغال فكرة بتتميز بإنها اختلاف كمّي عن الفكرة الطبيعية، يعني نفس الفكرة العادية بس بنسبة أكبر.",
"كل الناس بتفكر في شغلها، بس هو بيفكر فيه بزيادة عن المعتاد."],
["Persistent most of the time (day and night).",
"مستمرة معظم الوقت، بالنهار والليل.",
"بيفكر في المشروع وهو صاحي وهو داخل ينام."],
["Is not distressing (ego-syntonic) but it allows him to plan his action.",
"مش مزعجة (ego-syntonic) يعني مقبولة عند صاحبها، بل بتخليه يخطط لتصرفاته.",
"مرتاح للفكرة وبيرسم خطوات تنفيذها، عكس الوسواس اللي بيضايق صاحبه."]]},

{t:'Disorders of Control of Thinking',items:[
["Thought reading: patients say that their thoughts are being read, what they mean is not that other people can tell from their expression or from their habits what they are likely to be thinking.",
"قراءة الأفكار: المريض بيقول إن أفكاره بتتقري، ومقصده مش إن الناس بتخمن من تعبير وشه أو عاداته، لكن إنهم بيعرفوا اللي في دماغه فعلاً.",
"بيقول: \"زمايلي عارفين أنا بفكر في إيه بالظبط من غير ما أتكلم\"."],
["Thought reading can be associated with delusion of reference or persecution.",
"قراءة الأفكار ممكن تيجي مع ضلالة الإشارة أو الاضطهاد.",
"يفتكر إن الناس بتقراله أفكاره عشان تأذيه."],
["Thought insertion: patient believes that his thoughts are implanted by some outside force; they lack the normal sense of ownership of the thoughts.",
"زرع الأفكار: المريض مقتنع إن أفكاره بتتزرع في دماغه بقوة من برا، ومحسش إنها بتاعته (فاقد الإحساس الطبيعي بملكيتها).",
"بيقول: \"فيه حد بيحط أفكار في دماغي مش بتاعتي\"."],
["Sometimes they do not know where they come from, but they are sure they are not their own.",
"أحياناً مش عارف الأفكار جاية منين، بس متأكد إنها مش بتاعته.",
"فكرة جت في باله ومش عارف مصدرها، لكن مقتنع إنها مش منه."],
["Thought broadcasting: patients experience their thought are diffusing out of their mind and can be experienced by others (TV, social media).",
"بث الأفكار: المريض بيحس إن أفكاره بتطلع برا دماغه والناس بتسمعها أو تحس بيها (التلفزيون، السوشيال ميديا).",
"بيقول: \"أنا لما بفكر، الناس كلها بتسمع في التلفزيون\"."],
["It is a passive as it is not intended.",
"وده شيء سلبي لأنه مش بإرادته.",
"هو مش بيقصد يبعت أفكاره، هي بتتسرب غصب عنه."],
["Thought withdrawal: patient believes that his own thought are taken out of his mind so that they have no thought left.",
"سحب الأفكار: المريض مقتنع إن أفكاره بتتسحب من دماغه لدرجة إنه مبقاش عنده أي فكرة.",
"بيقول: \"حد سحب أفكاري وبقيت فاضي من جوه\"."]]},

{t:'Disorders of Stream of Thinking',items:[
["Disorders of thought tempo: Flight of ideas: thoughts follow each other rapidly; there is no general direction e.g. manic patient.",
"اضطراب سرعة التفكير: تطاير الأفكار، الأفكار بتيجي ورا بعض بسرعة ومن غير اتجاه عام، زي مريض الهوس.",
"بيتكلم عن الشغل وبعدين الكورة وبعدين الأكل وبعدين السفر في ثواني."],
["Inhibition or slowing of thinking: slowing of thinking is seen in both depression and schizophrenia.",
"بطء أو كف التفكير: التفكير بيبقى بطيء، وبيظهر في الاكتئاب والفصام.",
"تسأله سؤال وياخد وقت طويل جداً عشان يفكر ويرد."],
["Disorders of the continuity of thinking: Perseveration: say the same thing or behave in the same way repeatedly.",
"اضطراب استمرارية التفكير: التكرار (Perseveration)، يقول نفس الكلام أو يعمل نفس التصرف مرة بعد مرة.",
"تسأله \"اسمك إيه؟\" يقول \"أحمد\"، تسأله \"سنك كام؟\" يقول \"أحمد\"، تسأله \"ساكن فين؟\" يقول \"أحمد\"."],
["Thought blocking: when there is a sudden arrest of the train of thought, leaving a 'blank'.",
"قطع التفكير: وقوف مفاجئ لسلسلة الأفكار فيحس المريض بفراغ.",
"بيتكلم وفجأة يسكت وبعدين يقول: \"نسيت كنت بقول إيه\"."]]},

{t:'Disorders of the Form of Thinking',items:[
["Circumstantiality: circumstantiality occurs when thinking proceeds slowly with many unnecessary and trivial details, but finally the point is reached.",
"التفاصيل الزايدة: التفكير بيمشي ببطء ومعاه تفاصيل كتير مالهاش لازمة، لكن في الآخر بيوصل للنقطة.",
"تسأله \"رحت فين امبارح؟\" فيحكي عن الطريق والجو والمواصلات وكل حاجة، وفي الآخر يقول: \"رحت المستشفى\"."],
["Tangentiality: excessive or irrelevant detail that never reaches the essential point of a conversation or the desired answer to a question.",
"الخروج عن الموضوع (Tangentiality): تفاصيل زيادة أو بعيدة عن الموضوع ومبيوصلش للنقطة الأساسية ولا للإجابة المطلوبة.",
"تسأله \"رحت فين؟\" يحكي عن الجو والأكل والناس وميجاوبش أبداً."],
["Derailment: talks in chains of only semi-related ideas. Their ideas often fall further and further from the topic of conversation.",
"الانحراف: بيتكلم في سلسلة أفكار علاقتها ببعض ضعيفة، وكل شوية بيبعد أكتر عن موضوع الكلام.",
"بيبدأ بالدراسة وبعدين يقول \"والدراسة بتفكرني بالعربية\" وبعدين يتكلم عن السفر وهكذا."],
["Loss of association and incoherent speech (word salad).",
"فقدان الترابط والكلام غير المفهوم (سلطة الكلام): كلمات مش مترابطة ومالهاش معنى.",
"\"الشجرة طيارة بتاكل القلم في المدرسة الزرقا\"."],
["Poverty of the content of thinking.",
"فقر محتوى التفكير: كلام كتير أو قليل بس من غير معلومات مفيدة.",
"يتكلم دقيقتين وبعدها متعرفش هو قال إيه."],
["Neologism: novel words or bizarre use of existing words.",
"الكلمات المخترعة: كلمات جديدة من اختراعه أو استخدام غريب لكلمات موجودة.",
"يقول: \"أنا عندي زنجبلة في دماغي\" ويقصد شيء معين عنده."]]},

{t:'Disturbances of Emotions: 1. Pleasant Emotions',items:[
["A) Euphoria: it is a subjective feeling of well being and confidence, the patient is rather happy, unconcerned of his physical or mental illness.",
"الانتشاء (Euphoria): إحساس داخلي بالراحة والثقة، المريض مبسوط ومش مهتم بمرضه الجسدي أو النفسي.",
"مريض عيان بيضحك ومرتاح وكأنه مفيش حاجة."],
["Euphoria occurs in: a. Some physical diseases as syphilis, multiple sclerosis, frontal lobe tumors, etc.",
"بيحصل في: أ. بعض الأمراض الجسدية زي الزهري (السفلس) والتصلب المتعدد وأورام الفص الجبهي وغيرها.",
"مريض ورم في الفص الجبهي بيضحك ومبسوط وهو عيان جداً."],
["Euphoria occurs in: b. Psychiatric disorders as (mania, hypomania and schizophrenia).",
"ب. الاضطرابات النفسية زي الهوس وتحت الهوس والفصام.",
"مريض هوس بيقول إنه في أحسن حال ومحتاج لا دوا ولا دكتور."],
["B) Elation: it is a sense of enjoyment and self-confidence, which is radiating from the patient and infectious to other persons who share the patient's happiness.",
"البهجة (Elation): إحساس بالاستمتاع والثقة بالنفس بيشع من المريض وبيعدي للناس اللي حواليه فيشاركوه فرحته.",
"واحد بيدخل الأوضة وبيضحك فكل اللي موجودين يضحكوا معاه."],
["Elation occurs in mania and hypomania.",
"بتحصل في الهوس وتحت الهوس.",
"مريض هوس خفيف مبسوط جداً وبيفرح اللي حواليه."],
["C) Exaltation: it is an intensive elation accompanied by grandiosity.",
"الابتهاج الشديد (Exaltation): بهجة قوية مصحوبة بإحساس العظمة.",
"بيفرح جداً وبيقول إنه أهم واحد في الدنيا."],
["Exaltation occurs in mania, hypomania, schizophrenia.",
"بتحصل في الهوس وتحت الهوس والفصام.",
"مريض هوس فاكر نفسه عبقري ومبسوط بشكل زيادة."],
["D) Ecstasy: it is a sense of tranquility and power with peaceful feeling.",
"النشوة (Ecstasy): إحساس بالسكينة والقوة مع راحة وسلام داخلي.",
"إحساس هدوء عميق وقوة جواك كأن الدنيا كلها سلام."],
["Ecstasy occurs in hysterical dissociation, epilepsy, schizophrenia, affective disorders and religious settings.",
"بتحصل في الانفصال الهستيري، الصرع، الفصام، اضطرابات المزاج، والأجواء الدينية.",
"واحد في موقف ديني حاسس بسكينة وقوة كبيرة كأنه قريب من ربنا."]]},

{t:'Disturbances of Emotions (continued)',items:[
["A) Grief: it is sadness secondary to loss of a beloved person.",
"الحزن (Grief): حزن بسبب فقدان شخص عزيز.",
"واحدة حزينة جداً بعد وفاة والدها."],
["B) Depression: it is a feeling of unhappiness, hopelessness, helplessness, guilt feelings, lack of appetite, lack of concentration and insomnia.",
"الاكتئاب (Depression): إحساس بعدم السعادة، واليأس، والعجز، والذنب، وقلة الشهية، وقلة التركيز، والأرق.",
"مبقاش ياكل ولا ينام ولا يركز، وبيقول: \"أنا ملوش لازمة\"."],
["Depression occurs in mood disorders (depression).",
"بتحصل في اضطرابات المزاج (الاكتئاب).",
"شخص مكتئب بقاله أسابيع مش عايز يخرج ولا يكلم حد."],
["C) Anhedonia: loss of pleasure in pleasurable activities, occur in depression and schizophrenia.",
"فقدان المتعة (Anhedonia): الواحد مبقاش بيستمتع بالحاجات اللي كانت بتبسطه، وبيحصل في الاكتئاب والفصام.",
"كان بيحب الكورة وقعاد القهوة مع صحابه، دلوقتي ولا بيهمه."],
["D) Anxiety: it is a feeling of apprehension and fear associated with symptoms of increased activity of the autonomic nervous system.",
"القلق (Anxiety): إحساس بالتوجس والخوف مع أعراض زيادة نشاط الجهاز العصبي الذاتي (دقات قلب، رعشة، عرق).",
"قبل ما تدخل مقابلة شغل قلبك بيدق جامد وإيدك بترتعش وبتعرق."],
["Anxiety occurs in: anxiety disorders, thyrotoxicosis, hypoglycemia and other physical illnesses.",
"بيحصل في: اضطرابات القلق، التسمم الدرقي، هبوط السكر، وأمراض جسدية تانية.",
"واحد عنده زيادة في الغدة الدرقية قلبه بيدق وبيحس بقلق من غير سبب نفسي."],
["E) Others: e.g., panic and phobia.",
"أنواع تانية: زي نوبة الهلع والرهاب (الفوبيا).",
"نوبة هلع: خوف مفاجئ جامد. فوبيا: خوف شديد من حاجة معينة زي المرتفعات."]]},

{t:'III- Inadequate Emotions',items:[
["A. Apathy: emotional expression (body and facial expression) and experiences are affected.",
"اللامبالاة (Apathy): تعبيرات الجسم والوش والمشاعر نفسها كلها بتتأثر وبتقل.",
"مش بيتحمس ولا بيزعل ولا وشه بيتغير، ولا حتى بيحس."],
["B. Indifference: emotional expression is abolished while emotional experiences are not affected.",
"عدم الاكتراث (Indifference): التعبير عن المشاعر بيختفي لكن الإحساس نفسه جواه سليم.",
