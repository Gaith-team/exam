<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c3aed;--accent-light:#8b5cf6;--accent-dark:#6d28d9;--accent-glow:rgba(124,58,237,.2);--bg:#f8fafc;--bg2:#eef2f7;--card:#fff;--text:#1a2332;--text2:#4a5568;--text3:#718096;--bc:rgba(0,0,0,.07);--success:#16a34a;--danger:#dc2626;--warn:#6d28d9;--r:16px;--tr:all .3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.08)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#prog-bar{position:fixed;top:0;left:0;height:3px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--accent-light));transition:width .2s}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(248,250,252,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(13,17,23,.95)}
.nav-back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.nav-back:hover{color:var(--accent);transform:translateX(3px)}
.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.nav-logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-light));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.nav-right{display:flex;align-items:center;gap:8px}
.shuffle-btn{border:1px solid var(--bc);background:var(--bg2);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.shuffle-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero-band{margin-top:64px;background:linear-gradient(135deg,var(--accent-dark),var(--accent),var(--accent-light));padding:40px 24px 36px;text-align:center}
.hero-band-icon{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.35)}
.hero-band h1{font-size:clamp(20px,4vw,30px);font-weight:900;color:#fff;margin-bottom:6px}
.hero-band p{font-size:13px;color:rgba(255,255,255,.8)}
.hero-band-meta{display:flex;justify-content:center;gap:24px;margin-top:20px;flex-wrap:wrap}
.meta-pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 16px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.shell{max-width:560px;margin:0 auto;padding:24px 20px 80px}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:12px 10px;text-align:center}
.stat-box .val{font-size:20px;font-weight:900}.stat-box .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat-correct{color:var(--success)}.stat-wrong{color:var(--danger)}.stat-remain{color:var(--accent)}
.prog-strip{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.prog-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.prog-track{flex:1;height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:8px;transition:width .4s}
.timer-badge{min-width:64px;height:36px;border-radius:18px;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;gap:5px;padding:0 12px;flex-shrink:0}
.timer-badge.warn{color:var(--warn)}.timer-badge.danger{color:var(--danger);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.q-card{background:var(--card);border:1px solid var(--bc);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.q-header{background:linear-gradient(135deg,var(--accent-dark),var(--accent));padding:4px 18px;display:flex;align-items:center;gap:8px}
.q-num{background:rgba(255,255,255,.2);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff}
.q-text{padding:22px 18px 14px;font-size:15px;font-weight:700;line-height:1.65;border-bottom:1px solid var(--bc);text-align:left;direction:ltr}
.options{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;transition:var(--tr);user-select:none;direction:ltr;text-align:left}
.opt:hover:not(.disabled){border-color:var(--accent);background:var(--accent-glow);transform:translateX(3px)}
.opt-letter{width:28px;height:28px;border-radius:8px;flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--text3)}
.opt.correct{border-color:var(--success);background:rgba(22,163,74,.08)}.opt.correct .opt-letter{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:rgba(220,38,38,.07)}.opt.wrong .opt-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.disabled{pointer-events:none}
.feedback-bar{margin:14px 18px;padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;animation:popIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.feedback-bar.ok{background:rgba(22,163,74,.1);color:var(--success);border:1px solid rgba(22,163,74,.25)}
.feedback-bar.no{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.2)}
.feedback-icon{font-size:20px}
.explanation{margin:0 18px 14px;padding:12px 14px;background:rgba(124,58,237,.06);border-radius:10px;border-right:3px solid var(--accent);font-size:13px;color:var(--text2);line-height:1.6}
.nav-btns{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:'Outfit',sans-serif;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:7px}
.btn-next{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff;box-shadow:0 4px 14px var(--accent-glow)}
.btn-skip{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:20px;border:1px solid var(--bc);margin-bottom:20px}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:5px solid var(--bg2);position:relative}
.score-ring svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.ring-bg{stroke:var(--bg2)}.ring-fill{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:900}.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:900;margin-bottom:6px}.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:10px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-radius:14px;padding:16px;margin-bottom:10px;border-right:4px solid var(--bc)}
.report-item.ok{border-right-color:var(--success)}.report-item.no{border-right-color:var(--danger)}
.report-item .ri-q{font-size:13px;font-weight:700;margin-bottom:8px}
.report-item .ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:6px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.1);color:var(--danger)}.ri-right{background:rgba(22,163,74,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}
.footer-tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}}
</style>
</head>
<body>
<div id="prog-bar" style="width:0%"></div>
<nav>
  <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand"><div class="nav-logo-icon">GT</div><span>GHAITH TEAM</span></div>
  <div class="nav-right">
    <button class="shuffle-btn" onclick="randomizeQuestions()">🔀 عشوائي</button>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>
<div class="hero-band">
  <div class="hero-band-icon">🧠</div>
  <h1>Somatic Symptom &amp; Related Disorders</h1>
  <p>physchatric medicine</p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 50 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>
<div class="shell">
  <div class="stats-row">
    <div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div>
    <div class="stat-box"><div class="val stat-wrong" id="sWrong">0</div><div class="lbl">✖ خطأ</div></div>
    <div class="stat-box"><div class="val stat-remain" id="sRemain">--%</div><div class="lbl">⏳ متبقي</div></div>
  </div>
  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">50:00</span></div>
  </div>
  <div id="app"></div>
</div>
<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg"><i class="fa-brands fa-telegram"></i> @nursing2bu</a>
</footer>
<script>
const QUESTIONS = [
/* ===== MULTIPLE CHOICE (easy → hard) ===== */
{t:"The words 'somatic' and 'somatoform' come from the Greek word 'soma', which means:",o:["Mind","Body","Pain","Illness"],a:1},
{t:"The somatoform disorders were grouped together for the first time in which edition of the DSM?",o:["DSM I (1952)","DSM II (1968)","DSM III (1980)","DSM V (2013)"],a:2},
{t:"Somatic symptom and related disorders are characterized by symptoms that are:",o:["Intentionally produced","Medically unexplained","Always caused by infection","Always psychotic in origin"],a:1},
{t:"Which of the following was a famous contributor to the early study of these disorders?",o:["Pavlov","Skinner","Jean Marie Charcot","Carl Rogers"],a:2},
{t:"In DSM V, hypochondriasis was renamed:",o:["Conversion disorder","Somatic symptom disorder","Factitious disorder","Illness anxiety disorder"],a:3},
{t:"Which former somatoform disorder was moved to the obsessive-compulsive spectrum in DSM V?",o:["Conversion disorder","Body dysmorphic disorder","Hypochondriasis","Pain disorder"],a:1},
{t:"Persistent somatoform pain disorder in DSM IV is now included under:",o:["Illness anxiety disorder","Conversion disorder","Somatic symptom disorder","Factitious disorder"],a:2},
{t:"Somatic symptom disorder is more common in:",o:["Women","Men","Children only","The elderly only"],a:0},
{t:"Conversion disorder is characterized mainly by:",o:["Multiple organ complaints","Pain as the sole complaint","Fear of having a specific disease","Neurological complaints"],a:3},
{t:"In DSM V, conversion disorder is also called:",o:["Functional neurological symptom disorder","Illness anxiety disorder","Pseudocyesis","Psychogenic pain disorder"],a:0},
{t:"For a diagnosis of somatic symptom disorder, the state of being symptomatic must persist for more than:",o:["1 month","3 months","12 months","6 months"],a:3},
{t:"Which is NOT a commonly reported symptom in somatization disorder?",o:["Nausea and vomiting outside pregnancy","Pain in the arms and legs","Visual hallucinations","Shortness of breath unrelated to exertion"],a:2},
{t:"Somatic symptom disorder usually begins in:",o:["Old age","Teenage years","Early childhood only","After age 50"],a:1},
{t:"Approximately what percentage of patients presenting to a GP have somatic symptom disorder?",o:["5–10%","0.1%","30–40%","60–70%"],a:0},
{t:"Somatic symptom disorder is inversely related to:",o:["Age","Intelligence","Height","Social position"],a:3},
{t:"Suicide threats in patients with somatization disorder are:",o:["Absent","Common but rarely acted upon","Always acted upon","Acted upon within a week"],a:1},
{t:"The best management approach in somatic symptom disorder is to:",o:["Refer to a new specialist each time","Order repeated lab tests","Assign a single identified physician with regular scheduled visits","Admit the patient long-term"],a:2},
{t:"In treating somatic symptom disorder, the interviews should be:",o:["Brief with a partial physical exam for each new symptom","Long and detailed","Avoided completely","Done only by phone"],a:0},
{t:"Telling a patient with conversion disorder that the symptoms are 'imaginary' will:",o:["Cure the symptoms","Make them worse","Have no effect","Reduce primary gain"],a:1},
{t:"Which prognostic factor is NOT favourable in conversion disorder?",o:["Clearly identifiable stressor","Acute onset","Above-average intelligence","Insidious (gradual) onset"],a:3},
{t:"Conversion disorder is more common among all of the following EXCEPT:",o:["Rural populations","People with little education","Combat-exposed military personnel","Highly educated urban professionals"],a:3},
{t:"Which is a MOTOR symptom of conversion disorder?",o:["Tunnel vision","Astasia-abasia","Midline anaesthesia","Deafness"],a:1},
{t:"Which of the following is a VISCERAL symptom of conversion disorder?",o:["Blepharospasm","Aphonia","Globus hystericus","Torticollis"],a:2},
{t:"'Primary gain' in somatoform disorders refers to:",o:["Tangible benefits from the sick role","Distraction from an intrapsychic conflict","Attention from relatives","Financial compensation"],a:1},
{t:"'Secondary gain' refers to:",o:["Relief of intrapsychic conflict","Assuming a significant other's symptoms","Tangible benefits received from the sick role","Indifference to symptoms"],a:2},
{t:"'La belle indifférence' is best described as:",o:["Anxiety about every symptom","Indifference to symptoms that would normally provoke anxiety","Deliberate faking of symptoms","Fear of acquiring a disease"],a:1},
{t:"'Identification' in somatoform disorders is:",o:["Assuming the symptoms of a significant other","Projection of anger onto others","Denial of illness","Repression of memories"],a:0},
{t:"Approximately what percentage of conversion disorder patients remit spontaneously within 2 weeks of hospital admission?",o:["20%","50%","75%","95%"],a:3},
{t:"If conversion symptoms persist for more than 6 months, spontaneous remission occurs in:",o:["Less than 50%","About 95%","100%","None of them"],a:0},
{t:"Which statement about the course of somatic symptom disorder is correct?",o:["It remits fully in weeks","It is chronic, undulating and relapsing","It always progresses to organic illness","It occurs only once in life"],a:1},
{t:"In illness anxiety disorder, somatic symptoms are typically:",o:["Severe and multiple","Not present or mild","Always neurological","Intentionally produced"],a:1},
{t:"Pharmacotherapy in illness anxiety disorder is useful mainly when:",o:["There is an underlying drug-responsive condition","The patient requests it","Symptoms last more than a week","Group therapy fails"],a:0},
{t:"Why do patients with illness anxiety disorder tend to do well in group therapy?",o:["It avoids all investigations","It provides social support and interaction","It replaces follow-up","It prevents any anxiety"],a:1},
{t:"A patient with an existing physical illness whose stress and non-adherence worsen the condition is best diagnosed with:",o:["Somatic symptom disorder","Conversion disorder","Psychological factors affecting other medical conditions","Illness anxiety disorder"],a:2},
{t:"Which feature MOST clearly distinguishes factitious disorder from conversion disorder?",o:["Neurological symptoms","Deception even without an obvious external reward","Presence of stressors","Chronic course"],a:1},
/* ===== TRUE / FALSE ===== */
{t:"The symptoms in somatic symptom and related disorders are medically unexplained.",o:["True","False"],a:0},
{t:"Body dysmorphic disorder remains classified under the somatic symptom disorders in DSM V.",o:["True","False"],a:1},
{t:"Illness anxiety disorder is the DSM V name for hypochondriasis.",o:["True","False"],a:0},
{t:"Somatic symptom disorder is more common in men than in women.",o:["True","False"],a:1},
{t:"In somatic symptom disorder, the symptoms are intentionally produced or feigned.",o:["True","False"],a:1},
{t:"A diagnosis of somatic symptom disorder requires the symptomatic state to be persistent for more than 6 months.",o:["True","False"],a:0},
{t:"Suicide threats in somatization disorder are common and are frequently carried out.",o:["True","False"],a:1},
{t:"In somatic symptom disorder, treatment generally involves avoiding unnecessary lab and diagnostic investigations.",o:["True","False"],a:0},
{t:"Telling conversion disorder patients that their symptoms are imaginary improves their condition.",o:["True","False"],a:1},
{t:"About 95% of conversion disorder patients remit spontaneously within 2 weeks of hospital admission.",o:["True","False"],a:0},
{t:"Secondary gain means receiving tangible benefits from the sick role.",o:["True","False"],a:0},
{t:"Patients with illness anxiety disorder usually present with severe somatic symptoms.",o:["True","False"],a:1},
{t:"Patients with somatic symptom disorder are more likely than others to develop a medical illness at 20-year follow-up.",o:["True","False"],a:1},
{t:"In factitious disorder, deception is evident even in the absence of an obvious external reward.",o:["True","False"],a:0},
{t:"'Psychological factors affecting other medical conditions' requires that a physical medical condition is present.",o:["True","False"],a:0}
];

/* ============ ENGINE ============ */
let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=50*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function randomizeQuestions(){if(!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟'))return;init(QUESTIONS)}
function init(pool){questions=shuffle([...pool]);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;document.getElementById('totalBadge').textContent=questions.length+' سؤال';startTimer();render()}
function startTimer(){clearInterval(timerInterval);timerInterval=setInterval(()=>{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;const b=document.getElementById('timerBadge');if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';if(timeLeft<=0){clearInterval(timerInterval);finish()}},1000)}
function updateTop(){const total=questions.length;document.getElementById('sCorrect').textContent=correct;document.getElementById('sWrong').textContent=wrong;document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;document.getElementById('progFill').style.width=((i+1)/total*100)+'%';document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%'}
function render(){
  updateTop();
  const q=questions[i];
  const isTF=q.o.length===2&&q.o[0]==='True';
  const order=isTF?q.o.map((_,x)=>x):shuffle(q.o.map((_,x)=>x));
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">${order.map((oi,di)=>`<div class="opt" id="opt${oi}" onclick="choose(${oi})"><div class="opt-letter">${LETTERS[di]||di+1}</div><div class="opt-text">${q.o[oi]}</div></div>`).join('')}</div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;updateTop();
  q.o.forEach((_,idx)=>{const el=document.getElementById('opt'+idx);el.classList.add('disabled');if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong')});
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🥳</span> <span>ما شاء الله عليك 🎉</span>`:`<span class="feedback-icon">😢</span> <span>ركز ونحاول فيها تاني</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(e)}
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'<i class="fa-solid fa-arrow-left"></i> السؤال التالي':'<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}</button>`;
}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrong++;updateTop()}next()}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length,score=Math.round((correct/total)*100);
  wrongSet=[];
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push(q)});
  let grade,gc;
  if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}else if(score>=75){grade='🥈 جيد جداً';gc='var(--accent)'}else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}else{grade='📚 راجع تاني';gc='var(--danger)'}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const report=questions.map((q,idx)=>{const ok=answers[idx]===q.a;return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`<div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0&&answers[idx]!==null?q.o[answers[idx]]:'تم التخطي'}</div><div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`}).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg><div class="score-num">${score}</div><div class="score-pct">%</div></div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${Math.max(0,total-answered)}</div><div class="l">لم يُجَب</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button>
      <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${report}</div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){const pool=[...wrongSet];questions=shuffle(pool);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;startTimer();render();window.scrollTo({top:0,behavior:'smooth'})}
const themeBtn=document.getElementById('themeBtn');
let theme='light';try{theme=localStorage.getItem('theme')||'light'}catch(e){}
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');themeBtn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
