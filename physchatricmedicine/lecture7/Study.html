<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM </title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#7c3aed;--accent-light:#8b5cf6;--accent-dark:#6d28d9;--glow:rgba(124,58,237,.14);--bg:#f8fafc;--bg2:#eef2f7;--card:#fff;--text:#1a2332;--text2:#4a5568;--text3:#718096;--bc:rgba(0,0,0,.08);--ex:#fff7e6;--exb:#f59e0b;--exr:#7a4a00;--r:16px}
[data-theme="dark"]{--bg:#0d1117;--bg2:#161b22;--card:#1c2333;--text:#e6edf3;--text2:#b1bac4;--text3:#7d8590;--bc:rgba(255,255,255,.09);--ex:#2a2315;--exr:#f3d08a;--glow:rgba(139,92,246,.2)}
body{font-family:'Outfit','Cairo',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}
#pb{position:fixed;top:0;left:0;height:3px;width:0;z-index:999;background:linear-gradient(90deg,var(--accent),var(--accent-light))}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:rgba(248,250,252,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(13,17,23,.95)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-light));color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin-top:64px;padding:38px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--accent-dark),var(--accent),var(--accent-light))}
.hero h1{font-size:clamp(20px,4vw,30px);font-weight:900}
.hero p{font-size:13px;opacity:.85;margin-top:6px}
.toc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:860px;margin:18px auto 0}
.toc a{font-size:12px;font-weight:700;color:#fff;text-decoration:none;padding:5px 11px;border-radius:50px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.toc a:hover{background:rgba(255,255,255,.32)}
.wrap{max-width:820px;margin:0 auto;padding:26px 16px 70px}
.slide{background:var(--card);border:1px solid var(--bc);border-radius:20px;margin-bottom:26px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.05);scroll-margin-top:78px}
.sh{padding:14px 20px;color:#fff;background:linear-gradient(135deg,var(--accent-dark),var(--accent));display:flex;gap:10px;align-items:center}
.sn{background:rgba(255,255,255,.2);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;flex-shrink:0}
.sh h2{font-size:17px;font-weight:700}
.imgs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px 16px 0}
.imgs img{max-height:210px;max-width:100%;border-radius:12px;border:1px solid var(--bc)}
.body{padding:12px 20px 20px}
.sub{margin:16px 0 4px;font-size:14px;font-weight:700;color:var(--accent)}
.pt{margin-top:16px;padding-top:16px;border-top:1px dashed var(--bc)}
.pt:first-child,.sub+.pt{border-top:0;padding-top:0}
.en{direction:ltr;text-align:left;font-size:15.5px;font-weight:700;line-height:1.6}
.ar,.ex{direction:rtl;text-align:right;font-family:'Cairo','Outfit',sans-serif;line-height:1.9;font-size:14.5px;margin-top:8px}
.ar{color:var(--text2);padding-right:12px;border-right:3px solid var(--accent)}
.ex{background:var(--ex);color:var(--exr);border-radius:10px;padding:9px 13px;border-right:3px solid var(--exb)}
.ex b{font-weight:700}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:20px;text-align:center;font-size:14px;font-weight:700}
footer span{color:var(--accent)}
@media(max-width:480px){.wrap{padding:16px 10px 50px}.body{padding:10px 14px 16px}}
</style>
</head>

const S=[
{t:"Introduction",im:["p2"],p:[
["Group of illnesses where bodily signs and symptoms are a major focus","مجموعة أمراض الأعراض الجسدية (وجع، غثيان…) هي أهم حاجة فيها وكل التركيز عليها.","واحد كل يوم بيشتكي من وجع في بطنه وصدره وده شاغل باله كله."],
["Believed to originate from faulty mind-body interactions – the brain sends signals that impinge on the patient's awareness falsely suggesting a serious problem in the body","بيتقال إن السبب خلل في التفاعل بين العقل والجسم: المخ بيبعت إشارات بتدخل على وعي المريض وتوهمه غلط إن في مشكلة خطيرة في جسمه.","زي جرس إنذار الحريق بيرن والبيت مفيهوش نار؛ الإنذار (المخ) هو الغلطان."],
["The symptoms are medically unexplained","الأعراض معندهاش تفسير طبي، يعني التحاليل والأشعة مبتلاقيش سبب.","أشعة وتحاليل كلها سليمة وهو لسه بيقول صدري بيوجعني."],
["Patients are convinced that their suffering comes from some type of undetected and untreated bodily derangement","المريض متأكد إن تعبه سببه مرض في الجسم محدش اكتشفه ومحدش بيعالجه.","بيقول 'الدكاترة كلهم مش شايفين المرض اللي عندي' ويفضل يلف من دكتور لدكتور."]]},
{t:"Historical background",im:["p3"],p:[
["\"Somatoform\"/\"Somatic\" derived from Greek \"soma\" – body","الكلمة جاية من اليونانية 'soma' ومعناها الجسم.","زي كلمة psychosomatic: نفسي (psycho) + جسدي (somatic)."],
["Grouped together for the first time in the DSM III in 1980","الأمراض دي اتجمعت تحت عنوان واحد لأول مرة في DSM III سنة 1980.","زي ما تجمع كل الكتب بتاعة مادة واحدة على رف واحد لأول مرة."],
["Observed for a long time before that and several terms used to refer to these disorders including neurasthenia, hysteria and Briquet's syndrome","كانت معروفة من زمان قبل كده، وكانت بتتسمى بأسماء كتير: neurasthenia وhysteria ومتلازمة بريكيه Briquet's syndrome.","زي حد ليه كذا اسم دلع قبل ما يتسجل باسمه الرسمي."],
["Some famous contributors – Jean Marie Charcot, Paul Briquet, Sigmund Freud","العلماء المشهورين اللي ليهم دور فيها: شاركو، بول بريكيه، وسيجموند فرويد.","اتحفظهم كتلاتة: Charcot وBriquet وFreud."]]},
{t:"Somatoform disorders",im:["p4"],p:[
["Somatization disorders – multiple organ system involvement","بتصيب أكتر من جهاز في الجسم في نفس الوقت.","شكوى من المعدة والمفاصل والصدر والدورة الشهرية مع بعض."],
["Conversion disorders – neurological complaints","شكاوى عصبية (شلل، عمى، تشنجات) من غير سبب عصبي حقيقي.","واحدة رجلها بطلت تتحرك فجأة بعد خناقة، والأشعة سليمة."],
["Hypochondriasis – worried about being sick with a particular illness rather than a focus on physical symptoms (Now Illness Anxiety disorder in DSM V)","قلقان إنه عنده مرض معين، والخوف من المرض نفسه أهم من الأعراض. في DSM V بقى اسمه Illness Anxiety disorder.","واحد متأكد إنه عنده سرطان رغم إن كل الفحوصات سليمة."],
["Body dysmorphic disorder – dissatisfaction with a body part (Now shifted to Obsessive disorders in the DSM V)","عدم رضا مبالغ عن جزء من الجسم. في DSM V اتنقل لمجموعة الاضطرابات الوسواسية.","بنت شايفة مناخيرها وحشة جداً رغم إنها عادية، ومش بتبطل تبص عليها."],
["Persistent somatoform pain disorder – pain is the main complaint (Now part of Somatic Symptom disorder in DSM V)","الوجع هو الشكوى الأساسية والمستمرة. في DSM V بقى جزء من Somatic Symptom disorder.","وجع ضهر مستمر شهور ومفيش سبب عضوي."],
["Undifferentiated somatoform disorder","أعراض جسدية مش مطابقة لأي نوع محدد من الأنواع اللي فوق.","أعراض مختلطة مش بتكمّل شروط أي تشخيص بعينه."],
["Somatoform disorder not otherwise specified","أي اضطراب جسدي الشكل ومش داخل تحت أي نوع من اللي فات.","زي خانة 'غير ذلك' في الاستمارة."]]},
{t:"DSM V: Somatic Symptoms and related disorders",p:[
["Somatic Symptom Disorder","اضطراب الأعراض الجسدية: أعراض جسدية مزعجة مع تفكير وقلق زيادة عن اللزوم بخصوصها.","واحد عنده صداع وبيقعد يوم كامل يفكر إنه ورم."],
["Illness anxiety disorder (Hypochondriasis)","اضطراب قلق المرض: الخوف إنك عيان بمرض معين، والأعراض قليلة أو مفيش.","كل ما يسمع عن مرض يقول أكيد أنا عندي."],
["Conversion disorder (Functional Neurological Symptom disorder)","اضطراب التحويل (أعراض عصبية وظيفية): أعراض عصبية من غير سبب عصبي.","فقدان نطق مفاجئ بعد صدمة نفسية."],
["Psychological Factors affecting other medical conditions","عوامل نفسية بتأثر على مرض جسدي موجود فعلاً وتزوده.","مريض سكر بيهمل علاجه بسبب الاكتئاب فالسكر يتعب."],
["Factitious disorders","اضطرابات مصطنعة: الشخص بيفبرك الأعراض بنفسه.","واحد بيسخّن الترمومتر عشان يبان إن عنده حمى."],
["Other specified Somatic Symptoms and related disorders (pseudocyesis)","اضطرابات محددة تانية، زي pseudocyesis (حمل كاذب).","ست متأكدة إنها حامل وبطنها كبرت لكن مفيش جنين."],
["Unspecified Somatic Symptom and related disorder","اضطراب أعراض جسدية غير محدد، لو الصورة ناقصة ومش عارفين نحدد النوع.","الأعراض موجودة بس المعلومات مش كفاية للتحديد."]]},
{t:"Somatic Symptom disorder",p:[
["One or more somatic symptoms that are distressing or result in significant disruption of daily life","عرض جسدي واحد أو أكتر بيضايق المريض أو بيعطّل حياته اليومية.","وجع بيخليه مش قادر يروح الشغل."],
["Excessive thoughts, feelings or behaviours related to the somatic symptoms or associated health concerns as manifested by at least one of the following:","أفكار أو مشاعر أو سلوكيات زيادة عن الحد بخصوص الأعراض، ولازم واحدة على الأقل من التلاتة اللي جاية.","المطلوب واحدة بس من التلاتة مش لازم كلهم."],
["Disproportionate and persistent thoughts about the seriousness of one's symptoms","أفكار مستمرة ومبالغ فيها عن خطورة الأعراض.","كحة بسيطة وهو شايفها سرطان رئة."],
["Persistently high levels of anxiety about health or symptoms","قلق عالي ومستمر على الصحة أو الأعراض.","مبيبطلش قلق على صحته طول اليوم."],
["Excessive time and energy devoted to these symptoms or health concerns","بيصرف وقت ومجهود كبير على الأعراض ومخاوفه الصحية.","ساعات يقيس الضغط ويدوّر على النت ويزور دكاترة."],
["C. State of being symptomatic is persistent > 6 months","حالة الأعراض مستمرة أكتر من 6 شهور.","مش تعب أسبوعين، لازم أكتر من نص سنة."],
["Specify: predominant pain, persistent, severity","بنحدد: لو الوجع هو الغالب، ولو مستمر، ودرجة الشدة.","نكتب: Somatic Symptom disorder مع غلبة الوجع، مستمر، شدة متوسطة."]]},
{t:"Somatic symptom disorder (criteria A, B)",im:["p7"],p:[
["A – many physical symptoms","أعراض جسدية كتير.","شكاوى من أجهزة مختلفة."],
["starting before the age of 30","بدايتها قبل سن 30.","بتبدأ في المراهقة أو العشرينات."],
["occur over a period of years","بتفضل سنين.","بقالها 5 سنين بتتكرر."],
["leads to multiple medical consultations and other attempts at seeking treatment","بتخلي المريض يروح لدكاترة كتير ويجرب علاجات تانية.","لفّ على 10 دكاترة وعطّار وراقي."],
["significant impairment in social, occupational, or other areas of functioning","تأثير كبير على حياته الاجتماعية والشغل وغيره.","اتعطّل عن الشغل واتباعد عن صحابه."],
["B – 4 pain symptoms – related to at least 4 different sites or functions","B: 4 أعراض وجع في 4 أماكن أو وظايف مختلفة.","وجع راس وضهر ومفاصل وأثناء الدورة."],
["2 gastrointestinal symptoms other than pain","عرضين في الجهاز الهضمي غير الوجع.","غثيان وانتفاخ."],
["1 sexual or reproductive symptom","عرض واحد جنسي أو تناسلي.","برود جنسي أو اضطراب في الدورة."],
["1 pseudoneurological symptom","عرض واحد شبه عصبي.","غشيان أو ضعف في رجل من غير سبب عصبي."]]},
{t:"Somatic Symptom disorder (criteria C, D)",im:["p8"],p:[
["C – despite appropriate investigation, the symptoms cannot be fully explained by a known general medical condition or the direct effects of a substance","رغم الفحوصات المناسبة، الأعراض مبتتفسرش بالكامل بمرض عضوي معروف أو بتأثير مادة (دوا أو مخدر).","كل التحاليل سليمة ومفيش دوا يسبب الأعراض."],
["when there is a related general medical condition, the physical complaints or resulting social or occupational impairment are in excess of what could be expected from the history, physical examination, or laboratory findings","ولو في مرض عضوي فعلاً، الشكوى أو تأثيرها على الحياة بتكون أكبر بكتير من المتوقع حسب الفحص والتحاليل.","عنده التهاب بسيط في المفصل وهو عامل نفسه مشلول."],
["D – the symptoms are not intentionally produced or feigned","الأعراض مش متعمَّدة ومش تمثيل.","هو فعلاً بيحس بيها، مش بيمثل."]]},
{t:"Somatic symptom disorder – some facts",p:[
["Commoner in women (life time prevalence 0.2–2% of women and 0.2% of men)","أكتر في الستات؛ النسبة طول العمر 0.2–2% للستات و0.2% للرجالة.","من كل 1000 راجل واحد ولا اتنين بس، والستات أكتر."],
["5–10% of patients presenting to a GP","من 5 لـ10% من المرضى اللي بيروحوا للطبيب العام.","في عيادة فيها 100 مريض يبقى 5 لـ10 منهم كده."],
["Inversely related to social position","بتزيد كل ما المستوى الاجتماعي يقل (علاقة عكسية).","الأعلى في المستوى الاجتماعي، أقل في الإصابة."],
["Usually beginning in teenage years","غالباً بتبدأ في سن المراهقة.","بنت عندها 15 سنة بدأت تشتكي من أوجاع متكررة."],
["Often co-morbid with other mental dis. – depression and anxiety","غالباً بتيجي مع أمراض نفسية تانية: اكتئاب وقلق.","نفس المريض عنده أعراض جسدية واكتئاب."],
["Common personality traits – avoidant, paranoid, self-defeating, obsessive-compulsive","سمات الشخصية المعتادة: تجنبية، شكاكة، هادمة للذات، وسواسية.","بيتجنب الناس ومش واثق فيهم وبيدقق في كل حاجة."]]},
{t:"Somatic Symptom disorder (aetiology)",im:["freud","brain","dna"],p:[
["Psychodynamic factors","عوامل التحليل النفسي: صراعات نفسية داخلية.","الضيق النفسي بيطلع على شكل وجع."],
["Learning theory","نظرية التعلم: الشخص اتعلم إن المرض بيجيب اهتمام.","طفل اتدلّع لما مرض فبقى يشتكي كل ما يحتاج اهتمام."],
["Social/Cultural factors","عوامل اجتماعية وثقافية: البيئة والثقافة بتحدد إزاي نعبّر عن الألم.","في ثقافات ناس بتعبّر عن الحزن بـ'قلبي بيوجعني'."],
["Biological factors","عوامل بيولوجية: خلل في وظائف المخ.","حساسية زيادة للإشارات الجسدية."],
["Genetic factors","عوامل وراثية: بتنتقل في العيلة.","أم وبنتها الاتنين عندهم نفس الشكاوى."],
["Cytokines","السيتوكينات: مواد التهابية في المناعة، بيتقال إن لها دور في الأعراض.","زي ما بتحس بوجع جسم لما تاخد برد بسبب السيتوكينات."]]},
{t:"Somatization disorder – clinical features (commonest)",p:[
["#","Common characteristics of presenting problem"],
["Long, complicated medical histories – confused time frames","تاريخ مرضي طويل ومعقد وتواريخه متلخبطة.","مش فاكر إيه حصل إمتى."],
["Patients frequently report they have been sickly all their life","المرضى بيقولوا إنهم عيّانين طول عمرهم.","'أنا من صغري تعبان'."],
["Psychological and interpersonal problems","مشاكل نفسية ومشاكل في العلاقات.","خلافات مع الجوز والأهل."],
["Suicide threats common but rarely acted upon","التهديد بالانتحار شائع لكن نادراً بيتنفذ.","بيقول 'هموّت نفسي' لكن مش بيعمل، ولازم نتعامل بجدية."],
["Dramatic and emotional presentation of history and appearance","عرض مسرحي وانفعالي للتاريخ والشكل.","بيحكي بصوت عالي ودموع وتمثيل."],
["Self centred, hungry for admiration, manipulative","متمركز حول نفسه، عايز إعجاب، وبيتلاعب بالناس.","بيستخدم مرضه عشان الكل يخدمه."],
["#","Commonest Symptoms reported"],
["Nausea and vomiting other than during pregnancy","غثيان وترجيع من غير حمل.","بترجع باستمرار ومش حامل."],
["Pain in the arms and legs","وجع في الدراعين والرجلين.","وجع غامض في الأطراف."],
["Shortness of breath unrelated to exertion","ضيق نفس من غير مجهود.","بيتهنج وهو قاعد."],
["Amnesia","فقدان ذاكرة.","مش فاكر أحداث معينة من غير سبب عضوي."],
["Complications of pregnancy and menstruation","مضاعفات في الحمل والدورة الشهرية.","دورة مؤلمة جداً وغير منتظمة."]]},
{t:"Somatic Symptom disorder – DD, course and prognosis",p:[
["#","Differential Diagnosis"],
["Genuine illness","مرض عضوي حقيقي: لازم نستبعده الأول.","وجع صدر ممكن يكون جلطة؛ نتأكد قبل أي حاجة."],
["Psychiatric syndromes – depression, anxiety","متلازمات نفسية: اكتئاب وقلق.","الاكتئاب بيجي بتعب وأوجاع."],
["Life stressors with associated psychophysiological symptoms","ضغوط الحياة مع أعراض نفس-جسدية.","صداع وقلب بيدق قبل الامتحان."],
["Other somatic related disorder","اضطرابات جسدية تانية قريبة منه.","زي Illness anxiety أو Conversion."],
["Voluntary psychogenic symptoms or syndromes","أعراض نفسية المنشأ بس متعمَّدة (تمارض).","واحد بيمثل المرض عشان يهرب من الشغل."],
["#","Course"],
["chronic, undulating and relapsing illness","مرض مزمن، بيطلع وينزل وبيرجع تاني.","شهر هادي وشهر وجع."],
["Rarely fully remits – unusual for patients to be symptom free for more than a year","نادراً بيروح خالص؛ نادر المريض يفضل من غير أعراض سنة كاملة.","مفيش سنة من غير شكوى."],
["Not more likely than others to develop a medical illness at 20 yr follow up","مفيش احتمال أكبر إنهم يصابوا بمرض عضوي بعد 20 سنة متابعة.","بعد 20 سنة نفس نسبة الناس العادية."]]},
{t:"Somatic Symptom disorder – treatment",p:[
["Single, identified physician as primary care giver","دكتور واحد معروف يكون هو المسؤول عن المريض.","دكتور الأسرة وبس بدل 10 دكاترة."],
["Regular, scheduled visits usually at monthly intervals","زيارات منتظمة بميعاد، غالباً كل شهر.","ميعاد ثابت أول كل شهر."],
["Keep interviews brief with a partial physical exam for each new symptom expressed","المقابلات قصيرة، وكشف جزئي لكل عرض جديد.","يشتكي من وجع جديد، نكشف المكان ده بس."],
["Generally avoid lab/diagnostic investigations","نتجنب التحاليل والفحوصات غير الضرورية.","منكررش الأشعة كل مرة."],
["Once diagnosed view these problems as being communications of emotional distress","بعد التشخيص نشوف الأعراض على إنها رسالة عن ضيق نفسي.","وجعه كإنه بيقول 'أنا متضايق'."],
["Try and raise awareness of these symptoms being responses to psychological pressures and see if you can motivate patient to see a mental health clinician","نحاول نوعّيه إن الأعراض رد فعل لضغوط نفسية ونشجعه يروح لمختص نفسي.","نقوله 'التعب ده ممكن يزيد وقت الضغط'."],
["Individual or group psychotherapy","علاج نفسي فردي أو جماعي.","جلسات مع معالج أو مجموعة دعم."]]},
{t:"Somatic Symptom disorder – tasks of psychotherapy",im:["p14"],p:[
["Decrease the patient's personal health expenditures","نقلّل مصاريفه الصحية الشخصية.","يبطل يصرف على كشوفات وتحاليل ملهاش لازمة."],
["Help to cope with their symptoms","نساعده يتعايش مع أعراضه.","يتعلم استرخاء ويكمّل يومه رغم الوجع."],
["Assist with expressing underlying emotions","نساعده يعبّر عن مشاعره المكبوتة.","يقول 'أنا زعلان' بدل ما يقول 'بطني بتوجعني'."],
["Help to develop alternative strategies for expressing their feelings","نساعده يطوّر طرق بديلة للتعبير عن مشاعره.","يتكلم مع صاحبه بدل ما يتمارض."],
["Psychopharmacological intervention difficult","العلاج بالأدوية النفسية صعب.","الأدوية نتيجتها مش مضمونة."]]},
{t:"Conversion disorder",im:["p15"],p:[
["Neurological complaint","شكوى عصبية من غير سبب عصبي، وأنواعها:","بتتكتب بحسب العرض الأساسي."],
["With weakness or paralysis","مع ضعف أو شلل.","دراع مش بيتحرك وفحصه سليم."],
["With abnormal movement","مع حركة غير طبيعية.","رعشة غريبة من غير سبب."],
["With swallowing problems","مع صعوبة بلع.","إحساس إن حاجة واقفة في زوره."],
["With speech problems","مع مشاكل كلام.","مبيعرفش يتكلم فجأة."],
["With attacks or seizures","مع نوبات أو تشنجات.","تشنجات من غير تغيير في رسم المخ EEG."],
["With anaesthesia or sensory loss","مع فقدان إحساس.","رجله مش حاسة بحاجة."],
["With special sensory symptoms","مع أعراض حواس خاصة (نظر، سمع…).","فقد البصر فجأة والعين سليمة."],
["With mixed symptoms","مع أعراض مخلوطة.","شلل مع فقدان إحساس."]]},
{t:"Conversion disorder (qualifiers)",p:[
["Acute Episode < 6 months","نوبة حادة: أقل من 6 شهور.","حصلت من 3 شهور."],
["Persistent","مستمر.","الأعراض ماشية من سنة."],
["With/out psychological stressor","مع ضغط نفسي أو من غيره.","بدأت بعد حادثة، أو من غير سبب واضح."]]},
{t:"Conversion disorder (criteria)",p:[
["A – one or more symptoms of deficit affecting voluntary motor or sensory function that suggest a neurological or other general medical condition","عرض نقص واحد أو أكتر في الحركة الإرادية أو الإحساس يوحي بمرض عصبي أو عضوي.","ضعف في رجل يشبه الجلطة."],
["B – Psychological factors are judged to be associated with the symptom deficit because the initiation or exacerbation of the symptoms or deficit is preceded by conflicts or other stressors","B: العوامل النفسية مرتبطة بالأعراض لأن بدايتها أو زيادتها بتيجي بعد صراعات أو ضغوط.","الشلل بدأ بعد خناقة قوية."],
["C – The symptom or deficit is not intentionally produced or feigned","C: الأعراض مش متعمَّدة ولا تمثيل.","هو مش بيمثل."],
["D – The symptom or deficit cannot, after appropriate investigation, be fully explained by a general medical condition or by the direct effects of a substance, or as a culturally sanctioned behaviour or experience","D: بعد الفحص مفيش تفسير عضوي ولا مادة ولا سلوك مقبول ثقافياً.","مش حالة زار أو طقس ديني."],
["E – Causes clinically significant distress or impairment in social, occupational or other important areas of functioning or warrants medical evaluation","E: بتسبب ضيق أو تعطيل مهم في الحياة أو تستدعي تقييم طبي.","مش قادر يروح شغله."],
["F – The symptoms or deficit is not limited to pain or sexual dysfunction, does not exclusively occur during the course of a somatisation disorder and is not better accounted for by another mental disorder","F: مش مقتصرة على الوجع أو الخلل الجنسي، ومش بتحصل بس أثناء somatization disorder، ومش أحسن تفسير بمرض نفسي تاني.","لو الأعراض جزء من الفصام ما نقولش conversion."]]},
{t:"Conversion disorder (epidemiology)",p:[
["#","Common amongst:"],
["F>M","أكتر في الستات من الرجالة.","ست : 3 رجالة تقريباً."],
["rural population","سكان الريف.","قرية بعيدة عن الخدمات."],
["little education","تعليم قليل.","غير متعلم."],
["low SES","مستوى اجتماعي اقتصادي منخفض.","دخل محدود."],
["military personnel exposed to combat situations","عسكريين اتعرضوا لمعارك.","جندي من الحرب شلّ دراعه."],
["Co-morbidities include – MDD, Anxiety, schizophrenia, somatisation, histrionic pd, passive-dependent pd","أمراض مصاحبة: اكتئاب جسيم MDD، قلق، فصام، somatization، شخصية هستيرية، وشخصية اعتمادية سلبية.","المريض عنده conversion وكمان اكتئاب."]]},
{t:"Conversion disorder – clinical features",p:[
["#","Motor symptoms"],
["Involuntary movements","حركات لا إرادية.","رعشة."],
["Tics","لزمات حركية.","رمشة أو هزة مفاجئة."],
["Blepharospasm","تشنج الجفون.","عينه بتتقفل غصب."],
["Torticollis","التواء الرقبة.","رقبته مايلة على جنب."],
["Opisthotonus","تقوّس الضهر لورا.","جسمه بيتقوس زي القوس."],
["Seizures","تشنجات.","نوبة بدون سبب مخي."],
["Abnormal gait","مشية غير طبيعية.","بيمشي بشكل غريب."],
["Falling","وقوع.","بيقع من غير سبب."],
["Astasia-Abasia","عدم القدرة على الوقوف والمشي مع سلامة الأرجل.","مش قادر يقف رغم إن رجله سليمة."],
["Paralysis","شلل.","دراعه مشلول."],
["Weakness","ضعف.","مش قادر يرفع حاجة."],
["aphonia","فقدان الصوت.","الصوت اختفى فجأة."],
["#","Sensory deficits"],
["Anaesthesia of extremities","فقدان إحساس الأطراف.","إيده مش حاسة بحاجة."],
["Midline anaesthesia","فقدان إحساس على خط منتصف الجسم.","نص جسمه مش بيحس."],
["Blindness","عمى.","مش شايف والعين سليمة."],
["Tunnel vision","رؤية نفقية.","بيشوف جزء صغير بس."],
["Deafness","صمم.","مش سامع والأذن سليمة."],
["#","Visceral symptoms"],
["Psychogenic vomiting","ترجيع نفسي المنشأ.","بيرجع كل ما يتوتر."],
["Pseudocyesis","حمل كاذب.","بطنها كبرت وفاكرة نفسها حامل."],
["Globus hystericus","إحساس بكتلة في الزور.","حاجة ماسكة في زوره ومفيش حاجة."],
["Swooning or syncope","إغماء.","بتقع مغشي عليها في موقف ضاغط."],
["Urinary retention","احتباس بول.","مش عارف يتبول رغم إن المثانة سليمة."],
["diarrhoea","إسهال.","بيجيله إسهال في أي ضغط."]]},
{t:"Conversion disorder – aetiology",im:["freud","dna"],p:[
["Psychodynamic factors – intra-psychic conflict, repression, sublimation, projection","عوامل تحليل نفسي: صراع داخلي، كبت، تسامي، وإسقاط.","كبت غضبه فطلع في شلل."],
["Learning theory / social factors – nonverbal means of controlling and managing others","نظرية التعلم والعوامل الاجتماعية: وسيلة غير لفظية للسيطرة على الناس.","الأعراض بتخلي اللي حواليه يهتم."],
["Biological factors – impaired hemispheric function","عوامل بيولوجية: ضعف في وظيفة نصفي المخ.","خلل في شغل المخ."],
["Genetic factors – women probands more prone to somatisation, depression and anxiety, male probands more prone to ASPD and substance abuse","وراثية: القرايب الستات بيتعرضوا لـsomatization واكتئاب وقلق، والرجالة لاضطراب الشخصية المضادة للمجتمع ASPD وتعاطي المخدرات.","بنت أمها عندها somatization، وابن أبوه عنده تعاطي."]]},
{t:"Psychological Concepts in Somatoform disorders",p:[
["Primary Gain – distracts from primary intra-psychic conflict","المكسب الأولي: العرض بيبعد الشخص عن الصراع النفسي الداخلي.","شلل الإيد بيمنعه يفكر في خناقته."],
["Secondary Gain – receives tangible benefits to sick role","المكسب الثانوي: فوائد ملموسة من دور المريض.","اهتمام وإجازة من الشغل وفلوس."],
["La Belle indifference – indifference to what should normally be anxiety provoking symptoms","اللامبالاة الجميلة: عدم اهتمام بأعراض المفروض تقلق.","بيقول 'شلل؟ عادي' بهدوء."],
["Identification – assumption of symptoms of a significant other","التماهي: يتبنّى أعراض شخص مهم عنده.","بيشتكي بنفس عرض أبوه المتوفي."]]},
{t:"Conversion disorder – course and prognosis",p:[
["Usually acute onset","بداية حادة وفجأة.","فجأة بعد الصدمة."],
["95% remit spontaneously within 2 weeks of hospital admission","95% بيتحسنوا لوحدهم خلال أسبوعين من دخول المستشفى.","بعد يومين استرجع حركته."],
["If symptoms present for more than 6 months less than 50% remit spontaneously","لو الأعراض فوق 6 شهور، أقل من 50% بيتحسنوا لوحدهم.","كل ما طال، قلّت فرصة التحسن."],
