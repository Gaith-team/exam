<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title> GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--a:#7c3aed;--a2:#6d28d9;--bg:#f8fafc;--card:#fff;--tx:#1a2332;--tx2:#4a5568;--bc:rgba(0,0,0,.08);--ex:#fef3c7;--exb:#d97706;--ar:#ede9fe}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--card:#1c2333;--tx:#e6edf3;--tx2:#b1bac4;--bc:rgba(255,255,255,.1);--ex:#2a2312;--exb:#f59e0b;--ar:#251b3d}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
header{background:linear-gradient(135deg,var(--a2),var(--a),#8b5cf6);color:#fff;text-align:center;padding:44px 20px 36px}
header h1{font-family:'Outfit',sans-serif;font-size:clamp(22px,5vw,34px);font-weight:900;direction:ltr}
header p{font-family:'Outfit',sans-serif;direction:ltr;opacity:.9;font-size:14px;margin-top:6px}
main{max-width:760px;margin:0 auto;padding:22px 16px 60px}
section{background:var(--card);border:1px solid var(--bc);border-radius:18px;margin-bottom:22px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.05)}
section>h2{font-family:'Outfit',sans-serif;direction:ltr;text-align:left;background:linear-gradient(135deg,var(--a2),var(--a));color:#fff;font-size:16px;padding:10px 18px}
.it{padding:16px 18px;border-bottom:1px solid var(--bc)}.it:last-child{border:0}
.en{font-family:'Outfit',sans-serif;direction:ltr;text-align:left;font-weight:700;font-size:15.5px;border-left:4px solid var(--a);padding-left:12px}
.ar{background:var(--ar);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:15px}
.ex{background:var(--ex);border-right:4px solid var(--exb);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:14.5px;color:var(--tx2)}
.ex b{color:var(--exb)}
img{display:block;max-width:100%;margin:0 auto;padding:14px}
footer{text-align:center;padding:20px;color:var(--tx2);font-size:13px}
</style></head><body>
<header><h1>Obsessive–Compulsive and Related Disorders</h1><p>physchatric medicine</p></header>
<main id="m"></main>
<footer>GHAITH TEAM · @nursing2bu</footer>
<script>
const D=[
["Obsessions",[
["Obsessions are unwelcome, persistent, recurrent, intrusive, senseless and uncomfortable for the individual, who attempts to suppress or neutralise them and recognises them as absurd and a product of his or her own mind.",
"الوساوس (Obsessions) هي أفكار مش مرغوبة، بتيجي كتير وبتتكرر وبتفرض نفسها على دماغك، ملهاش لازمة وبتضايقك. الشخص بيحاول يكتمها أو يطفّيها، وبيعرف إنها غريبة ومن تفكيره هو مش من حد تاني.",
"واحد بيفكر كل شوية إن إيده متلوثة بالميكروبات، وهو عارف كويس إنه غسلها من خمس دقايق وإن الفكرة دي مش منطقية، بس مش قادر يطردها من دماغه."],
["Obsessions may be:","الوساوس ممكن تظهر في أشكال، وهنفصلها تحت:","زي ما الصداع ممكن يبقى في الراس أو الصدغ أو ورا العين، الوسواس برضه له أشكال مختلفة."],
["thoughts (e.g. sex, violence, contamination, numbers);","أفكار (Thoughts): زي أفكار عن الجنس أو العنف أو التلوث أو الأرقام.","طالب مش قادر يشيل من دماغه فكرة إن رقم 7 رقم وحش وهيجيبله مصيبة."],
["images (vivid, morbid or violent scenes);","صور ذهنية (Images): مشاهد واضحة ومزعجة أو مرعبة أو عنيفة بتيجي في دماغك.","واحدة بتشوف في خيالها صورة واضحة لحادثة عنيفة غصب عنها وهي قاعدة هادية."],
["impulses (e.g. a fear of jumping in front of a train);","اندفاعات (Impulses): إحساس مفاجئ بالخوف إنك تعمل حاجة خطيرة، زي إنك ترمي نفسك قدام القطر.","واحد واقف على رصيف المحطة ومرعوب فجأة إنه ممكن يرمي نفسه قدام القطر، رغم إنه مش عايز كده خالص."],
["ruminations (continuous pondering).","اجترار (Ruminations): تفكير مستمر ومتواصل في نفس الموضوع من غير ما توصل لنتيجة.","واحد قاعد بالساعات يسأل نفسه: هو أنا قفلت الباب ولا لأ؟ ويلف في نفس السؤال."],
["rituals.","طقوس (Rituals): أفعال معينة بيعملها بنفس الترتيب كل مرة.","واحدة لازم تلبس الجزمة اليمين قبل الشمال وتعد لحد 3 قبل ما تخرج، ولو غلطت تبدأ من الأول."]]],
["Compulsions",[
["Compulsions are repetitive, purposeful physical or mental behaviours performed with reluctance in response to an obsession.",
"الأفعال القهرية (Compulsions) سلوكيات بتتكرر وليها هدف، ممكن تبقى حركة بالجسم أو حاجة في دماغك، والشخص بيعملها وهو مش عايز، كرد فعل على الوسواس.",
"الوسواس قاله إن إيدك متلوثة، فيروح يغسلها وهو متضايق ومش عايز يعمل كده، بس مضطر."],
["They are carried out according to certain rules in a stereotyped fashion and are designed to neutralise or prevent discomfort or a dreaded event.",
"بتتنفذ بقواعد معينة وبنفس الشكل كل مرة، وهدفها تهدّي الضيق أو تمنع حاجة وحشة هو خايف منها.",
"يغسل إيده 5 مرات بالظبط وبنفس الترتيب، لأنه حاسس لو غسلها 4 مرات حد من أهله هيتعب."],
["Compulsions include:","الأفعال القهرية بتشمل:","زي قايمة أنواع، وكل نوع تحته مثال."],
["hand-washing, cleaning;","غسل الإيدين والتنظيف.","ممرض يغسل إيده بعد كل حاجة يلمسها لحد ما جلد إيده يتشقق."],
["counting, checking;","العد والتأكد.","واحد يرجع يتأكد من قفل البوتاجاز 10 مرات قبل ما ينزل من البيت."],
["touching and rearrangement of objects to achieve symmetry;","اللمس وإعادة ترتيب الحاجات عشان توصل لتماثل وتناسق.","واحدة تعدّل الكتب على المكتب لحد ما كل الأطراف تتساوى بالمللي، ولو فيه كتاب مايل متعرفش تذاكر."],
["mental compulsions (e.g. checking and repeating thoughts);","أفعال قهرية ذهنية: زي إنك تراجع وتكرر أفكار جوه دماغك.","واحد كل ما تيجيله فكرة وحشة يقعد يكرر جملة معينة في دماغه عشان يلغيها."],
["hoarding","التكديس (Hoarding): جمع الحاجات وعدم رميها.","واحدة تحتفظ بكل الجرايد القديمة والعلب الفاضية ومش بتعرف ترمي منها حاجة."]]],

["OCD Diagnosis",[
["If resistance to the obsessions or compulsions is attempted, anxiety usually increases until the compulsive activity is performed.",
"لو الشخص حاول يقاوم الوساوس أو الأفعال القهرية، القلق بيزيد ويفضل يزيد لحد ما ينفذ الفعل القهري.",
"واحد حاول يمسك نفسه ميغسلش إيده، فحس بقلق وتوتر وقلبه بيدق أكتر وأكتر، لحد ما راح غسلها."],
["OCD is characterised by time-consuming (>1 hour/day) obsessions and/or compulsions.",
"الوسواس القهري بيتميز إن الوساوس أو الأفعال القهرية بتاخد وقت كبير، أكتر من ساعة في اليوم.",
"واحدة بتقضي ساعتين كل يوم في التأكد من الأبواب والشبابيك، ده مش مجرد حرص عادي."],
["An ICD-10 diagnosis of OCD requires that obsessions or compulsions are present most days for at least two weeks, are distressing and interfere with activities.",
"تشخيص الوسواس القهري حسب ICD-10 لازم الوساوس أو الأفعال القهرية تكون موجودة أغلب الأيام لمدة أسبوعين على الأقل، وتسبب ضيق وتعطّل أنشطته.",
"طالب بقاله 3 أسابيع كل يوم بيعيد ترتيب شنطته وبيتضايق وبيتأخر على محاضراته بسبب كده، ده بيطابق الشروط."],
["Avoidance of stimuli or activities that trigger obsessive–compulsive symptoms is very common",
"تجنب المحفزات أو الأنشطة اللي بتطلّع أعراض الوسواس القهري شيء شائع جداً.",

["Figure 12.2 Aetiology of OCD",[["Figure 12.2 Aetiology of OCD","الرسمة بتوضح أسباب الوسواس القهري: الجينات (وسواس أو اضطراب التيكس)، حماية الأهل الزايدة، ممكن يحصل بعد عدوى بالمكورات السبحية عند الأطفال (PANDAS)، والمسارات النهائية: نقص السيروتونين وخلل في الدايرة العصبية القشرية المخططية المهادية، والتشريط الإجرائي (Operant conditioning).","طفل أهله بيخافوا عليه زيادة، وعنده قريب فيه وسواس، وبعد التهاب حلق بالمكورات السبحية ظهرت عليه أعراض الوسواس فجأة، دي مجموعة عوامل اتجمعت."]],"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAM0BGIDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6cTTrYAZiXpT/AOzrX/nktTDoKfirc5X3Mo0oKK0K39nWv/PJaP7Otf8AnktWcUYpc8h+zh2K39nWv/PJaP7Otf8AnktWcUYo55B7OHYrf2da/wDPJaP7Otf+eS1ZxRijnkHs4dit/Z1r/wA8lo/s61/55LVnFGKOeQezh2K39nWv/PJaP7Otf+eS1ZxRijnkHs4dit/Z1r/zyWj+zrX/AJ5LVnFGKOeQezh2K39nWv8AzyWj+zrX/nktWcUYo55B7OHYrf2da/8APJaP7Otf+eS1ZxRijnkHs4dit/Z1r/zyWj+zrX/nktWcUYpc8h+yh2K39nWv/PJaP7Otf+eS1ZxRijnkHsodit/Z1r/zyWj+zrX/AJ5LVnFGKOeQeyh2K39nWv8AzyWj+zrX/nktWcUYo55B7KHYrf2da/8APJaT+zrX/nilWsUYo55B7KHYq/2da/8APFKX+zrX/nktWcUYo55B7KHYrf2da/8APJaP7Otf+eS1ZxRijnkHsodit/Z1r/zyWj+zrX/nktWcUYo55B7KHYrf2da/88lo/s61/wCeS1ZxRijnkHsodit/Z1r/AM8lo/s61/55LVnFGKOeQeyh2K39nWv/ADyWj+zrX/nktWcUYp88g9nDsVv7Otf+eS0f2da/88lq ["Aetiology",[
["People with OCD are more likely to have a family history of OCD (50% of cases).","الناس اللي عندها وسواس قهري احتمال كبير يكون في العيلة حد عنده نفس المرض (في 50% من الحالات).","شاب عنده وسواس، واكتشف إن أبوه وعمه كمان كان عندهم أعراض مشابهة."],
["Serotonin dysfunction.","في خلل في السيروتونين (مادة كيميائية في المخ).","السيروتونين زي الرسول بين خلايا المخ، لو الرسول ده مش شغال صح، الرسايل بتتلخبط والفكرة بتفضل تلف."]]],
["Comorbidity",[
["Persons with OCD have high comorbidity with lifetime prevalence for major depressive disorder around 67% and for social phobia is about 25%.",
"مريض الوسواس القهري غالباً بيكون عنده أمراض تانية معاه (Comorbidity): الاكتئاب الجسيم حوالي 67% على مدى العمر، والرهاب الاجتماعي حوالي 25%.",
"مريض وسواس بقاله سنين، وبقى كمان حزين ومفيش نفسه في حاجة، وبيتجنب الناس. يعني المرضين مع بعض."],
["Other conditions include alcohol use disorders, generalized anxiety disorder, specific phobia, panic disorder, eating disorders, and personality disorders.",
"وأمراض تانية معاه برضه: إدمان الكحول، القلق العام، الرهاب المحدد، نوبات الهلع، اضطرابات الأكل، واضطرابات الشخصية.",
"واحد عنده وسواس وفي نفس الوقت بتجيله نوبات هلع، وحالته محتاجة تقييم لكل المشاكل دي مش بس الوسواس."]]],
["Treatment",[
["Treatment of obsessive compulsive disorder includes both of: 1) Pharmacotherapy 2) Psychotherapy",
"علاج الوسواس القهري بيشمل الاتنين مع بعض: 1) علاج بالأدوية 2) علاج نفسي.",
"زي ما بتعالج التهاب بمضاد حيوي وراحة، العلاج هنا دوا + جلسات."],
["1) Pharmacotherapy: selective serotonin reuptake inhibitors (SSRIs) as fluoxetine, TCAs as clomipramine.",
"العلاج بالأدوية: مثبطات استرجاع السيروتونين الانتقائية (SSRIs) زي فلوكسيتين، ومضادات الاكتئاب ثلاثية الحلقات (TCAs) زي كلوميبرامين.",
"الدكتور يكتب للمريض فلوكسيتين عشان يرفع مستوى السيروتونين في المخ ويقلل الوساوس."],
["2) Psychotherapy: 1-CBT involves exposure followed by response prevention.",
"العلاج النفسي: أولاً العلاج المعرفي السلوكي (CBT) وبيشمل التعرض (Exposure) وبعده منع الاستجابة (Response prevention).",
"واحد عنده وسواس تلوث: نخليه يلمس حاجة وسخة (تعرض)، وبعدين نمنعه يغسل إيده (منع استجابة) لحد ما قلقه يهدى لوحده."],
["2-Psychoeducation helps people understand their disorder.",
"التثقيف النفسي (Psychoeducation) بيساعد الناس تفهم مرضها.",
"الأخصائي يشرح للمريض إن الأفكار دي أعراض مرض مش ضعف منه، فيبقى متعاون في العلاج."],
["3) Deep brain stimulation (DBS): Non-ablative surgical techniques involving indwelling electrodes in various basal ganglia nuclei are under investigation to treat OCD.",
"التحفيز العميق للمخ (DBS): تقنيات جراحية من غير تدمير للأنسجة بتتحط فيها أقطاب كهربية جوه مناطق مختلفة من العقد القاعدية في المخ، ولسه تحت البحث لعلاج الوسواس.",
"زي جهاز تنظيم ضربات القلب، بس بيتزرع في المخ ويبعت نبضات كهربية خفيفة، وده لسه بيتجرب."]]],
["II Body dysmorphic disorder",[
["Definition. Imagined belief (not of delusional proportions) that a defect in the appearance of all or a part of the body is present",
"التعريف: اعتقاد متخيَّل (مش وصل لدرجة الضلالات) إن في عيب في شكل الجسم كله أو جزء منه.",
"بنت شكلها عادي جداً بس مقتنعة إن مناخيرها شكلها وحش، ولو حد طمنها تقتنع شوية وتفضل قلقانة."],
["Diagnosis, signs, and symptoms. Patient complains of defect (e.g., wrinkles, hair loss, small breasts or penis, age spots, stature).",
"التشخيص والعلامات والأعراض: المريض بيشتكي من عيب زي التجاعيد أو تساقط الشعر أو صغر الصدر أو العضو الذكري أو بقع السن أو الطول.",
"شاب بيشتكي إن طوله قصير وبيقعد قدام المراية بالساعات رغم إن طوله طبيعي."],
["Complaint is out of proportion to objective abnormality. If a slight physical anomaly is present, the person's concern is grossly excessive",

["IV Hair-Pulling Disorder (Trichotillomania)",[
["Hair-pulling disorder is a chronic disorder characterized by repetitive hair pulling that leads to variable hair loss that may be visible to others. It is also known as trichotillomania.",
"اضطراب نتف الشعر مرض مزمن بيتميز بنتف الشعر بشكل متكرر، وده بيسبب تساقط شعر بدرجات مختلفة وممكن الناس تلاحظه. واسمه كمان Trichotillomania.",
"بنت بتنتف شعر حواجبها كل يوم لحد ما بقى فيه أماكن فاضية والكل شايفها."],
["Two types of hair pulling include focused pulling (intentional act) and automatic pulling (outside the person's awareness).",
"فيه نوعين لنتف الشعر: نتف مركز (Focused) وهو فعل متعمد، ونتف تلقائي (Automatic) وده بيحصل من غير ما الشخص ياخد باله.",
"المركز: واحد بينتف شعره عن قصد لما يتوتر. التلقائي: واحدة بتنتف شعرها وهي بتذاكر أو بتتفرج على التلفزيون وهي مش واخدة بالها."],
["Patients usually deny the behavior and often try to hide the resultant alopecia.",
"المرضى غالباً بينكروا السلوك ده وبيحاولوا يخبوا الصلع اللي حصل.",
"بنت بتلبس طرحة أو باروكة عشان تداري مكان النتف، ولو اتسألت تقول شعري بيقع لوحده."],
["Head banging, nail biting, scratching, excoriation, and other acts of self-mutilation may be present",
"ممكن يبقى معاه سلوكيات تانية زي ضرب الراس، قضم الضوافر، الحك، تسلخ الجلد، وإيذاء النفس.",
"مريض بينتف شعره وفي نفس الوقت بيقضم ضوافره لحد ما تنزف، وبيحك جلده لحد ما يتسلخ."]]],

["V Excoriation (Skin-Picking) Disorder",[
["Excoriation or skin-picking disorder is characterized by the compulsive and repetitive picking of the skin. It can lead to severe tissue damage and result in the need for various dermatologic treatments.",

["The face is the most common site of skin picking. Other common sites are legs, arms, hands, fingers, and scalp",
