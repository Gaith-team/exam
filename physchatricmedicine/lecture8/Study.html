footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;font-weight:700}

<script>
const D = [
{id:"s1",tag:"01. Clinical Definition",title:"Understanding Schizophrenia",groups:[{items:[
 {h:"Neurodevelopmental Character",en:"A complex biological disorder disrupting thought, perception, affect, and goal-directed behavior.",
  ar:"اضطراب بيولوجي معقد بيبوّظ التفكير، والإدراك (اللي بتحسه بحواسك)، والمشاعر (affect)، والسلوك اللي بيوصّلك لهدفك. وكلمة neurodevelopmental معناها إن أصله من تكوين المخ وهو بيتبني.",
  ex:"راديو الإشارة بتاعته مشوّشة: الراديو شغال بس اللي بيطلع منه مش مظبوط. المخ شغال بس بيفسّر الدنيا غلط."},
 {h:"Chronic Course",en:"Characterized by episodic acute exacerbations alternating with periods of partial or full remission.",
  ar:"المرض بييجي على شكل نوبات: الأعراض بتشتد فجأة (acute exacerbation)، وبعدين بتهدى جزئياً أو كلياً (remission)، وبعدين ممكن ترجع تاني.",
  ex:"زي الربو: فترة تبقى كويس فيها، وفجأة تيجي نوبة، وبعدها تهدى."},
 {h:"Functional Impact",en:"Profoundly alters social functioning, occupation, self-care independence, and quality of life.",
  ar:"بيأثر جامد على علاقة المريض بالناس، وشغله، وقدرته يعتني بنفسه لوحده، وعلى جودة حياته عموماً.",
  ex:"شاب كان بيشتغل ويخرج مع صحابه، بعد المرض بقى مش قادر يروح الشغل وبيحتاج حد يفكره يستحمى ويأكل."}
]}]},

{id:"s2",tag:"02. Diagnostic Standards",title:"DSM-5-TR & ICD-11 Diagnostic Framework",groups:[
 {label:"Core Symptom Criteria (Min 2 required)",items:[
 {h:"Core Symptom Criteria",en:"Core Symptom Criteria (Min 2 required).",
  ar:"لازم يبقى فيه على الأقل عرضين من الأعراض الأساسية عشان يتحط التشخيص.",
  ex:"زي شروط القبول: مينفعش تكتفي بعرض واحد."},
 {en:"At least 1 symptom must be from items 1, 2, or 3.",
  ar:"واحد على الأقل منهم لازم يكون من البنود ١ أو ٢ أو ٣ (الضلالات، الهلاوس، الكلام المتفكك).",
  ex:"يعني لو العرضين من الأعراض الباقية بس، التشخيص مش بيكمل."},
 {h:"Delusions",en:"Fixed, false beliefs impervious to logic.",
  ar:"ضلالات: اعتقادات ثابتة وغلط، ومهما قلت للمريض أدلة ومنطق مبيغيّرهاش.",
  ex:"مريض مقتنع إن الجيران بيراقبوه بكاميرات، وكل ما تثبتله إن مفيش كاميرات يقولك \"إنت كمان معاهم\"."},
 {h:"Hallucinations",en:"Perceptions without an external stimulus (e.g., hearing voices).",
  ar:"هلاوس: إنه يحس أو يسمع أو يشوف حاجة مش موجودة فعلاً بره دماغه.",

 {h:"Disorganized Speech",en:"Derailment, incoherence, loose associations.",
  ar:"كلام متفكك: يبدأ يتكلم في موضوع ويخرج منه لحاجة تانية خالص (derailment)، أو كلامه مش مفهوم (incoherence)، أو الأفكار مش مربوطة ببعض (loose associations).",
  ex:"تسأله \"عامل إيه؟\" يقولك \"النهارده الجو حلو والعربية زرقا والقط جعان\"."},
 {h:"Disorganized/Catatonic Behavior",en:"Abnormal motor activity or posture.",
  ar:"سلوك غير منظم أو كاتاتوني: حركة أو وقفة غير طبيعية في الجسم.",
  ex:"مريض واقف ساعات في نفس الوضع زي التمثال، أو بيتحرك حركات من غير هدف."}
 ]},
 {items:[
 {h:"Timeframe Requirement",en:"Active symptoms for 1 month; continuous signs for ≥ 6 months.",

  ex:"واحد بقاله يومين متلخبط مش فصام. الفصام لازم يكمل المدة دي."},
 {h:"Social/Occupational Dysfunction",en:"Marked decline in work, interpersonal relations, or self-care.",
  ar:"تدهور واضح في الشغل، أو العلاقات مع الناس، أو الاعتناء بنفسه.",
  ex:"موظف مجتهد بقى يتأخر ويتخانق مع زمايله ومبقاش بيهتم بنضافته."}
 ]}
]},

{id:"s2b",tag:"02B. Clinical Presentation",title:"Classic Subtypes & Diagnostic Evolution",groups:[{items:[
 {h:"Paranoid",en:"Prominent persecutory/grandiose delusions and auditory hallucinations; cognitive function and affect relatively preserved.",
  ar:"أبرز حاجة فيه ضلالات اضطهاد (حاسس إن حد بيأذيه) أو عظمة (حاسس إنه شخص مهم جداً)، مع هلاوس سمعية. والتفكير والمشاعر بتبقى لسه كويسة نسبياً.",
  ex:"مريض شايف إن المخابرات بتتبعه، وبيسمع أصوات، بس لسه بيتكلم بشكل مفهوم ومنظم."},
 {h:"Disorganized (Hebephrenic)",en:"Disorganized speech, erratic behavior, and flat/inappropriate affect; severe impairment in daily self-care routines.",
  ar:"كلام متفكك، وتصرفات غير متوقعة، ومشاعر باردة (flat) أو مش مناسبة للموقف، وتأثير شديد على اعتناءه بنفسه كل يوم.",
  ex:"مريض بيضحك في موقف حزين، ومش بيستحمى ولا بيغيّر هدومه."},
 {h:"Catatonic",en:"Marked psychomotor disturbance: stupor, waxy flexibility, mutism, posturing, or unprovoked, purposeless motor excitement.",
  ar:"اضطراب واضح في الحركة: خمول تام (stupor)، أو جسمه بيفضل على الوضع اللي تحطه فيه زي الشمع (waxy flexibility)، أو مبيتكلمش (mutism)، أو بياخد وقفات غريبة (posturing)، أو بيتحرك بعنف من غير سبب ومن غير هدف.",
  ex:"ترفع دراعه يفضل مرفوع زي الشمعة، وبعدها فجأة يجري ويصرخ من غير سبب."},
 {h:"Undifferentiated",en:"Undifferentiated: Mixed active symptoms without a single dominant pattern.",
  ar:"أعراض نشطة مخلوطة، ومفيش نمط واحد هو الغالب.",
  ex:"مريض عنده شوية هلاوس وشوية كلام متفكك وشوية حركات غريبة، ومفيش نوع واضح."},
 {h:"Residual",en:"Residual: Chronic negative symptoms with attenuated positive symptoms.",
  ar:"أعراض سلبية مزمنة (زي الانسحاب وقلة الحماس)، مع أعراض إيجابية خفيفة ومخففة.",
  ex:"مريض كان عنده هلاوس جامدة، دلوقتي هادي بس لسه منعزل ومفيش عنده طاقة."},
 {h:"DSM-5-TR Diagnostic Note",en:"Formal subtypes were removed in modern diagnostic manuals (DSM-5 / ICD-11) due to low diagnostic stability and overlapping treatments. They remain essential clinical descriptors for…",
  ar:"الأنواع الرسمية دي اتشالت من الأدلة الحديثة (DSM-5 / ICD-11) لأن التشخيص كان بيتغير مع الوقت، ولأن علاجها كان متشابه. ومع ذلك لسه مهمين كوصف إكلينيكي. (الجملة مقطوعة في الملف الأصلي عند الكلمة دي).",
  ex:"زي أسماء الأحجام \"صغير/وسط/كبير\": مش مقاسات رسمية بس بتفيد في الوصف."}
]}]},

{id:"s3",tag:"03. Aetiology & Risk Factors",title:"Genetic Susceptibility & Stress-Vulnerability Model",groups:[
 {items:[
 {en:"Strong polygenic architecture involving hundreds of small-effect variants.",
  ar:"الوراثة هنا مش جين واحد، دي مئات الجينات كل واحد ليه تأثير بسيط، ومجموعها هو اللي بيزوّد الخطر.",
  ex:"زي لما تحط مئات الحبات الصغيرة في كفة ميزان، كل حبة مش بتفرق، بس كلها مع بعض بتقلّب الميزان."},
 {en:"Biological vulnerability interacts with environmental stress to trigger episodes.",
  ar:"الاستعداد البيولوجي بيتفاعل مع الضغط البيئي وبيفجّر النوبات.",
  ex:"الاستعداد زي البنزين، والضغط زي الشرارة. مفيش بنزين مفيش حريقة، ومفيش شرارة ممكن مفيش حريقة."}
 ]},
 {label:"Genetics & Heritability",items:[
 {h:"Lifetime Prevalence Risk",en:"Lifetime Prevalence Risk: General Population: ~1%.",
  ar:"احتمال إن الواحد يصاب بالفصام طول عمره في عامة الناس حوالي ١٪.",
  ex:"من كل ١٠٠ شخص عادي، واحد بس هيصاب."},
 {en:"1st-Degree Relative: ~10%.",
  ar:"لو أب أو أم أو أخ أو أخت (قرابة درجة أولى) عنده الفصام، احتمالك بيبقى حوالي ١٠٪.",
  ex:"لو أخوك مصاب، فاحتمالك واحد من كل ١٠ تقريباً."},
 {en:"Both Parents Affected: 40%–50%.",
  ar:"لو الأب والأم الاتنين مصابين، الاحتمال بيطلع لـ ٤٠٪ لـ ٥٠٪.",
  ex:"يعني تقريباً نص الحالات في الظروف دي."}
 ]},
 {label:"Stress-Vulnerability Model",items:[
 {h:"Key Nursing Takeaway",en:"Reducing environmental stress and enhancing coping mechanisms prevents relapse and protects cognitive stability.",
  ar:"لو قلّلت الضغط اللي حوالين المريض وقويت طرق تعامله مع المشاكل (coping)، بتمنع الانتكاسة وبتحافظ على استقرار تفكيره.",
  ex:"ممرضة بتهدّي جو الأوضة، وبتعلّم المريض يتنفس بعمق لما يتوتر، فبتقل احتمالية رجوع النوبة."}
 ]}
]},

{id:"s4",tag:"04. Neurobiology",title:"Neurochemical & Structural Brain Changes",groups:[
 {label:"Dopamine Hypothesis",items:[
 {h:"Mesolimbic Hyperactivity",en:"Mesolimbic Hyperactivity: Drives positive symptoms (hallucinations/delusions).",
  ar:"زيادة نشاط الدوبامين في المسار الميزوليمبي بتسبب الأعراض الإيجابية، يعني الهلاوس والضلالات.",
  ex:"زي صوت الراديو لما يعلى زيادة وتسمع حاجات مش موجودة."},
 {h:"Mesocortical Hypoactivity",en:"Mesocortical Hypoactivity: Drives negative and cognitive symptoms.",
  ar:"قلة نشاط الدوبامين في المسار الميزوكورتيكال بتسبب الأعراض السلبية والإدراكية (التفكير والذاكرة).",
  ex:"زي موبايل بطاريته على ٥٪: بطيء ومش بيستجيب."}
 ]},
 {label:"Glutamate Pathway",items:[
 {en:"NMDA receptor hypofunction contributes to persistent cognitive deficits and persistent negative symptoms poorly managed by classic dopamine blockers.",
  ar:"ضعف شغل مستقبلات NMDA بيساهم في مشاكل التفكير والأعراض السلبية المستمرة، والأدوية القديمة اللي بتقفل الدوبامين مش بتعالجها كويس.",
  ex:"زي واحد بيصلّح عطل في الكهربا بس العطل الحقيقي في السباكة، فالدوا (الدوبامين) مش بيحل المشكلة دي."}
 ]},
 {label:"Structural Alterations",items:[

  ex:"زي شجرة اتقصّت فروعها بدري أوي، فباقي الشجرة مبقاش فيه اتصال كويس."}
 ]}

{id:"s5",tag:"05. Environmental Factors",title:"Environmental & Psychosocial Triggers",groups:[{items:[
 {h:"Prenatal Insults",en:"Maternal viral infections, severe malnutrition, and obstetrical hypoxia increase neurodevelopmental risk.",
  ar:"عدوى فيروسية للأم، أو سوء تغذية شديد، أو نقص أكسجين وقت الولادة (hypoxia)، بيزوّدوا خطر مشاكل في تطور المخ.",

 {h:"Cannabis Use",en:"Adolescent heavy exposure to high-THC cannabis acts as a major catalyst for early psychotic onset.",

 {h:"Social Stressors",en:"Urban upbringing, migration, early life trauma, and high Expressed Emotion (EE) in living environments.",

  ex:"مريض عايش في بيت أهله كل يوم بيصرخوا عليه ويقولوله \"إنت السبب\"، فبينتكس بسرعة."}
]}]},

{id:"s6",tag:"06. Clinical Assessment",title:"Symptom Domains & Nursing Priorities",groups:[
 {label:"Positive Symptoms",items:[
 {h:"Typical Manifestations",en:"Hallucinations, delusions, paranoia, disorganized speech/behavior.",
  ar:"هلاوس، وضلالات، وبارانويا (شك واضطهاد)، وكلام وسلوك متفكك.",
  ex:"مريض بيسمع أصوات وبيشك إن الدكتور عايز يسممه."},
 {h:"Nursing Assessment & Focus",en:"Assess command hallucinations; maintain safety; validate distress without supporting delusions.",
  ar:"اسأل عن الهلاوس الآمرة (command hallucinations) يعني أصوات بتأمره يعمل حاجة، وحافظ على الأمان، وطمّن المريض على ضيقه من غير ما توافقه على الضلالة.",
  ex:"تقوله \"أنا فاهم إنك خايف جداً وأنا معاك\"، ومتقولوش \"أيوه فعلاً حد عايز يأذيك\"."}
 ]},
 {label:"Negative Symptoms",items:[
 {h:"Typical Manifestations",en:"Avolition, blunted affect, anhedonia, alogia, social isolation.",
  ar:"فقدان الدافع (avolition)، ومشاعر باهتة (blunted affect)، وعدم الاستمتاع بحاجة (anhedonia)، وقلة الكلام (alogia)، وانعزال اجتماعي.",
  ex:"مريض قاعد في السرير طول اليوم، وشكله من غير تعبيرات، ومش عايز يكلم حد."},
 {h:"Nursing Assessment & Focus",en:"Assist with ADLs; set structured routine; offer brief, low-demand social contact.",
  ar:"ساعده في أنشطة الحياة اليومية (ADLs)، وحط له روتين منظم، وقدّم له تواصل اجتماعي قصير ومن غير ضغط.",
  ex:"تقعد معاه ٥ دقايق تقوله صباح الخير من غير ما تسأله أسئلة كتير، وتفكره بميعاد الأكل والحمام."}
 ]},
 {label:"Cognitive Symptoms",items:[
 {h:"Typical Manifestations",en:"Executive dysfunction, memory deficits, slow processing speed.",
  ar:"ضعف في التخطيط واتخاذ القرار (executive dysfunction)، وضعف في الذاكرة، وبطء في معالجة المعلومات.",
  ex:"مريض بتقوله ٣ حاجات مرة واحدة، فبينسى اتنين وبياخد وقت يرد."},
 {h:"Nursing Assessment & Focus",en:"Give brief, step-by-step instructions; use clear visual cues; simplify decision-making.",
  ar:"اديله تعليمات قصيرة وخطوة خطوة، واستخدم إشارات بصرية واضحة، وبسّط القرارات.",
  ex:"بدل \"خد الدوا واستحمى والبس\"، تقول \"خد الدوا\"، وبعد ما يخلص تقوله \"دلوقتي استحمى\"، وتعلّق جدول بالصور."}
 ]}
]},

{id:"s7",tag:"07. Lines of Management",title:"Phased Nursing & Multidisciplinary Management",groups:[{items:[
 {h:"FIRST LINE – Acute Stabilization",en:"Safety restoration, de-escalation, standard SGAs/FGAs, and adherence monitoring.",
  ar:"رجّع الأمان، وهدّي الموقف (de-escalation)، وادّي الأدوية المضادة للذهان العادية (SGAs/FGAs)، وراقب إن المريض ملتزم بالدوا.",
  ex:"مريض هايج في الطوارئ: الأول تهدّيه وتأمّنه، وبعدين تبدأ الدوا وتتأكد إنه بيبلعه."},
 {h:"SECOND LINE – Refractory Care",en:"Clozapine initiation for treatment-resistant cases; strict blood (ANC) and cardiac oversight.",
  ar:"لو العلاج العادي مانفعش، نبدأ كلوزابين (Clozapine) مع متابعة دقيقة للدم (ANC) وللقلب.",
  ex:"زي لما المضاد الحيوي العادي مايجيبش نتيجة، تروح لدوا أقوى لكن بمتابعة أشد."},
 {h:"THIRD LINE – Rehabilitation",en:"CBTp, social skills training, family psychoeducation, and metabolic health management.",
  ar:"علاج معرفي سلوكي للذهان (CBTp)، وتدريب على المهارات الاجتماعية، وتثقيف الأسرة، وإدارة الصحة الأيضية (metabolic).",
  ex:"بعد ما المريض يهدى، نعلّمه يرجع يعيش وسط الناس، ونعلّم أهله يتعاملوا معاه، ونتابع وزنه وسكره."}
]}]},

{id:"s8",tag:"08. First-Line Management",title:"Acute Phase Stabilization & Standard Pharmacotherapy",groups:[
 {label:"Pharmacological Agents",items:[
 {h:"SGAs (First Choice)",en:"SGAs (First Choice): Risperidone, Olanzapine, Quetiapine, Aripiprazole (lower EPS risk).",
  ar:"الجيل التاني من مضادات الذهان هو الاختيار الأول: ريسبيريدون، أولانزابين، كويتيابين، أريبيبرازول. وخطر الأعراض الحركية الجانبية (EPS) بتاعتهم أقل.",
  ex:"زي لما تختار دوا ليه أعراض جانبية أخف من التاني، فبتبدأ بيه الأول."},
 {h:"FGAs",en:"FGAs: Haloperidol, Fluphenazine (effective for positive symptoms; higher EPS risk).",
  ar:"الجيل الأول: هالوبيريدول وفلوفينازين. بيعالجوا الأعراض الإيجابية كويس، بس خطر الـ EPS معاهم أعلى.",
  ex:"دوا قوي وفعّال، بس ممكن يخلي إيد المريض ترتعش أو جسمه يتشنج."},
 {h:"LAI Formulations",en:"LAI Formulations: Long-Acting Injectables for poor medication adherence.",
  ar:"حقن طويلة المفعول (LAI) للمريض اللي مش بيلتزم بالأقراص.",
  ex:"مريض بينسى الحبوب أو بيرفضها، فبناخد له حقنة مرة كل كام أسبوع بدل ما ياخد قرص كل يوم."}
 ]},
 {label:"Core Nursing Actions",items:[
 {h:"Safety Maintenance",en:"Safety Maintenance: Reduce stimulation; monitor command hallucinations.",
  ar:"حافظ على الأمان: قلّل المؤثرات حوالين المريض، وراقب الهلاوس الآمرة.",
  ex:"تنقله لأوضة هادية ونورها خافت، ومتسيبوش لوحده لو بيسمع أصوات بتأمره يأذي نفسه."},
 {h:"EPS Screening",en:"EPS Screening: Assess dystonia, akathisia, and parkinsonism using AIMS.",
  ar:"افحص الأعراض الحركية الجانبية: الديستونيا (شد عضلي)، والأكاثيزيا (عدم قدرة على الجلوس مرتاح)، والباركنسونية (رعشة وبطء)، وبتستخدم مقياس AIMS.",
  ex:"مريض مش عارف يقعد وبيمشي رايح جاي طول الوقت بعد الدوا، ده أكاثيزيا."},
 {h:"Metabolic Monitoring",en:"Metabolic Monitoring: Establish baseline weight, lipids, and blood glucose.",
  ar:"اعمل قياس أساسي قبل ما تبدأ: الوزن، والدهون، وسكر الدم، عشان تقارن بيه بعدين.",
  ex:"تسجل وزنه وسكره النهارده، وبعد شهرين تشوف لو زادوا بسبب الدوا."}
 ]}
]},

{id:"s9",tag:"09. Second-Line Management",title:"Treatment-Resistant Schizophrenia & Clozapine Protocol",groups:[
 {label:"Clozapine Indication",items:[
 {en:"Gold standard for Treatment-Resistant Schizophrenia (TRS) — defined as nonresponse to ≥ 2 distinct antipsychotic trials.",
  ar:"الكلوزابين هو الاختيار الأفضل للفصام المقاوم للعلاج (TRS)، وده معناه إن المريض معملش تحسن بعد تجربة ٢ مضاد ذهان مختلفين أو أكتر.",
  ex:"جرّبنا ريسبيريدون وأولانزابين والأعراض لسه، يبقى ده وقت الكلوزابين."},
 {en:"Uniquely reduces persistent suicidal behavior.",
  ar:"ومن مميزاته إنه لوحده بيقلل السلوك الانتحاري المستمر.",
  ex:"مريض حاول ينتحر أكتر من مرة، الكلوزابين بيحميه أكتر من باقي الأدوية."}
 ]},
 {label:"Mandatory Nursing Oversight",items:[
 {h:"ANC Monitoring",en:"ANC Monitoring: Mandatory regular blood draws for Absolute Neutrophil Count to prevent agranulocytosis.",
  ar:"لازم تسحب دم بانتظام عشان تقيس عدد الخلايا العدلة (ANC) وتمنع نقص كرات الدم البيضاء الخطير (agranulocytosis).",
  ex:"قبل ما تدّي المريض جرعة الكلوزابين، تتأكد إن تحليل الدم بتاعه (ANC) سليم."},
 {h:"GI Hypomotility",en:"GI Hypomotility: Monitor strictly for severe constipation/bowel obstruction.",
  ar:"الأمعاء بتتحرك ببطء، فراقب بدقة الإمساك الشديد وانسداد الأمعاء.",
  ex:"مريض مبيدخلش الحمام بقاله ٣ أيام وبطنه منتفخة وبيتألم، ده خطر لازم يتبلغ عنه فوراً."},
 {h:"Cardiac Vigilance",en:"Cardiac Vigilance: Watch for myocarditis signs (fever, chest pain, tachycardia) in weeks 1–4.",
  ar:"خلّي بالك من علامات التهاب عضلة القلب (myocarditis): حرارة، وألم في الصدر، وسرعة ضربات القلب، وده في الأسابيع ١ لـ ٤ من بداية الدوا.",
  ex:"مريض بدأ الكلوزابين من أسبوعين، وفجأة حرارته عالية وبيقول صدري بيوجعني، لازم تبلغ الدكتور بسرعة."}
 ]}
]},

{id:"s10",tag:"10. Third-Line Management",title:"Psychosocial Rehabilitation & Physical Health Care",groups:[{items:[
 {h:"CBTp & Skills Training",en:"Helps evaluate distressing beliefs and develop behavioral skills for community living.",
  ar:"بيساعد المريض يفحص الأفكار المخيفة اللي عنده، ويتعلم مهارات سلوكية تخليه يعيش وسط المجتمع.",
  ex:"المعالج بيقوله \"إيه الدليل إن الناس بتراقبك؟\"، وبيدرّبه إزاي يركب المواصلات ويشتري حاجته."},
 {h:"Family Psychoeducation",en:"Reduces Expressed Emotion (EE), lowers family stress, and identifies early prodromal relapse signs.",
  ar:"بيقلل الانتقاد والانفعال الزايد في البيت (EE)، وبيقلل ضغط الأسرة، وبيعرّفهم علامات الانتكاسة المبكرة (prodromal).",
  ex:"الأم تعرف إن لو ابنها بدأ ينام قليل ويتشكك تاني، تروح بيه للمتابعة بدري."},
 {h:"Cardiometabolic Health",en:"Promotes structured physical activity, nutritional support, and smoking cessation to lower CVD risks.",
  ar:"بيشجّع على نشاط بدني منتظم، ودعم غذائي، والإقلاع عن التدخين، عشان نقلل خطر أمراض القلب والأوعية.",
  ex:"تمشّي المريض ٣٠ دقيقة كل يوم، وتساعده يقلل السجاير والأكل الدسم."}
]}]},

{id:"s11",tag:"Summary Practice Directives",title:"Core Takeaways for Nursing Excellence",groups:[{items:[
 {h:"1. Prioritize Safety & Reality",en:"Validate distress without reinforcing hallucinations or delusions; de-escalate early.",
  ar:"طمّن المريض على خوفه من غير ما تؤكد الهلاوس والضلالات، وهدّي الموقف بدري.",
  ex:"تقول \"أنا مصدّق إنك خايف\"، ومتقولش \"أيوه أنا كمان سمعت الصوت\"."},
 {h:"2. Monitor Pharmacotherapy",en:"Vigilance for EPS, metabolic side effects, and strict blood protocols during Clozapine therapy.",
  ar:"خلّي عينك على الأعراض الحركية (EPS)، والآثار الجانبية الأيضية، والتزم بتحاليل الدم بدقة أثناء العلاج بالكلوزابين.",
  ex:"كل أسبوع تقيس وزنه وتتابع تحليل دمه ومعاد الحقنة."},
 {h:"3. Holistic Recovery Focus",en:"Integrate family education, social skills training, and physical cardiovascular health.",
  ar:"اربط بين تثقيف الأسرة، والتدريب على المهارات الاجتماعية، وصحة القلب والجسم.",
  ex:"مش بس نعالجه بالدوا: نعلّم أهله، ونعلّمه يتعامل مع الناس، ونخليه يتحرك."}
]}]}
];

const app=document.getElementById('app'),toc=document.getElementById('toc');
let total=0;
D.forEach(s=>{
  const sec=document.createElement('section');sec.id=s.id;
  let h=`<div class="sec-head"><span class="sec-tag">${s.tag}</span></div><h2 class="sec-title">${s.title}</h2>`;
  s.groups.forEach(g=>{
    if(g.label)h+=`<div class="group">${g.label}</div>`;
    g.items.forEach(it=>{
      total++;
      h+=`<article class="item"><div class="en">${it.h?`<b>${it.h}</b><br>`:''}${it.en}</div><div class="ar">${it.ar}</div><div class="ex exb"><span class="k">عشان تفهمها :</span>${it.ex}</div></article>`;
    });
  });
  sec.innerHTML=h;app.appendChild(sec);
  const a=document.createElement('a');a.href='#'+s.id;a.textContent=s.tag;toc.appendChild(a);
});
document.getElementById('count').textContent=total+' نقطة';

/* progress */
const prog=document.getElementById('prog');
addEventListener('scroll',()=>{const h=document.documentElement;prog.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'},{passive:true});

/* toggle examples */
const tg=document.getElementById('toggleEx');let shown=true;
tg.onclick=()=>{shown=!shown;document.querySelectorAll('.exb').forEach(e=>e.style.display=shown?'':'none');tg.textContent=shown?'إخفاء الأمثلة':'إظهار الأمثلة'};

/* theme */
const tb=document.getElementById('themeBtn');
let th;try{th=localStorage.getItem('theme')}catch(e){}
if(!th)th=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
function ap(t){th=t;document.documentElement.setAttribute('data-theme',t);tb.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}}
ap(th);tb.onclick=()=>ap(th==='dark'?'light':'dark');
</script>
