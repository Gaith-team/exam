<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--bg2:#ffe4ea;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.14);--en:#fff0f3;--ar:#fffafb;--fu:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;--fd:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--bg2:#1c0a13;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.2);--en:#2c1220;--ar:#241019}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber))}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--fd)}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:34px 20px 70px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:56px}
.hero path{fill:none;stroke:#ffd1db;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 3s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.heart{font-size:46px;display:inline-block;animation:b 1.1s infinite}
@keyframes b{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.hero h1{font:700 clamp(22px,5vw,32px) var(--fd);margin:8px 0 4px}
.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 70px}
details{background:var(--card);border:1px solid var(--bc);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 20px rgba(159,18,57,.07)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;direction:ltr}
summary::-webkit-details-marker{display:none}
.n{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;display:grid;place-items:center;font:700 14px var(--fd)}
summary h2{flex:1;font:600 15.5px/1.4 var(--fd)}
.pg{font:600 11px var(--fd);color:var(--rose);background:var(--en);border:1px solid var(--bc);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ch{color:var(--rose);transition:.25s}details[open] .ch{transform:rotate(180deg)}
.body{padding:4px 14px 16px}
.sub{font:700 14px var(--fd);color:var(--violet);margin:16px 0 10px;direction:ltr;text-align:left}
.fig{margin:12px 0;text-align:center;background:#fff;border:1px solid var(--bc);border-radius:18px;padding:10px}
.fig img{max-width:100%;height:auto;max-height:420px;border-radius:10px}
.it{margin-bottom:14px;border-radius:18px;border:1px solid var(--bc);overflow:hidden;background:var(--ar)}
.en{font:600 15px/1.75 var(--fd);padding:14px 16px;background:var(--en);direction:ltr;text-align:left;border-left:5px solid var(--rose)}
.ar{font-size:14.5px;line-height:2;padding:12px 16px;direction:rtl;text-align:right}
.ex{margin:0 12px 12px;padding:10px 14px;border-radius:14px;background:rgba(245,158,11,.12);border:1.5px dashed var(--amber);font-size:14px;line-height:1.9;color:var(--t2);direction:rtl;text-align:right}
.ex b{color:var(--amber);margin-left:4px}
footer{padding:20px;text-align:center;border-top:1px solid var(--bc);font:700 14px var(--fd)}
footer span{color:var(--rose)}footer a{display:block;margin-top:4px;font-size:12px;color:var(--violet);text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style></head><body>

var DATA=[{"t": "Endocrine System", "p": "p. 129", "i": [{"g": "i0"}, {"e": "The endocrine system is a collection of glands that produce hormones (chemical messengers).", "a": "الجهاز الصماوي (الغدد الصم) هو مجموعة غدد بتصنّع الهرمونات، والهرمونات دي رسايل كيميائية.", "x": "فكّر فيها زي مكاتب بريد في جسمك، كل غدة بتبعت جوابات (هرمونات) لأعضاء تانية."}, {"e": "These hormones pass directly into the bloodstream to control metabolism, growth and sexual development.", "a": "الهرمونات دي بتدخل على الدم علطول، وبتتحكم في الأيض (الحرق) والنمو والتطور الجنسي.", "x": "الدم هو الساعي اللي بيوصّل الجواب لكل الجسم من غير ما يعدّي على أي قناة."}, {"h": "Definition"}, {"e": "These are ductless glands which secrete hormones that pass directly into the blood and distribute to various cells of the body.", "a": "دي غدد من غير قنوات (Ductless)، بتفرز الهرمونات على الدم علطول، والدم بيوزّعها على خلايا الجسم المختلفة.", "x": "يعني الغدة مفيهاش ماسورة بتوصّل، بتصبّ الهرمون في الدم مباشرة."}, {"h": "These glands include the following"}, {"e": "1) Pituitary gland.", "a": "1) الغدة النخامية.", "x": "دي \"الغدة الرئيسية\" اللي في قاعدة الجمجمة."}, {"e": "2) Thyroid gland.", "a": "2) الغدة الدرقية.", "x": "موجودة في الرقبة قدّام."}, {"e": "3) Parathyroid glands.", "a": "3) الغدد جار الدرقية.", "x": "غدد صغيرة ورا الدرقية."}, {"e": "4) Suprarenal (Adrenal) glands.", "a": "4) الغدد الكظرية (فوق الكلى).", "x": "\"Supra\" يعني فوق، و\"Renal\" يعني كلى، يعني فوق الكلى."}, {"e": "5) Pancreas.", "a": "5) البنكرياس.", "x": "الغدة المسؤولة عن سكر الدم."}, {"e": "6) Gonads (Testis in male & ovaries in female).", "a": "6) الغدد التناسلية (الخصية عند الرجل والمبيض عند الست).", "x": "دي اللي بتتحكم في الهرمونات الجنسية."}]}, {"t": "Pituitary Gland", "p": "p. 130", "i": [{"e": "Site: It lies in a cavity at the base of the skull.", "a": "مكانها: في تجويف في قاعدة الجمجمة.", "x": "يعني متحمية جوّه العظم تحت المخ."}, {"e": "It is divided into 2 lobes, anterior lobe and posterior lobe.", "a": "بتتقسم لفصّين: فص أمامي وفص خلفي.", "x": "Anterior = قدّام، Posterior = ورا."}, {"h": "a) The anterior lobe — It secretes the following hormones"}, {"e": "TSH (Thyroid stimulating hormone): It stimulates the secretion of thyroid gland.", "a": "TSH (هرمون منبّه للدرقية): بينبّه الغدة الدرقية تفرز هرموناتها.", "x": "الاسم بيقولك وظيفته: بينبّه الـ Thyroid."}, {"e": "ACTH (Adrenocorticotrophic hormone): It stimulates the secretion of adrenal cortex.", "a": "ACTH (الهرمون المنبّه لقشرة الكظر): بينبّه قشرة الغدة الكظرية تفرز هرموناتها.", "x": "Adreno = كظر، Cortico = قشرة، يعني بينبّه قشرة الكظر."}, {"e": "FSH & LH: These control the gonadal function.", "a": "FSH و LH: بيتحكموا في شغل الغدد التناسلية.", "x": "دول هرمونات الخصوبة."}, {"e": "Prolactin: It is the hormone of milk secretion.", "a": "Prolactin (البرولاكتين): هرمون إفراز اللبن.", "x": "Pro = لصالح، Lactin = لبن، يعني بيجيب اللبن."}, {"e": "GH (Growth hormone): It controls the growth of the body (soft tissues & bones).", "a": "GH (هرمون النمو): بيتحكم في نمو الجسم (الأنسجة الرخوة والعظام).", "x": "زي الأطفال اللي بيطولوا، ده شغل هرمون النمو."}, {"e": "MSC (Melanocyte stimulating hormone): It stimulates the melanocyte.", "a": "MSC (هرمون منبّه للخلايا الصبغية): بينبّه الـ Melanocyte.", "x": "الـ Melanocyte هي الخلايا اللي بتعمل لون الجلد."}, {"h": "b) The posterior lobe — It secretes two hormones"}, {"e": "1) ADH (Antidiuretic hormone): it controls urine secretion.", "a": "1) ADH (الهرمون المضاد لإدرار البول): بيتحكم في إفراز البول.", "x": "Anti = ضد، Diuretic = مدرّ للبول، يعني بيقلّل البول ويحافظ على المية في الجسم."}, {"e": "2) Oxytocin: it starts the labour and it is responsible for milk ejection during suckling.", "a": "2) Oxytocin (الأوكسيتوسين): بيبدأ الولادة، وهو المسؤول عن نزول اللبن وقت الرضاعة.", "x": "الأوكسيتوسين بيبدأ الطلق، وبينزّل اللبن لما الطفل يرضع."}]}, {"t": "Thyroid Gland", "p": "p. 131", "i": [{"g": "i1"}, {"e": "Site: it is present in the lower anterior part of the neck.", "a": "مكانها: في الجزء الأمامي السفلي من الرقبة.", "x": "يعني قدّام الرقبة من تحت، فوق القصبة الهوائية."}, {"h": "It secretes 3 hormones"}, {"e": "1. Thyroxin (T4).", "a": "1. الثيروكسين (T4).", "x": "ده الهرمون الأساسي للدرقية."}, {"e": "2. T3.", "a": "2. T3.", "x": "شغله زي T4."}, {"e": "3. Calcitonin.", "a": "3. الكالسيتونين.", "x": "ده اللي بيخص الكالسيوم."}, {"h": "Functions of T3 & T4"}, {"e": "a) Stimulate metabolism of CHO, protein and fat.", "a": "أ) بينشّطوا أيض (حرق) الكربوهيدرات والبروتين والدهون.", "x": "يعني بيحرّكوا ماكينة الحرق في الجسم كله."}, {"e": "b) It stimulates physical, mental & sexual growth.", "a": "ب) بينشّطوا النمو الجسدي والعقلي والجنسي.", "x": "من غيرهم الطفل نموه بيتأخر."}, {"e": "c) Increase activity of various body system (CNS, CVS, GIT,…)", "a": "ج) بيزوّدوا نشاط أجهزة الجسم المختلفة (الجهاز العصبي، القلب والأوعية، الجهاز الهضمي، ...).", "x": "CNS = الجهاز العصبي المركزي، CVS = القلب والأوعية، GIT = الجهاز الهضمي."}, {"h": "Function of calcitonin"}, {"e": "It lowers the serum ionized Ca++ to its normal level.", "a": "بيخفّض الكالسيوم المتأيّن في الدم لحد مستواه الطبيعي.", "x": "لو الكالسيوم زاد، الكالسيتونين بينزّله."}]}, {"t": "Parathyroid Glands", "p": "p. 132 – 133", "i": [{"g": "i2"}, {"e": "Site: They are 4 small glands present at the back of the thyroid gland.", "a": "مكانها: 4 غدد صغيرة موجودة ورا الغدة الدرقية.", "x": "4 حبوب صغيرة لازقة في ضهر الدرقية."}, {"e": "It secretes parathyroid hormone (parathormone).", "a": "بتفرز هرمون الغدة جار الدرقية (Parathormone).", "x": "ده الهرمون الوحيد بتاعها."}, {"e": "This hormone increases the serum ionized Ca++ to its normal level via acting on bone, intestine & kidney.", "a": "الهرمون ده بيرفع الكالسيوم المتأيّن في الدم لمستواه الطبيعي عن طريق تأثيره على العظم والأمعاء والكلى.", "x": "عكس الكالسيتونين، ده بيرفع الكالسيوم."}, {"h": "N.B."}, {"e": "There are three hormones which are responsible for calcium homeostasis. They are parathyroid hormone, calcitonin and active vitamin D.", "a": "فيه 3 هرمونات مسؤولة عن اتزان الكالسيوم في الجسم: الباراثورمون، والكالسيتونين، وفيتامين D النشط.", "x": "احفظهم: Parathormone + Calcitonin + Active Vit D."}, {"h": "Calcium Homeostasis"}, {"g": "i3"}, {"h": "Parathyroid glands"}, {"e": "Site: they are 4 small glands present at the back of the thyroid gland.", "a": "مكانها: 4 غدد صغيرة ورا الغدة الدرقية.", "x": "نفس المعلومة اللي فوق."}, {"e": "It secretes parathyroid hormone (parathormone).", "a": "بتفرز هرمون الباراثورمون.", "x": "نفس المعلومة اللي فوق."}, {"e": "This hormone increases the serum ionized Ca+ to its normal level via acting on bone, intestine & kidney. N.B. there are three hormones which are responsible for calcium homeostasis. They are parathyroid hormone, calcitonin and active vitamin D.", "a": "الهرمون ده بيرفع الكالسيوم المتأيّن في الدم لمستواه الطبيعي عن طريق تأثيره على العظم والأمعاء والكلى. ولاحظ: فيه 3 هرمونات مسؤولة عن اتزان الكالسيوم، وهم الباراثورمون والكالسيتونين وفيتامين D النشط.", "x": "نفس الفكرة اللي فوق، المحاضرة كررتها."}]}, {"t": "Suprarenal (Adrenal) Gland", "p": "p. 134 – 135", "i": [{"g": "i4"}, {"h": "Site"}, {"e": "It is present in the upper part of both kidneys.", "a": "مكانها: في الجزء العلوي من الكليتين الاتنين.", "x": "زي طاقية فوق كل كلية."}, {"e": "It is formed of 2 zones, outer cortex and inner medulla.", "a": "بتتكوّن من منطقتين: القشرة (برّه) واللب (جوّه).", "x": "Cortex = القشرة الخارجية، Medulla = اللب الداخلي."}, {"h": "a) Adrenal cortex secrete"}, {"e": "1. Aldosterone; is a mineralocorticoid hormone that plays a central role in regulating blood pressure and the levels of sodium and potassium (electrolytes) in blood.", "a": "1. الألدوستيرون: هرمون معدني قشري (Mineralocorticoid)، ليه دور أساسي في تنظيم ضغط الدم ومستوى الصوديوم والبوتاسيوم (الأملاح) في الدم.", "x": "الألدوستيرون بتاع الملح والمية، وبيظبط الضغط."}, {"e": "2. Cortisol; is a glucocorticoid hormone that plays several important roles.", "a": "2. الكورتيزول: هرمون سكري قشري (Glucocorticoid)، ليه أدوار مهمة كتير.", "x": "\"Gluco\" يعني سكر، فهو مرتبط بالسكر."}, {"e": "- It helps control body’s use of fats, proteins and carbohydrates.", "a": "- بيساعد في التحكم في استخدام الجسم للدهون والبروتينات والكربوهيدرات.", "x": "بيظبط الجسم يستخدم الأكل إزاي."}, {"e": "- It also suppresses inflammation, regulates blood pressure, increases blood sugar and helps control sleep-wake cycle.", "a": "- كمان بيقلّل الالتهاب، وبينظّم ضغط الدم، وبيرفع سكر الدم، وبيساعد في التحكم في دورة النوم والصحيان.", "x": "عشان كده الكورتيزون بيتادّي في الالتهابات."}, {"e": "3. Sex hormones.", "a": "3. الهرمونات الجنسية.", "x": "القشرة بتفرز كمان هرمونات جنسية."}, {"h": "b) Adrenal medulla secretes"}, {"e": "1. Adrenaline.", "a": "1. الأدرينالين.", "x": "هرمون الخوف والانفعال."}, {"e": "2. Noradrenaline.", "a": "2. النورأدرينالين.", "x": "قريب جدًا من الأدرينالين."}, {"e": "Adrenaline (epinephrine) and noradrenaline (norepinephrine). These hormones are known as the “fight or flight” hormones and are called catecholamines.", "a": "الأدرينالين (إبينفرين) والنورأدرينالين (نوربينفرين). الهرمونات دي معروفة باسم هرمونات \"اضرب أو اهرب\"، واسمها الكاتيكولامينات.", "x": "لما تتخض أو تتعصب قلبك بيدق، ده شغلهم."}, {"e": "- Adrenaline and noradrenaline are capable of increasing heart rate and force of heart contractions, increasing blood flow to muscles and brain and assisting in glucose metabolism.", "a": "- الأدرينالين والنورأدرينالين بيزوّدوا معدل ضربات القلب وقوة انقباضه، وبيزوّدوا تدفق الدم للعضلات والمخ، وبيساعدوا في أيض الجلوكوز.", "x": "الجسم بيجهّز نفسه للجري أو المواجهة: قلب أسرع وعضلات ومخ أحسن في الدم."}, {"e": "- They also control the squeezing of blood vessels (vasoconstriction), which helps maintain blood pressure. Adrenal glands often release these hormones, like other adrenal hormones.", "a": "- كمان بيتحكموا في انقباض الأوعية الدموية (Vasoconstriction) وده بيساعد على الحفاظ على ضغط الدم. والغدد الكظرية غالبًا بتفرز الهرمونات دي، زي باقي هرموناتها.", "x": "الأوعية بتضيق فالضغط يفضل ثابت."}]}, {"t": "Pancreas", "p": "p. 136 – 137", "i": [{"g": "i5"}, {"h": "Endocrine function of pancreas"}, {"e": "Its main function is to regulate blood glucose level.", "a": "وظيفتها الأساسية تنظيم مستوى جلوكوز الدم.", "x": "يعني هي اللي بتظبط السكر في الدم."}, {"e": "It secretes 3 hormones:", "a": "بتفرز 3 هرمونات:", "x": "هنشوفهم تحت."}, {"e": "(1) Insulin: is secreted by beta cells of pancreas. - It lowers the blood glucose level when increased.", "a": "(1) الإنسولين: بتفرزه الخلايا بيتا في البنكرياس. - بيخفّض مستوى جلوكوز الدم لما يزيد.", "x": "لو السكر عالي، الإنسولين بينزّله."}, {"e": "(2) Glucagon: is secreted by alpha cells of pancreas. It raises the blood glucose level when decreased.", "a": "(2) الجلوكاجون: بتفرزه الخلايا ألفا في البنكرياس. بيرفع مستوى جلوكوز الدم لما يقل.", "x": "لو السكر واطي، الجلوكاجون بيرفعه، يعني عكس الإنسولين."}, {"e": "(3) Somatostatin.", "a": "(3) السوماتوستاتين.", "x": "الهرمون التالت للبنكرياس."}, {"h": "Homeostasis of blood glucose"}, {"e": "- It is the pancreas’s function of maintaining stable blood sugar levels within a narrow range using the hormones insulin and glucagon.", "a": "- ده شغل البنكرياس في الحفاظ على مستوى سكر الدم ثابت في نطاق ضيق باستخدام هرموني الإنسولين والجلوكاجون.", "x": "زي ترموستات التكييف، بيحافظ على درجة ثابتة."}, {"e": "- Insulin lowers blood glucose by signaling cells to absorb and store it as glycogen, while glucagon raises it by prompting the liver to release stored glucose.", "a": "- الإنسولين بيخفّض الجلوكوز لأنه بيدّي إشارة للخلايا تمتصه وتخزّنه على شكل جلايكوجين، أما الجلوكاجون فبيرفعه لأنه بيحفّز الكبد يطلّع الجلوكوز المخزّن.", "x": "الإنسولين بيخزّن، والجلوكاجون بيطلّع من المخزن."}, {"e": "- This dynamic hormonal balance counteracts fluctuations from eating or fasting, ensuring the body’s cells receive a consistent energy supply.", "a": "- التوازن الهرموني ده بيقاوم تغيّرات السكر بعد الأكل أو الصيام، وبيضمن إن خلايا الجسم تاخد طاقة ثابتة.", "x": "سواء أكلت أو صمت، الخلايا بتاخد طاقتها."}, {"g": "i6"}, {"h": "Homeostasis of blood glucose level"}]}, {"t": "Endocrine System Hormones", "p": "p. 138 – 139", "i": [{"e": "Hormones are the chemicals the endocrine system uses to send messages to organs and tissue throughout the body. Once released into the bloodstream, hormones travel to their target organ or tissue, which has receptors that recognize and react to the hormone.", "a": "الهرمونات مواد كيميائية بيستخدمها الجهاز الصماوي يبعت بيها رسايل للأعضاء والأنسجة في الجسم كله. أول ما تنزل على الدم، بتروح للعضو أو النسيج المستهدف، وده عنده مستقبلات (Receptors) بتتعرّف على الهرمون وتتفاعل معاه.", "x": "الهرمون زي المفتاح، والمستقبل زي القفل، ولازم يتطابقوا."}, {"e": "Below are some examples of hormones that are produced by the endocrine system.", "a": "تحت أمثلة على هرمونات بينتجها الجهاز الصماوي.", "x": "الجدول جاي في اللي بعده."}, {"e": "Adrenaline — Secreting gland(s): adrenal. Function: increases blood pressure, heart rate, and metabolism in reaction to stress.", "a": "الهرمون: Adrenaline | الغدة المفرزة: adrenal. الوظيفة: بيرفع ضغط الدم وضربات القلب والأيض كرد فعل للتوتر.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Aldosterone — Secreting gland(s): adrenal. Function: controls the body’s salt and water balance.", "a": "الهرمون: Aldosterone | الغدة المفرزة: adrenal. الوظيفة: بيتحكم في توازن الملح والمية في الجسم.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Cortisol — Secreting gland(s): adrenal. Function: plays a role in stress response.", "a": "الهرمون: Cortisol | الغدة المفرزة: adrenal. الوظيفة: ليه دور في الاستجابة للتوتر.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Dehydroepiandrosterone sulfate (DHEA-S) — Secreting gland(s): adrenal. Function: aids in production of body odor and growth of body hair during puberty.", "a": "الهرمون: Dehydroepiandrosterone sulfate (DHEA-S) | الغدة المفرزة: adrenal. الوظيفة: بيساعد في ظهور رائحة الجسم ونمو شعر الجسم وقت البلوغ.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Estrogen — Secreting gland(s): ovary. Function: works to regulate the menstrual cycle, maintain pregnancy, and develop female sex characteristics; aids in sperm production.", "a": "الهرمون: Estrogen | الغدة المفرزة: ovary. الوظيفة: بينظّم الدورة الشهرية، وبيحافظ على الحمل، وبيكوّن الصفات الأنثوية، وبيساعد في إنتاج الحيوانات المنوية.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Follicle-stimulating hormone (FSH) — Secreting gland(s): pituitary. Function: controls the production of eggs and sperm.", "a": "الهرمون: Follicle-stimulating hormone (FSH) | الغدة المفرزة: pituitary. الوظيفة: بيتحكم في إنتاج البويضات والحيوانات المنوية.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Glucagon — Secreting gland(s): pancreas. Function: helps increase levels of blood glucose (blood sugar).", "a": "الهرمون: Glucagon | الغدة المفرزة: pancreas. الوظيفة: بيساعد في رفع مستوى جلوكوز الدم (سكر الدم).", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Insulin — Secreting gland(s): pancreas. Function: helps reduce your blood glucose levels.", "a": "الهرمون: Insulin | الغدة المفرزة: pancreas. الوظيفة: بيساعد في تقليل مستوى جلوكوز الدم.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Luteinizing hormone (LH) — Secreting gland(s): pituitary. Function: controls estrogen and testosterone production as well as ovulation.", "a": "الهرمون: Luteinizing hormone (LH) | الغدة المفرزة: pituitary. الوظيفة: بيتحكم في إنتاج الإستروجين والتستوستيرون وكمان في التبويض.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Melatonin — Secreting gland(s): pineal. Function: controls sleep-wake cycles.", "a": "الهرمون: Melatonin | الغدة المفرزة: pineal. الوظيفة: بيتحكم في دورات النوم والصحيان.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Oxytocin — Secreting gland(s): pituitary. Function: helps with lactation, childbirth, and mother-child bonding.", "a": "الهرمون: Oxytocin | الغدة المفرزة: pituitary. الوظيفة: بيساعد في الرضاعة والولادة والترابط بين الأم وطفلها.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Parathyroid hormone — Secreting gland(s): parathyroid. Function: controls calcium levels in bones and blood.", "a": "الهرمون: Parathyroid hormone | الغدة المفرزة: parathyroid. الوظيفة: بيتحكم في مستوى الكالسيوم في العظام والدم.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Progesterone — Secreting gland(s): ovary. Function: helps prepare the body for pregnancy when an egg is fertilized.", "a": "الهرمون: Progesterone | الغدة المفرزة: ovary. الوظيفة: بيساعد في تجهيز الجسم للحمل لما البويضة تتلقّح.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Prolactin — Secreting gland(s): pituitary. Function: promotes breast-milk production.", "a": "الهرمون: Prolactin | الغدة المفرزة: pituitary. الوظيفة: بيحفّز إنتاج لبن الثدي.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Testosterone — Secreting gland(s): ovary, teste, adrenal. Function: contributes to sex drive and body density in males and females as well as development of male sex characteristics.", "a": "الهرمون: Testosterone | الغدة المفرزة: ovary, teste, adrenal. الوظيفة: بيساهم في الرغبة الجنسية وكثافة الجسم عند الرجال والستات، وفي تكوين الصفات الذكورية.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}, {"e": "Thyroid hormone — Secreting gland(s): thyroid. Function: helps control several body functions, including the rate of metabolism and energy levels.", "a": "الهرمون: Thyroid hormone | الغدة المفرزة: thyroid. الوظيفة: بيساعد في التحكم في وظايف كتير في الجسم، منها معدل الأيض ومستوى الطاقة.", "x": "ركّز على الغدة اللي بتفرزه ووظيفته."}]}];
