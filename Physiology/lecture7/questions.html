<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.16);--en:#fff0f3;--ok:#16a34a;--no:#dc2626;--fd:'Space Grotesk',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.22);--en:#2c1220;--ok:#4ade80;--no:#f87171}
body{font-family:var(--fd);background:var(--bg);color:var(--text);min-height:100vh}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber));transition:width .3s}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:28px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero h1{font-size:clamp(21px,5vw,30px);margin:6px 0 4px}.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--card);border:1px solid var(--bc);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(159,18,57,.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.chip{padding:9px 16px;border-radius:30px;border:1px solid var(--bc);background:var(--en);color:var(--text);font:600 13px var(--fd);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border-color:transparent}
.btn{padding:12px 26px;border-radius:30px;border:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;font:700 14px var(--fd);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-bottom:12px;font-weight:600}
.q{font-size:17px;line-height:1.6;font-weight:600;margin-bottom:14px;border-left:5px solid var(--rose);padding-left:12px}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:var(--en);border:1px solid var(--bc);color:var(--rose);margin-bottom:8px}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border-radius:14px;border:1.5px solid var(--bc);background:var(--en);color:var(--text);font:500 15px/1.5 var(--fd);cursor:pointer}
.o b{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--card);border:1px solid var(--bc);font-size:12px}
.o.ok{border-color:var(--ok);background:rgba(22,163,74,.14)}.o.no{border-color:var(--no);background:rgba(220,38,38,.12)}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:30px;font-weight:700}
.ring span{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.rv{padding:10px 12px;border-radius:12px;border:1px solid var(--bc);margin-bottom:8px;font-size:14px;line-height:1.6;text-align:left}
.rv i{color:var(--ok);font-style:normal;font-weight:600}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style></head><body>
<div id="pb"></div>
<nav><div class="brand"><div class="logo">GT</div>GHAITH TEAM</div><button class="tb" id="tb" aria-label="Toggle theme">🌙</button></nav>
<div class="hero"><div style="font-size:42px">🫀</div><h1>Endocrine System</h1><p> Physiology</p></div>
<div class="shell" id="app"></div>
<script>var MCQ=[
{t:"Endocrine glands are described as:",o:["Ducted glands","Ductless glands","Exocrine glands","Sweat glands"],a:1},
{t:"Hormones produced by endocrine glands pass directly into the:",o:["Lymph","Bile duct","Bloodstream","Urine"],a:2},
{t:"Which of the following is NOT one of the endocrine glands listed in the lecture?",o:["Salivary gland","Pituitary gland","Thyroid gland","Pancreas"],a:0},
{t:"The pituitary gland lies in:",o:["The lower anterior part of the neck","The upper part of both kidneys","The back of the thyroid gland","A cavity at the base of the skull"],a:3},
{t:"The pituitary gland is divided into how many lobes?",o:["One","Two","Three","Four"],a:1},
{t:"TSH from the anterior pituitary:",o:["Controls urine secretion","Stimulates the adrenal cortex","Stimulates the secretion of the thyroid gland","Is the hormone of milk secretion"],a:2},
{t:"ACTH stimulates the secretion of the:",o:["Thyroid gland","Gonads","Melanocytes","Adrenal cortex"],a:3},
{t:"Prolactin is the hormone responsible for:",o:["Milk secretion","Milk ejection","Urine control","Growth of bones"],a:0},
{t:"Growth hormone (GH) controls the growth of:",o:["Urine output","Soft tissues and bones","Gonadal function","Calcium level"],a:1},
{t:"FSH and LH control the function of the:",o:["Thyroid gland","Adrenal cortex","Gonads","Posterior pituitary"],a:2},
{t:"Which hormones are secreted by the posterior lobe of the pituitary?",o:["TSH and ACTH","GH and prolactin","FSH and LH","ADH and oxytocin"],a:3},
{t:"ADH (antidiuretic hormone) controls:",o:["Urine secretion","Blood glucose","Calcium level","Sleep-wake cycle"],a:0},
{t:"Oxytocin is responsible for:",o:["Milk production only","Starting labour and milk ejection during suckling","Raising blood glucose","Lowering serum calcium"],a:1},
{t:"The three hormones secreted by the thyroid gland are:",o:["T3, T4 and insulin","T4, calcitonin and parathormone","T4, T3 and calcitonin","T3, glucagon and calcitonin"],a:2},
{t:"Functions of T3 and T4 include:",o:["Lowering serum calcium","Controlling urine secretion","Raising blood glucose only","Stimulating metabolism of CHO, protein and fat"],a:3},
{t:"Calcitonin:",o:["Lowers serum ionized Ca++ to its normal level","Raises serum ionized Ca++","Raises blood glucose","Stimulates metabolism of fat"],a:0},
{t:"The parathyroid glands are:",o:["Two glands in front of the thyroid","Four small glands at the back of the thyroid","Four glands above the kidneys","Two glands at the base of the skull"],a:1},
{t:"Parathyroid hormone raises serum ionized calcium by acting on:",o:["Bone, liver and kidney","Bone, pancreas and intestine","Bone, intestine and kidney","Liver, intestine and skin"],a:2},
{t:"Which three hormones are responsible for calcium homeostasis?",o:["Parathyroid hormone, insulin and vitamin D","Calcitonin, aldosterone and parathyroid hormone","Parathyroid hormone, glucagon and calcitonin","Parathyroid hormone, calcitonin and active vitamin D"],a:3},
{t:"The adrenal gland is formed of:",o:["Outer cortex and inner medulla","Anterior and posterior lobes","Right and left lobes","Alpha and beta zones"],a:0},
{t:"Aldosterone is classified as a:",o:["Glucocorticoid","Mineralocorticoid","Catecholamine","Sex hormone"],a:1},
{t:"Aldosterone plays a central role in regulating:",o:["Calcium and phosphate levels","Glucose and glycogen","Blood pressure and sodium and potassium levels","Sleep-wake cycle and growth"],a:2},
{t:"Cortisol is a:",o:["Mineralocorticoid","Catecholamine","Pancreatic hormone","Glucocorticoid"],a:3},
{t:"Which of the following is NOT a function of cortisol?",o:["Lowering blood sugar","Suppressing inflammation","Increasing blood sugar","Helping control the sleep-wake cycle"],a:0},
{t:"The adrenal medulla secretes:",o:["Aldosterone and cortisol","Adrenaline and noradrenaline","Cortisol and sex hormones","Insulin and glucagon"],a:1},
{t:"Adrenaline and noradrenaline, called catecholamines, are known as the:",o:["Rest and digest hormones","Growth hormones","Fight or flight hormones","Sleep-wake hormones"],a:2},
{t:"Which of the following is NOT an effect of adrenaline and noradrenaline?",o:["Increased heart rate","Increased blood flow to muscles and brain","Vasoconstriction helping maintain blood pressure","Decreased force of heart contractions"],a:3},
{t:"Insulin is secreted by:",o:["Beta cells of the pancreas","Alpha cells of the pancreas","Melanocytes","Cells of the adrenal medulla"],a:0},
{t:"Glucagon is secreted by:",o:["Beta cells of the pancreas","Alpha cells of the pancreas","The adrenal cortex","The anterior pituitary"],a:1},
{t:"Insulin lowers blood glucose by signaling cells to:",o:["Release glucose","Break down glycogen","Stop absorbing glucose","Absorb glucose and store it as glycogen"],a:3},
{t:"Glucagon raises blood glucose by prompting the:",o:["Muscles to store glucose","Beta cells to release insulin","Liver to release stored glucose","Kidney to excrete glucose"],a:2},
{t:"According to the homeostasis diagram, the normal blood glucose level is:",o:["70 - 130 mg/dl","20 - 50 mg/dl","200 - 300 mg/dl","150 - 250 mg/dl"],a:0},
{t:"A patient's blood glucose level falls below normal. Which response restores it?",o:["Insulin released by beta cells","Glucagon released by alpha cells","Calcitonin released by the thyroid","ADH released by the posterior pituitary"],a:1},
{t:"Which gland secretes melatonin, which controls sleep-wake cycles?",o:["Pituitary","Thyroid","Pineal","Adrenal"],a:2},
{t:"Which gland-hormone pair is correct?",o:["Estrogen - pituitary","Prolactin - ovary","DHEA-S - pancreas","Oxytocin - pituitary"],a:3}
];
/* ===== True / False (15) - a:0 = True, a:1 = False ===== */
var TF=[
{t:"Endocrine glands release their hormones through ducts.",o:["True","False"],a:1},
{t:"The pituitary gland lies in a cavity at the base of the skull.",o:["True","False"],a:0},
{t:"ADH is secreted by the anterior lobe of the pituitary gland.",o:["True","False"],a:1},
{t:"Oxytocin starts labour and is responsible for milk ejection during suckling.",o:["True","False"],a:0},
{t:"Calcitonin raises the serum ionized calcium level.",o:["True","False"],a:1},
{t:"There are four parathyroid glands, present at the back of the thyroid gland.",o:["True","False"],a:0},
{t:"Parathyroid hormone, calcitonin and active vitamin D are responsible for calcium homeostasis.",o:["True","False"],a:0},
{t:"Aldosterone is a glucocorticoid hormone.",o:["True","False"],a:1},
{t:"Adrenaline and noradrenaline are secreted by the adrenal medulla.",o:["True","False"],a:0},
{t:"Cortisol lowers blood sugar.",o:["True","False"],a:1},
{t:"Insulin is secreted by the alpha cells of the pancreas.",o:["True","False"],a:1},
{t:"Glucagon raises the blood glucose level when it decreases.",o:["True","False"],a:0},
{t:"Insulin prompts the liver to release stored glucose.",o:["True","False"],a:1},
{t:"Melatonin is secreted by the pineal gland and controls sleep-wake cycles.",o:["True","False"],a:0},
{t:"Luteinizing hormone (LH) is secreted by the ovary.",o:["True","False"],a:1}

];
MCQ.forEach(function(q){q.k='MCQ'});TF.forEach(function(q){q.k='T/F'});
var app=document.getElementById('app'),mode='all',shuf=false,qs=[],i=0,sc=0,wr=[],lock=false,sec=0,tm;
function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function home(){clearInterval(tm);document.getElementById('pb').style.width='0';
app.innerHTML='<div class="card"><div class="row" style="margin-bottom:14px"><button class="chip'+(mode=='all'?' on':'')+'" data-m="all">All</button><button class="chip'+(mode=='MCQ'?' on':'')+'" data-m="MCQ">MCQ</button><button class="chip'+(mode=='T/F'?' on':'')+'" data-m="T/F">True / False</button></div><div class="row" style="margin-bottom:18px"><button class="chip'+(shuf?' on':'')+'" id="sf">🔀 Shuffle questions</button></div><div class="row"><button class="btn" id="go">Start Quiz</button></div></div>';
app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;home()}});
document.getElementById('sf').onclick=function(){shuf=!shuf;home()};
document.getElementById('go').onclick=function(){start(mode=='all'?MCQ.concat(TF):mode=='MCQ'?MCQ:TF)}}
function start(list){qs=shuf?sh(list):list.slice();i=0;sc=0;wr=[];sec=0;clearInterval(tm);tm=setInterval(function(){sec++;var e=document.getElementById('tt');if(e)e.textContent=fm(sec)},1000);show()}
function fm(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function show(){lock=false;var q=qs[i];document.getElementById('pb').style.width=(i/qs.length*100)+'%';
var h='<div class="card"><div class="meta"><span>Question '+(i+1)+' / '+qs.length+'</span><span>Score '+sc+'</span><span>⏱ <b id="tt">'+fm(sec)+'</b></span></div><span class="tag">'+q.k+'</span><div class="q">'+q.t+'</div>';
q.o.forEach(function(o,j){h+='<button class="o" data-j="'+j+'"><b>'+(q.k=='MCQ'?'ABCD'[j]:j?'F':'T')+'</b>'+o+'</button>'});
h+='<div class="row" style="margin-top:12px"><button class="btn" id="nx" disabled>'+(i==qs.length-1?'Finish':'Next')+'</button></div></div>';
app.innerHTML=h;
app.querySelectorAll('.o').forEach(function(b){b.onclick=function(){if(lock)return;lock=true;var j=+b.dataset.j,bs=app.querySelectorAll('.o');
bs[q.a].classList.add('ok');if(j==q.a)sc++;else{b.classList.add('no');wr.push(q)}document.getElementById('nx').disabled=false}});
document.getElementById('nx').onclick=function(){i++;i<qs.length?show():end()}}
function end(){clearInterval(tm);document.getElementById('pb').style.width='100%';var p=Math.round(sc/qs.length*100);
var h='<div class="card" style="text-align:center"><h2>'+(p>=85?'Excellent! 🎉':p>=60?'Good job 👍':'Keep studying 📚')+'</h2><div class="ring" style="background:conic-gradient(var(--rose) '+p+'%,var(--en) 0)"><span>'+p+'%</span></div><p style="color:var(--t2);margin-bottom:14px">'+sc+' / '+qs.length+' correct · ⏱ '+fm(sec)+'</p><div class="row">';
if(wr.length)h+='<button class="btn" id="rt">Retry wrong ('+wr.length+')</button>';
h+='<button class="chip" id="hm">Home</button></div></div>';
if(wr.length){h+='<div class="card"><b>Review</b><div style="margin-top:10px">';wr.forEach(function(q){h+='<div class="rv">'+q.t+'<br><i>✔ '+q.o[q.a]+'</i></div>'});h+='</div></div>'}
app.innerHTML=h;if(wr.length)document.getElementById('rt').onclick=function(){start(wr.slice())};document.getElementById('hm').onclick=home}
var b=document.getElementById('tb'),t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}
function ap(x){t=x;document.documentElement.setAttribute('data-theme',x==='dark'?'dark':'');b.textContent=x==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',x)}catch(e){}}
ap(t);b.onclick=function(){ap(t==='dark'?'light':'dark')};home();
</script></body></html>
