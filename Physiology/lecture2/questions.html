<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.16);--en:#fff0f3;--ok:#16a34a;--no:#dc2626;--fd:'Space Grotesk',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.22);--en:#2c1220;--ok:#4ade80;--no:#f87171}
body{font-family:var(--fd);background:var(--bg);color:var(--text);min-height:100vh}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber));transition:width .3s}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:28px 20px;text-align:center;color:#fff;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero h1{font-size:clamp(21px,5vw,30px);margin:6px 0 4px}.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--card);border:1px solid var(--bc);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 20px rgba(159,18,57,.07)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center}
.chip{padding:9px 16px;border-radius:30px;border:1px solid var(--bc);background:var(--en);color:var(--text);font:600 13px var(--fd);cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border-color:transparent}
.btn{padding:12px 26px;border-radius:30px;border:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;font:700 14px var(--fd);cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-bottom:12px;font-weight:600}
.q{font-size:17px;line-height:1.6;font-weight:600;margin-bottom:14px;border-left:5px solid var(--rose);padding-left:12px}
.tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;background:var(--en);border:1px solid var(--bc);color:var(--rose);margin-bottom:8px}
.o{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px 14px;margin-bottom:9px;border-radius:14px;border:1.5px solid var(--bc);background:var(--en);color:var(--text);font:500 15px/1.5 var(--fd);cursor:pointer}
.o b{width:26px;height:26px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;background:var(--card);border:1px solid var(--bc);font-size:12px}
.o.ok{border-color:var(--ok);background:rgba(22,163,74,.14)}.o.no{border-color:var(--no);background:rgba(220,38,38,.12)}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;font-size:30px;font-weight:700}
.ring span{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center}
.rv{padding:10px 12px;border-radius:12px;border:1px solid var(--bc);margin-bottom:8px;font-size:14px;line-height:1.6;text-align:left}
.rv i{color:var(--ok);font-style:normal;font-weight:600}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style></head><body>
<div id="pb"></div>
<nav><div class="brand"><div class="logo">GT</div>GHAITH TEAM</div><button class="tb" id="tb" aria-label="Toggle theme">🌙</button></nav>
<div class="hero"><div style="font-size:42px">🫀</div><h1>Nervous System</h1><p> Physiology</p></div>
<div class="shell" id="app"></div>
<script>
var MCQ=[
{t:"What is the structural unit of the nervous system?",o:["Reflex arc","Neuron","Synapse","Ganglion"],a:1},
{t:"The central nervous system (CNS) is formed of:",o:["Cranial and spinal nerves","Brain and ganglia","Brain and spinal cord","Brain and cranial nerves"],a:2},
{t:"How many segments form the cervical region of the spinal cord?",o:["8","12","5","1"],a:0},
{t:"How many pairs of cranial nerves arise from the brain?",o:["8","10","31","12"],a:3},
{t:"Which neuron process carries nerve impulses toward the cell body?",o:["Axon","Dendrite","Myelin sheath","Synaptic knob"],a:1},
{t:"Bipolar neurons are found mainly in the:",o:["Brain and spinal cord","Outside the brain and spinal cord","Ear, eyes and nose","Autonomic ganglia only"],a:2},
{t:"Afferent neurons are also known as:",o:["Sensory neurons","Motor neurons","Interneurons","Neuroglial cells"],a:0},
{t:"Each cerebral hemisphere controls the functions of:",o:["The same side of the body","Both sides equally","The opposite side of the body","Only the face"],a:2},
{t:"The space separating the presynaptic terminal from the postsynaptic membrane is the:",o:["Node of Ranvier","Synaptic cleft","Axon hillock","Autonomic ganglion"],a:1},
{t:"Dilatation of the pupil is produced by stimulation of the:",o:["Sympathetic nervous system","Parasympathetic nervous system","Somatic nervous system","Both equally"],a:0},
{t:"Which of the following is a component of the brain stem?",o:["Cerebellum","Cerebral hemisphere","Spinal cord","Pons"],a:3},
{t:"Neurons that lie entirely within the brain or spinal cord and direct incoming sensory impulses are:",o:["Sensory neurons","Motor neurons","Interneurons","Unipolar neurons"],a:2},
{t:"Neuroglial cells provide:",o:["Generation of action potentials","Physical support, insulation (myelin) and nutrients for neurons","Release of neurotransmitters","Sensing of stimuli"],a:1},
{t:"Which reflex arc component organizes the response to the stimulus?",o:["Center","Receptor","Effector organ","Afferent neuron"],a:0},
{t:"Which of the following is a conditioned (acquired) reflex?",o:["Withdrawal of the hand from a hot object","Salivation when food is placed in the mouth","Contraction of a skeletal muscle in response to pain","Salivation on hearing a sound always associated with food"],a:3},
{t:"In an axo-somatic synapse, the presynaptic terminals end on the:",o:["Dendrite","Cell body (soma)","Axon","Myelin sheath"],a:1},
{t:"Which ion enters the synaptic knob and leads to release of the chemical transmitter?",o:["Sodium","Potassium","Calcium","Chloride"],a:2},
{t:"Which of the following is NOT a way of removing the chemical transmitter from the synapse?",o:["Synthesis of more transmitter in the cleft","Diffusion away from the receptors","Enzymatic inactivation","Active reuptake into the synaptic knob"],a:0},
{t:"Ganglia are:",o:["Clusters of axons","Clusters of nerve cell bodies","Bundles of dendrites","A type of neuroglial cell"],a:1},
{t:"The cell body of the postganglionic neuron is located:",o:["Inside the CNS","In the spinal cord","In the autonomic ganglia","Inside the effector organ"],a:2},
{t:"Which ganglia are present along both sides of the vertebral column?",o:["Collateral ganglia","Terminal ganglia","Parasympathetic ganglia","Lateral ganglia"],a:3},
{t:"The sympathetic nervous system has which outflow?",o:["Thoraco-lumbar","Cranio-sacral","Cervico-sacral","Cranio-thoracic"],a:0},
{t:"Which cranial nerves carry parasympathetic fibers?",o:["I, II, V and VIII","III, VII, IX and X","IV, VI, XI and XII","II, V, VIII and XI"],a:1},
{t:"The sacral parasympathetic outflow arises from segments:",o:["S1, S2 and S3","L1 to L3","S2, S3 and S4","S3, S4 and S5"],a:2},
{t:"Acetylcholine is released at the end of:",o:["Most sympathetic postganglionic fibers","The adrenal medulla","Sympathetic fibers to the heart","All preganglionic fibers (sympathetic and parasympathetic)"],a:3},
{t:"Which combination describes the sympathetic effect on the gastrointestinal tract?",o:["Contraction of the wall and relaxation of the sphincters","Increased secretions and defecation","Vasodilatation of GIT vessels and increased motility","Relaxation of the wall, contraction of the sphincters and vasoconstriction of GIT vessels"],a:3},
{t:"Sympathetic stimulation causes the coronary blood vessels to undergo:",o:["Vasodilatation","Vasoconstriction","No change","Intermittent spasm"],a:0},
{t:"The adrenal medulla secretes mainly:",o:["Adrenaline 20% and noradrenaline 80%","Acetylcholine 100%","Adrenaline 80% and noradrenaline 20%","Noradrenaline only"],a:2},
{t:"Sympathetic postganglionic fibers that release acetylcholine supply the:",o:["Heart and bronchi","Pupil and GIT","Liver and urinary bladder","Sweat glands and blood vessels of skeletal muscles"],a:3},
{t:"Which statement comparing the two divisions of the ANS is correct?",o:["Sympathetic is anabolic and parasympathetic is catabolic","Parasympathetic activity may be restricted to a certain organ, while sympathetic activity is usually generalized","Sympathetic activity predominates during sleep","Parasympathetic has a thoraco-lumbar outflow"],a:1},
{t:"Which neuron has its cell body inside the CNS and its axon ending at an autonomic ganglion?",o:["Postganglionic neuron","Sensory neuron","Interneuron","Preganglionic neuron"],a:3},
{t:"Collateral ganglia are mixed and are located:",o:["Inside the effector organ","Along the vertebral column","At the beginning of the big arteries","Within the spinal cord"],a:2},
{t:"Which ganglia are only parasympathetic and lie inside the effector organ?",o:["Terminal ganglia","Lateral ganglia","Collateral ganglia","Sympathetic chain ganglia"],a:0},
{t:"Sympathetic stimulation of the urinary system causes:",o:["Increased urine output and micturition","Relaxation of the wall, contraction of the sphincters and delayed bladder emptying","Contraction of the wall and relaxation of the sphincters","No effect on the bladder"],a:1},
{t:"Which tissue has no spontaneous activity and depends on the somatic nerve to initiate its activity?",o:["Skeletal muscle","Cardiac muscle","Smooth muscle","Secretory glands"],a:0}
];
var TF=[
{t:"The sympathetic nervous system is catabolic (energy consuming).",o:["True","False"],a:0},
{t:"The axon carries nerve impulses toward the cell body.",o:["True","False"],a:1},
{t:"Thirty-one pairs of spinal nerves arise from the spinal cord, one pair from each spinal segment.",o:["True","False"],a:0},
{t:"Unipolar neurons are found inside the brain and spinal cord.",o:["True","False"],a:1},
{t:"The efferent neuron of the reflex arc carries impulses from the receptor to the center.",o:["True","False"],a:1},
{t:"Arrival of an action potential at the synaptic knob opens voltage-gated calcium channels.",o:["True","False"],a:0},
{t:"The parasympathetic nervous system has a thoraco-lumbar outflow.",o:["True","False"],a:1},
{t:"Lateral ganglia are only sympathetic.",o:["True","False"],a:0},
{t:"Acetylcholine is the main transmitter at the end of most sympathetic postganglionic fibers.",o:["True","False"],a:1},
{t:"The somatic nervous system has a wide origin, while the autonomic nervous system has a limited origin.",o:["True","False"],a:0},
{t:"Parasympathetic stimulation inhibits the desire for defecation.",o:["True","False"],a:1},
{t:"The preganglionic neuron has its cell body inside the CNS.",o:["True","False"],a:0},
{t:"Skeletal muscle has spontaneous activity without nerve supply.",o:["True","False"],a:1},
{t:"During sleep, parasympathetic activity takes the upper hand.",o:["True","False"],a:0},
{t:"The cerebellum is part of the brain stem.",o:["True","False"],a:1}
];
MCQ.forEach(function(q){q.k='MCQ'});TF.forEach(function(q){q.k='T/F'});
var app=document.getElementById('app'),mode='all',shuf=false,qs=[],i=0,sc=0,wr=[],lock=false,sec=0,tm;
function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[k];a[k]=t}return a}
function home(){clearInterval(tm);document.getElementById('pb').style.width='0';
app.innerHTML='<div class="card"><div class="row" style="margin-bottom:14px"><button class="chip'+(mode=='all'?' on':'')+'" data-m="all">All</button><button class="chip'+(mode=='MCQ'?' on':'')+'" data-m="MCQ">MCQ</button><button class="chip'+(mode=='T/F'?' on':'')+'" data-m="T/F">True / False</button></div><div class="row" style="margin-bottom:18px"><button class="chip'+(shuf?' on':'')+'" id="sf">🔀 Shuffle questions</button></div><div class="row"><button class="btn" id="go">Start Quiz</button></div></div>';
app.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){mode=b.dataset.m;home()}});
document.getElementById('sf').onclick=function(){shuf=!shuf;home()};
document.getElementById('go').onclick=function(){start(mode=='all'?MCQ.concat(TF):mode=='MCQ'?MCQ:TF)}}
function start(list){qs=shuf?sh(list):list.slice();i=0;sc=0;wr=[];sec=0;clearInterval(tm);tm=setInterval(function(){sec++;var e=document.getElementById('tt');if(e)e.textContent=fm(sec)},1000);show()}
function fm(s){return Math.floor(s/60)+':'+('0'+s%60).slice(-2)}
function show(){lock=false;var q=qs[i];document.getElementById('pb').style.width=(i/qs.length*100)+'%';
var h='<div class="card"><div class="meta"><span>Question '+(i+1)+' / '+qs.length+'</span><span>Score '+sc+'</span><span>⏱ <b id="tt">'+fm(sec)+'</b></span></div><span class="tag">'+q.k+'</span><div class="q">'+q.t+'</div>';
q.o.forEach(function(o,j){h+='<button class="o" data-j="'+j+'"><b>'+(q.k=='MCQ'?'ABCD'[j]:j?'F':'T')+'</b>'+o+'</button>'});
h+='<div class="row" style="margin-top:12px"><button class="btn" id="nx" disabled>'+(i==qs.length-1?'Finish':'Next')+'</button></div></div>';
app.innerHTML=h;
app.querySelectorAll('.o').forEach(function(b){b.onclick=function(){if(lock)return;lock=true;var j=+b.dataset.j,bs=app.querySelectorAll('.o');
bs[q.a].classList.add('ok');if(j==q.a)sc++;else{b.classList.add('no');wr.push(q)}document.getElementById('nx').disabled=false}});
document.getElementById('nx').onclick=function(){i++;i<qs.length?show():end()}}
function end(){clearInterval(tm);document.getElementById('pb').style.width='100%';var p=Math.round(sc/qs.length*100);
var h='<div class="card" style="text-align:center"><h2>'+(p>=85?'Excellent! 🎉':p>=60?'Good job 👍':'Keep studying 📚')+'</h2><div class="ring" style="background:conic-gradient(var(--rose) '+p+'%,var(--en) 0)"><span>'+p+'%</span></div><p style="color:var(--t2);margin-bottom:14px">'+sc+' / '+qs.length+' correct · ⏱ '+fm(sec)+'</p><div class="row">';
if(wr.length)h+='<button class="btn" id="rt">Retry wrong ('+wr.length+')</button>';
h+='<button class="chip" id="hm">Home</button></div></div>';
if(wr.length){h+='<div class="card"><b>Review</b><div style="margin-top:10px">';wr.forEach(function(q){h+='<div class="rv">'+q.t+'<br><i>✔ '+q.o[q.a]+'</i></div>'});h+='</div></div>'}
app.innerHTML=h;if(wr.length)document.getElementById('rt').onclick=function(){start(wr.slice())};document.getElementById('hm').onclick=home}
var b=document.getElementById('tb'),t='light';try{t=localStorage.getItem('theme')||'light'}catch(e){}
function ap(x){t=x;document.documentElement.setAttribute('data-theme',x==='dark'?'dark':'');b.textContent=x==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',x)}catch(e){}}
ap(t);b.onclick=function(){ap(t==='dark'?'light':'dark')};home();
</script></body></html>
