<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--bg2:#ffe4ea;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.14);--en:#fff0f3;--ar:#fffafb;--fu:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;--fd:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--bg2:#1c0a13;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.2);--en:#2c1220;--ar:#241019}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber))}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--fd)}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:34px 20px 70px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:56px}
.hero path{fill:none;stroke:#ffd1db;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 3s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.heart{font-size:46px;display:inline-block;animation:b 1.1s infinite}
@keyframes b{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.hero h1{font:700 clamp(22px,5vw,32px) var(--fd);margin:8px 0 4px}
.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 70px}
details{background:var(--card);border:1px solid var(--bc);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 20px rgba(159,18,57,.07)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;direction:ltr}
summary::-webkit-details-marker{display:none}
.n{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;display:grid;place-items:center;font:700 14px var(--fd)}
summary h2{flex:1;font:600 15.5px/1.4 var(--fd)}
.pg{font:600 11px var(--fd);color:var(--rose);background:var(--en);border:1px solid var(--bc);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ch{color:var(--rose);transition:.25s}details[open] .ch{transform:rotate(180deg)}
.body{padding:4px 14px 16px}
.sub{font:700 14px var(--fd);color:var(--violet);margin:16px 0 10px;direction:ltr;text-align:left}
.it{margin-bottom:14px;border-radius:18px;border:1px solid var(--bc);overflow:hidden;background:var(--ar)}
.en{font:600 15px/1.75 var(--fd);padding:14px 16px;background:var(--en);direction:ltr;text-align:left;border-left:5px solid var(--rose)}
.ar{font-size:14.5px;line-height:2;padding:12px 16px;direction:rtl;text-align:right}
.ex{margin:0 12px 12px;padding:10px 14px;border-radius:14px;background:rgba(245,158,11,.12);border:1.5px dashed var(--amber);font-size:14px;line-height:1.9;color:var(--t2);direction:rtl;text-align:right}
.ex b{color:var(--amber);margin-left:4px}
.fig{margin:14px 0;padding:10px;border-radius:18px;border:1px solid var(--bc);background:#fff;text-align:center}
.fig img{max-width:100%;height:auto;border-radius:10px;display:block;margin:0 auto}
.fig figcaption{font:600 13px var(--fd);color:#6b3a4c;margin-top:8px}
footer{padding:20px;text-align:center;border-top:1px solid var(--bc);font:700 14px var(--fd)}
footer span{color:var(--rose)}footer a{display:block;margin-top:4px;font-size:12px;color:var(--violet);text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

<script>
var TITLE="Introduction to Physiology",SUB="Physiology";
var DATA=[{"t": "Definitions", "p": "p.17", "i": [{"e": "Physiology is the study of how the human body works.", "a": "الفسيولوجي هو علم بيدرس الجسم بيشتغل إزاي.", "x": "تخيل الجسم عربية: التشريح بيقولك العربية فيها إيه، والفسيولوجي بيقولك المحرك بيشتغل إزاي."}, {"e": "It describes the chemistry and physics behind basic body functions, from how molecules behave in cells to how systems of organs work together.", "a": "بيشرح الكيمياء والفيزياء اللي ورا وظايف الجسم الأساسية، من تصرف الجزيئات جوه الخلايا لحد تعاون أجهزة الأعضاء مع بعض.", "x": "يعني بيبدأ من أصغر حاجة (الجزيء جوه الخلية) ويوصل لأكبر حاجة (الأجهزة وهي شغالة مع بعض)."}, {"h": "Specific core concepts, as follows:"}, {"e": "Evolution; homeostasis; causality; energy; structure/function; cell theory; levels of organization; cell–cell communication; cell membrane; flow down gradients; genes to proteins; interdependence; mass balance; physics/chemistry; and scientific reasoning.", "a": "التطور؛ الاتزان الداخلي؛ السببية؛ الطاقة؛ التركيب/الوظيفة؛ نظرية الخلية؛ مستويات التنظيم؛ تواصل الخلايا مع بعض؛ غشاء الخلية؛ الانتقال مع تدرج التركيز؛ من الجينات للبروتينات؛ الاعتماد المتبادل؛ اتزان الكتلة؛ الفيزياء/الكيمياء؛ والتفكير العلمي.", "x": "دي المفاهيم الأساسية اللي الفسيولوجي كله مبني عليها، وأهمها homeostasis هتتكرر معاك في المحاضرة."}, {"e": "Human physiology is the study of how the human body's systems and functions work together to maintain a stable internal environment.", "a": "فسيولوجيا الإنسان هي دراسة أجهزة الجسم ووظايفه بتشتغل مع بعض إزاي عشان تحافظ على بيئة داخلية ثابتة.", "x": "الهدف النهائي إن جوه جسمك الحرارة والسكر والمياه والأملاح تفضل ثابتة مهما حصل بره."}, {"e": "It includes the study of the nervous, endocrine, cardiovascular, respiratory, digestive, and urinary systems, as well as cellular and exercise physiology.", "a": "بتشمل دراسة الجهاز العصبي، والغدد الصماء، والقلب والأوعية، والتنفس، والهضم، والجهاز البولي، وكمان فسيولوجيا الخلية وفسيولوجيا المجهود الرياضي.", "x": "يعني الفسيولوجي مش جهاز واحد، ده كل الأجهزة دي كمان مستوى الخلية والرياضة."}]}, {"t": "Physiology vs. Anatomy", "p": "p.18", "i": [{"e": "Anatomy is the study of the structures of humans.", "a": "التشريح هو دراسة تراكيب جسم الإنسان.", "x": "التشريح = الشكل والمكان: العضو شكله إيه وفين."}, {"e": "Physiology is the study of how those structures work.", "a": "الفسيولوجي هو دراسة التراكيب دي بتشتغل إزاي.", "x": "الفسيولوجي = الشغل: العضو بيعمل إيه وبيعمله إزاي."}, {"e": "An imaging scan like an X-ray or ultrasound shows anatomy, giving images of bones and ligaments.", "a": "الأشعة زي الأشعة السينية أو السونار بتوري التشريح، وبتدي صور للعظام والأربطة.", "x": "الأشعة بتصوّر الشكل بس، فبتوري التراكيب."}, {"e": "Tests -- like urine and blood tests or electrocardiograms (EKGs) -- reveal details about body's physiology.", "a": "التحاليل زي تحليل البول والدم ورسم القلب (EKG) بتكشف تفاصيل عن فسيولوجيا الجسم.", "x": "التحاليل ورسم القلب بتوري الجسم شغال إزاي: الدم فيه إيه، والقلب كهربته عاملة إيه."}]}, {"t": "Physiology vs. Biology", "p": "p.18", "i": [{"e": "Physiology is part of the broader science of biology.", "a": "الفسيولوجي جزء من علم الأحياء الأكبر.", "x": "الأحياء هو الشجرة الكبيرة، والفسيولوجي فرع منها."}, {"e": "Biology is the study of all parts of life, including: its origin, how it reproduces, how it evolves, how it grows and what it's made of.", "a": "الأحياء بيدرس كل جوانب الحياة، منها: أصلها، بتتكاثر إزاي، بتتطور إزاي، بتنمو إزاي، ومتكونة من إيه.", "x": "يعني الأحياء بيغطي كل حاجة عن الكائن الحي: أصله وتكاثره وتطوره ونموه وتركيبه."}, {"e": "Physiology is a branch of biology that studies how all living organisms, including humans operate.", "a": "الفسيولوجي فرع من الأحياء بيدرس كل الكائنات الحية، ومنها الإنسان، بتشتغل إزاي.", "x": "مش بس الإنسان، ده بيدرس أي كائن حي شغال إزاي."}, {"e": "It asks why the bodies have certain functions — like breathing or digesting food — and aims to understand how all of different organ systems work to keep alive and healthy.", "a": "بيسأل ليه الجسم عنده وظايف معينة زي التنفس وهضم الأكل، وهدفه يفهم أجهزة الأعضاء المختلفة بتشتغل إزاي عشان الواحد يفضل عايش وبصحة.", "x": "الفسيولوجي بيسأل: ليه بنتنفس؟ وإزاي الأجهزة كلها بتشتغل مع بعض عشان نفضل عايشين."}, {"e": "By studying physiology, scientists can learn more about how to keep bodies in good health.", "a": "بدراسة الفسيولوجي العلماء بيعرفوا أكتر إزاي يحافظوا على صحة الجسم.", "x": "لما تفهم الجسم الطبيعي بيشتغل إزاي، تعرف تحافظ عليه وتكتشف لما يحصل فيه خلل."}]}, {"t": "Structure of The Human Body", "p": "p.19", "i": [{"h": "The human body is composed of the following units:"}, {"e": "1. Cells: The cell is the smallest unit of the body. The body is formed of a huge number (billions) of cells.", "a": "١. الخلايا: الخلية هي أصغر وحدة في الجسم، والجسم متكون من عدد ضخم (مليارات) من الخلايا.", "x": "الخلية هي الطوبة الصغيرة اللي الجسم كله اتبنى منها."}, {"e": "2. Tissues: A tissue is composed of a group of cells that have common characters e.g. connective tissue.", "a": "٢. الأنسجة: النسيج متكون من مجموعة خلايا ليها نفس الصفات، زي النسيج الضام.", "x": "خلايا شبه بعض اتجمعت مع بعض فعملت نسيج."}, {"e": "3. Organs: An organ is composed of a collection of different tissues that organize to perform a specific function e.g. heart pumps blood through blood vessels.", "a": "٣. الأعضاء: العضو متكون من مجموعة أنسجة مختلفة بتتنظم عشان تعمل وظيفة معينة، زي القلب بيضخ الدم في الأوعية الدموية.", "x": "هنا الأنسجة بقت مختلفة عن بعض وبتشتغل مع بعض عشان وظيفة واحدة، زي القلب."}, {"e": "4. Systems: A system is formed of a group of organs organized and complements to perform a certain function that is needed by the whole body e.g. digestive, respiratory, circulatory, excretory, endocrine, nervous and locomotor systems.", "a": "٤. الأجهزة: الجهاز متكون من مجموعة أعضاء منظمة ومكملة لبعض عشان تعمل وظيفة محتاجها الجسم كله، زي الهضمي والتنفسي والدوري والإخراجي والغدد الصماء والعصبي والحركي.", "x": "كذا عضو بيكملوا بعض عشان وظيفة كبيرة، زي المعدة والأمعاء والكبد في جهاز الهضم."}, {"g": "data:image/jpeg;base64 د الأكسجين من السائل خارج الخلية وبتطرد ثاني أكسيد الكربون فيه.", "x": "الخلية بتتنفس زينا، بتاخد أكسجين وتطلع ثاني أكسيد الكربون."}, {"e": "2- Metabolism: takes nutrients and oxidizes them driving the energy.", "a": "٢- الأيض: بتاخد المواد الغذائية وبتأكسدها عشان تطلع منها طاقة.", "x": "الأكل بيتحرق جوه الخلية وبيدّيها الطاقة."}, {"e": "3- Excretion: gets rid of the waste products.", "a": "٣- الإخراج: بتتخلص من الفضلات.", "x": "بعد الشغل بيطلع فضلات والخلية بتطلعها بره."}, {"e": "4- Division: the cell is able to reproduce.", "a": "٤- الانقسام: الخلية قادرة على التكاثر.", "x": "الخلية بتنقسم لخليتين فتتكاثر."}]}, {"t": "Total Body Water (TBW)", "p": "p.21", "i": [{"e": "It is about 60% of body weight.", "a": "هي حوالي ٦٠٪ من وزن الجسم.", "x": "لو وزنك ١٠٠ كيلو، حوالي ٦٠ كيلو منهم مية."}, {"e": "It is less in females than males of the same age and weight......????", "a": "هي أقل عند الإناث منها عند الذكور في نفس السن والوزن.", "x": "السبب إن الإناث دهون جسمهم أكتر، والدهون فيها مية قليلة."}, {"e": "It is more in children than adults & less in older than adult.....????", "a": "هي أكتر في الأطفال منها في البالغين، وأقل في كبار السن منها في البالغين.", "x": "الطفل نسبة المية فيه عالية، وكبير السن بتقل عنده مع قلة العضلات."}, {"h": "Component of Body Water"}, {"e": "TBW is divided into two compartments:-", "a": "ماء الجسم الكلي بيتقسم لقسمين:", "x": "هي مية الجسم متقسمة لجزء جوه الخلايا وجزء بره الخلايا."}, {"h": "I) Intracellular fluid (ICF)"}, {"e": "- It is the fluid inside the cells", "a": "- هو السائل اللي جوه الخلايا.", "x": "intra يعني جوه."}, {"e": "- It is about 40% of body weight", "a": "- حوالي ٤٠٪ من وزن الجسم.", "x": "يعني أكبر قسم من مية الجسم جوه الخلايا."}, {"h": "II) Extracellular fluid (ECF)"}, {"e": "- It is the fluid outside the cells", "a": "- هو السائل اللي بره الخلايا.", "x": "extra يعني بره."}, {"e": "- It is about 20% of body weight", "a": "- حوالي ٢٠٪ من وزن الجسم.", "x": "٤٠٪ + ٢٠٪ = ٦٠٪ وهي المية الكلية."}, {"e": "- It is subdivided into 2 com rgan to control its function.", "a": "ده نظام تنظيم سريع. المعلومات بتتنقل من الجهاز العصبي عبر الأعصاب للعضو المنفذ عشان تتحكم في وظيفته.", "x": "زي سلك كهربا، الإشارة بتوصل بسرعة من المخ للعضو."}, {"e": "e.g. muscle contraction following arrival of a nerve impulse along the somatic nerve.", "a": "زي انقباض العضلة بعد وصول إشارة عصبية عن طريق العصب الجسدي.", "x": "لما تقرر ترفع إيدك، الإشارة بتروح للعضلة فتنقبض."}, {"h": "II. Chemical Regulation:"}, {"e": "This is a slow regulatory system, which takes longer time than the nervous regulate to affect body functions. This system is composed of the enzymes and the hormones.", "a": "ده نظام تنظيم بطيء، بياخد وقت أطول من العصبي عشان يأثر على وظايف الجسم. وبيتكون من الإنزيمات والهرمونات.", "x": "زي رسالة بالبريد، بتوصل بس بتتأخر شوية عن الإشارة العصبية."}, {"h": "1. Enzymes:"}, {"e": "These are organic protein catalysts secreted by exocrine glands (duct glands).", "a": "دي محفزات بروتينية عضوية بتفرزها الغدد ذات القنوات (الغدد خارجية الإفراز).", "x": "الإنزيم بروتين بيسرّع التفاعل، وبيطلع من غدد ليها قناة."}, {"e": "Enzymes control the rate of various chemical reactions in the body.", "a": "الإنزيمات بتتحكم في سرعة التفاعلات الكيميائية المختلفة في الجسم.", "x": "من غيرها التفاعلات هتبقى بطيئة جدًا."}, {"e": "They are specific, each enzyme influences only one reaction.", "a": "هي متخصصة، كل إنزيم بيأثر على تفاعل واحد بس.", "x": "زي المفتاح اللي بيفتح قفل واحد بس."}, {"e": "The activity of enzymes is affected by the pH and the temperature.", "a": "نشاط الإنزيمات بيتأثر بدرجة الحموضة (pH) والحرارة.", "x": "لو الحموضة أو الحرارة اتغيرت، الإنزيم شغله بيبوظ."}, {"h": "2. Hormones:"}, {"e": "They are substances secreted by the endocrine glands (ductless glands) directly into the blood, to be carried to far organs where they affect their functions.", "a": "هي مواد بتفرزها الغدد الصماء (الغدد من غير قنوات) مباشرة في الدم، عشان تتنقل لأعضاء بعيدة وتأثر على وظايفها.", "x": "الهرمون بيتصب في الدم والدم يوصله للعضو البعيد."}]}, {"t": "Homeostasis", "p": "p.22", "i": [{"e": "It means maintaining the structure of the internal environment (the extracellular fluid) constant as regard, PH, temperature, in concentration, blood sugar, body water content and osmolarity.", "a": "معناه الحفاظ على ثبات تركيب البيئة الداخلية (السائل خارج الخلية) من ناحية الحموضة، والحرارة، وتركيز الأيونات، وسكر الدم، ومحتوى مية الجسم، والأسمولارية.", "x": "زي التكييف اللي بيحافظ على حرارة الأوضة ثابتة، الجسم بيحافظ على القيم دي ثابتة."}, {"e": "Homeostasis is the final goal of all body functions.", "a": "الهوميوستازيس هو الهدف النهائي لكل وظايف الجسم.", "x": "كل أجهزة الجسم شغالة عشان الاتزان ده."}, {"e": "Homeostasis, any self-regulating process by which biological systems tend to maintain stability while adjusting to conditions that are optimal for survival.", "a": "الهوميوستازيس هو أي عملية تنظيم ذاتي بتحاول بيها الأنظمة الحيوية تحافظ على الثبات وهي بتتكيف مع الظروف المثلى للبقاء.", "x": "الجسم بيظبط نفسه بنفسه من غير ما حد يتدخل."}, {"e": "If homeostasis is successful, life continues; if unsuccessful, disaster or death.", "a": "لو الهوميوستازيس نجح الحياة بتكمل، ولو فشل بيحصل كارثة أو موت.", "x": "لو الاتزان اتكسر ومرجعش، المريض بيدخل في خطر."}]}];
