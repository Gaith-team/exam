<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--bg2:#ffe4ea;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.14);--en:#fff0f3;--ar:#fffafb;--fu:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;--fd:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--bg2:#1c0a13;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.2);--en:#2c1220;--ar:#241019}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber))}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--fd)}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:34px 20px 70px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:56px}
.hero path{fill:none;stroke:#ffd1db;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 3s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.heart{font-size:46px;display:inline-block;animation:b 1.1s infinite}
@keyframes b{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.hero h1{font:700 clamp(22px,5vw,32px) var(--fd);margin:8px 0 4px}
.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 70px}
details{background:var(--card);border:1px solid var(--bc);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 20px rgba(159,18,57,.07)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;direction:ltr}
summary::-webkit-details-marker{display:none}
.n{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;display:grid;place-items:center;font:700 14px var(--fd)}
summary h2{flex:1;font:600 15.5px/1.4 var(--fd)}
.pg{font:600 11px var(--fd);color:var(--rose);background:var(--en);border:1px solid var(--bc);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ch{color:var(--rose);transition:.25s}details[open] .ch{transform:rotate(180deg)}
.body{padding:4px 14px 16px}
.sub{font:700 14px var(--fd);color:var(--violet);margin:16px 0 10px;direction:ltr;text-align:left}
.it{margin-bottom:14px;border-radius:18px;border:1px solid var(--bc);overflow:hidden;background:var(--ar)}
.en{font:600 15px/1.75 var(--fd);padding:14px 16px;background:var(--en);direction:ltr;text-align:left;border-left:5px solid var(--rose)}
.ar{font-size:14.5px;line-height:2;padding:12px 16px;direction:rtl;text-align:right}
.ex{margin:0 12px 12px;padding:10px 14px;border-radius:14px;background:rgba(245,158,11,.12);border:1.5px dashed var(--amber);font-size:14px;line-height:1.9;color:var(--t2);direction:rtl;text-align:right}
.ex b{color:var(--amber);margin-left:4px}
.fig{margin:14px 0;padding:8px;background:#fff;border:1px solid var(--bc);border-radius:18px;text-align:center}
.fig img{max-width:100%;height:auto;border-radius:12px;display:block;margin:0 auto}
footer{padding:20px;text-align:center;border-top:1px solid var(--bc);font:700 14px var(--fd)}
footer span{color:var(--rose)}footer a{display:block;margin-top:4px;font-size:12px;color:var(--violet);text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style></head><body>

var DATA=[{"t": "Objectives & Outlines", "p": "p. 69", "i": [{"h": "CHAPTER 4: Cardiovascular system — Objective"}, {"e": "At the end of this lecture the students able to", "a": "في آخر المحاضرة المفروض الطالب يبقى قادر على الحاجات اللي جاية دي.", "x": "زي ما تبص على قايمة المطلوب منك قبل ما تذاكر، عشان تعرف هتطلع بإيه."}, {"e": "Identify Functional anatomy of the heart", "a": "تتعرف على التشريح الوظيفي للقلب، يعني القلب متكوّن من إيه وكل جزء بيشتغل إزاي.", "x": "زي ما تتعرف على أوض البيت وكل أوضة بتعمل إيه."}, {"e": "Discuss Cardiac properties", "a": "تناقش خصائص عضلة القلب.", "x": "زي ما تحكي مميزات موبايل: بيعمل إيه وبيشتغل إزاي."}, {"e": "Define Cardiac output", "a": "تعرّف الناتج القلبي (Cardiac output).", "x": "زي ما تقول كام لتر ميّه بتخرج من الطُلمبة في الدقيقة."}, {"e": "List factors affecting arterial blood pressure", "a": "تعدد العوامل اللي بتأثر على ضغط الدم الشرياني.", "x": "زي ما تعدد الحاجات اللي بتزوّد أو بتقلّل ضغط الميّه في الماسورة."}, {"e": "Enumerate causes of Circulatory shock", "a": "تعدد أسباب الصدمة الدورانية (Circulatory shock).", "x": "زي ما تعدد الأسباب اللي ممكن توقّف الكهربا عن البيت."}, {"h": "OUTLINES"}, {"e": "Functional anatomy of the heart", "a": "التشريح الوظيفي للقلب.", "x": "أول عنوان في الخريطة بتاعة المحاضرة."}, {"e": "Cardiac properties", "a": "خصائص القلب.", "x": "تاني عنوان في الخريطة."}, {"e": "Cardiac output", "a": "الناتج القلبي.", "x": "تالت عنوان في الخريطة."}, {"e": "Arterial blood pressure", "a": "ضغط الدم الشرياني.", "x": "رابع عنوان في الخريطة."}, {"e": "Circulatory shock", "a": "الصدمة الدورانية.", "x": "خامس عنوان في الخريطة."}, {"e": "Hemorrhage", "a": "النزيف.", "x": "آخر عنوان في الخريطة."}]}, {"t": "The Cardiovascular System & Functional Anatomy of the Heart", "p": "pp. 70-72", "i": [{"e": "The cardiovascular System", "a": "الجهاز القلبي الوعائي (الدورة الدموية).", "x": "ده اسم الجهاز اللي المحاضرة كلها عنه."}, {"e": "The heart and blood vessels constitute a closed system, through which the blood circulates.", "a": "القلب والأوعية الدموية بيكوّنوا نظام مقفول، والدم بيلف جواه.", "x": "زي دايرة ميّه مقفولة: الطُلمبة هي القلب والمواسير هي الأوعية، والميّه بتلف من غير ما تخرج بره."}, {"g": "circ"}, {"h": "I) Functional anatomy of the heart"}, {"e": "The heart is a hollow muscular organ situated in the left side of the thoracic cavity.", "a": "القلب عضو عضلي مجوّف (من جوه فاضي) وموجود في الناحية الشمال من القفص الصدري.", "x": "زي كيس عضلي بيتملي دم وبعدين بيعصره."}, {"e": "It is composed of 4 chambers:", "a": "القلب مكوّن من 4 حجرات.", "x": "زي بيت فيه 4 أوض."}, {"e": "1- Two atria (Right & left) separated by inter-atrial septum.", "a": "أول حاجة: أُذينين (يمين وشمال) بينهم حاجز اسمه الحاجز بين الأذينين.", "x": "زي أوضتين جنب بعض بينهم حيطة."}, {"e": "2- Two ventricles (Rt & Lt) separated by inter-ventricular septum.", "a": "تاني حاجة: بطينين (يمين وشمال) بينهم حاجز اسمه الحاجز بين البطينين.", "x": "زي أوضتين تحت بينهم حيطة."}, {"e": "The wall of the left ventricle is 3 times thicker than the left ventricle?????", "a": "الجملة دي مكتوبة في المحاضرة كده بعلامات الاستفهام، والمقصود إن جدار البطين الشمال أتخن بـ 3 مرات.", "x": "زي عضلة دراع قوية بتشيل حِمل تقيل: البطين الشمال بيطلّع الدم لكل الجسم فجداره أتخن."}, {"g": "cham"}, {"h": "Valves of the heart:"}, {"e": "Valves are structures that allow the blood to flow in one direction only and prevent its passage in the opposite direction (that is from the atrium to the ventricle to the great artery).", "a": "الصمامات تركيبات بتخلّي الدم يمشي في اتجاه واحد بس وبتمنعه يرجع في الاتجاه العكسي (يعني من الأذين للبطين للشريان الكبير).", "x": "زي باب دوّار في اتجاه واحد: تدخل منه بس ماتعرفش ترجع."}, {"e": "There are 2 types of valves:", "a": "في نوعين من الصمامات.", "x": "زي نوعين من الأبواب في البيت."}, {"e": "1) Atrio-ventricular valves (A-V valves)", "a": "النوع الأول: الصمامات الأذينية البطينية (A-V valves).", "x": "دي الأبواب اللي بين الأذين والبطين."}, {"e": "a- Mitral valve: it has 2 cusps & separate left atriums from left ventricle.", "a": "الصمام التاجي (Mitral): ليه شرفتين (2 cusps) وبيفصل الأذين الشمال عن البطين الشمال.", "x": "باب بضلفتين بين أوضة فوق وأوضة تحت على الشمال."}, {"e": "b- Tricuspid valve: it has 3 cusps & separate right atriums from right ventricle", "a": "الصمام ثلاثي الشرفات (Tricuspid): ليه 3 شرفات وبيفصل الأذين اليمين عن البطين اليمين.", "x": "باب بتلات ضلف بين أوضة فوق وأوضة تحت على اليمين."}, {"e": "2) Semilunar valves (they have 3 cusps)", "a": "النوع التاني: الصمامات الهلالية (Semilunar)، وكل واحد فيهم ليه 3 شرفات.", "x": "دي الأبواب اللي بين البطين والشريان."}, {"e": "a) Aortic valve: separate left ventricle from aorta.", "a": "الصمام الأورطي: بيفصل البطين الشمال عن الأورطي (الشريان الأورطي).", "x": "بوابة خروج الدم من الشمال للأورطي."}, {"e": "b) Pulmonary valve: separate right ventricle from pulmonary artery.", "a": "الصمام الرئوي: بيفصل البطين اليمين عن الشريان الرئوي.", "x": "بوابة خروج الدم من اليمين للرئة."}, {"g": "valv"}, {"h": "II) Functionally, the heart is divided into 2 separate pumps:"}, {"e": "1- Left pump (left heart): pumps blood to peripheral organs (systemic circulation) at high pressure, thus it is called (High pressure pump)", "a": "الطُلمبة الشمال (القلب الشمال): بتضخ الدم لأعضاء الجسم (الدورة الدموية الجهازية) بضغط عالي، علشان كده اسمها طُلمبة الضغط العالي.", "x": "زي طُلمبة ميّه بتوصّل لآخر دور في عمارة عالية، لازم ضغطها يبقى قوي."}, {"e": "2- Right pump (Rt heart): pumps blood to the lungs (Pulmonary circulation) at low pressure, so it is called (Low pressure pump)", "a": "الطُلمبة اليمين (القلب اليمين): بتضخ الدم للرئة (الدورة الدموية الرئوية) بضغط واطي، علشان كده اسمها طُلمبة الضغط الواطي.", "x": "زي طُلمبة ميّه بتوصّل لمكان قريب، مش محتاجة ضغط عالي."}]}, {"t": "Functional Histology of Cardiac Muscle & Autonomic Nerve Supply", "p": "pp. 72-73", "i": [{"h": "III) Functional histology of cardiac muscle"}, {"e": "Cardiac muscle simulates the skeletal muscle in its striation and it is similar to smooth muscle in its syncytial function ie. involuntary and under control of ANS.", "a": "عضلة القلب بتشبه العضلة الهيكلية في إن ليها تخطيط (striation)، وبتشبه العضلة الملساء في وظيفتها المتصلة (syncytial)، يعني لا إرادية وتحت سيطرة الجهاز العصبي الذاتي (ANS).", "x": "عضلة القلب زي واحد واخد شكل من ناحية وصفة من ناحية: شكلها زي عضلة الدراع، وشغلها لا إرادي زي المعدة، ومش بتتحكم فيها بمزاجك."}, {"e": "Cardiac muscle fibers are of 2 types:", "a": "ألياف عضلة القلب نوعين.", "x": "زي فريق فيه نوعين من اللاعيبة، كل نوع ليه دور."}, {"e": "1) Ordinary contractile Ms. Fibers: both atria & ventricles. They are responsible for pumping action of the heart.", "a": "النوع الأول: ألياف عضلية عادية بتنقبض، وموجودة في الأذينين والبطينين، وهي المسؤولة عن عملية الضخ في القلب.", "x": "دول العمّال اللي بيشتغلوا فعلاً ويعصروا الدم."}, {"e": "2) Specialized cardiac Ms. Fibers: which are responsible for initiation & conduction of cardiac impulses. They are Sino-atrial node (SAN), Atrioventricular node (AVN), Atrioventricular bundle, AV bundle branches and Purkinje fibers.", "a": "النوع التاني: ألياف عضلية متخصصة، مسؤولة عن بدء ونقل النبضات الكهربائية في القلب. وهي: العقدة الجيبية الأذينية (SAN)، والعقدة الأذينية البطينية (AVN)، وحزمة AV، وفروع حزمة AV، وألياف بركنجي.", "x": "دول زي أسلاك الكهربا: بتولّد الإشارة وتوصّلها لباقي القلب علشان العمّال يشتغلوا."}, {"g": "musc"}, {"h": "Autonomic nerve supply of the heart:"}, {"e": "1. Sympathetic nerves: supplies both atria and both ventricles.", "a": "الأعصاب السمبثاوية: بتغذّي الأذينين والبطينين الاتنين.", "x": "السمبثاوي زي مدير بيوصل أوامره لكل أجزاء القلب."}, {"e": "2. Parasympathetic (vagus) nerves: supplies both atria only.", "a": "الأعصاب الباراسمبثاوية (العصب الحائر / vagus): بتغذّي الأذينين بس.", "x": "الباراسمبثاوي زي مدير تاني بس مكتبه في الأذينين بس."}, {"g": "auto"}]}, {"t": "Cardiac Properties", "p": "pp. 74-75", "i": [{"h": "CARDIAC PROPERTIES (Properties of the Cardiac Muscle)"}, {"g": "prop"}, {"h": "I. Contractility:"}, {"e": "It is the ability of the cardiac muscles to (contract) shorten, in order to push the blood in blood vessels.", "a": "الانقباضية: هي قدرة عضلات القلب إنها تنقبض (تقصر)، علشان تدفع الدم في الأوعية الدموية.", "x": "زي لما تقفل إيدك على إسفنجة مليانة ميّه فتدفع الميّه بره."}, {"e": "Cardiac muscle obeys the all or non-law I.e. either contracts maximally or does not contract at all.", "a": "عضلة القلب بتخضع لقانون الكل أو لا شيء، يعني يا بتنقبض أقصى انقباض يا مبتنقبضش خالص.", "x": "زي زرار الجرس: يا بيرنّ بالكامل يا مبيرنّش، مفيش رنّة نص نص."}, {"h": "The all or non-law:"}, {"e": "When the cardiac muscle is stimulated, it responds by either maximum contraction or does not contract at all, as long as other conditions remain constant.", "a": "لما عضلة القلب تتنبّه، بترد يا بأقصى انقباض يا مبتنقبضش خالص، طالما باقي الظروف ثابتة.", "x": "زي لمبة بتتنوّر بكامل قوتها أو مبتنورش، ومفيش نص نور، بشرط إن الكهربا ثابتة."}, {"h": "II. Rhythmicity:"}, {"e": "It is the ability of the heart to excite itself to beat regularly in absence of nervous stimulation.", "a": "الإيقاعية: هي قدرة القلب إنه ينبّه نفسه بنفسه علشان ينبض بانتظام حتى من غير تنبيه عصبي.", "x": "زي ساعة بتدق لوحدها من غير ما حد يلفّها."}, {"e": "In man, the sinoatrial (SA) node is the area of highest rhythm in the heart.", "a": "في الإنسان، العقدة الجيبية الأذينية (SA node) هي المنطقة اللي إيقاعها أعلى حاجة في القلب.", "x": "زي مغنّي بيبدأ الأغنية بأسرع إيقاع."}, {"e": "The whole heart beats with the same rhythm of the SA node, so it is called the pace maker of the heart.", "a": "القلب كله بينبض بنفس إيقاع العقدة SA، علشان كده اسمها منظّم ضربات القلب (pace maker).", "x": "زي قائد الأوركسترا: الكل بيمشي على إيقاعه."}, {"h": "III. Excitability:"}, {"e": "It is the ability of the cardiac muscle to respond to an adequate stimulus.", "a": "الاستثارة: هي قدرة عضلة القلب إنها تستجيب لمنبّه كافي.", "x": "زي جرس الباب: لازم تدوس بالقوة الكافية علشان يرنّ."}, {"h": "IV. Conductivity:"}, {"e": "It is the ability to transmit the excitation wave.", "a": "التوصيلية: هي القدرة على نقل موجة الاستثارة.", "x": "زي سلك بيوصّل الكهربا من مكان لمكان."}, {"e": "Both atria act as one functional unit, and both ventricles act as one functional unit.", "a": "الأذينين الاتنين بيشتغلوا كوحدة وظيفية واحدة، والبطينين الاتنين بيشتغلوا كوحدة وظيفية واحدة.", "x": "زي فريقين: فريق الأذينين وفريق البطينين، وكل فريق بيتحرك مع بعض."}, {"e": "When an excitation wave reaches one cardiac muscle fiber, this wave spreads rapidly to the adjacent fibers and then rapidly to all muscle fibers in this functional unit.", "a": "لما موجة الاستثارة توصل لليفة عضلية واحدة، بتنتشر بسرعة للألياف اللي جنبها وبعدين بسرعة لكل الألياف في الوحدة الوظيفية دي.", "x": "زي لما تولّع شمعة وتولّع اللي جنبها، والنار تفضل تتنقل لحد ما كل الشموع تولّع."}, {"e": "In this way, the 2 atria are excited nearly at the same time, while the 2 ventricles are excited together.", "a": "بالطريقة دي الأذينين بيتنبّهوا تقريباً في نفس الوقت، والبطينين بيتنبّهوا مع بعض.", "x": "زي فريقين كل فريق بيبدأ جري مع بعض."}, {"e": "Excitation is followed by contraction of the 2 atria together followed by contraction of the 2 ventricles together.", "a": "بعد الاستثارة بيحصل انقباض للأذينين مع بعض، وبعده انقباض للبطينين مع بعض.", "x": "الأول الأذينين يعصروا الدم نزل للبطينين، وبعدين البطينين يعصروه بره."}, {"h": "Factors Affecting the Cardiac Properties:"}, {"h": "I. Autonomic nerve supply:"}, {"e": "1. Sympathetic stimulation: stimulates all of cardiac properties.", "a": "تنبيه السمبثاوي: بينشّط كل خصائص القلب.", "x": "زي ما تدوس بنزين: القلب يشتغل أسرع وأقوى."}, {"e": "2. Parasympathetic (vagus nerve) stimulation: inhibits all of cardiac properties.", "a": "تنبيه الباراسمبثاوي (العصب الحائر): بيثبّط كل خصائص القلب.", "x": "زي ما تدوس فرامل: القلب يهدّى."}, {"h": "II. Temperature:"}, {"e": "1. Warming of the heart: stimulates all of cardiac properties.", "a": "تسخين القلب: بينشّط كل خصائص القلب.", "x": "زي جسمك لما يسخن، بتحس إن كل حاجة بتتحرك أسرع."}, {"e": "2. Cooling of the heart: inhibits all of cardiac properties.", "a": "تبريد القلب: بيثبّط كل خصائص القلب.", "x": "زي لما تقف في ثلج، حركتك بتبطّأ."}, {"h": "III. Ions:"}, {"e": "1. Calcium ions: helps contraction of the heart. If it is increased, the heart stops in systole.", "a": "أيونات الكالسيوم: بتساعد على انقباض القلب. ولو زادت، القلب بيقف في الانقباض (systole).", "x": "زي واحد قابض إيده ومبيعرفش يفتحها."}, {"e": "2. Potassium ions: helps relaxation of the heart. If it is increased, the heart stops in diastole.", "a": "أيونات البوتاسيوم: بتساعد على ارتخاء القلب. ولو زادت، القلب بيقف في الارتخاء (diastole).", "x": "زي واحد فاتح إيده ومبيعرفش يقفلها."}, {"h": "IV. Drugs:"}, {"e": "1. Adrenaline: like sympathetic stimulation, stimulates all of cardiac properties.", "a": "الأدرينالين: زي تنبيه السمبثاوي، بينشّط كل خصائص القلب.", "x": "زي ما تدوس بنزين."}, {"e": "2. Acetyl choline: like parasympathetic stimulation, inhibits all of cardiac properties.", "a": "الأسيتيل كولين: زي تنبيه الباراسمبثاوي، بيثبّط كل خصائص القلب.", "x": "زي ما تدوس فرامل."}]}, {"t": "Cardiac Output (CO)", "p": "pp. 76-78", "i": [{"h": "Cardiac Output (CO)"}, {"g": "co"}, {"h": "Definition:"}, {"e": "It is the volume of blood pumped by each ventricle per minute.", "a": "الناتج القلبي: هو حجم الدم اللي كل بطين بيضخّه في الدقيقة.", "x": "زي كام لتر ميّه الطُلمبة بتطلّعها في الدقيقة."}, {"e": "Cardiac output = Heart rate x stroke volume", "a": "الناتج القلبي = معدل ضربات القلب × حجم الضربة.", "x": "زي ما تحسب كمية الميّه: عدد مرات الضغطة × كمية الميّه في كل ضغطة."}, {"e": "CO = 70×70 = 4900 ml/min i.e. about 5 liters/minute.", "a": "الناتج القلبي = 70 × 70 = 4900 مل في الدقيقة، يعني حوالي 5 لتر في الدقيقة.", "x": "70 ضربة في الدقيقة × 70 مل في الضربة = حوالي 5 لتر."}, {"h": "I. Heart Rate (HR)"}, {"h": "Definition:"}, {"e": "It is the number of heart beats per minute.", "a": "معدل ضربات القلب: هو عدد ضربات القلب في الدقيقة.", "x": "زي ما تعدّ دقّات الساعة في دقيقة."}, {"e": "It is about 70/min., ranges from (60-90/min)", "a": "المعدل حوالي 70 في الدقيقة، ويتراوح من 60 لـ 90 في الدقيقة.", "x": "ده المعدل الطبيعي للقلب."}, {"e": "-Increased HR is called tachycardia (HR >100/min)", "a": "زيادة معدل ضربات القلب اسمها تسارع القلب (tachycardia)، يعني أكتر من 100 في الدقيقة.", "x": "زي ما تجري ويدقّ قلبك بسرعة."}, {"e": "-Decreased HR is called bradycardia (HR < 60 /min)", "a": "نقص معدل ضربات القلب اسمه بطء القلب (bradycardia)، يعني أقل من 60 في الدقيقة.", "x": "زي ما تكون نايم وقلبك بيدق ببطء."}, {"h": "Factors affecting HR:"}, {"h": "1-Cardiac nerves:"}, {"e": "a) sympathetic stimulation increases HR.", "a": "تنبيه السمبثاوي بيزوّد معدل ضربات القلب.", "x": "زي ما تدوس بنزين."}, {"e": "b) parasympathetic stimulation decreases HR.", "a": "تنبيه الباراسمبثاوي بيقلّل معدل ضربات القلب.", "x": "زي ما تدوس فرامل."}, {"h": "2-Body temperature:"}, {"e": "a) increased body temperature (fever) increases HR.", "a": "زيادة حرارة الجسم (الحمّى) بتزوّد معدل ضربات القلب.", "x": "زي ما تيجي لك سخونية فقلبك يدق أسرع."}, {"e": "b) decreased body temperature (hypothermia) decreases HR.", "a": "نقص حرارة الجسم (hypothermia) بيقلّل معدل ضربات القلب.", "x": "زي ما تتعرّض لبرد شديد فقلبك يبطّأ."}, {"h": "3. Hormones:"}, {"e": "Some hormones as thyroxin and adrenaline increase HR.", "a": "بعض الهرمونات زي الثيروكسين والأدرينالين بتزوّد معدل ضربات القلب.", "x": "زي ما تتخض فقلبك يدق بسرعة من الأدرينالين."}, {"h": "4. Levels of blood gases:"}, {"e": "a. Mild to moderate decrease in blood O2 or increase in blood CO2 cause tachycardia.", "a": "النقص البسيط لحد المتوسط في أكسجين الدم أو زيادة ثاني أكسيد الكربون في الدم بيسبّب تسارع القلب.", "x": "زي ما تحس إنك مخنوق شوية فقلبك يسرّع علشان يوصّل الأكسجين."}, {"e": "b. Severe decrease in blood O2 or increase in blood CO2 cause severe bradycardia.", "a": "النقص الشديد في أكسجين الدم أو الزيادة الشديدة في ثاني أكسيد الكربون بيسبّب بطء شديد في القلب.", "x": "زي ماكينة اتعبت جداً وبدأت تبطّأ."}, {"h": "Stroke Volume (SV):"}, {"h": "Definition:"}, {"e": "It is the volume of blood pumped by each ventricle per beat.", "a": "حجم الضربة: هو حجم الدم اللي كل بطين بيضخّه في الضربة الواحدة.", "x": "زي كمية الميّه في ضغطة طُلمبة واحدة."}, {"e": "The normal SV is about 70 ml.", "a": "حجم الضربة الطبيعي حوالي 70 مل.", "x": "زي كوباية صغيرة في كل ضربة."}, {"h": "Factors affecting SV:"}, {"h": "1. Venous return (VR):"}, {"e": "It is the amount of venous blood entering the heart.", "a": "العائد الوريدي: هو كمية الدم الوريدي الداخل للقلب.", "x": "زي كمية الميّه اللي بتدخل الطُلمبة."}, {"e": "a) increased VR increases SV.", "a": "زيادة العائد الوريدي بتزوّد حجم الضربة.", "x": "لو دخل ميّه أكتر هيطلع ميّه أكتر."}, {"e": "b) decreased VR decreases SV.", "a": "نقص العائد الوريدي بيقلّل حجم الضربة.", "x": "لو دخل ميّه أقل هيطلع ميّه أقل."}, {"h": "2. Strength of contraction of the cardiac muscle:"}, {"e": "a) all factors that increase the force of contraction of the heart increase SV e.g. sympathetic stimulation, warming, thyroxine and adrenaline.", "a": "كل العوامل اللي بتزوّد قوة انقباض القلب بتزوّد حجم الضربة، زي تنبيه السمبثاوي والتسخين والثيروكسين والأدرينالين.", "x": "زي ما تعصر الإسفنجة بقوة فتطلع ميّه أكتر."}, {"e": "b) all factors that decrease the force of contraction of the heart decrease SV e.g. parasympathetic stimulation, cooling, and acetyl choline.", "a": "كل العوامل اللي بتقلّل قوة انقباض القلب بتقلّل حجم الضربة، زي تنبيه الباراسمبثاوي والتبريد والأسيتيل كولين.", "x": "زي ما تعصر الإسفنجة بضعف فتطلع ميّه أقل."}, {"e": "3. Aortic pressure: increased pressure in the aorta resists emptying of the heart, and so decreases SV.", "a": "ضغط الأورطي: زيادة الضغط في الأورطي بتقاوم تفريغ القلب، وبالتالي بتقلّل حجم الضربة.", "x": "زي ما تحاول تفتح باب والتاني بيزقّه من الناحية التانية."}, {"e": "4. Heart rate: increasing HR shortens the period for ventricular filling, and so decreases SV.", "a": "معدل ضربات القلب: زيادته بتقصّر فترة امتلاء البطين، وبالتالي بتقلّل حجم الضربة.", "x": "زي ما تملا كوباية بسرعة جداً قبل ما تتملي كويس."}]}, {"t": "Arterial Blood Pressure (ABP)", "p": "pp. 78-79", "i": [{"h": "Arterial Blood Pressure (ABP)"}, {"e": "Definition: It is the lateral pressure exerted by the blood on the walls of the arteries resulting in their distension.", "a": "التعريف: ضغط الدم الشرياني هو الضغط الجانبي اللي بيعمله الدم على جدران الشرايين وبيسبّب تمدّدها.", "x": "زي ضغط الميّه على جدران الخرطوم من جوه فيتنفخ."}, {"h": "Normal values: in young healthy adult:"}, {"h": "I. Systolic blood pressure:"}, {"e": "It is the ABP during systole (the period of cardiac contraction). It is about 120 mmHg (ranging from 100 to 150 mmHg).", "a": "الضغط الانقباضي: هو ضغط الدم الشرياني أثناء الانقباض (فترة انقباض القلب). حوالي 120 مم زئبق (من 100 لـ 150).", "x": "ده الرقم الكبير في قياس الضغط."}, {"h": "II. Diastolic blood pressure:"}, {"e": "It is the ABP during diastole (the period of cardiac relaxation). It is about 80 mmHg (ranging from 60 to 90 mmHg)", "a": "الضغط الانبساطي: هو ضغط الدم الشرياني أثناء الانبساط (فترة ارتخاء القلب). حوالي 80 مم زئبق (من 60 لـ 90).", "x": "ده الرقم الصغير في قياس الضغط."}, {"g": "bp"}, {"h": "Physiological Factors Affecting ABP:"}, {"h": "I. Age:"}, {"e": "a. Children have lower ABP than adults.", "a": "الأطفال ضغطهم أقل من الكبار.", "x": "الصغير ضغطه واطي."}, {"e": "b. older people have higher ABP than adults.", "a": "كبار السن ضغطهم أعلى من البالغين.", "x": "الضغط بيعلى مع السن."}, {"h": "II. Sex:"}, {"e": "a. Before the age of menopause, females have lower ABP than males of their ages.", "a": "قبل سن انقطاع الطمث، ضغط الستات أقل من الرجالة في نفس السن.", "x": "الست قبل سن اليأس ضغطها أقل من الراجل."}, {"e": "b. After menopause, the ABP of females is higher than males of their ages.", "a": "بعد انقطاع الطمث، ضغط الستات بيبقى أعلى من الرجالة في نفس السن.", "x": "الوضع بيتعكس بعد سن اليأس."}, {"h": "III. Body built:"}, {"e": "ABP in obese people is higher than that in thin people.", "a": "ضغط الدم عند البدينين أعلى من النحيفين.", "x": "الشخص التخين ضغطه أعلى."}, {"h": "IV. Gravity:"}, {"e": "a. ABP measured in lying position is higher than that in sitting or standing positions.", "a": "الضغط المقاس في وضع الرقود أعلى منه في وضع الجلوس أو الوقوف.", "x": "لو قِست وانت نايم هيطلع أعلى."}, {"e": "b. In standing position the ABP in the lower limb is higher than that measured in the arm.", "a": "في وضع الوقوف، الضغط في الطرف السفلي (الرجل) أعلى منه في الذراع.", "x": "الدم بيتجمّع تحت بفعل الجاذبية فضغط الرجل أعلى."}, {"h": "V. Emotions:"}, {"e": "ABP rises during excitation.", "a": "ضغط الدم بيرتفع أثناء الانفعال.", "x": "لما تتعصّب أو تتخض، ضغطك بيعلى."}, {"h": "VI. Exercise:"}, {"e": "ABP is raised temporarily during exercise.", "a": "ضغط الدم بيرتفع مؤقتاً أثناء التمرين.", "x": "لما تجري ضغطك بيعلى شوية وبعدين يرجع."}, {"h": "VII. Sleep:"}, {"e": "ABP decreases during sleep.", "a": "ضغط الدم بيقلّ أثناء النوم.", "x": "وانت نايم جسمك مرتاح فالضغط بينزل."}]}, {"t": "Circulatory Shock", "p": "p. 80", "i": [{"h": "Circulatory shock"}, {"h": "Definition:"}, {"e": "A condition characterized by decrease both COP & ABP, so decreasing blood flow to tissue (tissue ischemia)", "a": "حالة بيحصل فيها نقص في الناتج القلبي (COP) وضغط الدم (ABP) مع بعض، فبيقلّ وصول الدم للأنسجة (نقص تروية الأنسجة / ischemia).", "x": "زي ما الميّه تقلّ في المواسير فالأدوار العالية مبتلاقيش ميّه."}, {"h": "Types (causes) of shock"}, {"h": "1) Hypovolemic shock:"}, {"e": "It occurs due to decrease blood volume leading to decrease COP & ABP.", "a": "بيحصل بسبب نقص حجم الدم فيقلّ الناتج القلبي وضغط الدم.", "x": "زي خزان ميّه فضي فمفيش ميّه تتضخّ."}, {"h": "Causes of hypovolemic shock"}, {"e": "a. Loss of whole blood as in hemorrhage", "a": "فقدان الدم الكامل زي ما بيحصل في النزيف.", "x": "زي ما التنك يتخرم وتسرب منه الميّه."}, {"e": "b. Loss of plasma as in burns", "a": "فقدان البلازما زي ما بيحصل في الحروق.", "x": "زي ما الجزء السايل من الدم يخرج من الجلد المحروق."}, {"e": "c. Loss of ECF (dehydration) as in excessive vomiting, sweating and diarrhea.", "a": "فقدان السائل خارج الخلايا (الجفاف / dehydration) زي ما بيحصل في القيء الزايد والعرق والإسهال.", "x": "زي ما الجسم يخسر ميّه كتير من القيء والعرق والإسهال."}, {"h": "2) Cardiogenic shock"}, {"e": "It occurs due to decrease the pumping ability of the heart leading to decrease COP & ABP as in myocardial infarction.", "a": "بيحصل بسبب نقص قدرة القلب على الضخ فيقلّ الناتج القلبي وضغط الدم، زي ما بيحصل في احتشاء عضلة القلب (myocardial infarction).", "x": "زي طُلمبة باظت وبقت مبتضخّش كويس."}, {"h": "3) Anaphylactic shock"}, {"e": "It occurs due to severe Antigen antibody reaction", "a": "بيحصل بسبب تفاعل شديد بين المستضد والجسم المضاد (Antigen antibody reaction).", "x": "زي ما الجسم يتحسّس بشدة من حاجة."}, {"h": "4) Septic shock"}, {"e": "It occurs due to severe infection with certain pathogenic organism that secretes toxins.", "a": "بيحصل بسبب عدوى شديدة بكائن ممرض معيّن بيفرز سموم (toxins).", "x": "زي ميكروب بيفرز سموم تضر الجسم كله."}, {"h": "5) Neurogenic shock"}, {"e": "It can occur due to severe pain, deep general anesthesia or high spinal anesthesia.", "a": "ممكن يحصل بسبب ألم شديد أو تخدير كلي عميق أو تخدير نخاعي عالي.", "x": "زي ما الأعصاب تتأثر بشدة فتأثر على الدورة الدموية."}, {"h": "N.B. Irreversible shock:"}, {"e": "This type of shock has progressed to certain stage that does not respond to blood transfusion and other lines of shock therapy.", "a": "الصدمة غير القابلة للارتداد: النوع ده من الصدمة وصل لمرحلة معيّنة مبقاش بيستجيب لنقل الدم ولا لباقي طرق علاج الصدمة.", "x": "زي مكنة باظت لدرجة إن الصيانة مبقتش تفيد."}, {"e": "This is because of much tissue damage leading to marked cellular deterioration.", "a": "ده بسبب تلف كبير في الأنسجة بيؤدي لتدهور واضح في الخلايا.", "x": "زي بيت اتهدّ كتير فمفيش ترميم ينفع."}]}, {"t": "Hemorrhage (Hge)", "p": "p. 81", "i": [{"h": "Hemorrhage (Hge)"}, {"h": "Definition:"}, {"e": "It is the passage of blood outside the blood vessels.", "a": "النزيف: هو خروج الدم من الأوعية الدموية.", "x": "زي ميّه خرجت من الماسورة."}, {"h": "Types:"}, {"h": "I. External Hge:"}, {"e": "It is the blood lost outside the body through an open wound.", "a": "النزيف الخارجي: هو الدم اللي بيتفقد خارج الجسم من خلال جرح مفتوح.", "x": "زي لما تتجرح وتشوف الدم بره."}, {"h": "II. Internal Hge:"}, {"e": "It is the blood which passes outside the blood vessel and accumulates inside a cavity in the body.", "a": "النزيف الداخلي: هو الدم اللي بيخرج من الوعاء الدموي وبيتجمّع جوه تجويف في الجسم.", "x": "زي ميّه سربت من الماسورة وفضلت محبوسة جوه الحيطة."}, {"e": "e.g. rupture of spleen leads to internal Hge in the abdominal cavity.", "a": "مثال: انفجار الطحال بيؤدي لنزيف داخلي في تجويف البطن.", "x": "الدم بيتجمّع في البطن ومبيبانش من بره."}, {"h": "Effects of Hge on body functions?"}, {"h": "I. Immediate effects:"}, {"h": "1. Effects on cardiovascular system:"}, {"e": "a) Drop of arterial blood pressure.", "a": "هبوط ضغط الدم الشرياني.", "x": "علشان الدم قلّ."}, {"e": "b) Increased heart rate.", "a": "زيادة معدل ضربات القلب.", "x": "القلب بيسرّع يعوّض النقص."}, {"e": "c) Vasoconstriction of the blood vessels in the skin.", "a": "انقباض الأوعية الدموية في الجلد.", "x": "الدم بيتسحب من الجلد علشان يروح للأعضاء المهمة."}, {"e": "d) The spleen contracts to increase the blood volume.", "a": "الطحال بينقبض علشان يزوّد حجم الدم.", "x": "زي مخزن احتياطي بيطلّع اللي عنده."}, {"e": "e) Blood clotting is started to stop bleeding.", "a": "بتبدأ عملية تجلّط الدم علشان توقّف النزيف.", "x": "زي ما تسد الخرم بسدادة."}, {"h": "2. Effects on respiration: Increased O2 supply due to:"}, {"e": "a. Increased respiratory rate.", "a": "زيادة معدل التنفس.", "x": "بتتنفس أسرع."}, {"e": "b. Increased depth of respiration.", "a": "زيادة عمق التنفس.", "x": "بتتنفس أعمق."}, {"h": "II. Delayed effects:"}, {"e": "a) Shift of fluid from tissue spaces to the blood: This helps", "a": "انتقال السائل من الفراغات النسيجية للدم: ده بيساعد (الجملة مقطوعة هنا في المحاضرة زي ما هي).", "x": "زي ما الميّه تتسحب من مكان للمواسير علشان تعوّض اللي نقص."}, {"e": "b) Stimulation of erythropoiesis: This helps restoring the O2 carrying ability of the blood.", "a": "تنشيط تكوين كرات الدم الحمراء (erythropoiesis): ده بيساعد على استعادة قدرة الدم على حمل الأكسجين.", "x": "زي ما تعمل ناقلات جديدة بدل اللي راحت."}, {"e": "c) Effects on the kidney: Decreased volume of urine in order to decrease fluid loss from the body.", "a": "التأثير على الكلى: بيقلّ حجم البول علشان يقلّل فقدان السوائل من الجسم.", "x": "الجسم بيوفّر الميّه."}]}];

h+='</div></details>'});document.getElementById('app').innerHTML=h;
