<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--rose:#e11d48;--rose2:#be123c;--amber:#f59e0b;--violet:#7c3aed;--bg:#fff5f7;--bg2:#ffe4ea;--card:#fff;--text:#2a0f1b;--t2:#6b3a4c;--bc:rgba(159,18,57,.14);--en:#fff0f3;--ar:#fffafb;--fu:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;--fd:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif}
[data-theme=dark]{--rose:#fb7185;--rose2:#fda4af;--amber:#fbbf24;--violet:#a78bfa;--bg:#12050b;--bg2:#1c0a13;--card:#210d17;--text:#fde8ee;--t2:#e0b3c2;--bc:rgba(251,113,133,.2);--en:#2c1220;--ar:#241019}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#pb{position:fixed;top:0;left:0;height:4px;width:0;z-index:99;background:linear-gradient(90deg,var(--rose),var(--amber))}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--bc)}
.brand{display:flex;align-items:center;gap:10px;font:700 15px var(--fd)}
.logo{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;display:grid;place-items:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin:16px;border-radius:28px;padding:34px 20px 70px;text-align:center;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#4a0f2a,#9f1239 60%,#e11d48)}
.hero svg{position:absolute;left:0;bottom:0;width:100%;height:56px}
.hero path{fill:none;stroke:#ffd1db;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:d 3s ease-out forwards}
@keyframes d{to{stroke-dashoffset:0}}
.heart{font-size:46px;display:inline-block;animation:b 1.1s infinite}
@keyframes b{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.hero h1{font:700 clamp(22px,5vw,32px) var(--fd);margin:8px 0 4px}
.hero p{font-size:13px;opacity:.85}
.shell{max-width:720px;margin:0 auto;padding:6px 16px 70px}
details{background:var(--card);border:1px solid var(--bc);border-radius:22px;margin-bottom:14px;overflow:hidden;box-shadow:0 6px 20px rgba(159,18,57,.07)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px;direction:ltr}
summary::-webkit-details-marker{display:none}
.n{width:34px;height:34px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:#fff;display:grid;place-items:center;font:700 14px var(--fd)}
summary h2{flex:1;font:600 15.5px/1.4 var(--fd)}
.pg{font:600 11px var(--fd);color:var(--rose);background:var(--en);border:1px solid var(--bc);border-radius:20px;padding:3px 10px;white-space:nowrap}
.ch{color:var(--rose);transition:.25s}details[open] .ch{transform:rotate(180deg)}
.body{padding:4px 14px 16px}
.sub{font:700 14px var(--fd);color:var(--violet);margin:16px 0 10px;direction:ltr;text-align:left}
.it{margin-bottom:14px;border-radius:18px;border:1px solid var(--bc);overflow:hidden;background:var(--ar)}
.en{font:600 15px/1.75 var(--fd);padding:14px 16px;background:var(--en);direction:ltr;text-align:left;border-left:5px solid var(--rose)}
.ar{font-size:14.5px;line-height:2;padding:12px 16px;direction:rtl;text-align:right}
.ex{margin:0 12px 12px;padding:10px 14px;border-radius:14px;background:rgba(245,158,11,.12);border:1.5px dashed var(--amber);font-size:14px;line-height:1.9;color:var(--t2);direction:rtl;text-align:right}
.ex b{color:var(--amber);margin-left:4px}
.fig{margin:6px 0 16px;text-align:center}
.fig img{max-width:100%;height:auto;border-radius:16px;border:1px solid var(--bc);background:#fff;padding:6px}
footer{padding:20px;text-align:center;border-top:1px solid var(--bc);font:700 14px var(--fd)}
footer span{color:var(--rose)}footer a{display:block;margin-top:4px;font-size:12px;color:var(--violet);text-decoration:none}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
</style></head><body>

var DATA=[{"t": "Respiration: Definition, Structure & Functions", "p": "p. 50", "i": [{"h": "Definition"}, {"e": "Respiration is the transport of O2 from atmosphere to the cells and CO2 and water from cells to atmosphere.", "a": "التنفس هو نقل الأكسجين من الهوا لحد الخلايا، ونقل ثاني أكسيد الكربون والمية من الخلايا للهوا بره الجسم.", "x": "تخيل عربية توصيل: رايحة بالأكسجين للخلايا وراجعة بالـ CO2 والمية تطلعهم بره."}, {"h": "Structure of the respiratory system"}, {"e": "A) Essential structures; through which air passes, these structures are: nose, pharynx, larynx, trachea, bronchi, bronchioles and alveoli.", "a": "دي الأجزاء الأساسية اللي الهوا بيعدّي فيها بالترتيب: المناخير، البلعوم، الحنجرة، القصبة الهوائية، الشعب الهوائية، الشعيبات، وآخرها الحويصلات الهوائية.", "x": "فكّر فيها زي شجرة مقلوبة: الجذع هو القصبة، بيتفرّع لفروع كبيرة (bronchi) وبعدين فروع أصغر (bronchioles)، والورق اللي في الآخر هو الحويصلات (alveoli)."}, {"e": "B) Accessory structures; these are essential for respiration as respiratory muscles and pleura.", "a": "دي الأجزاء المساعدة، وهي مهمة للتنفس زي عضلات التنفس والبلورا (الغشاء اللي حوالين الرئة).", "x": "الهوا مش بيعدّي فيها، بس من غيرها الرئة متتحركش: العضلات هي الموتور، والبلورا هي الغلاف اللي بيحمي الرئة."}, {"h": "Function of respiratory system"}, {"e": "1- O2 supply to tissues and removal of CO2 from them, O2 is used in oxidation of food stuffs in the cells and release of energy.", "a": "أول وظيفة إنها توصّل الأكسجين للأنسجة وتشيل منها الـ CO2، لأن الخلايا بتستخدم الأكسجين تحرق بيه الأكل وتطلّع طاقة.", "x": "الأكسجين زي البنزين، والأكل زي الخشب: من غير هوا النار متولعش والطاقة متطلعش."}, {"e": "2- Help venous return.", "a": "بتساعد على رجوع الدم الوريدي للقلب.", "x": "وإنت بتشهق بيقل الضغط جوه الصدر، فالدم الراجع للقلب بيتسحب بسهولة أكتر."}, {"e": "3- Regulation of body temperature through evaporation of water from the respiratory passages.", "a": "بتنظّم حرارة الجسم عن طريق تبخّر المية من مجرى الهوا.", "x": "زي ما العرق بيبرّد الجلد وهو بيتبخّر، المية اللي بتتبخّر من مجرى التنفس بتبرّد الجسم."}, {"e": "4- Regulation of the PH of the blood through adjusting the amount of CO2 eliminated from the body.", "a": "بتظبط الـ pH بتاع الدم عن طريق التحكم في كمية الـ CO2 اللي بتتطلّع من الجسم.", "x": "الـ CO2 بيخلّي الدم حامضي، فكل ما تطلّع منه أكتر الدم بيبقى أقل حموضة، والعكس صحيح."}]}, {"t": "Phases of Respiration", "p": "p. 50–51", "i": [{"e": "1. External respiration: It is the exchange of gases (O2 and CO2) between blood and the atmospheric air across the alveolar wall in the lung.", "a": "التنفس الخارجي هو تبادل الغازات (O2 و CO2) بين الدم والهوا الجوي عن طريق جدار الحويصلات في الرئة.", "x": "ده اللي بيحصل جوه الرئة: الهوا من ناحية والدم من الناحية التانية، والجدار الرفيع بينهم هو اللي بيتعدّي منه الغاز."}, {"e": "O2 passes from air to the blood, while CO2 passes from the blood to air.", "a": "الأكسجين بيروح من الهوا للدم، وفي المقابل الـ CO2 بيروح من الدم للهوا.", "x": "تبادل في الاتجاهين: واحد داخل وواحد خارج في نفس الوقت."}, {"e": "External respiration is divided into 3 divisions:", "a": "التنفس الخارجي بيتقسّم لتلات أقسام:", "x": "ده عنوان بس، وتحته الأقسام التلاتة اللي جاية."}, {"e": "1- Ventilation: renewal of air in the lung through the process of breathing (inspiration and expiration).", "a": "التهوية هي تجديد الهوا في الرئة عن طريق عملية التنفس (شهيق وزفير).", "x": "الرئة بتطرد الهوا القديم وتدخّل هوا جديد كل نفس."}, {"e": "2. Diffusion: exchange of gases between air in the lung alveoli and blood in the pulmonary capillaries.", "a": "الانتشار هو تبادل الغازات بين الهوا اللي في الحويصلات والدم اللي في الشعيرات الدموية الرئوية.", "x": "الغاز بيمشي لوحده من المكان اللي فيه كتير للمكان اللي فيه قليل من غير مجهود."}, {"e": "II. Blood transport of O2 and CO2: O2 is transported from lung to tissues, while CO2 is transported from tissues to the lung.", "a": "نقل الغازات بالدم: الأكسجين بيتنقل من الرئة للأنسجة، والـ CO2 بيتنقل من الأنسجة للرئة.", "x": "الدم هو الشاحنة اللي بتنقل الغازات رايحة جاية بين الرئة وباقي الجسم."}, {"e": "III. Internal respiration: In which O2 passes from blood to tissues where it is utilized to produce CO2, which passes to the blood.", "a": "التنفس الداخلي: الأكسجين بيروح من الدم للأنسجة وبتستخدمه وتطلّع منه CO2، والـ CO2 ده بيرجع للدم.", "x": "ده اللي بيحصل عند الخلايا نفسها، مش في الرئة."}, {"e": "Internal respiration is divided into 2 divisions:", "a": "التنفس الداخلي بيتقسّم لقسمين:", "x": "عنوان للقسمين اللي بعده."}, {"e": "1. Gas exchange: O2 passes from capillary blood to the tissue fluid, while CO2 passes from tissue fluid capillary to the blood.", "a": "تبادل الغازات: الأكسجين بيروح من دم الشعيرات لسائل الأنسجة، والـ CO2 بيروح من سائل الأنسجة لدم الشعيرات.", "x": "نفس فكرة تبادل الرئة، بس المرة دي بين الدم والخلايا."}, {"e": "2. Tissue respiration: O2 is utilized for oxidation of nutrients to produce energy.", "a": "التنفس النسيجي: الأكسجين بيتستخدم في حرق المواد الغذائية عشان تطلع طاقة.", "x": "ده المكان اللي الأكسجين بيتصرف فيه فعلاً، جوه الخلية."}, {"f": "phases"}]}, {"t": "Respiratory Cycle", "p": "p. 51–53", "i": [{"h": "Respiratory rate"}, {"e": "The respiratory rate: It is the number of respiratory cycles per minute.", "a": "معدل التنفس هو عدد دورات التنفس في الدقيقة.", "x": "الدورة الواحدة = شهيق + زفير، وإنت بتعدّ كام دورة في دقيقة."}, {"e": "In adult man the respiratory rate is 12-16 times/minute.", "a": "عند الرجل البالغ معدل التنفس من 12 لـ 16 مرة في الدقيقة.", "x": "لو سمعت رقم أقل أو أكتر بكتير من ده يبقى في حاجة غير طبيعية."}, {"f": "press"}, {"h": "Inspiration"}, {"e": "Inspiration: It is an active process of expansion of the chest and inflation of the lungs.", "a": "الشهيق عملية نشطة، يعني بتحتاج مجهود عضلي، وفيها الصدر بيتوسّع والرئة بتنتفخ.", "x": "هو شغل عضلات فعلي، زي ما بتشد حاجة عشان تفتحها."}, {"e": "During inspiration there is an increase in all diameters of the chest.", "a": "في الشهيق كل أقطار الصدر بتزيد.", "x": "الصدر بيكبر من فوق لتحت ومن الجنب للجنب ومن قدام لورا."}, {"e": "Inspiration may be normal or forced.", "a": "الشهيق ممكن يبقى عادي أو قوي.", "x": "في شهيق الراحة وفي شهيق الجهد، والاتنين جايين تحت."}, {"e": "I. Normal (resting) inspiration: Occurs during rest.", "a": "الشهيق العادي بيحصل وقت الراحة.", "x": "زي نَفَسك وإنت قاعد بتذاكر."}, {"e": "Occurs due to contraction of the diaphragm (increasing the vertical diameter of the chest) and the external intercostal muscles (increasing the transverse and the antero-posterior diameters of the chest).", "a": "بيحصل بسبب انقباض الحجاب الحاجز (بيزوّد القطر الرأسي للصدر) والعضلات الوربية الخارجية (بتزوّد القطر المستعرض والأمامي الخلفي للصدر).", "x": "الحجاب الحاجز بينزل لتحت فالصدر يطول، والعضلات اللي بين الضلوع بترفع الضلوع فالصدر يتّسع."}, {"e": "II. Forced (deep) inspiration: Occurs during exercise or excitation.", "a": "الشهيق القوي بيحصل وقت المجهود أو الانفعال.", "x": "زي ما بتجري أو بتتخض."}, {"e": "Occurs due to contraction of the accessory muscles of inspiration.", "a": "بيحصل بسبب انقباض العضلات المساعدة للشهيق.", "x": "العضلات العادية مش كفاية، فبتشتغل معاهم عضلات زيادة تساعد."}, {"h": "Expiration"}, {"e": "Expiration: It is the process of compression of the chest and deflation of the lungs.", "a": "الزفير هو عملية انضغاط للصدر وتفريغ للرئة من الهوا.", "x": "عكس الشهيق: الصدر بيرجع يصغر والرئة بتفضى."}, {"e": "During expiration there is a decrease in all diameters of the chest.", "a": "في الزفير كل أقطار الصدر بتقل.", "x": "الصدر بيصغر في كل الاتجاهات."}, {"e": "Expiration may be normal or forced.", "a": "الزفير ممكن يبقى عادي أو قوي.", "x": "برضه في زفير راحة وزفير جهد."}, {"e": "I. Normal (resting) expiration: Occurs during rest.", "a": "الزفير العادي بيحصل وقت الراحة.", "x": "نَفَس هادي وإنت مرتاح."}, {"e": "It is a passive process (no muscle contraction).", "a": "هو عملية سلبية، يعني مفيش أي انقباض عضلي.", "x": "محدش بيشتغل فيه، الجسم بيسيب نفسه بس."}, {"e": "Occurs due to relaxation of the inspiratory muscles. The lung and chest decrease in volumes by their elasticity.", "a": "بيحصل بسبب ارتخاء عضلات الشهيق، والرئة والصدر بيصغروا لوحدهم بسبب المرونة بتاعتهم.", "x": "زي البلونة لما تسيبها: بترجع لحجمها الطبيعي من غير ما حد يضغط عليها."}, {"e": "II. Forced (deep) expiration: It is an active process.", "a": "الزفير القوي عملية نشطة.", "x": "هنا العضلات بتشتغل فعلاً عكس الزفير العادي."}, {"e": "Occurs during exercise or excitation.", "a": "بيحصل وقت المجهود أو الانفعال.", "x": "زي ما بتجري أو بتنفخ في بلونة."}, {"e": "The lung volume becomes smaller than normal.", "a": "حجم الرئة بيبقى أصغر من الطبيعي.", "x": "لأنك بتطلّع هوا أكتر من اللي بيطلع في الزفير العادي."}, {"e": "Occurs due to contraction of the accessory muscles of expiration, which are the abdominal wall muscles (elevating the diaphragm and decreasing the vertical diameter of the chest) and the internal intercostal muscles (decreasing the transverse and the antero-posterior diameters of the chest).", "a": "بيحصل بسبب انقباض العضلات المساعدة للزفير، وهي عضلات جدار البطن (بترفع الحجاب الحاجز وتقلل القطر الرأسي للصدر) والعضلات الوربية الداخلية (بتقلل القطر المستعرض والأمامي الخلفي للصدر).", "x": "عضلات البطن بتزق الحجاب لفوق، والعضلات اللي بين الضلوع بتنزّل الضلوع، فالصدر يضيق ويطلع الهوا."}, {"f": "breath"}]}, {"t": "Lung Volumes & Capacities", "p": "p. 54–56", "i": [{"e": "Lung volumes measure air during one phase of respiration, while lung capacities measure the sum of two or more volumes.", "a": "الحجوم الرئوية بتقيس الهوا في مرحلة واحدة من التنفس، أما السعات الرئوية فبتقيس مجموع حجمين أو أكتر.", "x": "الحجم قطعة واحدة، والسعة هي تجميع كذا قطعة مع بعض."}, {"e": "Key lung volumes include Tidal Volume (TV), Inspiratory Reserve Volume (IRV), Expiratory Reserve Volume (ERV), and Residual Volume (RV).", "a": "الحجوم الرئوية الأساسية هي: الحجم المدّي (TV)، حجم الشهيق الاحتياطي (IRV)، حجم الزفير الاحتياطي (ERV)، والحجم المتبقي (RV).", "x": "أربع حجوم بس، احفظ أسمائهم وحروفهم."}, {"e": "Important lung capacities, which are combinations of these volumes, are Inspiratory Capacity (IC), Functional Residual Capacity (FRC), Vital Capacity (VC), and Total Lung Capacity (TLC).", "a": "السعات المهمة، وهي تجميعات من الحجوم دي: سعة الشهيق (IC)، السعة المتبقية الوظيفية (FRC)، السعة الحيوية (VC)، والسعة الكلية للرئة (TLC).", "x": "أربع سعات، وكل واحدة بتتحسب من حجمين أو تلاتة من اللي فاتوا."}, {"e": "Factors such as age, gender, height, and ethnicity affect an individual's lung capacity.", "a": "عوامل زي السن والنوع والطول والعرق بتأثر على سعة الرئة عند الشخص.", "x": "يعني أرقام الكتاب متوسطات، وكل شخص ليه رقمه حسب بياناته."}, {"f": "vol"}, {"h": "I) Lung volumes"}, {"e": "Different lung volumes can be measured using the spirometer.", "a": "ممكن نقيس الحجوم الرئوية المختلفة باستخدام جهاز السبايروميتر.", "x": "السبايروميتر جهاز بتنفخ فيه وهو بيسجّل كمية الهوا."}, {"e": "1. Tidal volume (TV): It is the volume of air inspired or expired during normal quiet breathing (Eupnea).", "a": "الحجم المدّي هو حجم الهوا اللي بيدخل أو بيطلع في التنفس الهادي العادي (Eupnea).", "x": "ده الهوا اللي بتتنفسه في كل نفس وإنت مرتاح."}, {"e": "TV is about 500 ml in the normal adult male.", "a": "الحجم المدّي حوالي 500 مل عند الرجل البالغ الطبيعي.", "x": "نص لتر تقريباً في كل نفس."}, {"e": "2. Inspiratory reserve volume (IRV): It is the volume of air that can be inspired by deepest inspiration after normal inspiration.", "a": "حجم الشهيق الاحتياطي هو كمية الهوا اللي تقدر تشهقها بأعمق شهيق بعد الشهيق العادي.", "x": "بعد ما شهقت عادي، شهّق تاني بأقصى ما عندك، الزيادة دي هي الاحتياطي."}, {"e": "IRV equals about 3000 ml.", "a": "حجم الشهيق الاحتياطي حوالي 3000 مل.", "x": "تلات لتر."}, {"e": "3. Expiratory reserve volume (ERV): It is the volume of air that can be expired by deepest expiration after normal expiration.", "a": "حجم الزفير الاحتياطي هو كمية الهوا اللي تقدر تطلّعها بأعمق زفير بعد الزفير العادي.", "x": "بعد ما زفرت عادي، كمّل وزفّر بأقصى قوة، الزيادة دي هي الاحتياطي."}, {"e": "ERV equals about 1100 ml.", "a": "حجم الزفير الاحتياطي حوالي 1100 مل.", "x": "لتر وحاجة."}, {"e": "4. Residual volume (RV): It is the volume of air remaining in the lung after deepest expiration.", "a": "الحجم المتبقي هو كمية الهوا اللي بتفضل في الرئة حتى بعد أعمق زفير.", "x": "مهما زفّرت، الرئة مبتفضاش خالص."}, {"e": "RV is about 1200 ml.", "a": "الحجم المتبقي حوالي 1200 مل.", "x": "لتر ونص تقريباً."}, {"h": "II) Lung capacities"}, {"e": "A lung capacity is a combination of 2 or more lung volumes.", "a": "السعة الرئوية هي تجميع حجمين أو أكتر من الحجوم الرئوية.", "x": "زي ما بتجمع كذا فاتورة في مبلغ واحد."}, {"e": "1. Vital capacity (VC): It is the volume of air that can be expired by deepest expiration after deepest inspiration.", "a": "السعة الحيوية هي كمية الهوا اللي تقدر تطلّعها بأعمق زفير بعد أعمق شهيق.", "x": "شهّق لآخر نفس عندك وبعدين زفّر لآخر نفس، الكمية دي هي VC."}, {"e": "VC = IRV + TV + ERV = 3000 + 500 + 1100 = 4600 ml.", "a": "السعة الحيوية = IRV + TV + ERV = 3000 + 500 + 1100 = 4600 مل.", "x": "لاحظ إن الـ RV مش داخل فيها، لأنه مبيطلعش حتى في أعمق زفير."}, {"h": "Factors affecting vital capacity"}, {"e": "a) Sex: VC is less in females than males.", "a": "النوع: السعة الحيوية أقل عند الإناث منها عند الذكور.", "x": "ده تأثير النوع على الرقم."}, {"e": "b) Posture: VC is less in the recumbent than in the sitting than in the standing positions. Because viscera interfere with the descent of diaphragm on recumbence.", "a": "الوضعية: السعة الحيوية أقل في النوم على الضهر، وأعلى في الجلوس، وأعلى في الوقوف. لأن الأحشاء بتعطّل نزول الحجاب الحاجز لما الواحد يبقى نايم.", "x": "وإنت نايم الأحشاء بتضغط على الحجاب من تحت، فمبينزلش كويس."}, {"e": "c) Physical training: VC is higher in athletes.", "a": "التمرين الرياضي: السعة الحيوية أعلى عند الرياضيين.", "x": "التدريب بيقوّي عضلات التنفس."}, {"e": "d) Abdominal masses: e.g. pregnancy and ascites interfere with the descent of diaphragm.", "a": "الكتل في البطن: زي الحمل والاستسقاء (ascites) بتعطّل نزول الحجاب الحاجز.", "x": "أي حاجة بتزحم البطن بتمنع الحجاب ينزل."}, {"e": "e) Chest diseases: e.g. airway obstruction (as bronchial asthma), decreased lung elasticity (fibrosis and pneumonia), congestive heart failure, rib fracture and muscle weakness.", "a": "أمراض الصدر: زي انسداد المجرى الهوائي (زي الربو الشعبي)، وقلة مرونة الرئة (التليف والالتهاب الرئوي)، وفشل القلب الاحتقاني، وكسر الضلوع، وضعف العضلات.", "x": "أي مرض بيصعّب دخول الهوا أو بيقلل مرونة الرئة أو بيوجع في الحركة بينقّص السعة الحيوية."}, {"e": "2. Inspiratory capacity (IC): It is the volume of air that can be inspired by deepest inspiration after normal expiration.", "a": "سعة الشهيق هي كمية الهوا اللي تقدر تشهقها بأعمق شهيق بعد الزفير العادي.", "x": "بتبدأ من نهاية الزفير العادي وتشهّق لآخر نفس."}, {"e": "IC = TV + IRV = 500 + 3000 = 3500 ml.", "a": "سعة الشهيق = TV + IRV = 500 + 3000 = 3500 مل.", "x": "الشهيق العادي مضاف عليه الاحتياطي."}, {"e": "3. Functional residual capacity (FRC): It is the volume of air remaining in the lungs after normal expiration.", "a": "السعة المتبقية الوظيفية هي كمية الهوا اللي بتفضل في الرئة بعد الزفير العادي.", "x": "الهوا اللي في رئتك لما تخلّص زفير عادي."}, {"e": "FRC = ERV + RV = 1100 + 1200 = 2300 ml.", "a": "السعة المتبقية الوظيفية = ERV + RV = 1100 + 1200 = 2300 مل.", "x": "الاحتياطي اللي لسه تقدر تزفره، زائد اللي مبيطلعش أبداً."}, {"e": "4. Total lung capacity (TLC): It is the maximum volume of air present in the lung after deepest inspiration.", "a": "السعة الكلية للرئة هي أقصى كمية هوا موجودة في الرئة بعد أعمق شهيق.", "x": "الرئة وهي مليانة لآخرها."}, {"e": "TLC = IRV + TV + ERV + RV = 3000 + 500 + 1100 + 1200 = 5800 ml.", "a": "السعة الكلية = IRV + TV + ERV + RV = 3000 + 500 + 1100 + 1200 = 5800 مل.", "x": "هي كل الحجوم الأربعة مجمّعين مع بعض."}]}, {"t": "Dead Space (DS)", "p": "p. 57", "i": [{"e": "It is the volume of air in the respiratory tract in which no gas exchange is done.", "a": "الحيز الميت هو حجم الهوا اللي في المجرى التنفسي ومفيش فيه تبادل غازات.", "x": "هوا واقف في الأنابيب، دخل بس مقابلش دم يتبادل معاه."}, {"e": "Normally DS is about 150 ml. So, of the tidal volume (500 ml), only 350 ml reach the alveoli and undergo gas exchange with blood.", "a": "الحيز الميت الطبيعي حوالي 150 مل. يعني من الحجم المدّي (500 مل) بيوصل 350 مل بس للحويصلات ويحصل لهم تبادل مع الدم.", "x": "500 − 150 = 350. الـ 150 دول بيفضلوا في الأنابيب."}, {"f": "dead"}, {"h": "Types of dead space"}, {"e": "1. Anatomical DS: It includes the conducting part of respiratory system that extends from nose, to the terminal bronchioles in which no gas exchange takes place.", "a": "الحيز الميت التشريحي بيشمل الجزء الموصّل من الجهاز التنفسي من المناخير لحد الشعيبات الانتهائية، ومفيش فيه تبادل غازات.", "x": "دي الأنابيب اللي الهوا بيعدي فيها بس."}, {"e": "Alveoli are the sites where gas exchange occurs.", "a": "الحويصلات الهوائية هي مكان تبادل الغازات.", "x": "التبادل بيحصل في الورق اللي في آخر الشجرة، مش في الأنابيب."}, {"e": "2. Pathological DS: volume of air in the non-functioning alveoli.", "a": "الحيز الميت المرضي هو حجم الهوا اللي في الحويصلات اللي مش شغالة.", "x": "حويصلات موجودة وفيها هوا، بس مبتتبادلش بسبب المرض."}, {"e": "3. Physiological DS: equals anatomical DS + pathological DS.", "a": "الحيز الميت الفسيولوجي = التشريحي + المرضي.", "x": "يعني كل هوا ملوش لازمة في التبادل، من الأنابيب ومن الحويصلات المعطلة."}, {"h": "Functions of DS"}, {"e": "1. Adjust the temperature of the inspired air to the body temperature.", "a": "بيظبط حرارة الهوا الداخل على حرارة الجسم.", "x": "الهوا بيتدفّى قبل ما يوصل للحويصلات."}, {"e": "2. Humidify the inspired air.", "a": "بيرطّب الهوا الداخل.", "x": "بيضيف له رطوبة عشان ميجفّفش الحويصلات."}, {"e": "3. Protects the delicate alveoli from foreign particles in the inspired air.", "a": "بيحمي الحويصلات الرقيقة من الأجسام الغريبة في الهوا الداخل.", "x": "الأنابيب بتصفّي الغبار قبل ما يوصل للحويصلات الحساسة."}]}, {"t": "Pulmonary & Alveolar Ventilation", "p": "p. 58", "i": [{"h": "Pulmonary Ventilation"}, {"e": "Definition: It is the actual inflow and outflow of air between the atmosphere and the lungs per minute during rest.", "a": "التهوية الرئوية هي كمية الهوا الفعلية اللي بتدخل وتخرج بين الجو والرئة في الدقيقة وقت الراحة.", "x": "كل الهوا اللي بيتحرك داخل وخارج، من غير ما نبص هو وصل للحويصلات ولا لأ."}, {"e": "Pulmonary ventilation = Tidal volume (TV) × respiratory rate (RR) = 500 × 12 = 6 L/minute.", "a": "التهوية الرئوية = الحجم المدّي × معدل التنفس = 500 × 12 = 6 لتر/دقيقة.", "x": "كل نفس 500 مل × 12 نفس في الدقيقة."}, {"h": "Alveolar ventilation"}, {"e": "Definition: It is the volume of fresh air entering or leaving the alveoli (alveolar air renewal) per minute.", "a": "التهوية السنخية هي حجم الهوا الجديد اللي بيدخل أو بيخرج من الحويصلات في الدقيقة.", "x": "ده الهوا اللي فعلاً بيشتغل ويتبادل مع الدم."}, {"e": "Alveolar ventilation = (TV − DS) × RR = (500 − 150) × 12 = 350 × 12 = 4200 ml.", "a": "التهوية السنخية = (TV − DS) × RR = (500 − 150) × 12 = 350 × 12 = 4200 مل.", "x": "بنشيل الحيز الميت من كل نفس، لأنه مبيتبادلش."}, {"h": "Effects of changes in rate & depth of respiration on alveolar ventilation"}, {"e": "1. In normal breathing: TV = 500 ml, RR = 12 and DS = 150 ml. Pulmonary ventilation = TV × RR = 500 × 12 = 6000 ml. Alveolar ventilation = (TV − DS) × RR = (500 − 150) × 12 = 350 × 12 = 4200 ml.", "a": "في التنفس الطبيعي: TV = 500 و RR = 12 و DS = 150. التهوية الرئوية = 6000 مل، والتهوية السنخية = 4200 مل.", "x": "ده الأساس اللي هنقارن بيه الحالتين اللي جايين."}, {"e": "2. In deep slow breathing e.g. in athletes: TV = 1000 ml, RR = 6 and DS = 150 ml. Pulmonary ventilation = TV × RR = 1000 × 6 = 6000 ml. Alveolar ventilation = (TV − DS) × RR = (1000 − 150) × 6 = 850 × 6 = 5100 ml.", "a": "في التنفس العميق البطيء زي الرياضيين: TV = 1000 و RR = 6 و DS = 150. التهوية الرئوية = 6000 مل، والتهوية السنخية = 5100 مل.", "x": "نفس عميق وقليل: التهوية الرئوية زي الطبيعي، بس السنخية زادت."}, {"e": "3. In shallow rapid breathing e.g. bronchial asthma: TV = 250 ml, RR = 24 and DS = 150 ml. Pulmonary ventilation = TV × RR = 250 × 24 = 6000 ml. Alveolar ventilation = (TV − DS) × RR = (250 − 150) × 24 = 100 × 24 = 2400 ml.", "a": "في التنفس السطحي السريع زي الربو الشعبي: TV = 250 و RR = 24 و DS = 150. التهوية الرئوية = 6000 مل، والتهوية السنخية = 2400 مل.", "x": "نَفَس كتير وصغير: الحيز الميت بياكل معظم كل نفس."}, {"e": "So, shallow rapid breathing causes severe decrease in alveolar ventilation for the same pulmonary ventilation.", "a": "يعني التنفس السطحي السريع بيسبّب نقص شديد في التهوية السنخية مع إن التهوية الرئوية زي ما هي.", "x": "الرقم الكلي واحد (6000)، بس اللي بيوصل للحويصلات فعلاً بيقل جداً."}]}, {"t": "Respiratory Functions of the Blood", "p": "p. 59–62", "i": [{"h": "I) Oxygen transport"}, {"f": "o2cyc"}, {"e": "Oxygen content in arterial blood is about 19 ml/100 ml blood.", "a": "محتوى الأكسجين في الدم الشرياني حوالي 19 مل/100 مل دم.", "x": "الدم الشرياني هو الدم الغني بالأكسجين الخارج من الرئة."}, {"e": "Oxygen content in venous blood is about 14 ml/100 ml blood.", "a": "محتوى الأكسجين في الدم الوريدي حوالي 14 مل/100 مل دم.", "x": "الفرق (19 − 14 = 5) هو اللي الأنسجة أخدته."}, {"e": "At the lungs: The concentration of oxygen in lung alveoli is higher than that in the venous blood in the lung, so O2 diffuses from the alveolar air to the blood in pulmonary capillaries.", "a": "عند الرئة: تركيز الأكسجين في الحويصلات أعلى منه في الدم الوريدي اللي في الرئة، فالأكسجين بينتشر من هوا الحويصلات لدم الشعيرات الرئوية.", "x": "الغاز دايماً بيروح من المكان الزحمة للمكان الفاضي."}, {"e": "At the tissues O2 diffuses from the high concentration in the arterial blood of the capillaries to the low concentration in the tissue fluid.", "a": "عند الأنسجة: الأكسجين بينتشر من التركيز العالي في الدم الشرياني للشعيرات للتركيز المنخفض في سائل الأنسجة.", "x": "نفس القاعدة بس في الاتجاه التاني."}, {"f": "exch"}, {"e": "Oxygen is transported in blood in 2 forms; physical solution and chemical combination.", "a": "الأكسجين بيتنقل في الدم في صورتين: ذائب فيزيائياً وملتحم كيميائياً.", "x": "واحد سايب في السائل وواحد ماسكه الهيموجلوبين."}, {"e": "1. O2 in physical solution: It is the amount of O2 dissolved in plasma.", "a": "الأكسجين الذائب فيزيائياً هو كمية الأكسجين الذايبة في البلازما.", "x": "زي السكر الدايب في الشاي."}, {"e": "Arterial blood contains 0.3 ml of O2/100 ml.", "a": "الدم الشرياني فيه 0.3 مل أكسجين/100 مل.", "x": "كمية صغيرة جداً."}, {"e": "Although physical O2 is very small in amount (1.5%), yet it is very important as it determine the direction of movement of O2 to or from the blood.", "a": "مع إن الأكسجين الذائب قليل جداً (1.5%)، إلا إنه مهم لأنه هو اللي بيحدد اتجاه حركة الأكسجين من الدم أو إليه.", "x": "هو اللي بيعمل فرق الضغط اللي بيخلّي الأكسجين يمشي في الاتجاه الصح."}, {"e": "2. O2 in chemical combination: It is the amount of O2 that combine with hemoglobin in the RBCs forming oxy-Hb.", "a": "الأكسجين الملتحم كيميائياً هو كمية الأكسجين اللي بتتحد مع الهيموجلوبين في كرات الدم الحمراء وتكوّن أوكسي هيموجلوبين.", "x": "الهيموجلوبين زي الشنطة اللي بتشيل الأكسجين."}, {"e": "About 98.5% of O2 transported in blood is in the form of oxy-Hb.", "a": "حوالي 98.5% من الأكسجين المنقول في الدم بيكون على صورة أوكسي هيموجلوبين.", "x": "يعني الشنطة هي الوسيلة الأساسية."}, {"e": "Lung alveoli contains high concentration of O2 which diffuses from the alveolar air to be dissolved in the plasma (physical O2), then to the RBCs to combine with Hb forming oxy-Hb.", "a": "حويصلات الرئة فيها تركيز أكسجين عالي بينتشر من هوا الحويصلات ويدوب في البلازما (الأكسجين الفيزيائي)، وبعدين يدخل كرات الدم الحمراء ويتحد مع الهيموجلوبين ويكوّن أوكسي هيموجلوبين.", "x": "الترتيب: هوا ← بلازما ← كرية حمراء ← يتحد مع Hb."}, {"e": "O2 concentration at the tissues is low, so O2 dissolved in the plasma (physical O2) diffuses from the plasma to the tissue fluid. O2 in oxy-Hb leaves the RBCs to be dissolved in the plasma to replace the decrease in physical O2.", "a": "تركيز الأكسجين عند الأنسجة قليل، فالأكسجين الذايب في البلازما بينتشر لسائل الأنسجة. والأكسجين اللي في الأوكسي هيموجلوبين بيخرج من الكرات الحمراء ويدوب في البلازما يعوّض النقص في الأكسجين الفيزيائي.", "x": "الذايب بيخلص الأول، فالشنطة بتفضي منها عشان تعوّضه."}, {"h": "II) CO2 transport"}, {"f": "co2"}, {"e": "CO2 content in arterial blood is about 48 ml/100 ml blood.", "a": "محتوى الـ CO2 في الدم الشرياني حوالي 48 مل/100 مل دم.", "x": "رقم تحفظه."}, {"e": "CO2 content in venous blood is about 52 ml/100 ml blood.", "a": "محتوى الـ CO2 في الدم الوريدي حوالي 52 مل/100 مل دم.", "x": "الوريدي أعلى في CO2 لأنه راجع من الأنسجة."}, {"e": "At the tissues: the concentration of CO2 in the tissue fluid is higher than that in the capillary blood, so it diffuses from the tissue fluid to blood.", "a": "عند الأنسجة: تركيز الـ CO2 في سائل الأنسجة أعلى منه في دم الشعيرات، فبينتشر من سائل الأنسجة للدم.", "x": "الخلايا بتنتج CO2 فبيروح للدم اللي فيه أقل."}, {"e": "At the lung: CO2 diffuses from the high concentration in the venous blood to the low concentration in the alveolar air.", "a": "عند الرئة: الـ CO2 بينتشر من التركيز العالي في الدم الوريدي للتركيز المنخفض في هوا الحويصلات.", "x": "وهناك بيتطلّع مع الزفير."}, {"e": "CO2 is transported in blood in the following forms:", "a": "الـ CO2 بيتنقل في الدم في الصور الآتية:", "x": "تلات صور، هتشوفهم تحت."}, {"e": "1. CO2 in physical solution: It is the amount of CO2 dissolved in plasma.", "a": "الـ CO2 الذائب فيزيائياً هو كمية الـ CO2 الدايبة في البلازما.", "x": "زي الغاز اللي في المشروب الغازي."}, {"e": "Arterial blood contains 3 ml of CO2/100 ml.", "a": "الدم الشرياني فيه 3 مل CO2/100 مل.", "x": "جزء صغير من الـ 48."}, {"e": "Although physical CO2 is very small in amount (6%), yet it is very important as it determines the direction of movement of CO2 to or from the blood.", "a": "مع إن الـ CO2 الذائب قليل (6%)، إلا إنه مهم لأنه بيحدد اتجاه حركة الـ CO2 من الدم أو إليه.", "x": "نفس فكرة الأكسجين الذائب: هو اللي بيحدد الاتجاه."}, {"e": "2. CO2 in chemical combination: a. Carbamino compounds: It is a chemical combination between CO2 and hemoglobin in the RBCs.", "a": "الـ CO2 الملتحم كيميائياً، أ) مركبات الكارباميينو: وهي اتحاد كيميائي بين الـ CO2 والهيموجلوبين في كرات الدم الحمراء.", "x": "الهيموجلوبين بيشيل CO2 كمان، مش أكسجين بس."}, {"e": "About 3 ml of CO2 is transported in blood in the form of carbamino compounds.", "a": "حوالي 3 مل من الـ CO2 بيتنقلوا في الدم على صورة مركبات كارباميينو.", "x": "كمية صغيرة."}, {"e": "b. Bicarbonate (HCO3) and carbonic acid (H2CO3): The main bulk of CO2 (42 ml/100 ml arterial blood) is carried in the form of NaHCO3 (in plasma) or KHCO3 (in RBCs).", "a": "ب) البيكربونات (HCO3) وحمض الكربونيك (H2CO3): معظم الـ CO2 (42 مل/100 مل دم شرياني) بيتنقل على صورة NaHCO3 (في البلازما) أو KHCO3 (في كرات الدم الحمراء).", "x": "دي الطريقة الأساسية. 3 + 3 + 42 = 48 وده الإجمالي."}, {"e": "Arterial CO2 (bicarbonate and carbonic acid) is a very important buffer that prevents deviations in pH of the blood.", "a": "الـ CO2 الشرياني (البيكربونات وحمض الكربونيك) منظّم (buffer) مهم جداً بيمنع تغيّر الـ pH بتاع الدم.", "x": "زي مصدّ صدمات للحموضة: لو الدم بقى يحمّض أو يقلوّي، البيكربونات بتعدّل."}]}, {"t": "Respiratory Disorders", "p": "p. 63–66", "i": [{"h": "Pathological Conditions of Respiratory Functions"}, {"h": "I. Asphyxia"}, {"f": "asph"}, {"e": "Definition: It is the prevention of ventilation of the alveoli.", "a": "التعريف: هو منع تهوية الحويصلات الهوائية.", "x": "الهوا مش قادر يوصل للحويصلات."}, {"e": "Causes: 1. Obstruction of the air passages.", "a": "الأسباب: 1. انسداد المجاري الهوائية.", "x": "حاجة سادّة الطريق، زي لقمة عالقة."}, {"e": "2. Drowning: filling of air passages with fluids.", "a": "2. الغرق: امتلاء المجاري الهوائية بالسوائل.", "x": "المية مكان الهوا."}, {"e": "3. Paralysis of the respiratory muscles, especially the diaphragm.", "a": "3. شلل عضلات التنفس، خصوصاً الحجاب الحاجز.", "x": "الطريق مفتوح بس مفيش موتور يسحب الهوا."}, {"e": "Effects of asphyxia: 1. Decreased O2 in blood.", "a": "تأثيرات الاختناق: 1. نقص الأكسجين في الدم.", "x": "مفيش هوا جديد داخل."}, {"e": "2. Increased CO2 in blood.", "a": "2. زيادة الـ CO2 في الدم.", "x": "الـ CO2 مش لاقي يطلع."}, {"e": "3. Decreased pH of blood.", "a": "3. نقص الـ pH بتاع الدم.", "x": "زيادة الـ CO2 بتخلّي الدم حامضي."}, {"h": "II. Apnea"}, {"e": "Definition: It is the stoppage of breathing due to inhibition of the respiratory center.", "a": "التعريف: هو توقف التنفس بسبب تثبيط مركز التنفس.", "x": "الفرق عن الاختناق: هنا المشكلة في مركز التحكم مش في المجرى."}, {"e": "Causes: 1. Voluntary apnea.", "a": "الأسباب: 1. انقطاع النفس الإرادي.", "x": "لما تكتم نفسك بإرادتك."}, {"e": "2. During swallowing.", "a": "2. أثناء البلع.", "x": "التنفس بيقف لحظة وإنت بتبلع."}, {"e": "3. Following hyperventilation.", "a": "3. بعد فرط التهوية.", "x": "بعد ما تتنفس بسرعة وبعمق، الـ CO2 بيقل فمركز التنفس مبيشتغلش لفترة."}, {"e": "4. In periodic breathing.", "a": "4. في التنفس الدوري.", "x": "نمط تنفس بيتخلله توقف على فترات."}, {"e": "5. Drugs: e.g. morphine and adrenaline.", "a": "5. الأدوية: زي المورفين والأدرينالين.", "x": "أدوية بتثبّط مركز التنفس."}, {"e": "6. Damage of the respiratory centers.", "a": "6. تلف مراكز التنفس.", "x": "لو المركز نفسه اتضرر مبيبعتش أوامر."}, {"h": "III. Hypoxia"}, {"e": "Definition: It is the decreased O2 available for tissue utilization i.e. decreased O2 at tissue level.", "a": "التعريف: هو نقص الأكسجين المتاح لاستخدام الأنسجة، يعني نقص الأكسجين عند مستوى الأنسجة.", "x": "الأنسجة مش واخدة الأكسجين اللي محتاجاه."}, {"e": "Types: 1. Hypoxic hypoxia: due to decreased oxygenation of blood in the lungs. Both arterial and venous O2 are lower than normal.", "a": "الأنواع: 1. نقص الأكسجة النوع الناقص (Hypoxic): بسبب قلة أكسجة الدم في الرئة. الأكسجين الشرياني والوريدي الاتنين أقل من الطبيعي.", "x": "المشكلة من الأول: الدم خارج من الرئة مش مشبّع أصلاً."}, {"e": "Causes: a. Decreased O2 in inspired air (e.g. on high altitudes). b. Lung diseases. c. Congenital heart diseases.", "a": "الأسباب: أ. نقص الأكسجين في الهوا الداخل (زي الأماكن العالية). ب. أمراض الرئة. ج. أمراض القلب الخلقية.", "x": "في الجبال الهوا مخلخل، فالأكسجين فيه قليل."}, {"e": "2. Anemic hypoxia: due to decreased hemoglobin available for carrying O2.", "a": "2. نقص الأكسجة الأنيمي: بسبب قلة الهيموجلوبين المتاح لحمل الأكسجين.", "x": "الأكسجين موجود بس مفيش شنط كفاية تشيله."}, {"e": "Causes: a. All types of anemia. b. Carbon monoxide poisoning. c. Abnormal types of hemoglobin: e.g. met-Hb.", "a": "الأسباب: أ. كل أنواع الأنيميا. ب. التسمم بأول أكسيد الكربون. ج. أنواع هيموجلوبين غير طبيعية زي الميت هيموجلوبين.", "x": "أول أكسيد الكربون بيحتل مكان الأكسجين على الهيموجلوبين."}, {"e": "3. Stagnant hypoxia: due to sluggish circulation to an organ, causing stagnation of blood.", "a": "3. نقص الأكسجة الركودي: بسبب بطء الدورة الدموية لعضو معين، فالدم بيركد.", "x": "الدم واقف بدل ما يمشي."}, {"e": "The arterial O2 is normal, but the venous O2 is very low.", "a": "الأكسجين الشرياني طبيعي، لكن الوريدي قليل جداً.", "x": "الدم بيفضل مدة طويلة في العضو فالأنسجة بتاخد كل الأكسجين اللي فيه."}, {"e": "4. Histotoxic hypoxia: due to paralysis of the respiratory enzymes by cyanide or alcohol poisoning.", "a": "4. نقص الأكسجة السمّي النسيجي (Histotoxic): بسبب شلل إنزيمات التنفس بالسيانيد أو التسمم بالكحول.", "x": "الأنزيمات هي اللي بتحرق الأكسجين جوه الخلية، ولما تتعطل الأكسجين يفضل موجود بس مش بيتستخدم."}, {"e": "Arterial O2 is not utilized by tissues. So arterial O2 is normal, but venous O2 is high.", "a": "الأكسجين الشرياني مبيتستخدمش في الأنسجة، فالشرياني طبيعي، لكن الوريدي عالي.", "x": "الدم راجع بنفس الأكسجين اللي رايح بيه لأن الخلايا مخدتش حاجة."}, {"h": "IV. Cyanosis"}, {"f": "cyan"}, {"e": "Definition: It is a blue color of the skin and mucous membranes due to increase the amount of reduced hemoglobin more than 5 gm/dl.", "a": "التعريف: هو لون أزرق في الجلد والأغشية المخاطية بسبب زيادة كمية الهيموجلوبين المختزل عن 5 جم/ديسيلتر.", "x": "الهيموجلوبين اللي سايب أكسجينه لونه غامق، فلما يكتر الجلد يبقى أزرق."}, {"e": "Causes of cyanosis: 1) Asphyxia.", "a": "أسباب الزرقة: 1) الاختناق.", "x": "نقص الأكسجين في الدم."}, {"e": "2) Hypoxic and stagnant hypoxia.", "a": "2) نقص الأكسجة الناقص والركودي.", "x": "النوعين اللي فيهم الدم الوريدي قليل الأكسجين."}, {"e": "3) Cold weather.", "a": "3) الجو البارد.", "x": "البرد بيقلل الدم الواصل للأطراف."}, {"e": "4) Polycythemia (much increase in RBCs count).", "a": "4) زيادة كرات الدم الحمراء بشكل كبير (Polycythemia).", "x": "كرات أكتر معناها كمية هيموجلوبين مختزل أكبر."}, {"h": "Types of cyanosis"}, {"e": "Central cyanosis: Caused by decreased O2 in the lung. | Peripheral cyanosis: Caused by decrease blood flow to certain site.", "a": "الزرقة المركزية: سببها نقص الأكسجين في الرئة. | الزرقة الطرفية: سببها نقص تدفق الدم لمكان معين.", "x": "المركزية المشكلة في الرئة، والطرفية المشكلة في الدورة."}, {"e": "Central: Affects all the body including the tongue. | Peripheral: Affects peripheral tissues and not the tongue.", "a": "المركزية: بتأثر على الجسم كله بما فيه اللسان. | الطرفية: بتأثر على الأطراف ومش بتأثر على اللسان.", "x": "اللسان هو العلامة الفاصلة بينهم."}, {"e": "Central: Hands are warm. | Peripheral: Hands are cold.", "a": "المركزية: الإيدين دافية. | الطرفية: الإيدين باردة.", "x": "البرودة معناها إن الدم مش واصل كفاية."}, {"e": "Central: Improved by O2 therapy. | Peripheral: Not improved by O2 therapy.", "a": "المركزية: بتتحسن بالعلاج بالأكسجين. | الطرفية: مبتتحسنش بالعلاج بالأكسجين.", "x": "لأن في الطرفية المشكلة مش في الأكسجين، المشكلة إن الدم مش بيوصل."}, {"f": "types"}]}];
