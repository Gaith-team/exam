const app=document.getElementById('app'),chips=document.getElementById('chips');
S.forEach((s,n)=>{
  const id='s'+n;
  const a=document.createElement('a');a.className='chip';a.href='#'+id;a.textContent=(n+1)+'. '+s.t;chips.appendChild(a);
  let h=`<section class="sec" id="${id}"><div class="sh"><div class="n">${n+1}</div><h2>${s.i} ${s.t}</h2></div>`;
  s.items.forEach(it=>{
    if(typeof it==='string'){h+=`<div class="sub">${it}</div>`;return;}
    h+=`<div class="item"><div class="en">${it[0]}</div><div class="ar">${it[1]}</div><div class="ex"><span class="lb">عشان تفهمها:</span>${it[2]}</div></div>`;
  });
  app.insertAdjacentHTML('beforeend',h+'</section>');
});
const tb=document.getElementById('tbtn'),topBtn=document.getElementById('top');
function th(t){document.documentElement.setAttribute('data-theme',t);tb.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}}
let cur='light';try{cur=localStorage.getItem('theme')||'light'}catch(e){}
th(cur);tb.onclick=()=>{cur=cur==='dark'?'light':'dark';th(cur)};
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});
const secs=[...document.querySelectorAll('.sec')],cs=[...document.querySelectorAll('.chip')];
addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  document.getElementById('bar').style.width=(h>0?scrollY/h*100:0)+'%';
  topBtn.style.display=scrollY>400?'block':'none';
  let k=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)k=i});
  cs.forEach((c,i)=>c.classList.toggle('on',i===k));
});
