<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Palette: leaf green (vegetables) · citrus orange (fruit) · grain gold (cereals) · berry pink (antioxidants) */
:root {
  --accent:#15803d; --accent-light:#4ade80; --accent-dark:#14532d; --accent-glow:rgba(21,128,61,0.2); --accent-rgb:21,128,61;
  --c2:#ea580c; --c3:#ca8a04; --c4:#be185d;
  --grad:linear-gradient(135deg,#14532d 0%,#15803d 40%,#65a30d 75%,#ea580c 100%);
  --grad-soft:linear-gradient(135deg,#15803d,#65a30d);
  --bg:#f6faf5; --bg2:#eaf3e7; --card:#ffffff; --text:#14231a; --text2:#3f5546; --text3:#738a7a;
  --bc:rgba(20,60,30,0.10); --success:#15803d; --danger:#dc2626; --warn:#d97706; --r:16px;
  --tr:all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:#0b140e; --bg2:#111e15; --card:#16261b; --text:#e8f5ec; --text2:#b8d2c0; --text3:#7f9a88;
  --bc:rgba(255,255,255,0.09); --accent:#4ade80; --accent-light:#86efac; --accent-dark:#22c55e;
  --accent-glow:rgba(74,222,128,0.2); --accent-rgb:74,222,128; --c2:#fb923c; --c3:#facc15; --c4:#f472b6;
  --success:#4ade80; --danger:#f87171;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c3),var(--c2),var(--c4)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(246,250,245,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(11,20,14,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); transform:rotate(20deg); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 44px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(250,204,21,.28) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(234,88,12,.25) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.ecg { position:absolute !important; left:0; right:0; bottom:10px; width:100%; height:46px; opacity:.4; pointer-events:none; }
.ecg path { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1200; stroke-dashoffset:1200; animation:ecgDraw 2.6s ease-out forwards; }
@keyframes ecgDraw { to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce) { .ecg path { animation:none; stroke-dashoffset:0; } }
.hero-band-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.18); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.88); }
.hero-band-meta { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.16); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:560px; margin:0 auto; padding:24px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; }
.stat-box:nth-child(1) { border-top:3px solid var(--success); }
.stat-box:nth-child(2) { border-top:3px solid var(--danger); }
.stat-box:nth-child(3) { border-top:3px solid var(--c2); }
.stat-box .val { font-size:20px; font-weight:900; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c2); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:8px; background:var(--bg2); border-radius:8px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c3),var(--c2),var(--c4)); border-radius:8px; transition:width .4s; }
.timer-badge { min-width:64px; height:36px; border-radius:18px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; }
.timer-badge.warn { color:var(--warn); border-color:rgba(217,119,6,.3); background:rgba(217,119,6,.08); }
.timer-badge.danger { color:var(--danger); border-color:rgba(220,38,38,.3); background:rgba(220,38,38,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(20,90,40,.08); transition:box-shadow .3s; }
.q-header { background:var(--grad); padding:4px 18px; display:flex; align-items:center; gap:8px; }
.q-num { background:rgba(255,255,255,.2); border-radius:8px; padding:3px 10px; font-size:11px; font-weight:700; color:#fff; }
.q-text { padding:22px 18px 14px; font-size:15px; font-weight:700; color:var(--text); line-height:1.65; border-bottom:1px solid var(--bc); text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:10px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:12px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:hover:not(.disabled) { border-color:var(--c2); background:rgba(234,88,12,.07); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:8px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { background:rgba(21,128,61,.12); color:#15803d; border-color:rgba(21,128,61,.35); }
.opt:nth-child(2) .opt-letter { background:rgba(234,88,12,.12); color:#ea580c; border-color:rgba(234,88,12,.35); }
.opt:nth-child(3) .opt-letter { background:rgba(202,138,4,.16); color:#a16207; border-color:rgba(202,138,4,.4); }
.opt:nth-child(4) .opt-letter { background:rgba(190,24,93,.12); color:#be185d; border-color:rgba(190,24,93,.35); }
.opt.correct { border-color:var(--success); background:rgba(21,128,61,.09); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(220,38,38,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:12px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(21,128,61,.1); color:var(--success); border:1px solid rgba(21,128,61,.25); }
.feedback-bar.no { background:rgba(220,38,38,.08); color:var(--danger); border:1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:10px; border-right:3px solid var(--c3); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:12px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline:3px solid var(--c2); outline-offset:2px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(21,128,61,.25); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(21,128,61,.35); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:20px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(20,90,40,.08); border-top:5px solid transparent; background-image:linear-gradient(var(--card),var(--card)),var(--grad); background-origin:border-box; background-clip:padding-box,border-box; }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:10px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:14px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 8px; border-radius:6px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(220,38,38,.1); color:var(--danger); } .ri-right { background:rgba(21,128,61,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#ea580c,#15803d); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(21,128,61,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 38px;} }
</style>
</head>

<script>
const QUESTIONS = [
  {t:"Nutrition screening is best described as:", o:["A detailed laboratory investigation", "A quick first step to identify people at nutritional risk", "A long-term follow-up plan", "A treatment protocol for malnutrition"], a:1},
  {t:"The mnemonic ABCD for nutrition assessment stands for:", o:["Age, Blood, Calories, Diet", "Appetite, BMI, Cholesterol, Diet", "Anthropometric, Biochemical, Clinical, Dietary", "Assessment, Biochemical, Care, Diagnosis"], a:2},
  {t:"Which of the following is an anthropometric measurement?", o:["Hemoglobin", "24-hour recall", "Edema", "Waist circumference"], a:3},
  {t:"Hemoglobin is commonly used in assessing:", o:["Anemia", "Diabetes", "Hypertension", "Obesity"], a:0},
  {t:"BMI is calculated as:", o:["Weight (kg) ÷ height (m)", "Height (m²) ÷ weight (kg)", "Weight (kg) × height (m)", "Weight (kg) ÷ height² (m²)"], a:3},
  {t:"According to WHO, the normal BMI range for adults is:", o:["16.0–18.4", "18.5–24.9", "25.0–29.9", "30.0–34.9"], a:1},
  {t:"An adult with a BMI of 32 is classified as:", o:["Normal weight", "Underweight", "Overweight", "Obese"], a:3},
  {t:"Which assessment method includes the 24-hour recall?", o:["Dietary", "Clinical", "Biochemical", "Anthropometric"], a:0},
  {t:"Which of the following is NOT a purpose of nutrition assessment?", o:["Determine the person's nutritional status", "Identify risk of malnutrition", "Replace the medical diagnosis", "Monitor changes after nutrition intervention"], a:2},
  {t:"Skinfold thickness gives an estimate related to:", o:["Visceral organ fat", "Subcutaneous body fat", "Muscle mass only", "Bone density"], a:1},
  {t:"How many skinfold measurements should be taken for accuracy?", o:["One", "Two", "Five", "Three"], a:3},
  {t:"MUAC is measured at:", o:["The wrist", "Midway between shoulder and elbow", "Just below the elbow", "The armpit"], a:1},
  {t:"The mentioned MUAC range in children below five years is:", o:["5.0–7.0", "8.0–10.0", "11.5–13.5", "15.0–18.0"], a:2},
  {t:"Waist circumference above which value indicates INCREASED risk in women?", o:["70 cm", "90 cm", "88 cm", "80 cm"], a:3},
  {t:"Waist circumference above which value indicates SUBSTANTIALLY increased risk in men?", o:["94 cm", "102 cm", "88 cm", "110 cm"], a:1},
  {t:"Waist/Hip Ratio (WHR) is calculated as:", o:["Hip ÷ waist", "Waist × hip", "Waist + hip", "Waist ÷ hip"], a:3},
  {t:"A WHR of ≥ 0.85 indicates increased risk in:", o:["Men", "Children", "Women", "Infants only"], a:2},
  {t:"A WHR of ≥ 0.90 indicates increased risk in:", o:["Men", "Women", "Children under 5", "Pregnant women only"], a:0},
  {t:"Waist = 80 cm and hip = 100 cm. What is the WHR?", o:["0.08", "1.25", "8.0", "0.80"], a:3},
  {t:"Which dietary assessment method asks about the usual frequency of selected foods over a period?", o:["24-hour recall", "Food Frequency Questionnaire (FFQ)", "Food record", "Anthropometry"], a:1},
  {t:"Which of the following belongs to clinical assessment?", o:["Lipid profile", "Skinfold thickness", "Signs such as muscle wasting or edema", "Food Frequency Questionnaire"], a:2},
  {t:"Which is a main limitation of the 24-hour recall?", o:["It requires laboratory equipment", "It is the most time-consuming method", "It cannot ask about drinks", "Memory and portion-size estimation; one day may not represent usual intake"], a:3},
  {t:"Which dietary method may affect the person's usual eating behavior?", o:["Food record/diary", "24-hour recall", "Diet history", "Waist circumference"], a:0},
  {t:"A main limitation of the Food Frequency Questionnaire is that it is:", o:["Based on only one day", "Limited by the food list and memory", "Dependent on laboratory tests", "Only for children"], a:1},
  {t:"The main limitation of diet history is that it is:", o:["Not related to eating patterns", "Affected by hydration", "More time-consuming", "Based on a single day"], a:2},
  {t:"Why can BMI be misleading in a very muscular person?", o:["It cannot be calculated for adults", "It uses age instead of weight", "It ignores height", "It does not directly distinguish fat mass from muscle mass"], a:3},
  {t:"A nurse quickly identifies a patient who may be at nutritional risk and refers for further evaluation. This step is:", o:["Nutrition assessment", "Nutrition screening", "Nutrition intervention", "Nutrition monitoring"], a:1},
  {t:"For children under 5 years, WHO recommends:", o:["Using adult BMI cut-offs", "Measuring weight only", "Measuring both weight and length/height using WHO growth standards", "Using MUAC only"], a:2},
  {t:"Why should a laboratory result not be interpreted alone?", o:["Disease, inflammation, hydration and medications can affect values", "Laboratory tests are unrelated to nutrition", "Only dietary information matters", "Results are always inaccurate"], a:0},
  {t:"A man has a waist circumference of 100 cm. How is his risk categorized?", o:["Substantially increased risk", "No increased risk", "Cannot be assessed", "Increased risk"], a:3},
  {t:"A woman has a waist circumference of 90 cm. How is her risk categorized?", o:["No increased risk", "Increased risk only", "Substantially increased risk", "Cannot be assessed"], a:2},
  {t:"A man has waist = 90 cm and hip = 100 cm. What does his WHR indicate?", o:["0.90, at the increased-risk cut-off", "0.90, below the cut-off", "1.11, normal", "0.09, normal"], a:0},
  {t:"A 4-year-old child's nutritional status should be judged using:", o:["Adult BMI cut-offs", "WHO age- and sex-specific growth standards", "Waist circumference cut-offs for adults", "A single hemoglobin value"], a:1},
  {t:"A patient has unintentional weight loss and reduced food intake. What is the most appropriate approach?", o:["Rely on BMI alone", "Rely on one laboratory test", "Combine anthropometric, biochemical, clinical and dietary information and refer when risk is identified", "Wait without documenting findings"], a:2},

  {t:"Nutrition screening is a quick first step used to identify people who may be at nutritional risk.", o:["True","False"], a:0},
  {t:"BMI directly distinguishes fat mass from muscle mass.", o:["True","False"], a:1},
  {t:"Hemoglobin is commonly used in assessing anemia.", o:["True","False"], a:0},
  {t:"Adult BMI cut-offs should be used to assess children.", o:["True","False"], a:1},
  {t:"Three skinfold measurements should be taken for accuracy.", o:["True","False"], a:0},

  {t:"A WHR of 0.85 or more indicates increased risk in women.", o:["True","False"], a:0},
  {t:"MUAC is measured midway between the shoulder and the elbow.", o:["True","False"], a:0},
  {t:"A single 24-hour recall always represents a person's usual intake.", o:["True","False"], a:1},
  {t:"A food record may affect usual eating behavior.", o:["True","False"], a:0},
  {t:"A waist circumference above 102 cm in men indicates substantially increased risk.", o:["True","False"], a:0},
  {t:"The Food Frequency Questionnaire asks only about foods eaten in the previous 24 hours.", o:["True","False"], a:1},
  {t:"Clinical signs may be caused by more than one condition.", o:["True","False"], a:0},
  {t:"For children under 5 years, WHO recommends measuring weight only.", o:["True","False"], a:1},
  {t:"Cut-off points are exactly the same for all populations and ethnicities.", o:["True","False"], a:1},
];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 35*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🥗', l:['#15803d','21,128,61','#14532d','#15803d','#65a30d'], d:['#4ade80','74,222,128'] },   /* خضار */
  { icon:'🍊', l:['#ea580c','234,88,12','#9a3412','#ea580c','#ca8a04'], d:['#fb923c','251,146,60'] },   /* فاكهة */
  { icon:'🍇', l:['#be185d','190,24,93','#831843','#be185d','#7c3aed'], d:['#f472b6','244,114,182'] },  /* مضادات أكسدة */
  { icon:'🌾', l:['#ca8a04','202,138,4','#854d0e','#ca8a04','#15803d'], d:['#facc15','250,204,21'] }    /* حبوب */
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
</html>
