<script>
const S=[
{h:"Therapeutic Nutrition",ic:"🥗",k:"#15803d",p:[
["Therapeutic nutrition is the use of nutrients to support the body’s immune and healing systems, thereby altering the course and outcome of a disease process.","يعني بنستخدم العناصر الغذائية في الأكل عشان نقوّي مناعة الجسم وقدرته على الشفا، وبكده نغيّر مسار المرض ونتيجته.","زي العربية لما تدّيها بنزين كويس بتمشي أحسن، وجسم المريض لما ياخد أكل مظبوط بيقاوم المرض أسرع."],
["Therapeutic nutrition is the use of food as a medical tool and benefiting from the nutrients found in food to overcome and prevent many health problems. It is an essential element in treating many diseases, and in some cases, it may be the only means of treatment.","الأكل هنا بيتعامل معاه كأنه أداة علاج، بنستفيد من اللي فيه عشان نعالج مشاكل صحية كتير ونمنعها، وفي حالات بيبقى هو العلاج الوحيد.","زي حد عنده حساسية من أكلة معينة؛ العلاج الأساسي إنه يبطّل ياكلها من غير أي دوا."]]},
{h:"The Importance of Therapeutic Nutrition",ic:"⭐",k:"#ea580c",p:[
["Alleviating the pathological symptoms associated with certain diseases that bother the patient.","بتخفف الأعراض المرضية اللي بتتعب المريض.","زي ما ياكل أكل خفيف على المعدة فيرتاح من الحرقان."],
["Preventing and reducing complications associated with some diseases.","بتمنع أو بتقلل المضاعفات اللي بتيجي مع بعض الأمراض.","مريض السكر لو نظّم أكله بيبعد عن مضاعفات المرض."],
["Strengthening the individual's health status and preventing malnutrition.","بتقوّي الحالة الصحية للشخص وبتحميه من سوء التغذية.","جسمك بياخد كل اللي محتاجه فمبيضعفش ولا بيحصله نقص."]]},
{h:"Basics of Therapeutic Nutrition",ic:"📘",k:"#ca8a04",p:[
["By knowing the basics of therapeutic nutrition, an individual becomes able to deal with their body in a different way to prevent diseases and raise the body's immunity level. Its basics include following a balanced diet that provides the body with essential elements in precise amounts.","لما تعرف الأساسيات هتتعامل مع جسمك بطريقة مختلفة تمنع بيها الأمراض وتزوّد المناعة. وأساسها إنك تتبع أكل متوازن بيدّي الجسم العناصر الضرورية بكميات دقيقة.","زي مقادير الوصفة، لو زوّدت أو نقّصت الطعم بيبوظ، والجسم كمان."],
["One of the tasks of a therapeutic nutrition specialist is determining these amounts according to each individual's health status.","من مهام أخصائي التغذية العلاجية إنه يحدد الكميات دي حسب الحالة الصحية لكل شخص.","زي الدكتور اللي بيكتب جرعة مختلفة لكل مريض، الأخصائي بيحدد كمية الأكل لكل مريض."]]},
{h:"Principles of the Therapeutic Diet",ic:"📋",k:"#be185d",p:[
["Reducing the chances of patient relapse and the risk of complications.","نقلل فرص رجوع المرض للمريض وخطر المضاعفات.","زي ما تصلّح العربية كويس عشان متعطلش تاني."],
["The diet should contain all necessary nutrients, except for elements that do not suit the individual's health status.","الدايت لازم يحتوي كل العناصر الضرورية، ما عدا العناصر اللي مش مناسبة لحالة المريض.","مريض الضغط ياكل كل العناصر بس يقلل الملح."],
["Educating the patient and their family about the reasons for and importance of following this diet.","نفهّم المريض وأهله ليه بنتبع الدايت ده وأهميته.","لما المريض يعرف السبب بيلتزم، ومش بيحس إنه حرمان."],
["Providing food in the usual manner so the patient does not lose their appetite.","نقدّم الأكل بشكله المعتاد عشان المريض ما تروحش شهيته.","لو الأكل شكله غريب المريض مش هيقرّب منه."],
["Rebalancing the body's components of salts, proteins, carbohydrates, and fats.","نرجّع التوازن بين الأملاح والبروتينات والكربوهيدرات والدهون في الجسم.","زي الميزان، لو كفة تقلت نعدّلها."],
["Paying attention to the amount of water and fluids in the body.","ناخد بالنا من كمية المياه والسوائل في الجسم.","فيه حالات بنزوّد السوائل (زي الإسهال) وحالات بنقللها (زي الاستسقاء)."],
["Ensuring a balance between therapeutic nutrition and the medications the patient is taking.","نتأكد إن الأكل العلاجي متوافق مع الأدوية اللي المريض بياخدها.","الأكل والدوا بيشتغلوا مع بعض، فلازم ما يتعارضوش."],
["Correcting malnutrition and stimulating the patient's systems to get the maximum benefit from food.","نصلّح سوء التغذية وننشّط أجهزة المريض عشان تستفيد من الأكل لأقصى درجة.","الجسم لازم يهضم ويمتص كويس عشان الأكل يفيده فعلاً."]]},
{h:"Components of an Integrated Therapeutic Meal",ic:"🍽️",k:"#15803d",p:[
["Cereal Products: (Rice, pasta, bread, oats, barley) to provide fiber and minerals.","منتجات الحبوب (رز، مكرونة، عيش، شوفان، شعير) بتدّي ألياف ومعادن.","الشوفان والعيش الأسمر بيشبّعوك ويفيدوا الهضم."],
["Dairy Products: It is preferable to consume low-fat or fat-free varieties.","الأفضل منتجات الألبان قليلة الدسم أو خالية الدسم.","اللبن الخالي الدسم بيدّيك الألبان من غير دهون زيادة."],
["Vegetables and Fruits: It is best to eat them unpeeled to preserve fiber.","الأحسن تاكل الخضار والفاكهة بقشرها عشان الألياف ما تضيعش.","القشرة فيها الألياف، فلو قشّرت التفاحة بترمي جزء من فايدتها."],
["Meat and Fish: Consume grilled meats free of fat and skin, and fish at least twice a week for Omega-3.","اللحوم تبقى مشوية من غير دهن وجلد، والسمك مرتين في الأسبوع على الأقل عشان الأوميجا 3.","فرخة مشوية من غير جلد أحسن من المقلية."]]},
{h:"Avoid (Nutrition Care Guidelines for GERD)",ic:"🚫",k:"#be185d",p:[
["Avoid: Irritants as smoking, coffee, strong tea, chocolate","تتجنب المهيجات زي التدخين والقهوة والشاي التقيل والشوكولاتة.","دول بيهيّجوا المعدة والمريء فالحرقان بيزيد."],
["Avoid: Excessive high-fat meals","تتجنب الوجبات العالية الدهون بزيادة.","الأكلة الدسمة بتقعد في المعدة وقت أطول."],
["Avoid: Peppermint","تتجنب النعناع الفلفلي (Peppermint).","حتى لو في شكل شاي."],
["Avoid: Eating at least 2 to 3 hours before going to bed","تتجنب الأكل قبل النوم بـ 2 لـ 3 ساعات.","سيب فاصل ساعتين تلاتة بين آخر أكلة والنوم بدل ما تنام على معدة مليانة."],
["Avoid: Certain medications (e.g., anticholinergics)","تتجنب بعض الأدوية زي مضادات الكولين (anticholinergics).","الأدوية دي ممكن تزوّد المشكلة، فبنراجعها مع الدكتور."],
["It can be used as a preventative, or can be used as a therapy.","العلاج بالتغذية ممكن يتستخدم للوقاية أو كعلاج.","ينفع تاكل صح عشان متتعبش أصلاً، أو عشان تتعالج لو تعبان."]]},
{h:"Nutrition Care Guidelines for Peptic Ulcer",ic:"🔥",k:"#ea580c",p:[
["Common Food Triggers to Avoid: High-fat foods (fried foods, animal fat, excess oils)","من المحفزات اللي تتجنبها: الأكلات العالية الدهون (المقليات، الدهون الحيوانية، الزيت الكتير).","المقلي بيهيّج المعدة ويبطّأ الهضم."],
["Common Food Triggers to Avoid: Acidic foods (tomatoes, citrus fruits)","الأكلات الحمضية (الطماطم والموالح).","الحموضة بتلسع جدار المعدة اللي فيه القرحة."],
["Common Food Triggers to Avoid: Caffeine and chocolate","الكافيين والشوكولاتة.","قهوة وشاي وشوكولاتة، كلهم تبعد عنهم."],
["Common Food Triggers to Avoid: Spicy foods (mint, garlic, onions)","الأكل الحار (النعناع والثوم والبصل).","النعناع بيتحسب هنا مع الأكل الحار."],
["7 Soothing Foods To Choose Instead: Vegetables, Ginger, Oatmeal, Egg whites, Lean meat + seafood, Non-citrus fruits, Healthy fats","سبع أكلات مهدّئة تختارها بدل كده: خضار، زنجبيل، شوفان، بياض البيض، لحوم قليلة الدهن مع مأكولات بحرية، فاكهة غير حمضية، دهون صحية.","بدل البرتقال خد موزة، وبدل اللحمة الدسمة اختار لحمة قليلة الدهن."],
["Foods that prevent or heal ulcers: Avocados, Raw honey, Cabbage, Kale, Spinach, Brussels sprouts, Celery","أكلات بتمنع القرحة أو بتساعد على شفاها: أفوكادو، عسل خام، كرنب، كيل، سبانخ، كرنب بروكسل، كرفس.","أغلبهم خضار ورقي، فاكر إن الخضار الورقي صاحب القرحة."],
["Foods to avoid with ulcers: Milk, Alcohol, Buttery pastries, Bacon, Mayonnaise, French fries, Red meat","أكلات تتجنبها مع القرحة: لبن، كحول، معجنات بالزبدة، بيكون، مايونيز، بطاطس مقلية، لحمة حمرا.","أغلبهم دسمين أو مهيّجين، ولاحظ إن اللبن جاي ضمن الممنوعات في المحاضرة."]]},
{h:"Nutrition Care Guidelines for Constipation",ic:"💧",k:"#ca8a04",p:[
["Consume: at least 2 liters of fluid per day","اشرب على الأقل 2 لتر سوائل في اليوم.","السوائل بتلين البراز وتسهّل خروجه."],
["Consume: Food high in fibers.","كُل أكل غني بالألياف.","زي الخضار والفاكهة والعيش الأسمر."],
["Avoid: White sugar","تتجنب السكر الأبيض.","ملهوش ألياف تساعد الأمعاء."],
["Avoid: Most “if not all” dairy products","تتجنب أغلب منتجات الألبان (لو مش كلها).","الألبان ممكن تزوّد الإمساك."],
["Replacement of necessary fluids and electrolytes is the first step","أول خطوة هي تعويض السوائل والأملاح (الإلكتروليتات) الضرورية.","الجسم بيخسرهم بسرعة، فنعوّضهم الأول قبل أي حاجة."]]},
{h:"Diarrhea: Avoid / Consume",ic:"🍌",k:"#15803d",p:[
["Avoid: Sugar, alcohols\nAvoid: Hot peppers\nAvoid: Legumes","تتجنب السكر والكحوليات والفلفل الحار والبقوليات.","كلها بتهيّج الأمعاء أو بتزوّد الحركة والغازات."],
["Consume: BRAT diet (Bananas, Rice, Apple sauce, Toast)","كُل دايت BRAT: موز، رز، صلصة تفاح، توست.","أكل خفيف ومش بيهيّج الأمعاء، وبيساعد على تماسك البراز."],
["Then: Starchy carbohydrates such as cereals, bread, and low-fat meats, followed by small amounts of vegetables and fruits, followed by fats.","بعد كده: نشويات زي الحبوب والعيش واللحوم قليلة الدهن، وبعدها كميات صغيرة من الخضار والفاكهة، وبعدها الدهون.","بنرجّع الأكل بالتدريج من الأخف للأتقل."],
["Foods to avoid when you have diarrhea: Hot pepper, Coffee, Alcohol, Citrus fruits, Milk, Red meat, Nuts, Legumes, Sugar substitutes, Cruciferous vegetables","أكلات تتجنبها وقت الإسهال: فلفل حار، قهوة، كحول، موالح، لبن، لحمة حمرا، مكسرات، بقوليات، بدائل السكر، الخضار الصليبية.","دي كلها ممكن تهيّج الأمعاء أو تعمل غازات."],
["Food items in the BRAT diet (Banana, Rice, Applesauce, and Toast) are believed to be very effective in preventing diarrhea.","أكلات الـ BRAT (موز، رز، صلصة تفاح، توست) بيُعتقد إنها فعّالة جداً في منع الإسهال.","اربط الحروف B R A T بالأكلات الأربعة."]]},
{h:"Nutrition Care Guidelines for Irritable Bowel Syndrome",ic:"🌀",k:"#be185d",p:[
["Avoid:\n• Food allergens as fermentable sugar\n• Foods that increase gas as legumes\n• Spicy and processed food.","تتجنب: مسببات الحساسية الغذائية زي السكر القابل للتخمر، والأكلات اللي بتزوّد الغازات زي البقوليات، والأكل الحار والمصنّع.","اللي بيعمل غازات وانتفاخ بيزوّد أعراض القولون."],
["Consume:\n• Dietary fibers wisely\n• Drink plenty of water\n• Use of food diaries.\n• Prebiotics and probiotics","كُل: ألياف بحكمة، واشرب مياه كتير، واستخدم مفكرة الأكل، وخد البريبايوتكس والبروبيوتكس.","مفكرة الأكل بتكتب فيها اللي أكلته والأعراض عشان تعرف إيه اللي بيتعبك."],
["That Gut Feeling: While with IBS, trial and error is the best way to figure out what is good for you and what isn’t.","مع الـ IBS أحسن طريقة تعرف إيه اللي كويس ليك وإيه اللي مش كويس هي التجربة والخطأ.","كل شخص قولونه بيتعامل مع الأكل بشكل مختلف."],
["Dos:\n• Exercise for at least 30 minutes every day\n• Drink plenty of fluids and at least two litres of water every day\n• Use calming techniques like meditation to destress\n• Eat at least one fruit a day, best to pick organic seasonal fruits and vegetables\n• Eat fibre-rich food in moderation","اعمل: تمرين 30 دقيقة على الأقل كل يوم، واشرب سوائل كتير ولتريّن مياه على الأقل في اليوم، واستخدم تقنيات التهدئة زي التأمل، وكُل فاكهة واحدة على الأقل في اليوم (الأفضل عضوية وموسمية)، وكُل الأكل الغني بالألياف باعتدال.","الراحة النفسية والحركة بيفيدوا القولون زي الأكل بالظبط."],
["Don’ts:\n• Don’t overindulge in fatty and sugary foods\n• Avoid caffeine, alcohol and carbonated drinks\n• Avoid spicy food\n• Limit intake of processed food\n• Don’t overeat; eat small portions at regular intervals\n• Don’t skip meals, especially breakfast","ماتعملش: ماتفرطش في الدهون والسكريات، وتجنب الكافيين والكحول والمشروبات الغازية والأكل الحار، وقلل المصنّعات، وماتاكلش كتير (كُل وجبات صغيرة في مواعيد منتظمة)، وماتفوّتش وجبات خصوصاً الفطار.","وجبات صغيرة منتظمة أحسن من وجبة كبيرة بتتعب القولون."]]},
{h:"Nutrition Care Guidelines for Chronic Hepatic Patients",ic:"🫀",k:"#ea580c",p:[
["Avoid: Hepatotoxic substances (e.g., alcohol, drugs)","تتجنب المواد السامة للكبد (زي الكحول والأدوية).","الكبد تعبان فمنزودش عليه حاجة تضره."],
["Avoid: Fat should not exceed 30% of total kilocalories.","الدهون ماتزيدش عن 30% من إجمالي السعرات.","نسبة ثابتة تحفظها من إجمالي السعرات."],
["Avoid: Fluid restrictions are indicated for those with ascites.","بنقيّد السوائل لمرضى الاستسقاء (Ascites).","الاستسقاء تجمّع سوائل في البطن، فتقليل السوائل بيساعد."],
["Consume: 4 to 6 small meals per day","كُل من 4 لـ 6 وجبات صغيرة في اليوم.","وجبات صغيرة بتريّح الجسم وتخلّيه ياخد احتياجه."],
["Consume: Diet adequate in energy","دايت كافي في الطاقة.","لازم السعرات تكفي احتياج الجسم."],
["Consume: Vitamin and mineral supplementation are needed","محتاج مكمّلات فيتامينات ومعادن.","الكبد المريض ممكن يسبب نقص فيها."],
["Consume: Total energy intake should equal basal energy needs plus approximately 20%.","إجمالي الطاقة = احتياج الراحة الأساسي (BMR) + حوالي 20%.","احسب الأساسي وزوّد عليه الخمس تقريباً."],
["Consume: Protein 1 to 1.5 g/kg of dry body weight","بروتين من 1 لـ 1.5 جم لكل كجم من وزن الجسم الجاف.","حفظ الرقم: واحد لواحد ونص."],
["Weight and physical activity: Burn at least as many calories as consumed.","الوزن والنشاط: احرق سعرات على الأقل بقد اللي بتاكلها.","اللي دخل لازم يخرج عشان الوزن يفضل ثابت."],
["Aim for at least 30 minutes of physical activity on most, if not all, days.","استهدف 30 دقيقة نشاط بدني على الأقل في أغلب الأيام (لو مش كلها).","مشي نص ساعة كل يوم."]]},
{h:"Nutrition Care Guidelines for Coronary Heart Disease",ic:"❤️",k:"#be185d",p:[
["Foods to focus on: Vegetables, fruits, whole-grain products, nuts, low-fat dairy products.","ركّز على: الخضار والفاكهة ومنتجات الحبوب الكاملة والمكسرات ومنتجات الألبان قليلة الدسم.","كلها أكل صحي للقلب."],
["Foods to focus on: Lean meats such as poultry.","ركّز على اللحوم قليلة الدهن زي الدواجن.","الفراخ من غير جلد أحسن من اللحمة الحمرا."],
["Foods to focus on: Fish at least twice a week.","ركّز على السمك مرتين في الأسبوع على الأقل.","عشان الأوميجا 3."],
["Foods to limit:\n• Saturated fat and trans-fat.\n• Sodium.\n• Red meat.\n• Nutrient-poor foods, such as beverages.\n• Smoking.","قلل: الدهون المشبعة والمتحولة، والصوديوم، واللحمة الحمرا، والأكل الفقير في القيمة الغذائية زي المشروبات، والتدخين.","الأربعة دول أعداء القلب والشرايين."],
["Heart Healthy Eating Guidelines – Reduce meat intake: Meats contain saturated fat (solid at room temperature, raises blood cholesterol, creates inflammation). Plan some meatless meals. Choose chicken, turkey, fish. Select top round or flank steak or other lean cuts of meat. Reduce meat portion at meals to 3 oz (palm of hand serving). Buy lower fat milks, cheeses.","قلل اللحوم: اللحوم فيها دهون مشبعة (بتتجمد في درجة حرارة الغرفة، وبترفع كوليسترول الدم، وبتسبب التهاب). اعمل وجبات من غير لحوم، واختار فراخ أو ديك رومي أو سمك، واختار قطع قليلة الدهن، وخلي حصة اللحمة 3 أونصة (قد كف إيدك)، واشتري ألبان وجبن قليلة الدسم.","كف إيدك هو مقياسك للحصة."],
["Limit fried foods and harmful fats: Inflammatory fats are found in most fried snack chips, French fries and onion rings, donuts and pastries, frostings, creamy cheesy sauces, stick margarine, deep fried foods. Improved shopping list: nonfat plain yogurt, dry roasted unsalted nuts, dark chocolate, crisp bread crackers, fruits & vegetables.","قلل المقليات والدهون الضارة: الدهون الالتهابية موجودة في أغلب شيبسي المقرمشات، البطاطس والأوبر المقلي، الدونتس والمعجنات، الكريمة الحلوة، الصوصات الكريمي بالجبنة، المارجرين، والمقليات الغرقانة. قايمة شراء أحسن: زبادي سادة خالي الدسم، مكسرات محمصة من غير ملح، شوكولاتة داكنة، بسكويت كرسبي، فاكهة وخضار.","بدّل الشيبسي بمكسرات من غير ملح."],
["Read Food Labels: Find the facts about what is in your food.","اقرا ملصق الأكل: اعرف إيه اللي جوه أكلك.","الملصق بيقولك الدهون والصوديوم والسكر قبل ما تشتري."]]},
{h:"Nutrition Care Guidelines for Hypertension",ic:"🩺",k:"#15803d",p:[
["Weight reduction and physical activity.","تقليل الوزن والنشاط البدني.","نزول الوزن بيريّح القلب وبيخفض الضغط."],
["DASH diet “Dietary Approaches to Stop Hypertension”.","دايت DASH يعني “الأساليب الغذائية لإيقاف ارتفاع ضغط الدم”.","الاسم نفسه بيقولك الغرض منه."],
["When following the DASH eating plan, it is important to choose foods that are:\n• Low in saturated and trans-fats\n• Rich in potassium, calcium, magnesium, fiber, and protein\n• Lower in sodium","لما تتبع خطة DASH اختار أكل: قليل في الدهون المشبعة والمتحولة، وغني بالبوتاسيوم والكالسيوم والماغنسيوم والألياف والبروتين، وأقل في الصوديوم (الملح).","الملح أكبر عدو للضغط فبنقلله ونزوّد المعادن المفيدة."],
["Hypertension Diets: Switch from unhealthy to real foods; limit/avoid trans fat, HFCS, sugar, caffeine & alcohol; increase nutritious foods rich in potassium, magnesium & vitamins.","دايت الضغط: غيّر من الأكل غير الصحي للأكل الحقيقي، وقلل أو تجنب الدهون المتحولة وشراب الذرة عالي الفركتوز والسكر والكافيين والكحول، وزوّد الأكل المغذي الغني بالبوتاسيوم والماغنسيوم والفيتامينات.","يعني أكل طازج بدل المصنّع."]]},
{h:"Nutrition Care Guidelines for Diabetes Mellitus",ic:"🩸",k:"#ca8a04",p:[
["Foods to focus on:\n• Carbohydrate from fruits, vegetables, whole grains, legumes, and low-fat milk\n• Fiber, particularly soluble fiber.\n• Fish at least twice a week.\n• Low-glycemic index foods.","ركّز على: كربوهيدرات من الفاكهة والخضار والحبوب الكاملة والبقوليات واللبن قليل الدسم، والألياف خصوصاً الذائبة، والسمك مرتين في الأسبوع، والأكل منخفض المؤشر الجلايسيمي.","الكربوهيدرات المعقدة بتتهضم ببطء فالسكر مبيعلاش فجأة."],
["Foods to limit:\n• Saturated fat and trans-fat.\n• Sucrose-containing foods\n• Sodium, if there is hypertension.\n• Smoking.","قلل: الدهون المشبعة والمتحولة، والأكل اللي فيه سكروز، والصوديوم لو فيه ضغط، والتدخين.","السكروز هو السكر العادي (سكر المائدة)."],
["NB. For patients with type 1 diabetes don’t forget to specify type and timing of insulin","ملحوظة: لمريض السكر النوع الأول ماتنساش تحدد نوع الإنسولين وميعاده.","الأكل لازم يتظبط مع ميعاد الإنسولين."],
["The glycemic index (GI) is a tool to measure how individual foods are expected to impact blood sugar levels. The glycemic index indicates how rapidly a carbohydrate is digested and released as glucose into the blood stream.","المؤشر الجلايسيمي (GI) أداة بتقيس تأثير كل أكلة على سكر الدم. وبيوضح الكربوهيدرات بتتهضم وتتحرر كجلوكوز في الدم بسرعة قد إيه.","أكلة GI عالي بترفع السكر بسرعة، وGI واطي بترفعه بالراحة."],
["9-inch plate: Fill half with non-starchy vegetables. Fill one quarter with a whole grain or starchy vegetables. Fill one quarter with a lean protein. Eat a small amount of fresh fruit. Drink skim or 1% milk.","طبق 9 بوصة: املا نصه خضار غير نشوية، وربعه حبوب كاملة أو خضار نشوية، وربعه بروتين قليل الدهن، وكُل كمية صغيرة فاكهة طازجة، واشرب لبن خالي الدسم أو 1%.","تخيّل الطبق مقسوم: نص خضار وربعين نشويات وبروتين."]]},
{h:"Nutrition Support in Cancer",ic:"🎗️",k:"#be185d",p:[
["Chemoprevention: The use of agents to reduce the risk of, or delay the development or recurrence of, cancer.","الوقاية الكيميائية: استخدام عوامل لتقليل خطر السرطان أو تأخير ظهوره أو رجوعه.","هدفها الوقاية قبل ما المرض يبدأ أو يرجع."],
["Examples of protective food: Vitamin D and Calcium, Coffee and Tea, Folic Acid, Fruits and Vegetables, Soy","أمثلة لأكل واقي: فيتامين D والكالسيوم، القهوة والشاي، حمض الفوليك، الفاكهة والخضار، الصويا.","حافظ على الخمس مجموعات دول."],
["Reduce Your Risk of Cancer – Consume LESS of: Saturated fats, Processed meat, Red meat, Salt-cured & smoked food, Food with preservatives, Alcoholic beverages","لتقليل خطر السرطان قلل: الدهون المشبعة، اللحوم المصنّعة، اللحمة الحمرا، الأكل المملّح والمدخّن، الأكل اللي فيه مواد حافظة، المشروبات الكحولية.","الأكل المحفوظ والمدخّن أبعد عنه."],
["Reduce Your Risk of Cancer – Eat MORE of: Fruits & vegetables, Whole grains, Dark green & orange vegetables, Foods rich with Vitamins A, C, and E","وزوّد: الفاكهة والخضار، الحبوب الكاملة، الخضار الأخضر الغامق والبرتقالي، الأكل الغني بفيتامينات A وC وE.","اللون الغامق في الخضار علامة على فيتامينات كتيرة."],
["Medical Nutrition Therapy – A. Energy: The following factors contribute in determining energy need:\n• Presence of other diseases.\n• Type of treatment\n• Anticancer therapies\n• Presence of fever or infection.","العلاج الغذائي الطبي – أ. الطاقة: عوامل بتحدد احتياج الطاقة: وجود أمراض تانية، نوع العلاج، العلاجات المضادة للسرطان، وجود حمى أو عدوى.","الحمى والعدوى بيزوّدوا احتياج الجسم للطاقة."],
["B. Protein: increased during times of illness and stress.","ب. البروتين: بيزيد وقت المرض والضغط.","الجسم بيحتاج بروتين أكتر لإصلاح نفسه."],
["C. Adequate fluid intake","ج. كمية سوائل كافية.","السوائل مهمة خصوصاً مع العلاج."],
["D. Vitamins and Minerals supplements","د. مكمّلات الفيتامينات والمعادن.","بتعوّض أي نقص."]]},
{h:"Vegetarian Diets",ic:"🥦",k:"#15803d",p:[
["In general, vegetarians can be described as one of the following four basic types:","عموماً النباتيين بيتقسموا لأربع أنواع أساسية.","هنعدّيهم واحد واحد."],
["1. Lacto-vegetarians: These vegetarians accept only dairy products from animal sources.","1. Lacto: بيقبلوا بس منتجات الألبان من المصادر الحيوانية.","Lacto من Lactose يعني اللبن."],
["2. Ovo-vegetarians: The only animal foods included in the ovo-vegetarian diet are eggs. Because eggs are an excellent source of complete proteins, individuals who are following this diet do not have to be overly concerned with complementary proteins if eggs are consumed consistently.","2. Ovo: الأكل الحيواني الوحيد عندهم هو البيض. ولأن البيض مصدر ممتاز للبروتين الكامل، مش لازم يقلقوا من البروتينات المكمّلة لو بياكلوه باستمرار.","Ovo من Ovum يعني البيضة."],
["3. Lacto-ovo-vegetarians: These are vegetarians who follow a food pattern that allows for the consumption of dairy products and eggs.","3. Lacto-ovo: نمط أكلهم بيسمح بالألبان والبيض.","جمع النوعين اللي فاتوا."],
["4. Vegans: Vegans follow a strict vegetarian diet and consume no animal foods. Careful planning and sufficient food intake ensure adequate nutrition.","4. Vegans: بيتبعوا نظام نباتي صارم ومبياكلوش أي أكل حيواني. والتخطيط الدقيق وكفاية الأكل بيضمنوا تغذية كافية.","مفيش لبن ولا بيض ولا لحمة خالص."]]},
{h:"Clear and Full Liquid Diets",ic:"🥛",k:"#ea580c",p:[
["1- Clear liquid diet: A clear liquid diet consists of clear liquids (such as water, broth, tea, fruit juice without pulp, and plain gelatin) that are easily digested and leave no undigested residue in the intestinal tract. It is of little nutritive value; it provides some electrolytes, mainly sodium, chloride, and potassium.","1- دايت السوائل الصافية: سوائل صافية (مياه، شوربة، شاي، عصير من غير لب، جيلاتين سادة) بتتهضم بسهولة ومبتسيبش بقايا في الأمعاء. قيمتها الغذائية قليلة وبتدّي شوية إلكتروليتات أساساً صوديوم وكلوريد وبوتاسيوم.","زي ما تشرب حاجة تروي من غير ما تشبّعك."],
["Indications for use: as a progression between IV feeding and a full liquid or solid diet following certain types of surgery.","الاستخدام: كمرحلة انتقالية بين التغذية الوريدية والسوائل الكاملة أو الأكل الصلب بعد أنواع معينة من العمليات.","أول خطوة بعد العملية قبل ما ترجع للأكل العادي."],
["2- Full liquid diet: Full liquids have more calories, protein, and nutrients than clear liquids. It provides oral nourishment that is well tolerated by patients who are actually ill or who are unable to swallow. e.g.: milk, eggs, vegetable and fruit juices, yogurt.","2- دايت السوائل الكاملة: فيها سعرات وبروتين ومغذيات أكتر من الصافية. بتدّي تغذية بالفم بيتحملها المرضى التعبانين أو اللي مش قادرين يبلعوا. زي: لبن، بيض، عصاير خضار وفاكهة، زبادي.","هي أغنى من الصافية لأنها بتشبّع."],
["Indications for use: following oral surgery or plastic surgery of the face and neck, in patients with esophageal strictures, and following mandibles fractures.","الاستخدام: بعد جراحات الفم أو الجراحة التجميلية للوش والرقبة، ولمرضى تضيّق المريء، وبعد كسور الفك السفلي.","كلها حالات صعب فيها المضغ أو البلع."]]},
{h:"Key Roles of Nurses in Therapeutic Nutrition",ic:"👩‍⚕️",k:"#be185d",p:[
["Nurses play a critical, hands-on role in therapeutic nutrition by:\n• Assessing patient needs,\n• Delivering specialized support, and\n• Educating individuals on dietary management.","التمريض ليه دور مهم ومباشر في التغذية العلاجية عن طريق: تقييم احتياجات المريض، وتقديم الدعم المتخصص، وتثقيف الأفراد على إدارة الأكل.","الممرضة هي اللي جنب المريض طول الوقت."],
["Anthropometric assessment and clinical assessment. They recommend the appropriate biochemical tests that are needed to determine deficiencies.","التقييم الأنثروبومتري (قياسات الجسم) والتقييم الإكلينيكي، وبيوصوا بالتحاليل الكيميائية الحيوية المناسبة لتحديد النقص.","القياسات زي الوزن والطول، والتحاليل بتكشف النقص."],
["They usually make dietary prescriptions for regular diet, modified, enteral, parenteral, palliative. They usually provide more detail about the composition of the diet – total energy requirement, protein, and supplements that may be needed.","بيكتبوا عادةً الوصفات الغذائية للدايت العادي والمعدّل والمعوي (Enteral) والوريدي (Parenteral) والتلطيفي (Palliative)، وبيدّوا تفاصيل أكتر عن تركيبة الدايت: إجمالي الطاقة والبروتين والمكمّلات.","كأنها روشتة غذائية مفصّلة لكل مريض."],
["They also recommend preparation methods of foods. They are also responsible for preparing data for nutrition education.","وبيوصوا بطرق تحضير الأكل، وهما كمان مسؤولين عن تجهيز المعلومات اللازمة للتثقيف الغذائي.","طريقة الطبخ (شوي بدل قلي) بتفرق في الدايت."]]}
];

document.getElementById("cnt").textContent=S.length+" sections · "+c+" points";
function tg(o){document.querySelectorAll("details").forEach(d=>d.open=o)}
addEventListener("scroll",()=>{document.getElementById("pb").style.width=(scrollY/(document.body.scrollHeight-innerHeight)*100)+"%"});
const b=document.getElementById("tb");let th="light";try{th=localStorage.getItem("theme")||"light"}catch(e){}
function ap(t){th=t;document.documentElement.setAttribute("data-theme",t=="dark"?"dark":"");b.textContent=t=="dark"?"☀️":"🌙";try{localStorage.setItem("theme",t)}catch(e){}}
ap(th);b.onclick=()=>ap(th=="dark"?"light":"dark");
