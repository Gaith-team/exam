</style></head><body><div id="pb"></div><header><div class="logo">GT</div><b>GHAITH TEAM</b><button id="tb">🌙</button></header><div class="hero"><div class="ic">🥗</div><h1>Support Nutrition (EN &amp; PN)</h1><p>Applied Nutrition</p></div><main id="m"></main><footer>GHAITH <span>TEAM</span></footer><script>const D=[["Learning Objectives", [["Define enteral nutrition", "تعرّف يعني إيه التغذية المعوية.", "زي ما تحفظ تعريف المادة قبل الامتحان."], ["Identify indications for enteral nutrition", "تعرف مين المريض اللي محتاجها.", "مريض في غيبوبة وأمعاؤه سليمة."], ["List benefits of enteral nutrition", "تعدّد فوايدها.", "زي ما تقول مميزات العربية الجديدة."], ["Identify the contraindications for enteral nutrition", "تعرف الحالات اللي ممنوع فيها.", "زي علامة ممنوع الدخول."], ["Describe the timing of enteral nutrition", "تعرف تبدأها امتى.", "زي ميعاد الدوا بالظبط."], ["Identify enteral nutrition access", "تعرف الطرق اللي بيدخل منها الأنبوب.", "زي أبواب البيت: رئيسي وخلفي."], ["Define administration EN", "تعرف طرق إدّاء الأكل بالأنبوب.", "زي ما تسقي الزرع دفعة واحدة ولا نقطة نقطة."], ["Discuss parenteral nutrition", "تتكلم عن التغذية الوريدية.", "أكل بيروح الدم مباشرة."], ["Explain parenteral nutrition complications", "تشرح مضاعفاتها.", "زي أعراض جانبية لعلاج."]]], ["Enteral Nutrition (EN)", [["EN is a nutrition provided through the gastrointestinal tract via a tube, catheter, or stoma that delivers nutrients distal to the oral cavity.", "التغذية المعوية هي إدّاء الأكل عن طريق الجهاز الهضمي بأنبوب أو قسطرة أو فتحة (stoma)، والأكل بيوصل لنقطة بعد الفم.", "زي ما تصب الماية في الزرع بخرطوم من غير ما تعدّي على الباب الأمامي (الفم)."], ["Feeding tube with the tip in the stomach or small bowel.", "الأنبوب طرفه بيبقى في المعدة أو الأمعاء الدقيقة.", "زي الخرطوم اللي بيوصل لحد الأوضة اللي عاوزها."]]], ["Indications for Enteral Nutrition", [["Patient selection: individuals with a functional GI tract, along with clinical situations in which oral intake is deemed unsafe, insufficient, or impossible, are candidates for EN support.", "المريض المناسب هو اللي جهازه الهضمي شغّال، بس الأكل بالبق إما خطر أو مش كفاية أو مستحيل.", "واحد جهازه الهضمي سليم بس مش بيبلع كويس وبيشرق، يبقى ياخد أنبوب."]]], ["Benefits", [["1. Utilizing the normal route of digestion and absorption of the GI tract supports maintenance of the functional integrity of the gut.", "استخدام طريق الهضم الطبيعي بيحافظ على الأمعاء شغّالة وسليمة.", "زي العضلة: لو استخدمتها تفضل قوية، ولو سبتها تضعف."], ["2. EN is the preferred route of feeding due to the benefits of supporting the components of the gut barrier functions.", "هي الطريق المفضّل لأنها بتدعم الحاجز الواقي بتاع الأمعاء.", "الحاجز ده زي سور البيت بيمنع الغُرب يدخلوا."], ["3. Nutrients provided via the enteral route undergo first-pass metabolism, promoting efficient utilization of the nutrients.", "الأكل بيعدّي على الكبد الأول (first-pass) فالجسم بيستفيد منه بكفاءة.", "زي الخضار اللي بيعدّي على المطبخ يتغسل ويتجهّز قبل ما يتقدّم."], ["4. The presence of nutrients in the small intestine maintains normal gallbladder function by stimulating the release of cholecystokinin, reducing the risk of cholecystitis that may occur with parenteral nutrition.", "وجود الأكل في الأمعاء الدقيقة بينشّط هرمون CCK فالمرارة تشتغل عادي، وده بيقلل خطر التهاب المرارة اللي بيحصل مع التغذية الوريدية.", "المرارة زي ماكينة لو اتقفلت من غير تشغيل بتتعطل، والأكل هو زرار التشغيل."], ["5. Luminal nutrients provide structural support and also aid to maintain the gut-associated and mucosa-associated lymphoid tissues vital to gut-associated immune function.", "الأكل جوه الأمعاء بيدعم بنيتها وبيحافظ على الأنسجة المناعية اللي في الأمعاء.", "زي ما الجيش محتاج تموين عشان يفضل جاهز."], ["IgA, secreted within the GI tract, can prevent bacterial adherence and translocation.", "الأجسام المضادة IgA بتمنع البكتيريا تلزق في جدار الأمعاء أو تعدّي منها للدم.", "زي حارس بيمنع اللص يدخل أو يعدّي السور."], ["IgA production is reduced when intraluminal nutrients are not present.", "لو مفيش أكل جوه الأمعاء، إنتاج IgA بيقل.", "من غير تموين الحارس بيضعف."], ["6. EN has been shown to reduce infectious complications associated with pneumonia, sepsis, intravenous line sepsis.", "التغذية المعوية بتقلل العدوى زي الالتهاب الرئوي والتسمم الدموي وعدوى الخط الوريدي.", "مفيش خط وريدي طويل يبقى بوابة للميكروبات."], ["7. From a cost standpoint, the overall provision of EN is less expensive than parenteral nutrition.", "من ناحية التكلفة، المعوية أرخص من الوريدية.", "زي ما الأكل البيتي أرخص من المطعم."]]], ["Contraindications for EN", [["Although EN is the preferred route of nutrition support, it may be contraindicated in certain circumstances:", "رغم إنها الطريق المفضّل، في حالات ممنوعة فيها:", "زي دوا كويس بس مش لكل الناس."], ["1. Non-operative mechanical GI obstruction", "انسداد ميكانيكي في الجهاز الهضمي من غير جراحة.", "زي مواسير مسدودة، الأكل مش هيعدّي."], ["2. Intractable vomiting/diarrhea refractory to medical management", "قيء أو إسهال شديد مبيستجيبش للعلاج.", "مهما تحط أكل بيطلع تاني."], ["3. Severe short-bowel syndrome (<100 cm small bowel remaining)", "متلازمة الأمعاء القصيرة الشديدة: متبقي أقل من 100 سم من الأمعاء الدقيقة.", "زي ما تحاول تمتص ميّه بقطعة إسفنج صغيرة جدًا."], ["4. Paralytic ileus", "شلل الأمعاء، مبتتحركش.", "زي سير متحرك واقف."], ["5. Distal high-output fistulas (too distal to bypass with feeding tube)", "ناسور بعيد بيطلع كمية كبيرة، وبعيد لدرجة إن الأنبوب مبيعدّيش منه.", "زي ماسورة بتسرّب بعد النقطة اللي توصلها."], ["6. Severe GI bleed", "نزيف شديد في الجهاز الهضمي.", "مينفعش تحط أكل على جرح بينزف."], ["7. Severe GI mal-absorption", "سوء امتصاص شديد.", "زي إسفنجة مبتشربش."], ["8. Inability to gain access to GI tract", "مش قادرين نوصّل للجهاز الهضمي.", "زي باب مقفول مفيش مفتاحه."], ["9. Need is expected for 5–7 days for malnourished adult patients or 7–9 days if adequately nourished", "لو المدة المتوقعة قصيرة: 5–7 أيام لسوء التغذية أو 7–9 أيام لو التغذية كويسة، مش بنستخدمها.", "زي ما مش بتفرد خيمة لقعدة ساعة."], ["10. Aggressive intervention not warranted or not desired", "التدخل المكثّف مش مطلوب أو المريض مش عاوزه.", "المريض أو أهله رفضوا الأنبوب."]]], ["Timing of Enteral Nutrition", [["Specialized nutrition support should be initiated in patients with inadequate oral intake for 7 to 14 days, or in those patients in whom inadequate oral intake is expected over a 7- to 14-day period.", "الدعم الغذائي المتخصص يبدأ لو الأكل بالبق مش كفاية من 7 لـ 14 يوم، أو متوقع يفضل كده المدة دي.", "واحد مبيكلش كويس من أسبوع وهيفضل أسبوعين، ندّيله أنبوب."], ["For critically ill patients, EN should be initiated early within 24 to 48 hours of admission to the ICU.", "للمرضى في الحالات الحرجة نبدأها بدري خلال 24 لـ 48 ساعة من دخول العناية.", "مريض دخل العناية النهارده، بكرة أو بعده الأنبوب شغّال."]]], ["Enteral Nutrition Access", [["A) Short-Term Enteral Nutrition Support (no more than 3 to 4 weeks)", "الطرق قصيرة المدى: مبتزيدش عن 3 لـ 4 أسابيع.", "زي إيجار شقة لمدة شهر."], ["1. Naso-gastric Access", "أنبوب من الأنف للمعدة.", "زي خرطوم من مناخيرك لحد معدتك."], ["2. Naso-duodenal or Naso-jejunal Access", "أنبوب من الأنف للاثني عشر أو للصائم.", "نفس الأنبوب بس بيوصل أبعد من المعدة."], ["Potential Complications of Naso-enteric Tubes:", "مضاعفات الأنابيب الأنفية المعوية:", "أي حاجة بتتحط في الجسم ممكن تأذّي."], ["a. Esophageal strictures", "تضيّق المريء.", "زي خرطوم ضاق من جوه."], ["b. Gastroesophageal reflux resulting in aspiration pneumonia", "ارتجاع بيسبب التهاب رئوي من الشفط.", "الأكل يطلع ويدخل الرئة غلط."], ["c. Tracheoesophageal fistula", "ناسور بين القصبة والمريء.", "ممر غير طبيعي بين مجريين."], ["d. Incorrect position of the tube leading to pulmonary injury", "وضع الأنبوب غلط وإصابة الرئة.", "الأنبوب دخل الرئة بدل المعدة."], ["e. Mucosal damage at the insertion site", "تلف الغشاء المخاطي مكان الإدخال.", "زي سحجة."], ["f. Nasal irritation and erosion", "تهيّج وتآكل الأنف.", "الأنبوب بيحتك بالأنف."], ["g. Pharyngeal or vocal cord paralysis", "شلل في البلعوم أو الأحبال الصوتية.", "الصوت يبقى مبحوح."], ["h. Rhinorrhea, sinusitis, otitis media", "سيلان أنف والتهاب جيوب والتهاب أذن وسطى.", "زي برد بسبب الأنبوب."], ["i. Ruptured gastroesophageal varices in hepatic disease", "انفجار دوالي المريء والمعدة لمريض الكبد.", "الأنبوب يخبط في وريد منتفخ."], ["j. Ulcerations or perforations of the upper gastrointestinal tract and airway", "قرح أو ثقوب في الجهاز الهضمي العلوي والمجرى الهوائي.", "زي خرم في جدار."], ["B) Long-Term Enteral Access (EN is required for more than 3 to 4 weeks)", "الطرق طويلة المدى: لو هنحتاجها أكتر من 3 لـ 4 أسابيع.", "زي عقد إيجار سنة."], ["1. Gastrostomy", "فتحة في المعدة من خلال جدار البطن.", "باب جانبي مباشر للمعدة."], ["2. Jejunostomy", "فتحة في الصائم من جدار البطن.", "نفس الفكرة بس في الأمعاء."], "IMG1"]], ["Formula Content and Selection", [["Enteral formulas are classified as: 1. Standard", "التركيبات المعوية أنواع، أولها العادية.", "زي لبن عادي."], ["2. Chemically defined (elemental)", "الكيميائية المحددة (العنصرية).", "أكل متفتّت جاهز للامتصاص."], ["3. Specialized (marketed for specific clinical conditions or diseases)", "المتخصصة لأمراض أو حالات معينة.", "زي لبن مخصوص لمريض سكر."], ["Selection of an enteral formula for a specific patient should involve consideration of the patient's: a) Nutrient needs b) GIT function c) Clinical status", "اختيار التركيبة بيبص على: احتياجات المريض الغذائية، وشغل جهازه الهضمي، وحالته الإكلينيكية.", "زي دكتور بيختار علاج على حسب حالتك."]]], ["Factors to Consider when Choosing an Enteral Formula", [["Ability of the formula to meet the patient's nutrient requirements", "التركيبة تغطي احتياجات المريض.", "زي وجبة تشبّع."], ["Caloric and protein density of the formula (i.e., kcal/ml, g protein/ml, ml fluid/L)", "كثافة السعرات والبروتين وكمية السوائل.", "عصير مركّز ولا خفيف."], ["Gastrointestinal function", "وظيفة الجهاز الهضمي.", "معدة تقيلة تحتاج حاجة أخف."], ["Sodium, potassium, magnesium, and phosphorus content of the formula, especially for patients with cardiopulmonary, renal, or hepatic failure", "محتوى الصوديوم والبوتاسيوم والماغنسيوم والفوسفور، خصوصًا لمرضى القلب والرئة والكلى والكبد.", "مريض الكلى مينفعش بوتاسيوم عالي."], ["Form and amount of protein, fat, carbohydrate, and fiber in the formula relative to the patient's digestive and absorptive capacity", "شكل وكمية البروتين والدهون والكربوهيدرات والألياف حسب قدرة المريض على الهضم والامتصاص.", "اللي بيهضم الدهون صعب ياخد دهون أقل."], ["Cost effectiveness of formula", "التركيبة تكون اقتصادية.", "نختار الأنسب سعرًا."], ["Patient compliance", "التزام المريض.", "لو مش مرتاح مش هيكمل."], ["Cost-to-benefit ratio", "نسبة التكلفة للفايدة.", "ندفع بقد ما نستفيد."]]], ["Formula Content", [["A) Protein: the amount of protein in available commercial enteral formulas varies from 6% to 25% of total kilocalories.", "البروتين من 6% لـ 25% من إجمالي السعرات.", "من تركيبة لتركيبة."], ["B) Carbohydrate: content in enteral formulas varies from 30% to 85% of kilocalories.", "الكربوهيدرات من 30% لـ 85% من السعرات.", "النسبة كبيرة ومتغيرة."], ["Corn syrup solids typically are used in standard formulas.", "مواد شراب الذرة الصلبة في التركيبات العادية.", "مصدر السكر الأساسي."], ["Sucrose is added to flavored formulas that are meant for oral consumption.", "السكروز بيتضاف للتركيبات المنكّهة اللي بتتشرب بالبق.", "للطعم."], ["C) Lipid: content of enteral formulas varies from 1.5% to 55% of the total kilocalories.", "الدهون من 1.5% لـ 55% من السعرات.", "نسبة واسعة."], ["In standard formulas, lipid as corn, sunflower, safflower, or canola oil provides between 15% and 30% of the total kilocalories.", "في العادية الدهون من زيت الذرة أو دوار الشمس أو العصفر أو الكانولا وبتدّي 15% لـ 30% من السعرات.", "زيوت الطبخ المعروفة."], ["Elemental formulas contain minimal amounts of fat, typically in the form of medium-chain triglycerides (MCTs) rather than long-chain (LCTs) triglycerides.", "العنصرية دهونها قليلة وغالبًا MCT مش LCT.", "MCT أخف في الامتصاص."], ["D) Fluid: adult fluid needs often are estimated at 1 ml of water per kilocalorie consumed, or 30 to 35 ml/kg of usual body weight.", "احتياج السوائل للكبير تقريبًا 1 مل ميّه لكل سعر، أو 30 لـ 35 مل لكل كجم من الوزن المعتاد.", "شخص 70 كجم تقريبًا 2100 لـ 2450 مل."]]], ["Administration EN", [["EN may be administered as a: a) Bolus (optimal for patients with adequate gastric emptying who are clinically stable)", "ممكن تتدّي دفعة (Bolus)، وأنسب لمريض معدته بتفضى كويس وحالته مستقرة.", "زي وجبة عادية بالسرنجة."], ["b) Intermittent (allow mobile patients to enjoy an improved quality of life by offering time off the pump)", "متقطعة: المريض المتحرك ياخد راحة من الجهاز.", "زي ما تفصل الشاحن وتتحرك."], ["c) Continuous feeding (it requires a pump; appropriate for patients who do not tolerate the volume of infusion used with the bolus, cyclical or intermittent methods)", "مستمرة بجهاز، لمريض مبيستحملش كمية الدفعة أو الدورية أو المتقطعة.", "نقطة نقطة بدل كباية."], ["Selection of the optimal method should be based on: 1. Patient's clinical status 2. Living situation 3. Quality-of-life considerations", "اختيار الطريقة على حسب حالة المريض وظروف معيشته وجودة حياته.", "بيتحرك ولا في سرير."]]], ["Complications of EN Nutrition", [["A) Access: 1. Leakage from ostomy/stoma site 2. Pressure necrosis/ulceration/stenosis 3. Tissue erosion 4. Tube displacement/migration 5. Tube obstruction/occlusion", "مضاعفات الأنبوب: تسريب من الفتحة، ضغط وقرح وضيق، تآكل أنسجة، الأنبوب يتحرك، أو ينسد.", "زي خرطوم بيقطر ويتحرك وبيتسد."], ["B) Administration: 1. Microbial contamination 2. Enteral misconnections or misplacement of tube (causing infection, aspiration pneumonia, peritonitis, pulmonary or venous infusion) 3. Regurgitation 4. Inadequate delivery for one or more reasons", "مضاعفات الإدّاء: تلوث ميكروبي، توصيل غلط أو أنبوب في مكان غلط (عدوى، التهاب رئوي، التهاب بريتوني، أكل في الرئة أو الوريد)، ارتجاع، أو عدم وصول الكمية الكافية.", "وصّلت الأكل في الخط الغلط."], ["C) Gastrointestinal: 1. Constipation 2. Delayed gastric emptying/elevated gastric residual volume 3. Diarrhea 4. Osmotic diarrhea, especially if sorbitol is present in liquid drug preparations 5. Secretory distention/bloating/cramping 6. Formula choice/rate of administration 7. Intolerance of nutrient components 8. Maldigestion/malabsorption, nausea/vomiting", "مضاعفات هضمية: إمساك، تأخر تفريغ المعدة، إسهال، إسهال أسموزي خصوصًا مع السوربيتول في الأدوية السائلة، انتفاخ وتقلصات، اختيار التركيبة أو سرعة الإدّاء، عدم تحمل مكونات، سوء هضم وامتصاص، غثيان وقيء.", "زي بطنك تعبانة من أكلة تقيلة."], ["D) Metabolic: 1. Drug-nutrient interactions 2. Glucose intolerance/hyperglycemia/hypoglycemia 3. Dehydration/overhydration 4. Hypernatremia/hyponatremia 5. Hyperkalemia/hypokalemia 6. Hyperphosphatemia/hypophosphatemia 7. Micronutrient deficiencies (notably thiamin) 8. Refeeding syndrome", "مضاعفات أيضية: تفاعل دوا مع أكل، اضطراب السكر، جفاف أو زيادة سوائل، اضطراب صوديوم وبوتاسيوم وفوسفات، نقص فيتامينات خصوصًا الثيامين، ومتلازمة إعادة التغذية.", "تحليل الدم يطلع أرقامه مش مظبوطة."]]], ["Monitoring the Patient Receiving Enteral Nutrition", [["1. Ask about abdominal distention and discomfort", "اسأل عن الانتفاخ والألم.", "هو مرتاح؟"], ["2. Confirm proper tube placement and maintain head of bed 30 degrees (daily)", "اتأكد من مكان الأنبوب وخلّي راس السرير 30 درجة، يوميًا.", "السرير مايل شوية عشان الأكل ميطلعش."], ["3. Change feeding delivery container and tubing (daily)", "غيّر كيس الأكل والخرطوم يوميًا.", "زي ما تغيّر زجاجة الرضيع."], ["4. Fluid intake and output (daily)", "سوائل الداخل والخارج، يوميًا.", "داخل كام وخارج كام."], ["5. Gastric residual volume if appropriate", "كمية الباقي في المعدة لو مناسب.", "اللي لسه واقف جوه."], ["6. Signs and symptoms of edema or dehydration (daily)", "علامات الورم أو الجفاف، يوميًا.", "رجليه ورمت ولا شفايفه ناشفة."], ["7. Stool frequency, volume, and consistency (daily)", "عدد وكمية وقوام البراز، يوميًا.", "مية ولا صلب."], ["8. Weight (at least 3/week)", "الوزن 3 مرات في الأسبوع على الأقل.", "ميزان كل يومين تقريبًا."], ["9. Nutritional intake adequacy (daily)", "كفاية اللي بياخده، يوميًا.", "خد المطلوب ولا لأ."], ["10. Clinical status/physical examination (daily)", "الحالة والفحص الإكلينيكي، يوميًا.", "كشف كل يوم."], ["11. Serum electrolytes, blood urea nitrogen, creatinine (daily till stable, then 2 to 3 times/week)", "الأملاح واليوريا والكرياتينين: يوميًا لحد ما يستقر، وبعدين 2 لـ 3 مرات في الأسبوع.", "تحاليل كلى."], ["12. Serum glucose, calcium, magnesium, phosphorus (daily till stable, then weekly)", "السكر والكالسيوم والماغنسيوم والفوسفور: يوميًا لحد ما يستقر، وبعدين أسبوعيًا.", "تحاليل أملاح وسكر."]]], ["PARENTERAL NUTRITION (PN)", [["Definition: PN provides nutrients directly into the bloodstream intravenously.", "التغذية الوريدية: الأكل بيدخل في الدم مباشرة من الوريد.", "زي حقن العناصر في الدم من غير هضم."], ["Indications: PN is indicated when the patient or individual is unable or unwilling to take adequate nutrients orally or enterally.", "بتتدّي لو المريض مش قادر أو مش عاوز ياخد كفاية بالبق أو بالأنبوب.", "واحد معدته مش شغّالة خالص."], ["PN may be used as an adjunct to oral or EN to meet nutrient needs.", "ممكن تكمّل الأكل بالبق أو المعوي لتغطية الاحتياج.", "زي إضافة لما الأكل ميكفيش."], ["Alternatively, PN may be the sole source of nutrition during recovery from illness or injury, or may be a life-sustaining therapy for patients who have lost the function of their intestine for nutrient absorption.", "أو تبقى المصدر الوحيد أثناء التعافي، أو علاج بيحافظ على حياة اللي أمعاؤه فقدت وظيفة الامتصاص.", "الأمعاء مش شغّالة تمامًا يبقى ده طريقه الوحيد."]]], ["PN Access", [["1. Peripheral Access", "وريد طرفي (زي وريد الدراع).", "كانيولا عادية."], ["2. Short-Term Central Access", "قسطرة مركزية قصيرة المدى.", "مؤقتة."], ["3. Long-Term Central Access", "قسطرة مركزية طويلة المدى.", "للاستخدام الطويل."], "IMG2"]], ["Parenteral Solutions", [["A) Protein: commercially available standard PN solutions contain all essential amino acids and only some of the nonessential amino acids.", "محاليل البروتين فيها كل الأحماض الأمينية الأساسية وبعض غير الأساسية بس.", "زي مكوّنات لازم تتحط كلها."], ["The concentration of amino acids in PN solutions ranges from 3% to 20% by volume. Thus a 10% solution of amino acids supplies 100 g of protein per liter (1000 ml).", "تركيز الأحماض الأمينية من 3% لـ 20%، فمحلول 10% بيدّي 100 جرام بروتين في اللتر.", "10% من 1000 مل = 100 جم."], ["The use of carbohydrates (100 g daily for a 70-kg person) ensures that protein is not catabolized for energy during conditions of normal metabolism.", "الكربوهيدرات (100 جم يوميًا لشخص 70 كجم) بتمنع تكسير البروتين كطاقة في الأيض الطبيعي.", "لو الجسم لاقى سكر مش هيحرق عضلاته."], ["B) Lipids: administration should not exceed 2 g of lipid emulsion per kilogram of body weight per day, although recommendations of 1 to 1.5 g/kg are more common.", "الدهون ميزدش عن 2 جم لكل كجم يوميًا، والأشهر 1 لـ 1.5 جم/كجم.", "70 كجم: غالبًا 70–105 جم."], ["Triglyceride levels should be monitored. When they exceed 400, the lipid infusion should be discontinued.", "نتابع الدهون الثلاثية، ولو عدّت 400 نوقف الدهون.", "الرقم فوق 400 يبقى وقّف."], ["10% lipid emulsion contains 1.1 kcal/ml, whereas a 20% emulsion contains 2 kcal/ml.", "محلول الدهون 10% فيه 1.1 سعر/مل، و20% فيه 2 سعر/مل.", "الأعلى تركيزًا سعراته أكتر."], ["Providing 20% to 30% of total calories as lipid emulsion should result in a daily dosage of approximately 1 g of fat per kilogram of body weight.", "لو 20% لـ 30% من السعرات دهون، الجرعة تطلع حوالي 1 جم/كجم يوميًا.", "زي قاعدة حساب سريعة."], ["C) Carbohydrates: supplied as dextrose monohydrate in concentrations ranging from 5% to 70% by volume.", "الكربوهيدرات بتتدّي ديكستروز بتركيز 5% لـ 70%.", "سكر الجلوكوز."], ["Maximum rates of carbohydrate administration should not exceed 5 to 6 mg/kg/min in critically ill patients.", "أقصى معدل 5 لـ 6 مجم/كجم/دقيقة للمرضى الحرجين.", "زي سرعة محددة."], ["D) Electrolytes, vitamins, trace elements. Daily electrolyte requirements during TPN in adults:", "احتياج الأملاح اليومي للكبار في TPN:", "أملاح الدم."], ["a. Calcium 10–15 mEq", "كالسيوم 10 لـ 15 mEq.", "عظام."], ["b. Magnesium 8–20 mEq", "ماغنسيوم 8 لـ 20 mEq.", "عضلات."], ["c. Phosphate 20–40 mmol", "فوسفات 20 لـ 40 mmol.", "طاقة."], ["d. Sodium 1–2 mEq/kg + replacement", "صوديوم 1 لـ 2 mEq/كجم + تعويض.", "حسب الوزن."], ["e. Potassium 1–2 mEq/kg", "بوتاسيوم 1 لـ 2 mEq/كجم.", "قلب."], ["f. Acetate: as needed to maintain acid-base balance", "أسيتات حسب الحاجة لتوازن الحموضة.", "موازنة."], ["g. Chloride: as needed to maintain acid-base balance", "كلوريد حسب الحاجة لتوازن الحموضة.", "موازنة."], ["E) Fluid: 1. Fluid needs for PN or EN are calculated similarly.", "السوائل في الوريدية والمعوية بتتحسب بنفس الطريقة.", "نفس القاعدة."], ["2. Maximum volumes of CPN rarely exceed 3 L, with typical prescriptions of 1.5 to 3 L daily.", "الحجم الأقصى للـ CPN نادرًا يعدّي 3 لتر، والمعتاد 1.5 لـ 3 لتر يوميًا.", "من لتر ونص لـ 3 لتر."]]], ["Administration", [["Continuous Infusion", "إدّاء مستمر.", "على مدار اليوم."], ["Cyclic Infusion", "إدّاء دوري على فترة معينة.", "ساعات محددة وبعدين راحة."]]], ["Parenteral Nutrition Complications", [["A) Mechanical Complications: Air embolism; Arteriovenous fistula; Brachial plexus injury; Catheter fragment embolism; Catheter misplacement; Cardiac perforation; Central vein thrombophlebitis; Endocarditis; Hemothorax; Hydromediastinum; Hydrothorax; Pneumothorax or tension pneumothorax; Subcutaneous emphysema; Subclavian artery injury; Subclavian hematoma; Thoracic duct injury", "مضاعفات ميكانيكية من تركيب القسطرة: فقاعة هوا، ناسور شرياني وريدي، إصابة الضفيرة العضدية، قطعة قسطرة تتحرك، قسطرة في مكان غلط، ثقب في القلب، التهاب وريد مركزي، التهاب بطانة القلب، دم أو سوائل في الصدر، استرواح الصدر، هواء تحت الجلد، إصابة الشريان تحت الترقوة وورم دموي، إصابة القناة الصدرية.", "الإبرة في مكان حساس ممكن تعمل مشاكل."], ["B) Infection and Sepsis: 1. Catheter entrance site 2. Catheter seeding from bloodborne or distant infection 3. Contamination during insertion 4. Long-term catheter placement 5. Solution contamination", "العدوى والتسمم: مكان دخول القسطرة، انتقال ميكروب من عدوى بعيدة، تلوث وقت التركيب، بقاء القسطرة وقت طويل، تلوث المحلول.", "ميكروب يدخل من الخط للدم."], ["C) Metabolic Complications: 1. Dehydration from osmotic diuresis 2. Electrolyte imbalance 3. Essential fatty acid deficiency 4. Hyperosmolar, nonketotic, hyperglycemic coma 5. Hyperammonemia 6. Hypercalcemia 7. Hyperchloremic metabolic acidosis 8. Hyperlipidemia 9. Hyperphosphatemia 10. Hypocalcaemia 11. Hypomagnesemia 12. Hypophosphatemia 13. Rebound hypoglycemia on sudden cessation of PN in 14. patient with unstable glucose levels 15. Uremia 16. Trace mineral deficiencies", "مضاعفات أيضية: جفاف من إدرار البول الأسموزي، اضطراب أملاح، نقص أحماض دهنية أساسية، غيبوبة فرط سكر وأسمولية من غير كيتونات، ارتفاع أمونيا، ارتفاع كالسيوم، حموضة كلورية، ارتفاع دهون، ارتفاع فوسفات، نقص كالسيوم وماغنسيوم وفوسفات، هبوط سكر مفاجئ لو وقفنا PN فجأة عند مريض سكره مش ثابت، ارتفاع اليوريا، ونقص المعادن النادرة.", "السكر والأملاح بتتلخبط."], ["D) Gastrointestinal Complications: 1. Cholestasis 2. Gastrointestinal villous atrophy 3. Hepatic abnormalities", "مضاعفات هضمية: ركود صفراوي، ضمور زغابات الأمعاء، اضطرابات الكبد.", "الأمعاء مش بتشتغل فتضمر."]]], ["Refeeding syndrome", [["Patients who require enteral or PN therapies may have been eating poorly before initiating therapy because of the disease process and may be moderately to severely malnourished.", "المرضى المحتاجين لتغذية معوية أو وريدية يمكن يكونوا مش بياكلوا كويس بسبب المرض وعندهم سوء تغذية متوسط لشديد.", "واحد صايم بقاله أيام."], ["Aggressive administration of nutrition, particularly via the intravenous route, can precipitate refeeding syndrome with severe, potentially lethal electrolyte fluctuations involving metabolic, hemodynamic, and neuromuscular problems.", "التغذية المكثفة خصوصًا من الوريد ممكن تسبب متلازمة إعادة التغذية، تقلبات أملاح شديدة ممكن تقتل، ومشاكل أيضية وقلبية وعصبية عضلية.", "جسم جعان ياخد أكل كتير فجأة يتلخبط."], ["Refeeding syndrome occurs when energy substrates, particularly
