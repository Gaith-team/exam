<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GHAITH TEAM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#15803d;--c2:#ea580c;--c3:#ca8a04;--grad:linear-gradient(135deg,#14532d,#15803d 40%,#65a30d 75%,#ea580c);--bg:#f6faf5;--bg2:#eaf3e7;--cd:#fff;--tx:#14231a;--t2:#3f5546;--t3:#738a7a;--bc:rgba(20,60,30,.1);--ok:#15803d;--no:#dc2626;--r:16px}
[data-theme=dark]{--bg:#0b140e;--bg2:#111e15;--cd:#16261b;--tx:#e8f5ec;--t2:#b8d2c0;--t3:#7f9a88;--bc:rgba(255,255,255,.09);--ok:#4ade80;--no:#f87171}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#pb{position:fixed;top:0;left:0;height:3px;z-index:9;background:linear-gradient(90deg,#15803d,#ca8a04,#ea580c);transition:width .2s}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:60px;background:var(--cd);border-bottom:1px solid var(--bc)}
.br{display:flex;align-items:center;gap:8px;font-weight:900}.lg{width:32px;height:32px;border-radius:8px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tb{width:36px;height:36px;border-radius:50%;border:1px solid var(--bc);background:var(--bg);cursor:pointer}
.hero{background:var(--grad);text-align:center;color:#fff;padding:32px 16px}.hero .ic{font-size:36px}.hero h1{font-size:26px;margin:4px 0}.hero p{opacity:.9;font-size:13px}
.pills{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}.pill{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:5px 14px;font-size:12px;font-weight:700}
.shell{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.sb{background:var(--cd);border:1px solid var(--bc);border-radius:var(--r);padding:10px;text-align:center}.sb:nth-child(1){border-top:3px solid var(--ok)}.sb:nth-child(2){border-top:3px solid var(--no)}.sb:nth-child(3){border-top:3px solid var(--c2)}
.sb .v{font-size:20px;font-weight:900}.sb .l{font-size:11px;color:var(--t3)}
.ps{background:var(--cd);border:1px solid var(--bc);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:12px}.pl{font-size:13px;font-weight:700;color:var(--t2);white-space:nowrap}
.pt{flex:1;height:8px;background:var(--bg2);border-radius:8px;overflow:hidden}.pf{height:100%;width:0;background:linear-gradient(90deg,#15803d,#ca8a04,#ea580c);transition:width .4s}
.tm{min-width:64px;height:34px;border-radius:17px;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}.tm.w{color:#d97706}.tm.d{color:var(--no)}
.qc{background:var(--cd);border:1px solid var(--bc);border-radius:20px;overflow:hidden;box-shadow:0 4px 20px rgba(20,90,40,.08)}
.qh{background:var(--grad);padding:6px 18px}.qn{display:inline-block;background:rgba(255,255,255,.2);border-radius:8px;padding:3px 10px;font-size:11px;font-weight:700;color:#fff}
.qt{padding:20px 18px 14px;font-size:15px;font-weight:700;line-height:1.65;border-bottom:1px solid var(--bc);direction:ltr;text-align:left}
.ops{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;direction:ltr;text-align:left;transition:.25s}
.opt:hover:not(.dis){border-color:var(--c2);transform:translateX(3px)}
.ol{width:28px;height:28px;border-radius:8px;flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--t3)}
.opt.correct{border-color:var(--ok);background:rgba(21,128,61,.1)}.opt.correct .ol{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:rgba(220,38,38,.07)}.opt.wrong .ol{background:var(--no);color:#fff}.opt.dis{pointer-events:none}
.fb{margin:6px 18px 14px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14px}.fb.ok{background:rgba(21,128,61,.1);color:var(--ok)}.fb.no{background:rgba(220,38,38,.08);color:var(--no)}
.nb{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:0;border-radius:12px;font-size:14px;font-weight:900;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.bn{background:linear-gradient(135deg,#15803d,#65a30d);color:#fff}.bs{flex:0 0 auto;padding:13px 18px;background:var(--bg2);color:var(--t2);border:1px solid var(--bc)}
.rh{text-align:center;padding:32px 20px;background:var(--cd);border:1px solid var(--bc);border-top:5px solid var(--ac);border-radius:20px;margin-bottom:18px}
.sn{font-size:46px;font-weight:900}.rg{font-size:22px;font-weight:900;margin:6px 0}
.rst{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.rs{background:var(--bg2);border-radius:10px;padding:10px}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--t3)}
.ra{display:flex;flex-direction:column;gap:10px;margin-top:16px}.br2{background:linear-gradient(135deg,#ea580c,#15803d);color:#fff}.bh{background:var(--bg2);color:var(--tx);border:1px solid var(--bc)}
.ri{background:var(--cd);border:1px solid var(--bc);border-radius:14px;padding:14px;margin-bottom:10px;border-right:4px solid var(--bc);direction:ltr;text-align:left;font-size:13px}.ri.ok{border-right-color:var(--ok)}.ri.no{border-right-color:var(--no)}
.ri .q{font-weight:700;margin-bottom:6px}.rw{margin-top:4px;color:var(--t2)}.bd{padding:1px 7px;border-radius:6px;font-weight:700;font-size:11px;margin-right:6px}.by{background:rgba(220,38,38,.1);color:var(--no)}.br3{background:rgba(21,128,61,.1);color:var(--ok)}
footer{text-align:center;padding:20px;border-top:1px solid var(--bc);background:var(--bg2);font-weight:700}footer span{color:var(--ac)}
</style></head>
<body>
<div id="pb" style="width:0"></div>
<nav><div class="br"><div class="lg">GT</div>GHAITH TEAM</div><button class="tb" id="themeBtn">🌙</button></nav>
<div class="hero"><div class="ic">🥗</div><h1>Enteral &amp; Parenteral Nutrition</h1><p>Applied Nutrition</p>
<div class="pills"><div class="pill" id="totalBadge">-- سؤال</div><div class="pill">⏱ 35 Min</div><div class="pill">🔀 Shuffled</div></div></div>
<div class="shell">
<div class="stats"><div class="sb"><div class="v" id="sC">0</div><div class="l">✔ صحيح</div></div><div class="sb"><div class="v" id="sW">0</div><div class="l">✖ خطأ</div></div><div class="sb"><div class="v" id="sR">--%</div><div class="l">⏳ متبقي</div></div></div>
<div class="ps"><div class="pl" id="pl">سؤال ١</div><div class="pt"><div class="pf" id="pf"></div></div><div class="tm" id="tm"><span id="tt">35:00</span></div></div>
<div id="app"></div></div>
<footer>GHAITH <span>TEAM</span></footer>
<script>
const QUESTIONS=[
/* ===== MCQ (easy → hard) ===== */
{t:"Enteral nutrition (EN) is best defined as nutrition delivered:",o:["Intravenously into the bloodstream","Through the GI tract via a tube, catheter, or stoma distal to the oral cavity","Only as oral supplements","Subcutaneously"],a:1},
{t:"Which patient is a typical candidate for EN?",o:["Complete bowel obstruction","Paralytic ileus","A functional GI tract but oral intake that is unsafe, insufficient, or impossible","Severe GI bleeding"],a:2},
{t:"Which feeding route is generally preferred when the gut works?",o:["Enteral","Parenteral","Peripheral parenteral","Rectal"],a:0},
{t:"Luminal nutrients maintain gallbladder function by stimulating release of:",o:["Gastrin","Secretin","Insulin","Cholecystokinin"],a:3},
{t:"Which immunoglobulin secreted in the gut prevents bacterial adherence and translocation?",o:["IgG","IgA","IgM","IgE"],a:1},
{t:"Compared with parenteral nutrition, overall provision of EN is:",o:["More expensive","Equal in cost","Less expensive","Impossible to compare"],a:2},
{t:"Which is a contraindication to EN?",o:["Paralytic ileus","Inadequate oral intake for 7–14 days","Unsafe swallowing with a working gut","Critically ill patient in the ICU"],a:0},
{t:"In critically ill patients, EN should be started within:",o:["6 to 12 hours","3 to 5 days","24 to 48 hours of ICU admission","7 to 14 days"],a:2},
{t:"Short-term enteral access is intended for no more than:",o:["1 week","3 to 4 weeks","3 months","6 months"],a:1},
{t:"Which is a long-term enteral access device?",o:["Naso-gastric tube","Naso-duodenal tube","Naso-jejunal tube","Gastrostomy"],a:3},
{t:"Severe short-bowel syndrome as a contraindication refers to how much small bowel remaining?",o:["Less than 100 cm","Less than 300 cm","Less than 500 cm","More than 200 cm"],a:0},
{t:"Which is a complication of naso-enteric tubes?",o:["Hypercalcemia","Gastroesophageal reflux resulting in aspiration pneumonia","Cholestasis","Hyperammonemia"],a:1},
{t:"Specialized nutrition support should be started when inadequate oral intake lasts or is expected to last:",o:["1 to 2 days","3 to 4 days","7 to 14 days","More than 8 weeks"],a:2},
{t:"In standard enteral formulas, lipid provides approximately what percentage of total kilocalories?",o:["1% to 5%","40% to 55%","60% to 80%","15% to 30%"],a:3},
{t:"Elemental formulas contain minimal fat, typically as:",o:["Medium-chain triglycerides (MCTs)","Long-chain triglycerides (LCTs)","Saturated animal fat","Cholesterol"],a:0},
{t:"Adult fluid needs in EN are often estimated at:",o:["10 ml/kg","100 ml/kg","1 ml of water per kcal, or 30 to 35 ml/kg","5 ml per kcal"],a:2},
{t:"Bolus feeding is optimal for patients who:",o:["Have poor gastric emptying","Have adequate gastric emptying and are clinically stable","Cannot tolerate any volume","Are critically unstable"],a:1},
{t:"Continuous EN feeding requires:",o:["A bolus syringe only","Gravity drip only","No equipment","A pump"],a:3},
{t:"Osmotic diarrhea in tube-fed patients is especially associated with which ingredient in liquid drug preparations?",o:["Sorbitol","Lactose-free milk","Medium-chain fat","Corn syrup"],a:0},
{t:"Which micronutrient deficiency is notably seen as a metabolic complication of EN?",o:["Vitamin C","Vitamin K","Thiamin","Niacin"],a:2},
{t:"During EN, the head of the bed should be kept at:",o:["0 degrees","30 degrees","90 degrees","Trendelenburg"],a:1},
{t:"How often should the patient's weight be checked during EN (minimum)?",o:["Once a month","Once a week","Once every 2 weeks","At least 3 times per week"],a:3},
{t:"Protein in commercial enteral formulas ranges from:",o:["6% to 25% of total kcal","1% to 3%","40% to 60%","70% to 90%"],a:0},
{t:"Carbohydrate content in enteral formulas ranges from:",o:["5% to 10%","15% to 20%","30% to 85% of kcal","90% to 100%"],a:2},
{t:"Which is a correct statement about parenteral nutrition (PN)?",o:["It uses the GI tract","It provides nutrients directly into the bloodstream intravenously","It is given only orally","It is cheaper than EN"],a:1},
{t:"Which is NOT a PN access type?",o:["Peripheral access","Short-term central access","Long-term central access","Naso-gastric access"],a:3},
{t:"A 10% amino acid solution supplies how much protein per liter?",o:["100 g","10 g","50 g","200 g"],a:0},
{t:"Lipid emulsion administration should not exceed:",o:["0.5 g/kg/day","1 g/kg/day exactly","2 g/kg/day","5 g/kg/day"],a:2},
{t:"Lipid infusion should be discontinued when triglycerides exceed:",o:["150","400","1000","100"],a:1},
{t:"A 20% lipid emulsion contains how many kcal/ml?",o:["0.5","1.1","1.5","2"],a:3},
{t:"The maximum carbohydrate administration rate in critically ill patients should not exceed:",o:["5 to 6 mg/kg/min","1 mg/kg/min","15 mg/kg/min","25 mg/kg/min"],a:0},
{t:"Which is a mechanical complication of central PN catheter placement?",o:["Cholestasis","Pneumothorax","Uremia","Hypophosphatemia"],a:1},
{t:"Which is a metabolic complication of PN?",o:["Subclavian hematoma","Thoracic duct injury","Brachial plexus injury","Hyperosmolar, nonketotic, hyperglycemic coma"],a:3},
{t:"Refeeding syndrome occurs when energy substrates, particularly carbohydrate, are introduced to:",o:["Well-nourished, stable adults","Patients with hypertension only","Anabolic, previously malnourished patients","Patients with hyperglycemia only"],a:2},
/* ===== TRUE / FALSE ===== */
{t:"Using the normal route of digestion and absorption helps maintain the functional integrity of the gut.",o:["True","False"],a:0},
{t:"EN increases the risk of cholecystitis compared with parenteral nutrition.",o:["True","False"],a:1},
{t:"IgA production is reduced when intraluminal nutrients are absent.",o:["True","False"],a:0},
{t:"EN has been shown to reduce infectious complications such as pneumonia and sepsis.",o:["True","False"],a:0},
{t:"EN is generally more expensive than parenteral nutrition.",o:["True","False"],a:1},
{t:"Severe GI bleeding is a contraindication to EN.",o:["True","False"],a:0},
{t:"In critically ill patients, EN should be delayed until after day 7 of ICU admission.",o:["True","False"],a:1},
{t:"Naso-gastric tubes are the preferred option when EN is required for more than 4 weeks.",o:["True","False"],a:1},
{t:"Jejunostomy is a long-term enteral access option.",o:["True","False"],a:0},
{t:"Elemental formulas contain large amounts of long-chain triglycerides.",o:["True","False"],a:1},
{t:"Continuous feeding requires a pump and suits patients who do not tolerate bolus volumes.",o:["True","False"],a:0},
{t:"A midline catheter can be used for central parenteral nutrition.",o:["True","False"],a:1},
{t:"Lipid infusion should be stopped when triglyceride levels exceed 400.",o:["True","False"],a:0},
{t:"Refeeding syndrome occurs mainly in well-nourished patients receiving minimal feeding.",o:["True","False"],a:1},
{t:"Cholestasis and hepatic abnormalities are gastrointestinal complications of PN.",o:["True","False"],a:0}
];
let questions,i,correct,wrong,answers,wrongSet,answered,totalTime=35*60,timeLeft,timer;
const L=['A','B','C','D'];
const $=id=>document.getElementById(id);
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function shufOpt(q){if(q.o.length===2&&q.o[0]==='True')return{...q};const idx=shuffle(q.o.map((_,k)=>k));return{...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)}}
function init(pool){questions=shuffle([...pool]).map(shufOpt);start()}
function start(){i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;$('totalBadge').textContent=questions.length+' سؤال';tick();render()}
function tick(){clearInterval(timer);timer=setInterval(()=>{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;$('tt').textContent=m+':'+(s<10?'0':'')+s;$('tm').className='tm'+(timeLeft<=120?' d':timeLeft<=300?' w':'');if(timeLeft<=0){clearInterval(timer);finish()}},1000)}
function top_(){const n=questions.length;$('sC').textContent=correct;$('sW').textContent=wrong;$('sR').textContent=Math.round((n-answered)/n*100)+'%';$('pl').textContent='سؤال '+(i+1)+' / '+n;$('pf').style.width=(i+1)/n*100+'%';$('pb').style.width=(i+1)/n*100+'%'}
function render(){top_();const q=questions[i];$('app').innerHTML=`<div class="qc"><div class="qh"><span class="qn">سؤال ${i+1} / ${questions.length}</span></div><div class="qt">${q.t}</div><div class="ops">${q.o.map((o,k)=>`<div class="opt" id="o${k}" onclick="choose(${k})"><div class="ol">${L[k]}</div>${o}</div>`).join('')}</div><div class="nb"><button class="btn bs" onclick="skip()">⏭ تخطي</button></div></div>`}
function choose(v){if(answers[i]!==null)return;answers[i]=v;answered++;const q=questions[i],ok=v===q.a;ok?correct++:wrong++;top_();q.o.forEach((_,k)=>{const e=$('o'+k);e.classList.add('dis');if(k===q.a)e.classList.add('correct');else if(k===v)e.classList.add('wrong')});
const fb=document.createElement('div');fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'🎉 ممتاز ، اللهم بارك':'😔 ركز يا سكر';const c=document.querySelector('.qc');c.querySelector('.ops').after(fb);
c.querySelector('.nb').innerHTML=`<button class="btn bn" onclick="next()">${i<questions.length-1?'← السؤال التالي':'🏁 إنهاء الامتحان'}</button>`}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrong++;top_()}next()}
function next(){if(i<questions.length-1){i++;render();scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){clearInterval(timer);const n=questions.length,sc=Math.round(correct/n*100);
questions.forEach((q,k)=>{if(answers[k]!==q.a)wrongSet.push(q)});wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
let g,col;if(sc>=90){g='🥇 ممتاز';col='var(--ok)'}else if(sc>=75){g='🥈 جيد جداً';col='var(--c2)'}else if(sc>=60){g='🥉 جيد';col='#d97706'}else{g='📚 راجع تاني';col='var(--no)'}
const rep=questions.map((q,k)=>{const ok=answers[k]===q.a;return`<div class="ri ${ok?'ok':'no'}"><div class="q">${ok?'✅':'❌'} ${q.t}</div>${ok?'':`<div class="rw"><span class="bd by">Your answer</span>${answers[k]>=0?q.o[answers[k]]:'Skipped'}</div><div class="rw"><span class="bd br3">Correct</span>${q.o[q.a]}</div>`}</div>`}).join('');
$('pb').style.width='100%';
$('app').innerHTML=`<div class="rh"><div class="sn" style="color:${col}">${sc}%</div><div class="rg" style="color:${col}">${g}</div><div>أجبت على ${answered} من ${n} سؤال</div><div class="rst"><div class="rs"><div class="n" style="color:var(--ok)">${correct}</div><div class="l">صحيح</div></div><div class="rs"><div class="n" style="color:var(--no)">${wrong}</div><div class="l">خطأ</div></div><div class="rs"><div class="n" style="color:var(--c2)">${Math.max(0,n-answered)}</div><div class="l">متبقي</div></div></div></div>
<div class="ra">${wrongSet.length?`<button class="btn br2" onclick="retry()">🔁 إعادة الخطأ (${wrongSet.length})</button>`:''}<button class="btn bh" onclick="init(QUESTIONS)">🔀 امتحان جديد عشوائي</button></div>
<div style="margin-top:24px;font-weight:700;color:var(--t2);margin-bottom:10px">📋 تقرير مفصّل</div>${rep}`;scrollTo({top:0,behavior:'smooth'})}
function retry(){questions=shuffle([...wrongSet]).map(shufOpt);start();scrollTo({top:0,behavior:'smooth'})}
let theme='light';
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');$('themeBtn').textContent=t==='dark'?'☀️':'🌙'}
$('themeBtn').onclick=()=>applyTheme(theme==='dark'?'light':'dark');
init(QUESTIONS);
</script></body></html>
