# Introduction
Nutrition across the life course refers to the nutritional requirements and healthy eating practices needed at different stages of human development, from pregnancy and infancy through childhood, adolescence, adulthood, and older age.||التغذية عبر مراحل العمر معناها الاحتياجات الغذائية وعادات الأكل الصحي اللي محتاجها الإنسان في كل مرحلة، من الحمل والرضاعة لحد الطفولة والمراهقة والبلوغ وكبر السن.||عشان تفهمها: الأكل المناسب لطفل عمره سنة غير الأكل المناسب لراجل عنده سبعين سنة.
Nutritional needs change with growth, development, physical activity, physiological changes, and health conditions.||احتياجات الأكل بتتغير مع النمو والتطور والنشاط البدني والتغيرات في وظائف الجسم والحالة الصحية.||عشان تفهمها: اللي بيلعب رياضة محتاج أكل أكتر من اللي قاعد، والمريض ممكن يحتاج أكل مختلف.
# Importance of Adequate Nutrition at Different Life Stages
Adequate nutrition is essential throughout life because nutritional needs change according to growth, development, activity, and physiological changes.||الأكل الكفاية ضروري طول العمر لأن الاحتياجات بتتغير حسب النمو والتطور والنشاط وتغيرات الجسم.||عشان تفهمها: زي العربية، كل مرحلة محتاجة بنزين بكمية ونوع مختلف.
## Life Stage / Importance of Adequate Nutrition
Pregnancy: Supports maternal health, fetal growth and brain development, and helps prevent nutritional deficiencies and complications.||في الحمل الأكل بيدعم صحة الأم ونمو الجنين ومخه، وبيمنع نقص العناصر والمضاعفات.||عشان تفهمها: الأم لو أكلت كويس، الجنين بياخد اللي يحتاجه من غير ما الأم تتعب.
Lactation: Supports maternal recovery and adequate breast milk production and helps maintain maternal nutrient stores.||في الرضاعة الأكل بيساعد الأم تتعافى وبيساعد على كمية لبن كفاية وبيحافظ على مخزون الأم من العناصر.||عشان تفهمها: الأم بتدّي من جسمها في اللبن، فلازم تعوّض بالأكل.
Infancy: Provides nutrients needed for rapid growth, brain development, immunity, and healthy development.||في الرضاعة (الرضّع) الأكل بيدّي العناصر للنمو السريع وتطور المخ والمناعة.||عشان تفهمها: الرضيع بيكبر بسرعة جدًا في أول سنة.
Early Childhood: Supports physical growth, cognitive development, immunity, and development of healthy eating habits.||في الطفولة المبكرة الأكل بيدعم نمو الجسم والتفكير والمناعة وتكوين عادات أكل سليمة.||عشان تفهمها: الطفل اللي يتعود على الفاكهة صغير هيحبها لما يكبر.
School Age: Provides energy for growth, learning, concentration, physical activity, and immune function.||في سن المدرسة الأكل بيدّي طاقة للنمو والتعلم والتركيز والحركة والمناعة.||عشان تفهمها: التلميذ اللي مبيفطرش بيبقى مشتت في الحصة.

# Nutrition at Different Life Stages
## 1. Nutrition during pregnancy
Pregnancy increases the body's nutritional requirements to support maternal health, fetal growth, and development.||الحمل بيزوّد احتياجات الجسم الغذائية عشان تدعم صحة الأم ونمو الجنين وتطوره.||عشان تفهمها: الأم بتاكل لنفسها وللجنين، فاحتياجها أكتر.
## Important Nutrients
Protein: growth of fetal tissues and maternal tissues.||البروتين لنمو أنسجة الجنين وأنسجة الأم.||عشان تفهمها: البروتين هو "الطوب" اللي بيتبني بيه الجسم.
Iron: prevention of maternal anemia and support of fetal blood formation.||الحديد بيمنع أنيميا الأم وبيساعد في تكوين دم الجنين.||عشان تفهمها: من غير حديد الدم يقل والأم تتعب وتبقى شاحبة.
Folic acid: important for neural tube development.||حمض الفوليك مهم لتكوين الأنبوب العصبي للجنين.||عشان تفهمها: الأنبوب العصبي هو اللي بيتكوّن منه المخ والحبل الشوكي.
Calcium: fetal bone and teeth development.||الكالسيوم لتكوين عظام وأسنان الجنين.||عشان تفهمها: اللبن والجبن مصدر كويس للكالسيوم.
Vitamin D: calcium absorption and bone health.||فيتامين د بيساعد على امتصاص الكالسيوم وصحة العظام.||عشان تفهمها: من غيره الكالسيوم ميتمتصش كويس حتى لو أكلته.
Iodine: fetal brain and nervous-system development.||اليود لنمو مخ الجنين وجهازه العصبي.||عشان تفهمها: اليود عنصر صغير بس تأثيره كبير على ذكاء الطفل.
Omega-3 fatty acids: fetal brain and eye development.||أوميجا 3 لنمو مخ وعين الجنين.||عشان تفهمها: دهون مفيدة موجودة في السمك.
## Healthy Practices
Eat a varied and balanced diet.||كلي أكل متنوع ومتوازن.||عشان تفهمها: متعتمديش على نوع واحد، خدي من كل الأنواع.
Consume adequate fruits and vegetables.||كلي كمية كفاية من الفاكهة والخضار.||عشان تفهمها: طبق سلطة مع كل غدا.
Choose whole grains and protein-rich foods.||اختاري الحبوب الكاملة والأكل الغني بالبروتين.||عشان تفهمها: عيش بلدي أحسن من العيش الأبيض، وبيض أو فول أو لحمة للبروتين.
Drink adequate fluids.||اشربي سوائل كفاية.||عشان تفهمها: ميه بانتظام طول اليوم.
Take prescribed prenatal supplements.||خدي المكملات اللي الدكتور كاتبها لفترة الحمل.||عشان تفهمها: زي حديد وفوليك بالجرعة اللي الدكتور حددها.
Avoid alcohol and foods with significant food-safety risks.||ابعدي عن الكحول وعن الأكل اللي فيه خطر على السلامة الغذائية.||عشان تفهمها: الأكل غير المضمون أو الملوث ممكن يأذي الأم والجنين.
## Common Nutritional Problems
Iron-deficiency anemia||أنيميا نقص الحديد.||عشان تفهمها: تعب وشحوب بسبب قلة الحديد في الدم.
Inadequate weight gain||زيادة وزن أقل من المطلوب.||عشان تفهمها: الأم مش بتزيد كفاية في الحمل فالجنين ممكن ميكبرش كويس.
Excessive weight gain||زيادة وزن أكتر من اللازم.||عشان تفهمها: الأم بتزيد وزن بسرعة زيادة عن المعدل.
Nausea and vomiting||غثيان وقيء.||عشان تفهمها: بيحصل كتير في الحمل وبيأثر على قدرتها تاكل.
Constipation||إمساك.||عشان تفهمها: صعوبة في الإخراج، والألياف والميه بيساعدوا.
## 2. Nutrition during lactation
Breastfeeding increases nutritional and fluid requirements to support milk production and maternal health.||الرضاعة الطبيعية بتزوّد احتياجات الأكل والسوائل عشان تدعم إنتاج اللبن وصحة الأم.||عشان تفهمها: الأم بتفقد سوائل وعناصر في اللبن فلازم تعوضها.
## Recommendations
Eat a balanced and varied diet.||كلي أكل متوازن ومتنوع.||عشان تفهمها: خدي من كل مجموعات الأكل.
Consume adequate protein.||كلي بروتين كفاية.||عشان تفهمها: بيض ولحمة وبقوليات.
Maintain adequate hydration.||حافظي على ترطيب كفاية للجسم.||عشان تفهمها: اشربي ميه كتير خصوصًا وقت الرضاعة.
Include fruits, vegetables, whole grains, dairy or appropriate alternatives, and protein foods.||ضيفي فاكهة وخضار وحبوب كاملة ولبن أو بدائله وأكل بروتين.||عشان تفهمها: طبق فيه من كل مجموعة.
Continue prescribed supplements when indicated.||كمّلي المكملات المكتوبة لما يكون مطلوب.||عشان تفهمها: متوقفيش المكمل من نفسك إلا بكلام الدكتور.
## Breastfeeding
Exclusive breastfeeding is recommended for approximately the first 6 months of life, when possible and appropriate.||الرضاعة الطبيعية الخالصة موصى بيها لأول 6 شهور تقريبًا لو ممكنة ومناسبة.||عشان تفهمها: الرضيع ياخد لبن أمه بس من غير ميه ولا أكل لحد 6 شهور.
## 3. Nutrition during infancy
Infancy is a period of rapid growth and development.||الرضاعة (مرحلة الرضيع) فترة نمو وتطور سريع.||عشان تفهمها: وزن الرضيع بيزيد كتير في شهور قليلة.
## 0–6 Months
Breast milk is the recommended primary food.||لبن الأم هو الأكل الأساسي الموصى بيه.||عشان تفهمها: ده الأكل الرئيسي للرضيع.
Appropriate infant formula can be used when breastfeeding is not possible or is insufficient.||ممكن نستخدم لبن صناعي مناسب لو الرضاعة مش ممكنة أو مش كفاية.||عشان تفهمها: لو الأم مش قادرة ترضع أو اللبن قليل.
Avoid giving complementary foods before the infant is developmentally ready.||متدّيش أكل تكميلي قبل ما الرضيع يبقى جاهز نمائيًا.||عشان تفهمها: متبدأش بأكل جامد وهو لسه مش جاهز.
## Around 6 Months
Complementary foods are introduced while breastfeeding continues.||بنبدأ نضيف الأكل التكميلي والرضاعة مستمرة.||عشان تفهمها: الأكل بيتضاف مش بيحل مكان الرضاعة.
Suitable foods include:||الأكل المناسب بيشمل الآتي:||عشان تفهمها: دي أمثلة للأكل اللي ينفع نبدأ بيه.
Mashed vegetables and fruits||خضار وفاكهة مهروسة.||عشان تفهمها: زي موزة أو جزر مهروس.
Cereals and grains||سيريلاك وحبوب.||عشان تفهمها: زي الأرز أو الشوفان المطبوخ.
Eggs and other protein-rich foods||بيض وأكل غني بالبروتين.||عشان تفهمها: البيض مصدر بروتين للرضيع.
Legumes||البقوليات.||عشان تفهمها: زي العدس والفول.
Meat, poultry, or fish prepared appropriately||لحمة أو فراخ أو سمك متحضرين بشكل مناسب.||عشان تفهمها: مطبوخين كويس ومقطعين أو مهروسين مناسب لسنه.
## Recommendations
Introduce foods gradually.||أدخل الأكل بالتدريج.||عشان تفهمها: صنف جديد كل مرة مش كلهم مرة واحدة.
Provide iron-rich foods.||قدّم أكل غني بالحديد.||عشان تفهمها: عشان يتجنب الأنيميا.
Use appropriate food texture according to developmental stage.||استخدم قوام أكل مناسب لمرحلة نمو الطفل.||عشان تفهمها: مهروس للصغير وبعدين أخشن لما يكبر.
Maintain safe food preparation and hygiene.||حافظ على تحضير أكل آمن ونظافة.||عشان تفهمها: غسيل إيدين وأدوات نضيفة.
Avoid choking hazards.||ابعد عن الأكل اللي ممكن يسبب اختناق.||عشان تفهمها: متدّيش حاجة صغيرة وجامدة ممكن تتحشر في حلقه.
## 4. Nutrition during early childhood
Early childhood is important for establishing lifelong eating habits.||الطفولة المبكرة مهمة لتكوين عادات الأكل اللي هتفضل طول العمر.||عشان تفهمها: اللي يتعوده الطفل دلوقتي هيكمل بيه.
## Nutritional Needs
Children need adequate:||الأطفال محتاجين كفاية من:||عشان تفهمها: دي العناصر اللي جاية تحت.
Energy||الطاقة.||عشان تفهمها: عشان يلعب ويتحرك.
Protein||البروتين.||عشان تفهمها: عشان يبني جسمه.
Iron||الحديد.||عشان تفهمها: عشان الدم.
Calcium||الكالسيوم.||عشان تفهمها: عشان العظام والسنان.
Vitamin D||فيتامين د.||عشان تفهمها: عشان العظام وامتصاص الكالسيوم.
Zinc||الزنك.||عشان تفهمها: عشان النمو.
Vitamins and minerals||الفيتامينات والمعادن.||عشان تفهمها: عشان الجسم يشتغل صح.
## Healthy Practices
Provide regular balanced meals and healthy snacks.||قدّم وجبات متوازنة منتظمة وسناكس صحية.||عشان تفهمها: مواعيد ثابتة وسناك زي فاكهة.
Encourage fruits and vegetables.||شجّع على الفاكهة والخضار.||عشان تفهمها: خليهم جزء من كل وجبة.
Offer milk or appropriate dairy alternatives.||قدّم لبن أو بدائل ألبان مناسبة.||عشان تفهمها: للكالسيوم.
Limit sugary drinks and highly processed foods.||قلل المشروبات السكرية والأكل المصنع جدًا.||عشان تفهمها: مش كل يوم عصاير وشيبسي.
Encourage water as the main beverage.||شجّع الميه كمشروب أساسي.||عشان تفهمها: الميه هي الاختيار الأول.
Avoid forcing children to eat.||متجبرش الأطفال على الأكل.||عشان تفهمها: الإجبار بيخليهم يكرهوا الأكل.
## Common Problems
Iron-deficiency anemia||أنيميا نقص الحديد.||عشان تفهمها: شحوب وتعب بسبب قلة الحديد.
Undernutrition||نقص التغذية.||عشان تفهمها: الطفل مش بياخد كفايته من الأكل.
Stunting||قصر القامة (التقزم).||عشان تفهمها: طول الطفل أقل من سنه.
Overweight and obesity||زيادة الوزن والسمنة.||عشان تفهمها: وزن الطفل أكتر من المعدل.
Dental caries||تسوس الأسنان.||عشان تفهمها: بيحصل من كتر السكريات.
## 5. Nutrition during school age
Children require adequate nutrition for growth, learning, physical activity, and immunity.||الأطفال محتاجين تغذية كفاية للنمو والتعلم والنشاط والمناعة.||عشان تفهمها: التلميذ بيذاكر ويلعب فمحتاج طاقة.
## Healthy Diet
Fruits and vegetables||فاكهة وخضار.||عشان تفهمها: فيتامينات وألياف.
Whole grains||حبوب كاملة.||عشان تفهمها: زي العيش البلدي.
Lean protein||بروتين قليل الدهون.||عشان تفهمها: زي صدور الفراخ والسمك.
Dairy or suitable alternatives||ألبان أو بدائل مناسبة.||عشان تفهمها: لبن وزبادي.
Adequate water||ميه كفاية.||عشان تفهمها: زجاجة ميه معاه في المدرسة.
## Healthy School Practices
Encourage eating breakfast.||شجّع على الفطار.||عشان تفهمها: الفطار بيديه طاقة للتركيز.
