<script>
const D = [
{t:"Definition",ic:"📖",items:[
["Malnutrition is a condition resulting from an imbalance between the body’s nutritional requirements and the intake or absorption of nutrients.","سوء التغذية هو حالة بتحصل لما اللي الجسم محتاجه من غذاء مش بيتساوى مع اللي بيدخله أو اللي بيمتصه فعلاً. يعني الخلل ممكن يكون في الاحتياج أو الأكل أو الامتصاص.","زي عربية محتاجة 40 لتر بنزين وانت حاطط فيها 10 بس (نقص)، أو حاطط 80 (زيادة)، الاتنين خلل."],
["It includes undernutrition, micronutrient deficiencies, overweight, and obesity.","سوء التغذية مش معناه النحافة بس، ده بيشمل نقص التغذية، ونقص الفيتامينات والمعادن، والوزن الزايد، والسمنة.","الشخص النحيف جداً عنده سوء تغذية، والشخص السمين اللي بياكل أكل مفيهوش فايدة عنده سوء تغذية برضو."]
]},
{t:"Types of Malnutrition",ic:"🧩",items:[
["1. Undernutrition","النوع الأول: نقص التغذية، يعني الجسم مش واخد كفايته.","طفل مش بيلاقي أكل كفاية فوزنه وطوله واقفين."],
["Wasting: low weight for height.","Wasting يعني وزن قليل بالنسبة للطول (هزال).","طفل طوله 100 سم المفروض وزنه حوالي 15 كيلو لكن وزنه 11، يبقى هزلان."],
["Stunting: low height for age.|Stunting = chronic undernutrition → impaired linear growth.","Stunting يعني طول قصير بالنسبة للسن (تقزّم)، وده معناه نقص تغذية مزمن بيوقف نمو الطول.","طفل عنده 5 سنين وطوله زي طفل عنده 3 سنين، ده معناه إنه مأخدش تغذية كويسة من زمان."],
["It mainly develops during pregnancy and the first years of life, when adequate nutrition and healthy growth are particularly important.","التقزّم بيحصل غالباً أثناء الحمل وأول سنين العمر، لأن الفترة دي التغذية فيها مهمة جداً عشان النمو.","زي بنا العمارة: لو الأساس ضعيف في الأول، العمارة كلها بتتأثر بعدين."],
["Underweight: low weight for age.|Protein-energy malnutrition.","Underweight يعني وزن قليل بالنسبة للسن. وكمان من الأنواع سوء التغذية البروتيني الطاقي (نقص البروتين والسعرات).","طفل عنده سنتين وزنه أقل من الطبيعي لسنه."],
["2. Micronutrient deficiencies","النوع التاني: نقص الفيتامينات والمعادن.","الشخص ياكل ويشبع بس أكله مفيهوش حديد أو فيتامينات."],
["Iron deficiency → iron-deficiency anemia.|Vitamin A deficiency → visual problems and impaired immunity.|Vitamin D deficiency → impaired bone health.|Iodine deficiency → thyroid dysfunction and impaired cognitive development.|Vitamin B12/folate deficiency → anemia and neurological problems.","الحديد = أنيميا. فيتامين أ = مشاكل نظر ومناعة ضعيفة. فيتامين د = عظام ضعيفة. اليود = الغدة الدرقية وتأخر في الذكاء والنمو. B12 والفولات = أنيميا ومشاكل في الأعصاب.","اربطهم كده: حديد=دم، A=عين، D=عضم، يود=غدة، B12=دم وأعصاب."],
["3. Overnutrition|Overweight and obesity resulting from excessive energy intake relative to expenditure.","النوع التالت: زيادة التغذية، يعني الوزن الزايد والسمنة، وبتحصل لما الجسم ياخد سعرات أكتر من اللي بيحرقها.","واحد بياكل 3000 سعر في اليوم وبيحرق 2000 بس، الزيادة بتتخزن دهون."]
]},
{t:"Undernutrition",ic:"⚖️",items:[
["Definition","التعريف.",""],
["Undernutrition is a condition resulting from inadequate intake or absorption of energy, protein, and/or essential nutrients, leading to loss of body weight, muscle mass, and body functions.","نقص التغذية هو حالة بتحصل لما الأكل (الطاقة والبروتين والعناصر الأساسية) يبقى قليل أو الجسم مش بيمتصه، فيفقد وزن وعضلات وتضعف وظايف الجسم.","مريض مش بيأكل كفاية بقاله شهر فخسّ وعضلاته نحفت وبقى ضعيف ومش قادر يمشي."],
["Important concept","فكرة مهمة.",""],
["Undernutrition is not simply being \"thin.\"","نقص التغذية مش معناه إن الشخص نحيف وخلاص.","في ناس نحيفة بطبيعتها وصحتها تمام، وفي ناس شكلها عادي بس عندها نقص تغذية."],
["A person may have undernutrition because of:","الشخص ممكن يحصله نقص تغذية بسبب:",""],
["Inadequate food intake.|Increased nutritional requirements.|Impaired digestion or absorption.|Increased nutrient losses.|Disease-related metabolic changes.","أكل قليل، أو احتياج الجسم زاد، أو الهضم والامتصاص فيهم مشكلة، أو الجسم بيفقد عناصر، أو المرض نفسه بيغيّر في التمثيل الغذائي.","واحد بياكل كويس بس عنده إسهال مزمن، الأكل بيطلع قبل ما يتمتص."],
["Types of Undernutrition","أنواع نقص التغذية.",""],
["A. Acute undernutrition","النوع A: نقص تغذية حاد.",""],
["Develops over a relatively short period.","بيحصل في فترة قصيرة نسبياً.","واحد خد نزلة معوية أسبوع وخسّ كتير."],
["Main characteristic:|Wasting or loss of body weight and muscle mass.","العلامة الأساسية: هزال، يعني نزول سريع في الوزن والعضل.","طفل كان وزنه طبيعي وفجأة بقى نحيف بعد مرض."],
["Examples:|Severe infection.|Acute illness.|Starvation.|Severe diarrhea.","أمثلة: عدوى شديدة، مرض حاد، مجاعة، إسهال شديد.","طفل عنده إسهال شديد 5 أيام وجسمه جفّ ونزل وزنه."]
]},
{t:"Chronic undernutrition & PEM",ic:"📉",items:[
["B. Chronic undernutrition","النوع B: نقص تغذية مزمن.",""],
["Develops over a prolonged period.","بيحصل على فترة طويلة.","طفل بقاله سنين مأخدش أكل كفاية."],
["Main characteristic:|Stunting, particularly in children.","العلامة الأساسية: التقزّم (قصر الطول)، وخصوصاً عند الأطفال.","طفل عنده 8 سنين وطوله زي ابن 5 سنين."],
["It results from long-term inadequate nutrition and repeated illness.","بيحصل نتيجة تغذية ناقصة لمدة طويلة وأمراض بتتكرر.","طفل بيمرض كل شوية وأكله قليل، فجسمه مش بيكبر."],
["C. Protein-energy malnutrition (PEM)","النوع C: سوء التغذية البروتيني الطاقي.",""],
["Occurs when there is inadequate intake of both energy and protein.","بيحصل لما الشخص ياخد سعرات وبروتين أقل من اللازم الاتنين مع بعض.","طفل أكله بس شوية رز مسلوق، مفيش لحمة ولا لبن ولا بيض."],
["Two severe clinical forms are:","فيه شكلين شديدين:",""],
["1. Marasmus|Severe deficiency of calories and protein.|Marked wasting.|Very low body weight.|Loss of subcutaneous fat and muscle.","الماراسمس: نقص شديد في السعرات والبروتين، هزال واضح، وزن قليل جداً، ويفقد الدهون اللي تحت الجلد والعضل.","طفل شكله عضم وجلد، الضلوع باينة وإيديه ورجليه رفيعة."],
["2. Kwashiorkor|Predominantly severe protein deficiency.|Edema is characteristic.|Muscle wasting may be masked by edema.|Hair and skin changes may occur.","الكواشيوركور: النقص الأساسي في البروتين، والعلامة المميزة التورّم (الاستسقاء)، والتورم ممكن يخبّي نحافة العضل، وممكن يحصل تغيّر في الشعر والجلد.","طفل بطنه منفوخة ووشه وقدمه متورمين فتحس إنه تخين، لكن في الحقيقة عضله ضعيف."]
],img:"k",cap:"Kwashiorkor vs Marasmus"},
{t:"Causes of Undernutrition",ic:"🔎",items:[
["Undernutrition usually results from one or more of the following:","نقص التغذية بيحصل غالباً من سبب أو أكتر من الأسباب الجاية.",""],
["A. Inadequate intake","A: أكل قليل.",""],
["Poverty and food insecurity.|Poor appetite.|Fasting.|Inadequate diet.|Difficulty obtaining or preparing food.|Eating disorders.","فقر ومفيش أكل مضمون، قلة شهية، صيام، أكل غير كافي، صعوبة في توفير الأكل أو تحضيره، واضطرابات الأكل.","كبير في السن عايش لوحده ومش قادر يطبخ، فبياكل أي حاجة وخلاص."],
["B. Increased nutritional requirements","B: احتياج الجسم زاد.",""],
["The body may require additional nutrients during:","الجسم ممكن يحتاج عناصر زيادة في الحالات دي:",""],
["Infection.|Fever.|Burns.|Trauma.|Surgery.|Pregnancy and lactation.|Cancer.|Severe wounds.","عدوى، حمى، حروق، إصابة، عملية، حمل ورضاعة، سرطان، جروح شديدة.","واحد عنده حروق كبيرة جسمه بيحرق طاقة وبروتين كتير عشان يصلّح الجلد، فلازم ياكل أكتر."],
["C. Impaired digestion or absorption","C: مشكلة في الهضم أو الامتصاص.",""],
["Examples:|Chronic diarrhea.|Inflammatory bowel disease.|Malabsorption syndromes.|Pancreatic disorders.|Short bowel syndrome.","إسهال مزمن، التهاب الأمعاء، متلازمات سوء الامتصاص، مشاكل البنكرياس، متلازمة الأمعاء القصيرة.","واحد اتشال منه جزء كبير من الأمعاء، فمهما أكل الجسم مش بيستفيد بكل الأكل."],
["D. Increased nutrient losses","D: الجسم بيفقد عناصر.",""],
["Vomiting.|Diarrhea.|Excessive bleeding.|Renal losses.|Persistent drainage from wounds or fistulas.","قيء، إسهال، نزيف كتير، فقد من الكلى، وسحب مستمر من الجروح أو الناسور.","مريض عنده جرح بيسيل منه سوائل وبروتين كل يوم، فبيخسر من جسمه كل يوم."],
["E. Disease-related factors","E: عوامل مرتبطة بالأمراض.",""],
["Cancer.|Chronic kidney disease.|Chronic liver disease.|Heart failure.|Chronic respiratory disease.|Neurological disorders.|Severe infections.","سرطان، فشل كلوي مزمن، مرض كبد مزمن، فشل القلب، أمراض صدر مزمنة، أمراض أعصاب، عدوى شديدة.","مريض فشل قلب بيتعب لما ياكل ومعندوش شهية، فبيخس مع الوقت."]
]},
{t:"Signs and Symptoms of Undernutrition",ic:"🩺",items:[
["The clinical manifestations depend on the severity and duration of undernutrition.","الأعراض بتختلف حسب شدة نقص التغذية وقد إيه استمر.","الأعراض عند حد بقاله أسبوعين غير حد بقاله سنة."],
["General manifestations","أعراض عامة.",""],
["Unintentional weight loss.|Low body weight.|Loss of muscle mass.|Weakness.|Fatigue.|Reduced physical activity.|Poor appetite.","نزول وزن من غير قصد، وزن قليل، فقد عضلات، ضعف، إرهاق، نشاط قليل، وشهية ضعيفة.","واحد بيقول 'هدومي بقت واسعة' من غير ما يكون عامل ريجيم."],
["Skin and hair","الجلد والشعر.",""],
["Dry skin.|Thin, fragile skin.|Poor wound healing.|Hair thinning or loss.|Changes in hair color or texture.","جلد ناشف، جلد رفيع وسهل يتجرح، التئام جروح بطيء، تساقط الشعر أو خفّته، وتغيّر لونه أو ملمسه.","مريض في العناية عنده قرح فراش بتتأخر جداً في الشفا."],
["Musculoskeletal system","الجهاز العضلي الهيكلي.",""],
["Muscle wasting.|Decreased muscle strength.|Reduced mobility.|Increased risk of falls.","ضمور عضلات، قوة عضلات أقل، حركة محدودة، وخطر الوقوع بيزيد.","مريض كبير مش قادر يقوم من الكرسي لوحده ووقع قبل كده."],
["Immune system","جهاز المناعة.",""],
["Increased susceptibility to infection.|Delayed recovery from infection.","بيتعدّى بسهولة، والشفا من العدوى بياخد وقت أطول.","طفل ضعيف بيتعب من أي برد ويفضل أسبوعين عشان يخف."],
["Cardiovascular system","الجهاز القلبي الوعائي.",""],
["Severe undernutrition may result in:|Reduced cardiac muscle mass.|Hypotension.|Bradycardia.","نقص التغذية الشديد ممكن يسبب: نقص كتلة عضلة القلب، وانخفاض ضغط الدم، وبطء ضربات القلب.","القلب عضلة زي أي عضلة، لو الجسم ضعف قلبه بيضعف وضغطه ينزل."],
["Psychological manifestations","الأعراض النفسية.",""],
["Irritability.|Depression.|Poor concentration.|Reduced interest in activities.","عصبية، اكتئاب، تركيز ضعيف، وقلة اهتمام بالأنشطة.","طالب جعان ومش بياكل كويس فبقى عصبي ومش قادر يذاكر."]
]},
{t:"Prevention of Undernutrition",ic:"🛡️",items:[
["Eat a varied and balanced diet.|Ensure adequate protein and energy intake.","كُل أكل متنوع ومتوازن، وتأكد إن البروتين والسعرات كفاية.","طبق فيه رز وخضار وفرخة وسلطة أحسن من طبق مكرونة بس."],
["Treat medical conditions affecting nutrition.|Maintain good oral health.|Seek help for swallowing difficulties.","عالج الأمراض اللي بتأثر على التغذية، واهتم بصحة الفم، واطلب مساعدة لو في صعوبة في البلع.","كبير مسنّن وأسنانه وجعاه مش بيعرف يمضغ، فبيتجنب الأكل."],
["Monitor unintended weight loss.|Monitor nutritional progress throughout hospitalization.","راقب أي نزول وزن من غير قصد، وتابع التقدم الغذائي طول فترة الإقامة في المستشفى.","وزّن المريض كل كام يوم وسجّل الرقم، لو نزل ابلّغ الدكتور."]
]},
{t:"Micronutrient Deficiencies",ic:"💊",items:[
["Definition","التعريف.",""],
["Micronutrients are vitamins and minerals required by the body in small amounts for normal growth, development, metabolism, immune function, and maintenance of health.","الميكرونيوترينتس هي الفيتامينات والمعادن، الجسم محتاجها بكميات صغيرة عشان النمو والتطور والتمثيل الغذائي والمناعة وسلامة الصحة.","زي الملح في الأكل، شوية صغيرة بس من غيرها الأكل ميتاكلش."],
["Micronutrient deficiency occurs when the body does not receive, absorb, or utilize adequate amounts of one or more essential vitamins or minerals.","النقص بيحصل لما الجسم مش بياخد، أو مش بيمتص، أو مش بيستفيد من كمية كفاية من فيتامين أو معدن أساسي واحد أو أكتر.","واحد بياكل حديد بس عنده مشكلة في الأمعاء فمش بيمتصه."],
["They are sometimes called “hidden hunger” because a person may have an adequate amount of calories but still lack essential vitamins and minerals.","بيسموها الجوع الخفي لأن الشخص ممكن ياخد سعرات كفاية ويبان شبعان، وهو في الحقيقة ناقصه فيتامينات ومعادن.","شخص بياكل عيش وفول ومكرونة كل يوم، شبعان وعادي، لكن عنده أنيميا."],
["2. Major Micronutrients","2. أهم الميكرونيوترينتس.",""],
["Micronutrients are divided into:|A. Vitamins","بتتقسم لقسمين: فيتامينات.",""],
["Fat-soluble vitamins|Vitamin A|Vitamin D|Vitamin E|Vitamin K","الفيتامينات الدايبة في الدهون: A و D و E و K.","احفظهم كلمة DEKA."],
["Water-soluble vitamins|Vitamin B group|Vitamin C","الفيتامينات الدايبة في الماء: مجموعة B وفيتامين C.",""],
["B. Minerals|Important minerals include:|Iron|Iodine|Zinc|Calcium|Selenium|Magnesium","B: المعادن، ومن أهمها الحديد واليود والزنك والكالسيوم والسيلينيوم والماغنسيوم.",""],
["****Key Points","أهم النقط للمراجعة.",""],
["Iron → anemia|Vitamin A → vision and immunity|Iodine → thyroid hormones|Vitamin D → bones and calcium|Vitamin B12 → blood + nervous system","الحديد للأنيميا، فيتامين A للنظر والمناعة، اليود لهرمونات الغدة الدرقية، فيتامين D للعظام والكالسيوم، وB12 للدم والأعصاب.","اسأل نفسك: العضم؟ D. العين؟ A. الدم؟ حديد."],
["Folate → DNA + RBCs + fetal neural tube development|Vitamin C → collagen + wound healing|Zinc → growth + immunity + wound healing","الفولات للـ DNA وكرات الدم الحمرا ونمو الأنبوب العصبي للجنين، فيتامين C للكولاجين والتئام الجروح، والزنك للنمو والمناعة والتئام الجروح.","الجرح مش بيلم؟ افتكر C والزنك."]
]},
{t:"Iron Deficiency",ic:"🩸",items:[
["Definition","التعريف.",""],
["Iron deficiency occurs when the body's iron stores are insufficient to meet its requirements.","نقص الحديد بيحصل لما مخزون الحديد في الجسم مش كفاية احتياجه.","زي ما تكون خزنة فلوس وصرفتها كلها قبل آخر الشهر."],
["It is a major cause of iron-deficiency anemia.","وده سبب رئيسي لأنيميا نقص الحديد.",""],
["Risk groups","الفئات الأكتر عرضة.",""],
["Infants and young children.|Adolescents.|Pregnant women.|Women with heavy menstrual bleeding.|Individuals with inadequate dietary iron.|Patients with chronic blood loss.","الرضع والأطفال الصغيرين، المراهقين، الحوامل، الستات اللي دورتهم غزيرة، الناس اللي أكلهم قليل الحديد، ومرضى النزيف المزمن.","بنت مراهقة دورتها غزيرة وبتتجنب اللحمة، فرصة الأنيميا عندها عالية."],
["Signs and symptoms","العلامات والأعراض.",""],
["Fatigue.|Weakness.|Pallor.|Dizziness.|Headache.|Shortness of breath, particularly with exertion.|Poor concentration.","إرهاق، ضعف، شحوب، دوخة، صداع، ضيق نفس خصوصاً مع المجهود، وتركيز ضعيف.","واحدة بتطلع السلم وبتهجّ ولونها أصفر."]
]},
{t:"Vitamin A Deficiency",ic:"👁️",items:[
["Vitamin A is important for:|Normal vision.|Immune function.|Growth and development.|Maintaining epithelial tissues.","فيتامين A مهم للنظر الطبيعي، المناعة، النمو والتطور، والحفاظ على الأنسجة الطلائية (زي الجلد وبطانة الأعضاء).","زي حارس بيحمي بوابة الجسم (الجلد والعين) من الميكروبات."],
["Manifestations","الأعراض.",""],
["Night blindness.|Dry eyes.|Xerophthalmia.|Increased susceptibility to infections.|In severe cases, corneal damage and visual loss.","عمى ليلي، جفاف العين، جفاف القرنية (زيروفثالميا)، عدوى بتيجي بسهولة، وفي الحالات الشديدة تلف القرنية وفقدان البصر.","طفل بيتخبط في الأوضة لما النور يتطفي بالليل."],
["Sources","المصادر.",""],
["Liver.|Eggs.|Milk and dairy products.|Dark green leafy vegetables.|Orange/yellow vegetables such as carrots and sweet potatoes.","كبدة، بيض، لبن ومنتجات الألبان، خضار ورقي أخضر غامق، وخضار برتقالي أو أصفر زي الجزر والبطاطا.","كوب لبن وجزرة في اليوم، وكبدة في الأسبوع."]
]},
{t:"Iodine Deficiency",ic:"🧂",items:[
["Iodine is essential for production of thyroid hormones.","اليود ضروري عشان الغدة الدرقية تصنّع هرموناتها.","من غير يود الغدة مش عارفة تشتغل."],
["Deficiency may cause:|Goiter.|Hypothyroidism.|Impaired cognitive development.|Growth and developmental problems.","النقص ممكن يسبب: تضخم الغدة (جويتر)، قصور الغدة الدرقية، ضعف النمو العقلي، ومشاكل في النمو والتطور.","ورم في رقبة الشخص قدام (الغدة)، وطفل تطوره بطيء."],
["Prevention","الوقاية.",""],
["Use of adequately iodized salt is an important population-level strategy.","استخدام ملح فيه يود كفاية استراتيجية مهمة على مستوى المجتمع كله.","كل البيوت تستخدم ملح مُيوَّد فيتحمي كل الناس مرة واحدة."]
]},
{t:"Vitamin D Deficiency",ic:"☀️",items:[
["Vitamin D helps regulate calcium and phosphate metabolism and supports normal bone development.","فيتامين D بينظّم الكالسيوم والفوسفات في الجسم وبيساعد العضم يتكوّن صح.","من غيره العضم بياخد كالسيوم قليل فيطلع طري."],
["In children","عند الأطفال.",""],
["Severe deficiency can cause:|Rickets","النقص الشديد بيسبب الكساح (Rickets).","طفل رجليه مقوّسة وعضمه طري."],
["Manifestations may include:|Poor bone growth.|Bone deformities.|Delayed growth.|Muscle weakness.","الأعراض: نمو عضم ضعيف، تشوهات في العضم، تأخر نمو، وضعف عضلات.","طفل اتأخر في المشي ورجليه مقوّسة."],
["In adults","عند الكبار.",""],
["May contribute to:|Osteomalacia","ممكن يساهم في لين العظام (Osteomalacia).","عظام الكبير بتبقى طرية وبتوجعه."],
["Possible manifestations:|Bone pain.|Muscle weakness.|Increased risk of falls.","الأعراض: ألم عضم، ضعف عضلات، وخطر الوقوع بيزيد.","ست كبيرة بتشتكي من وجع العضم وبتقع بسهولة."],
["Sources","المصادر.",""],
["Sunlight exposure.|Fatty fish.|Egg yolk.|Fortified foods.","التعرض للشمس، السمك الدهني، صفار البيض، والأطعمة المدعّمة.","15 دقيقة شمس الصبح وسردين وبيضة."]
],img:"r",cap:"Rickets"},
{t:"Vitamin B12 Deficiency",ic:"🧬",items:[
["Vitamin B12 is important for:|Red blood cell formation.|DNA synthesis.|Normal neurological function.","B12 مهم لتكوين كرات الدم الحمرا، وتصنيع الـ DNA، ولشغل الأعصاب الطبيعي.","من غيره الدم والأعصاب الاتنين يتأثروا."],
["Manifestations","الأعراض.",""],
["Megaloblastic anemia.|Fatigue.|Pallor.|Numbness or tingling.|Balance problems.|Cognitive or neurological changes.","أنيميا ضخمة الأرومات (ميجالوبلاستيك)، إرهاق، شحوب، تنميل، مشاكل في التوازن، وتغيّرات في التفكير والأعصاب.","واحد بيشتكي من تنميل في رجليه ومش متوازن وهو ماشي."],
["Sources","المصادر.",""],
["Meat.|Fish.|Eggs.|Milk and dairy products.","لحمة، سمك، بيض، لبن ومنتجات الألبان.",""],
["People consuming no animal products may require fortified foods or supplementation based on individual assessment.","اللي مش بياكل أي منتجات حيوانية ممكن يحتاج أكل مدعّم أو مكملات حسب تقييم كل حالة.","نباتي صارم لازم يتابع مع الدكتور عشان B12 مش موجود في النباتات."]
]},
{t:"Folate Deficiency",ic:"🥬",items:[
["Folate is essential for:|DNA synthesis.|Cell division.|Red blood cell production.|Fetal development.","الفولات ضروري للـ DNA، وانقسام الخلايا، وتكوين كرات الدم الحمرا، ونمو الجنين.","الجسم بيبني خلايا جديدة طول الوقت، والفولات هو الأدوات."],
["Deficiency causes","النقص بيسبب:",""],
["Megaloblastic anemia","أنيميا ضخمة الأرومات.","نفس نوع الأنيميا بتاعة B12."],
["Pregnancy","الحمل.",""],
["Adequate folic acid intake before conception and during early pregnancy reduces the risk of neural tube defects.","أخد حمض الفوليك كفاية قبل الحمل وفي أول الحمل بيقلل خطر عيوب الأنبوب العصبي عند الجنين.","الدكتور بيكتب حمض فوليك للست اللي بتخطط تحمل."],
["Food sources","المصادر.",""],
["Green leafy vegetables.|Legumes.|Citrus fruits.|Fortified grains and cereals.","خضار ورقي أخضر، بقوليات، موالح (برتقال وليمون)، وحبوب وسيريال مدعّمة.","طبق سلطة جرجير وطبق فول أو عدس."]
]},
{t:"Vitamin C Deficiency",ic:"🍊",items:[
["Vitamin C is required for:|Collagen synthesis.|Wound healing.|Iron absorption.|Normal immune function.","فيتامين C مطلوب لتكوين الكولاجين، والتئام الجروح، وامتصاص الحديد، وشغل المناعة.","عصرة ليمون على الفول والملوخية بتساعد الجسم يمتص الحديد."],
["Severe deficiency causes:|Scurvy","النقص الشديد بيسبب الاسقربوط (Scurvy).","كان بيحصل للبحّارة زمان اللي مكانوش بياكلوا فاكهة."],
["Manifestations include:|Bleeding gums.|Easy bruising.|Poor wound healing.|Fatigue.|Joint or muscle pain.","الأعراض: نزيف اللثة، كدمات بسهولة، التئام جروح ضعيف، إرهاق، وألم مفاصل وعضلات.","حد لثته بتنزف من غير سبب وبيتكدم من خبطة بسيطة."],
["Sources","المصادر.",""],
["Oranges.|Lemons.|Guava.|Tomatoes.|Peppers.|Strawberries.","برتقال، ليمون، جوافة، طماطم، فلفل، وفراولة.","الجوافة فيها فيتامين C كتير جداً."]
]},
{t:"Zinc Deficiency",ic:"🛠️",items:[
["Zinc is important for:|Growth.|Immune function.|Wound healing.|DNA and protein synthesis.","الزنك مهم للنمو، والمناعة، والتئام الجروح، وتصنيع الـ DNA والبروتين.","زي عامل الصيانة، من غيره الجسم مش بيصلّح نفسه."],
["Manifestations","الأعراض.",""],
["Poor growth.|Impaired immunity.|Delayed wound healing.|Loss of appetite.|Hair and skin changes in severe deficiency.","نمو ضعيف، مناعة ضعيفة، التئام جروح بطيء، فقدان شهية، وتغيّر في الشعر والجلد في النقص الشديد.","طفل قصير ومش بيحب ياكل وبيتعب كتير."],
["Sources","المصادر.",""],
["Meat.|Seafood.|Eggs.|Legumes.|Nuts and seeds.","لحمة، مأكولات بحرية، بيض، بقوليات، ومكسرات وبذور.","حفنة لب أو سوداني، وبيضة، وشوية لحمة."]
]},
{t:"Prevention of Micronutrient Deficiencies",ic:"🌈",items:[
["Micronutrient deficiencies can be prevented through:","نقص الفيتامينات والمعادن ممكن نمنعه عن طريق:",""],
["Balanced diet → Food fortification → Appropriate supplementation → Infection prevention → Regular health assessment","أكل متوازن ← تدعيم الأطعمة ← مكملات مناسبة ← منع العدوى ← تقييم صحي منتظم.","زي سلم: أول درجة الأكل الكويس، وآخر درجة كشف دوري."],
["Important strategies include:","أهم الاستراتيجيات:",""],
["Breastfeeding according to recommended practices.|Appropriate complementary feeding.|Use of iodized salt.|Iron and folic acid supplementation when indicated.|Vitamin supplementation when indicated.|Dietary diversification.|Food fortification.|Prevention and treatment of infections and parasitic diseases.","رضاعة طبيعية بالطريقة الصحيحة، تغذية تكميلية مناسبة، ملح مُيوَّد، حديد وفوليك لما يلزم، فيتامينات لما يلزم، تنويع الأكل، تدعيم الأطعمة، وعلاج ومنع العدوى والطفيليات.","الطفيليات بتسرق الحديد من الجسم، فعلاجها بيحمي من الأنيميا."]
]},
{t:"General Nursing Role in Malnutrition",ic:"👩‍⚕️",items:[
["Assess: Assess nutritional status, dietary intake, appetite, weight, and BMI.","قيّم: اعرف الحالة الغذائية، والأكل، والشهية، والوزن، وBMI.","اسأل المريض كل يوم 'أكلت إيه؟' ووزّنه."],
["Identify: Identify causes and risk factors for malnutrition.","حدّد: اعرف الأسباب وعوامل الخطر.","مريض معندوش أسنان أو بيتقيأ كتير، ده سبب واضح."],
["Monitor: Monitor weight, food/fluid intake, and relevant laboratory results.","تابع: الوزن، الأكل والسوائل، ونتائج التحاليل المهمة.","اعمل جدول في الملف وسجّل فيه."],
["Provide nutrition: Encourage adequate calories, protein, vitamins, minerals, and fluids.","وفّر التغذية: شجّع على سعرات وبروتين وفيتامينات ومعادن وسوائل كفاية.","قدّم وجبات صغيرة كتير لو المريض شهيته ضعيفة."],
["Assist feeding: Help patients with eating and address chewing or swallowing difficulties.","ساعد في الأكل: ساعد المريض ياكل وتعامل مع صعوبة المضغ أو البلع.","مريض جلطة مش قادر يمسك الملعقة، الممرضة هي اللي بتساعده."],
["Educate: Teach patients and families about a balanced and nutritious diet.","ثقّف: علّم المريض وأهله الأكل المتوازن والمفيد.","اشرحلهم إن طبق فيه خضار وبروتين وحبوب أحسن."],
["Prevent complications: Monitor for infection, weakness, pressure injuries, and delayed wound healing.","امنع المضاعفات: راقب العدوى، الضعف، قرح الفراش، وبطء التئام الجروح.","غيّر وضعية المريض كل ساعتين عشان ميحصلش قرح فراش."],
["Administer supplements: Give prescribed nutritional supplements and monitor their effects.","اعطي المكملات: اعطي المكملات الغذائية اللي الدكتور كتبها وتابع تأثيرها.","اعطي المريض الحديد في ميعاده وراقب لو في مشاكل زي الإمساك."],
["Collaborate: Work with physicians and dietitians to develop an individualized nutrition plan.","تعاون: اشتغل مع الأطباء وأخصائي التغذية عشان تعملوا خطة غذائية تناسب كل مريض.","اتكلم مع أخصائي التغذية لو المريض سكري وعنده نقص تغذية في نفس الوقت."],
["Evaluate: Follow up and evaluate the patient's nutritional improvement.","قيّم: تابع وشوف الحالة الغذائية اتحسنت ولا لأ.","شوف الوزن بعد أسبوع: زاد ولا لأ؟"]
]}

D.forEach((s,n)=>{

 chips.insertAdjacentHTML('beforeend',`<a href="#${id}">${s.t}</a>`);
