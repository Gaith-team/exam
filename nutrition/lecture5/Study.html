 ["Wash hands thoroughly with soap and water before preparing or serving food.","يغسل إيديه كويس بالمية والصابون قبل ما يحضّر أو يقدّم الأكل.","قبل ما تبدأ تعمل الغدا، افتح الحنفية واغسل إيدك بالصابون كويس."],
 ["Wash hands after using the toilet and after handling raw foods.","يغسل إيديه بعد استخدام الحمام وبعد التعامل مع الأكل النيء.","خرجت من الحمام أو مسكت لحمة نيّة، اغسل إيدك قبل ما تمسك أي حاجة."],
 ["Keep fingernails clean.","يحافظ على نضافة الضوافر.","الضوافر الطويلة المتسخة بتخبّي ميكروبات تحتها."],
 ["Cover cuts or wounds appropriately.","يغطي الجروح بشكل مناسب.","لو في جرح في صباعك، حط عليه بلاستر وجوانتي قبل ما تمسك الأكل."],
 ["Avoid handling food when experiencing symptoms such as vomiting or diarrhea.","يتجنب التعامل مع الأكل لما يكون عنده أعراض زي الترجيع أو الإسهال.","لو عندك إسهال النهارده، متطبخش للناس لحد ما تخف."],
 ["Keep hair and clothing clean and appropriately controlled during food preparation.","يحافظ على نضافة الشعر والهدوم ويتحكم فيهم وقت تحضير الأكل.","اربط شعرك أو البس غطا ولبس نضيف وانت بتطبخ."],
 ["Avoid unnecessary touching of ready-to-eat foods with bare hands.","يتجنب لمس الأكل الجاهز للأكل بإيد عريانة من غير داعي.","بدل ما تمسك السلطة بإيدك، استخدم ملقاط أو معلقة."],
 ["Hand hygiene is particularly important because microorganisms can easily be transferred from hands to food, utensils, and surfaces.",
  "نظافة الإيدين مهمة جدًا لأن الميكروبات بتنتقل بسهولة من الإيد للأكل والأدوات والأسطح.",
  "إيد واحدة مغسلتهاش ممكن تلوث الأكل والسكينة وسطح الرخامة في نفس الوقت."],
 {s:"Cleaning Food-Contact Surfaces"},
 ["Cutting boards, knives, utensils, countertops, and other food-contact surfaces should be properly cleaned to reduce the risk of transferring microorganisms between foods.",
  "ألواح التقطيع والسكاكين والأدوات وأسطح المطبخ وأي سطح بيلمس الأكل لازم تتنضّف كويس عشان نقلل خطر نقل الميكروبات من أكل لأكل.",
  "بعد ما تقطع لحمة نيّة، اغسل الخشبة والسكينة والرخامة قبل ما تقطع عليهم أي حاجة تانية."]
]},
{ h:"5. WHO Five Keys to Safer Food", items:[
 ["The WHO Five Keys to Safer food provide a simple framework for preventing foodborne disease.",
  "المفاتيح الخمسة لمنظمة الصحة العالمية للأكل الآمن بتدّي إطار بسيط لمنع الأمراض المنقولة بالغذاء.",
  "هي زي خمس قواعد سهلة تفتكرها في المطبخ وتحمي بيها نفسك وأهلك."],
 {l:["The five keys are:","المفاتيح الخمسة هي:"]},
 ["1. Keep clean.","١. حافظ على النضافة.","اغسل إيدك ونضّف مطبخك."],
 ["2. Separate raw and cooked.","٢. افصل النيء عن المطبوخ.","الفراخ النيّة في ناحية والمطبوخ في ناحية."],
 ["3. Cook thoroughly.","٣. اطبخ كويس.","الأكل لازم يستوي من جوه مش بس من برا."],
 ["4. Keep food at safe temperatures.","٤. حافظ على الأكل في درجات حرارة آمنة.","الأكل السخن يفضل سخن والبارد يفضل بارد."],
 ["5. Use safe water and raw materials.","٥. استخدم مياه ومواد خام آمنة.","استخدم مية شرب نضيفة وخضار وفراخ طازة."],
 {s:"Key 1: Keep Clean"},
 ["Good cleanliness reduces the transfer of microorganisms to food.","النضافة الكويسة بتقلل انتقال الميكروبات للأكل.","مطبخ نضيف وإيد نضيفة معناهم ميكروبات أقل في أكلك."],
 {l:["Important practices include:","من الممارسات المهمة:"]},
 ["Wash hands before and during food preparation and before eating.","نغسل إيدينا قبل وأثناء تحضير الأكل وقبل ما ناكل.","اغسل إيدك قبل ما تبدأ، وبين الخطوات، وقبل ما تقعد تاكل."],
 ["Clean food-preparation surfaces and utensils.","ننضّف أسطح التحضير والأدوات.","امسح الرخامة وغسّل المعالق والسكاكين بعد كل استخدام."],
 ["Keep the kitchen and food-preparation area clean.","نخلي المطبخ ومكان تحضير الأكل نضيف.","وقّع الزبالة وامسح الأرض والرخامة بشكل مستمر."],
 ["Protect food from insects and pests.","نحمي الأكل من الحشرات والآفات.","غطي الأكل بغطا عشان الدبان والصراصير ميقربوش منه."],
 {s:"Key 2: Separate Raw and Cooked"},
 ["Raw foods, particularly raw meat, poultry, seafood, and eggs, may contain microorganisms that can contaminate ready-to-eat foods.",
  "الأكل النيء، خصوصًا اللحمة والفراخ والمأكولات البحرية والبيض، ممكن يكون فيه ميكروبات تلوّث الأكل الجاهز للأكل.",
  "الفراخ النيّة لو لمست الفاكهة اللي هتتاكل زي ما هي، ممكن تنقل لها الميكروب."],
 {l:["Therefore:","عشان كده:"]},
 ["Keep raw and cooked foods separate.","نخلي الأكل النيء والمطبوخ منفصلين.","طبق للنيء وطبق للمطبوخ، ومحدش يتخلط."],
 ["Use separate utensils or clean them properly between uses.","نستخدم أدوات منفصلة أو ننضّفها كويس بين كل استخدام.","سكينة للنيء وسكينة للمطبوخ، أو اغسل نفس السكينة قبل ما تستخدمها تاني."],
 ["Store raw foods separately from ready-to-eat foods.","نخزّن الأكل النيء بعيد عن الأكل الجاهز للأكل.","في التلاجة، حط النيء في رف تحت والجاهز في رف فوق."],
 ["Prevent raw-food juices from contacting other foods.","نمنع عصارة الأكل النيء إنها تلمس أي أكل تاني.","غطي طبق اللحمة النيّة عشان السايل ميوقعش على الخضار."],
 {s:"Key 3: Cook Thoroughly"},
 ["Adequate cooking helps destroy many harmful microorganisms that may be present in food.","الطبخ الكافي بيساعد في القضاء على ميكروبات كتير ضارة ممكن تكون في الأكل.","لما الفراخ تتطبخ كويس، الميكروبات اللي كانت فيها بتموت."],
 {l:["Special attention should be given to foods such as:","لازم نركز بشكل خاص على أكل زي:"]},
 ["Meat and poultry.","اللحمة والفراخ.","اتأكد إن لون الفراخ من جوه مش وردي."],
 ["Fish and seafood.","السمك والمأكولات البحرية.","السمك لازم يستوي كويس مش يتاكل نص استواء."],
 ["Eggs.","البيض.","البيض المسلوق أو المقلي كويس أحسن من النيء."],
 ["Other foods that may contain harmful microorganisms when raw or undercooked.","أي أكل تاني ممكن يكون فيه ميكروبات ضارة وهو نيء أو مش مستوي كفاية.","أي أكل نيّ أو نص استواء ممكن يكون خطر، فاستوّيه كويس."],
 ["Cooking should be sufficient to ensure that the food is safe for consumption.","الطبخ لازم يكون كفاية عشان نضمن إن الأكل آمن للأكل.","متشيلش الأكل من على النار بدري، سيبه لحد ما يستوي صح."],
 ["WHO emphasizes thorough cooking as an important measure for preventing foodborne disease.","منظمة الصحة العالمية بتأكد إن الطبخ الكويس إجراء مهم لمنع الأمراض المنقولة بالغذاء.","الطبخ الكويس هو من أهم الحاجات اللي بتحمينا من التسمم."],
 {s:"Key 4: Keep Food at Safe Temperatures"},
 ["Improper temperature control can allow microorganisms to multiply in food.","التحكم الغلط في درجة الحرارة ممكن يخلي الميكروبات تتكاثر في الأكل.","الأكل لو اتساب في الجو الدافي، الميكروبات فيه بتزيد بسرعة."],
 {l:["Therefore:","عشان كده:"]},
 ["Refrigerate perishable foods promptly.","نحط الأكل اللي بيبوظ بسرعة في التلاجة فورًا.","اللبن واللحمة المطبوخة حطهم في التلاجة بعد ما تخلص."],
 ["Avoid leaving perishable foods at room temperature for prolonged periods.","نتجنب ترك الأكل اللي بيبوظ بسرعة في حرارة الغرفة لفترات طويلة.","متسيبش الفراخ المطبوخة على الترابيزة ساعات."],
 ["Keep hot foods appropriately hot and cold foods appropriately cold.","نخلي الأكل السخن سخن بما يناسب والبارد بارد بما يناسب.","الشوربة تفضل سخنة والعصير يفضل في التلاجة."],
 ["Follow safe storage instructions for perishable foods.","نتّبع تعليمات التخزين الآمن للأكل اللي بيبوظ بسرعة.","اقرأ على علبة اللبن مكتوب تتخزن إزاي واعمل بيه."],
 ["Temperature control is an important component of food-safety systems and is also addressed in food-service standards such as the FDA Food Code.",
  "التحكم في درجة الحرارة جزء مهم من أنظمة سلامة الغذاء، وكمان بتتناوله معايير خدمات الطعام زي FDA Food Code.",
  "المطاعم والمستشفيات عندها قواعد رسمية لدرجات حرارة تخزين الأكل، والـ FDA Food Code من المراجع اللي بتتكلم عن ده."],
 {s:"Key 5: Use Safe Water and Raw Materials"},
 ["Food should be prepared using water and raw materials that are safe and suitable for consumption.","الأكل لازم يتحضّر بمية ومواد خام آمنة ومناسبة للاستهلاك.","متعملش شوربة بمية مش نضيفة ولا تستخدم خضار باظت."],
 {l:["Important practices include:","من الممارسات المهمة:"]},
 ["Use safe drinking water.","نستخدم مية شرب آمنة.","استخدم مية الشرب النضيفة في الطبخ وغسيل الأكل."],
 ["Choose fresh and wholesome raw materials.","نختار مواد خام طازة وسليمة.","اشتري خضار طازة مش دابلة أو عفنة."],
 ["Wash fruits and vegetables appropriately before consumption.","نغسل الفاكهة والخضار كويس قبل أكلها.","اغسل الخيار والفراولة بمية جارية قبل ما تاكلهم."],
 ["Use pasteurized milk and dairy products when appropriate.","نستخدم اللبن ومنتجات الألبان المبسترة لما يكون مناسب.","اختار لبن مكتوب عليه مبستر مش لبن سايب."],
 ["Check food packaging and storage conditions before purchase and use.","نفحص تغليف الأكل وظروف تخزينه قبل الشراء والاستخدام.","علبة منفوخة أو متبعجة أو متخزنة في الشمس، متشتريهاش."]
]},
{ h:"6. Safe Handling of High-Risk Foods", items:[
 ["Some foods require particular attention because they can support the growth or transmission of harmful microorganisms.",
  "فيه أكل محتاج انتباه خاص لأنه ممكن يساعد على نمو الميكروبات الضارة أو انتقالها.",
  "اللبن والفراخ والسمك والبيض أكتر حاجات بتحتاج حرص."],
 {s:"A. Milk and Dairy Products"},
 ["Milk and dairy products can become contaminated if they are not produced, processed, stored, or handled safely.","اللبن ومنتجات الألبان ممكن تتلوث لو متتنتجش أو متتصنعش أو متتخزنش أو متتعاملش معاها بشكل آمن.","جبنة اتخزنت في مكان دافي ممكن تتلوث."],
 {l:["Important practices include:","من الممارسات المهمة:"]},
 ["Prefer pasteurized milk and dairy products.","نفضّل اللبن ومنتجات الألبان المبسترة.","اشتري اللبن المبستر في علبة مقفولة."],
 ["Maintain appropriate refrigeration.","نحافظ على التبريد المناسب.","خلّي اللبن في التلاجة طول الوقت."],
 ["Avoid consuming products that have been improperly stored.","نتجنب أكل المنتجات اللي اتخزنت غلط.","علبة زبادي اتساب برا من يوم، ارميها."],
 ["Follow the storage instructions on packaged products.","نتّبع تعليمات التخزين المكتوبة على المنتجات المغلفة.","لو مكتوب على العلبة احفظ في الثلاجة، سمعها."],
 ["Pasteurization reduces harmful microorganisms that may be present in milk.","البسترة بتقلل الميكروبات الضارة اللي ممكن تكون في اللبن.","اللبن المبستر اتسخّن بدرجة معينة فالميكروبات اللي فيه قلّت."],
 {s:"B. Meat and Poultry"},
 ["Raw meat and poultry may contain harmful microorganisms.","اللحمة والفراخ النيّة ممكن يكون فيهم ميكروبات ضارة.","فراخ طازة من الجزار ممكن برضو يكون فيها ميكروب."],
 {l:["Safe practices include:","الممارسات الآمنة تشمل:"]},
 ["Keep raw meat and poultry separate from ready-to-eat foods.","نبعد اللحمة والفراخ النيّة عن الأكل الجاهز للأكل.","متحطش الفراخ النيّة جنب الخيار والخس."],
 ["Use clean utensils and surfaces.","نستخدم أدوات وأسطح نضيفة.","اغسل الخشبة والسكينة قبل وبعد التقطيع."],
 ["Store raw products appropriately.","نخزّن المنتجات النيّة بشكل مناسب.","حط اللحمة في كيس مقفول في التلاجة."],
 ["Cook meat and poultry thoroughly.","نطبخ اللحمة والفراخ كويس.","سيب الفراخ في الفرن لحد ما تستوي لآخرها."],
 ["Wash hands after handling raw meat or poultry.","نغسل إيدينا بعد ما نتعامل مع اللحمة أو الفراخ النيّة.","بعد ما تنضّف الفراخ، اغسل إيدك بالصابون على طول."],
 ["Raw meat juices should not be allowed to contact foods that will be eaten without further cooking.","عصارة اللحمة النيّة ميصحش تلمس أكل هيتاكل من غير طبخ تاني.","سايل اللحمة النيّة لو نزل على الفاكهة أو السلطة، الأكل ده يتخلص منه."],
 {s:"C. Fish and Seafood"},
 ["Fish and seafood may carry microorganisms or parasites, particularly when eaten raw or undercooked.","السمك والمأكولات البحرية ممكن تحمل ميكروبات أو طفيليات، خصوصًا لو اتاكلت نيّة أو مش مستوية.","السوشي أو الجمبري النيّ فيه خطر أكبر من المطبوخ."],
 {l:["Safe practices include:","الممارسات الآمنة تشمل:"]},
 ["Purchase seafood from reliable sources.","نشتري المأكولات البحرية من مصادر موثوقة.","اشتري من محل معروف بنضافته."],
 ["Keep seafood appropriately refrigerated.","نحافظ على تبريد المأكولات البحرية بشكل مناسب.","حط السمك في التلاجة أو الفريزر على طول بعد الشراء."],
 ["Prevent contact between raw seafood and ready-to-eat foods.","نمنع الاحتكاك بين المأكولات البحرية النيّة والأكل الجاهز للأكل.","متحطش السمك النيّ جنب السلطة."],
 ["Cook seafood adequately.","نطبخ المأكولات البحرية كفاية.","الجمبري يستوي كويس قبل ما تاكله."],
 ["Take extra care when serving seafood to vulnerable individuals.","ناخد حرص زيادة لما نقدّم المأكولات البحرية للفئات الأضعف.","لو بتقدّم سمك لطفل أو حامل، اتأكد إنه مستوي تمامًا."],
 {s:"D. Eggs"},
 ["Raw or undercooked eggs may carry harmful microorganisms.","البيض النيّ أو الغير مستوي كفاية ممكن يحمل ميكروبات ضارة.","بيضة نص سوا أو نيّة ممكن تسبب تسمم."],
 {l:["Safe practices include:","الممارسات الآمنة تشمل:"]},
 ["Keep eggs appropriately refrigerated.","نحافظ على تبريد البيض بشكل مناسب.","حط البيض في التلاجة مش على الرخامة."],
 ["Avoid contamination of ready-to-eat foods with raw eggs.","نتجنب تلويث الأكل الجاهز للأكل بالبيض النيّ.","بعد ما تكسر البيض، متمسحش إيدك في أكل جاهز قبل ما تغسلها."],
 ["Cook eggs and egg-containing dishes adequately.","نطبخ البيض والأطباق اللي فيها بيض كفاية.","الأومليت والكيك اللي فيهم بيض لازم يستووا كويس."],
 ["Raw or undercooked eggs are recognized as higher-risk food choices for foodborne illness.","البيض النيّ أو الغير مستوي كفاية معروف إنه من الاختيارات الأعلى خطورة للمرض المنقول بالغذاء.","بيضة نيّة في مايونيز متعمل في البيت أخطر من بيضة مسلوقة كويس."]
]}
];

const box = document.getElementById('content'), toc = document.getElementById('toc');
DATA.forEach((sec, si) => {
  const id = 'sec' + (si + 1);
  toc.insertAdjacentHTML('beforeend', `<a href="#${id}">${sec.h.split('.')[0]}. ${sec.h.replace(/^\d+\.\s*/, '').split(' ').slice(0,3).join(' ')}</a>`);
  let body = '';
  sec.items.forEach(it => {
    if (it.s) body += `<div class="sub">${it.s}</div>`;
    else if (it.l) body += `<div class="lead"><div class="en">${it.l[0]}</div><div class="ar">${it.l[1]}</div></div>`;
    else body += `<div class="item"><div class="en">${it[0]}</div><div class="ar">${it[1]}</div><div class="ex"><b>عشان تفهمها:</b> ${it[2]}</div></div>`;
  });
  box.insertAdjacentHTML('beforeend', `<section class="sec" id="${id}"><div class="sec-head">${sec.h}</div><div class="sec-body">${body}</div></section>`);
});
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
});
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch(e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch(e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
</body>
</html>
