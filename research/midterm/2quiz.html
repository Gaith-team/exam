<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nursing Research - Two Exams | GHAITH TEAM</title>
<style>
:root{--bg:#0e1230;--card:#192049;--tx:#eef1ff;--mu:#aab2dd;--p:#8b6cff;--t:#19d3c5;--k:#ff7ab8;--y:#ffc857;--g:#3ddc97;--r:#ff5d73}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:radial-gradient(circle at 15% 0,#2a2170,transparent 45%),radial-gradient(circle at 90% 100%,#0b6b6b,transparent 45%),var(--bg);background-attachment:fixed;color:var(--tx);line-height:1.6;padding:16px}
.w{max-width:860px;margin:auto}
h1{text-align:center;font-size:clamp(1.5rem,5vw,2.3rem);background:linear-gradient(90deg,var(--t),var(--p),var(--k),var(--y));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
.sub{text-align:center;color:var(--mu);margin-bottom:12px}
.tabs{display:flex;gap:10px;justify-content:center;margin:10px 0}
.tabs button,.btn{font:inherit;font-weight:700;color:var(--tx);background:var(--card);border:2px solid transparent;border-radius:14px;padding:9px 22px;cursor:pointer;transition:.25s}
.tabs button:hover,.btn:hover{transform:translateY(-3px)}
.tabs button.on{border-color:var(--t);background:#19d3c522}
.bar{height:8px;background:#ffffff18;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t),var(--p),var(--k));transition:width .5s}
.st{display:flex;justify-content:space-between;color:var(--mu);font-size:.92rem;margin-bottom:8px}
h2{margin:22px 0 10px;padding:6px 14px;border-radius:12px;display:inline-block;font-size:1.1rem}
.h1{background:#8b6cff33;color:#b9a6ff}.h2{background:#ffc85733;color:var(--y)}
.q{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;border-left:5px solid var(--p);animation:up .4s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.q p{font-weight:700;margin-bottom:6px}
.o{display:block;width:100%;text-align:left;font:inherit;color:var(--tx);background:#ffffff10;border:2px solid transparent;border-radius:12px;padding:7px 12px;margin:6px 0;cursor:pointer;transition:.2s}
.o:hover:not(:disabled){border-color:var(--p);transform:translateX(4px)}
.o:focus-visible,.btn:focus-visible,.tabs button:focus-visible{outline:3px solid var(--y)}
.o.ok{background:#3ddc9733;border-color:var(--g);animation:pop .4s}
.o.no{background:#ff5d7333;border-color:var(--r);animation:sk .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.res{display:none;text-align:center;background:var(--card);border-radius:18px;padding:20px;margin-top:20px;border:2px solid var(--y)}
.res b{font-size:2rem;color:var(--y);display:block}
.res .btn{margin:8px 6px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="w">
<h1>🩺 Nursing Research</h1>
<p class="sub">GHAITH TEAM </p>
<div class="tabs"><button id="t0" onclick="load(0)">Exam 1</button><button id="t1" onclick="load(1)">Exam 2</button></div>
<div class="bar"><i id="pb"></i></div>
<div class="st"><span id="an">Answered: 0/50</span><span id="sc">Score: 0</span></div>
<div id="box"></div>
<div class="res" id="res"><b id="rs"></b><p id="rm"></p><button class="btn" onclick="retry()">🔁 Retry wrong answers</button><button class="btn" onclick="load(cur)">↺ Restart exam</button></div>
</div>
<script>
const EXAMS=[
{m:[
{t:"Individuals who provide information directly to the researcher are called:",o:["Variables","Settings","Subjects (respondents)","Samples"],a:2},
{t:"The entire group of persons or objects of interest to the investigator is the:",o:["Sample","Population","Setting","Variable"],a:1},
{t:"Which type of research is a formal, objective, systematic process that uses numerical data?",o:["Qualitative","Historical","Quantitative","Ethnographic"],a:2},
{t:"The research question is the final step prior to beginning the:",o:["Data analysis","Hypothesis testing","Literature review","Research design"],a:3},
{t:"A characteristic of a person or object that can take on different values is a:",o:["Variable","Constant","Setting","Population"],a:0},
{t:"In PICO, the letter 'C' stands for:",o:["Concept","Control","Comparison","Condition"],a:2},
{t:"The blueprint of a research project is called the:",o:["Hypothesis","Sample","Setting","Research design"],a:3},
{t:"Which study is also called a prevalence study?",o:["Cross-sectional","Cohort","Case-control","Case report"],a:0},
{t:"'Setting' in research means:",o:["The people who provide information","Specific places where data collection will occur","The entire group of interest","The outcome variable"],a:1},
{t:"Which is NOT a type of quantitative research?",o:["Descriptive","Correlational","Phenomenological","Experimental"],a:2},
{t:"In selecting a research problem, interest is:",o:["The least important factor","Not required","The most important criterion","Only for students"],a:2},
{t:"The last letter 'R' in the acronym RESEARCHER (good researcher) stands for:",o:["Religious","Reliable","Resourceful","Realistic"],a:0},
{t:"Incidence refers to:",o:["All existing cases at one point in time","The number of new cases within a specific period of time","Deaths only","A snapshot of the population"],a:1},
{t:"Internal validity refers to whether:",o:["Results can be generalized to a larger population","The sample is large enough","The tool produces consistent results","The independent variable truly made the difference rather than extraneous factors"],a:3},
{t:"Which research type examines human experiences through descriptions by the people involved (lived experiences)?",o:["Grounded theory","Phenomenological","Ethnographic","Historical"],a:1},
{t:"A hypothesis predicting NO relationship between the independent and dependent variables is:",o:["Simple","Null","Complex","Causal"],a:1},
{t:"'Teacher-student relationship influences student's learning' is an example of a:",o:["Non-directional hypothesis","Directional hypothesis","Null hypothesis","Complex hypothesis"],a:0},
{t:"Which research design element answers 'who'?",o:["Setting","Time","Subjects","Variables"],a:2},
{t:"Reliability is:",o:["Whether a tool measures what it is intended to measure","The degree to which a tool produces stable and consistent results","Freedom from personal prejudice","Generalizing to a larger group"],a:1},
{t:"Which design is retrospective?",o:["Cohort","Cross-sectional","True experimental","Case-control"],a:3},
{t:"Which is a factor to consider in selecting a research problem?",o:["Feasibility","Popularity","Age of the researcher","Number of pages"],a:0},
{t:"In the research process, the step right after 'Developing the hypothesis' is:",o:["Determining sample design","Collecting the data","Analysis of data","Preparing the research design"],a:3},
{t:"Which research question type seeks to quantify the relationship between variables?",o:["Descriptive","Relationship","Cause-effect","Exploratory"],a:1},
{t:"The number of children in a family (0, 1, 2, 3) is a:",o:["Continuous variable","Discrete variable","Categorical variable","Null variable"],a:1},
{t:"Research is NOT problem solving because research:",o:["Uses current knowledge only","Needs no questions","Deals with opinions","Discovers or generates new knowledge"],a:3},
{t:"Which is a disadvantage of case-control studies?",o:["Needs years of follow-up","Not suitable for rare diseases","Takes a very long time","Relies on memory, causing data-quality problems"],a:3},
{t:"Quasi-experimental differs from true experimental because it:",o:["Has random assignment","Always has a control group","Lacks randomization, so there is less control","Has maximum control"],a:2},
{t:"In the experimental design steps, the independent variable is introduced to:",o:["The experimental group only","Both groups","The control group only","The whole population"],a:0},
{t:"A group of subjects followed prospectively over time to describe incidence is a:",o:["Cohort study","Case-control study","Cross-sectional study","Case series"],a:0},
{t:"Which statement about cross-sectional studies is correct?",o:["They give the incidence rate","They are ideal for rare diseases","They give prevalence, not incidence","They easily establish causality"],a:2},
{t:"In the listed research process, 'Hypothesis testing' comes directly after:",o:["Analysis of data","Execution of the project","Generalizations and interpretation","Collecting the data"],a:0},
{t:"Which is an element of a good research question?",o:["Broad and general","Impossible to measure","Based on opinion only","Meaningful whether the answer is yes or no"],a:3},
{t:"A good hypothesis must identify at least:",o:["Two variables","One variable","Three variables","Four variables"],a:0},
{t:"Ethnographic research involves:",o:["Developing a theory grounded in data","Examining past events through documents","Collecting and analyzing data about cultural groups","Describing individual lived experiences"],a:2},
{t:"Which is NOT a characteristic of a good research design?",o:["Subjectivity","Reliability","Validity","Generalization"],a:0}],
f:[
{t:"A sample is a subset of the population selected by the investigator.",o:["True","False"],a:0},
{t:"The dependent variable is the one believed to cause or influence the independent variable.",o:["True","False"],a:1},
{t:"Research is a cyclical process: it starts with a problem and ends with a problem.",o:["True","False"],a:0},
{t:"Qualitative research uses numerical data to obtain information about the world.",o:["True","False"],a:1},
{t:"Ethnographic research involves the collection and analysis of data about cultural groups.",o:["True","False"],a:0},
{t:"The nursing process is a subset of the problem-solving process.",o:["True","False"],a:0},
{t:"Research and problem solving are the same because both generate new knowledge.",o:["True","False"],a:1},
{t:"Feasibility is the most important criterion in selecting a research problem.",o:["True","False"],a:1},
{t:"A discrete variable can take any value, such as 2.565.",o:["True","False"],a:1},
{t:"The null hypothesis predicts no relationship between the independent and dependent variables.",o:["True","False"],a:0},
{t:"The research design is similar to the blueprint of an architect's work.",o:["True","False"],a:0},
{t:"Validity means the degree to which a tool produces stable and consistent results.",o:["True","False"],a:1},
{t:"Quasi-experimental designs involve random assignment of participants.",o:["True","False"],a:1},
{t:"Case-control studies are good for studying rare diseases.",o:["True","False"],a:0},
{t:"Cross-sectional studies give the incidence rate of a disease.",o:["True","False"],a:1}]},
{m:[
{t:"The purpose of the study, describing why it has been done, is the:",o:["Feasibility","Aim of study","Setting","Literature review"],a:1},
{t:"An account of what has been published on a topic by accredited scholars and researchers is the:",o:["Hypothesis","Sample","Research design","Literature review"],a:3},
{t:"Which is a type of qualitative research?",o:["Correlational","Descriptive","Historical","Experimental"],a:2},
{t:"A systematic, subjective approach used to describe life experiences and give them meaning is:",o:["Quantitative research","Qualitative research","Outcomes research","Experimental research"],a:1},
{t:"In PICO, the letter 'P' stands for:",o:["Problem","Process","Population","Purpose"],a:2},
{t:"Sex (male/female) and marital status are examples of a ___ variable.",o:["Continuous","Discrete","Categorical","Dependent"],a:2},
{t:"A detailed report of a single patient is a:",o:["Case report","Case series","Cohort study","Cross-sectional study"],a:0},
{t:"Which research design element answers 'where'?",o:["Subjects","Setting","Time","Variables"],a:1},
{t:"A good research problem should:",o:["Be over-researched","Be finishable within the allotted time","Carry legal impediments","Ignore costs and risks"],a:1},
{t:"Which is a role of nurses in research?",o:["Hospital owner","Insurance agent","Legislator only","Patient/client advocate during studies"],a:3},
{t:"Which quantitative type describes situations as they exist, e.g., the spread of flu cases each season?",o:["Experimental","Quasi-experimental","Descriptive","Correlational"],a:2},
{t:"The true experimental design uses:",o:["Only observation","Only documents","Case reports","Randomization and manipulation"],a:3},
{t:"External validity refers to:",o:["Whether the independent variable made the difference","The extent results can be generalized to a larger population","Consistency of results","Ease of completing the study"],a:1},
{t:"The outcome variable is also called the:",o:["Independent variable","Categorical variable","Discrete variable","Dependent variable"],a:3},
{t:"Which qualitative type develops a theory grounded in the data?",o:["Phenomenological","Ethnographic","Grounded theory","Historical"],a:2},
{t:"The first step in developing a research question is to:",o:["Choose an interesting subject and topic","Evaluate your question","Consider research outcomes","Start asking questions"],a:0},
{t:"A complex hypothesis predicts a relationship between:",o:["Two variables only","Two or more independent and dependent variables","No variables","Only dependent variables"],a:1},
{t:"Which is a continuous variable?",o:["Number of children","Marital status","Temperature","Sex"],a:2},
{t:"Which is NOT a purpose of research design?",o:["Help answer the research question","Eliminate bias and reduce errors","Help in planning and implementation","Prove the hypothesis is always true"],a:3},
{t:"In quasi-experimental research, a control group is:",o:["Always present","Never present","May or may not be present","Randomly chosen"],a:2},
{t:"Which study is good for rare diseases and needs less time?",o:["Case-control","Cohort","Cross-sectional","True experimental"],a:0},
{t:"Which is an example of a directional hypothesis?",o:["Teacher-student relationship influences student's learning","High quality of nursing education leads to high quality of practice skills","There is no relationship between smoking and lung cancer","Smoking and cancer are variables"],a:1},
{t:"Which is a source of research problems?",o:["Horoscopes","Rumors","Advertisements","Funding agencies"],a:3},
{t:"In the listed research process, the step right after 'Collecting the data' is:",o:["Execution of the project","Analysis of data","Hypothesis testing","Preparing the report"],a:0},
{t:"Which is an advantage of cohort studies?",o:["Good for rare diseases","Short duration and inexpensive","Defines the incidence rate","Relies on memory"],a:2},
{t:"Which design is considered weaker because of threats to internal validity?",o:["True experimental","Both equally","Neither","Quasi-experimental"],a:3},
{t:"In the text, 'modification' in the nursing process comes after:",o:["Plan","Implementation","Evaluation","Diagnosis"],a:2},
{t:"An advantage of case reports is that they are:",o:["Easy and inexpensive","Always unbiased","Easy to generalize","Proof of causation"],a:0},
{t:"A disadvantage of cross-sectional studies is that they:",o:["Are very slow","Make it difficult to establish a causal relationship","Are very expensive","Cannot use large populations"],a:1},
{t:"'Variables observed at one point in time or over time' describes the design element:",o:["Time","Setting","Subjects","Role of the investigator"],a:0},
{t:"Research is best defined as:",o:["Using current knowledge to fix a problem","Collecting opinions","Writing reports","A systematic process of answering questions by generating new knowledge"],a:3},
{t:"Which characteristic belongs to a good hypothesis?",o:["Justifiable (based on rationale or theory)","Vague","Untestable","Single variable only"],a:0},
{t:"In the experimental design steps, the sample is selected from the population by:",o:["Convenience sampling","Quota sampling","Simple random sampling","Self-selection"],a:2},
{t:"Outcomes research:",o:["Describes cultural patterns","Examines past documents","Develops a theory from data","Examines results of care and changes in patient health status"],a:3},
{t:"Which design relies on memory, with people who have the condition more motivated to recall risk factors?",o:["Cohort","Case-control","Cross-sectional","Experimental"],a:1}],
f:[
{t:"Body temperature, age, and heart rate are examples of variables.",o:["True","False"],a:0},
{t:"External validity refers to whether the independent variable actually made the difference.",o:["True","False"],a:1},
{t:"Correlational research examines the strength of relationships between variables.",o:["True","False"],a:0},
{t:"The text lists four common types of qualitative research.",o:["True","False"],a:1},
{t:"Research uses current knowledge, while problem solving generates new knowledge.",o:["True","False"],a:1},
{t:"A research question can guide both quantitative and qualitative studies.",o:["True","False"],a:0},
{t:"Ethical issues should be considered when formulating the research problem.",o:["True","False"],a:0},
{t:"A simple hypothesis reflects a relationship between two variables.",o:["True","False"],a:0},
{t:"Continuous variables can only take full values.",o:["True","False"],a:1},
{t:"A good hypothesis should be testable.",o:["True","False"],a:0},
{t:"In every study the investigator imposes control on all variables.",o:["True","False"],a:1},
{t:"Generalization means data collected from a sample can be utilized for a larger group.",o:["True","False"],a:0},
{t:"Quasi-experimental designs maintain maximum and rigorous control over subjects.",o:["True","False"],a:1},
{t:"Cohort studies are suitable for studying rare diseases.",o:["True","False"],a:1},
{t:"Case-control studies are also known as prospective studies.",o:["True","False"],a:1}]}
];
let cur=0,qs=[],ans=0,ok=0,wrong=[];
const $=i=>document.getElementById(i);
function load(n,list){cur=n;ans=0;ok=0;wrong=[];
const E=EXAMS[n];qs=list||[...E.m.map(q=>({...q,s:1})),...E.f.map(q=>({...q,s:2}))];
$("t0").className=n==0?"on":"";$("t1").className=n==1?"on":"";$("res").style.display="none";
let h="",last=0;qs.forEach((q,i)=>{if(q.s!=last){last=q.s;h+=`<h2 class="h${q.s}">${q.s==1?"Multiple Choice":"True / False"}</h2>`}
h+=`<div class="q"><p>${i+1}. ${q.t}</p>`+q.o.map((o,j)=>`<button class="o" onclick="pick(${i},${j},this)">${o}</button>`).join("")+`</div>`});
$("box").innerHTML=h;upd();scrollTo({top:0})}
function pick(i,j,b){const q=qs[i],os=b.parentNode.querySelectorAll(".o");
os.forEach((o,k)=>{o.disabled=true;if(k==q.a)o.classList.add("ok")});
if(j==q.a)ok++;else{b.classList.add("no");wrong.push(q)}ans++;upd();if(ans==qs.length)fin()}
function upd(){$("an").textContent=`Answered: ${ans}/${qs.length}`;$("sc").textContent=`Score: ${ok}`;$("pb").style.width=ans/qs.length*100+"%"}
function fin(){const r=$("res");r.style.display="block";$("rs").textContent=`${ok} / ${qs.length}`;
const p=ok/qs.length;$("rm").textContent=p>=.9?"Excellent! 🏆":p>=.75?"Very good 👏":p>=.6?"Good, review the missed ones 📘":"Review the material and try again 💪";
r.scrollIntoView({behavior:"smooth"})}
function retry(){if(!wrong.length){alert("No wrong answers to retry 🎉");return}load(cur,wrong.map(q=>({...q})))}
load(0);
</script>
</body>
</html>
