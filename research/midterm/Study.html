<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1230;--card:#192049;--tx:#eef1ff;--mu:#aab2dd;--p:#8b6cff;--t:#19d3c5;--k:#ff7ab8;--y:#ffc857;--g:#3ddc97;--r:#ff5d73}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.28;z-index:0;animation:fl 14s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:var(--p);top:-80px;right:-60px}
.b2{width:300px;height:300px;background:var(--t);bottom:-60px;left:-60px;animation-delay:-5s}
.b3{width:220px;height:220px;background:var(--k);top:45%;left:40%;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-50px) scale(1.15)}}
.wrap{position:relative;z-index:1;max-width:980px;margin:auto;padding:18px 14px 60px}
header{text-align:center;padding:26px 10px 8px}
header h1{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;background:linear-gradient(90deg,var(--t),var(--p),var(--k),var(--y));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
@keyframes sh{to{background-position:300% 0}}
header p{color:var(--mu)}
.bar{height:8px;background:#ffffff18;border-radius:9px;margin:16px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t),var(--p),var(--k));border-radius:9px;transition:width .6s}
.stat{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px 2px;background:linear-gradient(var(--bg) 70%,transparent)}
nav button{flex:0 0 auto;font:inherit;font-weight:600;color:var(--tx);background:var(--card);border:2px solid transparent;border-radius:14px;padding:8px 14px;cursor:pointer;transition:.25s}
nav button:hover{transform:translateY(-3px)}
nav button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--card));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 40%,transparent)}
nav button:focus-visible,.opt:focus-visible{outline:3px solid var(--y)}
h2{font-size:1.5rem;margin:14px 0;color:var(--c)}
h2 span{display:inline-block;animation:wob 2.6s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.15)}}
h3{margin:26px 0 10px;font-size:1.15rem;padding:6px 14px;border-radius:12px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border-radius:16px;padding:14px 16px;border-top:4px solid var(--c);transition:.25s;animation:up .5s both;animation-delay:calc(var(--i)*60ms)}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0006}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card h4{color:var(--c);margin-bottom:4px}
.en{direction:ltr;text-align:left;font-weight:600}
.ar{color:var(--mu);margin-top:4px}
.ex{margin-top:6px;background:#ffffff0d;border-right:3px solid var(--y);padding:4px 10px;border-radius:8px;font-size:.93rem}
.ex b{color:var(--y)}
.dh{background:color-mix(in srgb,var(--k) 25%,transparent);color:var(--k)}
.vs{background:var(--card);border-radius:16px;padding:12px;margin-bottom:12px;animation:up .5s both}
.vs>b{display:block;text-align:center;color:var(--k);margin-bottom:8px}
.vb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.vb div{border-radius:12px;padding:8px 12px;direction:ltr;text-align:left}
.vb div:first-child{background:#19d3c522;border:1px solid var(--t)}
.vb div:last-child{background:#8b6cff22;border:1px solid var(--p)}
.vb em{align-self:center;font-style:normal;font-weight:800;color:var(--y);animation:pl 1.8s infinite}
@keyframes pl{50%{transform:scale(1.35)}}
.vb h5{font-size:1rem}.vb p{font-size:.92rem;color:var(--mu)}
@media(max-width:560px){.vb{grid-template-columns:1fr}.vb em{text-align:center}}
.fh{background:color-mix(in srgb,var(--r) 25%,transparent);color:var(--r)}
.fo{background:linear-gradient(90deg,#ff5d7322,transparent);border-right:5px solid var(--r);border-radius:12px;padding:8px 14px;margin-bottom:8px;animation:up .5s both}
.bh{background:color-mix(in srgb,var(--y) 25%,transparent);color:var(--y)}
.bs{background:linear-gradient(90deg,#ffc85722,transparent);border-right:5px solid var(--y);border-radius:12px;padding:8px 14px;margin-bottom:8px}
.qh{background:color-mix(in srgb,var(--g) 25%,transparent);color:var(--g)}
.q{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
.q p{direction:ltr;text-align:left;font-weight:700;margin-bottom:8px}
.opt{display:block;width:100%;direction:ltr;text-align:left;font:inherit;color:var(--tx);background:#ffffff10;border:2px solid transparent;border-radius:12px;padding:7px 12px;margin:6px 0;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--p);transform:translateX(4px)}
.opt.ok{background:#3ddc9733;border-color:var(--g);animation:pop .4s}
.opt.no{background:#ff5d7333;border-color:var(--r);animation:sk .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes sk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.exp{display:none;margin-top:6px;color:var(--y);font-size:.93rem}
.go{display:block;margin:22px auto 0;font:inherit;font-weight:800;color:#0e1230;background:linear-gradient(90deg,var(--t),var(--y));border:0;border-radius:14px;padding:10px 26px;cursor:pointer;transition:.25s}
.go:hover{transform:scale(1.06)}
footer{text-align:center;color:var(--mu);margin-top:34px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
<header>
<h1>🌙 مراجعة ليلة الامتحان</h1>
<p>Nursing Research </p>
<div class="bar"><i id="pb"></i></div>
<div class="stat"><span id="vis">الأبواب: 0/6</span><span id="sc">السكور: 0/0</span></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<footer>بالتوفيق يا دكتور 💙 — GHAITH TEAM</footer>
</div>
<script>
const COL=["#19d3c5","#8b6cff","#ff7ab8","#ffc857","#3ddc97","#ff8a5c"];
const CH=[
{t:"Basic Terms",ic:"📘",
cards:[
["Subjects","Individuals who provide information directly, also known as respondents.","الناس اللي بتدي المعلومات للباحث مباشرة، واسمهم كمان respondents.",""],
["Variable","Attributes of a person or object that vary or take different values.","أي صفة بتتغير من شخص لشخص أو من حاجة لحاجة.","Body temperature, age, heart rate"],
["Feasibility","The ease with which a particular study can be completed.","الدراسة دي سهل تتنفذ وتخلص ولا لأ.",""],
["Aim of study","The purpose of the study; why the study has been done.","الهدف: ليه الدراسة اتعملت أصلاً.",""],
["Incidence","The number of new cases of a health problem within a specific period of time.","عدد الحالات الجديدة بس في فترة زمنية محددة.",""],
["Literature review","An account of what has been published on a topic by accredited scholars and researchers.","عرض لكل اللي اتنشر عن الموضوع من علماء وباحثين معتمدين.",""],
["Setting","Specific places where data collection will occur.","المكان اللي هتتجمع فيه الداتا.","Homes, hospitals"],
["Nursing research","Systematic, controlled and critical investigation to discover or confirm facts that relate to a specific problem or question about the practice.","بحث منظم ومتحكم فيه وناقد، عشان نكتشف أو نأكد حقائق عن مشكلة في الممارسة.",""],
["Good researcher","R-E-S-E-A-R-C-H-E-R: Research oriented, Efficient, Scientific, Effective, Active, Resourceful, Creative, Honest, Economical, Religious.","كل حرف من كلمة RESEARCHER بيمثل صفة.",""],
["High-quality research","Empirical, Logical, Cyclical, Analytical, Reliability, Critical.","ست صفات. الـ Cyclical يعني يبدأ بمشكلة وينتهي بمشكلة.",""]],
diff:[
["Independent vs Dependent","Independent (السبب)","Believed to cause or influence the dependent variable","Dependent (النتيجة)","The outcome variable that depends on / is caused by another variable"],
["Population vs Sample","Population (الكل)","The entire group of persons or objects of interest","Sample (الجزء)","A subset of the population selected to participate"],
["Internal vs External validity","Internal","Whether the independent variable really made the difference, not extraneous factors","External","The extent to which results can be generalized to a larger population"]],
focus:["Incidence = حالات جديدة في فترة محددة (مش كل الحالات).","Cyclical = تبدأ بمشكلة وتنتهي بمشكلة.","External validity = تعميم النتايج. Internal validity = التأثير حقيقي مش من عوامل دخيلة."],
bas:["RESEARCHER = 10 حروف = 10 صفات، وآخر واحد Religious.","ELCARC: Empirical, Logical, Cyclical, Analytical, Reliability, Critical."],
mcq:[
["Which term describes the number of NEW cases within a specific period?",["Prevalence","Incidence","Population","Feasibility"],1,"Incidence = new cases in a specific period."],
["The variable believed to cause or influence another variable is the:",["Dependent variable","Outcome variable","Independent variable","Setting"],2,"الـ independent هو السبب."],
["Generalizing study results to a larger population refers to:",["Internal validity","External validity","Feasibility","Aim of study"],1,"External validity = generalization."]]},
{t:"Process & Methods",ic:"🔬",
cards:[
["Nursing process","A subset of the problem-solving process: assessment, diagnosis, plan, implementation, evaluation, and modification.","جزء من خطوات حل المشكلة.",""],
["Research process","11 steps: formulating the problem, literature survey, hypothesis, research design, sample design, collecting data, execution, analysis, hypothesis testing, generalizations and interpretation, report.","11 خطوة بالترتيب ده.",""],
["Quantitative","A formal, objective, systematic process in which numerical data are used to obtain information about the world.","رسمي وموضوعي ومنظم وبيستخدم أرقام.",""],
["Qualitative","A systematic, subjective approach used to describe life experiences and situations and give them meaning.","منظم بس subjective، بيوصف التجارب الحياتية ويدّيها معنى.",""],
["Outcomes research","Examines the results of care and determines the changes in health status for the patient.","بتفحص نتايج الرعاية والتغير في صحة المريض.",""],
["Descriptive","Explores new areas of research and describes situations as they exist in the world.","بيوصف الوضع زي ما هو.","Spread of flu cases each season"],
["Correlational","Examines the strength of relationships between variables.","بيقيس قوة العلاقة بين المتغيرات.","Anxiety and midterm exam scores of nursing students"],
["Quasi-experimental","Examines causal relationships or the effect of one variable on another, using interventions.","بيدرس السبب والتأثير من خلال تدخل.",""],
["Experimental","An objective, systematic, highly controlled investigation to predict and control phenomena in nursing practice.","محكوم جداً عشان نتنبأ ونتحكم.","Exercise intervention for breast cancer survivors: muscle strength, balance, falls"],
["Role of nurses","Principal investigator, member of research team, identifier of researchable problems, evaluator of findings, user of findings, patient/client advocate, subject/participant.","7 أدوار للممرض في البحث.",""]],
diff:[
["Quantitative vs Qualitative","Quantitative","Objective, numerical data (أرقام)","Qualitative","Subjective, life experiences and meaning (معاني)"],
["Phenomenological vs Ethnographic","Phenomenological","Human experiences through descriptions by the people involved: lived experiences","Ethnographic","Data about cultural groups: life ways and patterns of a culture"],
["Grounded theory vs Historical","Grounded theory","Collect and analyze data, then develop a theory grounded in the data","Historical","Examines past events through documents to find causes and factors"]],
focus:["Quantitative = 4 أنواع، Qualitative = 5 أنواع. الامتحان بيسأل في العدد.","في النص الـ nursing process فيها modification (6 خطوات)، والرسمة ADPIE فيها 5. والـ research process في النص 11 خطوة والرسمة 8.","Exploratory-descriptive = فهم التجربة من وجهة نظر اللي عايشها."],
bas:["Quantitative 4: D-C-Q-E (Descriptive, Correlational, Quasi, Experimental).","Qualitative 5: P-G-E-E-H (Phenomenological, Grounded, Ethnographic, Exploratory-descriptive, Historical)."],
mcq:[
["Which qualitative type examines lived experiences?",["Phenomenological","Grounded theory","Ethnographic","Historical"],0,"Phenomenological = lived experiences."],
["Quantitative research uses:",["Subjective narratives","Numerical data","Cultural observation","Past documents only"],1,"Quantitative = numerical data."],
["Which type examines the strength of relationships between variables?",["Descriptive","Correlational","Historical","Experimental"],1,"Correlational = strength of relationship."]]},
{t:"Problem & Question",ic:"❓",
cards:[
["Research","A systematic process of answering questions by generating new knowledge.","عملية منظمة للإجابة على أسئلة بتوليد معرفة جديدة.",""],
["Research ≠ problem solving","Research discovers new knowledge, whereas problem solving uses current knowledge.","البحث بيطلّع معرفة جديدة، وحل المشكلة بيستخدم المعرفة الموجودة.",""],
["Research problem","A situation that requires a solution to be described, explained, or predicted; an area of concern with a gap in the knowledge base needed for nursing practice.","موقف محتاج حل، أو فجوة في المعرفة اللازمة للممارسة.",""],
["Selecting a problem (6)","Interest, Feasibility, Data availability, Relevance, Clarity and specificity, Ethics.","6 عوامل. الـ Interest هو أهمهم.",""],
["Sources of problems","Literature review and past research, deductions of theory, personal experiences, daily problems, research questions and results, funding agencies.","مصادر المشكلة البحثية.",""],
["Research question","The final step prior to beginning research design; it outlines the primary components to be studied and guides both quantitative and qualitative studies.","آخر خطوة قبل الـ research design.",""],
["Steps to develop a question","Choose an interesting subject, preliminary reading, consider your audience, start asking questions, evaluate your question, consider research outcomes.","6 خطوات.",""],
["Good question elements","Relevant, focused and specific, measurable, researchable and attainable, realistic, timely, meaningful whether the answer is yes or no.","7 عناصر.",""],
["PICO","P = Population, I = Intervention, C = Comparison, O = Outcome.","طريقة لصياغة السؤال البحثي الكمي.",""]],
diff:[
["Research vs Problem solving","Research","Generates NEW knowledge","Problem solving","Uses CURRENT knowledge"],
["Descriptive vs Relationship question","Descriptive","Describes a phenomenon, concept, variable or population","Relationship","Quantifies the relationship between variables or subjects"],
["Quantitative vs Qualitative questions","Quantitative","Descriptive, comparative, relationship-related","Qualitative","Exploratory, predictive, interpretive"]],
focus:["Interest = أهم معيار في اختيار المشكلة البحثية.","Research question = آخر خطوة قبل الـ research design.","أنواع السؤال البحثي 3: Descriptive, Relationship, Cause-effect.","مش كل المشاكل researchable."],
bas:["PICO = P-I-C-O: Population, Intervention, Comparison, Outcome."],
mcq:[
["The most important criterion in selecting a research problem is:",["Ethics","Interest","Clarity","Data availability"],1,"Interest هو الأهم."],
["PICO stands for:",["Population, Intervention, Comparison, Outcome","Problem, Idea, Concept, Objective","Population, Interest, Control, Outcome","Process, Intervention, Criteria, Output"],0,"P-I-C-O."],
["Research differs from problem solving because research:",["Uses current knowledge","Generates new knowledge","Needs no data","Has no questions"],1,"Research = new knowledge."]]},
{t:"Variables & Hypothesis",ic:"🧪",
cards:[
["Variable","A characteristic of a person, object or phenomenon which can take on different values. In quantitative research variables are narrow and specific; in qualitative research they are more abstract.","الكمي: محدد وبيتحول لأرقام. الكيفي: أوسع وأعم.",""],
["Continuous","Measurements can become more and more accurate depending on the instrument used.","قيمته تتحدد بدقة أكبر حسب الجهاز.","Height 2.5 cm or 2.565 cm; temperature 37.2 or 37.19999"],
["Discrete","A finite number of values between any two points; only full values.","أرقام صحيحة بس.","Number of children: 0, 1, 2, 3"],
["Categorical","Variables expressed in categories.","بيتقسم لفئات.","Sex (male, female); marital status"],
["Hypothesis","An intelligent guess or prediction that gives direction to the researcher to answer the research question.","تخمين ذكي بيدّي الباحث اتجاه.",""],
["Importance","Provides direction for the research, establishes relationship between variables, helps in the discussion of findings and conclusion.","3 فوايد.",""],
["Good hypothesis","Brief, clear and concise; states an expected relationship; identifies at least two variables; positive or negative nature; testable; justifiable; empirical; logical.","8 صفات.",""],
["Sources","Personal experiences or opinions, previous research, observation, nursing diagnosis and clinical setting, scientific theory, imagination and thinking.","6 مصادر.",""],
["Types (6)","Simple, Complex, Null, Directional, Non-directional, Causal.","6 أنواع.",""]],
diff:[
["Continuous vs Discrete","Continuous","More and more accurate measurements (height, temperature)","Discrete","Only full values (number of children)"],
["Simple vs Complex","Simple","Relationship between two variables: one independent and one dependent","Complex","Relationship between two or more independent and dependent variables"],
["Directional vs Non-directional","Directional","Predicts the direction. High quality of nursing education leads to high quality of practice skills","Non-directional","Predicts a relationship without direction. Teacher-student relationship influences learning"],
["Null vs Causal","Null","No relationship between independent and dependent variable","Causal","Cause and effect relationship or interaction"]],
focus:["Null hypothesis = مفيش علاقة.","الـ hypothesis الكويسة لازم فيها متغيرين على الأقل.","Discrete = full values بس. Continuous = حسب دقة الجهاز."],
bas:["الستة: S-C-N-D-N-C (Simple, Complex, Null, Directional, Non-directional, Causal)."],
mcq:[
["Number of children (0, 1, 2, 3) is a:",["Continuous variable","Discrete variable","Dependent hypothesis","Null hypothesis"],1,"Discrete = full values only."],
["A hypothesis predicting NO relationship between variables is:",["Simple","Null","Directional","Complex"],1,"Null = no relationship."],
["'Teacher-student relationship influences learning' is a:",["Directional hypothesis","Non-directional hypothesis","Null hypothesis","Complex hypothesis"],1,"علاقة من غير اتجاه."]]},
{t:"Research Design",ic:"📐",
cards:[
["Research design","The plan to answer the research questions; the blueprint that includes how data is collected, what instruments are employed, how they are used, and the means for analyzing data.","الخطة والـ blueprint بتاعة البحث.","Like the blue print of an architect's work"],
["Purposes","Help answer the research question, clarify the problem and determine causality, help in planning and implementation, conduct the project according to analysis and evaluation of data, eliminate bias and reduce errors.","5 أهداف.",""],
["Characteristics (4)","Objectivity, Reliability, Validity, Generalization.","4 صفات.",""],
["Elements (5)","Subjects (who), variables (what), time (when), setting (where), role of the investigator.","5 عناصر.",""],
["Factors affecting selection","Nature of the problem, purpose, researcher's knowledge and experience, interest and motivation, ethics and principles, subjects and participants, resources, time frame for data collection.","8 عوامل.",""],
["Types (3)","Experimental, Quasi-experimental, Non-experimental.","3 أنواع.",""]],
diff:[
["Reliability vs Validity","Reliability","The degree to which an assessment tool produces stable and consistent results","Validity","Appropriateness: the degree to which an instrument measures what it is intended to measure"],
["Objectivity vs Generalization","Objectivity","Personal prejudices and preferences do not contaminate data collection and analysis","Generalization","Data collected from a sample can be utilized for a larger group"],
["Time vs Setting","Time","Variables observed at one point in time or over time","Setting","Where the research takes place: natural setting or laboratory"]],
focus:["Design = blueprint.","Elements 5: who, what, when, where + role of the investigator.","Reliability = ثبات النتايج. Validity = بيقيس اللي المفروض يقيسه."],
bas:["العناصر: 4 أسئلة (who, what, when, where) + دور الباحث = 5.","الصفات: O-R-V-G."],
mcq:[
["The degree to which a tool measures what it is intended to measure is:",["Reliability","Validity","Objectivity","Generalization"],1,"Validity."],
["Which design element answers 'where'?",["Subject","Variables","Setting","Time"],2,"Setting = where."],
["A research design is best compared to:",["A blueprint","A hypothesis","A sample","An outcome"],0,"Blueprint of the project."]]},
{t:"Experimental & Observational",ic:"🧬",
cards:[
["True experimental","Maintains maximum and rigorous control over subjects and uses randomization and manipulation.","تحكم كامل + randomization + manipulation.",""],
["Experimental steps","Identify population, simple random sample, randomly assign to experimental and control groups, observe both, introduce the independent variable to the experimental group only, observe the dependent variable in both, compare changes, compare with statistically computed values; if significant, a causal relationship is established.","9 خطوات مختصرة.",""],
["Quasi-experimental","Resembles the experimental design but lacks manipulation and randomization; no random assignment; may or may not have a control group.","شبه التجريبي بس من غير randomization.",""],
["Non-experimental","The researcher observes the events without manipulating them: descriptive and analytic.","الباحث بيلاحظ من غير ما يتدخل.",""],
["Cross-sectional","A snapshot of a population at a certain point in time; also called a prevalence study. Fast, inexpensive, baseline data; difficult to establish causality, not useful for rare diseases, gives prevalence not incidence.","صورة لحظية، واسمه prevalence study.",""]],
diff:[
["True experimental vs Quasi","True","Randomization and manipulation; maximum control","Quasi","Loss of randomization; less control; weak due to threats to internal validity"],
["Descriptive vs Analytic","Descriptive","Describes distribution of diseases and characteristics in the population","Analytic","Analyzes associations to discover cause and effect"],
["Case report vs Case series","Case report","Detailed report of a SINGLE patient","Case series","Characteristics of a NUMBER of patients with a given disease"],
["Case-control vs Cohort","Case-control (Retrospective)","Compares cases with controls and looks back at exposure. Good for rare diseases, less time. Cannot give prevalence or incidence","Cohort (Prospective)","Followed over time. Defines incidence, many outcomes. Long, expensive, unsuitable for rare diseases"]],
focus:["Case-control = retrospective ومناسب للأمراض النادرة. Cohort = prospective ومش مناسب للنادرة.","Cross-sectional = prevalence مش incidence.","Case-control مبيجيبش prevalence ولا incidence. اللي بيحدد incidence هو الـ Cohort.","Quasi = من غير randomization."],
bas:["Case-control = بيبص ورا (back). Cohort = بيتابع قدام (forward)."],
mcq:[
["Which design is good for studying rare diseases?",["Cohort","Case-control","Cross-sectional","True experimental"],1,"Case-control = rare diseases."],
["Cross-sectional is also called:",["Incidence study","Prevalence study","Retrospective study","Prospective study"],1,"Snapshot = prevalence study."],
["Which design lacks randomization?",["True experimental","Quasi-experimental","Both","Neither"],1,"Quasi loses randomization."],
["Which study defines the incidence rate of a disease?",["Case-control","Cross-sectional","Cohort","Case report"],2,"Cohort defines incidence."]]}
];
let cur=0,right=0,done=0,seen=new Set();
const total=CH.reduce((a,c)=>a+c.mcq.length,0);
const $=id=>document.getElementById(id);
function tabs(){$("nav").innerHTML=CH.map((c,i)=>`<button style="--c:${COL[i]}" class="${i==cur?"on":""}" onclick="show(${i})">${c.ic} ${i+1}. ${c.t}</button>`).join("")}
function show(i){cur=i;seen.add(i);tabs();const c=CH[i];
let h=`<section style="--c:${COL[i]}"><h2><span>${c.ic}</span> الباب ${i+1}: ${c.t}</h2><div class="grid">`;
c.cards.forEach((k,n)=>{h+=`<div class="card" style="--i:${n}"><h4>${k[0]}</h4><p class="en">${k[1]}</p><p class="ar">${k[2]}</p>${k[3]?`<p class="ex"><b>عشان تفهمها :</b> ${k[3]}</p>`:""}</div>`});
h+=`</div><h3 class="dh">⚖️ بيقولك غيث فرق بين</h3>`;
c.diff.forEach(d=>{h+=`<div class="vs"><b>${d[0]}</b><div class="vb"><div><h5>${d[1]}</h5><p>${d[2]}</p></div><em>VS</em><div><h5>${d[3]}</h5><p>${d[4]}</p></div></div></div>`});
h+=`<h3 class="fh">🎯 ركز مع غيث</h3>`+c.focus.map(f=>`<div class="fo">${f}</div>`).join("");
h+=`<h3 class="bh">🧠 بصمجة غيث</h3>`+c.bas.map(f=>`<div class="bs">${f}</div>`).join("");
h+=`<h3 class="qh">✅ MCQ</h3>`;
c.mcq.forEach((q,n)=>{h+=`<div class="q" data-a="${q[2]}"><p>${n+1}. ${q[0]}</p>`+q[1].map((o,j)=>`<button class="opt" onclick="pick(this,${j})">${o}</button>`).join("")+`<div class="exp">💡 ${q[3]}</div></div>`});
if(i<CH.length-1)h+=`<button class="go" onclick="show(${i+1});scrollTo({top:0,behavior:'smooth'})">الباب الجاي ◀</button>`;
$("main").innerHTML=h+"</section>";upd()}
function pick(b,j){const q=b.parentNode,a=+q.dataset.a,os=q.querySelectorAll(".opt");
os.forEach((o,k)=>{o.disabled=true;if(k==a)o.classList.add("ok")});
if(j==a)right++;else b.classList.add("no");done++;q.querySelector(".exp").style.display="block";upd()}
function upd(){$("vis").textContent=`الأبواب: ${seen.size}/${CH.length}`;$("sc").textContent=`السكور: ${right}/${done}`;
$("pb").style.width=(seen.size/CH.length*70+done/total*30)+"%"}
show(0);
</script>
</body>
</html>
