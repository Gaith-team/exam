<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0d9488;--teal-d:#0f766e;--blue:#eef2f7;--bd:#d6e0e8;--ok:#16a34a;--no:#dc2626;--rev:#6366f1;--txt:#1a2332;--grad:linear-gradient(135deg,#0f766e,#0d9488,#14b8a6)}
body{font-family:'Outfit',Arial,sans-serif;background:#f8fafc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#0f766e;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#0d9488;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#d97706}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef2f7}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #1a2332;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef2f7;border-top:1px solid #d6e0e8;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/pediatric/index.html">← رجوع</a>طب أطفال<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">30:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Neonatal hypothermia is defined as a core body temperature below:", o:["37.5°C","36.5°C","36.0°C","35.0°C"], a:1},
{t:"What is the most common cause of gastroenteritis in infants younger than 24 months?", o:["Shigella","Norovirus","Rotavirus","Giardia lamblia"], a:2},
{t:"Neonatal bleeding is defined as excessive bleeding during:", o:["The first 24 hours of life","The first 7 days of life","The first 14 days of life","The first 28 days of life"], a:3},
{t:"Birth asphyxia is best defined as:", o:["Failure to initiate and sustain breathing at birth","Excessive bleeding in the first 28 days of life","A core body temperature below 36.5°C","Destruction of red blood cells faster than they are produced"], a:0},
{t:"Hemolytic anemia is a condition in which:", o:["White blood cells are decreased","Iron absorption is excessive","Platelets fail to aggregate","Red blood cells are destroyed faster than they are produced"], a:3},
{t:"Which of the following is a functional cause of constipation?", o:["Hirschsprung disease","Hypothyroidism","Low fiber diet","Cystic fibrosis"], a:2},
{t:"The dose of vitamin K given by injection in the management of neonatal bleeding is:", o:["0.1 mg IM","1 mg IM","5 mg IM","10 mg IM"], a:1},
{t:"Gastroenteritis is acquired mainly through:", o:["The fecal–oral route","Respiratory droplets","Vector bites","Blood transfusion"], a:0},
{t:"Which combination of features is characteristic of hemolytic anemia?", o:["Cyanosis, wheezing and cough","Polyuria, polydipsia and weight loss","Rash, joint pain and fever","Pallor, jaundice and dark urine"], a:3},
{t:"Bleeding from the umbilical stump is a clinical feature of:", o:["Constipation","Neonatal hypothermia","Neonatal bleeding","Birth asphyxia"], a:2},
{t:"Why are newborns prone to heat loss?", o:["Thick skin and high subcutaneous fat","Large surface area-to-weight ratio","Fully mature metabolic mechanisms","Small body surface area"], a:1},
{t:"A poor Apgar score in birth asphyxia is:", o:["Less than 7 at 5 minutes","Less than 9 at 1 minute only","Less than 10 at birth","Less than 5 at 10 minutes"], a:0},
{t:"Moderate neonatal hypothermia is classified as a temperature of:", o:["36.0–36.4°C","Below 32.0°C","32.0–35.9°C","36.5–37.5°C"], a:2},
{t:"Infrequent bowel movements in pediatric constipation means:", o:["Fewer than 2 bowel movements per week","Fewer than 5 per week","Fewer than 1 per day","Fewer than 3 per week"], a:0},
{t:"Which of the following is NOT a method of rewarming a hypothermic neonate?", o:["Skin-to-skin contact","Incubator","Radiant warmer","Cold water immersion"], a:3},
{t:"Which of the following is a placental cause of birth asphyxia?", o:["Maternal anemia","Placental abruption","Nuchal cord","Fetal infection"], a:1},
{t:"Viruses account for approximately what percentage of the causes of gastroenteritis?", o:["10%","30%","50%","70%"], a:3},
{t:"Which finding is expected in MILD dehydration?", o:["Tears present","Anuria","Markedly sunken fontanelle","Parched buccal mucosa"], a:0},
{t:"Oral rehydration solutions (ORS) contain:", o:["Antibiotics and antiemetics","Probiotics and fiber","Fat and protein","Electrolytes and glucose"], a:3},
{t:"Intravenous fluids are given in gastroenteritis when:", o:["Dehydration is mild and intake is good","Dehydration is severe or oral intake is not possible","Every child has diarrhea","Antibiotics have been completed"], a:1},
{t:"Which laboratory finding is typical of hemolytic anemia?", o:["Low reticulocyte count","Elevated indirect bilirubin","High haptoglobin","Low LDH"], a:1},
{t:"The direct Coombs test detects:", o:["Antibodies in the serum","Antibodies attached to red blood cells","Platelet count","Reticulocyte count"], a:1},
{t:"The first step in the management of birth asphyxia is:", o:["Immediate resuscitation (airway, breathing, circulation)","Cranial MRI","Starting oral feeds","Vitamin K injection"], a:0},
{t:"Which of the following is a cause of neonatal bleeding?", o:["Hypothermia","Constipation","Hypoglycemia","Vitamin K deficiency bleeding"], a:3},
{t:"Soiling (encopresis) is a clinical manifestation of constipation mainly in:", o:["Mild acute cases","Newborns","Chronic cases","Hemolytic anemia"], a:2},
{t:"Which of the following is an ORGANIC cause of constipation?", o:["Painful defecation with stool withholding","Toilet training issues","Inadequate fluid intake","Hirschsprung disease"], a:3},
{t:"Which statement about diet during gastroenteritis is correct?", o:["Fast until the diarrhea stops","Dilute formula feeds when reintroduced","Resume the normal diet once appetite returns and avoid foods high in fat and sugar","Give only sugary drinks"], a:2},
{t:"Isonatremic dehydration is characterized by:", o:["Equal loss of water and electrolytes, with sodium 135–154","Primarily loss of sodium, with sodium below 135","Primarily loss of water","Normal fluid balance"], a:0},
{t:"Autoimmune hemolytic anemia is treated with:", o:["Vitamin K","Stool softeners","Oral rehydration solution","Corticosteroids"], a:3},
{t:"Which combination indicates SEVERE dehydration?", o:["Flat fontanelle and tears present","Normal capillary refill and full pulse","Anuria and markedly sunken fontanelle","Alert, restless, increased thirst"], a:2},
{t:"Which of the following are complications of gastroenteritis when rehydration is delayed?", o:["Metabolic acidosis and electrolyte disturbance","Hypertrichosis and gynecomastia","Cataract and glaucoma","Scoliosis and kyphosis"], a:0},
{t:"G6PD deficiency is classified among the inherited causes of hemolytic anemia as:", o:["A membrane defect","A hemoglobin disorder","An enzyme deficiency","An autoimmune cause"], a:2},
{t:"The decline in diarrheal mortality, despite no major change in incidence, is the result of:", o:["Rotavirus vaccination, oral rehydration therapy and improved nutrition","A reduced incidence of diarrhea","Widespread antibiotic use","Routine use of antidiarrheals"], a:0},
{t:"Which metabolic complications accompany neonatal hypothermia?", o:["Hyperglycemia and alkalosis","Hypoglycemia and metabolic acidosis","Hypernatremia and hyperkalemia","Hypercalcemia and polycythemia"], a:1},
{t:"Which of the following is an appropriate nursing action in gastroenteritis?", o:["Encourage sharing of utensils","Educate on handwashing and hygiene","Stop all fluids","Avoid monitoring for complications"], a:1},
{t:"Neonatal hypothermia is defined as a core body temperature below 36.5°C.", o:["True","False"], a:0},
{t:"Hypothyroidism is a functional cause of constipation.", o:["True","False"], a:1},
{t:"Vitamin K deficiency bleeding is a cause of neonatal bleeding.", o:["True","False"], a:0},
{t:"Functional constipation is the most common type and has no underlying disease.", o:["True","False"], a:0},
{t:"Bleeding from the umbilical stump is not a feature of neonatal bleeding.", o:["True","False"], a:1},
{t:"Severe neonatal hypothermia is a temperature of 32.0–35.9°C.", o:["True","False"], a:1},
{t:"A weak or absent cry is a clinical feature of birth asphyxia.", o:["True","False"], a:0},
{t:"After 24 months of age, Shigella displaces rotavirus as the most common cause of gastroenteritis.", o:["True","False"], a:0},
{t:"Protozoa account for approximately 70% of the causes of gastroenteritis.", o:["True","False"], a:1},
{t:"Sunken eyes and lack of tears are signs of dehydration.", o:["True","False"], a:0},
{t:"Children with gastroenteritis should have milk and solids withheld until the diarrhea stops.", o:["True","False"], a:1},
{t:"Splenomegaly can be found in hemolytic anemia.", o:["True","False"], a:0},
{t:"Haptoglobin is elevated in hemolytic anemia.", o:["True","False"], a:1},
{t:"In birth asphyxia, blood gases show a high pH and a low CO2.", o:["True","False"], a:1},
{t:"Hereditary spherocytosis is an acquired cause of hemolytic anemia.", o:["True","False"], a:1}
];

const TOTAL_TIME = 30*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
