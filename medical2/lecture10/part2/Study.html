<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#be123c;--c2:#1d4ed8;--c3:#d97706;--c4:#0d9488;
--grad:linear-gradient(135deg,#9f1239 0%,#be123c 30%,#5b21b6 70%,#1e3a8a 100%);
--bg:#faf6f6;--bg2:#f3eaec;--card:#fff;--text:#2a1519;--text2:#5b4348;--text3:#8a7479;--bc:rgba(80,20,35,.1);--r:16px;--tr:all .3s cubic-bezier(.4,.0,.2,1)}
[data-theme="dark"]{--bg:#130a0d;--bg2:#1c1015;--card:#25161c;--text:#f5e9ec;--text2:#d4bcc2;--text3:#9c8289;--bc:rgba(255,255,255,.1);--accent:#fb7185;--c2:#60a5fa;--c3:#fbbf24;--c4:#2dd4bf}
html{scroll-behavior:smooth;scroll-padding-top:128px}
body{font-family:'Cairo','Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#prog{position:fixed;top:0;right:0;height:3px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--c3),var(--c4),var(--c2));width:0}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:64px;background:rgba(250,246,246,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(19,10,13,.95)}
.back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.back:hover{color:var(--c2);border-color:var(--c2)}
.brand{display:flex;align-items:center;gap:9px;font:900 15px 'Outfit',sans-serif;direction:ltr}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#be123c,#1d4ed8);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.tbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.chips{position:fixed;top:64px;left:0;right:0;z-index:90;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--bc);scrollbar-width:thin}
.chips a{flex-shrink:0;text-decoration:none;font:700 12px 'Outfit',sans-serif;direction:ltr;color:var(--text2);background:var(--card);border:1px solid var(--bc);border-radius:50px;padding:6px 13px;transition:var(--tr)}
.chips a:hover,.chips a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hero{margin-top:112px;background:var(--grad);padding:38px 20px 42px;text-align:center;position:relative;overflow:hidden;color:#fff}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.28),transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(13,148,136,.25),transparent 70%)}
.hero>*{position:relative}
.hicon{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.35)}
.hero h1{font:900 clamp(22px,4.5vw,32px) 'Outfit',sans-serif;margin-bottom:6px}
.hero p{font-size:13px;opacity:.9}
.pills{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 16px;font-size:12px;font-weight:700}
.shell{max-width:780px;margin:0 auto;padding:22px 16px 70px}
section{margin-bottom:26px}
.sh{display:flex;align-items:center;gap:10px;background:var(--grad);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px;font:900 16px 'Outfit',sans-serif;direction:ltr;text-align:left;box-shadow:0 4px 16px rgba(120,20,45,.15)}
.sh .n{background:rgba(255,255,255,.22);border-radius:8px;padding:2px 9px;font-size:11px;margin-left:auto}
.it{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:0 2px 12px rgba(120,20,45,.05)}
.en{padding:14px 16px;font:700 15px/1.65 'Outfit',sans-serif;direction:ltr;text-align:left;border-left:4px solid var(--accent)}
.ar{padding:12px 16px;font-size:14.5px;line-height:1.9;color:var(--text);border-top:1px dashed var(--bc);background:rgba(29,78,216,.05)}
.ar i{color:var(--c2);margin-left:6px}
.ex{padding:12px 16px;font-size:14px;line-height:1.9;color:var(--text2);border-top:1px dashed var(--bc);background:rgba(217,119,6,.07)}
.ex b{color:var(--c3)}
figure{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:10px;margin-bottom:12px;text-align:center}
figure img{max-width:100%;max-height:340px;border-radius:10px;background:#fff}
figcaption{font-size:12px;color:var(--text3);margin-top:6px;direction:ltr}
.up{position:fixed;bottom:20px;left:20px;width:44px;height:44px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:16px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:var(--tr)}
.up.show{opacity:1;pointer-events:auto}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.fb{font:700 14px 'Outfit',sans-serif}.fb span{color:var(--accent)}
.tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font:600 12px 'Outfit',sans-serif}
@media(max-width:480px){nav{padding:0 12px}.brand span{display:none}.shell{padding:16px 12px 60px}}
</style>
</head>

{t:`Introduction`,k:`Introduction`,i:[
[`Casts and splints support and protect injured bones and soft tissue.`,`الجبس والجبيرة بيدعموا وبيحموا العظام المصابة والأنسجة الرخوة اللي حواليها.`,`زي الدعامة اللي بتسند حاجة مكسورة وتحميها.`],
[`When a bone breaks, the doctor will put the pieces back together in the right position.`,`لما العضمة تتكسر الدكتور بيرجّع أجزاءها لمكانها الصح.`,`زي ما تلزق حتتين طبق مكسور وتظبطهم على بعض.`],
[`Casts and splints hold the bones in place while they heal.`,`الجبس والجبيرة بيثبّتوا العضم في مكانه طول ما هو بيلتئم.`,`زي ما تمسك حاجتين ملزوقين لحد ما الغرا ينشف.`],
[`They also reduce pain, swelling, and muscle spasm.`,`وكمان بيقلّلوا الألم والورم وتشنج العضلات.`,`لما الجزء ميتحركش كتير، الألم والتورم والتشنج بيهدّوا.`],
[`In some cases, splints and casts are applied surgery.`,`في بعض الحالات الجبس والجبيرة بيتحطوا مع الجراحة.`,`يعني مش دايماً بيتحطوا لوحدهم، ساعات مرتبطين بعملية.`]
]},
{t:`Definitions`,k:`Definitions`,i:[
[`Casts are solid dressings applied to a limb or other body part.`,`الجبس ده ضماد صلب بيتحط على طرف (إيد أو رجل) أو أي جزء تاني من الجسم.`,`تخيّله زي غلاف صلب لابس على الإيد.`],
[`Splints or "half-casts" provide less support than casts.`,`الجبيرة أو "نص جبس" بتدّي دعم أقل من الجبس.`,`زي نص غلاف مش غلاف كامل، فدعمه أقل.`],
[`However, splints can be adjusted to accommodate swelling from injuries easier than enclosed casts.`,`بس الجبيرة أسهل في التعديل لو الإصابة ورّمت، مقارنةً بالجبس المقفول.`,`زي حزام بتوسّعه لو الورم زاد، مش أنبوبة مقفولة على الجزء.`],
[`The doctor will decide which type of support is best for the patient.`,`الدكتور هو اللي بيقرر نوع الدعم الأنسب للمريض.`,`اختيار جبس ولا جبيرة بيبقى قرار الدكتور.`],
['IMG',0,`Splint (half-cast)`]
]},
{t:`Types`,k:`Types`,i:[
[`Short arm casts: extend from below the elbow to the proximal palmer crease.`,`جبس الدراع القصير: بيمتد من تحت الكوع لحد أول خط (crease) في كف الإيد.`,`يعني الكوع بيفضل حر، والجبس يغطي من تحته لحد الكف.`],
[`Long arm casts: extend from the axillary fold to the proximal palmer crease`,`جبس الدراع الطويل: بيمتد من طيّة الإبط لحد نفس الخط في كف الإيد.`,`يعني بيغطي الدراع من الإبط للكف.`],
['IMG',1,`Short Arm Cast · Long Arm Cast · Arm Cylinder Cast`],
[`Short leg casts: extend from below the knee to the base of the toes.`,`جبس الرجل القصير: بيمتد من تحت الركبة لحد قاعدة صوابع الرجل.`,`يعني الركبة حرة، والجبس من تحتها لحد الصوابع.`],
[`Long leg casts: extend from the upper third of the thigh to the base of the toes.`,`جبس الرجل الطويل: بيمتد من الثلث العلوي للفخذ لحد قاعدة الصوابع.`,`يعني بيغطي الرجل من فوق الفخذ لحد الصوابع.`],
['IMG',2,`Short Leg Cast · Leg Cylinder Cast · Long Leg Cast`],
[`Spica casts`,`جبس السبايكا (Spica).`,`الصورة اللي تحت بتوضّح أشكاله: Unilateral Hip Spica، One and One-half Hip Spica، Bilateral Long-leg Hip Spica.`],
['IMG',3,`Unilateral Hip Spica Cast · One and One-half Hip Spica Cast · Bilateral Long-leg Hip Spica Cast`]
]},
{t:`Purpose of casts and splints`,k:`Purpose`,i:[
[`Immobilize a body part in a specific position`,`تثبيت الجزء المصاب في وضع معيّن.`,`يعني الجزء ميتحركش من الوضع الصح.`],
[`Exert uniform compression to soft tissue`,`ضغط متساوي على الأنسجة الرخوة.`,`زي رباط ضاغط بيضغط بنفس القوة على كل الجزء.`],
[`Provide for early mobilization of unaffected body parts`,`إتاحة تحريك الأجزاء السليمة بدري.`,`يعني الأجزاء اللي مش مصابة تتحرك وتفضل شغالة.`],
[`Correct or prevent deformities`,`تصحيح التشوهات أو منع حدوثها.`,`يعني العضمة تلتئم في وضع مظبوط مش معوّج.`],
[`Stabilize and support unstable joints.`,`تثبيت ودعم المفاصل غير المستقرة.`,`المفصل اللي مش ثابت الجبس بيسنده.`]
]},
{t:`Materials`,k:`Materials`,i:[
[`Fiberglass or plaster materials form the hard, supportive layer in splints and casts`,`الفايبر جلاس أو البلاستر هم اللي بيكوّنوا الطبقة الصلبة الداعمة في الجبس والجبيرة.`,`دول "الجزء الصلب" اللي بيسند العضمة من برّه.`],
[`Fiberglass is lighter in weight and stronger than plaster.`,`الفايبر جلاس أخف وزن وأقوى من البلاستر.`,`يعني أريح على المريض وأمتن.`],
[`In addition, x-rays can "see through" fiberglass better than through plaster.`,`وكمان الأشعة بتشوف من خلال الفايبر جلاس أحسن من البلاستر.`,`يعني صورة الأشعة بتطلع أوضح مع الفايبر جلاس.`],
[`This is important because doctor will probably schedule additional x-rays after application of splint or cast.`,`ده مهم لأن الدكتور غالباً هيطلب أشعة إضافية بعد تركيب الجبيرة أو الجبس.`,`يعني هيصوّر تاني بعد التركيب، فمهم الأشعة تبان كويس.`],
[`X-rays can show whether the bones are healing well or have moved out of place.`,`الأشعة بتوضّح العضم بيلتئم كويس ولا اتحرك من مكانه.`,`زي ما تتأكد بالصورة إن الشغل ماشي صح.`],
[`Plaster is less expensive than fiberglass and shapes better than fiberglass for some uses.`,`البلاستر أرخص من الفايبر جلاس وبيتشكّل أحسن منه في بعض الاستخدامات.`,`زي الطين بيتشكّل على الجزء بسهولة.`]
]},
{t:`Application`,k:`Application`,i:[
[`Both fiberglass and plaster splints and casts use padding, usually cotton, as a protective layer next to the skin.`,`الفايبر جلاس والبلاستر الاتنين بيستخدموا حشو (غالباً قطن) كطبقة حماية جنب الجلد.`,`زي الشراب اللي بتلبسه جوه الجزمة عشان يحمي رجلك.`],
[`Both materials come in strips or rolls which are dipped in water and applied over the padding covering the injured area.`,`الخامتين بيجوا على شكل شرايط أو لفّات بتتغطس في المية وبتتلف فوق الحشو على المنطقة المصابة.`,`زي لفة شاش بس بتتبلّ وبعدين بتنشف وتبقى صلبة.`],
[`The splint or cast must fit the shape of the injured arm or leg correctly to provide the best possible support.`,`لازم الجبيرة أو الجبس يمشوا على شكل الدراع أو الرجل المصابة صح عشان يدّوا أحسن دعم.`,`زي الحذاء، لازم مقاسه مظبوط عشان يسند كويس.`],
[`Generally, the splint or cast also covers the joint above and below the broken bone.`,`عموماً الجبيرة أو الجبس بيغطّوا كمان المفصل اللي فوق والمفصل اللي تحت العضمة المكسورة.`,`يعني التثبيت مش على الكسر بس، لكن على المفصلين اللي حواليه.`]
]},
{t:`New trends in Materials & Technology`,k:`New Trends`,i:[
[`3D-Printed and Custom Additive Manufacturing: Smartphone-based 3D scanning and additive manufacturing allow clinicians to design patient-specific, open-lattice casts that match exact anatomical contours, enhancing comfort and reducing skin complications.`,`الطباعة ثلاثية الأبعاد والتصنيع المخصّص: المسح ثلاثي الأبعاد بالموبايل مع التصنيع بيخلّي الدكتور يصمم جبس مفتوح (شبكي) على مقاس المريض بالظبط وبيماشي شكل جسمه، فبيبقى أريح وبيقلّل مشاكل الجلد.`,`زي هدوم متفصّلة على مقاسك مش جاهزة.`],
[`Advanced Low-Temperature Thermoplastics (LTT): LTT materials represent one of the fastest-growing segments, offering superior remoldability and seamless integration into fast-paced outpatient workflows.`,`اللدائن الحرارية منخفضة الحرارة (LTT): من أسرع الأنواع انتشاراً، وبتتعاد تشكيلها بسهولة، وبتتماشى مع شغل العيادات الخارجية السريع.`,`زي بلاستيك بيلين بحرارة بسيطة وتقدر تشكّله تاني.`],
[`Water-Friendly and Hygiene-Focused Liners: Modern breathable, waterproof, and washable liners minimize moisture accumulation, foul odors, and bacterial or fungal growth, significantly improving patient compliance.`,`بطانات صديقة للمية وبتركّز على النظافة: بطانات حديثة بتتنفّس ومقاومة للمية وبتتغسل، بتقلّل تراكم الرطوبة والريحة الوحشة ونمو البكتيريا والفطريات، وده بيزوّد التزام المريض بالعلاج.`,`زي بطانة جزمة رياضة بتتغسل وبتتنفس، فالواحد مبيزهقش منها.`],
[`Smart and Sensor-Integrated Monitoring: Emerging sensor-based technologies embedded in immobilization devices help clinicians quantitatively track recovery progress and monitor localized pressure or healing metrics.`,`المراقبة الذكية بالحساسات: تكنولوجيا حساسات جديدة بتتحط جوه أجهزة التثبيت وبتساعد الدكتور يتابع التعافي بالأرقام ويراقب الضغط الموضعي أو مقاييس الالتئام.`,`زي ساعة ذكية بتقيس حاجة جوه الجبس وتقولك الحالة ماشية إزاي.`],
[`Spray-Based Polyurethane Foam Splints: Rapid-curing spray foams provide direct, lightweight stabilization without messy cotton padding, and can even be infused with localized therapeutic agents`,`جبائر فوم البولي يوريثان بالبخ: رغاوي بتتبخ وبتنشف بسرعة وبتثبّت مباشرةً وبخفة من غير حشو القطن المبهدل، وممكن كمان يتحط فيها مواد علاجية موضعية.`,`زي رغوة بتترشّ على الجزء وتنشف مكانها.`]
]},
{t:`Warning Signs`,k:`Warning Signs`,i:[
[`Excessive swelling below the cast, this may mean the cast is slowing blood circulation.`,`ورم زيادة تحت الجبس، وده ممكن يعني إن الجبس بيبطّئ الدورة الدموية.`,`الدم مش عارف يعدّي كويس فالجزء بيتورم.`],
[`Increased pain and the feeling that the splint or cast is too tight, this may be caused by swelling.`,`زيادة في الألم وإحساس إن الجبيرة أو الجبس ضيقين قوي، وده ممكن يكون بسبب الورم.`,`الجزء بيورم والجبس مش بيوسّع معاه.`],
[`Numbness and tingling in hand or foot, this may be caused by too much pressure on the nerves.`,`تنميل ووخز في الإيد أو الرجل، وده ممكن يكون من ضغط زيادة على الأعصاب.`,`زي لما بتقعد على رجلك وتنمّل.`],
[`Burning and stinging, this may be caused by too much pressure on the skin.`,`إحساس بحرقان ولسع، وده ممكن يكون من ضغط زيادة على الجلد.`,`زي حذاء ضيق بيحرق الجلد من الاحتكاك والضغط.`],
[`Loss of active movement of toes or fingers, this requires an urgent evaluation by the doctor.`,`فقدان الحركة الإرادية للصوابع (في الرجل أو الإيد)، وده محتاج تقييم عاجل من الدكتور.`,`يعني المريض مش قادر يحرّك صوابعه بنفسه، وده مينفعش يستنّى.`]
]},
{t:`Nursing Diagnosis (Casts)`,k:`Nursing Dx`,i:[
[`Deficient knowledge related to the treatment regimen`,`نقص معرفة بسبب خطة العلاج.`,`المريض مش عارف يتعامل مع الجبس إزاي.`],
[`Acute pain related to the musculoskeletal disorder`,`ألم حاد بسبب اضطراب العضلات والعظام.`,`ألم الإصابة نفسها.`],
[`Impaired physical mobility related to the cast`,`ضعف في الحركة الجسدية بسبب الجبس.`,`الجبس بيقيّد حركة المريض.`],
[`Self-care deficit: bathing/hygiene, feeding, dressing/grooming due to restricted mobility`,`قصور في العناية بالنفس: الاستحمام والنظافة، الأكل، اللبس والتزيين، بسبب تقييد الحركة.`,`زي واحد مش قادر يلبس ويستحمّى بإيد واحدة.`],
[`Impaired skin integrity related to lacerations.`,`تلف في سلامة الجلد بسبب الجروح القطعية.`,`الجلد نفسه فيه جروح.`],
[`Risk for peripheral neurovascular dysfunction and related to physiologic responses to injury and compression effect of cast`,`خطر حدوث اضطراب في الأعصاب والأوعية الطرفية بسبب استجابة الجسم للإصابة وتأثير ضغط الجبس.`,`الورم والجبس الضاغط ممكن يأذوا الأعصاب والدم في الطرف.`]
]},
{t:`Nursing Management (Casts)`,k:`Nursing Mgmt`,i:[
[`Prepare the client for cast application.`,`جهّز المريض لتركيب الجبس.`,`التحضير الأول قبل ما يتحط الجبس.`],
[`Explain the procedure and what to expect.`,`اشرحله الإجراء والمتوقع يحصل.`,`قوله هيحصل إيه وهيحس بإيه.`],
[`Obtain informed consent if surgery is required.`,`خد موافقة المريض المستنيرة لو الجراحة مطلوبة.`,`لو هيدخل عملية لازم يوافق وهو فاهم.`],
[`Clean the skin of the affected part.`,`نضّف جلد الجزء المصاب.`,`قبل الحشو والجبس.`],
[`Assist the health care provider during application of the cast as needed. After the cast application, provide cast care.`,`ساعد مقدّم الرعاية الصحية وقت تركيب الجبس لو محتاج، وبعد التركيب قدّم العناية بالجبس.`,`يعني معاه وقت التركيب، وبعدها تتابع الجبس.`],
[`Support an exposed cast, with the palms of your hands to prevent indentations.`,`ادعم الجبس المكشوف بكفوف إيديك عشان متحصلش انبعاجات.`,`لو مسكته بصوابعك الجبس الطري هيتعلّم فيه.`],
[`Elevate the casted extremity above the level of the heart.`,`ارفع الطرف المجبّس فوق مستوى القلب.`,`رفعه بيساعد الدم يرجع والورم ينزل.`],
[`Provide covering and warmth to un casted areas.`,`غطّي ودفّي المناطق اللي مش مجبّسة.`,`الجبس الطري بيتعرّض للهوا، فباقي الجسم يتغطى.`],
[`Expose the fresh plaster cast to circulating air, uncovered, until dry (24 to 72 hours).`,`سيب جبس البلاستر الطازة معرّض للهوا من غير غطا لحد ما ينشف (من 24 لـ 72 ساعة).`,`زي الدهان الطازة، لازم يتعرّض للهوا لحد ما ينشف.`],
[`Instruct the client to avoid wetting the cast.`,`وجّه المريض إنه يتجنّب إن الجبس يتبلّ.`,`المية بتضرّ الجبس.`],
[`Instruct him to dry a cast with a hair dryer if it gets wet.`,`وجّهه إنه ينشّف الجبس بالسشوار لو اتبلّ.`,`لو اتبلّ يتنشّف بالسشوار.`],
[`Encourage position changes.`,`شجّع المريض على تغيير الأوضاع.`,`عشان ميفضلش على وضع واحد.`],
[`Elevate the affected body part.`,`ارفع الجزء المصاب.`,`بيقلل الورم.`],
[`Provide analgesics as appropriate.`,`اديله المسكنات حسب المناسب.`,`للألم.`],
[`Promote non pharmacologic pain relief measures, such as relaxation and distraction.`,`شجّع طرق تخفيف الألم اللي من غير أدوية، زي الاسترخاء وتشتيت الانتباه.`,`يعني تقلل الألم من غير دوا: يهدّى ويشغل دماغه بحاجة تانية.`],
[`Observe for signs and symptoms of cast syndrome with clients who are immobilized in large casts, such as a body or hip spica cast.`,`لاحظ علامات وأعراض متلازمة الجبس (cast syndrome) مع المرضى المثبّتين في جبس كبير، زي جبس الجسم أو جبس الورك (Spica).`,`الجبس الكبير على الجسم ممكن يسبب مشاكل جوه البطن، فاراقب المريض.`],
[`Report abdominal pain and distention, nausea and vomiting, elevated blood pressure, tachycardia, and tachypnea which are physiologic effects of cast syndrome.`,`بلّغ عن ألم وانتفاخ في البطن، غثيان وترجيع، ارتفاع ضغط الدم، سرعة ضربات القلب، وسرعة التنفس، وده التأثيرات الفسيولوجية لمتلازمة الجبس.`,`دي الأعراض اللي بتدّلك إن cast syndrome بدأ.`],
[`Notify the health care provider immediately if signs or symptoms of other neurovascular complications occur.`,`بلّغ مقدّم الرعاية الصحية فوراً لو ظهرت علامات أو أعراض لمضاعفات عصبية وعائية تانية.`,`مفيش تأجيل، الأعصاب والدم مهمين.`],
[`Notify the health care provider if ―hot spots‖ occur along the cast; they may indicate infection under cast.`,`بلّغ مقدّم الرعاية الصحية لو ظهرت "نقط ساخنة" (hot spots) على الجبس، لأنها ممكن تدل على عدوى تحت الجبس.`,`مكان سخن على الجبس من برّه معناه إن في حاجة بتحصل تحته.`],
[`Provide client and family teaching.`,`قدّم تثقيف للمريض وأسرته.`,`الأسرة كمان لازم تعرف.`],
[`Advice the client to promptly report cast breaks and signs and Symptoms of complications (i.e. circulatory compromise, cast syndrome, and hot spots).`,`انصح المريض يبلّغ فوراً عن أي كسر في الجبس وعن علامات وأعراض المضاعفات (يعني اضطراب الدورة الدموية، متلازمة الجبس، والنقط الساخنة).`,`لو الجبس اتكسر أو ظهرت أي علامة، ميستناش.`],
[`Advise the client to avoid inserting sharp objects (e.g. coat hanger to scratch itchy skin under the cast).`,`انصح المريض يتجنّب إدخال أي أدوات حادة (زي علّاقة الهدوم) عشان يحكّ الجلد اللي بيأكله تحت الجبس.`,`الحاجة الحادة ممكن تجرح الجلد من جوه.`],
[`Instruct him to use a cool air from a dryer to help alleviate the itch.`,`وجّهه إنه يستخدم هوا بارد من السشوار عشان يخفف الهرش.`,`الهوا البارد بيريّح الأكلان.`],
[`Encourage safety precautions (e.g. avoid walking on wet floors, be careful with stairs).`,`شجّع على احتياطات السلامة (زي تجنب المشي على الأرضيات المبلولة، والحذر على السلالم).`,`عشان ميقعش ويتأذى تاني.`],
[`Teach the client skin care and muscle strengthening exercises for the affected body part after cast removal.`,`علّم المريض العناية بالجلد وتمارين تقوية العضلات للجزء المصاب بعد فك الجبس.`,`بعد الفك الجزء بيكون ضعيف وهو متعوّد على الجبس.`]
]},
{t:`Traction Application Nursing Management — Definition`,k:`Traction`,i:[
[`Traction is an orthopedic treatment that involves placing tension on a limb, bone or muscle group using various weight and pulley systems.`,`الجر (Traction) علاج عظام بيحط شدّ على طرف أو عضمة أو مجموعة عضلات باستخدام أوزان وأنظمة بكرات مختلفة.`,`زي حبل متعلّق فيه ثقل على بكرة، بيشدّ الجزء المصاب في اتجاه معيّن.`]
]},
{t:`Types — Skeletal Traction`,k:`Skeletal`,i:[
[`Skeletal traction involves placing a pin, wire, or screw in the fractured bone.`,`الجر الهيكلي بيتم بإنك تحط دبوس أو سلك أو مسمار في العضمة المكسورة.`,`يعني الأداة بتدخل في العضمة نفسها.`],
[`After one of these devices has been inserted, weights are attached to it so the bone can be pulled into the correct position.`,`بعد ما واحدة من الأدوات دي تتحط، بيتعلّق فيها أوزان عشان العضمة تتشدّ لوضعها الصح.`,`الدبوس هو نقطة تعليق الوزن.`],
[`Skeletal traction is most commonly used to treat fractures of the femur, or thighbone.`,`الجر الهيكلي أكتر حاجة بيتستخدم في علاج كسور عظمة الفخذ (femur).`,`يعني كسر الفخذ غالباً بيتعالج بالطريقة دي.`],
[`It's also the preferred method when greater force needs to be applied to the affected area.`,`وكمان هو الطريقة المفضّلة لما يحتاجوا يطبّقوا قوة أكبر على المنطقة المصابة.`,`لو الكسر محتاج شدّ قوي بيبقى ده الاختيار.`],
[`The force is directly applied to the bone, which means more weight can be added with less risk of damaging the surrounding soft tissues.`,`القوة بتتطبّق على العضمة مباشرةً، وده معناه إن ينفع يتضاف وزن أكتر بخطر أقل على الأنسجة الرخوة اللي حواليها.`,`الشدّ على العضمة نفسها فالجلد والعضلات مش بتتأذّى.`],
['IMG',4,`Skeletal traction`]
]},
{t:`Skin Traction`,k:`Skin`,i:[
[`Skin traction is less invasive than skeletal traction.`,`الجر الجلدي أقل تدخّلاً (invasive) من الجر الهيكلي.`,`مفيش حاجة بتدخل في العضمة.`],
[`It involves applying splints, bandages, or adhesive tapes to the skin directly below the fracture.`,`بيتم بتركيب جبائر أو ضمادات أو شرايط لاصقة على الجلد مباشرةً تحت الكسر.`,`الشدّ بيتعمل من على سطح الجلد.`],
[`Once the material has been applied, weights are fastened to it.`,`أول ما المادة دي تتركّب، بيتربط فيها أوزان.`,`الوزن متعلّق في اللاصق أو الضماد.`],
[`The affected body part is then pulled into the right position using a pulley system attached to the hospital bed.`,`بعدها الجزء المصاب بيتشدّ لوضعه الصح باستخدام نظام بكرات متركّب في سرير المستشفى.`,`البكرة على السرير بتوجّه الشدّ.`],
[`Skin traction is used when the soft tissues, such as the muscles and tendons, need to be repaired.`,`الجر الجلدي بيتستخدم لما الأنسجة الرخوة زي العضلات والأوتار تحتاج إصلاح.`,`المشكلة هنا في الأنسجة الرخوة.`],
[`Less force is applied during skin traction to avoid irritating or damaging the skin and other soft tissues.`,`بيتطبّق فيه قوة أقل عشان ميهيّجش أو يتلف الجلد والأنسجة الرخوة التانية.`,`الشدّ على الجلد، فلازم يبقى خفيف.`],
[`it's usually used as a temporary way to stabilize a broken bone until the definitive surgery is performed.`,`وغالباً بيتستخدم كوسيلة مؤقتة لتثبيت العضمة المكسورة لحد ما تتعمل الجراحة النهائية.`,`حل مؤقت لحد العملية.`],
['IMG',5,`Skin traction`]
]},
{t:`The purpose of traction`,k:`Purpose of Traction`,i:[
[`Decrease muscle spasms`,`تقليل تشنجات العضلات.`,`الشدّ بيريّح العضلة.`],
[`Immobilize fractures (e.g. femur fractures that cannot be immobilized in a cast).`,`تثبيت الكسور (زي كسور الفخذ اللي مينفعش تتثبّت في جبس).`,`في كسور الجبس مش كفاية فيها، فبنستخدم الجر.`],
[`Correct or prevent deformity`,`تصحيح التشوه أو منعه.`,`يعني العضمة متتلحمش غلط.`],
[`Increase space between joint surfaces`,`زيادة المسافة بين أسطح المفصل.`,`الشدّ بيباعد سطح المفصل عن التاني شوية.`]
]},
{t:`Collaborative Problems and Potential Complications`,k:`Complications`,i:[
[`Pressure ulcer`,`قرح الضغط.`,`من قعاد المريض كتير على نفس الوضع.`],
[`Pneumonia`,`الالتهاب الرئوي.`,`مشكلة بتتعمل من قلة الحركة.`],
[`Constipation`,`الإمساك.`,`قلة الحركة بتبطّأ الأمعاء.`],
[`Anorexia`,`فقدان الشهية.`,`المريض مش عايز ياكل.`],
[`Urinary stasis and infection`,`ركود البول والعدوى.`,`البول مش بيتصرّف كويس فبيحصل التهاب.`],
[`DVT`,`جلطة الأوردة العميقة (Deep Vein Thrombosis).`,`جلطة في الوريد العميق، غالباً في الرجل.`]
]},
{t:`Assessment`,k:`Assessment`,i:[
[`Assess the client for the following while in traction.`,`قيّم المريض في النقط الجاية وهو في الجر.`,`دي قايمة اللي هتتابعه.`],
[`Monitor skin integrity of the affected part before and after traction placement.`,`راقب سلامة جلد الجزء المصاب قبل وبعد تركيب الجر.`,`شوف الجلد قبل وبعد.`],
[`Assess the skin, especially bony prominences for breakdown.`,`قيّم الجلد خصوصاً النتوءات العظمية عشان تشوف في تقرّح ولا لأ.`,`الأماكن اللي العضم بارز فيها بتتقرّح بسرعة.`],
[`Assess neurovascular status.`,`قيّم الحالة العصبية الوعائية.`,`الأعصاب والدورة الدموية في الطرف.`],
[`Monitor respiratory status, including rate and patter, breath and lung sounds, ability to cough and breathe deeply.`,`راقب حالة التنفس، شاملة المعدل والنمط، وأصوات التنفس والرئة، وقدرته على الكحّ والتنفس العميق.`,`المريض الراقد بيبقى عنده مشكلة تنفّس.`],
[`Evaluate muscle strength and tone and mobility in affected and unaffected areas.`,`قيّم قوة العضلات وشدّتها والحركة في المناطق المصابة والسليمة.`,`شوف الاتنين: المصاب والسليم.`],
[`Assess mental status, noting level of orientation, effectiveness of coping and behavior.`,`قيّم الحالة العقلية، مع ملاحظة مستوى التوجّه، وفعالية التكيّف، والسلوك.`,`يعني واعي ومركّز ولا لأ، وبيتأقلم ولا لأ.`],
[`Regularly check the condition of the traction equipment: ropes, pulleys, and weights.`,`افحص حالة معدات الجر بشكل منتظم: الحبال والبكرات والأوزان.`,`لو الحبل أو البكرة وقفوا الجر مش هيشتغل.`],
[`For the client in skeletal traction, assess the pin site for signs and symptoms of infection.`,`للمريض في الجر الهيكلي: قيّم مكان الدبوس عشان تشوف علامات وأعراض العدوى.`,`الدبوس داخل في العضمة فمكانه ممكن يتلوّث.`]
]},
{t:`Nursing Diagnosis (Traction)`,k:`Traction Dx`,i:[
[`Deficient knowledge related to the treatment regimen`,`نقص معرفة بسبب خطة العلاج.`,`المريض مش فاهم العلاج.`],
[`Anxiety related to health status and the traction device`,`قلق بسبب الحالة الصحية وجهاز الجر.`,`المريض متوتر من حالته ومن الجهاز.`],
[`Acute pain related to musculoskeletal disorder`,`ألم حاد بسبب اضطراب العضلات والعظام.`,`ألم الإصابة.`],
[`Self-care deficit: feeding, bathing/hygiene and/or toileting related to traction`,`قصور في العناية بالنفس: الأكل، الاستحمام والنظافة و/أو استخدام الحمام، بسبب الجر.`,`الجر بيحدّ من قدرته يخدم نفسه.`],
[`Impaired physical mobility related to musculoskeletal disorder and traction`,`ضعف في الحركة الجسدية بسبب اضطراب العضلات والعظام والجر.`,`الإصابة والجر بيمنعوا الحركة.`],
[`Impaired skin integrity related to traction`,`تلف سلامة الجلد بسبب الجر.`,`الجر نفسه ممكن يأذي الجلد.`]
]},
{t:`Nursing Management (Traction)`,k:`Traction Mgmt`,i:[
[`Promote measures to prevent complication of immobility.`,`شجّع الإجراءات اللي بتمنع مضاعفات قلة الحركة.`,`عشان المريض الراقد ميتعبش من الرقاد نفسه.`],
[`Place a bed-board under the client's mattress to ensure extra firm support.`,`حط لوح (bed-board) تحت مرتبة المريض عشان تضمن دعم صلب زيادة.`,`المرتبة الطرية ممكن تبوظ وضع الشدّ.`],
[`Turn and reposition the client regularly within the limitation of traction.`,`اقلب المريض وغيّر وضعه بانتظام في حدود ما يسمح به الجر.`,`تغيّره بس من غير ما تبوّظ الشدّ.`],
[`Prevent constipation by increasing the client's fluid intake to 20000 to 20500ml and provide a balanced diet high in fiber.`,`امنع الإمساك بزيادة السوائل للمريض لـ 20000 – 20500 مل (زي ما هو مكتوب في المحاضرة)، وقدّم غذاء متوازن غني بالألياف.`,`السوائل والألياف بيحرّكوا الأمعاء.`],
[`Promote skin integrity.`,`شجّع الحفاظ على سلامة الجلد.`,`الجلد لازم يفضل سليم.`],
[`Use a special mattress to preserve skin integrity.`,`استخدم مرتبة خاصة عشان تحافظ على سلامة الجلد.`,`مرتبة بتقلّل الضغط على الجلد.`],
[`Keep bed linen free of wrinkles to prevent skin breakdown.`,`خلّي ملايات السرير من غير تجاعيد عشان تمنع تهتّك الجلد.`,`التجاعيد بتضغط على الجلد وتعمل قرح.`],
[`Provide frequent skin care to areas of potential pressures`,`قدّم عناية متكررة بالجلد في المناطق المعرّضة للضغط.`,`اهتم بالأماكن اللي بيتحط عليها الضغط.`],
[`Inspect the skin traction for signs of skin breakdown. .`,`افحص الجر الجلدي عشان تشوف علامات تهتّك الجلد.`,`شوف مكان اللاصق والضماد على الجلد.`],
[`Inspect the skeletal traction sites for signs of irritation or infection.`,`افحص أماكن الجر الهيكلي عشان تشوف علامات تهيّج أو عدوى.`,`أماكن الدبابيس بتتفحّص.`],
[`Assess pin entrance and exit sites and areas surrounding pin sites at least twice each day.`,`قيّم مكان دخول وخروج الدبوس والمناطق اللي حواليه مرتين في اليوم على الأقل.`,`مرتين يومياً كحد أدنى.`],
[`Clean pin sites as prescribed; never remove weights.`,`نضّف أماكن الدبابيس زي ما هو متوصّف، ومتشيلش الأوزان أبداً.`,`النضافة تتعمل، لكن الوزن يفضل متعلّق.`],
[`Provide client teaching`,`قدّم تثقيف للمريض.`,`المريض لازم يعرف يساعد نفسه.`],
[`Encourage active exercises for unaffected body parts.`,`شجّع التمارين النشطة للأجزاء السليمة من الجسم.`,`الأجزاء السليمة تفضل شغّالة.`],
[`Encourage the use of a trapeze, if indicated.`,`شجّع استخدام المثلث (trapeze) لو مطلوب.`,`حاجة فوق السرير المريض يمسكها ويتحرك.`],
[`Promote deep breathing exercises hourly`,`شجّع تمارين التنفس العميق كل ساعة.`,`بتمنع مشاكل الرئة اللي ذكرناها.`],
[`Promote self-care within traction limitation.`,`شجّع العناية بالنفس في حدود ما يسمح به الجر.`,`يخدم نفسه على قد ما يقدر.`]
]}
];

/* ---- render ---- */
let total=0,html='',chips='';
D.forEach((s,si)=>{
  let n=0,body='';
  s.i.forEach(x=>{
    if(x[0]==='IMG'){body+=`<figure><img src="${IMGS[x[1]]}" alt="${x[2]}" loading="lazy"><figcaption>${x[2]}</figcaption></figure>`;}
    else{n++;total++;body+=`<div class="it"><div class="en">${x[0]}</div><div class="ar"><i class="fa-solid fa-language"></i>${x[1]}</div><div class="ex"><b>عشان تفهمها :</b> ${x[2]}</div></div>`;}
  });
  html+=`<section id="s${si}"><div class="sh"><i class="fa-solid fa-bone"></i> ${s.t}<span class="n">${n}</span></div>${body}</section>`;
  chips+=`<a href="#s${si}" data-i="s${si}">${s.k}</a>`;
});
document.getElementById('app').innerHTML=html;
document.getElementById('chips').innerHTML=chips;
document.getElementById('cnt').textContent=total+' جملة';

/* ---- progress / chips / top ---- */
const up=document.getElementById('up'),pr=document.getElementById('prog');
addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-innerHeight;
  pr.style.width=(h>0?scrollY/h*100:0)+'%';
  up.classList.toggle('show',scrollY>500);
  let cur=null;document.querySelectorAll('section').forEach(s=>{if(s.getBoundingClientRect().top<150)cur=s.id});
  document.querySelectorAll('.chips a').forEach(a=>a.classList.toggle('on',a.dataset.i===cur));
},{passive:true});
up.onclick=()=>scrollTo({top:0,behavior:'smooth'});

/* ---- theme ---- */
const tb=document.getElementById('tb');
let th='light';try{th=localStorage.getItem('theme')||'light'}catch(e){}
function setTh(t){th=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');tb.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}}
setTh(th);tb.onclick=()=>setTh(th==='dark'?'light':'dark');
</script>
