<script>
/* '#' = subheading · [en, ar, ex] · 'IMG' = figure */
const S=[
['Glaucoma – Definition',[
['The term glaucoma is used to refer to a group of ocular conditions characterized by optic nerve damage.','كلمة جلوكوما بتطلق على مجموعة أمراض في العين (ocular) كلها فيها تلف في العصب البصري.','العصب البصري زي كابل بيوصل الصورة من العين للمخ؛ لو الكابل اتهرّى الصورة بتضعف حتى لو العين سليمة.'],
['The optic nerve damage is related to the IOP caused by congestion of aqueous humor in the eye.','تلف العصب سببه ارتفاع ضغط العين (IOP = Intraocular Pressure) بسبب احتقان وتجمّع السائل المائي (aqueous humor) جوه العين.','حوض والحنفية شغالة والبالوعة مسدودة: المية بتعلى وتضغط على اللي حواليها.']]],
['Risk factors',[
['Family history of glaucoma','تاريخ عائلي: لو حد من العيلة عنده جلوكوما فاحتمالك أكتر.','زي السكر لما بيبقى في العيلة كلها.'],
['Thin cornea','قرنية رفيعة (القرنية هي الطبقة الشفافة قدام العين).','عينان قرنيتها أرفع من الطبيعي، دي علامة خطر لازم الدكتور ياخد باله منها.'],
['African American race','الأصل الأفريقي الأمريكي أكتر عرضة.','زي أمراض بتنتشر في فئات معينة أكتر من غيرها.'],
['Older age','كبر السن.','زي مواسير البيت القديمة بتضعف مع السنين.'],
['Diabetes mellitus','مرض السكر.','السكر بيأثر على الأوعية والأعصاب في الجسم كله ومنها العين.'],
['Cardiovascular disease','أمراض القلب والأوعية الدموية.','لو الدورة الدموية تعبانة، العصب في العين بيتأثر معاها.'],
['Nearsightedness (myopia)','قصر النظر (مش شايف البعيد).','اللي بيلبس نضارة عشان يشوف السبورة من بعيد.'],
['Eye trauma','إصابة العين.','خبطة كورة في العين.'],
['Prolonged use of topical or systemic corticosteroids','استخدام الكورتيزون لفترة طويلة: موضعي (topical) زي القطرة والمرهم، أو جهازي (systemic) زي الحبوب والحقن.','واحد بياخد كورتيزون شهور لحساسية، لازم ضغط عينه يتتابع.']]],
['Types of glaucoma',[
['Primary glaucoma has two forms:','الجلوكوما الأولية (Primary) ليها شكلين، يعني بتحصل من نفسها من غير مرض تاني يسببها.','زي صداع جه من نفسه، مش بسبب برد ولا حاجة.'],
['Open-angle (also known as chronic, simple, or wide-angle glaucoma)','زاوية مفتوحة: اسمها كمان مزمنة (chronic) أو بسيطة أو واسعة الزاوية.','Chronic يعني مزمنة، تفتكرها: «مفتوحة ومزمنة».'],
['Angle-closure (also known as acute or narrow-angle) glaucoma.','زاوية مغلقة: اسمها كمان حادة (acute) أو ضيقة الزاوية.','مخرج السائل بيتقفل فجأة، زي باب اتقفل في وشك.'],
['Angle-closure glaucoma attacks suddenly and may cause permanent vision loss in 48 to 72 hours.','الزاوية المغلقة بتهجم فجأة وممكن تسبب فقدان بصر دائم في 48 لـ 72 ساعة (يومين لتلاتة).','مريض جاله وجع عين شديد فجأة وسابه من غير علاج يومين، ممكن يفقد النظر للأبد، فدي طوارئ.'],
['Secondary glaucoma to other causes, such as injury, infection, surgery, or prolonged topical corticosteroid use.','الجلوكوما الثانوية (Secondary): سببها حاجة تانية زي إصابة أو عدوى أو جراحة أو كورتيزون موضعي لفترة طويلة.','واحد اتضرب في عينه، وبعد فترة ضغط العين زاد بسبب الضربة.']]],
['Clinical Manifestations',[
['“Silent thief” of vision','«لص النظر الصامت»: بيسرق النظر من غير ما تحس.','زي حرامي بيسرق شوية شوية من غير صوت.'],
['unaware of the condition until there is significant vision loss','المريض مش بيعرف إنه عيان إلا لما النظر يضعف بشكل كبير.','المخ بيكمل الصورة الناقصة، فمحدش بياخد باله بدري.'],
['peripheral vision loss','فقدان النظر الجانبي (أطراف مجال الرؤية).','تبص من ماسورة: شايف اللي قدامك بس مش شايف الجنب.'],
['blurring','زغللة في النظر.','زي نضارة عليها بخار.'],
['halos','ظهور هالات حوالين الأنوار.','بتبص على لمبة الشارع بالليل تلاقي حواليها دايرة.'],
['difficulty focusing','صعوبة في تركيز النظر.','عايز تبص على حاجة وعينك مش راضية تثبت عليها.'],
['difficulty adjusting eyes to low lighting','صعوبة إن العين تتأقلم مع الإضاءة الضعيفة.','تدخل سينما أو أوضة ضلمة وتفضل مش شايف.'],
['May also have aching or discomfort around eyes or headache','ممكن كمان يحس بوجع أو انزعاج حوالين العين أو صداع.','واحد بيشتكي صداع ووجع ورا عينه وبياخد مسكن، والسبب ضغط العين.'],
['Pallor and cupping of the optic nerve disc; as the optic nerve damage increases, visual perception in the area is lost.','شحوب (Pallor) وتجويف (Cupping) في قرص العصب البصري، وكل ما التلف يزيد النظر في المنطقة دي بيختفي.','القرص السليم لونه وردي، لما العصب يموت يبقى باهت ومحفور من النص زي كوباية.']]],
['Diagnostic Methods',[
['Ocular and medical history (to investigate predisposing factors)','تاريخ العين والتاريخ المرضي (عشان نعرف العوامل المهيئة للمرض).','الدكتور يسأل: حد في العيلة عنده جلوكوما؟ بتاخد كورتيزون؟ عندك سكر؟'],
['Diagnostic tests include:','الفحوصات التشخيصية هي:',''],
['Tonometry (measures IOP)','قياس ضغط العين.','زي جهاز ضغط الدم بس للعين.'],
['Ophthalmoscopy (to inspect the optic nerve)','فحص قاع العين عشان نشوف العصب البصري.','الدكتور بكشاف وعدسة يبص جوه العين.'],
['Gonioscopy (to examine the filtration angle of the anterior chamber)','فحص زاوية التصفية في الغرفة الأمامية (المكان اللي السائل بيخرج منه).','تبص على فتحة البالوعة تشوفها مفتوحة ولا مسدودة.'],
['Perimetry (visual fields assessment) are major diagnostic tests.','قياس مجال الإبصار، وده من أهم الفحوصات.','تبص على نقطة قدامك وتقول كل ما تشوف ضوء ظهر على الجنب.']]],
['Complications',[
['If untreated, glaucoma can progress from gradual vision loss to total blindness','لو مااتعالجتش، الجلوكوما بتتطور من فقدان تدريجي للنظر لحد العمى الكامل.','ضرس مسوّس وسايبه من غير علاج لحد ما يتخلع.']]],
['Treatment',[
['The aim of all glaucoma treatment is prevention of optic nerve damage.','هدف كل علاج الجلوكوما هو منع تلف العصب البصري.','تقفل التسريب قبل ما البيت يغرق.'],
['Treatment focuses on pharmacologic therapy, laser procedures, surgery, or a combination of these approaches','العلاج بيركز على الأدوية أو الليزر أو الجراحة أو مجموعة منهم.','واحد يبدأ بقطرة، ولو مانفعتش يعمل ليزر.'],
['The goal is to maintain an IOP within a range unlikely to cause further damage.','الهدف إن ضغط العين يفضل في مدى مايسببش تلف زيادة.','زي مريض الضغط، هدفه يفضل ضغطه في المدى الآمن.'],
'#Pharmacologic Therapy',
['Medical management of glaucoma relies on systemic and topical ocular medications that lower IOP.','العلاج الدوائي بيعتمد على أدوية جهازية (حبوب/حقن) وموضعية للعين (قطرة) بتخفض ضغط العين.','قطرة في العين + حبة بالبق لو الدكتور شايف كده.'],
['Periodic follow-up examinations are essential to monitor IOP, the appearance of the optic nerve, the visual fields, and side effects of medications.','لازم متابعة دورية عشان نراقب ضغط العين وشكل العصب ومجال الإبصار والآثار الجانبية للأدوية.','زي مريض السكر بيقيس سكره كل فترة.'],
['Patient is usually started on the lowest dose of topical medication and then advanced to increased concentrations until the desired IOP level is reached and maintained.','المريض بيبدأ عادةً بأقل تركيز قطرة، وبيزود التركيز لحد ما الضغط يوصل للمستوى المطلوب ويثبت.','زي الأكل الحراق: تبدأ بقليل وتزود لحد ما يظبط.'],
['One eye is treated first, with the other eye used as a control in determining the efficacy of the medication.','بيعالجوا عين الأول والعين التانية بتتساب كـ control عشان نعرف الدوا بيشتغل ولا لأ.','لو العين اللي اتعالجت ضغطها نزل والتانية لأ، يبقى القطرة شغالة.'],
['Several types of ocular medications are used to treat glaucoma, including','في أنواع كتير من أدوية العين بتتستخدم، منها:',''],
['miotics (medications that cause pupillary constriction)','Miotics: أدوية بتضيّق الحدقة.','Miosis = حدقة صغيرة زي النقطة.'],
['adrenergic agonists (ie, sympathomimetic agents)','Adrenergic agonists: أدوية منبهة للسمبثاوي (sympathomimetic).','تشبه شغل الأدرينالين.'],
['beta-blockers','Beta-blockers: حاصرات بيتا.','نفس مجموعة أدوية بتتاخد للقلب والضغط، بس هنا قطرة.'],
['alpha2-agonists (ie, adrenergic agents)','Alpha2-agonists: منبّهات ألفا 2 (adrenergic agents).','مجموعة تانية من أدوية الأدرينالين.'],
['carbonic anhydrase inhibitors','Carbonic anhydrase inhibitors: مثبطات إنزيم الكربونيك أنهيدريز.','اسم طويل، احفظه بالحروف CAI.'],
['and prostaglandins.','والبروستاجلاندينز (prostaglandins).','مجموعة أخيرة في القايمة، متنساهاش.'],
'#Surgical Management',
['Laser trabeculoplasty or iridotomy indicated when IOP is inadequately controlled by medications.','الليزر (trabeculoplasty أو iridotomy) بيتعمل لما الأدوية مش بتتحكم في الضغط كفاية.','جربت قطرة وضغطك لسه عالي، يبقى الليزر.'],
['Filtering procedures: an opening or a fistula in the trabecular meshwork; trabeculectomy is standard technique.','عمليات التصفية: بيعملوا فتحة أو ناسور في الشبكة التربيقية، وعملية trabeculectomy هي الطريقة القياسية.','زي ما تفتح مخرج جديد للمية.'],
['Drainage implant or shunt surgery may be performed.','ممكن يتعمل زرع تصريف أو shunt.','أنبوبة صغيرة بتصرّف السائل.'],
['Trabectome surgery is reserved for patients in whom pharmacologic treatment and/or laser trabeculoplasty do not control the IOP sufficiently.','عملية Trabectome بتتحفظ للمرضى اللي الأدوية و/أو الليزر ماسيطروش على الضغط عندهم كفاية.','آخر حل بعد ما كل اللي قبله فشل.']]],
['Nursing diagnoses (Glaucoma)',[
['Acute pain','ألم حاد.','مريض الزاوية المغلقة بيجيله وجع عين شديد.'],
['Anxiety','قلق.','خايف على نظره.'],
['Disturbed sensory perception: Visual','اضطراب الإدراك الحسي: البصري.','مش شايف الجنب.'],
['Fear','خوف.','خايف من العملية أو العمى.'],
['Risk for injury','خطر الإصابة.','بيخبط في الأثاث بسبب ضعف النظر الجانبي.']]],
['Outcomes (Glaucoma)',[
['The patient will express feelings of comfort.','المريض هيعبّر عن إحساسه بالراحة.','يقول «الوجع خف».'],
['The patient will identify strategies to reduce anxiety.','المريض هيحدد طرق تقلل قلقه.','يقول «لما بفهم اللي هيحصل بهدى».'],
['The patient will regain normal visual functioning.','المريض هيرجّع وظيفة النظر الطبيعية.','يقدر يشوف ويتحرك عادي.'],
['The patient and family will express their feelings and concerns.','المريض وأهله هيعبّروا عن مشاعرهم ومخاوفهم.','الأهل يسألوا ويقولوا اللي مضايقهم.'],
['The patient will avoid injury.','المريض هيتجنب الإصابة.','مفيش وقعة ولا خبطة.']]],
['Nursing interventions (Glaucoma)',[
['For the patient with angle-closure glaucoma, give medications, as ordered, and prepare him physically and psychologically for laser iridotomy or surgery.','لمريض الزاوية المغلقة: اديه الأدوية زي ما مكتوب، وجهزه جسمانياً ونفسياً لليزر iridotomy أو الجراحة.','تشرحله الخطوات وتطمنه قبل ما ينزل العمليات.'],
['Remember to administer cycloplegic eyedrops in the affected eye only. In the unaffected eye, these drops may precipitate an attack of angle-closure glaucoma and threaten the patient\'s residual vision.','افتكر: قطرة cycloplegic تتحط في العين المصابة بس، لأن في العين السليمة ممكن تسبب نوبة زاوية مغلقة وتهدد النظر المتبقي.','لو حطيتها في العين السليمة بالغلط، ممكن تطلع نوبة فيها كمان.'],
['After trabeculectomy, give medications, as ordered, to dilate the pupil. Also apply a topical corticosteroid, as ordered, to reduce inflammation.','بعد trabeculectomy: اديه الأدوية اللي بتوسع الحدقة زي المكتوب، وحط كورتيكوستيرويد موضعي عشان يقلل الالتهاب.','قطرة لتوسيع الحدقة + قطرة كورتيزون للالتهاب.'],
['After surgery, protect the affected eye by applying an eye patch and shield, positioning the patient on his back or unaffected side, and following general safety measures.','بعد الجراحة: احمي العين المصابة بـ patch وshield، ونيّم المريض على ضهره أو على الجنب السليم، واتبع إجراءات الأمان العامة.','ماينامش على العين اللي اتعملت.'],
['Administer pain medication as ordered.','اديه مسكن الألم زي المكتوب.','مسكن في ميعاده.'],
['Encourage ambulation immediately after surgery.','شجعه يتحرك ويمشي على طول بعد الجراحة.','يقوم من السرير بدري.'],
['Encourage the patient to express any concerns he may have about having a chronic condition.','شجعه يعبّر عن أي مخاوف عنده من إنه عنده مرض مزمن.','تسمعه من غير ما تقاطعه.']]],
['Patient teaching (Glaucoma)',[
['Stress the importance of strictly adhering to the prescribed drug therapy to maintain low IOP and prevent optic disk changes that cause vision loss.','أكد على الالتزام الصارم بالعلاج عشان الضغط يفضل واطي ونمنع تغيرات قرص العصب اللي بتسبب فقدان النظر.','زي مريض الضغط لو وقف الدوا.'],
['Explain all procedures and treatments, especially surgery, to help reduce the patient’s anxiety.','اشرح كل الإجراءات والعلاجات، خصوصاً الجراحة، عشان تقلل قلقه.','اللي يعرف هيخاف أقل.'],
['Inform the patient that lost vision can’t be restored but that treatment can usually prevent further loss.','قوله إن النظر اللي راح مابيرجعش، لكن العلاج غالباً بيمنع خسارة زيادة.','اللي راح راح، بس نحافظ على الباقي.'],
['Instruct the patient’s family how to modify his environment for safety. For example, suggest keeping pathways clear and reorienting the patient to room layouts, if necessary.','علّم أهله يعدّلوا البيئة للأمان، مثلاً يسيبوا الطرق فاضية ويعرّفوه تاني على ترتيب الأوضة لو لزم.','ماتغيّرش مكان الأثاث من غير ما تقوله.'],
['Teach the patient signs and symptoms that require immediate medical attention, such as sudden vision change or eye pain.','علّمه العلامات اللي تستدعي تدخل طبي فوري، زي تغير النظر فجأة أو وجع العين.','نظره اتغير فجأة؟ ماتستناش وروح للدكتور.'],
['Discuss the importance of glaucoma screening for early detection and prevention. Point out that all people older than age 35, especially those with a family history of glaucoma, should have an annual tonometric examination.','ناقش أهمية الفحص المبكر للجلوكوما. نبّه إن كل اللي فوق 35 سنة، خصوصاً اللي عندهم تاريخ عائلي، لازم يقيسوا ضغط العين (tonometric) كل سنة.','شخص عمره 40 وأبوه عنده جلوكوما، يقيس ضغط عينه كل سنة.']]],
['IMG'],
['Cataracts – Definition',[
['It is a lens opacity or cloudiness','هي عتامة أو تغيّم في عدسة العين.','زي إزاز الشباك لما بيتغطي بغبار.'],
['Cataracts can develop in one or both eyes and at any age.','المياه البيضاء ممكن تحصل في عين واحدة أو الاتنين وفي أي سن.','حتى الأطفال ممكن يتولدوا بيها.']]],
['Risk factors (Cataract)',[
'#1- Aging',
['Loss of lens transparency','فقدان شفافية العدسة.','العدسة بقت مش رائقة.'],
['Clumping or aggregation of lens protein (which leads to light scattering)','تكتّل بروتين العدسة، وده بيخلي الضوء يتشتت.','زي بياض البيض لما بيتسلق، بيتحول لمعتم.'],
['Accumulation of a yellow-brown pigment due to the breakdown of lens protein','تراكم صبغة صفراء-بنية بسبب تكسّر بروتين العدسة.','العدسة بتصفر زي ورق قديم.'],
['Decreased oxygen uptake','قلة استهلاك الأكسجين.','العدسة بتتغذى أقل.'],
['Increase in sodium and calcium','زيادة الصوديوم والكالسيوم.','أملاح بتتراكم في العدسة.'],
['Decrease in levels of vitamin C, protein, and glutathione (an antioxidant)','نقص فيتامين C والبروتين والجلوتاثيون (مضاد أكسدة).','المضادات بتحمي العدسة، لما بتقل الحماية بتقل.'],
'#2- Associated Ocular Conditions',
['Retinitis pigmentosa','التهاب الشبكية الصباغي.','مرض وراثي في الشبكية.'],
['Myopia','قصر النظر.','اللي بيلبس نضارة عشان البعيد.'],
['Retinal detachment and retinal surgery','انفصال الشبكية وجراحات الشبكية.','الشبكية اتفصلت أو اتعملها عملية.'],
['Infection (eg, herpes zoster)','العدوى (مثلاً الهربس النطاقي herpes zoster).','فيروس الحزام الناري.'],
'#3- Toxic Factors',
['Corticosteroids, especially at high doses and in long-term use','الكورتيزون، خصوصاً بجرعات عالية ولمدة طويلة.','أخد كورتيزون بجرعة كبيرة شهور.'],
['Alkaline chemical eye burns, poisoning','حروق العين بمواد كيميائية قلوية، والتسمم.','مادة منظفة قلوية اتناثرت في العين.'],
['Cigarette smoking','التدخين.','سجاير كتير على مدار سنين.'],
['Calcium, copper, iron, gold, silver, and mercury, which tend to deposit in the pupillary area of the lens','الكالسيوم والنحاس والحديد والدهب والفضة والزئبق، بتميل تترسب في منطقة الحدقة من العدسة.','معادن بتترسب في نص العدسة.'],
'#4- Nutritional Factors',
['Reduced levels of antioxidants','قلة مضادات الأكسدة.','قلة فواكه وخضار.'],
['Poor nutrition','سوء التغذية.','أكل ناقص القيمة الغذائية.'],
['Obesity','السمنة.','وزن زيادة.'],
'#5- Physical Factors',
['Dehydration associated with chronic diarrhea, use of purgatives in anorexia nervosa, and use of hyperbaric oxygenation','الجفاف المرتبط بالإسهال المزمن، أو استخدام الملينات في فقدان الشهية العصبي (anorexia nervosa)، أو العلاج بالأكسجين تحت الضغط العالي.','جسم بيفقد سوائل كتير فالعدسة تتأثر.'],
['Blunt trauma, perforation of the lens with a sharp object or foreign body, electric shock','إصابة بجسم غير حاد (blunt)، أو ثقب العدسة بجسم حاد أو جسم غريب، أو صدمة كهربائية.','دبوس دخل العين.'],
['Ultraviolet radiation in sunlight and x-ray','الأشعة فوق البنفسجية في الشمس والأشعة السينية.','التعرض للشمس من غير نضارة شمس.'],
'#6- Systemic Diseases and Syndromes',
['Diabetes mellitus','مرض السكر.','السكر العالي بيأثر على عدسة العين.'],
['Down syndrome','متلازمة داون.','طفل عنده Down syndrome.'],
['Disorders related to lipid metabolism','اضطرابات أيض الدهون.','مشاكل في الدهون بالجسم.'],
['Renal disorders','أمراض الكلى.','الفشل الكلوي.'],
['Musculoskeletal disorders','اضطرابات العضلات والعظام.','أمراض العضلات والعظام.']]],
['Types of Cataract',[
['Cataracts are classified by their causes.','المياه البيضاء بتتقسم حسب أسبابها.','زي ما بنقسم الصداع حسب سببه.'],
['Senile cataracts develop in elderly people, probably because of chemical changes in lens proteins.','Senile: بتحصل للكبار في السن غالباً بسبب تغيرات كيميائية في بروتينات العدسة.','Senile = شيخوخة.'],
['Congenital cataracts occur in neonates from inborn errors of metabolism or from maternal rubella infection during the first trimester; these cataracts may also result from a congenital anomaly or from genetic causes.','Congenital: خلقية، بتحصل للمواليد بسبب أخطاء أيض ولادية أو عدوى الأم بالحصبة الألماني (rubella) في أول 3 شهور حمل، أو تشوه خلقي أو أسباب وراثية.','أم اتصابت بالـ rubella في الشهر الأول فالطفل اتولد بيها.'],
['Traumatic cataracts develop after a foreign body injures the lens with sufficient force to allow aqueous or vitreous humor to enter the lens capsule.','Traumatic: بتحصل بعد إن جسم غريب يجرح العدسة بقوة كفاية لدرجة إن السائل المائي أو الزجاجي يدخل كبسولة العدسة.','شظية دخلت العين وخرمت العدسة.'],
['Complicated cataracts occur secondary to glaucoma, retinitis pigmentosa, or retinal detachment. They can also occur with systemic disease (such as diabetes, or hypoparathyroidism) or from ionizing radiation or infrared rays.','Complicated: بتحصل ثانوية لجلوكوما أو التهاب الشبكية الصباغي أو انفصال الشبكية، أو مع أمراض جهازية (زي السكر أو قصور الغدة الجار درقية)، أو من أشعة مؤينة أو تحت الحمراء.','واحد عنده جلوكوما بقاله سنين وبعدها جاله مياه بيضا.'],
['Toxic cataracts result from drug or chemical toxicity with prednisone, ergot alkaloids, naphthalene, and phenothiazine.','Toxic: بتحصل من سمية دوا أو مادة كيميائية، زي prednisone وergot alkaloids وnaphthalene وphenothiazine.','واحد بياخد prednisone فترة طويلة.']]],
['Clinical Manifestations (Cataract)',[
['Painless, blurry vision.','نظر مزغلل من غير ألم.','عكس الجلوكوما الحادة اللي فيها وجع.'],
['Perception that surroundings are dimmer (as if glasses need cleaning).','إحساس إن اللي حواليك أغمق (كأن النضارة محتاجة تتنضف).','تمسح النضارة ومفيش فايدة.'],
['Light scattering; reduced contrast sensitivity, sensitivity to glare, and reduced visual acuity.','تشتت الضوء، وقلة الحساسية للتباين، وحساسية للوهج (glare)، وقلة حدة الإبصار.','نور عربية بالليل بيبهره.'],
['Other effects include','تأثيرات تانية:',''],
['Myopic shift (return of ability to do close work [eg, reading fine print] without eyeglasses)','Myopic shift: رجوع القدرة على الشغل القريب (زي قراية الكتابة الصغيرة) من غير نضارة.','عجوز فجأة بقى يقرا من غير نضارة.'],
['Astigmatism','الاستجماتيزم (انحراف في تركيز الصورة).','الصورة مش متساوية الوضوح في كل الاتجاهات.'],
['Monocular diplopia (double vision)','ازدواج الرؤية في عين واحدة.','تقفل عين وتفضل شايف حاجتين.'],
['Inspection with a penlight may reveal a milky white pupil and, with an advanced cataract, a grayish white area behind the pupil. As the cataract matures, the red reflex is lost.','بالكشاف الصغير (penlight) ممكن تشوف حدقة بيضا زي اللبن، ومع المياه المتقدمة منطقة رمادية بيضا ورا الحدقة. ولما المياه تنضج بيختفي الـ red reflex (الانعكاس الأحمر).','العين الطبيعية بتلمع أحمر من جوه، وبيختفي لما العدسة تعتم.']]],
['Diagnostic Methods (Cataract)',[
['Degree of visual acuity is directly proportionate to density of the cataract.','درجة حدة الإبصار بتتناسب طردياً مع كثافة المياه البيضاء.','العدسة أتخن، النظر أضعف.'],
['Snellen visual acuity test.','اختبار Snellen لحدة الإبصار.','لوحة الحروف الكبيرة والصغيرة.'],
['Ophthalmoscopy.','فحص قاع العين بالأوفثالموسكوب.','الدكتور بكشاف يبص جوه العين.'],
['Slit-lamp biomicroscopic examination.','الفحص بالميكروسكوب الحيوي (slit-lamp).','الجهاز اللي بتحط دقنك عليه.']]],
['Medical Management (Cataract)',[
['No nonsurgical (medications, eyedrops, eyeglasses) treatment cures cataracts or prevents age-related cataracts.','مفيش علاج غير جراحي (أدوية أو قطرات أو نضارات) بيعالج المياه البيضاء أو بيمنعها مع السن.','قطرات المياه البيضا اللي في السوق مش بتعالج.'],
'#Surgical Treatment',
['Surgical lens extraction and implantation of an intraocular lens (IOL) to correct the visual deficit is the treatment for a patient with cataract. The surgery is usually performed as a same-day, or outpatient, procedure.','العلاج هو استئصال العدسة بالجراحة وزرع عدسة داخل العين (IOL) تصحح النظر، وبتتعمل غالباً في نفس اليوم (outpatient).','تدخل الصبح وتروح البيت بعد الظهر.'],
['Surgical procedures include the following.','العمليات الجراحية تشمل:',''],
['Extracapsular cataract extraction, the most common procedure, involves removing the anterior lens capsule and cortex and leaving the posterior capsule intact.','Extracapsular: أشهر عملية، بيشيلوا الكبسولة الأمامية والقشرة ويسيبوا الكبسولة الخلفية سليمة.','زي ما تفتح الباب الأمامي لبيت وتفضي اللي جوه وتسيب الجدار الخلفي.'],
['Typically, this is done using phacoemulsification equipment, which fragments the lens with ultrasound.','غالباً بتتعمل بجهاز phacoemulsification اللي بيفتت العدسة بالموجات فوق الصوتية.','زي مثقاب بيكسر الحجر لحتت صغيرة.'],
['The fragments are then removed by irrigation and aspiration.','وبعدين الحتت بتتشال بالغسيل والشفط (irrigation and aspiration).','تغسل وتشفط.'],
['The surgeon then implants a posterior chamber IOL where the patient\'s own lens used to be. This procedure is appropriate for patients of all ages.','وبعدين الجراح بيزرع IOL في الغرفة الخلفية مكان العدسة الأصلية، والعملية دي مناسبة لكل الأعمار.','عدسة صناعية بدل العدسة المعتمة.'],
['Intracapsular cataract extraction involves removing the entire lens within the intact capsule by cryoextraction (the moist lens sticks to an extremely cold metal probe for easy and safe removal with gentle traction).','Intracapsular: بيشيلوا العدسة كلها جوه الكبسولة بالتبريد (cryoextraction): العدسة الرطبة بتلزق في مسبار معدن شديد البرودة وبتتشال بسهولة بشد خفيف.','زي لسانك لما يلزق في تلج.'],
['After the surgeon removes the lens, he implants an IOL in either the anterior or the posterior chamber. If the patient doesn\'t receive an IOL, he\'ll use contact lenses or aphakic glasses to correct vision.','بعد إزالة العدسة بيزرع IOL في الغرفة الأمامية أو الخلفية، ولو ماتزرعش IOL المريض هيستخدم عدسات لاصقة أو نضارة aphakic.','مفيش عدسة؟ نعوضها بنضارة أو لاصقة.']]],
['Nursing diagnoses (Cataract)',[
['Anxiety','قلق.','خايف من العملية.'],
['Deficient knowledge (diagnosis and treatment)','نقص المعرفة (بالتشخيص والعلاج).','مش عارف المياه البيضا دي إيه.'],
['Disturbed sensory perception: Visual','اضطراب الإدراك الحسي: البصري.','النظر مزغلل.'],
['Risk for infection','خطر العدوى.','عين اتفتحت في جراحة.'],
['Risk for injury','خطر الإصابة.','ممكن يخبط في حاجة بسبب ضعف النظر.']]],
['Outcomes (Cataract)',[
['The patient and his family will voice their feelings and concerns.','المريض وأهله هيعبّروا عن مشاعرهم ومخاوفهم.','يسألوا ويفضفضوا.'],
['The patient will verbalize understanding of the disease and treatment.','المريض هيقول بكلامه فهمه للمرض والعلاج.','يشرحلك المرض بأسلوبه.'],
['The patient will regain normal visual functioning.','المريض هيرجّع وظيفة النظر الطبيعية.','النظر يتحسن بعد العملية.'],
['The patient will show no signs or symptoms of infection.','المريض مش هتظهر عليه علامات عدوى.','مفيش احمرار ولا إفرازات.'],
['The patient will avoid injury.','المريض هيتجنب الإصابة.','مفيش وقعة.']]],
['Nursing interventions (Cataract)',[
['Postoperatively, monitor the patient until he recovers from the effects of the anesthetic. Keep the side rails of the bed up, monitor vital signs, and assist him with early ambulation.','بعد العملية راقب المريض لحد ما يفوق من البنج. سيب حواجز السرير مرفوعة، وراقب العلامات الحيوية، وساعده يمشي بدري.','ماتسيبوش لوحده وهو لسه نعسان.'],
['Apply an eye shield or eye patch postoperatively as ordered.','حط shield أو patch على العين بعد العملية زي المكتوب.','تحمي العين من الخبط والفرك.']]],
['Patient teaching (Cataract)',[
['Because the patient will be discharged after he recovers from the anesthetic, remind him to return for a checkup the next day. Caution him to avoid activities that increase intraocular pressure, such as straining with coughing, bowel movements, or lifting.','عشان المريض بيخرج بعد ما يفوق من البنج، فكّره يرجع يتفحص تاني يوم. حذره من أي نشاط بيزود ضغط العين زي الكحة بشدة والتبرز بمجهود والشيل.','ماتشيلش شنطة تقيلة بعد العملية.'],
['Teach the patient or family member how to instill ophthalmic ointment or drops.','علّم المريض أو حد من أهله إزاي يحط مرهم أو قطرة العين.','تسحب الجفن السفلي وتنقط جواه.'],
['If the patient has increased eye discharge, sharp eye pain (unrelieved by an analgesic), or deterioration in vision, instruct him to immediately notify the physician','لو زادت إفرازات العين، أو حصل وجع حاد مابيروحش بالمسكن، أو النظر ساء، قوله يبلغ الدكتور فوراً.','وجع جامد مع مسكن ومفيش فايدة؟ دكتور فوراً.']]]
];
