/* ============ MCQ — Easy ============ */
{t:"Meningitis is an inflammation of which structure?", o:["The neurons","The meninges","The cerebellum","The spinal nerve roots"], a:1},
{t:"Which two structures make up the Central Nervous System (CNS)?", o:["Autonomic and somatic divisions","Sympathetic and parasympathetic divisions","Brain and spinal cord","Cranial and spinal nerves"], a:2},

{t:"Which aspect is the MOST important part of the neurologic examination?", o:["Pupillary reaction only","Level of consciousness","Bladder function","Vital signs only"], a:1},

{t:"Which of the following is a bacterial cause of meningitis?", o:["Neisseria meningitidis","Herpes simplex virus","Rhinovirus","Candida albicans"], a:0},
{t:"Which test is the most informative diagnostic test for a patient with suspected meningitis?", o:["Chest X-ray","Electroencephalogram (EEG)","Blood glucose test","Lumbar puncture"], a:3},
{t:"Which sign is characteristic of meningitis and is described as pain when flexing the chin toward the chest?", o:["Photophobia","Nuchal rigidity","Petechial rash","Lethargy"], a:1},
{t:"Photophobia means:", o:["Fear of heights","Sensitivity to loud noise","Extreme sensitivity to light","Fear of water"], a:2},
{t:"Which are the three categories assessed by the Glasgow Coma Scale?", o:["Eye opening, best motor response, best verbal response","Pupil size, blood pressure, pulse","Orientation, memory, attention","Reflexes, sensation, coordination"], a:0},

{t:"The sympathetic division of the autonomic nervous system:", o:["Calms the body after arousal","Arouses the body","Carries information from the senses","Controls skeletal muscles only"], a:1},

{t:"Which test measures the time it takes for nerves to respond to stimulation?", o:["Evoked potentials (EPs)","Cerebral angiography","Pyelography","X-ray of the skull"], a:0},

/* ============ MCQ — Medium ============ */
{t:"Which cerebrospinal fluid (CSF) findings are typical of meningitis?", o:["High glucose, low protein, low WBC","Normal glucose, normal protein, normal WBC","Low glucose, high protein, high WBC","High glucose, high protein, low WBC"], a:2},

{t:"On the GCS motor scale, \"localizes pain\" is scored as:", o:["2","3","4","5"], a:3},
{t:"Which of the following is NOT a main function of the nervous system?", o:["Producing red blood cells","Maintaining homeostasis","Initiating appropriate responses","Receiving sensory information"], a:0},

{t:"Meningitis in patients with AIDS occurs as:", o:["An opportunistic infection","A genetic disorder","A nutritional deficiency","A drug side effect only"], a:0},
{t:"Which route of spread of meningitis occurs \"through the blood stream\"?", o:["Following a facial bone injury","Through aerosol contamination","Following an invasive procedure","As a consequence of other infections"], a:3},

{t:"A patient presents with fever, a severe throbbing headache, pain when the chin is flexed toward the chest, and sensitivity to light. Which condition is MOST likely?", o:["Migraine with aura","Meningitis","Tension headache","Otitis externa"], a:1},

{t:"Which nursing intervention is MOST appropriate for a patient with meningitis who has photophobia?", o:["Open the curtains to orient the patient","Keep the television on","Encourage visitors to stay longer","Reduce excessive light and noise"], a:3},
{t:"Which nursing diagnosis is most appropriate for a patient with headache, fever, and neck stiffness due to meningeal irritation?", o:["Impaired physical mobility","Acute pain","Disturbed sensory perception","Risk for impaired skin integrity"], a:1},
{t:"\"Disturbed Sensory Perception\" in meningitis is related to:", o:["Neurological impairment and altered level of consciousness","Fever and neck stiffness only","Neuromuscular impairment and weakness","Lack of vaccination"], a:0},
{t:"Which interventions are appropriate for a patient with meningitis and impaired physical mobility?", o:["Complete bed rest without repositioning","Restricting all activity","Range-of-motion exercises and regular repositioning","Avoiding skin assessment"], a:2},
{t:"Which of the following is a recognized complication of meningitis?", o:["Hypertensive retinopathy","Pyelonephritis","Hyperthyroidism","Cranial nerve dysfunction"], a:3},
{t:"Why are pressure-relieving devices used in a patient with meningitis who has impaired mobility?", o:["To reduce fever","To protect skin integrity","To control seizures","To improve orientation"], a:1},
{t:"A patient with bacterial meningitis begins to have seizures. Which treatment should the nurse anticipate?", o:["Antiemetic therapy","Antiviral therapy","Anticonvulsant therapy","Increased fluid restriction only"], a:2},
{t:"Which medication-purpose pair is correct in the management of meningitis?", o:["Antipyretics – for headache and body aches","Analgesics – for fever","Anticonvulsants – for nausea","Antiemetics – for significant nausea or vomiting"], a:3},
{t:"Which statement about viral meningitis is correct?", o:["It is always more severe than bacterial meningitis","Many cases do not have a specific antiviral therapy","It always requires IV antibiotics","It cannot cause fever"], a:1},

/* ============ True / False ============ */
{t:"Meningitis is inflammation of the meninges, the protective membranes surrounding the brain and spinal cord.", o:["True","False"], a:0},
{t:"A GCS score of less than 8 indicates coma.", o:["True","False"], a:0},
{t:"The highest possible GCS score is 12.", o:["True","False"], a:1},
{t:"The spinal cord is part of the peripheral nervous system.", o:["True","False"], a:1},
{t:"Level of consciousness is the most important aspect of the neurologic examination.", o:["True","False"], a:0},
{t:"Viral meningitis is always more severe than bacterial meningitis.", o:["True","False"], a:1},
{t:"A lumbar puncture is the most informative diagnostic test for a patient with suspected meningitis.", o:["True","False"], a:0},
{t:"CSF studies in meningitis typically show high glucose levels.", o:["True","False"], a:1},
{t:"Streptococcus pneumoniae can cause bacterial meningitis.", o:["True","False"], a:0},
{t:"Photophobia is extreme sensitivity to sound.", o:["True","False"], a:1},
{t:"Dexamethasone may be used as adjunctive therapy in selected cases, particularly when pneumococcal meningitis is suspected.", o:["True","False"], a:0},
{t:"Prompt administration of appropriate intravenous antibiotics is part of the treatment of bacterial meningitis.", o:["True","False"], a:0},
{t:"The nurse should increase light and noise stimulation to keep a patient with meningitis oriented.", o:["True","False"], a:1},
{t:"Otitis media and mastoiditis are not risk factors for meningitis.", o:["True","False"], a:1},
{t:"Disseminated intravascular coagulation (DIC) is a possible complication of meningitis.", o:["True","False"], a:0}
];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 40*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🫀', l:['#be123c','190,18,60','#9f1239','#be123c','#1e3a8a'], d:['#fb7185','251,113,133'] },
  { icon:'🫁', l:['#0d9488','13,148,136','#115e59','#0d9488','#0369a1'], d:['#2dd4bf','45,212,191'] },
  { icon:'🧪', l:['#d97706','217,119,6','#92400e','#d97706','#be123c'], d:['#fbbf24','251,191,36'] },
  { icon:'🩸', l:['#1d4ed8','29,78,216','#1e3a8a','#1d4ed8','#7c3aed'], d:['#60a5fa','96,165,250'] }
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
</html>
