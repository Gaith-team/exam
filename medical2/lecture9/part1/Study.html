<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --accent:#be123c; --accent-rgb:190,18,60; --c2:#1d4ed8; --c3:#d97706; --c4:#0d9488;
  --grad:linear-gradient(135deg,#9f1239 0%,#be123c 30%,#5b21b6 70%,#1e3a8a 100%);
  --grad-soft:linear-gradient(135deg,#be123c,#1d4ed8);
  --bg:#faf6f6; --bg2:#f3eaec; --card:#ffffff; --text:#2a1519; --text2:#5b4348; --text3:#8a7479;
  --bc:rgba(80,20,35,0.09); --r:16px; --tr:all .3s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg:#130a0d; --bg2:#1c1015; --card:#25161c; --text:#f5e9ec; --text2:#d4bcc2; --text3:#9c8289;
  --bc:rgba(255,255,255,0.09); --accent:#fb7185; --accent-rgb:251,113,133; --c2:#60a5fa; --c3:#fbbf24; --c4:#2dd4bf;
}
html { scroll-behavior:smooth; scroll-padding-top:80px; }
body { font-family:'Outfit','Segoe UI',Tahoma,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; line-height:1.6; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; width:0; background:linear-gradient(90deg,var(--accent),var(--c3),var(--c4),var(--c2)); }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(250,246,246,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); }
[data-theme="dark"] nav { background:rgba(19,10,13,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); }
.hero-band { margin-top:64px; background:var(--grad); padding:40px 24px 54px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 380px 180px at 12% 0%,rgba(245,158,11,.28) 0%,transparent 70%),radial-gradient(ellipse 600px 200px at 50% 100%,rgba(13,148,136,.25) 0%,transparent 70%); }
.hero-band > * { position:relative; }
.ecg { position:absolute !important; left:0; right:0; bottom:8px; width:100%; height:42px; opacity:.4; pointer-events:none; }
.ecg path { fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1200; stroke-dashoffset:1200; animation:ecgDraw 2.6s ease-out forwards; }
@keyframes ecgDraw { to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion:reduce) { .ecg path { animation:none; stroke-dashoffset:0; } html { scroll-behavior:auto; } }
.hero-band-icon { width:68px; height:68px; border-radius:20px; background:rgba(255,255,255,.18); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.88); }
.hero-band-meta { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:50px; padding:6px 16px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:760px; margin:0 auto; padding:24px 18px 80px; }
.toc { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px; margin-bottom:22px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
.toc a { text-decoration:none; font-size:12px; font-weight:700; color:var(--text2); background:var(--bg2); border:1px solid var(--bc); border-radius:50px; padding:6px 13px; transition:var(--tr); }
.toc a:hover { color:#fff; background:var(--sa,var(--accent)); border-color:transparent; }
.sec { margin-bottom:30px; }
.sec-head { background:var(--grad); background:linear-gradient(135deg,var(--sa),var(--sb)); color:#fff; border-radius:var(--r); padding:14px 18px; display:flex; align-items:center; gap:12px; font-size:17px; font-weight:900; margin-bottom:14px; }
.sec-head .ic { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.grp-h { font-size:14px; font-weight:900; color:var(--sa); margin:18px 4px 10px; display:flex; align-items:center; gap:8px; }
.grp-h::after { content:''; flex:1; height:1px; background:var(--bc); }
.fig { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px; margin-bottom:12px; text-align:center; }
.fig img { max-width:100%; height:auto; border-radius:10px; background:#fff; display:block; margin:0 auto; }
.item { background:var(--card); border:1px solid var(--bc); border-left:4px solid var(--sa); border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 10px rgba(120,20,45,.05); }
.en { font-size:15px; font-weight:700; line-height:1.55; direction:ltr; text-align:left; }
.ar { margin-top:9px; font-size:14px; color:var(--text2); line-height:1.9; direction:rtl; text-align:right; }
.ex { margin-top:10px; padding:10px 13px; border-radius:10px; background:rgba(var(--accent-rgb),.07); border-right:3px solid var(--c3); direction:rtl; text-align:right; font-size:13.5px; color:var(--text2); line-height:1.9; }
.ex b { color:var(--c3); font-weight:900; }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
.top-btn { position:fixed; bottom:20px; right:20px; width:44px; height:44px; border-radius:50%; border:none; background:var(--grad-soft); color:#fff; font-size:16px; cursor:pointer; box-shadow:0 4px 14px rgba(190,18,60,.3); display:none; }
.theme-btn:focus-visible, .top-btn:focus-visible, .toc a:focus-visible, .nav-back:focus-visible { outline:3px solid var(--c2); outline-offset:2px; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 12px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 48px;} .item{padding:12px 13px;} }
</style>

  ["The nervous system receives and processes information and initiates responses through a complex network of specialized cells called neurons.","الجهاز العصبي بيستقبل المعلومات ويعالجها ويبدأ الرد عليها عن طريق شبكة معقدة من خلايا متخصصة اسمها العصبونات (neurons).","زي شبكة الموبايل: بتستلم الرسالة، وتفهمها، وتبعت الرد. والخلايا العصبية هي الأسلاك والإشارات اللي بتنقل الكلام."]
 ]},
 { h:"THE NERVOUS SYSTEM (diagram)", img:"IMG1", i:[
  ["Central Nervous System","الجهاز العصبي المركزي، وهو أحد قسمين رئيسيين للجهاز العصبي.","زي غرفة التحكم الرئيسية في مبنى كبير."],
  ["Brain","المخ.","زي مدير غرفة التحكم اللي بياخد القرارات."],
  ["Spinal cord: Connects the brain to the rest of the body.","الحبل الشوكي: بيوصّل المخ بباقي الجسم.","زي كابل رئيسي طالع من غرفة التحكم لكل أجزاء المبنى."],
  ["Peripheral Nervous System","الجهاز العصبي الطرفي، وهو القسم التاني للجهاز العصبي.","زي الأسلاك الفرعية اللي بتوصل من غرفة التحكم لكل شقة."],
  ["Autonomic division: Regulates internal environment. Carries information from the CNS to organs, blood vessels and glands.","القسم اللاإرادي: بينظّم البيئة الداخلية للجسم، وبينقل المعلومات من الجهاز العصبي المركزي للأعضاء والأوعية الدموية والغدد.","زي نظام التكييف الأوتوماتيك في البيت: بيشتغل لوحده من غير ما تتحكم فيه."],
  ["Somatic division: Carries information to the CNS from the senses and from the CNS to the skeletal muscles.","القسم الجسدي: بينقل المعلومات للجهاز العصبي المركزي من الحواس، ومن الجهاز العصبي المركزي لعضلات الهيكل العضلي.","زي لما تحس إن الشاي سخن (حواس تبعت للمخ)، والمخ يقولك تشيل إيدك (عضلات تتحرك)."],
  ["Sympathetic (Arouses the body)","الجهاز السمبثاوي: بينشّط الجسم.","زي لما تلاقي كلب بيجري وراك: الجسم كله يتنشط."],
  ["Parasympathetic (Calms after arousal)","الجهاز الباراسمبثاوي: بيهدّي الجسم بعد ما يتنشط.","زي لما الكلب يمشي وتهدى وتاخد نفسك."]
 ]},
 { h:"Main functions of the nervous system", i:[
  ["Receiving sensory information.","استقبال المعلومات الحسية.","زي لما تسمع صوت أو تشوف حاجة، الجسم بيستلم الإشارة."],
  ["Processing and interpreting information.","معالجة المعلومات وتفسيرها.","زي ما المخ يفهم إن الصوت ده جرس الباب."],
  ["Initiating appropriate responses.","بدء الردود المناسبة.","زي لما تقوم تفتح الباب بعد ما فهمت إنه الجرس."],
  ["Controlling and coordinating body activities.","التحكم في أنشطة الجسم وتنسيقها.","زي مدير بينظم شغل كل الموظفين مع بعض."],
  ["Maintaining homeostasis.","الحفاظ على اتزان الجسم الداخلي (homeostasis).","زي الترموستات اللي بيحافظ على حرارة الأوضة ثابتة."]
 ]}
]},
{ id:"s3", t:"Assessment of Neurological System", ic:"🩺", a:"#0d9488", b:"#0369a1", g:[
 { h:"Assessment of neurological system", i:[
  ["Health History","التاريخ الصحي للمريض.","زي ما تسأل صاحب العربية عن تاريخها قبل ما تكشف."],
  ["Physical Examination","الفحص الجسدي.","زي الكشف الفعلي على العربية بإيدك."],
  ["General Signs & Symptoms","العلامات والأعراض العامة.","زي اللمبات والأصوات اللي بتظهر في العربية."],
  ["Laboratory & Diagnostic Testing","التحاليل والفحوصات التشخيصية.","زي أجهزة الكمبيوتر اللي بتقرا العطل في الورشة."]
 ]},
 { h:"Health history", i:[
  ["Allergies","الحساسية.","زي ما تسأل المريض بيتحسس من أدوية أو أكل قبل ما تديله حاجة."],
  ["Past Medical & Surgical History","التاريخ الطبي والجراحي السابق.","زي ما تسأل: عملت عمليات قبل كده؟ كنت عيّان بحاجة قبل كده؟"],
  ["Medications","الأدوية اللي بياخدها المريض.","زي ما تعرف إيه اللي بياخده دلوقتي عشان متديهوش حاجة تتعارض معاه."],
  ["Habits / Lifestyle Changes","العادات وتغيّرات نمط الحياة.","زي ما تسأل: نومك أو أكلك أو عاداتك اتغيروا الفترة الأخيرة؟"],
  ["Familial History of Neurologic Disorders","التاريخ العائلي لأمراض الجهاز العصبي.","زي ما تسأل: حد في العيلة عنده مرض عصبي؟"],
  ["Level of Consciousness","مستوى الوعي.","زي ما تشوف المريض صاحي ومركّز ولا نايم أو مش واعي."],
  ["Motor Function","الوظيفة الحركية.","زي ما تطلب منه يحرك إيده ورجليه وتشوف قوتهم."],
  ["Pupillary Function / Eye Movements","وظيفة الحدقة وحركات العين.","زي ما تنوّر كشاف في عينه وتشوف الحدقة بتصغر ولا لأ، وتخليه يتابع صباعك بعينه."],
  ["Vital Signs","العلامات الحيوية.","زي الحرارة والنبض والضغط، وهي أول حاجة بتقيسها."],
  ["Respiratory Patterns","أنماط التنفس.","زي ما تلاحظ تنفسه عادي ولا سريع ولا بطيء ولا مش منتظم."],
  ["Traumatic Event Data","بيانات عن أي حادثة أو إصابة.","زي ما تسأل: وقع على راسه أو حصله حادثة؟"],
  ["Progression of signs / symptoms","تطوّر العلامات والأعراض مع الوقت.","زي ما تتابع الأعراض بتزيد ولا بتقل ولا ثابتة."]
 ]},
 { h:"Important questions", i:[
  ["The nurse should determine:","الممرضة لازم تحدد الأسئلة دي عن المريض.","زي ما المحقق بيسأل أسئلة محددة عشان يوصل للحقيقة."],
  ["When did the symptoms start?","الأعراض بدأت إمتى؟","زي ما تسأل: من إمتى الصداع ده؟"],
  ["Were the symptoms sudden or gradual?","الأعراض جت فجأة ولا بالتدريج؟","زي ما تفرّق بين حاجة وقعت فجأة وحاجة بتزيد يوم بعد يوم."],
  ["Have the symptoms progressed?","الأعراض زادت أو اتطورت؟","زي ما تسأل: الوضع بقى أوحش من أول؟"],
  ["Is there a history of trauma?","في تاريخ لإصابة أو صدمة؟","زي ما تسأل: وقع أو اتخبط في راسه قبل كده؟"],
  ["Is there a history of neurological disease?","في تاريخ لمرض عصبي؟","زي ما تسأل: عنده مرض في الأعصاب من زمان؟"],
  ["What medications is the patient taking?","المريض بياخد أدوية إيه؟","زي ما تسأل: بتاخد إيه من أدوية دلوقتي؟"]
 ]}
]},
{ id:"s4", t:"Physical Examination Considerations", ic:"🔦", a:"#d97706", b:"#be123c", g:[
 { h:"Physical Examination Considerations", i:[
  ["Level of Consciousness","مستوى الوعي.","زي ما تشوف المريض صاحي إزاي."]
 ]},
 { h:"Level of Consciousness", i:[
  ["Most important aspect of neurologic examination","أهم جزء في فحص الجهاز العصبي كله.","زي أول مؤشر بتبص عليه في لوحة العربية قبل أي حاجة تانية."],
  ["Level of consciousness first to deteriorate; changes often subtle, therefore requiring careful monitoring.","مستوى الوعي هو أول حاجة بتسوء، والتغيرات فيه غالبًا بتبقى بسيطة وخفية، علشان كده لازم نراقبه بحرص.","زي ما المريض يبقى أهدى أو أنعس شوية من الطبيعي، فتحس إن في تغيير بسيط لازم تلاحظه."]
 ]},
 { h:"Consciousness composed of Two Components:", i:[
  ["Arousal (Alertness)","الاستثارة (اليقظة): يعني المريض صاحي ومتنبّه.","زي واحد عينه مفتوحة وصاحي."],
  ["Awareness (Content)","الإدراك (المحتوى): يعني فاهم هو فين وإيه اللي حواليه.","زي واحد صاحي وفاهم إنه في المستشفى ومين اللي قدامه."]
 ]},
 { h:"Assessment Tools", i:[
  ["Glasgow Coma Scale (GCS)","مقياس جلاسكو للغيبوبة (GCS).","زي مسطرة بنقيس بيها مستوى وعي المريض برقم."]
 ]},
 { h:"Glasgow Coma Scale (GCS)", i:[
  ["Three Categories:","التقسيم لثلاث فئات.","زي ما تقيّم الطالب في تلات مواد."],
  ["Eye opening","فتح العين.","زي ما تشوف العين بتفتح لوحدها ولا لازم تنادي عليه."],
  ["Best motor response","أفضل استجابة حركية.","زي ما تشوف أحسن حركة بيعملها لما تطلب منه أو تألمه."],
  ["Best verbal response","أفضل استجابة كلامية.","زي ما تشوف أحسن رد بيرد بيه لما تكلمه."]
 ]},
 { h:"Scoring", i:[
  ["Highest or best possible score 15","أعلى أو أفضل درجة ممكنة هي 15.","زي لما الطالب يجيب الدرجة النهائية، يعني المريض في أحسن وعي."],
  ["A score of < 8 indicates coma","الدرجة أقل من 8 معناها غيبوبة.","زي خط أحمر: لو الدرجة نزلت تحته يبقى المريض في غيبوبة."],
  ["Lowest or worst possible score","أقل أو أسوأ درجة ممكنة.","زي أقل درجة ممكن الطالب يجيبها، يعني أسوأ وعي."]
 ]},
 { h:"GCS table (Eye Opening / Verbal / Motor Response)", img:"IMG2", i:[
  ["Eye Opening Response: 4 = Spontaneous","فتح العين: 4 = بتفتح من نفسها.","زي واحد صاحي وعينه مفتوحة من غير ما تكلمه."],
  ["Eye Opening Response: 3 = To verbal stimuli","فتح العين: 3 = بتفتح لما حد يكلمه.","زي واحد بينادوا عليه فيفتح عينه."],
  ["Eye Opening Response: 2 = To pain","فتح العين: 2 = بتفتح لما يتعرض لألم.","زي واحد مش بيفتح عينه غير لما تألمه."],
  ["Eye Opening Response: 1 = None","فتح العين: 1 = مفيش فتح خالص.","زي واحد مهما عملت معاه عينه مقفولة."],
  ["Verbal Response: 5 = Oriented","الرد الكلامي: 5 = واعي ومتوجّه.","زي واحد بيعرف اسمه ومكانه والوقت."],
  ["Verbal Response: 4 = Confused","الرد الكلامي: 4 = مرتبك.","زي واحد بيتكلم بس مش فاهم هو فين أو الوقت إيه."],
  ["Verbal Response: 3 = Inappropriate words","الرد الكلامي: 3 = كلمات مش مناسبة.","زي واحد بيقول كلمات متقطعة ملهاش علاقة بالسؤال."],
  ["Verbal Response: 2 = Incoherent","الرد الكلامي: 2 = أصوات غير مفهومة.","زي واحد بيطلع أصوات أو همهمة مش مفهومة."],
  ["Verbal Response: 1 = None","الرد الكلامي: 1 = مفيش صوت خالص.","زي واحد مش بيرد بأي صوت."],
  ["Motor Response: 6 = Obeys commands","الاستجابة الحركية: 6 = بينفّذ الأوامر.","زي لما تقوله ارفع إيدك فيرفعها."],
  ["Motor Response: 5 = Localizes pain","الاستجابة الحركية: 5 = بيحدد مكان الألم.","زي لما تألمه فيروح بإيده لمكان الألم عشان يبعده."],
  ["Motor Response: 4 = Withdraws from pain","الاستجابة الحركية: 4 = بيسحب نفسه من الألم.","زي لما تدوس على حاجة سخنة فتسحب رجلك."],
  ["Motor Response: 3 = Flexion to pain or decorticate","الاستجابة الحركية: 3 = انثناء مع الألم أو وضع decorticate.","زي لما الدراع يتثني ناحية الصدر بعد الألم."],
  ["Motor Response: 2 = Extension to pain or decerebrate","الاستجابة الحركية: 2 = تمدد مع الألم أو وضع decerebrate.","زي لما الدراع والرجل يتمدوا ويتشدوا بعد الألم."],
  ["Motor Response: 1 = None","الاستجابة الحركية: 1 = مفيش حركة خالص.","زي واحد مهما ألمته مفيش أي حركة."]
 ]}
]},
{ id:"s5", t:"General Signs / Symptoms", ic:"⚠️", a:"#be123c", b:"#5b21b6", g:[
 { h:"General Signs / Symptoms", i:[
  ["Memory Loss","فقدان الذاكرة.","زي واحد ينسى حاجات حصلت امبارح."],
  ["Disorientation","التوهان (مش عارف الزمان والمكان والأشخاص).","زي واحد صاحي ومش عارف هو فين أو النهارده إيه."],
  ["Changes in level of consciousness","تغيّر في مستوى الوعي.","زي واحد كان صاحي وبعدين بقى نعسان وصعب يفوق."],
  ["Seizures","التشنجات.","زي واحد جسمه يترعش ويتشنج فجأة وهو مش واعي."],
  ["Speech or Swallowing Difficulties","صعوبة في الكلام أو البلع.","زي واحد مش قادر ينطق الكلمة صح أو بيشرق وهو بيبلع."],
  ["Vision & Pupillary Changes","تغيرات في الرؤية والحدقة.","زي واحد نظره بقى مش واضح، أو حدقة عينه شكلها اتغير."],
  ["Dizziness","الدوخة.","زي ما تحس إن الدنيا بتلف بيك."],
  ["Headache / Pain","الصداع أو الألم.","زي صداع شديد في الراس مش بيروح."],
  ["Weakness","الضعف.","زي ما تحس إن إيدك أو رجلك مش قادرة تشيل حاجة."],
  ["Loss of Coordination","فقدان التناسق الحركي.","زي واحد بيمشي ويتهز ومش قادر يوازن حركاته."],
  ["Tremors","الرعشة.","زي إيد بتترعش لوحدها."],
  ["Numbness / Tingling","التنميل أو الوخز.","زي ما رجلك تنمل وتحس إن في دبابيس صغيرة."],
  ["Paralysis","الشلل.","زي واحد مش قادر يحرك دراعه خالص."],
  ["Nausea / Vomiting","الغثيان أو القيء.","زي ما تحس إنك عاوز ترجّع."],
  ["Bowel or Bladder Difficulties","صعوبات في الإخراج أو التبول.","زي واحد مش قادر يتحكم في التبول أو الإخراج."]
 ]}
]},
{ id:"s6", t:"Diagnostic Testing", ic:"🧪", a:"#1d4ed8", b:"#0d9488", g:[
 { h:"Diagnostic Testing", i:[
  ["Imaging Studies of the Skull & Spine","دراسات التصوير للجمجمة والعمود الفقري.","زي ما تصوّر الجمجمة والعمود الفقري عشان تشوف اللي جوّه."],
  ["X-rays","الأشعة السينية.","زي صورة عادية بتظهر العضم."],
  ["Magnetic Resonance Imaging (MRI) scans","الرنين المغناطيسي (MRI).","زي صورة مفصّلة جدًا لأنسجة الجسم."],
  ["Computed Tomography (CT) Scans","الأشعة المقطعية (CT).","زي صور بتتاخد على شرائح عشان تشوف الجسم من جوه."],
  ["Position Emissions Tomography (PET) Scans","التصوير المقطعي بانبعاث البوزيترون (PET).","زي كاميرا بتصوّر شغل المخ نفسه."],
  ["1-A radioactive substance is either inhaled or injected to provide images of the brain’s function.","1- بيتم استنشاق أو حقن مادة مشعة عشان نحصل على صور بتبيّن وظيفة المخ.","زي ما تحط صبغة في الميه عشان تشوف مسارها، هنا المادة بتوضح شغل المخ."],
  ["2-Used to assess blood flow, tissue composition & brain metabolism, therefore it indirectly measures brain function.","2- بيُستخدم لتقييم تدفق الدم وتركيب الأنسجة وأيض المخ، وعلشان كده بيقيس وظيفة المخ بشكل غير مباشر.","زي ما تقيس استهلاك الكهربا في البيت عشان تعرف الأجهزة شغالة ولا لأ."],
  ["Electroencephalogram (EEG)","رسم المخ الكهربائي (EEG).","زي رسم القلب بس للمخ."],
  ["Pyelography","تصوير الحويضة (Pyelography).","زي ما بتصوّر مجرى معين بصبغة."],
  ["Lumbar Puncture (Spinal Tap)","البزل القطني (Lumbar Puncture / Spinal Tap).","زي ما تاخد عينة من السائل حوالين الحبل الشوكي بإبرة."],
  ["Cerebral Angiography","تصوير أوعية المخ بالصبغة (Cerebral Angiography).","زي ما تصوّر خريطة الشوارع بتاعة الدم في المخ."],
  ["Evoked Potentials (EPs)","الجهود المستحثة (EPs).","زي ما تدّي إشارة وتشوف المخ بيرد بسرعة قد إيه."],
  ["1-An evoked potential test measures the time it takes for nerves to respond to stimulation. The size of the response is also measured. Nerves from different areas of the body may be tested.","1- اختبار الجهود المستحثة بيقيس الوقت اللي بتاخده الأعصاب عشان تستجيب للتنبيه، وبيقيس كمان حجم الاستجابة. وممكن تتختبر أعصاب من مناطق مختلفة في الجسم.","زي ما تضغط على زرار وتحسب الوقت اللي اللمبة بتاخده عشان تنور وقد إيه نورها."],
  ["2- A series of electrodes on the scalp and an external stimulus is applied to the peripheral sensory receptors to elicit change in brain waves","2- بنحط مجموعة أقطاب كهربائية على فروة الراس ونديّ منبّه خارجي لمستقبلات الإحساس الطرفية عشان نظهر تغيّر في موجات المخ.","زي ما تلمس إيد حد وتسجّل على الراس إزاي المخ بيرد على اللمسة."]
 ]}
]},
{ id:"s7", t:"Meningitis: Definition & Classification", ic:"🦠", a:"#d97706", b:"#be123c", g:[
 { h:"Definition of meningitis", i:[
  ["Meningitis is inflammation of the meninges, the protective membranes surrounding the brain and spinal cord. It may be caused by different infectious agents, including bacteria and viruses, as well as other less common causes.","التهاب السحايا هو التهاب في السحايا (meninges)، وهي الأغشية الواقية اللي بتحيط بالمخ والحبل الشوكي. وممكن يتسبب من ميكروبات مختلفة زي البكتيريا والفيروسات، وكمان أسباب تانية أقل شيوعًا.","زي ما يحصل ورم والتهاب في الغلاف اللي حاوط الحاجة المهمة عشان يحميها، فبيتأثر اللي جواه."]
 ]},
 { h:"Classification of meningitis", i:[
  ["Meningitis can be classified according to its cause.","التهاب السحايا بيتقسم حسب السبب.","زي ما تقسم الحرارة لسببها: برد ولا تسمم."]
 ]},
 { h:"A. Bacterial Meningitis", i:[
  ["It is caused by bacteria such as:","بيحصل بسبب بكتيريا زي:","زي ما تعدد المتهمين اللي بيعملوا نفس الجريمة."],
  ["Streptococcus pneumoniae","بكتيريا المكورات الرئوية (Streptococcus pneumoniae).","زي متهم رقم 1."],
  ["Neisseria meningitidis","بكتيريا النيسرية السحائية (Neisseria meningitidis).","زي متهم رقم 2."],
  ["Haemophilus influenzae","بكتيريا الهيموفيلس الإنفلونزي (Haemophilus influenzae).","زي متهم رقم 3."]
 ]},
 { h:"B. Viral Meningitis", i:[
  ["It is commonly caused by viruses and is often less severe than bacterial meningitis, although severity varies according to the causative virus and the patient's condition.","بيحصل غالبًا بسبب فيروسات، وغالبًا بيبقى أخف من التهاب السحايا البكتيري، بس شدته بتختلف حسب الفيروس المسبب وحالة المريض.","زي برد خفيف عند ناس وتقيل عند ناس تانيين، حسب نوع الفيروس وجسم الشخص."]
 ]}
]},
{ id:"s8", t:"Causes, Risk Factors & Pathophysiology", ic:"🔬", a:"#0d9488", b:"#1d4ed8", g:[
 { h:"Causes and Risk Factors of Meningitis", i:[
  ["Possible causes/risk factors include:","الأسباب أو عوامل الخطورة المحتملة تشمل:","زي قايمة بالحاجات اللي ممكن تخلي الواحد أقرب للمرض."],
  ["Bacterial or viral infections","عدوى بكتيرية أو فيروسية.","زي واحد جاله ميكروب فأثّر على أجزاء تانية."],
  ["Respiratory infections","عدوى الجهاز التنفسي.","زي نزلة صدرية ممكن العدوى تتنقل منها."],
  ["Otitis media","التهاب الأذن الوسطى.","زي التهاب الودن لو اتساب ممكن يوصل لحاجات أبعد."],
  ["Mastoiditis","التهاب النتوء الخشائي (Mastoiditis).","زي التهاب في العضمة اللي ورا الودن."],
  ["Immune system deficiencies","نقص أو ضعف في جهاز المناعة.","زي بيت من غير حراس، أي ميكروب يدخل بسهولة."],
  ["Certain cancers such as lymphoma or leukemia","بعض أنواع السرطان زي الليمفوما أو اللوكيميا.","زي مرض بيضعّف دفاعات الجسم فيبقى أسهل للعدوى."],
  ["Sepsis","التسمم الدموي (Sepsis).","زي ميكروبات منتشرة في الدم ممكن توصل للمخ."],
  ["Head trauma or neurosurgical procedures","إصابة الراس أو العمليات الجراحية في المخ والأعصاب.","زي كسر في الحاجز اللي بيحمي المخ فبيدخل منه ميكروب."],
  ["Close contact with an infected person in some forms of meningitis","الاحتكاك القريب بشخص مصاب في بعض أنواع التهاب السحايا.","زي ما تقعد قريب من واحد عنده برد فالعدوى تنتقل."],
  ["Lack of appropriate vaccination","عدم أخذ التطعيم المناسب.","زي ما تسيب البيت من غير قفل، التطعيم هو القفل."]
 ]},
 { h:"Pathophysiology of Meningitis:-", i:[
  ["Through the blood stream as a consequence of other infections.","عن طريق مجرى الدم نتيجة عدوى تانية.","زي ميكروب بيركب في الدم من مكان لمكان تاني."],
  ["Direct spread, such as might occur after a traumatic injury to the facial bones or secondary to invasive procedures.","انتشار مباشر، زي اللي ممكن يحصل بعد إصابة في عظام الوش، أو كنتيجة لإجراءات تدخلية.","زي ما يبقى في فتحة في الحاجز فالميكروب يدخل على طول."],
  ["Secretion or aerosol contamination.","التلوث عن طريق الإفرازات أو الرذاذ (الأيروسول).","زي رذاذ الكحة والعطس لما يتنقل من شخص لشخص."],
  ["Bacterial or meningococcal meningitis also occurs as an opportunistic infection in patients with acquired immunodeficiency syndrome (AIDS) which crosses the blood brain barrier and proliferates in the cerebrospinal fluid (CSF).","التهاب السحايا البكتيري أو بالمكورات السحائية ممكن كمان يحصل كعدوى انتهازية عند مرضى الإيدز (AIDS)، وفيها الميكروب بيعدّي حاجز الدم والمخ ويتكاثر في السائل المخي الشوكي (CSF).","زي لصّ بيستغل إن البيت من غير حراسة، فبيدخل ويتكاثر جوه."]
 ]}
]},
{ id:"s9", t:"Clinical Manifestation of Meningitis", ic:"🌡️", a:"#be123c", b:"#d97706", g:[
 { h:"Clinical Manifestation of Meningitis:-", i:[
  ["1. Headache is usually steady or throbbing and very severe as a result of meningeal irritation.","1. الصداع غالبًا بيبقى ثابت أو نابض وشديد جدًا بسبب تهيج السحايا.","زي صداع جامد جدًا مش بيروح ولا بيهدى."],
  ["2. Nuchal rigidity (neck stiffness); Pain when flexing chin toward chest due to meningeal irritation and irritation of the spinal nerves.","2. تيبّس الرقبة (Nuchal rigidity): ألم لما تثني الدقن ناحية الصدر بسبب تهيج السحايا وتهيج الأعصاب الشوكية.","زي لما تحاول تنزّل دقنك على صدرك فتحس بألم ومش قادر."],
  ["3. Fever.","3. السخونية.","زي ارتفاع في درجة الحرارة."],
  ["4. Neck mobility; a stiff and painful neck can be an early sign.","4. حركة الرقبة: الرقبة اللي بتبقى متيبسة ومؤلمة ممكن تكون علامة مبكرة.","زي رقبة مش عارف تلفها من الألم من أول المرض."],
  ["5. The patient's neck is flexed; flexion of the knees and hips is produced.","5. رقبة المريض بتبقى مثنية، ويحصل انثناء في الركب والوركين.","زي واحد نايم متكوّر رقبته وركبه مثنية."],
  ["6. The patient is lying with the thigh flexed on the abdomen; the leg cannot be completely extended.","6. المريض بيبقى نايم وفخده مثني على بطنه، والرجل مش بتتفرد بالكامل.","زي واحد رجله مش راضية تتفرد لو حاولت تفردها."],
  ["7. Photophobia (extreme sensitivity to light).","7. رهاب الضوء (حساسية شديدة جدًا للضوء).","زي ما النور العادي يوجع عينك جدًا."],
  ["8. Skin lesions development, ranging from a petechial rash to purpuric lesions to large areas of ecchymosis.","8. ظهور آفات جلدية، من طفح نمشي (petechial) لحد آفات أرجوانية (purpuric) لحد مناطق كبيرة من الكدمات (ecchymosis).","زي بقع حمرا صغيرة في الجلد، وبعدين تكبر وتبقى زي الكدمات."],
  ["9. Disorientation and memory impairment are common.","9. التوهان وضعف الذاكرة شائعين.","زي واحد مش فاكر الأحداث ومش عارف هو فين."],
  ["10. Lethargy, unresponsiveness, and coma may develop.","10. ممكن يحصل خمول وعدم استجابة وغيبوبة.","زي واحد بيبقى نايم أكتر وأكتر لحد ما مبقاش بيرد."]
 ]}
]},
{ id:"s10", t:"Assessment, Diagnostic Findings & Complications", ic:"🧫", a:"#1d4ed8", b:"#be123c", g:[
 { h:"Assessment and Diagnostic Findings:-", i:[
  ["2. A lumbar puncture is the most informative diagnostic test for a patient with suspected meningitis.","البزل القطني هو أكتر فحص بيدّي معلومات للمريض اللي بنشك إن عنده التهاب سحايا.","زي الشاهد الأهم في القضية."],
  ["2. CSF studies demonstrate low glucose, high protein levels, and high white blood cell count (WBC).","فحوصات السائل المخي الشوكي بتوضح جلوكوز قليل، وبروتين عالي، وعدد كرات الدم البيضاء عالي (WBC).","زي ما العينة تبين إن السكر نازل والبروتين والكرات البيضاء طالعة."],
  ["3. Increased cerebral spinal fluid pressure noted.","3. بيتلاحظ زيادة في ضغط السائل المخي الشوكي.","زي ضغط الميه جوه الماسورة زاد."],
  ["4. Computed Tomography (CT) scan.","4. الأشعة المقطعية (CT).","زي صور مقطعية للراس."],
  ["5. Magnetic Resonance Imaging (MRI) scans.","5. الرنين المغناطيسي (MRI).","زي صورة تفصيلية للمخ."],
  ["6. Complete blood count (CBC).","6. صورة الدم الكاملة (CBC).","زي تحليل دم عام."],
  ["7. Blood cultures.","7. مزارع الدم.","زي ما تزرع عينة دم عشان تشوف إيه الميكروب."]
 ]},
 { h:"Complications:-", i:[
  ["2. Increased intracranial pressure (ICP).","زيادة الضغط داخل الجمجمة (ICP).","زي ضغط زاد جوه علبة مقفولة."],
  ["2. Seizures.","التشنجات.","زي نوبة تشنج مفاجئة."],
  ["3. Brain stems Herniation.","3. انفتاق جذع المخ (Herniation).","زي ما المخ يتزق من مكانه بسبب الضغط."],
  ["4. Cranial nerve dysfunction.","4. خلل في وظيفة الأعصاب القحفية.","زي أعصاب الراس مش بتشتغل صح."],
  ["5. Shock.","5. الصدمة (Shock).","زي هبوط حاد في الدورة الدموية."],
  ["6. Disseminated Intravascular Coagulation (DIC).","6. التجلط المنتشر داخل الأوعية الدموية (DIC).","زي جلطات صغيرة منتشرة في الدم في كل الجسم."],
  ["7. Death.","7. الوفاة.","زي أخطر مضاعفات لو اتأخر العلاج."]
 ]}
]},
{ id:"s11", t:"Medical Management", ic:"💉", a:"#0d9488", b:"#5b21b6", g:[
 { h:"Medical Management", i:[
  ["Management depends on the cause and severity.","العلاج بيعتمد على السبب وعلى شدة الحالة.","زي ما الدكتور يكتب علاج مختلف حسب نوع المرض ودرجته."]
 ]},
 { h:"a) Bacterial meningitis", i:[
  ["Treatment may include:","العلاج ممكن يشمل:","زي قايمة العلاجات الممكنة."],
  ["1. Prompt administration of appropriate intravenous antibiotics.","1. إعطاء مضادات حيوية مناسبة عن طريق الوريد بسرعة.","زي ما تطفي حريق بسرعة قبل ما يكبر."],
  ["2. Dexamethasone may be used as adjunctive therapy in selected cases, particularly when pneumococcal meningitis is suspected.","2. ممكن يُستخدم الديكساميثازون كعلاج مساعد في حالات مختارة، خصوصًا لما نشك في التهاب سحايا بالمكورات الرئوية.","زي مساعد بيدعم العلاج الأساسي في حالات معينة."],
  ["3. IV fluids and hemodynamic support when needed.","3. محاليل وريدية ودعم للدورة الدموية عند الحاجة.","زي ما تدعم الدورة الدموية بمحلول لو المريض محتاج."],
  ["4. Anticonvulsant therapy if seizures occur.","4. علاج مضاد للتشنجات لو حصلت تشنجات.","زي ما تدّي دوا يوقف التشنج لو حصل."],
  ["5. Management of increased intracranial pressure when present.","5. علاج زيادة الضغط داخل الجمجمة لو موجودة.","زي ما تخفف الضغط جوه الجمجمة."],
  ["6. Analgesics and antipyretics for pain and fever.","6. مسكنات وخافضات حرارة للألم والسخونية.","زي ما تدّي دوا للصداع ودوا للحرارة."],
  ["7. Appropriate infection-control precautions when indicated.","7. احتياطات مكافحة العدوى المناسبة عند الحاجة.","زي ما تلبس كمامة وجوانتي عشان العدوى متنتقلش."]
 ]},
 { h:"b) Viral Meningitis", i:[
  ["Most viral meningitis cases receive supportive treatment.","معظم حالات التهاب السحايا الفيروسي بياخدوا علاج داعم.","زي الراحة والسوائل لحد ما الجسم يتغلب على الفيروس."]
 ]},
 { h:"Antiviral therapy", i:[
  ["Antiviral treatment depends on the suspected virus.","العلاج المضاد للفيروسات بيعتمد على الفيروس المشتبه فيه.","زي ما تختار الدوا حسب نوع الفيروس."],
  ["Other viruses may require specific antiviral treatment in selected circumstances, but many viral meningitis cases do not have a specific antiviral therapy.","فيروسات تانية ممكن تحتاج علاج مضاد فيروسات محدد في ظروف معينة، بس كتير من حالات التهاب السحايا الفيروسي مفيهاش علاج مضاد فيروسات محدد.","زي إن في أمراض ليها علاج مخصوص وأمراض كتير مفيهاش غير الدعم."]
 ]},
 { h:"Supportive management", i:[
  ["Adequate fluids and electrolyte replacement.","سوائل كافية وتعويض الأملاح (الإلكتروليتات).","زي ما تشرب مية وتعوّض الأملاح اللي الجسم فقدها."],
  ["Rest.","الراحة.","زي ما تنام وترتاح عشان الجسم يتعافى."],
  ["Antipyretics for fever.","خافضات الحرارة للسخونية.","زي دوا بيخفض الحرارة."],
  ["Analgesics for headache and body aches.","مسكنات للصداع وآلام الجسم.","زي دوا للصداع وكسل الجسم."],
  ["Antiemetics if nausea/vomiting is significant.","مضادات القيء لو الغثيان أو القيء كبير.","زي دوا بيوقف الترجيع."],
  ["Monitor neurological status and vital signs.","مراقبة الحالة العصبية والعلامات الحيوية.","زي ما تفضل تراقب وعيه وحرارته ونبضه."],
  ["Manage seizures or raised intracranial pressure if they develop","التعامل مع التشنجات أو زيادة الضغط داخل الجمجمة لو حصلوا.","زي ما تبقى جاهز بالحل لو ظهرت مشكلة."]
 ]}
]},
{ id:"s12", t:"Nursing Care Plan for the Patient with Meningitis", ic:"📋", a:"#be123c", b:"#1d4ed8", g:[
 { h:"Nursing Diagnosis 2: Acute Pain related to: meningeal irritation, headache, fever, and neck stiffness.", i:[
  ["Nursing Interventions","التدخلات التمريضية.","زي ما تحط خطة الحل لكل مشكلة عند المريض."],
  ["1. Assess pain using an appropriate pain scale.","1. قيّم الألم باستخدام مقياس ألم مناسب.","زي ما تسأل المريض يدّي الألم رقم من 0 لـ 10."],
  ["2. Assess the location, intensity, duration, and characteristics of pain.","2. قيّم مكان الألم وشدته ومدته وصفاته.","زي ما تسأل: فين الألم؟ قد إيه؟ من إمتى؟ نوعه إيه؟"],
  ["3. Administer prescribed analgesics.","3. أعطِ المسكنات الموصوفة.","زي ما تدّي المريض الدوا اللي الدكتور كتبه."],
  ["4. Provide a quiet and comfortable environment.","4. وفّر بيئة هادية ومريحة.","زي أوضة هادية ومريحة."],
  ["5. Reduce excessive light and noise, especially if photophobia is present.","5. قلّل الإضاءة والضوضاء الزايدة، خصوصًا لو في رهاب ضوء.","زي ما تقفل النور الشديد وتقلل الدوشة."],
  ["6. Encourage rest.","6. شجّع على الراحة.","زي ما تساعده ينام ويرتاح."],
  ["7. Reassess pain after interventions.","7. أعد تقييم الألم بعد التدخلات.","زي ما تسأله بعد الدوا: الألم قل ولا لأ؟"],
  ["8. Monitor for worsening headache, vomiting, or changes in consciousness that may indicate neurological deterioration.","8. راقب زيادة الصداع أو القيء أو تغيّر الوعي، لأنها ممكن تدل على تدهور عصبي.","زي ما تبقى واخد بالك لو الصداع زاد أو بدأ يرجّع أو بقى نعسان."]
 ]},
 { h:"Nursing Diagnosis 2: Disturbed Sensory Perception related to: neurological impairment and altered level of consciousness.", i:[
  ["Nursing Interventions","التدخلات التمريضية.","زي خطة حل المشكلة."],
  ["1. Assess level of consciousness regularly.","1. قيّم مستوى الوعي بانتظام.","زي ما تشوف صاحي ولا نعسان كل شوية."],
  ["2. Monitor orientation and cognitive status.","2. راقب التوجه (الزمان والمكان والأشخاص) والحالة الإدراكية.","زي ما تسأل: إنت فين؟ النهارده إيه؟"],
  ["3. Assess sensory function as appropriate.","3. قيّم الوظيفة الحسية حسب اللزوم.","زي ما تختبر لو بيحس بالسمع واللمس والنظر."],
  ["4. Observe for changes in behavior.","4. لاحظ أي تغيّر في السلوك.","زي ما تلاحظ لو بقى هادي زيادة أو عصبي فجأة."],
  ["5. Reduce excessive noise and environmental stimulation.","5. قلّل الضوضاء والمنبهات الزايدة من البيئة.","زي أوضة هادية من غير دوشة."],
  ["6. Provide clear and simple communication.","6. تواصل بشكل واضح وبسيط.","زي ما تكلمه بجمل قصيرة وواضحة."],
  ["7. Reorient the patient when necessary.","7. أعد توجيه المريض عند اللزوم.","زي ما تفكّره هو فين والنهارده إيه."],
  ["8. Maintain patient safety.","8. حافظ على سلامة المريض.","زي ما تطلع الحواجز الجانبية للسرير."],
  ["9. Collaborate with physiotherapy, occupational therapy, or speech therapy when indicated.","9. تعاون مع العلاج الطبيعي أو الوظيفي أو التخاطب عند الحاجة.","زي ما تشرك فريق متخصص لو المريض محتاج."]
 ]},
 { h:"Nursing Diagnosis 3: Impaired Physical Mobility related to: neuromuscular impairment and weakness.", i:[
  ["Nursing Interventions","التدخلات التمريضية.","زي خطة حل المشكلة."],
  ["1. Assess the patient's mobility and muscle strength.","1. قيّم حركة المريض وقوة عضلاته.","زي ما تشوف يقدر يحرك إيده ورجله ويشد ولا لأ."],
  ["2. Assist the patient with movement as needed.","2. ساعد المريض في الحركة حسب الحاجة.","زي ما تسنده وهو بيتحرك."],
  ["3. Perform or assist with range-of-motion exercises as appropriate.","3. نفّذ أو ساعد في تمارين مدى الحركة حسب المناسب.","زي ما تحرك مفاصله بلطف عشان متتيبسش."],
  ["4. Maintain proper body alignment.","4. حافظ على وضع الجسم الصحيح.","زي ما تظبط وضعه في السرير بشكل مريح وسليم."],
  ["5. Reposition the patient regularly according to condition and pressure-injury risk.","5. غيّر وضع المريض بانتظام حسب حالته وخطر قرح الضغط.","زي ما تقلّبه كل فترة عشان متحصلش قرح."],
  ["6. Assess skin condition regularly.","6. قيّم حالة الجلد بانتظام.","زي ما تبص على جلده عشان تكتشف أي احمرار بدري."],
  ["7. Provide appropriate skin care.","7. قدّم العناية المناسبة بالجلد.","زي ما تنضّف وتجفف جلده وتحميه."],
  ["8. Use pressure-relieving devices when indicated.","8. استخدم أجهزة تخفيف الضغط عند الحاجة.","زي مرتبة هوا بتقلل الضغط على الجلد."],
  ["9. Encourage activity progressively as the patient's condition allows.","9. شجّع على النشاط تدريجيًا حسب ما تسمح حالة المريض.","زي ما تبدأ بحركة بسيطة وتزوّدها شوية شوية."],
  ["10. Collaborate with physiotherapy when appropriate.","10. تعاون مع العلاج الطبيعي عند المناسب.","زي ما تستعين بأخصائي علاج طبيعي."]
 ]}
]},
{ id:"s13", t:"Important Nursing Priorities in Meningitis", ic:"🚨", a:"#d97706", b:"#be123c", g:[
 { h:"Important Nursing Priorities in Meningitis", i:[
  ["When caring for a patient with meningitis, the nurse should pay particular attention to:","لما تهتم بمريض التهاب سحايا، الممرضة لازم تركز بشكل خاص على النقط دي:","زي قايمة الحاجات اللي لازم تفضل عينك عليها طول الوقت."],
  ["Airway and breathing","مجرى الهوا والتنفس.","زي ما تتأكد إن الهوا داخل وطالع من غير عائق."],
  ["Level of consciousness","مستوى الوعي.","زي ما تراقب صاحي ولا نعسان."],
  ["Vital signs","العلامات الحيوية.","زي ما تقيس الحرارة والنبض والضغط والتنفس."],
  ["Neurological status","الحالة العصبية.","زي ما تشوف حركته وحدقته ووعيه."],
  ["Signs of increased ICP","علامات زيادة الضغط داخل الجمجمة.","زي ما تلاحظ لو الصداع بيزيد والوعي بيقل."],
  ["Seizures","التشنجات.","زي ما تبقى جاهز لو جاله تشنج."],
  ["Pain and fever","الألم والسخونية.","زي ما تتابع الصداع والحرارة."],
  ["Fluid balance","توازن السوائل.","زي ما تحسب اللي بيدخل واللي بيخرج من سوائل."],
  ["Skin integrity","سلامة الجلد.","زي ما تحمي جلده من القرح."],
  ["Infection-control precautions","احتياطات مكافحة العدوى.","زي ما تلتزم بغسل الإيدين والعزل المناسب."],
  ["Safety","السلامة.","زي ما تحمي المريض من الوقوع أو الأذى."]
 ]}
]}
];

document.getElementById('cnt').textContent = n + ' نقطة';
const pb=document.getElementById('prog-bar'), tb=document.getElementById('topBtn');
addEventListener('scroll',()=>{ const h=document.documentElement; pb.style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%'; tb.style.display=h.scrollTop>500?'block':'none'; });
tb.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
const themeBtn=document.getElementById('themeBtn');
let theme=(()=>{try{return localStorage.getItem('theme')||'light'}catch(e){return 'light'}})();
function applyTheme(t){ theme=t; document.documentElement.setAttribute('data-theme',t==='dark'?'dark':''); themeBtn.textContent=t==='dark'?'☀️':'🌙'; try{localStorage.setItem('theme',t)}catch(e){} }
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
</script>
