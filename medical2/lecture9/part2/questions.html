*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.score-num{font-size:28px;font-weight:900}.score-pct{font-size:12px;color:var(--text3)}

.btn-retry{background:linear-gradient(135deg,#d97706,#be123c);color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}
.footer-tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media (max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 38px}}
</style>
</head>

<script>
const QUESTIONS = [
/* ===== MCQ - Easy ===== */
{t:"A brain tumor is best defined as:", o:["A bacterial infection of the meninges","An abnormal mass of cells in or around the brain","A collection of blood under the skull","Inflammation of the brain tissue"], a:1},
{t:"Non-cancerous (benign) brain tumors:", o:["Grow rapidly and always return","Spread to other organs","Grow slowly and are less likely to return after treatment","Are always fatal"], a:2},

{t:"Pituitary adenoma develops in the:", o:["Pituitary gland","Meninges","Eighth cranial nerve","Brainstem"], a:0},
{t:"Acoustic neuroma is a tumor of the:", o:["Optic nerve","Eighth cranial nerve","Pituitary gland","Meninges"], a:1},
{t:"Hemangioblastomas originate in:", o:["The meninges","The cerebellum","Blood vessels","The pituitary gland"], a:2},
{t:"Medulloblastoma tumors arise from the:", o:["Cerebellum or brainstem","Meninges","Pituitary gland","Eighth cranial nerve"], a:0},
{t:"Headache caused by increased ICP in brain tumor is typically:", o:["Worse at night only","Worse in the morning","Relieved by vomiting only","Present only during exercise"], a:1},
{t:"Vomiting in increased ICP caused by a brain tumor is typically:", o:["Projectile, not preceded by nausea","Preceded by severe nausea","Bloody","Only after meals"], a:0},
{t:"Which is the best test for identifying brain tumors?", o:["Chest X-ray","Computed tomography only","Magnetic resonance imaging (MRI)","Spinal tap"], a:2},
/* ===== MCQ - Medium ===== */
{t:"Which cancer is NOT listed as a cancer that can spread to the brain?", o:["Breast cancer","Lung cancer","Melanoma (skin cancer)","Osteosarcoma"], a:3},
{t:"Before MRI or CT for a brain tumor, a contrast agent is injected:", o:["Into the muscle","Into a vein","Into the spinal canal","Under the skin"], a:1},
{t:"A spinal tap (lumbar puncture) is done in brain tumor when doctors suspect that the tumor has invaded the:", o:["Pituitary gland","Cerebellum","Meninges","Eighth cranial nerve"], a:2},
{t:"A biopsy of the tumor is done when:", o:["MRI and other tests cannot definitively identify the tumor type","The patient has a mild headache","The tumor is clearly benign on CT","The patient refuses surgery"], a:0},
{t:"Corticosteroids such as dexamethasone are given to:", o:["Control seizures","Relieve headache only","Reduce swelling around the tumor and pressure within the skull","Kill cancer cells"], a:2},
{t:"Anticonvulsants are given in brain tumor to:", o:["Reduce brain swelling","Control or prevent seizures","Kill tumor cells","Relieve nausea"], a:1},
{t:"In craniotomy, after tumor removal:", o:["The bone piece is discarded","The bone is replaced and the incision stitched closed","The skull is left open","A metal plate is always used"], a:1},
{t:"Which device may be used in craniotomy to break the tumor apart so pieces can be aspirated?", o:["A laser","A scalpel","A device that emits ultrasound waves","A radiation beam"], a:2},
{t:"Radiation therapy for brain tumors uses:", o:["High doses of X-rays","Anticancer pills only","Ultrasound waves","Corticosteroids"], a:0},
{t:"Chemotherapy may be recommended after surgery to:", o:["Replace the bone","Kill any cancer cells left behind or prevent remaining cells from growing","Relieve headache","Reduce ICP immediately"], a:1},
{t:"One of the few known modifiable risk factors for brain cancers is:", o:["Age","Exposure to ionizing radiation","Gender","Inherited genes"], a:1},
{t:"The recommended physical activity to lower tumor risk is:", o:["30 minutes daily of strenuous exercise","150 minutes of moderate aerobic activity every week","15 minutes weekly","No exercise during treatment"], a:1},
{t:"Which food is a dietary pitfall to avoid because it frequently contains nitrosamines?", o:["Berries","Red and processed meats","Leafy greens","Nuts and legumes"], a:1},
{t:"Undercooked meats and hard cheeses are hazardous during treatment because they:", o:["Raise blood pressure","Increase the risk of infection in vulnerable people","Cause seizures","Reduce appetite"], a:1},
{t:"Which of the following is a recommended food for lowering the risk of brain tumors?", o:["Hydrogenated fats","Omega-3 fatty acids","Processed meats","Foods rich in sugar"], a:1},
/* ===== MCQ - Harder (nursing process) ===== */
{t:"Which nursing diagnosis is related to loss or impairment of motor and sensory function and decreased cognitive abilities?", o:["Anxiety","Imbalanced nutrition less than body requirements","Self-care deficit","Disturbed sensory perception"], a:2},
{t:"A patient with a brain tumor has vomiting due to treatment and decreased intake. The most suitable nursing diagnosis is:", o:["Anxiety related to fear of dying","Imbalanced nutrition less than body requirements","Self-care deficit","Risk for cerebral edema"], a:1},
{t:"Which is the best nursing intervention to compensate for a self-care deficit?", o:["Do all activities for the patient","Encourage the patient to keep as independent as possible","Limit the patient's activity completely","Avoid planning the day with the patient"], a:1},
{t:"To improve the nutrition of a patient with a brain tumor, the nurse should:", o:["Ignore the patient's food preferences","Provide oral hygiene before and after meals","Serve meals in a noisy environment","Restrict fluids"], a:1},
{t:"To relieve a patient's anxiety, the nurse should:", o:["Avoid talking about fears","Spend time with the patient to allow him to talk about fears and concerns","Isolate the patient","Discourage family visits"], a:1},
{t:"Preoperatively, an aphasic patient should be supplied with:", o:["Sedatives","Picture and word cards or writing materials","A bedside commode only","Restraints"], a:1},
{t:"For paralysis of the extremities before intracranial surgery, the nurse applies:", o:["Heating pads","Trochanter rolls and positions the feet against a footboard","Tight bandages","Elastic stockings only"], a:1},

{t:"Which nursing diagnosis is related to edema and head dressings after surgery?", o:["Anxiety","Disturbed sensory perceptions (visual / auditory)","Self-care deficit","Imbalanced nutrition"], a:1},

{t:"Benign brain tumors grow rapidly and are more likely to return after treatment.", o:["True","False"], a:1},
{t:"Secondary brain tumors are always cancerous.", o:["True","False"], a:0},

{t:"Headache caused by increased ICP in brain tumor is worse in the evening.", o:["True","False"], a:1},
{t:"Projectile vomiting in brain tumor is typically preceded by nausea.", o:["True","False"], a:1},
{t:"Meningiomas form in the meninges, the protective lining of the brain.", o:["True","False"], a:0},
{t:"Acoustic neuroma is a tumor of the eighth cranial nerve.", o:["True","False"], a:0},
{t:"Dexamethasone is mainly given to control seizures.", o:["True","False"], a:1},
{t:"A spinal tap is done when doctors suspect that the tumor has invaded the meninges.", o:["True","False"], a:0},

{t:"After a craniectomy, the patient should be placed on his operative side.", o:["True","False"], a:1},
{t:"Keeping the patient's head higher than the rest of the body helps reduce the risk of increased ICP.", o:["True","False"], a:0},
{t:"Analgesics given after intracranial surgery should mask the level of responsiveness.", o:["True","False"], a:1},

let questions,i,correct,wrong,answers,wrongSet,answered;
let totalTime=40*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleOptions(q){
  if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return {...q};
  const idx=shuffle(q.o.map((_,k)=>k));
  return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};
}
function init(pool){
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);
  wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' سؤال';
  startTimer();render();
}
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const badge=document.getElementById('timerBadge');
    if(timeLeft<=120){badge.className='timer-badge danger';}
    else if(timeLeft<=300){badge.className='timer-badge warn';}
    if(timeLeft<=0){clearInterval(timerInterval);finish();}
  },1000);
}
function updateTop(){
  const total=questions.length;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[
  {icon:'🧠',l:['#be123c','190,18,60','#9f1239','#be123c','#1e3a8a'],d:['#fb7185','251,113,133']},
  {icon:'🩻',l:['#0d9488','13,148,136','#115e59','#0d9488','#0369a1'],d:['#2dd4bf','45,212,191']},
  {icon:'💊',l:['#d97706','217,119,6','#92400e','#d97706','#be123c'],d:['#fbbf24','251,191,36']},
  {icon:'🩺',l:['#1d4ed8','29,78,216','#1e3a8a','#1d4ed8','#7c3aed'],d:['#60a5fa','96,165,250']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style;
  const main=dark?s.d[0]:s.l[0],rgb=dark?s.d[1]:s.l[1];
  r.setProperty('--accent',main);
  r.setProperty('--accent-rgb',rgb);
  r.setProperty('--grad',`linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx]||idx+1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i];
  const ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=document.getElementById('opt'+idx);
    el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');
    else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span>🎉</span> <span>ممتاز ، اللهم بارك </span>`:`<span>😔</span> <span>ركز يا سكر</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">
    ${i<questions.length-1?'<i class="fa-solid fa-arrow-left"></i> السؤال التالي':'<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop();}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'});}
  else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length;
  const score=Math.round((correct/total)*100);
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]});});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gradeColor;
  if(score>=90){grade='🥇 ممتاز';gradeColor='var(--success)';}
  else if(score>=75){grade='🥈 جيد جداً';gradeColor='var(--c2)';}
  else if(score>=60){grade='🥉 جيد';gradeColor='var(--warn)';}
  else{grade='📚 راجع تاني';gradeColor='var(--danger)';}
  const circ=2*Math.PI*45;
  const offset=circ-(score/100)*circ;
  const reportHTML=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}">
      <div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>
      ${!ok?`
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx]>=0?q.o[answers[idx]]:'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total-answered<0?0:total-answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset;},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);
  wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme='light';try{theme=localStorage.getItem('theme')||'light';}catch(e){}
function applyTheme(t){
  theme=t;
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t);}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
</body>
</html>
