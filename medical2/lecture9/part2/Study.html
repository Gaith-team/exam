<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#be123c;--c2:#1d4ed8;--c3:#d97706;--c4:#0d9488;--grad:linear-gradient(135deg,#9f1239 0%,#be123c 30%,#5b21b6 70%,#1e3a8a 100%);--bg:#faf6f6;--bg2:#f3eaec;--card:#fff;--text:#2a1519;--text2:#5b4348;--text3:#8a7479;--bc:rgba(80,20,35,.09)}
[data-theme="dark"]{--bg:#130a0d;--bg2:#1c1015;--card:#25161c;--text:#f5e9ec;--text2:#d4bcc2;--text3:#9c8289;--bc:rgba(255,255,255,.09);--accent:#fb7185;--c2:#60a5fa;--c3:#fbbf24;--c4:#2dd4bf}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s,color .4s}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:rgba(250,246,246,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(19,10,13,.95)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px}
.logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#be123c,#1d4ed8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.tb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.tb:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.hero{margin-top:60px;background:var(--grad);padding:38px 20px 42px;text-align:center;color:#fff}
.hero .ic{font-size:44px;margin-bottom:8px}
.hero h1{font-size:clamp(22px,4.5vw,32px);font-weight:900}
.hero p{font-size:13px;opacity:.9;margin-top:6px}
.shell{max-width:760px;margin:0 auto;padding:22px 16px 70px}
.sec{margin-top:26px}
.sec h2{font-size:17px;font-weight:900;padding:10px 16px;border-radius:12px;background:var(--grad);color:#fff;direction:ltr;text-align:left;position:sticky;top:66px;z-index:5}
.item{background:var(--card);border:1px solid var(--bc);border-radius:14px;margin-top:12px;overflow:hidden;box-shadow:0 2px 10px rgba(120,20,45,.06)}
.en{padding:14px 16px;font-size:15px;font-weight:700;line-height:1.65;direction:ltr;text-align:left;border-left:4px solid var(--accent);background:rgba(190,18,60,.04)}
.ar{padding:12px 16px;font-size:14.5px;line-height:1.9;direction:rtl;text-align:right;color:var(--text);border-top:1px solid var(--bc);border-right:4px solid var(--c2)}
.ex{padding:11px 16px;font-size:13.5px;line-height:1.85;direction:rtl;text-align:right;color:var(--text2);background:rgba(217,119,6,.07);border-top:1px solid var(--bc);border-right:4px solid var(--c3)}
.fig{padding:12px;text-align:center;border-top:1px solid var(--bc);background:#fff}.fig img{max-width:100%;max-height:300px;border-radius:8px}.en{white-space:pre-line}.ex b{color:var(--c3)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:20px 24px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:14px;font-weight:700}
footer span{color:var(--accent)} footer a{color:#229ED9;text-decoration:none;font-size:12px;font-weight:600}
</style>

const D=[
["Brain Tumor",[
["A brain tumor is an abnormal mass of cells in or around brain that may originate in the brain or spread (metastasized) to the brain from another part of the body as lung, kidney and breast.","ورم المخ هو كتلة خلايا مش طبيعية جوه المخ أو حواليه. ممكن تبدأ من المخ نفسه، أو تيجي من عضو تاني في الجسم زي الرئة أو الكلى أو الثدي وتنتقل للمخ (ده اسمه metastasis).","زي نبتة غريبة طلعت في الجنينة: ساعات بتطلع من نفس الأرض، وساعات بذرتها بتيجي من جنينة تانية."],
["It can be a noncancerous (benign) or cancerous (malignant) tumor.","الورم يا إما حميد (مش سرطاني) يا إما خبيث (سرطاني).","زي ضيف هادي قاعد في ركنه، وضيف تاني بيكسر في البيت."],
["Non-cancerous (benign) brain tumors grow slowly and are less likely to return after treatment.","أورام المخ الحميدة بتكبر ببطء، واحتمال رجوعها بعد العلاج قليل.","زي حشيش بيطلع ببطء، لو شلته مرة واحدة غالبًا مبيرجعش بسرعة."],
["Cancerous (malignant) brain tumors grow rapidly and are more likely to return after treatment.","أورام المخ الخبيثة بتكبر بسرعة، واحتمال رجوعها بعد العلاج أكبر.","زي حشيش بيطلع بسرعة وبيرجع تاني حتى بعد ما تقلعه."]
]],
["Incidence of brain tumor",[
["The incidence of brain tumor appears to have increased and slightly more common among men than women.","نسبة حدوث ورم المخ باين إنها زادت، وهو أكتر شوية عند الرجالة منه عند الستات.","لو قدامك 100 حالة، هتلاقي الرجالة أكتر بفرق بسيط."],
["Brain tumors can develop at any age, but the highest incidence occurs between the age of 50 to 60 years.","ورم المخ ممكن يحصل في أي سن، لكن أعلى نسبة حدوث بتكون بين سن 50 و60 سنة.","زي موسم الذروة في المصيف: الورم ممكن يحصل طول السنة، لكن الزحمة الحقيقية في الخمسينات."]
]],
["Known Risk Factors",[
["According to the American Cancer Society, very few risk factors are clearly linked to adult brain tumors:","حسب الجمعية الأمريكية للسرطان، عوامل الخطر المربوطة بوضوح بأورام المخ عند الكبار قليلة جدًا:","زي إن قدامك 3 أسباب بس مثبتة، مش قايمة طويلة."],
["Age: The risk increases as people get older.","السن: الخطر بيزيد كل ما الإنسان يكبر.","زي العربية: كل ما عدّت سنين، احتمال الأعطال بيزيد."],
["Most primary brain tumors happen in older adults.","أغلب أورام المخ الأولية بتحصل عند كبار السن.","لو جالك مريض ورم مخ أولي، الأرجح يكون كبير في السن."],
["Radiation exposure: Exposure to strong ionizing radiation—such as past radiation therapy to the head for treating other cancers—increases risk.","التعرض للإشعاع: التعرض لإشعاع مؤين قوي، زي علاج إشعاعي اتعمل للراس زمان لعلاج سرطان تاني، بيزود الخطر.","واحد اتعالج بالإشعاع في راسه وهو صغير من سرطان تاني، ده خطره أعلى بعد سنين."],
["Inherited genetic syndromes: About 5% of brain tumors link to rare inherited gene changes passed down in families.","المتلازمات الوراثية: حوالي 5% من أورام المخ مرتبطة بتغيرات جينية نادرة بتتوارث في العيلة.","من كل 100 ورم مخ، حوالي 5 بس سببهم جين وراثي."]
]],
["Causes of brain tumor",[
["The cause of brain tumor is unknown. Possible causes include:","سبب ورم المخ مش معروف. بس فيه أسباب محتملة، منها:","زي لغز لسه مش محلول، بس فيه 3 مشتبه فيهم."],
["Defective immune system.","ضعف أو خلل في جهاز المناعة.","المناعة زي الحارس، ولو الحارس نايم الخلايا الغلط بتعدي."],
["Head injury.","إصابة الراس.","زي ضربة قوية على الراس تتحط ضمن الأسباب المحتملة."],
["Exposure to very high doses of radiation to the head.","التعرض لجرعات عالية جدًا من الإشعاع على الراس.","زي جلسات إشعاع كتيرة وبجرعات كبيرة مركزة على منطقة الراس."]
]],
["Common Misconceptions",[
["Research shows that many everyday factors do not cause brain tumors:","الأبحاث بتقول إن عوامل كتير من حياتنا اليومية مش بتسبب أورام المخ:","زي إشاعات منتشرة بين الناس، والعلم بينفيها."],
["Cell phones and wireless devices do not cause brain tumors.","الموبايل والأجهزة اللاسلكية مش بتسبب أورام المخ.","كلام الموبايل ساعة طويلة مش هيطلّع ورم في المخ."],
["Head injuries do not cause brain tumors.","إصابات الراس مش بتسبب أورام المخ.","وقعة على الراس مش معناها إن الورم هيطلع بعدها (ركّز إن المحاضرة ذكرتها هنا كمفهوم خاطئ)."],
["Lifestyle habits like smoking or poor diet are not direct causes of primary brain tumors","عادات الحياة زي التدخين أو الأكل الوحش مش أسباب مباشرة لأورام المخ الأولية.","سيجارة أو وجبة سريعة مش سبب مباشر للورم الأولي في المخ."]
]],
["Classification of brain tumors",[
["a) Primary brain tumors: They originate in or near the brain tissue and may be cancerous or noncancerous.","أ) الأورام الأولية: بتبدأ جوه نسيج المخ أو قريب منه، وممكن تكون سرطانية أو غير سرطانية.","زي شجرة اتزرعت ونبتت في نفس الأرض."],
["The most common primary tumors include:","أشهر الأورام الأولية هي:","دي القايمة اللي لازم تحفظها."],
["Meningiomas form in the meninges, the protective lining of the brain.","Meningiomas بتتكون في السحايا (meninges)، وهي الغشاء الواقي بتاع المخ.","Meninges = سحايا، يعني الورم بيطلع من الغطا اللي حوالين المخ."],
["Pituitary adenoma develop in the pituitary gland.","Pituitary adenoma بتتكون في الغدة النخامية.","Pituitary = النخامية، يعني ورم في الغدة الصغيرة اللي في قاع المخ."],
["Medulloblastoma tumors arise from the cerebellum or brainstem.","Medulloblastoma بتنشأ من المخيخ أو جذع المخ.","المخيخ وجذع المخ في الخلف وتحت، ومن هناك بيطلع الورم ده."],
["Acoustic neuroma is a tumor of eighth cranial nerve","Acoustic neuroma هو ورم في العصب القحفي الثامن.","العصب الثامن هو عصب السمع والاتزان، فالورم ده بيأثر على السمع."],
["Lymphoma that originates in the central nervous system (primary brain lymphoma)","Lymphoma بتبدأ في الجهاز العصبي المركزي (primary brain lymphoma).","ورم الغدد الليمفاوية بس مكانه الأصلي في المخ مش الجسم."],
["Hemangioblastomas that originate in blood vessels","Hemangioblastomas بتبدأ من الأوعية الدموية.","الورم هنا بيطلع من الشرايين والأوردة نفسها."],
["b) Secondary brain tumors: These tumors called metastatic brain tumors. That originate in another part of the body and spread to the brain.","ب) الأورام الثانوية: اسمها كمان metastatic brain tumors. بتبدأ في جزء تاني من الجسم وبعدين بتنتقل للمخ.","زي نبتة بذرتها جت من جنينة تانية واستقرت في المخ."],
["Thus, they are always cancerous and occur commonly from the lung, breast, lower gastro-intestinal tract, pancreas, kidney and skin.","علشان كده هي دايمًا سرطانية، وبتيجي في الغالب من الرئة والثدي والجزء السفلي من الجهاز الهضمي والبنكرياس والكلى والجلد.","الثانوي = سرطاني دايمًا، عكس الأولي اللي ممكن يكون حميد."],
["Many types of cancer that can spread to the brain include:","أنواع كتير من السرطان ممكن تنتشر للمخ، منها:","دي القايمة اللي بتروح منها الخلايا للمخ."],
["Breast cancer - Lung cancer","سرطان الثدي - سرطان الرئة.","أكتر اتنين هتلاقيهم قدامك."],
["Kidney cancer - Skin cancer (melanoma)","سرطان الكلى - سرطان الجلد (melanoma).","Melanoma هو سرطان الجلد الخبيث."],
["Thyroid cancer - Colon cancer","سرطان الغدة الدرقية - سرطان القولون.","كمل القايمة: ثدي، رئة، كلى، جلد، درقية، قولون."]
]],
["Clinical manifestation of brain tumor",[
["1. Increased intracranial pressure (ICP)","1. زيادة الضغط داخل الجمجمة (ICP).","الجمجمة صندوق مقفول، وأي حاجة زيادة جواه بتزود الضغط."],
["Symptoms of increased ICP result from a gradual compression of the brain by the enlarging tumor include;","أعراض زيادة الضغط بتحصل من ضغط تدريجي على المخ من الورم وهو بيكبر، وتشمل:","زي بالون بيتنفخ جوه علبة، كل ما يكبر بيضغط على اللي حواليه."],
["Headache, worse in the morning.","صداع، وبيبقى أسوأ الصبح.","المريض بيصحى من النوم وصداعه تقيل."],
["Projectile vomiting, not preceded by nausea.","قيء قذفي (projectile)، من غير ما يسبقه غثيان.","المريض بيرجّع فجأة بقوة من غير ما يحس إنه هيرجّع قبلها."],
["Visual disturbance \"blurred vision\".","اضطراب في النظر، يعني زغللة (blurred vision).","المريض يشتكي إن الرؤية مش واضحة."],
["2. Localized symptoms: Depending on which area of the brain is affected, a tumor can do any of the following:","2. الأعراض الموضعية: على حسب المنطقة المتأثرة في المخ، الورم ممكن يعمل أي من الحاجات الجاية.","كل منطقة في المخ ليها وظيفة، فالعرض بيدل على مكان الورم."]
]],
["Clinical manifestation of brain tumor (continued)",[
["Seizures or convulsions","تشنجات.","المريض يقع فجأة وجسمه يرتعش من غير ما يتحكم فيه."],
["Difficulty thinking or speaking","صعوبة في التفكير أو الكلام.","يبقى عايز يقول كلمة وملقيهاش، أو تفكيره بطيء."],
["Personality or behavior changes","تغير في الشخصية أو السلوك.","واحد هادي طول عمره بقى عصبي وغريب في تصرفاته."],
["Weakness, numbness or paralysis in one part or one side of the body","ضعف أو تنميل أو شلل في جزء واحد أو في جانب واحد من الجسم.","إيد ورجل الناحية اليمين مثلًا ضعاف، والشمال سليمة."],
["Loss of hearing","فقدان السمع.","يقول لك: مبسمعش كويس من ودني."],
["Vision changes","تغيرات في الرؤية.","النظر اتغير فجأة من غير سبب واضح في العين."],
["Confusion and disorientation","تشوش وعدم تركيز في الزمان والمكان.","يسأل: أنا فين؟ واليوم إيه؟"],
["Memory loss","فقدان الذاكرة.","ينسى حاجات حصلت من شوية."],
["Sensory and motor abnormalities: Impair the ability to feel heat, cold, pressure, a light touch, or sharp objects","اضطرابات في الحس والحركة: بتضعف قدرة المريض إنه يحس بالسخونة أو البرودة أو الضغط أو اللمسة الخفيفة أو الأجسام الحادة.","يمسك كوباية شاي سخنة ومحسش بسخونتها.",["i0"]]
]],
["Precautions to reduce brain tumor",[
["Precautions to reduce brain tumor taking proactive steps is key to minimizing risk.","احتياطات لتقليل خطر ورم المخ: خدّ خطوات استباقية هو المفتاح لتقليل الخطر.","زي ما بتسوق بحذر عشان تتجنب الحادثة، قبل ما تحصل."],
["1-Avoid radiation exposure","1- تجنب التعرض للإشعاع.","ابعد عن الإشعاع اللي ملوش لازمة."],
["One of the few known modifiable risk factors for brain cancers is exposure to ionizing radiation. Although they are essential tools in contemporary medicine, CT scans and therapeutic radiation should be used sparingly.","من العوامل القليلة المعروفة اللي نقدر نغيرها في سرطانات المخ هو التعرض للإشعاع المؤين. ورغم إن الأشعة المقطعية والعلاج الإشعاعي أدوات أساسية في الطب الحديث، لازم نستخدمهم بحساب وقلة.","الدكتور مايكتبش أشعة مقطعية إلا لو محتاجها فعلًا."],
["2-Maintain a Health Lifestyle","2- حافظ على نمط حياة صحي.","روتين يومي سليم."],
["A balanced lifestyle lowers the risk of tumors and has a major impact on general brain health.","نمط الحياة المتوازن بيقلل خطر الأورام وله تأثير كبير على صحة المخ بشكل عام.","اكل سليم ونوم ورياضة بيحموا المخ زي ما بيحموا باقي الجسم."],
["3-Nutrition & Diet","3- التغذية والنظام الغذائي.","الأكل اللي بتختاره بيفرق."],
["Berries, cruciferous vegetables, and leafy greens","توت، والخضار الصليبية (زي القرنبيط والكرنب)، والخضار الورقية.","طبق سلطة خضراء بجرجير وخس وكرنب."],
["Omega-3 fatty acids (found in flaxseeds and fatty fish, for example)","أحماض أوميجا-3 الدهنية (موجودة في بذور الكتان والسمك الدهني مثلًا).","سردين أو ماكريل مع بذور الكتان."],
["Nuts, legumes, and whole grains","مكسرات، وبقوليات، وحبوب كاملة.","فول وعدس وخبز بلدي أسمر."],
["Dietary Pitfalls to Avoid Foods to avoid in the Context of Brain Tumors","أخطاء غذائية لازم نتجنبها: أطعمة نبعد عنها في سياق أورام المخ.","دي قايمة الممنوعات."],
["Red and processed meats frequently include nitrosamines and other carcinogens.","اللحوم الحمرا واللحوم المصنعة غالبًا فيها نيتروزامينات ومواد تانية مسرطنة.","البسطرمة والسجق والمارتديلا من المصنعة."],
["Rich in artificial additives, hydrogenated fats, and sugar","أكل غني بالإضافات الصناعية والدهون المهدرجة والسكر.","الشيبسي والحلويات المعبأة."],
["Undercooked meats and hard cheeses are particularly hazardous during treatment phases because they increase the risk of infection in vulnerable people.","اللحوم الغير مستوية والجبن الصلب خطر بشكل خاص أثناء مراحل العلاج، لأنها بتزود خطر العدوى عند الناس الضعاف.","المريض في العلاج مناعته ضعيفة، فاللحمة نصف المستوية خطر عليه."],
["4-Exercise","4- الرياضة.","حركة كل يوم."],
["Do 150 minutes of moderate aerobic activity every week.","اعمل 150 دقيقة تمرين هوائي متوسط الشدة كل أسبوع.","مشي سريع نص ساعة، 5 أيام في الأسبوع."],
["Frequent exercise lowers inflammation and helps control hormones.","التمرين المنتظم بيقلل الالتهاب وبيساعد على ضبط الهرمونات.","الجسم المتحرك التهابه أقل وهرموناته أهدى."],
["Physically active people had decreased rates of meningioma, according to studies.","الناس النشيطة بدنيًا كانت نسبة إصابتها بـ meningioma أقل، حسب الدراسات.","اللي بيتحرك كتير فرصته أقل في الـ meningioma."],
["5-Say no to alcohol & tobacco","5- قول لا للكحول والتبغ.","لا سجاير ولا كحول."],
["In addition to being proven carcinogens, alcohol and tobacco also cause oxidative stress and inflammation.","الكحول والتبغ مواد مسرطنة مثبتة، وكمان بيسببوا إجهاد تأكسدي والتهاب.","زي صدا بيأكل في الخلايا ويسبب التهاب."],
["6-Minimize Electromagnetic & Chemical Exposures","6- قلل التعرض للمجالات الكهرومغناطيسية والكيماويات.","قلل من اللي ملوش لازمة."],
["Despite the lack of solid studies, it is prudent to limit needless exposure:","رغم قلة الدراسات القوية، من الحكمة تقليل التعرض اللي ملوش لازمة:","احتياط بسيط بدل ما تستنى."],
["For extended calls, use speakerphone or hands-free alternatives.","في المكالمات الطويلة استخدم السماعة الخارجية (speaker) أو سماعة اليد الحرة.","كلم على السبيكر أو سماعة الودن."],
["When not in use, keep mobile devices away from the head","لما مش بتستخدم الموبايل، خليه بعيد عن الراس.","متحطش الموبايل تحت المخدة."],
["7-Exposure to Chemicals","7- التعرض للكيماويات.","الكيماويات في شغلك."],
["Certain industrial solvents, pesticides, and herbicides have been connected to an increased incidence of brain tumors in work environments.","مذيبات صناعية معينة والمبيدات الحشرية ومبيدات الأعشاب اتربطت بزيادة حدوث أورام المخ في أماكن الشغل.","عامل بيرش مبيدات كل يوم من غير حماية."],
["Take precautions:","خد احتياطاتك:","الوقاية الأول."],
["When working with chemicals, wear safety gear. Whenever possible, choose organic produce. Avoid using chemical disinfectants and sprays indoors.","لما تشتغل مع الكيماويات البس معدات الحماية. لو أمكن اختار المنتجات العضوية. وتجنب استخدام المطهرات الكيماوية والبخاخات جوه البيت.","كمامة وجوانتي مع الكيماويات، وسبراي الحشرات برا البيت."]
]],
["Diagnosis of brain tumor",[
["Diagnosis of brain tumor:","تشخيص ورم المخ:","خطوات بتتعمل واحدة ورا التانية.",["i1"]],
["1. A neurological exam to evaluate neurological functions and look for changes in balance, hearing, vision, mental status and reflexes.","1. فحص عصبي (neurological exam) لتقييم وظائف الجهاز العصبي والبحث عن تغيرات في الاتزان والسمع والنظر والحالة الذهنية والمنعكسات.","الدكتور يطلب من المريض يمشي على خط مستقيم ويتابع بعينه قلم."],
["2. Magnetic resonance imaging or computed tomography","2. الرنين المغناطيسي أو الأشعة المقطعية.","صور تفصيلية للمخ من جوه."],
["Magnetic resonance imaging (MRI) is the best test for identifying brain tumors but computed tomography (CT) is an alternative. Before these tests, a contrast agent is injected into a vein to show the tumor’s size and exact position in great detail.","الرنين المغناطيسي (MRI) هو أفضل فحص لتحديد أورام المخ، والأشعة المقطعية (CT) بديل. قبل الفحوصات دي بيتحقن مادة تباين (contrast) في الوريد عشان تظهر حجم الورم ومكانه بالظبط بتفاصيل كبيرة.","المادة دي زي صبغة بتنوّر الورم في الصورة."],
["3. A spinal tap (lumbar puncture): Sometimes is done to obtain cerebrospinal fluid (CSF) for examination. This procedure is done when doctors suspect that the tumor has invaded the layers of tissues that cover the brain (meninges).","3. البزل القطني (lumbar puncture): بيتعمل أحيانًا لأخذ عينة من السائل المخي الشوكي (CSF) للفحص. بيتعمل لما الدكاترة يشتبهوا إن الورم دخل طبقات الأنسجة اللي بتغطي المخ (السحايا).","بيسحبوا شوية سائل من الضهر عشان يشوفوا هل الورم وصل للغطا."],
["4. A biopsy of the tumor (removal of a sample of the tumor for examination under a microscope) is done when results of MRI and other tests cannot definitively identify what the type of tumor is and whether or not it is cancerous. A biopsy may be done during surgery, in which all or part of the tumor is removed.","4. خزعة من الورم (biopsy): أخذ عينة من الورم وفحصها تحت الميكروسكوب. بتتعمل لما نتايج الرنين والفحوصات التانية متقدرش تحدد نوع الورم بشكل قاطع وهل هو سرطاني ولا لأ. ممكن تتعمل أثناء الجراحة اللي بيتشال فيها الورم كله أو جزء منه.","لو الصور مش حاسمة، العينة تحت الميكروسكوب هي الحكم."]
]],
["Medical management of brain tumor",[
["Medical management of brain tumor:\n1. Drug therapy(medical treatment)\n2. Surgery.\n3. Radiation therapy.\n4. Radiosurgery\n5. Brachytherapy\n6. Chemotherapy.","العلاج الطبي لورم المخ: 1. العلاج بالأدوية، 2. الجراحة، 3. العلاج الإشعاعي، 4. الجراحة الإشعاعية (radiosurgery)، 5. العلاج الإشعاعي الداخلي (brachytherapy)، 6. العلاج الكيماوي.","دي 6 طرق علاج، والدكتور بيختار على حسب الحالة.",["i3"]],
["1) Drug therapy: - To help alleviate the patient's signs and symptoms, the doctor may order;","1) العلاج بالأدوية: عشان يخفف علامات وأعراض المريض، الدكتور ممكن يكتب:","الأدوية هنا بتريّح الأعراض.",["i4"]],
["Analgesic to relieve headache.","مسكن عشان يخفف الصداع.","برشام للصداع."],
["Anticonvulsant to control or prevent seizures.","مضاد للتشنج عشان يتحكم في التشنجات أو يمنعها.","دوا بيمنع المريض يتشنج."],
["Corticosteroids such as dexamethasone to reduce swelling around the tumor and reduce pressure within the skull.","كورتيكوستيرويدات زي dexamethasone عشان تقلل التورم حوالين الورم وتقلل الضغط جوه الجمجمة.","زي ما بتحط تلج على ورمة، الكورتيزون بيهد التورم.",["i5"]],
["2) Brain surgery “Craniotomy”: -","2) جراحة المخ (Craniotomy):","فتح الجمجمة عشان توصل للورم.",["i6"]],
["For craniotomy, part of the scalp is shaved. Then, an incision is made in the skull. A small piece of bone above the tumor is removed, after tumor removal the bone is then replaced and the incision stitched closed. The tumor is located and removed using one of the following:","في الـ craniotomy بيتحلق جزء من فروة الراس. بعدها بيتعمل شق في الجمجمة. بيتشال قطعة عضم صغيرة فوق الورم، وبعد شيل الورم بترجع العضمة وبيتخيط الشق. بيتحدد مكان الورم وبيتشال بواحدة من الطرق الجاية:","زي ما بتفتح غطا علبة، تاخد اللي جواها وترجع الغطا مكانه."],
["A scalpel may be used to cut out the tumor.","ممكن يتستخدم مشرط عشان يقطع الورم.","قطع بالمشرط."],
["A laser may be used to vaporize the tumor.","ممكن يتستخدم ليزر عشان يبخّر الورم.","الليزر يخلي الورم يتبخر."],
["A device that emits ultrasound waves may be used to break the tumor apart, so that the pieces can be suctioned out (aspirated).","ممكن يتستخدم جهاز بيطلّع موجات فوق صوتية عشان يفتت الورم، فتتسحب القطع (aspirated).","يفتتوه زي ما بتفتت حجر وبعدين بتشفطه."],
["3) Radiation therapy: High doses of X-rays destroy brain tumor cells or shrink the tumor in this type of treatment.","3) العلاج الإشعاعي: جرعات عالية من أشعة إكس بتدمر خلايا ورم المخ أو بتصغّر الورم في النوع ده من العلاج.","شعاع مركز على الورم يضعفه.",["i2"]],
["4) Chemotherapy: This therapy consists of anticancer drugs that kill cancer cells in brain and throughout body. It can be received through an injection into a vein or take it as a pill. Chemotherapy may recommend after surgery to kill any cancer cells left behind or to prevent remaining tumor cells from growing.","4) العلاج الكيماوي: علاج فيه أدوية مضادة للسرطان بتقتل الخلايا السرطانية في المخ وفي الجسم كله. بيتاخد حقنة في الوريد أو حبة (pill). ممكن يتوصى بيه بعد الجراحة عشان يقتل أي خلايا سرطانية فاضلة أو يمنع الخلايا المتبقية من الورم إنها تكبر.","بعد الجراحة، الكيماوي زي تنضيف أخير لأي حتة صغيرة فاضلة."]
]],
["Nursing management of brain tumor",[
["1. Assessment:","1. التقييم:","أول خطوة قبل أي تدخل."],
["Perform baseline assessment.","اعمل تقييم أساسي (baseline) للمريض.","تسجل حالته الأولى عشان تقارن بيها بعدين."],
["Monitor vital signs.","راقب العلامات الحيوية.","ضغط ونبض وحرارة وتنفس بشكل مستمر."],
["Maintain a neurological flow record.","احتفظ بسجل متابعة عصبي (neurological flow record).","ورقة بتتسجل فيها حالة المريض العصبية كل شوية."],
["Evaluate the progress of patient's condition through monitoring of manifestation (both physical & mental status) and how the patient is functioning e.g. pain, problems with respiration, moving, walking etc.","قيّم تطور حالة المريض عن طريق متابعة الأعراض (الحالة الجسدية والذهنية) وإزاي المريض بيؤدي وظايفه، زي الألم ومشاكل التنفس والحركة والمشي وغيره.","تلاحظ هل بيمشي أحسن النهاردة ولا أسوأ من امبارح."],
["Assess the impact of patient's illness on family (altered relationship, financial problem &home care).","قيّم تأثير مرض المريض على الأسرة (تغير العلاقات، مشاكل مالية، الرعاية المنزلية).","المرض بيأثر على البيت كله مش على المريض بس."],
["2. Nursing diagnosis: -","2. التشخيص التمريضي:","المشاكل اللي التمريض هيشتغل عليها."],
["Self-care deficit (feeding, bathing, and toileting) related to loss or impairment of motor and sensory function and decreased cognitive abilities.","عجز في الرعاية الذاتية (الأكل والاستحمام والتواليت) بسبب فقدان أو ضعف الوظيفة الحركية والحسية وانخفاض القدرات الذهنية.","المريض مش قادر ياكل أو يستحمى لوحده."],
["Imbalanced nutrition less than body requirements related to vomiting due to treatment and tumor effects, decreased nutritional intake, and mal-absorption.","تغذية غير متوازنة أقل من احتياجات الجسم بسبب القيء من العلاج وتأثير الورم، وقلة الأكل، وسوء الامتصاص.","بيرجّع وبياكل قليل، فجسمه مش واخد اللي محتاجه."],
["Anxiety related to fear of dying, change in appearance, or altered life style.","قلق بسبب الخوف من الموت أو تغير الشكل أو تغير نمط الحياة.","خايف يموت أو شكله يتغير أو حياته تتقلب."],
["3. Nursing intervention: -","3. التدخلات التمريضية:","اللي هنعمله عشان نحل المشاكل اللي فوق."],
["a. Compensating for self-care deficit.","أ. تعويض العجز في الرعاية الذاتية.","نسد النقص في اللي المريض مش قادر يعمله."],
["Encourage the patient to keep as independent as possible.","شجّع المريض يفضل مستقل قد ما يقدر.","سيبه ياكل بنفسه لو يقدر."],
["Increasing assistance with self-care activities.","زوّد المساعدة في أنشطة الرعاية الذاتية.","كل ما حالته تسوء ساعده أكتر."],
["Encourage the patient to plan for each day.","شجّع المريض إنه يخطط لكل يوم.","جدول بسيط ليومه."],
["Orient patient to the environment and new experiences or people as needed.","عرّف المريض بالبيئة والتجارب أو الناس الجداد حسب الحاجة.","قوله إنت في أوضة كذا والممرضة اللي جاية اسمها كذا."],
["Assist the patient to find useful coping mechanisms, adaptations, and compensations for solving problem that arise.","ساعد المريض يلاقي آليات تكيف وتعويضات مفيدة لحل المشاكل اللي بتظهر.","لو مش قادر يقفل الزرار، نوريه طريقة بديلة."],
["Individualized exercise program helps maintain strength, endurance, and range of motion.","برنامج تمارين مخصص للمريض بيساعد على الحفاظ على القوة والتحمل ومدى الحركة.","تمارين مناسبة لحالته هو بالذات."],
["Eventually, referral for home care may be necessary.","في النهاية ممكن يبقى لازم تحويل للرعاية المنزلية.","ممرضة تزوره في البيت بعد الخروج."],
["b. Improving nutrition","ب. تحسين التغذية.","نخلي المريض ياكل أحسن."],
["The patient needs to be clean, comfortable and free of pain for meals, in an environment that is an attractive as possible.","المريض محتاج يكون نضيف ومرتاح وخالي من الألم وقت الأكل، في بيئة جذابة قد الإمكان.","نجهزه قبل الأكل ونخلي المكان لطيف."],
["Oral hygiene before and after meals.","نضافة الفم قبل وبعد الوجبات.","غسيل الفم قبل ما ياكل وبعده."],
["Offensive sights, sounds, and odors are eliminated.","نشيل المناظر والأصوات والروايح المزعجة.","نبعد أي ريحة وحشة أو منظر مقرف."],
["Provide enough fluids and increase opportunities for socialization during meals.","وفّر سوائل كفاية وزوّد فرص التواصل الاجتماعي أثناء الوجبات.","ياكل مع حد يتكلم معاه."],
["Provide dietary supplements.","قدّم مكملات غذائية.","لو الأكل مش كفاية نكمله بمكمل."],
["Those foods preferred by the patient should be offered.","الأطعمة اللي المريض بيفضلها لازم تتقدم له.","اللي بيحبه هو اللي نقدمه."],
["Some other form of nutritional support (e.g. tube feeding, parenteral nutrition) may be indicated.","ممكن يتطلب شكل تاني من الدعم الغذائي (زي التغذية بالأنبوب أو التغذية بالوريد).","لو مبياكلش خالص، الأنبوب أو المحلول الغذائي."],
["c. Relieving anxiety","ج. تخفيف القلق.","نهدّي المريض."],
["Spending time with patients allows them to talk and communicate their fears and concerns.","قضاء وقت مع المريض بيخليه يتكلم ويعبّر عن مخاوفه وقلقه.","اقعد جنبه واسمعه."],
["Provide reassurance that continuing care will be provided. Assist the patient in developing anxiety-reducing skills (e.g. relaxation, deep breathing, positive visualization and reassuring self-statements).","طمّنه إن الرعاية هتستمر. وساعده يكتسب مهارات تقلل القلق (زي الاسترخاء والتنفس العميق والتخيل الإيجابي وجمل التطمين الذاتي).","علّمه ياخد نفس عميق ويقول لنفسه: أنا هبقى كويس."],
["Additional help from a spiritual advisor, social worker, friends, family members or mental health professional may be indicated.","ممكن يتطلب مساعدة إضافية من مرشد روحي أو أخصائي اجتماعي أو أصدقاء أو أهل أو متخصص صحة نفسية.","شيخ أو قسيس أو أخصائي نفسي أو حد من العيلة."],
["4. Evaluation: -","4. التقييم:","نشوف هل وصلنا للنتايج."],
["Expected patient outcomes","النتايج المتوقعة للمريض:","دي أهداف النجاح."],
["Engages in self-care activities as long as possible.","يشارك في أنشطة الرعاية الذاتية أطول مدة ممكنة.","يفضل يعتمد على نفسه."],
["Maintains as optimal a nutritional status as possible.","يحافظ على حالة غذائية مثلى قد الإمكان.","وزنه ومستوى أكله ثابتين."],
["Reports being less anxious.","يقول إنه أقل قلقًا.","يقول لك: أنا مرتاح أكتر."]
]],
["Nursing process for patients undergoing intracranial surgery",[
["Preoperative assessment and preparation: -","التقييم والتحضير قبل الجراحة:","كل اللي بنعمله قبل العملية."],
["1. Assessment of the level of responsiveness or consciousness and the presence of any neurologic deficits.","1. تقييم مستوى الاستجابة أو الوعي ووجود أي عجز عصبي.","نشوف المريض واعي قد إيه وفيه حاجة ضعيفة ولا لأ."],
["2. Observations of paralysis, visual dysfunction, alterations in personality or speech, and bladder and bowel disturbances.","2. ملاحظة الشلل وخلل الرؤية وتغيرات الشخصية أو الكلام واضطرابات المثانة والأمعاء.","نراقب الشلل والنظر والكلام والتحكم في البول والبراز."],
["3. Observation of leg movement should be especially noted if the patient is not ambulatory.","3. ملاحظة حركة الرجل بشكل خاص لو المريض مش بيمشي.","لو بيقعد على السرير نتابع رجليه."],
["4. For paralysis of the extremities, trochanter rolls are applied to both extremities, and the feet are positioned against a footboard.","4. في حالة شلل الأطراف، بتتحط لفات تروكانتر (trochanter rolls) على الطرفين، وبتتوضع القدمين على لوح القدم (footboard).","لفة قماش جنب الفخذ تمنع الرجل تلف، ولوح للقدم يسندها."],
["5. If the patient is aphasic, writing materials or picture and word cards showing the bedpan, glass of water, blanket, and other frequently used items may be supplied to help improve communication.","5. لو المريض عنده aphasia (فقدان القدرة على الكلام أو الفهم)، ممكن نوفر أدوات كتابة أو كروت صور وكلمات للبونش (bedpan) وكوباية المية والبطانية وأي حاجات بتتستخدم كتير، عشان تحسّن التواصل.","يشاور على صورة كوباية المية لو عايز يشرب."],
["6. If the patient is able to ambulate. He is encouraged to do so in an unhurried way.","6. لو المريض قادر يمشي، بنشجعه يمشي من غير استعجال.","نخليه يمشي براحته."],
["7. The emotional preparation of the patient is also important including informing him with post-operative expectations.","7. التحضير النفسي للمريض مهم كمان، ويشمل إنه يتعرف على المتوقع بعد العملية.","نقوله إيه اللي هيحصل لما يفوق."],
["Post-operative intervention: -","التدخلات بعد الجراحة:","اللي بنعمله بعد العملية."],
["When caring for patients with intracranial tumor surgery follow these guidelines: Place the patient on side. If he had a craniectomy, don't place him on his operative side, because that would pressure directly on his brain. To reduce the risk of increased ICP, make sure his head remain higher than the rest of his body.","لما تهتم بمرضى جراحة أورام المخ اتبع الإرشادات دي: حط المريض على جنبه. لو كان عنده craniectomy، متحطوش على ناحية العملية، لأن ده هيضغط على مخه مباشرة. ولتقليل خطر زيادة ICP، اتأكد إن راسه فضلت أعلى من باقي جسمه.","نرفع راسه ونبعده عن الجنب المعمول فيه العملية."],
["Nursing diagnosis: -","التشخيص التمريضي:","3 مشاكل بعد الجراحة."],
["1. Disturbed sensory perceptions (visual / auditory) related to edema and head dressings","1. اضطراب الإدراك الحسي (بصري / سمعي) بسبب الورم (edema) وضمادات الراس.","الضمادة على الراس والتورم يعملوا مشاكل في النظر والسمع."],
["2. Risk for cerebral edema secondary to intracranial surgery.","2. خطر حدوث وذمة مخية (cerebral edema) بعد الجراحة داخل الجمجمة.","المخ ممكن ينتفخ بعد العملية."],
["3. Risk for ineffective breathing pattern related to postoperative cerebral edema.","3. خطر نمط تنفس غير فعال بسبب الوذمة المخية بعد الجراحة.","لو المخ انتفخ، التنفس ممكن يتأثر."],
["Nursing intervention:","التدخلات التمريضية:","نبدأ بالمشكلة الأولى."],
["1. Disturbed sensory perceptions (visual / auditory) related to edema and head dressings.","1. اضطراب الإدراك الحسي (بصري / سمعي) بسبب التورم وضمادات الراس.","نفس التشخيص الأول."],
["Goal: Compensate for sensory deprivation and prevention of injury.","الهدف: تعويض الحرمان الحسي ومنع الإصابة.","نعوض اللي المريض مش شايفه أو سامعه ونحميه من الأذى."],
["1. Perform supportive measures until the patient is able to care for self;","1. اعمل إجراءات داعمة لحد ما المريض يقدر يهتم بنفسه:","نساعده لحد ما يقف على رجله."],
["a) Change position as indicated; he aware that position changes can increase intracranial pressure.","أ) غيّر الوضعية حسب الإرشادات، وخد بالك إن تغيير الوضعية ممكن يزود الضغط داخل الجمجمة.","نقلبه برفق ومن غير حركة مفاجئة."],
["b) Administer prescribed analgesics (codeine) that do not mask the level of responsiveness.","ب) أدي المسكنات الموصوفة (كوديين) اللي مبتخبيش مستوى الاستجابة.","المسكن ميخليش المريض نايم لدرجة منعرفش حالته."],
["2. Use prescribed measures to relieve signs of periocular edema;","2. استخدم الإجراءات الموصوفة لتخفيف علامات الورم (التورم) حوالين العين:","تورم حوالين عينيه بعد العملية."],
["a) Lubricate eyelids and around eyes with petrolatum.","أ) رطّب الجفون وحوالين العين بالفازلين (petrolatum).","فازلين على الجفون."],
["b) Apply light, cold compresses over eyes at specified intervals.","ب) حط كمادات باردة خفيفة على العينين في مواعيد محددة.","كمادة بقماش بارد كل فترة."],
["c) Observe for signs of keratins if coma has no sensation.","ج) لاحظ علامات التهاب القرنية (الكلمة مكتوبة keratins في المحاضرة) لو المريض في غيبوبة وملوش إحساس.","المريض في غيبوبة مش بيرمش، فعينه تتجرح."],
["3. Put extremities through range of motion exercises.","3. اعمل لأطراف المريض تمارين مدى الحركة (range of motion).","حرّك دراعه ورجله بالدور."],
["4. Evaluate and support patient during episodes of restlessness.","4. قيّم المريض وادعمه أثناء نوبات الهياج (restlessness).","لو قلقان وبيتحرك كتير، قعد جنبه وهدّيه."],
["2. Risk for cerebral edema secondary to intracranial surgery.","2. خطر الوذمة المخية بعد الجراحة داخل الجمجمة.","التشخيص التاني."],
["Goal: Prevention of cerebral edema.","الهدف: الوقاية من الوذمة المخية.","نمنع المخ من الانتفاخ."],
["1. Assess patient's level of responsiveness, consciousness; the diminution of the level of consciousness may be the first sign of increased ICP;","1. قيّم مستوى استجابة المريض ووعيه؛ نقص مستوى الوعي ممكن يكون أول علامة على زيادة ICP:","لو بقى أقل وعيًا فده إنذار مبكر."],
["a) Eye opening (spontaneous to sound, to pain); papillary reactions to light.","أ) فتح العينين (تلقائي، للصوت، للألم)؛ وتفاعل الحدقتين مع الضوء (الكلمة في المحاضرة papillary).","نشوف هل بيفتح عينه لوحده ولا لما ننده."],
["b)Response to commands.","ب) الاستجابة للأوامر.","نقوله: ارفع إيدك."],
["c) Assessment of spinal motor reflexes (pinch Achilles tendon, arm, or other body site).","ج) تقييم المنعكسات الحركية الشوكية (قرص وتر أخيل أو الدراع أو أي مكان تاني في الجسم).","نقرص بشكل محسوب ونشوف ردة فعله."],
["d) Observation of patient's spontaneous activity.","د) ملاحظة نشاط المريض التلقائي.","نشوف هو بيتحرك لوحده ولا ساكن."],
["2. Keep a neurologic flow sheet for sequentially assessing and documenting neurologic status, fluid administration, therapeutic agents, and laboratory data.","2. احتفظ بورقة متابعة عصبية (neurologic flow sheet) لتقييم وتوثيق الحالة العصبية وإعطاء السوائل والأدوية والتحاليل بالتسلسل.","ورقة واحدة فيها كل حاجة مترتبة."],
["3. Evaluate for signs and symptoms of increasing ICP, which can lead to ischemia and further impairment of brain function;","3. قيّم علامات وأعراض زيادة ICP، اللي ممكن توصل لنقص تروية (ischemia) ومزيد من اضطراب وظيفة المخ:","الضغط العالي بيمنع الدم من توصل للمخ."],
["4. Assess patient minute by minute, hour by hour, for;","4. قيّم المريض دقيقة بدقيقة وساعة بساعة بحثًا عن:","متابعة لصيقة."],
["a) Diminished response to stimuli.","أ) نقص الاستجابة للمنبهات.","مبيردش زي الأول."],
["b) Fluctuations of vital signs.","ب) تذبذب العلامات الحيوية.","الضغط والنبض بيطلعوا وينزلوا."],
["c) Restlessness.","ج) الهياج.","مش مستقر في السرير."],
["d)Weakness and paralysis of extremities.","د) ضعف وشلل في الأطراف.","فجأة مبيحركش دراعه."],
["e) Increasing headache.","هـ) زيادة الصداع.","يشتكي إن الصداع زاد."],
["f) Changes or disturbances of vision; papillary changes.","و) تغيرات أو اضطرابات في الرؤية وتغيرات الحدقتين (papillary في المحاضرة).","زغللة أو تغير في حجم الحدقة."],
["5. Modify nursing management to prevent further increase in ICP.","5. عدّل الرعاية التمريضية عشان تمنع زيادة ICP أكتر.","نغير طريقة التعامل لو الضغط بيزيد."],
["6. Control postoperative cerebral edema (as prescribed) by:","6. تحكم في الوذمة المخية بعد الجراحة (حسب الوصفة) عن طريق:","نمنع الانتفاخ بالأدوية والسوائل."],
["a) Administer steroids and osmotic dehydrating agents when prescribed in postoperative periods to reduce brain swelling.","أ) إعطاء الستيرويدات والعوامل الأسموزية المجففة (osmotic dehydrating agents) لما تتوصف بعد الجراحة لتقليل تورم المخ.","أدوية بتسحب المية الزيادة من المخ."],
["b) Monitor fluid intake; basic fluid requirements are usually precisely calculated care is taken not to overload the patient.","ب) راقب السوائل الداخلة؛ بيتحسب الاحتياج الأساسي من السوائل عادة بدقة، وبيتاخد حذر من إنه مايتحملش المريض سوائل زيادة.","محدش بيدي مريض المخ سوائل زيادة عن اللازم."],
["3. Risk for ineffective breathing pattern related to postoperative cerebral edema.","3. خطر نمط تنفس غير فعال بسبب الوذمة المخية بعد الجراحة.","التشخيص التالت، ونهاية الصفحات اللي اتبعتت."]
]]
];
