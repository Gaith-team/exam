 ])

 ]),

  ["Getting regular medical care",

 ]),

 ]),
 G('3 · Mental self-care', 'الرعاية العقلية', [

    }).join('');
    const head = g.h ? `<div class="grp-h"><b>${g.h}</b><span>${g.hAr}</span></div>` : '';
    body += `<div class="grp" style="--sa:${s.c[0]}">${head}${items}</div>`;
  });
  html += `<details class="sec" id="${s.id}" open style="--sg:linear-gradient(135deg,${s.c[0]},${s.c[1]})">
    <summary><div class="sec-ic">${s.ic}</div><div class="sec-t"><b>${s.t}</b><span>${s.ar}</span></div><div class="chev">▼</div></summary>
    <div class="sec-body">${body}</div></details>`;
});
app.innerHTML = html;
toc.innerHTML = chips;
document.getElementById('pSec').textContent = DATA.length + ' أقسام';
document.getElementById('pItems').textContent = n + ' نقطة';

/* ============ UI ============ */
const bar = document.getElementById('prog-bar'), topBtn = document.getElementById('top');
addEventListener('scroll', () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
  topBtn.classList.toggle('show', scrollY > 500);
}, { passive: true });
topBtn.onclick = () => scrollTo({ top: 0, behavior: 'smooth' });

const secs = () => [...document.querySelectorAll('.sec')];
const tAll = document.getElementById('toggleAll');
tAll.onclick = () => {
  const anyOpen = secs().some(d => d.open);
  secs().forEach(d => d.open = !anyOpen);
  tAll.textContent = anyOpen ? 'فتح الكل' : 'طي الكل';
};
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const t = document.querySelector(c.getAttribute('href')); if (t) t.open = true;
}));

const themeBtn = document.getElementById('themeBtn');
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
applyTheme(theme);
themeBtn.onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(theme); };
</script>
</body>
</html>
