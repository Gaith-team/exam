<div class="hero"><h1>Assessment of the Renal System</h1><p>شرح ببساطة مع غيث</p></div>
<div class="shell" id="app"></div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>
<script>
const D=[
["Overview of the renal system",[
["The urinary system consists of two kidneys, two ureters, the urinary bladder, and the urethra.","الجهاز البولي متكوّن من كليتين وحالبين ومثانة وإحليل.","زي مصنع (الكلية) وماسورتين (الحالبين) وخزان (المثانة) وحنفية (الإحليل)."],
["The kidneys filter blood, form urine, regulate fluid and electrolyte balance, and contribute to acid–base and blood-pressure regulation.","الكلى بتصفّي الدم وتعمل البول وتظبط السوائل والأملاح وتساهم في ضبط الحموضة وضغط الدم.","لو شربت مياه كتير، الكلى بتطلّع الزيادة في البول."],
["Urine flows from the kidneys through the ureters to the bladder and leaves the body through the urethra.","البول بيمشي من الكلى في الحالبين للمثانة ويخرج من الجسم عن طريق الإحليل.","الكلية ← الحالب ← المثانة ← الإحليل ← بره الجسم."]]],
["Structure of the renal system",[
["Kidneys: paired retroperitoneal organs that produce urine and perform endocrine/metabolic functions.","الكلى عضوين متقابلين ورا الغشاء البريتوني، بيعملوا البول وليهم وظايف هرمونية وأيضية.","الكلية بتعمل البول وكمان بتفرز الإريثروبويتين."],
["Ureters: muscular tubes that propel urine from each renal pelvis to the bladder by peristalsis.","الحالبين أنابيب عضلية بتزق البول من حوض الكلية للمثانة بحركة تموّجية اسمها peristalsis.","زي ما بتضغط على تيوب معجون فيطلع المعجون لقدام."],
["Urinary bladder: muscular reservoir that stores urine.","المثانة خزان عضلي بيخزّن البول.","زي زجاجة بتتملي لحد ما تفضّيها."],
["Urethra: tube that carries urine from the bladder to the exterior.","الإحليل أنبوبة بتنقل البول من المثانة لبره الجسم.","هو الممر اللي البول بيخرج منه وقت التبوّل."]]],
["Kidney structure",[
["Renal capsule: protective fibrous covering around the kidney.","الكبسولة الكلوية غلاف ليفي بيحمي الكلية من برا.","زي جلد الفاكهة اللي بيحمي اللي جواه."],
["Renal cortex: outer region containing renal corpuscles and parts of renal tubules.","القشرة هي الطبقة الخارجية، وفيها الكُريّات الكلوية وأجزاء من الأنيبيبات.","هي الطبقة اللي مباشرة تحت الكبسولة."],
["Renal medulla: inner region arranged into renal pyramids.","اللُب هو الجزء الداخلي، ومترتب على شكل أهرامات كلوية.","لما تقطع الكلية، تلاقي جواها مثلثات شبه الأهرامات."],
["Renal papilla: apex of a renal pyramid where urine drains into a minor calyx.","الحُلَيمة هي طرف الهرم، والبول بينزل منها في الكأس الصغير.","هي زي سنّ الهرم اللي بيقطّر منه البول."],
["Minor and major calyces collect urine and drain toward the renal pelvis.","الكؤوس الصغيرة والكبيرة بتجمع البول وتصرّفه ناحية حوض الكلية.","زي أحواض صغيرة بتصب في حوض أكبر."],
["Renal pelvis: funnel-shaped collecting area that continues as the ureter.","حوض الكلية منطقة تجميع على شكل قمع، وبتكمل على هيئة الحالب.","زي القمع اللي بيجمع السائل ويفضّيه في الماسورة."],
["Renal hilum: entry/exit area for the renal vessels, nerves, lymphatics, and ureter.","السُرّة الكلوية هي مكان دخول وخروج الأوعية والأعصاب والأوعية الليمفاوية والحالب.","هي زي باب الكلية اللي الشريان والوريد والحالب بيعدّوا منه."]]],
["Functions of major renal parts",[
["Glomerulus: filters plasma into the renal corpuscle.","الجلوميرولس بيرشّح البلازما جوه الكُريّة الكلوية.","زي مصفاة بتفصل السائل عن باقي الدم."],
["Bowman's capsule: receives the glomerular filtrate.","كبسولة بومان بتستقبل الراشح اللي طلع من الجلوميرولس.","زي كوباية بتستقبل السائل المصفّى."],
["Proximal tubule: reabsorbs most filtered sodium, water, glucose, amino acids, and bicarbonate.","الأنبوب القريب بيعيد امتصاص معظم الصوديوم والمياه والجلوكوز والأحماض الأمينية والبيكربونات.","الجلوكوز اللي اترشّح بيرجع للدم من هنا."],
["Loop of Henle: helps create the osmotic gradient needed to concentrate urine.","عروة هنلي بتساعد في عمل فرق التركيز الأسموزي اللازم لتركيز البول.","بتخلّي الكلية قادرة تطلّع بول مركّز."],
["Distal tubule: helps electrolytes and acid–base balance.","الأنبوب البعيد بيساعد في ضبط الأملاح وتوازن الحموضة والقلوية.","بيظبط مستوى الأملاح والحموضة."],
["Collecting duct: regulates final water reabsorption and urine concentration, influenced by antidiuretic hormone (ADH) that secreted by hypothalamus.","القناة الجامعة بتتحكم في آخر امتصاص للمياه وتركيز البول، وده بيتأثر بالهرمون المضاد لإدرار البول (ADH) اللي بيفرزه الهيبوثلاماس.","لو ADH زاد، المياه بترجع أكتر والبول يبقى مركّز."]]],
["Major functions of the kidneys",[
["Excretion of metabolic waste products and many drugs/metabolites.","الكلى بتخرّج الفضلات الناتجة عن التمثيل الغذائي وكتير من الأدوية ونواتجها.","دواء بيخلّص شغله فيخرج من الجسم مع البول."],
["Regulation of water, sodium, potassium, calcium, phosphate, and other electrolytes.","بتظبط المياه والصوديوم والبوتاسيوم والكالسيوم والفوسفات وباقي الأملاح.","لو الصوديوم زاد، الكلى بتتخلص من الزيادة."],
["Maintenance of acid–base balance through hydrogen-ion handling and bicarbonate regulation.","بتحافظ على توازن الحموضة والقلوية عن طريق التعامل مع أيون الهيدروجين وتنظيم البيكربونات.","لو الدم بقى حمضي زيادة، الكلى بتعدّل الوضع."],
["Regulation of blood pressure through sodium/water balance. and the renin–angiotensin–aldosterone system.","بتظبط ضغط الدم من خلال توازن الصوديوم والمياه ومن خلال نظام الرينين-أنجيوتنسين-ألدوستيرون.","احتباس الصوديوم والمياه بيرفع الضغط."],
["Endocrine functions: erythropoietin production and activation of vitamin D.","وظايف هرمونية: إنتاج الإريثروبويتين وتنشيط فيتامين D.","الإريثروبويتين بيحفّز النخاع على عمل كرات الدم الحمراء."],
["Contribution to maintenance of normal internal homeostasis.","الكلى بتساهم في الحفاظ على ثبات البيئة الداخلية للجسم الطبيعية (الهوميوستازيس).","كل الوظايف اللي فاتت بتشتغل مع بعض عشان الجسم يفضل متوازن."]]],
["Renal health history",[
["Ask about onset, duration, frequency, severity, and progression of urinary symptoms.","اسأل المريض الأعراض بدأت إمتى، قد إيه مستمرة، بتحصل كل قد إيه، شدتها إيه، وهل بتزيد.","تسأل: «الحرقان ده بدأ من يومين ولا من شهر؟ وبيزيد؟»"],
["Assess urine frequency, volume, color, clarity, odor, blood, foaminess, and pain with urination.","قيّم عدد مرات التبول وكمية البول ولونه وصفاءه وريحته ووجود دم ورغوة وألم وقت التبول.","مريض بيقول إن البول لونه غامق وريحته وحشة."],
["Ask about urgency, hesitancy, weak stream, nocturia, incontinence, and incomplete emptying.","اسأل عن الإلحاح، وتأخر بداية التبول، وضعف الشخّة، والتبول بالليل، وعدم التحكم، والإحساس إن المثانة مفضيتش.","مريض بيصحى كذا مرة بالليل يتبول (nocturia)."],
["Assess flank or suprapubic pain, fever, chills, nausea/vomiting, edema, fatigue, and changes in weight.","قيّم ألم الجنب أو ألم أسفل البطن فوق العانة، والحرارة والرعشة، والغثيان والقيء، والتورم، والإرهاق، وتغيّر الوزن.","مريض بيشتكي من ألم في الجنب مع حرارة ورعشة."],
["Review history of hypertension, diabetes, urinary infections, kidney stones, renal disease, and relevant surgery.","راجع التاريخ المرضي: الضغط والسكر والتهابات المجاري البولية والحصوات وأمراض الكلى وأي عملية مرتبطة.","تسأل: «عندك سكر أو ضغط؟ سبق جالك حصوات؟»"],
["Review medications, nephrotoxic exposures, allergies, fluid intake, and family history of renal disease.","راجع الأدوية، والتعرض لمواد بتضر الكلى، والحساسية، وكمية السوائل اللي بيشربها، والتاريخ العائلي لأمراض الكلى.","تسأل: «بتشرب كام كوباية مياه في اليوم؟ حد في العيلة عنده مشاكل كلى؟»"]]],
["Physical assessment",[
["General inspection: hydration status, pallor, edema, level of distress, and overall appearance.","الفحص العام بالنظر: حالة الترطيب، والشحوب، والتورم، ودرجة التعب، والمظهر العام.","تلاحظ إن المريض شاحب ومتألم وفيه تورم في وشه."],
["Vital signs: pay particular attention to blood pressure, temperature, pulse, and respiratory status.","العلامات الحيوية: ركّز بشكل خاص على الضغط والحرارة والنبض والتنفس.","تقيس ضغط المريض وحرارته."],
["Inspect the abdomen and flank areas for distention, masses, scars, or asymmetry.","افحص بالنظر البطن ومنطقة الجنب علشان تشوف انتفاخ أو كتل أو ندبات أو عدم تماثل.","تلاحظ إن جنب واحد شكله أكبر من التاني."],
["Palpation: assess for tenderness or masses when clinically appropriate. kidney palpation may be difficult in adults.","الجس: قيّم وجود ألم عند اللمس أو كتل لما يكون ده مناسب إكلينيكياً، وجس الكلية ممكن يكون صعب عند الكبار.","تجس البطن بلطف وتسأل المريض: «بيوجعك هنا؟»"],
["Percussion: assess for flank tenderness (costovertebral-angle tenderness) when infection or renal inflammation is suspected.","القرع: قيّم ألم الجنب (ألم الزاوية الضلعية الفقرية) لما يكون فيه شك في التهاب أو التهاب في الكلية.","تقرع برفق على الجنب، ولو المريض اتألم يبقى فيه احتمال التهاب."],
["Assess for peripheral and periorbital edema and signs of fluid overload.","قيّم التورم في الأطراف وحوالين العينين وعلامات زيادة السوائل في الجسم.","انتفاخ تحت العينين الصبح وتورّم في الكعبين."]]],
["Urine assessment",[
["Measure urine output and document intake/output when indicated.","قِس كمية البول وسجّل الداخل والخارج (intake/output) لما يكون ده مطلوب.","تسجل إن المريض شرب كوباية وطلّع كمية بول معينة."],
["Normal adult urine is usually pale yellow to amber and relatively clear.","البول الطبيعي للكبار غالباً أصفر فاتح لعنبري ورائق نسبياً.","بول أصفر فاتح رائق = شكل طبيعي."],
["Cloudy urine may occur with cells, crystals, infection, or other substances.","البول العكر ممكن يظهر مع وجود خلايا أو بلورات أو عدوى أو مواد تانية.","بول عكر ممكن يدل على التهاب."],
["Red, pink, or brown urine can indicate blood, pigments, medications, foods, or other causes.","البول الأحمر أو الوردي أو البني ممكن يكون بسبب دم أو أصباغ أو أدوية أو أكل أو أسباب تانية.","مريض بوله لونه وردي ممكن يكون فيه دم."],
["Foamy urine that is persistent may suggest increased urinary protein and warrants evaluation.","البول الرغوي المستمر ممكن يدل على زيادة البروتين في البول ويحتاج تقييم.","بول فيه رغوة كتير ومش بتروح، ينفع يتعمل له تقييم."],
["Report marked decreases in urine output, visible blood, severe pain, or other concerning changes promptly.","بلّغ فوراً عن نقص واضح في كمية البول أو دم باين أو ألم شديد أو أي تغيير مقلق.","لو كمية البول قلّت جداً، تبلّغ الدكتور على طول."]]],
["Common signs and symptoms of renal disorders",[
["Changes in urine amount or frequency: oliguria, anuria, polyuria, or nocturia.","تغيّر في كمية البول أو عدد مرات التبول: قلة البول (oliguria)، انعدامه (anuria)، كتر البول (polyuria)، أو التبول بالليل (nocturia).","مريض بيطلّع بول قليل جداً طول اليوم = oliguria."],
["Dysuria, urgency, frequency, polyuria hematuria.","حرقان أو ألم وقت التبول، وإلحاح، وتكرار، وكتر البول، ودم في البول.","مريض بيحس بحرقان ومضطر يجري على الحمام كل شوية."],
["Hematuria or persistently abnormal urine appearance.","دم في البول، أو شكل غير طبيعي للبول بيستمر.","بول لونه أحمر أو وردي."],
["Flank or lower abdominal pain, renal colic, or costovertebral-angle tenderness.","ألم في الجنب أو أسفل البطن، أو مغص كلوي، أو ألم عند الضغط على الزاوية الضلعية الفقرية.","ألم شديد في الجنب بيمتد لتحت."],
["Edema, especially peripheral or periorbital, and rapid weight gain from fluid retention.","تورم، خصوصاً في الأطراف أو حوالين العينين، وزيادة سريعة في الوزن بسبب احتباس السوائل.","وزن المريض زاد في كام يوم من غير ما ياكل أكتر."],
["Fatigue, weakness, nausea, vomiting, pruritus, or poor appetite in significant kidney dysfunction.","إرهاق وضعف وغثيان وقيء وهرش وقلة شهية لما يكون فيه خلل كبير في وظيفة الكلى.","مريض تعبان وضعيف ومش عايز ياكل وجسمه بيهرش."],
["Hypertension and symptoms related to fluid/electrolyte or acid–base disturbances.","ارتفاع ضغط الدم وأعراض مرتبطة باضطراب السوائل والأملاح أو الحموضة والقلوية.","مريض كلى ضغطه مرتفع وفيه تورم."]]],
["Kidney stones — What are kidney stones?",[
["Renal stones (nephrolithiasis or urolithiasis) are hard crystalline deposits made of mineral and acid salts that form inside the kidneys.","حصوات الكلى (nephrolithiasis أو urolithiasis) هي ترسّبات بلورية صلبة متكوّنة من أملاح معدنية وحمضية بتتكوّن جوه الكلى.","زي الرواسب الصلبة اللي بتتكوّن في كوباية شاي لما السكر يفضل في القاع."],
["Stones may remain in the kidney or pass into the ureters and lower urinary tract.","الحصوات ممكن تفضل في الكلية أو تنزل في الحالبين والجزء السفلي من الجهاز البولي.","حصوة نزلت من الكلية وعلقت في الحالب."]]],
["What they look like and size?",[
["Sizes: Range from tiny grains of sand to the size of a lemon or golf ball.","الأحجام: بتتراوح من حبّات رمل صغيرة لحد حجم ليمونة أو كورة جولف.","في حصوات صغيرة جداً زي الرمل، وفي حصوات كبيرة زي الكورة."],
["Shapes: Can be smooth, rough, or crystalline.","الأشكال: ممكن تكون ناعمة أو خشنة أو بلورية.","حصوة سطحها خشن وحصوة تانية ناعمة."],
["Location: Form in the kidneys and can travel through the urinary tract (ureters, bladder, urethra).","المكان: بتتكوّن في الكلى وممكن تتحرك في الجهاز البولي (الحالبين، المثانة، الإحليل).","حصوة بدأت في الكلية وبعدين اتحركت لحد المثانة."]]],
["High-risk factors for nephrolithiasis include the following:",[
["Bone disorders","اضطرابات العظام من عوامل الخطر.","مريض عنده مشكلة في العظام."],
["Chronic diarrhea, malabsorption","الإسهال المزمن وسوء الامتصاص.","مريض عنده إسهال مستمر من فترة طويلة."],
["Diabetes and obesity (especially in women)","السكر والسمنة، خصوصاً عند الستات.","سيدة عندها سكر وسمنة."],
["Family history of kidney stones","تاريخ عائلي للحصوات.","أبو المريض كان عنده حصوات."],
["A diet rich in oxalates, sodium, or protein","أكل غني بالأوكسالات أو الصوديوم أو البروتين.","شخص بياكل أكل مملّح وكتير بروتين."],
["Gastrointestinal disease","أمراض الجهاز الهضمي.","مريض عنده مرض في الجهاز الهضمي."],
["Gastro bypass surgery","جراحة تحويل مسار المعدة.","مريض عمل عملية تحويل مسار."],
["Gout","النقرس.","مريض نقرس بيتعب في مفاصله."],
["Hyperparathyroidism: excess secretion of parathyroid hormone (PTH), also known as parathormone, which controls the levels of calcium, phosphorus, and magnesium in the blood","فرط نشاط الجار درقية: إفراز زيادة من هرمون الغدة الجار درقية (PTH أو parathormone)، وهو اللي بيتحكم في مستوى الكالسيوم والفوسفور والماغنسيوم في الدم.","لو الهرمون ده زاد، مستوى الكالسيوم في الدم بيتأثر."],
["Metabolic syndrome","المتلازمة الأيضية.","شخص عنده سمنة وضغط وسكر مع بعض."],
["Obesity","السمنة.","شخص وزنه زيادة جداً."],
["Prior urinary stones","حصوات سابقة في المجاري البولية.","مريض سبق له حصوات وبترجعله."],
["Insufficient hydration and dehydration","قلة شرب السوائل والجفاف.","شخص بيشتغل في الشمس ومش بيشرب مياه كفاية."],
["A diet rich in oxalates, sodium, or protein","أكل غني بالأوكسالات أو الصوديوم أو البروتين (اتذكرت تاني في المحاضرة).","أكل فيه سبانخ وملح ولحوم كتير."],
["Taking certain medications as diuretics, calcium-based antacids and antiviral medications","أخد أدوية معينة زي المدرّات ومضادات الحموضة اللي أساسها كالسيوم والأدوية المضادة للفيروسات.","مريض بياخد مدرّ بول بشكل مستمر."]]],
["Types of kidney stones",[
["Kidney stones can be classified into several types based on their composition, and understanding these types is critical for management and prevention.","حصوات الكلى بتتقسم لأنواع حسب تركيبها، وفهم الأنواع دي مهم جداً للعلاج والوقاية.","نوع الحصوة بيحدد النظام الغذائي والدوا."],
["Calcium Stones: Comprising approximately 80% of all kidney stones, calcium stones can be further classified into calcium oxalate and calcium phosphate stones.","حصوات الكالسيوم تقريباً 80% من كل الحصوات، وبتتقسم لحصوات كالسيوم أوكسالات وحصوات كالسيوم فوسفات.","من كل 10 حصوات تقريباً 8 كالسيوم."],
["Calcium oxalate stones are the most common type and can form in both acidic and alkaline urine; they are influenced by dietary oxalate intake (found in foods such as spinach and chocolate) and calcium metabolism.","كالسيوم أوكسالات هو أشهر نوع، وبيتكوّن في البول الحمضي والقلوي، وبيتأثر بالأوكسالات في الأكل (زي السبانخ والشوكولاتة) وبأيض الكالسيوم.","شخص بياكل سبانخ وشوكولاتة كتير."],
["Calcium phosphate stones, on the other hand, tend to form in alkaline urine and are often associated with certain metabolic citraturia disorders.","كالسيوم فوسفات بيتكوّن غالباً في البول القلوي، وكتير بيرتبط باضطرابات أيضية معينة مرتبطة بالسيترات في البول.","بول قلوي = احتمال حصوات كالسيوم فوسفات."],
["Uric Acid Stones: These stones develop when urine is persistently acidic, leading to the increased solubility of uric acid.","حصوات حمض اليوريك بتتكوّن لما البول يفضل حمضي باستمرار، وده بيؤدي لزيادة الذوبانية حسب نص المحاضرة.","بول حمضي دايماً."],
["Conditions that predispose individuals to uric acid stones include gout, dehydration, and high protein diets.","الحالات اللي بتهيّئ لحصوات اليوريك هي النقرس والجفاف والأكل العالي في البروتين.","مريض نقرس بيأكل لحوم كتير."],
["Uric acid stones account for about 5-10% of all cases.","حصوات حمض اليوريك بتمثل حوالي 5 لـ 10% من كل الحالات.","من كل 100 حالة، حوالي 5 لـ 10 يوريك."],
["Struvite Stones: Also known as infection stones, struvite stones typically arise from urinary tract infections caused by urease producing bacteria such as Proteus mirabilis.","حصوات الستروفيت اسمها كمان حصوات العدوى، وبتحصل غالباً من التهابات المجاري البولية بسبب بكتيريا بتنتج إنزيم اليورياز زي Proteus mirabilis.","التهاب بولي متكرر بسبب Proteus ممكن يعمل ستروفيت."],
["These stones are composed of magnesium ammonium phosphate and can grow rapidly.","الحصوات دي مكوّنة من فوسفات الماغنسيوم والأمونيوم وممكن تكبر بسرعة.","حصوة كانت صغيرة وكبرت في وقت قصير."],
["Cystine Stones: Cystine stones are rare and arise from a genetic condition termed cystinuria, which leads to excessive excretion of the amino acid cystine in the urine.","حصوات السيستين نادرة، وبتحصل من حالة وراثية اسمها cystinuria بتخلّي الحمض الأميني سيستين يطلع بكمية زيادة في البول.","حالة وراثية بتعمل حصوات سيستين."],
["These stones often occur in young adults and difficulty to manage due to their tendency to return.","الحصوات دي بتظهر كتير عند الشباب، وصعب التعامل معاها لأنها بترجع تاني.","شاب بيشيل حصوة سيستين وترجعله."]]],
["Clinical manifestations:",[
["Kidney stones cause the following symptoms:","حصوات الكلى بتسبب الأعراض دي:","هنشوف الأعراض واحد واحد."],
["Severe and sharp pain to the side and flank area","ألم شديد وحاد في الجنب ومنطقة الخاصرة.","مريض ماسك جنبه ومش قادر يستحمل."],
["Pain that radiates to the lower abdomen and groin","الألم بيمتد لأسفل البطن والفخذ (الأربية).","الألم بيبدأ من الجنب وينزل للفخذ."],
["Pain that occurs in waves","الألم بيجي على شكل موجات.","يشتد شوية ويهدى شوية."],
["Dysuria","حرقان أو ألم أثناء التبول.","مريض بيتألم وهو بيتبول."],
["Brown, pink, or red-colored urine","بول لونه بني أو وردي أو أحمر.","بول لونه وردي."],
["Cloudy urine","بول عكر.","بول مش رايق."],
["Foul-smelling urine","بول ريحته وحشة.","ريحة بول نفّاذة وغير طبيعية."],
["Frequent urination","كثرة التبول.","مريض بيدخل الحمام كل شوية."],
["Nausea and vomiting","غثيان وقيء.","مريض بيرجّع مع الألم."],
["Fever and chills","حرارة ورعشة.","مريض درجة حرارته عالية وبيرتعش."]]],
["Diagnostic procedures",[
["Analyze the passed stone: After the patient passes the stone, a lab analysis will reveal the stone’s chemical composition.","تحليل الحصوة اللي نزلت: بعد ما المريض يطلّع الحصوة، تحليل المعمل بيكشف تركيبها الكيميائي.","المريض ينزّل حصوة، تتبعت المعمل تتحلل."],
["These results will help develop the care plan to prevent further kidney stone production.","النتايج دي بتساعد في عمل خطة الرعاية لمنع تكوّن حصوات تانية.","لو طلعت حصوة يوريك، الخطة بتتبني على كده."],
["Urinalysis: Color may be yellow, dark brown, bloody.","تحليل البول: لونه ممكن يكون أصفر أو بني غامق أو دموي.","عينة بول لونها أحمر دموي."],
["Commonly shows RBCs, WBCs, crystals (cystine, uric acid, calcium oxalate), casts, minerals, bacteria, pus; pH may be less than 5 (promotes cystine and uric acid stones) or higher than 7.5 (promotes calcium phosphate stones).","غالباً بيبيّن كرات دم حمراء وبيضاء وبلورات (سيستين، حمض يوريك، كالسيوم أوكسالات) وأسطوانات وأملاح وبكتيريا وصديد، والـ pH ممكن يقل عن 5 (بيشجّع حصوات السيستين واليوريك) أو يزيد عن 7.5 (بيشجّع حصوات كالسيوم فوسفات).","pH أقل من 5 = احتمال يوريك أو سيستين، وأعلى من 7.5 = احتمال كالسيوم فوسفات."],
["Urine (24-hr): Creatinine (Cr), uric acid, calcium, phosphorus, oxalate, or cystine may be elevated.","بول 24 ساعة: الكرياتينين وحمض اليوريك والكالسيوم والفوسفور والأوكسالات أو السيستين ممكن يكونوا مرتفعين.","المريض يجمع بوله 24 ساعة في جركن ويروح المعمل."],
["Urine culture: May reveal Urinary tract infection (UTI) (Staphylococcus aureus, Proteus, Klebsiella, Pseudomonas).","مزرعة البول: ممكن تكشف التهاب مجاري بولية (Staphylococcus aureus وProteus وKlebsiella وPseudomonas).","المزرعة طلّعت Proteus = فيه التهاب."],
["Blood chemistry: Elevated levels of magnesium, calcium, uric acid, phosphates, protein, electrolytes.","كيمياء الدم: ارتفاع الماغنسيوم والكالسيوم وحمض اليوريك والفوسفات والبروتين والأملاح.","تحليل دم بيبيّن كالسيوم وحمض يوريك عاليين."],
["Serum and urine Blood urea nitrogen/ creatinine (BUN/Cr): Abnormal (high in serum/low in urine) secondary to high obstructive stone in kidney causing ischemia/necrosis.","نيتروجين اليوريا في الدم والكرياتينين في السيرم والبول (BUN/Cr): بيكون غير طبيعي (عالي في السيرم وقليل في البول) بسبب حصوة عالية بتسد الكلية وبتسبب نقص تروية أو موت أنسجة.","القيمة عالية في الدم وقليلة في البول لما حصوة تسد الكلية."],
["Serum chloride and bicarbonate levels: Elevation of chloride and decreased levels of bicarbonate suggest developing renal tubular acidosis.","الكلوريد والبيكربونات في الدم: ارتفاع الكلوريد ونقص البيكربونات بيدلّوا على بداية حموضة الأنيبيبات الكلوية.","كلوريد عالي وبيكربونات قليلة = احتمال renal tubular acidosis."],
["CBC:","صورة الدم الكاملة.","تحليل CBC بيتسحب من المريض."],
["Hemoglobin/ hematocrit (Hb/Hct): Abnormal if patient is severely dehydrated or polycythemia is present (encourages precipitation of solids), or patient is anemic (hemorrhage, kidney dysfunction/failure).","الهيموجلوبين والهيماتوكريت: بيكونوا غير طبيعيين لو المريض جفاف شديد أو عنده زيادة كرات دم حمراء (بتشجّع ترسّب المواد الصلبة)، أو عنده أنيميا (نزيف أو خلل أو فشل في الكلى).","مريض جفاف شديد الهيماتوكريت عنده بيبان مختلف."],
["RBCs: Usually normal.","كرات الدم الحمراء: غالباً طبيعية.","النتيجة في الغالب عادية."],
["WBCs: May be increased, indicating infection/septicemia.","كرات الدم البيضاء: ممكن تزيد، وده بيدل على عدوى أو تسمم دم.","WBCs عالية مع حرارة = شك في عدوى."],
["Parathyroid hormone (PTH): May be increased if kidney failure present. (PTH stimulates reabsorption of calcium from bones, increasing circulating serum and urine calcium levels.)","هرمون الجار درقية (PTH): ممكن يزيد لو فيه فشل كلوي. (الهرمون ده بينشّط سحب الكالسيوم من العظام فبيزيد الكالسيوم في الدم والبول.)","PTH عالي = كالسيوم أكتر في الدم والبول."],
["Kidney ureter bladder (KUB) x-ray: Shows presence of calculi and/or anatomical changes in the area of the kidneys or along the course of the ureter.","أشعة KUB (كلية وحالب ومثانة): بتبيّن وجود الحصوات أو تغيّرات في شكل منطقة الكلى أو مسار الحالب.","أشعة عادية على البطن بتبيّن الحصوة."],
["Intravenous pyelogram IVP: Provides rapid confirmation of urolithiasis as a cause of abdominal or flank pain. Shows abnormalities in anatomical structures (distended ureter) and outline of calculi.","أشعة IVP بالصبغة: بتأكد بسرعة إن الحصوات هي سبب ألم البطن أو الجنب، وبتبيّن تغيّرات في التراكيب (زي حالب متمدد) وشكل الحصوات.","بعد حقن الصبغة، بيبان الحالب المتمدد وحدود الحصوة."],
["Cystoureteroscopy: Direct visualization of bladder and ureter may reveal stone and/or obstructive effects.","منظار المثانة والحالب: رؤية مباشرة للمثانة والحالب، وممكن تكشف الحصوة أو آثار الانسداد.","الدكتور بيدخل منظار ويشوف الحصوة بنفسه."],
["Computerized tomography(CT) scan: Identifies/delineates calculi and other masses; kidney, ureteral, and bladder distension.","الأشعة المقطعية CT: بتحدد الحصوات والكتل التانية وتمدد الكلية والحالب والمثانة.","CT بيبيّن الحصوة وحجمها ومكانها."],
["Ultrasound of kidney: To determine obstructive changes, location of stone; without the risk of failure induced by contrast medium.","السونار على الكلى: لتحديد تغيّرات الانسداد ومكان الحصوة، من غير خطر الفشل اللي ممكن تسببه الصبغة.","سونار بيحدد مكان الحصوة من غير صبغة."]]],
["Complications",[
["Urinary tract obstruction","انسداد المجاري البولية.","حصوة تسد الحالب فالبول مايعرفش ينزل."],
["Hydronephrosis","استسقاء الكلية (تمدد الكلية بالبول).","البول يتجمع ويورّم الكلية بعد الانسداد."],
["Urinary tract infection or pyelonephritis","التهاب المجاري البولية أو التهاب الحوض والكلية.","مريض عنده حصوة ومعاها حرارة وألم جنب."],
["Sepsis when severe infection occurs with obstruction","تسمم الدم (sepsis) لما يحصل التهاب شديد مع انسداد.","التهاب شديد وانسداد معاه يخلّي الحالة خطيرة."],
["Acute kidney injury, particularly with significant or bilateral obstruction","إصابة كلوية حادة، خصوصاً مع انسداد كبير أو في الجهتين.","انسداد الحالبين الاتنين."],
["Recurrent stone formation","تكوّن حصوات متكرر.","مريض بتتكون عنده حصوات كل شوية."],
["Chronic kidney damage in selected patients with recurrent or complicated disease","تلف كلوي مزمن في بعض المرضى اللي عندهم حصوات متكررة أو حالة معقدة.","مريض حصواته رجعت أكتر من مرة وتأثرت كليته."]]],
["Diet recommendations for kidney stones — Calcium oxalate stones:",[
["Reduce oxalate by avoiding the following foods:","قلّل الأوكسالات وابعد عن الأطعمة دي:","هنشوفها واحدة واحدة."],
["Nuts and nut products","المكسرات ومنتجاتها.","اللب والمكسرات المشكّلة."],
["Peanuts","الفول السوداني.","سوداني متحمّص."],
["Spinach","السبانخ.","طبق سبانخ."],
["Black tea","الشاي الأسود.","كوباية شاي أسود."],
["Chocolate","الشوكولاتة.","لوح شوكولاتة."],
["Reduce sodium","قلّل الصوديوم.","ما تزودش الملح على الأكل."],
["The chance of developing kidney stones increases by eating more sodium.","احتمال تكوّن الحصوات بيزيد لما تاكل صوديوم أكتر.","أكل مملّح كتير = فرصة حصوات أعلى."],
["Sodium is a part of salt.","الصوديوم جزء من الملح.","ملح الطعام فيه صوديوم."],
["Sodium is found in:","الصوديوم موجود في:","الأنواع دي تحت."],
["Canned","المعلّبات.","علبة تونة أو فول معلّب."],
["Packaged","الأكل المعبّأ.","شيبسي وسناكس جاهزة."],
["Fast foods","الوجبات السريعة.","ساندوتش فاست فود."],
["Salty foods","الأكل المالح.","مخلل وجبنة مالحة."],
["Limit animal protein including","حدّ من البروتين الحيواني، ويشمل:","قلّل كمية اللحوم."],
["Beef, chicken, especially organ meats","اللحمة والفراخ، وخصوصاً الأعضاء الداخلية (الكبدة وغيرها).","كبدة أو كلاوي."],
["Eggs","البيض.","بيضتين على الفطار."],
["Fish and shellfish","السمك والمأكولات البحرية.","جمبري أو سمك."],
["Milk, cheese, and other dairy products","اللبن والجبنة ومنتجات الألبان التانية.","كوباية لبن وجبنة."],
["Consider replacing some of the meat and animal protein you would typically eat with some of these plant-based foods that are high in protein.","فكّر تستبدل جزء من اللحوم والبروتين الحيواني اللي بتاكله عادةً بأطعمة نباتية غنية بالبروتين.","بدل وجبة لحمة، اختار وجبة نباتية فيها بروتين."],
["Get enough calcium from foods","خد كالسيوم كفاية من الأكل.","كوباية لبن أو زبادي مع الوجبة."],
["In the right amounts, calcium can block other substances in the digestive tract that may cause stones.","بكميات مناسبة، الكالسيوم ممكن يمنع مواد تانية في الجهاز الهضمي ممكن تسبب حصوات.","الكالسيوم يلتقط الأوكسالات في الهضمي قبل ما توصل للكلى."]]],
["Calcium phosphate stones",[
["Reduce sodium","قلّل الصوديوم.","قلّل الملح في الطبخ."],
["Limit animal protein","حدّ من البروتين الحيواني.","قلّل اللحوم."],
["Consider replacing some of the meat and animal protein you would typically eat with some of these plant-based foods that are high in protein:","فكّر تستبدل جزء من اللحوم والبروتين الحيواني بأطعمة نباتية غنية بالبروتين، زي:","هنشوف أمثلتها تحت."],
["Legumes such as beans and dried peas.","البقوليات زي الفاصوليا والبسلة المجففة.","طبق فاصوليا بدل اللحمة."],
["Sunflower seeds","بذور عباد الشمس.","لب سوري."],
["Get enough calcium from foods","خد كالسيوم كفاية من الأكل.","جبنة أو لبن مع الأكل."]]],
["Uric acid stones",[
["Limit animal protein","حدّ من البروتين الحيواني.","قلّل اللحوم الحمرا."],
["Consider replacing some of the meat and animal protein you would typically eat with some of these plant-based foods that are high in protein.","فكّر تستبدل جزء من اللحوم والبروتين الحيواني بأطعمة نباتية غنية بالبروتين.","وجبة بقوليات بدل وجبة لحمة."],
["Losing weight; is especially important for people who have had uric acid stones.","نزول الوزن مهم بشكل خاص للناس اللي كان عندهم حصوات حمض اليوريك.","مريض عنده حصوات يوريك ووزنه زايد، يبدأ يخس."]]],
["Cystine Stones",[
["Drinking enough liquid, mainly water, is the most important lifestyle change could be done to prevent cystine stones.","شرب سوائل كفاية، وخصوصاً المياه، هو أهم تغيير في نمط الحياة ممكن يتعمل لمنع حصوات السيستين.","اشرب مياه على مدار اليوم مش مرة واحدة."]]],
["General recommendations",[
["Drink plenty of fluid: up to 3 – 4 liters /day","اشرب سوائل كتير: لحد 3 – 4 لتر في اليوم.","توزّع المياه على اليوم كله."],
["This includes any type of fluid such as water and lemonade which have been shown to have a beneficial effect with the exception of grapefruit juice and soda.","ده بيشمل أي نوع سوائل زي المياه والليمونادة اللي ثبت إن ليها تأثير مفيد، ماعدا عصير الجريب فروت والصودا.","مياه وليمونادة مسموحين، لكن الصودا لأ."],
["This will help produce less concentrated urine and ensure a good urine volume of at least 2.5L/day","ده بيساعد على بول أقل تركيزاً وبيضمن كمية بول كويسة مش أقل من 2.5 لتر في اليوم.","لو بولك فاتح ورايق يبقى شرب المياه كويس."],
["Limit foods with high oxalate content","قلّل الأكل العالي في الأوكسالات.","قلّل السبانخ والشوكولاتة."],
["Spinach, many berries, chocolate, wheat bran, nuts, beets and tea should be eliminated from the diet intake","السبانخ وكتير من التوت والشوكولاتة ونخالة القمح والمكسرات والبنجر والشاي لازم يتشالوا من الأكل.","ما تاكلش بنجر ولا مكسرات."],
["Eat enough dietary calcium","كُل كالسيوم كفاية من الأكل.","جبنة أو لبن مع الوجبات."],
["Three servings of dairy per day will help lower the risk of calcium stone formation. Eat with meals.","ثلاث حصص ألبان في اليوم بتساعد تقلّل خطر تكوّن حصوات الكالسيوم، وتتاكل مع الوجبات.","كوباية لبن مع الفطار، وزبادي مع الغدا، وجبنة مع العشا."],
["Avoid extra calcium supplements","ابعد عن مكمّلات الكالسيوم الزيادة.","ماتخدش أقراص كالسيوم من نفسك."],
["Calcium supplements should be individualized by physician and registered kidney dietitian","مكمّلات الكالسيوم بتتحدد لكل مريض على حدة بواسطة الدكتور وأخصائي تغذية الكلى.","الدكتور وأخصائي التغذية هما اللي يحددوا الجرعة."],
["Eat a moderate amount of protein","كُل كمية بروتين معتدلة.","وجبة لحمة بدل ثلاث وجبات."],
["High protein intakes will cause the kidneys to excrete more calcium therefore this may cause more stones to form in the kidney","البروتين العالي بيخلّي الكلى تطرح كالسيوم أكتر، وده ممكن يزوّد تكوّن الحصوات.","أكل لحوم كتير = كالسيوم أكتر في البول."],
["Avoid high salt intake","ابعد عن الملح العالي.","قلّل الملح في الأكل."],
["High sodium intake increases calcium in the urine which increases the chances of developing stones","الصوديوم العالي بيزوّد الكالسيوم في البول، وده بيزوّد فرصة الحصوات.","أكل مملّح = كالسيوم أكتر في البول."],
["Low salt diet is also important to control blood pressure.","الأكل قليل الملح مهم كمان للتحكم في ضغط الدم.","قلّة الملح بتفيد الحصوات والضغط."],
["Avoid high doses of vitamin C supplements","ابعد عن الجرعات العالية من مكمّلات فيتامين C.","ماتخدش أقراص فيتامين C كبيرة."],
["It is recommend to take 60mg/day of vitamin C based on the United State Dietary Reference Intake","المُوصى بيه 60 مجم في اليوم من فيتامين C حسب الـ Dietary Reference Intake الأمريكي.","60 مجم في اليوم كفاية."],
["Excess amounts of 1000mg/day or more may produce more oxalate in the body","الكميات الزيادة (1000 مجم في اليوم أو أكتر) ممكن تعمل أوكسالات أكتر في الجسم.","قرص 1000 مجم كل يوم ممكن يزوّد الأوكسالات."]]],
["Medical Management",[
["Basic goals are to eradicate the stone, determine the stone type, prevent nephron destruction, control infection, and relieve any obstruction that may be present.","الأهداف الأساسية: التخلص من الحصوة، وتحديد نوعها، ومنع تلف النيفرون، والسيطرة على العدوى، وتخفيف أي انسداد موجود.","نحلل الحصوة، ونعالج العدوى، ونفتح الانسداد."],
["Relieve the pain.","خفّف الألم.","المريض بيتألم، فنديله علاج ألم."],
["Renal calculi are said to be one of the most painful medical conditions.","بيتقال إن حصوات الكلى من أكتر الحالات الطبية ألماً.","ألم المغص الكلوي بيكون شديد."],
["Administer Non steroidal anti-inflammatory drugs (NSAIDs) for mild pain and narcotic analgesics for more severe pain.","اديله مضادات الالتهاب غير الستيرويدية (NSAIDs) للألم الخفيف، والمسكنات المخدرة للألم الأشد.","NSAIDs للخفيف، ومسكن مخدر للشديد."],
["Administer antibiotics.","اديله المضادات الحيوية.","لو فيه عدوى."],
["Antibiotics must be administered if the patient is diagnosed with a urinary tract infection.","لازم المضادات الحيوية تتدّي لو المريض اتشخّص بالتهاب في المجاري البولية.","المريض اتشخّص بـ UTI فنديله مضاد حيوي."],
["Treat nausea and vomiting.","عالج الغثيان والقيء.","المريض بيرجّع مع الألم."],
["Nausea and vomiting occur in 50% of patients with kidney stones and may exacerbate electrolyte abnormalities and dehydration if untreated.","الغثيان والقيء بيحصلوا في 50% من مرضى الحصوات، وممكن يزوّدوا اضطراب الأملاح والجفاف لو ماتعالجوش.","من كل 10 مرضى حوالي 5 بيرجّعوا."],
["Administer antiemetics to relieve these symptoms.","اديله أدوية مضادة للقيء علشان تخفف الأعراض دي.","دوا مضاد للقيء بيريّح المريض."],
["Promote kidney stone passage.","ساعد على نزول الحصوة.","نساعد الحصوة تعدّي."],
["Administer medications as ordered to assist in the passing of a kidney stone.","اديله الأدوية زي ما اتطلب علشان تساعد في نزول الحصوة.","نديله الدوا بالمواعيد."],
["Alpha-blockers relax the ureter’s muscles to aid kidney stone passage.","حاصرات ألفا بتريّح عضلات الحالب علشان تساعد الحصوة تنزل.","الحالب لما يرتاح الحصوة تعدّي بسهولة."],
["Combining an alpha-blocker such as tamsulosin with an analgesic like ibuprofen has been shown to improve the passage of stones while addressing pain and reducing the need for surgery.","استخدام حاصر ألفا زي تامسولوسين مع مسكن زي الإيبوبروفين ثبت إنه بيحسّن نزول الحصوات وبيعالج الألم وبيقلّل الحاجة للجراحة.","تامسولوسين + إيبوبروفين."],
["Don’t forget to strain the urine.","ماتنساش تصفّي البول.","كل مرة المريض يتبول، البول يتصفّى."],
["Keep a urinal in the toilet so that the patient’s urine is strained so that the stones can be analyzed to determine their composition.","سيب أداة جمع البول (urinal) في الحمام علشان بول المريض يتصفّى وتتحلل الحصوات ويتحدد تركيبها.","الحصوة اللي تطلع تتبعت المعمل."]]],
["Stone removal procedures",[
["Ureteroscopy: stones fragmented with use of laser, electrohydraulic lithotripsy, or ultrasound and then removed.","منظار الحالب: الحصوات بتتفتت باستخدام الليزر أو التفتيت الكهروهيدروليكي أو الموجات فوق الصوتية وبعدين بتتشال.","الدكتور بيدخل منظار، يفتت الحصوة بالليزر ويطلعها."],
["Extracorporeal shock wave lithotripsy (ESWL): employs soundwaves to break up kidney stones.","التفتيت بالموجات الصدمية من خارج الجسم (ESWL): بيستخدم موجات صوتية علشان يكسّر الحصوات.","موجات من بره الجسم بتفتت الحصوة من غير جرح."],
["Percutaneous nephrolithotomy surgically removes large stones through the kidney","استخراج الحصوات الكبيرة جراحياً عن طريق الكلية.","حصوة كبيرة بتتشال من خلال الكلية."],
["Chemolysis (stone dissolution): alternative for those who are poor risks for other therapies, refuse other methods, or have easily dissolved stones (struvite).","إذابة الحصوة كيميائياً: بديل للمرضى اللي خطر العلاجات التانية عليهم عالي، أو بيرفضوا الطرق التانية، أو حصواتهم سهلة الذوبان (زي الستروفيت).","مريض مايقدرش يعمل عملية، فنجرّب إذابة الحصوة."],
["Surgical removal is performed in only 1% to 2% of patients.","الإزالة الجراحية بتتعمل في 1% لـ 2% بس من المرضى.","من كل 100 مريض، واحد أو اتنين بس بيحتاجوا جراحة."],
["The size and location of the stone determine treatment.","حجم الحصوة ومكانها هما اللي بيحددوا العلاج.","حصوة صغيرة غير حصوة كبيرة."],
["The urinary tract may be able to pass small kidney stones without any medical intervention.","الجهاز البولي ممكن يطلّع الحصوات الصغيرة لوحده من غير تدخل طبي.","حصوة صغيرة تنزل مع البول."],
["Urgent treatment, including surgical intervention, may be required for larger kidney stones.","الحصوات الأكبر ممكن تحتاج علاج عاجل، بما فيه التدخل الجراحي.","حصوة كبيرة سادة الحالب = علاج عاجل."]]],
["Prevent kidney stone recurrence",[
["Encourage fluid intake.","شجّع المريض على شرب السوائل.","قوله: «اشرب مياه على طول اليوم»."],
["Hydration is considered the most important intervention to prevent future stone formation. The patient should be instructed to consume enough fluid to produce at least 2.5 L of urine per day.","الترطيب بيتعتبر أهم تدخل لمنع تكوّن حصوات في المستقبل، والمريض لازم يتعلّم يشرب سوائل كفاية تطلّع على الأقل 2.5 لتر بول في اليوم.","لو بوله قليل، يزوّد المياه."],
["Advise on recommended medications.","انصح بالأدوية الموصى بيها.","الدكتور هو اللي بيحدد الدوا."],
["Medications can regulate the amount of salts and minerals in the urine and may be beneficial for those who develop certain types of stones.","الأدوية ممكن تنظم كمية الأملاح والمعادن في البول وممكن تفيد اللي بتتكوّن عندهم أنواع معينة من الحصوات.","دوا بينظم الأملاح في البول."],
["The healthcare provider may recommend the following medications if the patient frequently develops these types of stones:","مقدّم الرعاية ممكن يوصي بالأدوية دي لو المريض بتتكوّن عنده الأنواع دي من الحصوات كتير:","كل نوع حصوة ليه دوا."],
["Calcium oxalate stones: thiazide diuretics","حصوات كالسيوم أوكسالات: مدرّات الثيازيد.","مريض كالسيوم أوكسالات يتاخد له ثيازيد."],
["Uric acid stones: allopurinol and an alkalizing agent","حصوات حمض اليوريك: ألوبيورينول ومادة قلوية.","مريض يوريك: ألوبيورينول."],
["Struvite stones: acetohydroxamic acid","حصوات الستروفيت: حمض أسيتوهيدروكساميك.","مريض ستروفيت: acetohydroxamic acid."],
["Cystine stones: tiopronin or penicillamine","حصوات السيستين: تيوبرونين أو بنسيلامين.","مريض سيستين: تيوبرونين."],
["Encourage the patient to achieve the desired weight.","شجّع المريض يوصل للوزن المطلوب.","مريض سمين يبدأ ينزل وزنه."],
["There is a high prevalence of kidney stones in obese patients due to multiple comorbidities.","انتشار الحصوات عالي عند مرضى السمنة بسبب أمراض مصاحبة متعددة.","السمنة معاها سكر وضغط."],
["Advise the patient to avoid using the following weight-loss medications that were found to increase the risk of developing kidney stones:","انصح المريض يبعد عن أدوية التخسيس دي اللي لقوا إنها بتزوّد خطر الحصوات:","مايخدش أدوية تخسيس من نفسه."],
["Orlistat (lipase inhibitor) increases oxalate stone formation","أورليستات (مثبّط للإنزيم الليباز) بيزوّد تكوّن حصوات الأوكسالات.","Orlistat = حصوات أوكسالات أكتر."],
["Topiramate (carbonic anhydrase inhibitor) increases urine pH and decreases urinary citrate excretion","توبيراميت (مثبّط للكربونيك أنهيدريز) بيرفع pH البول وبيقلل إخراج السيترات في البول.","Topiramate = pH أعلى وسيترات أقل."],
["Educate on performing a 24-hour urine study.","علّم المريض إزاي يعمل دراسة بول 24 ساعة.","يجمع بوله في جركن 24 ساعة."],
["If the patient is motivated to learn about what is causing recurrent stones, have them measure their urine in a 24-hour period for lab analysis of the chemical makeup of their urine.","لو المريض متحمّس يعرف إيه سبب تكرار الحصوات، خليه يقيس بوله على مدار 24 ساعة علشان المعمل يحلل التركيب الكيميائي للبول.","يجمع البول ويوديه المعمل."],
["Instruct on diet modifications.","علّم المريض تعديلات الأكل.","يقلل الملح واللحمة."],
["Patients should limit sodium and eat protein in moderation.","المرضى لازم يقلّلوا الصوديوم وياكلوا البروتين باعتدال.","ملح أقل وبروتين معتدل."],
["Uric acid stones are caused by high levels of purines found in animal protein.","حصوات حمض اليوريك سببها المستويات العالية من البيورينات الموجودة في البروتين الحيواني.","اللحوم فيها بيورينات."],
["Decrease urine acidity to prevent uric acid stones by limiting alcohol, red meat and shellfish.","قلّل حموضة البول لمنع حصوات اليوريك عن طريق تقليل الكحول واللحوم الحمرا والمأكولات البحرية.","يبعد عن اللحمة الحمرا والجمبري."],
["Calcium restriction isn’t necessary.","مش لازم تقليل الكالسيوم.","ما تمنعش اللبن والجبنة."],
["Though calcium-oxalate stones are the most common type of stone, they aren’t necessarily caused by too much calcium.","رغم إن كالسيوم أوكسالات أشهر نوع، مش شرط يكون سببه كالسيوم زيادة.","الحصوات دي مش دايماً بسبب كتر الكالسيوم."],
["Reducing calcium may lead to more stones as more oxalate is absorbed since there isn’t enough calcium to bind with it.","تقليل الكالسيوم ممكن يزوّد الحصوات لأن أوكسالات أكتر بتتمتص، لأن مفيش كالسيوم كفاية يتربط بيها.","كالسيوم أقل = أوكسالات تتمتص أكتر."],
["Instead, the patient should consume oxalate-rich foods (fruits, vegetables, grains, chocolate, spinach) with calcium-rich foods such as milk, yogurt, and cheese.","بدل كده، المريض ياكل الأكل الغني بالأوكسالات (فاكهة وخضار وحبوب وشوكولاتة وسبانخ) مع أكل غني بالكالسيوم زي اللبن والزبادي والجبنة.","سبانخ مع زبادي في نفس الوجبة."]]],
["Patient education",[
["Educate patients about symptoms to watch for, especially with recurrent kidney stones.","علّم المرضى الأعراض اللي يلاحظوها، خصوصاً مع الحصوات المتكررة.","يعرف إن ألم الجنب والدم في البول إنذار."],
["Counsel patients on the importance of staying well hydrated, up to 3 – 4 liters per day, to achieve a urine output of 2.5 L daily, especially during the acute phase of kidney stones.","انصح المرضى بأهمية الترطيب الجيد، لحد 3 – 4 لتر في اليوم، علشان يوصلوا لـ 2.5 لتر بول يومياً، خصوصاً في المرحلة الحادة.","يشرب كتير وقت النوبة."],
["Patients must also be encouraged to limit their intake of coffee, tea, alcohol, and grapefruit juice.","كمان لازم نشجّع المرضى يقلّلوا القهوة والشاي والكحول وعصير الجريب فروت.","يقلل الشاي والقهوة."],
["Counsel patients on exercises such as Sauna hot yoga and heavy exercise could also lead to kidney stones due to the loss of water through sweating due to the activity.","انصح المرضى إن رياضات زي الساونا واليوجا الساخنة والتمارين الشديدة ممكن تؤدي للحصوات بسبب فقد المياه بالعرق.","جيم شديد من غير مياه كفاية ممكن يبقى سبب."],
["Instruct patients to use a urine filter.","علّم المرضى يستخدموا مصفاة للبول.","يصفّي بوله كل مرة."],
["Stones must be sent to the lab for analysis.","الحصوات لازم تتبعت للمعمل للتحليل.","الحصوة تتحط في علبة وتتبعت."],
["Patients with calcium stones must be counseled to limit sodium intake and consume calcium between 1000 and 1200 mg per day.","مرضى حصوات الكالسيوم لازم يتنصحوا يقلّلوا الصوديوم وياخدوا كالسيوم بين 1000 و1200 مجم في اليوم.","ملح أقل وكالسيوم معتدل."],
["Counsel patients on the importance of maintaining a healthy diet and weight.","انصح المرضى بأهمية الحفاظ على أكل صحي ووزن مناسب.","أكل متوازن ووزن مناسب."],
["Patients with uric acid stones and calcium stones must limit foods high in animal protein.","مرضى حصوات اليوريك والكالسيوم لازم يقلّلوا الأكل العالي في البروتين الحيواني.","لحمة وفراخ بكمية قليلة."],
["Reduce sweetened beverages, especially those high in fructose corn syrup.","قلّل المشروبات المحلّاة، خصوصاً العالية في شراب الذرة عالي الفركتوز.","يقلل المشروبات الغازية."],
["Offer thiazides diuretics to patients with high calcium and recurrent stones.","اعرض مدرّات الثيازيد على المرضى اللي عندهم كالسيوم عالي وحصوات متكررة.","مريض كالسيوم عالي وحصواته بترجع."]]]
