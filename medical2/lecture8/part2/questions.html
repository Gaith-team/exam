const QUESTIONS = [
  {t:"A skin ulcer is best defined as:", o:["A closed collection of blood under intact skin", "A temporary redness that fades within hours", "An open wound on the skin resulting from injury, poor circulation, or pressure", "A superficial scratch that heals in a day or two"], a:2},

  {t:"Stasis dermatitis occurs in the lower legs due to:", o:["Excess sebum", "Nerve damage", "Pressure and shear", "Poor venous circulation"], a:3},

  {t:"Hormonal acne mainly affects:", o:["Newborns only", "Adults with overproduction of sebum", "Elderly patients with arterial disease", "Patients with contact allergy"], a:1},
  {t:"Which is TRUE about non-inflammatory acne?", o:["It causes deep painful cysts", "It always leaves permanent scars", "It is caused only by hormones", "It is milder, causes no swelling or pain and rarely scars"], a:3},
  {t:"Benzoyl peroxide acts as:", o:["An antibacterial that reduces inflammation", "An anti-androgen", "A systemic retinoid", "A chemical exfoliant only"], a:0},
  {t:"Topical retinoids (tretinoin, adapalene) work by:", o:["Unclogging pores and preventing new comedones", "Killing all bacteria on the skin", "Blocking androgens", "Dissolving scars"], a:0},
  {t:"Spironolactone is used in female acne because it:", o:["Kills Cutibacterium acnes", "Exfoliates the skin", "Replaces sebum", "Has an anti-androgen effect"], a:3},
  {t:"Isotretinoin is indicated for:", o:["Mild occasional whiteheads", "Severe, resistant or cystic acne", "Contact dermatitis", "Venous ulcers"], a:1},
  {t:"Which statement is the best home advice for acne?", o:["Squeeze lesions to remove pus", "Use alcohol-based toners several times daily", "Apply heavy oily moisturizers", "Wash with a gentle cleanser using warm (not hot) water"], a:3},
  {t:"Which nursing diagnosis is defined as 'altered epidermis and/or dermis'?", o:["Impaired Tissue Integrity", "Risk for Pressure Injury", "Impaired Skin Integrity", "Risk for Impaired Tissue Integrity"], a:2},
  {t:"Damage to the muscle, tendon, bone, cartilage or ligament is defined as:", o:["Impaired Skin Integrity", "Risk for Impaired Skin Integrity", "Ineffective Tissue Perfusion", "Impaired Tissue Integrity"], a:3},
  {t:"Which is a defining characteristic of Impaired Tissue Integrity?", o:["Localized area hot to touch", "Hypothermia", "Bradycardia", "Hypotension"], a:0},
  {t:"Which is a SMART expected outcome for a patient with a wound?", o:["The patient will have tissue healing", "The wound will decrease in size and have increased granulation tissue within two weeks", "The nurse will clean the wound daily", "The patient will feel better soon"], a:1},
  {t:"To pull a patient up in bed and minimize shear and friction, the nurse should use:", o:["One nurse dragging the patient by the arms", "The patient's own effort without help", "A rough blanket as a slider", "At least two-person assistance and a draw sheet"], a:3},
  {t:"To prevent shear, the nurse should keep the head of the bed at:", o:["31 degrees or less, as appropriate", "60 degrees at all times", "90 degrees after meals only", "45 degrees with knees flat"], a:0},
  {t:"At every dressing change, the nurse should document the wound's:", o:["Size, appearance, staging and drainage", "Patient's job and income", "Color of the dressing only", "Time the patient last ate"], a:0},
  {t:"A nurse notices new signs of infection in a patient's wound. The priority action is to:", o:["Stop wound care", "Apply lotion to the wound", "Notify the provider", "Leave it until the next shift"], a:2},
  {t:"Which finding indicates a wound infection?", o:["Decreasing wound size", "Fever with increased pain and change in wound drainage", "Resolved peri-wound redness", "Reduced exudate"], a:1},
  {t:"An expected outcome at 1 week of wound healing is:", o:["Complete wound closure", "Resolution of peri-wound redness", "Doubling of necrotic tissue", "Increased pain during dressing changes"], a:1},
  {t:"A patient with a chronic, non-healing wound should be:", o:["Left alone with the same dressing", "Discharged without follow-up", "Referred to a wound care nurse specialist", "Told to cut the callus at home"], a:2},
  {t:"Skin ulcers usually heal as quickly as superficial wounds.", o:["True", "False"], a:1},
  {t:"Venous ulcers are the most common type of leg ulcer.", o:["True", "False"], a:0},
  {t:"Arterial ulcers are typically painless.", o:["True", "False"], a:1},
  {t:"Neuropathic ulcers are usually painless because of loss of sensation.", o:["True", "False"], a:0},
  {t:"Pressure ulcers develop over bony prominences.", o:["True", "False"], a:0},
  {t:"Venous ulcers occur mainly on the soles of the feet.", o:["True", "False"], a:1},
  {t:"A diabetic patient may not feel minor cuts or blisters on the feet.", o:["True", "False"], a:0},
  {t:"Bedridden patients should be turned at least every 2 hours.", o:["True", "False"], a:0},
  {t:"Dermatitis means inflammation of the skin.", o:["True", "False"], a:0},
  {t:"Atopic dermatitis is rare in children.", o:["True", "False"], a:1},
  {t:"Medical researchers know the exact cause of seborrheic dermatitis.", o:["True", "False"], a:1},
  {t:"Dandruff is a mild form of seborrheic dermatitis.", o:["True", "False"], a:0},
  {t:"Stasis dermatitis is often associated with varicose veins.", o:["True", "False"], a:0},
  {t:"Blackheads turn black because of dirt.", o:["True", "False"], a:1},
  {t:"Whiteheads are closed comedones.", o:["True", "False"], a:0},
  {t:"Papules contain visible pus.", o:["True", "False"], a:1},
  {t:"Cysts carry the highest risk of permanent scarring in acne.", o:["True", "False"], a:0},
  {t:"Acne commonly occurs on the palms and soles.", o:["True", "False"], a:1},
  {t:"Laboratory tests are required in most cases of acne.", o:["True", "False"], a:1},
  {t:"Patients taking isotretinoin require monitoring for side effects.", o:["True", "False"], a:0},
  {t:"Squeezing or picking acne lesions reduces scarring.", o:["True", "False"], a:1},
  {t:"Skin that is too wet or too dry breaks down easily.", o:["True", "False"], a:0},
  {t:"Cellulitis is a bacterial infection of the deep layers of skin and soft tissue.", o:["True", "False"], a:0},
  {t:"Impaired Tissue Integrity is limited to damage of the epidermis only.", o:["True", "False"], a:1},
  {t:"Using a draw sheet with two-person assistance helps minimize shear and friction.", o:["True", "False"], a:0}
];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 60*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🫀', l:['#be123c','190,18,60','#9f1239','#be123c','#1e3a8a'], d:['#fb7185','251,113,133'] },
  { icon:'🫁', l:['#0d9488','13,148,136','#115e59','#0d9488','#0369a1'], d:['#2dd4bf','45,212,191'] },
  { icon:'🧪', l:['#d97706','217,119,6','#92400e','#d97706','#be123c'], d:['#fbbf24','251,191,36'] },
  { icon:'🩸', l:['#1d4ed8','29,78,216','#1e3a8a','#1d4ed8','#7c3aed'], d:['#60a5fa','96,165,250'] }
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
