.q{padding:16px;border-top:1px solid var(--bd)}

.o span{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bd);display:grid;place-items:center;font-size:13px;flex:none}

.o.ok{border-color:var(--ok);background:var(--okb)}.o.ok span{background:var(--ok);border-color:var(--ok);color:var(--card)}
.o.bad{border-color:var(--bad);background:var(--badb)}.o.bad span{background:var(--bad);border-color:var(--bad);color:var(--card)}

<script>
const S=[
{t:"1) Introduction to Teaching and Learning",p:[
"Teaching = the process of imparting knowledge and instruction.~التدريس: إعطاء المعرفة والتعليمات.",
"Learning = the acquisition of knowledge, behaviors, skills, values.~التعلم: اكتساب المعرفة والسلوكيات والمهارات والقيم.",
"Education ensures nurses: develop clinical competence · understand ethical and legal responsibilities · adapt to evolving healthcare systems · promote patient safety and evidence-based practice · engage in lifelong learning.~٥ نقاط لأهمية التعليم.",
"Characteristics of nursing learners: Thinking and Learning · Feelings and Motivation · Behavior and Attitude · Learning Needs.~٤ محاور لخصائص طالب التمريض.",
"Traditional: lecture-based instruction, passive learning, limited clinical exposure.~التقليدي.",
"Modern: active learning strategies, technology integration, competency-based education, interprofessional collaboration.~الحديث.",
"Future: AI-driven personalized learning, global health integration, sustainability and green nursing education.~المستقبل."],
c:[["Teaching","Learning","التدريس: ممكن يتم بدون وعي ومرتبط دايمًا بالتعلم والمتعلمين — التعلم: طول العمر بوعي أو بدون وعي، ومش لازم حد يعلمك."],["Traditional","Modern","تقليدي = محاضرة + سلبي + تعرض إكلينيكي محدود — حديث = active + تكنولوجيا + competency + تعاون بين المهن."]]},
{t:"2) Core Principles of Effective Teaching",p:[
"The 10 principles: 1 Learner-Centered · 2 Clear Objectives and Outcomes · 3 Active Learning & Engagement · 4 Motivation and Relevance · 5 Structured and Sequenced Content · 6 Feedback and Evaluation · 7 Integration of Technology · 8 Ethical and Professional Modeling · 9 Creativity and Innovation · 10 Practice and Reinforcement.~المبادئ العشرة بالترتيب.",
"Structured content: foundational → advanced, scaffolding, manageable units (pathophysiology → diagnosis → management).~التدرج من الأساس للمتقدم.",
"Feedback: timely, constructive · formative and summative assessments · self-assessment and peer review.",
"Technology: virtual labs, e-learning platforms, interactive quizzes · blend traditional + modern = hybrid learning.",
"Challenges: resource limitations · faculty resistance · student diversity · curriculum rigidity.~٤ تحديات."],
c:[["Principle 2 – Clear Objectives","Principle 4 – Motivation","٢: أهداف محددة وقابلة للقياس ومرتبطة بالتقييم — ٤: ربط المحتوى بدور الممرض المستقبلي وتأثيره على سلامة المريض."],["Principle 5 – Structured","Principle 10 – Practice","٥: ترتيب منطقي وscaffolding — ١٠: تكرار ومراجعة وممارسة عملية."]]},
{t:"3) Concepts and Strategies of Teaching",p:[
"Teaching = facilitating learning by guiding, mentoring, and supporting students to acquire knowledge, skills, and professional attitudes.",
"Teaching → critical thinking, ethical reasoning, holistic understanding. Training → task-based skill acquisition and procedural competence. Example: ethical implications of end-of-life care (teaching) vs inserting a nasogastric tube (training).~مثال مشهور.",
"Role of the nurse educator: facilitator · role model · evaluator · innovator in instructional design.",
"Behaviorism: reinforcement and repetition. Cognitivism: mental processes like memory and problem-solving. Constructivism: learners build knowledge through experience and reflection. Humanism: personal growth, self-direction, emotional well-being.",
"Theorists – Behaviourist: Thorndike, Pavlov, Watson, Guthrie, Hull, Tolman, Skinner · Cognitivist: Koffka, Kohler, Lewin, Piaget, Ausubel, Bruner, Gagne · Humanist: Maslow, Rogers · Social and Situation: Bandura, Lave and Wenger, Salomon.",
"Application: simulation (constructivism) to teach emergency response, followed by reflective journaling (humanism).",
"Andragogy: self-directed and goal oriented · prior experience · practical, problem-solving · need to understand relevance.",
"Method = general approach (lecture, discussion). Technique = specific tools within a method (questioning, role-play). Strategy = planned combination of methods and techniques tailored to learning goals.",
"Strategy characteristics: learner-centered, evidence-based, flexible and adaptable, culturally sensitive, outcome-oriented.",
"Choice factors: learning objectives · student profile · content type · resources available.",
"Teaching plan: define outcomes → choose strategies → prepare materials → implement with flexibility → evaluate and adapt.",
"Ethical considerations: respect for diversity · confidentiality · consent · fairness."],
c:[["Teaching","Training","التدريس: نظري، تفكير نقدي، فصل دراسي — التدريب: عملي، مهارة وإجراء، بيئة العمل."],["Method","Technique","الـmethod الطريقة العامة — الـtechnique أداة محددة جوا الطريقة."],["Technique","Strategy","الـstrategy خطة متكاملة بتجمع methods وtechniques حسب الأهداف."],["Constructivism","Humanism","البناء بالخبرة والتأمل — النمو الشخصي والتوجيه الذاتي والصحة النفسية."]]},
{t:"4) Educational Methods – Overview",p:[
"Teaching methods = systematic, organized techniques or strategies that educators use to deliver knowledge, develop skills, and shape attitudes. They are “how” a teacher helps students learn.",
"Benefits: effective learning · achieve learning objectives · increase motivation · critical thinking and problem-solving · flexibility and adaptability · thorough assessment and feedback · engage learners actively · build class relationships and trust · lifelong learning skills.",
"Classification: Teacher-centered (lecture, demonstration) · Learner-centered/active (discussion, problem-based, case-based) · Collaborative (cooperative, team-based) · Experiential/practice-based (simulation, clinical practicum, role-play) · Technology-enhanced (e-learning, flipped classroom, virtual simulation) · Assessment-driven (OSCEs, portfolios).~٦ تصنيفات.",
"Selection factors: educational objectives · level of the learner · available resources (time, money, space, materials) · energy level of teacher and students · feelings towards the methods · comfort of the learner."],
c:[["Teacher-centered","Learner-centered","محاضرة وdemonstration — مناقشة وPBL وcase-based."],["Experiential","Technology-enhanced","simulation وrole-play وclinical practicum — e-learning وflipped وvirtual simulation."]]},
{t:"5) Lecture and Discussion Methods",p:[
"Lecture: traditional, teacher-centered; structured presentation to a large group; teacher talks, students listen, take notes.",
"Lecture steps: Preparation → Introduction → Presentation → Interaction (optional) → Summary/Conclusion → Evaluation.",
"Lecture advantages: covers large content in less time · large groups · cost-effective · clear and systematic · good for introducing new topics · great control.",
"Lecture disadvantages: passive learning · limited critical thinking · not suitable for psychomotor skills · hard to meet different learning styles · boredom · needs proficient oral skills.",
"Effective lecture: 30–45 minutes max · audiovisual aids · questions or brief discussions · real-life examples · summarize key points.",
"Discussion: learner-centered, active participation, two-way communication; teacher = facilitator; develops higher-order thinking (analysis, evaluation, problem-solving).",
"Types: Whole-class · Small group · Panel · Debate · Brainstorming.",
"Discussion steps: Preparation → Introduction → Discussion → Summarization → Evaluation.",
"Discussion disadvantages: time-consuming · off-topic · dominant students · needs facilitation skills · difficult in very large classes · may dominate with personal feeling."],
c:[["Lecture","Discussion","محاضرة: اتجاه واحد وتركيز على المدرس — مناقشة: اتجاهين والمدرس ميسّر."],["Panel","Debate","Panel: طلبة مختارين يعرضوا وجهات نظر مختلفة والباقي يسمع ويسأل — Debate: نقاش منظم بوجهات نظر متعارضة."],["Debate","Brainstorming","Brainstorming: توليد أفكار بحرية بدون نقد فوري."]]},
{t:"6) Demonstration, Simulation, and Role Play",p:[
"Demonstration: teacher shows a task step by step, students observe, then practice under supervision – “learning by seeing and doing” (return demonstration).",
"Demonstration steps: Preparation → Introduction → Demonstration → Student Participation → Discussion/Clarification → Evaluation → Follow-up.~٧ خطوات.",
"Demonstration: excellent for psychomotor skills and clinical procedures; disadvantages: time-consuming, needs materials, students may be passive if not allowed to practice.",
"Simulation: attempts to create characteristics of the real world; practice without the risks of real-life consequences – “learn by practicing in a life-like but safe situation”.",
"Simulation types: Role Play · Mannequin/Model-based · Computer-based · Case · Business/Management.~٥ أنواع.",
"Simulation steps: Preparation → Orientation → Implementation → Debriefing/Discussion → Evaluation.~٥ خطوات.",
"Simulation disadvantages: time and resources · expensive · may not perfectly replicate the real world · anxiety or embarrassment in role-play.",
"Role play: learners act out specific roles to understand real-life problems; develops communication, empathy; acted spontaneously, without a script; short and focused (10–15 minutes).",
"Role play steps: Preparation → Introduction → Role Play Activity → Discussion/Debriefing → Evaluation.",
"Role play disadvantages: time-consuming · shy or unwilling students · difficult with very large groups · may go off-topic · needs skilled facilitation."],
c:[["Demonstration","Simulation","Demo: المدرس يعمل والطلبة يتفرجوا وبعدين يجربوا (Follow-up) — Simulation: الطلبة يمارسوا في موقف واقعي آمن (Orientation + Debriefing)."],["Simulation","Role play","Role play نوع من أنواع الـsimulation — بيركز على الاتصال والتعاطف والسلوك."],["Return demonstration","Debriefing","الأولى في الـdemonstration (الطالب يعيد الإجراء) — التانية في الـsimulation وrole play (مناقشة بعد النشاط)."]]},
{t:"7) E-Learning, Blended, Flipped, VR, and OSCE",p:[
"E-learning: digital platforms, the internet, and electronic resources; synchronous (real-time, e.g. Zoom) or asynchronous (self-paced, recorded videos, online modules).",
"E-learning disadvantages: needs good internet and technical skills · less face-to-face → risk of isolation · difficult for psychomotor skills · motivation depends on students.",
"Blended learning: traditional face-to-face classroom teaching + online learning activities; part in class, the rest online.",
"Blended disadvantages: careful planning · technology and internet essential · increased teacher workload.",
"Flipped classroom: students study new content before class (videos, readings, online lectures); class time for discussion, problem-solving, projects.",
"Virtual reality: immersive 3D computer-generated environments; VR headsets, gloves, motion sensors; safe for high-risk or rare scenarios; disadvantages: expensive, motion sickness, technical knowledge, limited availability in low-resource settings.",
"OSCE: practical examination in which students rotate through stations; each station has a task, time limit, examiner, and checklist.",
"OSCE advantages: fair, reliable, objective · wide range of skills · immediate feedback · reduces examiner bias. Disadvantages: time and resources · stressful · trained examiners and standardized patients."],
c:[["Synchronous","Asynchronous","Synchronous: وقت حقيقي (Zoom) — Asynchronous: ذاتي السرعة (فيديو مسجل، modules)."],["Blended","Flipped","Blended: جزء في القاعة وجزء أونلاين — Flipped: المحتوى قبل المحاضرة ووقت القاعة للتطبيق والنقاش."],["Simulation","VR","VR: بيئة 3D غامرة بنظارات وقفازات وحساسات — Simulation: أعم (مانيكان، role-play، كمبيوتر)."]]},
{t:"8) Teaching Materials (Media)",p:[
"Instructional media = any teaching aids or resources used in an instructional sequence to demonstrate or clarify course content. Audio + visual combined is more effective than either alone.",
"Characteristics of effective media: less expensive · well prepared · well presented · according to types and characteristics of learner · intellectual message · consider class size · achieve the required objective.~٧ صفات.",
"Types: Print (textbooks, pamphlets, study guides, manuals) · Audio (cassettes, microphone, podcast) · Visual (charts, real objects, photographs, transparencies) · Audiovisual (video, films, television) · Electronic interactive (computers, graphing calculators, tablets).",
"Print: Textbook · Pamphlet (very thin book with a paper cover; inexpensive) · Manual (practical instructions, e.g. a practical nursing book) · Flashcards (question on one side, answer on the other; recall) · Newspapers and magazines (“living textbooks”).",
"Visual: Image · Model (when the actual substance cannot be brought into class) · Map (historical events, geographical places) · Sketch (no real substance, model or map) · Graph (increasing or decreasing pattern) · Chart · Flipchart · Display.",
"Visual advantages: engaged, easy to follow, easy to remember, inexpensive, available. Disadvantages: relies only on sight; no interaction between instructor and learner.",
"Audio advantages: widely available · beneficial to visually-impaired and low-literate learners · easy to duplicate · cheap, small, portable. Disadvantages: relies only on hearing · no interaction · no visual stimulus.",
"Audiovisual advantages: good for large rooms · reference back to previous slide · effective for introducing, summarizing, reviewing · gets attention. Disadvantages: some forms are expensive · requires a well-designed presentation."],
c:[["Poster","Display","Poster: فكرة واحدة — Display: أفكار كتير (مثال: نمو الطفل)."],["Pamphlet","Manual","Pamphlet: كتيب رفيع بغلاف ورقي ورخيص — Manual: تعليمات عملية (زي كتاب العملي)."],["Model","Sketch","Model: لما الشيء الحقيقي مش متاح — Sketch: لما مفيش شيء حقيقي ولا model ولا map."],["Graph","Chart","Graph: نمط زيادة أو نقصان."]]}];


const Q=[
[{q:"Which statement describes LEARNING rather than teaching?",o:["Teaching is always linked with learning and learners","People can teach something to others even unconsciously","One does not need to be taught to learn something","Teaching is the process of imparting knowledge and instruction"],a:2,e:"Learning: people learn throughout their lives, consciously or unconsciously, without needing to be taught."},
