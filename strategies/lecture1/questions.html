<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Palette: learning indigo · ideas amber · active-learning rose · assessment green */
:root {

[data-theme="dark"] {

body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }

nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(246,247,253,.93); backdrop-filter:blur(16px); border-bottom:1px solid var(--bc); transition:var(--tr); }

.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 14px; border-radius:50px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }

.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:20px 20px 20px 6px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:nth-child(even) { border-radius:20px 20px 6px 20px; }
.opt:hover:not(.disabled) { border-color:var(--c2); background:rgba(217,119,6,.07); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:50%; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }

.opt:nth-child(2) .opt-letter { background:rgba(217,119,6,.12); color:var(--c2); border-color:rgba(217,119,6,.35); }
.opt:nth-child(3) .opt-letter { background:rgba(225,29,72,.12); color:var(--c3); border-color:rgba(225,29,72,.35); }

.opt.correct { border-color:var(--success); background:rgba(21,128,61,.09); }

.opt.wrong { border-color:var(--danger); background:rgba(220,38,38,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }

.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:50px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }

.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:50px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline:3px solid var(--c2); outline-offset:2px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(var(--accent-rgb),.3); }

.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }

.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:28px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 20px rgba(var(--accent-rgb),.12); border-top:5px solid transparent; background-image:linear-gradient(var(--card),var(--card)),var(--grad); background-origin:border-box; background-clip:padding-box,border-box; }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:16px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:20px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:10px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 10px; border-radius:50px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(220,38,38,.1); color:var(--danger); } .ri-right { background:rgba(21,128,61,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#d97706,#e11d48); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(225,29,72,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--c2); color:var(--c2); }
footer { background:var(--bg2); border-top:1px solid var(--bc); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }

</style>

            {t:"Which of the following is a 'Challenge' in nursing education?", o:["Too many resources", "Faculty resistance to new methods", "Homogeneous student groups", "Flexible curricula"], a:1},
            {t:"'Curriculum rigidity' refers to the difficulty in:", o:["Printing the syllabus", "Updating content to match healthcare trends", "Finding a classroom", "Hiring new teachers"], a:1},
            {t:"Teaching and learning in nursing are:", o:["Static and unchanging", "Dynamic, evolving processes", "Simple and easy", "Purely theoretical"], a:1},
            {t:"In the teaching-learning process, educators should be:", o:["Dictators", "Facilitators, mentors, and innovators", "Passive observers", "Only knowledge transmitters"], a:1},
            {t:"Students in nursing education are expected to be:", o:["Passive and silent", "Active, reflective, and resilient", "Dependent on the teacher for everything", "Focused only on grades"], a:1},
            {t:"Which principle emphasizes the impact of knowledge on patient safety?", o:["Creativity", "Motivation and Relevance", "Technology", "Practice"], a:1},
            {t:"Breaking down complex topics into pathophysiology, diagnosis, and management is an example of:", o:["Scaffolding", "Sequencing content", "Feedback", "Ethics"], a:1},
            {t:"Peer review is encouraged under which principle?", o:["Motivation", "Feedback and Evaluation", "Technology", "Creativity"], a:1},
            {t:"Bilingual contexts require the use of:", o:["Only one language", "Culturally sensitive and inclusive strategies", "Strict rules", "Traditional lectures"], a:1},
            {t:"Which approach focuses on 'covering' content and efficiency?", o:["Modern", "Traditional", "Future", "Active"], a:1},
            {t:"Interprofessional collaboration is a feature of:", o:["Traditional approaches", "Modern approaches", "Passive learning", "Limited clinical exposure"], a:1},
            {t:"Sustainability and green nursing education are part of:", o:["Traditional approaches", "Future directions", "Modern approaches", "Past methods"], a:1},
            {t:"Which trait involves staying strong during difficult or emotional situations?", o:["Thinking", "Feelings and Motivation", "Behavior", "Learning needs"], a:1},
            {t:"Nursing students work well in teams with doctors and other staff, showing:", o:["Thinking", "Behavior and Attitude", "Feelings", "Learning needs"], a:1},
            {t:"Managing time between study, training, and life is a:", o:["Behavior", "Learning need", "Feeling", "Principle"], a:1},
            {t:"The 'strategic approaches' explored in later chapters include:", o:["Only lectures", "Collaborative and simulation-based education", "Rote memorization", "Passive learning"], a:1},
            {t:"Professionalism and empathy are part of:", o:["Technology", "Ethical and Professional Modeling", "Practice", "Objectives"], a:1},
            {t:"The 'conceptual groundwork' for transforming nursing education is provided by:", o:["The hospital", "The textbook chapter", "The government", "The students"], a:1},
            {t:"Nursing education only focuses on clinical competence and ignores empathy.", o:["True", "False"], a:1},
            {t:"Teaching in nursing is just about delivering content to students.", o:["True", "False"], a:1},
            {t:"Education helps nurses understand ethical and legal responsibilities.", o:["True", "False"], a:0},
            {t:"Nursing students are generally passive and do not ask 'Why' questions.", o:["True", "False"], a:1},
            {t:"Connecting theory with practice is a major learning need for nursing students.", o:["True", "False"], a:0},
            {t:"Traditional nursing education involves high levels of clinical exposure.", o:["True", "False"], a:1},
            {t:"Competency-based education is a feature of modern nursing approaches.", o:["True", "False"], a:0},
            {t:"AI-driven personalized learning is considered a future direction in nursing education.", o:["True", "False"], a:0},
            {t:"A learner-centered approach ignores individual differences in learning styles.", o:["True", "False"], a:1},
            {t:"Learning objectives should be specific and measurable.", o:["True", "False"], a:0},
            {t:"Active learning avoids the use of real-life scenarios.", o:["True", "False"], a:1},
            {t:"Scaffolding techniques are used to build on a student's prior knowledge.", o:["True", "False"], a:0},
            {t:"Summative assessment is used to monitor progress during a module.", o:["True", "False"], a:1},
            {t:"Faculty resistance is a challenge in adopting new teaching methods.", o:["True", "False"], a:0},
            {t:"Teaching and learning in nursing are static and do not evolve.", o:["True", "False"], a:1}

];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 35*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'🎓', l:['#4f46e5','79,70,229','#3730a3','#4f46e5','#0e7490'], d:['#818cf8','129,140,248'] }, /* تعلم */
  { icon:'💡', l:['#d97706','217,119,6','#92400e','#d97706','#e11d48'], d:['#fbbf24','251,191,36'] }, /* أفكار */
  { icon:'🧑‍🏫', l:['#e11d48','225,29,72','#9f1239','#e11d48','#7c3aed'], d:['#fb7185','251,113,133'] }, /* تعلم نشط */
  { icon:'📚', l:['#059669','5,150,105','#065f46','#059669','#0e7490'], d:['#34d399','52,211,153'] }  /* تقييم */
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 40%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
