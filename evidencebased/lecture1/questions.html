<!DOCTYPE html>
<html lang="en">
<head>

<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Palette: research teal · evidence gold · appraisal crimson · practice slate */
:root {
  --accent:#0f766e; --accent-light:#2dd4bf; --accent-dark:#134e4a; --accent-glow:rgba(15,118,110,0.2); --accent-rgb:15,118,110;
  --c2:#ca8a04; --c3:#be123c; --c4:#334155;
  --grad:linear-gradient(135deg,#134e4a 0%,#0f766e 45%,#ca8a04 100%);
  --grad-soft:linear-gradient(135deg,#0f766e,#ca8a04);
  --bg:#f5f7f4; --bg2:#e6ece8; --card:#ffffff; --text:#14231f; --text2:#46605a; --text3:#7a928b;
  --bc:rgba(20,60,50,0.12); --success:#15803d; --danger:#dc2626; --warn:#ea580c; --r:10px;
  --tr:all 0.25s ease;
}
[data-theme="dark"] {
  --bg:#0a1311; --bg2:#12201d; --card:#172a26; --text:#e8f4f0; --text2:#b4cfc8; --text3:#7fa097;
  --bc:rgba(255,255,255,0.09); --accent:#2dd4bf; --accent-light:#5eead4; --accent-dark:#0f766e;
  --accent-glow:rgba(45,212,191,0.2); --accent-rgb:45,212,191; --c2:#facc15; --c3:#fb7185; --c4:#94a3b8;
  --success:#4ade80; --danger:#f87171;
}
body { font-family:'Outfit',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c3),var(--c4)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(245,247,244,.94); backdrop-filter:blur(16px); border-bottom:2px solid var(--accent); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(10,19,17,.95); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:700; padding:7px 14px; border-radius:6px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--c2); border-color:var(--c2); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:900; color:var(--text); }
.nav-logo-icon { width:34px; height:34px; border-radius:6px; background:var(--grad-soft); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:900; }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:6px; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); }
.hero-band { margin-top:64px; background:var(--grad); padding:36px 24px 70px; text-align:center; position:relative; overflow:hidden; clip-path:polygon(0 0,100% 0,100% 100%,0 calc(100% - 34px)); }
.hero-band::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 28px); }
.hero-band > * { position:relative; }
.pyr { position:absolute !important; right:5%; top:20px; width:92px; height:80px; opacity:.28; pointer-events:none; }
.pyr polygon { fill:#fff; transform-box:fill-box; transform-origin:bottom; animation:rise 2.4s ease-in-out infinite; }
@keyframes rise { 0%,100%{opacity:.5} 50%{opacity:1} }
.lens { position:absolute !important; left:5%; top:26px; width:64px; height:64px; border-radius:50%; border:3px solid rgba(255,255,255,.3); pointer-events:none; }
.lens::after { content:''; position:absolute; width:4px; height:26px; background:rgba(255,255,255,.3); border-radius:3px; right:-6px; bottom:-18px; transform:rotate(-45deg); }
@media (prefers-reduced-motion: reduce) { .pyr polygon { animation:none; } }
.hero-band-icon { width:68px; height:68px; border-radius:14px; background:rgba(255,255,255,.18); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:1.5px solid rgba(255,255,255,.35); transform:rotate(45deg); }
.hero-band-icon > span { transform:rotate(-45deg); display:block; }
.hero-band h1 { font-size:clamp(20px,4vw,30px); font-weight:900; color:#fff; margin-bottom:6px; }
.hero-band p { font-size:13px; color:rgba(255,255,255,.9); }
.hero-band-meta { display:flex; justify-content:center; gap:14px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(0,0,0,.2); border-left:3px solid #fff; border-radius:4px; padding:6px 14px; font-size:12px; font-weight:700; color:#fff; display:flex; align-items:center; gap:6px; }
.shell { max-width:560px; margin:0 auto; padding:10px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; border-bottom-width:3px; }
.stat-box:nth-child(1) { border-bottom-color:var(--success); }
.stat-box:nth-child(2) { border-bottom-color:var(--danger); }
.stat-box:nth-child(3) { border-bottom-color:var(--c2); }
.stat-box .val { font-size:20px; font-weight:900; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--c2); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:700; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:6px; background:var(--bg2); border-radius:3px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c2),var(--c3)); border-radius:3px; transition:width .4s; }
.timer-badge { min-width:64px; height:34px; border-radius:6px; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:var(--text); gap:5px; padding:0 12px; flex-shrink:0; font-variant-numeric:tabular-nums; }
.timer-badge.warn { color:var(--warn); border-color:rgba(234,88,12,.3); background:rgba(234,88,12,.08); }
.timer-badge.danger { color:var(--danger); border-color:rgba(220,38,38,.3); background:rgba(220,38,38,.08); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }
.q-card { background:var(--card); border:1px solid var(--bc); border-top:4px solid var(--accent); border-radius:var(--r); overflow:hidden; box-shadow:0 4px 18px rgba(var(--accent-rgb),.12); }
.q-header { padding:12px 18px 0; display:flex; align-items:center; gap:8px; }
.q-num { background:var(--grad-soft); border-radius:4px; padding:3px 12px; font-size:11px; font-weight:700; color:#fff; }
.q-text { margin:12px 18px 6px; padding:16px 18px; font-size:15px; font-weight:700; color:var(--text); line-height:1.65; background:rgba(var(--accent-rgb),.06); border-left:4px solid var(--accent); border-radius:4px 10px 10px 4px; text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:8px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:8px; border:1.5px solid var(--bc); border-left:5px solid var(--bc); background:var(--bg); cursor:pointer; font-size:14px; font-weight:600; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:nth-child(1) { border-left-color:var(--accent); }
.opt:nth-child(2) { border-left-color:var(--c2); }
.opt:nth-child(3) { border-left-color:var(--c3); }
.opt:nth-child(4) { border-left-color:var(--c4); }
.opt:hover:not(.disabled) { background:rgba(var(--accent-rgb),.08); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:6px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { color:var(--accent); }
.opt:nth-child(2) .opt-letter { color:var(--c2); }
.opt:nth-child(3) .opt-letter { color:var(--c3); }
.opt:nth-child(4) .opt-letter { color:var(--c4); }
.opt.correct { border-color:var(--success); border-left-color:var(--success); background:rgba(21,128,61,.09); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); border-left-color:var(--danger); background:rgba(220,38,38,.07); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:11px 16px; border-radius:8px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; animation:popIn .35s ease; }
@keyframes popIn { from{transform:translateY(8px);opacity:0} to{transform:none;opacity:1} }
.feedback-bar.ok { background:rgba(21,128,61,.1); color:var(--success); border:1px solid rgba(21,128,61,.25); }
.feedback-bar.no { background:rgba(220,38,38,.08); color:var(--danger); border:1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.06); border-radius:8px; border-right:3px solid var(--c2); font-size:13px; color:var(--text2); line-height:1.6; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:8px; font-size:14px; font-weight:900; cursor:pointer; font-family:'Outfit',sans-serif; transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline:3px solid var(--c2); outline-offset:2px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(var(--accent-rgb),.3); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(var(--accent-rgb),.4); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--c3); }
.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:var(--r); border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 4px 18px rgba(var(--accent-rgb),.12); border-top:5px solid var(--accent); }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-size:28px; font-weight:900; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:900; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:8px; padding:12px 8px; text-align:center; }
.rs .n { font-size:20px; font-weight:900; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:8px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-size:13px; font-weight:700; margin-bottom:8px; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); }
.ri-badge { padding:2px 10px; border-radius:4px; font-weight:700; font-size:11px; flex-shrink:0; }
.ri-yours { background:rgba(220,38,38,.1); color:var(--danger); } .ri-right { background:rgba(21,128,61,.1); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#ca8a04,#be123c); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(190,18,60,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--accent); color:var(--accent); }
footer { background:var(--bg2); border-top:2px solid var(--accent); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-size:14px; font-weight:700; } .footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:6px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 64px;} .pyr,.lens{display:none;} }
</style>
</head>

<nav>

<script>
const QUESTIONS = [
{t:"Evidence-based practice (EBP) is best described as:",o:["A one-time activity completed once","A continuous and dynamic process that integrates the best available research evidence with clinical expertise, patients' values and preferences, and context","Reliance on tradition and routine","Personal belief about what works"],a:1},
{t:"EBP is based on the principle that healthcare professionals should NOT rely solely on:",o:["Research evidence","Professional expertise","Tradition, routine, or personal beliefs","Patient needs"],a:2},
{t:"Updating the handwashing protocol once and never reviewing it again contradicts which feature of EBP?",o:["EBP is not a one-time activity","EBP relies on tradition","EBP ignores patients","EBP is only for research"],a:0},
{t:"Evidence refers to:",o:["Opinions of senior staff","Personal experience only","Information or facts supported by systematic observation, investigation, or research","Hospital routines"],a:2},
{t:"Evidence used in healthcare is broadly classified into:",o:["Old and new evidence","External and internal evidence","Strong and weak evidence","Local and national evidence"],a:1},
{t:"External evidence provides:",o:["Information from local practice and quality improvement","Knowledge from research","Patient preferences","The nurse's experience"],a:1},
{t:"Internal evidence provides:",o:["Knowledge from international research","Published systematic reviews","Patient values only","Information generated from local practice and quality improvement activities"],a:3},
{t:"A monthly report of pressure ulcer cases in your own ICU is an example of:",o:["External evidence","Clinical expertise","Internal evidence","Patient preference"],a:2},
{t:"Evidence-based nursing (EBN) is:",o:["A memorization technique","A problem-solving approach to clinical decision-making","A hospital policy only","A type of research design"],a:1},
{t:"In EBN, care is based on proof of effectiveness rather than on:",o:["Patient values","Clinical expertise","Research evidence","Habit, tradition, or personal opinion"],a:3},
{t:"Traditional practice is based mainly on:",o:["Routine","Systematic evidence searching","Outcome evaluation","A spirit of inquiry"],a:0},
{t:"Evidence-based practice is based on:",o:["Routine only","Experience only","Evidence + expertise + patient preferences","Patient preferences only"],a:2},
{t:"Which feature belongs to EBP rather than traditional practice?",o:["Practice may continue without evaluation","Systematic evidence searching","Less questioning","Heavy reliance on experience alone"],a:1},
{t:"Traditional practice may continue without evaluation, whereas in EBP:",o:["Routine is repeated","Questions are discouraged","Outcomes are evaluated","Experience is ignored"],a:2},
{t:"EBP encourages:",o:["A spirit of inquiry","Less questioning","Following routine only","Avoiding research"],a:0},
{t:"The three major elements of evidence-based nursing practice are:",o:["Experience, tradition, and routine","Research evidence, hospital policy, and cost","Clinical expertise, hospital policy, and routine","Clinical expertise, best available research evidence, and patients' values and preferences"],a:3},
{t:"Which of the following is NOT an element of evidence-based nursing practice?",o:["Clinical expertise","Hospital budget","Best available research evidence","Patients' values and preferences"],a:1},
{t:"Clinical expertise refers to the nurse's ability to use:",o:["Only research articles","Only patient opinions","Professional knowledge, clinical skills, experience, and judgment","Only hospital protocols"],a:2},
{t:"Clinical expertise is essential because:",o:["Research is always wrong","Research evidence cannot be applied to every patient in exactly the same way","Patients should not take part in decisions","Evidence is rarely available"],a:1},
{t:"A bed-bound patient is at risk of pressure ulcers. The nurse who recognizes this is identifying a:",o:["Actual health problem","Research gap","Potential health problem","Prognosis"],a:2},
{t:"Research evidence provides scientific information about all of the following EXCEPT:",o:["Effective interventions","Risk factors","Prognosis","The nurse's years of experience"],a:3},
{t:"A study comparing two tools for assessing pressure ulcer risk provides information about:",o:["Prognosis","Diagnostic approaches","Prevention strategies","Patient outcomes"],a:1},
{t:"A study measuring length of stay and complications after an intervention provides information about:",o:["Patient outcomes","Risk factors","Diagnostic approaches","Prognosis"],a:0},
{t:"Before using research findings, the nurse should consider their:",o:["Journal name only","Quality, validity, relevance, and applicability","Sample size only","Publication date only"],a:1},
{t:"Evidence-based nursing therefore supports:",o:["Provider-centered care","Task-oriented care","Patient-centered care","Routine-centered care"],a:2},
{t:"Which is an importance of EBP for nurses?",o:["Increases hospital revenue","Develops research literacy and critical thinking skills","Eliminates the need for clinical judgment","Replaces patient participation"],a:1},
{t:"All nurses changing a dressing the same proven way illustrates:",o:["Reducing unnecessary variations in nursing care","Increasing costs","Resistance to change","Limiting accountability"],a:0},
{t:"Being able to justify a decision and take responsibility for it supports:",o:["Resistance to change","Professional accountability","Cost reduction","Variation in care"],a:1},
{t:"EBP helps healthcare organizations do all of the following EXCEPT:",o:["Improve quality of services","Enhance patient safety","Reduce unnecessary healthcare costs","Increase inappropriate variation in care"],a:3},
{t:"A doctor and a nurse relying on the same guideline best illustrates how EBP:",o:["Reduces costs","Develops policies","Improves communication among healthcare professionals","Provides a foundation for research"],a:2},
{t:"Which patient benefit depends on effective interventions being appropriately implemented?",o:["Increased unnecessary tests","Reduced participation in care","Reduced individualization","Potentially reduced hospital length of stay"],a:3},
{t:"Explaining the benefits and risks of surgery before consent supports:",o:["Informed decision-making","Resistance to change","Cost reduction","Variation in care"],a:0},
{t:"Giving all people the same effective service regardless of place or income promotes:",o:["Reduced staff workload","Equitable access to effective healthcare","Increased variation","Limited research"],a:1},
{t:"Which is a benefit of EBP for the community?",o:["Increased use of ineffective interventions","Reduced equitable access","Greater variation in delivery of care","Contribution to improved population health outcomes"],a:3},
{t:"A vaccination program built on the latest recommendations shows that EBP:",o:["Reduces time requirements","Reduces costs only","Supports community health programs based on current evidence","Increases resistance"],a:2},
{t:"A nurse on a busy shift has no time to read five studies. Which limitation of EBN is this?",o:["Time requirements","Financial costs","Limited access to evidence","Research complexity"],a:0},
{t:"A nurse finds an important article but cannot read the full text without paying. This is:",o:["Resistance to change","Limited applicability","Limited access to evidence","Time requirements"],a:2},
{t:"A study done in a developed country may not suit a limited-resource rural hospital. This limitation is:",o:["Time requirements","Limited applicability","Financial costs","Limited research skills"],a:1},
{t:"\"We always do it this way\" and refusing the new method is an example of:",o:["Organizational barriers","Limited access to evidence","Research complexity","Resistance to change"],a:3},
{t:"Lack of leadership support, staffing, resources, or time that hinders implementation is a(n):",o:["Resistance to change","Organizational barrier","Limited applicability","Limited research skill"],a:1},
{t:"A nurse who cannot interpret the p-value in a results table is facing which individual barrier?",o:["Limited knowledge and skills","Attitudinal barrier","Communication gap","Organizational barrier"],a:0},
{t:"Which of the following is an attitudinal barrier?",o:["Limited internet access","Heavy workloads","Preference for traditional practice","Inadequate staffing"],a:2},
{t:"A nurse wants to change a ward routine but it is not within her permission to do so. This is a barrier of:",o:["Attitude","Time and authority","Research-related factors","Communication gaps"],a:1},
{t:"Poor communication between researchers and clinical nurses makes it difficult to:",o:["Measure outcomes","Read statistics","Access databases","Translate research findings into practice"],a:3},
{t:"An article that needs a paid subscription and ends without clear recommendations for nurses reflects which barrier?",o:["Individual barriers","Research-related barriers","Attitudinal barriers","Time and authority barriers"],a:1},

{t:"Evidence-based practice is a one-time activity.",o:["True","False"],a:1},
{t:"EBP integrates the best available research evidence with clinical expertise and patients' values and preferences.",o:["True","False"],a:0},
{t:"Internal evidence comes from local practice and quality improvement activities.",o:["True","False"],a:0},
{t:"External evidence is generated from the nurse's own department.",o:["True","False"],a:1},
{t:"Traditional practice is based mainly on routine.",o:["True","False"],a:0},
{t:"Traditional practice uses systematic evidence searching.",o:["True","False"],a:1},
{t:"EBP encourages a spirit of inquiry.",o:["True","False"],a:0},
{t:"Clinical expertise is essential because research evidence can be applied to every patient in exactly the same way.",o:["True","False"],a:1},
{t:"The nurse should consider the quality, validity, relevance, and applicability of research findings before using them.",o:["True","False"],a:0},
{t:"EBP increases unnecessary variations in nursing care.",o:["True","False"],a:1},
{t:"EBN supports patient-centered care and encourages patients to take part in decisions about their care.",o:["True","False"],a:0},
{t:"EBP can potentially reduce hospital length of stay when effective interventions are appropriately implemented.",o:["True","False"],a:0},
{t:"Evidence obtained from one population or setting is always directly applicable to another.",o:["True","False"],a:1},
{t:"Limited internet or computer access is an organizational barrier to EBP.",o:["True","False"],a:0},
{t:"Heavy workloads and insufficient time are classified under attitudinal barriers.",o:["True","False"],a:1}
];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 35*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  if (q.o.length === 2 && q.o[0] === 'True' && q.o[1] === 'False') return {...q};
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
/* دمج الألوان: كل سؤال بيمزج لونين مختلفين */
const SYSTEMS = [
  { icon:'🔬', l:['#0f766e','15,118,110','#134e4a','#0f766e','#ca8a04'], d:['#2dd4bf','45,212,191'] }, /* بحث + دليل */
  { icon:'📊', l:['#ca8a04','202,138,4','#854d0e','#ca8a04','#be123c'], d:['#facc15','250,204,21'] }, /* دليل + تقييم */
  { icon:'📖', l:['#be123c','190,18,60','#881337','#be123c','#334155'], d:['#fb7185','251,113,133'] }, /* تقييم + ممارسة */
  { icon:'⚕️', l:['#334155','51,65,85','#1e293b','#334155','#0f766e'], d:['#94a3b8','148,163,184'] }  /* ممارسة + بحث */
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.2)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 45%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[3]},${s.l[4]})`);
  const ic = document.querySelector('.hero-band-icon > span'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c2)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--c2)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
</html>
