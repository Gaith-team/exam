<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM | Pathology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:       #be123c;
  --accent-light: #e11d48;
  --accent-dark:  #6b0f2a;
  --accent-glow:  rgba(190,18,60,0.16);
  --accent-rgb:   190,18,60;
  --hema:         #3b3a8c;
  --bg:      #fbf4f5;
  --bg2:     #f4e6e9;
  --card:    #ffffff;
  --text:    #2a1a20;
  --text2:   #5c4650;
  --text3:   #8a7680;
  --bc:      rgba(107,15,42,0.12);
  --success: #15803d;
  --danger:  #b91c1c;
  --warn:    #b45309;
  --r:       10px;
  --tr:      all 0.25s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:   #170d11; --bg2: #22141a; --card: #2b1a21;
  --text: #f5e9ec; --text2: #d4bcc4; --text3: #9c8189;
  --bc:   rgba(255,200,215,0.12);
  --accent: #f43f5e; --accent-light: #fb7185; --accent-glow: rgba(244,63,94,0.2);
  --accent-rgb: 244,63,94;
  --hema: #8b8af0;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: var(--accent); transition: width .2s;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(251,244,245,.94); backdrop-filter: blur(14px);
  border-bottom: 2px solid var(--accent-dark); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(23,13,17,.95); border-bottom-color: var(--accent); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 6px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 6px;
  background: var(--accent-dark);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 900;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.shuffle-btn {
  border: 1px solid var(--bc); background: var(--bg2); color: var(--text);
  border-radius: 6px; padding: 8px 12px; font-size: 13px; font-weight: 800;
  cursor: pointer; transition: .2s ease; font-family: inherit;
}
.shuffle-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.theme-btn {
  width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); }

.hero-band {
  margin-top: 64px; padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden; color: #fff;
  background:
    radial-gradient(circle at 12% 30%, rgba(244,114,182,.35) 0 14px, transparent 15px),
    radial-gradient(circle at 20% 70%, rgba(139,138,240,.45) 0 9px, transparent 10px),
    radial-gradient(circle at 82% 25%, rgba(139,138,240,.45) 0 11px, transparent 12px),
    radial-gradient(circle at 90% 65%, rgba(244,114,182,.35) 0 16px, transparent 17px),
    radial-gradient(circle at 70% 85%, rgba(139,138,240,.35) 0 7px, transparent 8px),
    radial-gradient(circle at 30% 15%, rgba(139,138,240,.35) 0 6px, transparent 7px),
    linear-gradient(135deg, #4a0b1f, var(--accent-dark) 45%, #2b1b5a);
}
.hero-band-icon {
  width: 76px; height: 76px; border-radius: 50%;
  background: rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; margin: 0 auto 14px;
  border: 3px solid rgba(255,255,255,.55);
  box-shadow: 0 0 0 6px rgba(255,255,255,.1);
}
.hero-band h1 { font-size: clamp(22px,4vw,32px); font-weight: 900; margin-bottom: 4px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.8); }
.hero-band-meta { display: flex; justify-content: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
.meta-pill {
  background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.3); border-radius: 6px;
  padding: 6px 14px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}

.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

.stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center; border-top: 3px solid var(--bc);
}
.stat-box:nth-child(1) { border-top-color: var(--success); }
.stat-box:nth-child(2) { border-top-color: var(--danger); }
.stat-box:nth-child(3) { border-top-color: var(--hema); }
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--hema); }

.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
.prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--hema), var(--accent)); border-radius: 4px; transition: width .4s; }
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 6px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text); gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(180,83,9,.35); background: rgba(180,83,9,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(185,28,28,.35); background: rgba(185,28,28,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 6px 22px rgba(107,15,42,.08);
}
.q-header {
  background: var(--accent-dark); padding: 6px 18px;
  display: flex; align-items: center; gap: 8px;
}
.q-num { font-size: 12px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.q-text {
  padding: 22px 18px 16px; font-size: 16px; font-weight: 700; color: var(--text);
  line-height: 1.7; border-bottom: 1px dashed var(--bc);
  text-align: left; direction: ltr;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: 8px;
  border: 1.5px solid var(--bc); border-left: 5px solid var(--bc);
  background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none; direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); border-left-color: var(--accent);
  background: var(--accent-glow); transform: translateX(3px);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3); transition: var(--tr);
}
.opt.correct { border-color: var(--success); border-left-color: var(--success); background: rgba(21,128,61,.08); }
.opt.correct .opt-letter { background: var(--success); color: #fff; border-color: var(--success); }
.opt.wrong { border-color: var(--danger); border-left-color: var(--danger); background: rgba(185,28,28,.07); }
.opt.wrong .opt-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
.opt.disabled { pointer-events: none; }

.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 8px;
  display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700;
  animation: popIn .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(21,128,61,.1); color: var(--success); border: 1px solid rgba(21,128,61,.25); }
.feedback-bar.no { background: rgba(185,28,28,.08); color: var(--danger); border: 1px solid rgba(185,28,28,.2); }
.feedback-icon { font-size: 20px; }

.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06);
  border-radius: 8px; border-right: 3px solid var(--hema);
  font-size: 13px; color: var(--text2); line-height: 1.7; display: none;
}

.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 8px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Cairo', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next { background: var(--accent-dark); color: #fff; box-shadow: 0 4px 14px var(--accent-glow); }
.btn-next:hover { background: var(--accent); transform: translateY(-2px); }
.btn-skip { background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px; }
.btn-skip:hover { border-color: var(--warn); color: var(--warn); }

.result-hero {
  text-align: center; padding: 36px 20px 28px; background: var(--card);
  border-radius: 14px; border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 6px 22px rgba(107,15,42,.08);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center; flex-direction: column;
  border: 5px solid var(--bg2); position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); line-height: 1; }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px; }
.rs { background: var(--bg2); border-radius: 8px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 10px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.report-item .ri-row { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 5px; color: var(--text2); }
.ri-badge { padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; flex-shrink: 0; }
.ri-yours { background: rgba(185,28,28,.1); color: var(--danger); }
.ri-right { background: rgba(21,128,61,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: var(--accent-dark); color: #fff; }
.btn-retry:hover { background: var(--accent); transform: translateY(-2px); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

footer {
  background: var(--bg2); border-top: 2px solid var(--accent-dark);
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>
<body>

<div id="prog-bar" style="width:0%"></div>

<nav>
  <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand">
    <div class="nav-logo-icon">GT</div>
    <span>GHAITH TEAM</span>
  </div>
  <div class="nav-right">
    <button class="shuffle-btn" onclick="randomizeQuestions()" title="ترتيب الأسئلة عشوائياً">🔀 عشوائي</button>
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="hero-band">
  <div class="hero-band-icon">🔬</div>
  <h1>Introduction </h1>
  <p>Pathology</p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 80 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>

<div class="shell">
  <div class="stats-row">
    <div class="stat-box">
      <div class="val stat-correct" id="sCorrect">0</div>
      <div class="lbl">✔ صحيح</div>
    </div>
    <div class="stat-box">
      <div class="val stat-wrong" id="sWrong">0</div>
      <div class="lbl">✖ خطأ</div>
    </div>
    <div class="stat-box">
      <div class="val stat-remain" id="sRemain">--%</div>
      <div class="lbl">⏳ متبقي</div>
    </div>
  </div>

  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">80:00</span></div>
  </div>

  <div id="app"></div>
</div>

<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg">
    <i class="fa-brands fa-telegram"></i> @nursing2bu
  </a>
</footer>

<script>
const QUESTIONS = [

/* ===== MCQ — Easy ===== */
{t:"Pathology is the study of:", o:["Normal body structure","Diseases","Drug dosages","Nutrition and diet"], a:1, exp:"Pathology is the study of diseases."},
{t:"The cause or causes of a disease are called:", o:["Pathogenesis","Prognosis","Etiology","Complications"], a:2, exp:"Etiology = the cause or causes of the disease."},
{t:"The mechanism of disease development is called:", o:["Etiology","Fate","Cytology","Pathogenesis"], a:3, exp:"Pathogenesis = how the disease develops, step by step."},
{t:"Changes in tissues and organs that can be detected by naked-eye examination make up the:", o:["Gross (macroscopic) picture","Microscopic picture","Immunohistochemical picture","Electron picture"], a:0, exp:"The gross picture is what you can see with the naked eye."},
{t:"Autopsy is best defined as:", o:["Examination of cells only","Tissue specimen taken during life","Post-mortem tissue examination","Examination using ultrasound only"], a:2, exp:"Autopsy = post-mortem (after death) tissue examination."},
{t:"Cytology is the examination of:", o:["Cells","Whole organs after death","Genes only","Blood vessels only"], a:0, exp:"Cytology = examination of cells."},

/* ===== MCQ — Medium ===== */
{t:"A biopsy is a tissue specimen taken:", o:["After death","During life","Only by autopsy","Only by electron microscope"], a:1, exp:"Biopsy = tissue specimen during life; autopsy = after death."},
{t:"Low immunity, which favors infection, is an example of a:", o:["Exciting factor","Congenital factor","Predisposing factor","Hereditary factor"], a:2, exp:"Predisposing factors help the disease develop but are not its direct cause."},
{t:"The direct cause of a disease is called the:", o:["Predisposing factor","Exciting factor","Fate","Prognosis"], a:1, exp:"Exciting factor = the direct cause of the disease."},
{t:"Microbes are an example of which type of exciting factor?", o:["Endogenous","Congenital","Hereditary","Exogenous"], a:3, exp:"Exogenous causes come from outside the body, such as microbes."},
{t:"Hypertension and peptic ulcer are examples of which type of exciting factor?", o:["Endogenous","Exogenous","Congenital","Hereditary"], a:0, exp:"Endogenous causes arise inside the body."},

/* ===== MCQ — Hard ===== */
{t:"Which of the following is NOT a method of microscopic examination?", o:["Light microscope","Electron microscope","Immunohistochemical methods","Naked-eye examination"], a:3, exp:"Naked-eye examination belongs to the gross picture, not the microscopic picture."},
{t:"Paraffin or frozen sections are routinely stained by:", o:["H&E","Gram stain only","Ultrasound","Endoscopy"], a:0, exp:"Sections are stained by H&E and then examined."},
{t:"A baby is born with defects because the mother took a harmful drug during pregnancy, although the fertilized ovum was normal. This is:", o:["Hereditary cause","Endogenous cause","Congenital cause","Exogenous predisposing factor"], a:2, exp:"Congenital = in-utero affection of a normal fertilized ovum by microbes or drugs. Hereditary = genetic diseases inherited from parents."},
{t:"The pathological changes that may occur during or after the usual course of the disease are called:", o:["Fate and prognosis","Complications","Pathogenesis","Etiology"], a:1, exp:"Complications are changes that occur during or after the usual course of the disease; fate and prognosis is the end result (cure or death)."},
{t:"Autopsy is a tissue examination performed during life.", o:["True","False"], a:1, exp:"Autopsy is post-mortem. Biopsy is the one done during life."},
{t:"Etiology is the cause or causes of the disease.", o:["True","False"], a:0, exp:"Etiology = cause(s) of the disease."},
{t:"Predisposing factors are the direct cause of the disease.", o:["True","False"], a:1, exp:"They only help disease development. The direct cause is the exciting factor."},
{t:"Paraffin sections or frozen sections are stained by H&E and then examined.", o:["True","False"], a:0, exp:"This is the routine procedure for biopsy specimens."},
{t:"The electron microscope is one of the methods used to detect the microscopic picture.", o:["True","False"], a:0, exp:"Methods: light microscope, electron microscope, and immunohistochemical methods."}

];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 80*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomizeQuestions() {
  if (!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟')) return;
  init(QUESTIONS);
}

function init(pool) {
  questions = shuffle([...pool]);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerBadge').className = 'timer-badge';
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = total ? Math.round(((total - answered) / total) * 100) + '%' : '--%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

function render() {
  if (!questions.length) {
    document.getElementById('app').innerHTML = '<div class="q-card"><div class="q-text" style="text-align:center;direction:rtl">أضف الأسئلة داخل QUESTIONS</div></div>';
    clearInterval(timerInterval);
    return;
  }
  updateTop();
  const q = questions[i];
  const order = shuffle(q.o.map((_, idx) => idx));
  q._displayOrder = order;
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${order.map((originalIdx, displayIdx) => `
          <div class="opt" id="opt${originalIdx}" onclick="choose(${originalIdx})">
            <div class="opt-letter">${LETTERS[displayIdx] || displayIdx + 1}</div>
            <div class="opt-text">${q.o[originalIdx]}</div>
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🥳</span> <span>ما شاء الله عليك 🎉</span>`
    : `<span class="feedback-icon">😢</span> <span>ركز ونحاول فيها تاني</span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--hema)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--hema)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي 🔀</button>
      <a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

/* THEME */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch(e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch(e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

init(QUESTIONS);
</script>
</body>
</html>
