<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.btn-next,.btn-retry{background:var(--accent-dark);color:#fff}.btn-next:hover,.btn-retry:hover{background:var(--accent)}
.btn-skip,.btn-home{background:var(--bg2);color:var(--text2);border:1px solid var(--bc)}.btn-skip{flex:0 0 auto;padding:13px 18px}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:14px;border:1px solid var(--bc);margin-bottom:20px}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;border:5px solid var(--bg2);position:relative}
.score-ring svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:5;stroke-linecap:round}.ring-bg{stroke:var(--bg2)}.ring-fill{transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:900;line-height:1}.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:900;margin-bottom:6px}.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:8px;padding:12px 8px;text-align:center}.rs .n{font-size:20px;font-weight:900}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-radius:10px;padding:16px;margin-bottom:10px;border-right:4px solid var(--bc)}
.report-item.ok{border-right-color:var(--success)}.report-item.no{border-right-color:var(--danger)}
.ri-q{font-size:13px;font-weight:700;margin-bottom:8px;direction:ltr;text-align:left}.ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px}.ri-yours{background:rgba(185,28,28,.1);color:var(--danger)}.ri-right{background:rgba(21,128,61,.1);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
footer{background:var(--bg2);border-top:2px solid var(--accent-dark);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--accent)}.footer-tg{text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}</style></head><body>

<div class="hero-band"><div class="hero-band-icon">🔬</div><h1>inflammation</h1><p>Pathology</p><div class="hero-band-meta"><div class="meta-pill"><span id="totalBadge">-- سؤال</span></div><div class="meta-pill">⏱ 80 Min</div><div class="meta-pill">Shuffled</div></div></div>
<div class="shell"><div class="stats-row"><div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div><div class="stat-box"><div class="val stat-wrong" id="sWrong">0</div><div class="lbl">✖ خطأ</div></div><div class="stat-box"><div class="val stat-remain" id="sRemain">--%</div><div class="lbl">⏳ متبقي</div></div></div>
<div class="prog-strip"><div class="prog-label" id="progLabel">سؤال ١</div><div class="prog-track"><div class="prog-fill" id="progFill"></div></div><div class="timer-badge" id="timerBadge">⏱ <span id="timerTxt">80:00</span></div></div><div id="app"></div></div>
<footer><div class="footer-brand">GHAITH <span>TEAM</span></div><a href="https://t.me/nursing2bu" target="_blank" class="footer-tg">@nursing2bu</a></footer>
<script>
const QUESTIONS = [
// ===== MULTIPLE CHOICE (35) — graded easy → hard =====
{t:"Inflammation is best defined as:", o:["Uncontrolled proliferation of cells","The body's protective response to injury, infection, or irritation","Death of cells due to lack of oxygen","A decrease in the size of an organ"], a:1},
{t:"Inflammation of the appendix is called:", o:["Appendicitis","Appendectomy","Appendosis","Appendoma"], a:0},
{t:"Which type of inflammation is rapid and short-term?", o:["Chronic","Granulomatous","Acute","Atrophic"], a:2},
{t:"Which is the FIRST vascular change in acute inflammation?", o:["Vasodilation","Stasis","Exudate formation","Transient vasoconstriction"], a:3},
{t:"Redness and heat in acute inflammation are mainly due to:", o:["Vasodilation and increased blood flow","Tissue necrosis","Pus formation","Lymphatic obstruction"], a:0},
{t:"Which of the following is NOT a cardinal sign of inflammation?", o:["Redness","Heat","Cyanosis","Loss of function"], a:2},
{t:"Which WBC is the first to arrive at the site of acute inflammation (6–24 hours)?", o:["Macrophages","Neutrophils","Lymphocytes","Eosinophils"], a:1},
{t:"Eosinophils are typically increased in:", o:["Bacterial infection","Viral infection","Allergy and parasitic infection","Acute abscess"], a:2},
{t:"Movement of WBCs toward the site of inflammation is called:", o:["Phagocytosis","Chemotaxis","Resolution","Stasis"], a:1},
{t:"Normal WBC count is approximately:", o:["1,000–3,000/mm³","5,000–10,000/mm³","15,000–20,000/mm³","30,000–40,000/mm³"], a:1},
{t:"Which one of the following is an acute-phase protein produced by the liver?", o:["Albumin","Haemoglobin","C-reactive protein (CRP)","Fibrin"], a:2},
{t:"Leukopenia may occur in:", o:["Typhoid fever","Acute appendicitis","Staphylococcal abscess","Allergy"], a:0},
{t:"Which of the following is NOT a function of inflammatory exudate?", o:["Localizes the infection","Dilutes bacterial toxins","Brings antibodies to the area","Destroys healthy tissue deliberately"], a:3},
{t:"Pus contains all of the following EXCEPT:", o:["Dead neutrophils","Bacteria","Dead tissue","Epithelioid cells"], a:3},
{t:"Which pair of bacteria are the main pyogenic organisms?", o:["Staphylococci and Streptococci","Mycobacteria and Salmonella","Clostridia and Vibrio","E. coli and Brucella"], a:0},
{t:"The common cause of an abscess is:", o:["Streptococcus","Staphylococci","Mycobacterium bovis","Schistosoma"], a:1},
{t:"The three zones of an abscess from center to outside are:", o:["Pus → necrosis → fibrosis","Fibrosis → pus → necrosis","Central necrosis → pus → peripheral acute inflammation","Peripheral inflammation → necrosis → pus"], a:2},
{t:"A burn blister is an example of which type of non-suppurative inflammation?", o:["Serous","Catarrhal","Fibrinous","Caseous"], a:0},
{t:"Fibrinous inflammation is commonly seen in:", o:["Skin and hair","Pleura, pericardium and peritoneum","Bone and cartilage","Brain and spinal cord"], a:1},
{t:"The main cells in chronic inflammation are:", o:["Neutrophils","Eosinophils","Macrophages and lymphocytes","Red blood cells"], a:2},
{t:"A granuloma is characterized by the presence of:", o:["Neutrophils only","Epithelioid cells","Pus cells","Fat cells"], a:1},
{t:"Which of the following is NOT a common cause of granulomatous inflammation?", o:["Tuberculosis","Sarcoidosis","Acute appendicitis","Schistosomiasis"], a:2},
{t:"The characteristic central necrosis of TB is:", o:["Coagulative necrosis","Liquefactive necrosis","Fat necrosis","Caseous necrosis"], a:3},
{t:"The granuloma of tuberculosis is called a:", o:["Tubercle","Gumma","Polyp","Abscess"], a:0},
{t:"The most common route of TB infection is:", o:["Skin inoculation","Ingestion","Inhalation","Blood transfusion"], a:2},
{t:"The immune mechanism responsible for tissue damage in TB is:", o:["Type I hypersensitivity","Type II hypersensitivity","Type III hypersensitivity","Type IV (delayed-type) hypersensitivity"], a:3},
{t:"Langhans giant cells have nuclei arranged:", o:["Centrally in a cluster","Peripherally in a horseshoe pattern","In a single row","Randomly scattered"], a:1},
{t:"The primary pulmonary complex (GLL) includes all of the following EXCEPT:", o:["Ghon focus","Tuberculous lymphangitis","Tuberculous lymphadenitis","Cavity formation in the apex"], a:3},
{t:"The Ghon focus is usually located:", o:["At the apex of the lung","Subpleural, in the lower part of the upper lobe or upper part of the lower lobe","In the hilum only","Inside the bronchus"], a:1},
{t:"Secondary pulmonary TB usually begins in the:", o:["Base of the lung","Pleura","Apex of the lung","Hilar lymph nodes"], a:2},
{t:"Miliary TB results from which type of spread?", o:["Direct spread","Lymphatic spread","Intracanalicular spread","Haematogenous spread"], a:3},
{t:"Acute caseous pneumonia occurs when there is:", o:["High immunity and low hypersensitivity","Low immunity and high hypersensitivity","High immunity and high hypersensitivity","Low immunity and low hypersensitivity"], a:1},
{t:"Which species of Schistosoma causes urinary bilharziasis?", o:["S. mansoni","S. japonicum","S. haematobium","S. stercoralis"], a:2},
{t:"In bilharzial cystitis, the lesion in which Brunn's nests become cystically dilated is called:", o:["Cystitis glandularis","Cystitis cystica","Cystitis follicularis","Interstitial cystitis"], a:1},
{t:"Hepatic bilharziasis (S. mansoni) leads mainly to:", o:["Portal hypertension","Hepatic abscess","Acute hepatitis","Liver atrophy only"], a:0},
// ===== TRUE / FALSE (15) =====
{t:"Acute inflammation is characterized by a rapid onset and short duration.", o:["True","False"], a:0},
{t:"Stasis occurs because the blood becomes less viscous and flows faster.", o:["True","False"], a:1},
{t:"Neutrophils are the first WBCs to arrive at the site of acute inflammation.", o:["True","False"], a:0},
{t:"Lymphocytosis is commonly associated with bacterial infection.", o:["True","False"], a:1},
{t:"Pus is formed in suppurative inflammation and contains dead neutrophils.", o:["True","False"], a:0},
{t:"Cellulitis is a localized collection of pus surrounded by a well-defined cavity.", o:["True","False"], a:1},
{t:"Catarrhal inflammation affects mucous membranes, e.g. the common cold.", o:["True","False"], a:0},
{t:"Chronic inflammation is mainly characterized by neutrophils and prominent exudate.", o:["True","False"], a:1},
{t:"Epithelioid cells are modified macrophages.", o:["True","False"], a:0},
{t:"Neutrophils can effectively kill Mycobacterium tuberculosis in the early stage.", o:["True","False"], a:1},
{t:"A tubercle consists of epithelioid cells, Langhans giant cells and lymphocytes with central caseation.", o:["True","False"], a:0},
{t:"In people with high immunity, small TB lesions heal by fibrosis.", o:["True","False"], a:0},
{t:"The apex of the lung is favored in secondary TB because of its rich blood supply.", o:["True","False"], a:1},
{t:"Schistosoma mansoni eggs are deposited mainly in the rectum and colon.", o:["True","False"], a:0},
{t:"Urinary bilharziasis increases the risk of bladder carcinoma.", o:["True","False"], a:0},

];
let questions,i,correct,wrong,answers,wrongSet,answered;let totalTime=80*60,timeLeft,timerInterval;const LETTERS=['A','B','C','D','E','F'];
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function randomizeQuestions(){if(!confirm('🔀 هل تريد بدء الامتحان من جديد بترتيب أسئلة عشوائي؟'))return;init(QUESTIONS)}
function init(pool){questions=shuffle([...pool]);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;document.getElementById('totalBadge').textContent=questions.length+' سؤال';startTimer();render()}
function startTimer(){clearInterval(timerInterval);document.getElementById('timerBadge').className='timer-badge';timerInterval=setInterval(()=>{timeLeft--;const m=Math.floor(timeLeft/60),s=timeLeft%60;document.getElementById('timerTxt').textContent=m+':'+(s<10?'0':'')+s;const b=document.getElementById('timerBadge');if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';if(timeLeft<=0){clearInterval(timerInterval);finish()}},1000)}
function updateTop(){const t=questions.length;document.getElementById('sCorrect').textContent=correct;document.getElementById('sWrong').textContent=wrong;document.getElementById('sRemain').textContent=Math.round(((t-answered)/t)*100)+'%';document.getElementById('progLabel').textContent='سؤال '+(i+1)+' / '+t;const p=((i+1)/t*100)+'%';document.getElementById('progFill').style.width=p;document.getElementById('prog-bar').style.width=p}
function render(){updateTop();const q=questions[i];const order=q.o.length>2?shuffle(q.o.map((_,x)=>x)):q.o.map((_,x)=>x);
document.getElementById('app').innerHTML=`<div class="q-card"><div class="q-header"><div class="q-num">سؤال ${i+1} / ${questions.length}</div></div><div class="q-text">${q.t}</div><div class="options">${order.map((oi,di)=>`<div class="opt" id="opt${oi}" onclick="choose(${oi})"><div class="opt-letter">${LETTERS[di]}</div><div class="opt-text">${q.o[oi]}</div></div>`).join('')}</div><div class="nav-btns"><button class="btn btn-skip" onclick="skip()">⏭ تخطي</button></div></div>`}
function choose(v){if(answers[i]!==null)return;answers[i]=v;answered++;const q=questions[i];const ok=v===q.a;ok?correct++:wrong++;updateTop();
q.o.forEach((_,x)=>{const el=document.getElementById('opt'+x);el.classList.add('disabled');if(x===q.a)el.classList.add('correct');else if(x===v)el.classList.add('wrong')});
const fb=document.createElement('div');fb.className='feedback-bar '+(ok?'ok':'no');fb.innerHTML=ok?'<span>🥳</span><span>ما شاء الله عليك 🎉</span>':'<span>😢</span><span>ركز ونحاول فيها تاني</span>';
const card=document.querySelector('.q-card');card.querySelector('.options').after(fb);
if(q.exp){const e=document.createElement('div');e.className='explanation';e.innerHTML='<b>💬 شرح:</b> '+q.exp;fb.after(e)}
card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'السؤال التالي ←':'🏁 إنهاء الامتحان'}</button>`}
function skip(){if(answers[i]===null){answers[i]=-1;answered++;wrong++;updateTop()}next()}
function next(){if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){clearInterval(timerInterval);const total=questions.length;const score=Math.round(correct/total*100);
wrongSet=[];questions.forEach((q,x)=>{if(answers[x]!==q.a)wrongSet.push(q)});
let grade,gc;if(score>=90){grade='🥇 ممتاز';gc='var(--success)'}else if(score>=75){grade='🥈 جيد جداً';gc='var(--hema)'}else if(score>=60){grade='🥉 جيد';gc='var(--warn)'}else{grade='📚 راجع تاني';gc='var(--danger)'}
const circ=2*Math.PI*45,off=circ-score/100*circ;
const rep=questions.map((q,x)=>{const ok=answers[x]===q.a;return `<div class="report-item ${ok?'ok':'no'}"><div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>${!ok?`<div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[x]>=0?q.o[answers[x]]:'تم التخطي'}</div><div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>`:''}</div>`}).join('');
const skipped=answers.filter(a=>a===-1).length;
document.getElementById('prog-bar').style.width='100%';
document.getElementById('app').innerHTML=`<div class="result-hero"><div class="score-ring"><svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45"/><circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg><div class="score-num">${score}</div><div class="score-pct">%</div></div><div class="result-grade" style="color:${gc}">${grade}</div><div class="result-sub">أجبت على ${answered} من ${total} سؤال</div><div class="result-stats"><div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div><div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div><div class="rs"><div class="n" style="color:var(--hema)">${skipped+(total-answered)}</div><div class="l">تخطي</div></div></div></div><div class="result-actions">${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()">🔁 إعادة الخطأ (${wrongSet.length})</button>`:''}<button class="btn btn-home" onclick="init(QUESTIONS)">🔀 امتحان جديد عشوائي</button><a href="https://gaith-team.github.io/exam/psychiatric/index.html" class="btn btn-home">🏠 رجوع للمادة</a></div><div style="margin-top:28px"><div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>${rep}</div>`;
setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=off},100);window.scrollTo({top:0,behavior:'smooth'})}
function retryWrong(){questions=shuffle([...wrongSet]);i=0;correct=0;wrong=0;answers=new Array(questions.length).fill(null);wrongSet=[];answered=0;timeLeft=totalTime;startTimer();render();window.scrollTo({top:0,behavior:'smooth'})}
const themeBtn=document.getElementById('themeBtn');let theme='light';try{theme=localStorage.getItem('theme')||'light'}catch(e){}
function applyTheme(t){theme=t;document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');themeBtn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}}
applyTheme(theme);themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));init(QUESTIONS);
</script></body></html>
