<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#be123c;--dark:#6b0f2a;--hema:#3b3a8c;--bg:#fbf4f5;--bg2:#f4e6e9;--card:#fff;--text:#2a1a20;--text2:#5c4650;--bc:rgba(107,15,42,.14);--ex:#eef0ff;--exb:#3b3a8c}
[data-theme=dark]{--bg:#170d11;--bg2:#22141a;--card:#2b1a21;--text:#f5e9ec;--text2:#d4bcc4;--bc:rgba(255,200,215,.14);--accent:#fb7185;--hema:#a5a4ff;--ex:#25233f;--exb:#a5a4ff}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;transition:background .3s}
#bar{position:fixed;top:0;right:0;height:3px;background:var(--accent);z-index:99;width:0}
nav{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--card);border-bottom:2px solid var(--dark)}
.brand{display:flex;gap:9px;align-items:center;font-weight:900}
.logo{width:34px;height:34px;border-radius:6px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px}
.btns{display:flex;gap:8px}
.btns button{border:1px solid var(--bc);background:var(--bg2);color:var(--text);border-radius:6px;padding:7px 12px;font:700 13px Cairo;cursor:pointer}
.btns button:hover{border-color:var(--accent)}
.hero{padding:38px 20px;text-align:center;color:#fff;background:radial-gradient(circle at 12% 30%,rgba(244,114,182,.35) 0 14px,transparent 15px),radial-gradient(circle at 85% 65%,rgba(244,114,182,.35) 0 16px,transparent 17px),radial-gradient(circle at 80% 22%,rgba(139,138,240,.45) 0 11px,transparent 12px),radial-gradient(circle at 20% 72%,rgba(139,138,240,.45) 0 9px,transparent 10px),linear-gradient(135deg,#4a0b1f,var(--dark) 45%,#2b1b5a)}
.hero h1{font-size:clamp(24px,5vw,34px);font-weight:900}
.hero p{opacity:.85;font-size:14px}
main{max-width:760px;margin:0 auto;padding:22px 16px 70px}
h2{margin:34px 0 14px;padding:10px 16px;background:var(--dark);color:#fff;border-radius:10px;font-size:20px;font-weight:900;direction:ltr;text-align:left}
h3{margin:22px 0 10px;color:var(--accent);font-size:17px;font-weight:900;direction:ltr;text-align:left;border-bottom:2px dashed var(--bc);padding-bottom:4px}
.pt{background:var(--card);border:1px solid var(--bc);border-radius:12px;margin:10px 0;overflow:hidden;box-shadow:0 3px 12px rgba(107,15,42,.06)}
.en{direction:ltr;text-align:left;padding:12px 16px;font-weight:700;font-size:15.5px;border-left:5px solid var(--accent)}
.ar{padding:10px 16px;color:var(--text2);font-size:15px;border-top:1px dashed var(--bc)}
.ex{margin:0 12px 12px;padding:9px 14px;background:var(--ex);border-right:4px solid var(--exb);border-radius:8px;font-size:14.5px}
.ex b{color:var(--exb)}
body.noex .ex{display:none}
figure{margin:14px 0;text-align:center;background:var(--card);border:1px solid var(--bc);border-radius:12px;padding:12px}
figure .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
figure img{max-width:100%;max-height:340px;border-radius:8px}
figcaption{direction:ltr;margin-top:8px;font-size:13px;font-weight:700;color:var(--text2)}
footer{text-align:center;padding:18px;background:var(--bg2);border-top:2px solid var(--dark);font-weight:700;font-size:14px}
footer span{color:var(--accent)}
</style>
</head>

const D=[
H2('Cell Injury'),
P('Cell injury occurs when a cell is exposed to a harmful stimulus that exceeds its ability to adapt, resulting in structural and/or functional abnormalities.','الخلية بتتأذّى لما يجيلها مؤثر ضار أقوى من قدرتها إنها تتأقلم معاه، فيحصل تغيير في شكلها أو وظيفتها أو الاتنين.','زي العضلة لما ترفع حمل أتقل من طاقتها، تتعب وتبوظ.'),
H3('Causes of cell injury'),
P('1) Hypoxia (decreased oxygen supply).','نقص الأكسجين اللي واصل للخلية.','زي واحد محبوس في أوضة من غير هوا، يتعب بسرعة.'),
P('a) Ischemia (decrease of blood supply), e.g. arterial occlusion and atherosclerosis.','الإسكيميا يعني الدم اللي رايح للعضو يقل، زي ما الشريان يتسد أو يتصلّب.','زي ماسورة مية اتسدّت، فالزرع اللي بعدها يعطش.'),
P('b) Heart and lung diseases (decreased oxygenation).','أمراض القلب والرئة بتخلي الدم مش بيتأكسج كويس.','الرئة هي «محطة تعبئة الأكسجين»، لو باظت الدم يطلع فاضي.'),
P('c) Decreased oxygen carrying capacity of the RBCs, e.g. anemia.','كرات الدم الحمرا هي اللي بتشيل الأكسجين، ولو قلّت (أنيميا) الأكسجين اللي بيوصل بيقل.','زي عربيات نقل قليلة، البضاعة (الأكسجين) متوصلش كلها.'),
P('d) Severe blood loss.','نزيف شديد يعني دم أقل = أكسجين أقل للخلايا.','واحد اتعور جامد ونزف كتير، أعضاؤه تنقصها أكسجين.'),
P('2) Infectious agents: a. Bacteria, b. Viruses, c. Rickettsia, d. Fungi, e. Parasites.','الميكروبات بأنواعها (بكتيريا، فيروسات، ريكتسيا، فطريات، طفيليات) بتأذّي الخلية.','فيروس الكبد الوبائي بيأذّي خلايا الكبد.'),
P('3) Physical agents: a. Trauma, b. Extremes of temperature, c. Radiation.','عوامل فيزيائية: الصدمات، الحرارة أو البرودة الشديدة، الإشعاع.','حرق بمية سخنة، أو شعاع بيتعرض له المريض.'),
P('4) Chemical agents: a. Concentrated acids and alkalis.','مواد كيماوية: الأحماض والقلويات المركّزة.','حمض مركّز لو وقع على الجلد بيحرقه.'),
P('b. Poisons: Cyanide / Carbon monoxide / Arsenic.','السموم زي السيانيد وأول أكسيد الكربون والزرنيخ.','أول أكسيد الكربون من مدفأة في أوضة مقفولة بيسمّم.'),
P('c. Alcohol, d. Therapeutic drugs, e. Environmental pollutants.','الكحول والأدوية العلاجية وملوّثات البيئة كمان ممكن تأذّي الخلية.','شرب الكحول على طول بيأذّي الكبد.'),
P('5) Immunologic reactions: a. Allergic reactions, b. Autoimmune diseases.','جهاز المناعة نفسه ممكن يأذّي الخلايا، في الحساسية وفي أمراض المناعة الذاتية.','في المناعة الذاتية الجسم بيهاجم خلاياه كأنها غريبة.'),
P('6) Nutritional disturbance. Deficiency: protein / vitamins / minerals. Excess: obesity / excess alcohol.','اضطراب التغذية، إما نقص (بروتين، فيتامينات، معادن) أو زيادة (سمنة، كحول كتير).','واحد سوء تغذية محتاج أكل، وواحد سمين زيادة، والاتنين خلاياهم بتتأذّى.'),
P('7) Genetic and chromosomal defects.','عيوب وراثية أو في الكروموسومات.','طفل اتولد بعيب جيني من أهله.'),
H2('Mechanisms of Cell Injury'),
P('Cell injury lead to disturbance of: 1. Cell membrane.','أول حاجة بتتأثر هي غشاء الخلية.','غشاء الخلية زي سور البيت، لو اتخرم كل حاجة تدخل وتخرج.'),
P('2. Mitochondria and ATP production.','الميتوكوندريا هي مصنع الطاقة (ATP) وبتتأثر.','زي ما الكهربا تقطع عن المصنع.'),
P('3. Synthesis of the structural protein.','تصنيع البروتينات اللي بتبني الخلية بيتأثر.','زي مصنع طوب بطّل ينتج طوب للبناء.'),
P('4. The integrity of the cellular genetic apparatus (DNA-RNA).','سلامة المادة الوراثية DNA وRNA بتتأثر.','زي كتاب تعليمات الخلية اتقطّعت صفحاته.'),
H3('Effects of cell injury'),
P('The effects of cell injury include: 1. Adaptation 2. Reversible cell injury 3. Irreversible cell injury 4. Intracellular and extracellular deposits.','نتايج الأذى أربعة: تأقلم، أذى يرجع طبيعي، أذى مايرجعش، وتراكم مواد جوا الخلية أو برّاها.','زي حد تعبان: يا يتأقلم، يا يخف، يا يموت، أو تتراكم عليه فضلات.'),
I('f3','Fig (3) The effects of cell injury'),
H2('1 - Adaptation'),
P('Cells adapt to acceptable changes in their environment by: 1. Atrophy 2. Hypertrophy 3. Hyperplasia 4. Metaplasia.','الخلايا بتتأقلم مع التغيير بأربع طرق: ضمور، تضخم حجم، زيادة عدد، وتحوّل نوع.','زي واحد اتنقل بلد جديدة وغيّر عاداته عشان يعيش.'),
H3('(1) Atrophy'),
P('Decrease in the size of full-developed organ due to diminution in the size and/or number of its constituent cells.','الضمور هو إن عضو كامل النمو يصغر لأن خلاياه صغرت أو قلّ عددها أو الاتنين.','عضلة دراعك بعد الجبس بتبقى أرفع.'),
P('Physiological atrophy: as atrophy of the thymus after puberty.','ضمور طبيعي: الغدة الزعترية بتضمر بعد البلوغ.','حاجة طبيعية بتحصل لكل الناس.'),
P('Pathological atrophy — Disuse atrophy: e.g. the muscles of paralyzed limb.','ضمور مرضي من قلة الاستعمال، زي عضلات طرف مشلول.','المريض اللي رجله مشلولة، عضلاتها بتصغر.'),
P('Senile atrophy: as atrophy of the genital organs such as uterus, after menopause.','ضمور الشيخوخة، زي ضمور الرحم بعد انقطاع الطمث.','رحم ست بعد سن اليأس بيبقى أصغر.'),
I('f4','Fig (4) Atrophy'),
H3('(2) Hypertrophy'),
P('Increase in organ size due to increase in the size of its cells.','التضخم هو إن العضو يكبر لأن حجم خلاياه زاد.','لاعب كمال أجسام عضلاته كبرت.'),
P('Physiological hypertrophy: as in striated muscles hypertrophy with muscular exercise.','تضخم طبيعي، زي تضخم العضلات مع التمرين.','الجيم.'),

 else if(d[0]==='i'){const ks=d[1][0].split('|');m.insertAdjacentHTML('beforeend','<figure><div class="row">'+ks.map(k=>'<img src="'+IMG[k]+'" alt="">').join('')+'</div><figcaption>'+d[2]+'</figcaption></figure>')}
 else{m.insertAdjacentHTML('beforeend','<div class="pt"><div class="en">'+d[1]+'</div><div class="ar">'+d[2]+'</div><div class="ex"><b>عشان تفهمها :</b> '+d[3]+'</div></div>')}
});
const th=document.getElementById('th');let t=localStorage.getItem('t')||'light';
function ap(){document.documentElement.setAttribute('data-theme',t);th.textContent=t==='dark'?'☀️':'🌙'}
ap();th.onclick=()=>{t=t==='dark'?'light':'dark';try{localStorage.setItem('t',t)}catch(e){}ap()};
const eb=document.getElementById('exb');eb.onclick=()=>{const h=document.body.classList.toggle('noex');eb.textContent=h?'إظهار "عشان تفهمها"':'إخفاء "عشان تفهمها"'};
addEventListener('scroll',()=>{document.getElementById('bar').style.width=(scrollY/(document.body.scrollHeight-innerHeight)*100)+'%'});
</script>
