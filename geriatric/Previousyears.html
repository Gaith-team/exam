let QUESTIONS = [];

let Q, cur, sel, size = 13;
const $ = id => document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function init(rand){
  Q = rand ? shuffle([...QUESTIONS]) : [...QUESTIONS];
  cur = 0; sel = Array(Q.length).fill(null);
  $('tot').textContent = $('tot2').textContent = Q.length;
  render(); window.scrollTo(0,0);
}

function render(){
  const q = Q[cur], done = sel[cur] !== null, tf = q.o.length === 2;
  $('qno').textContent = 'Question No. ' + (cur+1) + ' / ' + Q.length;
  let h = `<div class="qtext" style="font-size:${size}px">${q.t}</div>`;
  q.o.forEach((o,i)=>{
    let c = 'opt' + (done ? ' done' : '');
    if(done){ if(i===q.a) c += ' ok'; else if(i===sel[cur]) c += ' bad'; }
    h += `<div class="${c}" style="font-size:${size}px" onclick="pick(${i})">${tf?'':'<span class="l">'+'ABCD'[i]+'.</span>'}<span>${o}</span></div>`;
  });
  if(done) h += sel[cur]===q.a ? '<div class="fb g">✔ Correct</div>' : `<div class="fb r">✖ Wrong — the correct answer is: ${q.o[q.a]}</div>`;
  $('qbody').innerHTML = h;
  $('bp').disabled = cur === 0;
  $('bn').disabled = cur === Q.length - 1;
  refresh();
}

function pick(i){ if(sel[cur] !== null) return; sel[cur] = i; render(); }

function refresh(){
  let ok=0, no=0;
  $('nav').innerHTML = Q.map((q,i)=>{
    let s = 's-nv';
    if(sel[i] !== null){ if(sel[i]===q.a){s='s-ok';ok++} else {s='s-no';no++} }
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('cOk').textContent = ok; $('cNo').textContent = no; $('cNv').textContent = Q.length - ok - no;
  $('ans').textContent = ok + no; $('cor').textContent = ok;
}

function go(i){ if(i>=0 && i<Q.length){ cur=i; render(); } }
function nextQ(){ go(cur+1) }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight') nextQ(); else if(e.key==='ArrowLeft') go(cur-1);
  else if(e.key>='1' && e.key<='4' && +e.key<=Q[cur].o.length) pick(+e.key-1);
});

function buildList(){
  const l=$('tl');
  const tot=TOPICS.reduce((s,x)=>s+x.qs.length,0);
  l.innerHTML=`<label class="tp all"><input type="checkbox" id="ck_all" onchange="toggleAll(this.checked)"><span>كل المحاضرات (شامل)</span><span class="c">${tot}</span></label>`+
   TOPICS.map((x,i)=>`<label class="tp"><input type="checkbox" class="ck" value="${i}" onchange="upd()"><span>${x.name}</span><span class="c">${x.qs.length}</span></label>`).join('');
  upd();
}
function toggleAll(v){document.querySelectorAll('.ck').forEach(c=>c.checked=v);upd()}
function chosen(){return [...document.querySelectorAll('.ck:checked')].map(c=>+c.value)}
function upd(){
  const s=chosen(),n=s.reduce((a,i)=>a+TOPICS[i].qs.length,0);
  $('ck_all').checked=s.length===TOPICS.length;
  $('sel').textContent=s.length?`${s.length} محاضرة · ${n} سؤال`:'اختار محاضرة على الأقل';
  $('go0').disabled=!s.length;
}
function startSel(){
  const s=chosen();if(!s.length)return;
  QUESTIONS=[].concat(...s.map(i=>TOPICS[i].qs));
  $('pick').classList.add('hide');$('examv').classList.remove('hide');
  init(true);
}
function back(){$('examv').classList.add('hide');$('pick').classList.remove('hide');window.scrollTo(0,0)}
buildList();
</script>
