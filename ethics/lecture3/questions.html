<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #5b1a35;
  --teal:    #7a2547;
  --emerald: #2f4858;
  --gold:    #b8893b;

  --accent:       #7a2547;
  --accent-light: #a8456f;
  --accent-dark:  #5b1a35;
  --accent-glow:  rgba(122,37,71,0.18);
  --accent-rgb:   122,37,71;

  --grad:       linear-gradient(135deg, #5b1a35 0%, #4a2048 55%, #3d2557 100%);
  --grad-bar:   linear-gradient(90deg, #5b1a35, #3d2557, #2f4858, #b8893b);

  --bg:      #faf7f8;
  --bg2:     #f1eaee;
  --card:    #ffffff;
  --text:    #241a20;
  --text2:   #54464e;
  --text3:   #84747c;
  --bc:      rgba(60,20,40,0.10);
  --success: #16a34a;
  --danger:  #dc2626;
  --warn:    #d97706;
  --r:       16px;
  --tr:      all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --accent:       #d98aae;
  --accent-light: #e6a7c4;
  --accent-glow:  rgba(217,138,174,0.18);
  --accent-rgb:   217,138,174;
  --bg:   #150e14; --bg2: #1e141c; --card: #261a24;
  --text: #f0e6ec; --text2: #c9b8c2; --text3: #8f7b87;
  --bc:   rgba(255,235,245,0.10);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: var(--grad-bar);
  transition: width .2s;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(250,247,248,.94); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bc); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(21,14,20,.96); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent-glow); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  color: #e3c58b; font-size: 12px; font-weight: 900;
  box-shadow: 0 0 0 2px rgba(184,137,59,.7);
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.theme-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

.hero-band {
  margin-top: 64px;
  background: var(--grad);
  padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden;
  border-bottom: 4px solid var(--gold);
}
.hero-band::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(circle 220px at 12% 20%, rgba(184,137,59,.25) 0%, transparent 70%),
    radial-gradient(circle 260px at 90% 85%, rgba(217,138,174,.22) 0%, transparent 70%),
    radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.10) 0%, transparent 70%);
}
.hero-band > * { position: relative; }
.hero-band-icon {
  width: 68px; height: 68px; border-radius: 20px;
  background: rgba(255,255,255,.16); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px; border: 1.5px solid rgba(227,197,139,.6);
}
.hero-band h1 { font-size: clamp(20px,4vw,30px); font-weight: 900; color: #fff; margin-bottom: 6px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.85); }
.hero-band-meta {
  display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  flex-wrap: wrap;
}
.meta-pill {
  background: rgba(255,255,255,.16); backdrop-filter: blur(6px);
  border: 1px solid rgba(227,197,139,.4); border-radius: 50px;
  padding: 6px 16px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}
.meta-pill i { color: #e3c58b; }

.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center;
}
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--navy); }
[data-theme="dark"] .stat-remain { color: #e6a7c4; }

.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.prog-fill {
  height: 100%; width: 0%;
  background: var(--grad-bar);
  border-radius: 8px; transition: width .4s;
}
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text);
  gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(217,119,6,.3); background: rgba(217,119,6,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(60,20,40,.07);
  transition: box-shadow .3s;
}
.q-header {
  background: var(--grad);
  padding: 4px 18px 4px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 3px solid var(--gold);
}
.q-num {
  background: rgba(255,255,255,.2); border-radius: 8px;
  padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff;
}
.q-text {
  padding: 22px 18px 14px; font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.65; border-bottom: 1px solid var(--bc);
  text-align: left; direction: ltr;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--bc); background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none;
  direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); background: var(--accent-glow);
  transform: translateX(3px);
}
.opt:hover:not(.disabled) .opt-letter {
  background: var(--gold); color: #fff; border-color: var(--gold);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3);
  transition: var(--tr);
}
.opt.correct {
  border-color: var(--success); background: rgba(22,163,74,.08);
}
.opt.correct .opt-letter {
  background: var(--success); color: #fff; border-color: var(--success);
}
.opt.wrong {
  border-color: var(--danger); background: rgba(220,38,38,.07);
}
.opt.wrong .opt-letter {
  background: var(--danger); color: #fff; border-color: var(--danger);
}
.opt.disabled { pointer-events: none; }

.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(22,163,74,.1); color: var(--success); border: 1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background: rgba(220,38,38,.08); color: var(--danger); border: 1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size: 20px; }

.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(var(--accent-rgb),.06);
  border-radius: 10px; border-right: 3px solid var(--gold);
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none;
}

.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next {
  background: var(--grad);
  color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-skip {
  background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px;
}
.btn-skip:hover { border-color: var(--gold); color: var(--warn); }

.result-hero {
  text-align: center; padding: 36px 20px 28px;
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(60,20,40,.07);
  border-top: 4px solid var(--gold);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; border: 5px solid var(--bg2);
  position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
}
.rs { background: var(--bg2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 14px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.report-item .ri-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; margin-top: 5px; color: var(--text2);
}
.ri-badge {
  padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; flex-shrink: 0;
}
.ri-yours { background: rgba(220,38,38,.1); color: var(--danger); }
.ri-right { background: rgba(22,163,74,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: var(--grad); color: #fff; }
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

footer {
  background: var(--bg2); border-top: 3px solid; border-image: var(--grad-bar) 1;
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>
<body>

<div id="prog-bar" style="width:0%"></div>

<nav>
  <a href="https://gaith-team.github.io/exam/" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand">
    <div class="nav-logo-icon">GT</div>
    <span>GHAITH TEAM</span>
  </div>
  <div class="nav-right">
    <button class="theme-btn" id="themeBtn">🌙</button>
  </div>
</nav>

<div class="hero-band">
  <div class="hero-band-icon">⚖️</div>
  <h1>Rights and legal responsibilities</h1>
  <p>Nursing Ethics</p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 35 Min</div>
    <div class="meta-pill"><i class="fa-solid fa-shuffle"></i> Shuffled</div>
  </div>
</div>

<div class="shell">
  <div class="stats-row">
    <div class="stat-box">
      <div class="val stat-correct" id="sCorrect">0</div>
      <div class="lbl">✔ صحيح</div>
    </div>
    <div class="stat-box">
      <div class="val stat-wrong" id="sWrong">0</div>
      <div class="lbl">✖ خطأ</div>
    </div>
    <div class="stat-box">
      <div class="val stat-remain" id="sRemain">--%</div>
      <div class="lbl">⏳ متبقي</div>
    </div>
  </div>

  <div class="prog-strip">
    <div class="prog-label" id="progLabel">سؤال ١</div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">35:00</span></div>
  </div>

  <div id="app"></div>
</div>

<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg">
    <i class="fa-brands fa-telegram"></i> @nursing2bu
  </a>
</footer>

<script>
const QUESTIONS = [
  /* ===== MULTIPLE CHOICE (easy → hard) ===== */
  {t:"The Patient's Bill of Rights was adopted by the U.S. Advisory Commission on Consumer Protection in:", o:["1978","1988","1998","2008"], a:2},
  {t:"Which of the following is a goal of the Patient's Bill of Rights?", o:["To reduce hospital costs","To help patients feel more confident in the health care system","To replace the physician's authority","To limit patients' access to their records"], a:1},
  {t:"Which of the following is NOT part of the information patients are entitled to under the Right to Information?", o:["Diagnosis","Prognosis","Identity of healthcare providers","Personal records of other patients"], a:3},
  {t:"Patients have the right to refuse any treatment, test, or procedure, provided that they:", o:["Are informed of the potential health consequences","Have written permission from the physician","Have approval from a family member","Have paid for the treatment already given"], a:0},
  {t:"The Right to Emergency Services means patients receive screening and stabilizing treatment:", o:["After full payment","Only during daytime hours","Without unreasonable delay","After signing the consent form"], a:2},
  {t:"The Right to Continuity of Care includes:", o:["Free medications","Clear discharge or transfer plans","Choosing the nursing staff","Refusing all tests"], a:1},
  {t:"Which right guarantees care regardless of race, gender, age, religion, national origin, or socio-economic status?", o:["Right to Information","Right to Informed Consent","Right to Continuity of Care","Right to Respectful and Non-Discriminatory Care"], a:3},
  {t:"According to the nursing code of ethics, the legal responsibilities of the professional nurse are toward:", o:["Client, profession, society, and herself","Client, physician, hospital, and government","Client, family, employer, and insurer","Physician, hospital, society, and herself"], a:0},
  {t:"Who is responsible for informing the patient about a medical procedure?", o:["The nurse","The head nurse","The physician","The hospital administrator"], a:2},
  {t:"Frequently, the nurse is asked to:", o:["Explain the risks of surgery in detail","Get the operative permit signed","Choose the type of anesthesia","Prescribe pre-operative medication"], a:1},
  {t:"Medical records can be used as:", o:["A personal diary for the nurse","A billing tool only","A teaching file only","A legal document"], a:3},
  {t:"Nursing notes should be written in:", o:["Ink","Pencil","Any colored marker","Erasable pen"], a:0},
  {t:"When should the nurse write the nursing note?", o:["At the start of the next shift","Once a week","Before going off duty","Only when the physician asks"], a:2},
  {t:"Which of the following is a FACTUAL nursing observation?", o:["Cast too tight","Fingers blue and cold","Fingers uncomfortable","Patient seems unhappy with the cast"], a:1},
  {t:"A colleague forgot to sign her nursing note. What should you do?", o:["Sign it with her name","Sign it with your initials","Write another note under her name","Never sign for another nurse"], a:3},
  {t:"When writing nursing notes, the nurse should avoid:", o:["Abbreviations that are not universally standard","Writing simple and direct notes","Signing with her full name","Factual observations"], a:0},
  {t:"Which of the following is NOT among the things a nurse must recognize while administering medication?", o:["Five rights","Nature of the drug","Cost of the drug to the hospital","Side effects"], a:2},
  {t:"A nurse should never administer narcotics unless they are prescribed by:", o:["The head nurse","A licensed doctor or dentist","A pharmacist","Any member of the health team"], a:1},
  {t:"The nurse should follow:", o:["Verbal orders","Orders from any staff member","Telephone orders at all times","Written orders only"], a:3},
  {t:"Telephone orders should be limited to:", o:["True emergency situations","Night shifts","Orders from residents only","All routine orders"], a:0},
  {t:"A nurse who accepts a telephone order should:", o:["Write it without repeating it","Ask the patient's family to confirm it","Read it back to the physician, who signs it on his next visit","Wait for the head nurse to approve it"], a:2},
  {t:"Negligence is defined as:", o:["Intentional harm to the patient","Failure to perform one's duty in a manner expected by a similar nurse in similar circumstances","A spoken statement that harms a reputation","Refusal to work"], a:1},
  {t:"Gross negligence occurs when the nurse:", o:["Causes the death of a patient","Allows the patient to contribute to his own injury","Fails to document care","Fails to exercise any care to protect the patient"], a:3},
  {t:"Criminal negligence is when negligence:", o:["Results in the death of a patient","Is caused by the patient himself","Is due to failure to chart","Is due to refusing an assignment"], a:0},
  {t:"In contributory negligence, the patient:", o:["Can sue for double damages","Can transfer the blame to the physician","Cannot collect damages in a lawsuit","Is compensated by the hospital"], a:2},
  {t:"Which of the following is NOT an example of negligence?", o:["A hot water bottle burns the patient's feet","Accurately following a written physician's order","Foreign objects left in a patient","Failure to notify the doctor of a sudden change in condition"], a:1},
  {t:"Malpractice is best described as:", o:["A spoken statement that harms someone's reputation","Failure to chart","The patient's own negligence","Professional negligence or unreasonable lack of skill in performing professional duties"], a:3},
  {t:"Defamation is:", o:["A spoken or written statement that tends to expose another person to hazard or an unfavorable opinion in the community","Failure to apply the expected skill and learning","Prescribing medication without authority","A patient's refusal of treatment"], a:0},
  {t:"A nurse fails to notify the doctor of a sudden change in a patient's condition. This is an example of:", o:["Defamation","Contributory negligence","Negligence","Informed consent"], a:2},
  {t:"A patient says he does not understand the procedure but is about to sign the consent form. The nurse should:", o:["Ask him to sign now and explain later","Notify the physician and not allow him to sign until he understands","Cancel the surgery herself","Ask a family member to sign instead"], a:1},
  {t:"A sponge is left inside a patient who survives. Which term best describes this?", o:["Contributory negligence","Defamation","Criminal negligence","Negligence"], a:3},
  {t:"Why must the nurse chart what is done and who is notified when a patient does not understand a procedure?", o:["It is essential documentation of what was done and who was notified","To shift all responsibility to the physician","It is required by the pharmacy only","It is optional"], a:0},
  {t:"Which of the following pairs is CORRECT?", o:["Right to Refuse Treatment – screening without delay","Right to Continuity of Care – inspecting medical records","Right to Review Medical Records – inspect, review, and request copies","Right to Emergency Services – voluntary consent before a procedure"], a:2},
  {t:"Which of the following is a PATIENT'S RESPONSIBILITY (from the poster)?", o:["Right to Leave","Report unexpected health changes","Right to Express Grievances","Right to Self-Determination"], a:1},
  {t:"Malpractice is judged against the degree of skill and learning customarily applied to:", o:["Any hospital in the world","The nurse's own training only","The physician's personal opinion","Similar patients in the same community"], a:3},

  /* ===== TRUE / FALSE ===== */
  {t:"The Patient's Bill of Rights was adopted in 1998.", o:["True","False"], a:0},
  {t:"Patients may refuse treatment even if they are not informed of the potential health consequences.", o:["True","False"], a:1},
  {t:"Informing the patient about a procedure is the physician's responsibility, but the nurse is frequently asked to get the operative permit signed.", o:["True","False"], a:0},
  {t:"Nursing notes should be written in pencil.", o:["True","False"], a:1},
  {t:"Nursing notes should include value judgments and opinions.", o:["True","False"], a:1},
  {t:"Telephone orders should be limited to true emergency situations.", o:["True","False"], a:0},
  {t:"A nurse may prescribe medication to a friend or family member.", o:["True","False"], a:1},
  {t:"In contributory negligence, the patient can collect damages in a lawsuit.", o:["True","False"], a:1},
  {t:"Criminal negligence is when negligence results in the death of a patient.", o:["True","False"], a:0},
  {t:"Malpractice is a professional negligence.", o:["True","False"], a:0},
  {t:"A nurse may sign a nursing note on behalf of a colleague.", o:["True","False"], a:1},
  {t:"Medical records can be used as a legal document.", o:["True","False"], a:0},
  {t:"The Right to Emergency Services means screening and stabilizing treatment without unreasonable delay.", o:["True","False"], a:0},
  {t:"If the patient seems not to understand, the nurse should still let him sign the consent form.", o:["True","False"], a:1},
  {t:"Defamation is a spoken or written statement that tends to expose another person to an unfavorable opinion in the community.", o:["True","False"], a:0}

];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 35*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init(pool) {
  questions = shuffle([...pool]);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

function render() {
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🥳</span> <span> 🎉 ما شاء الله عليك</span>`
    : `<span class="feedback-icon">😔</span> <span>ركز ، نحاول فيها تاني باذن الله</span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--accent)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

init(QUESTIONS);
</script>
</body>
</html>
