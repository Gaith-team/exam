html { scroll-behavior: smooth; }
body {

:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }

[data-theme="dark"] nav { background:rgba(21,14,20,.96); }
.nav-brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:900; color:var(--text); letter-spacing:.3px; }
.nav-logo-icon {

}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {

.tool-btn:hover { border-color:var(--brass); color:var(--accent); }

}

.hero-band-icon {

.hero-band-meta { display:flex; justify-content:center; gap:12px; margin-top:22px; flex-wrap:wrap; }

[data-theme="dark"] .subhead { color:#f0b9d0; }

.pt {

.pt.done { opacity:.5; }

.pt-en {

.pt-n {

.pt-ar {

  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;

.pt-ar .tag, .pt-ex .tag {

.pt-ar .tag { background:rgba(var(--accent-rgb),.12); color:var(--accent); }
.pt-ex {
  padding:12px 16px; font-size:14.5px; line-height:1.95; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(47,72,88,.07); border-right:4px solid var(--slate);
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
.pt-ex .tag { background:rgba(47,72,88,.16); color:var(--slate); }
[data-theme="dark"] .pt-ex { background:rgba(120,170,200,.08); border-right-color:#7aa6c0; }
[data-theme="dark"] .pt-ex .tag { background:rgba(120,170,200,.2); color:#9cc3da; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;

.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  * { transition:none !important; }
}
</style>

 "اللي معندوش فلوس ولا تعليم كان بيشتغل فيها.", 1],
["A desperate occupation.",
 "شغلانة اللي مفيش قدامه حل تاني بيروحلها.",
 "زي واحد بيشتغل أي حاجة عشان ياكل بس.", 1],
["Who are the nurses?",
 "طيب مين كان بيشتغل ممرض/ممرضة في الوقت ده؟",
 "هنشوف مين كانوا الناس دول."],
["Women of lowest social class",
 "ستات من أقل طبقة اجتماعية.",
 "ستات من أفقر الطبقات ومعندهمش خيارات تانية.", 1],
["Naughty women of low status, instead of going to prison, they were asked to serve as nurses.",
 "ستات سمعتهم وحشة ومكانتهم واطية، وبدل ما يتسجنوا اتطلب منهم يشتغلوا ممرضات.",
 "بدل السجن: اشتغلي في رعاية المرضى.", 1],
["Untrained helpers of low repute.",
 "مساعدين غير متدربين وسمعتهم وحشة.",
 "ناس بتساعد من غير أي تدريب ولا دراسة.", 1],
["Poor unmarried woman with no family or no chance of getting married.",
 "ستات فقيرة مش متجوزة، ملهاش عيلة أو مفيش فرصة إنها تتجوز.",
 "ست مالهاش حد يصرف عليها فبتشتغل في أي شغلانة.", 1]
]},

{ id:"nightingale", icon:"🕯️", title:"Florence Nightingale — The Lady with the Lamp", items:[
{h:"Fifteenth to Nineteenth Century (period of Florence Nightingale)"},
["Florence Nightingale was born in 1820 in a wealthy family.",
 "فلورانس نايتنجيل اتولدت سنة 1820 في عيلة غنية.",
 "يعني كانت عايشة مرتاحة ومكنتش محتاجة تشتغل، بس اختارت التمريض."],
["Changed the image of nursing",
 "غيّرت صورة التمريض عند الناس.",
 "التمريض كان شغلانة محتقرة، وبسببها بقى مهنة محترمة."],
["Known as the “Lady with the Lamp”",
 "اتعرفت بلقب «سيدة المصباح» (Lady with the Lamp).",
 "لو الامتحان سأل مين Lady with the Lamp؟ الإجابة: فلورانس نايتنجيل."],
["Her education included the mastery of several ancient and modern language, literature, philosophy, history, science, mathematics, religion, art and music.",
 "تعليمها كان عالي جداً، اتقنت لغات قديمة وحديثة، وأدب وفلسفة وتاريخ وعلوم ورياضيات ودين وفن وموسيقى.",
 "يعني كانت إنسانة مثقفة جداً، ولما واحدة زيها اشتغلت تمريض، الناس بدأت تحترم المهنة."],
["She was determined to become a nurse since she believed she was “called by God to help others and to improve the well-being of people”.",
 "كانت مصممة تبقى ممرضة لأنها كانت مؤمنة إن ربنا بيدعوها تساعد الناس وتحسّن صحتهم ورفاهيتهم.",
 "زي حد حاسس إن ده رسالته في الدنيا، فبيكمل فيها حتى لو الناس رافضة."],
["She visited Kaisers Werth and received nurse’s training at 1850 for three months.",
 "زارت كايزرسفيرث (Kaisers Werth) واتدربت تمريض سنة 1850 لمدة 3 شهور.",
 "يعني أخدت كورس تدريبي قصير 3 شهور، ومن هنا بدأت."],
["The occurrence of the Crimean War gave Nightingale an opportunity for achievement.",
 "حرب القرم (Crimean War) إدّت نايتنجيل فرصة تحقق فيها إنجاز.",
 "زي واحد معاه مهارة ولقى أزمة كبيرة يطبقها فيها."],
["Nightingale and her nurses transformed the military hospitals by setting up diet kitchens, a laundry, recreation centers, and reading rooms",
 "هي وممرضاتها غيّروا المستشفيات العسكرية، وعملوا مطابخ للأكل الصحي، ومغسلة، ومراكز ترفيه، وأوض قراءة.",
 "زي مكان مهمل بقى نضيف: فيه أكل مناسب وغسيل وحاجة تسلّي المريض."],

{h:"School of Nursing"},
["In 1860, Nightingale laid the foundation of professional nursing when the first school of nursing was established.",
 "سنة 1860 نايتنجيل حطت أساس التمريض كمهنة لما أول مدرسة تمريض اتأسست.",
 "السنة دي زي «شهادة ميلاد» التمريض المهني."],

{h:"Nightingale Training School at St. Thomas’ Hospital"},
["After the war, Nightingale established the Nightingale Training School for Nurses at St. Thomas’ hospital in London; the school served as a model for other training school.",
 "بعد الحرب، نايتنجيل أسست مدرسة نايتنجيل لتدريب الممرضات في مستشفى سانت توماس في لندن، والمدرسة دي بقت نموذج للمدارس التانية.",
 "زي أول كلية ناجحة والكليات التانية بتقلدها."],
["As the founder of modern nursing, Florence Nightingale established the first nursing philosophy based on health maintenance and restoration.",
 "بصفتها مؤسسة التمريض الحديث، فلورانس نايتنجيل حطت أول فلسفة للتمريض، وكانت قايمة على الحفاظ على الصحة واستعادتها.",
 "يعني الفلسفة: حافظ على صحة الناس، ولو تعبوا ساعدهم يرجعوا لصحتهم."]
]},

{ id:"eminent", icon:"👩‍⚕️", title:"Eminent Personalities in the History of Nursing", items:[
{h:"Florence Nightingale (1820 – 1910)"},
["Born on May 12 – called to fulfill the “mission of mercy”",
 "اتولدت يوم 12 مايو، وكانت شايفة إنها مدعوة تحقق «رسالة الرحمة».",
 "زي حد بيعتبر شغله رسالة مش مجرد وظيفة."],
["“Lady with the lamp”",
 "لقبها «سيدة المصباح».",
 "اللقب المشهور اللي بيتقال عليها."],
["Established hospitals",
 "أسست مستشفيات.",
 "من إنجازاتها إنها ساهمت في إنشاء مستشفيات."],
["Produced and implemented public health policies",
 "عملت ونفذت سياسات للصحة العامة.",
 "زي القرارات اللي بتحمي صحة الناس كلها مش مريض واحد."],
["Established training school for nurses in 1860",
 "أسست مدرسة لتدريب الممرضات سنة 1860.",
 "من هنا بدأت الدراسة المنظمة للتمريض."],

{h:"Clara Barton (1812 – 1912)"},
["School teacher, volunteered as a nurse during the American civil war",
 "كانت مدرّسة، وتطوعت كممرضة في الحرب الأهلية الأمريكية.",
 "مدرّسة سابت الفصل وراحت تساعد الجرحى بدافع إنساني."],
["Organized the nursing services",
 "نظّمت خدمات التمريض.",
 "زي مدير بينظم الشغل والورديات عشان كله يمشي صح."],
["Established the American Red cross",
 "أسست الصليب الأحمر الأمريكي.",
 "لو اتسألت مين أسست الصليب الأحمر الأمريكي؟ الإجابة: كلارا بارتون."],

{h:"Linda Richards (1841 – 1930)"},
["First American trained nurse",
 "أول ممرضة أمريكية متدربة.",
 "لو اتسألت مين أول ممرضة أمريكية متدربة؟ الإجابة: ليندا ريتشاردز."],
["Introduced nurses notes and doctors’ orders",
 "دخلت ملاحظات التمريض وأوامر الأطباء.",
 "زي ملف المريض: الممرضة بتكتب ملاحظاتها، والدكتور بيكتب أوامره."],
["Initiated for wearing uniforms for nurses",
 "بدأت فكرة إن الممرضات يلبسوا يونيفورم.",
 "الزي الموحد اللي بتلبسه الممرضة دلوقتي."],
["Pioneer in psychiatric and industrial nursing",
 "رائدة في التمريض النفسي والتمريض الصناعي.",
 "زي ممرضة بتشتغل في مستشفى نفسي، وممرضة بتشتغل في مصنع."],

{h:"Mary Mahoney (1845 – 1926)"},
["First African-American professional nurse",
 "أول ممرضة محترفة أمريكية من أصل أفريقي.",
 "لو اتسألت مين أول ممرضة محترفة أفريقية أمريكية؟ الإجابة: ماري ماهوني."],
["Worked for the acceptance of African-Americans in nursing and for the equal opportunities",
 "اشتغلت عشان الأمريكان الأفارقة يتقبلوا في التمريض وعشان تبقى الفرص متساوية.",
 "يعني مفيش حد يتحرم من المهنة بسبب لونه."],

{h:"Lillian Wald (1867 – 1940)"},
["Founder of public health nursing",
 "مؤسسة تمريض الصحة العامة.",
 "ممرضة بتشتغل مع الناس في الحي، مش جوه المستشفى بس."],
["Services to poor in slums",
 "قدمت خدمات للفقراء في العشوائيات.",
 "زي ممرضة بتنزل المناطق الفقيرة وتكشف على الناس."],
["Visiting nursing services",
 "خدمات التمريض بالزيارات.",
 "الممرضة بتروح تزور المريض في بيته."],

{h:"Margaret H Sanger (1879 – 1966)"},
["Founder of planned parenthood",
 "مؤسسة جمعية تنظيم الأسرة (Planned Parenthood).",
 "زي عيادات تنظيم الأسرة اللي بتوعّي الناس."],
["Opening the first birth control information clinic",
 "فتحت أول عيادة بتدي معلومات عن تنظيم الحمل (birth control).",
 "مكان الناس تروحه تسأل عن وسائل تنظيم الأسرة."],

{h:"Mary Breckinridge (1881 – 1965)"},
["Established the Frontier nursing services",
 "أسست خدمات التمريض الحدودية (Frontier Nursing Service).",
 "زي ممرضات بيوصلوا للأماكن البعيدة والنائية."]
]},

{ id:"definitions", icon:"📚", title:"Contemporary Nursing — Definitions", items:[
["There are many definitions of nursing.",
 "فيه تعريفات كتيرة للتمريض.",
 "زي أي مهنة، كل واحد بيعرفها من زاوية مختلفة."],
["Florence Nightingale defined nursing as: the act of utilizing the environment of the patient to assist him in his recovery.",
 "فلورانس نايتنجيل عرّفت التمريض إنه استخدام بيئة المريض عشان نساعده يتعافى.",
 "زي تهوية الأوضة ونضافتها وهدوئها، كل ده بيساعد المريض يتحسن."],
["ANA definition: nursing is the diagnosis and treatment of human response to actual and potential health problems.",
 "تعريف ANA (الجمعية الأمريكية للتمريض): التمريض هو تشخيص وعلاج استجابة الإنسان للمشاكل الصحية الحالية والمحتملة.",
 "مريض جاي وعنده ألم بعد عملية: الألم ده استجابة، والممرضة تشخّصها وتتصرف. وكمان بتتوقع مشكلة ممكن تحصل لو سيبنا الحالة."],

{h:"Other definitions of Nursing"},
["Nursing is caring.",
 "التمريض هو رعاية واهتمام.",
 "الممرضة اللي بتسأل المريض عن حاله وبتهتم بيه بجد."],
["Nursing is science and art.",
 "التمريض علم وفن. علم لأنه مبني على معلومات، وفن لأنه تعامل ومهارة مع الناس.",
 "الممرضة بتعرف تدي الحقنة صح (علم) وبتطمّن المريض بكلمتين حلوين (فن)."],
["Nursing is holistic.",
 "التمريض شامل (holistic): بيشوف المريض كله، جسم ونفسية وظروفه، مش المرض بس.",
 "مريض عنده ألم وخايف على شغله، الممرضة بتراعي الاتنين."],
["Nursing is adaptive.",
 "التمريض بيتكيف (adaptive) مع حالة كل مريض وظروفه.",
 "بتتعامل مع طفل بشكل غير اللي بتتعامل بيه مع كبير سن."],
["Nursing is client centered",
 "التمريض محوره المريض (client centered).",
 "خطة الرعاية بتتعمل على حسب حالة المريض واحتياجاته هو."]
]},

{ id:"profession", icon:"🎓", title:"Professionalization", items:[
["Profession: Profession is a specialized occupation or career that requires advanced knowledge, formal academic training, and specific technical skills to provide structured services to others.",
 "المهنة (Profession) هي شغلانة متخصصة محتاجة معرفة متقدمة وتعليم أكاديمي رسمي ومهارات فنية معينة عشان تقدم خدمات منظمة للناس.",
 "زي الدكتور والمهندس: مينفعش يشتغلوا من غير دراسة وشهادة."],
["Professionalization: is the social process by which an trade, occupation, or vocation transforms itself into a true profession with high status, specialized standards, and formal recognition.",
 "الـ Professionalization هي العملية الاجتماعية اللي بيها حرفة أو وظيفة بتتحول لمهنة حقيقية ليها مكانة عالية ومعايير متخصصة واعتراف رسمي.",
 "التمريض كان شغلانة، وبعدين بقى مهنة ليها كليات وترخيص ونقابة."],

{h:"Criteria of a profession"},
["A profession must meet several key criteria to be recognized as a formal profession:",
 "عشان المهنة تتعتبر مهنة رسمية، لازم تحقق شروط أساسية، وهنمشي عليهم.",
 "زي شروط القبول في الكلية: لازم تستوفيها كلها."],
["Specialized Body of Knowledge: Grounded in well-developed theoretical frameworks, scientific research, and advanced intellectual training rather than simple manual skill.",
 "مجموعة معرفة متخصصة: المهنة قايمة على نظريات متطورة وأبحاث علمية وتدريب فكري متقدم، مش مجرد مهارة يدوية بسيطة.",
 "التمريض ليه نظريات وأبحاث، مش بس إنك تعرف تدي حقنة.", 1],
["Prolonged Higher Education: Requires formal academic degrees from accredited universities or specialized institutions prior to practice.",
 "تعليم عالي طويل: لازم تاخد درجة أكاديمية رسمية من جامعة معتمدة أو معهد متخصص قبل ما تشتغل.",
 "مينفعش تشتغل ممرض من غير ما تتخرج الأول.", 1],
["Autonomy and Self-Regulation: Practitioners exercise independent judgment in their daily work and the professional group sets its own standards of practice.",
 "الاستقلالية والتنظيم الذاتي: الممارسين بيستخدموا حكمهم المستقل في شغلهم اليومي، والمهنيين نفسهم هم اللي بيحطوا معايير الممارسة.",
 "التمريض هو اللي بيحدد معايير شغله بنفسه، مش حد من برا المهنة.", 1],
["Code of Ethics: Governed by an explicit, enforced code of moral and professional conduct to protect the public and ensure accountability.",
 "ميثاق أخلاقيات المهنة (Code of Ethics): المهنة محكومة بقواعد أخلاقية ومهنية صريحة ومتطبقة فعلاً، عشان تحمي الناس وتضمن المساءلة.",
 "زي ما الممرضة ملتزمة بسرية بيانات المريض وبتتحاسب لو خالفت.", 1],
["Service Orientation (Altruism): Primary motivation centers on providing an essential social service and advancing public welfare over pure financial gain.",
 "التوجه للخدمة (الإيثار Altruism): الدافع الأساسي هو تقديم خدمة اجتماعية مهمة وخدمة رفاهية الناس قبل الربح المادي.",
 "الممرضة اللي بتفضل جنب المريض لأنها عايزة تساعده، مش بس عشان المرتب.", 1],
["Licensure and Credentialing: Requires official state board certification, passing national examinations, or holding a legal license to practice.",
 "الترخيص والاعتماد: لازم شهادة رسمية من مجلس الدولة، أو اجتياز امتحانات قومية، أو الحصول على ترخيص قانوني لمزاولة المهنة.",
 "زي ترخيص مزاولة المهنة اللي من غيره مينفعش تشتغل.", 1],
["Professional Associations: Supported by active national or international organizations that represent members, guide policy, and drive continuing research",
 "الجمعيات المهنية: المهنة ليها منظمات وطنية أو دولية نشطة بتمثل الأعضاء وبتوجّه السياسات وبتدفع الأبحاث المستمرة.",
 "زي النقابة اللي بتدافع عن حقوق الممرضين وبتطوّر المهنة.", 1],

{h:"Nursing Organizations"},
["American Nurses Association (ANA)",
 "الجمعية الأمريكية للتمريض.",
 "ANA هي النقابة المهنية للتمريض في أمريكا.", 1],
["Canadian Nurses Association (CAN)",
 "الجمعية الكندية للتمريض.",
 "نفس الفكرة، بس في كندا.", 1],
["National league for Nursing (NLN)",
 "الرابطة الوطنية للتمريض.",
 "منظمة وطنية مهتمة بالتمريض.", 1],
["International Council of Nursing (ICN)",
 "المجلس الدولي للتمريض.",
 "ده على مستوى العالم كله مش دولة واحدة.", 1]
]},

{ id:"hospitals", icon:"🏥", title:"Factors Affecting the Development of Hospitals", items:[
["Advancements in Medical Science & Technology: The discovery of germ theory, introduction of antiseptics and anesthesia, and breakthroughs in diagnostic technology (such as X-rays and MRI scans) shifted hospitals from basic care facilities to specialized centers for complex medical treatments.",
 "التقدم في العلوم الطبية والتكنولوجيا: اكتشاف نظرية الجراثيم والمطهرات والتخدير، وتطور التشخيص (زي الأشعة السينية والرنين المغناطيسي) حوّل المستشفيات من أماكن رعاية بسيطة لمراكز متخصصة للعلاج المعقد.",
 "زي ما المستشفى اتحولت من مكان بيرتاح فيه المريض بس لمكان فيه أشعة وعمليات وتخدير.", 0],
["Nursing & Health Professions Education: The rise of formal, university-level professional training—pioneered by figures like Florence Nightingale—transformed clinical environments, establishing strict hygiene standards, organized care delivery, and professional hospital management.",
 "تعليم التمريض والمهن الصحية: ظهور التدريب الجامعي الرسمي (اللي بدأته شخصيات زي فلورانس نايتنجيل) غيّر بيئة المستشفيات، وعمل معايير نضافة صارمة ورعاية منظمة وإدارة مهنية للمستشفى.",
 "لما الممرضين بقوا متعلمين ومتدربين، المستشفى بقت أنضف وأنظم.", 0],
["Socioeconomic & Public Health Policies: Shifts in government health legislation, public health mandates, social insurance, and national healthcare systems expanded healthcare access, driving the growth and modernization of hospital infrastructures.",
 "السياسات الاجتماعية والاقتصادية وسياسات الصحة العامة: تغيّر قوانين الصحة الحكومية وقرارات الصحة العامة والتأمين الاجتماعي ونظم الرعاية الصحية القومية وسّع الوصول للرعاية، وده زاد نمو وتحديث المستشفيات.",
 "لما الدولة تعمل تأمين صحي للناس، عدد اللي بيروحوا المستشفيات بيزيد فالمستشفيات بتكبر وتتطور.", 0],
["Economic Models & Health Insurance: The expansion of public and private health insurance programs, combined with evolving hospital funding mechanisms, directly impacts hospital expansion, resource allocation, and bed capacity.",
 "النماذج الاقتصادية والتأمين الصحي: التوسع في برامج التأمين الصحي الحكومي والخاص، مع تطور طرق تمويل المستشفيات، بيأثر مباشرة على توسع المستشفى وتوزيع الموارد وعدد الأسرّة.",
 "كل ما التمويل والتأمين يزيدوا، المستشفى بتقدر تزود الأسرّة والإمكانيات.", 0],
["Demographic & Epidemiological Shifts: Population growth, urbanization, aging demographics, and changes in disease patterns (such as shifting focus toward chronic diseases and global pandemic response) continually drive structural and operational updates in modern hospitals.",
 "التغيرات السكانية والوبائية: زيادة السكان والتحضر وكبر سن السكان وتغير أنماط الأمراض (زي التركيز على الأمراض المزمنة والتعامل مع الأوبئة العالمية) بيدفعوا باستمرار لتحديث المستشفيات في الشكل والتشغيل.",
 "لما كبار السن يزيدوا والأمراض المزمنة تكتر، المستشفيات بتجهز نفسها بأقسام ورعاية أنسب لده.", 0],
["Quality Assurance & Accreditation Standards: Rigorous international and national healthcare quality guidelines, institutional accreditation frameworks, and patient safety protocols mandate continuous facility upgrades, technological adoption, and standardized clinical practices.",
 "ضمان الجودة ومعايير الاعتماد: إرشادات جودة الرعاية الصحية الدولية والوطنية الصارمة وأطر اعتماد المؤسسات وبروتوكولات سلامة المريض بتفرض تحديث المنشأة باستمرار واستخدام التكنولوجيا وتوحيد الممارسات الإكلينيكية.",
 "زي اعتماد الجودة اللي المستشفى لازم تحققه عشان تفضل شغالة وتحافظ على سلامة المرضى.", 0]
]},

{ id:"factors-practice", icon:"🧭", title:"Factors Influenced Nursing Practice", items:[
["Religion",
 "الدين.",
 "زي لما الرهبان والراهبات كانوا هم اللي بيرعوا المرضى."],
["War",
 "الحرب.",
 "زي حرب القرم اللي إدّت نايتنجيل فرصة تغيّر المستشفيات."],

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');
let totalPts = 0;

SECTIONS.forEach((s, si) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    n++; totalPts++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      <div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});
document.getElementById('totalBadge').textContent = totalPts + ' points';
document.getElementById('secBadge').textContent = SECTIONS.length + ' sections';

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
