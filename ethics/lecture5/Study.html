<head>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --wine:#5b1a35; --plum:#3d2557; --slate:#2f4858; --brass:#b8893b; --brass-lt:#e3c58b;
  --accent:#7a2547; --accent-glow:rgba(122,37,71,0.16); --accent-rgb:122,37,71;
  --grad:linear-gradient(135deg,#5b1a35 0%,#4a2048 55%,#3d2557 100%);
  --grad-bar:linear-gradient(90deg,#5b1a35,#3d2557,#2f4858,#b8893b);
  --bg:#faf7f8; --bg2:#f1eaee; --card:#ffffff;
  --text:#241a20; --text2:#54464e; --text3:#84747c;
  --bc:rgba(60,20,40,0.12);
  --r:8px; --tr:all .25s ease;
}
[data-theme="dark"] {
  --accent:#d98aae; --accent-glow:rgba(217,138,174,0.16); --accent-rgb:217,138,174;
  --bg:#150e14; --bg2:#1e141c; --card:#261a24;
  --text:#f0e6ec; --text2:#c9b8c2; --text3:#8f7b87;
  --bc:rgba(255,235,245,0.11);
}

html { scroll-behavior: smooth; }
body {
  font-family:'Source Serif 4','Tajawal',Georgia,serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden; transition:background .4s,color .4s;
}
:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }

#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:var(--grad-bar); width:0%; transition:width .15s; }

nav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; height:64px;
  background:rgba(250,247,248,.95); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--bc);
}
[data-theme="dark"] nav { background:rgba(21,14,20,.96); }
.nav-brand { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:900; color:var(--text); letter-spacing:.3px; }
.nav-logo-icon {
  width:34px; height:34px; border-radius:6px; background:var(--grad);
  display:flex; align-items:center; justify-content:center;
  color:var(--brass-lt); font-size:12px; font-weight:900; box-shadow:0 0 0 2px var(--brass);
}
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn, .tool-btn {
  height:38px; min-width:38px; border-radius:8px; border:1px solid var(--bc);
  background:var(--card); cursor:pointer; font-size:14px; color:var(--text);
  display:flex; align-items:center; justify-content:center; gap:6px; padding:0 12px;
  font-family:'Tajawal','Source Serif 4',sans-serif; font-weight:700; transition:var(--tr);
}
.theme-btn { width:38px; padding:0; font-size:15px; }
.theme-btn:hover { border-color:var(--brass); }
.tool-btn:hover { border-color:var(--brass); color:var(--accent); }
.tool-btn.off { opacity:.5; }

/* HERO */
.hero-band {
  margin-top:64px; background:var(--grad); padding:44px 24px 40px; text-align:center;
  position:relative; overflow:hidden; border-bottom:4px solid var(--brass);
}
.hero-band::before {
  content:''; position:absolute; inset:10px; pointer-events:none;
  border:1px solid rgba(227,197,139,.4); border-radius:4px;
}
.hero-band > * { position:relative; }
.hero-band-icon {
  width:70px; height:70px; border-radius:8px; background:rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:center;
  font-size:30px; color:var(--brass-lt); margin:0 auto 16px; border:1.5px solid var(--brass);
}
.hero-band h1 { font-size:clamp(24px,4.6vw,36px); font-weight:900; color:#fff; margin-bottom:8px; letter-spacing:.2px; }
.hero-band p { font-size:14px; color:rgba(255,255,255,.82); font-style:italic; }
.hero-band-meta { display:flex; justify-content:center; gap:12px; margin-top:22px; flex-wrap:wrap; }
.meta-pill {
  background:rgba(255,255,255,.08);
  border:1px solid rgba(227,197,139,.45); border-radius:6px; padding:6px 16px;
  font-size:13px; font-weight:700; color:#fff; display:flex; align-items:center; gap:8px;
  font-family:'Tajawal','Source Serif 4',sans-serif;
}
.meta-pill i { color:var(--brass-lt); }

/* CHIPS */
.chips-wrap {
  position:sticky; top:64px; z-index:90; background:var(--bg);
  border-bottom:1px solid var(--bc); padding:10px 0;
}
.chips { display:flex; gap:8px; overflow-x:auto; padding:0 20px; max-width:860px; margin:0 auto; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip {
  flex-shrink:0; padding:7px 14px; border-radius:6px; font-size:13px; font-weight:600;
  background:var(--card); border:1px solid var(--bc); color:var(--text2);
  text-decoration:none; transition:var(--tr); white-space:nowrap;
}
.chip:hover, .chip.active { background:var(--wine); color:#fff; border-color:var(--brass); }

.shell { max-width:860px; margin:0 auto; padding:26px 20px 80px; }

/* SECTION */
.sec { margin-bottom:36px; scroll-margin-top:130px; }
.sec-head {
  display:flex; align-items:center; gap:12px; background:var(--grad); color:#fff;
  padding:14px 18px; border-radius:8px 8px 0 0; border-bottom:3px solid var(--brass);
}
.sec-icon {
  width:38px; height:38px; border-radius:6px; background:rgba(255,255,255,.1); border:1px solid rgba(227,197,139,.45);
  display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;
}
.sec-title { font-size:18px; font-weight:700; line-height:1.3; }
.sec-count { margin-left:auto; font-size:12px; font-weight:600; background:rgba(255,255,255,.12); padding:3px 10px; border-radius:6px; white-space:nowrap; }
.sec-body {
  background:var(--card); border:1px solid var(--bc); border-top:none;
  border-radius:0 0 8px 8px; padding:14px; display:flex; flex-direction:column; gap:12px;
}

.subhead {
  font-size:14px; font-weight:700; color:var(--wine); padding:8px 12px;
  background:rgba(var(--accent-rgb),.08); border-left:4px solid var(--brass);
  border-radius:4px; direction:ltr; text-align:left; margin-top:6px;
}
[data-theme="dark"] .subhead { color:#f0b9d0; }

/* POINT */
.pt {
  border:1px solid var(--bc); border-left:4px solid var(--brass); border-radius:8px; overflow:hidden; background:var(--bg);
  transition:var(--tr);
}
.pt:hover { border-color:rgba(var(--accent-rgb),.45); border-left-color:var(--brass); box-shadow:0 3px 12px var(--accent-glow); }
.pt.sub { margin-left:22px; border-left-color:var(--slate); }
.pt.done { opacity:.5; }

.pt-en {
  display:flex; gap:12px; align-items:flex-start; padding:14px 14px;
  font-size:16px; font-weight:600; line-height:1.6; direction:ltr; text-align:left;
  background:var(--card); cursor:pointer;
}
.pt-n {
  min-width:28px; height:28px; border-radius:6px; background:transparent; color:var(--accent);
  border:1.5px solid var(--brass);
  font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;
}
.pt-ar {
  padding:12px 16px; font-size:15px; line-height:1.95; color:var(--text);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
.pt-ar .tag, .pt-ex .tag {
  display:inline-block; font-size:12px; font-weight:800; padding:2px 9px; border-radius:4px; margin-left:8px; vertical-align:middle;
}
.pt-ar .tag { background:rgba(var(--accent-rgb),.12); color:var(--accent); }
.pt-ex {
  padding:12px 16px; font-size:14.5px; line-height:1.95; color:var(--text2);
  direction:rtl; text-align:right; border-top:1px dashed var(--bc);
  background:rgba(47,72,88,.07); border-right:4px solid var(--slate);
  font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
.pt-ex .tag { background:rgba(47,72,88,.16); color:var(--slate); }
[data-theme="dark"] .pt-ex { background:rgba(120,170,200,.08); border-right-color:#7aa6c0; }
[data-theme="dark"] .pt-ex .tag { background:rgba(120,170,200,.2); color:#9cc3da; }
body.hide-ex .pt-ex { display:none; }
body.hide-ar .pt-ar { display:none; }

footer {
  background:var(--bg2); border-top:3px solid; border-image:var(--grad-bar) 1;
  padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.footer-brand { font-size:14px; font-weight:700; }
.footer-brand span { color:var(--accent); }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#229ED9; font-size:12px; font-weight:600; }

@media (max-width:560px) {
  nav { padding:0 12px; }
  .nav-brand span { display:none; }
  .shell { padding:16px 12px 60px; }
  .pt.sub { margin-left:12px; }
  .tool-btn span { display:none; }
  .sec-count { display:none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  * { transition:none !important; }
}
</style>
</head>

/* ===== RENDER ===== */
const app = document.getElementById('app');
const chips = document.getElementById('chips');

SECTIONS.forEach((s) => {
  let n = 0;
  let body = '';
  s.items.forEach(it => {
    if (it.h) { body += `<div class="subhead">${it.h}</div>`; return; }
    n++;
    const sub = it[3] ? ' sub' : '';
    body += `<div class="pt${sub}">
      <div class="pt-en" onclick="this.parentElement.classList.toggle('done')"><div class="pt-n">${n}</div><div>${it[0]}</div></div>
      <div class="pt-ar"><span class="tag">شرح</span>${it[1]}</div>
      <div class="pt-ex"><span class="tag">عشان تفهمها</span>${it[2]}</div>
    </div>`;
  });
  app.insertAdjacentHTML('beforeend', `
    <section class="sec" id="${s.id}">
      <div class="sec-head">
        <div class="sec-icon">${s.icon}</div>
        <div class="sec-title">${s.title}</div>
        <div class="sec-count">${n} points</div>
      </div>
      <div class="sec-body">${body}</div>
    </section>`);
  chips.insertAdjacentHTML('beforeend', `<a class="chip" href="#${s.id}" data-id="${s.id}">${s.icon} ${s.title.split('—')[0].split('&')[0].trim()}</a>`);
});

/* progress bar + active chip */
const secEls = [...document.querySelectorAll('.sec')];
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  document.getElementById('prog-bar').style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + '%';
  let cur = secEls[0].id;
  secEls.forEach(el => { if (el.getBoundingClientRect().top < 160) cur = el.id; });
  document.querySelectorAll('.chip').forEach(c => {
    const on = c.dataset.id === cur;
    c.classList.toggle('active', on);
    if (on) { const p = c.parentElement; p.scrollTo({ left: c.offsetLeft - 40, behavior: 'smooth' }); }
  });
}, { passive: true });

/* toggles */
function toggler(btnId, cls) {
  const b = document.getElementById(btnId);
  b.addEventListener('click', () => { document.body.classList.toggle(cls); b.classList.toggle('off'); });
}
toggler('btnAr', 'hide-ar');
toggler('btnEx', 'hide-ex');

/* theme */
const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch (e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch (e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
</script>
