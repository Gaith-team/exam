<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#db2777;--teal-d:#be185d;--blue:#eef2f7;--bd:#e3d3dc;--ok:#16a34a;--no:#dc2626;--rev:#6366f1;--txt:#1a2332;--grad:linear-gradient(135deg,#be185d,#db2777,#ec4899)}
body{font-family:'Outfit',Arial,sans-serif;background:#f8fafc;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#be185d;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#1a2332}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#db2777;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#d97706}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#eef2f7}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #1a2332;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#4a5568;background:#eef2f7;border-top:1px solid #e3d3dc;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/obstetric/index.html">← رجوع</a>تمريض النساء والتوليد عملي<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">50:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [

{t:"The most common position in vertex presentation (about 60%) is:", o:["ROA","ROP","LOP","LOA"], a:3},
{t:"The J-shaped episiotomy:", o:["Starts at the anus and goes anteriorly","Is a straight incision exactly in the midline","Begins at the center of the fourchette, goes posteriorly ~1.5 cm, then down and outward to avoid the anal sphincter","Is performed only after the placenta is delivered"], a:2},
{t:"Quickening (maternal perception of fetal movement) usually occurs at what time in a primipara?", o:["12–14 weeks","16–18 weeks","18–20 weeks","22–24 weeks"], a:2},
{t:"The minimum normal hemoglobin value in the second trimester of pregnancy is:", o:["10.5 g/dL","9 g/dL","11 g/dL","12 g/dL"], a:0},
{t:"Absence of one umbilical artery (a single umbilical artery) can be associated with:", o:["Cleft palate","Spina bifida","Renal agenesis","Down syndrome"], a:2},
{t:"Mendelson's syndrome, which IV fluids and limiting solids help prevent, is:", o:["Supine hypotension","Uterine inversion","Pulmonary aspiration of vomitus during general anesthesia","Retained placenta"], a:2},
{t:"Leaking amniotic fluid tested with litmus paper turns the paper:", o:["Red","Yellow","Colorless","Blue"], a:3},
{t:"On the partogram, the action line is drawn:", o:["4 hours to the right of the alert line and parallel to it","4 hours to the left of the alert line","At 10 cm dilatation","Starting from 0 cm dilatation"], a:0},
{t:"The modified Ritgen maneuver is performed by applying:", o:["Traction on the fetal shoulder","Traction on the cord","Pressure on the uterine fundus","Pressure on the fetal chin through the perineum with backward pressure on the occiput"], a:3},
{t:"For a HIGH-RISK pregnancy, antenatal visits between 28 and 36 weeks should be:", o:["Monthly","Every 2 weeks","Hospitalization","Every week"], a:3},
{t:"On the partogram, the alert line is drawn starting from a cervical dilatation of:", o:["4 cm","6 cm","8 cm","10 cm"], a:0},
{t:"A term infant is a live infant born between:", o:["28 and 32 weeks","34 and 36 weeks","38 and 42 weeks","After 42 weeks"], a:2},
{t:"In the Schultze mechanism the placenta separates:", o:["From margin to center","From center to margin","Only from the fundus","Only after one hour"], a:1},
{t:"At 24 weeks of gestation the fundus normally reaches the level of the:", o:["Symphysis pubis","Umbilicus","Xiphoid process","Costal margin"], a:1},
{t:"During the mechanism of labor, internal rotation of the fetal head is a rotation of:", o:["1/8 circle","1/4 circle","1/2 circle","3/4 circle"], a:0},
{t:"Urinary protein excretion in pregnancy is considered abnormal when it exceeds:", o:["100 mg/24 hours","200 mg/24 hours","300 mg/24 hours","1 g/24 hours"], a:2},
{t:"Ergometrine (methergine) should NOT be given to a woman with:", o:["Primigravida status","Anemia","Pre-eclampsia","Prolonged labor"], a:2},
{t:"The normal duration of the second stage in multiparas is:", o:["15–60 minutes","1–2 hours","3–4 hours","6–8 hours"], a:0},
{t:"The normal fetal heart rate range is:", o:["80–100 b/m","100–120 b/m","120–160 b/m","160–200 b/m"], a:2},
{t:"The Apgar score is assessed at:", o:["5 and 10 minutes","10 and 20 minutes","1 hour only","1 minute and 5 minutes"], a:3},
{t:"Duncan's mechanism of placental separation is characterized by:", o:["Separation from center to margin (80%)","Separation from margin to center, sideways delivery (20%), and risk of a missed lobe","Delivery like an inverted umbrella","Fewer complications than Schultze"], a:1},
{t:"The fourth stage of labor (stage of recovery) refers to:", o:["The first 2–4 hours after complete expulsion of the placenta","The first 24 hours after delivery","The first week postpartum","The whole puerperium (6 weeks)"], a:0},
{t:"Viability of the fetus (ability to live outside the uterus with aid) is usually reached at:", o:["20 weeks","24 weeks","28 weeks","37 weeks"], a:2},
{t:"During the second stage of labor, the fetal heart should be listened to:", o:["Every 30 minutes","Every hour","Only once at the start","Every 5 minutes between contractions"], a:3},
{t:"During Pawlik's grip, if ballottement of the head is felt, this means that the presenting part:", o:["Is engaged","Is not yet engaged","Is a face presentation","Is a breech"], a:1},
{t:"The relation between the longitudinal axis of the fetus and the longitudinal axis of the mother is called:", o:["Presentation","Position","Lie","Attitude"], a:2},
{t:"In the fourth stage, if the woman is stable, her vital signs are checked in the second hour every:", o:["30 minutes","15 minutes","1 hour","4 hours"], a:0},
{t:"The normal head circumference of a full-term newborn is:", o:["28–30 cm","38–42 cm","32–37 cm","45–50 cm"], a:2},
{t:"The vaginal discharge of days 1–3 postpartum that consists almost entirely of blood is:", o:["Lochia rubra","Lochia serosa","Lochia alba","Colostrum"], a:0},
{t:"On the partogram, cervical dilatation is plotted using the symbol:", o:["O","X","M","+"], a:1},
{t:"Lochia serosa is the red discharge that occurs on days 1–3 postpartum.", o:["True","False"], a:1},
{t:"Ergometrine can be given safely to women with pre-eclampsia during the third stage.", o:["True","False"], a:1},
{t:"A full bladder after delivery can prevent the uterus from contracting properly and cause atony.", o:["True","False"], a:0},
{t:"The lithotomy position is the position most often used for routine per-vaginal examination during the first stage.", o:["True","False"], a:1},
{t:"Moulding +++ (severely overlapping, irreducible bones) is the normal degree of moulding.", o:["True","False"], a:1},
{t:"Leopold's maneuvers are performed after the uterus becomes large enough (about 24 weeks) to allow differentiation of fetal parts.", o:["True","False"], a:0},
{t:"Increasing moulding with the head high in the pelvis is a sign of cephalopelvic disproportion.", o:["True","False"], a:0},
{t:"The Schultze mechanism of placental separation occurs in about 20% of deliveries.", o:["True","False"], a:1},
{t:"The newborn's temperature is measured rectally to help exclude an imperforate anus.", o:["True","False"], a:0},
{t:"After spraying the cord stump with 70% alcohol, the cord should be covered with sterile gauze.", o:["True","False"], a:1},
{t:"A woman with pre-eclampsia is to have active management of the third stage. Which statement is correct?", o:["Avoid ergometrine because of the risk of convulsions and cerebrovascular accidents; use syntocinon (oxytocin) instead","Give ergometrine as it is the only option","Avoid every uterotonic drug","No drug restriction exists"], a:0},
{t:" A woman's membranes rupture and the nurse records the letter 'M' on the partogram. What is the correct action?", o:["No action is needed","Stop monitoring the fetal heart","Listen to the fetal heart more frequently, as meconium-stained liquor may indicate fetal distress","Give vitamin K to the mother"], a:2},
{t:"A newborn is delivered with abundant lanugo hair covering the body. What does this suggest?", o:["Post-term baby","Prematurity","Normal baby at 40 weeks","Congenital heart disease"], a:1},
{t:" During the first Leopold maneuver the nurse feels a firm, round, movable mass separated from the trunk by a groove at the fundus. What is the likely presentation and which maneuver would be omitted?", o:["Cephalic – none omitted","Transverse lie – second maneuver omitted","Face – first maneuver omitted","Breech – the fourth maneuver is omitted"], a:3},
{t:" One hour postpartum a woman has a bulging lower abdomen, the uterus is displaced to the right and lochia flow has increased. What should the nurse do?", o:["Give ergometrine immediately","Apply a warm pack to the abdomen","Encourage her to void (catheterize if she cannot pass urine within 4–6 hours) and then check uterine tone","Discharge her home"], a:2},
{t:"A primigravida in active labor has her cervical dilatation plotted exactly on the action line. Which of the following is appropriate?", o:["Specific management decisions at the hospital, e.g. amniotomy, oxytocin or C.S.","Continue observation with no change","Transfer her to the postpartum ward","Discharge her home"], a:0},
{t:"A newborn at 1 minute has: heart rate 120/min, slow irregular respirations, some flexion of limbs, grimace to stimulation, body pink with blue extremities. What is the Apgar score and risk level?", o:["Score 3 – high risk","Score 6 – moderate risk","Score 8 – small risk","Score 10 – normal"], a:1},
{t:"While using a Pinard stethoscope, the nurse counts a rate of 80/min that matches the mother's pulse. What is the most likely explanation?", o:["Normal fetal heart rate","Fetal bradycardia","Fetal tachycardia","She is hearing maternal/uterine vessel blood flow; move the Pinard slightly to confirm the fetal heart sound"], a:3},
{t:"A 25-year-old woman at 12 weeks attends her booking visit. Her hemoglobin is 10.0 g/dL. How should the nurse interpret this value?", o:["Normal for the first trimester","Below the minimum normal value (11 g/dL) – suggests anemia","Normal only in the third trimester","Indicates polycythemia"], a:1},
{t:"A woman in labor has a pulse of 110/min, temperature 38.5 °C, dry mouth and ketone bodies in her urine. What is the best interpretation?", o:["Normal labor changes","Fetal distress","Signs of maternal distress/dehydration – report, and give IV fluids as ordered","The transition phase only"], a:2},
];

const TOTAL_TIME = 50*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
