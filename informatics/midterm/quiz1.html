<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0891b2;--teal-d:#0e5a73;--blue:#dce8f3;--bd:#c2d4e6;--ok:#059669;--no:#e11d48;--rev:#6366f1;--txt:#0a1a33;--grad:linear-gradient(135deg,#071226 0%,#0c2a4d 55%,#0e5a73 100%)}
body{font-family:'IBM Plex Sans Arabic','Space Grotesk',Arial,sans-serif;background:#eaf1f8;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:700;position:relative;border-bottom:2px solid #22d3ee}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#6366f1;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:linear-gradient(135deg,#0891b2,#6366f1);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#071226}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#0891b2;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#f59e0b}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#dce8f3}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #071226;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#a9bdd6;background:#071226;border-top:2px solid #0891b2;margin-top:10px}
footer a{color:#38bdf8!important}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← رجوع</a>Nursing Informatics<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Nursing Informatics (NI) integrates nursing science with which two other sciences?", o:["Pharmacology and anatomy","Computer science and information science","Psychology and sociology","Physics and chemistry"], a:1},
{t:"Informatics is best defined as:", o:["The study of drug interactions","The treatment of chronic disease","The physical assessment of patients","The management of information using cognitive skills and the computer"], a:3},
{t:"Telenursing refers to:", o:["The use of telecommunications and information technology to provide nursing services remotely","Nursing care delivered only inside hospitals","The study of nursing history","The administration of nursing schools"], a:0},
{t:"An Electronic Health Record (EHR) is best described as:", o:["A paper chart kept in one clinic","A record managed only by the patient","A digital, real-time record of a patient's longitudinal history designed to be shared across organizations","A billing database"], a:2},
{t:"Which RPM device monitors arterial blood oxygen saturation and pulse rate?", o:["Digital weight scale","Digital blood pressure cuff","Smart glucometer","Pulse oximeter"], a:3},
{t:"Which of the following is an advantage of nursing informatics?", o:["Cost of hardware and software","Reduced paperwork and paper loss","Computer malfunction","Susceptibility to network hackers"], a:1},
{t:"Which level of telecommunication involves emails or faxes to transfer medical data over telephone lines?", o:["Level 4","Level 3","Level 1","Level 2"], a:2},
{t:"A Personal Health Record (PHR) is managed by:", o:["The patient or individual","The pharmacy","The hospital administrator","The insurance company"], a:0},
{t:"Which system ensures the 'five rights' of medication administration at the point of care?", o:["Computerized Provider Order Entry","Bar-Code Medication Administration (BCMA)","Clinical Decision Support","Remote Patient Monitoring"], a:1},
{t:"Which is a benefit of telecommunication for patients?", o:["Lack of physical touch","Poor internet connectivity","Reduced non-verbal cues","Savings on transportation, parking, and lost work hours"], a:3},
{t:"Evaluating symptoms by phone or video to decide whether emergency care, a clinic visit, or home management is needed is called:", o:["Remote patient monitoring","Store-and-forward","Tele-triage","Wearable technology"], a:2},
// ---- Medium ----
{t:"Computerized Provider Order Entry (CPOE) mainly reduces which type of error?", o:["Patient falls","Transcription errors from handwritten orders","Hospital-acquired infections","Staff turnover"], a:1},
{t:"Which tool delivers drug interaction alerts, critical value warnings, and evidence-based suggestions at the point of care?", o:["Scheduling module","Patient portal","Digital otoscope","Clinical Decision Support System (CDSS)"], a:3},
{t:"Transmitting recorded data such as wound photos, reports, and lab results for later review is known as:", o:["Store-and-forward (asynchronous)","Real-time (synchronous)","Remote palpation","Tele-ICU"], a:0},
{t:"Which term is the broadest umbrella for remote health services, including non-clinical ones such as staff training?", o:["Telenursing","Telemedicine","Telehealth","Tele-triage"], a:2},
{t:"What mainly distinguishes an EMR from an EHR?", o:["EMR is managed by the patient","EMR is limited to a single practice, whereas EHR is built for interoperability across organizations","EMR is paper-based","EMR contains only billing data"], a:1},
{t:"Role-Based Access Control (RBAC) in an EHR ensures that:", o:["Staff access only the minimum data necessary for their duties","All staff can view all records","Patients can edit clinical notes","Records are printed daily"], a:0},
{t:"In RPM for heart failure, a sudden weight gain of about two pounds in 24 hours is a key indicator of:", o:["Dehydration","Hypoglycemia","Fluid retention","Infection"], a:2},
{t:"Level 2 telecommunication involves:", o:["Emails or faxes only","Synchronous audio-visual communication","Department of Defense research on remote palpation","Transmitting store-and-forward images such as ECG strips, pathology slides, and X-rays"], a:3},
{t:"Which is a characteristic of an ideal hospital telecommunication system?", o:["Keeping confidentiality and security of patient data","A complex interface requiring extensive training","Limited availability to remote areas","Low-speed connectivity"], a:0},
{t:"Which is a disadvantage of telecommunication and telenursing?", o:["Reduced risk of cross-infection","Continuous monitoring","Lack of physical touch and hands-on clinical assessment","Greater flexibility for patients and staff"], a:2},
{t:"Which of the following is a defining attribute of telenursing?", o:["Hospital architecture","Use of telecommunication and technology systems in communicating between nurses and patients","Drug manufacturing","Surgical technique"], a:1},
// ---- Hard ----
{t:"Level 4 telecommunication was limited to Department of Defense research and was designed for:", o:["Emailing medical data","Storing ECG strips","Synchronous video visits","Remote palpation and guiding robotic surgery"], a:3},
{t:"Telenursing is best described as:", o:["A superset that includes all of telehealth","A specialized subset of telehealth, closely linked to telemedicine","The same thing as telemedicine","A purely administrative service"], a:1},
{t:"Managing large volumes of automated RPM alerts and distinguishing critical alarms is known as:", o:["Licensure complexity","The digital divide","Alert fatigue and overload","Absence of direct physical assessment"], a:2},
{t:"In EHR charting templates, SOAP stands for:", o:["Subjective, Objective, Assessment, Plan","Symptoms, Observation, Action, Prognosis","Safety, Outcome, Audit, Policy","Subjective, Ongoing, Assessment, Procedure"], a:0},
{t:"Which is the modern RESTful API standard for exchanging health data?", o:["HL7 v2","FHIR","LOINC","RxNorm"], a:1},
{t:"'Pajama time' in the context of EHRs refers to:", o:["Night-shift staffing shortages","Scheduled system downtime","Patient sleep monitoring","After-hours charting burden that contributes to clinician burnout"], a:3},
{t:"Ambient Clinical Intelligence (ACI) uses AI and natural language processing to:", o:["Record clinician-patient conversations and generate structured clinical notes in real time","Replace nurses at the bedside","Process insurance claims","Allocate hospital beds"], a:0},
{t:"Which is a challenge in designing and implementing telecommunication?", o:["Abundant resources","Uniform skills among all providers","Poor infrastructure and limited internet options in some rural areas","Universal broadband access"], a:2},
{t:"Which action reflects the correct role of the nurse in electronic documentation?", o:["Sharing login credentials with colleagues","Using clinical judgment rather than relying blindly on automated alerts","Delaying charting until the end of the week","Ignoring institutional documentation policies"], a:1},
{t:"'Design, structure and presentation of information as it impacts nurses' decision-making' describes:", o:["Nursing","Medical informatics","Nursing informatics","Information technology"], a:2},
{t:"Which issue arises when a telenurse practices across state or international borders?", o:["Complex licensure and cross-border practice requirements","Excess pharmacy stock","Short battery life of hospital beds","Font size on patient portals"], a:0},
{t:"Telecommunication is especially beneficial for isolated communities because it:", o:["Eliminates the need for nurses","Replaces all hospitals","Increases paperwork","Improves access to care and to remote specialists"], a:3},
{t:"Which of the following is a challenge facing nursing informatics?", o:["Reduced paperwork","Lack of administrative support and inadequate financial resources","Faster record retrieval","Improved data sharing"], a:1},
{t:"Nursing informatics integrates nursing science, computer science, and information science.", o:["True","False"], a:0},
{t:"Telenursing is limited to in-person hospital visits.", o:["True","False"], a:1},
{t:"An EHR is designed to be shared across organizational boundaries.", o:["True","False"], a:0},
{t:"Level 1 telecommunication involves robotic surgery guidance.", o:["True","False"], a:1},
{t:"CPOE increases the transcription errors associated with handwritten notes.", o:["True","False"], a:1},
{t:"Pulse oximeters are used in RPM to monitor oxygen saturation and pulse rate.", o:["True","False"], a:0},
{t:"Level 3 telecommunication transmits synchronous, interactive, audio-visual communications.", o:["True","False"], a:0},
{t:"Telemedicine is a broader term than telehealth.", o:["True","False"], a:1},
{t:"Need for training and cost of hardware and software are disadvantages of nursing informatics.", o:["True","False"], a:0},
{t:"An EMR typically follows the patient across multiple providers and facilities.", o:["True","False"], a:1},
{t:"Telecommunication improves continuity of care and the decision-making abilities of healthcare providers.", o:["True","False"], a:0},
{t:"Information management means making all information available to everyone at all times.", o:["True","False"], a:1},
{t:"HIPAA and GDPR govern privacy, patient consent, and data processing rights for health data.", o:["True","False"], a:0},
{t:"Rural areas always have reliable internet, so connectivity is not a challenge for telecommunication.", o:["True","False"], a:1},
{t:"Alert fatigue is a recognized challenge of remote patient monitoring.", o:["True","False"], a:0}
];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
