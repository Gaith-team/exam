<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#0891b2;--teal-d:#0e5a73;--blue:#dce8f3;--bd:#c2d4e6;--ok:#059669;--no:#e11d48;--rev:#6366f1;--txt:#0a1a33;--grad:linear-gradient(135deg,#071226 0%,#0c2a4d 55%,#0e5a73 100%)}
body{font-family:'IBM Plex Sans Arabic','Space Grotesk',Arial,sans-serif;background:#eaf1f8;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:700;position:relative;border-bottom:2px solid #22d3ee}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#6366f1;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:linear-gradient(135deg,#0891b2,#6366f1);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#071226}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#0891b2;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#f59e0b}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#dce8f3}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #071226;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#a9bdd6;background:#071226;border-top:2px solid #0891b2;margin-top:10px}
footer a{color:#38bdf8!important}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← رجوع</a>Nursing Informatics<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="prev()">Previous</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Which of the following is NOT one of the three primary sciences integrated in NI?", o:["Nursing science","Computer science","Political science","Information science"], a:2},
{t:"Which of the following is an example of an EHR system?", o:["Epic","Zoom","Microsoft Excel","Doxy.me"], a:0},
{t:"Which RPM device is used to track sudden fluid retention as an early sign of heart failure decompensation?", o:["Pulse oximeter","Digital weight scale","Digital otoscope","Smart glucometer"], a:1},
{t:"Smartwatches, continuous glucose monitors, and biosensors are examples of:", o:["Store-and-forward tools","Telephone triage tools","Practice management systems","Wearable technology"], a:3},
{t:"Telecommunication in healthcare means using technology and networks to:", o:["Transmit health data, provide remote care, and connect healthcare teams over a distance","Replace all hospital buildings","Train nurses only in classrooms","Store paper charts"], a:0},
{t:"EMR stands for:", o:["Emergency Medical Response","Electronic Medication Record","Essential Medical Registry","Electronic Medical Record"], a:3},
{t:"Which is a benefit of EHR for nursing practice, especially in shift-based work?", o:["Increased paperwork","Continuity of care","Reduced need for documentation","Elimination of nurse judgment"], a:1},
{t:"Which is a disadvantage of nursing informatics?", o:["Easier retrieval of records","Reduced paper loss","Cost of hardware and software","Improved communication"], a:2},
{t:"A benefit of telecommunication for healthcare providers is:", o:["Reaching underserved populations in rural and remote areas without travel delays","Increased travel time","Reduced collaboration with specialists","Higher paper use"], a:0},
{t:"mHealth applications are mainly used for:", o:["Robotic surgery","Remote palpation","Automated medication reminders, symptom logging, and educational delivery","Printing lab reports"], a:2},
{t:"Which telenursing mode uses live video conferencing and audio phone calls?", o:["Store-and-forward","Real-time (synchronous)","Asynchronous","Remote monitoring dashboards only"], a:1},
// ---- Medium ----
{t:"Computer-assisted learning in nursing informatics allows students to:", o:["Avoid learning clinical skills","Learn only from paper charts","Replace clinical placements","Learn basic nursing care through software covering topics from drug dosage to ethical decision making"], a:3},
{t:"Distance learning through NI has made which trend possible?", o:["Online nursing degrees and continued professional education","Elimination of nursing education","Paper-only coursework","Mandatory on-campus attendance"], a:0},
{t:"Which standard provides universal identifiers for laboratory tests and clinical observations?", o:["RxNorm","HL7 v2","LOINC","FHIR"], a:2},
{t:"RxNorm is used to provide:", o:["Universal lab test codes","Normalized names for clinical drugs and dosage forms","A clinical vocabulary of diagnoses","Messaging for hospital admissions"], a:1},
{t:"Early detection of health deterioration through remote monitoring helps prevent:", o:["Nurse licensure","Data encryption","Digital literacy","Emergency hospital admissions"], a:3},
{t:"Sharing medical data in telecommunication systems requires:", o:["High-speed connectivity","Fax machines only","Paper forms","No network"], a:0},
{t:"Which software guides phone or video nurses through standardized assessment protocols to determine care urgency?", o:["Practice management software","Billing software","Clinical triage and decision support software","Patient mobile apps"], a:2},
{t:"Digital otoscopes and high-definition dermascopes are used during video visits to:", o:["Measure blood glucose","Inspect eardrums, throat tissue, or skin lesions up close","Record an ECG","Monitor body weight"], a:1},
{t:"In a tele-ICU system, an expert critical care nurse supports a rural hospital nurse mainly through:", o:["Postal letters","Paper protocols","Weekly newsletters","Live audio, video feeds, and virtual monitoring"], a:3},
{t:"Which EHR feature tracks medication schedules, doses, and routes and reduces errors with barcode scanning?", o:["Medication Administration Record (MAR)","Handoff report","Care plan management","Patient portal"], a:0},
{t:"Which record type is built for the highest level of interoperability and Health Information Exchange?", o:["EMR","PHR","EHR","Paper chart"], a:2},
// ---- Hard ----
{t:"Most employers require telenurses to have how much bedside or face-to-face experience?", o:["Less than 6 months","1 to 3 years","10 to 15 years","None"], a:1},
{t:"Which of the following is a disadvantage of telecommunication and telenursing?", o:["Reduced risk of cross-infection","Continuous monitoring","Greater flexibility","Potential for technical malfunctions or poor internet connectivity"], a:3},
{t:"Virtual triage competence requires evaluating a patient's condition using only:", o:["Audio cues or video feeds","Physical palpation","Laboratory tests","Imaging studies"], a:0},
{t:"Why does NI make research on past medical illness and management easier?", o:["Records are destroyed after use","Patients keep records at home only","Computers keep the records and researchers can get proper access to them","Paper records are faster to search"], a:2},
{t:"Which of the following is NOT a technical safeguard for EHR security?", o:["End-to-end encryption","Multi-factor authentication","Audit logging","Sharing one password among team members"], a:3},
{t:"Machine-learning models integrated into EHR workflows are used to predict:", o:["Parking demand","Inpatient deterioration, sepsis risk, and readmission probability","Staff salaries","Equipment colors"], a:1},
{t:"Difficulty in maintaining quality of care in telecommunication is attributed to:", o:["Individual differences between healthcare providers","An excess of resources","Standardized skills","A lack of patients"], a:0},
{t:"'Using information applications and technology' appears in the comparison table under which column?", o:["Nursing informatics","Nursing","Medical informatics","Information technology"], a:1},
{t:"Which issue remains a concern in delivering patient care through NI despite its benefits?", o:["Excessive paper use","Slower communication","Lack of records","Ethics and confidentiality of information"], a:3},
{t:"Telecommunication benefits healthcare organizations by:", o:["Enhancing collaboration between organizations and allowing flexible work from home","Isolating departments","Increasing physical travel","Preventing data sharing"], a:0},
{t:"Which regulatory requirement is a challenge in telenursing?", o:["Ignoring privacy laws","Single-site licensure only","No documentation","Compliance with data privacy laws (e.g., HIPAA) and multi-jurisdictional nursing licenses"], a:3},
{t:"Which of the following is a resource-related challenge in implementing telecommunication?", o:["Surplus of cables","Lack of needed resources such as telephone, internet, airwaves, or cables","Excess trained staff","Universal connectivity"], a:1},
{t:"Which advantage appears in the Nursing Information System diagram?", o:["Increased paperwork","Reduced tracking","Enhanced regulatory compliance","Decreased documentation quality"], a:2},
{t:"NI aims to enhance patient safety, streamline workflows, improve clinical outcomes, and support decision-making.", o:["True","False"], a:0},
{t:"Telenursing services can only be provided by physicians.", o:["True","False"], a:1},
{t:"Confidentiality is no longer a concern in nursing informatics.", o:["True","False"], a:1},
{t:"A PHR is managed directly by the patient.", o:["True","False"], a:0},
{t:"Reducing unnecessary in-person clinic visits allows hospitals to allocate staff and resources more effectively.", o:["True","False"], a:0},
{t:"Level 2 telecommunication transmits synchronous, interactive audio-visual communications.", o:["True","False"], a:1},
{t:"Telehealth includes non-clinical services such as staff training and administrative meetings.", o:["True","False"], a:0},
{t:"Nurses should rely blindly on automated EHR alerts instead of using clinical judgment.", o:["True","False"], a:1},
{t:"Smartwatches and continuous glucose monitors are examples of store-and-forward technology.", o:["True","False"], a:1},
{t:"Cost reduction and facilitating change management are listed advantages of nursing informatics.", o:["True","False"], a:0},
{t:"An Electronic Nursing Record (ENR) is a digital system that replaces paper charts so nurses can record, track, and update patient care information.", o:["True","False"], a:0},
{t:"Information technology includes only computers, and excludes pen, paper, telephones, and fax machines.", o:["True","False"], a:1},
{t:"An ideal hospital telecommunication system should be simple to use and keep patient data confidential and secure.", o:["True","False"], a:0},
{t:"Resistance to change among healthcare providers is not considered a challenge for telecommunication.", o:["True","False"], a:1},
{t:"Telephone triage nurses use standardized, evidence-based decision support software to guide patients.", o:["True","False"], a:0}
];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();return} const k=Q.findIndex((_,x)=>!saved[x]); if(k>=0){cur=k;render()} else {refresh();alert('كل الأسئلة اتحلت، دوس End Test لإنهاء الامتحان')} }
function saveNext(){ saved[cur]=sel[cur]!==null; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function prev(){ if(cur>0){cur--;render()} }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
