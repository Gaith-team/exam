<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
/* Palette: monitor navy (base) · signal cyan (tech) · clinical mint (correct) · violet (e-learning) · amber (alerts) */
:root {
  --accent:#0891b2; --accent-rgb:8,145,178; --accent-glow:rgba(8,145,178,0.22);
  --c2:#10b981; --c3:#f59e0b; --c4:#6366f1;
  --ink:#071226; --ink2:#0c1d3a;
  --grad:linear-gradient(135deg,#071226 0%,#0c2a4d 55%,#0e5a73 100%);
  --grad-soft:linear-gradient(135deg,#0891b2,#6366f1);
  --bg:#eaf1f8; --bg2:#dce8f3; --card:#ffffff; --text:#0a1a33; --text2:#40536f; --text3:#7488a3;
  --bc:rgba(10,40,90,0.12); --success:#059669; --danger:#e11d48; --warn:#d97706; --r:10px;
  --tr:all 0.22s cubic-bezier(0.4,0,0.2,1);
  --font-ui:'IBM Plex Sans Arabic','Space Grotesk',system-ui,sans-serif;
  --font-d:'Space Grotesk','IBM Plex Sans Arabic',system-ui,sans-serif;
}
[data-theme="dark"] {
  --bg:#050c1a; --bg2:#0b162b; --card:#0e1b34; --text:#e6f0fb; --text2:#a9bdd6; --text3:#6f87a6;
  --bc:rgba(120,180,255,0.14); --accent:#22d3ee; --accent-rgb:34,211,238; --accent-glow:rgba(34,211,238,0.22);
  --c2:#34d399; --c3:#fbbf24; --c4:#818cf8; --success:#34d399; --danger:#fb7185; --warn:#fbbf24;
}
body { font-family:var(--font-ui); background:var(--bg);
  background-image:radial-gradient(rgba(var(--accent-rgb),.22) 1px,transparent 1.2px);
  background-size:22px 22px; background-attachment:fixed; color:var(--text); min-height:100vh; overflow-x:hidden; transition:background-color .4s,color .4s; }
#prog-bar { position:fixed; top:0; left:0; height:3px; z-index:999; background:linear-gradient(90deg,var(--accent),var(--c4),var(--c2)); transition:width .2s; }
nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 28px; height:64px; background:rgba(234,241,248,.92); backdrop-filter:blur(14px); border-bottom:1px solid var(--bc); transition:var(--tr); }
[data-theme="dark"] nav { background:rgba(5,12,26,.94); }
.nav-back { display:flex; align-items:center; gap:7px; color:var(--text2); text-decoration:none; font-size:13px; font-weight:600; padding:7px 13px; border-radius:8px; border:1px solid var(--bc); background:var(--card); transition:var(--tr); }
.nav-back:hover { color:var(--accent); border-color:var(--accent); transform:translateX(3px); }
.nav-brand { display:flex; align-items:center; gap:9px; font-family:var(--font-d); font-size:15px; font-weight:700; color:var(--text); letter-spacing:.4px; }
.nav-logo-icon { width:34px; height:34px; border-radius:8px; background:var(--ink); border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent); font-family:var(--font-d); font-size:12px; font-weight:700; box-shadow:0 0 14px var(--accent-glow); }
.nav-right { display:flex; align-items:center; gap:8px; }
.theme-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--bc); background:var(--card); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center; transition:var(--tr); }
.theme-btn:hover { border-color:var(--c3); transform:rotate(20deg); }

/* Hero: a patient monitor. The ECG trace runs into a network graph. */
.hero-band { margin-top:64px; background:var(--grad); padding:38px 24px 64px; text-align:center; position:relative; overflow:hidden; }
.hero-band::before { content:''; position:absolute; inset:0;
  background:linear-gradient(rgba(34,211,238,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.09) 1px,transparent 1px),radial-gradient(ellipse 420px 200px at 85% 0%,rgba(99,102,241,.35) 0%,transparent 70%);
  background-size:26px 26px,26px 26px,auto; }
.hero-band > * { position:relative; }
.curve { position:absolute !important; left:0; right:0; bottom:6px; width:100%; height:54px; pointer-events:none; }
.curve .ecg { fill:none; stroke:#22d3ee; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:900; stroke-dashoffset:900; animation:draw 2.8s ease-out forwards; filter:drop-shadow(0 0 4px rgba(34,211,238,.8)); }
.curve .net line { stroke:rgba(165,180,252,.55); stroke-width:1.2; }
.curve .net circle { fill:#a5b4fc; }
.curve .net circle.hub { fill:#22d3ee; }
@keyframes draw { to { stroke-dashoffset:0; } }
@media (prefers-reduced-motion: reduce) { .curve .ecg { animation:none; stroke-dashoffset:0; } }
.hero-band-icon { width:68px; height:68px; border-radius:14px; background:rgba(7,18,38,.7); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 14px; border:1.5px solid #22d3ee; box-shadow:0 0 22px rgba(34,211,238,.35), inset 0 0 14px rgba(34,211,238,.15); }
.hero-band h1 { font-family:var(--font-d); font-size:clamp(20px,4.4vw,30px); font-weight:700; color:#fff; margin-bottom:6px; letter-spacing:.2px; line-height:1.25; }
.hero-band p { font-size:13px; color:#9fdcec; }
.hero-band-meta { display:flex; justify-content:center; gap:12px; margin-top:20px; flex-wrap:wrap; }
.meta-pill { background:rgba(7,18,38,.55); border:1px solid rgba(34,211,238,.4); border-radius:6px; padding:6px 14px; font-size:12px; font-weight:600; color:#e6fbff; display:flex; align-items:center; gap:7px; }
.meta-pill i { color:#22d3ee; }

.shell { max-width:560px; margin:0 auto; padding:24px 20px 80px; }
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
.stat-box { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:12px 10px; text-align:center; }
.stat-box:nth-child(1) { border-bottom:3px solid var(--success); }
.stat-box:nth-child(2) { border-bottom:3px solid var(--danger); }
.stat-box:nth-child(3) { border-bottom:3px solid var(--accent); }
.stat-box .val { font-family:var(--font-d); font-size:21px; font-weight:700; }
.stat-box .lbl { font-size:11px; color:var(--text3); margin-top:2px; }
.stat-correct { color:var(--success); } .stat-wrong { color:var(--danger); } .stat-remain { color:var(--accent); }
.prog-strip { background:var(--card); border:1px solid var(--bc); border-radius:var(--r); padding:14px 16px; margin-bottom:16px; display:flex; align-items:center; gap:14px; }
.prog-label { font-size:13px; font-weight:600; color:var(--text2); white-space:nowrap; }
.prog-track { flex:1; height:8px; background:var(--bg2); border-radius:8px; overflow:hidden; }
.prog-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--c4)); border-radius:8px; transition:width .4s; }
.timer-badge { min-width:70px; height:36px; border-radius:8px; background:var(--ink); border:1px solid rgba(34,211,238,.4); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-size:14px; font-weight:700; color:#22d3ee; gap:6px; padding:0 12px; flex-shrink:0; font-variant-numeric:tabular-nums; }
.timer-badge.warn { color:#fbbf24; border-color:rgba(251,191,36,.5); }
.timer-badge.danger { color:#fb7185; border-color:rgba(251,113,133,.6); animation:pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

/* Question card is an app window */
.q-card { background:var(--card); border:1px solid var(--bc); border-radius:12px; overflow:hidden; box-shadow:0 8px 28px rgba(7,18,38,.12); }
.q-header { background:var(--ink); padding:9px 16px; display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--accent); direction:ltr; }
.q-header .win-dots { display:flex; gap:6px; }
.q-header .win-dots i { width:9px; height:9px; border-radius:50%; background:#334766; }
.q-header .win-dots i:nth-child(1) { background:#fb7185; } .q-header .win-dots i:nth-child(2) { background:#fbbf24; } .q-header .win-dots i:nth-child(3) { background:#34d399; }
.q-num { margin-left:auto; font-family:var(--font-d); background:rgba(34,211,238,.14); border:1px solid rgba(34,211,238,.35); border-radius:6px; padding:3px 10px; font-size:11px; font-weight:600; color:#22d3ee; letter-spacing:.4px; }
.q-text { padding:22px 18px 14px; font-family:var(--font-d); font-size:15.5px; font-weight:600; color:var(--text); line-height:1.65; border-bottom:1px solid var(--bc); text-align:left; direction:ltr; }
.q-text img { display:block; max-width:100%; max-height:260px; margin:0 auto 12px; border-radius:10px; background:#fff; }
.options { padding:14px 18px 18px; display:flex; flex-direction:column; gap:10px; }
.opt { display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:8px; border:1.5px solid var(--bc); background:var(--bg); cursor:pointer; font-family:var(--font-d); font-size:14px; font-weight:500; color:var(--text); transition:var(--tr); user-select:none; direction:ltr; text-align:left; }
.opt:hover:not(.disabled) { border-color:var(--accent); background:rgba(var(--accent-rgb),.08); transform:translateX(3px); }
.opt-letter { width:28px; height:28px; border-radius:6px; flex-shrink:0; background:var(--bg2); border:1px solid var(--bc); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--text3); transition:var(--tr); }
.opt:nth-child(1) .opt-letter { background:rgba(8,145,178,.13); color:#0891b2; border-color:rgba(8,145,178,.4); }
.opt:nth-child(2) .opt-letter { background:rgba(99,102,241,.13); color:#6366f1; border-color:rgba(99,102,241,.4); }
.opt:nth-child(3) .opt-letter { background:rgba(245,158,11,.15); color:#d97706; border-color:rgba(245,158,11,.45); }
.opt:nth-child(4) .opt-letter { background:rgba(16,185,129,.13); color:#059669; border-color:rgba(16,185,129,.4); }
[data-theme="dark"] .opt:nth-child(1) .opt-letter { color:#22d3ee; } [data-theme="dark"] .opt:nth-child(2) .opt-letter { color:#a5b4fc; }
[data-theme="dark"] .opt:nth-child(3) .opt-letter { color:#fbbf24; } [data-theme="dark"] .opt:nth-child(4) .opt-letter { color:#34d399; }
.opt.correct { border-color:var(--success); background:rgba(16,185,129,.12); }
.opt.correct .opt-letter { background:var(--success); color:#fff; border-color:var(--success); }
.opt.wrong { border-color:var(--danger); background:rgba(225,29,72,.08); }
.opt.wrong .opt-letter { background:var(--danger); color:#fff; border-color:var(--danger); }
.opt.disabled { pointer-events:none; }
.feedback-bar { margin:14px 18px; padding:12px 16px; border-radius:8px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; animation:popIn .35s cubic-bezier(.34,1.56,.64,1); }
@keyframes popIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background:rgba(16,185,129,.12); color:var(--success); border:1px solid rgba(16,185,129,.3); }
.feedback-bar.no { background:rgba(225,29,72,.08); color:var(--danger); border:1px solid rgba(225,29,72,.25); }
.feedback-icon { font-size:20px; }
.explanation { margin:0 18px 14px; padding:12px 14px; background:rgba(var(--accent-rgb),.07); border-radius:8px; border-right:3px solid var(--accent); font-size:13px; color:var(--text2); line-height:1.7; display:none; }
.nav-btns { padding:4px 18px 18px; display:flex; gap:10px; }
.btn { flex:1; padding:13px; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-ui); transition:var(--tr); display:flex; align-items:center; justify-content:center; gap:7px; }
.btn:focus-visible, .opt:focus-visible, .theme-btn:focus-visible { outline:3px solid var(--c4); outline-offset:2px; }
.btn-next { background:var(--grad-soft); color:#fff; box-shadow:0 4px 14px rgba(8,145,178,.3); }
.btn-next:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(8,145,178,.4); }
.btn-skip { background:var(--bg2); color:var(--text2); border:1px solid var(--bc); flex:0 0 auto; padding:13px 18px; }
.btn-skip:hover { border-color:var(--c3); color:var(--warn); }

.result-hero { text-align:center; padding:36px 20px 28px; background:var(--card); border-radius:12px; border:1px solid var(--bc); margin-bottom:20px; box-shadow:0 8px 28px rgba(7,18,38,.12); border-top:4px solid var(--accent); }
.score-ring { width:110px; height:110px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; flex-direction:column; border:5px solid var(--bg2); position:relative; }
.score-ring svg { position:absolute; inset:-5px; width:calc(100% + 10px); height:calc(100% + 10px); transform:rotate(-90deg); }
.score-ring circle { fill:none; stroke-width:5; stroke-linecap:round; }
.ring-bg { stroke:var(--bg2); }
.ring-fill { stroke:var(--accent); transition:stroke-dashoffset 1s ease; }
.score-num { font-family:var(--font-d); font-size:28px; font-weight:700; color:var(--text); }
.score-pct { font-size:12px; color:var(--text3); }
.result-grade { font-size:22px; font-weight:700; margin-bottom:6px; }
.result-sub { font-size:14px; color:var(--text2); }
.result-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:20px; }
.rs { background:var(--bg2); border-radius:8px; padding:12px 8px; text-align:center; }
.rs .n { font-family:var(--font-d); font-size:20px; font-weight:700; } .rs .l { font-size:11px; color:var(--text3); }
.report-item { background:var(--card); border:1px solid var(--bc); border-radius:10px; padding:16px; margin-bottom:10px; border-right:4px solid var(--bc); }
.report-item.ok { border-right-color:var(--success); } .report-item.no { border-right-color:var(--danger); }
.report-item .ri-q { font-family:var(--font-d); font-size:13px; font-weight:600; margin-bottom:8px; direction:ltr; text-align:left; }
.report-item .ri-q img { max-height:90px; display:block; margin:6px 0; border-radius:8px; }
.report-item .ri-row { display:flex; align-items:center; gap:8px; font-size:12px; margin-top:5px; color:var(--text2); direction:ltr; text-align:left; }
.ri-badge { padding:2px 8px; border-radius:5px; font-weight:700; font-size:11px; flex-shrink:0; font-family:var(--font-ui); }
.ri-yours { background:rgba(225,29,72,.1); color:var(--danger); } .ri-right { background:rgba(16,185,129,.12); color:var(--success); }
.result-actions { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
.btn-retry { background:linear-gradient(135deg,#d97706,#6366f1); color:#fff; }
.btn-retry:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(99,102,241,.3); }
.btn-home { background:var(--bg2); color:var(--text); border:1px solid var(--bc); }
.btn-home:hover { border-color:var(--accent); color:var(--accent); }
.empty-note { background:var(--card); border:1px dashed var(--accent); border-radius:12px; padding:28px 20px; text-align:center; color:var(--text2); font-size:14px; line-height:1.8; }
footer { background:var(--ink); border-top:2px solid var(--accent); padding:22px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.footer-brand { font-family:var(--font-d); font-size:14px; font-weight:700; color:#e6f0fb; } .footer-brand span { color:#22d3ee; }
.footer-tg { display:flex; align-items:center; gap:5px; text-decoration:none; color:#38bdf8; font-size:12px; font-weight:600; }
@media (max-width:480px) { nav{padding:0 14px;} .shell{padding:16px 14px 60px;} .nav-brand span{display:none;} .hero-band{padding:30px 16px 60px;} }
</style>
</head>
<body>
<div id="prog-bar" style="width:0%"></div>
<nav>
  <a href="https://gaith-team.github.io/exam/" class="nav-back"><i class="fa-solid fa-arrow-right"></i> رجوع</a>
  <div class="nav-brand"><div class="nav-logo-icon">GT</div><span>GHAITH TEAM</span></div>
  <div class="nav-right"><button class="theme-btn" id="themeBtn">🌙</button></div>
</nav>
<div class="hero-band">
  <svg class="curve" viewBox="0 0 600 54" preserveAspectRatio="none" aria-hidden="true">
    <path class="ecg" d="M0 38 L90 38 L110 38 L122 24 L134 46 L146 8 L160 50 L172 38 L230 38 L262 38 L300 26"/>
    <g class="net">
      <line x1="300" y1="26" x2="360" y2="12"/><line x1="300" y1="26" x2="372" y2="42"/>
      <line x1="360" y1="12" x2="440" y2="26"/><line x1="372" y1="42" x2="440" y2="26"/>
      <line x1="440" y1="26" x2="510" y2="10"/><line x1="440" y1="26" x2="520" y2="44"/><line x1="510" y1="10" x2="580" y2="28"/><line x1="520" y1="44" x2="580" y2="28"/>
      <circle class="hub" cx="300" cy="26" r="4"/><circle cx="360" cy="12" r="3"/><circle cx="372" cy="42" r="3"/>
      <circle class="hub" cx="440" cy="26" r="4"/><circle cx="510" cy="10" r="3"/><circle cx="520" cy="44" r="3"/><circle class="hub" cx="580" cy="28" r="4"/>
    </g>
  </svg>
  <div class="hero-band-icon">💻</div>
  <h1>Telecommunication</h1>
  <p>Nursing Informatics &amp; Educational Technology</p>
  <div class="hero-band-meta">
    <div class="meta-pill"><i class="fa-solid fa-list-ol"></i> <span id="totalBadge">-- سؤال</span></div>
    <div class="meta-pill"><i class="fa-solid fa-clock"></i> 40 Min</div>

<div class="shell">
  <div class="stats-row">
    <div class="stat-box"><div class="val stat-correct" id="sCorrect">0</div><div class="lbl">✔ صحيح</div></div>

  </div>

    <div class="prog-label" id="progLabel">سؤال ١</div>

    <div class="timer-badge" id="timerBadge"><i class="fa-regular fa-clock"></i> <span id="timerTxt">40:00</span></div>
  </div>
  <div id="app"></div>
</div>
<footer>
  <div class="footer-brand">GHAITH <span>TEAM</span></div>
  <a href="https://t.me/nursing2bu" target="_blank" class="footer-tg"><i class="fa-brands fa-telegram"></i> @nursing2bu</a>
</footer>
<script>
const QUESTIONS = [

];


/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 40*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function shuffleOptions(q) {
  const idx = shuffle(q.o.map((_, k) => k));
  return {...q, o: idx.map(k => q.o[k]), a: idx.indexOf(q.a)};
}
function init(pool) {
  if (!pool.length) {
    document.getElementById('app').innerHTML = '<div class="empty-note">لسه مفيش أسئلة.<br>ضيف الأسئلة جوه <b>QUESTIONS</b> في الكود وهتظهر هنا.</div>';
    document.getElementById('totalBadge').textContent = '0 سؤال';
    return;
  }
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer(); render();
}
function startTimer() {
  clearInterval(timerInterval);
  document.getElementById('timerBadge').className = 'timer-badge';
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}
function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}
const SYSTEMS = [
  { icon:'💻', l:['#0891b2','8,145,178','#071226','#0c2a4d','#0e5a73'], d:['#22d3ee','34,211,238'] }, /* informatics / systems */
  { icon:'🩺', l:['#059669','5,150,105','#06241f','#0b4a3f','#0e7490'], d:['#34d399','52,211,153'] }, /* clinical / EHR */
  { icon:'📡', l:['#4f46e5','79,70,229','#0a1030','#1e1b6b','#0e5a73'], d:['#818cf8','129,140,248'] }, /* networks / telehealth */
  { icon:'🎓', l:['#7c3aed','124,58,237','#120a2e','#2e1a6b','#0e5a73'], d:['#a78bfa','167,139,250'] }  /* e-learning / ed-tech */
];
function applyPalette() {
  const s = SYSTEMS[(i || 0) % SYSTEMS.length];
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  const r = document.documentElement.style;
  const main = dark ? s.d[0] : s.l[0], rgb = dark ? s.d[1] : s.l[1];
  r.setProperty('--accent', main);
  r.setProperty('--accent-rgb', rgb);
  r.setProperty('--accent-glow', `rgba(${rgb},0.22)`);
  r.setProperty('--grad', `linear-gradient(135deg,${s.l[2]} 0%,${s.l[3]} 55%,${s.l[4]} 100%)`);
  r.setProperty('--grad-soft', `linear-gradient(135deg,${s.l[0]},${s.l[3] === '#0c2a4d' ? '#6366f1' : s.l[3]})`);
  const ic = document.querySelector('.hero-band-icon'); if (ic) ic.textContent = s.icon;
}
function render() {
  applyPalette();
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header"><div class="win-dots"><i></i><i></i><i></i></div><div class="q-num">سؤال ${i + 1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button></div>
    </div>`;
}
function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v; answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();
  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });
  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>ممتاز ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر</span>`;
  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation'; exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }
  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}
function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}
function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}
function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);
  questions.forEach((q, idx) => { if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]}); });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];
  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--c4)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }
  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;
  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>` : ''}
    </div>`;
  }).join('');
  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان جديد عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;
  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('theme') || 'light';
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', t);
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
init(QUESTIONS);
</script>
</body>
</html>
