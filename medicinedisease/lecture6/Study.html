<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#d97706;--accent-dark:#92400e;--c2:#1d4ed8;--c3:#be123c;--c4:#0d9488;
--grad:linear-gradient(135deg,#92400e 0%,#d97706 35%,#be123c 75%,#1e3a8a 100%);--grad-soft:linear-gradient(135deg,#d97706,#be123c);
--bg:#fbf7f1;--bg2:#f4ebdd;--card:#fff;--text:#2a1d12;--text2:#5b4a3b;--text3:#8a7a6b;--bc:rgba(80,50,20,.1);--r:16px;--tr:all .3s cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{--bg:#140e09;--bg2:#1e150e;--card:#271b12;--text:#f6ebdf;--text2:#d8c4b0;--text3:#a08c78;--bc:rgba(255,255,255,.09);--accent:#fbbf24;--c2:#60a5fa;--c3:#fb7185;--c4:#2dd4bf}
body{font-family:'Outfit','Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
#prog-bar{position:fixed;top:0;left:0;height:3px;z-index:999;width:0;background:linear-gradient(90deg,var(--accent),var(--c3),var(--c4),var(--c2))}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;background:rgba(251,247,241,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--bc)}
[data-theme="dark"] nav{background:rgba(20,14,9,.95)}
.nav-back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:8px;border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.nav-back:hover{color:var(--c2);border-color:var(--c2)}
.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900}
.logo{width:34px;height:34px;border-radius:8px;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero{margin-top:64px;background:var(--grad);padding:40px 24px 44px;text-align:center;color:#fff}
.hero-icon{width:68px;height:68px;border-radius:20px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;border:1.5px solid rgba(255,255,255,.35)}
.hero h1{font-size:clamp(20px,4vw,30px);font-weight:900;margin-bottom:6px}
.hero p{font-size:13px;opacity:.9}
.pills{display:flex;justify-content:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:50px;padding:6px 16px;font-size:12px;font-weight:700}
.shell{max-width:760px;margin:0 auto;padding:24px 18px 80px}
.toc{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:22px;display:flex;flex-wrap:wrap;gap:8px}
.toc a{font-size:12px;font-weight:700;text-decoration:none;color:var(--text2);padding:6px 12px;border-radius:20px;background:var(--bg2);border:1px solid var(--bc)}
.toc a:hover{color:var(--accent);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--bc);border-radius:20px;overflow:hidden;margin-bottom:22px;box-shadow:0 4px 20px rgba(120,60,20,.07)}
.card-h{background:var(--grad);color:#fff;padding:14px 20px;font-size:18px;font-weight:900;direction:ltr;text-align:left}
.card-b{padding:6px 18px 18px}
.h2{font-size:15px;font-weight:900;color:var(--c3);margin:20px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--bc);direction:ltr;text-align:left}
.h3{font-size:13.5px;font-weight:700;color:var(--c2);margin:14px 0 2px;direction:ltr;text-align:left}
.fig{margin:16px 0 4px;text-align:center}
.fig img{max-width:100%;max-height:300px;border-radius:12px;background:#fff;border:1px solid var(--bc)}
.fig span{display:block;font-size:11px;color:var(--text3);margin-top:5px}
.item{margin-top:14px;border:1px solid var(--bc);border-radius:14px;overflow:hidden;background:var(--bg)}
.en{padding:12px 14px;font-weight:700;font-size:14.5px;line-height:1.65;direction:ltr;text-align:left;border-left:4px solid var(--accent);background:rgba(217,119,6,.07)}
.ar{padding:11px 14px;font-family:'Cairo',sans-serif;font-size:14px;line-height:1.9;direction:rtl;text-align:right;color:var(--text);border-top:1px dashed var(--bc)}
.ar b{color:var(--c2)}
.ex{padding:10px 14px;font-family:'Cairo',sans-serif;font-size:13.5px;line-height:1.85;direction:rtl;text-align:right;color:var(--text2);border-top:1px dashed var(--bc);background:rgba(13,148,136,.07);border-right:4px solid var(--c4)}
.ex b{color:var(--c4)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.fb{font-size:14px;font-weight:700}.fb span{color:var(--accent)}
.tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media(max-width:480px){nav{padding:0 12px}.nav-brand span{display:none}.card-b{padding:4px 12px 14px}}
</style>

["#","Hepatic cirrhosis"],
["Cirrhosis is a chronic disease characterized by replacement of normal liver tissue with diffuse fibrosis that disrupts the structure and function of the liver.","السيروزيس (تليف الكبد) مرض مزمن، يعني بيفضل مع المريض مدة طويلة. نسيج الكبد الطبيعي بيتشال ويتحط مكانه نسيج ليفي (ندبات) منتشر في الكبد كله، وده بيبوظ شكل الكبد ووظيفته.","تخيل حيطة طوب سليمة وكل شوية بيشيلوا طوبة ويحطوا مكانها طين؛ الحيطة شكلها وقوتها بيبوظوا. الكبد زيها بالظبط."],
["img","I2","Normal liver vs. liver with cirrhosis"],
["There are three types of cirrhosis or scarring of the liver:","التليف ده له تلات أنواع.","زي ما الصداع له أسباب كتير، التليف كمان له أسباب، وكل سبب بيطلّع نوع."],
["Alcoholic cirrhosis, in which the scar tissue characteristically surrounds the portal areas.","التليف الكحولي: الندبات بتتجمع حوالين المناطق البابية (portal areas)، يعني حوالين مدخل الدم للكبد.","زي الصدا اللي بيتجمع حوالين الحنفية، الندبات هنا بتتجمع حوالين مدخل الدم."],
["This is most frequently caused by chronic alcoholism and is the most common type of cirrhosis.","سببه الأكتر هو إدمان الكحول لفترة طويلة، وهو أكتر نوع منتشر.","لو حد سألك أشهر نوع تقوله الكحولي؛ الكبد بيشتغل ليل ونهار يتخلص من الكحول لحد ما يتعب."],
["Post necrotic cirrhosis, in which there are broad bands of scar tissue.","التليف التالي للنخر (Post necrotic): الندبات بتبقى شرايط عريضة من النسيج الليفي.","بدل نقط صغيرة، دي زي أحزمة عريضة من الندبات بتقطع الكبد."],
["This is a late result of a previous bout of acute viral hepatitis.","ده بيحصل متأخر، بعد نوبة التهاب كبدي فيروسي حاد المريض كان عدّى بيها قبل كده.","زي واحد خد العدوى من سنين وفاكر إنه خف، والكبد فضل يتندب بالراحة لحد ما النتيجة ظهرت بعد وقت طويل."],
["Biliary cirrhosis, in which scarring occurs in the liver around the bile ducts.","التليف الصفراوي (Biliary): الندبات بتحصل حوالين القنوات الصفراوية (bile ducts).","قنوات الصفرا زي مواسير؛ لو المواسير اتسدت الكبد اللي حواليها بيتندب."],
["This type of cirrhosis usually results from chronic biliary obstruction and infection (cholangitis); it is much less common than the other two types.","غالبًا بيحصل من انسداد مزمن في القنوات الصفراوية مع عدوى (التهاب القنوات الصفراوية cholangitis)، وهو أقل شيوعًا بكتير من النوعين التانيين.","اتذكرها كده: الكحولي والتالي للنخر هما الأشهر، والصفراوي هو النادر."],

["#","Pathophysiology"],
["Cirrhosis occurs with greatest frequency among people with alcoholism.","التليف بيحصل بنسبة أكبر عند مدمني الكحول.","الكحول بيعدّي على الكبد الأول، فالكبد هو اللي بيدفع التمن."],
["Other factors may play a role, including exposure to certain chemicals (carbon tetrachloride, chlorinated naphthalene, arsenic, or phosphorus) or infectious schistosomiasis.","في عوامل تانية ممكن يبقى ليها دور: التعرض لمواد كيماوية معينة (رابع كلوريد الكربون، النفثالين المكلور، الزرنيخ، الفوسفور) أو عدوى البلهارسيا.","زي واحد شغال في مصنع كيماويات من غير حماية، أو واحد عنده بلهارسيا؛ الكبد بيتأذى من الاتنين."],
["Twice as many men as women are affected, although, for unknown reasons, women are at greater risk for development of alcohol-induced liver disease.","الرجالة بيتصابوا ضعف الستات، بس الستات أكتر عرضة لأمراض الكبد الناتجة عن الكحول لأسباب مش معروفة.","اتذكر الرقم: ٢ رجالة مقابل ١ ست في الإصابة بالتليف، لكن لو الست شربت كحول فخطرها أكبر."],
["Most patients are between 40 and 60 years of age.","أغلب المرضى سنهم بين 40 و60 سنة.","اتذكر الرقمين 40 و60 كحدود الفئة العمرية الأشهر."],
["The destroyed liver cells are gradually replaced by scar tissue. Eventually, the amount of scar tissue exceeds that of the functioning liver tissue.","خلايا الكبد اللي اتدمرت بتتبدل بالتدريج بنسيج ندبات، وفي الآخر كمية النسيج الندبي بتزيد على نسيج الكبد الشغال.","زي فريق كورة بيشيلوا منه اللاعيبة الشاطرين واحد واحد ويحطوا بدالهم ناس مش بتلعب، لحد ما اللي مش بيلعب يبقوا أكتر من اللي بيلعب."],
["Be alert for the following signs and symptoms:","خلي بالك من العلامات والأعراض الجاية، وهي مقسمة لمرحلتين.","زي إشارات المرور، كل علامة بتقولك المريض في أنهي مرحلة."],
["##","Compensated"],
["Intermittent mild fever","سخونية خفيفة بتيجي وتروح.","المريض بيسخن شوية وبعدين الحرارة تنزل من غير سبب واضح."],
["Vascular spiders","عناكب وعائية: أوعية دموية صغيرة على الجلد شكلها زي رجلين العنكبوت.","تلاقي نقطة حمرا في النص وخطوط رفيعة طالعة منها زي العنكبوت."],
["Palmar erythema (reddened palms)","احمرار في كف الإيد.","تمسك إيد المريض تلاقي كفها أحمر بشكل ملحوظ."],
["Unexplained epistaxis","رعاف (نزيف من الأنف) من غير سبب واضح.","مفيش ضربة ولا برد، وفجأة مناخيره بتنزف."],
["Ankle edema","ورم (احتباس مية) في الكاحل.","آخر اليوم الجزمة تضيق عليه، ولو ضغطت على كاحله يسيب أثر."],
["Vague morning indigestion","عسر هضم مش واضح بيبقى الصبح.","يصحى حاسس بتقل في معدته من غير ما يعرف السبب."],
["Flatulent dyspepsia","عسر هضم مع غازات.","بعد الأكل بطنه تنفخ ويحس بغازات."],
["Abdominal pain","ألم في البطن.","المريض يقولك: بطني بتوجعني."],
["Firm, enlarged liver","كبد كبير وصلب.","لما تجس تحت الضلوع تحس بالكبد كبير وناشف مش طري."],
["Splenomegaly","تضخم الطحال.","الدم بيرجع على الطحال فيتنفخ."],
["##","Decompensated"],
["Ascites","استسقاء: تجمع سوائل في تجويف البطن.","بطنه تكبر زي واحد حامل بسبب السوائل اللي جواها."],
["Jaundice","يرقان: اصفرار الجلد وبياض العين.","زي لون الكركم على الجلد والعين."],
["Weakness","ضعف عام.","مش قادر يقوم يمشي ولا يعمل شغله."],
["Muscle wasting","ضمور العضلات.","دراعاته ورجليه بتنحف وعضلاته بتروح."],
["Weight loss","فقدان الوزن.","هدومه تبقى واسعة عليه من غير ما يعمل ريجيم."],
["Continuous mild fever","سخونية خفيفة مستمرة.","غير المرحلة الأولى اللي كانت بتيجي وتروح؛ هنا ثابتة ومش بتروح."],
["Clubbing of fingers","تعجّر الأصابع.","أطراف الصوابع تبقى منتفخة ومدورة زي ضهر الملعقة."],
["Purpura (due to decreased platelet count)","بقع أرجوانية على الجلد بسبب نقص عدد الصفائح الدموية.","الصفائح هي اللي بتقفل النزيف، فلما تقل تظهر بقع بنفسجي تحت الجلد."],
["Spontaneous bruising","كدمات تلقائية.","جلده يزرق من غير ما يخبط في حاجة."],
["Epistaxis","رعاف (نزيف الأنف).","دم ينزل من مناخيره."],
["Hypotension","هبوط ضغط الدم.","يدوخ، ولو قام بسرعة يحس إن الدنيا بتلف بيه."],
["Sparse body hair","قلة شعر الجسم.","شعر الجسم عنده يخف."],
["White nails","الضوافر بيضا.","ضوافره لونها أبيض بدل الوردي."],
["Gonadal atrophy","ضمور الغدد التناسلية.","الغدد التناسلية تصغر ويقل شغلها."],

["#","Diagnostic Evaluation"],
["The nurse should educate the patient about the purpose, what to expect, and any possible side effects related to these examinations prior to testing.","الممرضة لازم تشرح للمريض قبل الفحص: الغرض منه إيه، هيحصل إيه، وإيه الآثار الجانبية المحتملة.","زي ما تقول لمريض: ده فحص بيعمل كذا، هتحس بكذا، وممكن يحصل كذا بعده؛ كده يبقى مطمّن ومتعاون."],
["##","Liver Function Tests"],
["Serum aminotransferases","إنزيمات الكبد في الدم (الأمينوترانسفيريز).","لما خلايا الكبد تتعب بتطلّع الإنزيمات دي في الدم، فبنقيسها."],
["Alanine aminotransferase (ALT), aspartate aminotransferase (AST), and gamma-glutamyl transferase (GGT)","دي التلات إنزيمات: ALT وAST وGGT.","احفظ الأسماء: ALT وAST وGGT هما أشهر ٣ أرقام في تحليل وظائف الكبد."],
["Serum concentrations of proteins (albumin and globulins),","تركيز البروتينات في الدم (الألبومين والجلوبيولين).","الكبد مصنع البروتين، فلو المصنع تعب البروتين في الدم بيقل."],
["Bilirubin, ammonia, clotting factors, and lipids.","البيليروبين (الصفراء)، الأمونيا، عوامل التجلط، والدهون.","كلها حاجات الكبد بيتعامل معاها، فلو الكبد بايظ أرقامها بتتغير."],
["##","Liver Biopsy"],
["Liver biopsy is the removal of a small amount of liver tissue, usually through needle aspiration.","خزعة الكبد: بناخد كمية صغيرة من نسيج الكبد، غالبًا بإبرة شفط.","زي ما تاخد عينة صغيرة من تورتة عشان تعرف جواها إيه."],
["##","Other Diagnostic Tests"],
["Ultrasonography","موجات فوق صوتية (سونار).","فحص بيصوّر الكبد بالموجات الصوتية."],
["Computed tomography (CT) scans","الأشعة المقطعية.","بتصوّر الكبد في شرايح زي شرايح العيش."],
["Magnetic resonance imaging (MRI)","الرنين المغناطيسي.","صورة دقيقة للكبد بمغناطيس قوي."],
["All are used to identify normal structures and abnormalities of the liver and biliary tree.","كلهم بيتستخدموا عشان نشوف الأجزاء الطبيعية وغير الطبيعية في الكبد والشجرة الصفراوية (القنوات الصفراوية).","زي ما تبص على خريطة وتعرف الطرق السليمة من المقطوعة."],
["Laparoscopy (insertion of a fiberoptic endoscope through a small abdominal incision) is used to examine the liver and other pelvic structures.","منظار البطن: بندخل منظار ليفي ضوئي من فتحة صغيرة في البطن عشان نفحص الكبد وأعضاء الحوض التانية.","زي ما تدخل كاميرا صغيرة من خرم صغير وتشوف جوه من غير فتح كبير."],

["#","Clinical manifestations:"],
["##","Liver Enlargement"],
["###","Early in the course of cirrhosis,"],
["The liver tends to be large, and the cells are loaded with fat.","في الأول الكبد بيبقى كبير وخلاياه مليانة دهون.","زي بالونة منفوخة في الأول قبل ما تنكمش."],
["The liver is firm and has a sharp edge that is noticeable on palpation.","الكبد صلب وليه حرف حاد بتحسه لما تجس بإيدك.","تحط إيدك تحت الضلوع تحس بطرف حاد زي حرف الكتاب."],
["Abdominal pain may be present","ممكن يبقى فيه ألم في البطن.","المريض يقولك: بطني بتوجعني."],
["###","Later in the disease"],
["The liver decreases in size as scar tissue contracts the liver tissue.","الكبد بيصغر لأن النسيج الندبي بينكمش ويشد على نسيج الكبد.","زي الجرح لما بيلم، الندبة بتشد اللي حواليها."],
["The liver edge, if palpable, is nodular.","حرف الكبد لو اتحس بيبقى فيه عقد ونتوءات (nodular).","بدل الحرف الأملس اللي في الأول، تحس بحبيبات خشنة."],
["##","Portal Obstruction and Ascites"],
["img","I3","Ascites"],
["Portal obstruction and ascites, late manifestations of cirrhosis, are caused partly by chronic failure of liver function and partly by obstruction of the portal circulation.","انسداد الدورة البابية والاستسقاء أعراض متأخرة من التليف، سببها جزء من فشل وظيفة الكبد المزمن وجزء من انسداد الدورة البابية.","زي زحمة على كوبري: جزء من السبب إن الكبد معطل وجزء إن الطريق نفسه ضاق."],
["Almost all of the blood from the digestive organs is collected in the portal veins and carried to the liver.","تقريبًا كل الدم الجاي من الجهاز الهضمي بيتجمع في الأوردة البابية وبيروح للكبد.","الأوردة البابية زي طريق واحد بيجمع الدم من الهضمي كله وبيوديه للكبد."],
["Because a cirrhotic liver does not allow free blood passage, blood backs up into the spleen and the GI tract, and these organs become the seat of chronic passive congestion; that is, they are stagnant with blood and therefore cannot function properly.","الكبد المتليف مش بيسيب الدم يعدّي بحرية، فالدم بيرجع للطحال والجهاز الهضمي، وبيحصل فيهم احتقان سلبي مزمن؛ يعني الدم واقف فيهم فمش بيعرفوا يشتغلوا كويس.","زي ما مية الحوض تفضل راكدة لما المصرف يتسد؛ الدم بيقف في الطحال والهضمي."],
["Indigestion and altered bowel function result.","النتيجة: عسر هضم وتغير في حركة الأمعاء.","الهضمي مش شغال صح، فالمريض يعاني من الهضم والإخراج."],
["Fluid rich in protein may accumulate in the peritoneal cavity, producing ascites.","سائل غني بالبروتين ممكن يتجمع في التجويف البريتوني وده بيعمل الاستسقاء.","البروتين هو اللي بيمسك المية جوه الأوعية، لما يخرج السائل لتجويف البطن بيبقى استسقاء."],
["##","Infection and Peritonitis"],
["Bacterial peritonitis may develop in patients with cirrhosis and ascites in the absence of an intra-abdominal source of infection or an abscess.","التهاب بكتيري في الغشاء البريتوني ممكن يحصل لمرضى التليف والاستسقاء من غير ما يبقى فيه مصدر عدوى جوه البطن أو خراج.","زي واحد بيسخن من غير ما يبقى فيه جرح ولا خراج ظاهر؛ العدوى جت من مكان تاني."],
["This condition is referred to as spontaneous bacterial peritonitis (SBP).","الحالة دي اسمها التهاب الصفاق البكتيري التلقائي (SBP).","كلمة spontaneous معناها تلقائي، يعني حصل من نفسه."],
["Bacteremia due to translocation of intestinal flora is believed to be the most likely route of infection.","الأرجح إن العدوى جاية من وجود بكتيريا في الدم بسبب انتقال بكتيريا الأمعاء (translocation).","بكتيريا الأمعاء بتعدّي من جدار الأمعاء للدم ومنه للسائل."],
["Clinical signs may be absent, necessitating paracentesis for diagnosis.","ممكن مفيش علامات إكلينيكية واضحة، فلازم نعمل بزل للبطن (paracentesis) عشان نشخّص.","المريض شكله عادي، فمفيش غير إننا نسحب عينة من السائل ونحللها."],
["Antibiotic therapy is effective in the treatment and prevention of recurrent episodes of SBP.","العلاج بالمضادات الحيوية فعال في علاج SBP وفي منع رجوعه تاني.","المضاد الحيوي بيقضي على العدوى وبيحمي من رجوعها."],
["##","Gastrointestinal Varices"],
["The obstruction to blood flow through the liver caused by fibrotic changes also results in the formation of collateral blood vessels in the GI system and shunting of blood from the portal vessels into blood vessels with lower pressures.","انسداد مرور الدم في الكبد بسبب التليف بيخلّي أوعية جانبية (collateral) تتكوّن في الجهاز الهضمي، والدم بيتحول من الأوعية البابية لأوعية ضغطها أقل.","زي طريق مقفول فالعربيات تدخل شوارع جانبية؛ الدم بيدوّر على طريق بديل."],
["As a result, the patient with cirrhosis often has prominent, distended abdominal blood vessels, which are visible on abdominal inspection and distended blood vessels throughout the GI tract.","علشان كده مريض التليف غالبًا يبقى عنده أوعية دموية بارزة ومتمددة في البطن بتظهر بالنظر، وأوعية متمددة في الجهاز الهضمي كله.","تبص على بطنه تلاقي عروق باينة زي الخرايط."],
["The esophagus, stomach, and lower rectum are common sites of collateral blood vessels.","المرئ والمعدة وأسفل المستقيم أماكن شائعة للأوعية الجانبية دي.","احفظ التلاتة: المرئ، المعدة، أسفل المستقيم."],
["These distended blood vessels form varices or hemorrhoids, depending on their location.","الأوعية المتمددة دي بتكوّن دوالي أو بواسير حسب مكانها.","لو في المرئ أو المعدة تبقى دوالي، ولو في أسفل المستقيم تبقى بواسير."],
["Because these vessels were not intended to carry the high pressure and volume of blood imposed by cirrhosis, they may rupture and bleed.","الأوعية دي مش معمولة تشيل الضغط العالي وحجم الدم الكبير اللي بسبب التليف، فممكن تنفجر وتنزف.","زي خرطوم رفيع وصّلته على مية بضغط عالي، هينفجر."],
["Therefore, assessment must include observation for occult and frank bleeding from the GI tract.","علشان كده التقييم لازم يشمل مراقبة النزيف الخفي (occult) والنزيف الواضح (frank) من الجهاز الهضمي.","الخفي مش بتشوفه بعينك، والواضح تشوفه، فبتدوّر على الاتنين."],
["##","Edema"],
["Edema is a late symptom of cirrhosis, which is attributed to chronic liver failure.","الورم (الاستسقاء الطرفي) عرض متأخر من التليف، وسببه فشل الكبد المزمن.","ميجيش في أول المرض، لكن لما الكبد يفشل تدريجيًا."],
["A reduced plasma albumin concentration predisposes the patient to the formation of edema.","قلة الألبومين في بلازما الدم بتخلي المريض عرضة للورم.","الألبومين بيشد المية جوه الأوعية، فلما يقل المية بتطلع بره."],
["Although edema is generalized, it often affects the lower extremities, the upper extremities, and the presacral area.","الورم بيبقى عام، بس غالبًا بيظهر في الأطراف السفلية والعلوية ومنطقة أمام العجز (presacral).","رجليه ودراعاته وأسفل ضهره بيتورموا أكتر."],
["##","Vitamin Deficiency and Anemia"],
["Because of inadequate formation, use, and storage of certain vitamins (notably vitamins A, C, and K), signs of deficiency are common, particularly hemorrhagic phenomena associated with vitamin K deficiency.","الكبد مش بيكوّن ولا بيستخدم ولا بيخزن فيتامينات معينة كويس (خصوصًا A وC وK)، فعلامات النقص شائعة، وأهمها ظواهر النزيف المرتبطة بنقص فيتامين K.","فيتامين K بيساعد التجلط، فلو قل المريض ينزف بسهولة."],
["The patient’s anemia, poor nutritional status, and poor state of health result in severe fatigue, which interferes with the ability to carry out routine activities of daily living (ADLs).","الأنيميا وسوء التغذية وسوء الحالة الصحية بيسببوا إرهاق شديد، وده بيعطل قدرة المريض على أنشطة حياته اليومية (ADLs).","زي واحد مش قادر ياخد دش ولا يلبس هدومه لوحده من التعب."],
["##","Mental Deterioration"],
["Deterioration of mental and cognitive function with impending hepatic encephalopathy and hepatic coma.","تدهور في الوظائف العقلية والإدراكية مع قرب حدوث اعتلال الدماغ الكبدي (hepatic encephalopathy) والغيبوبة الكبدية.","المريض ذهنه يشتت ويتلخبط، وده إنذار إنه قرب يدخل غيبوبة."],
["Neurologic assessment is indicated, including assessment of the patient’s general behavior, cognitive abilities, orientation to time and place, and speech patterns.","لازم تقييم عصبي، ويشمل تقييم سلوك المريض العام وقدراته الإدراكية وتوجهه للزمان والمكان وطريقة كلامه.","اسأله: إنت فين؟ النهاردة إيه؟ وسمع كلامه ماشي صح ولا لأ."],

["#","Medical Management"],
["The management of the patient with cirrhosis is usually based on the presenting symptoms.","علاج مريض التليف بيبقى غالبًا على حسب الأعراض اللي ظاهرة عليه.","زي الدكتور اللي يديك دوا للصداع لو صداع وللمغص لو مغص."],
["Antacids or histamine-2 (H2) antagonists are prescribed to decrease gastric distress and minimize the possibility of GI bleeding.","مضادات الحموضة أو مضادات الهيستامين-2 (H2) بتتوصف عشان تقلل اضطراب المعدة وتقلل احتمال نزيف الجهاز الهضمي.","بتقلل حموضة المعدة فمبيحصلش تهيج ونزيف."],
["Vitamins and nutritional supplements promote healing of damaged liver cells and improve the patient’s general nutritional status.","الفيتامينات والمكملات الغذائية بتساعد على شفاء خلايا الكبد التالفة وتحسّن الحالة الغذائية العامة للمريض.","تغذية خلايا الكبد زي ما بتسقي زرع دبلان."],
["Potassium-sparing diuretics such as spironolactone or triamterene (Dyrenium) may be indicated to decrease ascites, if present.","مدرات البول الحافظة للبوتاسيوم زي سبيرونولاكتون أو تريامتيرين (Dyrenium) ممكن تتحدد لتقليل الاستسقاء لو موجود.","بتخلي الجسم يتخلص من المية والملح من غير ما يضيّع البوتاسيوم."],
["An adequate diet and avoidance of alcohol are essential.","النظام الغذائي الكافي وتجنب الكحول حاجة أساسية.","من غير أكل صح وبعد عن الكحول، أي علاج مش هينفع."],
["Medications possess antifibrotic activity for the treatment of cirrhosis, as angiotensin system inhibitors, statins, diuretics, immunosuppressants, and Glitazones.","في أدوية ليها نشاط مضاد للتليف لعلاج التليف: مثبطات نظام الأنجيوتنسين، الستاتينات، مدرات البول، مثبطات المناعة، والجليتازونات.","الأدوية دي بتحاول تبطّأ تكوّن الندبات: مثبطات الأنجيوتنسين، ستاتين، مدرات، مثبطات مناعة، جليتازونات."],

["#","Nursing Management"],
["Nursing interventions are directed toward promoting patient’s rest, improving nutritional status, providing skin care, reducing risk of injury, and monitoring and managing potential complications.","تدخلات التمريض موجهة لـ: راحة المريض، تحسين التغذية، العناية بالجلد، تقليل خطر الإصابات، ومراقبة وإدارة المضاعفات المحتملة.","٥ محاور: راحة، تغذية، جلد، إصابات، مضاعفات."],
["##","Promoting Rest"],
["The patient with cirrhosis requires rest and other supportive measures to permit the liver to reestablish its functional ability.","مريض التليف محتاج راحة وإجراءات داعمة تانية عشان الكبد يسترجع قدرته على الشغل.","زي ما تدي موتور مرهق فرصة يرتاح."],
["If the patient is hospitalized, weight and fluid intake and output are measured and recorded daily.","لو المريض في المستشفى، الوزن والسوائل الداخلة والخارجة بتتقاس وتتسجل يوميًا.","كل يوم تزنه وتسجل شرب إيه وبيتبول كام."],
["The nurse adjusts the patient’s position in bed for maximal respiratory efficiency.","الممرضة بتظبط وضع المريض في السرير عشان أقصى كفاءة تنفس.","ترفع راسه بوضع بيخليه يتنفس أحسن."],
["Oxygen therapy may be required in liver failure to oxygenate the damaged cells and prevent further cell destruction.","ممكن يتطلب علاج بالأكسجين في فشل الكبد عشان نأكسج الخلايا التالفة ونمنع تدمير الخلايا أكتر.","الأكسجين بيوصل للخلايا التعبانة فميتدمرش منها أكتر."],
["Rest reduces the demands on the liver and increases the liver’s blood supply.","الراحة بتقلل الطلب على الكبد وبتزود إمداده بالدم.","لما المريض يرتاح الكبد بيتحمل شغل أقل ويجيله دم أكتر."],
["Because the patient is susceptible to the hazards of immobility, efforts to prevent respiratory, circulatory, and vascular disturbances are initiated.","المريض عرضة لمخاطر قلة الحركة، فبنبدأ إجراءات تمنع الاضطرابات التنفسية والدورانية والوعائية.","اللي بيفضل نايم كتير بتحصله مشاكل في الصدر والدم والأوعية."],
["These measures may help prevent such problems as pneumonia, thrombophlebitis, and pressure ulcers.","الإجراءات دي ممكن تساعد في منع مشاكل زي الالتهاب الرئوي والتهاب الوريد الخثاري وقرح الضغط.","الالتهاب الرئوي، جلطة والتهاب في الوريد، وقرح الفراش؛ دول التلاتة اللي بنمنعهم."],
["After nutritional status improves and strength increases, the nurse encourages the patient to increase activity gradually.","بعد ما التغذية تتحسن والقوة تزيد، الممرضة بتشجع المريض يزود نشاطه بالتدريج.","متخليهوش يجري مرة واحدة، شوية شوية."],
["Activity and mild exercise, as well as rest, are planned.","النشاط والتمارين الخفيفة وكمان الراحة بيتخططوا.","جدول متوازن: حركة خفيفة وراحة."],
["##","Improving Nutritional Status"],
["The patient with cirrhosis without ascites, edema, or signs of impending hepatic coma should receive a nutritious, high-protein diet, if tolerated, supplemented by vitamins of the B complex, as well as A, C, and K.","مريض التليف من غير استسقاء ولا ورم ولا علامات قرب غيبوبة كبدية لازم ياخد غذاء مغذي عالي البروتين لو بيتحمله، ومعاه فيتامينات ب المركب وكمان A وC وK.","لو الحالة مستقرة، بروتين عالي وفيتامينات ب وA وC وK."],
["The nurse encourages the patient to eat.","الممرضة بتشجع المريض ياكل.","تحفزه وتقعد معاه وقت الأكل."],
["If ascites is present, small, frequent meals may be better tolerated than three large meals because of the abdominal pressure exerted by ascites.","لو في استسقاء، وجبات صغيرة ومتكررة ممكن تتحمل أحسن من تلات وجبات كبيرة بسبب ضغط الاستسقاء على البطن.","البطن مليانة سوائل فمفيهاش مكان لوجبة كبيرة، فتاكل شوية شوية."],
["Patient preferences are considered.","بنراعي تفضيلات المريض.","اسأله بيحب ياكل إيه."],
["Patients with prolonged or severe anorexia and those who are vomiting or eating poorly for any reason may receive nutrients by the enteral or parenteral route.","المرضى اللي عندهم فقدان شهية طويل أو شديد، واللي بيرجعوا أو مش بياكلوا كويس لأي سبب، ممكن ياخدوا الغذاء بالطريق المعوي أو الوريدي.","لو مش بيعرف ياكل بالفم، التغذية توصله بأنبوب أو بالوريد."],
["Patients with fatty stools (steatorrhea) should receive water-soluble forms of fat-soluble vitamins A, D, and E (Aquasol A, D, and E).","المرضى اللي برازهم دهني (steatorrhea) لازم ياخدوا الأشكال الذائبة في الماء من الفيتامينات الذائبة في الدهون A وD وE (Aquasol A, D, E).","لو جسمه مش بيمتص الدهون، بنديه الفيتامين في صورة بتدوب في المية."],
["Folic acid and iron are prescribed to prevent anemia.","حمض الفوليك والحديد بيتوصفوا لمنع الأنيميا.","لو الحديد والفوليك ناقصين الأنيميا بتحصل."],
["If the patient shows signs of impending or advancing coma, the amount of protein in the diet is decreased temporarily.","لو ظهرت علامات قرب أو تقدم الغيبوبة، كمية البروتين في الأكل بتتقلل مؤقتًا.","البروتين بيطلع أمونيا، فلو الغيبوبة قربت بنقلله لفترة."],
["Protein is restricted if encephalopathy develops.","البروتين بيتقيّد لو حصل اعتلال دماغي.","لو الدماغ تعب، بنحدد البروتين."],
["Incorporating vegetable protein to meet protein needs may decrease the risk for encephalopathy.","إدخال البروتين النباتي لتلبية احتياج البروتين ممكن يقلل خطر الاعتلال الدماغي.","بدل اللحمة، فول وعدس وخضار بروتين."],
["Sodium restriction is also indicated to prevent ascites.","تقليل الصوديوم كمان مطلوب لمنع الاستسقاء.","الملح بيمسك المية، فنقلله."],
["##","Providing Skin Care"],
["Providing careful skin care is important because of subcutaneous edema, the patient’s immobility, jaundice, and increased susceptibility to skin breakdown and infection.","العناية الدقيقة بالجلد مهمة بسبب الورم تحت الجلد، وقلة حركة المريض، واليرقان، وزيادة قابلية الجلد للتهتك والعدوى.","جلده ضعيف وحساس، فبنهتم بيه جدًا."],
["Frequent changes in position are necessary to prevent pressure ulcers.","تغيير الوضع كتير ضروري لمنع قرح الضغط.","اقلبه كل شوية عشان الجلد ميتقرحش."],
["Irritating soaps and the use of adhesive tape are avoided to prevent trauma to the skin.","بنتجنب الصابون المهيج واستخدام الشريط اللاصق عشان نمنع إصابة الجلد.","استخدم صابون لطيف وبلاش لزق."],
["Lotion may be soothing to irritated skin; the nurse takes measures to minimize scratching by the patient.","اللوشن ممكن يهدّي الجلد المتهيج، والممرضة بتاخد إجراءات لتقليل حك المريض لجلده.","كريم مرطب يهدي الحكة، وقص ضوافره عشان ميجرحش نفسه."],
["##","Reducing Risk of Injury"],
["The nurse protects the patient with cirrhosis from falls and other injuries.","الممرضة بتحمي مريض التليف من الوقوع والإصابات التانية.","اتأكد إن الأرضية آمنة ومحدش يتعثر."],
["The side rails should be in place and padded with blankets or other materials in case the patient becomes agitated or restless.","الحواجز الجانبية للسرير لازم تبقى مرفوعة ومبطنة ببطاطين أو مواد تانية لو المريض اتهيج أو بقى قلقان.","لو خبط بإيده في الحاجز مش هيتأذى."],
["To minimize agitation, the nurse orients the patient to time and place and explains all procedures.","لتقليل التهيج، الممرضة بتعرّف المريض بالزمان والمكان وبتشرحله كل الإجراءات.","قوله: إنت في المستشفى والنهاردة كذا، وهعمل كذا."],
["The nurse instructs the patient to ask for assistance to get out of bed.","الممرضة بتوجه المريض إنه يطلب مساعدة لما يقوم من السرير.","قوله ينده عليك قبل ما يقوم لوحده."],
["The nurse carefully evaluates any injury because of the possibility of internal bleeding.","الممرضة بتقيّم أي إصابة بحرص بسبب احتمال النزيف الداخلي.","أي خبطة بسيطة ممكن تبقى نزيف جوه."],
["Because of the risk for bleeding from abnormal clotting, the patient should use an electric razor rather than a safety razor.","بسبب خطر النزيف من التجلط غير الطبيعي، المريض لازم يستخدم ماكينة حلاقة كهربائية بدل الموس العادي.","الموس العادي ممكن يجرح وينزف."],
["A soft-bristled toothbrush helps minimize bleeding gums, and pressure applied to all venipuncture sites helps minimize bleeding.","فرشة أسنان ناعمة بتقلل نزيف اللثة، والضغط على كل أماكن وخز الوريد بيقلل النزيف.","بعد سحب الدم أو الكانيولا اضغط كويس."],
["##","Monitoring and Managing Potential Complications"],
["A major role of the nurse is monitoring of the patient with cirrhosis for complications.","من أهم أدوار الممرضة مراقبة مريض التليف لاكتشاف المضاعفات.","عينك عليه عشان تلحق أي مضاعفة بدري."],
["###","Bleeding and Hemorrhage"],
["The patient is at increased risk for bleeding and hemorrhage because of decreased production of prothrombin and decreased ability of the diseased liver to synthesize the necessary substances for blood coagulation.","المريض عنده خطر أعلى للنزيف بسبب نقص إنتاج البروثرومبين، وضعف قدرة الكبد المريض على تكوين المواد اللازمة لتجلط الدم.","الكبد هو مصنع عوامل التجلط، لو المصنع بايظ الدم مش بيقف."],
["###","Hepatic Encephalopathy"],
["Hepatic encephalopathy and coma, complications of cirrhosis, may manifest as deteriorating mental status and dementia or as physical signs such as abnormal voluntary and involuntary movements.","الاعتلال الدماغي الكبدي والغيبوبة من مضاعفات التليف، وممكن يظهروا كتدهور في الحالة العقلية وخرف، أو كعلامات جسدية زي حركات إرادية وغير إرادية غير طبيعية.","ممكن يتلخبط، أو إيده ترتعش وحركاته تبقى غريبة."],
["Monitoring is an essential nursing function to identify early deterioration in mental status.","المراقبة وظيفة تمريضية أساسية لاكتشاف تدهور الحالة العقلية بدري.","كل ما تلحق التغيير بدري، العلاج أسرع."],
["An extensive neurologic evaluation is key to identify progression through the four stages of encephalopathy.","التقييم العصبي الشامل هو المفتاح لاكتشاف التقدم خلال المراحل الأربع للاعتلال الدماغي.","الاعتلال له ٤ مراحل، والتقييم بيقولك المريض وصل لأنهي مرحلة."],
["Because electrolyte disturbances can contribute to encephalopathy, serum electrolyte levels are carefully monitored and corrected if abnormal.","لأن اضطرابات الأملاح ممكن تساهم في الاعتلال الدماغي، بتتراقب مستويات الأملاح في الدم بحرص وبتتصحح لو مش طبيعية.","لو الصوديوم أو البوتاسيوم اتغيروا، المخ بيتأثر."],
["Oxygen is administered if oxygen desaturation occurs.","الأكسجين بيتدي لو حصل هبوط في تشبع الأكسجين.","لو نسبة الأكسجين في الدم نزلت نديله أكسجين."],
["###","Fluid Volume Excess"],
["Patients with advanced chronic liver disease develop cardiovascular abnormalities.","المرضى اللي عندهم مرض كبدي مزمن متقدم بيحصلهم اضطرابات في القلب والأوعية.","الكبد لما يتعب جدًا بيأثر على القلب والدورة الدموية."],
["These occur due to an increased cardiac output and decreased peripheral vascular resistance, possibly resulting from the release of vasodilators.","ده بيحصل بسبب زيادة النتاج القلبي ونقص المقاومة الوعائية الطرفية، وده ممكن يكون ناتج من إفراز مواد موسعة للأوعية.","القلب بيضخ أكتر والأوعية بتتوسع، فبيحصل اضطراب في توازن السوائل."],

["#","Ascites"],
["##","Pathophysiology"],
["As a result of liver damage, large amounts of albumin-rich fluid, 20 L or more, may accumulate in the peritoneal cavity as ascites.","نتيجة تلف الكبد، كميات كبيرة من سائل غني بالألبومين، ٢٠ لتر أو أكتر، ممكن تتجمع في التجويف البريتوني كاستسقاء.","٢٠ لتر دول زي عشرين إزازة مية كبيرة جوه البطن."],
["With the movement of albumin from the serum to the peritoneal cavity, the osmotic pressure of the serum decreases.","مع انتقال الألبومين من مصل الدم لتجويف البريتون، الضغط الأسموزي للمصل بيقل.","الألبومين بيمسك المية في الدم، فلما يخرج الدم مبقاش يمسكها."],
["This, combined with increased portal pressure, results in movement of fluid into the peritoneal cavity","ده مع زيادة الضغط البابي بيؤدي لانتقال السائل لتجويف البريتون.","واحد بيشد المية من جوه (قلة الألبومين) وواحد بيزقها بره (ضغط الباب)، فتطلع للبطن."],
["##","Clinical Manifestations"],
["Increased abdominal girth","زيادة محيط البطن.","مقاس الوسط يكبر."],
["Weight gain","زيادة الوزن.","الوزن يزيد بسبب السوائل."],
["The patient may be short of breath","المريض ممكن يحس بضيق نفس.","البطن الكبيرة بتضغط على الحجاب الحاجز."],
["The patient uncomfortable","المريض بيبقى مش مرتاح.","مش عارف يقعد ولا ينام مرتاح."],
["Striae and distended veins may be visible over the abdominal wall","ممكن تظهر خطوط تمدد (striae) وأوردة متمددة على جدار البطن.","جلد البطن بيتمدد زي الحامل وتبان العروق."],
["Umbilical hernias also occur frequently in those patients with cirrhosis.","فتق سري كمان بيحصل كتير في مرضى التليف.","السرة بتبقى بارزة بسبب الضغط."],
["Fluid and electrolyte imbalances are common.","اضطرابات السوائل والأملاح شائعة.","السوائل والأملاح في الجسم بتتلخبط."],
["##","Assessment and Diagnostic Findings"],
["The presence and extent of ascites are assessed by percussion of the abdomen.","وجود الاستسقاء وحجمه بيتقيّموا عن طريق القرع على البطن.","بتخبط بصوابعك على البطن وتسمع الصوت."],
["When fluid has accumulated in the peritoneal cavity, the flanks bulge when the patient assumes a supine position.","لما السائل يتجمع في التجويف البريتوني، الخواصر بتنتفخ لما المريض يبقى على ضهره.","لما ينام على ضهره جنبيه بيتبعجوا."],
["The presence of fluid can be confirmed either by percussing for shifting dullness, by detecting a fluid wave.","وجود السائل ممكن يتأكد إما بالقرع للبحث عن الصمم المتحرك (shifting dullness)، أو باكتشاف الموجة السائلة (fluid wave).","ممكن تتأكد بطريقتين: القرع أو الموجة السائلة."],
["A fluid wave is likely to be found only if a large amount of fluid is present.","الموجة السائلة غالبًا بتتلاقي بس لو كمية السائل كبيرة.","لو السائل قليل مش هتحس بموجة."],
["Daily measurement and recording of abdominal girth and body weight are essential to assess the progression of ascites and its response to treatment.","القياس والتسجيل اليومي لمحيط البطن ووزن الجسم ضروري لتقييم تقدم الاستسقاء واستجابته للعلاج.","كل يوم قيس وسجل عشان تعرف بيزيد ولا بيقل."],
["##","Medical Management"],
["The medical management of the patient with ascites includes dietary modifications, pharmacologic therapy, bed rest, paracentesis, the use of shunts, and other therapies.","العلاج الطبي لمريض الاستسقاء بيشمل تعديلات غذائية، علاج دوائي، راحة في السرير، بزل البطن، استخدام التحويلات (shunts)، وعلاجات تانية.","دي أدوات العلاج: أكل، دوا، راحة، بزل، shunts."],
["###","Nutritional Therapy"],
["The goal of treatment for the patient with ascites is a negative sodium balance to reduce fluid retention.","هدف علاج الاستسقاء هو ميزان صوديوم سالب لتقليل احتباس السوائل.","يعني الصوديوم اللي بيخرج أكتر من اللي بيدخل."],
["Table salt, salty foods, salted butter and margarine, and all canned and frozen foods that are not specifically prepared for low-sodium (2-g sodium) diets should be avoided.","ملح الطعام والأكل المالح والزبدة والمارجرين المملحين وكل الأكل المعلب والمجمد اللي مش متحضر خصيصًا لنظام قليل الصوديوم (٢ جرام صوديوم) لازم يتجنبوا.","ابعد عن الملح، الأكل المعلب، والمجمد."],
["It may take 2 to 3 months for the patient’s taste buds to adjust to unsalted foods.","ممكن ياخد من شهرين لتلاتة عشان حاسة التذوق عند المريض تتعود على الأكل من غير ملح.","لسانه هيتعود بعد شهرين تلاتة."],
["In the meantime, the taste of unsalted foods can be improved by using salt substitutes such as lemon juice, oregano, and thyme.","في الوقت ده، طعم الأكل من غير ملح ممكن يتحسن باستخدام بدائل الملح زي عصير الليمون والأوريجانو والزعتر.","حط ليمون وزعتر على الأكل بدل الملح."],
["###","Possible complications of diuretic therapy include:"],
["Fluid and electrolyte disturbances including :","اضطرابات السوائل والأملاح، منها:","المدرات بتخلي المريض يفقد سوائل وأملاح كتير."],
["Hypovolemia","نقص حجم الدم.","سوائل أقل في الجسم."],
["Hypokalemia","نقص البوتاسيوم.","البوتاسيوم بيخرج مع البول."],
["Hyponatremia","نقص الصوديوم.","الصوديوم في الدم يقل."],
["Hypochloremic alkalosis","قلوية ناتجة عن نقص الكلور.","الكلور بيقل ودم المريض يبقى قلوي."],
["Encephalopathy.","اعتلال دماغي.","المخ يتأثر."],
["Encephalopathy may be precipitated by dehydration and hypovolemia.","الاعتلال الدماغي ممكن يتسبب فيه الجفاف ونقص حجم الدم.","لو المريض اتجفف، المخ يتعب."],
["In addition, when potassium stores are depleted, the amount of ammonia in the systemic circulation increases, which may cause impaired cerebral functioning and encephalopathy.","كمان لما مخزون البوتاسيوم يخلص، كمية الأمونيا في الدورة الدموية العامة بتزيد، وده ممكن يضعف وظيفة المخ ويسبب الاعتلال الدماغي.","البوتاسيوم لما يقل الأمونيا تزيد، والأمونيا بتسمم المخ."],
["###","Management:"],
["Paracentesis","بزل البطن.","أول وسيلة علاجية."],
["Paracentesis is the removal of fluid (ascites) from the peritoneal cavity through a puncture or a small surgical incision through the abdominal wall under sterile conditions.","بزل البطن هو سحب السائل (الاستسقاء) من التجويف البريتوني عن طريق وخزة أو شق جراحي صغير في جدار البطن تحت ظروف معقمة.","زي ما تسحب المية من بالونة بإبرة، بس بتعقيم تام."],
["Paracentesis was once considered a routine form of treatment for ascites.","زمان كان البزل بيتعتبر علاج روتيني للاستسقاء.","كان الأسلوب المعتاد قبل كده."],
["A sample of the ascitic fluid may be sent to the laboratory for cell count, albumin and total protein levels, culture, and other tests.","ممكن تتبعت عينة من السائل للمعمل لعد الخلايا ومستويات الألبومين والبروتين الكلي والمزرعة وفحوصات تانية.","العينة بتقولنا فيه عدوى ولا لأ."],
["Large-volume (5 to 6 L) paracentesis has been shown to be a safe method for treating patients with severe ascites.","بزل الحجم الكبير (٥ لـ ٦ لتر) ثبت إنه طريقة آمنة لعلاج المرضى اللي عندهم استسقاء شديد.","٥ لـ ٦ لتر مرة واحدة آمن."],
["This technique, in combination with the IV infusion of salt poor albumin or other colloid, has become a standard management strategy yielding an immediate effect.","التقنية دي مع إعطاء ألبومين قليل الملح أو كولويد تاني بالوريد بقت استراتيجية علاج قياسية وبتدي نتيجة فورية.","اسحب السائل وعوّضه بألبومين."],
["Albumin infusions help to correct decreases in effective arterial blood volume that lead to sodium retention.","محاليل الألبومين بتساعد في تصحيح النقص في حجم الدم الشرياني الفعال اللي بيؤدي لاحتباس الصوديوم.","الألبومين بيرفع حجم الدم الفعال فالجسم ميمسكش صوديوم."],
["The beneficial effects of albumin administration on hemodynamic stability and renal functional status may be related to an improvement in cardiac function as well as a decrease in the degree of arterial vasodilation.","الفوايد من إعطاء الألبومين على ثبات الدورة الدموية ووظيفة الكلى ممكن تكون بسبب تحسن وظيفة القلب وكمان نقص درجة توسع الشرايين.","قلب أقوى وشرايين أقل توسعًا، فالضغط والكلى بيتحسنوا."],
["##","Nursing Management"],
["If a patient with ascites from liver dysfunction is hospitalized, nursing measures","لو مريض الاستسقاء الناتج عن خلل الكبد داخل المستشفى، فالإجراءات التمريضية هي:","دي المهام اللي هتعملها."],
["Assessment and documentation of intake and output (I&O)","تقييم وتوثيق السوائل الداخلة والخارجة (I&O).","اكتب كل اللي شربه واللي طلع منه."],
["Abdominal girth, and daily weight to assess fluid status","محيط البطن والوزن اليومي لتقييم حالة السوائل.","قيس الوسط والوزن كل يوم."],
["The nurse also closely monitors the respiratory status","الممرضة كمان بتراقب الحالة التنفسية عن قرب.","البطن الكبيرة ممكن تضيّق نفسه."],
["The nurse monitors serum ammonia, creatinine, and electrolyte levels","الممرضة بتراقب مستويات الأمونيا والكرياتينين والأملاح في المصل.","الأمونيا للمخ، الكرياتينين للكلى، والأملاح للتوازن."],
["##","Promoting Home and Community-Based Care"],
["###","Educating Patients About Self-Care"],
["The patient treated for ascites is likely to be discharged with some ascites still present.","غالبًا المريض اللي اتعالج من الاستسقاء بيتخرج وفضل عنده شوية استسقاء.","هيروح البيت والمرض لسه عنده شوية."],
["Before hospital discharge, the nurse educates the patient and family about the treatment plan including","قبل خروج المريض من المستشفى، الممرضة بتثقف المريض والأسرة عن خطة العلاج، وتشمل:","التعليم قبل الخروج مهم عشان يكمل في البيت صح."],
["The need to avoid all alcohol intake","ضرورة تجنب أي كحول.","ولا نقطة كحول."],
["Adhere to a low sodium diet","الالتزام بنظام غذائي قليل الصوديوم.","قلل الملح."],
["Take medications as prescribed","أخذ الأدوية زي ما اتوصفت.","الجرعات والمواعيد زي ما الدكتور قال."],
["Check with the primary provider before taking any new medications","استشارة مقدم الرعاية الأساسي قبل أخذ أي أدوية جديدة.","متاخدش أي دوا جديد من دماغك."]
];

  else if(r[0]==='##') html+=`<div class="h2">${esc(r[1])}</div>`;

  else if(r[0]==='img') html+=`<div class="fig"><img src="${IMGS[r[1]]}" alt="${esc(r[2])}"><span>${esc(r[2])}</span></div>`;
  else { n++; html+=`<div class="item"><div class="en">${esc(r[0])}</div><div class="ar">${esc(r[1])}</div><div class="ex"><b>💡 عشان تفهمها:</b> ${esc(r[2])}</div></div>`; }
});

setT(t);btn.onclick=()=>{t=t==='dark'?'light':'dark';setT(t)};
