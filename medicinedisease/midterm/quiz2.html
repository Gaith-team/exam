<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--teal:#be123c;--teal-d:#881337;--blue:#f3eaec;--bd:#e3d3d7;--ok:#15803d;--no:#dc2626;--rev:#1d4ed8;--txt:#2a1519;--grad:linear-gradient(135deg,#9f1239 0%,#be123c 30%,#5b21b6 70%,#1e3a8a 100%)}
body{font-family:'Outfit',Arial,sans-serif;background:#faf6f6;color:var(--txt);font-size:14px}
header{background:var(--grad);color:#fff;text-align:center;padding:12px;font-size:18px;font-weight:900;position:relative}
header .brand{position:absolute;right:16px;top:8px;font-weight:bold;font-size:14px}
header a{position:absolute;left:16px;top:11px;color:#fff;font-size:13px;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:8px 10px 20px}
.topinfo{background:var(--blue);border:1px solid var(--bd);padding:4px 8px;font-size:13px;margin-bottom:8px}
.topinfo b{color:var(--teal)}
.layout{display:grid;grid-template-columns:1fr 240px;gap:14px;align-items:start}
.main{background:#fff;border:1px solid var(--bd);min-height:470px;display:flex;flex-direction:column;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='70'><text x='8' y='45' transform='rotate(-20 75 35)' font-size='14' font-family='Arial' fill='%23000' fill-opacity='.07'>GHAITH TEAM</text></svg>")}
.qhead{display:flex;justify-content:space-between;align-items:center;padding:12px 6px 6px;margin:0 6px;border-bottom:1px solid var(--bd)}
.qhead b{font-size:13px}
.fs button{background:#1d4ed8;color:#fff;border:0;padding:6px 12px;margin-left:3px;border-radius:2px;cursor:pointer;font-weight:bold}
.qbody{padding:8px 12px;flex:1}
.qtext{font-size:13px;line-height:1.7;margin-bottom:18px;direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:8px;margin:0 0 16px;cursor:pointer;direction:ltr;text-align:left;font-size:13px}
.opt input{accent-color:var(--teal);cursor:pointer}
.bar{display:flex;justify-content:space-between;padding:10px;gap:6px;flex-wrap:wrap;border-top:1px solid var(--bd);margin:0 6px 6px}
.b{background:var(--grad);color:#fff;border:0;padding:9px 12px;font-weight:bold;font-size:13px;border-radius:2px;cursor:pointer}
.b:hover{filter:brightness(1.12)}
.b.gray{background:#2a1519}
.side>div{background:var(--blue);border:1px solid var(--bd);margin-bottom:10px;padding:8px}
.timer{text-align:center;background:none!important;border:0!important}
.timer small{font-size:13px}
.timer .t{font-size:30px;color:#1d4ed8;margin-top:4px}
.timer .t.warn{color:#c27b0a}.timer .t.danger{color:#c8372d}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:8px 6px;font-size:10px;margin-top:8px}
.leg div{display:flex;align-items:center;gap:6px}
.sq{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:bold;border-radius:2px;border:1px solid transparent}
.s-ans{background:var(--ok)}.s-no{background:#d97706}.s-rev{background:var(--rev)}.s-nv{background:#fff;color:#333;border-color:#9bb0a2}
.nav{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;background:#f3eaec}
.nav .sq{width:24px;height:24px;cursor:pointer;font-size:12px}
.nav .cur{outline:2px solid #2a1519;outline-offset:0}
.endrow{text-align:center}
.endrow .b{width:90px}
footer{text-align:center;padding:16px;font-size:12px;color:#5b4348;background:#f3eaec;border-top:1px solid #e3d3d7;margin-top:10px}
footer a{color:#229ED9;text-decoration:none}
/* results */
.res{background:#fff;border:1px solid var(--bd);padding:20px;max-width:900px;margin:10px auto}
.score{text-align:center;padding:10px 0 18px}
.score .n{font-size:48px;font-weight:900;color:var(--teal)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--blue);padding:10px;text-align:center;border-radius:4px}
.stats b{display:block;font-size:20px}
.sec{background:var(--ok);color:#fff;padding:8px 12px;font-weight:bold;margin:22px 0 10px}
.sec.bad{background:var(--no)}
.it{border:1px solid var(--bd);border-left:4px solid var(--ok);padding:12px;margin-bottom:8px;background:#fafcff;direction:ltr;text-align:left}
.it.bad{border-left-color:var(--no)}
.it .q{font-weight:bold;font-size:13px;margin-bottom:6px;line-height:1.6}
.it .r{font-size:12px;margin-top:4px}
.tag{padding:1px 7px;border-radius:3px;color:#fff;font-size:11px;font-weight:bold;margin-right:6px}
.tag.y{background:var(--no)}.tag.g{background:var(--ok)}
.exp{font-size:12px;color:#555;margin-top:6px;background:#eef6f4;padding:6px 8px;border-radius:3px}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.hide{display:none}
@media(max-width:820px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}header a{display:none}}
.qtext img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:8px;background:#fff}
.it .q img{max-height:90px;display:block;margin:6px 0;border-radius:6px}
</style>
</head>
<body>
<header><a href="https://gaith-team.github.io/exam/">← رجوع</a>Medicine disease<span class="brand">GHAITH TEAM</span></header>
<div class="wrap">
 <div id="exam">
  <div class="topinfo">Total questions in exam: <b id="tot">0</b> | Answered: <b id="ans">0</b></div>
  <div class="layout">
   <div class="main">
    <div class="qhead"><b id="qno"></b><div class="fs"><button onclick="fs(-1)">A-</button><button onclick="fs(0)">A</button><button onclick="fs(1)">A+</button></div></div>
    <div class="qbody" id="qbody"></div>
    <div class="bar">
     <button class="b" onclick="saveNext()">Save &amp; Next</button>
     <div style="display:flex;gap:4px;flex-wrap:wrap">
      <button class="b" onclick="mark()">Mark for Review</button>
      <button class="b" onclick="skip()">Skip</button>
      <button class="b" onclick="resetQ()">Reset</button>
     </div>
    </div>
   </div>
   <div class="side">
    <div class="timer"><small>Time Remaining</small><div class="t" id="tm">40:00</div></div>
    <div>
     <div>Number of questions : <b id="tot2">0</b></div>
     <div class="leg">
      <div><span class="sq s-ans" id="cAns">0</span>Answered</div>
      <div><span class="sq s-no" id="cNo">0</span>Not Answered</div>
      <div><span class="sq s-rev" id="cRev">0</span>For Review</div>
      <div><span class="sq s-nv" id="cNv">0</span>Not Visited</div>
     </div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="endrow"><button class="b gray" onclick="endTest()">End Test</button></div>
   </div>
  </div>
 </div>
 <div id="result" class="hide"></div>
</div>
<footer>GHAITH TEAM · <a href="https://t.me/nursing2bu" target="_blank">@nursing2bu</a></footer>

<script>
const QUESTIONS = [
{t:"Blood pressure is the product of:",o:["Heart rate × stroke volume","Cardiac output × peripheral resistance","Stroke volume ÷ heart rate","Blood volume × heart rate"],a:1},
{t:"According to JNC 7, normal blood pressure is:",o:["<120 and <80 mm Hg","<130 and <85 mm Hg","<140 and <90 mm Hg","<110 and <70 mm Hg"],a:0},
{t:"Which of the following is a cause of acute gastritis?",o:["Hypothyroidism","Hypertension","Overuse of aspirin and NSAIDs","Anemia"],a:2},
{t:"Peptic ulcers that occur on the inside of the stomach are called:",o:["Duodenal ulcers","Esophageal ulcers","Colonic ulcers","Gastric ulcers"],a:3},
{t:"Asthma is characterized by reversible airway:",o:["Dilation","Obstruction","Fibrosis","Collapse"],a:1},
{t:"Which of the following is a common asthma trigger?",o:["Dust and pollen","Adequate hydration","A balanced diet","Warm humid air"],a:0},
{t:"Emphysema is characterized by destruction of the:",o:["Bronchial cartilage","Pleura","Alveolar walls","Trachea"],a:2},
{t:"The formal diagnosis of COPD is made with:",o:["Chest X-ray","Arterial blood gases","Sputum culture","Spirometry"],a:3},
{t:"Which of the following is a nonpharmacologic approach to hypertension?",o:["DASH diet","Thiazide diuretic","Propranolol","Lasix"],a:0},
{t:"Zantac belongs to which drug group?",o:["Antacids","H-2 (histamine) blockers","Proton pump inhibitors","Antibiotics"],a:1},
{t:"Quick-relief (rescue) asthma medications are used:",o:["Every day regardless of symptoms","Once weekly","At bedtime only","Only during an attack"],a:3},
{t:"Which vaccine is recommended annually for COPD patients?",o:["Rabies","MMR","Influenza","Hepatitis A"],a:2},
/* ---- Medium ---- */
{t:"In the early stages of hypertension, the patient usually has:",o:["Morning occipital headache","No clinical manifestation other than elevated blood pressure","Epistaxis","Blurred vision"],a:1},
{t:"Which teaching point is correct for a patient taking a thiazide diuretic?",o:["Take the drug early in the day","Take the drug at bedtime","Avoid potassium-rich foods","Stop the drug once blood pressure is normal"],a:0},
{t:"Isolated systolic hypertension occurs mainly in:",o:["Children","Young adults","People older than 50 because of atherosclerosis","Pregnant women only"],a:2},
{t:"Which condition is a contraindication to beta-blockers?",o:["Stable angina","After myocardial infarction","Tachycardia with high blood pressure","Bronchial asthma"],a:3},
{t:"Chronic gastritis is sometimes associated with which autoimmune disease?",o:["Hemophilia","Pernicious anemia","Sickle cell disease","Thalassemia"],a:1},
{t:"In gastritis the gastric juice contains very little acid but much:",o:["Bile","Pepsin","Mucus","Bicarbonate"],a:2},
{t:"Which diet is appropriate for a patient with a peptic ulcer?",o:["Large, infrequent meals","Low-calorie, low-protein diet","Spicy food to stimulate healing","Small, frequent, high-calorie, high-protein meals"],a:3},
{t:"Which of the following is a prodromal sign of an asthma exacerbation?",o:["Sneezing with watery nasal discharge","Cyanosis","Use of all accessory muscles","Prolonged expiration"],a:0},
{t:"The most important group of long-term controller medications for asthma is:",o:["Bronchodilators","Anti-inflammatory medications","Antibiotics","Sedatives"],a:1},
{t:"Theophylline is especially useful to prevent:",o:["Exercise-induced asthma","Occupational asthma","Nighttime asthma","Status asthmaticus"],a:2},
{t:"Signs of right heart failure (cor pulmonale) are more typical of:",o:["Emphysema","Asthma","Pneumothorax","Predominantly chronic bronchitis"],a:3},
{t:"What is the recommended fluid intake for a COPD patient (within cardiac tolerance)?",o:["3000 mL per day","1000 mL per day","500 mL per day","5000 mL per day"],a:0},
{t:"Moderate (Stage II) COPD is defined by an FEV1 of:",o:["80% or more of predicted","50–79% of predicted","30–49% of predicted","Less than 30% of predicted"],a:1},
/* ---- Hard ---- */
{t:"Loop diuretics (e.g., Lasix) are preferred when:",o:["Rapid diuresis is needed or thiazides fail","Hypertension is mild","The patient has gout","The patient is pregnant"],a:0},
{t:"Which findings suggest hypertensive encephalopathy?",o:["Polyuria and thirst","Jaundice","Restlessness, altered consciousness, nausea and vomiting","Bradycardia"],a:2},
{t:"A patient suddenly stops taking antihypertensive medication. What is the main risk?",o:["Hypotension","Rebound hypertension","Hypoglycemia","Hyperkalemia"],a:1},
{t:"Which agent is used to neutralize an ingested strong acid in acute gastritis?",o:["Diluted vinegar","Diluted lemon juice","Emetics","Common antacids such as aluminum hydroxide"],a:3},
{t:"Electrolyte values (sodium, potassium, chloride) in gastritis are assessed every:",o:["6 hours","12 hours","24 hours","72 hours"],a:2},
{t:"Nocturnal asthma is common in:",o:["Both extrinsic and intrinsic asthma","Extrinsic asthma only","Intrinsic asthma only","Occupational asthma only"],a:0},
{t:"The “late phase” of exercise-induced bronchoconstriction may return after:",o:["1–2 hours","4–12 hours","30 minutes","48 hours"],a:1},
{t:"Hypercapnia in COPD is commonly observed when FEV1 falls below:",o:["2 L/s","50% of predicted","1 L/s or 30% of predicted","80% of predicted"],a:2},
{t:"A pH below which value generally indicates acute respiratory compromise in COPD?",o:["7.0","7.1","7.2","7.3"],a:3},
{t:"Chronic respiratory acidosis in COPD leads to:",o:["Compensatory metabolic alkalosis","Metabolic acidosis","Respiratory alkalosis","A normal pH with no compensation"],a:0},
{t:"Hypertension is defined as a persistent elevation of blood pressure above 120/80 mm Hg.",o:["True","False"],a:1},
{t:"Gastric ulcers occur inside the stomach, while duodenal ulcers occur in the upper small intestine.",o:["True","False"],a:0},
{t:"The airway obstruction in asthma is reversible.",o:["True","False"],a:0},
{t:"Chronic bronchitis requires cough and sputum production for at least 1 week.",o:["True","False"],a:1},
{t:"Malignant hypertension is an emergency condition.",o:["True","False"],a:0},
{t:"Caffeine is encouraged in gastritis because it reduces gastric activity.",o:["True","False"],a:1},
{t:"Oral corticosteroids are used as short-term treatment for severe asthma episodes.",o:["True","False"],a:0},
{t:"Patients with chronic bronchitis may show signs of right heart failure such as edema and cyanosis.",o:["True","False"],a:0},
{t:"Loop diuretics have a slow onset of action compared with thiazides.",o:["True","False"],a:1},
{t:"In a bleeding peptic ulcer, signs of shock include increased pulse rate and decreased blood pressure.",o:["True","False"],a:0},
{t:"Exercising in cold, dry air is less likely to cause EIB than exercising in warm, humid air.",o:["True","False"],a:1},
{t:"Patients with mild COPD usually have severe hypercapnia.",o:["True","False"],a:1},
{t:"Rebound hypertension can occur if antihypertensive medications are stopped suddenly.",o:["True","False"],a:0},
{t:"Nicotine increases the secretion of pancreatic bicarbonate.",o:["True","False"],a:1},
{t:"Pulmonary hypertension may lead to cor pulmonale in COPD patients.",o:["True","False"],a:0}
];

const TOTAL_TIME = 40*60;
let Q, cur, sel, saved, review, visited, left, iv, size = 13;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){if(q.o.length===2&&q.o[0]==='True'&&q.o[1]==='False')return {...q};const ix=shuffle(q.o.map((_,k)=>k));return {...q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}}
const $ = id => document.getElementById(id);

function init(pool){
  Q = shuffle([...pool]).map(shuffleOptions); const n = Q.length;
  cur = 0; sel = Array(n).fill(null); saved = Array(n).fill(false);
  review = Array(n).fill(false); visited = Array(n).fill(false);
  left = TOTAL_TIME;
  $('exam').classList.remove('hide'); $('result').classList.add('hide');
  $('tot').textContent = $('tot2').textContent = n;
  clearInterval(iv);
  iv = setInterval(()=>{
    left--; const m=Math.floor(left/60), s=left%60, t=$('tm');
    t.textContent = m+':'+(s<10?'0':'')+s;
    t.className = 't'+(left<=120?' danger':left<=300?' warn':'');
    if(left<=0){clearInterval(iv);finish()}
  },1000);
  if(n) render();
  window.scrollTo(0,0);
}

function render(){
  visited[cur] = true;
  const q = Q[cur];
  $('qno').textContent = 'Question No. ' + (cur+1);
  $('qbody').style.fontSize = size+'px';
  $('qbody').innerHTML = `<div class="qtext" style="font-size:${size}px">${q.t}</div>` +
    q.o.map((o,i)=>`<label class="opt" style="font-size:${size}px"><input type="radio" name="o" value="${i}" ${sel[cur]===i?'checked':''} onchange="sel[cur]=${i}"> <span>${o}</span></label>`).join('');
  refresh();
}

function status(i){
  if(review[i]) return 's-rev';
  if(saved[i]) return 's-ans';
  if(visited[i]) return 's-no';
  return 's-nv';
}
function refresh(){
  const n = Q.length; let a=0,no=0,r=0,nv=0;
  $('nav').innerHTML = Q.map((_,i)=>{
    const s = status(i);
    if(saved[i]) a++;
    if(s==='s-rev') r++; else if(s==='s-no') no++; else if(s==='s-nv') nv++;
    return `<span class="sq ${s} ${i===cur?'cur':''}" onclick="go(${i})">${i+1}</span>`;
  }).join('');
  $('ans').textContent = a; $('cAns').textContent = a; $('cNo').textContent = no;
  $('cRev').textContent = r; $('cNv').textContent = nv;
}

function go(i){cur=i;render()}
function nextQ(){ if(cur<Q.length-1){cur++;render();} else refresh(); }
function saveNext(){ if(sel[cur]!==null) saved[cur]=true; else saved[cur]=false; nextQ(); }
function skip(){ nextQ(); }
function mark(){ review[cur]=!review[cur]; if(sel[cur]!==null) saved[cur]=true; refresh(); }
function resetQ(){ sel[cur]=null; saved[cur]=false; review[cur]=false; render(); }
function fs(d){ size = d===0 ? 13 : Math.max(11,Math.min(24,size+d*2)); render(); }

function endTest(){
  const un = Q.filter((_,i)=>sel[i]===null).length;
  const msg = un ? `لسه فاضل ${un} سؤال من غير إجابة. تنهي الامتحان؟` : 'تنهي الامتحان؟';
  if(confirm(msg)) finish();
}

function finish(){
  clearInterval(iv);
  const n = Q.length; let ok=[], bad=[];
  Q.forEach((q,i)=>{ (sel[i]===q.a ? ok : bad).push(i) });
  const pct = n ? Math.round(ok.length/n*100) : 0;
  const card = (i,good)=>{
    const q=Q[i];
    return `<div class="it ${good?'':'bad'}"><div class="q">${i+1}. ${q.t}</div>
    ${good ? `<div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>` :
    `<div class="r"><span class="tag y">Your answer</span>${sel[i]===null?'— لم تتم الإجابة —':q.o[sel[i]]}</div>
     <div class="r"><span class="tag g">Correct</span>${q.o[q.a]}</div>`}
    ${q.exp?`<div class="exp">💬 ${q.exp}</div>`:''}</div>`;
  };
  const unans = Q.filter((_,i)=>sel[i]===null).length;
  $('exam').classList.add('hide');
  const r = $('result'); r.classList.remove('hide');
  r.innerHTML = `<div class="res">
   <div class="score"><div class="n">${pct}%</div><div>${ok.length} / ${n}</div></div>
   <div class="stats">
    <div><b style="color:var(--ok)">${ok.length}</b>صح</div>
    <div><b style="color:var(--no)">${bad.length - unans}</b>غلط</div>
    <div><b style="color:#777">${unans}</b>من غير إجابة</div>
    <div><b>${n}</b>الإجمالي</div>
   </div>
   <div class="acts">
    ${bad.length?'<button class="b" onclick="retryWrong()">إعادة الأسئلة الغلط ('+bad.length+')</button>':''}
    <button class="b" onclick="init(QUESTIONS)">امتحان جديد عشوائي</button>
   </div>
   <div class="sec">✔ الأسئلة اللي اتحلت صح (${ok.length})</div>
   ${ok.map(i=>card(i,true)).join('') || '<div style="padding:8px;color:#777">لا يوجد</div>'}
   <div class="sec bad">✖ الأسئلة الغلط (${bad.length})</div>
   ${bad.map(i=>card(i,false)).join('') || '<div style="padding:8px;color:#777">ممتاز، مفيش أخطاء 🎉</div>'}
  </div>`;
  window.scrollTo(0,0);
}

function retryWrong(){
  const pool = Q.filter((q,i)=>sel[i]!==q.a);
  init(pool);
}

init(QUESTIONS);
</script>
</body>
</html>
