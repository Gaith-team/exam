<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHAITH TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:       #dc2626;
  --accent-light: #ef4444;
  --accent-dark:  #b91c1c;
  --accent-glow:  rgba(220,38,38,0.2);
  --bg:      #f8fafc;
  --bg2:     #eef2f7;
  --card:    #ffffff;
  --text:    #1a2332;
  --text2:   #4a5568;
  --text3:   #718096;
  --bc:      rgba(0,0,0,0.07);
  --success: #16a34a;
  --danger:  #dc2626;
  --warn:    #b91c1c;
  --r:       16px;
  --tr:      all 0.3s cubic-bezier(0.4,0,0.2,1);
}
[data-theme="dark"] {
  --bg:   #0d1117; --bg2: #161b22; --card: #1c2333;
  --text: #e6edf3; --text2: #b1bac4; --text3: #7d8590;
  --bc:   rgba(255,255,255,0.08);
}

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
  transition: background .4s, color .4s;
}

#prog-bar {
  position: fixed; top: 0; left: 0; height: 3px; z-index: 999;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  transition: width .2s;
}

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 64px;
  background: rgba(248,250,252,.93); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bc); transition: var(--tr);
}
[data-theme="dark"] nav { background: rgba(13,17,23,.95); }

.nav-back {
  display: flex; align-items: center; gap: 7px;
  color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 700;
  padding: 7px 13px; border-radius: 8px; border: 1px solid var(--bc);
  background: var(--card); transition: var(--tr);
}
.nav-back:hover { color: var(--accent); border-color: var(--accent-glow); transform: translateX(3px); }
.nav-brand { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 900; color: var(--text); }
.nav-logo-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 900;
}
.nav-right { display: flex; align-items: center; gap: 8px; }
.theme-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--bc);
  background: var(--card); cursor: pointer; font-size: 15px;
  display: flex; align-items: center; justify-content: center; transition: var(--tr);
}
.theme-btn:hover { border-color: var(--accent); transform: rotate(20deg); }

.hero-band {
  margin-top: 64px;
  background: linear-gradient(135deg, var(--accent-dark), var(--accent), var(--accent-light));
  padding: 40px 24px 36px; text-align: center;
  position: relative; overflow: hidden;
}
.hero-band::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse 600px 200px at 50% 100%, rgba(255,255,255,.12) 0%, transparent 70%);
}
.hero-band-icon {
  width: 68px; height: 68px; border-radius: 20px;
  background: rgba(255,255,255,.2); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 30px; margin: 0 auto 14px; border: 1.5px solid rgba(255,255,255,.35);
}
.hero-band h1 { font-size: clamp(20px,4vw,30px); font-weight: 900; color: #fff; margin-bottom: 6px; }
.hero-band p { font-size: 13px; color: rgba(255,255,255,.8); }
.hero-band-meta {
  display: flex; justify-content: center; gap: 24px; margin-top: 20px;
  flex-wrap: wrap;
}
.meta-pill {
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,.3); border-radius: 50px;
  padding: 6px 16px; font-size: 12px; font-weight: 700; color: #fff;
  display: flex; align-items: center; gap: 6px;
}

.shell { max-width: 560px; margin: 0 auto; padding: 24px 20px 80px; }

.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px;
}
.stat-box {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 12px 10px; text-align: center;
}
.stat-box .val { font-size: 20px; font-weight: 900; }
.stat-box .lbl { font-size: 11px; color: var(--text3); margin-top: 2px; }
.stat-correct { color: var(--success); }
.stat-wrong   { color: var(--danger); }
.stat-remain  { color: var(--accent); }

.prog-strip {
  background: var(--card); border: 1px solid var(--bc); border-radius: var(--r);
  padding: 14px 16px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 14px;
}
.prog-label { font-size: 13px; font-weight: 700; color: var(--text2); white-space: nowrap; }
.prog-track { flex: 1; height: 8px; background: var(--bg2); border-radius: 8px; overflow: hidden; }
.prog-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 8px; transition: width .4s;
}
.timer-badge {
  min-width: 64px; height: 36px; border-radius: 18px;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900; color: var(--text);
  gap: 5px; padding: 0 12px; flex-shrink: 0;
}
.timer-badge.warn { color: var(--warn); border-color: rgba(217,119,6,.3); background: rgba(217,119,6,.08); }
.timer-badge.danger { color: var(--danger); border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); animation: pulse .8s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

.q-card {
  background: var(--card); border: 1px solid var(--bc);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  transition: box-shadow .3s;
}
.q-header {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  padding: 4px 18px 4px;
  display: flex; align-items: center; gap: 8px;
}
.q-num {
  background: rgba(255,255,255,.2); border-radius: 8px;
  padding: 3px 10px; font-size: 11px; font-weight: 700; color: #fff;
}
.q-text {
  padding: 22px 18px 14px; font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.65; border-bottom: 1px solid var(--bc);
  text-align: left; direction: ltr;
}
.q-text img {
  display: block; max-width: 100%; max-height: 260px; margin: 12px auto 0;
  border-radius: 12px; border: 1px solid var(--bc); background: #fff;
}
.options { padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 10px; }

.opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 12px;
  border: 1.5px solid var(--bc); background: var(--bg);
  cursor: pointer; font-size: 14px; font-weight: 600; color: var(--text);
  transition: var(--tr); user-select: none;
  direction: ltr; text-align: left;
}
.opt:hover:not(.disabled) {
  border-color: var(--accent); background: var(--accent-glow);
  transform: translateX(3px);
}
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--bg2); border: 1px solid var(--bc);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; color: var(--text3);
  transition: var(--tr);
}
.opt.correct { border-color: var(--success); background: rgba(22,163,74,.08); }
.opt.correct .opt-letter { background: var(--success); color: #fff; border-color: var(--success); }
.opt.wrong { border-color: var(--danger); background: rgba(220,38,38,.07); }
.opt.wrong .opt-letter { background: var(--danger); color: #fff; border-color: var(--danger); }
.opt.disabled { pointer-events: none; }

.feedback-bar {
  margin: 14px 18px; padding: 12px 16px; border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 700;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
.feedback-bar.ok { background: rgba(22,163,74,.1); color: var(--success); border: 1px solid rgba(22,163,74,.25); }
.feedback-bar.no { background: rgba(220,38,38,.08); color: var(--danger); border: 1px solid rgba(220,38,38,.2); }
.feedback-icon { font-size: 20px; }

.explanation {
  margin: 0 18px 14px; padding: 12px 14px;
  background: rgba(220,38,38,.06);
  border-radius: 10px; border-left: 3px solid var(--accent);
  font-size: 13px; color: var(--text2); line-height: 1.6;
  display: none; text-align: left; direction: ltr;
}

.nav-btns { padding: 4px 18px 18px; display: flex; gap: 10px; }
.btn {
  flex: 1; padding: 13px; border: none; border-radius: 12px;
  font-size: 14px; font-weight: 900; cursor: pointer;
  font-family: 'Outfit', sans-serif; transition: var(--tr);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn-next {
  background: linear-gradient(135deg, var(--accent-dark), var(--accent));
  color: #fff; box-shadow: 0 4px 14px var(--accent-glow);
}
.btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-skip {
  background: var(--bg2); color: var(--text2); border: 1px solid var(--bc); flex: 0 0 auto; padding: 13px 18px;
}
.btn-skip:hover { border-color: var(--warn); color: var(--warn); }

.result-hero {
  text-align: center; padding: 36px 20px 28px;
  background: var(--card); border-radius: 20px;
  border: 1px solid var(--bc); margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
}
.score-ring {
  width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; border: 5px solid var(--bg2);
  position: relative;
}
.score-ring svg { position: absolute; inset: -5px; width: calc(100% + 10px); height: calc(100% + 10px); transform: rotate(-90deg); }
.score-ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
.ring-bg { stroke: var(--bg2); }
.ring-fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
.score-num { font-size: 28px; font-weight: 900; color: var(--text); }
.score-pct { font-size: 12px; color: var(--text3); }
.result-grade { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.result-sub { font-size: 14px; color: var(--text2); }
.result-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 20px;
}
.rs { background: var(--bg2); border-radius: 10px; padding: 12px 8px; text-align: center; }
.rs .n { font-size: 20px; font-weight: 900; }
.rs .l { font-size: 11px; color: var(--text3); }

.report-item {
  background: var(--card); border: 1px solid var(--bc); border-radius: 14px;
  padding: 16px; margin-bottom: 10px; border-right: 4px solid var(--bc);
}
.report-item.ok { border-right-color: var(--success); }
.report-item.no { border-right-color: var(--danger); }
.report-item .ri-q { font-size: 13px; font-weight: 700; margin-bottom: 8px; text-align: left; direction: ltr; }
.report-item .ri-q img { max-width: 100%; max-height: 140px; display: block; margin-top: 8px; border-radius: 8px; }
.report-item .ri-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; margin-top: 5px; color: var(--text2);
}
.ri-badge { padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11px; flex-shrink: 0; }
.ri-yours { background: rgba(220,38,38,.1); color: var(--danger); }
.ri-right { background: rgba(22,163,74,.1); color: var(--success); }

.result-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
.btn-retry { background: linear-gradient(135deg, var(--accent-dark), var(--accent)); color: #fff; }
.btn-retry:hover { transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
.btn-home { background: var(--bg2); color: var(--text); border: 1px solid var(--bc); }
.btn-home:hover { border-color: var(--accent); color: var(--accent); }

footer {
  background: var(--bg2); border-top: 1px solid var(--bc);
  padding: 22px 24px; display: flex; align-items: center;
  justify-content: space-between; flex-wrap: wrap; gap: 10px;
}
.footer-brand { font-size: 14px; font-weight: 700; }
.footer-brand span { color: var(--accent); }
.footer-tg { display: flex; align-items: center; gap: 5px; text-decoration: none; color: #229ED9; font-size: 12px; font-weight: 600; }

@media (max-width: 480px) {
  nav { padding: 0 14px; }
  .shell { padding: 16px 14px 60px; }
  .nav-brand span { display: none; }
  .hero-band { padding: 30px 16px 28px; }
}
</style>
</head>

const QUESTIONS = [
{t:"ROM exercises stand for:", o:["Range of motion","Rate of movement","Rotation of muscles","Rest of mobility"], a:0},
{t:"ROM exercises are ones in which a person moves each joint through:", o:["The smallest range possible","As full a range as possible without causing pain","A range against heavy resistance","A range only with the nurse's force"], a:1},
{t:"How many types of ROM exercises are there?", o:["Two","Four","Three","Five"], a:2},
{t:"Which of the following is a purpose of ROM exercises?", o:["To increase muscle atrophy","To cause joint contracture","To decrease circulation","To promote joint mobility"], a:3},
{t:"All of the following are purposes of ROM exercises EXCEPT:", o:["To increase dependence on others","To prevent joint contracture","To prevent muscle atrophy","To improve circulation of the involved part"], a:0},
{t:"Active ROM exercises are performed:", o:["By the nurse on immobilized joints","By the physician only","Independently by the patient","With full help from the family"], a:2},
{t:"Passive ROM exercises are performed by:", o:["The patient independently","The patient using the strong limb only","The patient's relatives only","The nurse or other health care provider"], a:3},
{t:"In active-assistive ROM, the patient:", o:["Does nothing while the nurse moves the joint","Carries out the movement with some assistance from the nurse","Performs the movement without any help","Moves only the unaffected limb"], a:1},
{t:"Moving a joint or extremity toward the midline of the body is called:", o:["Abduction","Adduction","Extension","Eversion"], a:1},
{t:"Moving a joint or extremity away from the midline of the body is called:", o:["Adduction","Flexion","Inversion","Abduction"], a:3},
{t:"Decreasing the angle between two bones is called:", o:["Flexion","Extension","Hyperextension","Rotation"], a:0},
{t:"Straightening a joint is called:", o:["Flexion","Circumduction","Extension","Pronation"], a:2},
{t:"Moving a joint past its normal extension is called:", o:["Flexion","Abduction","Hyperextension","Opposition"], a:2},
{t:"Turning the body or a body part to face upward is called:", o:["Supination","Pronation","Inversion","Eversion"], a:0},
{t:"Turning the body or a body part to face downward is called:", o:["Supination","Adduction","Extension","Pronation"], a:3},
{t:"Moving a body part in widening circles is called:", o:["Rotation","Circumduction","Opposition","Abduction"], a:1},
{t:"Turning the feet inward so that the toes point toward the midline is called:", o:["Inversion","Eversion","Dorsal flexion","Plantar flexion"], a:0},
{t:"Turning the feet outward so that the toes point away from the midline is called:", o:["Inversion","Eversion","Adduction","Supination"], a:1},
{t:"Touching the thumb to each finger is called:", o:["Abduction","Circumduction","Opposition","Extension"], a:2},
{t:"Turning the joint outward is called:", o:["Internal rotation","Eversion","Abduction","External rotation"], a:3},
{t:"Which of the following patients needs ROM exercises?", o:["A paralyzed patient","An active person with strong, fully mobile joints","A person who exercises daily","A healthy young athlete"], a:0},
{t:"Which of the following is a contraindication to routine ROM exercises?", o:["Elderly individuals","Weak and inactive individuals","Heart and respiratory disease","Paralyzed patients"], a:2},
{t:"ROM exercises are contraindicated in some patients because they:", o:["Decrease the energy expended","Always cause joint contracture","Prevent muscle strength","Require energy and tend to increase circulation"], a:3},
{t:"If a contraindication to ROM is present, the nurse should:", o:["Perform the exercises anyway but slowly","Consult the physician to determine which ROM exercises are appropriate","Ask the patient to decide","Perform only passive exercises without asking"], a:1},
{t:"Each series of ROM exercises should be performed:", o:["Once a week","Twice daily","Hourly","Only when the patient asks"], a:1},
{t:"Each movement should be repeated at least:", o:["10 times and not exceed 15 times","1 time only","7 times and not exceed 10 times","3 times and not exceed 5 times"], a:3},
{t:"When exercising a joint, the part should be supported well below and above the joint, EXCEPT in the:", o:["Ball and socket joint (support below only)","Elbow joint","Knee joint","Wrist joint"], a:0},
{t:"All motions during ROM exercises should be done:", o:["Quickly to save time","Forcefully to gain full range","Slowly and gently","Until the patient feels pain"], a:2},
{t:"Movement of the head (neck ROM) is contraindicated in:", o:["Elderly patients only","Patients with weak arms","Spine surgery, spine trauma and a patient with a central vein line","Patients with swollen toes"], a:2},
{t:"Which exercises are performed only by an individual who is able to stand?", o:["Spine exercises","Neck exercises","Ankle exercises","Finger exercises"], a:0},
{t:"For a hemiplegic patient, ROM exercises teach the patient to:", o:["Avoid moving the weak limb completely","Depend on the nurse for all movement","Move only the strong side","Support and move the weak arm or leg with the strong one"], a:3},
{t:"Which movements are performed at the elbow and knee?", o:["Abduction and adduction","Flexion and extension","Supination and pronation","Opposition and inversion"], a:1},
{t:"Which of the following is NOT a movement of the toes?", o:["Opposition","Flexion","Abduction","Adduction"], a:0},
{t:"Which list correctly describes ankle movements?", o:["Opposition, abduction, adduction, extension","Dorsal flexion, plantar flexion, eversion, inversion","Supination and pronation only","Circumduction, hyperextension, opposition"], a:1},
{t:"Which movements are performed at the fingers?", o:["Dorsal flexion and plantar flexion","Inversion and eversion","Flexion, extension, hyperextension, abduction, adduction","Supination and pronation"], a:2},

{t:"ROM exercises aim to move each joint through as full a range as possible without causing pain.", o:["True","False"], a:0},
{t:"Passive ROM exercises are performed independently by the patient.", o:["True","False"], a:1},
{t:"Active ROM exercises are those that the client is able to perform independently.", o:["True","False"], a:0},
{t:"Heart and respiratory disease are contraindications to routine ROM exercises.", o:["True","False"], a:0},
{t:"The nurse should exercise the patient to the point of pain to ensure full range of motion.", o:["True","False"], a:1},
{t:"For a ball and socket joint, the nurse supports the part below the joint only.", o:["True","False"], a:0},
{t:"Each movement should be repeated at least 3 times and not exceed 5 times.", o:["True","False"], a:0},
{t:"Each series of ROM exercises should be performed once daily.", o:["True","False"], a:1},
{t:"Abduction means moving a joint or extremity toward the midline of the body.", o:["True","False"], a:1},
{t:"Eversion means turning the feet outward so the toes point away from the midline.", o:["True","False"], a:0},
{t:"Neck movement is contraindicated in a patient with spine trauma or a central vein line.", o:["True","False"], a:0},
{t:"A bedridden patient who cannot stand can safely perform the spine exercises.", o:["True","False"], a:1},
{t:"The frequency of motion should be increased rapidly to speed recovery.", o:["True","False"], a:1},
{t:"Passive ROM is performed by the nurse on the patient's immobilized joints.", o:["True","False"], a:0},
{t:"Active exercises should be encouraged whenever possible.", o:["True","False"], a:0},

{t:"A bedridden elderly patient cannot move his left leg at all. The nurse moves the leg through its range of motion without any effort from the patient. Which type of ROM is this?", o:["Active ROM","Active-assistive ROM","Resistive exercise","Passive ROM"], a:3, exp:"Passive ROM: the nurse performs it on the patient's immobilized joints."},
{t:"A patient with a weak arm can start the movement but needs the nurse to help complete it. Which type of ROM is this?", o:["Active-assistive ROM","Passive ROM","Active ROM","None of the above"], a:0, exp:"Active-assistive: the patient carries it out with some assistance from the nurse."},
{t:"A patient with known heart disease complains of chest pain and shortness of breath just before the scheduled ROM session. What should the nurse do?", o:["Start with fast movements to warm up","Continue the ROM as usual","Consult the physician before doing ROM","Ask the patient to perform double repetitions"], a:2, exp:"Heart and respiratory disease are contraindications to routine ROM; consult the physician."},
{t:"A patient's knee is red, swollen and inflamed. The nurse is about to start ROM exercises. The BEST action is to:", o:["Exercise the knee to the point of pain","Perform circumduction of the knee","Ignore the swelling and continue","Consult the physician to determine which exercises are appropriate"], a:3, exp:"Swollen and inflamed joints are a contraindication; consult the physician."},
{t:"While performing hip ROM on a patient in the side-lying position, the patient tends to roll over. The nurse should:", o:["Stop all exercises permanently","Support the patient's back to prevent rolling","Ask the patient to hold his breath","Perform the movement faster"], a:1, exp:"When the patient is in the side-lying position, support the back to prevent rolling."},
{t:"An aphasic patient cannot tell the nurse about pain during ROM, but his face tightens with each movement. The nurse should:", o:["Continue because he did not complain","Notice the facial expression and body language and avoid exercising to the point of pain","Increase the number of repetitions","Switch to hyperextension"], a:1, exp:"Some patients cannot verbalize pain because of aphasia; observe facial expression and body language."},
{t:"The nurse is performing shoulder ROM on a patient. Where should the nurse support the limb?", o:["Above and below the joint","Above the joint only","Only at the wrist","Below the joint only, leaving the joint free"], a:3, exp:"Ball and socket joint: support below only and leave the joint free."},
{t:"A patient had spine surgery yesterday and the nurse plans neck ROM exercises. This is:", o:["Contraindicated","Appropriate, as neck ROM is always safe","Appropriate if done rapidly","Appropriate only in the evening"], a:0, exp:"Movement of the head is contraindicated in spine surgery, spine trauma and a central vein line."},
{t:"An elderly person holding the back of a chair during standing spine exercises begins to complain of back pain. The nurse should:", o:["Ask him to continue 5 more times","Remove the chair","Stop the exercise","Ask him to bend further"], a:2, exp:"If the person experiences back pain, the exercise should be stopped."},
{t:"A hemiplegic patient wants to exercise his weak arm independently. The nurse should teach him to:", o:["Leave the weak arm still","Use only passive exercise by the nurse","Support and move the weak arm with the strong arm as far as possible","Exercise both arms to exhaustion"], a:2, exp:"The patient learns to support and move the weak arm or leg with the strong one."},

{t:"The patient in this picture shows chest pain. Routine ROM exercises in such a patient are:<br>"+pic('heart'), o:["Contraindicated until the physician is consulted","Always safe","Needed to increase circulation immediately","Only allowed as circumduction"], a:0, exp:"Heart and respiratory disease are contraindications to routine ROM."},
{t:"The picture shows a swollen, inflamed joint. This condition is:<br>"+pic('swollen'), o:["A purpose of ROM","A type of ROM","A joint movement","A contraindication to routine ROM"], a:3, exp:"Swollen and inflamed joints are a contraindication to routine ROM."},
{t:"The patient in the picture moves his arm independently. This is:<br>"+pic('active'), o:["Passive ROM","Active ROM","Active-assistive ROM","Hyperextension"], a:1, exp:"Active ROM is performed independently by the patient."},
{t:"In this picture the patient moves his arm with help from another person's hand. This is:<br>"+pic('assist'), o:["Active-assistive ROM","Active ROM","Passive ROM","Opposition"], a:0, exp:"Active-assistive: patient carries it out with some assistance."},
{t:"In this picture the nurse moves the patient's joint while the patient does no work. This is:<br>"+pic('passive'), o:["Active ROM","Passive ROM","Active-assistive ROM","Circumduction"], a:1, exp:"Passive ROM is done by the nurse on the patient's immobilized joints."},
{t:"The arrows in the picture show the arms moving toward the midline of the body. This movement is:<br>"+pic('adduct'), o:["Abduction","Eversion","Adduction","Flexion"], a:2, exp:"Adduction = toward the midline."},
{t:"The arrows in the picture show the arms moving away from the midline of the body. This movement is:<br>"+pic('abduct'), o:["Adduction","Extension","Supination","Abduction"], a:3, exp:"Abduction = away from the midline."},
{t:"The arm in the picture is straightened to about 180°. This movement is:<br>"+pic('extension'), o:["Extension","Flexion","Pronation","Inversion"], a:0, exp:"Extension = straightening a joint."},
{t:"The nurse in the picture moves the patient's knee from bent to straight. Which movements are being performed?<br>"+pic('knee'), o:["Abduction and adduction","Opposition and inversion","Flexion and extension","Supination and pronation"], a:2, exp:"Elbow and knee: flexion and extension."},
{t:"The picture shows spine exercises. Which statement about them is correct?<br>"+pic('spine'), o:["They can be done by bedridden patients","They should continue even if back pain occurs","The patient should avoid holding anything for balance","Only an individual who is able to stand can do them"], a:3, exp:"Only individuals able to stand can do them; hold the back of a chair and stop if back pain occurs."},

{t:"Before starting ROM exercises, the FIRST step in positioning the patient is to:", o:["Ask the patient to stand","Position the patient in good body alignment","Start with the fingers","Increase the number of repetitions"], a:1, exp:"Principle 1: position the patient in good body alignment."},
{t:"While performing ROM, the care giver should use good body mechanics to give:", o:["Speed and strength","Stability, safety and comfort","Maximum resistance","Less contact with the patient"], a:1, exp:"Good body mechanics give the care giver stability, safety and comfort."},
{t:"After finishing each motion during the procedure, the nurse should:", o:["Immediately start the next motion without a pause","End the session","Increase the speed","Allow a period of rest at the end of each motion"], a:3, exp:"There should be a period of rest at the end of each motion."},
{t:"The examiner asks how many times each movement is repeated. The correct answer is:", o:["At least 3 times and not more than 5 times","Exactly 10 times","Once only","Until the patient is exhausted"], a:0, exp:"Repeat each movement at least 3 times and don't exceed 5 times."},
{t:"The examiner asks: 'When must you stop exercising the patient?' The correct answer is:", o:["Never, until full range is reached","After the first repetition","At the point of pain or exhaustion","When the patient talks"], a:2, exp:"Don't exercise the patient to the point of pain or exhaustion."},
{t:"Which list of movements do you demonstrate for the wrist?", o:["Opposition, inversion, eversion","Dorsal flexion and plantar flexion only","Flexion, extension, hyperextension, lateral flexion, rotation","Supination and pronation only"], a:2, exp:"Wrist: flexion, extension, hyperextension, lateral flexion, rotation."},
{t:"Which movements do you perform for the forearm?", o:["Supination and pronation","Flexion and extension","Abduction and adduction","Dorsal and plantar flexion"], a:0, exp:"Forearm: supination - pronation."},
{t:"Which movements do you perform for the shoulder and hip?", o:["Flexion and extension only","Opposition and inversion only","Supination and pronation only","Circumduction, flexion, extension, hyperextension, abduction, adduction, external and internal rotation"], a:3, exp:"Shoulder and hip have the widest range of movements."},
{t:"Which movements do you perform for the thumb?", o:["Dorsal flexion and plantar flexion","Abduction, adduction, opposition, extension, flexion","Inversion and eversion","Supination and pronation"], a:1, exp:"Thumb: abduction, adduction, opposition, extension, flexion."},
{t:"The examiner asks about the nurse's role during ROM. Which is correct?", o:["Encourage active exercises whenever possible","Always do passive ROM even if the patient can move","Avoid involving the patient in self care","Exercise only once a day"], a:0, exp:"Encourage active exercises whenever possible to increase independence."}
];

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime = 80*60, timeLeft, timerInterval;
const LETTERS = ['A','B','C','D','E','F'];

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function shuffleOptions(q) {
  const idxs = shuffle(q.o.map((_, idx) => idx));
  const newO = idxs.map(idx => q.o[idx]);
  const newA = idxs.indexOf(q.a);
  return {...q, o: newO, a: newA};
}

function init(pool) {
  questions = shuffle([...pool]).map(shuffleOptions);
  i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0;
  timeLeft = totalTime;
  document.getElementById('totalBadge').textContent = questions.length + ' سؤال';
  startTimer();
  render();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60), s = timeLeft % 60;
    document.getElementById('timerTxt').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    const badge = document.getElementById('timerBadge');
    if (timeLeft <= 120) { badge.className = 'timer-badge danger'; }
    else if (timeLeft <= 300) { badge.className = 'timer-badge warn'; }
    if (timeLeft <= 0) { clearInterval(timerInterval); finish(); }
  }, 1000);
}

function updateTop() {
  const total = questions.length;
  document.getElementById('sCorrect').textContent = correct;
  document.getElementById('sWrong').textContent = wrong;
  document.getElementById('sRemain').textContent = Math.round(((total - answered) / total) * 100) + '%';
  document.getElementById('progLabel').textContent = 'سؤال ' + (i + 1) + ' / ' + total;
  document.getElementById('progFill').style.width = ((i + 1) / total * 100) + '%';
  document.getElementById('prog-bar').style.width = ((i + 1) / total * 100) + '%';
}

function render() {
  updateTop();
  const q = questions[i];
  document.getElementById('app').innerHTML = `
    <div class="q-card">
      <div class="q-header">
        <div class="q-num">سؤال ${i + 1} / ${questions.length}</div>
      </div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o, idx) => `
          <div class="opt" id="opt${idx}" onclick="choose(${idx})">
            <div class="opt-letter">${LETTERS[idx] || idx + 1}</div>
            ${o}
          </div>
        `).join('')}
      </div>
      <div class="nav-btns">
        <button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> تخطي</button>
      </div>
    </div>`;
}

function choose(v) {
  if (answers[i] !== null) return;
  answers[i] = v;
  answered++;
  const q = questions[i];
  const ok = v === q.a;
  ok ? correct++ : wrong++;
  updateTop();

  q.o.forEach((_, idx) => {
    const el = document.getElementById('opt' + idx);
    el.classList.add('disabled');
    if (idx === q.a) el.classList.add('correct');
    else if (idx === v) el.classList.add('wrong');
  });

  const fb = document.createElement('div');
  fb.className = 'feedback-bar ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? `<span class="feedback-icon">🎉</span> <span>شطور ، اللهم بارك </span>`
    : `<span class="feedback-icon">😔</span> <span>ركز يا سكر </span>`;

  const card = document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if (q.exp) {
    const exp = document.createElement('div');
    exp.className = 'explanation';
    exp.style.display = 'block';
    exp.innerHTML = '<b>💬 شرح:</b> ' + q.exp;
    fb.after(exp);
  }

  const navBtns = card.querySelector('.nav-btns');
  navBtns.innerHTML = `<button class="btn btn-next" onclick="next()">
    ${i < questions.length - 1 ? '<i class="fa-solid fa-arrow-left"></i> السؤال التالي' : '<i class="fa-solid fa-flag-checkered"></i> إنهاء الامتحان'}
  </button>`;
}

function skip() {
  if (answers[i] === null) { answers[i] = -1; answered++; wrongSet.push(questions[i]); wrong++; updateTop(); }
  next();
}

function next() {
  if (i < questions.length - 1) { i++; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  else finish();
}

function finish() {
  clearInterval(timerInterval);
  const total = questions.length;
  const score = Math.round((correct / total) * 100);

  questions.forEach((q, idx) => {
    if (answers[idx] !== q.a) wrongSet.push({...q, myAns: answers[idx]});
  });
  wrongSet = [...new Map(wrongSet.map(q => [q.t, q])).values()];

  let grade, gradeColor;
  if (score >= 90) { grade = '🥇 ممتاز'; gradeColor = 'var(--success)'; }
  else if (score >= 75) { grade = '🥈 جيد جداً'; gradeColor = 'var(--accent)'; }
  else if (score >= 60) { grade = '🥉 جيد'; gradeColor = 'var(--warn)'; }
  else { grade = '📚 راجع تاني'; gradeColor = 'var(--danger)'; }

  const circ = 2 * Math.PI * 45;
  const offset = circ - (score / 100) * circ;

  const reportHTML = questions.map((q, idx) => {
    const ok = answers[idx] === q.a;
    return `<div class="report-item ${ok ? 'ok' : 'no'}">
      <div class="ri-q">${ok ? '✅' : '❌'} ${q.t}</div>
      ${!ok ? `
        <div class="ri-row"><span class="ri-badge ri-yours">إجابتك</span> ${answers[idx] >= 0 ? q.o[answers[idx]] : 'تم التخطي'}</div>
        <div class="ri-row"><span class="ri-badge ri-right">الصحيح</span> ${q.o[q.a]}</div>
      ` : ''}
    </div>`;
  }).join('');

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('app').innerHTML = `
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="0"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}"
            style="stroke:${gradeColor}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div>
        <div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
      <div class="result-sub">أجبت على ${answered} من ${total} سؤال</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">صحيح</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">خطأ</div></div>
        <div class="rs"><div class="n" style="color:var(--accent)">${total - answered < 0 ? 0 : total - answered}</div><div class="l">تخطي</div></div>
      </div>
    </div>

    <div class="result-actions">
      ${wrongSet.length ? `<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> إعادة الخطأ (${wrongSet.length})</button>` : ''}
      <button class="btn btn-home" onclick="init(QUESTIONS)"><i class="fa-solid fa-shuffle"></i> امتحان عشوائي</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home" style="text-decoration:none;"><i class="fa-solid fa-house"></i> رجوع للمادة</a>
    </div>

    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 تقرير مفصّل</div>
      ${reportHTML}
    </div>`;

  setTimeout(() => { document.getElementById('ringFill').style.strokeDashoffset = offset; }, 100);
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function retryWrong() {
  const pool = [...wrongSet];
  questions = shuffle(pool).map(shuffleOptions); i = 0; correct = 0; wrong = 0;
  answers = new Array(questions.length).fill(null);
  wrongSet = []; answered = 0; timeLeft = totalTime;
  startTimer(); render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

const themeBtn = document.getElementById('themeBtn');
let theme = 'light';
try { theme = localStorage.getItem('theme') || 'light'; } catch(e) {}
function applyTheme(t) {
  theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('theme', t); } catch(e) {}
}
applyTheme(theme);
themeBtn.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

init(QUESTIONS);
</script>
</body>
</html>
