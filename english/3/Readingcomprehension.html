<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0d9488;--accent-rgb:13,148,136;--c2:#f97316;--c3:#eab308;--c4:#0891b2;
  --grad:linear-gradient(135deg,#0f172a 0%,#0e7490 60%,#0d9488 100%);

  --bg:#f4f7f8;--bg2:#e5ecee;--card:#fff;--text:#0f1b21;--text2:#44575f;--text3:#7b8d95;
  --bc:rgba(15,40,50,.12);--success:#16a34a;--danger:#dc2626;--warn:#d97706;--r:6px;
  --tr:all .25s ease;
}
[data-theme="dark"]{
  --bg:#0a1114;--bg2:#121c20;--card:#16232a;--text:#e8f1f3;--text2:#b2c4ca;--text3:#7f949c;
  --bc:rgba(255,255,255,.10);--accent:#2dd4bf;--accent-rgb:45,212,191;--c2:#fb923c;--success:#4ade80;--danger:#f87171;--c4:#22d3ee;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background-color .4s,color .4s;direction:ltr;text-align:left}
#prog-bar{position:fixed;top:0;left:0;height:4px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--c2));transition:width .2s}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(244,247,248,.95);backdrop-filter:blur(14px);border-bottom:2px solid var(--accent)}
[data-theme="dark"] nav{background:rgba(10,17,20,.95)}
.nav-back{display:flex;align-items:center;gap:7px;color:var(--text2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:var(--r);border:1px solid var(--bc);background:var(--card);transition:var(--tr)}
.nav-back:hover{color:var(--c2);border-color:var(--c2);transform:translateX(-3px)}
.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:.6px}
.nav-logo-icon{width:34px;height:34px;border-radius:var(--r);background:var(--c2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.theme-btn{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:var(--tr)}
.theme-btn:hover{border-color:var(--c2)}
.hero-band{margin-top:64px;background:var(--grad);padding:40px 24px 48px;text-align:left;position:relative;overflow:hidden}
.hero-band::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(249,115,22,.35)}
.hero-inner{max-width:560px;margin:0 auto;position:relative;z-index:1}
.hero-band-icon{width:60px;height:60px;border-radius:var(--r);background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;border:1px solid rgba(255,255,255,.3)}
.hero-band h1{font-size:clamp(22px,4vw,30px);font-weight:800;color:#fff;margin-bottom:4px}
.hero-band p{font-size:13px;color:rgba(255,255,255,.85)}
.hero-band-meta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.meta-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:6px 14px;font-size:12px;font-weight:700;color:#fff;display:flex;align-items:center;gap:6px}
.shell{max-width:560px;margin:0 auto;padding:24px 20px 80px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--bc);border-left:4px solid var(--c4);border-radius:var(--r);padding:12px;text-align:left}
.stat-box:nth-child(1){border-left-color:var(--success)}
.stat-box:nth-child(2){border-left-color:var(--danger)}
.stat-box .val{font-size:20px;font-weight:800}
.stat-box .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat-correct{color:var(--success)}.stat-wrong{color:var(--danger)}.stat-remain{color:var(--c4)}
.prog-strip{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.prog-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.prog-track{flex:1;height:6px;background:var(--bg2);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--c2));transition:width .4s}
.timer-badge{min-width:70px;height:36px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;gap:5px;padding:0 12px;font-variant-numeric:tabular-nums}
.timer-badge.warn{color:var(--warn);border-color:var(--warn)}
.timer-badge.danger{color:var(--danger);border-color:var(--danger);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.55}}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.chip{padding:8px 12px;border-radius:var(--r);border:1px solid var(--bc);background:var(--card);color:var(--text2);font:700 12px Inter,system-ui,sans-serif;cursor:pointer;transition:var(--tr)}.chip:hover{border-color:var(--accent);color:var(--accent)}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.q-card{background:var(--card);border:1px solid var(--bc);border-top:4px solid var(--accent);border-radius:var(--r);box-shadow:0 8px 24px rgba(10,40,50,.08)}
.q-header{padding:12px 18px 0}
.q-num{display:inline-block;background:rgba(var(--accent-rgb),.12);color:var(--accent);border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.q-text{padding:14px 18px;font-size:16px;font-weight:700;line-height:1.6;border-bottom:1px solid var(--bc)}
.q-text img{display:block;max-width:100%;max-height:260px;margin:0 auto 12px;border-radius:var(--r);background:#fff}
.options{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;transition:var(--tr);user-select:none}
.opt:hover:not(.disabled){border-color:var(--accent);background:rgba(var(--accent-rgb),.08);transform:translateX(3px)}
.opt-letter{width:28px;height:28px;border-radius:var(--r);flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text2)}
.opt.correct{border-color:var(--success);background:rgba(22,163,74,.1)}
.opt.correct .opt-letter{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:rgba(220,38,38,.08)}
.opt.wrong .opt-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.disabled{pointer-events:none}
.feedback-bar{margin:0 18px 14px;padding:12px 16px;border-radius:var(--r);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;animation:popIn .35s ease}
@keyframes popIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.feedback-bar.ok{background:rgba(22,163,74,.1);color:var(--success);border:1px solid rgba(22,163,74,.3)}
.feedback-bar.no{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.25)}
.feedback-icon{font-size:20px}
.explanation{margin:0 18px 14px;padding:12px 14px;background:rgba(var(--accent-rgb),.07);border-radius:var(--r);border-left:3px solid var(--c2);font-size:13px;color:var(--text2);line-height:1.6}
.nav-btns{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:var(--r);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:focus-visible,.opt:focus-visible,.theme-btn:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.btn-next{background:var(--grad-soft);color:#fff;box-shadow:0 4px 14px rgba(13,148,136,.3)}
.btn-next:hover{transform:translateY(-2px)}
.btn-skip{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.btn-skip:hover{border-color:var(--c2);color:var(--c2)}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:var(--r);border:1px solid var(--bc);border-top:4px solid var(--c2);margin-bottom:20px}
.score-ring{width:110px;height:110px;border-radius:50%;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.score-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring-bg{stroke:var(--bg2)}
.ring-fill{transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:800;line-height:1}
.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:800;margin-bottom:6px}
.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:var(--r);padding:12px 8px;text-align:center}
.rs .n{font-size:20px;font-weight:800}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-left:4px solid var(--bc);border-radius:var(--r);padding:16px;margin-bottom:10px}
.report-item.ok{border-left-color:var(--success)}.report-item.no{border-left-color:var(--danger)}
.ri-q{font-size:13px;font-weight:700;margin-bottom:8px}
.ri-q img{max-height:90px;display:block;margin:6px 0;border-radius:var(--r)}
.ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.12);color:var(--danger)}.ri-right{background:rgba(22,163,74,.12);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff}
.btn-retry:hover{transform:translateY(-2px)}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
.btn-home:hover{border-color:var(--accent);color:var(--accent)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--c2)}
.footer-tg{display:flex;align-items:center;gap:5px;text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 36px}}
</style>
</head>

{c:1,t:"A 'Routine' is ______.",o:["A medical examination","A sequence of actions regularly followed, or daily tasks","A person receiving treatment","A period of rest"],a:1},

{c:1,t:"What does Sarah do first in the morning?",o:["Administers the prescribed medications","Goes home","Records vital signs","Checks the patients' medical charts"],a:3},
{c:1,t:"Why does Sarah love her job?",o:["Because she helps people recover","Because she finishes at 3:00 PM","Because it is a big hospital","Because she works alone"],a:0},
{c:1,t:"Sarah works alone and without a team.",o:["True","False"],a:1},
{c:1,t:"At what time does Sarah's work end?",o:["7:00 AM","5:00 PM","12:00 PM","3:00 PM"],a:3},

{c:1,t:"Which sequence matches the passage?",o:["Checks charts → administers medications → measures vital signs","Measures vital signs → checks charts → goes home","Checks charts → measures vital signs → administers prescribed medications","Administers medications → checks charts → measures vital signs"],a:2},
{c:2,t:"The body's defense network against infections and diseases is the ______.",o:["Tissue Repair","Immune System","Memory Consolidation","Hospital Ward"],a:1},
{c:2,t:"The biological process of regenerating damaged cells and tissues is called ______.",o:["Anxiety","Restorative Sleep","Tissue Repair","Immune System"],a:2},
{c:2,t:"The process by which the brain stabilizes and stores memories is ______.",o:["Anxiety","Tissue Repair","Restorative Sleep","Memory Consolidation"],a:3},
{c:2,t:"A feeling of worry, nervousness, or unease about an imminent event is ______.",o:["Anxiety","Hospital Ward","Immune System","Restorative Sleep"],a:0},
{c:2,t:"A large room in a hospital where multiple beds are placed for patients is a ______.",o:["Memory Consolidation","Tissue Repair","Hospital Ward","Immune System"],a:2},

{c:2,t:"Restorative sleep is light, short sleep that does not refresh the body.",o:["True","False"],a:1},
{c:2,t:"According to the passage, sleep acts as a powerful ______ nurse.",o:["sleeping","dedicated","healing","nocturnal"],a:2},
{c:2,t:"Rest is an active biological process that is crucial for recovery.",o:["True","False"],a:0},

/* ============ ENGINE ============ */
let questions, i, correct, wrong, answers, wrongSet, answered;
let totalTime=40*60, timeLeft, timerInterval, currentPool, currentTopic="all";
const TOPICS=[{k:"1",n:"Chapter 1 — Welcome to Professional Nursing"},{k:"2",n:"Chapter 2 — Why We Need Sleep"},{k:"3",n:"Chapter 3 — How the Brain Heals"},{k:"4",n:"Chapter 4 — When the Doctor is Away: The Nurse Steps In"},{k:"5",n:"Chapter 5 — The Thyroid Gland: Body Energy"},{k:"6",n:"Chapter 6 — Taking Medicine Safely"}];
const LETTERS = ['A','B','C','D','E','F'];
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function shuffleOptions(q){const idx=shuffle(q.o.map((_,k)=>k));return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};}
function init(pool){
  currentPool=pool;totalTime=Math.ceil(pool.length*22);
  document.getElementById('minBadge').textContent=Math.ceil(totalTime/60);
  document.getElementById('timerTxt').textContent=Math.ceil(totalTime/60)+':00';
  renderTopics();
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);
  wrongSet=[];answered=0;timeLeft=totalTime;
  document.getElementById('totalBadge').textContent=questions.length+' Questions';
  startTimer();render();
}
function renderTopics(){
  const n=k=>QUESTIONS.filter(q=>String(q.c)===k).length;
  document.getElementById('topics').innerHTML=`<button class="chip ${currentTopic==='all'?'on':''}" onclick="setTopic('all')">All Chapters (${QUESTIONS.length})</button>`+TOPICS.map(t=>`<button class="chip ${currentTopic===t.k?'on':''}" onclick="setTopic('${t.k}')">${t.n} (${n(t.k)})</button>`).join('');
}
function setTopic(k){
  currentTopic=k;
  init(k==='all'?QUESTIONS:QUESTIONS.filter(q=>String(q.c)===k));
  window.scrollTo({top:0,behavior:'smooth'});
}
function startTimer(){
  clearInterval(timerInterval);
  document.getElementById('timerBadge').className='timer-badge';
  timerInterval=setInterval(()=>{
    timeLeft--;
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;
    const b=document.getElementById('timerBadge');
    if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish();}
  },1000);
}
function updateTop(){
  const total=questions.length||1;
  document.getElementById('sCorrect').textContent=correct;
  document.getElementById('sWrong').textContent=wrong;
  document.getElementById('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  document.getElementById('progLabel').textContent='Question '+(i+1)+' / '+total;
  document.getElementById('progFill').style.width=((i+1)/total*100)+'%';
  document.getElementById('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[
  {icon:'🔬',l:['#0d9488','13,148,136'],d:['#2dd4bf','45,212,191']},
  {icon:'📊',l:['#0891b2','8,145,178'],d:['#22d3ee','34,211,238']},
  {icon:'📝',l:['#ea580c','234,88,12'],d:['#fb923c','251,146,60']},
  {icon:'📚',l:['#4f46e5','79,70,229'],d:['#818cf8','129,140,248']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style,c=dark?s.d:s.l;
  r.setProperty('--accent',c[0]);r.setProperty('--accent-rgb',c[1]);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[0]},#0f172a)`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];if(!q)return;
  document.getElementById('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">Question ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()"><i class="fa-solid fa-forward"></i> Skip</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=document.getElementById('opt'+idx);
    el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?`<span class="feedback-icon">🎉</span><span>Excellent! Well done.</span>`:`<span class="feedback-icon">😔</span><span>Not quite — stay focused!</span>`;
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  if(q.exp){
    const exp=document.createElement('div');
    exp.className='explanation';
    exp.innerHTML='<b>💬 Explanation:</b> '+q.exp;
    fb.after(exp);
  }
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'Next Question <i class="fa-solid fa-arrow-right"></i>':'<i class="fa-solid fa-flag-checkered"></i> Finish Exam'}</button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrongSet.push(questions[i]);wrong++;updateTop();}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();window.scrollTo({top:0,behavior:'smooth'});}
  else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length;
  const score=total?Math.round((correct/total)*100):0;
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push({...q,myAns:answers[idx]});});
  wrongSet=[...new Map(wrongSet.map(q=>[q.t,q])).values()];
  let grade,gc;
  if(score>=90){grade='🥇 Excellent';gc='var(--success)';}
  else if(score>=75){grade='🥈 Very Good';gc='var(--c4)';}
  else if(score>=60){grade='🥉 Good';gc='var(--warn)';}
  else{grade='📚 Keep Studying';gc='var(--danger)';}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const report=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}">
      <div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>
      ${!ok?`<div class="ri-row"><span class="ri-badge ri-yours">Your answer</span> ${answers[idx]>=0&&answers[idx]!==null?q.o[answers[idx]]:'Skipped'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">Correct</span> ${q.o[q.a]}</div>`:''}
    </div>`;
  }).join('');
  const skipped=answers.filter(a=>a===-1||a===null).length;
  document.getElementById('prog-bar').style.width='100%';
  document.getElementById('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle class="ring-bg" cx="55" cy="55" r="45"/>
          <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/>
        </svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">You answered ${answered} of ${total} questions</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">Correct</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">Wrong</div></div>
        <div class="rs"><div class="n" style="color:var(--c4)">${skipped}</div><div class="l">Skipped / Unanswered</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()"><i class="fa-solid fa-rotate-right"></i> Retry Mistakes (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="init(currentPool)"><i class="fa-solid fa-shuffle"></i> New Random Exam</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home"><i class="fa-solid fa-house"></i> Back to Subject</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 Detailed Report</div>
      ${report}
    </div>`;
  setTimeout(()=>{document.getElementById('ringFill').style.strokeDashoffset=offset;},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);i=0;correct=0;wrong=0;
  answers=new Array(questions.length).fill(null);
  wrongSet=[];answered=0;timeLeft=totalTime;
  startTimer();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=document.getElementById('themeBtn');
let theme='light';
try{theme=localStorage.getItem('theme')||'light';}catch(e){}
function applyTheme(t){
  theme=t;
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t);}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
init(QUESTIONS);
</script>
