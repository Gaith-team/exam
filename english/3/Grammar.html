<style>
:root{--bg:#f4f7fb;--card:#ffffff;--tx:#14213d;--mut:#64748b;--ac:#0f766e;--ac2:#14b8a6;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#e2e8f0}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--ac);color:#fff;font-weight:700;letter-spacing:.5px}
nav button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:22px;margin:6px 0 4px}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.topic{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:left;cursor:pointer;color:var(--tx);transition:transform .12s,border-color .12s}
.topic:hover{transform:translateY(-2px);border-color:var(--ac)}
.topic b{display:block;color:var(--ac);font-size:13px;text-transform:uppercase;letter-spacing:.6px}
.topic span{display:block;font-size:16px;font-weight:600;margin:2px 0}
.topic small{color:var(--mut)}
.topic.all{grid-column:1/-1;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.topic.all b,.topic.all small{color:#e6fffb}
.opts{display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:8px;gap:8px}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--ac);color:#fff}
.q{font-size:18px;font-weight:600;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.opt:disabled{cursor:default}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer;margin:6px 6px 0 0}
.btn.sec{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.res{text-align:center}
.ring{width:160px;height:160px;margin:6px auto}
.ring text{font-size:30px;font-weight:800;fill:var(--tx)}
.rev{text-align:left;margin-top:18px}
.rev div{border:1px solid var(--bd);border-left:4px solid var(--no);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px}
.rev em{color:var(--no);font-style:normal}.rev strong{color:var(--ok)}
</style>
</head>

const app=document.getElementById('app');

function start(qs){
  S={qs:doShuffle?shuf(qs):qs.slice(),i:0,score:0,wrong:[],t0:Date.now()};
  clearInterval(timer);timer=setInterval(()=>{const t=document.getElementById('tm');if(t)t.textContent=fmt(Math.floor((Date.now()-S.t0)/1000))},1000);
  show();
}
function show(){
  const q=S.qs[S.i];app.innerHTML='';
  const card=el('div','card');
  const top=el('div','top');const l=el('span',0,'Question '+(S.i+1)+' / '+S.qs.length);
  const bd=el('span','badge',isTF(q)?'True / False':'MCQ');const tm=el('span',0,fmt(Math.floor((Date.now()-S.t0)/1000)));tm.id='tm';
  top.append(l,bd,tm);
  const bar=el('div','bar');const bi=document.createElement('i');bi.style.width=(S.i/S.qs.length*100)+'%';bar.append(bi);
  card.append(top,bar,el('div','q',q.t));
  const btns=[];let nx;
  q.o.forEach((x,idx)=>{
    const b=el('button','opt',x);btns.push(b);
    b.onclick=()=>{
      btns.forEach(z=>z.disabled=true);btns[q.a].classList.add('ok');
      if(idx===q.a)S.score++;else{b.classList.add('no');S.wrong.push({q:q,pick:idx})}
      nx.style.display='inline-block';
    };
    card.append(b);
  });
  nx=el('button','btn',S.i===S.qs.length-1?'Finish':'Next');nx.style.display='none';
  nx.onclick=()=>{S.i++;S.i<S.qs.length?show():finish()};
  const quit=el('button','btn sec','Home');quit.onclick=home;
  card.append(nx,quit);app.append(card);
}
function finish(){
  clearInterval(timer);app.innerHTML='';
  const n=S.qs.length,p=Math.round(S.score/n*100),R=66,C=2*Math.PI*R;
  const card=el('div','card res');
  card.innerHTML='<svg class="ring" viewBox="0 0 160 160"><circle cx="80" cy="80" r="'+R+'" fill="none" stroke="var(--bd)" stroke-width="12"/><circle cx="80" cy="80" r="'+R+'" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+(C*p/100)+' '+C+'" transform="rotate(-90 80 80)"/><text x="80" y="90" text-anchor="middle">'+p+'%</text></svg>';
  card.append(el('h1',0,S.score+' / '+n+' correct'),el('p','sub','Time: '+fmt(Math.floor((Date.now()-S.t0)/1000))+' · Wrong: '+S.wrong.length));
  if(S.wrong.length){
    const r=el('button','btn','Retry wrong answers');r.onclick=()=>start(S.wrong.map(w=>w.q));card.append(r);
  }
  const h=el('button','btn sec','Home');h.onclick=home;card.append(h);
  if(S.wrong.length){
    const rev=el('div','rev');rev.append(el('h3',0,'Review wrong answers'));
    S.wrong.forEach(w=>{const d=el('div');d.append(el('div',0,w.q.t));
      const a=el('em',0,'Your answer: '+w.q.o[w.pick]);const b=el('strong',0,'Correct: '+w.q.o[w.q.a]);
      d.append(a,document.createElement('br'),b);rev.append(d)});
    card.append(rev);
  }
  app.append(card);
}
home();
</script>
</body>
</html>
