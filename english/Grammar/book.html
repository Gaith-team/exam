<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

<title>GHAITH TEAM</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--accent:#0d9488;--accent-rgb:13,148,136;--c2:#f97316;--c4:#0891b2;

--bg:#f4f7f8;--bg2:#e5ecee;--card:#fff;--text:#0f1b21;--text2:#44575f;--text3:#7b8d95;--bc:rgba(15,40,50,.12);

padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#0a1114;--bg2:#121c20;--card:#16232a;--text:#e8f1f3;--text2:#b2c4ca;--text3:#7f949c;--bc:rgba(255,255,255,.10);--accent:#2dd4bf;--accent-rgb:45,212,191;--c2:#fb923c;--success:#4ade80;--danger:#f87171;--c4:#22d3ee;color-scheme:dark}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;direction:ltr;text-align:left}
#prog-bar{position:fixed;top:0;left:0;height:4px;z-index:999;background:linear-gradient(90deg,var(--accent),var(--c2));transition:width .2s}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:64px;background:rgba(244,247,248,.95);backdrop-filter:blur(14px);border-bottom:2px solid var(--accent)}

.nav-brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:800;letter-spacing:.6px}
.nav-logo-icon{width:34px;height:34px;border-radius:var(--r);background:var(--c2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800}
.theme-btn{width:38px;height:38px;border-radius:var(--r);border:1px solid var(--bc);background:var(--card);cursor:pointer;font-size:15px}
.hero-band{margin-top:calc(64px + env(safe-area-inset-top,0px));background:var(--grad);padding:40px 24px 48px;position:relative;overflow:hidden}

.hero-inner{max-width:560px;margin:0 auto;position:relative;z-index:1}
.hero-band-icon{width:60px;height:60px;border-radius:var(--r);background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;border:1px solid rgba(255,255,255,.3)}
.hero-band h1{font-size:clamp(22px,4vw,30px);font-weight:800;color:#fff;margin-bottom:4px}
.hero-band p{font-size:13px;color:rgba(255,255,255,.85)}
.hero-band-meta{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.meta-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:var(--r);padding:6px 14px;font-size:12px;font-weight:700;color:#fff}
.shell{max-width:560px;margin:0 auto;padding:24px 20px 80px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--bc);border-left:4px solid var(--c4);border-radius:var(--r);padding:12px}

.stat-box .val{font-size:20px;font-weight:800}.stat-box .lbl{font-size:11px;color:var(--text3);margin-top:2px}
.stat-correct{color:var(--success)}.stat-wrong{color:var(--danger)}.stat-remain{color:var(--c4)}
.prog-strip{background:var(--card);border:1px solid var(--bc);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.prog-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.prog-track{flex:1;height:6px;background:var(--bg2);border-radius:6px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--c2));transition:width .4s}
.timer-badge{min-width:70px;height:36px;border-radius:var(--r);background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;padding:0 12px;font-variant-numeric:tabular-nums}
.timer-badge.warn{color:var(--warn);border-color:var(--warn)}
.timer-badge.danger{color:var(--danger);border-color:var(--danger);animation:pulse .8s infinite}

.menu h3{font-size:15px;font-weight:800;margin-bottom:12px;color:var(--text2)}
.topic{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:15px 16px;border-radius:var(--r);border:1.5px solid var(--bc);border-left:4px solid var(--accent);background:var(--card);color:var(--text);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:var(--tr)}
.topic:hover{border-color:var(--accent);transform:translateX(3px)}
.topic .tc{font-size:12px;color:var(--text3);white-space:nowrap}
.topic.all{border-left-color:var(--c2);background:linear-gradient(135deg,rgba(249,115,22,.12),transparent)}
.q-card{background:var(--card);border:1px solid var(--bc);border-top:4px solid var(--accent);border-radius:var(--r);box-shadow:0 8px 24px rgba(10,40,50,.08)}
.q-header{padding:12px 18px 0}
.q-num{display:inline-block;background:rgba(var(--accent-rgb),.12);color:var(--accent);border-radius:4px;padding:3px 10px;font-size:11px;font-weight:700;text-transform:uppercase}
.q-text{padding:14px 18px;font-size:16px;font-weight:700;line-height:1.6;border-bottom:1px solid var(--bc)}
.options{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--r);border:1.5px solid var(--bc);background:var(--bg);cursor:pointer;font-size:14px;font-weight:600;transition:var(--tr);user-select:none}
.opt:hover:not(.disabled){border-color:var(--accent);background:rgba(var(--accent-rgb),.08);transform:translateX(3px)}
.opt-letter{width:28px;height:28px;border-radius:var(--r);flex-shrink:0;background:var(--bg2);border:1px solid var(--bc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text2)}
.opt.correct{border-color:var(--success);background:rgba(22,163,74,.1)}
.opt.correct .opt-letter{background:var(--success);color:#fff;border-color:var(--success)}
.opt.wrong{border-color:var(--danger);background:rgba(220,38,38,.08)}
.opt.wrong .opt-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt.disabled{pointer-events:none}
.feedback-bar{margin:0 18px 14px;padding:12px 16px;border-radius:var(--r);display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.feedback-bar.ok{background:rgba(22,163,74,.1);color:var(--success);border:1px solid rgba(22,163,74,.3)}
.feedback-bar.no{background:rgba(220,38,38,.08);color:var(--danger);border:1px solid rgba(220,38,38,.25)}
.nav-btns{padding:4px 18px 18px;display:flex;gap:10px}
.btn{flex:1;padding:13px;border:none;border-radius:var(--r);font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:var(--tr);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:focus-visible,.opt:focus-visible,.topic:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.btn-next{background:var(--grad-soft);color:#fff}
.btn-skip{background:var(--bg2);color:var(--text2);border:1px solid var(--bc);flex:0 0 auto;padding:13px 18px}
.result-hero{text-align:center;padding:36px 20px 28px;background:var(--card);border-radius:var(--r);border:1px solid var(--bc);border-top:4px solid var(--c2);margin-bottom:20px}
.score-ring{width:110px;height:110px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative}
.score-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.score-ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring-bg{stroke:var(--bg2)}.ring-fill{transition:stroke-dashoffset 1s ease}
.score-num{font-size:28px;font-weight:800;line-height:1}.score-pct{font-size:12px;color:var(--text3)}
.result-grade{font-size:22px;font-weight:800;margin-bottom:6px}.result-sub{font-size:14px;color:var(--text2)}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rs{background:var(--bg2);border-radius:var(--r);padding:12px 8px;text-align:center}
.rs .n{font-size:20px;font-weight:800}.rs .l{font-size:11px;color:var(--text3)}
.report-item{background:var(--card);border:1px solid var(--bc);border-left:4px solid var(--bc);border-radius:var(--r);padding:16px;margin-bottom:10px}
.report-item.ok{border-left-color:var(--success)}.report-item.no{border-left-color:var(--danger)}
.ri-q{font-size:13px;font-weight:700;margin-bottom:8px}
.ri-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:5px;color:var(--text2)}
.ri-badge{padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px;flex-shrink:0}
.ri-yours{background:rgba(220,38,38,.12);color:var(--danger)}.ri-right{background:rgba(22,163,74,.12);color:var(--success)}
.result-actions{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.btn-retry{background:linear-gradient(135deg,#f97316,#ea580c);color:#fff}
.btn-home{background:var(--bg2);color:var(--text);border:1px solid var(--bc)}
footer{background:var(--bg2);border-top:1px solid var(--bc);padding:22px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.footer-brand{font-size:14px;font-weight:700}.footer-brand span{color:var(--c2)}
.footer-tg{text-decoration:none;color:#229ED9;font-size:12px;font-weight:600}
@media(max-width:480px){nav{padding:0 14px}.shell{padding:16px 14px 60px}.nav-brand span{display:none}.hero-band{padding:30px 16px 36px}}
</style>
</head>

let questions=[],i=0,correct,wrong,answers,wrongSet,answered,cur=-1;
let totalTime=40*60,timeLeft,timerInterval;
const LETTERS=['A','B','C','D','E','F'];
const $=id=>document.getElementById(id);
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function shuffleOptions(q){const idx=shuffle(q.o.map((_,k)=>k));return {...q,o:idx.map(k=>q.o[k]),a:idx.indexOf(q.a)};}
const allQ=()=>S.flatMap(s=>s.q);

function menu(){
  clearInterval(timerInterval);cur=-1;
  $('hud').style.display='none';
  $('prog-bar').style.width='0%';
  $('topicName').textContent='Choose a chapter or take the comprehensive exam';
  $('totalBadge').textContent=allQ().length+' Questions in total';
  $('timeBadge').textContent='Timed';
  $('app').innerHTML='<div class="menu"><h3>📚 Choose a topic</h3>'+
    S.map((s,k)=>`<button class="topic" onclick="start(${k})"><span>${s.n}</span><span class="tc">${s.q.length} Qs</span></button>`).join('')+
    `<button class="topic all" onclick="start(-1)"><span>🏆 Comprehensive – All Chapters</span><span class="tc">${allQ().length} Qs</span></button></div>`;
  window.scrollTo({top:0});
}
function start(k){
  cur=k;
  const pool=k<0?allQ():S[k].q;
  totalTime=Math.max(5,Math.ceil(pool.length*0.5))*60;
  $('topicName').textContent=k<0?'Comprehensive – All Chapters':S[k].n;
  $('hud').style.display='block';
  questions=shuffle([...pool]).map(shuffleOptions);
  i=0;correct=0;wrong=0;answered=0;wrongSet=[];
  answers=new Array(questions.length).fill(null);
  timeLeft=totalTime;
  $('totalBadge').textContent=questions.length+' Questions';
  $('timeBadge').textContent=(totalTime/60)+' Min';
  startTimer();render();
  window.scrollTo({top:0});
}
function startTimer(){
  clearInterval(timerInterval);
  $('timerBadge').className='timer-badge';
  const show=()=>{const m=Math.floor(timeLeft/60),s=timeLeft%60;$('timerTxt').textContent=`${m}:${s<10?'0':''}${s}`;};
  show();
  timerInterval=setInterval(()=>{
    timeLeft--;show();
    const b=$('timerBadge');
    if(timeLeft<=120)b.className='timer-badge danger';else if(timeLeft<=300)b.className='timer-badge warn';
    if(timeLeft<=0){clearInterval(timerInterval);finish();}
  },1000);
}
function updateTop(){
  const total=questions.length||1;
  $('sCorrect').textContent=correct;$('sWrong').textContent=wrong;
  $('sRemain').textContent=Math.round(((total-answered)/total)*100)+'%';
  $('progLabel').textContent='Question '+(i+1)+' / '+total;
  $('progFill').style.width=((i+1)/total*100)+'%';
  $('prog-bar').style.width=((i+1)/total*100)+'%';
}
const SYSTEMS=[
  {icon:'🔬',l:['#0d9488','13,148,136'],d:['#2dd4bf','45,212,191']},
  {icon:'📊',l:['#0891b2','8,145,178'],d:['#22d3ee','34,211,238']},
  {icon:'📝',l:['#ea580c','234,88,12'],d:['#fb923c','251,146,60']},
  {icon:'📚',l:['#4f46e5','79,70,229'],d:['#818cf8','129,140,248']}
];
function applyPalette(){
  const s=SYSTEMS[(i||0)%SYSTEMS.length];
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const r=document.documentElement.style,c=dark?s.d:s.l;
  r.setProperty('--accent',c[0]);r.setProperty('--accent-rgb',c[1]);
  r.setProperty('--grad-soft',`linear-gradient(135deg,${s.l[0]},#0f172a)`);
  const ic=document.querySelector('.hero-band-icon');if(ic)ic.textContent=s.icon;
}
function render(){
  applyPalette();updateTop();
  const q=questions[i];if(!q)return;
  $('app').innerHTML=`
    <div class="q-card">
      <div class="q-header"><div class="q-num">Question ${i+1} / ${questions.length}</div></div>
      <div class="q-text">${q.t}</div>
      <div class="options">
        ${q.o.map((o,idx)=>`<div class="opt" id="opt${idx}" onclick="choose(${idx})"><div class="opt-letter">${LETTERS[idx]||idx+1}</div>${o}</div>`).join('')}
      </div>
      <div class="nav-btns"><button class="btn btn-skip" onclick="skip()">Skip ⏭</button></div>
    </div>`;
}
function choose(v){
  if(answers[i]!==null)return;
  answers[i]=v;answered++;
  const q=questions[i],ok=v===q.a;
  ok?correct++:wrong++;
  updateTop();
  q.o.forEach((_,idx)=>{
    const el=$('opt'+idx);el.classList.add('disabled');
    if(idx===q.a)el.classList.add('correct');else if(idx===v)el.classList.add('wrong');
  });
  const fb=document.createElement('div');
  fb.className='feedback-bar '+(ok?'ok':'no');
  fb.innerHTML=ok?'<span>🎉</span><span>Excellent! Well done.</span>':'<span>😔</span><span>Not quite — stay focused!</span>';
  const card=document.querySelector('.q-card');
  card.querySelector('.options').after(fb);
  card.querySelector('.nav-btns').innerHTML=`<button class="btn btn-next" onclick="next()">${i<questions.length-1?'Next Question →':'🏁 Finish Exam'}</button>`;
}
function skip(){
  if(answers[i]===null){answers[i]=-1;answered++;wrong++;updateTop();}
  next();
}
function next(){
  if(i<questions.length-1){i++;render();}
  else finish();
}
function finish(){
  clearInterval(timerInterval);
  const total=questions.length,score=total?Math.round((correct/total)*100):0;
  wrongSet=[];
  questions.forEach((q,idx)=>{if(answers[idx]!==q.a)wrongSet.push(q);});
  let grade,gc;
  if(score>=90){grade='🥇 Excellent';gc='var(--success)';}
  else if(score>=75){grade='🥈 Very Good';gc='var(--c4)';}
  else if(score>=60){grade='🥉 Good';gc='var(--warn)';}
  else{grade='📚 Keep Studying';gc='var(--danger)';}
  const circ=2*Math.PI*45,offset=circ-(score/100)*circ;
  const report=questions.map((q,idx)=>{
    const ok=answers[idx]===q.a;
    return `<div class="report-item ${ok?'ok':'no'}">
      <div class="ri-q">${ok?'✅':'❌'} ${q.t}</div>
      ${!ok?`<div class="ri-row"><span class="ri-badge ri-yours">Your answer</span> ${answers[idx]>=0&&answers[idx]!==null?q.o[answers[idx]]:'Skipped'}</div>
      <div class="ri-row"><span class="ri-badge ri-right">Correct</span> ${q.o[q.a]}</div>`:''}
    </div>`;
  }).join('');
  const skipped=answers.filter(a=>a===-1||a===null).length;
  $('prog-bar').style.width='100%';
  $('app').innerHTML=`
    <div class="result-hero">
      <div class="score-ring">
        <svg viewBox="0 0 110 110"><circle class="ring-bg" cx="55" cy="55" r="45"/>
        <circle class="ring-fill" cx="55" cy="55" r="45" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" style="stroke:${gc}" id="ringFill"/></svg>
        <div class="score-num">${score}</div><div class="score-pct">%</div>
      </div>
      <div class="result-grade" style="color:${gc}">${grade}</div>
      <div class="result-sub">You answered ${answered} of ${total} questions</div>
      <div class="result-stats">
        <div class="rs"><div class="n" style="color:var(--success)">${correct}</div><div class="l">Correct</div></div>
        <div class="rs"><div class="n" style="color:var(--danger)">${wrong}</div><div class="l">Wrong</div></div>
        <div class="rs"><div class="n" style="color:var(--c4)">${skipped}</div><div class="l">Skipped / Unanswered</div></div>
      </div>
    </div>
    <div class="result-actions">
      ${wrongSet.length?`<button class="btn btn-retry" onclick="retryWrong()">🔁 Retry Mistakes (${wrongSet.length})</button>`:''}
      <button class="btn btn-home" onclick="start(cur)">🔀 New Random Exam</button>
      <button class="btn btn-home" onclick="menu()">📚 Change Topic</button>
      <a href="https://gaith-team.github.io/exam/" class="btn btn-home">🏠 Back to Subject</a>
    </div>
    <div style="margin-top:28px">
      <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text2)">📋 Detailed Report</div>${report}
    </div>`;
  setTimeout(()=>{const r=$('ringFill');if(r)r.style.strokeDashoffset=offset;},100);
  window.scrollTo({top:0,behavior:'smooth'});
}
function retryWrong(){
  questions=shuffle([...wrongSet]).map(shuffleOptions);
  i=0;correct=0;wrong=0;answered=0;wrongSet=[];
  answers=new Array(questions.length).fill(null);
  timeLeft=totalTime;startTimer();render();
  window.scrollTo({top:0,behavior:'smooth'});
}
const themeBtn=$('themeBtn');
let theme=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
try{theme=localStorage.getItem('theme')||theme;}catch(e){}
function applyTheme(t){
  theme=t;
  document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');
  themeBtn.textContent=t==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',t);}catch(e){}
  applyPalette();
}
applyTheme(theme);
themeBtn.addEventListener('click',()=>applyTheme(theme==='dark'?'light':'dark'));
menu();
</script>
</body>
